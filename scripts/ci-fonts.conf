<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- CI font parity for the UI gates. The GitHub ubuntu-latest runner (Ubuntu
     24.04) renders with the stock Ubuntu fontconfig rules plus the fonts that
     the Playwright chromium deps install; WSL on a Windows host additionally
     borrows every Windows font through /etc/fonts/local.conf. Run any browser
     suite, the render sweep or the raster audit with this file to see what CI
     sees:
       FONTCONFIG_FILE="$PWD/scripts/ci-fonts.conf" node scripts/ui-render-audit.mjs (add the sweep flag as needed)
       FONTCONFIG_FILE="$PWD/scripts/ci-fonts.conf" node scripts/options-help-render-audit.mjs
       FONTCONFIG_FILE="$PWD/scripts/ci-fonts.conf" node .qa-scan/run-test.mjs tests/<suite>.html
     fontconfig wants an ABSOLUTE path (a relative one is looked up under
     /etc/fonts, fails, and silently falls back to the default config) and
     this comment must never contain a double hyphen (XML forbids it inside
     comments; the file then fails to parse and is silently ignored too).
     Sanity check that it loaded: with the same variable, fc-match must resolve
     "Microsoft YaHei" to DejaVu Sans (not msyh.ttc) and Arial to Liberation
     Sans; the two audit scripts check the first one themselves.

     How it works: it keeps the HOST's own rule set (the conf.d include below:
     hintslight, rgb subpixel, the metric aliases, the WenQuanYi hintnone rule)
     and whitelists the font files CI actually has, rejecting everything else
     (Windows fonts, Noto CJK and any other package the runner lacks). On an
     Ubuntu 24.04 host with those packages installed, the raster audit's
     output under this file was byte-identical to the real CI log (2026-09-28:
     all 7 violation values and all 13 DPR-2 range lines, CJK buckets
     included), so it depends on the host conf.d being Ubuntu's; on another
     distro the rule set differs and parity is not guaranteed. Needed
     packages: fonts-dejavu-core, fonts-liberation, fonts-wqy-zenhei,
     fonts-ipafont-gothic, fonts-freefont-ttf, fonts-tlwg-loma-otf,
     fonts-unifont, fonts-noto-color-emoji. A missing one silently degrades
     parity, so fc-list with this variable should list all of them.

     Why the previous version (which aliased Segoe UI, Helvetica Neue,
     PingFang SC, Microsoft YaHei and the generics to DejaVu) was wrong: on
     CI every named family in the body stack is missing, Chrome rejects the
     unrelated fontconfig substitute and lands on the generic sans-serif,
     which Ubuntu's metric aliases resolve through Arial to LIBERATION SANS.
     Latin text on CI is Liberation Sans, not DejaVu Sans. The aliases made
     DejaVu the preferred match for those names, so Chrome accepted it, and
     without the conf.d include fontconfig fell back to full hinting and no
     subpixel order instead of Ubuntu's hintslight plus rgb. Together that
     put Latin ink 0.5 to 1.5 device px away from CI depending on the string,
     which is why calibrations that passed locally kept failing on CI.
     Per-user config: the conf.d include also brings in 50-user.conf, which
     reads the developer's own $XDG_CONFIG_HOME/fontconfig (fonts.conf and
     conf.d; default ~/.config/fontconfig) plus the legacy ~/.fonts.conf and
     ~/.fonts.conf.d. A personal hintstyle, subpixel order or family
     preference there would silently change what the emulation renders; a
     global target=font assign even overrides per-font conf.d rules CI keeps,
     such as 25-wqy-zenhei.conf (hintnone, rgba none for WenQuanYi). So
     scripts/options-help-render-audit.mjs launches Chromium, and runs its
     fc-match probe, with XDG_CONFIG_HOME pointed at an empty temp dir, and
     refuses to run while a legacy per-user file exists. Pinning hinting in
     this file after the include was rejected for the same per-font reason.
     Other consumers (the render sweep, test pages, a bare fc-match) do not
     isolate by themselves: prefix them with XDG_CONFIG_HOME="$(mktemp -d)".
     What stays host-dependent: the host conf.d itself (Ubuntu 24.04 above)
     and 51-local.conf, which includes /etc/fonts/local.conf; on WSL that
     file only adds the Windows font dir, which the whitelist below rejects,
     but a local.conf that edits rendering would still leak in.
     The real fix for anything this file flags is still a px pin (height /
     min-height / line-height) or a baseline anchor, never a font-specific
     number. -->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <!-- Globs must be absolute: fontconfig resolves a relative glob against
       the working directory. The filter also applies to subdirectories
       found while scanning, so each whitelisted directory is accepted
       along with its files. -->
  <selectfont>
    <rejectfont>
      <glob>/*</glob>
    </rejectfont>
    <acceptfont>
      <glob>/usr/share/fonts/truetype</glob>
      <glob>/usr/share/fonts/opentype</glob>
      <glob>/usr/share/fonts/truetype/dejavu*</glob>
      <glob>/usr/share/fonts/truetype/liberation*</glob>
      <glob>/usr/share/fonts/truetype/wqy*</glob>
      <glob>/usr/share/fonts/opentype/ipafont-gothic*</glob>
      <glob>/usr/share/fonts/truetype/fonts-japanese-gothic.ttf</glob>
      <glob>/usr/share/fonts/truetype/freefont*</glob>
      <glob>/usr/share/fonts/opentype/tlwg</glob>
      <glob>/usr/share/fonts/opentype/tlwg/Loma*</glob>
      <glob>/usr/share/fonts/opentype/unifont*</glob>
      <glob>/usr/share/fonts/truetype/noto</glob>
      <glob>/usr/share/fonts/truetype/noto/NotoColorEmoji.ttf</glob>
    </acceptfont>
  </selectfont>
  <include ignore_missing="yes">/etc/fonts/conf.d</include>
  <cachedir>~/.cache/pbp-ci-fonts</cachedir>
</fontconfig>
