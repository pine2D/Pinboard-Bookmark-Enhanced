name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run still going for the older one.
# Runs on main are never cancelled, so every main commit gets a finished result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: verify (${{ matrix.group }})
    runs-on: ubuntu-24.04   # Playwright 1.59 cannot install Chromium deps on ubuntu-latest (26.04)
    strategy:
      fail-fast: false
      matrix:
        group: [static, pages, render, journeys]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .qa-scan/package-lock.json

      - name: Fetch latest approved store tag (journeys)
        if: matrix.group == 'journeys'
        run: |
          TAG="$(node tests/upgrade-path-tests.mjs --print-tag)"
          git fetch --depth 1 --no-tags origin tag "$TAG"

      - name: Install QA dependencies
        run: npm ci --prefix .qa-scan

      - name: Install bundled Chromium
        run: npx --prefix .qa-scan playwright install --with-deps chromium

      - name: Verify source and tests (${{ matrix.group }})
        run: xvfb-run -a sh scripts/verify.sh --group="$VERIFY_GROUP"
        env:
          VERIFY_GROUP: ${{ matrix.group }}
          PBP_QA_REPORT_DIR: ${{ runner.temp }}/pbp-qa-report
          PBP_RETRY_FLAKY: '1'

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pbp-qa-report-${{ matrix.group }}
          path: ${{ runner.temp }}/pbp-qa-report
          retention-days: 14
          overwrite: true
          if-no-files-found: ignore

  release-zip:
    name: Build and smoke-test release ZIP
    runs-on: ubuntu-24.04   # Playwright 1.59 cannot install Chromium deps on ubuntu-latest (26.04)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .qa-scan/package-lock.json

      - name: Install QA dependencies
        run: npm ci --prefix .qa-scan

      - name: Install bundled Chromium
        run: npx --prefix .qa-scan playwright install --with-deps chromium

      - name: Build and smoke-test release ZIP
        run: xvfb-run -a bash scripts/release.sh --build-only
