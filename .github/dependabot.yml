# Only GitHub Actions get update PRs (user ruling 2026-11-11, .claude/decisions.md).
# No npm entry: a Playwright bump moves Chromium and the render baselines; the weekly sentinel reports .qa-scan updates instead.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
