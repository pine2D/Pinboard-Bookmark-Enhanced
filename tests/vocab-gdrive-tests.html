<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Vocabulary Google Drive Tests</title>
<style>
body { font-family: monospace; padding: 16px; max-width: 1000px; }
.case { padding: 6px; border-bottom: 1px solid #eee; white-space: pre-wrap; }
.pass { color: #0a0; } .fail { color: #c00; font-weight: bold; }
</style></head><body>
<h1>Vocabulary Google Drive Tests</h1><div id="summary"></div><div id="results"></div>
<script src="../vocab-store.js"></script>
<script src="../vocab-gdrive.js"></script>
<script>
const root = document.getElementById("results");
const TEST_MAX_BYTES = 4 * 1024 * 1024;
const OWNER_HASH = "a".repeat(64);
const OTHER_OWNER_HASH = "b".repeat(64);
const DEVICE_ID = "device-a";
const DRIVE_FILE_ID = "file:opaque+id";
// Drive resolves the create-time "appDataFolder" alias to a real folder ID, so
// every fixture standing in for a SERVER RESPONSE carries this instead. Remote
// fixtures must never be a verbatim echo of the write-side constructor.
const APPDATA_PARENT_ID = "opaque-appdata-folder-id";
const OWNER_SCOPE = "acct_pin-a";
const ENVELOPE = { ownerHash: OWNER_HASH, deviceId: DEVICE_ID, createdAt: 123 };
let pass = 0, fail = 0;
function check(name, cond, detail) {
  const ok = !!cond; ok ? pass++ : fail++;
  const row = document.createElement("div");
  row.className = "case " + (ok ? "pass" : "fail");
  row.textContent = `${ok ? "✓" : "✗"} ${name}${ok ? "" : "\n   " + (detail || "")}`;
  root.appendChild(row);
}
function attempt(fn) { try { return fn(); } catch (_) { return false; } }
function throws(fn) { try { fn(); return false; } catch (_) { return true; } }
function bytes(value) { return new TextEncoder().encode(value).length; }
function live(term = "Word", language = "en", patch = {}, deviceId = DEVICE_ID) {
  const recordKey = pbpDictPrimaryLang(language) + "|" + pbpDictNormalizeTerm(term).toLowerCase();
  return {
    recordKey, vector: { [deviceId]: 1 }, dot: { deviceId, counter: 1 }, deleted: false,
    value: {
      term, lemma: term.toLowerCase(), language, gloss: "gloss", ipa: null,
      sourceUrl: "https://example.test/word", license: "CC0", contexts: [], groups: [],
      note: "", status: "new", createdAt: 10, updatedAt: 20, ...patch
    }
  };
}
function tombstone(term = "Gone") {
  const entry = live(term);
  return { recordKey: entry.recordKey, vector: entry.vector, dot: entry.dot, deleted: true };
}
function bodyObject(entries, envelope = ENVELOPE) {
  return {
    schema: 1, ownerHash: envelope.ownerHash, deviceId: envelope.deviceId,
    createdAt: envelope.createdAt, entries
  };
}
function bodyString(entries, envelope = ENVELOPE) {
  return JSON.stringify(bodyObject(entries, envelope));
}
function sizedEntry(targetBodyBytes, term) {
  const entry = live(term);
  const padding = targetBodyBytes - bytes(bodyString([entry]));
  if (padding < 0) throw new Error("target body is too small");
  entry.value.note = "x".repeat(padding);
  return entry;
}
function metadata(ownerHash = OWNER_HASH, deviceId = DEVICE_ID) {
  return pbpVocabDriveMetadata(DRIVE_FILE_ID, ownerHash, deviceId);
}
function splitBodiesValidate(result, envelope = ENVELOPE) {
  return result.ok && result.batches.every((batch) =>
    pbpVocabValidateDriveBatch(metadata(envelope.ownerHash, envelope.deviceId), batch.body, envelope.ownerHash));
}
async function asyncCheck(name, fn) {
  // The Drive identity cache is module-level and most cases share "token-a";
  // every case starts cold so one case's about.get cannot answer another's.
  try {
    pbpVocabDriveForgetIdentity();
    check(name, await fn());
  } catch (error) { check(name, false, error && error.message); }
}
function identityFixture(tokens = ["token-a"]) {
  let index = 0;
  const calls = [];
  const removed = [];
  return {
    calls,
    removed,
    async getAuthToken(options) {
      calls.push({ ...options });
      const value = tokens[Math.min(index++, tokens.length - 1)];
      if (value instanceof Error) throw value;
      return { token: value };
    },
    async removeCachedAuthToken(details) { removed.push(details.token); }
  };
}
function jsonResponse(value, status = 200, headers) {
  return new Response(JSON.stringify(value), {
    status,
    headers: { "Content-Type": "application/json", ...headers }
  });
}
function readerResponse(chunks, onCancel, headers = {}) {
  let index = 0;
  return {
    ok: true,
    status: 200,
    headers: new Headers(headers),
    body: {
      getReader() {
        return {
          async read() {
            return index < chunks.length
              ? { done: false, value: chunks[index++] }
              : { done: true, value: undefined };
          },
          async cancel() { if (onCancel) onCancel(); }
        };
      }
    }
  };
}
function driveFile(fileId, term = fileId, deviceId = "device-b") {
  const meta = {
    id: fileId, name: `pbp-vocab-${fileId}.json`, parents: [APPDATA_PARENT_ID],
    mimeType: "application/json",
    appProperties: { pbpKind: "vocab-batch", schema: "1", owner: OWNER_HASH, device: deviceId }
  };
  return { meta, body: bodyString([live(term, "en", {}, deviceId)], { ...ENVELOPE, deviceId }) };
}
function syncHarness(options = {}) {
  const calls = [];
  const ownerArgs = [];
  const hashInputs = [];
  const files = new Map((options.files || []).map((file) => [file.meta.id, file]));
  const filePages = [...(options.filePages || [{ files: [], nextPageToken: null }])];
  const changePages = [...(options.changePages || [{
    changes: [], nextPageToken: null, newStartPageToken: "stable-new"
  }])];
  const aboutResults = [...(options.aboutResults || [])];
  const seedResults = [...(options.seedResults || [0])];
  const pending = [...(options.pending || [])];
  const outbox = [...(options.outbox || [])];
  let accountState = options.accountState ? { ...options.accountState } : null;
  let preflightState = options.preflightState ? { ...options.preflightState } : null;
  // The orchestrator's shared per-owner connection record. `null` opts a
  // case out of the record entirely; omitted means an empty in-memory one.
  let connectionState = options.connectionState ? { ...options.connectionState } : null;
  const connectionReads = [];
  const connection = options.connection !== undefined ? options.connection : {
    async get(hash) {
      connectionReads.push(hash);
      return connectionState && { ...connectionState };
    },
    async put(hash, value) {
      calls.push(`conn-put:${value === null ? "null" : `${value.lastError}:${value.blocked}`}`);
      if (hash !== OWNER_HASH) return false;
      connectionState = value === null ? null : { ...value };
      return true;
    }
  };
  // `||` would swallow "" -- the signed-out case this harness must be able
  // to express.
  let authAccount = options.authAccount === undefined ? "pin-a" : options.authAccount;
  let authEpoch = 1;
  const auth = () => ({ account: authAccount, epoch: authEpoch, token: "pin-token" });
  const store = {
    async getMeta() {
      if (options.afterGetMeta) options.afterGetMeta();
      return options.meta || { deviceId: DEVICE_ID, counter: 1 };
    },
    async getPreflightState() {
      calls.push("get-preflight");
      if (options.afterGetPreflight) options.afterGetPreflight({
        setAccount(value) { authAccount = value; authEpoch++; }
      });
      return preflightState && { ...preflightState };
    },
    async putPreflightState(value) {
      calls.push(`put-preflight:${value.lastError || ""}:${value.blocked === true}`);
      preflightState = { ...value };
      return true;
    },
    async deletePreflightState() {
      calls.push("delete-preflight");
      preflightState = null;
      return true;
    },
    async getAccountState() {
      calls.push("get-account");
      if (options.afterGetAccount) options.afterGetAccount({
        setAccount(value) { authAccount = value; authEpoch++; }
      });
      return accountState && { ...accountState };
    },
    async putAccountState(state) {
      calls.push(`put:${state.pageToken || ""}:${state.bootstrapComplete === true}`);
      if (options.failPutAccount) return false;
      accountState = { ...state };
      return true;
    },
    async seedLegacy(owner, limit) {
      ownerArgs.push(owner);
      calls.push(`seed:${limit}`);
      const next = seedResults.shift();
      if (next instanceof Error) throw next;
      return { ok: true, processed: next ?? 0 };
    },
    async applyRemotePage(owner, _ownerHash, batches, cursorCommit) {
      ownerArgs.push(owner);
      calls.push(`apply:${batches.length}:${cursorCommit?.pageToken || cursorCommit?.bootstrapFilePageToken || cursorCommit?.bootstrapChangePageToken || ""}`);
      // The real store returns this code and no other for a rejected page.
      if (options.failApply) return { ok: false, error: "invalid_remote_page", batchIndex: 0 };
      if (cursorCommit) accountState = { ...cursorCommit };
      return { ok: true, applied: batches.length, merged: 0, ignored: 0 };
    },
    async checkpointOwner(owner) { ownerArgs.push(owner); calls.push("checkpoint"); return 1; },
    async listPendingBatches() { return pending.map((row) => ({ ...row })); },
    async deletePendingBatch(_permissionId, _ownerHash, fileId) {
      calls.push(`delete-pending:${fileId}`);
      const index = pending.findIndex((row) => row.driveFileId === fileId);
      if (index >= 0) pending.splice(index, 1);
      return true;
    },
    async listOutbox(owner) {
      ownerArgs.push(owner);
      return outbox.map((row) => ({ ...row }));
    },
    async freezeOutbox(owner, permissionId, ownerHash, fileId, envelope) {
      ownerArgs.push(owner);
      calls.push(`freeze:${fileId}`);
      const parsed = JSON.parse(envelope.body);
      for (const entry of parsed.entries) {
        const index = outbox.findIndex((row) =>
          row.owner === owner && row.recordKey === entry.recordKey &&
          pbpVocabEventContentEqual(row.event, entry));
        if (index >= 0) outbox.splice(index, 1);
      }
      const row = {
        drivePermissionId: permissionId, ownerHash, driveFileId: fileId,
        body: envelope.body, createdAt: 1
      };
      pending.push(row);
      if (options.afterFreeze) options.afterFreeze({ outbox, row });
      return row;
    }
  };
  const client = {
    async openSession(interactive = false) {
      calls.push(`open-session:${interactive}`);
      const opened = interactive ? await client.connect() : await client.about();
      if (!opened.ok) return opened;
      return Object.assign({
        ...opened,
        about: client.about,
        getStartPageToken: client.getStartPageToken,
        listFiles: client.listFiles,
        listChanges: client.listChanges,
        download: client.download,
        generateId: client.generateId,
        upload: client.upload
      }, options.sessionOverrides || {});
    },
    async connect() { calls.push("connect"); return client.about(); },
    async about() {
      calls.push("about");
      if (options.afterAbout) options.afterAbout({
        setAccount(value) { authAccount = value; authEpoch++; }
      });
      return aboutResults.shift() ||
        { ok: true, permissionId: "perm-a", emailAddress: "a@example.test", displayName: "A" };
    },
    async getStartPageToken() { calls.push("start"); return { ok: true, pageToken: "start-T" }; },
    async listFiles(_ownerHash, pageToken) {
      calls.push(`files:${pageToken || ""}`);
      const page = filePages.shift();
      return page
        ? (page.ok === undefined ? { ok: true, ...page } : page)
        : { ok: false, error: "remote", retryable: false };
    },
    async listChanges(pageToken) {
      calls.push(`changes:${pageToken}`);
      const page = changePages.shift();
      return page
        ? (page.ok === undefined ? { ok: true, ...page } : page)
        : { ok: false, error: "remote", retryable: false };
    },
    async download(fileId) {
      calls.push(`download:${fileId}`);
      if (options.afterDownload) options.afterDownload({
        setAccount(value) { authAccount = value; authEpoch++; }
      });
      const file = files.get(fileId);
      return file ? { ok: true, body: file.body } : { ok: false, error: "remote", retryable: false };
    },
    async generateId() {
      const fileId = options.generatedId || "generated-batch";
      calls.push(`generate:${fileId}`);
      return { ok: true, fileId };
    },
    async upload(meta, body) {
      calls.push(`upload:${meta.id}:${body}`);
      return options.uploadResult || { ok: true, fileId: meta.id };
    }
  };
  const runner = () => pbpCreateVocabDriveSyncRunner({
    ...(options.protocol ? { protocol: options.protocol } : {}),
    ...(options.isEnabled ? { isEnabled: options.isEnabled } : {}),
    ...(options.getCurrentPermissionId ? { getCurrentPermissionId: options.getCurrentPermissionId } : {}),
    ...(options.getScopeEpoch ? { getScopeEpoch: options.getScopeEpoch } : {}),
    client,
    store,
    connection,
    getCurrentPinboardAuth: async () => auth(),
    pinboardAuthIsCurrent: (captured) =>
      captured.account === authAccount && captured.epoch === authEpoch,
    hashOwner: async (value) => { hashInputs.push(value); return OWNER_HASH; },
    now: options.now || (() => 1_000_000),
    random: options.random || (() => 0.5)
  });
  return {
    calls, client, store, outbox, pending, ownerArgs, hashInputs, connectionReads, runner,
    state: () => accountState && { ...accountState },
    preflight: () => preflightState && { ...preflightState },
    connection: () => connectionState && { ...connectionState },
    setAccount(value) { authAccount = value; authEpoch++; }
  };
}

(async () => {
  let ownerHash = null;
  try { ownerHash = await pbpVocabOwnerHash("abc"); } catch (_) {}
  check("SHA-256 owner hash", ownerHash === "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad");
  check("owner hash is 64 lowercase hex", attempt(() => /^[0-9a-f]{64}$/.test(ownerHash) && ownerHash.length === 64));

  check("metadata fixes Drive batch fields", attempt(() => {
    const meta = metadata();
    const entry = live();
    const body = bodyString([entry]);
    const exact = JSON.stringify(meta) === JSON.stringify({
      id: DRIVE_FILE_ID, name: `pbp-vocab-${DRIVE_FILE_ID}.json`,
      parents: ["appDataFolder"], mimeType: "application/json",
      appProperties: { pbpKind: "vocab-batch", schema: "1", owner: OWNER_HASH, device: DEVICE_ID }
    });
    const missingId = { ...meta };
    delete missingId.id;
    const wrongKind = { ...meta, appProperties: { ...meta.appProperties, pbpKind: "other" } };
    const wrongSchema = { ...meta, appProperties: { ...meta.appProperties, schema: "2" } };
    return exact && pbpVocabValidateDriveBatch(meta, body, OWNER_HASH) &&
      !pbpVocabValidateDriveBatch(missingId, body, OWNER_HASH) &&
      !pbpVocabValidateDriveBatch({ ...meta, id: "other:id" }, body, OWNER_HASH) &&
      !pbpVocabValidateDriveBatch({ ...meta, name: "pbp-vocab-other.json" }, body, OWNER_HASH) &&
      !pbpVocabValidateDriveBatch({ ...meta, mimeType: "text/plain" }, body, OWNER_HASH) &&
      !pbpVocabValidateDriveBatch(wrongKind, body, OWNER_HASH) &&
      !pbpVocabValidateDriveBatch(wrongSchema, body, OWNER_HASH) &&
      !pbpVocabValidateDriveBatch({ ...meta, modifiedTime: "unexpected" }, body, OWNER_HASH) &&
      !pbpVocabValidateDriveBatch({ ...meta, parents: [] }, body, OWNER_HASH);
  }));

  check("Drive response accepts resolved appData parent ID", attempt(() => {
    const meta = metadata();
    const remote = { ...meta, parents: [APPDATA_PARENT_ID] };
    const body = bodyString([live()]);
    return pbpVocabValidateDriveBatch(remote, body, OWNER_HASH) &&
      !pbpVocabValidateDriveBatch({ ...remote, parents: [""] }, body, OWNER_HASH) &&
      !pbpVocabValidateDriveBatch({
        ...remote, parents: [APPDATA_PARENT_ID, "other-folder-id"]
      }, body, OWNER_HASH);
  }));

  check("appProperties contain no username email or token", attempt(() => {
    const meta = metadata();
    const body = bodyString([live()]);
    const serialized = JSON.stringify(meta);
    const leaked = { ...meta, appProperties: { ...meta.appProperties, email: "alice@example.com" } };
    const token = { ...meta, appProperties: { ...meta.appProperties, token: "secret-token" } };
    return !serialized.includes("alice@example.com") && !serialized.includes("secret-token") &&
      !pbpVocabValidateDriveBatch(leaked, body, OWNER_HASH) &&
      !pbpVocabValidateDriveBatch(token, body, OWNER_HASH);
  }));

  check("body uses canonical schema and stable construction", attempt(() => {
    const entry = live();
    const split = pbpVocabSplitDriveEntries([entry], ENVELOPE);
    const exact = JSON.stringify({
      schema: 1, ownerHash: OWNER_HASH, deviceId: DEVICE_ID, createdAt: 123, entries: [entry]
    });
    const extra = JSON.stringify({ ...bodyObject([entry]), cursor: "secret" });
    return splitBodiesValidate(split) && split.batches[0].body === exact &&
      !pbpVocabValidateDriveBatch(metadata(), "{bad json", OWNER_HASH) &&
      !pbpVocabValidateDriveBatch(metadata(), extra, OWNER_HASH);
  }));

  check("deleted entry has no value", attempt(() => {
    const entry = tombstone();
    const withValue = { ...entry, value: live().value };
    return pbpVocabValidateDriveBatch(metadata(), bodyString([entry]), OWNER_HASH) &&
      !pbpVocabValidateDriveBatch(metadata(), bodyString([withValue]), OWNER_HASH);
  }));

  check("live entry requires value", attempt(() => {
    const entry = live();
    delete entry.value;
    return !pbpVocabValidateDriveBatch(metadata(), bodyString([entry]), OWNER_HASH);
  }));

  check("entry is owner-free", attempt(() => {
    const entry = live();
    const body = bodyString([entry]);
    const ownerField = { ...entry, owner: "acct_alice" };
    const tokenField = { ...entry, token: "secret-token" };
    const valueOwner = { ...entry, value: { ...entry.value, owner: "acct_alice" } };
    const sparseGroups = live("Sparse Groups");
    const sparseContexts = live("Sparse Contexts");
    sparseGroups.value.groups = new Array(1);
    sparseContexts.value.contexts = new Array(1);
    return !body.includes("acct_alice") &&
      !pbpVocabValidateDriveBatch(metadata(), bodyString([ownerField]), OWNER_HASH) &&
      !pbpVocabValidateDriveBatch(metadata(), bodyString([tokenField]), OWNER_HASH) &&
      !pbpVocabValidateDriveBatch(metadata(), bodyString([valueOwner]), OWNER_HASH) &&
      !pbpVocabSplitDriveEntries([sparseGroups], ENVELOPE).ok &&
      !pbpVocabSplitDriveEntries([sparseContexts], ENVELOPE).ok;
  }));

  check("UTF-8 byte count is exact for multibyte data", attempt(() => {
    const split = pbpVocabSplitDriveEntries([live("Défense", "fr", { gloss: "é中🙂" })], ENVELOPE);
    return splitBodiesValidate(split) && split.batches[0].bytes === bytes(split.batches[0].body) &&
      split.batches[0].bytes > split.batches[0].body.length;
  }));

  check("at-or-under 4 MiB boundary is accepted", attempt(() => {
    const split = pbpVocabSplitDriveEntries([sizedEntry(TEST_MAX_BYTES, "Limit")], ENVELOPE);
    return splitBodiesValidate(split) && split.batches.length === 1 &&
      split.batches[0].bytes === TEST_MAX_BYTES &&
      split.batches[0].bytes === PBP_VOCAB_BATCH_MAX_BYTES;
  }));

  check("entries split across batches in order", attempt(() => {
    const entries = ["First", "Second", "Third"].map((term) => {
      const entry = live(term);
      entry.value.note = "x".repeat(Math.floor(TEST_MAX_BYTES / 2) + 100);
      return entry;
    });
    const split = pbpVocabSplitDriveEntries(entries, ENVELOPE);
    const empty = pbpVocabSplitDriveEntries([], ENVELOPE);
    const keys = split.batches.flatMap((batch) => JSON.parse(batch.body).entries.map((entry) => entry.recordKey));
    return splitBodiesValidate(split) && empty.ok && empty.batches.length === 0 &&
      split.batches.length > 1 &&
      keys.join(",") === entries.map((entry) => entry.recordKey).join(",") &&
      split.batches.every((batch) => batch.bytes <= TEST_MAX_BYTES);
  }));

  check("a single entry is never split", attempt(() => {
    const entry = sizedEntry(TEST_MAX_BYTES - 1, "Whole");
    const split = pbpVocabSplitDriveEntries([entry], ENVELOPE);
    const stored = JSON.parse(split.batches[0].body).entries;
    return splitBodiesValidate(split) && split.batches.length === 1 && stored.length === 1 &&
      JSON.stringify(stored[0]) === JSON.stringify(entry);
  }));

  check("oversized entry is a permanent entry_too_large result", attempt(() => {
    const entry = sizedEntry(TEST_MAX_BYTES + 1, "Oversized");
    const result = pbpVocabSplitDriveEntries([entry], ENVELOPE);
    return JSON.stringify(result) === JSON.stringify({
      ok: false, error: "entry_too_large", recordKey: entry.recordKey, bytes: TEST_MAX_BYTES + 1
    });
  }));

  // Category-level guard (K53): every failure code pbpVocabSplitDriveEntries
  // can really return -- derived here by actually calling it with malformed
  // input, not a hand-typed guess -- must be run through the sync runner and
  // checked against how normalizedFailure (a private closure, only reachable
  // this way) classifies it today. entry_too_large is explicitly claimed and
  // comes back as its own code; invalid_envelope and invalid_entry are not
  // claimed and fall into the generic "remote" bucket -- indistinguishable
  // from any unrecognised error. That gap is the actual finding: this
  // assertion locks in today's real, observed classification so a future
  // code added to the validator (or a future normalizedFailure edit) cannot
  // silently drift past it without this test needing a conscious update.
  await asyncCheck(
    "every pbpVocabSplitDriveEntries failure code is accounted for in normalizedFailure's classification",
    async () => {
      const nonNfcDeviceId = "é"; // decomposed "e" + combining acute: truthy, but !== its own NFC form
      const badEnvelope = pbpVocabSplitDriveEntries([], { ownerHash: OWNER_HASH, deviceId: nonNfcDeviceId, createdAt: 1 });
      const badEntry = pbpVocabSplitDriveEntries([{ garbage: true }], ENVELOPE);
      const oversized = sizedEntry(TEST_MAX_BYTES + 1, "TooBig");
      const tooLarge = pbpVocabSplitDriveEntries([oversized], ENVELOPE);
      const derived = new Set([badEnvelope.error, badEntry.error, tooLarge.error]);
      if (badEnvelope.ok || badEntry.ok || tooLarge.ok) return false; // sanity: fixtures must actually fail split

      const envelopeRun = await syncHarness({ meta: { deviceId: nonNfcDeviceId, counter: 1 } }).runner()();
      const entryRun = await syncHarness({
        outbox: [{ key: `outbox:${OWNER_SCOPE}:bad`, owner: OWNER_SCOPE, recordKey: "en|bad", event: { garbage: true } }]
      }).runner()();
      const tooLargeRun = await syncHarness({
        outbox: [{
          key: `outbox:${OWNER_SCOPE}:${oversized.recordKey}`, owner: OWNER_SCOPE,
          recordKey: oversized.recordKey, event: oversized
        }]
      }).runner()();

      return derived.has("invalid_envelope") && derived.has("invalid_entry") && derived.has("entry_too_large") &&
        !envelopeRun.ok && !entryRun.ok && !tooLargeRun.ok &&
        // Claimed: entry_too_large keeps its own identity.
        tooLargeRun.error === "entry_too_large" &&
        // Not claimed today (the finding): both fall into the same generic
        // bucket a totally unrecognised error code would also land in.
        envelopeRun.error === "remote" && entryRun.error === "remote";
    }
  );

  check("invalid noncanonical recordKey rejects the batch", attempt(() => {
    const entry = live();
    entry.recordKey = "EN|Word";
    return !pbpVocabValidateDriveBatch(metadata(), bodyString([entry]), OWNER_HASH);
  }));

  check("ownerHash mismatch rejects the whole batch", attempt(() => {
    const body = bodyString([live()]);
    const uppercase = OWNER_HASH.toUpperCase();
    const uppercaseMeta = metadata();
    uppercaseMeta.appProperties.owner = uppercase;
    return !pbpVocabValidateDriveBatch(metadata(), body, OTHER_OWNER_HASH) &&
      !pbpVocabValidateDriveBatch(uppercaseMeta, bodyString([live()], { ...ENVELOPE, ownerHash: uppercase }), uppercase) &&
      !pbpVocabValidateDriveBatch(metadata(), body, "not-a-hash");
  }));

  check("metadata and body device mismatch rejects", attempt(() => {
    const mismatch = bodyString([live("Word", "en", {}, "device-b")], { ...ENVELOPE, deviceId: "device-b" });
    const nonNfcDevice = "e\u0301";
    const longDevice = "界".repeat(40);
    const invalidBody = bodyString([live("Word", "en", {}, nonNfcDevice)], { ...ENVELOPE, deviceId: nonNfcDevice });
    const longBody = bodyString([live("Word", "en", {}, longDevice)], { ...ENVELOPE, deviceId: longDevice });

      results.push(await h.runner()());
      authCounts.push(h.connection()?.authAttempts);
      clock = h.connection().retryAt + 1;
    }
    const last = results[5];
    // Simplest misses: counting every backoff (retryAttempt) toward the auth
    // limit, or letting a network failure keep the earlier auth count.
    return results.slice(0, 5).every((result) =>
      !result.ok && result.error === "network" && result.retryable === true) &&
      authCounts.join(",") === "0,0,0,0,0,1" &&
      !last.ok && last.error === "auth" && last.retryable === true &&
      h.connection()?.blocked === false && h.connection().authAttempts === 1 &&
      h.connection().retryAttempt === 10 && h.preflight() === null;
  });

  await asyncCheck("five auth backoffs of about 31 minutes, then the sixth auth failure blocks", async () => {
    let clock = 1_000_000;
    const h = syncHarness({
      now: () => clock,
      aboutResults: Array.from({ length: 6 }, () => ({ ok: false, error: "auth", retryable: true }))
    });
    const results = [];
    const records = [];
    for (let i = 0; i < 6; i++) {
      results.push(await h.runner()());
      records.push(h.connection());
      if (Number.isFinite(records[i]?.retryAt)) clock = records[i].retryAt + 1;
    }
    const gated = await h.runner()();
    // Spec §10.1. Simplest miss: blocking on the fifth (>= counted after the bump).
    return results.slice(0, 5).every((result) => result.error === "auth" && result.retryable === true) &&
      records.slice(0, 5).every((record, i) => record.blocked === false && record.authAttempts === i + 1) &&
      records[4].retryAt === 1_000_000 + 31 * 60000 + 4 &&
      results[5].error === "auth" && results[5].retryable === false &&
      records[5].blocked === true && records[5].retryAt === null &&
      !gated.ok && gated.error === "auth" && gated.retryable === false &&
      h.calls.filter((call) => call.startsWith("open-session:")).length === 6;
  });

  await asyncCheck("server and rate_limited keep their code and back off only in the shared record", async () => {
    const outcomes = {};
    for (const [code, status] of [["server", 503], ["rate_limited", 429]]) {
      const h = syncHarness({
        accountState: {
          key: `account:perm-a:${OWNER_HASH}`, drivePermissionId: "perm-a",
          ownerHash: OWNER_HASH, bootstrapComplete: true, pageToken: "stable-old"
        },
        changePages: [{ ok: false, error: code, retryable: true, status }]
      });
      const result = await h.runner()();
      outcomes[code] = { result, record: h.connection(), preflight: h.preflight(), state: h.state() };
    }
    // Simplest miss: the account row still carries the connection backoff.
    return Object.entries(outcomes).every(([code, o]) =>
      !o.result.ok && o.result.error === code && o.result.retryable === true &&
      o.record?.lastError === code && o.record.blocked === false &&
      o.record.retryAt === 1_060_000 && o.record.retryAttempt === 1 && o.record.authAttempts === 0 &&
      o.preflight === null && o.state.lastError === undefined && o.state.retryAt === undefined);
  });

  await asyncCheck("an uncoded exception backs off without blocking; a throwing store read is local", async () => {
    const warnings = [];
    const realWarn = console.warn;
    console.warn = (...args) => { warnings.push(args.map((value) => String(value)).join(" ")); };
    let thrown;
    let storeRead;
    try {
      const h = syncHarness({
        sessionOverrides: { async getStartPageToken() { throw new TypeError("boom"); } }
      });
      thrown = { result: await h.runner()(), preflight: h.preflight(), record: h.connection() };
      const broken = syncHarness({});
      broken.store.listOutbox = async () => { throw new DOMException("closing", "InvalidStateError"); };
      storeRead = { result: await broken.runner()(), preflight: broken.preflight() };
    } finally {
      console.warn = realWarn;
    }
    // Simplest miss: the catch-all still returns a blocked "remote".
    return !thrown.result.ok && thrown.result.error === "unexpected" && thrown.result.retryable === true &&
      thrown.preflight?.lastError === "unexpected" && thrown.preflight.blocked === false &&
      Number.isFinite(thrown.preflight.retryAt) && thrown.record === null &&
      warnings.some((line) => line.includes("TypeError") && line.includes("boom")) &&
      // Simplest miss: a store read failure filed as "unexpected" and retried forever.
      !storeRead.result.ok && storeRead.result.error === "local_store" &&
      storeRead.preflight?.lastError === "local_store" && storeRead.preflight.blocked === true;
  });

  await asyncCheck("connection codes an earlier release left in preflight or account rows are ignored", async () => {
    const legacyBackoff = syncHarness({
      preflightState: {
        key: `preflight:${OWNER_HASH}`, ownerHash: OWNER_HASH,
        retryAttempt: 5, retryAt: 9_999_999, lastError: "network", blocked: false
      },
      aboutResults: [{ ok: false, error: "auth", retryable: true }]
    });
    const backoffResult = await legacyBackoff.runner()();
    const legacyBlock = syncHarness({
      preflightState: {
        key: `preflight:${OWNER_HASH}`, ownerHash: OWNER_HASH,
        retryAttempt: 0, retryAt: null, lastError: "auth", blocked: true
      }
    });
    const blockResult = await legacyBlock.runner()();
    const legacyAccount = syncHarness({
      accountState: {
        key: `account:perm-a:${OWNER_HASH}`, drivePermissionId: "perm-a",
        ownerHash: OWNER_HASH, bootstrapComplete: true, pageToken: "stable-old",
        retryAttempt: 5, retryAt: 9_999_999, lastError: "network"
      }
    });
    const accountResult = await legacyAccount.runner()();
    // Simplest miss: the legacy "auth" block still returned without a request.
    return backoffResult.error === "auth" && backoffResult.retryable === true &&
      legacyBackoff.calls.includes("open-session:false") &&
      legacyBackoff.connection()?.authAttempts === 1 && legacyBackoff.connection().blocked === false &&
      blockResult.ok && blockResult.status?.waitingForRetry !== true &&
      legacyBlock.calls.includes("open-session:false") && legacyBlock.preflight() === null &&
      accountResult.ok && accountResult.status?.waitingForRetry !== true &&
      legacyAccount.calls.includes("changes:stable-old") &&
      legacyAccount.state().lastError === null && legacyAccount.state().retryAttempt === 0;
  });

  await asyncCheck("the shared connection gate stops a run before any Google request", async () => {
    const blockedRecord = {
      lastError: "permission", authAttempts: 0, retryAttempt: 0,
      retryAt: null, blocked: true, updatedAt: 1
    };
    const blocked = syncHarness({ connectionState: blockedRecord });
    const blockedResult = await blocked.runner()();
    const waiting = syncHarness({ connectionState: {
      lastError: "network", authAttempts: 0, retryAttempt: 2,
      retryAt: 1_200_000, blocked: false, updatedAt: 1
    } });
    const waitingResult = await waiting.runner()();
    const forced = syncHarness({ connectionState: blockedRecord });
    const forcedResult = await forced.runner()({ force: true });
    // A forced run that then fails on the data must still have dropped the
    // connection block, or the next scheduled run is stopped by it again.
    const forcedCorrupt = syncHarness({
      connectionState: blockedRecord, failApply: true, files: [driveFile("gate-page")],
      filePages: [{ files: [driveFile("gate-page").meta], nextPageToken: null }]
    });
    const forcedCorruptResult = await forcedCorrupt.runner()({ force: true });
    // A blocked record always stops the run as non-retryable, whatever its
    // code; a record carrying a dataset code is not a connection record.
    const oddBlocked = syncHarness({ connectionState: { ...blockedRecord, lastError: "server" } });
    const oddResult = await oddBlocked.runner()();
    const foreign = syncHarness({ connectionState: { ...blockedRecord, lastError: "corrupt" } });
    const foreignResult = await foreign.runner()();
    const noGoogle = (h) => !h.calls.some((call) => call.startsWith("open-session:") || call === "about");
    // Simplest miss: the gate sits after openSession, so one about() still goes out.
    return !blockedResult.ok && blockedResult.error === "permission" &&
      blockedResult.retryable === false && noGoogle(blocked) &&
      waitingResult.ok && waitingResult.status?.waitingForRetry === true &&
      waitingResult.status.connectionWaiting === true && waitingResult.status.retryAt === 1_200_000 &&
      noGoogle(waiting) && waiting.connection()?.retryAt === 1_200_000 &&
      forcedResult.ok && forced.connection() === null && forced.calls.includes("open-session:false") &&
      !forcedCorruptResult.ok && forcedCorruptResult.error === "corrupt" &&
      forcedCorrupt.connection() === null && forcedCorrupt.preflight()?.lastError === "corrupt" &&
      !oddResult.ok && oddResult.error === "server" && oddResult.retryable === false && noGoogle(oddBlocked) &&
      foreignResult.ok && foreign.calls.includes("open-session:false");
  });

  await asyncCheck("a working session clears the connection error but keeps the backoff count; a full run clears the record", async () => {
    const record = {
      lastError: "auth", authAttempts: 3, retryAttempt: 3,
      retryAt: 999_000, blocked: false, updatedAt: 1
    };
    const corruptRun = (connectionState) => syncHarness({
      connectionState, failApply: true, files: [driveFile("reset-page")],
      filePages: [{ files: [driveFile("reset-page").meta], nextPageToken: null }]
    });
    const partial = corruptRun(record);
    const partialResult = await partial.runner()();
    const offlineRecord = { ...record, lastError: "network", authAttempts: 0 };
    const offline = corruptRun(offlineRecord);
    await offline.runner()();
    const full = syncHarness({ connectionState: record });
    const fullResult = await full.runner()();
    // Spec §10.2: Google answered, so the old connection error and its expired
    // retryAt go now; retryAttempt stays so a flaky link keeps growing.
    // Simplest misses: resetting authAttempts alone (the stale "auth" sits on
    // the panel beside the corrupt line), or clearing only when authAttempts > 0
    // (the network record survives a working session).
    const cleared = (from) => JSON.stringify({ ...from, lastError: null, retryAt: null, authAttempts: 0 });
    return !partialResult.ok && partialResult.error === "corrupt" &&
      JSON.stringify(partial.connection()) === cleared(record) && partial.connection().retryAttempt === 3 &&
      JSON.stringify(offline.connection()) === cleared(offlineRecord) &&
      partial.preflight()?.lastError === "corrupt" && partial.preflight().blocked === true &&
      fullResult.ok && full.connection() === null && full.calls.includes("conn-put:null");
  });

  await asyncCheck("a round after the upgrade leaves no connection-layer error in the shared record or the preflight", async () => {
    // What an earlier release left behind (and the Task 5 migration may have
    // missed): connection codes in the preflight and the account row, plus a
    // shared record whose backoff has expired.
    const h = syncHarness({
      preflightState: {
        key: `preflight:${OWNER_HASH}`, ownerHash: OWNER_HASH,
        retryAttempt: 3, retryAt: 9_999_999, lastError: "network", blocked: false
      },
      accountState: {
        key: `account:perm-a:${OWNER_HASH}`, drivePermissionId: "perm-a",
        ownerHash: OWNER_HASH, bootstrapComplete: true, pageToken: "stable-old",
        retryAttempt: 2, retryAt: 9_999_999, lastError: "auth"
      },
      connectionState: {
        lastError: "network", authAttempts: 0, retryAttempt: 4,
        retryAt: 999_000, blocked: false, updatedAt: 1
      }
    });
    const result = await h.runner()();
    const preflight = h.preflight();
    // Simplest miss: a final put(null) guarded on the record still carrying an
    // error -- the session reset already nulled lastError, so { retryAttempt: 4 }
    // stays behind and the next failure waits 16 minutes instead of one.
    return result.ok && h.connection() === null &&
      h.calls.filter((call) => call.startsWith("conn-put:")).join() === "conn-put:null:false,conn-put:null" &&
      (preflight === null || !PBP_DRIVE_CONNECTION_ERRORS.has(preflight.lastError)) &&
      !PBP_DRIVE_CONNECTION_ERRORS.has(h.state().lastError);
  });

  await asyncCheck("a newly connected Drive account re-uploads existing vocabulary", async () => {
    const fresh = syncHarness({});
    const freshResult = await fresh.runner()();
    const known = syncHarness({
      accountState: {
        key: `account:perm-a:${OWNER_HASH}`, drivePermissionId: "perm-a",
        ownerHash: OWNER_HASH, bootstrapComplete: true, pageToken: "stable-old"
      }
    });
    const knownResult = await known.runner()();
    return freshResult.ok && fresh.calls.includes("checkpoint") &&
      knownResult.ok && !known.calls.includes("checkpoint");
  });

  await asyncCheck("transient auth backs off, rejected auth still blocks", async () => {
    const transient = syncHarness({
      aboutResults: [{ ok: false, error: "auth", retryable: true }]
    });
    const transientResult = await transient.runner()({ force: true });
    const transientRecord = transient.connection();
    const rejected = syncHarness({
      aboutResults: [{ ok: false, error: "auth", retryable: false, status: 401 }]
    });
    const rejectedResult = await rejected.runner()({ force: true });
    const rejectedRecord = rejected.connection();
    // Simplest miss: a 401-rejected token treated as transient like a mint failure.
    return !transientResult.ok && transientResult.error === "auth" &&
      transientResult.retryable === true &&
      transientRecord?.blocked === false && transientRecord.lastError === "auth" &&
      transientRecord.authAttempts === 1 && Number.isFinite(transientRecord.retryAt) &&
      transient.preflight() === null &&
      !rejectedResult.ok && rejectedResult.error === "auth" &&
      rejectedResult.retryable === false &&
      rejectedRecord?.blocked === true && rejectedRecord.retryAt === null &&
      rejected.preflight() === null;
  });

  await asyncCheck("real runner merges differently cased saved words without blocking Drive sync", async () => {
    // This suite's earlier runners use in-memory stores. Reset its test-origin
    // database so reopening this file exercises bootstrap again, too.
    const db = await _pbpVocabOpenDB();
    const reset = db.transaction(["words", "sync"], "readwrite");
    const resetDone = _pbpVocabTransactionDone(reset);
    reset.objectStore("words").clear();
    reset.objectStore("sync").clear();
    await resetDone;
    const owner = "acct_alias-runner";
    const ownerHash = "c".repeat(64);
    const saved = await pbpVocabSaveWord(owner, {
      term: "Hello", language: "en", gloss: "local gloss",
      context: { articleUrl: "https://local.test/", quote: "local context" }
    });
    if (!saved) return false;
    // Hand-written server responses: do not derive either the remote event or
    // its opaque parent ID from a local outbox / upload-side constructor.
    const remoteMetadata = {
      id: "remote-alias-file", name: "pbp-vocab-remote-alias-file.json",
      parents: ["opaque-alias-appdata-folder"], mimeType: "application/json",
      appProperties: { pbpKind: "vocab-batch", schema: "1", owner: ownerHash, device: "remote-alias-device" }
    };
    const remoteBody = JSON.stringify({
      schema: 1, ownerHash, deviceId: "remote-alias-device", createdAt: 20,
      entries: [{
        recordKey: "en|hello", vector: { "remote-alias-device": 2 },
        dot: { deviceId: "remote-alias-device", counter: 2 }, deleted: false,
        value: {
          term: "hello", lemma: null, language: "en", gloss: "remote gloss", ipa: null,
          sourceUrl: null, license: null,
          contexts: [{ articleUrl: "https://remote.test/", quote: "remote context" }],
          groups: ["Remote"], note: "", status: "new", createdAt: 10, updatedAt: 20
        }
      }]
    });
    const uploads = [];
    const client = pbpCreateVocabDriveClient({
      identity: identityFixture(),
      fetchImpl: async (url, init) => {
        const path = new URL(url).pathname;
        if (path === "/drive/v3/about") return jsonResponse({ user: { permissionId: "alias-permission" } });
        if (path === "/drive/v3/changes/startPageToken") return jsonResponse({ startPageToken: "alias-start" });
        if (path === "/drive/v3/files") return jsonResponse({ files: [remoteMetadata] });
        if (path === "/drive/v3/files/remote-alias-file") return new Response(remoteBody);
        if (path === "/drive/v3/changes") return jsonResponse({ changes: [], newStartPageToken: "alias-end" });
        if (path === "/drive/v3/files/generateIds") return jsonResponse({ ids: ["merged-alias-upload"] });
        if (path === "/upload/drive/v3/files") {
          const part = init.body.split("\r\nContent-Type: application/json\r\n\r\n")[1];
          uploads.push(JSON.parse(part.slice(0, part.lastIndexOf("\r\n--"))));
          return jsonResponse({ id: "merged-alias-upload" }, 201);
        }
        throw new Error("unexpected fixture request");
      }
    });
    const runner = pbpCreateVocabDriveSyncRunner({
      client,
      getCurrentPinboardAuth: async () => ({ account: "alias-runner" }),
      pinboardAuthIsCurrent: () => true,
      hashOwner: async () => ownerHash
    });
    const first = await runner();
    const second = await runner();
    const rows = await pbpVocabAll(owner);
    const state = await pbpVocabGetAccountState("alias-permission", ownerHash);
    const preflight = await pbpVocabGetPreflightState(ownerHash);
    const uploaded = uploads[0]?.entries[0];
    return first.ok && first.changed === true && second.ok && preflight === null &&
      state?.bootstrapComplete === true && state.pageToken === "alias-end" &&
      rows.length === 1 && rows[0].term === "hello" && rows[0].gloss === "remote gloss" &&
      rows[0].contexts.length === 2 && uploaded?.value.term === "hello" &&
      uploaded.value.contexts.length === 2 && Object.keys(uploaded.vector).length === 2 &&
      (await pbpVocabListOutbox(owner)).length === 0;
  });

  await asyncCheck("the real vocabulary store keeps an unexpected backoff but no new connection code", async () => {
    const ownerHash = "d".repeat(64);
    const row = {
      key: `preflight:${ownerHash}`, ownerHash, retryAttempt: 1,
      retryAt: 1_060_000, lastError: "unexpected", blocked: false
    };
    const stored = await pbpVocabPutPreflightState(row);
    const read = await pbpVocabGetPreflightState(ownerHash);
    const server = await pbpVocabPutPreflightState({ ...row, lastError: "server" });
    await pbpVocabDeletePreflightState(ownerHash);
    // Simplest miss: the whitelist rejects "unexpected", so the backoff is lost.
    return stored === true && JSON.stringify(read) === JSON.stringify(row) && server === false;
  });

  const notesProtocol = {
    kind: "notes-batch", schema: 1, filePrefix: "pbp-notes",
    validateEvent: (event) => event?.recordKey === "pbp_hl_abcd|note-a" && event.deleted === true,
    validBatchBody: (body, ownerHash) => body?.schema === 1 && body.ownerHash === ownerHash &&
      Array.isArray(body.entries) && body.entries.every((event) => notesProtocol.validateEvent(event))
  };
  const notesEvent = { recordKey: "pbp_hl_abcd|note-a", vector: { "device-b": 1 },
    dot: { deviceId: "device-b", counter: 1 }, deleted: true };
  const notesMetadata = {
    id: "notes-remote", name: "pbp-notes-notes-remote.json", parents: [APPDATA_PARENT_ID],
    mimeType: "application/json", appProperties: {
      pbpKind: "notes-batch", schema: "1", owner: OWNER_HASH, device: "device-b"
    }
  };
  const notesBody = JSON.stringify({ schema: 1, ownerHash: OWNER_HASH, deviceId: "device-b",
    createdAt: 123, entries: [notesEvent] });
  await asyncCheck("injected notes codec pulls a real Drive metadata shape and uploads notes batches", async () => {
    const h = syncHarness({ protocol: notesProtocol,
      files: [{ meta: notesMetadata, body: notesBody }],
      filePages: [{ files: [notesMetadata], nextPageToken: null }],
      outbox: [{ owner: OWNER_SCOPE, recordKey: notesEvent.recordKey, event: notesEvent }] });
    const result = await h.runner()();
    return result.ok && result.changed && h.calls.includes("download:notes-remote") &&
      h.calls.some((call) => call.startsWith("upload:generated-batch:")) &&
      h.calls.includes("conn-put:null") && h.connection() === null;
  });
  await asyncCheck("a run that finds Drive disconnected exits before any Google call or sync write", async () => {
    const h = syncHarness({ isEnabled: async () => false });
    const result = await h.runner()();
    // Simplest miss: still returning "disabled", which the panel renders as an error.
    return result.ok === false && result.error === "not_connected" && result.retryable === false &&
      h.calls.length === 0 && h.connectionReads.length === 0;
  });
  await asyncCheck("disabling a type during download prevents local page and cursor commits", async () => {
    let enabled = true;
    const file = driveFile("scope-remote");
    const h = syncHarness({ files: [file], filePages: [{ files: [file.meta], nextPageToken: null }],
      isEnabled: async () => enabled, afterDownload: () => { enabled = false; } });
    const result = await h.runner()();
    return !result.ok && !h.calls.some((call) => call.startsWith("apply:")) &&
      !h.calls.some((call) => call.startsWith("upload:"));
  });
  await asyncCheck("blocked notes data stays in the notes preflight and leaves the shared record alone", async () => {
    const record = {
      lastError: "network", authAttempts: 0, retryAttempt: 2,
      retryAt: 900_000, blocked: false, updatedAt: 1
    };
    const h = syncHarness({ protocol: notesProtocol, connectionState: record,
      filePages: [{ files: [{ ...notesMetadata, mimeType: "text/plain" }], nextPageToken: null }] });
    const result = await h.runner()();
    // Simplest miss: a dataset block written into (or wiping) the shared record;
    // the one write allowed is the working session clearing the old error (§10.2).
    return result.error === "corrupt" && h.preflight()?.lastError === "corrupt" && h.preflight().blocked === true &&
      JSON.stringify(h.connection()) === JSON.stringify({ ...record, lastError: null, retryAt: null }) &&
      h.calls.filter((call) => call.startsWith("conn-put:")).join() === "conn-put:null:false";
  });
  await asyncCheck("disabling after sync metadata read prevents seeding local records", async () => {
    let enabled = true;
    const h = syncHarness({ isEnabled: async () => enabled, afterGetMeta: () => { enabled = false; } });
    const result = await h.runner()();
    return !result.ok && !h.calls.some((call) => call.startsWith("seed:"));
  });
  await asyncCheck("Google account switch during a download prevents page or cursor writes", async () => {
    let permissionId = "perm-a";
    const file = driveFile("google-switch");
    const h = syncHarness({ files: [file], filePages: [{ files: [file.meta], nextPageToken: null }],
      getCurrentPermissionId: async () => permissionId, afterDownload: () => { permissionId = "perm-b"; } });
    const result = await h.runner()();
    return result.error === "account_changed" && !h.calls.some((call) => call.startsWith("apply:"));
  });
  await asyncCheck("HTTP session checks the selected scope after awaiting token mint", async () => {
    let enabled = true, fetches = 0;
    const client = pbpCreateVocabDriveClient({
      identity: { async getAuthToken() { enabled = false; return { token: "token-a" }; } },
      fetchImpl: async () => { fetches++; return jsonResponse({ user: { permissionId: "perm-a" } }); }
    });
    const result = await client.openSession(false, { beforeRequest: async () => enabled });
    return result.error === "account_changed" && fetches === 0;
  });
  await asyncCheck("unreachable Google identity verification retains network backoff", async () => {
    const h = syncHarness({ getCurrentPermissionId: async () => ({ ok: false, error: "network", retryable: true }),
      outbox: [{ owner: OWNER_SCOPE, recordKey: "en|offline", event: live("Offline") }] });
    const result = await h.runner()();
    // Simplest miss: the network backoff still written into the preflight.
    return result.error === "network" && result.retryable === true &&
      h.connection()?.lastError === "network" && h.connection().blocked === false &&
      h.connection().retryAt === 1_060_000 && h.preflight() === null && h.outbox.length === 1;
  });
  await asyncCheck("disable and re-enable during a pending await cancels the older sync generation", async () => {
    let epoch = 1;
    const h = syncHarness({ getScopeEpoch: () => epoch, afterGetMeta: () => { epoch++; } });
    const result = await h.runner()();
    return result.error === "account_changed" && !h.calls.some((call) => call.startsWith("seed:")) &&
      !h.calls.some((call) => call.startsWith("upload:"));
  });
  document.getElementById("summary").textContent = `pass=${pass} fail=${fail}`;
})();
</script></body></html>
