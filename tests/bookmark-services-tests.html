function test(name, run) { cases.push({name, run}); }
function equal(actual, expected) { if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error(`expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`); }
function ok(value) { if (!value) throw new Error("assertion failed"); }
async function rejects(run, code) { try { await run(); } catch (error) { equal(error.code, code); return; } throw new Error("expected rejection: " + code); }
const pageUrl = "https://example.com/article";
// Hand-written server records, not derived from the adapter's serializers.
const ld = {id:7, url:pageUrl, title:"Saved title", description:"Website summary", notes:"My note", tag_names:["work"], unread:true, shared:false, is_archived:false, date_added:"2026-10-01T10:00:00Z", date_modified:"2026-10-01T10:00:00Z"};

const ldMergedPost = {id:11,url:pageUrl,title:"T",description:"",notes:"",web_archive_snapshot_url:"https://web.archive.org/web/20261030030122/https://example.com/article",favicon_url:null,preview_image_url:null,is_archived:false,unread:false,shared:false,tag_names:["pbp-research","second"],date_added:"2026-10-30T03:01:22.656384Z",date_modified:"2026-10-30T04:01:22.656384Z",website_title:null,website_description:null};

function harness(service, replies, extra = {}) {
  const calls = [];
  const client = pbpCreateBookmarkServiceClient({service, baseUrl:"https://bookmarks.example/base/", token:"fixture-token", beforeRequest:async()=>({token:"fixture-token"}),
    fetchImpl:async(url, options)=>{ calls.push({url, ...options, body:options.body ? JSON.parse(options.body) : undefined}); const next = replies.shift(); if (!next) throw new Error("unexpected request"); if (next instanceof Error) throw next; if (next instanceof Response || typeof next.type === "string") return next; return new Response(next[0] === 204 ? null : JSON.stringify(next[1]), {status:next[0],headers:{"Content-Type":"application/json"}}); }, ...extra});
  return {client, calls};
}

  const one = name => pbpBookmarkGatewayNormalize({type:"custom", headers:[[name, "v"]]});
  for (const name of ["X-Pomerium-Authorization", "x_a", "A".repeat(64), "!#$%&'*+.^_`|~"]) equal(one(name).ok, true);
  for (const name of ["", "A".repeat(65), "X Header", "X:Y", "X\"Y", "名字", "X(Y)", "X/Y", "X@Y"]) equal([one(name).ok, one(name).error], [false, "name_invalid"]);
});
test("every Fetch forbidden header, proxy-/sec- prefix and app-owned header is refused in any letter case", () => {
  // Independent oracle copied from the Fetch spec list (research §7), not from shared.js.
  const names = ["Accept-Charset","Accept-Encoding","Access-Control-Request-Headers","Access-Control-Request-Method","Connection","Content-Length","Cookie","Cookie2","Date","DNT","Expect","Host","Keep-Alive","Origin","Referer","Set-Cookie","TE","Trailer","Transfer-Encoding","Upgrade","User-Agent","Via","Authorization","Accept","Content-Type","X-HTTP-Method","X-HTTP-Method-Override","X-Method-Override","Proxy-Authorization","Proxy-Anything","Sec-Fetch-Site","Sec-X"];
  for (const base of names) for (const name of [base, base.toLowerCase(), base.toUpperCase()]) {
    const r = pbpBookmarkGatewayNormalize({type:"custom", headers:[[name, "v"]]});

  const cf = pbpBookmarkGatewayNormalize({type:"custom", headers:[["CF-Access-Client-Id","a"],["CF-Access-Client-Secret","b"]]});
  equal([cf.ok, cf.gateway.headers], [true, [["CF-Access-Client-Id","a"],["CF-Access-Client-Secret","b"]]]);

test("gateway values allow only visible ASCII and space without quote or backslash, trimmed, 1-2048", () => {
  const one = value => pbpBookmarkGatewayNormalize({type:"custom", headers:[["X-A", value]]});
  for (let c = 0; c < 128; c++) {
    const legal = c >= 0x20 && c <= 0x7E && c !== 0x22 && c !== 0x5C;
    const r = one("a" + String.fromCharCode(c) + "b");
    equal([c, r.ok], [c, legal]);
    if (!legal) equal([r.error, r.row, r.field], ["value_invalid", 0, "value"]);
  }
  for (const bad of [" a", "a ", "a\r", "\na", "a\0b", "café", "中", "", "\t"]) equal([bad, one(bad).error], [bad, "value_invalid"]);
  equal(one("a".repeat(2048)).ok, true);
  equal([one("a".repeat(2049)).error, one("a".repeat(2049)).field], ["value_invalid", "value"]);
  equal(one("a b").ok, true);
});

  equal(two("a".repeat(2044)).ok, true);
  const r = two("a".repeat(2045));
  equal([r.ok, r.error, r.row], [false, "too_long", 1]);
});
test("cloudflare needs exactly the two fixed headers with values; custom needs 1-4 rows; unknown types fail", () => {
  const cf = headers => pbpBookmarkGatewayNormalize({type:"cloudflare", headers});
  const good = cf([["cf-access-client-id","id"],["CF-ACCESS-CLIENT-SECRET","sec"]]);
  equal([good.ok, good.gateway], [true, {type:"cloudflare", headers:[["CF-Access-Client-Id","id"],["CF-Access-Client-Secret","sec"]]}]);
  equal(cf([["CF-Access-Client-Id","id"]]).error, "required");
  equal(cf([]).error, "required");
  equal(cf([["CF-Access-Client-Id","id"],["CF-Access-Client-Secret",""]]).error, "required");
  equal(cf([["CF-Access-Client-Id","id"],["X-A","sec"]]).error, "name_invalid");
  const custom = n => pbpBookmarkGatewayNormalize({type:"custom", headers:Array.from({length:n}, (_, i) => ["X-H" + i, "v"])});
  equal([custom(0).error, custom(5).error], ["required", "required"]);
  equal([custom(1).ok, custom(4).ok], [true, true]);
  for (const type of ["pomerium", undefined, 7, null]) equal(pbpBookmarkGatewayNormalize({type, headers:[["X-A","v"]]}).error, "type_invalid");
  equal(pbpBookmarkGatewayNormalize(undefined).error, "type_invalid");
  equal(pbpBookmarkGatewayNormalize(null), {ok:true, gateway:null});
});
const gwEnvSettings = (service, gateway, extra = {}) => ({bookmarkService:service, [service + "Url"]:"https://bookmarks.example/base/",

test("envelope gateway: absent means none, valid adds header copies, anything invalid closes the whole connection", () => {
  const none = pbpBookmarkConnection(gwEnvSettings("linkding", undefined));
  equal([none.gatewayType, none.headers, none.connectionId, !!none.account, none.token], ["none", [], "conn-1", true, "tok"]);
  const gateway = {type:"cloudflare", headers:[["CF-Access-Client-Id","id"],["CF-Access-Client-Secret","sec"]]};
