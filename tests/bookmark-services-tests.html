function equal(actual, expected) { if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error(`expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`); }
function ok(value) { if (!value) throw new Error("assertion failed"); }
async function rejects(run, code) { try { await run(); } catch (error) { equal(error.code, code); return; } throw new Error("expected rejection: " + code); }

// Hand-written server records, not derived from the adapter's serializers.

const ldMergedPost = {id:11,url:pageUrl,title:"T",description:"",notes:"",web_archive_snapshot_url:"https://web.archive.org/web/20261030030122/https://example.com/article",favicon_url:null,preview_image_url:null,is_archived:false,unread:false,shared:false,tag_names:["pbp-research","second"],date_added:"2026-10-30T03:01:22.656384Z",date_modified:"2026-10-30T04:01:22.656384Z",website_title:null,website_description:null};

// What a popup that loaded ld / kk has as their loaded state: the read-side
// projection of those server answers, as a lookup gives it to the form.
const LD_LOADED = pbpBookmarkAsPost(pbpBookmarkNormalize("linkding", ld)).version;
const KK_LOADED = pbpBookmarkAsPost(pbpBookmarkNormalize("karakeep", kk)).version;
// Django 6.0 with DEBUG off answers an unhandled database error with its stock
// page (django/views/defaults.py server_error; linkding v1.47 ships no
// 500.html). linkding on PostgreSQL meets a tag longer than Tag.name's
// max_length=64 this way; on SQLite the same save succeeds.
const djangoServerError = () => new Response("\n<!doctype html>\n<html lang=\"en\">\n<head>\n  <title>Server Error (500)</title>\n</head>\n<body>\n  <h1>Server Error (500)</h1><p></p>\n</body>\n</html>\n",
  {status:500, headers:{"Content-Type":"text/html; charset=utf-8"}});
// 65 code points in three scripts (the emoji one is 130 UTF-16 units), and
// tags of exactly 64 that PostgreSQL stores.
const overlongTags = ["x".repeat(65), "標".repeat(65), "😀".repeat(65)];
const fittingTags = ["x".repeat(64), "😀".repeat(64), "re-" + "😀".repeat(61)];
function harness(service, replies, extra = {}) {
  const calls = [];
  const client = pbpCreateBookmarkServiceClient({service, baseUrl:"https://bookmarks.example/base/", token:"fixture-token", beforeRequest:async()=>({token:"fixture-token"}),
    fetchImpl:async(url, options)=>{ calls.push({url, ...options, body:options.body ? JSON.parse(options.body) : undefined}); const next = replies.shift(); if (!next) throw new Error("unexpected request"); if (next instanceof Error) throw next; if (next instanceof Response || typeof next.type === "string") return next; return new Response(next[0] === 204 ? null : JSON.stringify(next[1]), {status:next[0],headers:{"Content-Type":"application/json"}}); }, ...extra});
  return {client, calls};
}

test("linkding create sends a known Description with disable_scraping and leaves an unknown one to the server",async()=>{
  // A string is a value the extension vouches for, an empty one included: it
  // goes out as the form shows it, line breaks kept and the outer whitespace
  // trimmed (as linkding trims it), and linkding is told not to scrape.
  // Anything else means the extension could not tell, so the request carries
  // neither and the server's own scrape fills the field (id 18).
  for(const [summary,description] of [["",""],["Custom description","Custom description"],["  Custom\n\n  description ","Custom\n\n  description"],["Mine\r\n\r\nAI","Mine\n\nAI"]]){
    const h=harness("linkding",[[201,{...ldUnscraped,description}]]);
    const result=await h.client.save({url:pageUrl,title:"T",notes:"Meta description\nMy note",tags:[],summary});
    equal(h.calls[0].url,"https://bookmarks.example/base/api/bookmarks/?disable_scraping");
    equal([summary,h.calls[0].body.description],[summary,description]);
    equal([result.bookmark.summary,result.bookmark.notes],[description,"Meta description\nMy note"]);
  }
  for(const summary of [undefined,null,7]){
    const h=harness("linkding",[[201,ldScraped]]);
    const result=await h.client.save({url:pageUrl,title:"T",notes:"Meta description\nMy note",tags:[],summary});
    equal([summary,h.calls[0].url],[summary,"https://bookmarks.example/base/api/bookmarks/"]);
    equal([summary,Object.hasOwn(h.calls[0].body,"description")],[summary,false]);
    equal(result.bookmark.summary,"Meta description");
  }
});

test("linkding PATCH leaves a multi-line Description the form showed unchanged untouched",async()=>{
  // Written by linkding's own editor or another client: line breaks and runs
  // of spaces. The reader shows it as one line, the popup with its breaks;
  // either one left alone sends no change, and a changed one is written with
  // the line breaks the popup's box holds.
  const stored={...ldScraped,description:"First line\n\n  Second   line",tag_names:["kept"]};
  const existing=pbpBookmarkNormalize("linkding",stored);
  for(const [summary,sent] of [["First line Second line",undefined],[" First line\n\n  Second   line\n",undefined],
    [" First line\nSecond line ","First line\nSecond line"],
    ["First line Second line, edited","First line Second line, edited"],["  Edited \n description ","Edited \n description"],["",""]]){
    const reply=sent===undefined?{...stored,tag_names:["kept","added"],date_modified:"2026-10-30T05:00:00.000000Z"}
      :{...stored,description:sent,tag_names:["kept","added"],date_modified:"2026-10-30T05:00:00.000000Z"};
    const h=harness("linkding",[[200,reply]]);
    const result=await h.client.save({url:pageUrl,title:"T",notes:stored.notes,tags:["kept","added"],summary},existing);
    equal(h.calls[0].method,"PATCH");
    equal([summary,Object.hasOwn(h.calls[0].body,"description")],[summary,sent!==undefined]);
    if(sent!==undefined)equal(h.calls[0].body.description,sent);
    equal(result.bookmark.summary,sent===undefined?stored.description:sent);
  }
});

// The tab the save came from, as it showed the page.
const TAB7={id:7,url:pageUrl};
const singleFileHarness=async(service,replies,{settings={linkdingSingleFile:true},tabs=[{id:7,url:pageUrl,active:true}],...rest}={})=>{
  const h=await workerHarness(service,replies,{tabs,...rest});Object.assign(h.state.settings,settings);return h;};
const createQuery=h=>{const call=h.state.calls.find(c=>c.method==="POST"&&/\/api\/bookmarks\/(\?|$)/.test(c.url));return call?[...new URL(call.url).searchParams.keys()]:null;};
test("SingleFile runs exactly once after a linkding create, and linkding makes no snapshot of its own", async()=>{
  const h=await singleFileHarness("linkding",[[200,{bookmark:null}],[201,ld]]);
  const result=await h.submitPopupSaveIntent({...saveIntent,summary:""},(await h.auth()).account,undefined,TAB7);
  equal([result.status,result.mutation,result.singleFile],["saved","created","sent"]);
  equal(h.state.messages,[SINGLEFILE]);
  equal(createQuery(h),["disable_scraping","disable_html_snapshot"]);
  // Quick save hands its tab the same way; an unknown Description adds only the snapshot flag.
  const quick=await singleFileHarness("linkding",[[200,{bookmark:null}],[201,ld]]);
  equal((await quick.submitSaveIntent(saveIntent,{expectedAccount:(await quick.auth()).account,singleFileTab:TAB7})).singleFile,"sent");
  equal([quick.state.messages,createQuery(quick)],[[SINGLEFILE],["disable_html_snapshot"]]);
  // A listener that took the message without answering still received it.
  const silent=await singleFileHarness("linkding",[[200,{bookmark:null}],[201,ld]],{sendMessageError:new Error("The message port closed before a response was received.")});
  equal((await silent.submitSaveIntent(saveIntent,{expectedAccount:(await silent.auth()).account,singleFileTab:TAB7})).singleFile,"sent");
});
test("SingleFile is not asked for an update, a merge, a skip, a save without a tab, Karakeep, or with the switch off", async()=>{
  const cases=[
    ["update",await singleFileHarness("linkding",[[200,{bookmark:ld}],[200,ld]]),{...saveIntent,mode:"update",time:ld.date_added},TAB7],
    ["merged create",await singleFileHarness("linkding",[[200,{bookmark:null}],[201,{...ld,date_modified:"2026-10-01T10:05:00Z"}]]),saveIntent,TAB7],
    ["skip",await singleFileHarness("linkding",[[200,{bookmark:ld}]]),{...saveIntent,mode:"skip"},TAB7],
    // Batch, the reader and offline replay hand no tab.
    ["no tab",await singleFileHarness("linkding",[[200,{bookmark:null}],[201,ld]]),saveIntent,undefined],
    ["switch off",await singleFileHarness("linkding",[[200,{bookmark:null}],[201,ld]],{settings:{linkdingSingleFile:false}}),saveIntent,TAB7],
    ["Karakeep",await singleFileHarness("karakeep",[[200,{bookmarkId:null}],[201,kk],[200,{attached:[]}]]),saveIntent,TAB7],
  ];
  for(const [name,h,intent,tab] of cases){
    const result=await h.submitSaveIntent(intent,{expectedAccount:(await h.auth()).account,...(tab===undefined?{}:{singleFileTab:tab})});
    ok(["saved","skipped"].includes(result.status)||(()=>{throw new Error(name+": "+JSON.stringify(result));})());
    equal([name,h.state.messages||[],result.singleFile],[name,[],undefined]);
    // A create that linkding answers as a merge was sent as a create, flag
    // included (nothing tells them apart beforehand); the bookmark it merged
    // into keeps the snapshot it has, and SingleFile stays out of it.
    if(name!=="merged create")ok(!(createQuery(h)||[]).includes("disable_html_snapshot")||(()=>{throw new Error(name+" asked linkding for no snapshot");})());
  }
  // A replayed queue item never runs it either.
  const replay=await singleFileHarness("linkding",[new TypeError("offline")]);
  equal((await replay.submitSaveIntent(saveIntent,{expectedAccount:(await replay.auth()).account,singleFileTab:TAB7})).status,"queued");
  replay.state.calls.length=0;
  await replay.processOfflineQueue();
  equal(replay.state.messages||[],[]);
});

  for(const tabs of [[{id:8,url:pageUrl,active:true}],[{id:7,url:"https://example.com/other",active:true}],[]]){

    equal([JSON.stringify(tabs),earlyResult.status,earlyResult.mutation,earlyResult.singleFile,early.state.messages||[],createQuery(early)],
      [JSON.stringify(tabs),"saved","created",undefined,[],[]]);

  // Moved on while the create was on its way: the snapshot flag went out, and

  const moved=await singleFileHarness("linkding",[[200,{bookmark:null}],[201,ld]]);

  const warns=[],warn=console.warn;console.warn=(...args)=>warns.push(args.map(String).join(" "));
  try{
    const missing=await singleFileHarness("linkding",[[200,{bookmark:null}],[201,ld]],{sendMessageError:new Error("Could not establish connection. Receiving end does not exist.")});
    const result=await missing.submitSaveIntent(saveIntent,{expectedAccount:(await missing.auth()).account,singleFileTab:TAB7});

// SingleFile may answer only after it saved and uploaded the page, or never.
// The save does not wait on it: a later save goes through meanwhile, and a

test("a SingleFile that does not answer holds neither this save for long nor the saves behind it", async()=>{
  const warns=[],warn=console.warn;console.warn=(...args)=>warns.push(args.map(String).join(" "));
  try{
    const h=await singleFileHarness("linkding",[[200,{bookmark:null}],[201,ld],[200,{bookmark:null}],[201,{...ld,id:2,url:pageUrl+"/second"}]],{sendMessageHang:true});
    const account=(await h.auth()).account,started=Date.now();
    let firstDone=false;
    const first=h.submitSaveIntent(saveIntent,{expectedAccount:account,singleFileTab:TAB7}).then(r=>{firstDone=true;return r;});
    const second=await h.submitSaveIntent({...saveIntent,url:pageUrl+"/second"},{expectedAccount:account});
    equal([second.status,firstDone],["saved",false]);
    const result=await first;
    equal([result.status,result.mutation,result.singleFile,h.state.messages],["saved","created","sent",[SINGLEFILE]]);
    ok(Date.now()-started<5000||(()=>{throw new Error("the save waited "+(Date.now()-started)+"ms on SingleFile");})());
    ok(warns.some(line=>line.startsWith("[singlefile]"))||(()=>{throw new Error("no trace of the late answer");})());
  }finally{console.warn=warn;}
});

// Gateway fixtures: hand-written from the design's measured shapes (survey section 2), not built by the adapter.
const gwHtml = (status, headers = {}, body = "<html><body>Forbidden</body></html>") => new Response(body, {status, headers:{"Content-Type":"text/html; charset=UTF-8", ...headers}});
const gwChallenge = (status = 403) => gwHtml(status, {"cf-mitigated":"challenge"}, '<!DOCTYPE html><html lang="en-US"><head><title>Just a moment...</title></head><body></body></html>');
const gwBasic = (scheme = 'Basic realm="Restricted"') => new Response("Unauthorized", {status:401, headers:{"Content-Type":"text/plain", "WWW-Authenticate":scheme}});

// Known residual, deliberately not guessed at: a reverse proxy in front of
// Karakeep that itself answers 403 text/plain (Traefik ipAllowList) reads as
// auth and shows the token copy.
const kkPlain = (status, body, type = "text/plain;charset=UTF-8") => new Response(body, {status, headers:{"Content-Type":type}});

  equal(await gwCode(kkPlain(403, "Forbidden"), "linkding"), "gateway_denied");
  for (const service of ["karakeep", "linkding"]) {

      equal([service, status, await gwCode(kkPlain(status, "<html/>", "application/xhtml+xml"), service)], [service, status, "gateway_denied"]);
      equal([service, status, await gwCode(new Response("{}", {status, headers:{"Content-Type":"application/json"}}), service)], [service, status, "auth"]);

test("Connect's clear-then-bind patch judges the found list against the cleared state",()=>{
  const acct="karakeep:https://keep.example/base/:user1";
  // A synced binding of the same owner on a device whose token is missing: the old
  // connection is not ready (account ""); the binding is already this identity's and stays.
  const synced={karakeepReadLaterListId:"L1",karakeepReadLaterListOwner:acct};
  equal(pbpKarakeepConnectBindingPatch(synced,"",acct,"L1"),{});
  equal(pbpKarakeepConnectBindingPatch({karakeepReadLaterListId:"",karakeepReadLaterListOwner:""},"",acct,"L1"),{karakeepReadLaterListId:"L1",karakeepReadLaterListOwner:acct});
  // Nothing found (duplicate lists, failed request): a binding owned by this very identity stays.
  equal(pbpKarakeepConnectBindingPatch(synced,"",acct,""),{});
  // Nothing found: a binding of a different identity is cleared, not kept.
  equal(pbpKarakeepConnectBindingPatch({karakeepReadLaterListId:"old",karakeepReadLaterListOwner:"karakeep:https://o/:u"},"",acct,""),{karakeepReadLaterListId:"",karakeepReadLaterListOwner:""});
  // Same identity with its own binding: nothing changes.
  equal(pbpKarakeepConnectBindingPatch(synced,acct,acct,"L2"),{});
  // Another identity: old binding replaced by the found list.
  equal(pbpKarakeepConnectBindingPatch({karakeepReadLaterListId:"old",karakeepReadLaterListOwner:"karakeep:https://o/:u"},"karakeep:https://o/:u",acct,"L3"),{karakeepReadLaterListId:"L3",karakeepReadLaterListOwner:acct});
});

test("every code the adapter or worker can fail a self-hosted request with has copy, and only transient ones are retryable",async()=>{
  // Codes produced by the real classifier and client, not a hand-copied list.
  const produced=new Set();
  const code=async(reply,service)=>{try{await harness(service,[reply]).client.verify();}catch(error){produced.add(error.code);}};
  for(const service of ["linkding","karakeep"]){
    for(const status of [400,401,404,409,413,422,429,500,502,503])await code(new Response("{}",{status,headers:{"Content-Type":"application/json"}}),service);
    await code(new Response("<html></html>",{status:404,headers:{"Content-Type":"text/html"}}),service);
    await code(new Response("<html>",{status:200}),service);
    await code(new TypeError("Failed to fetch"),service);
    await code(new DOMException("signal timed out","TimeoutError"),service);
    await code(gwRedirect(),service);await code(gwChallenge(),service);await code(gwBasic(),service);await code(gwHtml(403),service);
  }
  // The worker's own causes: a host grant gone, a connection that changed.
  for(const reason of ["permission","account_changed"])produced.add(reason);
  for(const reason of produced){
    for(const service of ["linkding","karakeep"])ok(pbpBookmarkFailureKey({reason,httpStatus:400},service));
  }
  const retryable=[...produced].filter(reason=>pbpBookmarkFailureRetryable({reason})).sort();
  equal(retryable,["network","rate_limited","server","timeout"]);
  equal(pbpBookmarkFailureArgs({reason:"remote",httpStatus:422}),["422"]);
  equal(pbpBookmarkFailureArgs({reason:"remote"}),["?"]);
  equal(pbpBookmarkFailureArgs({reason:"server",httpStatus:503}),[]);
  equal(pbpBookmarkFailureText({reason:"remote",httpStatus:400},"linkding",(key,...args)=>[key,...args].join(":")),"bookmarkErrRemote:400");
  equal(pbpBookmarkFailureText({reason:"remote",httpStatus:400},"pinboard",()=>"x"),"");
});
// What nginx in front of linkding answers while gunicorn restarts or times
// out (ngx_http_special_response.c): the request never reached Django.
const nginxTitles = {501:"501 Not Implemented",502:"502 Bad Gateway",503:"503 Service Temporarily Unavailable",
  504:"504 Gateway Time-out",505:"505 HTTP Version Not Supported",507:"507 Insufficient Storage"};
// Cloudflare's own error page when the tunnel or origin behind it is down
// (52x and 530 are generated at the edge, never by linkding).
const cloudflareTitles = {520:"Web server is returning an unknown error",521:"Web server is down",
  522:"Connection timed out",524:"A timeout occurred",530:"Origin DNS error"};
const proxyError = status => {
  if (cloudflareTitles[status] !== undefined) {
    return new Response("<!DOCTYPE html>\n<html lang=\"en-US\">\n<head>\n<title>linkding.example.com | "+status+": "+cloudflareTitles[status]+"</title>\n</head>\n<body>\n<h1>"+cloudflareTitles[status]+"</h1>\n<span>Error code "+status+"</span>\n<span>Cloudflare Ray ID: <strong>8f2a1c3d4e5b6a7c</strong></span>\n</body>\n</html>\n",
      {status,headers:{"Content-Type":"text/html; charset=UTF-8","Server":"cloudflare","CF-RAY":"8f2a1c3d4e5b6a7c-NRT"}});
  }
  const title = nginxTitles[status];
  return new Response("<html>\r\n<head><title>"+title+"</title></head>\r\n<body>\r\n<center><h1>"+title+"</h1></center>\r\n<hr><center>nginx</center>\r\n</body>\r\n</html>\r\n",
    {status,headers:{"Content-Type":"text/html","Server":"nginx"}});
};
// Every 5xx other than Django's 500: proxy, gateway and edge statuses alike.
const non500ServerStatuses = [501,502,503,504,505,507,520,521,522,524,530];
test("a linkding 500 names a tag longer than 64 characters, and only such a tag",async()=>{
  for(const tag of overlongTags)for(const existing of [undefined,{id:"7",url:pageUrl,private:true,summary:""}]){
    const h=harness("linkding",[djangoServerError()]);
    let error;
    try{await h.client.save({url:pageUrl,title:"T",notes:"",tags:["work",tag]},existing);}catch(e){error=e;}
    equal([error?.code,error?.status,error?.tag],["tag_too_long",500,tag]);
    // The request carried the tag as typed: nothing is cut or held back.
    equal([h.calls[0].method,h.calls[0].body.tag_names],[existing?"PATCH":"POST",["work",tag]]);
  }
  // Any 5xx but 500 (a proxy, a gateway, Cloudflare's edge) never came from
  // Django's database: an outage, even with an over-long tag (SQLite stores
  // it), so it stays retryable.
  for(const status of non500ServerStatuses)for(const existing of [undefined,{id:"7",url:pageUrl,private:true,summary:""}]){
    let error;
    try{await harness("linkding",[proxyError(status)]).client.save({url:pageUrl,title:"T",notes:"",tags:["work",overlongTags[0]]},existing);}catch(e){error=e;}
    equal([status,error?.code,error?.status,error?.tag],[status,"server",status,undefined]);
  }
  // linkding splits a name at commas and trims the parts (parse_tag_string).
  const long="y".repeat(65), comma=harness("linkding",[djangoServerError()]);
  let error;try{await comma.client.save({url:pageUrl,title:"T",notes:"",tags:["short, "+long+" "]});}catch(e){error=e;}
  equal([error?.code,error?.tag],["tag_too_long",long]);
  // Tags that fit (counted in code points), or none, leave a server error
  // retryable; other statuses and Karakeep keep their own codes.
  for(const tags of [[],["work"],fittingTags,["a,"+"z".repeat(64)]])await rejects(()=>harness("linkding",[djangoServerError()]).client.save({url:pageUrl,title:"T",notes:"",tags}),"server");
  await rejects(()=>harness("linkding",[[429,{detail:"Request was throttled."}]]).client.save({url:pageUrl,title:"T",notes:"",tags:[overlongTags[0]]}),"rate_limited");
  await rejects(()=>harness("linkding",[[400,{url:["This field is required."]}]]).client.save({url:pageUrl,title:"T",notes:"",tags:[overlongTags[0]]}),"remote");
  await rejects(()=>harness("karakeep",[new Response("Internal Server Error",{status:500,headers:{"Content-Type":"text/plain"}})]).client.save({url:pageUrl,title:"T",notes:"",tags:[overlongTags[0]]}),"server");
});

// DRF's throttle answer (linkding): JSON detail plus Retry-After in seconds.
const ldThrottled = retryAfter => new Response(JSON.stringify({detail:"Request was throttled. Expected available in 120 seconds."}),

test("a 429 with Retry-After holds the queued record until then, and one without is retried on the next tick",async()=>{
  const realNow=Date.now;
  try {
    for(const [label,header,delay] of [["seconds","120",120000],["HTTP date far ahead",new Date(realNow()+5*3600*1000).toUTCString(),3600000]]){
      const replies=[new TypeError("offline"),ldThrottled(header)];
      const h=await workerHarness("linkding",replies);
      equal((await h.submitSaveIntent(saveIntent)).status,"queued");
      h.state.calls=[];
      await h.processOfflineQueue();
      equal([label,h.state.calls.length],[label,1]);
      const failure=h.state.queue[0].failure;
      equal([label,Object.keys(failure).sort(),failure.code],[label,["at","code","retryAfter"],"rate_limited"]);
      ok(Math.abs(failure.retryAfter-failure.at-delay)<=2000,label+": hold "+(failure.retryAfter-failure.at));
      // Inside the window nothing is sent; the record is not one that needs attention.
      ok(!pbpOfflineQueueNeedsAttention(h.state.queue[0]));
      Date.now=()=>failure.retryAfter-1000; h.state.calls=[];
      await h.processOfflineQueue();
      equal([label,h.state.calls.length],[label,0]);
      Date.now=()=>failure.retryAfter+1000;
      replies.push([200,{bookmark:null}],[201,ld]);
      await h.processOfflineQueue();
      equal([label,h.state.calls.map(c=>c.method),h.state.queue],[label,["GET","POST"],[]]);
      Date.now=realNow;
    }
    const replies=[new TypeError("offline"),ldThrottled(undefined)];
    const h=await workerHarness("linkding",replies);
    equal((await h.submitSaveIntent(saveIntent)).status,"queued");
    await h.processOfflineQueue();
    ok(!("failure" in h.state.queue[0]),"a 429 without Retry-After was held");
    replies.push([200,{bookmark:null}],[201,ld]); h.state.calls=[];
    await h.processOfflineQueue();
    equal([h.state.calls.length,h.state.queue],[2,[]]);
  } finally { Date.now=realNow; }
});

test("every placeholder the save failure copy fills keeps its name and order in all nine locales",async()=>{
  // The keys whose values come from pbpBookmarkFailureArgs, plus the Batch
  // sentences (either mode) that reuse them after their count.
  const keys=[...new Set([...Object.values(PBP_BOOKMARK_FAILURE_KEYS),"bgTagTooLongSkip","batchTagTooLong","batchTagTooLongSkip"])];
  const en=await (await fetch("../_locales/en/messages.json")).json();
  const contract=entry=>JSON.stringify(Object.entries(entry?.placeholders||{}).map(([name,value])=>[name.toLowerCase(),value.content]));
  for(const loc of ["de","en","fr","ja","pl","ru","zh_CN","zh_HK","zh_TW"]){
    const messages=await (await fetch(`../_locales/${loc}/messages.json`)).json();
    for(const key of keys){
      const entry=messages[key];
      if(typeof entry?.message!=="string"||!entry.message.trim())throw new Error(`${loc} lacks ${key}`);
      if(contract(entry)!==contract(en[key]))throw new Error(`${loc} ${key} placeholders ${contract(entry)} differ from en ${contract(en[key])}`);
      const used=(entry.message.match(/\$[A-Za-z_]+\$/g)||[]).map(token=>token.slice(1,-1).toLowerCase());
      const declared=Object.keys(entry.placeholders||{}).map(name=>name.toLowerCase());
      if(JSON.stringify([...used].sort())!==JSON.stringify([...declared].sort()))throw new Error(`${loc} ${key} uses ${used} but declares ${declared}`);
    }
  }
  for(const key of ["bookmarkErrTagTooLong","bgTagTooLongSkip"])equal([key,contract(en[key])],[key,JSON.stringify([["tag","$1"],["max","$2"]])]);
  for(const key of ["batchTagTooLong","batchTagTooLongSkip"])equal([key,contract(en[key])],[key,JSON.stringify([["count","$1"],["tag","$2"],["max","$3"]])]);
});
