<html><head><meta charset="utf-8"><meta name="pbp-expected-count" content="32"><title>ai-cache Tests</title>
<style>body{font-family:monospace;padding:16px}.case{padding:5px;border-bottom:1px solid #ddd}.pass{color:#176}.fail{color:#b00}</style>
</head><body><div id="results"></div>
<script src="../ai-cache.js"></script>
<script>
let pass = 0, fail = 0;
const results = document.getElementById("results");
function assert(condition, message) { if (!condition) throw new Error(message || "assertion failed"); }
async function test(name, fn) {
  const row = document.createElement("div");
  try { await fn(); pass++; row.className = "case pass"; row.textContent = "PASS " + name; }
  catch (error) { fail++; row.className = "case fail"; row.textContent = "FAIL " + name + "\n  " + error.message; }
  results.appendChild(row);
}

async function db() { return _pbpAiOpenDB(); }
async function clearEntries() {
  const opened = await db();
  await new Promise((resolve) => {
    const tx = opened.transaction(_PBP_AI_STORE, "readwrite");
    tx.objectStore(_PBP_AI_STORE).clear();
    tx.oncomplete = resolve; tx.onabort = resolve; tx.onerror = () => {};
  });
}
async function seed(entries) {
  const opened = await db();
  await new Promise((resolve) => {
    const tx = opened.transaction(_PBP_AI_STORE, "readwrite");
    const store = tx.objectStore(_PBP_AI_STORE);
    entries.forEach((entry) => store.put(entry));
    tx.oncomplete = resolve; tx.onabort = resolve; tx.onerror = () => {};
  });
}
async function allEntries() {
  const opened = await db();
  return new Promise((resolve) => {
    const tx = opened.transaction(_PBP_AI_STORE, "readonly");
    const req = tx.objectStore(_PBP_AI_STORE).getAll();
    req.onsuccess = () => resolve(req.result || []); req.onerror = () => resolve([]);
  });
}
async function rawEntry(key) {
  const opened = await db();
  return new Promise((resolve) => {
    const tx = opened.transaction(_PBP_AI_STORE, "readonly");
    const req = tx.objectStore(_PBP_AI_STORE).get(key);
    req.onsuccess = () => resolve(req.result || null); req.onerror = () => resolve(null);
  });
}
function rows(prefix, count, firstTs) {
  return Array.from({ length: count }, (_, i) => ({ key: prefix + i, result: i, ts: firstTs + i }));
}
// Pools by their literal key prefixes, not by ai-cache.js's own routing.
const POOL_PREFIXES = [["dict2", "dict2_"], ["dictctx", "dictctx2_"], ["summaryOwner", "summary_owner_"],
  ["summaryHold", "summary_hold_"], ["tr", "tr_"]];
function counts(entries) {
  const result = { dict2: 0, dictctx: 0, summaryOwner: 0, summaryHold: 0, tr: 0, other: 0 };
  for (const entry of entries) {
    const pool = POOL_PREFIXES.find(([, prefix]) => entry.key.startsWith(prefix));
    result[pool ? pool[0] : "other"]++;
  }
  return result;
}
// Counts the cursor steps an eviction walk takes while `run` writes.
async function cursorSteps(run) {
  const original = IDBCursor.prototype.continue;
  let steps = 0;
  IDBCursor.prototype.continue = function (...args) { steps++; return original.apply(this, args); };
  try { await run(); } finally { IDBCursor.prototype.continue = original; }
  return steps;
}

(async () => {
  await test("schema remains DB version 1 with the existing entries store", async () => {
    const opened = await db();
    assert(opened.version === 1, "version=" + opened.version);
    assert(opened.objectStoreNames.length === 1 && opened.objectStoreNames.contains("entries"), "store changed");
  });

  await test("dict2 boundary keeps exactly 500 records", async () => {
    await clearEntries();
    await seed(rows("dict2_en|word", 499, 1));
    await pbpAiCacheSet("dict2_en|word499", "new", 500);
    const count = counts(await allEntries());
    assert(count.dict2 === 500 && count.other === 0, JSON.stringify(count));
  });

  await test("dict2 record 501 evicts the oldest dict2 ts", async () => {
    await clearEntries();
    await seed(rows("dict2_fr|word", 500, 1));
    await pbpAiCacheSet("dict2_fr|newest", "new", 501);
    const count = counts(await allEntries());
    assert(count.dict2 === 500, "dict2=" + count.dict2);
    assert(!await rawEntry("dict2_fr|word0"), "oldest dict2 survived");
    assert(await rawEntry("dict2_fr|newest"), "newest dict2 was evicted");
  });

  await test("dict2 write older than every existing ts evicts itself", async () => {
    await clearEntries();
    await seed(rows("dict2_it|word", 500, 100));
    await pbpAiCacheSet("dict2_it|stale-write", "stale", 1);
    const count = counts(await allEntries());
    assert(count.dict2 === 500, "dict2=" + count.dict2);
    assert(!await rawEntry("dict2_it|stale-write"), "oldest new dict2 write survived");
    assert(await rawEntry("dict2_it|word0"), "existing dict2 LRU head was incorrectly evicted");
  });

  await test("other-cache boundary is 200 and record 201 evicts its oldest ts", async () => {
    await clearEntries();
    await seed(rows("skim_test_", 199, 1));
    await pbpAiCacheSet("ask_boundary", "two-hundred", 200);
    let count = counts(await allEntries());
    assert(count.other === 200, "boundary=" + JSON.stringify(count));
    await pbpAiCacheSet("skim_overflow", "two-hundred-one", 201);
    count = counts(await allEntries());
    assert(count.other === 200 && count.dict2 === 0, "overflow=" + JSON.stringify(count));
    assert(!await rawEntry("skim_test_0"), "oldest other record survived");
  });

  // Receipts replaced the unbounded "[AI Summary]" marker: every AI summary
  // block a save writes depends on one, quick saves and Batch included, so
  // the pool has to hold years of saves, not one large Batch.
  await test("summary receipts keep at least 20,000 records and evict only their own oldest", async () => {
    const cap = _PBP_AI_SUMMARY_OWNER_MAX_ENTRIES;
    assert(cap >= 20000, "receipt cap=" + cap);
    await clearEntries();
    await seed(rows("summary_owner_alice|url", cap - 1, 1).concat(rows("summary_hold_q", 3, cap + 1),
      rows("dict2_en|word", 500, cap + 10), rows("skim_owner_mix_", 200, cap + 1000)));
    await pbpAiCacheSet("summary_owner_alice|boundary", "new", cap + 2000);
    let count = counts(await allEntries());
    assert(count.summaryOwner === cap && count.summaryHold === 3 && count.dict2 === 500 && count.other === 200,
      "boundary " + JSON.stringify(count));
    await pbpAiCacheSet("summary_owner_alice|newest", "new", cap + 2001);
    count = counts(await allEntries());
    assert(count.summaryOwner === cap && count.summaryHold === 3 && count.dict2 === 500 && count.other === 200,
      "overflow " + JSON.stringify(count));
    assert(!await rawEntry("summary_owner_alice|url0"), "oldest receipt survived");
    assert(await rawEntry("summary_owner_alice|url1") && await rawEntry("summary_owner_alice|newest"),
      "receipt overflow evicted more than its oldest receipt");
    assert(await rawEntry("summary_hold_q0") && await rawEntry("dict2_en|word0") && await rawEntry("skim_owner_mix_0"),
      "receipt overflow evicted another pool");
  });

  // Every pool's eviction walks the ts index from its oldest entry. Receipts
  // outlive everything else there, so unless they sort after every other
  // entry each dictionary or ordinary-cache eviction would step over all of
  // them first.
  await test("other pools evict without stepping over summary receipts", async () => {
    await clearEntries();
    // Receipts saved long before anything else in the store.
    for (let i = 0; i < 300; i++) await pbpAiCacheSet("summary_owner_alice|walk" + i, i, 1 + i);
    await seed(rows("dict2_en|walk", 500, 1000));
    const dictSteps = await cursorSteps(() => pbpAiCacheSet("dict2_en|walk-newest", "new", 3000));
    await seed(rows("skim_walk_", 200, 500));
    const ordinarySteps = await cursorSteps(() => pbpAiCacheSet("ask_walk_newest", "new", 3001));
    const count = counts(await allEntries());
    assert(count.summaryOwner === 300 && count.dict2 === 500 && count.other === 200, JSON.stringify(count));
    assert(!await rawEntry("dict2_en|walk0") && !await rawEntry("skim_walk_0"), "the oldest entries were not evicted");
    assert(dictSteps < 50 && ordinarySteps < 50,
      "eviction stepped over the receipts: dictionary " + dictSteps + ", ordinary " + ordinarySteps + " steps");
  });

  await test("written and read-touched receipts sort after every ordinary entry", async () => {
    await clearEntries();
    const now = Date.now();
    await pbpAiCacheSet("summary_owner_alice|written", "r", now);
    await pbpAiCacheSet("ask_written", "a", now);
    const written = await rawEntry("summary_owner_alice|written");
    const ordinary = await rawEntry("ask_written");
    assert(written.ts > ordinary.ts, "a written receipt sorts among ordinary entries");
    // A receipt the popup reads is refreshed like any LRU entry and stays
    // past every ordinary entry, a receipt saved by an older version included.
    const twoHours = 2 * 3600000;
    await seed([
      { key: "summary_owner_alice|stale", result: "r", ts: written.ts - twoHours },
      { key: "summary_owner_alice|legacy", result: "r", ts: now - twoHours },
    ]);
    for (const key of ["summary_owner_alice|stale", "summary_owner_alice|legacy"]) {
      const before = (await rawEntry(key)).ts;
      await pbpAiCacheGet(key);
      let touched = null;
      for (let i = 0; i < 20; i++) {
        await new Promise((resolve) => setTimeout(resolve, 25));
        touched = await rawEntry(key);
        if (touched && touched.ts !== before) break;
      }
      assert(touched && touched.ts > before && touched.ts > ordinary.ts,
        key + ": read-touch " + before + " -> " + (touched && touched.ts));
    }
  });

  await test("contextual-gloss pool keeps 500 without touching neighbours", async () => {
    await clearEntries();
    await seed(rows("dictctx2_owner_", 500, 1)
      .concat(rows("skim_ctx_mix_", 200, 1001), rows("dict2_en|ctx", 500, 2001)));
    await pbpAiCacheSet("dictctx2_owner_newest", "new", 3001);
    const count = counts(await allEntries());
    assert(count.dictctx === 500 && count.other === 200 && count.dict2 === 500,
      JSON.stringify(count));
    assert(!await rawEntry("dictctx2_owner_0"), "oldest gloss survived");
    assert(await rawEntry("skim_ctx_mix_0"), "gloss overflow evicted ordinary cache");
    assert(await rawEntry("dict2_en|ctx0"), "gloss overflow evicted dict2");
  });

  await test("word-by-word gloss churn no longer evicts whole-article caches", async () => {
    await clearEntries();
    await seed(rows("tr_article_", 200, 1));
    await pbpAiCacheSet("dictctx2_owner_word", "gloss", 1001);
    const count = counts(await allEntries());
    // ZH-6: translations now sit in their own tr pool (300), doubly out of a
    // gloss write's reach -- same intent, stronger isolation.
    assert(count.tr === 200 && count.dictctx === 1 && count.other === 0, JSON.stringify(count));
    assert(await rawEntry("tr_article_0"), "a gloss write evicted a translation");
  });

  await test("other-cache overflow does not evict summary ownership receipts", async () => {
    await clearEntries();
    await seed(rows("summary_owner_bob|url", 500, 1)
      .concat(rows("ask_owner_mix_", 200, 1001)));
    await pbpAiCacheSet("skim_owner_newest", "new", 2001);
    const count = counts(await allEntries());
    assert(count.summaryOwner === 500 && count.other === 200,
      JSON.stringify(count));
    assert(await rawEntry("summary_owner_bob|url0"), "ordinary overflow evicted receipt");
    assert(!await rawEntry("ask_owner_mix_0"), "oldest ordinary cache survived");
  });

  await test("other-cache write older than every existing ts evicts itself", async () => {
    await clearEntries();
    await seed(rows("ask_existing_", 200, 100));
    await pbpAiCacheSet("skim_stale_write", "stale", 1);
    const count = counts(await allEntries());
    assert(count.other === 200 && count.dict2 === 0, JSON.stringify(count));
    assert(!await rawEntry("skim_stale_write"), "oldest new other-cache write survived");
    assert(await rawEntry("ask_existing_0"), "existing other-pool LRU head was incorrectly evicted");
  });

  await test("mixed dict2 and other quotas never evict each other", async () => {
    await clearEntries();
    await seed(rows("dict2_de|word", 500, 1).concat(rows("skim_mixed_", 200, 1001)));
    await pbpAiCacheSet("dict2_de|newest", "dict", 2001);
    let count = counts(await allEntries());
    assert(count.dict2 === 500 && count.other === 200, "dict overflow=" + JSON.stringify(count));
    assert(await rawEntry("skim_mixed_0"), "dict overflow evicted other cache");
    await pbpAiCacheSet("ask_mixed_newest", "other", 2002);
    count = counts(await allEntries());
    assert(count.dict2 === 500 && count.other === 200, "other overflow=" + JSON.stringify(count));
    assert(await rawEntry("dict2_de|newest"), "other overflow evicted dict2 cache");
  });

  await test("dictctx2 rides neither the other pool nor a dict2 slot", async () => {
    await clearEntries();
    await seed(rows("dict2_es|word", 500, 100).concat(
      [{ key: "dictctx2_oldest", result: "context", ts: 1 }], rows("gloss_ctx_", 199, 2)));
    await pbpAiCacheSet("ask_ctx_boundary", "other-200", 300);
    let count = counts(await allEntries());
    assert(count.dict2 === 500 && count.dictctx === 1 && count.other === 200,
      "boundary=" + JSON.stringify(count));
    await pbpAiCacheSet("skim_ctx_overflow", "other-201", 301);
    count = counts(await allEntries());
    assert(count.dict2 === 500 && count.dictctx === 1 && count.other === 200,
      "overflow=" + JSON.stringify(count));
    assert(await rawEntry("dictctx2_oldest"), "other-pool overflow evicted a contextual gloss");
    assert(!await rawEntry("gloss_ctx_0"), "the oldest true other entry survived");
  });

  await test("exact-form dict2 aliases each consume one of the 500 slots", async () => {
    await clearEntries();
    await seed(rows("dict2_fr|seed", 499, 1));
    await pbpAiCacheSet("dict2_fr|Défense", { same: true }, 500);
    await pbpAiCacheSet("dict2_fr|défense", { same: true }, 501);
    const count = counts(await allEntries());
    assert(count.dict2 === 500, "dict2=" + count.dict2);
    assert(await rawEntry("dict2_fr|Défense") && await rawEntry("dict2_fr|défense"), "alias missing");
    assert(!await rawEntry("dict2_fr|seed0"), "aliases did not consume separate slots");
  });

  await test("stale dict2 read-touch protects the hot record from ts-LRU eviction", async () => {
    await clearEntries();
    const stale = Date.now() - 7200000;
    await seed([
      { key: "dict2_en|hot", result: "hot", ts: stale },
      { key: "dict2_en|cold", result: "cold", ts: stale + 1 }
    ].concat(rows("dict2_en|fill", 498, stale + 2)));
    await pbpAiCacheGet("dict2_en|hot");
    let touched = null;
    for (let i = 0; i < 20; i++) {
      await new Promise((resolve) => setTimeout(resolve, 25));
      touched = await rawEntry("dict2_en|hot");
      if (touched && touched.ts > stale) break;
    }
    assert(touched && touched.ts > stale, "read-touch did not update ts");
    await pbpAiCacheSet("dict2_en|newest", "new", Date.now());
    assert(await rawEntry("dict2_en|hot"), "read-hot dict2 was evicted");
    assert(!await rawEntry("dict2_en|cold"), "older cold dict2 survived");
  });

  await test("legacy dict_ keys stay in the 200-record other pool", async () => {
    await clearEntries();
    await seed(rows("dict2_ja|word", 500, 1000).concat(
      [{ key: "dict_legacy", result: "legacy", ts: 1 }], rows("skim_legacy_fill_", 198, 2)));
    assert(!_pbpAiIsDict2Key("dict_legacy"), "legacy prefix misclassified as dict2");
    await pbpAiCacheSet("ask_legacy_boundary", "other-200", 200);
    await pbpAiCacheSet("skim_legacy_overflow", "other-201", 201);
    const count = counts(await allEntries());
    assert(count.dict2 === 500 && count.other === 200, JSON.stringify(count));
    assert(!await rawEntry("dict_legacy"), "legacy dict_ escaped the other-pool cap");
  });

  await test("full dict2 pool keeps all concurrent 2, 5, and 10 new writes", async () => {
    for (const concurrency of [2, 5, 10]) {
      await clearEntries();
      await seed(rows("dict2_concurrent|old", 500, 1));
      const keys = Array.from({ length: concurrency }, (_, i) => "dict2_concurrent|new" + i);
      await Promise.all(keys.map((key, i) => pbpAiCacheSet(key, "new", 10000 + i)));
      const count = counts(await allEntries());
      assert(count.dict2 === 500, "concurrency " + concurrency + ": " + JSON.stringify(count));
      for (const key of keys) assert(await rawEntry(key), "concurrency " + concurrency + " lost " + key);
    }
  });

  await test("full other pool keeps all concurrent 2, 5, and 10 new writes", async () => {
    for (const concurrency of [2, 5, 10]) {
      await clearEntries();
      await seed(rows("skim_concurrent_old_", 200, 1));
      const keys = Array.from({ length: concurrency }, (_, i) => "ask_concurrent_new_" + i);
      await Promise.all(keys.map((key, i) => pbpAiCacheSet(key, "new", 10000 + i)));
      const count = counts(await allEntries());
      assert(count.other === 200, "concurrency " + concurrency + ": " + JSON.stringify(count));
      for (const key of keys) assert(await rawEntry(key), "concurrency " + concurrency + " lost " + key);
    }
  });

  await test("simultaneous writes to full pools never cross-evict", async () => {
    await clearEntries();
    await seed(rows("dict2_mixed_concurrent|old", 500, 1).concat(rows("skim_mixed_concurrent_", 200, 1)));
    const dictKeys = Array.from({ length: 10 }, (_, i) => "dict2_mixed_concurrent|new" + i);
    const otherKeys = Array.from({ length: 10 }, (_, i) => "ask_mixed_concurrent_" + i);
    await Promise.all(dictKeys.map((key, i) => pbpAiCacheSet(key, "dict", 10000 + i))
      .concat(otherKeys.map((key, i) => pbpAiCacheSet(key, "other", 11000 + i))));
    const count = counts(await allEntries());
    assert(count.dict2 === 500 && count.other === 200, JSON.stringify(count));
    for (const key of dictKeys.concat(otherKeys)) assert(await rawEntry(key), "lost new mixed key " + key);
  });

  await test("empty-pool Promise.all 501 and 201 writes finish at exact caps", async () => {
    await clearEntries();
    const dictWrites = Array.from({ length: 501 }, (_, i) =>
      pbpAiCacheSet("dict2_empty|" + i, i, i + 1));
    const otherWrites = Array.from({ length: 201 }, (_, i) =>
      pbpAiCacheSet("skim_empty_" + i, i, i + 1));
    await Promise.all(dictWrites.concat(otherWrites));
    const count = counts(await allEntries());
    assert(count.dict2 === 500 && count.other === 200, JSON.stringify(count));
    assert(await rawEntry("dict2_empty|500") && await rawEntry("skim_empty_200"), "newest empty-pool writes missing");
  });

  await test("tr pool settles at its own 300 cap without touching other pools", async () => {
    await clearEntries();
    const trWrites = Array.from({ length: 301 }, (_, i) =>
      pbpAiCacheSet("tr_cap_" + i, i, i + 1));
    await Promise.all(trWrites.concat([pbpAiCacheSet("ask_cap_witness", "w", 5000)]));
    const count = counts(await allEntries());
    assert(count.tr === 300 && count.other === 1, JSON.stringify(count));
    assert(await rawEntry("tr_cap_300"), "newest tr write missing");
    assert(!await rawEntry("tr_cap_0"), "oldest tr entry survived past the cap");
  });

  await test("concurrent same-key append preserves every update while pruning its pool", async () => {
    await clearEntries();
    await seed(rows("skim_append_old_", 200, 1));
    const key = "ask_append_concurrent";
    await Promise.all(Array.from({ length: 10 }, (_, i) =>
      pbpAiCacheAppend(key, (previous) => (Array.isArray(previous) ? previous : []).concat([i]), 10000 + i)));
    const count = counts(await allEntries());
    const entry = await rawEntry(key);
    assert(count.other === 200 && count.dict2 === 0, JSON.stringify(count));
    assert(entry && entry.result.length === 10, "append updates lost: " + JSON.stringify(entry && entry.result));
    assert(new Set(entry.result).size === 10, "append values duplicated or missing");
  });

  await test("throwing append transform rolls back without changing the existing record", async () => {
    await clearEntries();
    await seed(rows("skim_rollback_old_", 199, 1).concat([
      { key: "ask_append_rollback", result: ["kept"], ts: 200 }
    ]));
    await pbpAiCacheAppend("ask_append_rollback", () => { throw new Error("stop"); }, 10000);
    const count = counts(await allEntries());
    const entry = await rawEntry("ask_append_rollback");
    assert(count.other === 200 && count.dict2 === 0, JSON.stringify(count));
    assert(entry && entry.ts === 200 && entry.result.join(",") === "kept", "append rollback changed record");
  });

  await test("pbpAiCacheStats reports exact per-pool counts and a matching total", async () => {
    await clearEntries();
    await seed(rows("dict2_en|word", 3, 1)
      .concat(rows("tr_article_", 5, 100), rows("ask_misc_", 2, 200),
        rows("summary_owner_alice|url", 4, 300), rows("summary_hold_q", 1, 400)));
    const stats = await pbpAiCacheStats();
    assert(stats
      && stats.pools.dict2 === 3 && stats.pools.tr === 5 && stats.pools.other === 2
      && stats.pools.dictctx === 0 && stats.pools["summary-owner"] === 4 && stats.pools["summary-hold"] === 1
      && stats.pools.vpunct === 0,
      JSON.stringify(stats));
    assert(stats.total === 15, "total=" + stats.total);
  });

  await test("a pool key whose next character is U+FFFF still counts in its own pool", async () => {
    await clearEntries();
    // The prefix ranges are what assign a record to a pool, for the counts
    // here and for that pool's eviction scan. An upper bound of
    // prefix + "\uffff" drops exactly the keys whose first character after the
    // prefix is U+FFFF: such a record would be filed under "other" and would
    // stay invisible to its own pool's pruning, letting the pool grow past its
    // cap. No key builder produces that shape today -- which is the point: the
    // bound is exact instead of resting on that, so a future key family cannot
    // fall out of its pool silently.
    await seed([{ key: "dict2_\uffff|ghost", result: "x", ts: 1 }]);
    const stats = await pbpAiCacheStats();
    assert(stats.pools.dict2 === 1 && stats.pools.other === 0, JSON.stringify(stats));
    assert(stats.total === 1, "total=" + stats.total);
  });

  await test("pbpAiCacheStats never serialises a URL- or account-shaped key", async () => {
    await clearEntries();
    await seed([
      { key: "tr_https://secret.example/article|en|gpt", result: "x", ts: 1 },
      { key: "summary_owner_alice|https://secret.example/article", result: "y", ts: 2 },
    ]);
    const stats = await pbpAiCacheStats();
    const serialized = JSON.stringify(stats);
    assert(!/https?:\/\//.test(serialized), "leaked a URL: " + serialized);
    assert(!serialized.includes("alice"), "leaked an account: " + serialized);
    assert(!serialized.includes("secret.example"), "leaked a hostname: " + serialized);
  });

  // Offline holds, on the real store. A save queued offline has written no
  // notes yet; its hold may only turn into the page's receipt for exactly the
  // held owner, page and notes, and is consumed whatever the outcome.
  const OWNED_URL = "https://example.com/article";
  const OWNED_NOTES = "Auto notes\n\n<blockquote>Summary</blockquote>";
  const OWNED_RANGE = { start: "Auto notes\n\n".length, end: OWNED_NOTES.length };
  const ownershipKeys = async () => (await allEntries()).map((entry) => entry.key)
    .filter((key) => key.startsWith("summary_owner_") || key.startsWith("summary_hold_"));

  await test("a held summary becomes a receipt only for the held owner, page and notes", async () => {
    for (const [label, account, url, notes, owned] of [
      ["same owner, page and notes", "alice", OWNED_URL + "#later", OWNED_NOTES, true],
      ["another owner", "bob", OWNED_URL, OWNED_NOTES, false],
      ["another page", "alice", "https://example.com/other", OWNED_NOTES, false],
      ["changed notes of the same length", "alice", OWNED_URL, OWNED_NOTES.replace("Auto", "Edit"), false],
      ["notes shorter than the range", "alice", OWNED_URL, "Auto notes", false],
      ["no owner", "", OWNED_URL, OWNED_NOTES, false],
    ]) {
      await clearEntries();
      assert(await pbpAiHoldSummaryOwnership("q-1", "alice", OWNED_URL, OWNED_NOTES, OWNED_RANGE) === true, label + ": hold not written");
      assert(await pbpAiLoadSummaryOwnership("alice", OWNED_URL, OWNED_NOTES) === null, label + ": a hold read as a receipt");
      const claimed = await pbpAiClaimSummaryOwnership("q-1", account, url, notes);
      assert(claimed === owned, label + ": claim=" + claimed);
      const keys = await ownershipKeys();
      if (owned) {
        assert(keys.length === 1 && keys[0] === pbpAiSummaryOwnershipKey("alice", OWNED_URL), label + ": records " + keys.length);
        const range = await pbpAiLoadSummaryOwnership("alice", OWNED_URL, OWNED_NOTES);
        assert(range && range.start === OWNED_RANGE.start && range.end === OWNED_RANGE.end, label + ": range " + JSON.stringify(range));
      } else {
        assert(keys.length === 0, label + ": left " + keys.length + " record(s)");
      }
    }
  });

  await test("a hold is consumed by one claim or a release and never written without an owned range", async () => {
    await clearEntries();
    await pbpAiHoldSummaryOwnership("q-2", "alice", OWNED_URL, OWNED_NOTES, OWNED_RANGE);
    assert(await pbpAiClaimSummaryOwnership("q-2", "alice", OWNED_URL, OWNED_NOTES) === true, "first claim failed");
    await pbpAiCacheDelete(pbpAiSummaryOwnershipKey("alice", OWNED_URL));
    assert(await pbpAiClaimSummaryOwnership("q-2", "alice", OWNED_URL, OWNED_NOTES) === false, "a hold was claimed twice");
    await pbpAiHoldSummaryOwnership("q-3", "alice", OWNED_URL, OWNED_NOTES, OWNED_RANGE);
    await pbpAiReleaseSummaryOwnership("q-3");
    assert(await pbpAiClaimSummaryOwnership("q-3", "alice", OWNED_URL, OWNED_NOTES) === false, "a released hold was claimed");
    for (const [label, args] of [
      ["empty range", ["q-4", "alice", OWNED_URL, OWNED_NOTES, { start: 3, end: 3 }]],
      ["range past the notes", ["q-4", "alice", OWNED_URL, OWNED_NOTES, { start: 0, end: OWNED_NOTES.length + 1 }]],
      ["fractional range", ["q-4", "alice", OWNED_URL, OWNED_NOTES, { start: 0.5, end: 4 }]],
      ["no range", ["q-4", "alice", OWNED_URL, OWNED_NOTES, null]],
      ["no owner", ["q-4", "", OWNED_URL, OWNED_NOTES, OWNED_RANGE]],
      ["no queue ID", ["", "alice", OWNED_URL, OWNED_NOTES, OWNED_RANGE]],
      ["notes not text", ["q-4", "alice", OWNED_URL, null, OWNED_RANGE]],
    ]) {
      assert(await pbpAiHoldSummaryOwnership(...args) === false, label + " was held");
    }
    assert((await ownershipKeys()).length === 0, "consumed or refused holds left records behind");
  });

  await test("holds sit in a pool of their own and never read as receipts", async () => {
    await clearEntries();
    await pbpAiHoldSummaryOwnership("q-5", "alice", OWNED_URL, OWNED_NOTES, OWNED_RANGE);
    assert(await pbpAiLoadSummaryOwnership("alice", OWNED_URL, OWNED_NOTES) === null, "a hold read as a receipt");
    await pbpAiSaveSummaryOwnership("alice", OWNED_URL, OWNED_NOTES, OWNED_RANGE);
    const count = counts(await allEntries());
    assert(count.summaryHold === 1 && count.summaryOwner === 1 && count.other === 0, JSON.stringify(count));
    const stats = await pbpAiCacheStats();
    assert(stats.pools["summary-hold"] === 1 && stats.pools["summary-owner"] === 1 && stats.pools.other === 0,
      JSON.stringify(stats.pools));
    assert(await pbpAiClaimSummaryOwnership("q-5", "alice", OWNED_URL, OWNED_NOTES) === true,
      "the receipt replaced the hold");
  });

  // A large offline Batch queues one hold per save. Holds and receipts must
  // not evict each other, and holds are not ordinary cache either.
  await test("offline holds keep a bounded pool that evicts only holds", async () => {
    const cap = _PBP_AI_SUMMARY_HOLD_MAX_ENTRIES;
    await clearEntries();
    await seed(rows("summary_owner_alice|url", 10, 1)
      .concat(rows("summary_hold_q", cap, 100), rows("ask_hold_mix_", 200, cap + 1000)));
    await pbpAiCacheSet("summary_hold_newest", "hold", cap + 5000);
    let count = counts(await allEntries());
    assert(count.summaryHold === cap && count.summaryOwner === 10 && count.other === 200,
      "hold overflow " + JSON.stringify(count));
    assert(!await rawEntry("summary_hold_q0") && await rawEntry("summary_hold_q1"), "hold overflow evicted the wrong holds");
    assert(await rawEntry("summary_owner_alice|url0"), "a hold evicted a receipt");
    await pbpAiCacheSet("skim_hold_newest", "other", cap + 6000);
    count = counts(await allEntries());
    assert(count.summaryHold === cap && count.summaryOwner === 10 && count.other === 200,
      "ordinary overflow " + JSON.stringify(count));
    assert(!await rawEntry("ask_hold_mix_0") && await rawEntry("ask_hold_mix_1"),
      "holds were counted as ordinary cache");
  });

  // Each of these swallows a platform failure and resolves as a miss. The
  // swallow has to leave a trace naming the error -- and never the account,
  // the page or the notes that the keys and records hold.
  await test("swallowed read, delete and hash failures leave a trace without account, page or notes", async () => {
    const account = "alice-private-owner";
    const url = "https://secret.example/private-article";
    const notes = "Private notes\n\n<blockquote>Private summary</blockquote>";
    const range = { start: "Private notes\n\n".length, end: notes.length };
    const key = pbpAiSummaryOwnershipKey(account, url);
    const failure = () => Object.assign(new Error("synthetic platform failure"), { name: "UnknownError" });
    const originalWarn = console.warn;
    const originalOpen = window._pbpAiOpenDB;
    const originalHash = window.pbpAiSummaryTextHash;
    const warnings = [];
    console.warn = (...args) => { warnings.push(args.map(String).join(" ")); };
    try {
      await clearEntries();
      await pbpAiSaveSummaryOwnership(account, url, notes, range);
      await pbpAiHoldSummaryOwnership("q-trace", account, url, notes, range);
      const cases = [
        ["cache read", "open", () => pbpAiCacheGet(key), (value) => value === null],
        ["cache delete", "open", () => pbpAiCacheDelete(key), (value) => value === undefined],
        ["receipt hash", "hash", () => pbpAiLoadSummaryOwnership(account, url, notes), (value) => value === null],
        ["hold hash", "hash", () => pbpAiClaimSummaryOwnership("q-trace", account, url, notes), (value) => value === false],
      ];
      for (const [label, broken, run, expected] of cases) {
        if (broken === "open") window._pbpAiOpenDB = () => Promise.reject(failure());
        else window.pbpAiSummaryTextHash = async () => { throw failure(); };
        const before = warnings.length;
        let value;
        try { value = await run(); }
        finally { window._pbpAiOpenDB = originalOpen; window.pbpAiSummaryTextHash = originalHash; }
        assert(expected(value), label + ": resolved " + JSON.stringify(value));
        const logged = warnings.slice(before);
        assert(logged.some((line) => line.includes("UnknownError") && line.includes("synthetic platform failure")),
          label + ": no trace of the failure in " + JSON.stringify(logged));
        for (const secret of [account, "secret.example", "private-article", "Private notes", "Private summary"]) {
          assert(!logged.some((line) => line.includes(secret)), label + ": the trace leaked " + secret);
        }
      }
      assert(await rawEntry(key), "a receipt whose hash failed was deleted");
    } finally {
      console.warn = originalWarn;
      window._pbpAiOpenDB = originalOpen;
      window.pbpAiSummaryTextHash = originalHash;
    }
  });

  await clearEntries();
  document.title = fail ? "FAIL ai-cache Tests" : "PASS ai-cache Tests";
})();
</script></body></html>
