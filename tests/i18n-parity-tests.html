<!doctype html>
<html><head><meta charset="utf-8"><title>i18n parity tests</title>
<style>.case{font-family:monospace;white-space:pre}.pass{color:#176}.fail{color:#b00}</style>
</head><body>
<div id="results"></div>
<script src="../i18n.js"></script>
<script>
const root = document.getElementById("results");
let pass = 0, fail = 0;
function check(name, cond, detail) {
  const ok = !!cond; ok ? pass++ : fail++;
  const div = document.createElement("div");
  div.className = "case " + (ok ? "pass" : "fail");
  div.textContent = `${ok ? "PASS" : "FAIL"}  ${name}${ok ? "" : "\n   " + (detail || "")}`;
  root.appendChild(div);
}
// load via fetch (open this file over http://, e.g. `npx serve` or VS Code Live Server,
// because file:// blocks fetch of sibling JSON in Chrome)
async function loadLocale(loc) {
  const r = await fetch(`../_locales/${loc}/messages.json`);
  return r.json();
}
(async () => {
  const LOCALES = ["en","de","fr","pl","ru","zh_HK","zh_CN","zh_TW","ja"];
  const msgs = {};
  for (const l of LOCALES) msgs[l] = await loadLocale(l);

  check("Localized help anchors classify by their actual writing system",
    typeof pbpI18nScriptFamily === "function" &&
      pbpI18nScriptFamily("AI 缓存时长（分钟）") === "cjk" &&
      pbpI18nScriptFamily("archive.org S3 Access Key（可选）") === "cjk" &&
      pbpI18nScriptFamily("API Key") === "alphabetic" &&
      pbpI18nScriptFamily("Подсказка") === "alphabetic" &&
      pbpI18nScriptFamily("プロンプト") === "cjk",
    "mixed CJK text and pure alphabetic text no longer choose distinct optical calibration families");

  check("Removed WebDAV messages stay absent in every locale",
    LOCALES.every((loc) => !Object.keys(msgs[loc]).some((key) => key.startsWith("webdav"))));
  const BACKUP_RESTORE_TITLES = {
    en: "Backup & Restore",
    de: "Sicherung & Wiederherstellung",
    fr: "Sauvegarde et restauration",
    pl: "Kopia zapasowa i przywracanie",
    ru: "Резервное копирование и восстановление",
    zh_HK: "備份與還原",
    zh_CN: "备份与恢复",
    zh_TW: "備份與還原",
    ja: "バックアップと復元",
  };
  check("Backup section titles describe file restore rather than retired remote sync",
    LOCALES.every((loc) => msgs[loc].secBackupRestore?.message === BACKUP_RESTORE_TITLES[loc]));

  // H1: AI/Jina cluster must be present and translated (≠ English) in these
  // locales — EXCEPT values that are legitimately identical to English in that
  // language (loanwords / brand tokens): "Local (Defuddle)" — "Local" is also a
  // French word + "Defuddle" is a brand; "API Key (optional)" — "API Key" is a
  // brand token and "optional" is the same word in German.
  const CLUSTER = ["secAiContentSource","aiContentSourceLocal","jinaConverting",
    "jinaCopied","jinaFailed","jinaApiKeyLabel","jinaApiKeyPlaceholder","jinaViewBtn",
    "jinaMarkdownTitle","jinaMarkdownTitleJina"];
  const SAME_AS_EN_OK = new Set(["fr.aiContentSourceLocal","de.jinaApiKeyLabel"]);
  for (const loc of ["de","fr","pl","ru","zh_HK"]) {
    for (const k of CLUSTER) {
      const en = msgs.en[k]?.message, tr = msgs[loc][k]?.message;
      check(`H1 ${loc}.${k} present`, !!tr, `${loc}.${k} missing`);
      if (!SAME_AS_EN_OK.has(`${loc}.${k}`))
        check(`H1 ${loc}.${k} translated`, tr !== en,
              `${loc}.${k} still == en: ${JSON.stringify(tr)}`);
    }
  }
  // H2: new keys exist in all locales
  for (const k of ["importSettingsTitle","jinaMdNonWebHint","popSortTitle"]) {
    for (const loc of LOCALES)
      check(`H2 ${loc}.${k} present`, !!msgs[loc][k]?.message, `${loc} missing ${k}`);
  }
  // H2: each hardcoded string is now WIRED to i18n. English literals may remain
  // as inline fallbacks (this codebase's convention: data-i18n-title fallback in
  // HTML, `t() ?? "literal"` in JS, chrome.i18n fallback in content scripts), so
  // assert the WIRING is present, not that the literal was deleted.
  const optHtml = await (await fetch("../options.html")).text();
  check('H2 options.html Import label wired to data-i18n-title',
        optHtml.includes('data-i18n-title="importSettingsTitle"'));
  const popupJs = await (await fetch("../popup.js")).text();
  check('H2 popup.js non-web hint wired to jinaMdNonWebHint key',
        popupJs.includes('jinaMdNonWebHint'));
  const sortJs = await (await fetch("../pinboard-sort.js")).text();
  check('H2 pinboard-sort.js title wired to chrome.i18n popSortTitle',
        sortJs.includes('popSortTitle'));
  const sharedJs = await (await fetch("../shared.js")).text();
  check('H2 shared.js Dismiss aria-label wired to aiErrorDismiss key',
        sharedJs.includes('aiErrorDismiss'));
  // H3: Wayback section title is its own key, distinct from the checkbox label
  for (const loc of LOCALES)
    check(`H3 ${loc}.secWayback present`, !!msgs[loc].secWayback?.message, `${loc} missing secWayback`);
  const optHtml3 = await (await fetch("../options.html")).text();
  // the section-title line must NOT still point at optWayback
  check('H3 options.html section-title uses secWayback',
        /class="section-title"[^>]*data-i18n="secWayback"/.test(optHtml3));
  check('H3 options.html no longer has section-title data-i18n="optWayback"',
        !/class="section-title"[^>]*data-i18n="optWayback"/.test(optHtml3));
  // H4: no literal U+2192 arrow in jinaAuthFailed (font-fallback risk)
  for (const loc of LOCALES)
    check(`H4 ${loc}.jinaAuthFailed has no U+2192`,
          !(msgs[loc].jinaAuthFailed?.message || "").includes("→"),
          `${loc}.jinaAuthFailed: ${JSON.stringify(msgs[loc].jinaAuthFailed?.message)}`);
  // H5: enumerate English-identical keys per locale, excluding brand/technical tokens
  const BRAND_OK = new Set([
    "extName","appName","labelUrl","labelApiKey","labelApiToken","labelBaseUrl",
    // link text that is a URL path on an English-only page — see H18
    "settingsPassword",
    "langZh","langZhTW","langZhHK","langEn","langJa","langKo","langFr","langDe","langEs","langRu",
    "provGemini","provOpenai","provClaude","provDeepseek","provQwen","provMinimax",
    "provOpenrouter","provGroq","provMistral","provCohere","provSiliconflow","provZhipu",
    "provKimi","provOllama","provCustom","provHuggingface",
    "jinaMarkdownBtn","aiContentSourceJina","secJinaReader","mdStripObsidian","tabMarkdown",
    "hintClaudeModel","hintZhipuModel","hintKimiModel","labelAiTags","placeholderTags",
    "optUrlCleanCustomPlaceholder","optUrlCleanExcludePlaceholder","customCSSPlaceholder",
    "tagPresetsPlaceholder","translateGlossaryPlaceholder","aiCancel",
    // keyboard shortcuts — same in all locales (platform keys)
    "hintCtrlEnter","aiSummaryBtnTitle",
    // pure placeholder-format strings — no translatable text
    "batchProgress",
    // loanwords / same-word in target language
    "tabPopup","tabAI","tagGovKindAi","mdOptFrontmatter","secPrompts","labelTagPrompt",
    "tabGroupAI","tabGroupSystem", // sidebar group labels: "AI" is the universal term (matches tabAI); "System" is the same word in de/pl
    "aiErrorDetails","qlSets","labelTags","aiErrorOpTags","secTags","tabTags",
    "placeholderOptional","optPopupWidth550","jinaApiKeyLabel",
    "optWaybackS3Key","optWaybackS3Secret","trViewOriginal",
    "labelNotes","tagCount","tagCountPlural","qlNotes","sepUnderscore",
    "secNotifications","qlNotesTitle","mdOptImages","aiContentSourceLocal",
    "optPopupWidth450","trProgress","labelModel","tagGovKindSeparator",
    "dictLangAuto", // loanword: "Auto" is the same in all target languages
    "vocabSortAz","vocabSortZa" // locale-neutral sort notation where the script uses Latin terms
  ]);
  for (const loc of ["de","fr","pl","ru","zh_HK"]) {
    const offenders = Object.keys(msgs.en).filter(k =>
      !BRAND_OK.has(k) &&
      msgs[loc][k]?.message != null &&
      msgs[loc][k].message === msgs.en[k].message);
    // log the worklist so the implementer sees exactly what to translate
    console.log(`H5 ${loc} untranslated (${offenders.length}):`, offenders.join(", "));
    check(`H5 ${loc} has no non-brand English-identical keys`, offenders.length === 0,
          `${offenders.length} left: ${offenders.slice(0,12).join(", ")}…`);
  }
  // H6: SHAPE + full key-set parity. A prior bulk json.dump rewrite turned
  // {"message":...} into ["message",...] and STILL passed the presence-only
  // checks + node --check. Assert every value is a {message:string} OBJECT and
  // each locale's key SET matches en exactly (no missing, no extra).
  const enKeys = Object.keys(msgs.en);
  for (const loc of LOCALES) {
    const badShape = Object.keys(msgs[loc]).filter(k => {
      const v = msgs[loc][k];
      return !v || typeof v !== "object" || Array.isArray(v) || typeof v.message !== "string";
    });
    check(`H6 ${loc} every value is {message:string}`, badShape.length === 0,
          `bad shape: ${badShape.slice(0,12).join(", ")}`);
    const missing = enKeys.filter(k => !(k in msgs[loc]));
    const extra = Object.keys(msgs[loc]).filter(k => !(k in msgs.en));
    check(`H6 ${loc} has every en key`, missing.length === 0, `missing: ${missing.slice(0,12).join(", ")}`);
    check(`H6 ${loc} has no extra keys`, extra.length === 0, `extra: ${extra.slice(0,12).join(", ")}`);
  }
  // H7: the two shortcut-help surfaces must describe the same new behavior.
  check("H7 all locales expose translation/dictionary help and the three-state view",
    LOCALES.every((loc) => msgs[loc].kbdHelpTranslate?.message &&
      msgs[loc].kbdHelpDictionary?.message && msgs[loc].kbdHelpToggleView?.message),
    "one or more shortcut-help messages are missing");
  // One key set drives BOTH surfaces (options select + md-preview gear menu);
  // the former explainTrigger* duplicates were deleted so they cannot drift.
  check("H7 selection-trigger labels name both e and d",
    LOCALES.every((loc) => {
      const message = msgs[loc].selectionTriggerHotkey?.message || "";
      return /e/.test(message) && /d/.test(message);
    }), "one or more trigger labels still describe only e");
  check("H7 explainTrigger* duplicates stay deleted",
    LOCALES.every((loc) => ["explainTriggerIcon", "explainTriggerHotkey", "explainTriggerOff"]
      .every((key) => msgs[loc][key] === undefined)),
    "a duplicate explainTrigger* key came back; md-ask.js must reuse selectionTrigger*");
  check("H8 all locales expose explain pin, unpin, close and move help",
    LOCALES.every((loc) => ["explainPin", "explainUnpin", "explainClose", "explainMoveHint"]
      .every((key) => msgs[loc][key]?.message)),
    "one or more explain window-control messages are missing");
  const VOCAB_SCALE_KEYS = ["vocabSearchPlaceholder", "vocabGroupFilterAria", "vocabAllGroups",
    "vocabSortAria", "vocabSortLatest", "vocabSortOldest", "vocabSortAz", "vocabSortZa",
    "vocabSelectionActions", "vocabSelectAll", "vocabInvertSelection", "vocabBatchActions",
    "vocabGroupNamePlaceholder", "vocabAddToGroup", "vocabBatchDelete", "vocabNoResults",
    "vocabListAria", "vocabLoadMore", "vocabReadingSection", "vocabLearningSection",
    "vocabSelectHint", "vocabResultCount", "vocabSelectedCount", "vocabBatchDeleteConfirm",
    "vocabBatchFailed", "vocabSelectionChanged", "vocabRefreshFailed", "vocabBatchDeleted",
    "vocabBatchGrouped", "vocabGroupRequired", "vocabLoading", "dictVocabEmpty", "dictPackHint"];
  check("H9 all locales expose the scalable vocabulary controls and complete status messages",
    LOCALES.every((loc) => VOCAB_SCALE_KEYS.every((key) => msgs[loc][key]?.message)),
    "one or more scalable-vocabulary messages are missing");
  const USABILITY_KEYS = ["batchResumed", "batchCancelFailed", "connectionOverviewTitle",
    "connectionOverviewHint", "connectionNeverTested", "connectionConnected", "connectionNotConnected",
    "connectionNotConfigured", "connectionPermissionMissing", "connectionLastSuccess", "connectionLastFailure",
    "connectionOverrideFailed", "testOkWithOverride", "testOverrideFailed",
    "settingsSearchLabel", "settingsSearchPlaceholder", "settingsSearchNoResults", "diagnosticsTitle",
    "diagnosticsHint", "diagnosticsCopy", "diagnosticsCopied", "diagnosticsCopyFailed",
    "libraryVocabSignedOutTitle", "libraryVocabSignedOutHint", "libraryVocabOpenSettings",
    "libraryLookupSignedOutHint", "mdPreviewClose"];
  check("H9c all locales expose batch recovery, settings search, diagnostics and signed-out recovery copy",
    LOCALES.every((loc) => USABILITY_KEYS.every((key) => msgs[loc][key]?.message)),
    "one or more usability messages are missing");
  check("H9 vocabulary placeholders keep the same runtime contract in every locale",
    LOCALES.every((loc) => ["vocabLoadMore", "vocabSelectWord", "vocabResultCount", "dictVocabEmpty",
      "vocabSelectedCount", "vocabBatchDeleteConfirm", "vocabBatchDeleted", "vocabBatchGrouped"]
      .every((key) => JSON.stringify(Object.keys(msgs[loc][key]?.placeholders || {}).sort()) ===
        JSON.stringify(Object.keys(msgs.en[key]?.placeholders || {}).sort()))),
    "one or more vocabulary messages changed its placeholder set");
  // The "does not support English lookup" clause was REMOVED on purpose: the
  // ECDICT pack supplies exactly that, so the old marker set now pins a claim
  // that would be false. What still has to hold is that this hint names both
  // Chinese scripts and English definitions, i.e. it describes CC-CEDICT's own
  // direction and does not silently start describing the other pack.
  const PACK_HINT_MARKERS = {
    en: ["Simplified", "Traditional", "English"],
    zh_CN: ["简体", "繁体", "英文"],
    zh_TW: ["簡體", "繁體", "英文"],
    zh_HK: ["簡體", "繁體", "英文"],
    ja: ["簡体字", "繁体字", "英語"],
    de: ["vereinfachte", "traditionelle", "englische"],
    fr: ["simplifiés", "traditionnels", "anglaises"],
    pl: ["uproszczonym", "tradycyjnym", "angielskie"],
    ru: ["упрощённом", "традиционном", "английские"]
  };
  check("H9 CC-CEDICT hint still states both Chinese scripts and English definitions",
    LOCALES.every((loc) => PACK_HINT_MARKERS[loc].every((marker) =>
      msgs[loc].dictPackHint.message.includes(marker))),
    "one or more dictPackHint messages stopped describing CC-CEDICT's own direction");
  // The ECDICT hint must state the opposite direction and must NOT point anyone
  // at a source for the data.
  // Compared case-insensitively: several languages inflect the adjective, so
  // "chinesische" and "Chinesisch" are the same claim.
  const ECDICT_HINT_MARKERS = {
    en: ["chinese", "english"], zh_CN: ["中文", "英文"], zh_TW: ["中文", "英文"], zh_HK: ["中文", "英文"],
    ja: ["中国語", "英"], de: ["chinesisch", "englisch"], fr: ["chinois", "anglais"],
    pl: ["chińsk", "angielsk"], ru: ["итайск", "английск"]
  };
  check("H9b ECDICT hint states the English-to-Chinese direction in every locale",
    LOCALES.every((loc) => ECDICT_HINT_MARKERS[loc].every((m) =>
      msgs[loc].ecdictHint.message.toLowerCase().includes(m.toLowerCase()))),
    "one or more ecdictHint messages stopped describing the English-to-Chinese direction");
  // chrome.i18n substitutes NAMED placeholders ($N$ backed by a placeholders
  // block), never a bare $1. A message written with $1 renders the dollar sign
  // to the user verbatim -- which is exactly what shipped in the ECDICT import
  // status until someone saw "$1 entries, imported $2" on screen.
  check("H0 no message relies on a bare $1 that chrome.i18n will never substitute",
    LOCALES.every((loc) => Object.values(msgs[loc]).every((m) => !/\$\d/.test((m && m.message) || ""))),
    "a message contains a bare $1-style token instead of a declared $NAME$ placeholder");

  // The ECDICT status line once reused dictPackEmpty, which names MDBG, CC BY-SA
  // 4.0 and .txt.gz -- all facts about the OTHER pack. Shown to a user standing
  // in front of the English-Chinese importer, it was simply wrong.
  check("H9d ECDICT status copy never borrows the other pack's source facts",
    LOCALES.every((loc) => {
      const own = [msgs[loc].ecdictEmpty, msgs[loc].ecdictHint, msgs[loc].ecdictFormatNote,
        msgs[loc].ecdictSection, msgs[loc].ecdictReady].map((m) => (m && m.message) || "").join(" ");
      return !/MDBG/i.test(own) && !/CC-CEDICT/i.test(own) && !/CC BY-SA/i.test(own) && !/\.txt\.gz/i.test(own);
    }),
    "ECDICT copy repeats MDBG / CC-CEDICT / CC BY-SA / .txt.gz, which describe the Chinese-English pack");
  // Without naming the expected columns the feature is unusable: the obvious
  // place to look is the upstream releases page, which carries only mdx, eudic,
  // stardict, mobi and sqlite builds -- none of them importable here.
  check("H9e ECDICT copy says concretely which file shape it needs",
    LOCALES.every((loc) => {
      const note = (msgs[loc].ecdictFormatNote && msgs[loc].ecdictFormatNote.message) || "";
      return /csv/i.test(note) && /word/.test(note) && /translation/.test(note) &&
        /mdx/i.test(note) && /stardict/i.test(note);
    }),
    "ECDICT copy no longer names the required columns or the formats that will not work");
  check("H9c ECDICT copy never links or recommends a data source",
    LOCALES.every((loc) => {
      const all = [msgs[loc].ecdictHint.message, msgs[loc].ecdictFormatNote.message,
        msgs[loc].ecdictSection.message, msgs[loc].ecdictEmpty.message].join(" ");
      return !/https?:\/\//.test(all) && !/github/i.test(all);
    }),
    "ECDICT copy points at a source for the data, which the licence position forbids");
  const DICT_HONESTY_KEYS = ["explainTranslateSelection", "explainTranslateLoading", "dictLoading",
    "explainAiNotConfigured", "explainTranslateAiNotConfigured", "dictMatchedHeadword",
    "dictUpdateVocab", "dictTagPinyin", "dictTagSimplified", "dictTagTraditional",
    "dictConnectRetry", "dictPermissionDenied"];
  check("H10 all locales expose action-specific and honest dictionary messages",
    LOCALES.every((loc) => DICT_HONESTY_KEYS.every((key) => msgs[loc][key]?.message)),
    "one or more action or dictionary honesty messages are missing");
  check("H10 English permission copy names the intermediary and current-dictionary miss boundary",
    /freedictionaryapi\.com/i.test(msgs.en.dictConnectHint?.message || "") &&
      /Wiktionary/i.test(msgs.en.dictConnectHint?.message || "") &&
      !/connect to Wiktionary/i.test(msgs.en.dictConnect?.message || "") &&
      /connected dictionary/i.test(msgs.en.dictNoEntry?.message || ""),
    "English copy blurs freedictionaryapi with Wiktionary or claims a global miss");
  const DICT_SEMANTIC_BOUNDARIES = {
    de: {
      connect: [/Online-Wörterbuch/i, /Zugriff|Berechtigung|erlaub|zulass|freigeb/i],
      miss: [/Online-Wörterbuch/i, /kein|nicht|nichts|ohne/i, /Eintrag|Treffer|Ergebnis|gefunden/i],
      connectedCalque: /\bverbunden(?:e|en|er|es|em)?\b/i
    },
    fr: {
      connect: [/dictionnaire en ligne/i, /accès|autorisation|autoris|permettre/i],
      miss: [/dictionnaire en ligne/i, /aucun|aucune|pas|introuvable|sans résultat|ne .* trouv/i,
        /entrée|résultat|trouv/i],
      connectedCalque: /connect(?:é|ée|és|ées)/i
    },
    pl: {
      connect: [/słownik\w* online/i, /dostęp|zezwol|zezwól|pozwol|pozwól|uprawnien/i],
      miss: [/słownik\w* online/i, /nie|brak|bez|żadn/i, /hasł|wynik|rezultat|znalezion/i],
      connectedCalque: /\bpodłączon/i
    },
    ru: {
      connect: [/онлайн-словар/i, /доступ|разреш|позвол/i],
      miss: [/онлайн-словар/i, /не|ничего|нет/i, /найден|результат|стать|совпаден/i],
      connectedCalque: /подключ[её]нн/i
    },
    ja: {
      connect: [/オンライン辞書/, /アクセス|権限|許可|利用できる/],
      miss: [/オンライン辞書/, /見つかりません|見つから|該当.*(?:なし|ありません)|結果.*(?:なし|ありません)/],
      connectedCalque: /接続中/
    }
  };
  const dictBoundaryFailures = [];
  const dictCalqueFailures = [];
  for (const [loc, contract] of Object.entries(DICT_SEMANTIC_BOUNDARIES)) {
    const connect = msgs[loc].dictConnect?.message || "";
    const miss = msgs[loc].dictNoEntry?.message || "";
    if (!contract.connect.every((pattern) => pattern.test(connect))) dictBoundaryFailures.push(`${loc}.dictConnect`);
    if (!contract.miss.every((pattern) => pattern.test(miss))) dictBoundaryFailures.push(`${loc}.dictNoEntry`);
    if (contract.connectedCalque.test(miss)) dictCalqueFailures.push(`${loc}.dictNoEntry`);
  }
  check("H11 reviewed locales preserve online-dictionary permission and miss semantics",
    dictBoundaryFailures.length === 0, `semantic boundary failed: ${dictBoundaryFailures.join(", ")}`);
  check("H11 reviewed locales reject the known literal connected-dictionary calques",
    dictCalqueFailures.length === 0, `connected calque found: ${dictCalqueFailures.join(", ")}`);
  const OPTIONS_HONESTY_KEYS = ["vocabOwnerNoAccount", "vocabLoadFailed", "vocabExportFailed",
    "vocabAccountChanged", "vocabSettingsSaveFailed", "dictEudicSupportedHint",
    "dictAnkiHostPermissionDenied", "dictAnkiConnectPermissionFailed",
    "dictAnkiConnectPermissionDenied", "dictAnkiVersionUnsupported", "dictAnkiFieldCheckFailed",
    "dictAnkiFailed", "dictEudicHostPermissionDenied", "dictEudicRejected", "dictEudicFailed",
    "dictPackImportHint", "dictPackReadFailed", "dictPackDeleteFailed"];
  check("H12 all locales expose scoped export/integration and storage-stage messages",
    LOCALES.every((loc) => OPTIONS_HONESTY_KEYS.every((key) => msgs[loc][key]?.message)),
    "one or more Options scope/error messages are missing");
  check("H12 English Options copy states account scope, all-row actions, language support, and pack formats",
    /current Pinboard account/i.test(msgs.en.vocabResultCount?.message || "") &&
      /\$OWNER\$/.test(msgs.en.vocabResultCount?.message || "") &&
      /current Pinboard account/i.test(msgs.en.dictVocabEmpty?.message || "") &&
      /\.tsv/i.test(msgs.en.dictExportTsv?.message || "") &&
      /^Send all\b/i.test(msgs.en.dictAnkiSend?.message || "") &&
      /all supported words/i.test(msgs.en.dictEudicSend?.message || "") &&
      ["en", "fr", "de", "es"].every((code) => (msgs.en.dictEudicSupportedHint?.message || "").includes(code)) &&
      /Chinese/i.test(msgs.en.dictPackSection?.message || "") && /English/i.test(msgs.en.dictPackSection?.message || "") &&
      [".txt", ".txt.gz", ".zip"].every((ext) => (msgs.en.dictPackImportHint?.message || "").includes(ext)),
    "English copy obscures scope, support, direction, or accepted formats");
  check("H12 English failure copy does not invent a 403 wait window or a single import cause",
    /token/i.test(msgs.en.dictEudicRejected?.message || "") &&
      /retry|again|later/i.test(msgs.en.dictEudicRejected?.message || "") &&
      !/\b(?:1|24)\s*(?:h|hour)/i.test(msgs.en.dictEudicRejected?.message || "") &&
      /file|format/i.test(msgs.en.dictPackFailed?.message || "") &&
      /storage/i.test(msgs.en.dictPackFailed?.message || "") &&
      msgs.en.dictPackReadFailed?.message !== msgs.en.dictPackEmpty?.message,
    "English failure copy invents a cause/window or collapses read failure into empty state");
  // The CC-CEDICT import clears the store before it writes, so its failures
  // tell THREE different stories about the pack the user already had, and only
  // the error's code knows which: dictPackFailedCleared happens after the
  // clear (it is gone), dictPackImplausible is the probe gate refusing before
  // it (it is intact), and dictPackFailed covers everything that never
  // reached the clear -- a zip that will not parse, a read error, a database
  // that will not open -- where claiming a removal would be a lie. Three
  // distinct strings per locale, and neither of the two "pack survived" ones
  // may borrow the removal wording.
  const PACK_REPLACE_KEYS = ["dictPackFailed", "dictPackFailedCleared",
    "dictPackImplausible", "dictPackReplaceConfirm"];
  const distinctPackCopy = (loc) => new Set([msgs[loc].dictPackFailed.message,
    msgs[loc].dictPackFailedCleared.message, msgs[loc].dictPackImplausible.message]).size === 3;
  check("H12b every locale tells the three import outcomes apart by what happened to the installed pack",
    LOCALES.every((loc) => PACK_REPLACE_KEYS.every((key) => msgs[loc][key]?.message)) &&
      LOCALES.every(distinctPackCopy) &&
      /remove|delete|gone/i.test(msgs.en.dictPackFailedCleared.message) &&
      /again/i.test(msgs.en.dictPackFailedCleared.message) &&
      /file|format/i.test(msgs.en.dictPackFailed.message) &&
      /storage/i.test(msgs.en.dictPackFailed.message) &&
      !/remove[ds]?\b|deleted|gone/i.test(msgs.en.dictPackFailed.message) &&
      /untouched|intact|unchanged/i.test(msgs.en.dictPackImplausible.message) &&
      !/remove[ds]?\b|deleted|gone/i.test(msgs.en.dictPackImplausible.message) &&
      /remove/i.test(msgs.en.dictPackReplaceConfirm.message),
    "import failure copy is missing, collapses two outcomes into one string, or claims the wrong fate for the installed pack");
  const ACTIONABLE_HINTS = {
    en: [
      "At the top of this page, turn “Archive saved pages to the Wayback Machine” off and back on to request permission for web.archive.org again.",
      "Modify Custom CSS to enable saving it as a reusable theme."
    ],
    de: [
      "Deaktiviere oben auf dieser Seite „Gespeicherte Seiten im Wayback Machine archivieren“ und aktiviere die Option erneut, um die Berechtigung für web.archive.org neu anzufordern.",
      "Bearbeite zuerst die eigene CSS-Überlagerung. Danach kannst du sie als Theme speichern."
    ],
    fr: [
      "En haut de cette page, désactivez puis réactivez « Archiver les pages enregistrées sur Internet Archive » pour redemander l’autorisation d’accéder à web.archive.org.",
      "Modifiez d’abord la surcouche CSS personnalisée. Vous pourrez ensuite l’enregistrer comme thème réutilisable."
    ],
    pl: [
      "U góry tej strony wyłącz, a następnie ponownie włącz opcję „Archiwizuj zapisane strony w Internet Archive”, aby ponownie poprosić o uprawnienie do web.archive.org.",
      "Najpierw zmodyfikuj niestandardową nakładkę CSS. Potem możesz zapisać ją jako motyw."
    ],
    ru: [
      "В верхней части этой страницы выключите, а затем снова включите параметр «Архивировать сохранённые страницы в Wayback Machine», чтобы повторно запросить разрешение для web.archive.org.",
      "Сначала измените пользовательское наложение CSS. После этого его можно сохранить как тему."
    ],
    zh_HK: [
      "請在本頁頂部先關閉再重新開啟「儲存頁面到互聯網檔案館」，以重新申請 web.archive.org 權限。",
      "修改自訂 CSS 疊加後，便可將它儲存為可重用的主題。"
    ],
    zh_CN: [
      "请在本页顶部关闭后重新开启「保存页面到互联网档案馆」，以重新申请 web.archive.org 权限。",
      "修改自定义 CSS 覆盖后，即可将其保存为可复用主题。"
    ],
    zh_TW: [
      "請在本頁頂端先關閉再重新開啟「儲存頁面到網際網路檔案館」，以重新申請 web.archive.org 權限。",
      "修改自訂 CSS 疊加後，即可將其儲存為可重複使用的主題。"
    ],
    ja: [
      "このページ上部で「保存したページを Wayback Machine にアーカイブする」をいったんオフにしてから再度オンにし、web.archive.org の権限を再申請してください。",
      "カスタム CSS オーバーレイを編集すると、再利用可能なテーマとして保存できます。"
    ]
  };
  const actionableFailures = LOCALES.filter((loc) =>
    msgs[loc].waybackPermDenied?.message !== ACTIONABLE_HINTS[loc][0] ||
    msgs[loc].saveAsThemeHint?.message !== ACTIONABLE_HINTS[loc][1]);
  check("H13 permission and disabled-state hints expose the exact recovery action in every locale",
    actionableFailures.length === 0, `copy mismatch: ${actionableFailures.join(", ")}`);
  const SUMMARY_MERGED = {
    en: "This summary has been merged with your notes and can no longer be removed separately.",
    de: "Die Zusammenfassung wurde mit deinen Notizen zusammengeführt und kann nicht mehr separat entfernt werden.",
    fr: "Ce résumé a été fusionné avec vos notes et ne peut plus être supprimé séparément.",
    pl: "Podsumowanie zostało połączone z notatkami i nie można go już usunąć osobno.",
    ru: "Сводка объединена с заметками, поэтому удалить её отдельно больше нельзя.",
    zh_HK: "摘要已與備註合併，無法再單獨移除。",
    zh_CN: "摘要已与备注合并，无法再单独移除。",
    zh_TW: "摘要已與備註合併，無法再單獨移除。",
    ja: "要約がメモと結合されたため、個別には削除できなくなりました。"
  };
  const mergedFailures = LOCALES.filter((loc) =>
    msgs[loc].aiSummaryMerged?.message !== SUMMARY_MERGED[loc]);
  check("H14 summary ownership loss is specific and actionable in every locale",
    mergedFailures.length === 0, `copy mismatch: ${mergedFailures.join(", ")}`);

  // Progress copy must spell an ellipsis one way. ASCII "..." and U+2026 used
  // to alternate inside a single flow (batchSaving next to batchRunningBg).
  check("H15 no locale message spells an ellipsis as three ASCII dots",
    LOCALES.every((loc) => Object.values(msgs[loc])
      .every((m) => !((m && m.message) || "").includes("..."))),
    "a message still carries ASCII '...' instead of U+2026");
  // The reader empty state is the only way out of that screen, so it has to
  // name the popup button by the label that button actually renders -- and
  // each locale translates that label differently.
  check("H16 reader empty state names the popup's own reader button",
    LOCALES.every((loc) => {
      const empty = msgs[loc].mdPreviewEmpty?.message || "";
      return empty.includes(msgs[loc].jinaMarkdownBtn?.message || "\u0000") &&
        !/Markdown/.test(empty);
    }),
    "mdPreviewEmpty points at a control name the popup never shows");
  check("H16 notes empty state does not name a retired Markdown preview page",
    LOCALES.every((loc) => !/Markdown/.test(msgs[loc].notesEmpty?.message || "")),
    "notesEmpty still names the Markdown preview page instead of the reader");
  // Settings paths must quote the sidebar tab label. "AI" is only a
  // role=presentation group heading, so a path through it is a dead pointer.
  check("H17 settings paths name the AI tab, section and button that exist",
    LOCALES.every((loc) => {
      const tab = msgs[loc].tabAI?.message || "\u0000";
      return [msgs[loc].aiErrorModelNotFoundHint, msgs[loc].jinaAuthFailed,
        msgs[loc].bgTitleSavedAiSkipped].every((m) => ((m && m.message) || "").includes(tab)) &&
        (msgs[loc].jinaAuthFailed?.message || "").includes(msgs[loc].secJinaReader?.message || "\u0000") &&
        (msgs[loc].bgTitleSavedAiSkipped?.message || "").includes(msgs[loc].testConnection?.message || "\u0000");
    }),
    "a settings path names a sidebar entry that does not exist");
  // The login link text is a URL path on an English-only page, so it is not
  // localizable content -- and options.html already prints it raw.
  check("H18 the Pinboard token link text stays an untranslated URL path",
    LOCALES.every((loc) => msgs[loc].settingsPassword?.message === "pinboard.in/settings/password"),
    "settingsPassword was translated again");
  // libraryTitle is the page's own name, so the Chinese locales carry exactly
  // one word for the vocabulary book.
  check("H19 Chinese locales use libraryTitle's vocabulary name everywhere",
    ["zh_CN", "zh_TW", "zh_HK"].every((loc) => Object.values(msgs[loc])
      .every((m) => !/生词库|生詞庫/.test((m && m.message) || ""))),
    "a Chinese message still calls the vocabulary book 生词库/生詞庫");
  // German keeps one register. Formal address surfaces as capitalised
  // Ihr*/Ihnen, or as "Sie" mid-sentence -- third-person "sie" is lower case
  // there, so a capitalised one can only be the polite form.
  check("H20 German copy stays in the informal register",
    Object.values(msgs.de).every((m) => {
      const text = (m && m.message) || "";
      return !/\bIhr(?:e|em|en|er|es)?\b|\bIhnen\b/.test(text) && !/[a-zäöüß,]\s+Sie\b/.test(text);
    }),
    "a German message switched back to the formal Sie/Ihr address");

  // H21: options.js rebuilds the <code> chips applyI18n strips (it assigns
  // textContent) by searching the TRANSLATED hint for the literal it captured
  // from the English markup. That only works while the literal is written
  // verbatim in every locale -- the convention batchTagsHint and
  // settingsPassword already follow, and the one tagPresetsHint broke by
  // translating its own example ("名称: 标签1, 标签2, 标签3"), which silently
  // left the chip as plain text in eight of nine locales. Derived from
  // options.html and the locale files, so a new chip is covered without
  // touching this check, and a future copy edit that translates one is caught.
  {
    const chipHtml = await (await fetch("../options.html")).text();
    const hosts = [...chipHtml.matchAll(/<([a-z]+)[^>]*\bdata-i18n="([A-Za-z0-9_]+)"[^>]*>([\s\S]*?)<\/\1>/g)];
    const unwrap = (s) => s.replace(/&quot;/g, '"').replace(/&amp;/g, "&")
      .replace(/&lt;/g, "<").replace(/&gt;/g, ">");
    const chipKeys = new Map();
    for (const [, , key, inner] of hosts) {
      const codes = [...inner.matchAll(/<code>([\s\S]*?)<\/code>/g)].map((m) => unwrap(m[1]));
      if (codes.length) chipKeys.set(key, codes);
    }
    const chipOffenders = [];
    for (const [key, codes] of chipKeys) {
      for (const loc of LOCALES) {
        const msg = msgs[loc][key]?.message;
        if (typeof msg !== "string") { chipOffenders.push(`${loc}.${key} absent`); continue; }
        for (const lit of codes) {
          if (!msg.includes(lit)) chipOffenders.push(`${loc}.${key}: ${lit}`);
        }
      }
    }
    check("H21 every options.html code chip literal survives verbatim in all nine locales",
      chipKeys.size > 0 && chipOffenders.length === 0,
      chipKeys.size === 0 ? "the chip scan found no [data-i18n] <code> host at all"
        : `chip lost: ${chipOffenders.slice(0, 12).join(", ")}`);
  }

  // A slower refresh for the old language must not overwrite the mirror after
  // a newer refresh has already selected and loaded another locale.
  const previousChrome = globalThis.chrome;
  const previousFetch = globalThis.fetch;
  const previousMessages = _i18nMessages;
  const previousLang = localStorage.getItem("pp-i18n-lang");
  const previousMirror = localStorage.getItem("pp-i18n-msgs");
  const pending = {};
  const reads = ["de", "fr"];
  try {
    globalThis.chrome = {
      storage: { local: { get: async () => ({ optLang: reads.length ? reads.shift() : "fr" }) } },
      runtime: { getURL: (path) => path },
      i18n: { getMessage: () => "", getUILanguage: () => "en" },
    };
    globalThis.fetch = (url) => new Promise((resolve) => { pending[url] = resolve; });
    _i18nMessages = null;
    localStorage.setItem("pp-i18n-lang", "auto");
    localStorage.removeItem("pp-i18n-msgs");
    const oldRefresh = _refreshI18nAsync();
    await Promise.resolve();
    const newRefresh = _refreshI18nAsync();
    await Promise.resolve();
    pending["_locales/fr/messages.json"]({
      ok: true,
      json: async () => ({ marker: { message: "fr" } }),
    });
    await newRefresh;
    pending["_locales/de/messages.json"]({
      ok: true,
      json: async () => ({ marker: { message: "de" } }),
    });
    await oldRefresh;
    check("i18n refresh discards a late response for an older language",
      localStorage.getItem("pp-i18n-lang") === "fr" &&
      _i18nMessages?.marker?.message === "fr");

    // A storage change can arrive without another refresh call (for example
    // Chrome Sync updating optLang while this page is fetching messages).
    // Re-read before commit so that response cannot resurrect the old locale.
    let currentStoredLang = "de";
    globalThis.chrome.storage.local.get = async () => ({ optLang: currentStoredLang });
    globalThis.fetch = (url) => new Promise((resolve) => { pending[url] = resolve; });
    localStorage.setItem("pp-i18n-lang", "fr");
    _i18nMessages = { marker: { message: "fr" } };
    const storageRaceRefresh = _refreshI18nAsync();
    await Promise.resolve();
    currentStoredLang = "fr";
    pending["_locales/de/messages.json"]({
      ok: true,
      json: async () => ({ marker: { message: "de" } }),
    });
    await storageRaceRefresh;
    check("i18n refresh rechecks storage before committing fetched messages",
      localStorage.getItem("pp-i18n-lang") === "fr" &&
      _i18nMessages?.marker?.message === "fr");
  } finally {
    globalThis.chrome = previousChrome;
    globalThis.fetch = previousFetch;
    _i18nMessages = previousMessages;
    if (previousLang === null) localStorage.removeItem("pp-i18n-lang");
    else localStorage.setItem("pp-i18n-lang", previousLang);
    if (previousMirror === null) localStorage.removeItem("pp-i18n-msgs");
    else localStorage.setItem("pp-i18n-msgs", previousMirror);
  }
  console.log(`PASS ${pass} | FAIL ${fail}`);
})();
</script></body></html>
