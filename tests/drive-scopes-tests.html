    notesSnapshot: snapshotOf({ states: [accountRow("google-a", { lastError: "corrupt" })] })
  });
  st = await sh.status();
  check("data-layer errors stay on their own dataset rows with their own retry state", probe(() =>
    st.vocabulary.lastError === "unexpected" && st.vocabulary.retryAt === 7000 && st.vocabulary.blocked === false &&
    st.notes.lastError === "corrupt" && st.notes.blocked === true && st.notes.retryAt === null && st.connection.lastError === null));
  // Simplest miss: treat every preflight code as connection-layer, so the notes block moves into the connection row.

  sh = statusHarness(source, {
    local: { driveConnectionAccount: { permissionId: "google-a", emailAddress: "a@example.test", displayName: "A" } },
    vocabSnapshot: snapshotOf({ states: [accountRow("google-old", { lastSuccessAt: 500 }), accountRow("google-a", { lastSuccessAt: 100, lastError: "remote" })],
      batches: [batchRow("google-old", "f1")] })
  });
  st = await sh.status();
  check("status reads the connected Google account's row before a newer one (A2)", probe(() =>
    st.vocabulary.lastSuccessAt === 100 && st.vocabulary.lastError === "remote" && st.vocabulary.hasPending === false));
  // Simplest miss: keep choosing the newest row -- reports 500, no error, and counts google-old's frozen batch as pending.
  sh = statusHarness(source, { local: { driveConnectionAccount: { permissionId: "google-z" } },
    vocabSnapshot: snapshotOf({ states: [accountRow("google-old", { lastSuccessAt: 100 }), accountRow("google-new", { lastSuccessAt: 200 })] }) });
  st = await sh.status();
  check("without a row for the connected account status falls back to the newest row", probe(() => st.vocabulary.lastSuccessAt === 200));
  // Simplest miss: return an empty row when the A2 match fails, which reports "never synced".
  sh = statusHarness(source, { local: { driveConnectionAccount: { permissionId: "google-a" } },
    vocabSnapshot: snapshotOf({ states: [accountRow("google-a")], batches: [batchRow("google-a", "f2")] }) });
  st = await sh.status();
  check("a frozen batch counts as pending even with an empty outbox", probe(() => st.vocabulary.hasPending === true && st.hasPending === true && st.notes.hasPending === false));
  // Simplest miss: hasPending = outbox.length > 0, so the "unsent changes" line disappears once the outbox is frozen.

  // ---- Task 4: status read failures ----
  sh = statusHarness(source, { notesSnapshotError: true, vocabSnapshot: snapshotOf({ outbox: [vocabOutbox("word")] }) });
  st = await sh.status();
  check("a failed notes read reports status_unavailable on notes only and borrows no block", probe(() =>
    st.notes.lastError === "status_unavailable" && st.notes.blocked === false && st.notes.retryAt === null &&
    st.vocabulary.lastError === null && st.vocabulary.hasPending === true && sh.warnings.some((line) => line.includes("notes storage unavailable"))));
  // Simplest miss: map the failed read to local_store + blocked, whose hint names a button that cannot clear it.
  sh = statusHarness(source, { vocabSnapshotError: true, notesSnapshot: snapshotOf({ outbox: [{ owner: "acct_alice", recordKey: "pbp_hl_abcd|n1" }] }) });
  st = await sh.status();
  check("a failed vocabulary read keeps the notes row healthy", probe(() =>
    st.vocabulary.lastError === "status_unavailable" && st.vocabulary.blocked === false && st.notes.lastError === null && st.notes.hasPending === true));
  // Simplest miss: mark both datasets unavailable whenever any single read fails.
  sh = statusHarness(source, { vocabPreflightError: true,
    vocabSnapshot: snapshotOf({ states: [accountRow("google-a", { lastSuccessAt: 100, lastError: "unexpected", retryAttempt: 2, retryAt: Date.UTC(2026, 9, 1) })] }) });
  st = await sh.status();
  check("an unreadable preflight neither blocks nor promises the account row's stale retry", probe(() =>
    st.vocabulary.lastError === "status_unavailable" && st.vocabulary.blocked === false && st.vocabulary.retryAt === null && st.vocabulary.lastSuccessAt === 100));
  // Simplest miss: fall back to the account row when the preflight is unreadable, showing a "next retry" that is not scheduled.
  sh = statusHarness(source, { vocabSnapshotError: true, vocabPreflight: preflightRow("corrupt", { blocked: true }) });
  st = await sh.status();
  check("a readable blocked data-layer preflight survives a snapshot read failure", probe(() => st.vocabulary.lastError === "corrupt" && st.vocabulary.blocked === true));
  // Simplest miss: always replace the row with status_unavailable on any failed read, hiding a real block.
  sh = statusHarness(source, { vocabSnapshotError: true, vocabPreflight: preflightRow("auth", { blocked: true }) });
  st = await sh.status();
  check("a readable legacy connection-layer preflight does not survive as a dataset error", probe(() =>
    st.vocabulary.lastError === "status_unavailable" && st.vocabulary.blocked === false && st.connection.lastError === null));
  // Simplest miss: "preflight readable and has lastError -> keep it" without layer filtering, so auth lands on the vocabulary row.
  sh = statusHarness(source, { connectionError: true, vocabSnapshot: snapshotOf({ states: [accountRow("google-a")] }) });
  st = await sh.status();
  check("an unreadable connection record makes both datasets status_unavailable instead of healthy", probe(() =>
    st.connection.lastError === null && st.vocabulary.lastError === "status_unavailable" && st.notes.lastError === "status_unavailable" &&
    st.vocabulary.blocked === false && sh.warnings.some((line) => line.includes("connection state unavailable"))));
  // Simplest miss: treat a failed connection read as "no error", painting an unknown state as connected and healthy.

  // ---- Task 4: disconnected device and identity ----
  sh = statusHarness(source, { connected: false, notesSnapshotError: true,
    local: { driveConnectionAccount: { permissionId: "google-a", emailAddress: "a@example.test" } },
    vocabSnapshot: snapshotOf({ states: [accountRow("google-a", { lastError: "corrupt" })] }), vocabPreflight: preflightRow("corrupt", { blocked: true }),
    connectionState: { lastError: "auth", authAttempts: 5, retryAttempt: 0, retryAt: null, blocked: true, updatedAt: 1 } });
  st = await sh.status();
  check("a disconnected device shows no dataset error, no connection error and no Google identity", probe(() =>
    st.connected === false && st.connection.lastError === null && st.connection.blocked === false &&
    st.vocabulary.lastError === null && st.vocabulary.blocked === false && st.notes.lastError === null &&
    ["drivePermissionId", "emailAddress", "displayName"].every((key) => !Object.hasOwn(st, key))));
  // Simplest miss: read driveConnState regardless of connected, so the old auth block still says "needs re-authorization" after disconnect.
  sh = statusHarness(source, { local: { driveConnectionAccount: { permissionId: "google-a", emailAddress: "current@example.test", displayName: "Current" } },
    vocabSnapshot: snapshotOf({ states: [accountRow("google-previous", { emailAddress: "previous@example.test", lastSuccessAt: 900 })] }) });
  st = await sh.status();
  check("connected status names the Google account from the connection record over dataset history", probe(() =>
    st.drivePermissionId === "google-a" && st.emailAddress === "current@example.test" && st.displayName === "Current"));
  // Simplest miss: prefer the newest dataset row's identity, which shows the previous Google account after a reconnect.
  sh = statusHarness(source, {
    vocabSnapshot: snapshotOf({ states: [accountRow("google-old", { emailAddress: "old@example.test", lastSuccessAt: 100 })] }),
    notesSnapshot: snapshotOf({ states: [accountRow("google-recent", { emailAddress: "recent@example.test", lastSuccessAt: 200 })] }) });
  st = await sh.status();
  check("a legacy connection without a connection record uses the most recent dataset account", probe(() =>
    st.drivePermissionId === "google-recent" && st.emailAddress === "recent@example.test"));
  // Simplest miss: fall back to the vocabulary row only, ignoring a newer notes account.

  // ---- Task 4: action response (spec §6.2, A28) ----
  sh = statusHarness(source);
  let resp = await sh.response({ ok: false, error: "waiting_for_retry", results: {
    vocabulary: { ok: true, status: { waitingForRetry: true, retryAt: 5000 } }, notes: { ok: true, changed: false, status: { lastSuccessAt: 1 } } } });
  const okWaiting = await sh.response({ ok: true, waitingForRetry: true, results: { vocabulary: { ok: true }, notes: { ok: true } } });
  check("an action in backoff carries waitingForRetry at the top level only", probe(() =>
    resp.ok === false && resp.waitingForRetry === true && typeof resp.status === "object" &&
    JSON.stringify(resp.results) === JSON.stringify({ vocabulary: { ok: true }, notes: { ok: true } }) &&
    okWaiting.ok === true && okWaiting.waitingForRetry === true));
  // Simplest miss: keep waitingForRetry inside results.vocabulary, so the page's top-level check never sees it and flashes "Synced".
  resp = await sh.response({ ok: false, error: "network", retryable: true, results: {
    vocabulary: { ok: false, error: "network", retryable: true }, notes: { ok: false, error: "network" } } });
  check("connection-layer failures appear only at the top of the action response", probe(() =>
    resp.error === "network" && !Object.hasOwn(resp, "retryable") &&
    JSON.stringify(resp.results) === JSON.stringify({ vocabulary: { ok: false }, notes: { ok: false } })));
  // Simplest miss: pass results[type].error through, so the page renders two subject-prefixed "network" rows.
  resp = await sh.response({ ok: false, error: "corrupt", results: {
    vocabulary: { ok: true, changed: true }, notes: { ok: false, error: "corrupt", retryable: false, status: { remoteBody: "must not escape" } } } });
  check("data-layer results stay per dataset with nothing but ok and error", probe(() =>
    resp.error === "corrupt" && !Object.hasOwn(resp, "waitingForRetry") &&
    JSON.stringify(resp.results) === JSON.stringify({ vocabulary: { ok: true }, notes: { ok: false, error: "corrupt" } })));
  // Simplest miss: strip every per-dataset error, so a notes block loses its subject line.
  resp = await sh.response({ ok: true, results: { vocabulary: { ok: true }, notes: { ok: true } } });
  check("a successful round answers ok with no error or waitingForRetry keys", probe(() =>
    resp.ok === true && !Object.hasOwn(resp, "error") && !Object.hasOwn(resp, "waitingForRetry") && typeof resp.status === "object"));
  // Simplest miss: always emit waitingForRetry:false / error:undefined, which breaks `"waitingForRetry" in response` consumers.

  // ---- Task 4: Connect (spec §3.5, A4, §10.6, §10.8) ----
  // Shared records as Task 2's runner writes them.
  const connRecord = (patch) => ({ lastError: "auth", authAttempts: 5, retryAttempt: 0, retryAt: null, blocked: true, updatedAt: 1, ...patch });
  // A blocked grant on record: the clear-before-authorize branch would run if the permission check came second.
  let ch = connectHarness(source, { connected: true, permissionGranted: false, connectionState: connRecord() });
  let connectResult = await ch.connect();
  check("Connect checks optional permissions first and, when they are gone, only marks the device disconnected", probe(() =>
    connectResult.error === "permission" && JSON.stringify(ch.order) === JSON.stringify(["set:vocabDriveConnected"]) &&
    ch.local.vocabDriveConnected === false));
  // Simplest misses: clear Chrome's token cache before the permission check, so a denied grant still wipes
  // tokens; or return permission without the flag write the handler used to do (spec §10.8 keeps it).
  const resetOrders = [];
  for (const record of [connRecord(), connRecord({ lastError: "permission", authAttempts: 0 })]) {
    ch = connectHarness(source, { connected: true, connectionState: record });
    await ch.connect();
    resetOrders.push(JSON.stringify(ch.order.slice(0, 3)));
  }
  check("re-authorizing after an auth block or a refused permission clears Chrome's token cache and the identity cache before the interactive grant", probe(() =>
    resetOrders.length === 2 && resetOrders.every((order) => order === JSON.stringify(["clear-all", "forget:0", "authorize"]))));
  // Simplest miss: clear after connect() returns, so Chrome hands back the stale token and no prompt appears.
  const keptOrders = [];
  for (const record of [null, connRecord({ lastError: "network", authAttempts: 0, retryAttempt: 2, retryAt: 9000, blocked: false }),
    connRecord({ authAttempts: 2, retryAttempt: 2, retryAt: 9000, blocked: false })]) {
    ch = connectHarness(source, { connected: true, connectionState: record });
    await ch.connect();
    keptOrders.push(ch.order[0] === "authorize" && !ch.order.includes("clear-all") && !ch.order.some((step) => step.startsWith("forget")));
  }
  check("a connected device that is healthy or only backing off re-authorizes without wiping tokens", probe(() =>
    keptOrders.length === 3 && keptOrders.every(Boolean)));
  // Simplest misses (spec §10.6): keep the old "connected -> clear" guard, so one interactive network failure
  // after a wipe leaves only "OAuth2 not granted or revoked." for the next silent mint; or key on lastError
  // "auth" without blocked, so an auth backoff that would recover on its own also loses its grant.
  ch = connectHarness(source, { connected: false });
  await ch.connect();
  check("a first-time Connect authorizes without wiping tokens", probe(() => ch.order[0] === "authorize" && !ch.order.includes("clear-all") && !ch.order.some((step) => step.startsWith("forget"))));
  // Simplest miss: clear whenever the device is not connected yet, resetting this extension's Identity API state on a first Connect.
  ch = connectHarness(source, { connected: true, authorization: { ok: false, error: "auth", retryable: false } });
  connectResult = await ch.connect();
  check("a non-retryable authorization failure clears the connected flag and queues no round", probe(() =>
    connectResult.error === "auth" && ch.local.vocabDriveConnected === false && ch.rounds.length === 0));
  // Simplest miss: leave the flag set, so the panel keeps saying "connected" for a revoked grant.
  ch = connectHarness(source, { connected: true, authorization: { ok: false, error: "auth", retryable: true } });
  connectResult = await ch.connect();
  check("a retryable authorization failure keeps the device connected", probe(() =>
    connectResult.error === "auth" && ch.local.vocabDriveConnected === true && ch.rounds.length === 0));
  // Simplest miss: ignore retryable and clear on any auth, so the next retry alarm returns early as not connected.
  ch = connectHarness(source, { connected: true, authorization: { ok: false, error: "permission", retryable: false } });
  await ch.connect();
  check("cancelling the Google prompt on a connected device turns it disconnected", probe(() => ch.local.vocabDriveConnected === false));
  // Simplest miss: clear only for "auth", so a cancelled prompt ("permission") leaves a connected device that cannot mint.
  ch = connectHarness(source, { connected: true, round: { ok: false, error: "corrupt", results: { vocabulary: { ok: true }, notes: { ok: false, error: "corrupt" } } } });
  connectResult = await ch.connect();
  check("a notes failure in the forced round keeps the device connected (A4)", probe(() =>
    ch.local.vocabDriveConnected === true && connectResult.results?.notes?.error === "corrupt"));
  // Simplest miss: clear the flag whenever the combined result fails.
  ch = connectHarness(source, { connected: true, round: { ok: false, error: "auth", retryable: false, results: { vocabulary: { ok: false }, notes: { ok: false } } } });
  await ch.connect();
  check("an auth block reached by the round itself does not clear the connected flag", probe(() => ch.local.vocabDriveConnected === true));
  // Simplest miss: keep the old handler rule (auth/permission && !retryable -> clear) applied to the round result.
  ch = connectHarness(source);
  await ch.connect();
  const setAt = ch.order.indexOf("set:driveConnectionAccount+vocabDriveConnected");
  check("Connect broadcasts PBP_DRIVE_CONNECT_AUTHORIZED with the owner after writing the connection and before the round", probe(() =>
    setAt >= 0 && setAt < ch.order.indexOf("broadcast") && ch.order.indexOf("broadcast") < ch.order.indexOf("round") &&
    JSON.stringify(ch.messages) === JSON.stringify([{ type: "PBP_DRIVE_CONNECT_AUTHORIZED", owner: "acct_alice" }])));
  // Simplest miss: broadcast after the round returns, so the 15-second slow-authorization hint fires long after the grant.
  check("Connect observes the identity before persisting it and queues exactly one forced manual round", probe(() =>
    ch.order.indexOf("observe:google-a") >= 0 && ch.order.indexOf("observe:google-a") < setAt &&
    JSON.stringify(ch.rounds) === JSON.stringify([{ interactive: false, force: true, manual: true }])));
  // Simplest miss: omit manual:true, so a block found right after Connect raises a system notification.

  // ---- Task 4: Disconnect (spec §3.5) ----
  let dh = disconnectHarness(source);
  const disc = await dh.disconnect();
  check("disconnect invalidates runs and writes disconnected before clearing Chrome's token cache", probe(() =>
    disc?.ok === true && dh.epoch() === 1 && dh.order.includes("clear-all:false") &&
    dh.order.indexOf("clear-all:false") < dh.order.indexOf("permissions-remove")));
  // Simplest miss: clear tokens after permissions.remove, when the identity namespace no longer exists.
  check("disconnect never mints a token, so a hung getAuthToken cannot stall it", probe(() =>
    disc !== "timeout" && !dh.order.includes("mint") && !dh.order.includes("remove-token")));
  // Simplest miss: keep the silent getAuthToken -> removeCachedAuthToken pair, which hangs while OAuth is unreachable.
  check("disconnect forgets every cached Drive identity", probe(() => dh.order.includes("forget:0")));
  // Simplest miss: clear Chrome's tokens but keep the module token->identity cache, so a reconnect trusts stale mappings.
  check("disconnect clears drive alarms and the connection identity but keeps local data and the connection state", probe(() =>
    dh.order.includes("clear-alarms") && !Object.hasOwn(dh.local, "driveConnectionAccount") &&
    dh.local.pbp_hl_local?.note === "Keep local notes" && dh.local["driveConnState:" + OWNER_HASH]?.lastError === "network"));
  // Simplest miss: remove every drive* key on disconnect, losing driveConnState that only a forced reconnect may clear (§3.3).
  dh = disconnectHarness(source, { identityMissing: true });
  const discMissing = await dh.disconnect();
  check("disconnect without the identity namespace still completes and leaves a trace", probe(() =>
    discMissing?.ok === true && dh.local.vocabDriveConnected === false && dh.order.includes("permissions-remove") &&
    dh.warnings.some((line) => line.includes("clearAllCachedAuthTokens"))));
  // Simplest miss: chrome.identity?.clearAllCachedAuthTokens?.() -- completes, but silently (MV3 rule: swallowed errors must be logged).
  dh = disconnectHarness(source, { statusError: true });
  const discNoStatus = await dh.disconnect();
  check("disconnect answers ok even when the follow-up status read fails", probe(() =>
    discNoStatus?.ok === true && !Object.hasOwn(discNoStatus, "status") && dh.warnings.some((line) => line.includes("status unavailable"))));
  // Simplest miss: `status: await pbpGetVocabDriveStatus()` unguarded, reporting a finished disconnect as a remote error.

  // ---- Task 4: connection identity refresh (Task 3's function, locked from this side) ----
  // Task 3's suite already covers the notes-path write and the post-run switch through its round harness;
  // these three pin what that harness cannot reach: no observation on mismatch, the epoch re-check, the exemption.
  const pinboardAuth = { account: "alice", epoch: 1 };
  let rh = refreshHarness(source, { identity: { ok: true, permissionId: "google-third", emailAddress: "third@example.test" } });
  let refreshed = await rh.refresh("vocabulary", pinboardAuth, { drivePermissionId: "google-new" });
  check("identity refresh rejects a Google switch observed after the run without observing it", probe(() =>
    refreshed.error === "account_changed" && rh.local.driveConnectionAccount.permissionId === "google-previous" && rh.observed.length === 0));
  // Simplest miss: observe about()'s answer before comparing it to the run's confirmed permissionId, moving the verified identity anyway.
  rh = refreshHarness(source, { duringAbout: (api) => api.bumpEpoch() });
  refreshed = await rh.refresh("vocabulary", pinboardAuth, { drivePermissionId: "google-new" });
  check("identity refresh is dropped when a disconnect moves the epoch during verification", probe(() =>
    refreshed.error === "account_changed" && rh.local.driveConnectionAccount.permissionId === "google-previous" && rh.observed.length === 0));
  // Simplest miss: snapshot the epoch after about() returns, so a Disconnect during verification still writes the old identity back.
  rh = refreshHarness(source);
  await rh.refresh("vocabulary", pinboardAuth, { drivePermissionId: "google-new" });
  check("identity refresh observes the verified identity once, exempting the session that just finished", probe(() =>
    rh.observed.length === 1 && rh.observed[0][0] === "google-new" && rh.observed[0][1] === true));
  // Simplest miss: pass the dataset type string as the second argument -- truthy, but not the exemption contract Task 3 defined.
  document.getElementById("summary").textContent = `pass=${pass} fail=${fail}`;
})();
</script></body></html>
