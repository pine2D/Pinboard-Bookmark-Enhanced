<script>
let pass = 0, fail = 0;
function check(name, ok) { ok ? pass++ : fail++; const el = document.createElement("div"); el.className = "case " + (ok ? "pass" : "fail"); el.textContent = name; document.getElementById("results").append(el); }
const EXT_ID = "abcdefghijklmnopabcdefghijklmnop";
const EXT_SENDER = { id: EXT_ID, url: `chrome-extension://${EXT_ID}/options.html` };
const CAPABLE_MANIFEST = {
  manifest_version: 3, name: "test", version: "0.0.0",
  optional_permissions: ["identity"],
  optional_host_permissions: ["https://*/*"],
  oauth2: { client_id: "1234567890-active.apps.googleusercontent.com", scopes: ["https://www.googleapis.com/auth/drive.appdata"] }

const HASH = "a".repeat(64), CONN_KEY = "driveConnState:" + HASH, OWNER_HASH = HASH;
const DRIVE_ALARMS = ["drive-sync-dirty", "drive-sync-periodic", "drive-sync-retry"];
const blockedRow = (code) => ({ key: "preflight:" + HASH, ownerHash: HASH, retryAttempt: 0, retryAt: null, lastError: code, blocked: true });
const backoffRow = (code, retryAt) => ({ key: "preflight:" + HASH, ownerHash: HASH, retryAttempt: 1, retryAt, lastError: code, blocked: false });
const connRow = (patch) => ({ lastError: "network", authAttempts: 0, retryAttempt: 1, retryAt: null, blocked: false, updatedAt: 1, ...patch });
const settle = (promise) => Promise.resolve(promise).catch((error) => ({ thrown: String(error?.message || error) }));
const withTimeout = (promise, ms = 1000) => Promise.race([settle(promise), new Promise((resolve) => setTimeout(() => resolve("timeout"), ms))]);
const probe = (assertion) => { try { return assertion() === true; } catch (_) { return false; } };
const accountRow = (permissionId, patch = {}) => ({ key: "account:" + permissionId + ":" + OWNER_HASH, drivePermissionId: permissionId,
  ownerHash: OWNER_HASH, emailAddress: permissionId + "@example.test", displayName: "", bootstrapComplete: true, pageToken: "42",
  lastSuccessAt: 100, lastError: null, retryAttempt: 0, retryAt: null, ...patch });
const preflightRow = (lastError, patch = {}) => ({ key: "preflight:" + OWNER_HASH, ownerHash: OWNER_HASH, retryAttempt: 0, retryAt: null, lastError, blocked: false, ...patch });
const snapshotOf = (patch = {}) => ({ states: [], outbox: [], batches: [], notices: [], ...patch });
const vocabOutbox = (term) => ({ key: "outbox:acct_alice:en|" + term, owner: "acct_alice", recordKey: "en|" + term });
const batchRow = (permissionId, fileId) => ({ key: "batch:" + permissionId + ":" + OWNER_HASH + ":" + fileId, drivePermissionId: permissionId, ownerHash: OWNER_HASH, driveFileId: fileId });

let driveSw = null, realSwFns = null, activeCtx = null;
const clientSlotConfigs = [], runnerConfigs = {};

async function ensureDriveSw() {
  if (driveSw) return driveSw;
  driveSw = await pbpSwRealm.boot({
    mock: {
      id: EXT_ID,
      manifest: CAPABLE_MANIFEST,
      storage: { local: { vocabDriveConnected: false, _driveScopeKeysRetiredDone: true } },
      permissions: { permissions: ["identity"], origins: ["https://www.googleapis.com/*"] },
    },
    beforeBackground(win) {
      win.pbpCreateDriveClient = (clientOpts = {}) => {
        const slot = clientSlotConfigs.push(clientOpts) - 1;
        return {
          connect: (...a) => activeCtx.clientForSlot(slot).connect(...a),
          about: (...a) => activeCtx.clientForSlot(slot).about(...a),
          openSession: (...a) => activeCtx.clientForSlot(slot).openSession(...a),
        };
      };
      for (const [fnName, type] of [["pbpCreateNotesSyncStore", "notes"], ["pbpCreateDictArchiveStore", "dictionary"], ["pbpCreateAskArchiveStore", "ask"]]) {
        win[fnName] = () => ({
          getPreflightState: (...a) => activeCtx.stores[type].getPreflightState(...a),
          deletePreflightState: (...a) => activeCtx.stores[type].deletePreflightState(...a),
          putAccountState: (...a) => activeCtx.stores[type].putAccountState(...a),

      }
      for (const [fnName, type] of [["pbpCreateDriveSyncRunner", "vocabulary"], ["pbpCreateNotesDriveSyncRunner", "notes"], ["pbpCreateDictArchiveDriveSyncRunner", "dictionary"], ["pbpCreateAskArchiveDriveSyncRunner", "ask"]]) {
        win[fnName] = (opts) => { runnerConfigs[type] = opts; return (runOpts) => activeCtx.runners[type](runOpts); };
      }
    },
  });
  await new Promise((r) => setTimeout(r, 25));
  const w = driveSw.win;
  const driveConnectionStore = driveSw.get("driveConnectionStore");
  realSwFns = {
    getCurrentLibraryAuth: w.getCurrentLibraryAuth, pbpLibraryAuthIsCurrent: w.pbpLibraryAuthIsCurrent,
    pbpDictOwnerScope: w.pbpDictOwnerScope, pbpVocabOwnerHash: w.pbpVocabOwnerHash,
    pbpVocabSyncSnapshot: w.pbpVocabSyncSnapshot, pbpNotesSyncSnapshot: w.pbpNotesSyncSnapshot,
    pbpVocabGetPreflightState: w.pbpVocabGetPreflightState, pbpVocabDeletePreflightState: w.pbpVocabDeletePreflightState,
    pbpVocabListAccountStates: w.pbpVocabListAccountStates, pbpVocabPutAccountState: w.pbpVocabPutAccountState,
    pbpVocabDriveForgetIdentity: w.pbpVocabDriveForgetIdentity, pbpObserveDriveIdentity: w.pbpObserveDriveIdentity,
    pbpVocabDriveIsConnected: w.pbpVocabDriveIsConnected, pbpDriveEnabled: w.pbpDriveEnabled,
    pbpDriveReadConnState: w.pbpDriveReadConnState, pbpClearDriveAlarms: w.pbpClearDriveAlarms,
    pbpQueueDriveRound: w.pbpQueueDriveRound, pbpGetVocabDriveStatus: w.pbpGetVocabDriveStatus,
    pbpVocabDriveResponse: w.pbpVocabDriveResponse, pbpConnectDrive: w.pbpConnectDrive,
    pbpDisconnectVocabDrive: w.pbpDisconnectVocabDrive, pbpReconcileDriveAlarms: w.pbpReconcileDriveAlarms,
    pbpRefreshDriveConnectionAccount: w.pbpRefreshDriveConnectionAccount, pbpBootDriveSync: w.pbpBootDriveSync,
    showNotification: w.showNotification, t: w.t,
    driveConnectionStore, origConnGet: driveConnectionStore.get,
    onRemovedListeners: driveSw.mock.chrome.permissions.onRemoved.listeners.slice(),
    defaultIdentity: driveSw.mock.chrome.identity,

  return driveSw;
}

function resetSwToReal() {
  const w = driveSw.win;
  for (const k of ["getCurrentLibraryAuth", "pbpLibraryAuthIsCurrent", "pbpDictOwnerScope", "pbpVocabOwnerHash",
    "pbpVocabSyncSnapshot", "pbpNotesSyncSnapshot", "pbpVocabGetPreflightState", "pbpVocabDeletePreflightState",
    "pbpVocabListAccountStates", "pbpVocabPutAccountState", "pbpVocabDriveForgetIdentity", "pbpObserveDriveIdentity",
    "pbpVocabDriveIsConnected", "pbpDriveEnabled", "pbpDriveReadConnState", "pbpClearDriveAlarms", "pbpQueueDriveRound",
    "pbpGetVocabDriveStatus", "pbpVocabDriveResponse", "pbpConnectDrive", "pbpDisconnectVocabDrive",
    "pbpReconcileDriveAlarms", "pbpRefreshDriveConnectionAccount", "pbpBootDriveSync", "showNotification", "t"]) {
    w[k] = realSwFns[k];
  }
  w.console.warn = (...args) => console.warn(...args);
  realSwFns.driveConnectionStore.get = realSwFns.origConnGet;
  driveSw.mock.chrome.identity = realSwFns.defaultIdentity;
}

async function withCtx(ctx, fn) {
  const finish = () => {
    if (--ctx._depth === 0) {
      ctx.epoch = driveSw.get("driveScopeEpoch");
      ctx.identityVersion = driveSw.get("driveIdentityVersion");
      ctx.verifiedPermissionId = driveSw.get("driveVerifiedPermissionId");
      activeCtx = ctx._prev;
      ctx._prev = null;
    }
  };
  if (activeCtx === ctx) {
    ctx._depth = (ctx._depth || 0) + 1;
    try { return await fn(); }
    finally { finish(); }
  }
  ctx._prev = activeCtx;
  activeCtx = ctx;
  ctx._depth = 1;
  resetSwToReal();
  driveSw.set("driveScopeEpoch", ctx.epoch);
  driveSw.set("driveIdentityVersion", ctx.identityVersion || 0);
  driveSw.set("driveVerifiedPermissionId", ctx.verifiedPermissionId || "");
  ctx.install(driveSw.win, driveSw.mock);
  try {
    return await fn();
  } finally {
    finish();
  }
}

function harness(seed = {}, results = {}) {
  const local = { vocabDriveConnected: true, ...seed }, calls = [], runs = [], alarms = [], deletes = [], notifications = [], forgets = [], accountPuts = [], messages = [];
  const alarmMap = new Map(Object.entries(structuredClone(results.alarmSeed || {})));
  const empty = { states: [], outbox: [], batches: [], notices: [] };
  const defaultClient = {
    async connect() { calls.push("authorize"); return { ok: true, permissionId: "google-a", emailAddress: "current@example.test", displayName: "Current" }; },
    async about() { return results.googleIdentity || { ok: true, permissionId: "google-a" }; },
    async openSession() { return { ok: true, permissionId: "google-a" }; },
  };
  let customClients = null, customVocabRunner = null;
  const stubRunner = (type) => async (runOptions) => {
    calls.push(type); runs.push({ type, ...runOptions });
    const custom = results[type + "Run"], opts = runnerConfigs[type];
    const result = custom ? await custom(opts, runOptions) : (results[type] || { ok: true });
    if (result.status?.drivePermissionId) opts.onSession?.(result.status.drivePermissionId);
    return result;
  };
  const removed = [(payload) => { realSwFns.onRemovedListeners.forEach((fn) => fn(payload)); }];
  const ctx = {
    epoch: 0, identityVersion: 0, verifiedPermissionId: "",
    clientForSlot(slot) {
      if (results.createClient) { if (!customClients) customClients = clientSlotConfigs.map((cfg) => results.createClient(cfg)); return customClients[slot]; }
      return defaultClient;
    },
    stores: {
      dictionary: {
        getPreflightState: async () => results.dictionaryPreflight || null,
        async deletePreflightState(hash) { deletes.push("dictionary:" + hash); results.dictionaryPreflight = null; return true; },
        async putAccountState(row) { accountPuts.push({ type: "dictionary", row: structuredClone(row), runsBefore: runs.length }); return true; },
        snapshot: async () => results.dictionarySnapshot || empty,
      },
      ask: {
        getPreflightState: async () => results.askPreflight || null,
        async deletePreflightState(hash) { deletes.push("ask:" + hash); results.askPreflight = null; return true; },
        async putAccountState(row) { accountPuts.push({ type: "ask", row: structuredClone(row), runsBefore: runs.length }); return true; },
        snapshot: async () => results.askSnapshot || empty,
      },
      notes: {
        getPreflightState: async () => results.notesPreflight || null,
        async deletePreflightState(hash) { deletes.push("notes:" + hash); results.notesPreflight = null; return true; },
        async putAccountState(row) { accountPuts.push({ type: "notes", row: structuredClone(row), runsBefore: runs.length }); return true; },
        snapshot: async () => results.notesSnapshot || empty,
      },
    },
    runners: {
      vocabulary: (runOptions) => {
        if (results.createVocabRunner) { if (!customVocabRunner) customVocabRunner = results.createVocabRunner(runnerConfigs.vocabulary); return customVocabRunner(runOptions); }
        return stubRunner("vocabulary")(runOptions);
      },
      notes: stubRunner("notes"), dictionary: stubRunner("dictionary"), ask: stubRunner("ask"),
    },
    install(win, mock) {
      mock.chrome.runtime.sendMessage = async (message) => { messages.push(structuredClone(message)); };
      mock.chrome.storage.local.get = async (query) => {
        if (results.connReadError && (typeof query === "string" ? [query] : Object.keys(query)).some((key) => key.startsWith("driveConnState:"))) throw new Error("connection storage unavailable");
        if (typeof query === "string") return query in local ? { [query]: structuredClone(local[query]) } : {};
        const out = {}; for (const [key, fallback] of Object.entries(query)) out[key] = key in local ? local[key] : fallback;
        return structuredClone(out);
      };
      mock.chrome.storage.local.set = async (values) => { Object.assign(local, structuredClone(values)); results.afterSet?.(values); };
      mock.chrome.storage.local.remove = async (keys) => { for (const key of [].concat(keys)) delete local[key]; };
      mock.chrome.permissions.contains = async () => results.permissionGranted !== false;
      mock.chrome.alarms.get = async (name) => alarmMap.has(name) ? { name, ...structuredClone(alarmMap.get(name)) } : undefined;
      mock.chrome.alarms.create = async (name, info) => { alarmMap.set(name, structuredClone(info)); };
      mock.chrome.alarms.clear = async (name) => { alarms.push(name); return alarmMap.delete(name); };
      win.pbpVocabSyncSnapshot = async () => { if (results.vocabSnapshotError) throw new Error("vocabulary storage unavailable"); return results.vocabSnapshot || ({ ...empty, outbox: [{ recordKey: "en|word" }] }); };
      win.pbpNotesSyncSnapshot = async () => { if (results.notesSnapshotError) throw new Error("notes storage unavailable"); return results.notesSnapshot || ({ ...empty, outbox: [{ recordKey: "pbp_hl_abcd|note" }] }); };
      win.pbpVocabGetPreflightState = async () => { if (results.vocabPreflightError) throw new Error("vocabulary preflight unavailable"); return results.vocabPreflight || null; };
      win.pbpVocabDeletePreflightState = async (hash) => { deletes.push("vocabulary:" + hash); results.vocabPreflight = null; return true; };
      win.pbpVocabListAccountStates = async () => structuredClone(results.vocabAccountRows || []);
      win.pbpVocabPutAccountState = async (row) => { accountPuts.push({ type: "vocabulary", row: structuredClone(row), runsBefore: runs.length }); return true; };
      win.pbpVocabDriveForgetIdentity = () => { forgets.push(true); realSwFns.pbpVocabDriveForgetIdentity(); };
      win.getCurrentLibraryAuth = async () => ({ account: results.account || "alice", epoch: 1 });
      win.pbpLibraryAuthIsCurrent = () => true;
      win.pbpDictOwnerScope = (account) => "acct_" + account;
      win.pbpVocabOwnerHash = async () => HASH;
      win.showNotification = async (...args) => { notifications.push(args); };
      win.t = (key) => key;
    },
  };
  return {
    queue: (opts) => withCtx(ctx, () => realSwFns.pbpQueueDriveRound(opts)),
    connect: () => withCtx(ctx, () => realSwFns.pbpConnectDrive()),
    status: () => withCtx(ctx, () => realSwFns.pbpGetVocabDriveStatus()),
    reconcile: () => withCtx(ctx, () => realSwFns.pbpReconcileDriveAlarms()),
    connection: {
      get: (hash) => withCtx(ctx, () => realSwFns.driveConnectionStore.get(hash)),
      put: (hash, state) => withCtx(ctx, () => realSwFns.driveConnectionStore.put(hash, state)),
    },
    epoch: () => (activeCtx === ctx ? driveSw.get("driveScopeEpoch") : ctx.epoch),
    messages, calls, runs, local, alarms, alarmMap, deletes, notifications, forgets, removed, accountPuts,
  };
}

async function connectDuringSync(sessionPermissionId, { pinIdentity = false } = {}) {
  pbpVocabDriveForgetIdentity();
  realSwFns.pbpVocabDriveForgetIdentity();
  let releaseChanges, changesPending, connected;
  const changesRead = new Promise((resolve) => { changesPending = resolve; });
  const changesGate = new Promise((resolve) => { releaseChanges = resolve; });
  const connectionWritten = new Promise((resolve) => { connected = resolve; });
  let currentPermissionId = sessionPermissionId, clientNumber = 0, changesReads = 0, runNumber = 0;
  const mutations = [], states = new Map();
  const h = harness({
    driveConnectionAccount: { permissionId: "google-previous", emailAddress: "previous@example.test", displayName: "Previous" }
  }, {
    afterSet(values) { if (values.vocabDriveConnected === true && values.driveConnectionAccount?.permissionId === "google-a") connected(); },
    createClient(options = {}) {
      const number = clientNumber++;
      return pbpCreateDriveClient({ ...options,
        identity: {
          async getAuthToken() {
            if (number === 4) currentPermissionId = "google-a";
            const id = pinIdentity && number === 0 && runNumber === 1 ? sessionPermissionId : currentPermissionId;
            return { token: "token-" + id };
          },
          async removeCachedAuthToken() {}, async clearAllCachedAuthTokens() {}
        },
        // Google Drive v3 about.get & changes.list shapes verified live on 2026-11-23.
        fetchImpl: async (input, init = {}) => {
          const path = new URL(input).pathname;
          if (path === "/drive/v3/about") {
            const permissionId = String(init.headers?.Authorization || "").replace(/^Bearer token-/, "");
            const payload = { user: { displayName: "Current", permissionId, emailAddress: "current@example.test" } };
            return new Response(JSON.stringify(payload), { headers: { "Content-Type": "application/json; charset=UTF-8" } });
          }
          if (path === "/drive/v3/changes") {
            if (number === 0 && ++changesReads === 1) { changesPending(); await changesGate; }
            return new Response('{"changes":[],"newStartPageToken":"after-connect"}', { headers: { "Content-Type": "application/json; charset=UTF-8" } });
          }
          throw new Error("Unexpected Drive request: " + path);
        }
      });
    },
    createVocabRunner(options) {
      const store = {
        async getPreflightState() { return null; }, async deletePreflightState() { return true; },
        async getAccountState(permissionId, ownerHash) {
          return states.get(permissionId) || { key: "account:" + permissionId + ":" + ownerHash,
            drivePermissionId: permissionId, ownerHash, protocolSchema: 2, bootstrapComplete: true, pageToken: "before-connect" };
        },
        async getMeta() { return { deviceId: "device-a", counter: 1 }; },
        async applyRemotePage(_owner, _hash, _batches, cursor) {
          mutations.push({ run: runNumber, kind: "cursor", pageToken: cursor.pageToken });
          states.set(cursor.drivePermissionId, structuredClone(cursor));
          return { ok: true, applied: 0, merged: 0, ignored: 0 };
        },
        async putAccountState(state) { mutations.push({ run: runNumber, kind: "state" }); states.set(state.drivePermissionId, structuredClone(state)); return true; },
        async listPendingBatches() { return []; }, async listOutbox() { return []; }
      };
      const runner = pbpCreateDriveSyncRunner({ ...options, store, hashOwner: async () => HASH, now: () => 100000 });
      return (runOptions) => { runNumber++; return runner(runOptions); };
    }
  });
  const pending = h.queue({});
  await changesRead;
  const reconnecting = h.connect();
  await connectionWritten;
  releaseChanges();
  const [first, reconnect] = await Promise.all([pending, reconnecting]);
  return { first, reconnect, mutations, account: h.local.driveConnectionAccount, notesRuns: h.calls.filter((call) => call === "notes").length };
}

function bootHarness(seed = {}) {
  const local = { vocabDriveConnected: true, ...seed }, calls = [], cleared = [];
  const ctx = {
    epoch: 0, clientForSlot: () => ({}), stores: {}, runners: {},
    install(win, mock) {
      mock.chrome.storage.local.get = async (query) => {
        const out = {}; for (const [key, fallback] of Object.entries(query)) out[key] = key in local ? local[key] : fallback;
        return structuredClone(out);
      };
      mock.chrome.storage.local.set = async (values) => { Object.assign(local, structuredClone(values)); };
      mock.chrome.storage.local.remove = async (keys) => { for (const key of [].concat(keys)) delete local[key]; };
      mock.chrome.permissions.contains = async () => seed.permissionGranted !== false;
      mock.chrome.permissions.remove = async () => true;
      mock.chrome.identity = {
        async getAuthToken() { calls.push("mint:" + local.vocabDriveConnected); return { token: "cached-token" }; },
        async removeCachedAuthToken() { calls.push("remove-token"); },
        async clearAllCachedAuthTokens() {},
      };
      mock.chrome.alarms.clear = async (name) => { cleared.push(name); return true; };
      win.pbpVocabDriveIsConnected = async () => local.vocabDriveConnected === true;
      win.pbpQueueDriveRound = async (options) => { calls.push("round:" + JSON.stringify(options)); return { ok: true }; };
      win.pbpGetVocabDriveStatus = async () => ({ connected: local.vocabDriveConnected });
    },
  };
  return {
    boot: (opts) => withCtx(ctx, () => realSwFns.pbpBootDriveSync(opts)),
    disconnect: () => withCtx(ctx, () => realSwFns.pbpDisconnectVocabDrive()),
    epoch: () => (activeCtx === ctx ? driveSw.get("driveScopeEpoch") : ctx.epoch),
    local, calls, cleared,
  };
}

      },
      ask: {
        getPreflightState: async () => opts.askPreflight,
        snapshot: async () => { if (opts.askSnapshotError) throw new Error("ask storage unavailable"); return opts.askSnapshot === undefined ? snapshotOf() : opts.askSnapshot; },
      },
    },
    install(win, mock) {
      mock.chrome.storage.local.get = async (query) => {
        const out = {}; for (const [key, fallback] of Object.entries(query)) out[key] = key in local ? structuredClone(local[key]) : fallback;
        return out;
      };
      win.pbpVocabDriveIsConnected = async () => local.vocabDriveConnected === true;
      win.getCurrentLibraryAuth = async () => ({ account: "alice", epoch: 1 });

      win.pbpVocabGetPreflightState = async () => { if (opts.vocabPreflightError) throw new Error("vocabulary preflight unavailable"); return opts.vocabPreflight === undefined ? null : opts.vocabPreflight; };

function connectHarness(opts = {}) {
  const local = { vocabDriveConnected: opts.connected === true }, order = [], rounds = [], messages = [], warnings = [];
  const ctx = {
    epoch: 0, stores: {}, runners: {},
    clientForSlot: () => ({
      async connect() {
        order.push("authorize");
        return opts.authorization === undefined ? { ok: true, permissionId: "google-a", emailAddress: "current@example.test", displayName: "Current" } : opts.authorization;
      },
      async about() { return { ok: true, permissionId: "google-a" }; },
      async openSession() { return { ok: true, permissionId: "google-a" }; },
    }),
    install(win, mock) {
      mock.chrome.permissions.contains = async () => opts.permissionGranted !== false;
      mock.chrome.identity = { async clearAllCachedAuthTokens() { order.push("clear-all"); } };
      mock.chrome.storage.local.set = async (values) => { order.push("set:" + Object.keys(values).sort().join("+")); Object.assign(local, structuredClone(values)); };
      mock.chrome.runtime.sendMessage = (message) => { order.push("broadcast"); messages.push(structuredClone(message)); return Promise.resolve(); };
      win.getCurrentLibraryAuth = async () => ({ account: "alice", epoch: 1 });
      win.pbpLibraryAuthIsCurrent = () => true;
      win.pbpDictOwnerScope = (account) => "acct_" + account;
      win.pbpVocabDriveIsConnected = async () => local.vocabDriveConnected === true;
      win.pbpVocabOwnerHash = async () => OWNER_HASH;
      realSwFns.driveConnectionStore.get = async (hash) => (hash === OWNER_HASH ? structuredClone(opts.connectionState === undefined ? null : opts.connectionState) : null);
      win.pbpVocabDriveForgetIdentity = (...args) => { order.push("forget:" + args.length); };
      win.pbpObserveDriveIdentity = (permissionId) => { order.push("observe:" + permissionId); };

  check("Ask has its own pending and recoverable error row", askStatus.ask.hasPending && askStatus.hasPending && askStatus.ask.blocked && askStatus.ask.lastError === "local_store");
  const askUnreadable = await statusHarness({ askSnapshotError: true }).status();
  check("unreadable Ask storage does not mark other datasets unavailable", askUnreadable.ask.lastError === "status_unavailable" && askUnreadable.dictionary.lastError === null && askUnreadable.notes.lastError === null);
  const askAnonymous = await archiveMessage({ type: "PBP_ASK_ARCHIVE_RESTORE", account: "", owner: "ownerless" });
  check("anonymous Ask restore remains local and opens no Drive session", askAnonymous.answer.ok && !askAnonymous.answer.connected && !askAnonymous.requests);
  const askStale = await archiveMessage({ type: "PBP_ASK_ARCHIVE_RESTORE", owner: "acct_bob", connected: true });
  check("Ask restore rejects a stale owner before dispatch", askStale.answer.code === "account_changed" && !askStale.requests);
  const askReady = await archiveMessage({ type: "PBP_ASK_ARCHIVE_RESTORE", connected: true,
    result: { ok: true, results: { ask: { status: { bootstrapComplete: true } } } } });
  const askPartial = await archiveMessage({ type: "PBP_ASK_ARCHIVE_RESTORE", connected: true,
    result: { ok: true, results: { ask: { status: { bootstrapComplete: false } } } } });
  check("Ask restore success requires a complete cloud bootstrap", askReady.answer.ok && askReady.answer.connected && !askPartial.answer.ok);
  driveSw.dispose();
  document.getElementById("summary").textContent = `pass=${pass} fail=${fail}`;
})();
</script></body></html>
