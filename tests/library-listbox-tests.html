<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Library Listbox Tests</title>
<style>
.case.pass{color:#0a0}.case.fail{color:#c00;font-weight:bold}
.fixture{position:absolute;left:-10000px;top:0;width:800px;height:900px;border:0}
</style>
</head><body>
<div id="results"></div>
<!-- Top-level copies for the blocks that run on this page itself (T4b's
     Filter-popover block calls pbpEnhanceListbox here; T4b adds
     ../library.js right after ../listbox.js). The primitive cases below
     boot their own srcdoc copies and never touch these. -->
<script src="../shared.js"></script>
<script src="../listbox.js"></script>
<script src="../library.js"></script>
<script>
// listbox.js primitive suite (spec 2026-10-03 library redesign §8.2 float
// mode, §8.3 ghost face, §8.4 first-frame marker; plan Task T0b). Every
// primitive case boots a srcdoc iframe that loads only shared.js (PBP_ICONS,
// setBtnIcon) and listbox.js from the repo root, with a stylesheet standing
// in for the geometry library.css gains in T6: the UA popover reset and a
// scroll layer capped by --listbox-room.
//
// Page contract for the later tasks (T4b, T6a, T6b, T7a-T7c):
// - check(name, condition, detail) is the one row writer for appended
//   cases (report/assert/test stay for the primitive queue).
// - The page keeps no TOTAL: run-test.mjs counts .pass/.fail rows against
//   EXPECTED_RESULTS, so a task that adds cases raises only that number.
// - An independent <script> block appended before </body> (T4b) runs on
//   its own and reports through check(); nothing awaits it.
// - Page-level suites (T6, T7) define their constants and async functions
//   in the function area above the main flow, and add one
//   `await <name>();` line each at the main flow's mount point, in task
//   order, above the summary line.
const results = document.getElementById("results");
let pass = 0, fail = 0;
function report(name, error) {
  const row = document.createElement("div");
  if (error) fail++; else pass++;
  row.className = "case " + (error ? "fail" : "pass");
  row.textContent = (error ? "X " : "OK ") + name + (error ? " :: " + error.message : "");
  results.appendChild(row);
  // Kept current per row, so rows from an independent block that lands
  // after the summary line still show in the title.
  document.title = (fail ? "FAIL" : "PASS") + " Library Listbox Tests";
}
function check(name, condition, detail) {
  report(name, condition ? null : new Error(detail || "condition is false"));
}
function assert(condition, message) { if (!condition) throw new Error(message); }
const queue = [];
function test(name, fn) { queue.push([name, fn]); }

const FIXTURE_CSS = [
  "html, body { margin: 0; font: 14px/20px sans-serif; }",
  ".scroller { position: absolute; inset: 0; overflow-y: auto; }",
  ".pad-top { height: 300px; }",
  ".pad-bottom { height: 1200px; }",
  ".listbox { display: inline-block; }",
  ".listbox-btn, .listbox-trigger { height: 32px; }",
  ".listbox-sizer { display: block; height: 0; overflow: hidden; visibility: hidden; white-space: nowrap; }",
  ".listbox-pop[popover] { position: fixed; inset: auto; margin: 0; padding: 0; width: max-content; height: auto; box-sizing: border-box; border: 1px solid; overflow: hidden; }",
  ".listbox-pop[hidden] { display: none; }",
  ".listbox-list { max-height: min(320px, calc(var(--listbox-room, 100vh) - 2px)); overflow: auto; margin: 0; padding: 0; list-style: none; }",
  ".listbox-opt { display: block; height: 28px; line-height: 28px; white-space: nowrap; }",
  ".anchor { position: fixed; width: 100px; height: 32px; margin: 0; padding: 0; }",
  ".probe-pop { position: fixed; inset: auto; margin: 0; padding: 0; border: 0; width: max-content; overflow: hidden; max-height: var(--listbox-room, none); }",
  ".probe-body { width: 300px; height: 400px; }",
].join("\n");

const OPTIONS_30 = Array.from({ length: 30 }, (_, i) => '<option value="g' + i + '">Group ' + i + "</option>").join("");
const MAIN_BODY = [
  '<div class="scroller" id="scroller">',
  '<div class="pad-top"></div>',
  '<label id="fl-label" for="fl">Group</label>',
  '<select id="fl" data-listbox="float">' + OPTIONS_30 + "</select>",
  '<label for="abs">Plain</label>',
  '<select id="abs" data-listbox><option value="a">A</option><option value="b">B</option></select>',
  '<span id="sort-label">Sort</span><span id="sort-face">Time, recently updated</span>',
  '<select id="gh" data-listbox="float" data-listbox-face="ghost" aria-labelledby="sort-label sort-face">',
  '<option value="latest" data-face-label="Time" data-face-icon="arrowDown" selected>Recently updated</option>',
  '<option value="oldest" data-face-label="Time" data-face-icon="arrowUp">Oldest first</option>',
  '<option value="az">A to Z</option>',
  "</select>",
  '<div class="pad-bottom"></div>',
  "</div>",
  '<button id="anchor" class="anchor" type="button">anchor</button>',
  '<div id="probe-pop" class="probe-pop" popover="manual"><div id="probe-body" class="probe-body"></div></div>',
].join("\n");

function frames(win, n) {
  return new Promise((resolve) => {
    let left = n;
    const tick = () => { if (--left <= 0) resolve(); else win.requestAnimationFrame(tick); };
    win.requestAnimationFrame(tick);
  });
}

// One srcdoc document per call. `before` runs after shared.js and before
// listbox.js registers its DOMContentLoaded handler; `after` runs once it has.
function boot({ body, before = "", after = "" }) {
  const frame = document.createElement("iframe");
  frame.className = "fixture";
  frame.title = "Listbox fixture";
  const loaded = new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
  frame.srcdoc = '<!DOCTYPE html><html><head><base href="../"><meta charset="UTF-8"><style>' + FIXTURE_CSS +
    "</style></head><body>" + body + '<script src="shared.js"><\/script>' + before +
    '<script src="listbox.js"><\/script>' + after + "</body></html>";
  document.body.appendChild(frame);
  return loaded.then(async () => {
    const win = frame.contentWindow;
    await frames(win, 2);   // listbox.js's own rAF re-sync
    return { frame, win, doc: frame.contentDocument };
  });
}

// The 15 primitive cases: one shared srcdoc document plus two fresh ones.
async function primitiveCases() {
  const { frame, win, doc } = await boot({ body: MAIN_BODY });
  const $ = (id) => doc.getElementById(id);
  const fl = $("fl");
  const gh = $("gh");
  const abs = $("abs");
  const btnOf = (select) => $(select.id + "-btn");
  const listOf = (select) => $(select.id + "-list");
  const popOf = (select) => listOf(select)?.parentElement;
  const itemsOf = (select) => [...(listOf(select)?.querySelectorAll('[role="option"]') || [])];
  const activeIndex = (select) => {
    const id = btnOf(select)?.getAttribute("aria-activedescendant") || "";
    return itemsOf(select).findIndex((li) => li.id === id);
  };
  const key = (target, k, init = {}) => {
    const ev = new win.KeyboardEvent("keydown", Object.assign({ key: k, bubbles: true, cancelable: true }, init));
    target.dispatchEvent(ev);
    return ev;
  };
  const isOpen = (pop) => !!pop && pop.matches(":popover-open");
  const settle = () => frames(win, 2);
  const view = () => ({ w: doc.documentElement.clientWidth, h: doc.documentElement.clientHeight });
  const inView = (r, v) => r.left >= 7 && r.top >= 7 && r.right <= v.w - 7 && r.bottom <= v.h - 7;
  const icon = (name) => win.eval("PBP_ICONS")[name] || "";
  const pathsOfHtml = (html) => {
    const tpl = doc.createElement("template");
    tpl.innerHTML = html;
    return [...tpl.content.querySelectorAll("path")].map((p) => p.getAttribute("d")).join("|");
  };
  const pathsOf = (el) => [...(el?.querySelectorAll("path") || [])].map((p) => p.getAttribute("d")).join("|");
  // Every case starts closed, 900px tall, scrolled to the top, with any
  // scroll/resize event from the previous case already delivered.
  const reset = async () => {
    for (const select of doc.querySelectorAll("select[data-listbox]")) {
      const b = btnOf(select);
      if (b?.getAttribute("aria-expanded") === "true") key(b, "Escape");
    }
    frame.style.height = "900px";
    $("scroller").scrollTop = 0;
    await settle();
  };

  test("float: enhance makes the shell a manual popover; plain data-listbox stays absolute", async () => {
    await reset();
    const pop = popOf(fl);
    assert(pop && pop.getAttribute("popover") === "manual", "float shell popover=" + pop?.getAttribute("popover"));
    assert(pop.hidden && !isOpen(pop), "float shell starts open");
    assert(fl.hidden && btnOf(fl)?.classList.contains("listbox-btn"), "float select not enhanced into a value-box button");
    assert(!popOf(abs).hasAttribute("popover"), "absolute-mode shell got a popover attribute");
  });

  test("float: click opens in the top layer, fixed, below the button, inside the viewport", async () => {
    await reset();
    const btn = btnOf(fl);
    const pop = popOf(fl);
    btn.click();
    try {
      assert(isOpen(pop) && !pop.hidden, "not :popover-open after click");
      assert(btn.getAttribute("aria-expanded") === "true", "aria-expanded not true");
      assert(win.getComputedStyle(pop).position === "fixed", "position=" + win.getComputedStyle(pop).position);
      const r = pop.getBoundingClientRect();
      const b = btn.getBoundingClientRect();
      assert(!pop.hasAttribute("data-flip"), "flipped with ample room below");
      assert(r.top >= b.bottom - 0.5, "panel not below the button");
      assert(r.width >= b.width - 0.5, "panel narrower than its button");
      assert(inView(r, view()), "panel outside the viewport: " + JSON.stringify(r));
    } finally { key(btn, "Escape"); }
  });

  test("float: Escape hides the popover, then the shell; it reopens cleanly", async () => {
    await reset();
    const btn = btnOf(fl);
    const pop = popOf(fl);
    btn.click();
    assert(isOpen(pop), "fixture: did not open");
    key(btn, "Escape");
    assert(!isOpen(pop) && pop.hidden, "still showing after Escape");
    assert(btn.getAttribute("aria-expanded") === "false", "aria-expanded not false");
    btn.click();
    assert(isOpen(pop) && !pop.hidden, "did not reopen after a close");
    key(btn, "Escape");
  });

  test("float: flips above when the room below is short and above is larger", async () => {
    await reset();
    const btn = btnOf(fl);
    const pop = popOf(fl);
    frame.style.height = Math.round(btn.getBoundingClientRect().bottom + 40) + "px";
    await settle();   // deliver the iframe's own resize event before opening
    btn.click();
    try {
      assert(isOpen(pop), "did not open");
      assert(pop.getAttribute("data-flip") === "up", "data-flip=" + pop.getAttribute("data-flip"));
      const r = pop.getBoundingClientRect();
      const b = btn.getBoundingClientRect();
      assert(r.bottom <= b.top + 0.5, "flipped panel overlaps the button");
      assert(inView(r, view()), "flipped panel outside the viewport: " + JSON.stringify(r));
    } finally {
      key(btn, "Escape");
      frame.style.height = "900px";
      await settle();
    }
  });

  test("pbpListboxPlace: side, --listbox-room, width bounds and horizontal clamp", async () => {
    await reset();
    assert(typeof win.pbpListboxPlace === "function", "window.pbpListboxPlace is not exported");
    const anchor = $("anchor");
    const pop = $("probe-pop");
    const body = $("probe-body");
    const v = view();
    const at = (left, top) => { anchor.style.left = left + "px"; anchor.style.top = top + "px"; };
    body.style.width = "300px";
    pop.showPopover();
    try {
      at(20, 20);
      let side = win.pbpListboxPlace(pop, anchor);
      let a = anchor.getBoundingClientRect();
      let r = pop.getBoundingClientRect();
      assert(side === "down" && !pop.hasAttribute("data-flip"), "A: side=" + side);
      assert(pop.style.getPropertyValue("--listbox-room") === Math.floor(v.h - a.bottom - 4 - 8) + "px",
        "A: --listbox-room=" + pop.style.getPropertyValue("--listbox-room"));
      assert(pop.style.position === "fixed" && pop.style.minWidth === Math.round(a.width) + "px" && pop.style.maxWidth === (v.w - 16) + "px",
        "A: inline position / min-width / max-width: " + pop.style.cssText);
      assert(Math.abs(r.top - (a.bottom + 4)) <= 1 && Math.abs(r.left - a.left) <= 1, "A: not 4px under the anchor's left edge");
      at(20, v.h - 60);
      side = win.pbpListboxPlace(pop, anchor);
      a = anchor.getBoundingClientRect();
      r = pop.getBoundingClientRect();
      assert(side === "up" && pop.getAttribute("data-flip") === "up", "B: side=" + side);
      assert(pop.style.getPropertyValue("--listbox-room") === Math.floor(a.top - 4 - 8) + "px", "B: --listbox-room=" + pop.style.getPropertyValue("--listbox-room"));
      assert(r.bottom <= a.top - 4 + 1 && r.top >= 7, "B: not above the anchor inside the viewport: " + JSON.stringify(r));
      at(20, 20);
      assert(win.pbpListboxPlace(pop, anchor) === "down" && !pop.hasAttribute("data-flip"), "data-flip left set after a down placement");
      at(v.w - 110, 20);
      win.pbpListboxPlace(pop, anchor);
      a = anchor.getBoundingClientRect();
      r = pop.getBoundingClientRect();
      assert(r.right <= v.w - 7 && Math.abs(r.right - a.right) <= 1, "C: right edge " + r.right + " (anchor " + a.right + ", viewport " + v.w + ")");
      at(-40, 20);
      win.pbpListboxPlace(pop, anchor);
      r = pop.getBoundingClientRect();
      assert(Math.abs(r.left - 8) <= 1, "D: left " + r.left);
      body.style.width = "2000px";
      at(20, 20);
      win.pbpListboxPlace(pop, anchor);
      r = pop.getBoundingClientRect();
      assert(r.width <= v.w - 16 + 1 && r.left >= 7 && r.right <= v.w - 7, "E: " + JSON.stringify(r));
    } finally {
      body.style.width = "300px";
      pop.hidePopover();
    }
  });

  test("float: a window resize closes the open list", async () => {
    await reset();
    const btn = btnOf(fl);
    const pop = popOf(fl);
    btn.click();
    assert(isOpen(pop), "fixture: did not open");
    win.dispatchEvent(new win.Event("resize"));
    assert(!isOpen(pop) && pop.hidden && btn.getAttribute("aria-expanded") === "false", "resize left the list open");
  });

  // An outer scroll closes the list only when it moves the button (> 1px):
  // here the button lives in #scroller, so scrolling it carries the anchor.
  test("float: scrolling an outer container that carries the button closes; scrolling the list itself does not", async () => {
    await reset();
    const btn = btnOf(fl);
    const pop = popOf(fl);
    const list = listOf(fl);
    btn.click();
    try {
      assert(isOpen(pop) && list.scrollHeight > list.clientHeight, "fixture: list not open or not scrollable");
      list.scrollTop = 60;
      await settle();
      assert(list.scrollTop > 0, "fixture: list did not scroll");
      assert(isOpen(pop), "scrolling the list closed it");
      $("scroller").scrollTop = 40;
      await settle();
      assert(!isOpen(pop) && pop.hidden, "an outer scroll left the list open");
    } finally { key(btn, "Escape"); }
  });

  // A scroll event that moves nothing -- one still queued from before the
  // open, or touchpad inertia in a pane beside the button -- must not snap a
  // list the user just opened shut (library redesign T6a fix round 1).
  test("float: an outer scroll event that does not move the button leaves the list open", async () => {
    await reset();
    const btn = btnOf(fl);
    const pop = popOf(fl);
    btn.click();
    try {
      assert(isOpen(pop), "fixture: did not open");
      $("scroller").dispatchEvent(new win.Event("scroll"));
      doc.dispatchEvent(new win.Event("scroll"));
      await settle();
      assert(isOpen(pop) && !pop.hidden && btn.getAttribute("aria-expanded") === "true", "a scroll that left the button in place closed the list");
    } finally { key(btn, "Escape"); }
  });

  test("float: close removes exactly the resize and scroll listeners open added", async () => {
    await reset();
    const btn = btnOf(fl);
    const calls = [];
    const spy = (target, tag) => {
      const add = target.addEventListener;
      const remove = target.removeEventListener;
      target.addEventListener = function (type, fn, opt) { calls.push([tag, "add", type, fn, opt]); return add.call(this, type, fn, opt); };
      target.removeEventListener = function (type, fn, opt) { calls.push([tag, "remove", type, fn, opt]); return remove.call(this, type, fn, opt); };
    };
    spy(win, "window");
    spy(doc, "document");
    try {
      btn.click();
      key(btn, "Escape");
    } finally {
      delete win.addEventListener; delete win.removeEventListener;
      delete doc.addEventListener; delete doc.removeEventListener;
    }
    const pick = (tag, op, type) => calls.filter((c) => c[0] === tag && c[1] === op && c[2] === type);
    const ra = pick("window", "add", "resize");
    const rr = pick("window", "remove", "resize");
    const sa = pick("document", "add", "scroll");
    const sr = pick("document", "remove", "scroll");
    assert(ra.length === 1 && rr.length === 1 && ra[0][3] === rr[0][3], "resize listener add/remove: " + ra.length + "/" + rr.length);
    assert(sa.length === 1 && sr.length === 1 && sa[0][3] === sr[0][3], "scroll listener add/remove: " + sa.length + "/" + sr.length);
    assert(sa[0][4] === true && sr[0][4] === true, "the scroll listener is not capture-phase on both ends");
  });

  test("ghost: a btn ghost trigger with the face label and icon, no value-box parts", async () => {
    await reset();
    const btn = btnOf(gh);
    assert(btn && btn.className === "listbox-trigger btn ghost", "className=" + btn?.className);
    assert(!btn.classList.contains("listbox-btn"), "the ghost trigger carries .listbox-btn (a value box)");
    assert(btn.getAttribute("role") === "combobox" && btn.getAttribute("aria-haspopup") === "listbox" &&
      btn.getAttribute("aria-expanded") === "false" && btn.getAttribute("aria-controls") === "gh-list",
      "combobox ARIA differs from the value-box mode");
    assert(btn.getAttribute("aria-labelledby") === "sort-label sort-face" && listOf(gh).getAttribute("aria-labelledby") === "sort-label sort-face",
      "the select's own aria-labelledby was not carried over");
    assert(!btn.querySelector(".listbox-sizer") && !btn.querySelector(".listbox-value"), "the ghost trigger built value-box parts");
    assert(btn.lastElementChild?.textContent === "Time", "face label=" + btn.lastElementChild?.textContent);
    const shown = pathsOf(btn.querySelector(".btn-ic"));
    assert(shown !== "" && shown === pathsOfHtml(icon("arrowDown")), "face icon is not PBP_ICONS.arrowDown");
    assert(popOf(gh).getAttribute("popover") === "manual", "the ghost float shell is not a popover");
  });

  test("ghost: face follows the value (keyboard pick, programmatic sync); option text is the fallback; title untouched", async () => {
    await reset();
    const btn = btnOf(gh);
    btn.title = "consumer title";
    try {
      key(btn, "ArrowDown");
      assert(isOpen(popOf(gh)), "ArrowDown did not open the ghost list");
      key(btn, "ArrowDown");
      key(btn, "Enter");
      assert(gh.value === "oldest" && !isOpen(popOf(gh)), "Enter did not commit oldest and close, value=" + gh.value);
      assert(btn.lastElementChild?.textContent === "Time" && pathsOf(btn.querySelector(".btn-ic")) === pathsOfHtml(icon("arrowUp")),
        "face did not switch to the arrowUp icon");
      gh.value = "az";
      win.pbpListboxSync(gh);
      assert(btn.lastElementChild?.textContent === "A to Z", "fallback label=" + btn.lastElementChild?.textContent);
      assert(!btn.querySelector(".btn-ic svg"), "an option without data-face-icon still shows an icon");
      assert(btn.title === "consumer title", "listbox.js rewrote the consumer's title: " + btn.title);
    } finally {
      gh.value = "latest";
      win.pbpListboxSync(gh);
      btn.removeAttribute("title");
    }
  });

  // T6b (controller follow-up to T0b): a face without a drawable icon -- no
  // data-face-icon, or a key PBP_ICONS does not have -- must not leave an
  // empty .btn-ic behind: the .btn family's gap would still open a blank
  // icon-sized slot beside the label.
  test("ghost: an option without a drawable face icon gets its label alone, no empty icon slot", async () => {
    await reset();
    const btn = btnOf(gh);
    const az = gh.querySelector('option[value="az"]');
    try {
      gh.value = "az";
      win.pbpListboxSync(gh);
      assert(btn.children.length === 1 && !btn.querySelector(".btn-ic") && btn.lastElementChild?.textContent === "A to Z",
        "no data-face-icon: " + btn.innerHTML.slice(0, 120));
      az.dataset.faceIcon = "noSuchIconKey";
      win.pbpListboxSync(gh);
      assert(btn.children.length === 1 && !btn.querySelector(".btn-ic") && btn.lastElementChild?.textContent === "A to Z",
        "unknown icon key: " + btn.innerHTML.slice(0, 120));
      gh.value = "latest";
      win.pbpListboxSync(gh);
      assert(btn.querySelectorAll(".btn-ic svg").length === 1 && btn.lastElementChild?.textContent === "Time",
        "back on an iconed option the icon slot did not return: " + btn.innerHTML.slice(0, 120));
    } finally {
      delete az.dataset.faceIcon;
      gh.value = "latest";
      win.pbpListboxSync(gh);
    }
  });

  test("float: End/Home scroll only the list; the outer scroller stays put and the list stays open", async () => {
    await reset();
    const btn = btnOf(fl);
    const pop = popOf(fl);
    const list = listOf(fl);
    const scroller = $("scroller");
    const before = scroller.scrollTop + "," + doc.scrollingElement.scrollTop;
    btn.click();
    try {
      assert(isOpen(pop) && list.scrollHeight > list.clientHeight, "fixture: list not open or not scrollable");
      key(btn, "End");
      await settle();
      const items = itemsOf(fl);
      assert(activeIndex(fl) === items.length - 1, "End did not reach the last option");
      const box = list.getBoundingClientRect();
      const last = items[items.length - 1].getBoundingClientRect();
      assert(list.scrollTop > 0 && last.top >= box.top - 0.5 && last.bottom <= box.top + list.clientTop + list.clientHeight + 0.5,
        "the last option is not visible inside the list");
      assert(isOpen(pop), "End closed the list (an outer scroll fired)");
      key(btn, "Home");
      await settle();
      assert(items[0].getBoundingClientRect().top >= box.top - 0.5, "Home did not bring the first option back into view");
      assert(scroller.scrollTop + "," + doc.scrollingElement.scrollTop === before, "an outer container scrolled");
      assert(isOpen(pop), "Home closed the list");
    } finally { key(btn, "Escape"); }
  });

  test("data-listbox-ready is set in the enhancement pass, after the selects are enhanced", async () => {
    const f = await boot({
      body: '<label for="a">A</label><select id="a" data-listbox="float"><option>1</option></select>',
      before: '<script>window.__probe = {}; document.addEventListener("DOMContentLoaded", () => {' +
        ' __probe.readyBefore = document.documentElement.hasAttribute("data-listbox-ready");' +
        ' __probe.hiddenBefore = document.getElementById("a").hidden; });<\/script>',
      after: '<script>document.addEventListener("DOMContentLoaded", () => {' +
        ' __probe.readyAfter = document.documentElement.hasAttribute("data-listbox-ready");' +
        ' __probe.btnAfter = !!document.getElementById("a-btn"); });<\/script>',
    });
    try {
      const p = f.win.__probe;
      assert(p.readyBefore === false && p.hiddenBefore === false, "marker or enhancement present before listbox.js's handler ran: " + JSON.stringify(p));
      assert(p.readyAfter === true && p.btnAfter === true, "marker missing or select not enhanced right after listbox.js's handler: " + JSON.stringify(p));
    } finally { f.frame.remove(); }
  });

  test("one enhance throwing still sets data-listbox-ready; the rest enhance; the failed native keeps its label", async () => {
    const one = (id) => '<label for="' + id + '" id="' + id + '-lab">' + id + '</label><select id="' + id + '" data-listbox="float"><option>1</option></select>';
    const f = await boot({
      body: one("a") + one("boom") + one("c"),
      before: "<script>window.__warns = []; { const warn = console.warn;" +
        ' console.warn = function (...args) { __warns.push(args.map(String).join(" ")); return warn.apply(this, args); }; }' +
        ' document.getElementById("boom").after = function () { throw new Error("fixture boom"); };<\/script>',
    });
    try {
      const d = f.doc;
      assert(d.documentElement.hasAttribute("data-listbox-ready"), "data-listbox-ready missing after a failed enhance");
      assert(d.getElementById("a-btn") && d.getElementById("c-btn"), "a select after the failing one was not enhanced");
      assert(!d.getElementById("boom-btn") && d.getElementById("boom").hidden === false, "the failed select is hidden or half-built");
      assert(d.getElementById("boom-lab").htmlFor === "boom", "the failed select's label points at a button that is not in the page: for=" + d.getElementById("boom-lab").htmlFor);
      assert(f.win.__warns.some((w) => w.includes("fixture boom")), "the failure was swallowed without a console.warn: " + JSON.stringify(f.win.__warns));
    } finally { f.frame.remove(); }
  });

  for (const [name, fn] of queue) {
    try { await fn(); report(name); } catch (error) { report(name, error); }
  }
}

// ---- Function area: page-level suites. T6a adds LIB_FRAME_TOKEN,
// loadLibraryFrame, libFrames, libWaitFor and libraryPageGroupCases here;
// T6b, T7a, T7b and T7c add theirs below them. Keep this area above the main
// flow, so every constant is initialised before the flow can reach it.

// ---- Library redesign T6: the library page itself (spec §9.5). One
// library.html in an iframe -- the shipped markup, library.css, listbox.js
// and the library scripts -- so these cases see the DOM, cascade and listeners
// a user does. An http test page has no chrome.*: the stub below answers the
// extension calls the scripts make while booting (one signed-in token so the
// list header renders, empty storage otherwise, no host permissions, English
// messages read from _locales/en), and the first-frame gate is released up
// front because options-theme-early.js -- which would do that after a storage
// read -- is swapped out for the stub. history.replaceState (the tab hash)
// is a no-op here: an about:srcdoc document may not take an http URL.
const LIB_FRAME_TOKEN = "listboxtest:0123456789ABCDEF0123";
async function loadLibraryFrame({ width = 1280, height = 800 } = {}) {
  const [html, en] = await Promise.all([
    fetch("../library.html").then((r) => r.text()),
    fetch("../_locales/en/messages.json").then((r) => r.json()),
  ]);
  const stub = `<base href="../"><script>
window.__bootErrors = [];
window.addEventListener("error", (e) => { window.__bootErrors.push(String(e.message)); });
window.addEventListener("unhandledrejection", (e) => { window.__bootErrors.push(String((e.reason && e.reason.message) || e.reason)); });
window.__pbpEn = ${JSON.stringify(en).replace(/</g, "\\u003c")};
(() => {
  const area = {
    get(keys, cb) { const out = { pinboardToken: ${JSON.stringify(LIB_FRAME_TOKEN)} }; if (typeof cb === "function") { cb(out); return undefined; } return Promise.resolve(out); },
    set(items, cb) { if (typeof cb === "function") { cb(); return undefined; } return Promise.resolve(); },
    remove(keys, cb) { if (typeof cb === "function") { cb(); return undefined; } return Promise.resolve(); },
  };
  const getMessage = (key, subs) => {
    const m = window.__pbpEn[key];
    if (!m) return "";
    const list = subs == null ? [] : [].concat(subs).map(String);
    return m.message.replace(/\\$([A-Za-z0-9_@]+)\\$/g, (all, name) => {
      const ph = m.placeholders && m.placeholders[name.toLowerCase()];
      return ph ? String(ph.content).replace(/\\$(\\d)/g, (_, d) => list[Number(d) - 1] ?? "") : all;
    });
  };
  window.chrome = {
    runtime: { id: "library-listbox-tests", lastError: undefined, getURL: (p) => new URL(p, document.baseURI).href, getManifest: () => ({ version: "0.0.0" }), sendMessage: () => Promise.resolve(undefined), onMessage: { addListener() {} } },
    storage: { local: area, sync: area, session: area, onChanged: { addListener() {} } },
    permissions: { contains: () => Promise.resolve(false), request: () => Promise.resolve(false) },
    i18n: { getMessage, getUILanguage: () => "en" },
  };
})();
history.replaceState = () => {};
document.documentElement.dataset.optionsReady = "1";
</` + `script>`;
  const frame = document.createElement("iframe");
  frame.style.cssText = `width:${width}px;height:${height}px;border:0`;
  // `<\/script>`: a literal close tag would end this page's own script.
  frame.srcdoc = html.replace('<script src="options-theme-early.js"><\/script>', stub);
  document.body.appendChild(frame);
  await new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
  const win = frame.contentWindow;
  await libFrames(win);
  return { frame, win, doc: frame.contentDocument };
}
function libFrames(win, n = 2) {
  return new Promise((resolve) => { const step = (k) => (k ? win.requestAnimationFrame(() => step(k - 1)) : resolve()); step(n); });
}
async function libWaitFor(win, predicate, ms = 5000) {
  const start = performance.now();
  while (performance.now() - start < ms) {
    try { if (predicate()) return true; } catch (_) { /* the page has not defined it yet */ }
    await new Promise((resolve) => win.setTimeout(resolve, 25));
  }
  return false;
}

async function libraryPageGroupCases() {

      `fit=${pane.dataset.headerFit} need=${need} room=${indexRoom} narrowBtn=${win.getComputedStyle(narrowBtn).display} btn=${wb.left},${wb.width}x${wb.height} row=${rr.left},${rr.right}`);

      `narrowed=${narrowed} hiddenBefore=${hiddenInNarrow} open=${set.matches(":popover-open")} width=${bw.width} height=${bw.height}`);
    // A long list in a short window (controller ruling R9 / D3): 30 more

    // cap. The list must stop at --listbox-room, read at its own bottom edge

    const fullHeight = frame.style.height;

    await libFrames(win, 3);
    btn.click();
    await libFrames(win);
    check("T6 the group listbox opens as a top-layer popover nested in the open Filter popover (both open)",
      pop.matches(":popover-open") && set.matches(":popover-open") && btn.getAttribute("aria-expanded") === "true",
      `pop=${pop.matches(":popover-open")} set=${set.matches(":popover-open")} expanded=${btn.getAttribute("aria-expanded")}`);
    const list = doc.getElementById("vocab-group-filter-list");
    const pr = pop.getBoundingClientRect();
    const lr = list.getBoundingClientRect();

      pop.matches(":popover-open") && pop.getAttribute("data-flip") === "up" &&
      pr.top >= -0.5 && pr.bottom <= win.innerHeight + 0.5 && win.getComputedStyle(pop).position === "fixed",
      `open=${pop.matches(":popover-open")} flip=${pop.getAttribute("data-flip")} rect=${pr.top},${pr.bottom} vh=${win.innerHeight}`);
    // T6 closes on an outer scroll only when it carries the button (> 1px),
    // so this really scrolls the pane -- whichever way it still has room.
    const paneEl = doc.getElementById("vocab-detail-pane");
    const topBefore = btn.getBoundingClientRect().top;
    const room = paneEl.scrollHeight - paneEl.clientHeight;
    paneEl.scrollTop = paneEl.scrollTop < room ? Math.min(room, paneEl.scrollTop + 40) : Math.max(0, paneEl.scrollTop - 40);
    await libFrames(win, 3);
    const moved = Math.abs(btn.getBoundingClientRect().top - topBefore);
    check("T7 scrolling the detail pane closes the language list",
      moved > 1 && !pop.matches(":popover-open") && pop.hidden,
      `moved=${moved.toFixed(1)} room=${room} open=${pop.matches(":popover-open")}`);
  } finally {
    try { win.eval("if (window.__realDictRun) _pbpVocabDictRun = window.__realDictRun;"); } catch (_) {}
    frame.remove();
  }
}

// Hand-written in freedictionaryapi.com's response shape (tests/md-dict-tests.html

// ---- Library redesign T7b (Review Focus 4): content real data carries -- a
// 60-character word with no break opportunity, an 80-character group name --
// at a wide and a narrow window, on the real page.
async function libraryPageLongContentCases() {
  const term = "Pneumonoultramicroscopicsilicovolcanoconiosis" + "Supercalifragil";
  const group = "Sehr lange Gruppenbezeichnung für Lektüre, Wiederholung und Prüfungsvorbereitung im Herbstsemester".slice(0, 80);
  for (const width of [2200, 600]) {
    const { frame, win, doc } = await loadLibraryFrame({ width, height: 900 });
    try {
      const booted = await libWaitFor(win, () => win.eval("_vocabCurrentOwner") === "acct_listboxtest");
      check(`T7 RF4 ${width}px: library.html boots`, booted && win.__bootErrors.length === 0 && term.length === 60 && group.length === 80,
        `booted=${booted} errors=${win.__bootErrors.slice(0, 3).join(" | ")}`);
      if (!booted) continue;
      win.eval(`_vocabRows = [{ id: "rf4", term: ${JSON.stringify(term)}, language: "en", gloss: "", note: "", status: "new",
        groups: [${JSON.stringify(group)}], contexts: [], createdAt: 1, updatedAt: 1 }];
        _pbpVocabRefreshGroupOptions(false); _pbpVocabApplyView(true);`);
      const filter = doc.getElementById("vocab-group-filter");
      filter.value = group;
      win.pbpListboxSync(filter);
      // The header fit re-decides wide / narrow from the row's content (the
      // long group widens the listbox): let it settle before choosing how to
      // reveal the set.
      await libFrames(win);
      const set = doc.getElementById("vocab-filter-set");
      if (!set.getClientRects().length && !set.matches(":popover-open")) doc.getElementById("vocab-filter-narrow").click();
      await libFrames(win);
      const region = doc.querySelector(".vocab-list-region");
      const sr = set.getBoundingClientRect();
      const gr = doc.getElementById("vocab-group-filter-btn").getBoundingClientRect();
      check(`T7 RF4 ${width}px: the long word and group keep the list region from scrolling sideways`,
        region.scrollWidth <= region.clientWidth + 1, `${region.scrollWidth} > ${region.clientWidth}`);
      check(`T7 RF4 ${width}px: the group listbox button stays inside the filter set`,
        gr.width > 0 && gr.left >= sr.left - 0.5 && gr.right <= sr.right + 0.5, `button ${gr.left}-${gr.right} set ${sr.left}-${sr.right}`);
      if (set.matches(":popover-open")) set.hidePopover();
      if (width <= 860) doc.body.classList.add("lib-narrow-detail");
      win.eval("_pbpVocabRenderDetail(_vocabRows[0], true)");
      await libFrames(win);
      const pane = doc.getElementById("vocab-detail-pane");
      check(`T7 RF4 ${width}px: the detail pane does not scroll sideways for the long word`,
        pane.scrollWidth <= pane.clientWidth + 1, `${pane.scrollWidth} > ${pane.clientWidth}`);
      win.eval("_pbpVocabToggleGroupEditor(true, false)");
      await libFrames(win);
      check(`T7 RF4 ${width}px: nor with the group editor open on the long group`,
        pane.scrollWidth <= pane.clientWidth + 1, `${pane.scrollWidth} > ${pane.clientWidth}`);
    } finally {
      frame.remove();
    }
  }
}

// ---- Library redesign T8f (spec appendix 10-05, "main column first"): the
// dictionary column joins the sheet only from C = 1376 (= 112 + 840 + 64 +
// 360), and then takes only what the 840 main column leaves. Before, it
// joined at 1280 and grew first, so crossing 1280 dropped the main column
// from 840 to 384 and rewrapped every line of the word. C is driven by the
// index column at a fixed window (no resize), measured on the real page.
async function libraryPageRefTierCases() {
  const { frame, win, doc } = await loadLibraryFrame({ width: 2200, height: 1000 });
  try {
    const booted = await libWaitFor(win, () => win.eval("_vocabCurrentOwner") === "acct_listboxtest");
    check("T8f library.html boots at 2200px for the dictionary column tier scan", booted && win.__bootErrors.length === 0,
      win.__bootErrors.slice(0, 3).join(" | "));
    if (!booted) return;
    win.eval(`_vocabRows = [{ id: "tier1", term: "constraint", language: "en", ipa: "/kənˈstreɪnt/",
      gloss: "a limitation or restriction", note: "", status: "new", groups: [],
      contexts: [{ quote: "The constraint shaped the design.", articleTitle: "On constraints",
        articleUrl: "https://example.com/reading/attention", createdAt: Date.now() - 86400000 }],
      createdAt: 1, updatedAt: 1 }]; _pbpVocabApplyView(true); _pbpVocabRenderDetail(_vocabRows[0], false);`);
    await libFrames(win);
    const html = doc.documentElement;
    const pane = doc.getElementById("vocab-detail-pane");
    const paneC = () => {
      const cs = win.getComputedStyle(pane);
      return pane.getBoundingClientRect().width - (pane.offsetWidth - pane.clientWidth) - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    };
    html.style.setProperty("--lib-index-w", "400px");
    const c0 = paneC();
    const at = (c) => {
      html.style.setProperty("--lib-index-w", `${400 + c0 - c}px`);
      const head = doc.querySelector("#vocab-detail .vocab-detail-head").getBoundingClientRect();
      const ref = doc.getElementById("vocab-ref").getBoundingClientRect();
      return { c: Math.round(paneC() * 100) / 100, main: Math.round(head.width * 100) / 100, refW: Math.round(ref.width * 100) / 100,
        beside: ref.left >= head.right - 0.5 && Math.abs(ref.top - head.top) <= 1, below: ref.top >= head.bottom - 0.5 };
    };
    const edge = [1279, 1280, 1281, 1375, 1376, 1377].map(at);
    check("T8f the dictionary column joins the sheet only from C 1376, and the main column stays 840 across the switch",
      edge.every((r, i) => Math.abs(r.c - [1279, 1280, 1281, 1375, 1376, 1377][i]) <= 0.5 && Math.abs(r.main - 840) <= 0.5 &&
        (r.c >= 1376 ? r.beside : r.below && !r.beside)),
      JSON.stringify(edge));
    const grow = [1376, 1600, 1736, 1900].map(at);
    check("T8f from C 1376 the dictionary column grows from 360 to its 720 cap while the main column keeps 840",
      grow.every((r) => r.beside && Math.abs(r.main - 840) <= 0.5 && Math.abs(r.refW - Math.min(720, r.c - 1016)) <= 0.5),
      JSON.stringify(grow));
  } finally {
    frame.remove();
  }
}

// ---- Library redesign T7b (spec §7.7, §9.4): every locale at a 2200px window
// (C >= 1376: the hang column and the dictionary column are both live), on
// the real page -- the detail is built by library-vocab.js, so a hand-copied
// srcdoc would only test what its author remembered.
async function libraryPageDetailLocaleCases() {
  const locales = ["en", "de", "fr", "pl", "ru", "zh_HK", "zh_CN", "zh_TW", "ja"];
  const messages = {};
  for (const locale of locales) messages[locale] = await (await fetch(`../_locales/${locale}/messages.json`)).json();
  const { frame, win, doc } = await loadLibraryFrame({ width: 2200, height: 1000 });
  const bad = [];
  try {
    const booted = await libWaitFor(win, () => win.eval("_vocabCurrentOwner") === "acct_listboxtest");
    check("T7 library.html boots at 2200px for the nine-locale detail scan", booted && win.__bootErrors.length === 0,
      win.__bootErrors.slice(0, 3).join(" | "));
    if (!booted) return;
    win.eval(`_vocabRows = [{ id: "loc1", term: "constraint", language: "en", ipa: "/kənˈstreɪnt/",
      gloss: "a limitation or restriction", note: "", status: "new", groups: ["Reading", "Close reading"],
      contexts: [{ quote: "The constraint shaped the design.", articleTitle: "On constraints in design",
        articleUrl: "https://example.com/reading/attention", createdAt: Date.now() - 86400000 }],
      createdAt: 1, updatedAt: 1 }]; _pbpVocabApplyView(true);`);
    // The dict2_ cache answers, so the source line renders without a request;
    // the page's own normalizer builds the record from the server's shape.
    const cached = win.pbpDictNormalizeEntry(JSON.parse(JSON.stringify(FDA_CONSTRAINT)));
    win.pbpAiCacheGet = async () => ({ result: cached });
    for (const locale of locales) {
      win.__pbpEn = messages[locale];
      win.applyI18n();
      win.eval("_pbpVocabRenderDetail(null); _pbpVocabRenderDetail(_vocabRows[0], false); _pbpVocabRelookup(_vocabRows[0]);");
      const landed = await libWaitFor(win, () => !!doc.querySelector("#vocab-ref-result .xp-dict-src"));
      win.eval("_pbpVocabToggleGroupEditor(true, false)");
      await libFrames(win);
      if (!landed) { bad.push(`${locale}: the cached result never rendered`); continue; }
      const pane = doc.getElementById("vocab-detail-pane");
      const cs = win.getComputedStyle(pane);
      const axis = pane.getBoundingClientRect().left + parseFloat(cs.borderLeftWidth) + parseFloat(cs.paddingLeft);
      const mainRight = doc.querySelector("#vocab-detail .vocab-detail-head").getBoundingClientRect().right;
      const refRight = doc.getElementById("vocab-ref").getBoundingClientRect().right;
      for (const label of doc.querySelectorAll("#vocab-detail .lib-hang-label")) {
        const range = doc.createRange();
        range.selectNodeContents(label);
        const r = range.getBoundingClientRect();
        if (r.left < axis - 0.5 || r.right > axis + 96 + 0.5) {
          bad.push(`${locale}: label "${label.textContent}" ${r.left.toFixed(1)}-${r.right.toFixed(1)} outside [${axis.toFixed(1)}, ${(axis + 96).toFixed(1)}]`);
        }
      }
      for (const el of doc.querySelectorAll("#vocab-detail .vocab-manage-row > *, #vocab-group-editor > *, #vocab-detail-tail .vocab-detail-footer > *")) {
        if (!el.getClientRects().length) continue;
        const r = el.getBoundingClientRect();
        if (r.right > mainRight + 0.5) bad.push(`${locale}: ${el.className || el.tagName} ends at ${r.right.toFixed(1)}, past the main column ${mainRight.toFixed(1)}`);
      }
      for (const el of doc.querySelectorAll("#vocab-ref-result .xp-dict-src, #vocab-ref-result .vocab-ref-foot > *")) {
        const r = el.getBoundingClientRect();
        if (r.right > refRight + 0.5) bad.push(`${locale}: ${el.className} ends at ${r.right.toFixed(1)}, past the dictionary column ${refRight.toFixed(1)}`);
      }
      if (pane.scrollWidth > pane.clientWidth + 1) bad.push(`${locale}: the pane scrolls sideways (${pane.scrollWidth} > ${pane.clientWidth})`);
    }
    check("T7 at 2200px every locale keeps the hang labels in their 96px column and the manage row, group editor, tail and source line in their columns",
      bad.length === 0, bad.slice(0, 6).join("; "));
  } finally {
    frame.remove();
  }
}

// ---- Library redesign T7c (spec §4.10, the "open a saved word" row): with
// the word open and never looked up by hand, a language change re-runs
// open-to-look-up in the new language -- local, then cache, online only with
// the grant and after the dwell.
async function libraryPageAutoLookupLangCases() {
  const { frame, win, doc } = await loadLibraryFrame({ width: 1280, height: 800 });
  try {
    const booted = await libWaitFor(win, () => win.eval("_vocabCurrentOwner") === "acct_listboxtest");
    check("T7 library.html boots for the open-to-look-up language cases", booted && win.__bootErrors.length === 0,
      win.__bootErrors.slice(0, 3).join(" | "));
    if (!booted) return;
    const fetched = [];
    win.fetch = (url) => { fetched.push(String(url)); return Promise.resolve({ status: 200, ok: true, json: async () => ({ word: "maison", entries: [] }) }); };
    win.pbpEcdictLookup = async () => ({ state: "unavailable" });
    win.pbpPackLookup = async () => ({ state: "unavailable" });
    win.pbpAiCacheGet = async () => null;
    win.eval(`_vocabRows = [{ id: "al-fr", term: "maison", language: "fr", groups: [], contexts: [], createdAt: 1, updatedAt: 1 }]; _pbpVocabApplyView(true);`);
    const sel = doc.getElementById("vocab-lookup-lang");
    const btn = doc.getElementById("vocab-lookup-lang-btn");
    const result = doc.getElementById("vocab-ref-result");
    const pick = async (code) => {
      btn.click();
      await libFrames(win);
      doc.querySelector(`#vocab-lookup-lang-list .listbox-opt[data-value="${code}"]`).click();
      await libFrames(win);
    };
    win.eval("_pbpVocabRenderDetail(_vocabRows[0], true)");
    await libWaitFor(win, () => result.dataset.refState === "idle");
    await pick("it");
    await new Promise((resolve) => win.setTimeout(resolve, 400));
    check("T7 without the grant, picking another language re-runs open-to-look-up locally and sends nothing",
      fetched.length === 0 && result.dataset.refState === "idle" && sel.value === "it", `${fetched.join(" ")} state=${result.dataset.refState}`);
    win.chrome.permissions.contains = () => Promise.resolve(true);
    const cached = win.pbpDictNormalizeEntry({ ...JSON.parse(JSON.stringify(FDA_CONSTRAINT)), word: "maison" });
    const esKey = win.pbpDictQueryCacheKey("es", "maison");
    win.pbpAiCacheGet = async (key) => (key === esKey ? { result: cached } : null);
    await pick("es");
    await libWaitFor(win, () => !!result.querySelector(".xp-dict-online .xp-dict-entry"));
    check("T7 with the grant, a language whose result is cached renders from the cache with zero requests",
      fetched.length === 0 && !!result.querySelector(".xp-dict-online .xp-dict-entry"), fetched.join(" "));
    await pick("nl");
    await new Promise((resolve) => win.setTimeout(resolve, 450));
    await libWaitFor(win, () => fetched.length > 0);
    check("T7 with the grant and nothing cached, the new language costs one request after the dwell",
      fetched.length === 1 && /\/nl\/maison$/.test(fetched[0]), fetched.join(" "));
  } finally {
    frame.remove();
  }
}

// ---- Main flow (last thing in this script). A setup error that escapes a
// suite becomes one failed row; the row count then falls short and
// run-test.mjs reports the stall, which is the red it should be.
(async () => {
  try {
    await primitiveCases();
    // Mount point: page-level suites, one `await <name>();` per line, in task
    // order (T6a libraryPageGroupCases, T6b libraryPageSortCases, T7a
    // libraryPageLookupLangCases, T7b libraryPageLongContentCases +
    // libraryPageDetailLocaleCases, T7c libraryPageAutoLookupLangCases).
    await libraryPageGroupCases();
    await libraryPageSortCases();
    await libraryPageLookupLangCases();
    await libraryPageLongContentCases();
    await libraryPageDetailLocaleCases();
    await libraryPageRefTierCases();
    await libraryPageAutoLookupLangCases();
  } catch (error) {
    report("suite setup", error);
  }
  document.title = (fail ? "FAIL" : "PASS") + " Library Listbox Tests";   // summary line
})();
</script>
<script>
// ---- T4b: the narrow-index "Filter" popover wiring (library.js
// pbpLibWireFilterPopover). Own fixture, no library.css: which form is
// showing is the button's computed display, so the test flips that inline.
(async () => {
  const frames = () => new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  const host = document.createElement("div");
  host.innerHTML = `
    <div id="t4-index" style="width:360px">
      <button type="button" id="t4-narrow" popovertarget="t4-set" aria-expanded="false">Filter</button>
      <div id="t4-set" popover="auto">
        <select id="t4-group" data-listbox="float"><option value="">All</option><option value="a">A</option></select>
        <button type="button" id="t4-toggle" aria-pressed="false">x</button>
      </div>
    </div>`;
  document.body.appendChild(host);
  const set = document.getElementById("t4-set");
  const btn = document.getElementById("t4-narrow");
  const index = document.getElementById("t4-index");
  if (typeof pbpEnhanceListbox === "function") pbpEnhanceListbox(document.getElementById("t4-group"));
  if (typeof pbpLibWireFilterPopover === "function") pbpLibWireFilterPopover(set, btn, index);

  set.showPopover();
  await frames();
  const r = set.getBoundingClientRect();
  check("T4b opening the Filter popover marks the button expanded and places it with pbpListboxPlace",
    btn.getAttribute("aria-expanded") === "true" && set.style.position === "fixed" &&
    r.left >= 0 && r.top >= 0 && r.right <= innerWidth && r.bottom <= innerHeight,
    `expanded=${btn.getAttribute("aria-expanded")} position=${set.style.position}`);

  const lbBtn = document.getElementById("t4-group-btn");
  if (lbBtn) lbBtn.click();
  const lbOpenBefore = !!lbBtn && lbBtn.getAttribute("aria-expanded") === "true";
  set.hidePopover();
  await frames();
  check("T4b closing the Filter popover closes the list box open inside it and clears the inline placement",
    lbOpenBefore && lbBtn.getAttribute("aria-expanded") === "false" &&
    btn.getAttribute("aria-expanded") === "false" && !set.getAttribute("style") && !set.hasAttribute("data-flip"),
    `lbBefore=${lbOpenBefore} lbAfter=${lbBtn && lbBtn.getAttribute("aria-expanded")} style=${set.getAttribute("style")}`);

  set.showPopover();
  await frames();
  index.style.width = "300px";
  await frames();
  check("T4b a width change that keeps the narrow form leaves the popover open", set.matches(":popover-open"));

  btn.style.display = "none";
  index.style.width = "520px";
  await frames();
  await frames();
  check("T4b crossing into the wide form (button hidden) closes the popover",
    !set.matches(":popover-open") && btn.getAttribute("aria-expanded") === "false");
  host.remove();
})();
</script>
