<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Popup Tag Cache Tests</title>
<style>
body { font-family: monospace; padding: 16px; max-width: 900px; }
.case { padding: 6px; border-bottom: 1px solid #eee; white-space: pre-wrap; }
.pass { color: #0a0; }
.fail { color: #c00; font-weight: bold; }
</style></head>
<body>
<h1>Popup tag cache account isolation tests</h1>
<div id="results"></div>
<script>
let settings = { pinboardToken: "alice:token" };
// Ambient popup globals popup-tags.js closes over (declared in popup.js there).
let currentTags = [];
let allUserTags = [];
let allUserTagCounts = {};
let tagCaseMap = null;
let acIndex = -1;
const statusCalls = [];
function t(key, ...args) { return args.length ? key + ":" + args.join(",") : key; }
function showStatus(id, msg, kind) { statusCalls.push({ id, msg, kind }); }
</script>
<script src="../shared.js"></script>
<script src="../popup-tags.js"></script>
<script>
function test(name, fn) {
  let ok = true;
  let detail = "";
  try { fn(); }
  catch (error) { ok = false; detail = "\n  " + error.message; }
  const row = document.createElement("div");
  row.className = "case " + (ok ? "pass" : "fail");
  row.textContent = `${ok ? "PASS" : "FAIL"} ${name}${detail}`;
  document.getElementById("results").appendChild(row);
}

function assert(condition, message) {
  if (!condition) throw new Error(message || "assertion failed");
}

test("same-account entry is accepted", () => {
  const entry = { account: "alice", counts: { js: 2 }, timestamp: 1 };
  assert(pbpPopupTagCacheEntry(entry, "alice:token") === entry);
});

test("different-account entry is rejected", () => {
  const entry = { account: "alice", counts: { private: 1 }, timestamp: 1 };
  assert(pbpPopupTagCacheEntry(entry, "bob:token") === null);
});

test("legacy user-tag entry without account is rejected", () => {
  assert(pbpPopupTagCacheEntry({ counts: { old: 1 }, timestamp: 1 }, "alice:token") === null);
});

test("legacy last-used tag array is rejected", () => {
  assert(pbpPopupTagCacheEntry(["old-tag"], "alice:token") === null);
});

test("malformed or missing token fails closed", () => {
  const entry = { account: "alice", tags: ["one"] };
  assert(pbpPopupTagCacheEntry(entry, "missing-separator") === null);
  assert(pbpPopupTagCacheEnvelope("", { tags: ["one"] }) === null);
});

test("obfuscated current token resolves the same account", () => {
  const entry = { account: "alice", data: [{ popular: ["js"] }] };
  assert(pbpPopupTagCacheEntry(entry, obfuscateKey("alice:secret")) === entry);
});

test("cache envelope binds user tags and suggestions to token account", () => {
  const counts = { js: 3 };
  const data = [{ popular: ["js"] }];
  const userTags = pbpPopupTagCacheEnvelope("alice:token", { counts, timestamp: 10 });
  const suggest = pbpPopupTagCacheEnvelope("alice:token", { data, timestamp: 20 });
  assert(userTags.account === "alice" && userTags.counts === counts && userTags.timestamp === 10);
  assert(suggest.account === "alice" && suggest.data === data && suggest.timestamp === 20);
});

test("cache envelope binds last-used tags and cannot be account-spoofed", () => {
  const entry = pbpPopupTagCacheEnvelope("alice:token", { account: "mallory", tags: ["one", "two"] });
  assert(entry.account === "alice");
  assert(entry.tags.join(" ") === "one two");
});

test("in-memory result guard follows the live popup account", () => {
  settings.pinboardToken = "alice:new-token";
  assert(pbpPopupTagAccountIsCurrent("alice"));
  settings.pinboardToken = "bob:token";
  assert(!pbpPopupTagAccountIsCurrent("alice"));
  assert(pbpPopupTagAccountIsCurrent("bob"));
});

// ---------------------------------------------------------------------------
// Tag input / suggest-row behaviour. The real setupTagsInput() and
// fetchPinboardSuggestTags() are driven against a fixture that mirrors
// popup.html's markup (skeleton spans included), so these assert what a
// keystroke actually does rather than how the source is spelled.
// ---------------------------------------------------------------------------
async function testAsync(name, fn) {
  let ok = true;
  let detail = "";
  try { await fn(); }
  catch (error) { ok = false; detail = "\n  " + error.message; }
  const row = document.createElement("div");
  row.className = "case " + (ok ? "pass" : "fail");
  row.textContent = `${ok ? "PASS" : "FAIL"} ${name}${detail}`;
  document.getElementById("results").appendChild(row);
}

const nextFrame = () => new Promise((r) => requestAnimationFrame(() => r()));
const SKEL = '<span class="tag-skel"></span><span class="tag-skel"></span>'
  + '<span class="tag-skel"></span><span class="tag-skel"></span>';

const fixture = document.createElement("div");
fixture.innerHTML = `
  <div id="suggest-row" class="row hidden">
    <div id="pinboard-suggest-tags" class="suggest-area" aria-busy="true">${SKEL}</div>
  </div>
  <div class="tags-input-wrap">
    <span id="tags-display"></span>
    <input id="tags-input" type="text">
  </div>
  <div id="tags-autocomplete" class="autocomplete-dropdown hidden"></div>
  <a id="tags-clear-all" href="#"></a>
  <a id="tags-copy-all" href="#"></a>
  <div id="tags-last-used" class="hidden"></div>`;
document.body.appendChild(fixture);

const tagsInput = document.getElementById("tags-input");
const dropdown = document.getElementById("tags-autocomplete");
const suggestRow = document.getElementById("suggest-row");
const suggestBox = document.getElementById("pinboard-suggest-tags");

// Storage is deferred on purpose: the suggest skeleton must outlive the first
// await, and a resolved-promise stub would hide that.
let releaseStorage = () => {};
let storagePayload = {};
window.chrome = {
  storage: {
    local: {
      get: () => new Promise((resolve) => { releaseStorage = () => resolve(storagePayload); }),
      set: () => Promise.resolve(),
    },
  },
};

settings.pinboardToken = "alice:token";
setupTagsInput();

function resetInput(tags) {
  currentTags = [];
  allUserTags = tags || [];
  allUserTagCounts = {};
  acIndex = -1;
  tagsInput.value = "";
  dropdown.innerHTML = "";
  dropdown.classList.add("hidden");
  statusCalls.length = 0;
}
function key(init) { return new KeyboardEvent("keydown", { bubbles: true, ...init }); }
function typeInto(value) {
  tagsInput.value = value;
  tagsInput.dispatchEvent(new Event("input", { bubbles: true }));
}

(async () => {
  await test("composing Space never submits the uncommitted IME string", () => {
    resetInput();
    tagsInput.value = "biaoqian";
    tagsInput.dispatchEvent(key({ key: " ", isComposing: true }));
    assert(currentTags.length === 0, "a candidate-pick Space added a tag: " + currentTags.join("|"));
    assert(tagsInput.value === "biaoqian", "a candidate-pick Space cleared the composition");
  });

  await test("an IME commit keydown (keyCode 229) never submits", () => {
    resetInput();
    tagsInput.value = "biaoqian";
    ["Enter", "Tab", " ", "，"].forEach((k) => {
      tagsInput.dispatchEvent(key({ key: k, keyCode: 229 }));
    });
    assert(currentTags.length === 0, "an IME commit key added a tag: " + currentTags.join("|"));
    assert(tagsInput.value === "biaoqian", "an IME commit key cleared the composition");
  });

  await test("a genuine Space still commits the typed tag", () => {
    resetInput();
    tagsInput.value = "biaoqian";
    tagsInput.dispatchEvent(key({ key: " " }));
    assert(currentTags.join("|") === "biaoqian", "guard swallowed a real keystroke: " + currentTags.join("|"));
  });

  await testAsync("Enter before the pending rebuild commits the current input, not the last frame's", async () => {
    resetInput();
    typeInto("jso");
  await nextFrame();
    assert(dropdown.querySelector(".ac-new-hint")?.dataset.tag === "jso", "fixture never rendered the new-tag hint");
    typeInto("json"); // rebuild is queued for the next frame and must not be read stale
    tagsInput.dispatchEvent(key({ key: "Enter" }));
    assert(currentTags.join("|") === "json", "Enter committed the previous frame: " + currentTags.join("|"));
  });

  await testAsync("Enter before the pending rebuild picks from the fresh match list", async () => {
    resetInput(["jsdoc", "json-api"]);
    typeInto("js");
  await nextFrame();
    assert(dropdown.querySelectorAll(".ac-item").length === 2, "fixture never rendered both matches");
    typeInto("jso"); // only json-api still matches
    tagsInput.dispatchEvent(key({ key: "Enter" }));
    assert(currentTags.join("|") === "json-api", "Enter used the stale match list: " + currentTags.join("|"));
  });

  await test("a hidden Suggest row sends the tag-sync error to the popup error card", () => {
    resetInput();
    suggestRow.classList.add("hidden");
    suggestBox.textContent = "";
    showTagSyncError("pinboardErrorRateLimit");
    assert(statusCalls.length === 1 && statusCalls[0].kind === "error",
      "no error card was raised, got " + JSON.stringify(statusCalls));
    assert(statusCalls[0].msg === "pinboardErrorRateLimit", "wrong message: " + statusCalls[0].msg);
    assert(suggestBox.textContent === "", "wrote into the hidden container anyway");
  });

  await test("an already-filled suggest container sends the tag-sync error to the error card", () => {
    resetInput();
    suggestRow.classList.remove("hidden");
    suggestBox.innerHTML = '<div class="suggest-group"></div>';
    showTagSyncError("pinboardErrorOffline");
    assert(statusCalls.length === 1 && statusCalls[0].msg === "pinboardErrorOffline",
      "suggest results swallowed the sync error, got " + JSON.stringify(statusCalls));
  });

  await test("a still-pulsing skeleton counts as occupied", () => {
    resetInput();
    suggestRow.classList.remove("hidden");
    suggestBox.innerHTML = SKEL;
    showTagSyncError("pinboardErrorServer");
    assert(statusCalls.length === 1 && statusCalls[0].msg === "pinboardErrorServer",
      "the message was written under a skeleton that suggest will overwrite");
    assert(suggestBox.querySelectorAll(".tag-skel").length === 4, "the skeleton was replaced mid-flight");
  });

  await testAsync("a failed tag-cache write never masquerades as a failed sync", async () => {
    // The tags themselves already landed (applyTagData ran), so autocomplete,
    // the counts and the AI prompt's "existing tags" all work. A local-storage
    // quota failure is a lost cache entry -- letting it reach the outer catch
    // classified it as a Pinboard error and, with the skeletons still holding
    // the inline container, escalated it to the full-width red card on every
    // popup open.
    resetInput();
    settings.pinboardToken = "alice:token";
    settings.tagSyncMode = "fresh"; // straight to the network leg
    suggestRow.classList.remove("hidden");
    suggestBox.innerHTML = SKEL;
    const realFetch = window.pinboardFetch;
    const realSet = chrome.storage.local.set;
    window.pinboardFetch = async () => ({ ok: true, status: 200, json: async () => ({ js: 3, css: 1 }) });
    chrome.storage.local.set = () => Promise.reject(new Error("QuotaExceededError"));
    try {
      await fetchAllUserTags("alice:token");
    } finally {
      window.pinboardFetch = realFetch;
      chrome.storage.local.set = realSet;
      delete settings.tagSyncMode;
    }
    assert(allUserTags.length === 2, "the tags never landed: " + allUserTags.join("|"));
    assert(statusCalls.length === 0, "a lost cache entry raised a sync error card: " + JSON.stringify(statusCalls));
    assert(suggestBox.querySelectorAll(".tag-skel").length === 4, "the suggest skeleton was overwritten");
  });

  await test("a visible, empty Suggest row keeps the inline message", () => {
    resetInput();
    suggestRow.classList.remove("hidden");
    suggestBox.textContent = "";
    showTagSyncError("pinboardErrorTimeout");
    assert(suggestBox.textContent === "pinboardErrorTimeout", "inline message lost: " + suggestBox.textContent);
    assert(statusCalls.length === 0, "raised a redundant error card");
  });

  await testAsync("the suggest skeleton survives until the data lands", async () => {
    resetInput();
    settings.pinboardToken = "alice:token";
    suggestRow.classList.remove("hidden");
    suggestBox.innerHTML = SKEL;
    suggestBox.setAttribute("aria-busy", "true");
    const url = "https://example.com/article";
    storagePayload = {
      ["cached_suggest_" + url]: {
        account: "alice",
        timestamp: Date.now(),
        data: [{ popular: ["js"] }, { recommended: ["css"] }],
      },
    };
    const done = fetchPinboardSuggestTags("alice:token", url);
    assert(suggestBox.querySelectorAll(".tag-skel").length === 4,
      "the skeleton was wiped before the first await, so it can never paint");
    releaseStorage();
  await done;
    assert(suggestBox.querySelectorAll(".tag-skel").length === 0, "the skeleton outlived the data");
    assert(suggestBox.querySelectorAll(".stag").length === 2,
      "suggested chips missing, got " + suggestBox.querySelectorAll(".stag").length);
    assert(suggestBox.getAttribute("aria-busy") === "false", "aria-busy stayed true");
  });

  // K74: Add all must ride the last group that actually renders, so a
  // popular-only response (recommended empty) still gets a batch entry
  // point, and a both-groups response keeps it exactly where it was.
  await testAsync("popular-only suggestions get an Add all inside the popular group", async () => {
    resetInput();
    settings.pinboardToken = "alice:token";
    suggestRow.classList.remove("hidden");
    suggestBox.innerHTML = SKEL;
    suggestBox.setAttribute("aria-busy", "true");
    const url = "https://example.com/popular-only";
    storagePayload = {
      ["cached_suggest_" + url]: {
        account: "alice",
        timestamp: Date.now(),
        data: [{ popular: ["one", "two"] }, { recommended: [] }],
      },
    };
    const done = fetchPinboardSuggestTags("alice:token", url);
    releaseStorage();
    await done;
    const groups = suggestBox.querySelectorAll(".suggest-group");
    assert(groups.length === 1, "expected only the popular group, got " + groups.length);
    const addAll = suggestBox.querySelector("#add-all-suggest");
    assert(addAll, "popular-only response has no Add all entry point");
    assert(groups[0].contains(addAll), "Add all must live inside the popular group when it's the only one");
    addAll.click();
    assert(currentTags.slice().sort().join(",") === "one,two",
      "Add all must add exactly the popular tags, got " + currentTags.join(","));
  });

  await testAsync("both groups present keeps Add all on the recommended group's tail", async () => {
    resetInput();
    settings.pinboardToken = "alice:token";
    suggestRow.classList.remove("hidden");
    suggestBox.innerHTML = SKEL;
    suggestBox.setAttribute("aria-busy", "true");
    const url = "https://example.com/both-groups";
    storagePayload = {
      ["cached_suggest_" + url]: {
        account: "alice",
        timestamp: Date.now(),
        data: [{ popular: ["one"] }, { recommended: ["two"] }],
      },
    };
    const done = fetchPinboardSuggestTags("alice:token", url);
    releaseStorage();
    await done;
    const groups = suggestBox.querySelectorAll(".suggest-group");
    assert(groups.length === 2, "expected both groups, got " + groups.length);
    const addAll = suggestBox.querySelector("#add-all-suggest");
    assert(addAll, "Add all missing when both groups render");
    assert(groups[1].contains(addAll), "Add all must stay on the recommended group's tail, unchanged from before K74");
    assert(!groups[0].contains(addAll), "Add all must not move to the popular group when recommended also renders");
  });

  await testAsync("a bail-out for another account takes the skeleton down", async () => {
    resetInput();
    settings.pinboardToken = "bob:token";
    suggestBox.innerHTML = SKEL;
    suggestBox.setAttribute("aria-busy", "true");
  await fetchPinboardSuggestTags("alice:token", "https://example.com/other");
    assert(suggestBox.querySelectorAll(".tag-skel").length === 0, "left a skeleton pulsing forever");
    assert(suggestBox.getAttribute("aria-busy") === "false", "aria-busy stayed true");
    settings.pinboardToken = "alice:token";
  });
})();
</script>
</body></html>
