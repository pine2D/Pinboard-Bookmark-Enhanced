<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>A11y Tests</title>
<style>
.case.pass{color:#0a0;}.case.fail{color:#c00;font-weight:bold;}
/* Exercise the shared placement helper with the same intrinsic-width shape
   used by the four shipped surfaces. Surface CSS is separately pinned by
   ui-contract-tests.mjs; this fixture keeps the behavioural test self-contained. */
.confirm-popover{box-sizing:border-box;display:flex;align-items:center;gap:6px;width:max-content;max-width:min(60ch,78vw);padding:4px 8px;white-space:nowrap;}
.confirm-popover button{flex:none;}
</style>
</head>
<body>
<div id="results"></div>
<div id="fixture" style="display:none"></div>
<script src="../shared.js"></script>
<script src="../i18n.js"></script>
<script>
function pass(n){const d=document.createElement("div");d.className="case pass";d.textContent="OK "+n;results.appendChild(d);}
function fail(n,m){const d=document.createElement("div");d.className="case fail";d.textContent="X "+n+" :: "+m;results.appendChild(d);}
function test(n,fn){try{fn();pass(n);}catch(e){fail(n,e.message);}}
function asyncTest(n,fn){Promise.resolve().then(fn).then(()=>pass(n)).catch(e=>fail(n,e.message));}
const results=document.getElementById("results");

function assert(cond,msg){if(!cond)throw new Error(msg||"assertion failed");}

// Division of labor in this file (K114 fixture-honesty fix, 2026-09):
// G6/G6b/G7/G8 load ../shared.js and ../i18n.js and drive real shipped
// functions (showConfirmPopover / applyI18n / setupSecretToggles) -- true
// regression gates. G2/G3/G4 are shape snapshots: popup.js/options.js need
// chrome.* APIs and their own HTML, so a file:// page can't load them; where
// a static assertion is feasible their real shipped shape is pinned instead
// in tests/ui-contract-tests.mjs. A G1 block (a hand-built role=button span
// mirroring the Recent-row edit/delete controls) was deleted here 2026-09:
// popup.js ships native <button> elements with no role/tabindex/keydown, so
// G1 was pinning a shape the shipped code no longer has and stayed green
// regardless -- see tests/ui-contract-tests.mjs for the replacement.

// G2: ARIA tablist/tab/tabpanel + roving focus for options tabs (vertical sidebar).
// Shape snapshot, not a regression gate (see division-of-labor note above).
// The real shipped shape -- tablist role/aria-orientation, per-tab
// role/aria-controls, and the roving-tabindex + ArrowUp/ArrowDown handlers --
// is asserted against source text in tests/ui-contract-tests.mjs (K114).
// Deviation from brief: ArrowDown/ArrowUp used (not ArrowRight/ArrowLeft) because .tabs is
// a vertical sidebar (flex-direction:column) and aria-orientation="vertical" requires vertical arrows.
(function(){
  const wrap=document.createElement("div");
  wrap.id="g2-fixture";
  wrap.style.display="none";
  wrap.innerHTML=`
    <div class="tabs" role="tablist" aria-orientation="vertical">
      <button class="tab-btn active" id="tab-general" data-panel="general" role="tab" aria-selected="true"  aria-controls="panel-general">General</button>
      <button class="tab-btn"        id="tab-popup"   data-panel="popup"   role="tab" aria-selected="false" aria-controls="panel-popup">Popup</button>
    </div>
    <div id="panel-general" class="panel active" role="tabpanel" aria-labelledby="tab-general"></div>
    <div id="panel-popup"   class="panel"        role="tabpanel" aria-labelledby="tab-popup"></div>
  `;
  document.getElementById("fixture").appendChild(wrap);

  const bar=wrap.querySelector(".tabs");
  const btns=[...bar.querySelectorAll(".tab-btn")];
  function selectTab(btn){
    btns.forEach(b=>{b.classList.remove("active");b.setAttribute("aria-selected","false");b.tabIndex=-1;});
    wrap.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
    btn.classList.add("active");btn.setAttribute("aria-selected","true");btn.tabIndex=0;
    wrap.querySelector("#panel-"+btn.dataset.panel).classList.add("active");
  }
  btns.forEach((btn,i)=>{
    btn.tabIndex=btn.classList.contains("active")?0:-1;
    btn.addEventListener("click",()=>selectTab(btn));
    btn.addEventListener("keydown",(e)=>{
      let n=-1;
      if(e.key==="ArrowDown")n=(i+1)%btns.length;
      else if(e.key==="ArrowUp")n=(i-1+btns.length)%btns.length;
      else return;
      e.preventDefault();selectTab(btns[n]);btns[n].focus();
    });
  });

  test("G2: tablist role on .tabs",()=>{if(bar.getAttribute("role")!=="tablist")throw new Error("role="+bar.getAttribute("role"));});
  test("G2: tablist aria-orientation=vertical",()=>{if(bar.getAttribute("aria-orientation")!=="vertical")throw new Error("aria-orientation="+bar.getAttribute("aria-orientation"));});
  test("G2: each tab has role=tab + aria-controls",()=>{btns.forEach(b=>{if(b.getAttribute("role")!=="tab")throw new Error("missing role=tab on "+b.id);const ctrl=b.getAttribute("aria-controls");if(!wrap.querySelector("#"+ctrl))throw new Error("aria-controls dangling: "+ctrl);});});
  test("G2: active tab aria-selected=true, others false",()=>{const sel=btns.filter(b=>b.getAttribute("aria-selected")==="true");if(sel.length!==1)throw new Error("expected exactly 1 selected, got "+sel.length);});
  test("G2: tabpanel labelled by its tab",()=>{wrap.querySelectorAll(".panel").forEach(p=>{if(p.getAttribute("role")!=="tabpanel")throw new Error("missing role=tabpanel on #"+p.id);const lab=p.getAttribute("aria-labelledby");if(!wrap.querySelector("#"+lab))throw new Error("aria-labelledby dangling: "+lab);});});
  test("G2: roving tabindex — only active tab is 0",()=>{const zero=btns.filter(b=>b.tabIndex===0);if(zero.length!==1||!zero[0].classList.contains("active"))throw new Error("roving tabindex broken");});
  test("G2: ArrowDown moves selection to next tab",()=>{btns[0].dispatchEvent(new KeyboardEvent("keydown",{key:"ArrowDown",bubbles:true}));if(btns[1].getAttribute("aria-selected")!=="true")throw new Error("ArrowDown did not select next tab");});
  test("G2: ArrowUp wraps selection back to first tab",()=>{btns[1].dispatchEvent(new KeyboardEvent("keydown",{key:"ArrowUp",bubbles:true}));if(btns[0].getAttribute("aria-selected")!=="true")throw new Error("ArrowUp did not wrap back");});
})();

// G4: Offline retry button — aria-label + icon-preserving loading state.
// Shape snapshot, not a regression gate (see division-of-labor note above) --
// built fresh here, not loaded from popup.js/options.js.
(function(){
  const btn=document.createElement("button");
  btn.type="button";
  btn.className="offline-queue-retry";
  btn.innerHTML=PBP_ICONS.refresh;
  btn.title="Retry";
  btn.setAttribute("aria-label","Retry");
  document.getElementById("fixture").appendChild(btn);
  // Shipped loading transition: disable + spin class, NEVER textContent.
  function enterLoading(b){ b.disabled=true; b.classList.add("loading"); }
  enterLoading(btn);

  test("G4: retry has aria-label",()=>{if(!btn.getAttribute("aria-label"))throw new Error("missing aria-label");});
  test("G4: loading keeps SVG icon (not wiped to text)",()=>{
    if(!btn.querySelector("svg"))throw new Error("SVG wiped during loading state");
    if(btn.textContent.indexOf("…")>=0)throw new Error("loading used textContent ellipsis");
  });
  test("G4: loading disables the button",()=>{if(!btn.disabled)throw new Error("not disabled during loading");});
})();

// G3: Ask-the-page panel focus return on close (non-modal, no trap).
// Shape snapshot, not a regression gate (see division-of-labor note above) --
// not loaded from md-ask.js; pins the opener-capture/restore pattern in isolation.
(function(){
  // Build the fixture dynamically so it exists before the test functions run.
  const fix=document.createElement("div");
  fix.id="g3-fixture";fix.style.cssText="position:fixed;left:-9999px;top:-9999px";
  fix.innerHTML='<button id="g3-opener">Ask</button><div id="g3-panel" hidden><textarea id="g3-input"></textarea></div>';
  document.body.appendChild(fix);

  let opener=null;
  const panel=document.getElementById("g3-panel");
  const input=document.getElementById("g3-input");
  function setOpen(open){
    if(open){ opener=document.activeElement; panel.hidden=false; input.focus(); }
    else { panel.hidden=true; if(opener&&typeof opener.focus==="function")opener.focus(); }
  }
  test("G3: open focuses panel input",()=>{
    const btn=document.getElementById("g3-opener");btn.focus();setOpen(true);
    if(document.activeElement!==input)throw new Error("input not focused on open");
  });
  test("G3: close restores focus to opener",()=>{
    setOpen(false);
    if(document.activeElement!==document.getElementById("g3-opener"))throw new Error("opener not refocused on close, active="+(document.activeElement&&document.activeElement.id));
  });
})();

// G6: shared confirm popover exposes dialog semantics and restores focus.
(function(){
  const wrap = document.createElement("div");
  wrap.style.cssText = "position:fixed;left:-9999px;top:-9999px";
  const anchor = document.createElement("button");
  anchor.type = "button";
  anchor.textContent = "Delete";
  wrap.appendChild(anchor);
  document.body.appendChild(wrap);
  test("G6: confirm popover has dialog semantics",()=>{
    anchor.focus();
    showConfirmPopover(anchor, { msg: "Sure?" });
    const pop = document.body.querySelector(".confirm-popover");
    assert(pop, "popover missing");
    assert(!anchor.contains(pop), "popover nested inside button");
    assert(pop.getAttribute("role") === "dialog", "role=" + pop.getAttribute("role"));
    assert(pop.getAttribute("aria-modal") === "false", "aria-modal=" + pop.getAttribute("aria-modal"));
    assert(pop.getAttribute("aria-label"), "missing aria-label");
  });
  test("G6: confirm popover restores focus to opener",()=>{
    document.body.querySelector(".confirm-no").click();
    assert(document.activeElement === anchor, "focus not restored");
  });
  test("G6: Escape cancels and restores focus",()=>{
    let cancelled = false;
    anchor.focus();
    showConfirmPopover(anchor, { msg: "Sure?", onCancel: () => { cancelled = true; } });
    document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }));
    assert(!document.body.querySelector(".confirm-popover"), "popover remained after Escape");
    assert(cancelled, "onCancel was not called");
    assert(document.activeElement === anchor, "Escape did not restore focus");
  });
  test("G6: Escape does not reach competing document handlers",()=>{
    let escaped = false;
    const competingHandler = () => { escaped = true; };
    document.addEventListener("keydown", competingHandler);
    showConfirmPopover(anchor, { msg: "Sure?" });
    document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }));
    document.removeEventListener("keydown", competingHandler);
    assert(!escaped, "Escape reached a later document handler");
  });
  test("G6: opening a second confirm replaces the first",()=>{
    const second = document.createElement("button");
    second.type = "button";
    second.textContent = "Archive";
    wrap.appendChild(second);
    showConfirmPopover(anchor, { msg: "Old" });
    second.focus();
    showConfirmPopover(second, { msg: "Latest" });
    const pops = document.body.querySelectorAll(".confirm-popover");
    assert(pops.length === 1, "multiple confirm popovers remain");
    assert(pops[0].getAttribute("aria-label") === "Latest", "latest confirm was not retained");
    document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }));
    assert(!document.body.querySelector(".confirm-popover"), "latest confirm remained after Escape");
    assert(document.activeElement === second, "latest confirm did not restore its opener");
  });
  test("G6: pointerdown outside cancels, inside and anchor do not",()=>{
    let cancelled = false;
    anchor.focus();
    showConfirmPopover(anchor, { msg: "Sure?", onCancel: () => { cancelled = true; } });
    const pop = document.body.querySelector(".confirm-popover");
    pop.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true }));
    assert(document.body.querySelector(".confirm-popover"), "pointerdown inside the popover dismissed it");
    anchor.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true }));
    assert(document.body.querySelector(".confirm-popover"), "pointerdown on the anchor dismissed it");
    document.body.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true }));
    assert(!document.body.querySelector(".confirm-popover"), "outside pointerdown did not dismiss");
    assert(cancelled, "onCancel was not called on outside dismiss");
    assert(document.activeElement === anchor, "outside dismiss did not restore focus");
  });
  test("G6: focus leaving the confirm cancels it without stealing focus back",()=>{
    const away = document.createElement("button");
    away.type = "button";
    away.textContent = "Elsewhere";
    wrap.appendChild(away);
    let cancelled = false;
    anchor.focus();
    showConfirmPopover(anchor, { msg: "Sure?", onCancel: () => { cancelled = true; } });
    const pop = document.body.querySelector(".confirm-popover");
    away.focus();
    assert(!pop.isConnected, "focus left the confirm without dismissing it");
    assert(cancelled, "onCancel was not called when focus left the confirm");
    assert(document.activeElement === away, "dismissal stole focus back from the new target");
    away.remove();
  });
  test("G6: focus inside the confirm or on its opener keeps it open",()=>{
    anchor.focus();
    showConfirmPopover(anchor, { msg: "Sure?" });
    const pop = document.body.querySelector(".confirm-popover");
    pop.querySelector(".confirm-yes").focus();
    assert(pop.isConnected, "moving focus to Confirm dismissed the popover");
    anchor.focus();
    assert(pop.isConnected, "focusing the opener dismissed the popover");
    document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }));
    assert(!pop.isConnected, "Escape did not close the popover");
  });
  test("G6: a window blur keeps the confirm, focus lost to <body> cancels it",()=>{
    let cancelled = false;
    anchor.focus();
    showConfirmPopover(anchor, { msg: "Sure?", onCancel: () => { cancelled = true; } });
    const pop = document.body.querySelector(".confirm-popover");
    const no = pop.querySelector(".confirm-no");
    const originalSetTimeout = window.setTimeout;
    let settledCheck = null;
    window.setTimeout = (fn, ms) => {
      if (ms === 0) { settledCheck = fn; return 0; }
      return originalSetTimeout(fn, ms);
    };
    try {
      // Alt-tab: focusout carries a null relatedTarget while document.activeElement
      // stays on the popover's own button.
      no.dispatchEvent(new FocusEvent("focusout", { bubbles: true, relatedTarget: null }));
      assert(pop.isConnected, "a null relatedTarget dismissed the confirm synchronously");
      assert(typeof settledCheck === "function", "the settled-focus re-check was not scheduled");
      settledCheck();
      assert(pop.isConnected, "a window blur cancelled the confirm");
      assert(!cancelled, "a window blur ran onCancel");
      // Tab off the last body child: focus really goes nowhere.
      settledCheck = null;
      no.blur();
      assert(typeof settledCheck === "function", "losing focus did not schedule the settled-focus re-check");
      settledCheck();
      assert(!pop.isConnected, "focus lost to <body> left the confirm open");
      assert(cancelled, "onCancel did not run when focus was lost");
      assert(document.activeElement === anchor, "focus was not handed back to the opener");
    } finally {
      window.setTimeout = originalSetTimeout;
    }
  });
  test("G6: synchronous confirm errors are contained",()=>{
    let logged = false;
    const originalError = console.error;
    console.error = () => { logged = true; };
    anchor.focus();
    showConfirmPopover(anchor, { msg: "Sure?", onConfirm: () => { throw new Error("boom"); } });
    document.body.querySelector(".confirm-yes").click();
    console.error = originalError;
    assert(logged, "confirm error escaped its handler");
    assert(document.activeElement === anchor, "confirm did not restore focus");
  });
})();

// G6b: a browser-action popup can become narrower while Chrome resolves its
// final size. The confirm must stay inside the actual content surface and
// reposition on resize instead of flashing and disappearing.
(function(){
  const panel = document.createElement("div");
  panel.className = "panel";
  panel.style.cssText = "position:fixed;left:24px;top:24px;width:280px;height:80px";
  const anchor = document.createElement("button");
  anchor.type = "button";
  anchor.textContent = "Sign out";
  anchor.style.cssText = "position:absolute;right:0;top:0";
  panel.appendChild(anchor);
  document.body.appendChild(panel);

  test("G6b: narrow confirm stays inside its content surface",()=>{
    showConfirmPopover(anchor, { msg: "Sign out from Pinboard on this device?" });
    const pop = document.body.querySelector(".confirm-popover");
    const surfaceRect = panel.getBoundingClientRect();
    const popRect = pop.getBoundingClientRect();
    assert(popRect.left >= surfaceRect.left + 3, `left overflow: ${popRect.left} < ${surfaceRect.left}`);
    assert(popRect.right <= surfaceRect.right - 3, `right overflow: ${popRect.right} > ${surfaceRect.right}`);
    pop.querySelector(".confirm-no").click();
  });

  asyncTest("G6b: content-surface resize repositions without a window resize",async()=>{
    showConfirmPopover(anchor, { msg: "Sign out from Pinboard on this device?" });
    const pop = document.body.querySelector(".confirm-popover");
    panel.style.width = "190px";
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    const surfaceRect = panel.getBoundingClientRect();
    const popRect = pop.getBoundingClientRect();
    assert(pop.isConnected, "surface resize dismissed the confirm");
    assert(popRect.left >= surfaceRect.left + 3, `left overflow after shrink: ${popRect.left} < ${surfaceRect.left}`);
    assert(popRect.right <= surfaceRect.right - 3, `right overflow after shrink: ${popRect.right} > ${surfaceRect.right}`);
    pop.querySelector(".confirm-no").click();
    panel.remove();
  });
})();

test("G7: applyI18n synchronizes the document language",()=>{
  const previous = localStorage.getItem("pp-i18n-lang");
  localStorage.setItem("pp-i18n-lang", "zh-TW");
  applyI18n(document.createElement("div"));
  assert(document.documentElement.lang === "zh-Hant", "lang=" + document.documentElement.lang);
  if (previous === null) localStorage.removeItem("pp-i18n-lang");
  else localStorage.setItem("pp-i18n-lang", previous);
});

test("G8: secret toggle masks and reveals without losing its name",()=>{
  const input = document.createElement("input");
  input.id = "g8-secret";
  input.type = "password";
  const button = document.createElement("button");
  button.className = "key-toggle";
  button.dataset.target = input.id;
  button.setAttribute("aria-label", "Show or hide secret");
  document.body.append(input, button);
  setupSecretToggles(document);
  button.click();
  assert(input.type === "text" && button.getAttribute("aria-pressed") === "true", "secret not revealed");
  button.click();
  assert(input.type === "password" && button.getAttribute("aria-pressed") === "false", "secret not masked");
  assert(button.getAttribute("aria-label"), "toggle lost accessible name");
});

</script>
</body></html>
