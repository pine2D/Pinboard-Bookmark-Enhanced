<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Save Pipeline Tests</title>
<style>
body { font-family: monospace; padding: 16px; max-width: 1000px; }
h2 { margin-top: 24px; font-size: 16px; }
.suite { margin: 12px 0; padding: 8px; border-left: 3px solid #ccc; }
.case { padding: 4px 8px; margin: 4px 0; }
.pass { color: #0a0; background: #f0fff0; }
.fail { color: #c00; background: #fff0f0; font-weight: bold; }

<body>
<h1>Unified Save Pipeline Tests</h1>
<div id="results"></div>
<script src="../shared.js"></script>
<script src="../wayback.js"></script>
<script src="../ai-cache.js"></script>
<script src="fixtures/summary-ownership.js"></script>
<script>
async function test(name, fn) {
  try {
    await fn();
    const div = document.createElement("div"); div.className = "case pass";
    div.textContent = "PASS " + name; document.getElementById("results").appendChild(div);
  } catch (e) {
    const div = document.createElement("div"); div.className = "case fail";
    div.textContent = "FAIL " + name + "\n  " + e.message; document.getElementById("results").appendChild(div);
  }
}
function assert(cond, msg) { if (!cond) throw new Error(msg || "assertion failed"); }
function equal(actual, expected, msg) {
  if (actual !== expected) throw new Error((msg || "values differ") + `: ${actual} !== ${expected}`);
}
async function suite(name, fn) {
  const div = document.createElement("div"); div.className = "suite";
  const h = document.createElement("h2"); h.textContent = name; div.appendChild(h);
  const results = document.getElementById("results"); const savedAppend = results.appendChild;
  results.appendChild = function(el) { if (el.className?.includes("case")) div.appendChild(el); else savedAppend.call(results, el); };
  await fn(); results.appendChild = savedAppend; results.appendChild(div);
}

const BASE_INTENT = Object.freeze({
  mode: "create",
  url: "https://example.com/article",
  title: "New title",
  notes: "New notes",
  tags: "new-tag",
  private: false,
});

function intent(overrides) { return { ...BASE_INTENT, ...(overrides || {}) }; }
function response(status, data, parseFails) {
  return {
    ok: status >= 200 && status < 300,
    status,
    json: async () => {
      if (parseFails) throw new Error("not json");
      return data;
    },
  };
}

let backgroundSource;
let coreSource;
let backgroundSaveSource;
let batchSaveSource;
let undoSource;
async function getBackgroundSource() {
  if (!backgroundSource) backgroundSource = await (await fetch("../background.js")).text();
  return backgroundSource;
}
async function getCoreSource() {
  if (coreSource) return coreSource;
  const source = await getBackgroundSource();
  const start = source.indexOf("const PBP_SAVE_MODES");
  const end = source.indexOf("// ---- P1: Shared save function ----", start);
  assert(start >= 0 && end > start, "unified pipeline source block not found");
  coreSource = source.slice(start, end);
  return coreSource;
}

async function getBackgroundSaveSource() {
  if (backgroundSaveSource) return backgroundSaveSource;
  const source = await getBackgroundSource();
  const start = source.indexOf("async function saveFromBackground");
  const end = source.indexOf("// Helper: resolve prefix-specific settings", start);
  assert(start >= 0 && end > start, "background save preparation source not found");
  backgroundSaveSource = source.slice(start, end);
  return backgroundSaveSource;
}

async function getBatchSaveSource() {
  if (batchSaveSource) return batchSaveSource;
  const source = await getBackgroundSource();
  const start = source.indexOf("function handleBatchSave");
  const end = source.indexOf("// ===================== Tab Set", start);
  assert(start >= 0 && end > start, "batch save source not found");
  batchSaveSource = source.slice(start, end);
  return batchSaveSource;
}

async function getUndoSource() {
  if (undoSource) return undoSource;
  const source = await getBackgroundSource();
  const start = source.indexOf("const _recentSaves");
  const end = source.indexOf("// ---- 设置图标", start);
  assert(start >= 0 && end > start, "Undo notification source not found");
  undoSource = source.slice(start, end);
  return undoSource;
}

async function createStatusCacheHarness(initialToken, initialFetch) {
  const source = await getBackgroundSource();
  const cacheStart = source.indexOf("// URL 状态缓存");
  const cacheEnd = source.indexOf("// ---- P2: Cached token", cacheStart);
  const checkStart = source.indexOf("async function checkBookmarked");
  const checkEnd = source.indexOf("// ---- Badge:", checkStart);
  const branchStart = source.indexOf('if (message.type === "get_bookmark_data"');
  const branchEnd = source.indexOf('if (message.type === "get_offline_queue"', branchStart);
  assert(cacheStart >= 0 && cacheEnd > cacheStart && checkStart >= 0 && checkEnd > checkStart,
    "account-scoped status cache source not found");
  assert(branchStart >= 0 && branchEnd > branchStart, "bookmark-data branch not found");

  const factory = new Function("initialToken", "initialFetch", "pbpPinboardAccountFromToken", "console", `
    ${source.slice(cacheStart, cacheEnd)}
    let currentToken = initialToken;
    let fetchHandler = initialFetch;
    const pinboardFetch = (...args) => fetchHandler(...args);
    async function getCurrentBookmarkAuth() {
      return { token: currentToken || "", account: pbpPinboardAccountFromToken(currentToken), epoch: _pinboardAuthEpoch };
    }
    ${source.slice(checkStart, checkEnd)}
    function invokeBookmarkData(message, sendResponse) {
      ${source.slice(branchStart, branchEnd)}
      throw new Error("unhandled message");
    }
    return {
      checkBookmarked,
      invokeBookmarkData,
      rawCache: statusCache,
      setAuth(token) {
        _pinboardAuthEpoch++;
        currentToken = token;
        statusCache.clear();
      },
      seedRaw(url, account, value) { statusCache.set(url, { ...value, account }); },
      setFetch(fn) { fetchHandler = fn; },
    };
  `);
  return factory(initialToken, initialFetch, pbpPinboardAccountFromToken, console);
}

async function createHarness(options) {
  const opts = options || {};
  const storageData = { offlineQueue: (opts.queue || []).map((item) => ({ ...item })) };
  const events = [];
  const fetchCalls = [];
  const waybackCalls = [];
  const iconCalls = [];
  const badgeCalls = [];
  const statusCache = new Map(opts.cacheEntries || []);
  const settings = {
    pinboardToken: "alice:current-token",
    offlineQueueEnabled: true,
    bgSaveMode: "merge",
    ...(opts.settings || {}),
  };
  const authState = {
    token: Object.prototype.hasOwnProperty.call(opts, "currentToken") ? opts.currentToken : settings.pinboardToken,
    epoch: 0,
  };
  const captureAuth = (value) => ({...pbpBookmarkConnection(typeof value === "object" ? value : {pinboardToken:value}), epoch:authState.epoch});
  const authIsCurrent = (auth) => !!auth?.account && auth.epoch === authState.epoch;
  const statusCacheGet = (url, auth) => {
    if (!authIsCurrent(auth)) return null;
    const cached = statusCache.get(url);
    return cached?.account === auth.account ? cached : null;
  };
  const statusCacheSet = (url, auth, value) => {
    if (!authIsCurrent(auth)) return false;
    statusCache.set(url, { ...value, account: auth.account });
    return true;
  };
  const chromeStub = {
    storage: {
      local: {
        get: async (key) => {
          if (typeof key === "string") return { [key]: storageData[key] };
          return { ...storageData };
        },
        set: async (values) => {
          if (opts.failStorageSet) throw new Error("storage unavailable");
          Object.assign(storageData, values);
          events.push("storage:set");
        },
      },
    },
    tabs: { query: async () => opts.activeTab ? [opts.activeTab] : [] },
    // The reader's own extension origin; preview slots sit in storageData.
    runtime: { id: "test-id" },
  };
  const pinboardFetchStub = async (url) => {
    fetchCalls.push(url);
    if (!opts.pinboardFetch) throw new Error("unexpected Pinboard request");
    return opts.pinboardFetch(url, fetchCalls);
  };
  const waybackStub = (url, loadedSettings, archiveOptions) => {
    waybackCalls.push({ url, settings: loadedSettings, options: archiveOptions });
    events.push("wayback");
    if (opts.waybackThrows) throw new Error("wayback unavailable");
    return Promise.resolve();
  };
  const deps = {
    chrome: chromeStub,
    pinboardFetch: pinboardFetchStub,
    statusCache,
    cleanupStatusCache: () => {},
    loadSettings: async () => settings,
    setIcon: (tabId, bookmarked) => iconCalls.push({ tabId, bookmarked }),
    updateBadge: () => { badgeCalls.push(true); return Promise.resolve(); },
    pbpWaybackArchive: waybackStub,
    pbpSameBookmark,
    pbpCreateRecoveringTail,
    pbpOfflineQueueReduce,
    pbpPinboardAccountFromToken,
    pbpOfflineQueueAccount,
    pbpResolveOfflineQueueToken,
    pbpDrainOfflineQueue,
    pbpResolveSavePlan,
    PBP_TAG_VOCAB_STALE_CEILING, pbpTagVocabIndex, pbpTagGroupKey, pbpAlignTagName,
    buildPostsAddUri,
    POSTS_ADD_URI_BUDGET,
    pbpCaptureBookmarkAuth: captureAuth,
    pbpBookmarkAuthIsCurrent: authIsCurrent,
    pbpStatusCacheGet: statusCacheGet,
    pbpStatusCacheSet: statusCacheSet,
    getCurrentBookmarkAuth: async () => ({
      token: authState.token || "",
      account: pbpPinboardAccountFromToken(authState.token),
      epoch: authState.epoch,
    }),
  };
  const source = await getCoreSource();
  const background = await getBackgroundSource();
  const freshStart = background.indexOf("async function pbpReadFreshBookmarkAuthForAccount("), freshEnd = background.indexOf("// An automatic auth reset", freshStart);
  deps.pbpBookmarkAuthEpoch = () => authState.epoch;
  deps.pbpReadSettingsWithSecrets = async () => ({ pinboardToken: authState.token });
  deps.SETTINGS_DEFAULTS = SETTINGS_DEFAULTS;
  deps.deobfuscateKey = (value) => value;
  const factory = new Function(...Object.keys(deps), background.slice(freshStart, freshEnd) + source + `
    return {
      validateSaveIntent, fetchExistingBookmark, deliverSaveIntent,
      submitSaveIntent, submitPopupSaveIntent, sendOfflineItem,
      drainOfflineQueueIds, readOfflineQueueWithIds, retryOfflineItem,
      normalizeOfflineSaveIntent, applySaveResultSideEffects, processOfflineQueue,
      mutateOfflineQueue, pbpReaderBookmarkRequest
    };
  `);
  return {
    ...factory(...Object.values(deps)),
    storageData, settings, authState, events, fetchCalls, waybackCalls, iconCalls, badgeCalls, statusCache,
  };
}

async function createBackgroundSaveHarness(options) {
  const opts = options || {};
  const cachedSettings = opts.cachedSettings || {
    pinboardToken: "alice:old-token",
    bgSaveMode: "merge",
    optPrivateDefault: false,
    optPrivateIncognito: true,
    _defaultTags: "base-tag",
    _autoNotes: false,
    _blockquote: false,
    _aiTags: false,
    _aiSummary: false,
  };
  const settingsSequence = opts.settingsSequence || [cachedSettings];
  const notifications = [];
  const intents = [];
  const aiSnapshots = [];
  let loadCount = 0;
  let drainCalls = 0;
  let i18nReadyCalls = 0;
  const result = opts.result || { status: "queued", queueId: "q1" };
  const deps = {
    loadSettings: opts.loadSettings || (async () => settingsSequence[Math.min(loadCount++, settingsSequence.length - 1)]),
    pbpServiceEffectivePrivate,
    pbpLoadTagVocab: async (account) => ({ account, timestamp: Date.now(), counts: null, index: opts.tagVocabIndex || null }),
    pbpCanonicalTagName, pbpTagGroupKey,
    pbpSaveFailure: (reason) => ({ status: "failed", reason }),
    showNotification: (...args) => notifications.push(args),
    t: opts.t || ((key, ...args) => args.length ? `${key}:${args.join(":")}` : key),
    getPageInfoFromTab: opts.getPageInfoFromTab || (async () => {
      if (opts.onGetPageInfo) opts.onGetPageInfo(cachedSettings);
      return null;
    }),
    buildAutoNotes: () => "",
    hasAIKey: (settings) => {
      aiSnapshots.push({
        defaultTags: settings._defaultTags,
        aiTags: settings._aiTags,
        aiSummary: settings._aiSummary,
      });
      return false;
    },
    submitSaveIntent: async (prepared) => {
      intents.push(prepared);
      return result;
    },
    processOfflineQueue: () => { drainCalls++; return Promise.resolve(); },
    getCurrentBookmarkAuth: async () => ({
      token: cachedSettings.pinboardToken,
      account: pbpPinboardAccountFromToken(cachedSettings.pinboardToken),
      epoch: 0,
      service: "pinboard",
      ...(opts.auth || {}),
    }),
    POSTS_ADD_URI_BUDGET,
    // K100: pbpI18nReady is a dep of saveFromBackground now (awaited on the
    // not-logged-in branch only) — every harness slicing it needs this or the
    // sliced function throws ReferenceError. Defaults to already-resolved so
    // the many existing cases in this file are unaffected.
    pbpI18nReady: opts.pbpI18nReady || (() => { i18nReadyCalls++; return Promise.resolve(); }),
    // AI-enabled cases supply the collaborators the summary path calls.
    ...(opts.deps || {}),
  };
  const source = await getBackgroundSaveSource();
  const factory = new Function(...Object.keys(deps), source + "\nreturn saveFromBackground;");
  return {
    saveFromBackground: factory(...Object.values(deps)),
    cachedSettings,
    notifications,
    intents,
    aiSnapshots,
    get drainCalls() { return drainCalls; },
    get i18nReadyCalls() { return i18nReadyCalls; },
  };
}

async function createBatchSaveHarness(options) {
  const opts = options || {};
  const settings = {
    pinboardToken: "alice:token",
    optBatchTagEnabled: true,
    optBatchTag: "Batch Tag",
    batchAiTags: false,
    batchAiSummary: false,
    optRespectTagCase: false,
    batchSkipExisting: false,
    optPrivateDefault: false,
    optPrivateIncognito: true,
    optReadlaterDefault: false,
    waybackArchiveBatch: false,
    ...(opts.settings || {}),
  };
  const intents = [];
  const progress = [];
  const notifications = [];
  const badgeCalls = [];
  const extractionCalls = [];
  const cacheWrites = [];
  const removed = [];
  const jobs = [];
  const outcomes = opts.outcomes || [{ status: "saved", mutation: "created" }];
  let outcomeIndex = 0;
  const deps = {
    _newBatchRunId: () => opts.runId || "test-batch-run",
    _removeBatchRecordIfOwned: async (key) => { removed.push(key); return true; },
    _writeBatchProgress: async (value) => progress.push({ ...value }),
    loadSettings: opts.loadSettings || (async () => settings),
    getCurrentBookmarkAuth: async () => ({ token: settings.pinboardToken, account: "alice", epoch: 0, service: settings.bookmarkService || "pinboard" }),
    showNotification: (...args) => notifications.push(args),
    t: (key, ...args) => args.length ? `${key}:${args.join(":")}` : key,
    hasAIKey: () => opts.hasAIKey === true,
    getPageInfoFromTab: async (...args) => { extractionCalls.push(args); return opts.pageInfo === undefined ? null : opts.pageInfo; },
    pbpNotesDescription: (info) => info.metaDescription || "",
    getAICache: async (_url, kind) => opts.cached?.[kind] ?? null,
    setAICache: async (...args) => { cacheWrites.push(args); },
    callAI: opts.callAI || (async () => "AI summary"),
    buildCombinedPrompt: opts.buildCombinedPrompt || (() => "combined"),
    parseAICombined: () => ({ tags: ["ai-tag"], summary: "  Combined\n summary  " }),
    buildSummaryPrompt: () => "summary",
    buildTagPrompt: opts.buildTagPrompt || (() => "tags"),
    parseAITags: () => ["ai-tag"],
    refineTags: (tags) => tags,
    chrome: { storage: { local: { get: opts.storageGet || (async () => ({})),
      set: async (value) => { if (value.batch_job) jobs.push(JSON.parse(JSON.stringify(value.batch_job))); } } } },
    pbpLoadTagVocab: async (account) => ({ account, timestamp: Date.now(), counts: opts.tagVocabCounts || null, index: opts.tagVocabIndex || null }),
    pbpCanonicalTagName, pbpTagGroupKey,
    pbpServiceEffectivePrivate,
    submitSaveIntent: async (prepared, deliveryOptions) => {
      intents.push({ prepared, deliveryOptions });
      if (opts.submitSaveIntent) return opts.submitSaveIntent(prepared, deliveryOptions, intents.length - 1);
      const outcome = outcomes[Math.min(outcomeIndex++, outcomes.length - 1)];
      if (outcome instanceof Error) throw outcome;
      return outcome;
    },
    updateBadge: () => {
      badgeCalls.push(true);
      return opts.updateBadge ? opts.updateBadge() : Promise.resolve();
    },
  };
  const source = await getBatchSaveSource();
  const factory = new Function(...Object.keys(deps), `let _batchRunning = false;\n${source}\nreturn handleBatchSave;`);
  return {
    handleBatchSave: factory(...Object.values(deps)),
    intents,
    progress,
    notifications,
    badgeCalls,
    removed,
    jobs,
    extractionCalls,
    cacheWrites,
  };
}

function batchTabs(count) {
  return Array.from({ length: count }, (_, i) => ({
    id: i + 1,
    title: `Tab ${i + 1}`,
    url: `https://batch.example/${i + 1}`,
    incognito: i === 0,
  }));
}

function runBackgroundSave(harness, overrides) {
  return harness.saveFromBackground({
    url: BASE_INTENT.url,
    title: BASE_INTENT.title,
    tab: { id: 9, url: BASE_INTENT.url, incognito: false },
    settingsOverrides: null,
    toread: false,
    notifyId: "qs",
    notifyTitle: "Quick saved",
    notifyCategory: "quickSave",
    ...(overrides || {}),
  });
}

(async () => {
await suite("unified save pipeline", async () => {
  await test("resolver creates with replace=no and materializes read-later false", () => {
    const plan = pbpResolveSavePlan(intent(), null);
    equal(plan.action, "send");
    equal(plan.replace, false);
    equal(plan.mutation, "created");
    equal(plan.fields.toread, false);
    assert(plan.fields.time === undefined, "create must not invent dt");
  });

  await test("resolver merge preserves full existing metadata and only promotes read-later", () => {
    const lookup = { exists: true, post: {
      description: "Existing title", extended: "Existing notes", tags: "Alpha shared",
      shared: "no", toread: "yes", time: "2024-01-02T03:04:05Z",
    } };
    const plan = pbpResolveSavePlan(intent({ mode: "merge", tags: "alpha New", private: false, toread: false }), lookup);
    equal(plan.replace, true);
    equal(plan.mutation, "updated");
    equal(plan.fields.title, "Existing title");
    equal(plan.fields.notes, "Existing notes");
    equal(plan.fields.tags, "Alpha shared New");
    equal(plan.fields.private, true);
    equal(plan.fields.toread, true);
    equal(plan.fields.time, "2024-01-02T03:04:05Z");
    const promoted = pbpResolveSavePlan(intent({ mode: "merge", toread: true }), {
      exists: true, post: {
        description: "", extended: "", tags: "", shared: "yes", toread: "no", time: "known-time",
      },
    });
    equal(promoted.fields.toread, true, "incoming true promotes read-later");
  });

  await test("resolver carries optional summary verbatim through create, update and missing merge", () => {
    for (const summary of [undefined, "", "  New description\nsecond line  "]) {
      for (const mode of ["create", "update", "merge", "overwrite"]) {
        const plan = pbpResolveSavePlan(intent({ mode, summary, time: mode === "update" ? "server-time" : undefined }), { exists: false });
        equal(plan.action, "send");
        equal(plan.fields.summary, summary, `${mode} must carry the optional description verbatim`);
      }
    }
  });

  await test("resolver merge and overwrite preserve the server summary without requiring it for legacy posts", () => {
    for (const summary of [undefined, "", "  Server description\nsecond line  "]) {
      for (const mode of ["merge", "overwrite"]) {
        const post = { description: "Server title", extended: "Server note", tags: "old", shared: "yes", toread: "no", time: "server-time",
          ...(summary === undefined ? {} : { summary }) };
        const plan = pbpResolveSavePlan(intent({ mode, summary: "Incoming description" }), { exists: true, post });
        equal(plan.action, "send", "summary remains optional in canonical posts");
        equal(plan.fields.summary, summary, `${mode} must preserve the server description`);
        equal(plan.fields.notes, "Server note", "description does not replace notes");
      }
    }
  });

  await test("resolver merge promotes private one-way, mirroring the toread promotion", () => {
    const toPrivate = pbpResolveSavePlan(intent({ mode: "merge", private: true }), {
      exists: true, post: { description: "", extended: "", tags: "", shared: "yes", toread: "no", time: "known-time" },
    });
    equal(toPrivate.fields.private, true, "incoming private=true must re-privatize an existing public bookmark");
    const staysPrivate = pbpResolveSavePlan(intent({ mode: "merge", private: false }), {
      exists: true, post: { description: "", extended: "", tags: "", shared: "no", toread: "no", time: "known-time" },
    });
    equal(staysPrivate.fields.private, true, "incoming private=false must never clear an existing private bookmark");
    const staysPublic = pbpResolveSavePlan(intent({ mode: "merge", private: false }), {
      exists: true, post: { description: "", extended: "", tags: "", shared: "yes", toread: "no", time: "known-time" },
    });
    equal(staysPublic.fields.private, false, "incoming private=false must not force an existing public bookmark private");
  });

  await test("resolver skip avoids writes and merge-missing discards untrusted time", () => {
    const skipped = pbpResolveSavePlan(intent({ mode: "skip" }), {
      exists: true, post: { description: "Old", shared: "yes", toread: "no", time: "old-time" },
    });
    equal(skipped.action, "skip");
    const missing = pbpResolveSavePlan(intent({ mode: "merge", time: "caller-time" }), { exists: false });
    equal(missing.action, "send");
    equal(missing.replace, false);
    assert(missing.fields.time === undefined, "missing merge must not forward caller dt");
  });

  // Hand-written posts/get body in Pinboard's v1 wire shape (an existing bookmark
  // of the current account, extra server fields included). Never derived from the
  // writer side: a fixture echoing buildPostsAddUri would only prove self-consistency.
  const EXISTING_GET_BODY = Object.freeze({
    date: "2024-01-02T03:04:05Z",
    user: "alice",
    posts: [Object.freeze({
      href: "https://example.com/article",
      description: "Existing title",
      extended: "Notes the user typed by hand",
      meta: "8f6ab1f0d3d5b8f5c1e0a0f2b6d4c3a1",
      hash: "0f9a4a1a2c3d4e5f60718293a4b5c6d7",
      time: "2024-01-02T03:04:05Z",
      shared: "no",
      toread: "yes",
      tags: "Alpha shared",
    })],
  });
  const EMPTY_GET_BODY = Object.freeze({ date: "2024-01-02T03:04:05Z", user: "alice", posts: [] });
  const existingPost = () => ({ ...EXISTING_GET_BODY.posts[0] });

  await test("resolver overwrite replaces only tags and keeps every existing field", () => {
    const post = existingPost();
    const plan = pbpResolveSavePlan(
      intent({ mode: "overwrite", title: "New title", notes: "New notes", tags: "new-tag", private: false, toread: false }),
      { exists: true, post }
    );
    equal(plan.action, "send");
    equal(plan.replace, true);
    equal(plan.fields.tags, "new-tag", "overwrite must replace the tag set, not union it");
    // Generalized to the category "no existing field may be lost", not to a single
    // instance: every non-tag field is asserted against the server record, and the
    // key set is pinned so a newly added field cannot silently arrive from `incoming`.
    const preserved = {
      url: BASE_INTENT.url,
      title: post.description,
      notes: post.extended,
      summary: post.summary,
      private: post.shared === "no",
      toread: post.toread === "yes",
      time: post.time,
      archive: undefined,
    };
    for (const [key, value] of Object.entries(preserved)) {
      equal(plan.fields[key], value, `overwrite lost the existing ${key}`);
    }
    equal(
      Object.keys(plan.fields).sort().join(","),
      Object.keys({ ...preserved, tags: "" }).sort().join(","),
      "overwrite plan carries an unreviewed field"
    );
  });

  await test("resolver overwrite still promotes read-later but never demotes it", () => {
    const promoted = pbpResolveSavePlan(
      intent({ mode: "overwrite", toread: true }),
      { exists: true, post: { ...existingPost(), toread: "no" } }
    );
    equal(promoted.fields.toread, true, "an explicit Read Later save must still promote");
    const kept = pbpResolveSavePlan(intent({ mode: "overwrite", toread: false }), { exists: true, post: existingPost() });
    equal(kept.fields.toread, true, "quick save must not clear the server's read-later flag");
  });

  await test("resolver overwrite promotes private one-way, mirroring the toread promotion", () => {
    const toPrivate = pbpResolveSavePlan(
      intent({ mode: "overwrite", private: true }),

  await test("K100: initI18n() stays synchronous and pbpI18nReady tracks the latest refresh", async () => {
    const i18nSource = await (await fetch("../i18n.js")).text();
    const chromeStub = {
      runtime: { getManifest: () => ({ version: "9.9.9" }), getURL: (p) => "i18n-fixture://" + p },
      i18n: { getMessage: (key) => key },
    };
    // Two distinct fetch resolvers, released under test control, so the test can
    // prove the SECOND pbpI18nReady() promise stays pending until the SECOND
    // fetch resolves rather than resolving early off the first one.
    const pendingFetches = [];
    const fetchStub = async () => new Promise((resolve) => {
      pendingFetches.push(() => resolve({ ok: true, json: async () => ({}) }));
    });
    // optLang differs between the two calls (en vs zh_CN) so the version-stamp
    // short-circuit (i18n.js: _i18nMessagesLang === optLang) never fires and each
    // initI18n() call is guaranteed to perform its own real fetch.
    const storageData = { optLang: "en" };
    const getSettingsStorage = async () => ({
      get: async (defaults) => ({ ...defaults, ...storageData }),
    });
    const localStorageStub = (() => {
      const store = new Map();
      return {
        getItem: (k) => (store.has(k) ? store.get(k) : null),
        setItem: (k, v) => store.set(k, String(v)),
        removeItem: (k) => store.delete(k),
      };
    })();
    const factory = new Function(
      "chrome", "fetch", "localStorage", "getSettingsStorage",
      i18nSource + "\nreturn { initI18n, pbpI18nReady };"
    );
    const { initI18n, pbpI18nReady } = factory(chromeStub, fetchStub, localStorageStub, getSettingsStorage);

    const firstReturn = initI18n();
    equal(firstReturn, undefined, "initI18n() must keep returning undefined");
    const firstReady = pbpI18nReady();
    assert(firstReady instanceof Promise, "pbpI18nReady() must return a promise");
    await new Promise((resolve) => setTimeout(resolve, 0)); // flush microtasks until the fetch() call itself lands in pendingFetches
    equal(pendingFetches.length, 1, "first initI18n() should have started exactly one fetch");
    pendingFetches.shift()();
    await firstReady;

    storageData.optLang = "zh_CN";
    const secondReturn = initI18n(); // hits the _i18nReady early-return branch (initI18n called a second time)
    equal(secondReturn, undefined, "repeat initI18n() call must also return undefined");
    const secondReady = pbpI18nReady();
    assert(secondReady !== firstReady, "pbpI18nReady() should track the latest refresh, not the first one");

    let secondReadyResolved = false;
    secondReady.then(() => { secondReadyResolved = true; });
    await new Promise((resolve) => setTimeout(resolve, 0));
    equal(pendingFetches.length, 1, "second initI18n() should have started its own fetch");
    assert(!secondReadyResolved, "pbpI18nReady() resolved before its own fetch landed");
    pendingFetches.shift()();
    await secondReady;
    assert(secondReadyResolved, "pbpI18nReady() did not resolve after its refresh landed");
  });

    // notification is the only feedback the run can still produce.
    const h = await createBatchSaveHarness({
      outcomes: [{ status: "failed", reason: "not_logged_in", httpStatus: 401 }],

    equal(done.saved, 0);
    equal(h.badgeCalls.length, 0);

    equal(h.notifications[0][3], "error", "a total failure must not ride the success category");

    // reading "0 saved, 3 failed" under the headline "Batch Saved!" is a

    equal(h.notifications[0][1], "bgSaveFailed", "a total failure must not be headlined as a saved batch");
    assert(h.notifications[0][2].includes("batchDone:0:3"), "all-failed notification lacks the completion summary");

    const tooLong = await createBatchSaveHarness({ outcomes: [{ status: "failed", reason: "too_long", detail: "4200" }] });
    await tooLong.handleBatchSave(batchTabs(2));
    equal(tooLong.notifications.length, 1, "an all-too-long Batch must not finish silently");
    equal(tooLong.notifications[0][0], "batch-error");
    equal(tooLong.notifications[0][1], "bgSaveFailed", "an all-too-long Batch must not be headlined as a saved batch");
    assert(tooLong.notifications[0][2].includes("batchTooLong:2"), "too-long count missing from the notification");
  });

  await test("Batch counts saves stopped by an over-long linkding tag on their own and names the first tag", async () => {

  await test("authorize swaps ONLY the token bytes, preserving every other query byte", async () => {
    // Roadmap #23 hardening: the old searchParams.set + toString pair
    // re-serialized the whole query to form-urlencoded (%20 -> "+", ~ -> %7E),
    // silently changing the byte length that POSTS_ADD_URI_BUDGET was measured
    // against on the caller's side. The rewrite must be a pure token swap.
    const trickyDesc = encodeURIComponent("a b!c'd(e)f*g~h"); // bytes URLSearchParams would rewrite
    const raw = `https://api.pinboard.in/v1/posts/add?url=x&description=${trickyDesc}&auth_token=alice%3Aold&tags=t`;
    const out = pbpAuthorizePinboardApiUrl(raw, obfuscateKey("alice:new"));
    equal(out, `https://api.pinboard.in/v1/posts/add?url=x&description=${trickyDesc}&auth_token=alice%3Anew&tags=t`);
    // Fail-closed edges: duplicate token pairs and cross-account swaps stay rejected.
    equal(pbpAuthorizePinboardApiUrl(raw + "&auth_token=alice%3Aold", obfuscateKey("alice:new")), "");
    equal(pbpAuthorizePinboardApiUrl(raw, obfuscateKey("bob:new")), "");

});

// Summary blocks written by the worker (quick save, Batch, offline replay)
// must stay replaceable and removable from the popup after the AI cache that
// produced them is gone. Receipts live in this page's real IndexedDB through
// ai-cache.js; the popup side is popup-ai.js's own restore/Regenerate/Remove.
await suite("summary ownership after worker saves", async () => {
  const PAGE = BASE_INTENT.url;
  // Hand-written Pinboard v1 bodies (posts/get, posts/add), never derived from
  // what the worker sent: the stored notes below are typed out literally, and
  // every case asserts that posts/add carried exactly those bytes.
  const NO_POSTS = Object.freeze({ date: "2026-11-01T09:00:00Z", user: "alice", posts: [] });
  const ADDED = Object.freeze({ result_code: "done" });
  const QUICK_NOTES = "Auto notes\n\n<blockquote>Fresh summary</blockquote>";
  const QUICK_RANGE = Object.freeze({ start: "Auto notes\n\n".length, end: QUICK_NOTES.length });
  const BATCH_NOTES = "<blockquote>AI summary</blockquote>";
  const SERVER_NOTES = "Typed on pinboard.in\n\n<blockquote>Older summary</blockquote>";
  const SERVER_RANGE = Object.freeze({ start: "Typed on pinboard.in\n\n".length, end: SERVER_NOTES.length });
  const postsGet = (extended, toread = "no") => ({ date: "2026-11-01T09:00:00Z", user: "alice", posts: [{
    href: PAGE, description: "New title", extended,
    meta: "5d41402abc4b2a76b9719d911017c592", hash: "7d793037a0760186574b0282f2f435e7",
    time: "2026-11-01T09:00:00Z", shared: "yes", toread, tags: "base-tag",
  }] });
  const pinboard = (body) => async (url) => url.includes("/posts/get?") ? response(200, body) : response(200, ADDED);
  const extendedSent = (core) => {
    const adds = core.fetchCalls.filter((url) => url.includes("/posts/add?"));
    return adds.length === 1 ? new URL(adds[0]).searchParams.get("extended") : "posts/add sent " + adds.length + " times";
  };
  // The popup's next open of this bookmark, with no cached summary.
  const popupOpens = (notes, account = "alice") => pbpFixturePopupSummary({
    service: "pinboard", account, url: PAGE, notes, existingBookmark: postsGet(notes).posts[0],
  });
  const quickSave = (core, settings = {}) => createBackgroundSaveHarness({
    cachedSettings: { pinboardToken: "alice:old-token", bgSaveMode: "merge", optPrivateDefault: false,
      optPrivateIncognito: true, _defaultTags: "base-tag", _autoNotes: true, _blockquote: false,
      _aiTags: false, _aiSummary: true, ...settings },
    deps: {
      hasAIKey: () => true,
      getPageInfoFromTab: async () => ({ pageText: "article body" }),
      buildAutoNotes: () => "Auto notes",
      getAICache: async () => null,
      setAICache: async () => {},
      callAI: async () => "Fresh summary",
      buildSummaryPrompt: () => "summary prompt",
      submitSaveIntent: (prepared, options) => core.submitSaveIntent(prepared, options),
    },
  });

  await test("a quick-saved summary is replaced and removed in place once the AI cache is gone", async () => {
    await pbpFixtureClearSummaryOwnership();
    const core = await createHarness({ pinboardFetch: pinboard(NO_POSTS) });
    equal((await runBackgroundSave(await quickSave(core))).status, "saved");
    equal(extendedSent(core), QUICK_NOTES, "quick-save notes bytes changed");
    let popup = await popupOpens(QUICK_NOTES);
    const owner = await popup.restore();
    popup.regenerate("Second summary");
    equal(popup.field.value, "Auto notes\n\n<blockquote>Second summary</blockquote>", "Regenerate did not replace the block in place");
    equal(owner, "receipt", "the reopened popup did not reclaim the quick-saved block");
    popup = await popupOpens(QUICK_NOTES);
    await popup.restore();
    equal(popup.remove(), true, "Remove found no block");
    equal(popup.field.value, "Auto notes", "Remove left part of the block or the notes");
  });

  await test("a Batch-saved summary is replaced and removed in place once the AI cache is gone", async () => {
    await pbpFixtureClearSummaryOwnership();
    const core = await createHarness({ pinboardFetch: pinboard(NO_POSTS) });
    const batch = await createBatchSaveHarness({ settings: { batchAiSummary: true }, hasAIKey: true,
      pageInfo: { pageText: "article body" },
      submitSaveIntent: (prepared, options) => core.submitSaveIntent(prepared, options) });
    await batch.handleBatchSave([{ id: 1, title: "New title", url: PAGE, incognito: false }]);
    equal(extendedSent(core), BATCH_NOTES, "Batch notes bytes changed");
    let popup = await popupOpens(BATCH_NOTES);
    const owner = await popup.restore();
    popup.regenerate("Second summary");
    equal(popup.field.value, "<blockquote>Second summary</blockquote>", "Regenerate did not replace the block in place");
    equal(owner, "receipt", "the reopened popup did not reclaim the Batch block");
    popup = await popupOpens(BATCH_NOTES);
    await popup.restore();
    equal(popup.remove(), true, "Remove found no block");
    equal(popup.field.value, "", "Remove left part of the block");
  });

  await test("a summary saved offline becomes reclaimable when its replay writes those notes", async () => {
    await pbpFixtureClearSummaryOwnership();
    let online = false;
    const core = await createHarness({ pinboardFetch: async (url, calls) => {
      if (!online) throw new TypeError("Failed to fetch");
      return pinboard(NO_POSTS)(url, calls);
    } });
    const queued = await core.submitSaveIntent(intent({ notes: QUICK_NOTES }), { expectedAccount: "alice", summaryRange: QUICK_RANGE });
    equal(queued.status, "queued");
    assert(!Object.hasOwn(core.storageData.offlineQueue[0], "summaryRange"), "the range entered the offline record");
    equal(await (await popupOpens(QUICK_NOTES)).restore(), null, "a queued save already owned notes it had not written");
    online = true;
    core.fetchCalls.length = 0;
    await core.processOfflineQueue();
    equal(core.storageData.offlineQueue.length, 0, "the replay did not land");
    equal(extendedSent(core), QUICK_NOTES, "replayed notes bytes changed");
    const popup = await popupOpens(QUICK_NOTES);
    const owner = await popup.restore();
    popup.regenerate("Second summary");
    equal(popup.field.value, "Auto notes\n\n<blockquote>Second summary</blockquote>", "Regenerate did not replace the replayed block in place");
    equal(owner, "receipt", "the replayed block was not reclaimed");
    equal((await pbpFixtureSummaryOwnershipEntries()).length, 1, "the offline hold outlived its replay");
  });

  // The first attempt can write the notes and still fail: the connection drops
  // or Pinboard answers 5xx after storing them. The save is queued with its
  // hold; the replay then finds exactly the queued notes on the server, and
  // those are this save's own, so the block stays reclaimable.
  await test("a summary whose first attempt landed but lost its answer is reclaimable after the replay", async () => {
    for (const [lost, mode] of [["dropped connection", "merge"], ["503 after the write", "merge"], ["dropped connection", "skip"]]) {
      const label = lost + ", " + mode;
      await pbpFixtureClearSummaryOwnership();
      let stored = false;
      const core = await createHarness({ pinboardFetch: async (url) => {
        if (url.includes("/posts/get?")) return response(200, stored ? postsGet(QUICK_NOTES) : NO_POSTS);
        if (stored) return response(200, ADDED);
        stored = true;
        if (lost === "dropped connection") throw new TypeError("Failed to fetch");
        return response(503, null, true);
      } });
      const queued = await core.submitSaveIntent(intent({ mode, notes: QUICK_NOTES }), { expectedAccount: "alice", summaryRange: QUICK_RANGE });
      equal(queued.status, "queued", label);
      equal(extendedSent(core), QUICK_NOTES, label + ": first attempt bytes changed");
      core.fetchCalls.length = 0;
      await core.processOfflineQueue();
      equal(core.storageData.offlineQueue.length, 0, label + ": the replay did not land");
      if (mode === "skip") equal(core.fetchCalls.filter((url) => url.includes("/posts/add?")).length, 0, label + ": the skip wrote");
      else equal(extendedSent(core), QUICK_NOTES, label + ": replayed notes bytes changed");
      const popup = await popupOpens(QUICK_NOTES);
      const owner = await popup.restore();
      popup.regenerate("Second summary");
      equal(owner, "receipt", label + ": the block written by the lost attempt was not reclaimed");
      equal(popup.field.value, "Auto notes\n\n<blockquote>Second summary</blockquote>", label + ": Regenerate did not replace the block in place");
      equal((await pbpFixtureSummaryOwnershipEntries()).length, 1, label + ": the hold outlived its replay");
    }
  });

  await test("a queued summary whose replay keeps the server's notes leaves nothing to reclaim", async () => {
    await pbpFixtureClearSummaryOwnership();
    let online = false;
    const core = await createHarness({ pinboardFetch: async (url, calls) => {
      if (!online) throw new TypeError("Failed to fetch");
      return pinboard(postsGet("Typed on pinboard.in"))(url, calls);
    } });
    equal((await core.submitSaveIntent(intent({ notes: QUICK_NOTES }), { expectedAccount: "alice", summaryRange: QUICK_RANGE })).status, "queued");
    online = true;
    core.fetchCalls.length = 0;
    await core.processOfflineQueue();
    equal(core.storageData.offlineQueue.length, 0, "the replay did not land");
    equal(extendedSent(core), "Typed on pinboard.in", "the replay was expected to merge into the existing notes");
    equal((await pbpFixtureSummaryOwnershipEntries()).length, 0, "a hold or receipt survived a merge that kept the server notes");
    equal(await (await popupOpens("Typed on pinboard.in")).restore(), null);
  });

  // Only a create or an update writes the notes it submits. A merge,
  // overwrite or skip of an existing bookmark keeps the server's notes, so it
  // owns nothing in them -- even when they read exactly like the submission,
  // since this save cannot tell its own text from the same text typed by hand.
  await test("a popup update owns the summary block it wrote", async () => {
    await pbpFixtureClearSummaryOwnership();
    const core = await createHarness({ pinboardFetch: pinboard(postsGet("Typed on pinboard.in")) });
    const result = await core.submitPopupSaveIntent(
      intent({ mode: "update", time: "2026-11-01T09:00:00Z", notes: QUICK_NOTES }), "alice", QUICK_RANGE);
    equal(result.status, "saved");
    equal(extendedSent(core), QUICK_NOTES, "update notes bytes changed");
    const popup = await popupOpens(QUICK_NOTES);
    const owner = await popup.restore();
    popup.regenerate("Second summary");
    equal(owner, "receipt", "the reopened popup did not reclaim the updated block");
    equal(popup.field.value, "Auto notes\n\n<blockquote>Second summary</blockquote>", "Regenerate did not replace the block in place");
  });

  await test("a live save that keeps server notes identical to its own owns nothing in them", async () => {
    for (const mode of ["merge", "overwrite", "skip"]) {
      await pbpFixtureClearSummaryOwnership();
      const core = await createHarness({ pinboardFetch: pinboard(postsGet(QUICK_NOTES)) });
      const result = await core.submitSaveIntent(intent({ mode, notes: QUICK_NOTES }), { expectedAccount: "alice", summaryRange: QUICK_RANGE });
      equal(result.status, mode === "skip" ? "skipped" : "saved", mode);
      if (mode !== "skip") equal(extendedSent(core), QUICK_NOTES, mode + " changed the server notes");
      equal((await pbpFixtureSummaryOwnershipEntries()).length, 0, mode + " adopted server notes it did not write");
      equal(await (await popupOpens(QUICK_NOTES)).restore(), null, mode + ": identical server text was reclaimed");
    }
  });

  // The popup with its AI summary UI off never checks which block it owns,
  // and a save clicked before that check completes cannot tell either. Its
  // update writes the same notes back, so the page's receipt must survive.
  await test("a popup save that cannot tell its summary ownership leaves the page's receipt alone", async () => {
    await pbpFixtureClearSummaryOwnership();
    await pbpAiSaveSummaryOwnership("alice", PAGE, QUICK_NOTES, QUICK_RANGE);
    const unchecked = await popupOpens(QUICK_NOTES);
    const core = await createHarness({ pinboardFetch: pinboard(NO_POSTS) });
    const result = await core.submitPopupSaveIntent(
      intent({ mode: "update", time: "2026-11-01T09:00:00Z", title: "Edited title", notes: QUICK_NOTES }), "alice",
      JSON.parse(JSON.stringify({ range: unchecked.snapshot() })).range);
    equal(result.status, "saved");
    equal(extendedSent(core), QUICK_NOTES, "update notes bytes changed");
    const popup = await popupOpens(QUICK_NOTES);
    const owner = await popup.restore();
    popup.regenerate("Second summary");
    equal(owner, "receipt", "an update from a popup that never checked ownership retired the receipt");
    equal(popup.field.value, "Auto notes\n\n<blockquote>Second summary</blockquote>", "Regenerate did not replace the block in place");
  });

  // The popup hands the reader its notes and the summary block it can vouch
  // for: popup.js writes both into the preview slot's bookmarkDraft, which
  // storage keeps as JSON. A reader save that creates the bookmark with
  // exactly those notes owns that block, as the popup's own save would.
  const READER_SENDER = Object.freeze({ id: "test-id", frameId: 0,
    url: "chrome-extension://test-id/md-preview.html?k=reader-key", tab: { id: 9 } });
  const handToReader = (core, draft) => {
    core.storageData["md_preview_data_reader-key"] = JSON.parse(JSON.stringify({
      url: PAGE, baseUrl: PAGE, sourceTabUrl: PAGE, tabId: 8, title: "New title", account: "alice",
      sourceIncognito: false, tags: ["base-tag"], description: draft.notes,
      bookmarkDraft: { title: "New title", tags: "base-tag", private: false, toread: false, ...draft },
    }));
  };
  // "edit" sends the editor as the reader fills it from the worker's state,
  // optionally with the notes rewritten.
  const readerSave = async (core, action, rewrite) => {
    let draft;
    if (action === "edit") {
      const state = await core.pbpReaderBookmarkRequest({ type: "mdReaderBookmarkState", account: "alice" }, READER_SENDER);
      draft = { ...state.bookmark, ...(rewrite ? { notes: rewrite(state.bookmark.notes) } : {}) };
    }
    return core.pbpReaderBookmarkRequest({ type: "mdReaderBookmarkSave", account: "alice", action, ...(draft ? { draft } : {}) }, READER_SENDER);
  };
  // A popup on a page it has not saved, after Generate appended its summary.
  const popupWithFreshSummary = async () => {
    const popup = await pbpFixturePopupSummary({ service: "pinboard", account: "alice", url: PAGE, notes: "Auto notes" });
    equal(await popup.restore(), null, "a page never saved already owned a block");
    popup.regenerate("Fresh summary");
    equal(popup.field.value, QUICK_NOTES, "the summary was not appended to the notes");
    return popup;
  };
  const receipts = async () => JSON.stringify((await pbpFixtureSummaryOwnershipEntries()).map((entry) => [entry.key, entry.result]));

  await test("a summary handed to the reader is reclaimable after a reader save creates the bookmark with it", async () => {
    for (const action of ["save", "later", "edit"]) {
      await pbpFixtureClearSummaryOwnership();
      const popup = await popupWithFreshSummary();
      const core = await createHarness({ pinboardFetch: pinboard(NO_POSTS) });
      handToReader(core, { notes: popup.field.value, summaryRange: popup.snapshot() });
      equal((await readerSave(core, action)).status, "saved", action);
      equal(extendedSent(core), QUICK_NOTES, action + ": notes bytes changed");
      const reopened = await popupOpens(QUICK_NOTES);
      const owner = await reopened.restore();
      reopened.regenerate("Second summary");
      equal(owner, "receipt", action + ": the reader save left the handed block unowned");
      equal(reopened.field.value, "Auto notes\n\n<blockquote>Second summary</blockquote>", action + ": Regenerate did not replace the block in place");
    }
  });

  // The worker cannot follow a range through the reader's editor, so notes
  // edited there own nothing, even when the handed range still fits them;
  // nor do notes handed without a range (the popup could not vouch).
  await test("a reader save owns no handed block it does not write exactly as handed", async () => {
    await pbpFixtureClearSummaryOwnership();
    const popup = await popupWithFreshSummary();
    let core = await createHarness({ pinboardFetch: pinboard(NO_POSTS) });
    handToReader(core, { notes: popup.field.value, summaryRange: popup.snapshot() });
    const editedNotes = QUICK_NOTES.replace("Auto notes", "Auto nodes");
    equal((await readerSave(core, "edit", () => editedNotes)).status, "saved");
    equal(extendedSent(core), editedNotes, "edited notes bytes changed");
    equal(await receipts(), "[]", "notes edited in the reader gained a receipt");
    equal(await (await popupOpens(editedNotes)).restore(), null, "notes edited in the reader were reclaimed");
    for (const action of ["save", "later", "edit"]) {
      core = await createHarness({ pinboardFetch: pinboard(NO_POSTS) });
      handToReader(core, { notes: QUICK_NOTES });
      equal((await readerSave(core, action)).status, "saved", action);
      equal(await receipts(), "[]", action + ": notes handed without a range gained a receipt");
    }
  });

  // An existing bookmark keeps the server's notes (or the editor's, filled
  // from them): the handed block is not written, and the receipt of the
  // server's own block stays as it was.
  await test("a reader save of an existing bookmark neither takes the handed block nor drops the page's receipt", async () => {
    for (const action of ["save", "later", "read", "edit"]) {
      await pbpFixtureClearSummaryOwnership();
      await pbpAiSaveSummaryOwnership("alice", PAGE, SERVER_NOTES, SERVER_RANGE);
      const before = await receipts();
      const popup = await popupWithFreshSummary();
      const core = await createHarness({ pinboardFetch: pinboard(postsGet(SERVER_NOTES)) });
      handToReader(core, { notes: popup.field.value, summaryRange: popup.snapshot() });
      const result = await readerSave(core, action);
      assert(result.status === "saved" || result.status === "skipped", action + ": " + JSON.stringify(result));
      for (const url of core.fetchCalls.filter((call) => call.includes("/posts/add?"))) {
        equal(new URL(url).searchParams.get("extended"), SERVER_NOTES, action + " replaced the server notes");
      }
      equal(await receipts(), before, action + " changed the page's receipts");
      equal(await (await popupOpens(SERVER_NOTES)).restore(), "receipt", action + ": the server's block lost its receipt");
    }
  });

  // The notes guard compares bytes, and bytes can agree by chance: the server
  // may hold exactly the text the popup handed over (typed on another client, or
  // saved earlier without a receipt). An update still writes the server's notes
  // as it read them, never the handed ones, so the handed range describes
  // nothing the worker wrote and must neither become a receipt nor replace one.
  // Only a create (or a skip, which creates or keeps) writes the handed notes.
  await test("a reader update of an existing bookmark takes no receipt for a handed block, even when the server notes equal the handed ones", async () => {
    for (const action of ["later", "read", "edit"]) {
      for (const held of [false, true]) {
        const where = action + (held ? " over a receipt for the same text" : "");
        await pbpFixtureClearSummaryOwnership();
        const popup = await popupWithFreshSummary();
        const handed = popup.field.value;
        // A receipt the page already had for these very notes, at a range the
        // popup does not hand over.
        if (held) await pbpAiSaveSummaryOwnership("alice", PAGE, handed, { start: 0, end: "Auto notes".length });
        const core = await createHarness({ pinboardFetch: pinboard(postsGet(handed, action === "read" ? "yes" : "no")) });
        handToReader(core, { notes: handed, summaryRange: popup.snapshot() });
        const before = await receipts();
        equal(before === "[]", !held, where + ": unexpected receipts before the save");
        const result = await readerSave(core, action);
        equal(result.status, "saved", where + ": " + JSON.stringify(result));
        equal(extendedSent(core), handed, where + ": the update did not write the server notes it read");
        equal(await receipts(), before, where + ": the update wrote or dropped a receipt");
        if (!held) equal(await (await popupOpens(handed)).restore(), null, where + ": the popup reclaimed text it never wrote");
      }
    }
  });

  // An edit that cannot be delivered is queued as the resolved update; a hold
  // for the handed range would later become a receipt for whatever notes the
  // replay finds, so the update queues without one.
  await test("a queued reader edit of an existing bookmark holds no ownership for a handed block", async () => {
    await pbpFixtureClearSummaryOwnership();
    const popup = await popupWithFreshSummary();
    const handed = popup.field.value;
    const core = await createHarness({ pinboardFetch: async (url) => {
      if (url.includes("/posts/get?")) return response(200, postsGet(handed));
      throw new TypeError("Failed to fetch");
    } });
    handToReader(core, { notes: handed, summaryRange: popup.snapshot() });
    const result = await readerSave(core, "edit");
    equal(result.status, "queued", JSON.stringify(result));
    equal(core.storageData.offlineQueue.length, 1, "the edit was not queued");
    equal(core.storageData.offlineQueue[0].mode, "update", "the queued edit is not the resolved update");
    equal(await receipts(), "[]", "the queued update holds a range for text the worker did not write");
  });

  // Read Later and mark-as-read resolve to a kept skip when the reader's own
  // lookup finds the bookmark already in that state. Nothing is delivered: no
  // second lookup, no write, and no queue record, even when the network fails
  // right after that lookup (a queued skip used to wait for it, and its replay
  // would rebuild a bookmark deleted elsewhere from the popup draft). The
  // handed block was never written, so it gains no receipt or hold, and a
  // receipt the page already had for those notes stays as it was.
  await test("a reader Read Later or mark-as-read of a bookmark already in that state delivers, queues and holds nothing", async () => {
    for (const [action, toread, failure] of [["later", "yes", "dropped connection"], ["read", "no", "dropped connection"],
      ["later", "yes", "503 answer"], ["read", "no", "503 answer"]]) {
      for (const held of [false, true]) {
        const where = action + ", " + failure + (held ? ", over a receipt for the same text" : "");
        await pbpFixtureClearSummaryOwnership();
        const popup = await popupWithFreshSummary();
        const handed = popup.field.value;
        // A receipt the page already had for these very notes, at a range the
        // popup does not hand over.
        if (held) await pbpAiSaveSummaryOwnership("alice", PAGE, handed, { start: 0, end: "Auto notes".length });
        // The reader's lookup is the first posts/get; every request after it fails.
        let lookups = 0;
        const core = await createHarness({ pinboardFetch: async (url) => {
          if (url.includes("/posts/get?") && ++lookups === 1) return response(200, postsGet(handed, toread));
          if (failure === "503 answer") return response(503, null, true);
          throw new TypeError("Failed to fetch");
        } });
        handToReader(core, { notes: handed, summaryRange: popup.snapshot() });
        const before = await receipts();
        equal(before === "[]", !held, where + ": unexpected receipts before the save");
        const result = await readerSave(core, action);
        equal(result.status, "skipped", where + ": " + JSON.stringify(result));
        equal(core.fetchCalls.length, 1, where + ": requests after the reader's lookup " + JSON.stringify(core.fetchCalls.slice(1)));
        equal(JSON.stringify(core.storageData.offlineQueue), "[]", where + ": the action was queued");
        equal(await receipts(), before, where + ": the action wrote or dropped a receipt");
        if (!held) equal(await (await popupOpens(handed)).restore(), null, where + ": the popup reclaimed text it never wrote");
      }
    }
  });

  await test("removing a queued save drops its offline hold", async () => {
    for (const removal of ["remove", "clear"]) {
      await pbpFixtureClearSummaryOwnership();
      const core = await createHarness({ pinboardFetch: async () => { throw new TypeError("Failed to fetch"); } });
      const queued = await core.submitSaveIntent(intent({ notes: QUICK_NOTES }), { expectedAccount: "alice", summaryRange: QUICK_RANGE });
      equal(queued.status, "queued");
      equal((await pbpFixtureSummaryOwnershipEntries()).length, 1, "the queued save holds no ownership");
      await core.mutateOfflineQueue(removal === "remove" ? { kind: "remove", queueId: queued.queueId } : { kind: "clear" });
      equal((await pbpFixtureSummaryOwnershipEntries()).length, 0, removal + " left the hold behind");
    }
  });

  await test("a save that keeps the server's notes neither writes nor drops a receipt", async () => {
    for (const mode of ["merge", "overwrite", "skip"]) {
      await pbpFixtureClearSummaryOwnership();
      await pbpAiSaveSummaryOwnership("alice", PAGE, SERVER_NOTES, SERVER_RANGE);
      const before = JSON.stringify((await pbpFixtureSummaryOwnershipEntries()).map((entry) => [entry.key, entry.result]));
      const core = await createHarness({ pinboardFetch: pinboard(postsGet(SERVER_NOTES)) });
      const result = await core.submitSaveIntent(intent({ mode, notes: QUICK_NOTES }), { expectedAccount: "alice", summaryRange: QUICK_RANGE });
      equal(result.status, mode === "skip" ? "skipped" : "saved", mode);
      if (mode !== "skip") equal(extendedSent(core), SERVER_NOTES, mode + " was expected to keep the server notes");
      const after = JSON.stringify((await pbpFixtureSummaryOwnershipEntries()).map((entry) => [entry.key, entry.result]));
      equal(after, before, mode + " changed the page's receipts");
      equal(await (await popupOpens(SERVER_NOTES)).restore(), "receipt", mode + ": the existing block lost its receipt");
    }
  });

  await test("notes written without an owned block retire the page's receipt", async () => {
    await pbpFixtureClearSummaryOwnership();
    await pbpAiSaveSummaryOwnership("alice", PAGE, QUICK_NOTES, QUICK_RANGE);
    const core = await createHarness({ pinboardFetch: async () => response(200, ADDED) });
    equal((await core.submitSaveIntent(intent({ notes: "Rewritten by hand" }), { expectedAccount: "alice", summaryRange: null })).status, "saved");
    equal((await pbpFixtureSummaryOwnershipEntries()).length, 0, "a receipt for replaced notes survived");
  });

  await test("only records own a block: identical text typed by hand, another account and edited notes are not reclaimed", async () => {
    await pbpFixtureClearSummaryOwnership();
    let popup = await popupOpens(QUICK_NOTES);
    equal(await popup.restore(), null, "identical hand-typed text was adopted without a receipt");
    equal(popup.remove(), false, "Remove deleted hand-typed text");
    popup.regenerate("Second summary");
    equal(popup.field.value, QUICK_NOTES + "\n\n<blockquote>Second summary</blockquote>", "Regenerate rewrote hand-typed text");

    await pbpAiSaveSummaryOwnership("bob", PAGE, QUICK_NOTES, QUICK_RANGE);
    equal(await (await popupOpens(QUICK_NOTES, "alice")).restore(), null, "another account's receipt was honoured");

    await pbpAiSaveSummaryOwnership("alice", PAGE, QUICK_NOTES, QUICK_RANGE);
    const edited = QUICK_NOTES.replace("Fresh summary", "Fresh summary, edited elsewhere");
    popup = await popupOpens(edited);
    equal(await popup.restore(), null, "a receipt for other notes was honoured");
    equal(await pbpAiCacheGet(pbpAiSummaryOwnershipKey("alice", PAGE)), null, "the stale receipt was kept");

    popup = await popupOpens("Auto notes\n\n[AI Summary]\n<blockquote>Old summary</blockquote>");
    equal(await popup.restore(), "legacy", "the legacy marker is no longer recognized");
    popup.regenerate("Second summary");
    equal(popup.field.value, "Auto notes\n\n<blockquote>Second summary</blockquote>");
  });
});
})();
</script>
</body></html>
