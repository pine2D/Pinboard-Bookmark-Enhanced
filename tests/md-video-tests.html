<script>
const root = document.getElementById("results");
let pass = 0, fail = 0;
function check(name, cond, detail) {
  const ok = !!cond; ok ? pass++ : fail++;
  const div = document.createElement("div");
  div.className = "case " + (ok ? "pass" : "fail");
  div.textContent = `${ok ? "✓" : "✗"}  ${name}${ok ? "" : "\n   " + (detail || "")}`;
  root.appendChild(div);
}
function section(name) { const h = document.createElement("h2"); h.textContent = name; root.appendChild(h); }
function assert(cond, detail) { check(detail || String(cond), cond, detail); }
function assertEq(a, e, label) {
  const ok = a === e;
  check(label || (String(e) + " === " + String(a)), ok, ok ? "" : "expected " + JSON.stringify(e) + " got " + JSON.stringify(a));
}

(async function () {

section("pbpVideoDetect");
assertEq(pbpVideoDetect("https://www.youtube.com/watch?v=dQw4w9WgXcQ").videoId, "dQw4w9WgXcQ", "watch URL");
assertEq(pbpVideoDetect("https://m.youtube.com/watch?v=dQw4w9WgXcQ&t=42s").videoId, "dQw4w9WgXcQ", "mobile watch URL with extra params");
assertEq(pbpVideoDetect("https://youtu.be/dQw4w9WgXcQ?si=xyz").videoId, "dQw4w9WgXcQ", "youtu.be short link");
assertEq(pbpVideoDetect("https://www.youtube.com/shorts/abcDEF12345").videoId, "abcDEF12345", "shorts URL");
assertEq(pbpVideoDetect("https://www.youtube.com/watch?v=dQw4w9WgXcQ").provider, "youtube", "provider tag");
assertEq(pbpVideoDetect("https://example.com/watch?v=dQw4w9WgXcQ"), null, "non-YouTube host is null");
assertEq(pbpVideoDetect("https://www.youtube.com/feed/subscriptions"), null, "non-video YouTube page is null");
assertEq(pbpVideoDetect("not a url"), null, "garbage is null");

section("pbpYtParseTranscriptPanel");
(() => {
  // Hand-written from the real get_transcript response shape (verified via
  // page-assist's shipping parser): actions -> updateEngagementPanelAction
  // -> transcriptRenderer -> ... -> initialSegments -> transcriptSegmentRenderer.
  const panelResp = { actions: [{ updateEngagementPanelAction: { content: { transcriptRenderer: { content: {
    transcriptSearchPanelRenderer: { body: { transcriptSegmentListRenderer: { initialSegments: [
      { transcriptSegmentRenderer: { startMs: "1200", endMs: "3100", snippet: { runs: [{ text: "hello " }, { text: "world" }] } } },
      { transcriptSegmentRenderer: { startMs: "3200", endMs: "5000", snippet: { runs: [{ text: "  second   line " }] } } },
      { transcriptSectionHeaderRenderer: { } },
    ] } } } } } } } }] };
  const segs = pbpYtParseTranscriptPanel(panelResp);
  assertEq(segs.length, 2, "two text segments parsed, header renderer skipped");
  assertEq(segs[0].content, "hello world", "runs joined into one text");
  assert(Math.abs(segs[0].from - 1.2) < 1e-9 && Math.abs(segs[0].to - 3.1) < 1e-9, "startMs/endMs converted to seconds");
  assertEq(segs[1].content, "second line", "whitespace collapsed");
  const contResp = { actions: [{ appendContinuationItemsAction: { continuationItems: [
    { transcriptSegmentRenderer: { startMs: "0", endMs: "900", snippet: { runs: [{ text: "cont" }] } } },
  ] } }] };
  assertEq(pbpYtParseTranscriptPanel(contResp).length, 1, "continuation items accepted");
  assertEq(pbpYtParseTranscriptPanel({}).length, 0, "no actions -> empty");
  assertEq(pbpYtParseTranscriptPanel(null).length, 0, "null -> empty");
})();

section("pbpYtParseTranscriptDeep");
(() => {
  // PAmodern /get_panel grade: viewmodel rows under shifting wrappers --
  // fixture nesting mirrors the shape reported by youtube-transcript-downloader.
  const panelGrade = { some: { wrapper: { contents: [
    { itemSectionRenderer: { contents: [ { deep: { transcriptSegmentViewModel: { timestamp: "1:05", simpleText: "view model row" } } } ] } },
    { transcriptSegmentViewModel: { timestamp: { simpleText: "12:34" }, simpleText: "second row" } },
  ] } } };
  const vm = pbpYtParseTranscriptDeep(panelGrade);
  check("deep: viewmodel rows found under arbitrary nesting", vm.length === 2 && vm[0].content === "view model row" && vm[1].content === "second row");
  check("deep: timestamp string and simpleText object both parse", vm[0].from === 65 && vm[1].from === 754);
  const classic = { actions: [{ x: { transcriptSegmentRenderer: { startMs: "2000", endMs: "4000", snippet: { runs: [{ text: "classic row" }] } } } }] };
  const cl = pbpYtParseTranscriptDeep(classic);
  check("deep: classic renderer rows also collected", cl.length === 1 && cl[0].content === "classic row" && cl[0].from === 2);
  assertEq(pbpYtParseTranscriptDeep({}).length, 0, "deep: empty object -> empty");
  assertEq(pbpYtParseTranscriptDeep(null).length, 0, "deep: null -> empty");
})();

section("pbpYtTranscriptParams");
(() => {
  const params = pbpYtTranscriptParams("b_OpjUz7zN8", "zh", false);
  const decoded = atob(params);
  assert(decoded.includes("b_OpjUz7zN8"), "outer protobuf carries the videoId in cleartext");
  assert(decoded.includes("engagement-panel-searchable-transcript-search-panel"), "outer protobuf carries the panel id");
  const innerTok = decodeURIComponent((decoded.match(/([A-Za-z0-9_\-]+%3D*|[A-Za-z0-9_\-=]+)/g) || []).find(t => { try { return atob(decodeURIComponent(t).replace(/-/g, "+").replace(/_/g, "/")).includes("zh"); } catch (_) { return false; } }) || "");
  assert(!!innerTok, "inner token decodes and carries the language code");
  const asrParams = atob(pbpYtTranscriptParams("dQw4w9WgXcQ", "en", true));
  const asrInner = (asrParams.match(/[A-Za-z0-9_\-]+%3D+/) || [""])[0];
  assert(asrInner ? atob(decodeURIComponent(asrInner).replace(/-/g, "+").replace(/_/g, "/")).includes("asr") : true, "asr flag lands in the inner token when set");
  assert(pbpYtTranscriptParams("x", "en", false) !== pbpYtTranscriptParams("x", "de", false), "language changes the token");
})();

section("punctuation enhancement");
(() => {
  const mk = (n, content, gapAfter) => ({ from: n * 3, to: n * 3 + (gapAfter != null ? 3 - gapAfter : 2.9), content });
  const unp = []; for (let i = 0; i < 12; i++) unp.push({ from: i * 3, to: i * 3 + 2.9, content: "这是没有标点的第" + i + "句" });
  assert(pbpVideoNeedsPunctuation(unp) === true, "needs: 12 unpunctuated CJK segments qualify");
  const punc = unp.map((s) => ({ ...s, content: s.content + "。" }));
  assert(pbpVideoNeedsPunctuation(punc) === false, "needs: punctuated track never qualifies");
  assert(pbpVideoNeedsPunctuation(unp.slice(0, 5)) === false, "needs: short tracks are left alone");
  const segs = [
    { from: 0, to: 2.8, content: "这是第一句" },      // 0.2s gap -> nothing
    { from: 3, to: 5, content: "然后短停顿" },        // 1.0s gap -> comma
    { from: 6, to: 8, content: "长停顿之前说的话" },   // 4s gap -> full stop
    { from: 12, to: 14, content: "你说对吗" },        // last + particle -> question mark
  ];
  const hp = pbpVideoHeuristicPunctuate(segs);
  assertEq(hp[0].content, "这是第一句，", "heuristic: contiguous boundary still earns a comma (ASR tier)");
  assertEq(hp[1].content, "然后短停顿，", "heuristic: short pause gets a comma");
  assertEq(hp[2].content, "长停顿之前说的话。", "heuristic: long pause gets a full stop");
  assertEq(hp[3].content, "你说对吗？", "heuristic: trailing interrogative particle gets a question mark");
  assertEq(pbpVideoHeuristicPunctuate([{ from: 0, to: 9, content: "english asr line" }])[0].content, "english asr line", "heuristic: non-CJK untouched");
  assertEq(segs[1].content, "然后短停顿", "heuristic: input segments not mutated");
  // bilibili ai-zh shape (device round 4: 125 of 132 real boundaries at
  // exactly gap 0): cues tile the timeline edge-to-edge, so the pause rules
  // alone marked nothing -- the boundary tier must mark every cue, and the
  // sentence-length promotion must bound the comma run-ons.
  const tile = []; for (let i = 0; i < 20; i++) tile.push({ from: i * 2, to: (i + 1) * 2, content: "无缝衔接的机器字幕行第" + "几".repeat(1) + "条" });
  const tiled = pbpVideoHeuristicPunctuate(tile);
  assert(tiled.every((s) => /[，。！？]$/.test(s.content)), "heuristic: every contiguous CJK cue ends marked");
  assert(tiled.some((s) => /。$/.test(s.content) && s !== tiled[tiled.length - 1]), "heuristic: long comma runs promote to full stops mid-track");
  assert(/。$/.test(tiled[tiled.length - 1].content), "heuristic: track end closes the sentence");
  assert(tile.every((s) => !/[，。！？]$/.test(s.content)), "heuristic: tiled input not mutated");
  const q = pbpVideoHeuristicPunctuate([{ from: 0, to: 2, content: "你知道吗" }, { from: 2, to: 4, content: "其实很简单" }]);
  assertEq(q[0].content, "你知道吗？", "heuristic: interrogative particle wins at a contiguous boundary too");
  assert(pbpVideoPunctConserved("我们蒸馒头 蒸饭", "我们蒸馒头，蒸饭。") === true, "conserved: pure punctuation insertion passes");
  assert(pbpVideoPunctConserved("我们蒸馒头", "我们蒸包子。") === false, "conserved: rewritten words fail closed");
  assert(pbpVideoPunctConserved("", "") === false, "conserved: empty input fails closed");
  // audit A5: word-internal marks are content, CJK model marks are legal
  assert(pbpVideoPunctConserved("I don't know", "I don't know.") === true, "conserved: intra-word apostrophe kept on both sides passes");
  assert(pbpVideoPunctConserved("I don't know", "I dont know.") === false, "conserved: dropping a word-internal apostrophe fails closed");
  assert(pbpVideoPunctConserved("圆周率是3.14左右", "圆周率是314左右。") === false, "conserved: dropping a decimal point fails closed");
  assert(pbpVideoPunctConserved("哈利·波特与魔法石", "哈利波特与魔法石。") === false, "conserved: dropping a name middle-dot fails closed");
  assert(pbpVideoPunctConserved("他说好我们走", "他说「好」，我们走。") === true, "conserved: CJK corner quotes are legal AI marks");
  assert(pbpVideoPunctConserved("大家好呀今天继续", "大家好呀～今天继续。") === true, "conserved: fullwidth tilde is a legal AI mark");
  // audit A6: quote-closed sentence ends
  const punc2 = unp.map((s) => ({ ...s, content: s.content + "。”" }));
  assert(pbpVideoNeedsPunctuation(punc2) === false, "needs: quote-closed sentence ends count as punctuated");
  const hq = pbpVideoHeuristicPunctuate([
    { from: 0, to: 2, content: "他说“好。”" },
    { from: 2, to: 4, content: "然后我们出发了" },
  ]);
  assertEq(hq[0].content, "他说“好。”", "heuristic: quote-closed sentence gets no second mark");
  const hq2 = pbpVideoHeuristicPunctuate([{ from: 0, to: 2, content: "你说对吗”" }, { from: 2, to: 4, content: "其实很简单" }]);
  assertEq(hq2[0].content, "你说对吗”？", "heuristic: interrogative inside a closing quote still gets its question mark");
})();

// K37: punctModelId (the vpunct_ cache identity's model+endpoint half) is
// closure-scoped inside md-video.js's runtime IIFE, so it is exposed test-only
// as window.pbpVideoPunctModelId right next to its definition (see md-video.js
// comment there) -- it takes no mutable module state beyond its settings
// argument, so pinning it directly here is safe.
section("punctModelId endpoint normalisation (K37)");
(() => {
  const compatSlash = { aiProvider: "openai", openaiModel: "m", openaiBaseUrl: "https://x.test/v1/" };
  const compatNoSlash = { aiProvider: "openai", openaiModel: "m", openaiBaseUrl: "https://x.test/v1" };
  assertEq(pbpVideoPunctModelId(compatSlash), pbpVideoPunctModelId(compatNoSlash),
    "compat: trailing slash on the base URL must not fork the vpunct_ cache identity");
  const ollSlash = { aiProvider: "ollama", ollamaBaseUrl: "http://localhost:11434/" };
  const ollNoSlash = { aiProvider: "ollama", ollamaBaseUrl: "http://localhost:11434" };
  assertEq(pbpVideoPunctModelId(ollSlash), pbpVideoPunctModelId(ollNoSlash),
    "ollama: trailing slash on the base URL must not fork the vpunct_ cache identity");
})();

section("pbpVideoApplyPunctText");
(() => {
  const segs = [
    { from: 0, to: 2, content: "我们几千年前就蒸馒头蒸饭" },
    { from: 3, to: 5, content: "为什么蒸汽机是外国人发明的呢" },
  ];
  const ai = "我们几千年前就蒸馒头、蒸饭，为什么蒸汽机是外国人发明的呢？";
  const applied = pbpVideoApplyPunctText(segs, ai);
  assert(!!applied && applied.length === 2, "apply: aligned onto both segments");
  assertEq(applied[0].content, "我们几千年前就蒸馒头、蒸饭，", "apply: internal and trailing marks absorbed");
  assertEq(applied[1].content, "为什么蒸汽机是外国人发明的呢？", "apply: question mark lands on the right row");
  assertEq(applied[0].from, 0, "apply: timing preserved");
  assert(pbpVideoApplyPunctText(segs, "我们几千年前就蒸包子。为什么蒸汽机是外国人发明的呢？") === null, "apply: rewritten text fails closed");
  assert(pbpVideoApplyPunctText(segs, "我们几千年前就蒸馒头") === null, "apply: short text fails closed");
})();

section("pbpVideoOriginPatterns");
(() => {
  const b = pbpVideoOriginPatterns("bilibili");
  check("bilibili asks for BOTH exact bilibili origins in one prompt (captions + player bridge)", b.length === 2 && b[0] === "https://api.bilibili.com/*" && b[1] === "https://player.bilibili.com/*");
  const y = pbpVideoOriginPatterns("youtube");
  check("youtube asks only for www.youtube.com (the relay page needs no grant)", y.length === 1 && y[0] === "https://www.youtube.com/*");
  check("every pattern is an exact https origin, never a wildcard host", b.concat(y).every((p) => /^https:\/\/[a-z0-9.-]+\/\*$/.test(p)));
})();

section("pbpYtPickCaptureTab");
(() => {
  const tabs = [
    { id: 11, url: "https://www.youtube.com/" },
    { id: 12, url: "https://www.youtube.com/watch?v=AAA" },
    { id: 13, url: "https://www.youtube.com/watch?v=BBB&t=5" },
    { id: 14, url: "https://m.youtube.com/watch?v=BBB" },
    { id: 15, url: "https://www.youtube.com/watch?v=BBB" },
  ];
  assertEq(pbpYtPickCaptureTab(tabs, 999, "BBB"), 13, "remembered tab closed: the first tab ON the video wins (device 2026-08-25: 'No tab with id')");
  assertEq(pbpYtPickCaptureTab(tabs, 15, "BBB"), 15, "remembered tab still on the video: it stays the choice among same-video tabs");
  assertEq(pbpYtPickCaptureTab(tabs, 12, "BBB"), 13, "remembered tab navigated to another video: a same-video tab beats it");
  assertEq(pbpYtPickCaptureTab(tabs, 12, "CCC"), 12, "no tab on the video: the remembered eligible tab is the fetch host");
  assertEq(pbpYtPickCaptureTab(tabs, 999, "CCC"), 11, "no tab on the video, remembered gone: first eligible tab");
  assertEq(pbpYtPickCaptureTab(tabs, null, ""), 11, "no video id: first eligible tab");
  assertEq(pbpYtPickCaptureTab([{ id: 14, url: "https://m.youtube.com/watch?v=BBB" }], 14, "BBB"), null, "m.youtube.com only: nothing eligible");
  assertEq(pbpYtPickCaptureTab([], 12, "BBB"), null, "no tabs -> null");
  assertEq(pbpYtPickCaptureTab([{ id: 20, url: "https://www.youtube.com/shorts/BBB" }, { id: 21, url: "https://www.youtube.com/watch?v=BBB" }], null, "BBB"), 20, "shorts path counts as on-video");
  assertEq(pbpYtPickCaptureTab([{ url: "https://www.youtube.com/watch?v=BBB" }, { id: "x", url: "https://www.youtube.com/watch?v=BBB" }], null, "BBB"), null, "tabs without a numeric id are skipped");
  // Readiness (device 2026-08-26): the scraper injected into a tab that had
  // not hydrated yet saw no transcript entry and bailed. A complete tab on
  // the same video beats a loading one; a loading tab is still usable alone.
  const YT = "https://www.youtube.com/watch?v=";
  assertEq(pbpYtPickCaptureTab([{ id: 30, url: YT + "BBB", status: "loading" }, { id: 31, url: YT + "BBB", status: "complete" }], 30, "BBB"), 31, "a still-loading tab yields to a complete tab on the same video, even when it is the remembered one");
  assertEq(pbpYtPickCaptureTab([{ id: 32, url: YT + "BBB", status: "loading" }], null, "BBB"), 32, "a loading tab is still chosen when it is the only tab on the video (the page function waits for hydration)");
  assertEq(pbpYtPickCaptureTab([{ id: 33, url: YT + "CCC", status: "complete" }, { id: 34, url: YT + "BBB", status: "loading" }], null, "BBB"), 34, "readiness never lifts an off-video tab over a loading on-video tab");
  assertEq(pbpYtPickCaptureTab([{ id: 35, url: YT + "BBB", status: "unloaded" }, { id: 36, url: YT + "BBB", status: "complete" }], 35, "BBB"), 36, "a discarded (unloaded) tab counts as not ready");
})();

section("pbpYtDomTranscriptInPage (DOM rescue tier, run against this page's own DOM)");
await (async () => {
  // The injected scraper is a top-level, closure-free function, so it runs
  // here unchanged on a real DOM; fixtures stand in for YouTube's watch page.
  const VID = "TESTVID0001";
  const stage = document.createElement("div"); stage.id = "yt-stage"; document.body.appendChild(stage);
  const savedHash = location.hash; location.hash = "v=" + VID; // the wrong-tab guard reads location.href
  const okPR = (captionTracks) => ({ videoDetails: { videoId: VID }, playabilityStatus: { status: "OK" },
    captions: captionTracks ? { playerCaptionsTracklistRenderer: { captionTracks } } : undefined });
  const reset = (pr) => { stage.textContent = ""; delete window.ytInitialPlayerResponse; delete window.__pbpTapLease; if (pr) window.ytInitialPlayerResponse = pr; };
  const hydrate = () => { const flexy = document.createElement("ytd-watch-flexy"); stage.appendChild(flexy); return flexy; };
  try {
    reset(okPR(null));
    let r = await pbpYtDomTranscriptInPage(VID, { hydrateMs: 200 });
    assertEq(r.trace, "video has no caption tracks", "page fn: an OK player response for THIS video with no caption tracks ends the tier at once (no wait, no scrape)");
    assert(r.kind === "" && r.segs.length === 0, "page fn: the no-captions bail returns nothing");
    reset({ videoDetails: { videoId: VID }, playabilityStatus: { status: "LOGIN_REQUIRED" } });
    r = await pbpYtDomTranscriptInPage(VID, { hydrateMs: 200 });
    assertEq(r.trace, "page not hydrated within 200ms", "page fn: a non-OK player response proves nothing about captions -> the tier waits for hydration instead of bailing");
    reset(Object.assign(okPR(null), { videoDetails: { videoId: "OTHERVIDEO0" } }));
    r = await pbpYtDomTranscriptInPage(VID, { hydrateMs: 200 });
    assertEq(r.trace, "page not hydrated within 200ms", "page fn: a stale player response (another video, left behind by SPA navigation) is not trusted for the no-captions bail");
    reset(okPR([{ languageCode: "en" }])); hydrate();
    r = await pbpYtDomTranscriptInPage(VID, { hydrateMs: 200 });
    assertEq(r.trace, "no transcript entry in page", "page fn: a hydrated watch page with neither a Show-transcript button nor a transcript panel still reports the classic trace");
    // Late hydration: the watch layout mounts 3.6s in -- past the 3.2s the
    // old button poll allowed (device 2026-08-26: ytd-watch-flexy measured
    // ~22s behind readyState=complete in a background tab).
    reset(okPR([{ languageCode: "en" }]));
    setTimeout(() => {
      const flexy = hydrate();
      flexy.innerHTML = '<tp-yt-paper-button id="expand"></tp-yt-paper-button>' +
        '<ytd-video-description-transcript-section-renderer><button>Show transcript</button></ytd-video-description-transcript-section-renderer>' +
        '<div id="movie_player"></div><div id="rows"></div>';
      flexy.querySelector("#movie_player").getDuration = () => 10;
      flexy.querySelector("button").addEventListener("click", () => {
        flexy.querySelector("#rows").innerHTML = [[0, "zero"], [5, "five"], [9, "nine"]].map(([s, t]) =>
          '<ytd-transcript-segment-renderer><div class="segment-timestamp">0:0' + s + '</div><div class="segment-text">' + t + '</div></ytd-transcript-segment-renderer>').join("");
      });
    }, 3600);
    r = await pbpYtDomTranscriptInPage(VID, { hydrateMs: 6000 });
    assertEq(r.kind, "dom", "page fn: a watch page that hydrates AFTER the old 3.2s button poll is still scraped");
    assertEq(r.segs.map((s) => s.from + ":" + s.content).join(","), "0:zero,5:five,9:nine", "page fn: rows read after late hydration -- timestamps parsed, accepted on duration coverage");
    assert(window.fetch.__pbpTap === undefined && window.__pbpTapLease === undefined, "page fn: taps and the tab lease are released after the scrape");
  } finally { reset(); stage.remove(); location.hash = savedHash; }
})();

section("pbpYtWatchUrl + player-json lift");
assert(pbpYtWatchUrl("abc123", "zh-CN").startsWith("https://www.youtube.com/watch?v=abc123"), "watch url shape");
check("hl carried", pbpYtWatchUrl("abc123", "zh-CN").includes("hl=zh-CN"));
const HTML_OK = 'x<script>var ytInitialPlayerResponse = {"captions":{"playerCaptionsTracklistRenderer":{"captionTracks":[{"baseUrl":"https://www.youtube.com/api/timedtext?a=1","languageCode":"en","name":{"simpleText":"English"}}]}}};<\/script>y';

section("timedtext parsers");
const XML = '<?xml version="1.0"?><transcript><text start="1.2" dur="2.3">Hello &amp;amp; welcome</text><text start="4.0" dur="1.0">第二句</text></transcript>';
const sx = pbpYtParseTimedtextXml(XML);

const J3 = JSON.stringify({ events: [ { tStartMs: 0, dDurationMs: 1500, segs: [{ utf8: "one " }, { utf8: "two" }] }, { tStartMs: 2000, segs: [{ utf8: "\n" }] }, { tStartMs: 3000, dDurationMs: 800, segs: [{ utf8: "three" }] } ] });
const sj = pbpYtParseJson3(J3);
check("json3: newline-only event dropped", sj.length === 2 && sj[0].content === "one two" && sj[1].content === "three");
check("json3: ms converted to seconds", sj[0].from === 0 && sj[0].to === 1.5 && sj[1].from === 3);

section("merge + markdown + time");
const SEGS = [ { from: 0, to: 2, content: "Sentence one." }, { from: 2.1, to: 4, content: "and continues" }, { from: 10, to: 12, content: "After a gap" } ];
const paras = pbpVideoMergeParagraphs(SEGS);
// The 6s silence between "and continues" (ends 4s) and "After a gap" (starts
// 10s) is a paragraph boundary now -- the punctuation-only rule rendered
// bilibili's unpunctuated ASR tracks as one wall of text.
check("merge: sentence end breaks; a 6s silent gap breaks too", paras.length === 3 && paras[0] === "Sentence one." && paras[1] === "and continues" && paras[2] === "After a gap");
const CJK = []; for (let i = 0; i < 30; i++) CJK.push({ from: i, to: i + 0.9, content: "十个字十个字十个字十" });
const cjkParas = pbpVideoMergeParagraphs(CJK);
check("merge: unpunctuated gapless run breaks on the length ceiling", cjkParas.length > 1 && cjkParas.every(p => p.replace(/ /g, "").length <= 220));
check("merge: nothing lost across ceiling breaks", cjkParas.join("").replace(/ /g, "").length === 300);
const md = pbpVideoTranscriptMarkdown(SEGS, { title: "T", url: "https://youtu.be/x", trackLabel: "English" });
check("markdown: heading + source line + paragraphs", md.startsWith("## ") && md.includes("https://youtu.be/x") && md.includes("English") && md.includes("Sentence one."));
assertEq(pbpVideoFmtTime(65), "1:05", "m:ss");
assertEq(pbpVideoFmtTime(3671), "1:01:11", "h:mm:ss");

section("pbpVideoRowIndexAt (current-row search)");
// SEGS starts at 0/2.1/10; ROWS below adds a non-zero first segment so
// "before the first row" is a real state rather than an impossible one.
const ROWS = [ { from: 5, to: 7, content: "a" }, { from: 7, to: 9, content: "b" }, { from: 20, to: 22, content: "c" } ];
assertEq(pbpVideoRowIndexAt(ROWS, 1), -1, "t before the first segment -> -1");
assertEq(pbpVideoRowIndexAt(ROWS, 7), 1, "exact boundary belongs to the segment it starts");
assertEq(pbpVideoRowIndexAt(ROWS, 8.4), 1, "mid-segment t");
assertEq(pbpVideoRowIndexAt(ROWS, 9999), 2, "past the end holds the last segment");
assertEq(pbpVideoRowIndexAt([], 5), -1, "empty transcript -> -1");
assertEq(pbpVideoRowIndexAt([{ from: 0, to: 3, content: "only" }], 2), 0, "single segment");
assertEq(pbpVideoRowIndexAt([{ to: 3, content: "x" }], 5), -1, "segment without from never reads as 0");

section("pbpBiliFetchTranscript orchestration");
await (async () => {
  const nav = navJson, view = viewJson;
  const fetchFn = async (url) => {
    if (url.includes("/x/web-interface/nav")) return { ok: true, json: async () => nav };
    if (url.includes("/x/web-interface/view")) return { ok: true, json: async () => view };
    if (url.includes("/x/player/wbi/v2")) return { ok: true, json: async () => ({ data: { subtitle: { subtitles: subs } } }) };
    if (url.includes("human.json")) return { ok: true, json: async () => subJson };
    return { ok: true, json: async () => ({}) };
  };
  const res = await pbpBiliFetchTranscript("BV1x", 1, { fetchFn });
  check("segments delivered", res.segments && res.segments.length === 2);
  check("picked human zh track", res.track && res.track.lan === "zh-CN");
  check("tracks + meta delivered", res.tracks.length === 3 && res.meta && res.meta.title === "T");
  check("K139: the no-code player fixture is unaffected by the risk-control guard", res.error === undefined);
  const loggedOut = await pbpBiliFetchTranscript("BV1x", 1, { fetchFn: async (url) => {
    if (url.includes("/x/web-interface/nav")) return { ok: true, json: async () => nav };
    if (url.includes("/x/web-interface/view")) return { ok: true, json: async () => view };
    // Anonymous shape probed live 2026-08-25 (player/wbi/v2 with credentials omitted).
    if (url.includes("/x/player/wbi/v2")) return { ok: true, json: async () => ({ code: 0, data: { login_mid: 0, login_mid_hash: "", need_login_subtitle: true, subtitle: { allow_submit: false, lan: "", lan_doc: "", subtitles: [] } } }) };
    return { ok: true, json: async () => ({}) };
  } });
  check("empty subtitle list + anonymous response -> error:'login'", loggedOut.error === "login");
  const noSubs = await pbpBiliFetchTranscript("BV1x", 1, { fetchFn: async (url) => {
    if (url.includes("/x/web-interface/nav")) return { ok: true, json: async () => nav };
    if (url.includes("/x/web-interface/view")) return { ok: true, json: async () => view };
    // Signed-in shape probed live 2026-08-25 on a video with no subtitles.
    if (url.includes("/x/player/wbi/v2")) return { ok: true, json: async () => ({ code: 0, data: { login_mid: 170896, login_mid_hash: "abc", need_login_subtitle: false, subtitle: { allow_submit: true, lan: "", lan_doc: "", subtitles: [] } } }) };
    return { ok: true, json: async () => ({}) };
  } });
  check("empty subtitle list while signed in -> error:'no-tracks' (device 2026-08-25: the sign-in copy was shown to a signed-in reader)", noSubs.error === "no-tracks");
  const apiDown = await pbpBiliFetchTranscript("BV1x", 1, { fetchFn: async (url) => {
    if (url.includes("/x/web-interface/nav")) return { ok: true, json: async () => nav };
    if (url.includes("/x/web-interface/view")) return { ok: true, json: async () => view };
    if (url.includes("/x/player/wbi/v2")) return { ok: false, status: 502 };
    return { ok: true, json: async () => ({}) };
  } });
  check("player API failure -> error:'player', never 'no subtitles' (Codex retro 2)", apiDown.error === "player");
  // K139: bilibili's risk-control / permission refusals come back as HTTP 200
  // with a non-zero business `code` and `data: null` (the documented error
  // envelope), not as an HTTP failure -- fixtures are the full envelope shape
  // (code/message/ttl/data), hand-written, not derived from a write-side
  // constructor.
  const riskControl = await pbpBiliFetchTranscript("BV1x", 1, { fetchFn: async (url) => {
    if (url.includes("/x/web-interface/nav")) return { ok: true, json: async () => nav };
    if (url.includes("/x/web-interface/view")) return { ok: true, json: async () => view };
    if (url.includes("/x/player/wbi/v2")) return { ok: true, json: async () => ({ code: -352, message: "风控校验失败", ttl: 1, data: null }) };
    return { ok: true, json: async () => ({}) };
  } });
  check("K139: risk-control refusal (code -352, data:null) -> error:'player', not 'no subtitles'", riskControl.error === "player");
  const permissionDenied = await pbpBiliFetchTranscript("BV1x", 1, { fetchFn: async (url) => {
    if (url.includes("/x/web-interface/nav")) return { ok: true, json: async () => nav };
    if (url.includes("/x/web-interface/view")) return { ok: true, json: async () => view };
    if (url.includes("/x/player/wbi/v2")) return { ok: true, json: async () => ({ code: -403, message: "访问权限不足", ttl: 1, data: null }) };
    return { ok: true, json: async () => ({}) };
  } });
  check("K139: permission-denied refusal (code -403, data:null) -> error:'player', not 'no subtitles'", permissionDenied.error === "player");
  const trulyNoSubs = await pbpBiliFetchTranscript("BV1x", 1, { fetchFn: async (url) => {
    if (url.includes("/x/web-interface/nav")) return { ok: true, json: async () => nav };
    if (url.includes("/x/web-interface/view")) return { ok: true, json: async () => view };
    // code:0 with data present and subtitles genuinely empty -- a real "no
    // subtitles" case, must not be caught by the code!==0 guard.
    if (url.includes("/x/player/wbi/v2")) return { ok: true, json: async () => ({ code: 0, data: { login_mid: 170896, login_mid_hash: "abc", need_login_subtitle: false, subtitle: { allow_submit: true, lan: "", lan_doc: "", subtitles: [] } } }) };
    return { ok: true, json: async () => ({}) };
  } });
  check("K139: code:0 + data present + subtitles empty stays 'no-tracks' (guard does not misfire)", trulyNoSubs.error === "no-tracks");
  const refusalWithData = await pbpBiliFetchTranscript("BV1x", 1, { fetchFn: async (url) => {
    if (url.includes("/x/web-interface/nav")) return { ok: true, json: async () => nav };
    if (url.includes("/x/web-interface/view")) return { ok: true, json: async () => view };
    // Non-zero code but data IS present (anonymous shape, empty subtitles):
    // pins the "!player.data" condition -- this must fall through to the
    // existing login/no-tracks judgement, not be swallowed as "player".
    if (url.includes("/x/player/wbi/v2")) return { ok: true, json: async () => ({ code: -352, message: "风控校验失败", ttl: 1, data: { login_mid: 0, login_mid_hash: "", need_login_subtitle: true, subtitle: { allow_submit: false, lan: "", lan_doc: "", subtitles: [] } } }) };
    return { ok: true, json: async () => ({}) };
  } });
  check("K139: non-zero code but data present falls through to existing judgement, not 'player'", refusalWithData.error !== "player" && refusalWithData.error === "login");
})();

  const ytSegments = [{ from: 0, to: 1.5, content: "hello" }, { from: 1.5, to: 3, content: "world" }];
  const ytMeta = { title: "Rick Astley", url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ", trackLabel: "English" };
  const yt = pbpVideoStateBuild({
    detected: ytDetected, track: ytTrack, tracks: ytTracks, segments: ytSegments,
    aiParas: null, wasUnpunct: true, aiPunct: false, meta: ytMeta
  });
  assertEq(yt.v, 1, "youtube: v === 1");
  assertEq(yt.provider, "youtube", "youtube: provider carried");
  assertEq(yt.videoId, "dQw4w9WgXcQ", "youtube: videoId carried");
  assertEq(yt.bvid, undefined, "youtube: no bvid key");
  assertEq(yt.part, undefined, "youtube: no part key");
  assertEq(yt.selectedTrackKey, pbpVideoTrackKey(ytTrack, "youtube"), "youtube: selectedTrackKey via pbpVideoTrackKey");
  assertEq(yt.tracks.length, 2, "youtube: all tracks described");
  check("youtube: track descriptor has key/lang/label/asr and drops the URL",
    yt.tracks[0].key === "yt:en" && yt.tracks[0].lang === "en" && yt.tracks[0].label === "English"
      && yt.tracks[0].asr === false && !("baseUrl" in yt.tracks[0]));
  check("youtube: asr track descriptor flagged",
    yt.tracks[1].asr === true && yt.tracks[1].key === "yt:en:asr");
  check("youtube: segments copied as {from,to,content}",
    yt.segments.length === 2 && yt.segments[0].from === 0 && yt.segments[0].to === 1.5 && yt.segments[1].content === "world");
  assertEq(yt.paragraphs, null, "youtube: paragraphs null when aiParas not given");
  assertEq(yt.wasUnpunct, true, "youtube: wasUnpunct carried");
  assertEq(yt.aiPunct, false, "youtube: aiPunct carried");
  check("youtube: meta carried verbatim",
    yt.meta.title === "Rick Astley" && yt.meta.url === ytMeta.url && yt.meta.trackLabel === "English");

  const biliDetected = { provider: "bilibili", bvid: "BV1xx411c7mD", part: 2 };
  const biliTrackHuman = { subtitle_url: "//x/human.json", lan: "zh-CN", lan_doc: "中文" };
  const biliTrackAi = { subtitle_url: "//x/ai.json", lan: "ai-zh", lan_doc: "中文(AI)" };
  const bili = pbpVideoStateBuild({
    detected: biliDetected, track: biliTrackHuman, tracks: [biliTrackHuman, biliTrackAi],
    segments: [{ from: 0, to: 2, content: "你好" }], aiParas: ["段落一", "段落二"], wasUnpunct: true, aiPunct: true,
    meta: { title: "B站视频", url: "https://www.bilibili.com/video/BV1xx411c7mD?p=2", trackLabel: "中文" }
  });
  assertEq(bili.provider, "bilibili", "bilibili: provider carried");
  assertEq(bili.bvid, "BV1xx411c7mD", "bilibili: bvid carried");
  assertEq(bili.part, 2, "bilibili: part carried");
  assertEq(bili.videoId, undefined, "bilibili: no videoId key");
  check("bilibili: human track descriptor asr === false",
    bili.tracks[0].asr === false && bili.tracks[0].key === "bili:zh-CN" && bili.tracks[0].lang === "zh-CN" && bili.tracks[0].label === "中文");
  check("bilibili: ai-zh track descriptor asr === true", bili.tracks[1].asr === true && bili.tracks[1].key === "bili:ai-zh");
  check("bilibili: paragraphs carried when aiParas non-empty", Array.isArray(bili.paragraphs) && bili.paragraphs.join("|") === "段落一|段落二");

  const emptyParas = pbpVideoStateBuild({ detected: ytDetected, track: ytTrack, tracks: [], segments: [], aiParas: [], meta: {} });
  assertEq(emptyParas.paragraphs, null, "empty aiParas array normalizes to null, not []");

  assertEq(pbpVideoStateBuild({ track: ytTrack, segments: ytSegments }), null, "missing detected -> null (nothing to key state by)");
})();

section("pbpVideoStateValidate");
(() => {
  const detected = { provider: "youtube", videoId: "dQw4w9WgXcQ" };
  const track = { baseUrl: "https://x/en.xml", lang: "en", label: "English", asr: false };
  const segments = [{ from: 0, to: 1.5, content: "hello" }, { from: 1.5, to: 3, content: "world." }];
  const meta = { title: "T", url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ", trackLabel: "English" };
  const state = pbpVideoStateBuild({ detected, track, tracks: [track], segments, aiParas: null, wasUnpunct: true, aiPunct: false, meta });
  const canonical = pbpVideoTranscriptMarkdown(segments, meta, null);
  assertEq(pbpVideoStateValidate(state, detected, canonical), true, "valid round trip -> true");

  const wrongVideo = { provider: "youtube", videoId: "otherVideoId12" };
  assertEq(pbpVideoStateValidate(state, wrongVideo, canonical), false, "videoId mismatch -> false (fail closed)");

  const biliDetected = { provider: "bilibili", bvid: "BV1xx411c7mD", part: 1 };
  const biliState = pbpVideoStateBuild({ detected: biliDetected, track: { lan: "zh-CN", lan_doc: "中文" }, tracks: [], segments, meta });
  const biliCanonical = pbpVideoTranscriptMarkdown(segments, biliState.meta, null);
  assertEq(pbpVideoStateValidate(biliState, biliDetected, biliCanonical), true, "bilibili valid round trip -> true");
  const otherPart = { provider: "bilibili", bvid: "BV1xx411c7mD", part: 2 };
  assertEq(pbpVideoStateValidate(biliState, otherPart, biliCanonical), false, "bilibili part mismatch -> false (fail closed)");

  assertEq(pbpVideoStateValidate(state, detected, canonical + " extra"), false, "canonical markdown mismatch -> false (fail closed)");

  const badTypeState = JSON.parse(JSON.stringify(state));
  badTypeState.segments[0].content = 123;
  assertEq(pbpVideoStateValidate(badTypeState, detected, canonical), false, "non-string segment content -> false");

  const badFromState = JSON.parse(JSON.stringify(state));
  badFromState.segments[0].from = "0";
  assertEq(pbpVideoStateValidate(badFromState, detected, canonical), false, "non-number segment.from -> false");

  const tooManySegs = { ...state, segments: new Array(20001).fill(0).map((_, i) => ({ from: i, to: i + 1, content: "x" })) };
  assertEq(pbpVideoStateValidate(tooManySegs, detected, canonical), false, "segments.length > 20000 -> false (bound, checked before markdown rebuild)");

  const bigContent = "x".repeat(710000);
  const overCharLimit = { ...state, segments: [{ from: 0, to: 1, content: bigContent }, { from: 1, to: 2, content: bigContent }, { from: 2, to: 3, content: bigContent }] };
  assertEq(pbpVideoStateValidate(overCharLimit, detected, canonical), false, "total segment chars > 2MB -> false");

  const badVersion = { ...state, v: 2 };
  assertEq(pbpVideoStateValidate(badVersion, detected, canonical), false, "v !== 1 -> false");

  assertEq(pbpVideoStateValidate(null, detected, canonical), false, "null state -> false");
  assertEq(pbpVideoStateValidate(state, detected, undefined), false, "non-string canonicalMarkdown -> false");

  const badParas = { ...state, paragraphs: "not an array" };
  assertEq(pbpVideoStateValidate(badParas, detected, canonical), false, "non-array, non-null paragraphs -> false");

  const paraSegments = [{ from: 0, to: 1, content: "第一句。" }, { from: 1, to: 2, content: "第二句。" }];
  const paras = ["第一句。", "第二句。"];
  const paraState = pbpVideoStateBuild({ detected, track, tracks: [track], segments: paraSegments, aiParas: paras, wasUnpunct: true, aiPunct: true, meta });
  const paraCanonical = pbpVideoTranscriptMarkdown(paraSegments, meta, paras);
  assertEq(pbpVideoStateValidate(paraState, detected, paraCanonical), true, "AI-punctuated paragraphs preserved through round trip -> true");

  // F1 fix-round: tracks/selectedTrackKey are display-only data that never
  // flows through the markdown-equality check, so they need their own shape
  // guard -- exercise it directly (corrupted/malformed shapes reject; the
  // real "" + non-empty-tracks combination from the DOM-rescue tier accepts).
  const tracksNotArray = { ...state, tracks: "not-an-array" };
  assertEq(pbpVideoStateValidate(tracksNotArray, detected, canonical), false, "state.tracks not an array -> false");

  const tracksWithJunk = { ...state, tracks: [null, 42, { weird: 1 }] };
  assertEq(pbpVideoStateValidate(tracksWithJunk, detected, canonical), false, "state.tracks with null/primitive/malformed entries -> false");

  const trackEntryMissingKey = { ...state, tracks: [{ lang: "en", label: "English", asr: false }] };
  assertEq(pbpVideoStateValidate(trackEntryMissingKey, detected, canonical), false, "track descriptor missing string key -> false");

  const trackEntryBadAsr = { ...state, tracks: [{ key: "yt:en", lang: "en", label: "English", asr: "no" }] };
  assertEq(pbpVideoStateValidate(trackEntryBadAsr, detected, canonical), false, "track descriptor with non-boolean asr -> false");

  const selectedKeyNotString = { ...state, selectedTrackKey: 12345 };
  assertEq(pbpVideoStateValidate(selectedKeyNotString, detected, canonical), false, "selectedTrackKey not a string -> false");

  const selectedKeyObject = { ...state, selectedTrackKey: {} };
  assertEq(pbpVideoStateValidate(selectedKeyObject, detected, canonical), false, "selectedTrackKey as an object -> false");

  // Real, valid combination: DOM-scrape rescue reports a non-empty track
  // list with no known selection (build with track: null), so
  // selectedTrackKey is legitimately "" even though tracks is non-empty --
  // must NOT be rejected.
  const rescueState = pbpVideoStateBuild({ detected, track: null, tracks: [track], segments, aiParas: null, meta });
  const rescueCanonical = pbpVideoTranscriptMarkdown(segments, rescueState.meta, null);
  assertEq(rescueState.selectedTrackKey, "", "sanity: track:null builds selectedTrackKey \"\"");
  assertEq(pbpVideoStateValidate(rescueState, detected, rescueCanonical), true,
    "selectedTrackKey \"\" with non-empty tracks accepts (DOM-rescue tier has no known selection)");

  const emptyTracksState = pbpVideoStateBuild({ detected, track: null, tracks: [], segments, aiParas: null, meta });
  const emptyTracksCanonical = pbpVideoTranscriptMarkdown(segments, emptyTracksState.meta, null);
  assertEq(pbpVideoStateValidate(emptyTracksState, detected, emptyTracksCanonical), true,
    "selectedTrackKey \"\" with empty tracks also accepts");

  // F2 fix-round: positive boundary tests at the two inclusive limits.
  // T7 fix-round: a paragraph-tier state must now also conserve the segments'
  // non-punctuation character stream (review F1), so these fixtures carry the
  // rows' own text instead of a synthetic stand-in paragraph.
  const seg20000 = new Array(20000).fill(0).map((_, i) => ({ from: i, to: i + 0.5, content: "s" }));
  const paras20000 = ["s".repeat(20000)];
  const state20000 = pbpVideoStateBuild({ detected, track, tracks: [track], segments: seg20000, aiParas: paras20000, meta });
  const canonical20000 = pbpVideoTranscriptMarkdown(seg20000, state20000.meta, paras20000);
  assertEq(state20000.segments.length, 20000, "sanity: exactly 20000 segments built");
  assertEq(pbpVideoStateValidate(state20000, detected, canonical20000), true, "exactly 20000 segments -> true (inclusive upper boundary)");

  const oneMiB = 1024 * 1024;
  const segExactly2MiB = [{ from: 0, to: 1, content: "a".repeat(oneMiB) }, { from: 1, to: 2, content: "b".repeat(oneMiB) }];
  const parasExactly2MiB = ["a".repeat(oneMiB), "b".repeat(oneMiB)];
  const stateExactly2MiB = pbpVideoStateBuild({ detected, track, tracks: [track], segments: segExactly2MiB, aiParas: parasExactly2MiB, meta });
  const canonicalExactly2MiB = pbpVideoTranscriptMarkdown(segExactly2MiB, stateExactly2MiB.meta, parasExactly2MiB);
  const totalChars2MiB = stateExactly2MiB.segments.reduce((n, s) => n + s.content.length, 0);
  assertEq(totalChars2MiB, 2 * 1024 * 1024, "sanity: exactly 2*1024*1024 total segment chars built");
  assertEq(pbpVideoStateValidate(stateExactly2MiB, detected, canonicalExactly2MiB), true,
    "exactly 2*1024*1024 total segment chars -> true (inclusive upper boundary)");
})();

// md-video.js has three commit call sites (track switch, AI punctuation,
// first-run promotion) and each one hands the committer BOTH a markdown
// string and a videoState. Those two arguments are built from the same
// runtime state by two different functions, and nothing at the call site
// checks that they agree -- the check happens on the far side, at F5, inside
// pbpVideoStateValidate. So the contract worth testing here is the round
// trip: for the exact argument shape each call site passes, does the state
// validate against the markdown that same call passed? Every positive below
// is paired with the negative it would otherwise pass vacuously.
section("commit call-site videoState round trips");
(() => {
  const detected = { provider: "youtube", videoId: "dQw4w9WgXcQ" };
  const pageUrl = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
  const trEn = { baseUrl: "https://x/en.xml", lang: "en", label: "English", asr: false };
  const trDe = { baseUrl: "https://x/de.xml", lang: "de", label: "Deutsch", asr: false };
  const tracks = [trEn, trDe];
  const metaFor = (trackLabel) => ({ title: "Video", url: pageUrl, trackLabel });

  // ---- 1. track switch: aiParas null, aiPunct false, key = the NEW track ----
  const enSegs = [{ from: 0, to: 2, content: "Good day." }, { from: 2, to: 4, content: "How are you?" }];
  const deSegs = [{ from: 0, to: 2, content: "Guten Tag." }, { from: 2, to: 4, content: "Wie geht es?" }];
  const deMeta = metaFor("Deutsch");
  const switchState = pbpVideoStateBuild({
    detected, track: trDe, tracks, segments: deSegs,
    aiParas: null, wasUnpunct: false, aiPunct: false, meta: deMeta
  });
  const switchMd = pbpVideoTranscriptMarkdown(deSegs, deMeta, null);
  assertEq(pbpVideoStateValidate(switchState, detected, switchMd), true,
    "track-switch shape: state validates against the markdown the same call commits");
  assertEq(switchState.selectedTrackKey, "yt:de", "track-switch shape: selectedTrackKey names the NEWLY selected track");
  assertEq(switchState.aiPunct, false, "track-switch shape: aiPunct false (a switch always carries the heuristic tier)");
  assertEq(switchState.paragraphs, null, "track-switch shape: paragraphs cleared (a new track invalidates the AI pass)");
  // Falsification: the previous track's state committed alongside the new
  // track's article -- exactly what a missing last-selection-wins guard, or a
  // state built before the switch, would produce.
  const staleState = pbpVideoStateBuild({
    detected, track: trEn, tracks, segments: enSegs,
    aiParas: null, wasUnpunct: false, aiPunct: false, meta: metaFor("English")
  });
  assertEq(pbpVideoStateValidate(staleState, detected, switchMd), false,
    "track-switch shape: the PREVIOUS track's state fails against the new article (a stale commit is caught)");
  // ...and the two really are different markdowns, so the check above is not
  // passing for the trivial reason that everything fails.
  check("track-switch shape: the two tracks produce different markdown (previous assertion is not vacuous)",
    pbpVideoTranscriptMarkdown(enSegs, metaFor("English"), null) !== switchMd);

  // ---- 2. AI punctuation: paragraphs carried, aiPunct true ----
  const aiSegs = [{ from: 0, to: 2, content: "你好。" }, { from: 2, to: 4, content: "今天天气不错。" }];
  const aiParas = ["你好。今天天气不错。"];
  const aiMeta = metaFor("English");
  const aiState = pbpVideoStateBuild({
    detected, track: trEn, tracks, segments: aiSegs,
    aiParas, wasUnpunct: true, aiPunct: true, meta: aiMeta
  });
  const aiMd = pbpVideoTranscriptMarkdown(aiSegs, aiMeta, aiParas);
  assertEq(pbpVideoStateValidate(aiState, detected, aiMd), true,
    "ai-punctuation shape: state validates against the markdown the same call commits");
  check("ai-punctuation shape: aiPunct + wasUnpunct both true (the paid pass is recorded, and so is why it was offered)",
    aiState.aiPunct === true && aiState.wasUnpunct === true);
  check("ai-punctuation shape: the AI paragraphs actually change the markdown (round trip is not vacuous)",
    aiMd !== pbpVideoTranscriptMarkdown(aiSegs, aiMeta, null));
  // Falsification: the call site forgets to pass _aiPunctParas into the state
  // build while still committing the AI markdown. F5 would then rebuild the
  // heuristic merge and silently drop a pass the user paid for.
  const parasDropped = pbpVideoStateBuild({
    detected, track: trEn, tracks, segments: aiSegs,
    aiParas: null, wasUnpunct: true, aiPunct: true, meta: aiMeta
  });
  assertEq(pbpVideoStateValidate(parasDropped, detected, aiMd), false,
    "ai-punctuation shape: a state built WITHOUT the paragraphs fails against the committed markdown");

  // ---- 3. first-run promotion: aiPunct = !!_aiPunctParas ----
  const promoSegs = [{ from: 0, to: 3, content: "First line." }, { from: 3, to: 6, content: "Second line." }];
  const promoMeta = metaFor("English");
  const promoMd = pbpVideoTranscriptMarkdown(promoSegs, promoMeta, null);
  const promoState = pbpVideoStateBuild({
    detected, track: trEn, tracks, segments: promoSegs,
    aiParas: null, wasUnpunct: true, aiPunct: false, meta: promoMeta
  });
  assertEq(pbpVideoStateValidate(promoState, detected, promoMd), true,
    "promotion shape: state validates against the markdown the same call commits");
  assertEq(promoState.aiPunct, false, "promotion shape: aiPunct is !!_aiPunctParas -> false when no AI pass is carried");
  assertEq(promoState.wasUnpunct, true, "promotion shape: wasUnpunct survives so the AI upgrade stays on offer after the commit");
  // A promotion on a page whose session RESTORED AI paragraphs commits the
  // paragraph markdown and must say so -- this is the shape loadFlow's
  // no-longer-unconditional _aiPunctParas clear makes reachable.
  const promoParas = ["First line. Second line."];
  const promoAiMd = pbpVideoTranscriptMarkdown(promoSegs, promoMeta, promoParas);
  const promoAiState = pbpVideoStateBuild({
    detected, track: trEn, tracks, segments: promoSegs,
    aiParas: promoParas, wasUnpunct: true, aiPunct: true, meta: promoMeta
  });
  assertEq(pbpVideoStateValidate(promoAiState, detected, promoAiMd), true,
    "promotion shape carrying restored AI paragraphs round-trips (aiPunct = !!_aiPunctParas -> true)");
  check("promotion shape: restored paragraphs change the markdown (round trip is not vacuous)", promoAiMd !== promoMd);
  // Falsification of the OLD behaviour: loadFlow used to zero _aiPunctParas
  // unconditionally, so the promotion would commit the MERGED markdown while a
  // hydrated state still claimed paragraphs. Those two disagree and must fail.
  assertEq(pbpVideoStateValidate(promoAiState, detected, promoMd), false,
    "promotion shape: paragraphs in state but merged markdown committed -> false (the unconditional clear is caught)");

  // ---- 4. bilibili track switch: same contract, other provider/identity ----
  const biliDetected = { provider: "bilibili", bvid: "BV1xx411c7mD", part: 3 };
  const biliZh = { subtitle_url: "//x/zh.json", lan: "zh-CN", lan_doc: "中文" };
  const biliAi = { subtitle_url: "//x/ai.json", lan: "ai-zh", lan_doc: "中文(AI)" };
  const biliSegs = [{ from: 0, to: 2, content: "第一句。" }, { from: 2, to: 5, content: "第二句。" }];
  const biliMeta = { title: "B站视频", url: "https://www.bilibili.com/video/BV1xx411c7mD?p=3", trackLabel: "中文(AI)" };
  const biliState = pbpVideoStateBuild({
    detected: biliDetected, track: biliAi, tracks: [biliZh, biliAi], segments: biliSegs,
    aiParas: null, wasUnpunct: false, aiPunct: false, meta: biliMeta
  });
  const biliMd = pbpVideoTranscriptMarkdown(biliSegs, biliMeta, null);
  assertEq(pbpVideoStateValidate(biliState, biliDetected, biliMd), true,
    "bilibili track-switch shape: state validates against the markdown the same call commits");
  assertEq(biliState.selectedTrackKey, "bili:ai-zh", "bilibili track-switch shape: selectedTrackKey from lan");
  assertEq(pbpVideoStateValidate(biliState, { provider: "bilibili", bvid: "BV1xx411c7mD", part: 4 }, biliMd), false,
    "bilibili track-switch shape: a switch committed on part 3 does not validate on part 4");

  // ---- 5. the picker's key -> live endpoint mapping the change handler does ----
  const key = pbpVideoTrackKey(trDe, "youtube");
  const resolved = tracks.filter((tr) => pbpVideoTrackKey(tr, "youtube") === key);
  assertEq(resolved.length, 1, "picker key resolves to exactly one track in the session list");
  assertEq(resolved[0].baseUrl, "https://x/de.xml", "resolved track still carries the live endpoint (the key never replaces the fetch URL)");
  // The whole reason the option value stopped being the URL: endpoints get
  // re-signed between fetches, so a URL-valued option would stop matching.
  const refetched = [
    { baseUrl: "https://x/en.xml?pot=NEW", lang: "en", label: "English", asr: false },
    { baseUrl: "https://x/de.xml?pot=NEW", lang: "de", label: "Deutsch (Deutschland)", asr: false }
  ];
  assertEq(refetched.filter((tr) => pbpVideoTrackKey(tr, "youtube") === key).length, 1,
    "a re-signed, re-labelled track list still resolves the SAME key");
  assertEq(refetched.filter((tr) => tr.baseUrl === trDe.baseUrl).length, 0,
    "...while the old URL matches nothing in it (URL-valued options would have missed the track)");
  // Keyless tracks are the case the picker disables: they cannot be resolved
  // back, so offering them would be a silent no-op.
  assertEq(pbpVideoTrackKey({ baseUrl: "https://x/none.xml", label: "Unknown" }, "youtube"), "",
    "a track with no language yields no key (picker marks such options disabled)");

  // ---- 6. duplicate keys: the picker must still address every track ----
  // pbpVideoTrackKey is NOT injective over a real list -- "English" and
  // "English (CC)" are both manual en. The picker's value space has to break
  // the tie or the second option silently switches to the first.
  const dupTracks = [
    { baseUrl: "https://x/en1.xml", lang: "en", label: "English", asr: false },
    { baseUrl: "https://x/en2.xml", lang: "en", label: "English (CC)", asr: false },
    { baseUrl: "https://x/de.xml", lang: "de", label: "Deutsch", asr: false }
  ];
  const dupKeys = dupTracks.map((tr) => pbpVideoTrackKey(tr, "youtube"));
  assertEq(dupKeys[0], dupKeys[1], "sanity: two manual same-language tracks DO collide on the stable key");
  check("a bare-key picker would make the collided pair indistinguishable (this is the defect being fixed)",
    new Set(dupKeys).size === 2 && dupKeys.length === 3);
  // Mirror of buildTrackValues (md-video.js): first occurrence keeps the bare
  // key, later ones get "#N". Kept here as an executable statement of the
  // property the picker relies on, not as a copy of the implementation.
  const disambiguate = (tracks, provider) => {
    const seen = new Map();
    return tracks.map((tr) => {
      const k = pbpVideoTrackKey(tr, provider);
      if (!k) return "";
      const n = (seen.get(k) || 0) + 1;
      seen.set(k, n);
      return n === 1 ? k : k + "#" + n;
    });
  };
  const dupValues = disambiguate(dupTracks, "youtube");
  assertEq(new Set(dupValues).size, 3, "disambiguated picker values are unique per track");
  assertEq(dupValues[0], "yt:en", "the first occurrence keeps the bare key (no suffix on the common case)");
  assertEq(dupValues[1], "yt:en#2", "the second occurrence carries a positional suffix");
  assertEq(dupValues[2], "yt:de", "an uncollided track is untouched");
  assertEq(dupValues.indexOf("yt:en#2"), 1, "the suffixed value resolves back to the SECOND track by index");
  // audit B12: the persisted state now carries the SAME collision suffix the
  // picker uses, so an F5 can address the second duplicate too.
  const dupState = pbpVideoStateBuild({
    detected, track: dupTracks[1], tracks: dupTracks, segments: enSegs,
    aiParas: null, wasUnpunct: false, aiPunct: false, meta: metaFor("English (CC)")
  });
  assertEq(dupState.selectedTrackKey, "yt:en#2", "videoState.selectedTrackKey carries the picker's collision suffix (audit B12)");
  assertEq(dupState.tracks[1].key, "yt:en#2", "the persisted descriptor list carries the same suffix");
  assertEq(pbpVideoStateValidate(dupState, detected, pbpVideoTranscriptMarkdown(enSegs, metaFor("English (CC)"), null)), true,
    "a duplicate-key track's state still round-trips");
  // A list with no collisions must gain no suffixes at all -- otherwise every
  // stored key would drift away from every picker value.
  assertEq(disambiguate(tracks, "youtube").join(","), "yt:en,yt:de", "a collision-free list gains no suffixes");
})();

// The F5 half of the same contract: md-preview.js's committed bootstrap
// hydrates a persisted videoState back into window.pbpVideoSession, and the
// panel then redraws the timeline and the picker from it WITHOUT touching the
// network. Everything below is what that hydration depends on -- the gate
// accepting a state its own builder produced, the selected key finding its
// track again, a descriptor still being addressable as a track, and the gate
// refusing anything that drifted from the article.
section("F5 hydration: videoState -> session");
(() => {
  // Mirror of the ONE decision md-preview.js makes on hydration: map
  // selectedTrackKey back onto an entry of videoState.tracks. Kept here as an
  // executable statement of the property, not as a copy of that file.
  const resolveTrack = (state) => {
    const tracks = Array.isArray(state.tracks) ? state.tracks : [];
    return state.selectedTrackKey
      ? (tracks.find((tr) => tr && tr.key === state.selectedTrackKey) || null)
      : null;
  };

  const ytDet = { provider: "youtube", videoId: "dQw4w9WgXcQ" };
  const enTrack = { baseUrl: "https://x/en.xml?pot=OLD", lang: "en", label: "English", asr: false };
  const deTrack = { baseUrl: "https://x/de.xml?pot=OLD", lang: "de", label: "Deutsch", asr: false };
  const tracks = [enTrack, deTrack];
  const segs = [{ from: 0, to: 2, content: "Guten Tag." }, { from: 2, to: 4, content: "Danke." }];
  const meta = { title: "V", url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ", trackLabel: "Deutsch" };
  const state = pbpVideoStateBuild({
    detected: ytDet, track: deTrack, tracks, segments: segs,
    aiParas: null, wasUnpunct: false, aiPunct: false, meta
  });
  const canonical = pbpVideoTranscriptMarkdown(segs, meta, null);
  assertEq(pbpVideoStateValidate(state, ytDet, canonical), true, "hydration gate accepts the state its own builder produced");
  const hydTrack = resolveTrack(state);
  check("selectedTrackKey resolves back to the descriptor the reader was on",
    !!hydTrack && hydTrack.key === "yt:de" && hydTrack.label === "Deutsch");
  check("the restored descriptor carries NO endpoint (a signed URL could never survive the reload anyway)",
    !!hydTrack && !("baseUrl" in hydTrack) && !("subtitle_url" in hydTrack));
  assertEq(state.tracks.indexOf(hydTrack), 1,
    "the resolved descriptor IS the list element (the picker marks its selection by identity)");
  // The picker builds one option per session track and keys each by
  // pbpVideoTrackKey, so a descriptor has to key to itself or the whole
  // restored list becomes unaddressable.
  assertEq(pbpVideoTrackKey(hydTrack, "youtube"), "yt:de", "a descriptor keys to its own stored key");
  assertEq(pbpVideoTrackKey(state.tracks[0], "youtube"), "yt:en", "...for every entry of the restored list");
  // A later commit rebuilds the article's H2 from this label. If it differed
  // from the persisted one, the heading (and the TOC) would change under the
  // reader on the first Copy/commit after an F5.
  assertEq(pbpVideoTranscriptMeta({ track: hydTrack, meta: state.meta }, "", meta.url).trackLabel, state.meta.trackLabel,
    "meta rebuilt from the hydrated track reproduces the persisted trackLabel");

  // bilibili is the case that makes descriptor-awareness load-bearing rather
  // than cosmetic: a descriptor keeps `lan` under `lang` and `lan_doc` under
  // `label`, so a key recomputed from the provider-native fields is "".
  const biliDet = { provider: "bilibili", bvid: "BV1xx411c7mD", part: 3 };
  const biliTracks = [
    { subtitle_url: "//x/zh.json", lan: "zh-CN", lan_doc: "中文" },
    { subtitle_url: "//x/ai.json", lan: "ai-zh", lan_doc: "中文(AI)" }
  ];
  const biliSegs = [{ from: 0, to: 2, content: "你好。" }];
  const biliMeta = { title: "B", url: "https://www.bilibili.com/video/BV1xx411c7mD?p=3", trackLabel: "中文(AI)" };
  const biliState = pbpVideoStateBuild({
    detected: biliDet, track: biliTracks[1], tracks: biliTracks, segments: biliSegs,
    aiParas: null, wasUnpunct: false, aiPunct: false, meta: biliMeta
  });
  assertEq(pbpVideoStateValidate(biliState, biliDet, pbpVideoTranscriptMarkdown(biliSegs, biliMeta, null)), true,
    "bilibili state round trips through the gate");
  const biliHyd = resolveTrack(biliState);
  assertEq(biliHyd && biliHyd.key, "bili:ai-zh", "bilibili: selectedTrackKey resolves to the AI track descriptor");
  assertEq(pbpVideoTrackKey(biliHyd, "bilibili"), "bili:ai-zh",
    "bilibili descriptor keys to itself (recomputing from lan/lan_doc would yield \"\" and disable every option)");
  assertEq(pbpVideoTranscriptMeta({ track: biliHyd, meta: biliState.meta }, "", biliMeta.url).trackLabel, "中文(AI)",
    "bilibili: the hydrated track still yields the persisted trackLabel");
  // The asymmetry behind review F4: a LIVE bilibili track is the raw API
  // object and has no `asr` property at all, while its descriptor derives one.
  // Reading tr.asr for both is what made the same option read "中文(AI)" before
  // a reload and "中文(AI) (auto-generated)" after it, so the picker's suffix is
  // YouTube-only by construction (loadFlow). Pinned here so a future change to
  // the descriptor cannot quietly re-introduce the drift.
  assertEq("asr" in biliTracks[1], false, "bilibili: a live track object carries no asr property (raw API shape)");
  assertEq(biliHyd.asr, true, "bilibili: ...while its descriptor derives asr from _pbpBiliIsAi -- the two sides disagree by design");

  // A commit made ON a hydrated session rebuilds videoState from the session's
  // tracks -- which are descriptors. Describing them a second time has to be a
  // no-op, or every reload would degrade the stored list a little further.
  const rebuiltBili = pbpVideoStateBuild({
    detected: biliDet, track: biliHyd, tracks: biliState.tracks, segments: biliSegs,
    aiParas: null, wasUnpunct: false, aiPunct: false, meta: biliMeta
  });
  assertEq(JSON.stringify(rebuiltBili.tracks), JSON.stringify(biliState.tracks),
    "re-describing descriptors is idempotent (bilibili's list survives a commit made after an F5)");
  assertEq(rebuiltBili.selectedTrackKey, biliState.selectedTrackKey, "...and so does the selected key");
  const rebuiltYt = pbpVideoStateBuild({
    detected: ytDet, track: hydTrack, tracks: state.tracks, segments: segs,
    aiParas: null, wasUnpunct: false, aiPunct: false, meta
  });
  assertEq(JSON.stringify(rebuiltYt), JSON.stringify(state),
    "youtube: a whole state rebuilt from a hydrated session is identical to the one it was hydrated from");

  // "" is a real selection state, not corruption: the DOM-scrape rescue tier
  // reports a track list with no known selection, and the picker answers with
  // its neutral placeholder instead of claiming a track.
  const noSelMeta = { title: "V", url: meta.url, trackLabel: "" };
  const noSel = pbpVideoStateBuild({
    detected: ytDet, track: null, tracks, segments: segs,
    aiParas: null, wasUnpunct: false, aiPunct: false, meta: noSelMeta
  });
  assertEq(noSel.selectedTrackKey, "", "a rescue-tier state persists an empty selectedTrackKey");
  assertEq(pbpVideoStateValidate(noSel, ytDet, pbpVideoTranscriptMarkdown(segs, noSelMeta, null)), true,
    "...which the gate accepts (a track list with no selection is a legitimate state)");
  assertEq(resolveTrack(noSel), null, "...and which hydrates to track:null, NOT to the first track");

  // A key that no longer matches anything in the list hydrates to null too:
  // the placeholder is honest, silently selecting another language is not.
  const orphan = JSON.parse(JSON.stringify(state));
  orphan.selectedTrackKey = "yt:xx";
  assertEq(pbpVideoStateValidate(orphan, ytDet, canonical), true,
    "an unresolvable selectedTrackKey is still a well-formed state (only the shape is checked)");
  assertEq(resolveTrack(orphan), null, "...and it resolves to null rather than to an arbitrary track");

  // Duplicate keys (audit B12): persisted descriptors carry the picker's #N
  // suffix, so hydration addresses the exact track that was committed.
  const dup = [
    { baseUrl: "https://x/en1.xml", lang: "en", label: "English", asr: false },
    { baseUrl: "https://x/en2.xml", lang: "en", label: "English (CC)", asr: false }
  ];
  const dupState = pbpVideoStateBuild({
    detected: ytDet, track: dup[1], tracks: dup, segments: segs,
    aiParas: null, wasUnpunct: false, aiPunct: false, meta
  });
  assertEq(dupState.selectedTrackKey, "yt:en#2", "a duplicate-key selection persists WITH its collision suffix (audit B12)");
  const dupHyd = resolveTrack(dupState);
  assertEq(dupState.tracks.indexOf(dupHyd), 1, "hydration resolves the suffixed key to the SECOND track");
  assertEq(dupHyd.label, "English (CC)", "...so the picker lands on the 'English (CC)' that was committed");
  // Idempotency: a commit made ON a hydrated session re-persists descriptors
  // whose keys already carry their suffix -- no double-suffixing.
  const rebuilt = pbpVideoStateBuild({
    detected: ytDet, track: dupState.tracks[1], tracks: dupState.tracks, segments: segs,
    aiParas: null, wasUnpunct: false, aiPunct: false, meta
  });
  assertEq(rebuilt.tracks[1].key, "yt:en#2", "re-persisting hydrated descriptors keeps #2, not #2#2");
  assertEq(rebuilt.selectedTrackKey, "yt:en#2", "the selection key survives the round trip unchanged");

  // The paid pass: paragraphs must come back verbatim, and a state that lost
  // them must not hydrate -- an article visibly carrying AI punctuation whose
  // Copy/commit re-derives heuristic paragraphs is the exact silent downgrade
  // this field exists to prevent.
  const paras = ["Guten Tag. Danke."];
  const aiMd = pbpVideoTranscriptMarkdown(segs, meta, paras);
  const aiState = pbpVideoStateBuild({
    detected: ytDet, track: deTrack, tracks, segments: segs,
    aiParas: paras, wasUnpunct: true, aiPunct: true, meta
  });
  assertEq(pbpVideoStateValidate(aiState, ytDet, aiMd), true, "an AI-punctuated state round trips against the AI markdown");
  check("hydration carries the paid paragraphs, which really do differ from the heuristic merge",
    Array.isArray(aiState.paragraphs) && aiState.paragraphs.join("|") === paras.join("|")
      && aiState.paragraphs.join("|") !== pbpVideoMergeParagraphs(segs).join("|"));
  assertEq(aiState.aiPunct, true, "...and the aiPunct flag rides along (the AI button stays retired after the reload)");
  const stripped = JSON.parse(JSON.stringify(aiState));
  stripped.paragraphs = null;
  assertEq(pbpVideoStateValidate(stripped, ytDet, aiMd), false,
    "a state that lost its paragraphs fails the gate (F5 refetches instead of downgrading the article)");

  // Fail-closed, character by character.
  const tampered = JSON.parse(JSON.stringify(state));
  tampered.segments[0].content = tampered.segments[0].content.replace("Guten", "Guteo");
  assertEq(pbpVideoStateValidate(tampered, ytDet, canonical), false,
    "one flipped character in one segment fails the gate (the timeline may never disagree with the article)");
  const tamperedMeta = JSON.parse(JSON.stringify(state));
  tamperedMeta.meta.trackLabel = "English";
  assertEq(pbpVideoStateValidate(tamperedMeta, ytDet, canonical), false,
    "a rewritten trackLabel fails the gate (the rebuilt H2 would not be the article's H2)");
  assertEq(pbpVideoStateValidate(biliState, { provider: "bilibili", bvid: "BV1xx411c7mD", part: 4 },
    pbpVideoTranscriptMarkdown(biliSegs, biliMeta, null)), false,
    "part 3's state does not hydrate on part 4 (same bvid, different episode, different subtitles)");
})();

// Fix round 1 (review F1/F2/F3): the byte-equality gate is blind to `segments`
// on exactly the tier this format exists for -- pbpVideoTranscriptMarkdown
// ignores them whenever `paragraphs` is non-empty -- so the AI tier needs its
// own binding. Everything here is built through the REAL producer pipeline
// (merge -> punctuation-conserving rewrite -> pbpVideoApplyPunctText), because
// the only way to be sure the new gate rejects nothing legitimate is to feed it
// what the runtime actually writes.
section("F5 hydration: paragraph-tier segments are bound too (review F1)");
(() => {
  const detected = { provider: "youtube", videoId: "dQw4w9WgXcQ" };
  const track = { baseUrl: "https://x/fr.xml", lang: "fr", label: "Francais", asr: false };
  const meta = { title: "V", url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ", trackLabel: "Francais" };
  const rawRows = Array.from({ length: 12 }, (_, i) => ({
    from: i * 2, to: i * 2 + 2, content: "bonjour ceci est la piste francaise ligne " + i
  }));
  // What the AI pass does: merge rows into paragraphs, hand them to the model,
  // accept the answer only if it conserved every non-punctuation character,
  // then map the marks back onto the timed rows.
  const merged = pbpVideoMergeParagraphs(rawRows);
  const aiText = merged.join("\n").replace(/(ligne \d+)/g, "$1.");
  const applied = pbpVideoApplyPunctText(rawRows, aiText);
  const aiParas = aiText.split(/\n+/).map((x) => x.replace(/\s+/g, " ").trim()).filter(Boolean);
  assertEq(pbpVideoPunctConserved(merged.join("\n"), aiText), true,
    "fixture is the real shape: the simulated pass conserves every non-punctuation character");
  check("fixture is the real shape: the marks landed back on the timed rows",
    !!applied && applied.length === 12 && applied.every((s) => /\.$/.test(s.content)));
  const aiState = pbpVideoStateBuild({
    detected, track, tracks: [track], segments: applied, aiParas,
    wasUnpunct: true, aiPunct: true, meta
  });
  const aiCanonical = pbpVideoTranscriptMarkdown(applied, meta, aiParas);
  assertEq(pbpVideoStateValidate(aiState, detected, aiCanonical), true,
    "a genuine AI-tier payload still validates (the new binding rejects nothing the runtime writes)");

  // The reviewer's probe: with paragraphs present, the rebuild never reads the
  // rows, so before this fix ANY row text validated against the real article.
  const tamperedText = JSON.parse(JSON.stringify(aiState));
  tamperedText.segments.forEach((s) => { s.content = "ATTACKER CONTROLLED TEXT"; });
  assertEq(pbpVideoStateValidate(tamperedText, detected, aiCanonical), false,
    "every row rewritten, paragraphs untouched -> false (this validated true before the fix)");
  const oneChar = JSON.parse(JSON.stringify(aiState));
  oneChar.segments[3].content = oneChar.segments[3].content.replace("piste", "pisto");
  assertEq(pbpVideoStateValidate(oneChar, detected, aiCanonical), false,
    "ONE flipped character in one row -> false, on the paragraph tier too");
  const dropped = JSON.parse(JSON.stringify(aiState));
  dropped.segments.splice(5, 1);
  assertEq(pbpVideoStateValidate(dropped, detected, aiCanonical), false,
    "a dropped row (row count changed, text lost) -> false");
  const added = JSON.parse(JSON.stringify(aiState));
  added.segments.push({ from: 99, to: 100, content: "une ligne en plus." });
  assertEq(pbpVideoStateValidate(added, detected, aiCanonical), false,
    "an injected extra row -> false");

  // The bound is "no word can appear in the timeline that is not in the
  // article", NOT "row boundaries are pinned": once paragraphs shadow the
  // segments, the format has no way to express where one row ends. A
  // re-partition of the SAME text is therefore accepted, deliberately --
  // stated as an executable limitation rather than left to a comment.
  const repartitioned = JSON.parse(JSON.stringify(aiState));
  repartitioned.segments.splice(0, 2, {
    from: repartitioned.segments[0].from, to: repartitioned.segments[1].to,
    content: repartitioned.segments[0].content + " " + repartitioned.segments[1].content
  });
  assertEq(repartitioned.segments.length, 11, "sanity: the re-partition really changed the row count");
  assertEq(pbpVideoStateValidate(repartitioned, detected, aiCanonical), true,
    "two adjacent rows merged with their text preserved -> still true (documented limit of the conservation bound)");

  // Timings: out-of-order rows are rejected on BOTH tiers, because
  // pbpVideoRowIndexAt binary-searches them and follow-mode seeks on the result.
  const shuffled = JSON.parse(JSON.stringify(aiState));
  const row = shuffled.segments[8];
  row.from = 0.5; row.to = 1;
  assertEq(pbpVideoStateValidate(shuffled, detected, aiCanonical), false,
    "a row moved out of track order -> false (the binary search assumes sorted `from`)");
  const plainRows = [{ from: 0, to: 2, content: "Guten Tag." }, { from: 2, to: 4, content: "Danke." }];
  const plainMeta = { title: "V", url: meta.url, trackLabel: "Deutsch" };
  const plainState = pbpVideoStateBuild({
    detected, track: { lang: "de", label: "Deutsch", asr: false }, tracks: [track],
    segments: plainRows, aiParas: null, wasUnpunct: false, aiPunct: false, meta: plainMeta
  });
  const plainCanonical = pbpVideoTranscriptMarkdown(plainRows, plainMeta, null);
  assertEq(pbpVideoStateValidate(plainState, detected, plainCanonical), true, "control: the plain tier still validates");
  const plainShuffled = JSON.parse(JSON.stringify(plainState));
  plainShuffled.segments[1].from = -1;
  assertEq(pbpVideoStateValidate(plainShuffled, detected, plainCanonical), false,
    "...and out-of-order timings are rejected there too");
  const sameFrom = JSON.parse(JSON.stringify(plainState));
  sameFrom.segments[1].from = sameFrom.segments[0].from;
  assertEq(pbpVideoStateValidate(sameFrom, detected,
    pbpVideoTranscriptMarkdown(sameFrom.segments, plainMeta, null)), true,
    "equal `from` on two rows is NOT out of order (non-decreasing, not strictly increasing)");

  // meta: the equality check only sees the title when meta.url is non-empty
  // (pbpVideoTranscriptMarkdown emits the source blockquote only then), so the
  // validator has to bound the rest itself (review F3).
  const noMetaType = JSON.parse(JSON.stringify(plainState));
  noMetaType.meta = "not an object";
  assertEq(pbpVideoStateValidate(noMetaType, detected, plainCanonical), false, "a non-object meta -> false");
  const missingField = JSON.parse(JSON.stringify(plainState));
  delete missingField.meta.trackLabel;
  assertEq(pbpVideoStateValidate(missingField, detected, plainCanonical), false, "a meta missing trackLabel -> false");
  // The type bound is not redundant with the equality check: a non-string
  // title RENDERS identically (the markdown builder concatenates), so equality
  // sees nothing while the type check rejects.
  const numTitleMeta = { title: "5", url: meta.url, trackLabel: "Deutsch" };
  const numState = pbpVideoStateBuild({
    detected, track: { lang: "de", label: "Deutsch", asr: false }, tracks: [track],
    segments: plainRows, aiParas: null, wasUnpunct: false, aiPunct: false, meta: numTitleMeta
  });
  const numCanonical = pbpVideoTranscriptMarkdown(plainRows, numTitleMeta, null);
  assertEq(pbpVideoStateValidate(numState, detected, numCanonical), true, "control: a numeric-looking string title validates");
  const numTampered = JSON.parse(JSON.stringify(numState));
  numTampered.meta.title = 5;
  assertEq(pbpVideoStateValidate(numTampered, detected, numCanonical), false,
    "a non-string title that renders identically is still rejected (equality cannot see it; the type bound can)");

  const urllessMeta = { title: "", url: "", trackLabel: "Deutsch" };
  const urlless = pbpVideoStateBuild({
    detected, track: { lang: "de", label: "Deutsch", asr: false }, tracks: [track],
    segments: plainRows, aiParas: null, wasUnpunct: false, aiPunct: false, meta: urllessMeta
  });
  const urllessCanonical = pbpVideoTranscriptMarkdown(plainRows, urllessMeta, null);
  assertEq(pbpVideoStateValidate(urlless, detected, urllessCanonical), true,
    "a URL-less state with no title validates (the markdown simply carries no source line)");
  const smuggledTitle = JSON.parse(JSON.stringify(urlless));
  smuggledTitle.meta.title = "a title the article never carried";
  assertEq(pbpVideoStateValidate(smuggledTitle, detected, urllessCanonical), false,
    "...but a title the equality check cannot see is rejected (it would re-enter the article on the next commit)");

  // Descriptor exclusivity: the validator checks TYPES, so an injected endpoint
  // passes here on purpose -- md-preview.js's hydration rebuilds each
  // descriptor from the whitelist, which is where the endpoint dies (review F2).
  const injected = JSON.parse(JSON.stringify(plainState));
  injected.tracks[0].baseUrl = "https://attacker.example/steal?x=1";
  assertEq(pbpVideoStateValidate(injected, detected, plainCanonical), true,
    "an extra field on a descriptor still passes the type-shaped gate (this is why hydration rebuilds, not adopts)");
  // Mirror of that rebuild: whitelist = exactly _pbpVideoTrackDescribe's output.
  const rebuild = (tracks) => tracks.map((tr) => ({ key: tr.key, lang: tr.lang, label: tr.label, asr: tr.asr }));
  const rebuilt = rebuild(injected.tracks);
  check("the rebuilt descriptor drops every field outside the whitelist",
    !("baseUrl" in rebuilt[0]) && !("subtitle_url" in rebuilt[0]) && Object.keys(rebuilt[0]).length === 4);
  check("...while keeping the four fields the picker and the key resolver need",
    rebuilt[0].key === injected.tracks[0].key && rebuilt[0].lang === injected.tracks[0].lang
      && rebuilt[0].label === injected.tracks[0].label && rebuilt[0].asr === injected.tracks[0].asr
      && pbpVideoTrackKey(rebuilt[0], "youtube") === injected.tracks[0].key);
})();

section("extracted runtime primitives (audit E1/E4/E5)");
(() => {
  assertEq(pbpVideoTierOrder(null).join(","), "panel,capture,dom", "tier order: default panel-first");
  assertEq(pbpVideoTierOrder("capture").join(","), "capture,panel,dom", "tier order: capture memory runs first");
  assertEq(pbpVideoTierOrder("dom").join(","), "dom,capture,panel", "tier order: dom memory runs first");
  assertEq(pbpVideoTierOrder("bogus").join(","), "panel,capture,dom", "tier order: unknown memory falls back to default");
  const sb = pbpVideoSplitBatches(["a".repeat(1000), "b".repeat(700), "c".repeat(100)], 1600);
  assertEq(sb.length, 2, "split: cap closes a batch only after it is exceeded");
  assertEq(sb[0], "a".repeat(1000) + "\n" + "b".repeat(700), "split: the overshoot batch keeps both paragraphs");
  assertEq(pbpVideoSplitBatches([], 1600).length, 0, "split: empty input yields no batches");
  assert(pbpVideoPunctChanged(["x，y"], ["x y"]) === true, "changed: a new mark counts as change");
  assert(pbpVideoPunctChanged(["a  b\n\nc"], ["a b c"]) === false, "changed: whitespace-only reshuffle is NO change");
  assert(pbpVideoPunctChanged([], []) === false, "changed: an empty pass is no change");
  assertEq(pbpVideoStripFence("```md\nX\n```"), "X", "fence: one outer pair stripped");
  assertEq(pbpVideoStripFence("plain"), "plain", "fence: unfenced text untouched");
  // E5: the 48-char sentence-promotion boundary, hit exactly
  const mkrun = (lens) => {
    const segsX = []; let t0 = 0;
    for (const n of lens) { segsX.push({ from: t0, to: t0 + 2, content: "字".repeat(n) }); t0 += 2; }
    return pbpVideoHeuristicPunctuate(segsX);
  };
  assertEq(mkrun([47, 10])[0].content.slice(-1), "，", "48-boundary: a 47-char run stays a comma");
  assertEq(mkrun([48, 10])[0].content.slice(-1), "。", "48-boundary: a 48-char run promotes to a full stop");
  assertEq(mkrun([49, 10])[0].content.slice(-1), "。", "48-boundary: a 49-char run also promotes");
  // Closing review: title-escaping migration accepts (A7 x U14) -- a record
  // committed BEFORE the campaign carries a RAW title; validate must accept
  // it or old payloads orphan into a refetch.
  const tMeta = { title: "Deep [4K] | #2", url: "https://v", trackLabel: "" };
  const tDet = { provider: "youtube", videoId: "abcdefghijk" };
  const tSegs = [];
  for (let i = 0; i < 3; i++) tSegs.push({ from: i * 2, to: i * 2 + 2, content: "行内容第" + i + "句。" });
  const tState = pbpVideoStateBuild({ detected: tDet, track: null, tracks: [], segments: tSegs, aiParas: null, wasUnpunct: false, aiPunct: false, meta: tMeta });
  const legacyMd = pbpVideoTranscriptMarkdown(tSegs, tMeta, null, "Transcript", true);
  assert(pbpVideoStateValidate(tState, tDet, legacyMd) === true, "pre-campaign record with a RAW special-char title still hydrates (title-axis migration)");
  assert(pbpVideoStateValidate(tState, tDet, pbpVideoTranscriptMarkdown(tSegs, tMeta, null)) === true, "the current escaped shape validates too");
  // Word-drift repair (device round 6): the model's marks are kept, the
  // source's characters win.
  const r1 = pbpVideoPunctRepair("会冒热气气热气能把食物加热", "会冒热气，热气能把食物加热。");
  assert(r1 != null && pbpVideoPunctStrip(r1) === "会冒热气气热气能把食物加热" && /，/.test(r1) && /。/.test(r1),
    "repair: a dropped stutter char is reinserted, the marks stay");
  const r2 = pbpVideoPunctRepair("然后水会沸腾起来这就是原理", "然后水会废腾起来，这就是原理。");
  assert(r2 != null && r2.includes("沸") && !r2.includes("废"), "repair: a homophone substitution is undone to the source char");
  const r3 = pbpVideoPunctRepair("今天天气很好我们出门走走", "今天的天气很好，我们出门走走。");
  assert(r3 != null && pbpVideoPunctStrip(r3) === "今天天气很好我们出门走走", "repair: a model-invented character is dropped");
  assert(r1 != null && pbpVideoPunctConserved("会冒热气气热气能把食物加热", r1) === true, "repair: output passes the conservation gate by construction");
  const longSrc = "字".repeat(300);
  assert(pbpVideoPunctRepair(longSrc, longSrc.slice(0, 100) + "。") === null, "repair: truncation stays rejected (fail-closed intact)");
  // Pre-click cost accounting (research T4.2): cached batches are free.
  const estBatches = ["一二三四五", "六七八", "九十"];
  assert(pbpVideoAiEstChars(estBatches, () => false) === 10, "est: all-fresh pass sums every batch");
  assert(pbpVideoAiEstChars(estBatches, (b) => b === "一二三四五") === 5, "est: a cached batch drops out of the estimate");
  assert(pbpVideoAiEstChars([], () => false) === 0 && pbpVideoAiEstChars(estBatches, () => true) === 0,
    "est: empty input and fully-cached passes both cost zero");
