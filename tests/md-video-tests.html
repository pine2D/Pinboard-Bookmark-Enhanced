  // Unified time anchor (research T1.1): records carry the first segment's
  // start; the string projection stays byte-identical to the old merge.
  const anSegs = [
    { from: 0, to: 2, content: "第一句话" }, { from: 2, to: 4, content: "还没完。" },
    { from: 10, to: 12, content: "隔了很久的第二段" }, { from: 12, to: 14, content: "继续说。" },
  ];
  const recs = pbpVideoMergeParagraphRecords(anSegs);
  assert(recs.length === 2 && recs[0].from === 0 && recs[1].from === 10, "records: one start per paragraph, taken from its first segment");
  assert(JSON.stringify(pbpVideoMergeParagraphs(anSegs)) === JSON.stringify(recs.map((r) => r.text)), "records: the string merge is exactly the text projection");
  const aiParas = ["第一句话，还没完。", "隔了很久的第二段，继续说。"];
  assert(JSON.stringify(pbpVideoParaStarts(anSegs, aiParas)) === "[0,10]", "starts: an AI re-cut with new marks maps back onto segment starts");
  assert(JSON.stringify(pbpVideoParaStarts(anSegs, ["第一句话还", "没完隔了很久的第二段继续说"])) === "[0,2]", "starts: a paragraph cut inside segment 2 starts at segment 2 (not the paragraph boundary before it)");
  assert(pbpVideoParaStarts(anSegs, ["第一句话还没完。"]) === null, "starts: leftover characters fail closed (null)");
  assert(pbpVideoParaStarts(anSegs, aiParas.concat(["多出来的段落"])) === null, "starts: paragraphs past the stream fail closed (null)");
  // ---- paragraph/time alignment (para-times debt) ----------------------
  // DOM texts are HAND-WRITTEN as marked renders each record shape, never
  // derived from the records -- the whole point is that they do NOT
  // correspond 1:1.
  const alKey = (a) => a.map((x) => pbpVideoParaKey(x));
  const alRecs = [
    "welcome back to the channel today we are starting",
    "- and then he said okay that is fine with me",
    "3. the third one is the interesting one here",
    "and that is really all there is to say about it",
  ];
  // "- ..." became <li>, "3. ..." became <li>: two direct-child <p> for four records.
  const alDom = ["welcome back to the channel today we are starting",
    "and that is really all there is to say about it"];
  const al = pbpVideoAlignParas(alKey(alRecs), alKey(alDom));
  assert(al.matched === 2 && JSON.stringify(al.map) === "[0,3]",
    "align: records that rendered as list items are walked past; the ones after them still line up");
  // A record that split into TWO <p> (raw markup in the caption text): the
  // first <p> carries the record's opening words and is timed, the tail <p>
  // anchors on nothing and is skipped rather than stealing the next record.
  const alRecs2 = ["before the interruption happened here", "the following paragraph continues the story"];
  const alDom2 = ["before the interruption happened here", "inside the markup", "the following paragraph continues the story"];
  const al2 = pbpVideoAlignParas(alKey(alRecs2), alKey(alDom2));
  assert(al2.matched === 2 && JSON.stringify(al2.map) === "[0,-1,1]",
    "align: an unmatched <p> is skipped without consuming a record");
  const al3 = pbpVideoAlignParas(alKey(alRecs2), alKey(alRecs2));
  assert(al3.matched === 2 && JSON.stringify(al3.map) === "[0,1]", "align: an undamaged article still maps 1:1");
  assert(pbpVideoParaKey("\u2026\u2026") === "" && pbpVideoParaKey("\u597d\u7684\u3002") === "\u597d\u7684",
    "key: marks and whitespace drop out, letters and digits survive");
  assert(pbpVideoParaKey("- 3. > ## `x` |") === "3x", "key: block-markdown markers are not part of the key");
  const al4 = pbpVideoAlignParas(alKey(["\u2026\u2026", "the real paragraph text lives here"]),
    alKey(["\u2026\u2026", "the real paragraph text lives here"]));
  assert(al4.matched === 1 && JSON.stringify(al4.map) === "[-1,1]",
    "align: a key below the minimum anchors nothing on either side");
  const al5 = pbpVideoAlignParas(alKey(["thanks for watching everyone", "some other paragraph entirely", "thanks for watching everyone"]),
    alKey(["some other paragraph entirely", "thanks for watching everyone"]));
  assert(JSON.stringify(al5.map) === "[1,2]", "align: the record pointer only ever moves forward");
  // Duplicate prefixes (Codex r9 M4): an earlier copy that rendered as a
  // list item must not hand its time to the later copy's <p>; unique
  // neighbours settle which copy a duplicate is; equal counts pair in order.
  const al6 = pbpVideoAlignParas(alKey(["- thanks for watching everyone", "some other paragraph entirely", "thanks for watching everyone"]), alKey(["thanks for watching everyone"]));
  assert(JSON.stringify(al6.map) === "[-1]" && al6.matched === 0, "align: a key with more records than paragraphs and no anchor to settle it is left untimed");
  const al7 = pbpVideoAlignParas(alKey(["thanks for watching everyone", "some other paragraph entirely", "thanks for watching everyone", "and finally the closing words"]),
    alKey(["some other paragraph entirely", "thanks for watching everyone", "and finally the closing words"]));
  assert(JSON.stringify(al7.map) === "[1,2,3]", "align: unique neighbours settle which copy a duplicate is");
  const al8 = pbpVideoAlignParas(alKey(["thanks for watching everyone", "thanks for watching everyone"]), alKey(["thanks for watching everyone", "thanks for watching everyone"]));
  assert(JSON.stringify(al8.map) === "[0,1]", "align: equal counts of a duplicate pair in order");
  // Track identity (Codex r9 H3): two manual tracks of one language differ
  // only by vssId, and a re-ordered directory must still restore the one
  // remembered; a key remembered before vssId joined still resolves.
  const twoEn = [{ lang: "en", asr: false, vssId: ".en" }, { lang: "en", asr: false, vssId: ".en.abc" }];
  assert(pbpVideoTrackKey(twoEn[0], "youtube") !== pbpVideoTrackKey(twoEn[1], "youtube"), "yt key: distinct vssIds -> distinct keys");
  assert(pbpVideoResolvePreferKey(twoEn.slice().reverse(), "youtube", pbpVideoTrackKey(twoEn[1], "youtube")) === twoEn[1], "yt prefer: a re-ordered directory still resolves the remembered vssId track");
  assert(pbpVideoResolvePreferKey(twoEn, "youtube", "yt:en") === twoEn[0], "yt prefer: a legacy vssId-less key still resolves by stem");
  assert(pbpVideoTrackKey({ lang: "en", asr: false }, "youtube") === "yt:en", "yt key: no vssId -> the legacy shape");
  assert(pbpVideoAlignParas(null, null).matched === 0 && pbpVideoAlignParas([], ["abcdefgh"]).map[0] === -1,
    "align: empty inputs are harmless");
  assert(pbpVideoDeepLink("https://www.youtube.com/watch?v=abcdefghijk", 754.9) === "https://www.youtube.com/watch?v=abcdefghijk&t=754s", "deep link: youtube t=Ns");
  assert(pbpVideoDeepLink("https://www.bilibili.com/video/BV1YGKk6dE8b/?p=2", 61) === "https://www.bilibili.com/video/BV1YGKk6dE8b/?p=2&t=61", "deep link: bilibili keeps the part and adds t");
  assert(pbpVideoDeepLink("https://example.com/x", 5) === "", "deep link: non-video URL yields empty");
  // Side-channel exports (research T1.2)
  const srt = pbpVideoSrt([{ from: 0, to: 2.5, content: "第一句" }, { from: 2.5, to: 0, content: "  第二句  " }, { from: 4, to: 4.5, content: "" }, { from: 5, to: 0, content: "末句" }]);
  assert(srt === "1\n00:00:00,000 --> 00:00:02,500\n第一句\n\n2\n00:00:02,500 --> 00:00:04,000\n第二句\n\n3\n00:00:05,000 --> 00:00:08,000\n末句\n",
    "srt: numbered cues, comma millis, a missing end runs to the next cue's start (even a skipped empty one) or +3s at the tail");
  assert(pbpVideoSrtTime(3661.25) === "01:01:01,250", "srt time: hours roll over and millis keep three digits");
  const tmMeta = { title: "T", url: "https://www.youtube.com/watch?v=abcdefghijk", trackLabel: "中文" };
  const tmSegs = [{ from: 0, to: 2, content: "第一段第一句。" }, { from: 65, to: 67, content: "第二段。" }];
  const tm = pbpVideoTimedMarkdown(tmSegs, tmMeta, null);
  assert(tm.startsWith(pbpVideoTranscriptHeaderLines(tmMeta).join("\n")), "timed md: shares the canonical header verbatim");
  assert(/\[0:00\]\(https:\/\/www\.youtube\.com\/watch\?v=abcdefghijk&t=0s\) 第一段第一句。\n\n\[1:05\]\(https:\/\/www\.youtube\.com\/watch\?v=abcdefghijk&t=65s\) 第二段。$/.test(tm),
    "timed md: each paragraph leads with a linked [mm:ss]");
  const tmAi = pbpVideoTimedMarkdown(tmSegs, { title: "T", url: "https://example.com/p" }, ["第一段，第一句。", "第二段。"]);
  assert(/\[0:00\] 第一段，第一句。\n\n\[1:05\] 第二段。$/.test(tmAi), "timed md: AI paragraphs keep their marks; a non-video URL gets a bare tag");
  assert(pbpVideoTranscriptMarkdown(tmSegs, tmMeta, null) === pbpVideoTranscriptHeaderLines(tmMeta).concat([pbpVideoMergeParagraphs(tmSegs).join("\n\n")]).join("\n"),
    "canonical md: unchanged by the header extraction (byte-identical rebuild)");
  // Keyboard cue stepping (research T3.3)
  const csSegs = [{ from: 0, to: 2, content: "a" }, { from: 2, to: 4, content: "b" }, { from: 4, to: 6, content: "c" }];
  assert(pbpVideoCueStep(csSegs, 1, 0, 1) === 2 && pbpVideoCueStep(csSegs, 1, 0, -1) === 0, "cue step: moves from the current row");
  assert(pbpVideoCueStep(csSegs, -1, 3, 1) === 2 && pbpVideoCueStep(csSegs, -1, 3, -1) === 0, "cue step: no current row -> starts from the row at the given second");
  assert(pbpVideoCueStep(csSegs, 2, 0, 1) === 2 && pbpVideoCueStep(csSegs, 0, 0, -1) === 0 && pbpVideoCueStep([], 0, 0, 1) === -1, "cue step: clamped at both ends, -1 on an empty transcript");
  // Caption-language preference + remembered track (research T6.1/T6.2)
  assert(JSON.stringify(pbpVideoLangPrefs(" en-US, ja ;zh-Hans en")) === '["en-us","ja","zh-hans","en"]', "lang prefs: full tags lower-cased, ordered, de-duplicated on the exact tag (a script/region is kept, not dropped)");
  assert(JSON.stringify(pbpVideoLangPrefs("EN, en,, ;")) === '["en"]' && JSON.stringify(pbpVideoLangPrefs("")) === "[]", "lang prefs: case-folded duplicates collapse; empty input is auto");
  const ytTr = [{ lang: "zh-Hans", asr: false, vssId: ".zh-Hans" }, { lang: "en", asr: true, vssId: "a.en" }, { lang: "en", asr: false, vssId: ".en" }, { lang: "ja", asr: false, vssId: ".ja" }];
  assert(pbpYtPickTrack(ytTr, "zh-CN").lang === "zh-Hans", "yt pick: no preference -> UI language, human (unchanged default)");
  assert(pbpYtPickTrack(ytTr, "zh-CN", ["en"]) === ytTr[2], "yt pick: preferred language beats the UI language, human before ASR");
  assert(pbpYtPickTrack(ytTr, "zh-CN", ["fr", "ja"]) === ytTr[3], "yt pick: first preferred language present wins");
  assert(pbpYtPickTrack(ytTr, "zh-CN", ["en"], pbpVideoTrackKey(ytTr[3], "youtube")) === ytTr[3], "yt pick: a remembered key for this video wins outright");
  assert(pbpYtPickTrack(ytTr, "zh-CN", ["en"], "no-such-key") === ytTr[2], "yt pick: a stale remembered key is ignored (fail-open)");
  assert(pbpYtPickTrack(ytTr, "zh-CN", ["en", "ja"]) === ytTr[2] && pbpYtPickTrack([ytTr[1], ytTr[3]], "zh-CN", ["en", "ja"]) === ytTr[1],
    "yt pick: the first preferred language wins even when only its ASR track exists (retro #5)");
  const dupTr = [{ lang: "en", asr: false, vssId: ".en" }, { lang: "en", asr: false, vssId: ".en" }, { lang: "ja", asr: false, vssId: ".ja" }];
  const dupKey = pbpVideoTrackKey(dupTr[0], "youtube");
  assert(pbpVideoResolvePreferKey(dupTr, "youtube", dupKey + "#2") === dupTr[1] && pbpVideoResolvePreferKey(dupTr, "youtube", dupKey) === dupTr[0] && pbpVideoResolvePreferKey(dupTr, "youtube", dupKey + "#3") === null,
    "remembered key: a #N ordinal resolves to the N-th duplicate, a missing ordinal fails open (retro #6)");
  const biSubs = [{ lan: "ai-zh", lan_doc: "中文（自动）" }, { lan: "zh-CN", lan_doc: "中文" }, { lan: "ai-en", lan_doc: "English (auto)" }];
  assert(pbpBiliPickSubtitle(biSubs) === biSubs[1], "bili pick: default stays zh human");
  assert(pbpBiliPickSubtitle(biSubs, ["en"]) === biSubs[2], "bili pick: preferred language finds the ai- track when no human one exists");
  assert(pbpBiliPickSubtitle(biSubs, ["fr"]) === biSubs[1] && pbpBiliPickSubtitle(biSubs, ["en"], pbpVideoTrackKey(biSubs[0], "bilibili")) === biSubs[0], "bili pick: unmet preference falls back; remembered key wins");
  // Full-tag preference (settings batch C2) + bilibili interface-language tier (B1)
  const scTr = [{ lang: "zh-Hans", asr: false, vssId: ".zh-Hans" }, { lang: "zh-Hant", asr: true, vssId: "a.zh-Hant" }, { lang: "en", asr: false, vssId: ".en" }];
  assert(pbpYtPickTrack(scTr, "en", ["zh-hant"]) === scTr[1], "yt pick: an exact tag beats the sibling script even when only its ASR track exists");
  assert(pbpYtPickTrack(scTr, "en", ["zh"]) === scTr[0], "yt pick: a bare base tag still matches any script, human first");
  assert(pbpYtPickTrack(scTr, "en", ["en", "zh-hant"]) === scTr[2] && pbpYtPickTrack(scTr, "zh-TW", ["en", "zh-hant"]) === scTr[2], "yt pick: preference order dominates both the exact-tag bonus and the UI language");
  assert(pbpYtPickTrack([ytTr[2], ytTr[3]], "ja", ["en", "ja"]) === ytTr[2], "yt pick: the UI-language bonus never lifts a later preference over an earlier one");
  const uiSubs = [{ lan: "zh-CN", lan_doc: "中文（中国）" }, { lan: "ai-en", lan_doc: "英语（自动生成）" }, { lan: "en-US", lan_doc: "英语（美国）" }];
  assert(pbpBiliPickSubtitle(uiSubs, [], "", "en-GB") === uiSubs[2], "bili pick: an empty preference follows the interface language, human before AI");
  assert(pbpBiliPickSubtitle(uiSubs, [], "", "ja") === uiSubs[0] && pbpBiliPickSubtitle(uiSubs, ["en"], "", "zh-CN") === uiSubs[2], "bili pick: interface language absent -> zh default; a preference beats the interface language");
  assert(pbpBiliPickSubtitle(uiSubs, ["en-us"]) === uiSubs[2] && pbpBiliPickSubtitle([uiSubs[1], uiSubs[0]], ["zh-cn"]) === uiSubs[0], "bili pick: an exact tag (ai- prefix stripped) matches the full lan code");
  // Canonical tags (Codex review F11/F13): zh region -> script, "_" -> "-", case
  assert(JSON.stringify(pbpVideoLangPrefs("zh-CN, pt_BR, EN, zh_TW")) === '["zh-hans","pt-br","en","zh-hant"]', "lang prefs: zh regions fold onto their script, underscores become hyphens, case folds");
  assert(pbpYtPickTrack(scTr, "en", ["zh-cn"]) === scTr[0] && pbpYtPickTrack(scTr, "en", ["zh-tw"]) === scTr[1], "yt pick: zh-CN / zh-TW preferences reach the zh-Hans / zh-Hant tracks exactly");
  assert(pbpBiliPickSubtitle(uiSubs, ["zh-hans"]) === uiSubs[0] && pbpBiliPickSubtitle(uiSubs, ["zh-hant"]) === uiSubs[0], "bili pick: a zh-Hans preference matches bilibili's zh-CN exactly; zh-Hant still reaches it by base");
  assert(pbpYtPickTrack([{ lang: "pt", asr: false, vssId: ".pt" }, { lang: "pt-BR", asr: false, vssId: ".pt-BR" }], "en", ["pt_br"]).lang === "pt-BR", "yt pick: an underscore region tag matches the hyphenated track exactly");
  // Speed picker <-> reported rate (settings batch C4)
  const rateSteps = [0.75, 1, 1.25, 1.5, 2];
  assert(pbpVideoRateOption(rateSteps, 1.25) === "1.25" && pbpVideoRateOption(rateSteps, 1.2500004) === "1.25" && pbpVideoRateOption(rateSteps, "2") === "2", "rate option: a listed rate (float noise tolerated, string accepted) maps to its option value");
  assert(pbpVideoRateOption(rateSteps, 0.5) === null && pbpVideoRateOption(rateSteps, 0) === null && pbpVideoRateOption(rateSteps, NaN) === null && pbpVideoRateOption(null, 1) === null, "rate option: an unlisted, zero, NaN or listless rate is null (caller shows a synthetic option)");
  // Stored-form clamp keeps whole tags (Codex r2 L1)
  assert(pbpVideoLangPrefsClamp(["en", "zh-hans", "ja"], 80) === "en, zh-hans, ja" && pbpVideoLangPrefsClamp(["en", "zh-hans", "ja"], 11) === "en, zh-hans" && pbpVideoLangPrefsClamp(["en", "zh-hans"], 10) === "en" && pbpVideoLangPrefsClamp([], 80) === "" && pbpVideoLangPrefsClamp(null, 80) === "",
    "lang prefs clamp: drops trailing tags that no longer fit instead of slicing one in half");
  // Embedded-frame candidate rule (reader grant-and-retry, 2026-08-25/26) -- pure twin of the injected detectors
  const fr = (o, extra) => Object.assign({ origin: o, srcdoc: false, sandbox: null, hidden: false, rect: { left: 0, top: 0, right: 1000, bottom: 800 } }, extra || {});
  assert(pbpPickDominantFrame([fr("https://x.frame.example")], 1000, 800, "https://page.example") === "https://x.frame.example", "frame pick: one visible cross-origin https frame covering the viewport is the candidate");
  assert(pbpPickDominantFrame([fr("https://x.frame.example", { rect: { left: 0, top: 0, right: 600, bottom: 500 } })], 1000, 800, "https://page.example") === "", "frame pick: below 40% of the viewport -> no candidate (600x500 of 1000x800 = 37.5%)");
  assert(pbpPickDominantFrame([fr("https://x.frame.example", { rect: { left: -1000, top: 0, right: 350, bottom: 800 } })], 1000, 800, "https://page.example") === ""
    && pbpPickDominantFrame([fr("https://x.frame.example", { rect: { left: -1000, top: 0, right: 500, bottom: 800 } })], 1000, 800, "https://page.example") === "https://x.frame.example",
    "frame pick: the VISIBLE intersection counts, not the element's own size (1350px wide but 350px on screen = 35% -> no; 500px on screen = 50% -> yes)");
  assert(pbpPickDominantFrame([fr("https://x.frame.example", { srcdoc: true })], 1000, 800, "https://page.example") === "" && pbpPickDominantFrame([fr("https://x.frame.example", { hidden: true })], 1000, 800, "https://page.example") === "", "frame pick: srcdoc and hidden (own or ancestor) frames are never candidates");
  assert(pbpPickDominantFrame([fr("https://x.frame.example", { sandbox: "allow-scripts" })], 1000, 800, "https://page.example") === "" && pbpPickDominantFrame([fr("https://x.frame.example", { sandbox: "allow-scripts allow-same-origin" })], 1000, 800, "https://page.example") === "https://x.frame.example", "frame pick: a sandbox without allow-same-origin is an opaque origin -> excluded; with it -> candidate");
  assert(pbpPickDominantFrame([fr("http://x.frame.example"), fr("https://page.example")], 1000, 800, "https://page.example") === "", "frame pick: non-https and same-origin frames are excluded");
  assert(pbpPickDominantFrame([fr("https://small.example", { rect: { left: 0, top: 0, right: 700, bottom: 800 } }), fr("https://big.example")], 1000, 800, "https://page.example") === "https://big.example" && pbpPickDominantFrame(null, 1000, 800, "x") === "", "frame pick: the largest visible candidate wins; a missing list is no candidate");
  // Paragraph density rows + projection row lookup (research T7.10/T5.1)
  const prSegs = [{ from: 0, to: 2, content: "第一句话" }, { from: 2, to: 4, content: "还没完。" }, { from: 10, to: 12, content: "第二段" }, { from: 12, to: 14.5, content: "继续说。" }];
  const prRows = pbpVideoParagraphRows(prSegs, null);
  assert(prRows.length === 2 && prRows[0].from === 0 && prRows[0].to === 10 && prRows[1].from === 10 && prRows[1].to === 14.5 && /第二段/.test(prRows[1].content),
    "paragraph rows: one per record, timed to the next paragraph start / last segment end");
  const prAi = pbpVideoParagraphRows(prSegs, ["第一句话，还没完。", "第二段，继续说。"]);
  assert(prAi.length === 2 && prAi[0].content === "第一句话，还没完。" && prAi[1].from === 10, "paragraph rows: aligned AI paragraphs are used verbatim");
  assert(pbpVideoRowForParagraph(prSegs, 10, null) === 2 && pbpVideoRowForParagraph(prSegs, 0, 10) === 0 && pbpVideoRowForParagraph(prSegs, 5, 9) === -1,
    "row for paragraph: first row starting inside the window, -1 when none");
  assert(pbpVideoRowForParagraph(prRows, 10, null) === 1, "row for paragraph: paragraph density maps 1:1");
  // Auxiliary track pairing (research T5.2)
  const pbRows = [{ from: 0, to: 4, content: "a" }, { from: 4, to: 8, content: "b" }, { from: 8, to: 0, content: "c" }];
  const pbAux = [{ from: -3, to: -1, content: "before" }, { from: 0, to: 2, content: "A1" }, { from: 2, to: 4, content: "A2" }, { from: 5, to: 7, content: "B" }, { from: 9, to: 12, content: "C" }, { from: 30, to: 32, content: "far" }];
  assert(JSON.stringify(pbpVideoPairByTime(pbRows, pbAux)) === '["A1 A2","B","C"]', "pair by time: cues land in the row whose window holds their midpoint; cues before the first row or past the last row's end pair nowhere");
  assert(JSON.stringify(pbpVideoPairByTime(pbRows, [])) === '["","",""]' && JSON.stringify(pbpVideoPairByTime([], pbAux)) === "[]", "pair by time: empty sides yield empty strings / no rows");
})();

section("pbpVideoRunPunctBatches (K141 phase 1: assembly by index, explicit completion count)");
await (async () => {
  const batches = ["一二三四五", "六七八九十", "甲乙丙丁戊", "子丑寅卯辰"];
  // A worker that answers OUT OF STEP with the array it is handed: the later
  // batches settle faster than the earlier ones, and every answer is tagged
  // with the index it was produced for -- the text alone never says which
  // batch it belongs to. Batch `bi`'s answer has to reach slot `bi` whatever
  // the completion order is (the per-batch conservation gate is blind to the
  // slot an answer lands in, so the mapping has to be structural).
  const settleOrder = [];
  const tagged = async (b, bi) => {
    await new Promise((r) => setTimeout(r, (batches.length - bi) * 3)); // the LAST batch is the fastest
    settleOrder.push(bi);
    return { ok: true, out: "#" + bi + "|" + b };
  };
  const r = await pbpVideoRunPunctBatches(batches, tagged, {});
  assert(JSON.stringify(r.out) === JSON.stringify(batches.map((b, i) => "#" + i + "|" + b)),
    "assembly: each batch's answer lands in its OWN slot, keyed by bi");
  assert(r.out.length === batches.length && r.out.every((x) => x != null),
    "assembly: a completed pass leaves no undefined slot behind");
  assertEq(r.completed, batches.length, "assembly: completed counts every settled batch");
  assert(r.cancelled === false && r.superseded === false, "assembly: a clean pass reports neither cancel nor supersede");
  assertEq(settleOrder.join(","), "0,1,2,3", "assembly: still strictly serial -- one batch in flight at a time (K141 phase 1 changes no timing)");

  // fail-closed: a batch whose answer never passed the conservation gate
  // keeps its OWN input, and still counts as settled for the status line.
  const oneFails = async (b, bi) => (bi === 1 ? { ok: false, out: "模型换掉了别的字" } : { ok: true, out: b + "。" });
  const rf = await pbpVideoRunPunctBatches(batches, oneFails, {});
  assertEq(rf.out[1], batches[1], "fail-closed: a rejected batch's slot holds the original text, not the model's");
  assertEq(rf.out[0], batches[0] + "。", "fail-closed: its neighbours still carry their own answers");
  assertEq(rf.completed, batches.length, "fail-closed: a rejected batch still counts as settled");

  // The regression the pre-sizing could cause: the cancel line must report
  // the batches that RAN. The array is pre-sized to the total, so a count
  // taken from `out.length` would claim "4/4 done" after two batches.
  let settled = 0;
  const rc = await pbpVideoRunPunctBatches(batches, async (b) => ({ ok: true, out: b + "。" }),
    { cancelled: () => settled >= 2, onCompleted: (n) => { settled = n; } });
  assert(rc.cancelled === true, "cancel: the driver stops at a batch boundary, not mid round-trip");
  assertEq(rc.completed, 2, "cancel: the count is the batches that actually ran (2 of 4)");
  assertEq(rc.out.length, batches.length, "cancel: the array is pre-sized to the TOTAL -- out.length is not a done count");
  assert(rc.out[0] != null && rc.out[1] != null && rc.out[2] === undefined && rc.out[3] === undefined,
    "cancel: only the batches that ran have their slot filled");

  // A track switch landing mid round-trip: the worker's flag abandons the
  // whole pass instead of just ending that one batch.
  const rs = await pbpVideoRunPunctBatches(batches,
    async (b, bi) => (bi === 1 ? { superseded: true } : { ok: true, out: b + "。" }), {});
  assert(rs.superseded === true && rs.cancelled === false, "supersede: the flag travels up from the worker, it is not a cancel");
  assertEq(rs.completed, 1, "supersede: only the batches already assembled are reported");

  // Whole-output conservation. The shipped gate is per batch, so it cannot
  // see a mis-ordered assembly at all; this is the backstop that can.
  const paras = ["今天我们来讲一个很长的故事", "故事发生在很久很久以前的一个小村子里", "村子里住着一位老人和他的孙女", "他们每天都要去山上砍柴"];
  const pb = pbpVideoSplitBatches(paras, 12);
  assert(pb.length >= 3, "conservation fixture: the paragraphs really do split into several batches");
  // Hand-written stand-in for the model: inserts marks only, never touches a word.
  const marker = async (b) => ({ ok: true, out: b.replace(/\n/g, "，") + "。" });
  const rcv = await pbpVideoRunPunctBatches(pb, marker, {});
  assert(rcv.out.every((o, i) => pbpVideoPunctConserved(pb[i], o) === true),
    "conservation: every batch passed its own gate at the moment it was produced");
  assert(pbpVideoPunctConserved(paras.join(" "), rcv.out.join(" ")) === true,
    "conservation: the ASSEMBLED pass conserves the whole transcript, not only each batch");
  const swapped = rcv.out.slice();
  swapped[0] = rcv.out[1]; swapped[1] = rcv.out[0];
  assert(pbpVideoPunctConserved(paras.join(" "), swapped.join(" ")) === false,
    "conservation: a mis-ordered assembly is caught ONLY by the whole-output gate (every per-batch gate above was green)");

  assert((await pbpVideoRunPunctBatches([], async () => ({ ok: true, out: "x" }), {})).completed === 0
    && (await pbpVideoRunPunctBatches(null, async () => ({ ok: true, out: "x" }))).out.length === 0,
    "edges: no batches and a missing hooks object are both harmless");
})();

section("pbpVideoRunPunctBatches (K141 phase 2: bounded pool, serial downgrade on rate limits)");
await (async () => {
  const mk = (n) => Array.from({ length: n }, (_, i) => "批次" + i + "的文字");
  // Probe worker: records how many runOne calls were in flight at the moment
  // each batch STARTED (`liveAt[bi]`), the high-water mark, the claim order
  // and the settle order. `plan(bi)` supplies the per-batch delay plus an
  // optional canned answer or throw, so a rate limit / a supersede / a hard
  // provider failure can be placed at an exact index and an exact moment.
  function probe(plan) {
    const st = { live: 0, peak: 0, calls: [], liveAt: [], settled: [] };
    st.runOne = async (b, bi) => {
      const p = (plan && plan(bi)) || {};
      st.live++; st.peak = Math.max(st.peak, st.live);
      st.calls.push(bi); st.liveAt[bi] = st.live;
      try {
        await new Promise((r) => setTimeout(r, p.delay == null ? 3 : p.delay));
        if (p.thrown) throw p.thrown;
        return p.res || { ok: true, out: "#" + bi + "|" + b };
      } finally { st.live--; st.settled.push(bi); }
    };
    return st;
  }

  // Out-of-order settles under a pool of 2: the answers still have to land in
  // their own slots. With two workers the settle order is genuinely NOT the
  // claim order any more, which is what phase 1's identical assertion could
  // only lock as a contract (a serial loop makes push and out[bi] look alike).
  const a6 = mk(6);
  const pa = probe((bi) => ({ delay: (6 - bi) * 4 })); // later batches answer faster
  const ra = await pbpVideoRunPunctBatches(a6, pa.runOne, { concurrency: 2 });
  assert(pa.settled.join(",") !== pa.calls.join(","),
    "pool fixture: the batches really do settle out of claim order (otherwise the slot assertion below proves nothing)");
  assert(JSON.stringify(ra.out) === JSON.stringify(a6.map((b, i) => "#" + i + "|" + b)),
    "pool: every answer lands in its OWN slot even when two workers settle out of order");
  assertEq(ra.completed, 6, "pool: completed reaches the total");
  assert(ra.cancelled === false && ra.superseded === false, "pool: a clean concurrent pass reports neither cancel nor supersede");

  // Bounded: two in flight, never a naked Promise.all over every batch.
  assertEq(pa.peak, 2, "pool: exactly two batches are ever in flight at once");
  const pbig = probe(() => ({ delay: 4 }));
  await pbpVideoRunPunctBatches(mk(9), pbig.runOne, { concurrency: 2 });
  assertEq(pbig.peak, 2, "pool: nine batches still never put more than two requests in flight");

  // concurrency 1 (and every degenerate value) is the phase-1 serial driver.
  const pc = probe((bi) => ({ delay: (6 - bi) * 4 }));
  const rc1 = await pbpVideoRunPunctBatches(a6, pc.runOne, { concurrency: 1 });
  assertEq(pc.peak, 1, "serial: concurrency 1 keeps exactly one request in flight");
  assertEq(pc.calls.join(","), "0,1,2,3,4,5", "serial: batches are claimed in ascending order");
  assertEq(pc.settled.join(","), "0,1,2,3,4,5", "serial: and settle in that same order -- phase 1 behaviour, tick for tick");
  assert(JSON.stringify(rc1.out) === JSON.stringify(a6.map((b, i) => "#" + i + "|" + b)) && rc1.completed === 6,
    "serial: assembly and completion count are unchanged by the pool being available");
  const pd0 = probe(() => ({ delay: 2 }));
  await pbpVideoRunPunctBatches(mk(5), pd0.runOne, {});
  assertEq(pd0.peak, 1, "serial: a hooks object with no worker count is the phase-1 serial driver");
  const pd1 = probe(() => ({ delay: 2 }));
  await pbpVideoRunPunctBatches(mk(5), pd1.runOne, { concurrency: 0 });
  assertEq(pd1.peak, 1, "serial: a nonsense worker count floors to one -- it never means 'unbounded'");
  const pd2 = probe(() => ({ delay: 2 }));
  await pbpVideoRunPunctBatches(mk(2), pd2.runOne, { concurrency: 5 });
  assertEq(pd2.peak, 2, "pool: the worker count is clamped to the number of batches");

  // Rate limit / server fault: the pool drains itself to one worker for the
  // rest of the pass (md-translate.js's `slow`), the failed batch keeps its
  // input, and nothing is retried.
  const d8 = mk(8);
  const pdz = probe((bi) => (bi === 1
    ? { delay: 1, res: { ok: false, out: d8[1], transient: true } }
    : { delay: 20 }));
  const rd = await pbpVideoRunPunctBatches(d8, pdz.runOne, { concurrency: 2 });
  assertEq(pdz.peak, 2, "downgrade fixture: the pool really did start out with two workers");
  assert(pdz.liveAt.slice(2).every((v) => v === 1),
    "downgrade: after one rate-limited batch every later batch is claimed alone -- the pool drained to serial");
  assertEq(rd.out[1], d8[1], "downgrade: the rate-limited batch keeps its own input (fail-closed, no retry)");
  assert(rd.out.every((o) => o != null) && rd.completed === 8,
    "downgrade: the remaining batches still all run -- the pass is assembled in full, one at a time");
  assert(rd.cancelled === false && rd.superseded === false, "downgrade: a rate limit is neither a cancel nor a supersede");
  const pctl = probe((bi) => ({ delay: bi === 1 ? 1 : 20 }));
  await pbpVideoRunPunctBatches(d8, pctl.runOne, { concurrency: 2 });
  assert(pctl.liveAt.slice(2).some((v) => v === 2),
    "downgrade control: with the SAME timings but no rate limit the later batches do overlap two at a time (so the assertion above is about `slow`, not about the fixture's delays)");

  // Cancel: checked before a worker claims, never mid round-trip. A request
  // already in flight finishes and its answer is still assembled -- runOne has
  // banked it in the batch cache by then, and the cancel line is meant to say
  // how much of the work is already paid for. The PASS still commits nothing.
  const e6 = mk(6);
  const pe = probe(() => ({ delay: 4 }));
  const re = await pbpVideoRunPunctBatches(e6, pe.runOne, { concurrency: 2, cancelled: () => pe.calls.length >= 3 });
  const callsAtReturn = pe.calls.length;
  assert(re.cancelled === true, "cancel: the pool stops at a claim boundary and reports the cancel");
  assert(re.completed >= 2 && re.completed < e6.length, "cancel: completed is the batches that actually ran, never the total");
  assertEq(pe.calls.length, re.completed, "cancel: every claimed batch settled and was counted -- an in-flight request finishes, it is not dropped");
  await new Promise((r) => setTimeout(r, 40));
  assertEq(pe.calls.length, callsAtReturn, "cancel: no worker claims another batch after the flag flips (checked again after the driver returned)");
  assert(re.out.slice(re.completed).every((x) => x === undefined),
    "cancel: the batches that never ran have empty slots -- the array is pre-sized to the TOTAL");

  // Supersede from one worker abandons the pass for all of them, and an answer
  // that lands afterwards belongs to a transcript that is gone -- it is dropped
  // rather than assembled (unlike a cancel, where the answer is still valid).
  const f6 = mk(6);
  const pf = probe((bi) => (bi === 1 ? { delay: 1, res: { superseded: true } } : { delay: 20 }));
  const rf2 = await pbpVideoRunPunctBatches(f6, pf.runOne, { concurrency: 2 });
  assert(rf2.superseded === true && rf2.cancelled === false, "supersede: one worker's flag abandons the whole pass, and it is not a cancel");
  assertEq(pf.calls.join(","), "0,1", "supersede: no worker claims another batch once the transcript this pass was built from is gone");
  await new Promise((r) => setTimeout(r, 40));
  assertEq(pf.calls.join(","), "0,1", "supersede: and none appears after the driver returned either");
  assert(rf2.out[0] === undefined && rf2.completed === 0,
    "supersede: an answer arriving after the pass was abandoned is dropped, not assembled");

  // A hard (non-transient) failure ends the pass with its own error, exactly
  // as the serial driver's bare `await runOne(...)` did -- but the sibling
  // worker has to be drained first, or its rejection lands with nobody
  // listening (an unhandled rejection the serial driver could never produce).
  const pg = probe((bi) => (bi === 1
    ? { delay: 1, thrown: Object.assign(new Error("Gemini failed (HTTP 401)"), { status: 401 }) }
    : { delay: 20 }));
  let gErr = null;
  try { await pbpVideoRunPunctBatches(mk(6), pg.runOne, { concurrency: 2 }); } catch (e) { gErr = e; }
  assert(gErr && gErr.status === 401, "hard failure: the driver rejects with the batch's own error");
  assertEq(pg.calls.join(","), "0,1", "hard failure: the sibling worker is drained and claims nothing more");

  // Which provider failures are worth carrying on past.
  assert(pbpVideoIsTransientAiError({ status: 429 }) === true && pbpVideoIsTransientAiError({ status: 500 }) === true
    && pbpVideoIsTransientAiError({ status: 503 }) === true,
    "transient: a rate limit and a server fault are the class where the next batch is still worth sending");
  assert(pbpVideoIsTransientAiError({ name: "TimeoutError" }) === true,
    "transient: the request deadline counts (ai.js rejects with TimeoutError, never AbortError, when it fires)");
  assert(pbpVideoIsTransientAiError({ name: "AbortError" }) === false
    && pbpVideoIsTransientAiError({ name: "AbortError", status: 429 }) === false,
    "transient: the user's own Cancel is never a provider fault, whatever status rode along with it");
  assert(pbpVideoIsTransientAiError({ status: 401 }) === false && pbpVideoIsTransientAiError({ status: 403 }) === false
    && pbpVideoIsTransientAiError({ status: 400 }) === false && pbpVideoIsTransientAiError({ code: "host_permission" }) === false,
    "transient: a bad key, a refused model and a missing host permission are standing conditions -- the next batch would hit them too");
  assert(pbpVideoIsTransientAiError(new Error("Gemini failed (HTTP 429)")) === true,
    "transient: a provider that only says it in the message still classifies");
  assert(pbpVideoIsTransientAiError(null) === false && pbpVideoIsTransientAiError(new Error("boom")) === false,
    "transient: nothing, and an error nobody classified, are not transient");

  // The caller's gate, evaluated rather than grepped: the literal expression is
  // sliced out of the shipped source and RUN, so a gate rewritten to read the
  // total batch count (or to fan out unconditionally) fails here.
  const src = await fetch("../md-video.js").then((r) => r.text());
  const gm = src.match(/\bconcurrency:\s*([^,\n]+),/);
  assert(!!gm, "caller gate: the punctuation driver call passes an explicit worker count");
  const gateExpr = gm ? gm[1].trim() : "";
  assert(/\bfreshTotal\b/.test(gateExpr) && !/\bbatches\b/.test(gateExpr),
    "caller gate: it is keyed on freshTotal -- the batches this pass PAYS for -- not on the total batch count, so a nearly-all-cached pass never fans out");
  const gate = gm ? new Function("freshTotal", "return (" + gateExpr + ");") : () => null;
  assertEq(gate(3), 1, "caller gate: three fresh batches stay serial");
  assertEq(gate(4), 2, "caller gate: four fresh batches open the pool to two");
  assertEq(gate(0), 1, "caller gate: nothing to pay for stays serial");
  assertEq(gate(19), 2, "caller gate: a two-hour lecture's 19 fresh batches still cap at two");
})();


document.getElementById("summary").textContent = `${pass} passed, ${fail} failed`;
})();
</script>
