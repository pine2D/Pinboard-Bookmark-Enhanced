<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="pbp-expected-count" content="32"><title>Jina Cache Tests</title>
<style>
body { font-family: monospace; padding: 16px; max-width: 900px; }
.case { padding: 6px; border-bottom: 1px solid #eee; white-space: pre-wrap; }
.pass { color: #0a0; } .fail { color: #c00; font-weight: bold; } h2 { margin-top: 24px; }
</style></head>
<body>
<h1>isStaleCacheEntry() tests</h1>
<div id="results"></div>
<script src="../i18n.js"></script>
<script src="../shared.js"></script>
<script src="../ai.js"></script>
<script src="../jina.js"></script>
<script>
const root = document.getElementById("results");
let pass = 0, fail = 0;
function check(name, cond) {
  const ok = !!cond; ok ? pass++ : fail++;
  const div = document.createElement("div");
  div.className = "case " + (ok ? "pass" : "fail");
  div.textContent = `${ok ? "PASS" : "FAIL"}  ${name}`;
  root.appendChild(div);
}
const ONE_HOUR = 60 * 60 * 1000, TWO_HOURS = 2 * ONE_HOUR, now = Date.now();
check("null entry is stale", isStaleCacheEntry(null, now, ONE_HOUR));
check("undefined entry is stale", isStaleCacheEntry(undefined, now, ONE_HOUR));
check("non-object entry is stale", isStaleCacheEntry("string", now, ONE_HOUR));
check("30min old / 1h TTL is fresh", !isStaleCacheEntry({ result: {}, timestamp: now - 30 * 60 * 1000 }, now, ONE_HOUR));
check("2h old / 1h TTL is stale", isStaleCacheEntry({ result: {}, timestamp: now - TWO_HOURS }, now, ONE_HOUR));
check("exactly 1h old is fresh (boundary, > not >=)", !isStaleCacheEntry({ result: {}, timestamp: now - ONE_HOUR }, now, ONE_HOUR));
check("1h+1ms old is stale", isStaleCacheEntry({ result: {}, timestamp: now - ONE_HOUR - 1 }, now, ONE_HOUR));
check("missing timestamp is stale", isStaleCacheEntry({ result: {} }, now, ONE_HOUR));

// ---- resolveCacheMs: 0 must mean "disabled", null/undefined must mean default ----
const HOUR_MS = 60 * 60 * 1000;
check("resolveCacheMs(0) returns 0 (disabled)", resolveCacheMs(0) === 0);
check("resolveCacheMs('0') returns 0 (numeric-string disabled)", resolveCacheMs("0") === 0);
check("resolveCacheMs(null) returns default 60m", resolveCacheMs(null) === HOUR_MS);
check("resolveCacheMs(undefined) returns default 60m", resolveCacheMs(undefined) === HOUR_MS);
check("resolveCacheMs('') returns default 60m", resolveCacheMs("") === HOUR_MS);
check("resolveCacheMs(NaN) returns default 60m", resolveCacheMs(NaN) === HOUR_MS);
check("resolveCacheMs(30) returns 30m in ms", resolveCacheMs(30) === 30 * 60 * 1000);
check("resolveCacheMs(120) returns 120m in ms", resolveCacheMs(120) === 120 * 60 * 1000);
// save-coercion contract (mirrors options.js:861 Math.min/Math.max clamp): 0 must survive
const coerce = (v) => Math.min(10080, Math.max(0, (v === "" || v == null || isNaN(parseInt(v))) ? 60 : parseInt(v)));
check("save coercion keeps 0 as 0 (not 60)", coerce("0") === 0);
check("save coercion keeps blank as 60", coerce("") === 60);
check("save coercion clamps 99999 to 10080", coerce("99999") === 10080);

// ---- i18n $-safe substitution (function replacement, not bare String.replace) ----
const _i18nEntry = { message: "Delete $TERM$?", placeholders: { TERM: { content: "$1" } } };
check("t() substitution: $&-containing arg passes through literally", _resolveMsg(_i18nEntry, ["$&"]) === "Delete $&?");
check("t() substitution: normal arg still substitutes", _resolveMsg(_i18nEntry, ["Widget"]) === "Delete Widget?");

async function acheck(name, fn) {
  try { await fn(); check(name, true); }
  catch (e) { console.error(name, e); check(name, false); }
}

// Source-sliced harness for background.js's recurring cache sweep. The sweep is
// the only writer that can evict a jina_md_ entry, and jina.js reads those back
// through the USER's aiCacheDuration, so the two thresholds have to agree —
// asserting resolveCacheMs boundaries with a hand-passed TTL never touched that.
// Entries are written in the shapes their real writers produce: jina.js stores
// { result, timestamp }, popup-tags.js stores { data, timestamp, account }.
function buildSuggestSweepHarness(source, options) {
  const o = options || {};
  const start = source.indexOf("const SUGGEST_SWEEP_INTERVAL_MS");
  const end = source.indexOf("// Best-effort sweep of orphaned per-tab preview payloads", start);
  if (start < 0 || end <= start) throw new Error("suggest sweep source not found");
  const data = structuredClone(o.entries || {});
  const removed = [];
  const calls = { getNull: 0, getKeys: 0, failSet: !!o.failSet };
  const deps = {
    chrome: { storage: { local: {
      async get(query) {
        if (query === null || query === undefined) { calls.getNull++; return structuredClone(data); }
        const out = {};
        if (Array.isArray(query)) { for (const key of query) if (key in data) out[key] = structuredClone(data[key]); return out; }
        for (const [key, fallback] of Object.entries(query)) {
          out[key] = key in data ? structuredClone(data[key]) : fallback;
        }
        return out;
      },
      ...(o.noGetKeys ? {} : { async getKeys() { calls.getKeys++; return Object.keys(data); } }),
      async set(obj) { if (calls.failSet) { const e = new Error("quota"); e.name = "QuotaError"; throw e; } for (const [key, value] of Object.entries(obj)) data[key] = structuredClone(value); },
      async remove(keys) {
        for (const key of [].concat(keys)) { removed.push(key); delete data[key]; }
      },
    } } },
    pbpReadSettingsWithSecrets: async (defaults) => ({ ...defaults, ...(o.settings || {}) }),
    console: o.console || console,
  };
  const factory = new Function(...Object.keys(deps), `${source.slice(start, end)}\nreturn sweepSuggestCache;`);
  return { run: factory(...Object.values(deps)), data, removed, calls };
}

(async function () {
  const realChrome = window.chrome;
  const realFetch = window.fetch;
  const backgroundSource = await fetch("../background.js").then((response) => response.text());
  try {
    await acheck("Jina cache hit needs neither permission check nor fetch", async () => {
      let checks = 0, fetches = 0;
      const url = "https://example.com/cached";
      const key = `jina_md_${url}`;
      window.chrome = {
        runtime: { id: "test-extension" },
        storage: { local: { get: async () => ({ [key]: { result: { markdown: "cached" }, timestamp: Date.now() } }) } },
        permissions: { contains: async () => { checks++; return false; } },
      };
      window.fetch = async () => { fetches++; throw new Error("must not fetch"); };
      const result = await fetchJinaMarkdown(url, { cacheDuration: 60 });
      if (!result.fromCache || result.markdown !== "cached" || checks !== 0 || fetches !== 0) throw new Error("cache-first contract failed");
    });

    await acheck("Jina cache miss checks exact permission before one fetch", async () => {
      let checked = null, fetches = 0;
      window.chrome = {
        runtime: { id: "test-extension" },
        storage: { local: { get: async () => ({}) } },
        permissions: { contains: async (spec) => { checked = spec.origins; return true; } },
      };
      window.fetch = async () => {
        fetches++;
        return { ok: true, json: async () => ({ data: { content: "fresh", url: "https://example.com/fresh" } }) };
      };
      const result = await fetchJinaMarkdown("https://example.com/fresh", { cacheDuration: 0 });
      if (checked?.[0] !== PBP_JINA_ORIGIN_PATTERN || fetches !== 1 || result.fromCache || result.markdown !== "fresh") throw new Error("miss gate failed");
    });

    await acheck("Jina false, throwing, or missing permission state returns host_permission with zero fetch", async () => {
      let fetches = 0;
      window.fetch = async () => { fetches++; throw new Error("must not fetch"); };
      for (const mode of ["false", "throw", "missing"]) {
        const permissions = mode === "missing" ? {} : { contains: async () => {
          if (mode === "throw") throw new Error("unavailable");
          return false;
        } };
        window.chrome = {
          runtime: { id: "test-extension" },
          storage: { local: { get: async () => ({}) } },
          permissions,
        };
        const result = await fetchJinaMarkdown("https://example.com/denied", { cacheDuration: 0 });
        if (result.error !== "host_permission" || result.code !== "host_permission") throw new Error(mode + ": wrong result");
      }
      if (fetches !== 0) throw new Error("permission failure fetched");
    });

    await acheck("non-extension test context can exercise a Jina cache miss", async () => {
      let fetches = 0;
      window.chrome = { storage: { local: { get: async () => ({}) } } };
      window.fetch = async () => {
        fetches++;
        return { ok: true, json: async () => ({ data: { content: "test" } }) };
      };
      const result = await fetchJinaMarkdown("https://example.com/test", { cacheDuration: 0 });
      if (result.error || result.markdown !== "test" || fetches !== 1) throw new Error("non-extension compatibility failed");
    });
    // ---- sweepSuggestCache honours the configured AI cache duration ----
    const HOURS_2 = 2 * 60 * 60 * 1000;
    const entries = () => ({
      _suggestSweepTs: 0,
      "jina_md_https://example.com/a": { result: { markdown: "# A", title: "A", url: "https://example.com/a" }, timestamp: Date.now() - HOURS_2 },
      "cached_suggest_https://example.com/a": { data: [{ popular: ["news"] }, { recommended: ["news", "web"] }], timestamp: Date.now() - HOURS_2, account: "alice" },
    });

    await acheck("sweep keeps a jina_md_ entry the user's longer AI cache duration still covers", async () => {
      const h = buildSuggestSweepHarness(backgroundSource, { settings: { aiCacheDuration: 1440 }, entries: entries() });
      await h.run();
      if (h.removed.includes("jina_md_https://example.com/a")) throw new Error("swept an entry the reader would still serve");
    });

    await acheck("sweep still drops a cached_suggest_ entry past its own hour, whatever the AI cache duration", async () => {
      const h = buildSuggestSweepHarness(backgroundSource, { settings: { aiCacheDuration: 1440 }, entries: entries() });
      await h.run();
      if (!h.removed.includes("cached_suggest_https://example.com/a")) throw new Error("suggest cache outlived its own TTL");
    });

    await acheck("sweep drops every jina_md_ entry when AI caching is turned off", async () => {
      const fresh = entries();
      fresh["jina_md_https://example.com/a"].timestamp = Date.now();
      const h = buildSuggestSweepHarness(backgroundSource, { settings: { aiCacheDuration: 0 }, entries: fresh });
      await h.run();
      if (!h.removed.includes("jina_md_https://example.com/a")) throw new Error("disabled cache kept an unreachable entry forever");
    });

    // ---- Y4-05: read only the cache families, never the whole local area ----
    const mixed = () => ({
      ...entries(),
      "jina_md_https://example.com/fresh": { result: { markdown: "# F" }, timestamp: Date.now() },
      "highlights_https://example.com/a": [{ text: "keep me" }],
    });
    for (const noGetKeys of [false, true]) {
      await acheck("sweep " + (noGetKeys ? "without getKeys falls back to get(null)" : "with getKeys never calls get(null)") + " and evicts only stale cache entries", async () => {
        const h = buildSuggestSweepHarness(backgroundSource, { settings: { aiCacheDuration: 60 }, entries: mixed(), noGetKeys });
        await h.run();
        if (noGetKeys ? h.calls.getNull !== 1 : (h.calls.getNull !== 0 || h.calls.getKeys !== 1)) throw new Error("wrong read path: " + JSON.stringify(h.calls));
        if (h.removed.length !== 2 || !h.removed.includes("jina_md_https://example.com/a") || !h.removed.includes("cached_suggest_https://example.com/a")) throw new Error("removed " + JSON.stringify(h.removed));
        if (!("jina_md_https://example.com/fresh" in h.data) || !("highlights_https://example.com/a" in h.data)) throw new Error("swept a live entry");
      });
    }

    // ---- Y4-04: a failed sweep leaves a trace (label and error name only) ----
    await acheck("a failing cache sweep warns once under [cache-sweep] without keys or URLs", async () => {
      const warns = [];
      const h = buildSuggestSweepHarness(backgroundSource, { settings: { aiCacheDuration: 60 }, entries: entries(), failSet: true,
        console: { log() {}, warn: (...a) => warns.push(a) } });
      await h.run();
      if (warns.length !== 1 || !String(warns[0][0]).startsWith("[cache-sweep]")) throw new Error("warns " + JSON.stringify(warns));
      if (JSON.stringify(warns).includes("example.com") || warns[0][1] !== "QuotaError") throw new Error("log leaks or lacks error name");
    });

    await acheck("a failing preview-orphan sweep warns once under [preview-sweep] without keys", async () => {
      const start = backgroundSource.indexOf("const PREVIEW_SWEEP_INTERVAL_MS");
      const end = backgroundSource.indexOf("\n// Cold-start residue clean", start);
      if (start < 0 || end <= start) throw new Error("preview sweep source not found");
      const warns = [];
      const chromeStub = { runtime: { getURL: (p) => "chrome-extension://x/" + p },
        tabs: { query: async () => { const e = new Error("tabs gone"); e.name = "TabsError"; throw e; } },
        storage: { local: { get: async () => ({ _previewSweepTs: 0 }) } } };
      const run = new Function("chrome", "console", backgroundSource.slice(start, end) + "\nreturn pbpSweepPreviewOrphans;")(chromeStub, { warn: (...a) => warns.push(a) });
      await run();
      if (warns.length !== 1 || !String(warns[0][0]).startsWith("[preview-sweep]") || warns[0][1] !== "TabsError") throw new Error("warns " + JSON.stringify(warns));
    });
  } finally {
    window.chrome = realChrome;
    window.fetch = realFetch;
    const summary = document.createElement("h2");
    summary.textContent = `Results: ${pass} pass, ${fail} fail`;
    root.insertBefore(summary, root.firstChild);
  }
})();
</script>
</body></html>
