async function fixture({ realRuntime = false } = {}) {
  const env = await getSharedSendRealm(realRuntime);
  const { w, d, gearHtml, onChangedListeners, setActiveState } = env;
  let _includeAsk = false;

    settings: { exportTargets: { github: { enabled: true, token: "first" } } },
    flags: { optSyncEnabled: false, syncApiKeys: false },
    markdown: "Fixture body",
    get includeAsk() { return _includeAsk; },
    set includeAsk(v) {
      _includeAsk = !!v;
      if (_expAskEl) _expAskEl.setAttribute("aria-pressed", _includeAsk ? "true" : "false");
    },
    askSnapshot: { url: "https://fixture.test/article", account: "qa", title: "Fixture", rounds: [{ q: "Question", a: "Answer" }], count: 1 },
    sendGuardWaits: [], ownerReads: [], askReads: [], requests: [], networkWaits: [], copied: [],
    composed: [], reads: [], lastReads: [], listeners: onChangedListeners, sends: [], sendWaits: [], permissionWaits: [], lastWrites: [], optionsTabs: []
  };
  setActiveState(state);
  w.__PBP_readerTestHooks.resetSendMenuForTest();
  await w.__PBP_readerTestHooks.setupSendMenu();

  return {
    refresh: () => w.__PBP_readerTestHooks.setupSendMenu(),
    retireArticle: () => w.__PBP_readerTestHooks.bumpArticleRevision(),
    w,
    realm: env.realm,
    gearHtml,
    state,
    d,
    click: () => d.getElementById("send-primary").click(),
    changed: async (changes, area = "local") => {
      await Promise.all(onChangedListeners.map(fn => fn(changes, area)));
      await settle();
    },

      w.__PBP_readerTestHooks.resetSendMenuForTest();
      setActiveState(null);
    },
  };

async function test(name, fn, options) {

  finally { if (f) f.close(); }
  document.getElementById("results").appendChild(row);
}

  await test("same-slot pbpVideoCommitTranscript refuses overwrite on ownership read failure and concurrent writer race", async () => {
    const slotKey = "md_preview_data_fixture";
    const sharedMock = pbpChromeMock.create({
      storage: {
        local: {
          [slotKey]: {
            url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ",
            title: "Video Fixture",
            markdown: "Initial description",
            contentHtml: "",
            source: "local",
            account: "qa",
            tags: [],
            description: "",
            ts: 1000,
          },
        },
      },
    });
    const shareChrome = { beforeScripts(win) { win.chrome = sharedMock.chrome; } };
    const tabA = await pbpSwRealm.bootReader(shareChrome);
    await new Promise(r => setTimeout(r, 5));
    const tabB = await pbpSwRealm.bootReader(shareChrome);
    try {
      const okB = await tabB.win.pbpVideoCommitTranscript("# Tab B AI Transcript\n\nCue B.", "Video Fixture", { aiPunct: true, reason: "video-ai-punctuation" });
      assert(okB === true, "Tab B commit should succeed");
      const savedB = (await sharedMock.chrome.storage.local.get(slotKey))[slotKey];
      assert(savedB && savedB.videoAiPunct === true && savedB.markdown.includes("Tab B AI Transcript"), "Tab B transcript missing");

      // Probe 1: Tab A's ownership read fails once -> must fail closed, never overwrite Tab B's slot.
      const origGet = sharedMock.chrome.storage.local.get.bind(sharedMock.chrome.storage.local);
      let failOnce = true;
      sharedMock.chrome.storage.local.get = async (keys) => {
        if (failOnce && keys === slotKey) { failOnce = false; throw new Error("transient IPC failure"); }
        return origGet(keys);
      };
      const resReadFail = await tabA.win.pbpVideoCommitTranscript("# Tab A Stale Track\n\nCue A.", "Video Fixture", { reason: "video-track-switch" });
      sharedMock.chrome.storage.local.get = origGet;
      const afterReadFail = (await sharedMock.chrome.storage.local.get(slotKey))[slotKey];
      assert(resReadFail === false, "Tab A commit must return false when ownership read fails");
      assert(afterReadFail.nonce === savedB.nonce && afterReadFail.videoAiPunct === true && afterReadFail.markdown.includes("Tab B AI Transcript"), "Tab A overwrote Tab B on ownership read failure");

      // Probe 2: Two fresh duplicated tabs race concurrently on the same slot; the older tab started first must not clobber the newer tab's commit.
      await sharedMock.chrome.storage.local.set({
        [slotKey]: {
          url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ",
          title: "Video Fixture",
          markdown: "Fresh description",
          contentHtml: "",
          source: "local",
          account: "qa",
          tags: [],
          description: "",
          ts: Date.now(),
        },
      });
      const raceOld = await pbpSwRealm.bootReader(shareChrome);
      await new Promise(r => setTimeout(r, 5));
      const raceNew = await pbpSwRealm.bootReader(shareChrome);
      try {
        // Mutation-proof lock check: pause raceNew inside its ownership get(slotKey) and verify
        // (1) browser Web Lock "pbp-preview-slot:md_preview_data_fixture" is held, and
        // (2) raceOld's ownership get(slotKey) cannot start until raceNew's set completes.
        const baseGet = sharedMock.chrome.storage.local.get.bind(sharedMock.chrome.storage.local);
        let slotGetsDuringCommit = 0;
        let releaseNewRead = null;
        const newReadEntered = new Promise(r => {
          sharedMock.chrome.storage.local.get = async (keys) => {
            if (keys === slotKey) {
              slotGetsDuringCommit++;
              if (slotGetsDuringCommit === 1) {
                const ans = await baseGet(keys);
                r();
                await new Promise(res => { releaseNewRead = res; });
                return ans;
              }
            }
            return baseGet(keys);
          };
        });
        const pNew = raceNew.win.pbpVideoCommitTranscript("# Newer Tab Transcript\n\nNew cue.", "Video Fixture", { aiPunct: true, reason: "video-ai-punctuation" });
        await newReadEntered;
        const pOld = raceOld.win.pbpVideoCommitTranscript("# Older Tab Transcript\n\nOld cue.", "Video Fixture", { aiPunct: false, reason: "video-track-switch" });
        await new Promise(r => setTimeout(r, 15));
        const locksNow = await navigator.locks.query();
        assert((locksNow.held || []).some(l => l.name === "pbp-preview-slot:" + slotKey), "pbpVideoCommitTranscript did not hold pbp-preview-slot Web Lock");
        assert(slotGetsDuringCommit === 1, "older tab entered slot ownership read while newer tab held the slot lock (slotGets=" + slotGetsDuringCommit + ")");
        releaseNewRead();
        const [rNew, rOld] = await Promise.all([pNew, pOld]);
        sharedMock.chrome.storage.local.get = baseGet;
        assert(rNew === true && rOld === false, "expected newer tab true and older tab false, got " + rNew + "/" + rOld);
        const finalRec = (await sharedMock.chrome.storage.local.get(slotKey))[slotKey];
        assert(finalRec.videoAiPunct === true && finalRec.markdown.includes("Newer Tab Transcript"), "concurrent older tab clobbered newer tab's transcript");
      } finally {
        raceOld.iframe.remove();
        raceNew.iframe.remove();
      }
    } finally {
      tabA.iframe.remove();
      tabB.iframe.remove();
    }
  }, { realRuntime: true });

        });
