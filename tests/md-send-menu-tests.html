<!doctype html>
<html><head><meta charset="utf-8"><title>Reader Send-to lifecycle tests</title></head><body>
<h1>Reader Send-to lifecycle tests</h1><div id="results"></div>
<script src="../shared.js"></script>
<script src="../vendor/marked.min.js"></script>
<script src="../md-convert.js"></script>
<script src="../export-targets.js"></script>
<script>
const assert = (ok, message) => { if (!ok) throw new Error(message); };
const deferred = () => {
  let resolve;
  const promise = new Promise(r => { resolve = r; });
  return { promise, resolve };
};
const tick = () => new Promise(r => setTimeout(r, 0));
async function settle() { for (let i = 0; i < 5; i++) await tick(); }
let source, sendSource;
async function fixture({ realRuntime = false } = {}) {
  const frame = document.createElement("iframe");
  document.body.appendChild(frame);
  const w = frame.contentWindow, d = w.document;
  d.body.innerHTML = '<div id="send-split"><button id="send-primary"><span id="send-primary-ic"></span><span id="send-primary-label" class="btn-label"></span></button><button id="send-caret"></button><div id="send-menu" hidden></div></div><div id="send-status" hidden></div><div id="copy-status"></div>';
  const state = {
    settings: { exportTargets: { github: { enabled: true, token: "first" } } },
    flags: { optSyncEnabled: false, syncApiKeys: false },
    markdown: "Fixture body", includeAsk: false,
    askSnapshot: { url: "https://fixture.test/article", account: "qa", title: "Fixture", rounds: [{ q: "Question", a: "Answer" }], count: 1 },
    sendGuardWaits: [], ownerReads: [], askReads: [], requests: [], networkWaits: [], copied: [],
    reads: [], lastReads: [], listeners: [], sends: [], sendWaits: [], permissionWaits: [], lastWrites: [], optionsTabs: []
  };
  const params = {
    exportSettings: {},
    previewAccount: "qa", _articleRevision: 0, exportAskRevision: 0,
    exportScope: "article", expIncludeAsk: {}, expIncludeHl: null, pbpExpTglOn: () => state.includeAsk,
    url: "https://fixture.test/article", title: "Fixture",
    pbpAskExportSnapshot: async () => state.askReads.length ? state.askReads.shift().promise : structuredClone(state.askSnapshot),
    SETTINGS_DEFAULTS: { pinboardToken: "" },
    pbpPinboardAccountFromToken: token => String(token || "").split(":")[0],
    PBP_EXPORT_TARGETS,
    pbpExportTargetIds,
    pbpReadSettingsWithSecrets: async defaults => {
      if (Object.hasOwn(defaults, "pinboardToken") && state.ownerReads.length) return state.ownerReads.shift().promise;
      return state.reads.length ? state.reads.shift().promise : ({ pinboardToken: "qa:key", ...structuredClone(state.settings) });
    },
    pbpReadSecretSyncState: async () => ({ ...state.flags }),
    pbpSettingsAreaName: async () => state.flags.optSyncEnabled ? "sync" : "local",
    pbpGetLastTarget: async () => state.lastReads.length ? state.lastReads.shift().promise : "github",
    pbpSetLastTarget: async () => state.lastWrites.length ? state.lastWrites.shift().promise : undefined,
    pbpRequestTargetPermission: async () => state.permissionWaits.length ? state.permissionWaits.shift().promise : true,
    pbpSendToTarget: async (id, ctx, options) => {
      if (state.sendGuardWaits.length) await state.sendGuardWaits.shift().promise;
      if (!await options.isCurrent()) return { ok: false, error: "context_changed" };
      state.sends.push({ id, ctx });
      return state.sendWaits.length ? state.sendWaits.shift().promise : { ok: true, fellBack: false };
    },
    buildMeta: () => ({ title: "Fixture", url: "https://fixture.test/article" }),
    buildExportOpts: () => ({ imagePolicy: "keep" }),
    composeExport: body => body,
    getViewMarkdown: () => state.markdown,
    imgFixExportNote: () => {},
    PBP_ICONS: { gear: "<svg data-ic=gear></svg>" },
    pbpOpenOptionsTab: tab => state.optionsTabs.push(tab),
    t: key => key === "mdSendTo" ? "Send to {name}" : key,
    chrome: { storage: { onChanged: { addListener: fn => state.listeners.push(fn) } } }
  };
  if (realRuntime) {
    // Run the production sender, including its output-boundary guard. Only the
    // browser APIs and remote responses are fixtures; no mock decides whether
    // a stale send is allowed to reach POST or the clipboard.
    params.chrome.permissions = { request: async () => true, contains: async () => true };
    const fetchFixture = async (url, opts) => {
      state.requests.push({ url, ...opts });
      if (state.networkWaits[0]?.method === opts.method) return state.networkWaits.shift().wait.promise;
      if (opts.method === "GET") return { ok: true, status: 200 };
      if (url === "https://api.notion.com/v1/pages") {
        return { ok: true, status: 200, json: async () => ({ object: "page", id: "fixture-created", url: "https://fixture.test/created" }) };
      }
      return { ok: true, status: 201, json: async () => ({ id: "fixture-created", html_url: "https://fixture.test/created" }) };
    };
    const runtime = new w.Function("PBP_EXPORT_TARGETS", "pbpBuildFileBody", "deobfuscateKey", "chrome", "fetch", "navigator",
      sendSource + "\nreturn { pbpSendToTarget, pbpRequestTargetPermission };")(
      PBP_EXPORT_TARGETS, pbpBuildFileBody, deobfuscateKey, params.chrome, fetchFixture,
      { clipboard: { writeText: async body => { state.copied.push(body); } } });
    params.pbpSendToTarget = runtime.pbpSendToTarget;
    params.pbpRequestTargetPermission = runtime.pbpRequestTargetPermission;
  }
  const begin = source.indexOf("  let _sendMenuCtl = null;");
  const end = source.indexOf("\n})().catch", begin);
  assert(begin >= 0 && end > begin, "production Send-to lifecycle block missing");
  const flashStart = source.indexOf("function flashButtonLabel(");
  const flashEnd = source.indexOf("\n// renderMarkdown", flashStart);
  const captureStart = source.indexOf("  function captureExportJob()");
  const captureEnd = source.indexOf("  function updateExportSummary()", captureStart);
  assert(captureStart >= 0 && captureEnd > captureStart, "production export job helpers missing");
  const AsyncFunction = w.eval("(async function(){}).constructor");
  const api = await new AsyncFunction(...Object.keys(params),
    source.slice(flashStart, flashEnd) + "\n" + source.slice(captureStart, captureEnd) + "\n" + source.slice(begin, end) + "\nreturn { refresh: setupSendMenu, retireArticle: () => { _articleRevision++; } };")(...Object.values(params));
  return {
    ...api, state, d,
    click: () => d.getElementById("send-primary").click(),
    changed: async (changes, area = "local") => {
      await Promise.all(state.listeners.map(fn => fn(changes, area)));
      await settle();
    },
    close: () => frame.remove()
  };
}
let pass = 0, fail = 0;
async function test(name, fn, options) {
  const row = document.createElement("div");
  let f;
  try { f = await fixture(options); await fn(f); pass++; row.className = "pass"; row.textContent = "PASS " + name; }
  catch (e) { fail++; row.className = "fail"; row.textContent = "FAIL " + name + " — " + e.message; }
  finally { if (f) f.close(); }
  document.getElementById("results").appendChild(row);
}
(async () => {
  source = await (await fetch("../md-preview.js")).text();
  sendSource = await (await fetch("../md-export-send.js")).text();
  await test("empty state names the settings action: label, gear, no caret, click opens settings", async f => {
    f.state.settings = { exportTargets: {} }; await f.refresh();
    const p = f.d.getElementById("send-primary");
    assert(f.d.getElementById("send-primary-label").textContent === "mdSendSetupEllipsis", "label is not the setup key");
    assert(f.d.getElementById("send-primary-ic").querySelector("svg[data-ic=gear]"), "gear icon missing");
    assert(f.d.getElementById("send-caret").hasAttribute("hidden"), "caret visible in empty state");
    assert(p.title === "mdSendNoneConfigured", "supplementary title lost");
    f.click(); await settle();
    assert(f.state.optionsTabs.length === 1 && f.state.optionsTabs[0] === "markdown" && f.state.sends.length === 0, "click did not go to settings");
  });
  await test("leaving the empty state restores target label, icon and caret", async f => {
    f.state.settings = { exportTargets: {} }; await f.refresh();
    f.state.settings = { exportTargets: { notebooklm: { enabled: true } } }; await f.refresh();
    const label = f.d.getElementById("send-primary-label").textContent;
    assert(label.startsWith("Send to ") && label !== "mdSendSetupEllipsis", "label not restored: " + label);
    assert(!f.d.querySelector("#send-primary-ic svg[data-ic=gear]") , "gear survived");
    assert(!f.d.getElementById("send-caret").hasAttribute("hidden"), "caret still hidden");
    assert(!f.d.getElementById("send-split").classList.contains("send-empty"), "send-empty survived");
    f.click(); await settle();
    assert(f.state.optionsTabs.length === 0 && f.state.sends.length === 1, "old settings click handler survived");
  });
  await test("normal send captures configured target and article", async f => {
    f.click(); await settle();
    assert(f.state.sends.length === 1 && f.state.sends[0].id === "github"
      && f.state.sends[0].ctx.cfg.token === "first" && f.state.sends[0].ctx.rawBody === "Fixture body", "wrong outbound clip");
  });
  await test("permission wait retains the captured article view", async f => {
    const wait = deferred(); f.state.permissionWaits.push(wait);
    f.click(); await settle(); f.state.markdown = "Replacement view";
    wait.resolve(true); await settle();
    assert(f.state.sends.length === 1 && f.state.sends[0].ctx.rawBody === "Fixture body", "view changed inside pending export");
  });
  await test("article replacement cancels a pending export", async f => {
    const wait = deferred(); f.state.permissionWaits.push(wait);
    f.click(); await settle(); f.retireArticle(); wait.resolve(true); await settle();
    assert(f.state.sends.length === 0, "obsolete article escaped");
    assert(f.d.getElementById("send-status").textContent === "mdExportContextChanged", "missing context feedback");
  });
  await test("fresh credential owner cancels even before storage event arrives", async f => {
    const wait = deferred(); f.state.permissionWaits.push(wait);
    f.click(); await settle(); f.state.settings.pinboardToken = "bob:new";
    wait.resolve(true); await settle();
    assert(f.state.sends.length === 0, "previous owner's export escaped before storage event");
    assert(f.d.getElementById("send-status").textContent === "mdExportContextChanged", "missing account feedback");
  });
  await test("another reader deleting persisted history cancels captured Q&A", async f => {
    f.state.includeAsk = true;
    const wait = deferred(); f.state.sendGuardWaits.push(wait);
    f.click(); await settle();
    // No local history event: another extension page committed this deletion.
    f.state.askSnapshot = { ...f.state.askSnapshot, rounds: [], count: 0 };
    wait.resolve(); await settle();
    assert(f.state.sends.length === 0, "deleted conversation escaped from old snapshot");
    assert(f.d.getElementById("send-status").textContent === "mdExportContextChanged", "missing deletion feedback");
  });
  await test("double click shares one pending send", async f => {
    const wait = deferred(); f.state.sendWaits.push(wait);
    f.click(); await settle(); f.click(); await settle();
    const count = f.state.sends.length; wait.resolve({ ok: true }); await settle();
    assert(count === 1, "duplicate dispatch");
  });
  await test("settings refresh cannot reset pending-send guard", async f => {
    const wait = deferred(); f.state.sendWaits.push(wait);
    f.click(); await settle(); await f.refresh(); f.click(); await settle();
    const count = f.state.sends.length; wait.resolve({ ok: true }); await settle();
    assert(count === 1, "refresh allowed a second dispatch");
  });
  await test("completed old send cannot restore a disabled primary target", async f => {
    const wait = deferred(); f.state.sendWaits.push(wait);
    f.click(); await settle();
    f.state.settings = { exportTargets: { notebooklm: { enabled: true } } }; await f.refresh();
    wait.resolve({ ok: true }); await settle();
    assert(f.d.getElementById("send-primary").dataset.targetId === "notebooklm", "old completion restored GitHub");
  });
  await test("late settings read cannot re-enable a removed target", async f => {
    const read = deferred(); f.state.reads.push(read);
    const old = f.refresh(); await settle();
    f.state.settings = { exportTargets: {} }; await f.refresh();
    read.resolve({ exportTargets: { github: { enabled: true, token: "stale" } } }); await old;
    assert(f.d.getElementById("send-split").classList.contains("send-empty"), "stale settings replaced latest menu");
  });
  await test("late last-target read cannot replace latest menu", async f => {
    const read = deferred(); f.state.lastReads.push(read);
    const old = f.refresh(); await settle();
    f.state.settings = { exportTargets: { notebooklm: { enabled: true } } }; await f.refresh();
    read.resolve("github"); await old;
    assert(f.d.getElementById("send-primary").dataset.targetId === "notebooklm"
      && !f.d.querySelector('.send-mi[data-target-id="github"]'), "old preference read replaced latest menu");
  });
  await test("local secret changes refresh a sync-routed menu", async f => {
    f.state.flags.optSyncEnabled = true;
    f.state.settings.exportTargets.github.token = "second";
    await f.changed({ exportTargets: { newValue: f.state.settings.exportTargets } }, "local");
    f.click(); await settle();
    assert(f.state.sends[0]?.ctx.cfg.token === "second", "old local secret was sent");
  });
  await test("local webhook capability changes refresh a sync-routed menu", async f => {
    f.state.settings = { exportTargets: { webhook: { enabled: true, url: "https://fixture.test/first" } } };
    await f.refresh();
    f.state.flags.optSyncEnabled = true;
    f.state.settings.exportTargets.webhook.url = "https://fixture.test/second";
    await f.changed({ exportTargets: { newValue: f.state.settings.exportTargets } }, "local");
    f.click(); await settle();
    assert(f.state.sends[0]?.ctx.cfg.url === "https://fixture.test/second", "old capability URL was retained");
  });
  await test("foreign sync changes do not replace local menu", async f => {
    f.state.settings = { exportTargets: {} };
    await f.changed({ exportTargets: { newValue: {} } }, "sync");
    assert(!f.d.getElementById("send-split").classList.contains("send-empty"), "foreign sync rerendered local menu");
  });
  await test("local shadow is ignored while credentials sync", async f => {
    f.state.flags = { optSyncEnabled: true, syncApiKeys: true };
    f.state.settings = { exportTargets: {} };
    await f.changed({ exportTargets: { newValue: {} } }, "local");
    assert(!f.d.getElementById("send-split").classList.contains("send-empty"), "local shadow rerendered cloud menu");
  });
  await test("device routing switch rebuilds the menu", async f => {
    f.state.flags.optSyncEnabled = true; f.state.settings = { exportTargets: {} };
    await f.changed({ optSyncEnabled: { newValue: true } }, "local");
    assert(f.d.getElementById("send-split").classList.contains("send-empty"), "route switch was ignored");
  });
  await test("refresh before permission resolves cancels obsolete send", async f => {
    const wait = deferred(); f.state.permissionWaits.push(wait);
    f.click(); await settle(); f.state.settings = { exportTargets: {} }; await f.refresh();
    wait.resolve(true); await settle();
    assert(f.state.sends.length === 0, "disabled target was dispatched after permission wait");
  });
  await test("obsolete feedback timer cannot revert the new target label", async f => {
    f.click(); await settle();
    f.state.settings = { exportTargets: { notebooklm: { enabled: true } } }; await f.refresh();
    await new Promise(r => setTimeout(r, 1600));
    assert(f.d.getElementById("send-primary-label").textContent === "Send to NotebookLM", "old timer restored the previous label");
  });
  await test("send failure releases guard for explicit retry", async f => {
    const wait = deferred(); f.state.sendWaits.push(wait);
    f.click(); await settle(); wait.resolve({ ok: false, error: "api-down" }); await settle();
    f.click(); await settle();
    assert(f.state.sends.length === 2, "failure permanently blocked retry");
  });
  await test("switching destinations before feedback expires preserves the new label", async f => {
    f.state.settings.exportTargets.notebooklm = { enabled: true }; await f.refresh();
    f.click(); await settle();
    f.d.querySelector('.send-mi[data-target-id="notebooklm"]').click(); await settle();
    await new Promise(r => setTimeout(r, 1600));
    assert(f.d.getElementById("send-primary-label").textContent === "Send to NotebookLM", "previous destination feedback restored the wrong label");
  });
  await test("successful retry clears the previous error status", async f => {
    const wait = deferred(); f.state.sendWaits.push(wait);
    f.click(); await settle(); wait.resolve({ ok: false, error: "api-down" }); await settle();
    f.click(); await settle();
    const status = f.d.getElementById("send-status");
    assert(status.hidden || !status.classList.contains("error"), "successful retry still displays the previous failure");
  });
  await test("obsolete last-target write cannot dispatch removed destination", async f => {
    const wait = deferred(); f.state.lastWrites.push(wait);
    f.click(); await settle(); f.state.settings = { exportTargets: {} }; await f.refresh();
    wait.resolve(); await settle();
    assert(f.state.sends.length === 0, "obsolete send continued after preference write");
  });
  await test("detached menu items cannot dispatch disabled destinations", async f => {
    const old = f.d.querySelector('.send-mi[data-target-id="github"]');
    f.state.settings = { exportTargets: {} }; await f.refresh();
    old.click(); await settle();
    assert(f.state.sends.length === 0, "old menu listener sent to disabled destination");
  });
  await test("production runtime sends the current clip through precheck and POST", async f => {
    f.click(); await settle();
    assert(f.state.requests.map(r => r.method).join(",") === "GET,POST", "production request chain did not run");
    const body = JSON.parse(f.state.requests[1].body);
    assert(Object.values(body.files)[0].content.includes("Fixture body") && body.public === false, "wrong Gist content");
    assert(f.d.querySelector('#send-status a[href="https://fixture.test/created"]'), "current success receipt missing");
  }, { realRuntime: true });
  for (const id of ["github", "notion"]) {
    await test(id + " disabled during precheck cannot POST or replace current status", async f => {
      f.state.settings = { exportTargets: { [id]: { enabled: true, token: "first", parent: "0123456789abcdef0123456789abcdef" } } };
      await f.refresh();
      const wait = deferred(); f.state.networkWaits.push({ method: "GET", wait });
      f.click(); await settle();
      assert(f.state.requests.length === 1 && f.state.requests[0].method === "GET", "precheck did not start");
      f.state.settings = { exportTargets: {} }; await f.refresh();
      const status = f.d.getElementById("send-status"); status.textContent = "Current menu status";
      wait.resolve({ ok: true, status: 200 }); await settle();
      assert(f.state.requests.length === 1 && f.state.copied.length === 0, "disabled target emitted the private body");
      assert(status.textContent === "Current menu status", "obsolete send overwrote current status");
      assert(f.d.getElementById("send-primary-label").textContent === "mdSendSetupEllipsis", "obsolete send changed the current label");
    }, { realRuntime: true });
  }
  await test("changed Notion configuration cancels old POST and permits a new explicit send", async f => {
    f.state.settings = { exportTargets: { notion: { enabled: true, token: "first", parent: "0123456789abcdef0123456789abcdef" } } };
    await f.refresh();
    const wait = deferred(); f.state.networkWaits.push({ method: "GET", wait });
    f.click(); await settle();
    f.state.settings.exportTargets.notion.parent = "ffffffffffffffffffffffffffffffff";
    await f.refresh(); f.click(); await settle();
    assert(f.state.requests.length === 1, "menu refresh reset the pending-send guard");
    wait.resolve({ ok: true, status: 200 }); await settle();
    assert(f.state.requests.length === 1, "old parent received a POST");
    f.click(); await settle();
    const posts = f.state.requests.filter(r => r.method === "POST");
    assert(posts.length === 1 && JSON.parse(posts[0].body).parent.page_id === "ffffffff-ffff-ffff-ffff-ffffffffffff", "retry did not use the new parent");
  }, { realRuntime: true });
  await test("target invalidation during an owner read is checked again before POST", async f => {
    const precheck = deferred(); f.state.networkWaits.push({ method: "GET", wait: precheck });
    f.click(); await settle();
    const owner = deferred(); f.state.ownerReads.push(owner);
    precheck.resolve({ ok: true, status: 200 }); await settle();
    assert(f.state.ownerReads.length === 0, "owner read did not pause the output guard");
    f.state.settings = { exportTargets: {} }; await f.refresh();
    owner.resolve({ pinboardToken: "qa:key" }); await settle();
    assert(f.state.requests.length === 1 && f.state.copied.length === 0, "guard reused the target state from before its await");
  }, { realRuntime: true });
  await test("target invalidation during Q&A preparation leaves the new menu untouched", async f => {
    f.state.includeAsk = true;
    const ask = deferred(); f.state.askReads.push(ask);
    f.click(); await settle();
    assert(f.state.askReads.length === 0, "Q&A preparation did not start");
    f.state.settings = { exportTargets: {} }; await f.refresh();
    const status = f.d.getElementById("send-status"); status.textContent = "Current menu status";
    ask.resolve(structuredClone(f.state.askSnapshot)); await settle();
    assert(f.state.requests.length === 0 && f.state.copied.length === 0, "obsolete prepared content escaped");
    assert(status.textContent === "Current menu status" && f.d.getElementById("send-primary-label").textContent === "mdSendSetupEllipsis", "obsolete preparation changed new UI");
  }, { realRuntime: true });
  for (const statusCode of [201, 500]) {
    await test("obsolete POST " + statusCode + " completion cannot publish feedback or fallback", async f => {
      const wait = deferred(); f.state.networkWaits.push({ method: "POST", wait });
      f.click(); await settle();
      assert(f.state.requests.length === 2, "POST did not start");
      f.state.settings = { exportTargets: { notebooklm: { enabled: true } } }; await f.refresh();
      const status = f.d.getElementById("send-status"); status.textContent = "Current menu status";
      wait.resolve({ ok: statusCode === 201, status: statusCode, json: async () => ({ id: "old", html_url: "https://fixture.test/old" }) }); await settle();
      assert(status.textContent === "Current menu status" && !status.querySelector("a"), "old completion published feedback");
      assert(f.state.copied.length === 0, "old failure copied a stale private fallback");
    }, { realRuntime: true });
  }
  for (const change of ["owner", "article", "ask"]) {
    await test("production runtime retains the " + change + " guard while precheck waits", async f => {
      f.state.includeAsk = change === "ask";
      const wait = deferred(); f.state.networkWaits.push({ method: "GET", wait });
      f.click(); await settle();
      assert(f.state.requests.length === 1, "precheck did not start");
      if (change === "owner") f.state.settings.pinboardToken = "bob:new";
      else if (change === "article") f.retireArticle();
      else f.state.askSnapshot = { ...f.state.askSnapshot, rounds: [], count: 0 };
      wait.resolve({ ok: true, status: 200 }); await settle();
      assert(f.state.requests.length === 1 && f.state.copied.length === 0, "stale " + change + " content escaped");
      assert(f.d.getElementById("send-status").textContent === "mdExportContextChanged", "missing context feedback");
    }, { realRuntime: true });
  }
  document.title = (fail ? "FAIL" : "PASS") + " Reader Send-to lifecycle tests";
})().catch(e => { const row = document.createElement("div"); row.className = "fail"; row.textContent = e.stack; document.getElementById("results").appendChild(row); });
</script></body></html>
