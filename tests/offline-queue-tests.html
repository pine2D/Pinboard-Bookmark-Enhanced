<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Offline Queue Tests</title>
<style>
body { font-family: monospace; padding: 16px; max-width: 1000px; }
h2 { margin-top: 24px; font-size: 16px; }
.suite { margin: 12px 0; padding: 8px; border-left: 3px solid #ccc; }
.case { padding: 4px 8px; margin: 4px 0; }
.pass { color: #0a0; background: #f0fff0; }
.fail { color: #c00; background: #fff0f0; font-weight: bold; }
</style></head>
<body>
<h1>offlineQueue reducer Tests</h1>
<div id="results"></div>
<script src="../shared.js"></script>
<script>
async function test(name, fn) {
  try { await fn();
    const div = document.createElement("div"); div.className = "case pass";
    div.textContent = "PASS " + name; document.getElementById("results").appendChild(div);
  } catch (e) {
    const div = document.createElement("div"); div.className = "case fail";
    div.textContent = "FAIL " + name + "\n  " + e.message; document.getElementById("results").appendChild(div);
  }
}
function assert(cond, msg) { if (!cond) throw new Error(msg || "assertion failed"); }
async function suite(name, fn) {
  const div = document.createElement("div"); div.className = "suite";
  const h = document.createElement("h2"); h.textContent = name; div.appendChild(h);
  const results = document.getElementById("results"); const savedAppend = results.appendChild;
  results.appendChild = function(el) { if (el.className?.includes("case")) div.appendChild(el); else savedAppend.call(results, el); };
  await fn(); results.appendChild = savedAppend; results.appendChild(div);
}

// Exercise the production queue serializer, normalizer and intent validator.
async function queueIntentHarness() {
  const source = await (await fetch("../background.js")).text();
  const block = (startText, endText) => {
    const start = source.indexOf(startText);
    const end = source.indexOf(endText, start);
    assert(start >= 0 && end > start, "queue intent source block not found");
    return source.slice(start, end);
  };
  return new Function("pbpPinboardAccountFromToken", `
    const PBP_SAVE_MODES = new Set(["create", "update", "merge", "overwrite", "skip"]);
    ${block("function pbpSaveFailure(", "// Delivery-time merge/skip decisions")}
    ${block("function normalizeOfflineSaveIntent(", "// pinboardFetch serializes")}
    ${block("function queueRecordFromSaveIntent(", "function submitSaveIntent(")}
    return { validateSaveIntent, normalizeOfflineSaveIntent, queueRecordFromSaveIntent };
  `)(pbpPinboardAccountFromToken);
}
const SAVE_INTENT = Object.freeze({ mode: "create", url: "https://example.com/a", title: "Title",
  notes: "Note", tags: "tag", private: false, toread: true, archive: false });

const Q = () => ([
  { queueId: "a", url: "https://a.com" },
  { queueId: "b", url: "https://b.com" },
  { queueId: "c", url: "https://c.com" },
]);

// The popup's queue bar (popup-offline.js) on real DOM, answered by a stub
// worker. Returns the bar text and, once expanded, each row's meta line.
let popupOfflineSource;
async function renderQueueBar(response) {
  popupOfflineSource ||= await (await fetch("../popup-offline.js")).text();
  const host = document.createElement("div");
  host.innerHTML = '<div id="oq-bar" class="hidden"><span id="oq-text"></span><button id="oq-toggle" aria-expanded="false"></button></div><div id="oq-list" class="hidden"></div>';
  document.body.appendChild(host);
  const ids = { "offline-queue-bar": "oq-bar", "offline-queue-text": "oq-text", "offline-queue-toggle": "oq-toggle", "offline-queue-list": "oq-list" };
  const byId = (id) => host.querySelector("#" + (ids[id] || id));
  const tr = (key, ...args) => args.length ? key + ":" + args.join(":") : key;
  const chromeStub = {
    runtime: { lastError: null, sendMessage: (message, callback) => callback(message.type === "get_offline_queue" ? response : null) },
    storage: { local: { get: async () => ({}) }, onChanged: { addListener() {} } },
  };
  const win = {};
  new Function("window", "chrome", "$id", "t", popupOfflineSource)(win, chromeStub, byId, tr);
  win.PPOffline.init();
  await win.PPOffline.refresh();
  const text = byId("offline-queue-text").textContent;
  byId("offline-queue-toggle").dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true }));
  for (let i = 0; i < 20 && !byId("offline-queue-list").querySelector(".offline-queue-item"); i++) await new Promise((r) => setTimeout(r, 0));
  const rows = [...byId("offline-queue-list").querySelectorAll(".offline-queue-item")].map((row) => ({
    id: row.dataset.queueId, meta: row.querySelector(".offline-queue-meta").textContent, html: row.outerHTML }));
  host.remove();
  return { text, rows };
}

(async () => {
await suite("offline queue", async () => {
  await test("remove drops only the matching queueId", () => {
    const out = pbpOfflineQueueReduce(Q(), { kind: "remove", queueId: "b" });
    assert(out.length === 2, "should drop one");
    assert(!out.some(i => i.queueId === "b"), "b removed");
    assert(out[0].queueId === "a" && out[1].queueId === "c", "order preserved");
  });
  await test("remove of unknown id is a no-op (new array, same contents)", () => {
    const input = Q();
    const out = pbpOfflineQueueReduce(input, { kind: "remove", queueId: "zzz" });
    assert(out.length === 3, "nothing dropped");
    assert(out !== input, "returns a NEW array, never mutates input");
  });
  await test("clear returns empty array", () => {
    assert(pbpOfflineQueueReduce(Q(), { kind: "clear" }).length === 0, "cleared");
  });
  await test("enqueue appends item", () => {
    const out = pbpOfflineQueueReduce(Q(), { kind: "enqueue", item: { queueId: "d", url: "https://d.com" } });
    assert(out.length === 4 && out[3].queueId === "d", "appended at tail");
  });
  await test("enqueue does not duplicate an existing queueId", () => {
    const out = pbpOfflineQueueReduce(Q(), { kind: "enqueue", item: { queueId: "a", url: "https://a.com" } });
    assert(out.length === 3, "no duplicate for same queueId");
  });
  await test("skip_to_merge turns only the named skip (or modeless legacy) item into a merge", () => {
    const input = [
      { queueId: "a", mode: "skip", url: "https://a.com", tags: "t" },
      { queueId: "b", mode: "skip", url: "https://b.com" },
      { queueId: "c", url: "https://c.com" },
    ];
    const out = pbpOfflineQueueReduce(input, { kind: "skip_to_merge", queueId: "a" });
    assert(JSON.stringify(out) === JSON.stringify([{ ...input[0], mode: "merge" }, input[1], input[2]]), "only a changes, every other field kept");
    assert(input[0].mode === "skip", "input not mutated");
    assert(pbpOfflineQueueReduce(input, { kind: "skip_to_merge", queueId: "c" })[2].mode === "merge", "legacy modeless item pinned to merge");
    for (const mode of ["merge", "update", "overwrite", "create"]) {
      const kept = pbpOfflineQueueReduce([{ queueId: "a", mode }], { kind: "skip_to_merge", queueId: "a" });
      assert(kept[0].mode === mode, mode + " stays " + mode);
    }
    assert(JSON.stringify(pbpOfflineQueueReduce(input, { kind: "skip_to_merge", queueId: "zzz" })) === JSON.stringify(input), "unknown id is a no-op");
  });
  await test("new queue payload does not persist credentials", () => {
    const out = pbpOfflineQueueReduce([], { kind: "enqueue", item: { queueId: "a", account: "alice", url: "https://a.com", token: "secret" } });
    assert(out.length === 1 && !("token" in out[0]), "new item strips token");
    assert(out[0].account === "alice", "non-secret account binding preserved");
  });
  await test("summary round-trips through the queue with only its whitelisted field added", async () => {
    const h = await queueIntentHarness();
    const prepared = { ...SAVE_INTENT, summary: "  Description\nsecond line  ", token: "discard", sharingEnabled: true,
      gateway: { token: "discard" }, connectionCapabilities: { sharing: true } };
    const record = { ...h.queueRecordFromSaveIntent(prepared, "alice:fixture", "linkding"), queueId: "summary", queuedAt: 123 };
    const queue = pbpOfflineQueueReduce([], { kind: "enqueue", item: record });
    const expectedKeys = ["account", "mode", "url", "title", "notes", "summary", "tags", "private", "toread", "archive", "time", "queueId", "queuedAt"].sort();
    assert(JSON.stringify(Object.keys(queue[0]).sort()) === JSON.stringify(expectedKeys), "only the exact queue whitelist is persisted");
    const normalized = h.normalizeOfflineSaveIntent(queue[0], {});
    assert(normalized.summary === prepared.summary, "description is preserved verbatim");
    assert(normalized.notes === SAVE_INTENT.notes && normalized.mode === "merge", "notes and create replay semantics preserved");
    assert(h.validateSaveIntent(normalized) === null, "round-tripped intent is valid");
    assert(queue[0].account === "alice", "non-secret owner binding preserved");
  });
  await test("optional explicit sharing round-trips and rejects nonboolean queue fields", async () => {
    const h=await queueIntentHarness();
    for(const sharedExplicit of [undefined,false,true,"true",1,null]) {
      const prepared={...SAVE_INTENT,...(sharedExplicit===undefined?{}:{sharedExplicit})};
      const record=h.queueRecordFromSaveIntent(prepared,"alice:fixture");
      const expected=["account","mode","url","title","notes","tags","private","toread","archive","time",...(sharedExplicit===undefined?[]:["sharedExplicit"])].sort();
      assert(JSON.stringify(Object.keys(record).sort())===JSON.stringify(expected),"sharing widened the queue whitelist");
      const restored=h.normalizeOfflineSaveIntent(record,{});
      assert(restored.sharedExplicit===sharedExplicit,"sharing provenance lost");
      assert((h.validateSaveIntent(restored)===null)===(sharedExplicit===undefined||typeof sharedExplicit==="boolean"),"invalid marker accepted");
    }
  });
  // Missing means the extension could not tell (linkding fills it in); ""
  // means it knows there is none. The two must survive the queue apart.
  await test("optional summary keeps missing and empty apart through the queue", async () => {
    const h = await queueIntentHarness();
    for (const summary of [undefined, ""]) {
      const prepared = { ...SAVE_INTENT, ...(summary === undefined ? {} : { summary }) };
      assert(h.validateSaveIntent(prepared) === null, "legacy and empty descriptions remain valid");
      const record = { ...h.queueRecordFromSaveIntent(prepared, "alice:fixture", "linkding"), queueId: "q", queuedAt: 1 };
      const stored = JSON.parse(JSON.stringify(pbpOfflineQueueReduce([], { kind: "enqueue", item: record })[0]));
      const expectedKeys = ["account", "mode", "url", "title", "notes", ...(summary === undefined ? [] : ["summary"]), "tags", "private", "toread", "archive", "queueId", "queuedAt"].sort();
      assert(JSON.stringify(Object.keys(stored).sort()) === JSON.stringify(expectedKeys), "queued fields for " + JSON.stringify(summary) + ": " + Object.keys(stored).sort().join());
      for (const restored of [h.normalizeOfflineSaveIntent(record, {}), h.normalizeOfflineSaveIntent(stored, {})]) {
        assert(Object.hasOwn(restored, "summary") === (summary !== undefined) && restored.summary === summary, "replay turned " + JSON.stringify(summary) + " into " + JSON.stringify(restored.summary));
        assert(h.validateSaveIntent(restored) === null, "optional description survives normalization");
      }
    }
  });
  // linkding is the one service whose Description the extension writes.
  // Another service's summary (Karakeep's AI summary on the server record) is
  // never a queue field, whatever intent carried it that far.
  await test("only a linkding queue record keeps a Description", async () => {
    const h = await queueIntentHarness();
    for (const service of ["linkding", "karakeep", "pinboard", undefined]) for (const summary of ["Server summary\nsecond line", ""]) {
      const stored = JSON.parse(JSON.stringify(h.queueRecordFromSaveIntent({ ...SAVE_INTENT, summary }, "alice:fixture", service)));
      const expectedKeys = ["account", "mode", "url", "title", "notes", ...(service === "linkding" ? ["summary"] : []), "tags", "private", "toread", "archive"].sort();
      assert(JSON.stringify(Object.keys(stored).sort()) === JSON.stringify(expectedKeys), String(service) + " queued " + Object.keys(stored).sort().join());
      assert(service !== "linkding" || stored.summary === summary, "the linkding Description changed in the queue");
    }
  });
  await test("non-string summary is rejected for live and queued intents", async () => {
    const h = await queueIntentHarness();
    for (const summary of [null, false, 0, [], {}, ["description"]]) {
      const prepared = { ...SAVE_INTENT, summary };
      assert(h.validateSaveIntent(prepared)?.reason === "invalid", "non-string live description must fail closed");
      const restored = h.normalizeOfflineSaveIntent(h.queueRecordFromSaveIntent(prepared, "alice:fixture", "linkding"), {});
      assert(h.validateSaveIntent(restored)?.reason === "invalid", "normalization must not hide an invalid description");
    }
  });
  await test("account helper extracts the username from raw and obfuscated tokens", () => {
    assert(pbpPinboardAccountFromToken("alice:current-token") === "alice", "raw token account extracted");
    assert(pbpPinboardAccountFromToken(obfuscateKey("alice:legacy-token")) === "alice", "legacy token account extracted");
    assert(pbpPinboardAccountFromToken("missing-separator") === "", "malformed token fails closed");
  });
  await test("rotated token replays only for the bound account", () => {
    const item = { account: "alice" };
    assert(pbpResolveOfflineQueueToken("alice:new-token", item) === "alice:new-token", "same-account current token selected");
    assert(pbpResolveOfflineQueueToken("bob:new-token", item) === "", "different account rejected");
  });
  await test("legacy token identifies its account but is never used for cross-account replay", () => {
    const item = { token: obfuscateKey("alice:legacy-token") };
    assert(pbpOfflineQueueAccount(item) === "alice", "legacy account derived");
    assert(pbpResolveOfflineQueueToken("alice:new-token", item) === "alice:new-token", "same-account rotation uses current token");
    assert(pbpResolveOfflineQueueToken("bob:new-token", item) === "", "legacy token cannot bypass current account");
  });
  await test("logout never falls back to a legacy queued token", () => {
    const item = { token: obfuscateKey("alice:legacy-token") };
    assert(pbpResolveOfflineQueueToken("", item) === "", "missing current token fails closed");
  });
  await test("tokenless unbound records always fail closed", () => {
    assert(pbpResolveOfflineQueueToken("alice:current-token", {}) === "", "unbound record rejected");
    assert(pbpResolveOfflineQueueToken("", {}) === "", "missing credentials stay empty");
  });
  await test("failed delivery remains queued and is not acknowledged as success", async () => {
    let queue = [{ queueId: "a", url: "https://a.com" }];
    let successes = 0;
    const outcomes = await pbpDrainOfflineQueue(["a"], {
      getItem: (queueId) => queue.find((item) => item.queueId === queueId) || null,
      sendItem: () => ({ result: { status: "failed", reason: "not_logged_in" } }),
      removeItem: (queueId) => { queue = pbpOfflineQueueReduce(queue, { kind: "remove", queueId }); },
      onSuccess: () => { successes++; },
    });
    assert(outcomes.length === 1 && !outcomes[0].acknowledged, "failed result is reported without acknowledgement");
    assert(queue.length === 1 && queue[0].queueId === "a", "failed item remains queued");
    assert(successes === 0, "failed delivery triggers no success callback");

    const skipped = await pbpDrainOfflineQueue(["a"], {
      getItem: (queueId) => queue.find((item) => item.queueId === queueId) || null,
      sendItem: () => ({ result: { status: "skipped" } }),
      removeItem: (queueId) => { queue = pbpOfflineQueueReduce(queue, { kind: "remove", queueId }); },
      onSuccess: () => { successes++; },
    });
    assert(skipped[0].acknowledged && queue.length === 0, "skipped result is durably acknowledged");
    assert(successes === 1, "skipped acknowledgement runs its post-commit callback");
  });
  await test("concurrent enqueue survives acknowledgement of a snapshot item", () => {
    const current = pbpOfflineQueueReduce(Q(), { kind: "enqueue", item: { queueId: "d", url: "https://d.com" } });
    const out = pbpOfflineQueueReduce(current, { kind: "remove", queueId: "a" });
    assert(out.length === 3, "only acknowledged item removed");
    assert(out.some(i => i.queueId === "d"), "concurrent enqueue preserved");
  });
  await test("clear/remove followed by stale acknowledgement cannot restore items", () => {
    const cleared = pbpOfflineQueueReduce(Q(), { kind: "clear" });
    assert(pbpOfflineQueueReduce(cleared, { kind: "remove", queueId: "a" }).length === 0, "clear remains empty");
    const removed = pbpOfflineQueueReduce(Q(), { kind: "remove", queueId: "b" });
    const staleAck = pbpOfflineQueueReduce(removed, { kind: "remove", queueId: "b" });
    assert(staleAck.length === 2 && !staleAck.some(i => i.queueId === "b"), "removed item stays removed");
  });
  await test("ensure_ids preserves order and fields with unique deterministic IDs", () => {
    const input = [
      { queueId: "existing", url: "https://a.com" },
      { url: "https://b.com", title: "B", queuedAt: 10 },
      { url: "https://c.com", tags: "one two" },
    ];
    const before = JSON.stringify(input);
    const out = pbpOfflineQueueReduce(input, { kind: "ensure_ids", prefix: "legacy" });
    assert(out.map(i => i.url).join(",") === input.map(i => i.url).join(","), "order preserved");
    assert(out[0].queueId === "existing", "existing ID preserved");
    assert(out[1].queueId === "legacy-1" && out[2].queueId === "legacy-2", "deterministic suffixes assigned");
    assert(new Set(out.map(i => i.queueId)).size === 3, "IDs unique");
    assert(out[1].title === "B" && out[1].queuedAt === 10 && out[2].tags === "one two", "fields preserved");
    assert(JSON.stringify(input) === before && out !== input, "input not mutated");
  });
  await test("replace action no longer replaces the queue", () => {
    const out = pbpOfflineQueueReduce(Q(), { kind: "replace", remaining: [{ queueId: "c", url: "https://c.com" }] });
    assert(out.length === 3 && out[0].queueId === "a", "unknown action is a no-op");
  });
  await test("does not mutate its input (clear)", () => {
    const input = Q();
    pbpOfflineQueueReduce(input, { kind: "clear" });
    assert(input.length === 3, "input untouched");
  });
  await test("null/garbage queue treated as empty", () => {
    assert(pbpOfflineQueueReduce(null, { kind: "clear" }).length === 0, "null -> []");
    assert(pbpOfflineQueueReduce(undefined, { kind: "enqueue", item: { queueId: "x" } }).length === 1, "undefined -> [item]");
  });

  await test("recovering tail propagates rejection then runs the next task without overlap", async () => {
    const run = pbpCreateRecoveringTail();
    let active = 0;
    let maxActive = 0;
    const first = run(async () => {
      active++;
      maxActive = Math.max(maxActive, active);
      await new Promise((resolve) => setTimeout(resolve, 5));
      active--;
      throw new Error("expected");
    });
    const second = run(async () => {
      active++;
      maxActive = Math.max(maxActive, active);
      active--;
      return "ok";
    });
    const [firstResult, secondResult] = await Promise.allSettled([first, second]);
    assert(firstResult.status === "rejected", "current caller receives rejection");
    assert(secondResult.status === "fulfilled" && secondResult.value === "ok", "tail recovers for next task");
    assert(maxActive === 1, "tasks never overlap");
  });

  await test("pending send acknowledgement preserves a concurrently enqueued item", async () => {
    let queue = [{ queueId: "a", url: "https://a.com" }];
    let releaseSend;
    let markStarted;
    const started = new Promise((resolve) => { markStarted = resolve; });
    const sendGate = new Promise((resolve) => { releaseSend = resolve; });
    const drain = pbpDrainOfflineQueue(["a"], {
      getItem: (queueId) => queue.find((item) => item.queueId === queueId) || null,
      sendItem: async () => { markStarted(); await sendGate; return true; },
      removeItem: (queueId) => { queue = pbpOfflineQueueReduce(queue, { kind: "remove", queueId }); },
      onSuccess: () => {},
    });
    await started;
    queue = pbpOfflineQueueReduce(queue, { kind: "enqueue", item: { queueId: "b", url: "https://b.com" } });
    releaseSend();
    const completed = await drain;
    assert(completed.length === 1 && completed[0].item.queueId === "a" && completed[0].acknowledged, "sent item completed");
    assert(queue.length === 1 && queue[0].queueId === "b", "concurrent enqueue preserved");
  });

  await test("cleared or removed items are not sent or revived", async () => {
    let queue = Q();
    let sends = 0;
    let removals = 0;
    const options = {
      getItem: (queueId) => queue.find((item) => item.queueId === queueId) || null,
      sendItem: () => { sends++; return true; },
      removeItem: (queueId) => { removals++; queue = pbpOfflineQueueReduce(queue, { kind: "remove", queueId }); },
      onSuccess: () => {},
    };
    queue = pbpOfflineQueueReduce(queue, { kind: "clear" });
    await pbpDrainOfflineQueue(["a"], options);
    assert(sends === 0 && removals === 0 && queue.length === 0, "clear cancels not-yet-started item");

    queue = pbpOfflineQueueReduce(Q(), { kind: "remove", queueId: "b" });
    await pbpDrainOfflineQueue(["b"], options);
    assert(sends === 0 && removals === 0, "remove cancels not-yet-started item");
    assert(queue.length === 2 && !queue.some((item) => item.queueId === "b"), "removed item not revived");
  });

  await test("acknowledgement failure rejects without success callback or item loss", async () => {
    const queue = [{ queueId: "a", url: "https://a.com" }];
    let successes = 0;
    let rejected = false;
    try {
      await pbpDrainOfflineQueue(["a"], {
        getItem: (queueId) => queue.find((item) => item.queueId === queueId) || null,
        sendItem: () => true,
        removeItem: async () => { throw new Error("storage failed"); },
        onSuccess: () => { successes++; },
      });
    } catch (_) {
      rejected = true;
    }
    assert(rejected, "acknowledgement failure propagated");
    assert(successes === 0, "success callback waits for durable acknowledgement");
    assert(queue.length === 1 && queue[0].queueId === "a", "item remains queued");
  });

  // Items of another connection stay queued and are never replayed for this
  // one; the bar counts them apart and names them by service and host only.
  await test("the queue bar counts the current connection apart and labels other connections by service and host", async () => {
    const LD = "linkding:https://ld.example/base/:conn-ld-77";
    const KK = "karakeep:https://kk.example:8443/:user-kk-99";
    const item = (queueId, account) => ({ queueId, account, url: "https://page.example/" + queueId, title: queueId, queuedAt: Date.now() });
    const { text, rows } = await renderQueueBar({ ok: true, pause: null, account: LD,
      queue: [item("ld1", LD), item("kk1", KK), item("ld2", LD), item("pin1", "alice")] });
    assert(text === "offlineQueued:2 · offlineQueueOtherConnection:2", "bar text: " + text);
    const meta = Object.fromEntries(rows.map((row) => [row.id, row.meta]));
    assert(meta.kk1.startsWith("Karakeep · kk.example:8443 · page.example"), "other self-hosted row: " + meta.kk1);
    assert(meta.pin1.startsWith("@alice · page.example"), "Pinboard row: " + meta.pin1);
    assert(meta.ld1.startsWith("page.example") && meta.ld2.startsWith("page.example"), "current-connection rows carry a source label: " + meta.ld1);
    for (const row of rows) {
      for (const secret of ["conn-ld-77", "user-kk-99", "linkding:", "karakeep:", "/base/"]) {
        assert(!row.html.includes(secret), row.id + " shows " + secret);
      }
    }
    const pinboard = await renderQueueBar({ ok: true, pause: null, account: "alice", queue: [item("pin1", "alice"), item("pin2", "bob")] });
    assert(pinboard.text === "offlineQueued:1 · offlineQueueOtherConnection:1", "Pinboard bar text: " + pinboard.text);
    assert(pinboard.rows[1].meta.startsWith("@bob · "), "another Pinboard account keeps @username");
    // No answer from the worker: nothing is split off, every row is labelled.
    const unknown = await renderQueueBar(null);
    assert(unknown.text === "", "an empty fallback queue showed text");
  });
  await test("drain skips items the hook marks and reports failures to onFailure", async () => {
    const run = async (hooks) => {
      let queue = Q();
      const sent = [];
      const failures = [];
      const outcomes = await pbpDrainOfflineQueue(["a", "b", "c"], {
        getItem: (queueId) => queue.find((item) => item.queueId === queueId) || null,
        sendItem: (item) => { sent.push(item.queueId); return item.queueId === "a" ? { result: { status: "failed", reason: "gateway_redirect" } } : true; },
        removeItem: (queueId) => { queue = pbpOfflineQueueReduce(queue, { kind: "remove", queueId }); },
        onSuccess: () => {},
        ...hooks,
        ...(hooks.onFailure ? { onFailure: async (item, delivered) => { await hooks.onFailure(item, delivered); failures.push([item.queueId, delivered.result.reason]); } } : {}),
      });
      return { queue, sent, failures, outcomes };
    };
    const hooked = await run({ skipItem: async (item) => item.queueId === "b", onFailure: () => {} });
    assert(hooked.sent.join() === "a,c", "the marked item is never sent: " + hooked.sent.join());
    assert(hooked.failures.length === 1 && hooked.failures[0].join() === "a,gateway_redirect", "the failed item reaches onFailure once");
    assert(hooked.outcomes.map((o) => o.item.queueId).join() === "a,c", "a skipped item yields no outcome");
    assert(hooked.queue.map((i) => i.queueId).join() === "a,b", "failed and skipped items stay queued");

    const plain = await run({});
    assert(plain.sent.join() === "a,b,c", "without hooks every item is sent");
    assert(plain.outcomes.length === 3 && !plain.outcomes[0].acknowledged && plain.outcomes[1].acknowledged, "outcomes unchanged without hooks");
    assert(plain.queue.map((i) => i.queueId).join() === "a", "only the failed item remains without hooks");
  });
});
})();
</script>
