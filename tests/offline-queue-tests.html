<html><head><meta charset="UTF-8"><title>Offline Queue Tests</title>
<style>
body { font-family: monospace; padding: 16px; max-width: 1000px; }
h2 { margin-top: 24px; font-size: 16px; }
.suite { margin: 12px 0; padding: 8px; border-left: 3px solid #ccc; }
.case { padding: 4px 8px; margin: 4px 0; }
.pass { color: #0a0; background: #f0fff0; }

<body>
<h1>offlineQueue reducer Tests</h1>
<div id="results"></div>
<script src="../shared.js"></script>
<script>
async function test(name, fn) {
  try { await fn();
    const div = document.createElement("div"); div.className = "case pass";
    div.textContent = "PASS " + name; document.getElementById("results").appendChild(div);
  } catch (e) {
    const div = document.createElement("div"); div.className = "case fail";
    div.textContent = "FAIL " + name + "\n  " + e.message; document.getElementById("results").appendChild(div);
  }
}
function assert(cond, msg) { if (!cond) throw new Error(msg || "assertion failed"); }
async function suite(name, fn) {
  const div = document.createElement("div"); div.className = "suite";
  const h = document.createElement("h2"); h.textContent = name; div.appendChild(h);
  const results = document.getElementById("results"); const savedAppend = results.appendChild;
  results.appendChild = function(el) { if (el.className?.includes("case")) div.appendChild(el); else savedAppend.call(results, el); };
  await fn(); results.appendChild = savedAppend; results.appendChild(div);
}

// Exercise the production queue serializer, normalizer and intent validator.
async function queueIntentHarness() {
  const source = await (await fetch("../background.js")).text();
  const block = (startText, endText) => {
    const start = source.indexOf(startText);
    const end = source.indexOf(endText, start);
    assert(start >= 0 && end > start, "queue intent source block not found");
    return source.slice(start, end);
  };
  return new Function("pbpPinboardAccountFromToken", `
    const PBP_SAVE_MODES = new Set(["create", "update", "merge", "overwrite", "skip"]);
    ${block("function pbpSaveFailure(", "// Delivery-time merge/skip decisions")}
    ${block("function normalizeOfflineSaveIntent(", "// pinboardFetch serializes")}
    ${block("function queueRecordFromSaveIntent(", "function submitSaveIntent(")}
    return { validateSaveIntent, normalizeOfflineSaveIntent, queueRecordFromSaveIntent };
  `)(pbpPinboardAccountFromToken);
}
const SAVE_INTENT = Object.freeze({ mode: "create", url: "https://example.com/a", title: "Title",
  notes: "Note", tags: "tag", private: false, toread: true, archive: false });

const Q = () => ([
  { queueId: "a", url: "https://a.com" },
  { queueId: "b", url: "https://b.com" },
  { queueId: "c", url: "https://c.com" },
]);

// The popup's queue bar (popup-offline.js) on real DOM, answered by a stub
// worker. Returns the bar text and, once expanded, each row's meta line.
let popupOfflineSource;
// A translator over a real _locales file, with chrome.i18n's positional
// placeholder substitution: renders rows in the copy users see.
async function localeTranslator(locale) {
  const messages = await (await fetch("../_locales/" + locale + "/messages.json")).json();
  return (key, ...args) => {
    const entry = messages[key];
    if (!entry) throw new Error("missing message " + key);
    return entry.message.replace(/\$([A-Z_]+)\$/g, (_, name) => {
      const content = entry.placeholders?.[name.toLowerCase()]?.content || "";
      const index = Number((/^\$(\d)$/.exec(content) || [])[1]);
      return index ? String(args[index - 1]) : content;
    });
  };
}

async function renderQueueBar(response, translate) {
  popupOfflineSource ||= await (await fetch("../popup-offline.js")).text();
  const host = document.createElement("div");
  host.innerHTML = '<div id="oq-bar" class="hidden"><span id="oq-text"></span><button id="oq-toggle" aria-expanded="false"></button></div><div id="oq-list" class="hidden"></div>';
  document.body.appendChild(host);
  const ids = { "offline-queue-bar": "oq-bar", "offline-queue-text": "oq-text", "offline-queue-toggle": "oq-toggle", "offline-queue-list": "oq-list" };
  const byId = (id) => host.querySelector("#" + (ids[id] || id));
  const tr = translate || ((key, ...args) => args.length ? key + ":" + args.join(":") : key);
  const chromeStub = {
    runtime: { lastError: null, sendMessage: (message, callback) => callback(message.type === "get_offline_queue" ? response : null) },
    storage: { local: { get: async () => ({}) }, onChanged: { addListener() {} } },
  };
  const win = {};
  new Function("window", "chrome", "$id", "t", popupOfflineSource)(win, chromeStub, byId, tr);
  win.PPOffline.init();
  await win.PPOffline.refresh();
  const text = byId("offline-queue-text").textContent;
  byId("offline-queue-toggle").dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true }));
  for (let i = 0; i < 20 && !byId("offline-queue-list").querySelector(".offline-queue-item"); i++) await new Promise((r) => setTimeout(r, 0));
  const rows = [...byId("offline-queue-list").querySelectorAll(".offline-queue-item")].map((row) => ({
    id: row.dataset.queueId, meta: row.querySelector(".offline-queue-meta").textContent, html: row.outerHTML,
    reason: row.querySelector(".error-text > :first-child")?.textContent || "",
    hint: row.querySelector(".error-text > :nth-child(2)")?.textContent || "",
    buttons: [...row.querySelectorAll(".actions button")].map((button) => button.getAttribute("aria-label")) }));
  host.remove();
  return { text, rows };
}

(async () => {
await suite("offline queue", async () => {
  await test("remove drops only the matching queueId", () => {
    const out = pbpOfflineQueueReduce(Q(), { kind: "remove", queueId: "b" });
    assert(out.length === 2, "should drop one");
    assert(!out.some(i => i.queueId === "b"), "b removed");
    assert(out[0].queueId === "a" && out[1].queueId === "c", "order preserved");
  });
  await test("remove of unknown id is a no-op (new array, same contents)", () => {
    const input = Q();
    const out = pbpOfflineQueueReduce(input, { kind: "remove", queueId: "zzz" });
    assert(out.length === 3, "nothing dropped");
    assert(out !== input, "returns a NEW array, never mutates input");
  });
  await test("clear returns empty array", () => {
    assert(pbpOfflineQueueReduce(Q(), { kind: "clear" }).length === 0, "cleared");
  });
  await test("enqueue appends item", () => {
    const out = pbpOfflineQueueReduce(Q(), { kind: "enqueue", item: { queueId: "d", url: "https://d.com" } });
    assert(out.length === 4 && out[3].queueId === "d", "appended at tail");
  });
  await test("enqueue does not duplicate an existing queueId", () => {

      { queueId: "b", mode: "skip", url: "https://b.com" },

    ];
    const out = pbpOfflineQueueReduce(input, { kind: "skip_to_merge", queueId: "a" });

    assert(input[0].mode === "skip", "input not mutated");

      assert(kept[0].mode === mode, mode + " stays " + mode);

  });
  await test("mark_failure stores only a valid marker on the named record and clear_failure removes it", () => {
    const input = Q();
    const marked = pbpOfflineQueueReduce(input, { kind: "mark_failure", queueId: "b", failure: { code: "remote", at: 7, status: 400, body: "<html>", token: "x" } });
    assert(JSON.stringify(marked[1].failure) === JSON.stringify({ code: "remote", at: 7, status: 400 }), "marker: " + JSON.stringify(marked[1].failure));
    assert(!("failure" in marked[0]) && !("failure" in marked[2]) && !("failure" in input[1]), "other records or the input changed");
    for (const failure of [null, {}, { code: "", at: 1 }, { code: "remote" }, { code: "remote", at: 1, status: "400" }, { code: "remote", at: 1, status: 99 }]) {
      assert(JSON.stringify(pbpOfflineQueueReduce(input, { kind: "mark_failure", queueId: "b", failure })) === JSON.stringify(input), "invalid marker written: " + JSON.stringify(failure));
    }
    const cleared = pbpOfflineQueueReduce(marked, { kind: "clear_failure", queueId: "b" });
    assert(JSON.stringify(cleared) === JSON.stringify(input), "clear_failure left " + JSON.stringify(cleared[1]));
    assert(pbpOfflineQueueNeedsAttention(marked[1]) && !pbpOfflineQueueNeedsAttention(cleared[1]), "attention predicate");
    assert(!pbpOfflineQueueNeedsAttention({ failure: { code: "network", at: 1 } }), "a transient code needs attention");
  });
  await test("Retry-After reads seconds and HTTP dates, and a rate-limit marker holds only until then, at most an hour", () => {
    const now = Date.parse("2026-11-03T10:00:00Z");
    assert(pbpRetryAfterDelay("120", now) === 120000 && pbpRetryAfterDelay(" 7 ", now) === 7000, "seconds");
    assert(pbpRetryAfterDelay("Tue, 03 Nov 2026 10:02:00 GMT", now) === 120000, "HTTP date");
    for (const value of [undefined, null, "", "0", "-5", "1.5", "soon", "Tue, 03 Nov 2026 09:00:00 GMT", 120]) {
      assert(pbpRetryAfterDelay(value, now) === undefined, "accepted " + JSON.stringify(value));
    }
    const mark = (result) => pbpOfflineQueueFailureMark({ status: "failed", ...result }, now);
    assert(JSON.stringify(mark({ reason: "rate_limited", httpStatus: 429, retryAfter: 120000 })) === JSON.stringify({ code: "rate_limited", at: now, retryAfter: now + 120000 }), "self-hosted 429");
    assert(JSON.stringify(mark({ reason: "http", httpStatus: 429, retryAfter: 9e6 })) === JSON.stringify({ code: "http", at: now, status: 429, retryAfter: now + 3600000 }), "Pinboard 429 capped");
    assert(mark({ reason: "rate_limited", httpStatus: 429 }) === null, "a 429 without the header was held");
    const held = { failure: mark({ reason: "rate_limited", retryAfter: 120000 }) };
    assert(pbpOfflineQueueHeld(held, now + 119000) && !pbpOfflineQueueHeld(held, now + 121000), "hold window");
    assert(!pbpOfflineQueueNeedsAttention(held), "a rate limit needs attention");
    assert(pbpOfflineQueueHeld({ failure: { code: "remote", at: now } }, now + 1e9), "attention is held for good");
    assert(!pbpOfflineQueueHeld({}, now) && !pbpOfflineQueueHeld({ failure: { code: "rate_limited", at: now, retryAfter: "x" } }, now), "no or invalid marker held");
  });

  await test("a partial replay blocked by duplicate Read Later lists is marked and held; other partials are not", () => {
    const now = Date.parse("2026-11-03T10:00:00Z");
    const partial = (extra = {}) => ({ status: "failed", reason: "partial", failedStep: "read_later", httpStatus: undefined, ...extra });
    const dup = pbpOfflineQueueFailureMark(partial({ error: "read_later_list" }), now);
    assert(JSON.stringify(dup) === JSON.stringify({ code: "read_later_list", at: now }), "duplicate-list marker: " + JSON.stringify(dup));
    const stored = pbpOfflineQueueReduce([{ queueId: "a" }], { kind: "mark_failure", queueId: "a", failure: dup });
    assert(JSON.stringify(stored[0].failure) === JSON.stringify(dup), "marker survives the reducer: " + JSON.stringify(stored[0].failure));
    assert(pbpOfflineQueueNeedsAttention(stored[0]) && pbpOfflineQueueHeld(stored[0], now + 1e9), "marked record is held for good");
    assert(!pbpOfflineQueueAutoRetries(stored, { until: now + 1e9 }), "no automatic replay is left to schedule");
    for (const result of [partial(), partial({ error: "other" }), partial({ failedStep: "tags", error: "read_later_list" }),
      partial({ failedStep: "bookmark" }), { status: "failed", reason: "partial", failedStep: "read_later", httpStatus: 500 }]) {
      assert(pbpOfflineQueueFailureMark(result, now) === null, "marked another partial: " + JSON.stringify(result));
    }
  });
  await test("a row marked read_later_list names the duplicate lists and offers retry and remove", async () => {
    const KK = "karakeep:https://kk.example/:user-kk-99";
    const { rows } = await renderQueueBar({ ok: true, pause: null, account: KK, queue: [
      { queueId: "dup", account: KK, url: "https://page.example/dup", title: "dup", tags: "work", queuedAt: Date.now(), failure: { code: "read_later_list", at: 1 } },
    ] });
    const row = rows.find((r) => r.id === "dup");
    assert(row && row.reason === PBP_BOOKMARK_FAILURE_KEYS.read_later_list, "row reason: " + (row && row.reason));
    assert(row.buttons.join() === "offlineRetry,offlineRemove" && row.hint === "offlineQueueAttentionHint", "row buttons/hint: " + row.buttons.join() + " / " + row.hint);
  });
  await test("new queue payload does not persist credentials", () => {
    const out = pbpOfflineQueueReduce([], { kind: "enqueue", item: { queueId: "a", account: "alice", url: "https://a.com", token: "secret" } });
    assert(out.length === 1 && !("token" in out[0]), "new item strips token");
    assert(out[0].account === "alice", "non-secret account binding preserved");
  });
  await test("summary round-trips through the queue with only its whitelisted field added", async () => {
    const h = await queueIntentHarness();
    const prepared = { ...SAVE_INTENT, summary: "  Description\nsecond line  ", token: "discard", sharingEnabled: true,
      gateway: { token: "discard" }, connectionCapabilities: { sharing: true } };
    const record = { ...h.queueRecordFromSaveIntent(prepared, "alice:fixture", "linkding"), queueId: "summary", queuedAt: 123 };
    const queue = pbpOfflineQueueReduce([], { kind: "enqueue", item: record });
    const expectedKeys = ["account", "mode", "url", "title", "notes", "summary", "tags", "private", "toread", "archive", "time", "queueId", "queuedAt"].sort();
    assert(JSON.stringify(Object.keys(queue[0]).sort()) === JSON.stringify(expectedKeys), "only the exact queue whitelist is persisted");
    const normalized = h.normalizeOfflineSaveIntent(queue[0], {});
    assert(normalized.summary === prepared.summary, "description is preserved verbatim");
    assert(normalized.notes === SAVE_INTENT.notes && normalized.mode === "merge", "notes and create replay semantics preserved");
    assert(h.validateSaveIntent(normalized) === null, "round-tripped intent is valid");
    assert(queue[0].account === "alice", "non-secret owner binding preserved");
  });
  await test("optional explicit sharing round-trips and rejects nonboolean queue fields", async () => {
    const h=await queueIntentHarness();
    for(const sharedExplicit of [undefined,false,true,"true",1,null]) {
      const prepared={...SAVE_INTENT,...(sharedExplicit===undefined?{}:{sharedExplicit})};
      const record=h.queueRecordFromSaveIntent(prepared,"alice:fixture");
      const expected=["account","mode","url","title","notes","tags","private","toread","archive","time",...(sharedExplicit===undefined?[]:["sharedExplicit"])].sort();
      assert(JSON.stringify(Object.keys(record).sort())===JSON.stringify(expected),"sharing widened the queue whitelist");
      const restored=h.normalizeOfflineSaveIntent(record,{});
      assert(restored.sharedExplicit===sharedExplicit,"sharing provenance lost");
      assert((h.validateSaveIntent(restored)===null)===(sharedExplicit===undefined||typeof sharedExplicit==="boolean"),"invalid marker accepted");
    }
  });
  // Missing means the extension could not tell (linkding fills it in); ""
  // means it knows there is none. The two must survive the queue apart.
  await test("optional summary keeps missing and empty apart through the queue", async () => {
    const h = await queueIntentHarness();
    for (const summary of [undefined, ""]) {
      const prepared = { ...SAVE_INTENT, ...(summary === undefined ? {} : { summary }) };
      assert(h.validateSaveIntent(prepared) === null, "legacy and empty descriptions remain valid");
      const record = { ...h.queueRecordFromSaveIntent(prepared, "alice:fixture", "linkding"), queueId: "q", queuedAt: 1 };
      const stored = JSON.parse(JSON.stringify(pbpOfflineQueueReduce([], { kind: "enqueue", item: record })[0]));
      const expectedKeys = ["account", "mode", "url", "title", "notes", ...(summary === undefined ? [] : ["summary"]), "tags", "private", "toread", "archive", "queueId", "queuedAt"].sort();
      assert(JSON.stringify(Object.keys(stored).sort()) === JSON.stringify(expectedKeys), "queued fields for " + JSON.stringify(summary) + ": " + Object.keys(stored).sort().join());
      for (const restored of [h.normalizeOfflineSaveIntent(record, {}), h.normalizeOfflineSaveIntent(stored, {})]) {
        assert(Object.hasOwn(restored, "summary") === (summary !== undefined) && restored.summary === summary, "replay turned " + JSON.stringify(summary) + " into " + JSON.stringify(restored.summary));
        assert(h.validateSaveIntent(restored) === null, "optional description survives normalization");
      }
    }
  });
  // linkding is the one service whose Description the extension writes.
  // Another service's summary (Karakeep's AI summary on the server record) is

  await test("only a linkding queue record keeps a Description", async () => {
    const h = await queueIntentHarness();
    for (const service of ["linkding", "karakeep", "pinboard", undefined]) for (const summary of ["Server summary\nsecond line", ""]) {
      const stored = JSON.parse(JSON.stringify(h.queueRecordFromSaveIntent({ ...SAVE_INTENT, summary }, "alice:fixture", service)));
      const expectedKeys = ["account", "mode", "url", "title", "notes", ...(service === "linkding" ? ["summary"] : []), "tags", "private", "toread", "archive"].sort();
      assert(JSON.stringify(Object.keys(stored).sort()) === JSON.stringify(expectedKeys), String(service) + " queued " + Object.keys(stored).sort().join());
      assert(service !== "linkding" || stored.summary === summary, "the linkding Description changed in the queue");

    const item = { account: "alice" };

  await test("failed delivery remains queued and is not acknowledged as success", async () => {
    let queue = [{ queueId: "a", url: "https://a.com" }];

    assert(queue.length === 1 && queue[0].queueId === "a", "failed item remains queued");

  await test("concurrent enqueue survives acknowledgement of a snapshot item", () => {

  await test("ensure_ids preserves order and fields with unique deterministic IDs", () => {
    const input = [
      { queueId: "existing", url: "https://a.com" },

    assert(out[0].queueId === "existing", "existing ID preserved");

  await test("null/garbage queue treated as empty", () => {
    assert(pbpOfflineQueueReduce(null, { kind: "clear" }).length === 0, "null -> []");
    assert(pbpOfflineQueueReduce(undefined, { kind: "enqueue", item: { queueId: "x" } }).length === 1, "undefined -> [item]");
  });

  await test("recovering tail propagates rejection then runs the next task without overlap", async () => {
    const run = pbpCreateRecoveringTail();
    let active = 0;
    let maxActive = 0;
    const first = run(async () => {
      active++;
      maxActive = Math.max(maxActive, active);
      await new Promise((resolve) => setTimeout(resolve, 5));
      active--;
      throw new Error("expected");
    });
    const second = run(async () => {
      active++;
      maxActive = Math.max(maxActive, active);
      active--;
      return "ok";
    });
    const [firstResult, secondResult] = await Promise.allSettled([first, second]);
    assert(firstResult.status === "rejected", "current caller receives rejection");
    assert(secondResult.status === "fulfilled" && secondResult.value === "ok", "tail recovers for next task");
    assert(maxActive === 1, "tasks never overlap");
  });

  await test("pending send acknowledgement preserves a concurrently enqueued item", async () => {
    let queue = [{ queueId: "a", url: "https://a.com" }];
    let releaseSend;
    let markStarted;
    const started = new Promise((resolve) => { markStarted = resolve; });
    const sendGate = new Promise((resolve) => { releaseSend = resolve; });
    const drain = pbpDrainOfflineQueue(["a"], {
      getItem: (queueId) => queue.find((item) => item.queueId === queueId) || null,
      sendItem: async () => { markStarted(); await sendGate; return true; },
      removeItem: (queueId) => { queue = pbpOfflineQueueReduce(queue, { kind: "remove", queueId }); },
      onSuccess: () => {},
    });
    await started;
    queue = pbpOfflineQueueReduce(queue, { kind: "enqueue", item: { queueId: "b", url: "https://b.com" } });
    releaseSend();
    const completed = await drain;
    assert(completed.length === 1 && completed[0].item.queueId === "a" && completed[0].acknowledged, "sent item completed");
    assert(queue.length === 1 && queue[0].queueId === "b", "concurrent enqueue preserved");
  });

  await test("cleared or removed items are not sent or revived", async () => {
    let queue = Q();
    let sends = 0;
    let removals = 0;
    const options = {
      getItem: (queueId) => queue.find((item) => item.queueId === queueId) || null,
      sendItem: () => { sends++; return true; },
      removeItem: (queueId) => { removals++; queue = pbpOfflineQueueReduce(queue, { kind: "remove", queueId }); },
      onSuccess: () => {},
    };
    queue = pbpOfflineQueueReduce(queue, { kind: "clear" });
    await pbpDrainOfflineQueue(["a"], options);
    assert(sends === 0 && removals === 0 && queue.length === 0, "clear cancels not-yet-started item");

    queue = pbpOfflineQueueReduce(Q(), { kind: "remove", queueId: "b" });
    await pbpDrainOfflineQueue(["b"], options);
    assert(sends === 0 && removals === 0, "remove cancels not-yet-started item");
    assert(queue.length === 2 && !queue.some((item) => item.queueId === "b"), "removed item not revived");
  });

  await test("acknowledgement failure rejects without success callback or item loss", async () => {
    const queue = [{ queueId: "a", url: "https://a.com" }];
    let successes = 0;
    let rejected = false;
    try {
      await pbpDrainOfflineQueue(["a"], {
        getItem: (queueId) => queue.find((item) => item.queueId === queueId) || null,
        sendItem: () => true,
        removeItem: async () => { throw new Error("storage failed"); },
        onSuccess: () => { successes++; },
      });
    } catch (_) {
      rejected = true;
    }
    assert(rejected, "acknowledgement failure propagated");
    assert(successes === 0, "success callback waits for durable acknowledgement");
    assert(queue.length === 1 && queue[0].queueId === "a", "item remains queued");
  });

  // Items of another connection stay queued and are never replayed for this
  // one; the bar counts them apart and names them by service and host only.
  await test("the queue bar counts the current connection apart and labels other connections by service and host", async () => {
    const LD = "linkding:https://ld.example/base/:conn-ld-77";
    const KK = "karakeep:https://kk.example:8443/:user-kk-99";
    const item = (queueId, account) => ({ queueId, account, url: "https://page.example/" + queueId, title: queueId, queuedAt: Date.now() });
    const { text, rows } = await renderQueueBar({ ok: true, pause: null, account: LD,
      queue: [item("ld1", LD), item("kk1", KK), item("ld2", LD), item("pin1", "alice")] });
    assert(text === "offlineQueued:2 · offlineQueueOtherConnection:2", "bar text: " + text);
    const meta = Object.fromEntries(rows.map((row) => [row.id, row.meta]));
    assert(meta.kk1.startsWith("Karakeep · kk.example:8443 · page.example"), "other self-hosted row: " + meta.kk1);
    assert(meta.pin1.startsWith("@alice · page.example"), "Pinboard row: " + meta.pin1);
    assert(meta.ld1.startsWith("page.example") && meta.ld2.startsWith("page.example"), "current-connection rows carry a source label: " + meta.ld1);
    for (const row of rows) {
      for (const secret of ["conn-ld-77", "user-kk-99", "linkding:", "karakeep:", "/base/"]) {
        assert(!row.html.includes(secret), row.id + " shows " + secret);
      }
    }
    const pinboard = await renderQueueBar({ ok: true, pause: null, account: "alice", queue: [item("pin1", "alice"), item("pin2", "bob")] });
    assert(pinboard.text === "offlineQueued:1 · offlineQueueOtherConnection:1", "Pinboard bar text: " + pinboard.text);
    assert(pinboard.rows[1].meta.startsWith("@bob · "), "another Pinboard account keeps @username");
    // No answer from the worker: nothing is split off, every row is labelled.
    const unknown = await renderQueueBar(null);
    assert(unknown.text === "", "an empty fallback queue showed text");
  });
  // A record replay stopped on is counted on its own and says why, with the
  // row's Retry and Remove still there (user decision 2026-11-02).
  await test("the queue bar counts records that need attention and each such row names its cause", async () => {
    const LD = "linkding:https://ld.example/:conn-ld-77";
    const KK = "karakeep:https://kk.example/:user-kk-99";
    const long = "x".repeat(65);
    const item = (queueId, account, extra = {}) => ({ queueId, account, url: "https://page.example/" + queueId, title: queueId, tags: "work", queuedAt: Date.now(), ...extra });
    const { text, rows } = await renderQueueBar({ ok: true, pause: null, account: LD, queue: [
      item("plain", LD),
      item("tag", LD, { tags: 'work "' + long + '"', mode: "merge", failure: { code: "tag_too_long", at: 1 } }),
      item("remote", LD, { failure: { code: "remote", at: 1, status: 422 } }),
      item("title", LD, { failure: { code: "too_long", at: 1 } }),
      item("broken", LD, { failure: { code: "invalid", at: 1 } }),
      item("other", KK, { failure: { code: "remote", at: 1, status: 400 } }),
      item("pin", "alice", { failure: { code: "http", at: 1, status: 400 } }),
    ] });
    assert(text === "offlineQueued:1 · offlineQueueNeedsAttention:4 · offlineQueueOtherConnection:2", "bar text: " + text);
    const by = Object.fromEntries(rows.map((row) => [row.id, row]));
    assert(by.plain.reason === "", "a plain row shows a cause");
    assert(by.tag.reason === "bookmarkErrTagTooLong:" + "x".repeat(40) + "\u2026:64", "tag row: " + by.tag.reason);
    assert(by.remote.reason === "bookmarkErrRemote:422", "remote row: " + by.remote.reason);
    assert(by.title.reason === "titleTooLong:512", "title row: " + by.title.reason);
    assert(by.broken.reason === "offlineQueueRecordInvalid", "invalid row: " + by.broken.reason);
    assert(by.other.reason === "bookmarkErrRemote:400", "another connection's row: " + by.other.reason);
    assert(by.pin.reason === "pinboardErrRejected:400", "Pinboard row: " + by.pin.reason);
    for (const row of rows) assert(row.buttons.join() === "offlineRetry,offlineRemove", row.id + " buttons: " + row.buttons.join());
    for (const row of rows) assert(row.hint === (row.id === "plain" ? "" : "offlineQueueAttentionHint"), row.id + " hint: " + row.hint);
  });
  await test("a single record that needs attention uses the singular bar copy, several the plural", async () => {
    const LD = "linkding:https://ld.example/:conn-ld-77";
    const item = (queueId, extra = {}) => ({ queueId, account: LD, url: "https://page.example/" + queueId, title: queueId, queuedAt: Date.now(), ...extra });
    const failed = (queueId) => item(queueId, { failure: { code: "remote", at: 1, status: 422 } });
    const one = await renderQueueBar({ ok: true, pause: null, account: LD, queue: [item("a"), failed("b")] });
    assert(one.text === "offlineQueued:1 · offlineQueueNeedsAttentionOne:1", "one: " + one.text);
    const two = await renderQueueBar({ ok: true, pause: null, account: LD, queue: [failed("b"), failed("c")] });
    assert(two.text === "offlineQueueNeedsAttention:2", "two: " + two.text);
    const en = await localeTranslator("en");
    assert(en("offlineQueueNeedsAttentionOne", "1") === "1 needs attention", "en singular: " + en("offlineQueueNeedsAttentionOne", "1"));
  });
  await test("an attention row says it will not retry automatically and never claims retrying is pointless", async () => {
    for (const locale of ["en", "de", "fr", "ja", "pl", "ru", "zh_CN", "zh_HK", "zh_TW"]) {
      const tr = await localeTranslator(locale);
      assert(tr("offlineQueueAttentionHint") && tr("offlineQueueAttentionHint") !== "offlineQueueAttentionHint", locale + " hint missing");
    }
    const en = await localeTranslator("en");
    for (const key of ["pinboardErrRejected", "bookmarkErrRemote", "bookmarkErrUrlInvalid"]) {
      assert(!/won.t help|trying again/i.test(en(key, "400")), key + " still says retrying is pointless: " + en(key, "400"));
    }
    const hint = en("offlineQueueAttentionHint");
    assert(/retry or remove/i.test(hint) && /automatically/i.test(hint), "hint: " + hint);
  });
  // The cause and the "retry stopped" line render apart, so a cause without
  // a closing full stop (Chinese titleTooLong, a Pinboard status) never runs
  // into the next sentence; no row shows a guessed number or a placeholder.
  await test("attention rows in real locale copy keep the cause and the stopped line as separate full sentences", async () => {
    const LD = "linkding:https://ld.example/:conn-ld-77";
    const item = (queueId, account, failure) => ({ queueId, account, url: "https://page.example/" + queueId, title: queueId, tags: "work", queuedAt: Date.now(), failure });
    const queue = [
      item("ld-title", LD, { code: "too_long", at: 1 }),
      item("pin-long", "alice", { code: "too_long", at: 1 }),
      item("pin-404", "alice", { code: "http", at: 1, status: 404 }),
      item("pin-400", "alice", { code: "http", at: 1, status: 400 }),
    ];
    for (const locale of ["zh_CN", "zh_TW", "ja", "en", "de"]) {
      const tr = await localeTranslator(locale);
      const { rows } = await renderQueueBar({ ok: true, pause: null, account: LD, queue }, tr);
      for (const row of rows) {
        assert(row.hint === tr("offlineQueueAttentionHint"), locale + " " + row.id + " hint: " + row.hint);
        assert(row.reason && !row.reason.includes(row.hint), locale + " " + row.id + " cause: " + row.reason);
        assert(!/[?$]/.test(row.reason), locale + " " + row.id + " shows a guess or a placeholder: " + row.reason);
        if (/^pin-\d/.test(row.id)) assert(/[.。]$/.test(row.reason), locale + " " + row.id + " is not a full sentence: " + row.reason);
      }
      const by = Object.fromEntries(rows.map((row) => [row.id, row.reason]));
      assert(by["ld-title"] === tr("titleTooLong", "512"), locale + " title: " + by["ld-title"]);
      assert(by["pin-long"] === tr("submitUriTooLong"), locale + " Pinboard too long: " + by["pin-long"]);
      assert(by["pin-404"].includes("404") && by["pin-404"] === tr("pinboardErrRejected", "404"), locale + " Pinboard 404: " + by["pin-404"]);
    }
  });
  // A queued popup create that replays leaves no session draft behind, unless the
  // draft holds a newer edit; other owners and other pages are never touched.
  await test("a replayed queued save clears its popup session draft but keeps newer edits and other rows", async () => {
    const source = await (await fetch("../background.js")).text();
    const start = source.indexOf("async function pbpClearReplayedPopupDraft(");
    const end = source.indexOf("// Connection-level replay pause. A gateway,", start);
    assert(start >= 0 && end > start, "pbpClearReplayedPopupDraft source not found");
    assert(/onSuccess:[\s\S]{0,400}pbpClearReplayedPopupDraft\(item\)/.test(source), "onSuccess does not clear the draft");
    const LD = "linkding:https://ld.example/:c1";
    const url = "https://page.example/a";
    const draft = (over = {}) => ({ url, title: "T", notes: "N", tags: ["Work", "x y"], tagInput: "", private: false, toread: false, archive: false, archiveTouched: false, ...over });
    const key = (owner, kind, u) => "pbp-popup-draft:" + encodeURIComponent(owner) + ":" + kind + ":" + encodeURIComponent(u);
    const row = (owner, u, d) => ({ owner, pageUrl: u, incognito: false, updatedAt: Date.now(), draft: d });
    const run = async (item, rows, currentAccount = LD) => {
      const store = { ...rows };
      const chromeStub = { storage: { session: { get: async () => ({ ...store }), remove: async (keys) => { for (const k of [].concat(keys)) delete store[k]; } } } };
      const fn = new Function("chrome", "navigator", "getCurrentBookmarkAuth", "pbpBookmarkAccountService", "pbpBookmarkParseTags",
        source.slice(start, end) + "\nreturn pbpClearReplayedPopupDraft;")(
        chromeStub, { locks: { request: (name, cb) => cb() } }, async () => ({ account: currentAccount }), pbpBookmarkAccountService, pbpBookmarkParseTags);
      await fn(item);
      return Object.keys(store);
    };
    const item = { queueId: "q1", account: LD, url, title: "T", notes: "N", tags: 'work "x y"' };
    const other = key("alice", "normal", url), otherPage = key(LD, "normal", "https://page.example/b");
    const rows = {
      [key(LD, "normal", url)]: row(LD, url, draft()),
      [key(LD, "private", url)]: row(LD, url, draft()),
      [other]: row("alice", url, draft()),
      [otherPage]: row(LD, "https://page.example/b", draft({ url: "https://page.example/b" })),
    };
    assert((await run(item, rows)).sort().join("|") === [other, otherPage].sort().join("|"), "kept rows: " + (await run(item, rows)).join("|"));
    const edited = { [key(LD, "normal", url)]: row(LD, url, draft({ notes: "N plus a newer edit" })) };
    assert((await run(item, edited)).length === 1, "a newer edit was cleared");
    const pending = { [key(LD, "normal", url)]: row(LD, url, draft({ tagInput: "typing" })) };
    assert((await run(item, pending)).length === 1, "unsubmitted tag text was cleared");
    assert((await run(item, rows, "linkding:https://other/:c9")).length === 4, "cleared while another connection is current");
  });
  // The production keepalive check and release (background.js), with only
  // the queue, pause, connection and alarm stores stubbed.
  await test("the keepalive alarm is released when only records replay will not send remain", async () => {
    const source = await (await fetch("../background.js")).text();
    const start = source.indexOf("let _keepaliveAlarmEnsured = false;");
    const end = source.indexOf("// Badge refresh is its own", start);
    assert(start >= 0 && end > start, "keepalive source not found");
    const pauseStart = source.indexOf("const PBP_OFFLINE_QUEUE_PAUSE_KEY");
    const pauseEnd = source.indexOf("function pbpReadOfflineQueuePause()", pauseStart);
    assert(pauseStart >= 0 && pauseEnd > pauseStart, "pause source not found");
    const LD = "linkding:https://ld.example/:c1", KK = "karakeep:https://kk.example/:u1";
    const run = async (queue, pause) => {
      const log = { ensured: 0, cleared: 0 };
      const local = { offlineQueue: queue, ...(pause ? { offlineQueuePause: pause } : {}) };
      const deps = {
        chrome: { storage: { local: { get: async (keys) => Object.fromEntries([].concat(keys).filter((k) => local[k] !== undefined).map((k) => [k, local[k]])) },
          session: { get: async () => ({ _lastActivityTs: 0 }) } }, alarms: { clear: async () => { log.cleared++; return true; } } },
        ensurePeriodicAlarm: () => { log.ensured++; }, _lastActivityTs: 0, KEEPALIVE_WINDOW_MS: 600000,
        getCurrentBookmarkAuth: async () => ({ account: LD, token: "fixture" }),
      };
      const api = new Function(...Object.keys(deps), source.slice(pauseStart, pauseEnd) + source.slice(start, end)
        + "\nreturn { _keepaliveAlarmStillNeeded, _maybeReleaseKeepaliveAlarm };")(...Object.values(deps));
      const needed = await api._keepaliveAlarmStillNeeded();
      await api._maybeReleaseKeepaliveAlarm();
      return { needed, ...log };
    };
    const now = Date.now();
    const rec = (queueId, account, failure) => ({ queueId, account, url: "https://page.example/" + queueId, ...(failure ? { failure } : {}) });
    const attention = rec("a", LD, { code: "remote", at: now, status: 400 });
    const other = rec("o", KK);
    const longHold = rec("l", LD, { code: "rate_limited", at: now, retryAfter: now + 30 * 60000 });
    const paused = { account: LD, reason: "gateway_denied", ts: now };
    for (const [label, queue, pause] of [["attention only", [attention]], ["other connection only", [other]],
      ["paused connection only", [rec("p", LD)], paused], ["rate limit past the next tick", [longHold]],
      ["all four", [attention, other, longHold, rec("p", LD)], paused], ["empty", []]]) {
      const r = await run(queue, pause);
      assert(!r.needed && r.cleared === 1 && r.ensured === 0, label + ": " + JSON.stringify(r));
    }
    for (const [label, queue] of [["a plain record", [attention, rec("x", LD)]],
      ["a rate limit ending before the next tick", [rec("s", LD, { code: "rate_limited", at: now, retryAfter: now + 60000 })]],
      ["a legacy record without a marker", [{ url: "https://page.example/legacy", account: LD }]]]) {
      const r = await run(queue);
      assert(r.needed && r.cleared === 0, label + ": " + JSON.stringify(r));
    }
  });
  await test("drain skips items the hook marks and reports failures to onFailure", async () => {
    const run = async (hooks) => {
      let queue = Q();
      const sent = [];
      const failures = [];
      const outcomes = await pbpDrainOfflineQueue(["a", "b", "c"], {
        getItem: (queueId) => queue.find((item) => item.queueId === queueId) || null,
        sendItem: (item) => { sent.push(item.queueId); return item.queueId === "a" ? { result: { status: "failed", reason: "gateway_redirect" } } : true; },
        removeItem: (queueId) => { queue = pbpOfflineQueueReduce(queue, { kind: "remove", queueId }); },
        onSuccess: () => {},
        ...hooks,
        ...(hooks.onFailure ? { onFailure: async (item, delivered) => { await hooks.onFailure(item, delivered); failures.push([item.queueId, delivered.result.reason]); } } : {}),
      });
      return { queue, sent, failures, outcomes };
    };
    const hooked = await run({ skipItem: async (item) => item.queueId === "b", onFailure: () => {} });
    assert(hooked.sent.join() === "a,c", "the marked item is never sent: " + hooked.sent.join());
    assert(hooked.failures.length === 1 && hooked.failures[0].join() === "a,gateway_redirect", "the failed item reaches onFailure once");
    assert(hooked.outcomes.map((o) => o.item.queueId).join() === "a,c", "a skipped item yields no outcome");
    assert(hooked.queue.map((i) => i.queueId).join() === "a,b", "failed and skipped items stay queued");

    const plain = await run({});
    assert(plain.sent.join() === "a,b,c", "without hooks every item is sent");
    assert(plain.outcomes.length === 3 && !plain.outcomes[0].acknowledged && plain.outcomes[1].acknowledged, "outcomes unchanged without hooks");
    assert(plain.queue.map((i) => i.queueId).join() === "a", "only the failed item remains without hooks");
  });
});
})();
