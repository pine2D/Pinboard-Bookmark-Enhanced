<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Options Listbox Tests</title>
<style>
.case.pass{color:#0a0}.case.fail{color:#c00;font-weight:bold}
#fixture{position:absolute;left:-10000px;top:0;width:1200px;height:900px;border:0}
</style>
</head><body>
<div id="results"></div>
<iframe id="fixture" title="Options listbox fixture"></iframe>
<script>
// The listbox primitive (spec stage2 §3, COMPONENTS.md §6.4 exception 2) is
// exercised on the REAL options page: options.html is loaded into an iframe
// with every one of its own <script> tags kept (a <base> points them at the
// repo root), so i18n.js, shared.js, options-listbox.js and options.js all
// boot exactly as they do in the extension. The only thing the fixture adds
// is a chrome.* stub (empty storage, no permissions, English messages from
// _locales/en) injected ahead of options-theme-early.js. That is what makes
// the two integration cases real: the provider .pf reveal and the translate
// "custom" input are options.js's own change listeners, not test doubles.
const TOTAL = 38;
const results = document.getElementById("results");
function report(name, error) {
  const row = document.createElement("div");
  row.className = "case " + (error ? "fail" : "pass");
  row.textContent = (error ? "X " : "OK ") + name + (error ? " :: " + error.message : "");
  results.appendChild(row);
}
function assert(condition, message) { if (!condition) throw new Error(message); }
const queue = [];
function test(name, fn) { queue.push([name, fn]); }

// Serialised into the fixture as source text, so it must be self-contained.
function pbpTestChromeStub(enMessages, storageDelayMs, localSeed) {
  storageDelayMs = storageDelayMs || 0;
  const event = () => ({ addListener() {}, removeListener() {}, hasListener() { return false; } });
  // storageDelayMs (stage-3b Task 5, S1 load-order test): every OTHER caller
  // of this stub passes it as 0, which keeps the exact prior behaviour
  // (setTimeout(0) for callback style, a bare Promise.resolve for the
  // promise style -- no macrotask at all). Only the dedicated load-order
  // test below passes a real delay, to push chrome.storage's resolution
  // past options-listbox.js's own one-shot DOMContentLoaded rAF sync.
  const done = (args, value) => {
    const cb = args.length && typeof args[args.length - 1] === "function" ? args[args.length - 1] : null;
    if (cb) { setTimeout(() => cb(value), storageDelayMs); return undefined; }
    if (storageDelayMs > 0) return new Promise((resolve) => setTimeout(() => resolve(value), storageDelayMs));
    return Promise.resolve(value);
  };
  const store = (seed) => {
    const data = Object.assign({}, seed || {});
    return {
      get(keys, ...rest) {
        let out = {};
        if (keys == null) out = { ...data };
        else if (typeof keys === "string") { if (keys in data) out[keys] = data[keys]; }
        else if (Array.isArray(keys)) keys.forEach((k) => { if (k in data) out[k] = data[k]; });
        else if (typeof keys === "object") Object.keys(keys).forEach((k) => { out[k] = k in data ? data[k] : keys[k]; });
        return done(rest.length ? rest : (typeof keys === "function" ? [keys] : []), out);
      },
      set(items, ...rest) { Object.assign(data, items || {}); return done(rest, undefined); },
      remove(keys, ...rest) { [].concat(keys).forEach((k) => delete data[k]); return done(rest, undefined); },
      clear(...rest) { Object.keys(data).forEach((k) => delete data[k]); return done(rest, undefined); },
      getBytesInUse(...rest) { return done(rest, 0); },
      onChanged: event(),
      QUOTA_BYTES: 102400, QUOTA_BYTES_PER_ITEM: 8192,
    };
  };
  // Anything the page reaches that is not spelled out below is a callable,
  // resolve-to-undefined namespace, and every on* member is an event object.
  const loose = (base) => new Proxy(base, {
    get(target, prop) {
      if (prop in target) return target[prop];
      if (typeof prop !== "string" || prop === "then") return undefined;
      if (prop === "lastError") return undefined;
      if (/^on[A-Z]/.test(prop)) return (target[prop] = event());
      const fn = (...args) => done(args, undefined);
      return (target[prop] = loose(fn));
    },
  });
  const message = (key) => (enMessages[key] && enMessages[key].message) || "";
  return loose({
    runtime: loose({
      id: "pbp-listbox-fixture",
      getManifest: () => ({ version: "0.0.0", manifest_version: 3, permissions: [], optional_permissions: [], optional_host_permissions: [], host_permissions: [], oauth2: {} }),
      getURL: (path) => path,
      sendMessage: (...args) => done(args, undefined),
      connect: () => ({ onMessage: event(), onDisconnect: event(), postMessage() {}, disconnect() {} }),
      onMessage: event(),
    }),
    // localSeed only matters for the S1 load-order fixture below -- settings
    // in this fixture always route to local (optSyncEnabled is unset/false).
    storage: loose({ local: store(localSeed), sync: store(), session: store(), onChanged: event() }),
    i18n: loose({ getMessage: message, getUILanguage: () => "en" }),
    permissions: loose({
      contains: (...args) => done(args, false),
      getAll: (...args) => done(args, { origins: [], permissions: [] }),
      request: (...args) => done(args, false),
      remove: (...args) => done(args, true),
    }),
    tabs: loose({ query: (...args) => done(args, []) }),
  });
}

(async () => {
  const source = await fetch("../options.html").then((response) => response.text());
  const enMessages = await fetch("../_locales/en/messages.json").then((response) => response.json());
  const zhMessages = await fetch("../_locales/zh_CN/messages.json").then((response) => response.json());
  const stub = "<script>window.chrome = (" + pbpTestChromeStub.toString() + ")(" +
    JSON.stringify(enMessages).replace(/<\//g, "<\\/") + ");<\/script>";
  const booted = source.replace("<head>", "<head><base href=\"../\">" + stub);
  const frame = document.getElementById("fixture");
  const loaded = new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
  frame.srcdoc = booted;
  await loaded;
  const win = frame.contentWindow;
  const doc = frame.contentDocument;
  // activateTab() (options.js) ends every real tab click with
  // history.replaceState(null, "", "#" + panel) -- harmless on a normal
  // page, but this fixture's `about:srcdoc` document has no URL a history
  // entry can be built against, so the native call throws (stage-3b Task 5's
  // new reset-flow tests are the first ones here to click a real .tab-btn
  // instead of the showPanel() class-toggle helper below). A no-op stub is
  // simplest: nothing in this suite reads location.hash back.
  win.history.replaceState = () => {};
  const nextFrame = () => new Promise((resolve) => win.requestAnimationFrame(() => resolve()));
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  // options.js's DOMContentLoaded handler is async (storage round trips);
  // let it and the enhancer's queued rAF sync settle.
  for (let i = 0; i < 20 && !doc.getElementById("opt-ai-provider-btn"); i++) await sleep(50);
  await sleep(200);
  await nextFrame(); await nextFrame();

  const provider = () => doc.getElementById("opt-ai-provider");
  const lang = () => doc.getElementById("translate-target-lang");
  // showConfirmPopover's dismiss() (shared.js) defers actual DOM removal to a
  // CSS transitionend/timeout when `motion-ready` is on <html> -- clearing
  // `_activeConfirmPopover` synchronously but leaving the OLD popover element
  // in the document for ~150ms. Two reset-flow tests run back to back (no
  // real user pause between them) can therefore both have a `.confirm-
  // popover` present at once; a bare `document.querySelector` would grab the
  // stale FIRST one in document order (still-closing, already dismissed --
  // its own re-click re-runs the PREVIOUS test's onConfirm, not this one's).
  // Always take the last one, i.e. the one this test's own reset-panel-btn
  // click just opened.
  const confirmYes = () => { const p = doc.querySelectorAll(".confirm-popover .confirm-yes"); return p[p.length - 1] || null; };
  const btnOf = (select) => doc.getElementById(select.id + "-btn");
  const listOf = (select) => doc.getElementById(select.id + "-list");
  const popOf = (select) => listOf(select)?.parentElement;
  const itemsOf = (select) => [...(listOf(select)?.querySelectorAll('[role="option"]') || [])];
  const activeIndex = (select) => {
    const id = btnOf(select)?.getAttribute("aria-activedescendant") || "";
    return itemsOf(select).findIndex((li) => li.id === id);
  };
  const key = (target, k, init = {}) => {
    const ev = new win.KeyboardEvent("keydown", Object.assign({ key: k, bubbles: true, cancelable: true }, init));
    target.dispatchEvent(ev);
    return ev;
  };
  const showPanel = (id) => {
    doc.querySelectorAll(".panel").forEach((panel) => panel.classList.toggle("active", panel.id === id));
  };
  const setValue = (select, value) => {
    select.value = value;
    win.pbpListboxSync?.(select);
  };
  const close = (select) => { if (btnOf(select)?.getAttribute("aria-expanded") === "true") key(btnOf(select), "Escape"); };

  test("enhances every data-listbox select and hides the natives", () => {
    // Stage-3a Task 1 widened the panel of data-listbox selects from two to
    // five (opt-ai-tag-lang, opt-ai-summary-lang, opt-ai-tag-separator joined
    // opt-ai-provider/translate-target-lang); Task 2 added opt-selection-
    // trigger (Reader tab), a sixth. Fixwave (final review, test-churn note):
    // pinning the raw total (`=== 6`) meant every later stage that migrates
    // one more <select> onto data-listbox had to touch this assertion just
    // to keep it passing, with no behavioural payoff -- the actual invariant
    // this test protects is "every data-listbox select got wrapped, none
    // were skipped or double-wrapped", which `wrappers.length ===
    // targets.length` already states directly, plus a non-empty floor so an
    // accidental zero-match selector still fails loudly instead of vacuously
    // passing.
    const targets = [...doc.querySelectorAll("select[data-listbox]")];
    const wrappers = doc.querySelectorAll(".listbox");
    assert(targets.length > 0, "expected at least one data-listbox select, got 0");
    assert(wrappers.length === targets.length,
      "expected " + targets.length + " .listbox wrappers (one per data-listbox select), got " + wrappers.length);
    for (const select of targets) {
      assert(select && select.hasAttribute("data-listbox"), (select?.id || "?") + " lost data-listbox");
      assert(select.hidden === true, select.id + " native select is not hidden");
      assert(select.isConnected, select.id + " native select was removed");
      const btn = btnOf(select);
      const list = listOf(select);
      assert(btn && btn.tagName === "BUTTON" && btn.getAttribute("type") === "button", select.id + " has no button");
      assert(btn.getAttribute("role") === "combobox", select.id + " button role=" + btn.getAttribute("role"));
      assert(btn.getAttribute("aria-haspopup") === "listbox", select.id + " aria-haspopup");
      assert(btn.getAttribute("aria-expanded") === "false", select.id + " starts expanded");
      assert(btn.getAttribute("aria-controls") === select.id + "-list", select.id + " aria-controls");
      assert(list && list.getAttribute("role") === "listbox", select.id + " list missing");
      const pop = popOf(select);
      assert(pop?.classList.contains("listbox-pop") && pop.parentElement === select.nextElementSibling, select.id + " list is not inside the .listbox-pop shell");
      assert(pop.hidden, select.id + " popover starts open");
      assert(list.getAttribute("tabindex") === "-1", select.id + " list tabindex");
      const items = itemsOf(select);
      assert(items.length === select.options.length, select.id + " option count " + items.length + " vs " + select.options.length);
      items.forEach((li, i) => {
        assert(li.id === select.id + "-opt-" + i, "option id " + li.id);
        assert(li.dataset.value === select.options[i].value, "option data-value " + li.dataset.value);
      });
      assert(btn.querySelector(".listbox-value"), select.id + " no .listbox-value");
      assert(btn.querySelector("svg path[d='m6 9 6 6 6-6']"), select.id + " chevron is not the Lucide chevron-down SVG");
      assert(select.nextElementSibling?.classList.contains("listbox"), select.id + " wrapper is not right after the select");
    }
    assert(btnOf(provider()).getAttribute("aria-labelledby") === "sec-ai-provider", "provider aria-labelledby not copied");
    assert(doc.getElementById("translate-target-lang-label").htmlFor === "translate-target-lang-btn", "translate label[for] not re-pointed to the button");
    assert(btnOf(lang()).getAttribute("aria-labelledby") === "translate-target-lang-label", "translate button not labelled by its label");
    const ids = [...doc.querySelectorAll("[id]")].map((el) => el.id);
    assert(ids.length === new Set(ids).size, "duplicate ids after enhancement");
    const others = [...doc.querySelectorAll("select:not([data-listbox])")].filter((s) => s.hidden);
    assert(others.length === 0, "a select without data-listbox was hidden: " + others.map((s) => s.id).join(","));
  });

  test("button shows the selected option's text", () => {
    setValue(provider(), "gemini");
    assert(btnOf(provider()).querySelector(".listbox-value").textContent === provider().selectedOptions[0].textContent.trim(),
      "provider button text=" + btnOf(provider()).textContent);
    setValue(lang(), "ja");
    assert(btnOf(lang()).querySelector(".listbox-value").textContent === "日本語", "translate button text=" + btnOf(lang()).textContent);
    const sel = itemsOf(lang()).filter((li) => li.getAttribute("aria-selected") === "true");
    assert(sel.length === 1 && sel[0].dataset.value === "ja", "aria-selected not on exactly the current option");
    setValue(lang(), "auto");
  });

  test("click opens; aria-expanded true; active = selected", () => {
    showPanel("panel-ai");
    setValue(provider(), "claude");
    const btn = btnOf(provider());
    btn.click();
    assert(btn.getAttribute("aria-expanded") === "true", "click did not open");
    assert(!popOf(provider()).hidden, "list still hidden");
    assert(activeIndex(provider()) === 2, "active index " + activeIndex(provider()) + " (want the selected 2)");
    assert(itemsOf(provider())[2].hasAttribute("data-active"), "active item not marked data-active");
    btn.click();
    assert(btn.getAttribute("aria-expanded") === "false" && popOf(provider()).hidden, "second click did not close");
    assert(!btn.hasAttribute("aria-activedescendant"), "aria-activedescendant left set while closed");
    setValue(provider(), "gemini");
  });

  test("ArrowDown opens and moves active; Home/End; PageDown/PageUp clamp", () => {
    showPanel("panel-ai");
    setValue(provider(), "gemini");
    const btn = btnOf(provider());
    const last = provider().options.length - 1;
    const ev = key(btn, "ArrowDown");
    assert(ev.defaultPrevented, "ArrowDown not consumed");
    assert(btn.getAttribute("aria-expanded") === "true", "ArrowDown did not open");
    assert(activeIndex(provider()) === 0, "open should land on the selected option, got " + activeIndex(provider()));
    key(btn, "ArrowDown");
    assert(activeIndex(provider()) === 1, "ArrowDown did not move, got " + activeIndex(provider()));
    key(btn, "ArrowUp"); key(btn, "ArrowUp");
    assert(activeIndex(provider()) === 0, "ArrowUp did not clamp at 0, got " + activeIndex(provider()));
    key(btn, "End");
    assert(activeIndex(provider()) === last, "End -> " + activeIndex(provider()));
    key(btn, "ArrowDown");
    assert(activeIndex(provider()) === last, "ArrowDown did not clamp at the end");
    key(btn, "PageUp");
    assert(activeIndex(provider()) === last - 10, "PageUp -> " + activeIndex(provider()));
    key(btn, "PageUp");
    assert(activeIndex(provider()) === 0, "PageUp did not clamp at 0, got " + activeIndex(provider()));
    key(btn, "PageDown");
    assert(activeIndex(provider()) === 10, "PageDown -> " + activeIndex(provider()));
    key(btn, "PageDown");
    assert(activeIndex(provider()) === last, "PageDown did not clamp at the end");
    key(btn, "Home");
    assert(activeIndex(provider()) === 0, "Home -> " + activeIndex(provider()));
    assert(provider().value === "gemini", "navigation alone changed the value");
    close(provider());
  });

  test("type-ahead jumps to the first option starting with the typed letters", async () => {
    showPanel("panel-ai");
    setValue(provider(), "gemini");
    const btn = btnOf(provider());
    key(btn, "ArrowDown");
    key(btn, "o"); key(btn, "l");
    assert(itemsOf(provider())[activeIndex(provider())]?.dataset.value === "ollama", "'ol' landed on " + itemsOf(provider())[activeIndex(provider())]?.dataset.value);
    await sleep(650);
    key(btn, "m");
    assert(itemsOf(provider())[activeIndex(provider())]?.dataset.value === "minimax", "'m' after the buffer expired landed on " + itemsOf(provider())[activeIndex(provider())]?.dataset.value);
    key(btn, "m");
    await sleep(650);
    assert(provider().value === "gemini", "type-ahead changed the value");
    close(provider());
  });

  test("Enter selects: select.value updated, change bubbled, list closed, focus on button", () => {
    showPanel("panel-ai");
    setValue(provider(), "gemini");
    const btn = btnOf(provider());
    btn.focus();
    let changes = 0;
    const onChange = (ev) => { if (ev.target === provider()) changes++; };
    doc.addEventListener("change", onChange);
    key(btn, "ArrowDown"); key(btn, "ArrowDown"); key(btn, "ArrowDown");
    const ev = key(btn, "Enter");
    doc.removeEventListener("change", onChange);
    assert(ev.defaultPrevented, "Enter not consumed");
    assert(provider().value === "claude", "value=" + provider().value);
    assert(changes === 1, "change events seen at document: " + changes);
    assert(popOf(provider()).hidden && btn.getAttribute("aria-expanded") === "false", "list still open");
    assert(doc.activeElement === btn, "focus left the button: " + doc.activeElement?.id);
    assert(btn.querySelector(".listbox-value").textContent === provider().selectedOptions[0].textContent.trim(), "button text not updated");
    setValue(provider(), "gemini");
  });

  test("Escape closes without changing value", () => {
    showPanel("panel-ai");
    setValue(provider(), "gemini");
    const btn = btnOf(provider());
    key(btn, "ArrowDown"); key(btn, "End");
    const ev = key(btn, "Escape");
    assert(ev.defaultPrevented, "Escape not consumed while open");
    assert(popOf(provider()).hidden, "Escape did not close");
    assert(provider().value === "gemini", "Escape changed the value to " + provider().value);
    const idle = key(btn, "Escape");
    assert(!idle.defaultPrevented, "Escape swallowed while closed");
  });

  test("Tab closes and does not trap focus", () => {
    showPanel("panel-ai");
    setValue(provider(), "gemini");
    const btn = btnOf(provider());
    btn.focus();
    key(btn, "ArrowDown"); key(btn, "ArrowDown");
    const ev = key(btn, "Tab");
    assert(!ev.defaultPrevented, "Tab default prevented (focus trap)");
    assert(popOf(provider()).hidden && btn.getAttribute("aria-expanded") === "false", "Tab did not close");
    assert(provider().value === "openai", "Tab should commit the active option, value=" + provider().value);
    const idle = key(btn, "Tab");
    assert(!idle.defaultPrevented, "Tab default prevented while closed");
    setValue(provider(), "gemini");
  });

  test("outside click closes", () => {
    showPanel("panel-ai");
    setValue(provider(), "gemini");
    const btn = btnOf(provider());
    btn.click();
    assert(!popOf(provider()).hidden, "did not open");
    const inside = itemsOf(provider())[3];
    inside.dispatchEvent(new win.PointerEvent("pointerdown", { bubbles: true, cancelable: true }));
    assert(!popOf(provider()).hidden, "pointerdown inside the list closed it");
    const outside = doc.getElementById("sec-ai-provider");
    outside.dispatchEvent(new win.PointerEvent("pointerdown", { bubbles: true, cancelable: true }));
    outside.click();
    assert(popOf(provider()).hidden && btn.getAttribute("aria-expanded") === "false", "outside click did not close");
    assert(provider().value === "gemini", "outside click changed the value");
  });

  test("provider change through the listbox reveals the matching .pf", () => {
    showPanel("panel-ai");
    setValue(provider(), "gemini");
    provider().dispatchEvent(new win.Event("change", { bubbles: true }));
    assert(doc.getElementById("fields-gemini").hidden === false, "precondition: gemini fields hidden");
    btnOf(provider()).click();
    const openai = itemsOf(provider()).find((li) => li.dataset.value === "openai");
    openai.click();
    assert(provider().value === "openai", "value=" + provider().value);
    assert(doc.getElementById("fields-openai").hidden === false, "fields-openai still hidden");
    assert(doc.getElementById("fields-gemini").hidden === true, "fields-gemini still shown");
    assert(popOf(provider()).hidden, "option click did not close the list");
    btnOf(provider()).click();
    itemsOf(provider()).find((li) => li.dataset.value === "gemini").click();
    assert(doc.getElementById("fields-gemini").hidden === false, "switching back did not restore gemini");
  });

  test("translate 'custom' through the listbox reveals the free-text input", () => {
    showPanel("panel-reader");
    setValue(lang(), "auto");
    lang().dispatchEvent(new win.Event("change", { bubbles: true }));
    const custom = doc.getElementById("translate-target-lang-custom");
    assert(custom.classList.contains("hidden"), "precondition: custom input visible");
    btnOf(lang()).click();
    itemsOf(lang()).find((li) => li.dataset.value === "custom").click();
    assert(lang().value === "custom", "value=" + lang().value);
    assert(!custom.classList.contains("hidden"), "custom input still hidden");
    // Stage-3a Task 2: #panel-reader now carries [data-ui-stage0], so this
    // input (a direct child of the .entry-block the listbox also lives in)
    // is reached by the existing `[data-ui-stage0] .entry-block > input
    // max-width: none` rule (options.css) -- the same "controls fill the
    // content column" rule every OTHER entry-block text field already
    // follows. It no longer keeps the select's old "beside it" placement
    // (that relied on a 320px max-width this rule now removes); it stacks
    // below instead, spaced by `.fg > .listbox + input { margin-top: sp-3 }`,
    // flush with the listbox button's own left edge.
    assert(custom.getClientRects().length > 0, "custom input has no layout box");
    assert(custom.getBoundingClientRect().top >= btnOf(lang()).getBoundingClientRect().bottom, "custom input is not below the listbox");
    assert(Math.abs(custom.getBoundingClientRect().left - btnOf(lang()).getBoundingClientRect().left) <= 1, "custom input does not share the listbox button's left edge");
    btnOf(lang()).click();
    itemsOf(lang()).find((li) => li.dataset.value === "auto").click();
    assert(custom.classList.contains("hidden"), "custom input not re-hidden");
  });

  test("programmatic value + pbpListboxSync updates the button text", () => {
    assert(typeof win.pbpListboxSync === "function" && typeof win.pbpEnhanceListbox === "function", "exports missing");
    const count = itemsOf(provider()).length;
    provider().value = "kimi";
    win.pbpListboxSync(provider());
    win.pbpListboxSync(provider());
    assert(btnOf(provider()).querySelector(".listbox-value").textContent === "Kimi", "button text=" + btnOf(provider()).textContent);
    assert(itemsOf(provider()).length === count, "repeated sync changed the option count");
    assert(doc.querySelectorAll("#opt-ai-provider-btn").length === 1, "repeated sync duplicated the button");
    // Total .listbox count follows the live select[data-listbox] count
    // (stage-3a widened this from 2 to 6 across Tasks 1-2) -- re-enhancing an
    // already-enhanced select must not add to it.
    const totalListboxes = doc.querySelectorAll("select[data-listbox]").length;
    assert(win.pbpEnhanceListbox(provider()) && doc.querySelectorAll(".listbox").length === totalListboxes,
      "re-enhance created a second wrapper");
    const bare = doc.createElement("select");
    win.pbpListboxSync(bare); // no-op, must not throw
    setValue(provider(), "gemini");
  });

  // Stage-3b Task 4 (2026-09-24-ui-system-stage3b): the appearance panel's
  // #opt-theme select joins data-listbox. Its own 'change' listener
  // (options.js) re-applies the options-page theme (pbpApplyOptionsEarlyTheme
  // via applyOptionsPageTheme) and re-renders the preset preview -- if that
  // path threw, run-test.mjs's pageerror listener would fail this whole
  // suite, so simply exercising the pick through the listbox UI is itself
  // the "runs without throwing" assertion; the value/dataset checks below
  // confirm it actually ran rather than merely not-erroring.
  test("opt-theme choice through the listbox re-applies the options-page theme without throwing", () => {
    showPanel("panel-appearance");
    const sel = doc.getElementById("opt-theme");
    btnOf(sel).click();
    itemsOf(sel).find((li) => li.dataset.value === "dark").click();
    assert(sel.value === "dark", "value=" + sel.value);
    assert(popOf(sel).hidden, "option click did not close the list");
    // No saved theme preset is active in this fixture, so Dark forces the
    // adaptive default preset's dark variant (options-theme-early.js); Light
    // clears data-theme entirely. Both are deterministic regardless of the
    // host's own OS colour scheme, since a non-"auto" mode short-circuits
    // prefersDark.
    assert(doc.documentElement.dataset.theme === "flexoki-dark", "dataset.theme=" + doc.documentElement.dataset.theme);
    btnOf(sel).click();
    itemsOf(sel).find((li) => li.dataset.value === "light").click();
    assert(sel.value === "light", "value=" + sel.value);
    assert(!("theme" in doc.documentElement.dataset), "dataset.theme did not clear for Light, got " + doc.documentElement.dataset.theme);
    // Restore auto so later tests/screens see the default.

  test("cold load with a late (macrotask) storage resolution leaves every listbox synced (S1)", async () => {
    const frame2 = document.createElement("iframe");
    frame2.id = "fixture2";
    frame2.title = "Options listbox late-storage fixture";
    frame2.style.cssText = "position:absolute;left:-10000px;top:0;width:1200px;height:900px;border:0";
    document.body.appendChild(frame2);
    try {
      // Seeded away from every field's own static HTML default (opt-lang's
      // first option is "auto", opt-theme's is "auto", opt-md-image-policy's
      // is "keep", the two AI-behavior language selects default to "en"/

      // leave every select's .value UNCHANGED from what it already was at

      const localSeed = {
        optLang: "zh_CN", optTheme: "dark", mdExportImagePolicy: "strip",
        aiTagLang: "fr", aiSummaryLang: "de", aiTagSeparator: "_",
      };
      // 40ms, not 0: real (empirically traced) boot makes ~8-10 SEQUENTIAL
      // chrome.storage.local.get() round trips before the one big call that
      // actually drives the settings fieldMap loop (an early optSyncEnabled
      // probe, an early optLang locale probe that alone can trigger its own
      // applyI18n() re-sync, an early theme probe, a couple of provider/
      // credential probes, ...) -- each one awaited in turn, so the delay is
      // cumulative. 40ms per hop is comfortably >> one requestAnimationFrame
      // tick (~16ms, all options-listbox.js's own boot sync gets), so even
      // the FIRST hop alone already loses that race; the full chain lands
      // the real settings load at roughly the 800ms mark below.
      const stub2 = "<script>window.chrome = (" + pbpTestChromeStub.toString() + ")(" +
        JSON.stringify(enMessages).replace(/<\//g, "<\\/") + ", 40, " +
        JSON.stringify(localSeed) + ");<\/script>";
      const booted2 = source.replace("<head>", "<head><base href=\"../\">" + stub2);
      const loaded2 = new Promise((resolve) => frame2.addEventListener("load", resolve, { once: true }));
      frame2.srcdoc = booted2;
      await loaded2;
      const doc2 = frame2.contentDocument;
      // Poll for the seeded settings to land (the traced settle point is
      // ~800ms; the cap below is 5s) instead of a fixed wait that either
      // wastes time or races a slower machine, then give the load path one
      // more tick to run its post-load listbox sync.
      for (let i = 0; i < 100 && doc2.getElementById("opt-lang").value !== "zh_CN"; i++) await sleep(50);
      await sleep(50);
      // Guard against a silently vacuous pass: if the seeded settings never
      // actually landed (e.g. a future boot-order change adds yet another
      // sequential storage round trip past this wait), every select would
      // still sit on its own static HTML default and every button would
      // trivially "match" it without this task's fix doing any work.

        const got = btn.querySelector(".listbox-value")?.textContent || "";
        if (got !== want) mismatches.push(sel.id + ': got "' + got + '", want "' + want + '"');
      });
      assert(mismatches.length === 0, "stale listbox button(s) after a late storage resolve: " + mismatches.join("; "));
    } finally {

  // Fixwave stage2 product-bug fix: options.js debounces autosave 500ms
  // (scheduleAutoSave) with no teardown flush, so a change made <500ms
  // before the tab closed/hid was silently discarded. options.js now flushes
  // a pending timer on document visibilitychange->hidden (and window
  // pagehide) by cancelling it and calling saveAllSafely() right away. This
  // drives the change through the REAL listbox click path (same as the
  // "provider change through the listbox" test above), so it exercises
  // bindAutoSave's actual `change` listener on the underlying <select>, not
  // a synthetic shortcut.
  test("visibilitychange(hidden) flushes a pending debounced autosave before the 500ms timer would fire", async () => {
    showPanel("panel-ai");
    // Let any earlier test's own real `change` event finish its autosave
    // first, so this test's spy only ever sees ITS OWN save.
    await sleep(600);
    setValue(provider(), "gemini");
    const localStore = win.chrome.storage.local;
    const syncStore = win.chrome.storage.sync;
    const origLocalSet = localStore.set;
    const origSyncSet = syncStore.set;
    let setCalls = 0;
    localStore.set = (...args) => { setCalls++; return origLocalSet.apply(localStore, args); };
    syncStore.set = (...args) => { setCalls++; return origSyncSet.apply(syncStore, args); };
    try {
      btnOf(provider()).click();
      const target = itemsOf(provider()).find((li) => li.dataset.value === "openai");
      target.click();
      assert(provider().value === "openai", "value=" + provider().value);
      // scheduleAutoSave() only arms a setTimeout; nothing has awaited yet,
      // so storage.set cannot have been reached synchronously off the click.
      assert(setCalls === 0, "storage.set fired synchronously off the change -- scheduleAutoSave should debounce, not save inline");
      // Simulate the tab being hidden mid-debounce (switch away / close).
      Object.defineProperty(doc, "visibilityState", { value: "hidden", configurable: true });
      doc.dispatchEvent(new win.Event("visibilitychange"));
      // The flush's own chain (pbpQueueOptionsSave -> saveAll ->
      // persistSettings' awaited secret-routing read -> storage.set) still
      // needs a handful of real microtask/lock ticks -- assert it lands well
      // inside a couple hundred ms, not that it is instantaneous, and well
      // short of the 500ms debounce window it pre-empted.
      for (let i = 0; i < 20 && setCalls === 0; i++) await sleep(10);
      assert(setCalls > 0, "storage.set was not reached within ~200ms of the hidden flush (fix regressed or the flush never fired)");
    } finally {
      localStore.set = origLocalSet;
      syncStore.set = origSyncSet;
      delete doc.visibilityState;
    }
  });

    assert(new Set(radios.map((r) => r.name)).size === 1,
      "bgsave-mode radios no longer share one native name group");
    const merge = doc.getElementById("opt-bgsave-merge");
    merge.focus();
    assert(doc.activeElement === merge, "opt-bgsave-merge did not take native focus");
  });

  test("clicking a .pick-mark selects its radio and dispatches change", () => {
    showPanel("panel-bookmarks");
    const merge = doc.getElementById("opt-bgsave-merge");
    const overwrite = doc.getElementById("opt-bgsave-overwrite");
    assert(merge && overwrite, "bgsave-mode radios missing");
    merge.checked = true;
    overwrite.checked = false;
    const mark = overwrite.closest("label.pick")?.querySelector(".pick-mark");
    assert(mark, "opt-bgsave-overwrite's label.pick has no .pick-mark");
    // Fix round 1 (LOW finding 2): a click's native label-forwarding
    // activation behaviour (proven working by the assertions below) fires
    // a REAL `change` on the radio itself, which then bubbles -- spy on
    // the group's own `.pref-group-radio` container, the ancestor
    // options.js's autosave listener is actually bound to, not just on the
    // radio directly (a listener on the radio alone would pass even if
    // bubbling were broken further up).
    const group = overwrite.closest(".pref-group-radio");
    assert(group, "opt-bgsave-overwrite lost its .pref-group-radio ancestor");
    let changeEvents = 0;
    const onChange = () => { changeEvents++; };
    group.addEventListener("change", onChange);
    try {
      mark.click();
      assert(overwrite.checked === true, "clicking .pick-mark did not select opt-bgsave-overwrite");
      assert(merge.checked === false, "clicking .pick-mark left the previous radio checked too");
      assert(changeEvents === 1, "clicking .pick-mark did not dispatch exactly one change event on .pref-group-radio, got " + changeEvents);
    } finally {
      group.removeEventListener("change", onChange);
    }
    merge.checked = true;
    overwrite.checked = false;
  });

  // NOT a test of "focusing must not select the custom preset" -- options.js
  // (~line 2491, selectCustomRadio) INTENTIONALLY selects the custom radio
  // on the number input's own focus/input events, a pre-existing UX pattern
  // this task doesn't touch. What .pick's `position:relative;z-index:1` on
  // the inline control actually has to fix is hit-testing: the hidden radio
  // is `inset:0` over the WHOLE row (same technique as .switch's input), so
  // without the z-index lift a real click landing where the user visually
  // sees the number input would hit-test to the invisible radio instead and
  // never reach the field at all. elementFromPoint does real paint-order hit
  // testing (unlike .focus()/.click() called directly on a node, which
  // bypass hit-testing entirely and would pass even with the bug) -- it is
  // the one DOM API available to page JS that actually exercises this.
  test("popup-width custom row's number input wins real-click hit-testing over the hidden radio", () => {
    showPanel("panel-popup");
    const customInput = doc.getElementById("opt-popup-width-custom");
    assert(customInput, "opt-popup-width-custom missing");
    const rect = customInput.getBoundingClientRect();
    assert(rect.width > 0 && rect.height > 0, "opt-popup-width-custom has no layout box (panel not visible?)");
    const hit = doc.elementFromPoint(rect.left + rect.width / 2, rect.top + rect.height / 2);
    assert(hit === customInput || customInput.contains(hit),
      "a click at the number input's centre hits " + (hit ? (hit.tagName + (hit.id ? "#" + hit.id : "")) : "nothing") +
      " instead of opt-popup-width-custom -- the hidden radio's inset:0 must not cover the inline number input");
  });

  // Stage-3b Task 2 (2026-09-24-ui-system-stage3b): renderStoragePanel now
  // emits .pref-group > .pref-row > label.pick.pick-box (COMPONENTS.md §6.4
  // exception 3) instead of a bare <label><input><span> row. It runs lazily,
  // off activateTab's storage-tab branch (options.js), not on boot -- a real
  // click on #tab-storage, not showPanel (which only flips .panel.active and
  // never reaches that branch). pbpMeasureLocalStorage (shared.js) awaits
  // ONLY chrome.storage.local.get(null); the fixture's stub already
  // implements that, so no stub extension was needed -- seeding three of the
  // four PBP_RECLAIM_CATEGORIES (jina/urls/misc, shared.js) with one real key
  // each is enough to render every category (the fourth, tags, stays empty on
  // purpose: it is the disabled-row case below).
  test("storage builder emits pref-group > pref-row > label.pick.pick-box rows, with disabled categories unselectable", async () => {
    await win.chrome.storage.local.set({
      "jina_md_https://example.com/": "cached markdown",
      cached_existing_urls: ["https://example.com/"],
      pbp_ai_usage: { count: 3 },
    });
    // activateTab (options.js) also calls history.replaceState with the
    // panel's own #hash -- fine on the real extension page, but this fixture
    // is an about:srcdoc document (no matching http(s) location), so the
    // engine throws a same-origin SecurityError that would otherwise surface
    // as an unrelated PAGEERROR. Swallow just that one call for this click;
    // nothing else in this test depends on the URL hash.
    const originalReplaceState = win.history.replaceState.bind(win.history);
    win.history.replaceState = () => {};
    try {
      doc.getElementById("tab-storage").click();
    } finally {
      win.history.replaceState = originalReplaceState;
    }
    const host = doc.getElementById("storage-cats");
    assert(host, "storage-cats host missing");
    for (let i = 0; i < 40 && !host.querySelector(".pref-group"); i++) await sleep(50);
    const group = host.querySelector(".pref-group");
    assert(group, "renderStoragePanel never emitted a .pref-group");
    const rows = [...group.querySelectorAll(":scope > .pref-row")];
    assert(rows.length === 4, "expected 4 storage category rows (jina/urls/tags/misc), got " + rows.length);
    const picks = [...group.querySelectorAll(":scope > .pref-row > label.pick.pick-box")];
    assert(picks.length === rows.length,
      "every storage category .pref-row must have a label.pick.pick-box child, got " + picks.length + " of " + rows.length);
    picks.forEach((l) => {
      assert(l.querySelector("input.storage-cat-cb[data-cat]"), "storage pick row is missing its input.storage-cat-cb[data-cat]");
      assert(l.querySelector(".pick-text") && l.querySelector('.pick-mark[aria-hidden="true"]'),
        "storage pick row is missing its .pick-text/.pick-mark");
    });
    // STORAGE_CATS (options.js) has jina/urls/misc defaultOn:true, tags
    // defaultOn:false -- seeded with data, the three defaultOn categories
    // must come up checked (cb.checked = c.defaultOn && m.keys.length > 0).
    const checked = group.querySelectorAll(".storage-cat-cb:checked");
    assert(checked.length === 3, "expected 3 default-on categories checked (jina/urls/misc, seeded with data), got " + checked.length);
    const disabledCb = group.querySelector('.storage-cat-cb[data-cat="tags"]');
    assert(disabledCb && disabledCb.disabled, "the empty tags category (0 matching keys) must render disabled");
    assert(!disabledCb.checked, "a disabled category must not start checked");
    disabledCb.closest("label.pick").click();
    assert(!disabledCb.checked, "clicking a disabled pick-box row must not select it (native disabled semantics)");
    const total = host.querySelector(":scope > p.hint");
    assert(total && total === host.lastElementChild, "the total .hint must stay the last child of #storage-cats, after the .pref-group");
  });

  // Stage-3b Task 3 (2026-09-24-ui-system-stage3b): renderExportTargets now
  // emits the row-model shapes (spec §3) for every Send-to card -- the enable
  // switch as .pref-group > .pref-row > label.switch, each text/secret/select
  // field as .fg.entry-block.et-field (et-field kept for 3c retirement). It
  // runs unconditionally at load (options.js ~line 2422, not gated behind a
  // tab click like the storage builder above), so by the time this file's own
  // opt-ai-provider-btn settle wait has finished, #export-targets is already
  // populated -- no extra tab click or poll loop needed here.
  // Final whole-stage review S2: the render-audit rows pin ONE representative
  // row per panel, so a regression on the other rows passes every gate -- S1
  // (R9 missing the title-in-help-host and #storage-cats shapes: 24/20px
  // against 12/8px) is the proof. Class-level check instead: every stage-0
  // pref-row label, every pick-mark and every title-led group on the page,
  // in both density tiers, measured on the real options.css.
  test("stage-0 row geometry holds for every pref-row, pick-mark and title-led group, in both densities", async () => {
    const win = frame.contentWindow;
    const q = (v) => Math.round(parseFloat(v) * 4) / 4;
    const activeBefore = doc.querySelector(".panel.active")?.id;
    const opened = [];
    // Open the disclosures (vocab's five, the Send-to cards) so their rows have
    // layout -- but NOT the context-help answers: an open answer sits between
    // a section title and its first row and would inflate the R9 gap.
    doc.querySelectorAll("[data-ui-stage0] details.disclosure:not([open])").forEach((d) => { d.open = true; opened.push(d); });
    const problems = [];
    let rows = 0, marks = 0, groups = 0;
    try {
      for (const density of ["comfortable", "compact"]) {
        if (density === "compact") doc.documentElement.dataset.density = "compact"; else delete doc.documentElement.dataset.density;
        const cs = win.getComputedStyle(doc.documentElement);
        const rowMin = q(cs.getPropertyValue("--opt-row-min-h")), padY = q(cs.getPropertyValue("--opt-row-pad-y"));
        assert(rowMin > 0 && padY > 0, density + ": density tokens unreadable (" + rowMin + "/" + padY + ")");
        for (const panel of doc.querySelectorAll(".panel[data-ui-stage0]")) {
          showPanel(panel.id);
          // The block that leads a section: a .pref-group directly, or Storage's
          // JS-built group inside #storage-cats.
          const leadGroup = (block) => block?.matches(".pref-group") ? block : (block?.matches(".storage-cats") ? block.querySelector(":scope > .pref-group") : null);
          const titleOf = (section) => section.querySelector(":scope > h2.section-title, :scope > .context-help-section > h2.section-title");
          const isR9 = (label) => {
            const row = label.parentElement, group = row.parentElement;
            if (!row.matches(".pref-row:first-child") || !group.matches(".pref-group")) return false;
            const block = group.parentElement.matches(".storage-cats") ? group.parentElement : group;
            const section = block.parentElement;
            return section.matches(".settings-section") && !!block.previousElementSibling
              && block.previousElementSibling.matches("h2.section-title, .context-help-section") && titleOf(section) !== null;
          };
          panel.querySelectorAll("[data-ui-stage0] .pref-row > label").forEach((label) => {
            if (!label.offsetParent) return;   // rows inside [hidden] hosts have no layout
            rows++;
            const want = isR9(label) ? rowMin - padY : rowMin;
            const got = q(win.getComputedStyle(label).minHeight);
            if (got !== want) problems.push(density + " " + panel.id + " " + (label.querySelector("input")?.id || label.textContent.trim().slice(0, 24)) + ": min-height " + got + " != " + want + (isR9(label) ? " (R9 row)" : ""));
            const mark = label.querySelector(".pick-mark");
            if (mark) {
              marks++;
              const r = mark.getBoundingClientRect();
              if (Math.abs(r.width - 20) > 0.5 || Math.abs(r.height - 20) > 0.5) problems.push(density + " " + panel.id + " pick-mark " + r.width + "x" + r.height + " != 20x20");
            }
          });
          // R9's definition: title -> first copy of a title-led group equals
          // title -> label of a title-led entry block. Compare, don't hardcode.
          const gaps = { group: [], entry: [] };
          panel.querySelectorAll(".settings-section").forEach((section) => {
            const h2 = titleOf(section);
            if (!h2 || !h2.offsetParent) return;
            const block = [...section.children].find((el) => !el.matches("h2.section-title, .context-help-section"));
            const group = leadGroup(block);
            if (group) {
              const copy = group.querySelector(":scope > .pref-row:first-child > label > .switch-text, :scope > .pref-row:first-child > label > .pick-text");
              if (copy && copy.offsetParent) { groups++; gaps.group.push([section.id || h2.textContent.trim(), q(copy.getBoundingClientRect().top - h2.getBoundingClientRect().bottom)]); }
            } else if (block?.matches(".fg.entry-block")) {
              const bl = block.querySelector(":scope > .bl");
              if (bl && bl.offsetParent) gaps.entry.push([section.id || h2.textContent.trim(), q(bl.getBoundingClientRect().top - h2.getBoundingClientRect().bottom)]);
            }
          });
          if (gaps.group.length && gaps.entry.length) {
            const ref = gaps.entry[0][1];
            gaps.group.forEach(([name, g]) => { if (Math.abs(g - ref) > 1.5) problems.push(density + " " + panel.id + " title->first copy " + g + "px in '" + name + "' vs title->entry label " + ref + "px (R9)"); });
          }
          if (gaps.group.length > 1) {
            const g0 = gaps.group[0][1];
            gaps.group.forEach(([name, g]) => { if (Math.abs(g - g0) > 1.5) problems.push(density + " " + panel.id + " title-led groups disagree: '" + name + "' " + g + "px vs '" + gaps.group[0][0] + "' " + g0 + "px"); });
          }
        }
      }
    } finally {
      delete doc.documentElement.dataset.density;
      opened.forEach((d) => { d.open = false; });
      if (activeBefore) showPanel(activeBefore);
    }
    assert(rows >= 60 && marks >= 10 && groups >= 8, "class check is vacuous: rows=" + rows + " marks=" + marks + " title-led groups=" + groups);
    assert(problems.length === 0, problems.length + " geometry violation(s):\n  " + problems.join("\n  "));
  });

  test("export-targets: one disclosure per registered target, each with a pref-row > label.switch enable toggle", () => {
    const host = doc.getElementById("export-targets");
    assert(host, "export-targets host missing");
    const ids = ["obsidian", "notion", "notebooklm", "github", "webhook"];
    const cards = [...host.querySelectorAll(":scope > details.disclosure")];
    assert(cards.length === ids.length, "expected " + ids.length + " export-target cards, got " + cards.length);
    cards.forEach((det, i) => {
      assert(det.dataset.accKey === "et-" + ids[i], "card " + i + " acc-key=" + det.dataset.accKey);
      const enableInput = det.querySelector(".pref-row > label.switch > input[data-et$='.enabled']");
      assert(enableInput && enableInput.dataset.et === ids[i] + ".enabled",
        ids[i] + " is missing its .pref-row > label.switch enable input");
      assert(enableInput.closest(".pref-row").parentElement.matches(".pref-group"),
        ids[i] + "'s enable .pref-row is not inside a .pref-group");
      // notebooklm (spec: url-scheme, viaClipboard, zero network) is the one
      // registered target with an empty `settings` array -- every other
      // target has at least one text/secret/select field.
      const fields = det.querySelectorAll(".fg.entry-block.et-field");
      if (ids[i] === "notebooklm") {
        assert(fields.length === 0, "notebooklm has no settings and should render 0 .fg.entry-block.et-field, got " + fields.length);
      } else {
        assert(fields.length >= 1, ids[i] + " expected >=1 .fg.entry-block.et-field, got " + fields.length);
      }
    });
    // precheckRequest-bearing targets (notion/github per export-targets.js) get
    // a Test row; obsidian/notebooklm (url-scheme) and webhook (no precheck)
    // do not.
    const testRow = host.querySelector("#et-github .fg-actions.et-test");
    assert(testRow && testRow.querySelector("button") && testRow.querySelector(".et-test-status"),
      "github card is missing its .fg-actions.et-test row");
    assert(!host.querySelector("#et-webhook .et-test"), "webhook has no precheckRequest and must not render a Test row");
    const notionRow = host.querySelector("#et-notion .fg-actions.et-test");
    assert(notionRow && notionRow.querySelector("button") && notionRow.querySelector(".et-test-status"),
      "notion card is missing its .fg-actions.et-test row");
    assert(!host.querySelector("#et-obsidian .et-test"), "obsidian has no precheckRequest and must not render a Test row");
  });

  // Stage-3b Task 3 review B1: inside [data-ui-stage0] the .key-wrap lost its
  // 420px cap while the text input inside kept the legacy 320px .et-field
  // tier, so the absolutely positioned eye toggle drifted ~446px off the
  // input. Gate the fused-control geometry on the real builder output.
  test("export-targets: webhook's secret url field keeps the eye toggle fused to its input", () => {
    showPanel("panel-markdown");
    const inp = doc.querySelector('#et-webhook input[data-et="webhook.url"]');
    assert(inp, "webhook.url input missing");
    const det = inp.closest("details");
    const wasOpen = det ? det.open : true;
    if (det) det.open = true;
    try {
      const wrap = inp.closest(".key-wrap");
      const toggle = wrap && wrap.querySelector(".key-toggle");
      assert(wrap && toggle, "webhook.url is not a .key-wrap secret field");
      const ir = inp.getBoundingClientRect(), tr = toggle.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
      assert(ir.width > 0, "webhook.url input has no layout (card not open?)");
      assert(Math.abs(wr.width - ir.width) <= 1, "webhook.url input (" + ir.width + "px) does not fill its .key-wrap (" + wr.width + "px)");
      assert(tr.left >= ir.left && tr.right <= ir.right + 1,
        "webhook.url eye toggle sits outside its input: input=[" + ir.left + "," + ir.right + "] toggle=[" + tr.left + "," + tr.right + "]");
    } finally {
      if (det) det.open = wasOpen;
    }
  });

  test("export-targets: Obsidian's route select is enhanced into a listbox like every other select on the page", () => {
    const select = doc.getElementById("obsidian-route");
    assert(select && select.hasAttribute("data-listbox"), "obsidian-route is missing data-listbox");
    assert(select.hidden === true, "obsidian-route native select is not hidden (not enhanced)");
    const btn = btnOf(select);
    assert(btn && btn.tagName === "BUTTON" && btn.getAttribute("role") === "combobox",
      "obsidian-route was not enhanced into a listbox button");
    assert(itemsOf(select).length === select.options.length, "obsidian-route listbox option count mismatch");
    // Enhancement has to run once the card is connected: enhance() re-points
    // the field's label[for] by querying `document`, which cannot see a
    // detached card. Assert the re-point itself -- a call moved before the
    // append would still hide the select and build the button.
    assert(!doc.querySelector('label[for="obsidian-route"]'), "obsidian-route label still points at the hidden select (enhanced before connect?)");
    const routeLabel = doc.querySelector('label[for="' + btn.id + '"]');
    assert(routeLabel, "obsidian-route label was not re-pointed at the listbox button");
    const labelledBy = btn.getAttribute("aria-labelledby");
    assert(!labelledBy || doc.getElementById(labelledBy) === routeLabel, "obsidian-route button aria-labelledby=" + labelledBy + " does not resolve to its label");
    const policyBtn = btnOf(doc.getElementById("opt-md-image-policy"));
    assert(policyBtn && policyBtn.getAttribute("role") === "combobox", "#opt-md-image-policy was not enhanced into a listbox");
    // Stage-3b Task 3 brought the page's total from 7 (stage-3a/Task-2 statics:
    // opt-lang, opt-ai-provider, opt-ai-tag-lang, opt-ai-summary-lang,
    // opt-ai-tag-separator, translate-target-lang, opt-selection-trigger) to
    // 9: +1 static (#opt-md-image-policy, markdown panel) +1 dynamic
    // (obsidian-route, the one select-type Send-to field, enhanced from
    // inside renderExportTargets once its card is connected). Stage-3b Task 4
    // (appearance) adds #opt-theme, a tenth.
    const targets = [...doc.querySelectorAll("select[data-listbox]")];
    assert(targets.length === 10, "expected 10 data-listbox selects on the page, got " + targets.length);
    assert(doc.querySelectorAll(".listbox").length === targets.length,
      "expected one .listbox wrapper per data-listbox select, got " + doc.querySelectorAll(".listbox").length + " for " + targets.length);
  });

  // The collector (collectExportTargets) is closure-private to options.js's
  // IIFE -- only window.pbpOptionsFlushAutoSave is exposed. Toggle a real
  // switch through native label-forwarding (same technique the .pick-mark
  // click test above uses), force the debounced autosave to run right away,
  // and read the toggle back off the actual chrome.storage.local.set payload
  // -- the fixture's default routing (optSyncEnabled unset -> false) keeps
  // exportTargets in the plain `batch` write (persistSettings, shared.js),
  // not split into a separate secrets call, so one intercepted .set() call
  // carries it.
  test("export-targets: toggling an enable switch autosaves exportTargets.<id>.enabled", async () => {
    showPanel("panel-markdown");
    const cb = doc.querySelector('#export-targets input[data-et="webhook.enabled"]');
    assert(cb, "webhook.enabled input missing");
    const before = cb.checked;
    const label = cb.closest("label.switch");
    assert(label, "webhook.enabled input is not inside a label.switch");
    const localStore = win.chrome.storage.local;
    const origSet = localStore.set;
    let lastBatch = null;
    localStore.set = (...args) => { lastBatch = args[0]; return origSet.apply(localStore, args); };
    try {
      label.click();
      assert(cb.checked === !before, "clicking label.switch did not toggle webhook.enabled, checked=" + cb.checked);
      await win.pbpOptionsFlushAutoSave();
      assert(lastBatch && lastBatch.exportTargets && lastBatch.exportTargets.webhook,
        "autosave did not write an exportTargets.webhook entry: " + JSON.stringify(lastBatch && lastBatch.exportTargets));
      assert(lastBatch.exportTargets.webhook.enabled === !before,
        "saved exportTargets.webhook.enabled=" + lastBatch.exportTargets.webhook.enabled + ", want " + !before);
    } finally {
      localStore.set = origSet;
      if (cb.checked !== before) { label.click(); await win.pbpOptionsFlushAutoSave(); }
    }
  });

  for (const [name, fn] of queue) {
    try { await fn(); report(name); } catch (error) { report(name, error); }
  }
})().catch((error) => {
  for (let i = results.children.length; i < TOTAL; i++) report("fixture setup", error);
});
</script>
</body></html>
