<!doctype html>
<html><head><meta charset="utf-8"><title>options-drive-sync Tests</title>
<link rel="stylesheet" href="../options.css">
<style>body{padding:16px}.case{padding:5px}.pass{color:#176}.fail{color:#b00}</style>
</head><body>
<button class="tab-btn active" data-panel="general" hidden></button>
<div id="panel-general" style="position:fixed;left:-9999px;top:0;width:700px">
  <div id="vocab-drive-body">
    <p id="vocab-drive-state"></p>
    <dl id="vocab-drive-fields" hidden>
      <dt>Google account</dt><dd id="vocab-drive-account"></dd>
      <dt>Pinboard account</dt><dd id="vocab-drive-owner"></dd>
      <dt>Last synced</dt><dd id="vocab-drive-last-success"></dd>
    </dl>
    <p id="vocab-drive-error"></p>
    <div class="vocab-drive-notice-row" hidden>
      <p id="vocab-drive-notices"></p><button id="vocab-drive-clear-notices"></button>
    </div>
    <div id="vocab-drive-actions" hidden>
      <button id="vocab-drive-connect" hidden></button>
      <button id="vocab-drive-sync" hidden></button>
      <button id="vocab-drive-disconnect" hidden></button>
      <span id="vocab-drive-action-status"></span>
    </div>
  </div>
</div>
<div id="results"></div>
<script>
function t(key, value) { return key + (value === undefined ? "" : ":" + value); }
let owner = "acct_alice";
const messages = [], permissionRequests = [], storageListeners = [], runtimeListeners = [], localGets = [];
// Status in the exact shape pbpGetVocabDriveStatus returns (spec §6.2),
// written by hand; === undefined decides defaults so "" / 0 survive.
const dataset = (patch = {}) => {
  const row = {lastSuccessAt:null,lastError:null,retryAt:null,blocked:false,hasPending:false,notices:0};
  for (const [key, value] of Object.entries(patch)) if (value !== undefined) row[key] = value;
  return row;
};
const fixture = {
  connected:true, owner:"alice", drivePermissionId:"perm-alice",
  emailAddress:"alice@example.test", displayName:"Alice",
  connection:{lastError:null,retryAt:null,blocked:false},
  vocabulary:dataset({lastSuccessAt:Date.UTC(2026,6,24,8,0)}),
  notes:dataset({lastSuccessAt:Date.UTC(2026,6,23,8,0)}),
  noticeTerms:[], lastSuccessAt:Date.UTC(2026,6,23,8,0), hasPending:false
};
const withConn = (patch, base = fixture) => ({...base, connection:{...base.connection, ...patch}});
const withData = (scope, patch, base = fixture) => ({...base, [scope]:dataset({...base[scope], ...patch})});
let response = null;
let send = async (message) => { messages.push(message); return response || {ok:true,status:fixture}; };
window.chrome = {
  permissions:{request:async (request) => {permissionRequests.push(request);return true;}},
  runtime:{getManifest:() => ({optional_permissions:["identity"],
    optional_host_permissions:["https://*/*"],oauth2:{client_id:"fixture.apps.googleusercontent.com",
    scopes:["https://www.googleapis.com/auth/drive.appdata"]}}),
    sendMessage:(message) => send(message),
    onMessage:{addListener:(listener) => runtimeListeners.push(listener)}},
  storage:{local:{get:async (keys) => {
    localGets.push(keys);
    return keys && typeof keys === "object" && !Array.isArray(keys) ? {...keys} : {};
  },set:async () => {}},onChanged:{addListener:(listener) => storageListeners.push(listener)}}
};
</script>
<script src="../shared.js"></script><script src="../vocab-store.js"></script>
<script>pbpVocabCurrentOwner = async () => owner; pbpReadSettingsWithSecrets = async () => ({});</script>
<script src="../options-vocab.js"></script>
<script>
(async () => {
  let failed = 0;
  function check(name, condition, detail) {
    const row = document.createElement("div"); row.className = "case " + (condition ? "pass" : "fail");
    row.textContent = (condition ? "PASS " : "FAIL ") + name + (condition || detail === undefined ? "" : " -- " + detail);
    $id("results").appendChild(row);
    if (!condition) failed++;
  }
  const task = () => new Promise((resolve) => setTimeout(resolve, 0));
  const settle = async () => { for (let i = 0; i < 4; i++) await task(); };
  const err = () => $id("vocab-drive-error").textContent;
  const stateText = () => $id("vocab-drive-state").textContent;
  const source = await (await fetch("../options.html")).text();
  const production = new DOMParser().parseFromString(source, "text/html");
  const dataSync = production.querySelector('details[data-acc-key="general-data-sync"]');
  check("data sync uses the existing persisted native disclosure in General",
    dataSync?.classList.contains("disclosure") && dataSync.closest("#panel-general"));
  check("Drive follows Chrome Sync before Backup with one shared connection",
    dataSync?.querySelector("#chrome-sync-section + section #vocab-drive-body") &&
    production.querySelectorAll("#vocab-drive-connect").length === 1 &&
    !production.querySelector("#panel-vocab #vocab-drive-body") &&
    dataSync.closest("section").nextElementSibling.querySelector("#sec-backup-restore"));
  const driveBody = production.getElementById("vocab-drive-body");
  // Simplest miss: delete the two switches but leave their .pref-group, the
  // notes-only error or the notes-only timestamp behind.
  check("the Drive panel has no data-scope controls and one status line, last-sync row and error area",
    !!driveBody && !driveBody.querySelector('input[type="checkbox"], .pref-group, .switch') &&
    !production.getElementById("drive-notes-error") && !production.getElementById("drive-notes-last-success") &&
    driveBody.querySelectorAll("dl#vocab-drive-fields > dd").length === 3 &&
    driveBody.querySelectorAll('[data-i18n="driveLastSuccess"]').length === 1 &&
    driveBody.querySelectorAll(".field-error").length === 1 &&
    driveBody.firstElementChild?.id === "vocab-drive-state");
  check("plaintext disclosure stays in contextual help and routine counts are absent",
    production.getElementById("vocab-drive-disclosure").closest("details.context-help") &&
    !production.getElementById("vocab-drive-pending-words") && !production.getElementById("vocab-drive-pending-batches"));

  const getsBefore = localGets.length;
  await renderDriveSyncPanel();
  // Simplest miss: keep the chrome.storage.local.get({driveSyncVocabulary,…})
  // gate in renderDriveSyncPanel.
  check("entering General reads status only: no authorization, synchronization or local scope read",
    messages.length === 1 && messages[0].type === "vocabDriveStatus" && !permissionRequests.length &&
    localGets.length === getsBefore, `messages=${JSON.stringify(messages)} gets=${localGets.length - getsBefore}`);
  _pbpVocabDriveRender({...fixture, notes:dataset(), lastSuccessAt:null});
  // Simplest miss: show status.vocabulary.lastSuccessAt while notes never ran.
  check("the single last-sync row reads never while either dataset has never synced",
    $id("vocab-drive-last-success").textContent === "vocabDriveNever", $id("vocab-drive-last-success").textContent);
  // Simplest miss: re-add a driveSync* key to SETTINGS_DEFAULTS, which would
  // ride Chrome Sync to every device.
  check("Drive sync keeps no settings-level scope keys",
    !Object.keys(SETTINGS_DEFAULTS).some((key) => /^driveSync/.test(key)));

  _pbpVocabDriveRender(withData("notes", {lastError:"corrupt", retryAt:Date.now() + 60000}));
  // Simplest miss: paint a notes failure without its subject or into the vocabulary line.
  check("a dataset failure stays on its own subject line and never paints overall success",
    err().includes("driveNotesStatus:vocabDriveErrorCorrupt") && !err().includes("driveVocabularyStatus") &&
    !$id("vocab-drive-state").classList.contains("ok"), err());
  response = {ok:false, error:"corrupt", results:{vocabulary:{ok:true}, notes:{ok:false, error:"corrupt"}},
    status:withData("notes", {lastError:"corrupt", blocked:true})};
  await _pbpVocabDriveAction("vocabDriveSyncNow", true);
  // Simplest miss: also paint the top-level "corrupt" without a subject.
  check("manual partial success never flashes combined success and names the failed dataset once",
    !$id("vocab-drive-action-status").textContent &&
    err().split("vocabDriveErrorCorrupt").length === 2 && err().includes("driveNotesStatus:"), err());
  response = {ok:false, error:"waiting_for_retry", waitingForRetry:true, results:{vocabulary:{ok:true}, notes:{ok:true}},
    status:withConn({lastError:"network", retryAt:Date.now() + 60000})};
  await _pbpVocabDriveAction("vocabDriveSyncNow", true);
  // Simplest miss: render waiting_for_retry as an error code (it falls
  // through to vocabDriveErrorRemote).
  check("a run held by connection backoff shows only the backoff, never success or a generic failure",
    !$id("vocab-drive-action-status").textContent && err().includes("vocabDriveErrorNetwork") &&
    err().includes("vocabDriveRetryAt") && !err().includes("vocabDriveErrorRemote") &&
    !err().includes("driveVocabularyStatus"), err());
  response = {ok:true, waitingForRetry:true, results:{vocabulary:{ok:true}, notes:{ok:true}}, status:fixture};
  await _pbpVocabDriveAction("vocabDriveSyncNow", true);
  // Simplest miss: flash Synced on ok alone (A28 makes the top-level flag the contract).
  check("an ok answer that only waited for backoff does not flash Synced",
    !$id("vocab-drive-action-status").textContent);

  _pbpVocabDriveRender({...fixture, vocabulary:dataset({notices:2}), notes:dataset({notices:3})});
  // Simplest miss: keep one sentence per dataset.
  check("conflict notices merge both datasets into one counted sentence",
    $id("vocab-drive-notices").textContent === "driveNotices:5", $id("vocab-drive-notices").textContent);
  messages.length = 0;
  response = {ok:true, status:fixture};
  $id("vocab-drive-clear-notices").click(); await settle();
  check("one dismissal clears notices for both datasets",
    messages.some((message) => message.type === "vocabDriveClearNotices") &&
    !$id("vocab-drive-notices").textContent &&
    $id("vocab-drive-clear-notices").closest(".vocab-drive-notice-row").hidden);

  response = null; await renderDriveSyncPanel();
  let resolveAction;
  send = () => new Promise((resolve) => {resolveAction = resolve;});
  const pending = _pbpVocabDriveAction("vocabDriveSyncNow", true); await task();
  owner = "acct_bob";
  resolveAction?.({ok:true, status:{...fixture, emailAddress:"old-private@example.test"}}); await pending;
  check("current owner is checked even when no storage event or generation change arrived",
    !$id("vocab-drive-account").textContent.includes("old-private@example.test") &&
    !$id("vocab-drive-action-status").textContent);
  owner = "acct_alice";

  // B14: Disconnect keeps the connection record, so the next status is both
  // disconnected and auth-blocked; a failed Connect must still say why.
  const blockedDisconnected = withConn({lastError:"auth", retryAt:null, blocked:true}, {...fixture, connected:false});
  send = async (message) => {messages.push(message); return message.type === "vocabDriveConnect"
    ? {ok:false, error:"auth", results:{vocabulary:{ok:false}, notes:{ok:false}}, status:blockedDisconnected}
    : {ok:true, status:blockedDisconnected};};
  await renderDriveSyncPanel(); await _pbpVocabDriveConnect();
  // Simplest miss: drop response-only lines while disconnected (the render
  // paints nothing then), leaving Connect with no reason.
  check("a failed Connect on a blocked, disconnected device names the failure and the visible Connect button",
    !$id("vocab-drive-connect").hidden && err().includes("vocabDriveErrorAuth") &&
    err().includes("vocabDriveConnectRequired") && !err().includes("vocabDriveSyncNowRequired"), err());
  const datasetBlockedDisconnected = withData("vocabulary", {lastError:"corrupt", blocked:true, retryAt:Date.now() + 60000},
    {...fixture, connected:false});
  send = async (message) => {messages.push(message); return message.type === "vocabDriveConnect"
    ? {ok:false, error:"account_changed", status:datasetBlockedDisconnected} : {ok:true, status:datasetBlockedDisconnected};};
  await renderDriveSyncPanel(); await _pbpVocabDriveConnect();
  // Simplest miss: decorate the top-level code with whichever dataset is
  // blocked (the old flattened vocabulary fields).
  check("a Connect failure does not borrow a dataset's block or retry time",
    err().includes("vocabDriveErrorAccountChanged") && !err().includes("vocabDriveSyncNowRequired") &&
    !err().includes("vocabDriveRetryAt"), err());
  // B15 reversed (spec §5.3): a refused grant is repaired by Connect, which
  // now sits beside Sync now and Disconnect.
  const permissionStatus = withConn({lastError:"permission"});
  send = async (message) => {messages.push(message); return message.type === "vocabDriveSyncNow"
    ? {ok:false, error:"permission", results:{vocabulary:{ok:false}, notes:{ok:false}}, status:permissionStatus}
    : {ok:true, status:fixture};};
  await renderDriveSyncPanel(); await _pbpVocabDriveAction("vocabDriveSyncNow", true);
  // Simplest miss: keep pointing at Disconnect, or keep Connect hidden while connected.
  check("a missing Google grant asks for Connect and shows it beside Sync now and Disconnect",
    stateText() === "vocabDriveAuthNeeded" &&
    !$id("vocab-drive-connect").hidden && !$id("vocab-drive-sync").hidden && !$id("vocab-drive-disconnect").hidden &&
    err().includes("vocabDriveErrorPermission") && err().includes("vocabDriveConnectRequired") &&
    !err().includes("vocabDriveReconnectRequired"), `${stateText()} / ${err()}`);
  send = async (message) => {messages.push(message); return message.type === "vocabDriveSyncNow"
    ? {ok:false, error:"permission", results:{vocabulary:{ok:false}, notes:{ok:false}}, status:fixture}
    : {ok:true, status:fixture};};
  await renderDriveSyncPanel(); await _pbpVocabDriveAction("vocabDriveSyncNow", true);
  // Simplest miss: print the response's "click Connect" while the healthy
  // status keeps Connect hidden.
  check("a permission failure the status does not carry yet still shows the Connect it names",
    !$id("vocab-drive-connect").hidden && err().includes("vocabDriveConnectRequired") &&
    err().split("vocabDriveErrorPermission").length === 2, err());
  permissionRequests.length = 0; messages.length = 0;
  send = async (message) => {messages.push(message); return {ok:true, status:fixture};};
  _pbpVocabDriveRender(permissionStatus);
  $id("vocab-drive-connect").click(); await settle();
  // Simplest miss: the auth-needed Connect skips permissions.request (no user
  // gesture) or never reaches vocabDriveConnect.
  check("Connect from the auth-needed state requests the exact grant in the click and runs Connect",
    permissionRequests.length === 1 && permissionRequests[0].origins?.[0] === "https://www.googleapis.com/*" &&
    messages.some((message) => message.type === "vocabDriveConnect") && stateText() === "vocabDriveConnected",
    `${permissionRequests.length} / ${stateText()}`);

  // ---- §5.4 slow authorization hint (UX-5, L1-11). Only the 15 s timer is
  // stubbed; every other setTimeout (task(), status flashes) stays real.
  const realSetTimeout = window.setTimeout, realClearTimeout = window.clearTimeout;
  const slowTimers = new Map(), clearedSlow = []; let slowSeq = 0;
  window.setTimeout = (fn, ms, ...rest) => {
    if (ms !== 15000) return realSetTimeout(fn, ms, ...rest);
    const id = "slow-" + (++slowSeq); slowTimers.set(id, fn); return id;
  };
  window.clearTimeout = (id) => {
    if (slowTimers.has(id)) { slowTimers.delete(id); clearedSlow.push(id); return; }
    realClearTimeout(id);
  };
  const fireSlow = () => { const due = [...slowTimers.values()]; slowTimers.clear(); due.forEach((fn) => fn()); };
  const authorized = (value) => runtimeListeners.forEach((listener) =>
    listener({type:"PBP_DRIVE_CONNECT_AUTHORIZED", owner:value}, {id:"fixture-extension"}, () => {}));
  let resolveConnect = null;
  const pendingConnect = (message) => {messages.push(message); return message.type === "vocabDriveConnect"
    ? new Promise((resolve) => {resolveConnect = resolve;}) : Promise.resolve({ok:true, status:fixture});};
  try {
    let resolvePermission = null;
    _pbpVocabDriveRender({...fixture, connected:false});
    window.chrome.permissions.request = () => new Promise((resolve) => {resolvePermission = resolve;});
    send = pendingConnect;
    const connectingA = _pbpVocabDriveConnect(); await settle();
    // Simplest miss: start the clock on the click, so a user still reading
    // Chrome's own permission prompt is told the network may be down.
    check("the slow-hint clock does not run while Chrome's permission prompt is open",
      slowTimers.size === 0 && stateText() === "vocabDriveAuthorizing", `${slowTimers.size} / ${stateText()}`);
    resolvePermission?.(true); await settle();
    fireSlow();
    // Simplest miss: never schedule the hint, or replace the waiting line
    // instead of extending it.
    check("fifteen seconds of Google authorization adds the network hint to the waiting line",
      stateText() === "vocabDriveAuthorizing vocabDriveAuthorizingSlow", stateText());
    resolveConnect?.({ok:true, status:fixture}); await connectingA;

    window.chrome.permissions.request = async (request) => {permissionRequests.push(request); return true;};
    _pbpVocabDriveRender({...fixture, connected:false});
    const connectingB = _pbpVocabDriveConnect(); await settle();
    authorized("acct_bob"); await task();
    // Simplest miss: accept the broadcast without comparing its owner.
    check("an authorization signal for another Pinboard account is ignored",
      stateText() === "vocabDriveAuthorizing" && slowTimers.size === 1, `${stateText()} / ${slowTimers.size}`);
    const clearedBefore = clearedSlow.length;
    authorized("acct_alice"); await task();
    const afterAuthorized = stateText();
    fireSlow();
    // Simplest miss: keep the timer running past PBP_DRIVE_CONNECT_AUTHORIZED,
    // so a fast Google plus a slow first sync still shows the network hint.
    check("Google authorizing quickly then syncing slowly never shows the slow hint",
      afterAuthorized === "vocabDriveWorking" && stateText() === "vocabDriveWorking" &&
      clearedSlow.length === clearedBefore + 1, `${afterAuthorized} / ${stateText()}`);
    resolveConnect?.({ok:true, status:fixture}); await connectingB;

    _pbpVocabDriveRender({...fixture, connected:false});
    const connectingC = _pbpVocabDriveConnect(); await settle();
    const scheduled = slowTimers.size, clearedBeforeAnswer = clearedSlow.length;
    resolveConnect?.({ok:true, status:fixture}); await connectingC;
    // Simplest miss: clear the timer only on the broadcast, so an answer that
    // arrives first leaves a hint to fire on an idle panel.
    check("the action answer ends the authorization phase and its timer",
      scheduled === 1 && slowTimers.size === 0 && clearedSlow.length === clearedBeforeAnswer + 1 &&
      stateText() === "vocabDriveConnected", `${scheduled} / ${slowTimers.size} / ${stateText()}`);
  } finally {
    window.setTimeout = realSetTimeout;
    window.clearTimeout = realClearTimeout;
  }

  const optionsJs = await (await fetch("../options.js")).text();
  // Simplest miss: drop the switches but keep options.js resetting them, so
  // "Reset this tab" writes dead local keys.
  check("no scope API survives: page helpers, the General reset call and its defaults are gone",
    typeof resetDriveSyncScopes === "undefined" && typeof _pbpDriveScopeChange === "undefined" &&
    !optionsJs.includes("resetDriveSyncScopes") && !/drive-sync-(?:vocabulary|notes)/.test(optionsJs));

  // UX-11: with the switches gone the status line leads #vocab-drive-body.
  // Rendered from the production markup against options.css: its gap under
  // the heading must equal Chrome Sync's heading -> first-row gap.
  const spacingHost = document.createElement("div");
  spacingHost.style.cssText = "position:fixed;left:-9999px;top:0;width:700px";
  spacingHost.innerHTML = dataSync.outerHTML;
  document.body.appendChild(spacingHost);
  const chromeSection = spacingHost.querySelector("#chrome-sync-section");
  const driveSection = spacingHost.querySelector("#sec-google-drive").closest(".settings-section");
  const gapBelowHeading = (section, first) =>
    first.getBoundingClientRect().top - section.querySelector(":scope > .fg").getBoundingClientRect().bottom;
  const chromeGap = gapBelowHeading(chromeSection, chromeSection.querySelector(":scope > .pref-group"));
  const driveGap = gapBelowHeading(driveSection, spacingHost.querySelector("#vocab-drive-state"));
  spacingHost.remove();
  // Simplest miss: delete the switches' markup only; a leftover first-child
  // block (or stacked margins) pushes the status line below its sibling
  // section's rhythm.
  check("the Drive status line sits at the same heading gap as Chrome Sync's first row",
    chromeGap > 0 && Math.abs(chromeGap - driveGap) < 0.5, `chrome=${chromeGap} drive=${driveGap}`);

  // Spec §5.3 / §10: auth blocked or permission shows Connect, Sync now and
  // Disconnect together. Rendered from the production markup against
  // options.css in a 420px host, with each locale's real button labels; the
  // only max-width:480px rule that touches this block (options.css
  // .vocab-drive-fields) does not reach the action row, so a host width
  // stands in for a narrow window here.
  const narrowHost = document.createElement("div");
  narrowHost.style.cssText = "position:fixed;left:-9999px;top:0;width:420px";
  narrowHost.innerHTML = dataSync.outerHTML;
  document.body.appendChild(narrowHost);
  const actions = narrowHost.querySelector("#vocab-drive-actions");
  const buttons = ["vocab-drive-connect", "vocab-drive-sync", "vocab-drive-disconnect"].map((id) => narrowHost.querySelector("#" + id));
  actions.hidden = false; buttons.forEach((button) => { button.hidden = false; });
  // Read before the host is removed; a detached row measures 0.
  const rowWidth = actions.clientWidth;
  const overflow = [];
  for (const loc of ["en", "zh_CN", "zh_TW", "zh_HK", "ja", "de", "fr", "pl", "ru"]) {
    const labels = await (await fetch(`../_locales/${loc}/messages.json`)).json();
    ["vocabDriveConnect", "vocabDriveSyncNow", "vocabDriveDisconnect"].forEach((key, i) => { buttons[i].textContent = labels[key].message; });
    const row = actions.getBoundingClientRect();
    if (actions.scrollWidth > actions.clientWidth || buttons.some((button) => button.getBoundingClientRect().right > row.right + 0.5)) {
      overflow.push(`${loc}: scroll=${actions.scrollWidth} client=${actions.clientWidth}`);
    }
  }
  narrowHost.remove();
  // Simplest miss: a nowrap row (or a fixed min-width per button) that fits the
  // English labels and pushes de "Jetzt synchronisieren" / ru "Синхронизировать
  // сейчас" past a 420px window.
  check("all three Drive buttons fit a 420px row in every locale",
    rowWidth > 0 && overflow.length === 0, `row=${rowWidth} ${overflow.join(" | ")}`);
  document.title = (failed ? "FAIL " : "PASS ") + "options-drive-sync Tests";
})();
</script></body></html>
