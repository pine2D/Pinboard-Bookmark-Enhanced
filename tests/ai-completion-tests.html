    raw.push(init.body);calls.push(JSON.parse(init.body));const next=responses.shift();

    if(next.jsonError)response.json=async()=>{throw next.jsonError;};
    return response;

  reset([reply(LENGTH_EMPTY)]);const error=await rejected(()=>run(),'output_truncated');

// ---- Call deadline (deadlineMs) and abort priority, on a fake clock ----
// The clock replaces setTimeout/clearTimeout/Date.now only inside each test;
// this page runs its cases strictly one after another, so nothing else can
// schedule onto it. Bodies are ReadableStreams the test feeds by hand, and the
// fetch stub errors them when the request signal aborts, as fetch does.
function fakeClock(){
  const realSet=globalThis.setTimeout,realClear=globalThis.clearTimeout,realNow=Date.now;
  let now=realNow(),seq=0;const timers=new Map();
  globalThis.setTimeout=(fn,ms=0)=>{const id=++seq;timers.set(id,{fn,at:now+Math.max(0,Number(ms)||0),ms});return id;};
  globalThis.clearTimeout=id=>{timers.delete(id);};
  Date.now=()=>now;
  const flush=async()=>{for(let i=0;i<12;i++)await new Promise(r=>realSet(r,0));};
  return {
    timers,flush,elapsed:start=>now-start,get now(){return now;},
    delays:()=>[...timers.values()].map(t=>t.ms),
    async advance(ms){
      const end=now+ms;
      for(;;){
        const due=[...timers.entries()].filter(([,t])=>t.at<=end).sort((a,b)=>a[1].at-b[1].at)[0];
        if(!due)break;
        now=Math.max(now,due[1].at);timers.delete(due[0]);due[1].fn();await flush();
      }
      now=end;await flush();
    },
    // Runs every due-or-not timer synchronously (a "same tick" firing).
    fireAll(){for(const [id,t] of [...timers.entries()]){timers.delete(id);t.fn();}},
    restore(){globalThis.setTimeout=realSet;globalThis.clearTimeout=realClear;Date.now=realNow;}
  };
}
function liveBody(signal){

  signal?.addEventListener('abort',()=>{try{controller.error(new DOMException('The operation was aborted.','AbortError'));}catch(_){}},{once:true});
  return {body,push:text=>controller.enqueue(enc.encode(text)),close:()=>controller.close()};
}

    const next=queue.shift();if(!next)throw new Error('Unexpected extra fixture request');

await test('a later dispatch guard consumes the deadline and a late guard never dispatches',async()=>{
  await withClock(async clock=>{
    reset([]);let answerFirst,release;const blocked=new Promise(r=>{release=r;});let guards=0;
    liveFetch([()=>new Promise(r=>{answerFirst=()=>r(new Response(JSON.stringify(OFF_REFUSED),{status:400}));}),silent]);
    const st=track(callAIStream(settings,'x',{...DEADLINE_OPTS,beforeRequest:async()=>{if(++guards===2)await blocked;}},()=>{}));
    await clock.flush();await clock.advance(10000);answerFirst();await clock.flush();
    assert(guards===2&&calls.length===1,'Second guard not reached');
    await clock.advance(170000);
    assert(st.error?.name==='TimeoutError','The pending guard outlived the deadline: '+(st.error?.name||st.settled));
    release();await clock.flush();
    assert(calls.length===1,'A guard that finished after the deadline still dispatched');
  });
});

await test('abort priority: caller abort > budget stop > deadline',async()=>{
  const over=oaThink('r'.repeat(36004))+oaText('ready')+OA_STOP;
  // Caller cancels in the same tick as the budget stop (from the phase callback).
  reset([S(over)]);const caller=new AbortController();const deltas=[];let error;
  try{await callAIStream(COMPAT.settings,'x',{...DEADLINE_OPTS,signal:caller.signal,onProgress:e=>{if(e.phase==='thinking')caller.abort();}},d=>deltas.push(d));}catch(e){error=e;}
  assert(error?.name==='AbortError'&&typeof error.code!=='string'&&deltas.length===0,'Caller abort lost to the budget stop: '+(error?.name)+' '+(error?.code));
  await withClock(async clock=>{
    // The deadline fires in the same tick as the budget stop: the budget wins.
    reset([S(over)]);let error;
    try{await callAIStream(COMPAT.settings,'x',{...DEADLINE_OPTS,onProgress:e=>{if(e.phase==='thinking')clock.fireAll();}},()=>{});}catch(e){error=e;}
    assert(error?.code==='output_budget_exceeded'&&error.status===200,'Deadline beat the budget stop: '+(error?.name)+' '+(error?.code));
    // The deadline and the caller in the same tick: the caller wins.
    reset([]);liveFetch([silent]);const caller=new AbortController();
    const st=track(callAIStream(COMPAT.settings,'x',{...DEADLINE_OPTS,signal:caller.signal},()=>{}));
    await clock.flush();clock.fireAll();caller.abort();await clock.flush();
    assert(st.error?.name==='AbortError','Deadline beat the caller abort: '+st.error?.name);
    // Caller abort during a pending later guard is still the caller's AbortError.
    reset([]);let answerFirst;liveFetch([()=>new Promise(r=>{answerFirst=()=>r(new Response(JSON.stringify(OFF_REFUSED),{status:400}));}),silent]);
    const caller2=new AbortController();let guards=0;
    const st2=track(callAIStream(settings,'x',{...DEADLINE_OPTS,signal:caller2.signal,beforeRequest:async()=>{if(++guards===2)await new Promise(()=>{});}},()=>{}));
    await clock.flush();answerFirst();await clock.flush();caller2.abort();clock.fireAll();await clock.flush();
    assert(st2.error?.name==='AbortError'&&calls.length===1,'Caller abort during a guard lost to the deadline');
  });
});
