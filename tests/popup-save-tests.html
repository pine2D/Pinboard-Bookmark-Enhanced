<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Popup Save Tests</title>
<style>
body { font-family: monospace; padding: 16px; max-width: 1000px; }
.case { padding: 4px 8px; margin: 4px 0; }
.pass { color: #0a0; background: #f0fff0; }
.fail { color: #c00; background: #fff0f0; font-weight: bold; }
</style></head>
<body>
<h1>Popup Save Tests</h1>
<div id="results"></div>
<script src="../shared.js"></script>
<script src="../wayback.js"></script>
<script>
function test(name, fn) {
  const div = document.createElement("div");
  div.className = "case";
  try {
    fn();
    div.classList.add("pass");
    div.textContent = "PASS " + name;
  } catch (error) {
    div.classList.add("fail");
    div.textContent = "FAIL " + name + "\n  " + error.message;
  }
  document.getElementById("results").appendChild(div);
}

async function testAsync(name, fn) {
  const div = document.createElement("div");
  div.className = "case";
  try {
    await fn();
    div.classList.add("pass");
    div.textContent = "PASS " + name;
  } catch (error) {
    div.classList.add("fail");
    div.textContent = "FAIL " + name + "\n  " + error.message;
  }
  document.getElementById("results").appendChild(div);
}

function assert(condition, message) {
  if (!condition) throw new Error(message || "assertion failed");
}

const URL = "https://example.com/article";

test("missing exact URL maps to create", () => {
  const result = pbpPopupSavePolicy({ lookupStatus: "missing", lookupUrl: URL, currentUrl: URL, formLoaded: false, reviewedAtClick: false });
  assert(result.allow && result.mode === "create" && !("replace" in result));
});

test("reviewed loaded existing bookmark maps to update", () => {
  const result = pbpPopupSavePolicy({ lookupStatus: "found", lookupUrl: URL, currentUrl: URL, formLoaded: true, reviewedAtClick: true });
  assert(result.allow && result.mode === "update" && !("replace" in result));
});

test("pending lookup blocks save", () => {
  const result = pbpPopupSavePolicy({ lookupStatus: "pending", lookupUrl: URL, currentUrl: URL, formLoaded: false, reviewedAtClick: false });
  assert(!result.allow && result.reason === "lookup_pending");
});

test("exact failed lookup maps to fail-safe merge", () => {
  const result = pbpPopupSavePolicy({ lookupStatus: "failed", lookupUrl: URL, currentUrl: URL, formLoaded: false, reviewedAtClick: false });
  assert(result.allow && result.mode === "merge" && !("replace" in result));
});

test("idle lookup blocks save", () => {
  const result = pbpPopupSavePolicy({ lookupStatus: "idle", lookupUrl: URL, currentUrl: URL, formLoaded: false, reviewedAtClick: false });
  assert(!result.allow && result.reason === "lookup_idle");
});

test("missing result for another URL blocks save", () => {
  const result = pbpPopupSavePolicy({ lookupStatus: "missing", lookupUrl: "https://old.example", currentUrl: URL, formLoaded: false, reviewedAtClick: false });
  assert(!result.allow && result.reason === "url_mismatch");
});

test("found result for another URL blocks save", () => {
  const result = pbpPopupSavePolicy({ lookupStatus: "found", lookupUrl: "https://old.example", currentUrl: URL, formLoaded: true, reviewedAtClick: true });
  assert(!result.allow && result.reason === "url_mismatch");
});

test("found bookmark that was not loaded blocks save", () => {
  const result = pbpPopupSavePolicy({ lookupStatus: "found", lookupUrl: URL, currentUrl: URL, formLoaded: false, reviewedAtClick: true });
  assert(!result.allow && result.reason === "review_required");
});

test("bookmark discovered after click requires a second reviewed click", () => {
  const result = pbpPopupSavePolicy({ lookupStatus: "found", lookupUrl: URL, currentUrl: URL, formLoaded: true, reviewedAtClick: false });
  assert(!result.allow && result.reason === "review_required");
});

test("posts/add create URI sends replace=no", () => {
  const uri = buildPostsAddUri({ token: "t", url: URL, replace: false });
  assert(uri.includes("&replace=no") && !uri.includes("&replace=yes"));
});

test("posts/add reviewed update URI sends replace=yes", () => {
  const uri = buildPostsAddUri({ token: "t", url: URL, replace: true });
  assert(uri.includes("&replace=yes") && !uri.includes("&replace=no"));
});

test("posts/add default remains replace=yes for existing callers", () => {
  const uri = buildPostsAddUri({ token: "t", url: URL });
  assert(uri.includes("&replace=yes") && !uri.includes("&replace=no"));
});

(async () => {
  try {
    const [source, backgroundSource, sharedSource, popupAiSource, popupTagsSource, popupHtml, popupCss, enMessages, popupOfflineSource] = await Promise.all([
      fetch("../popup.js").then((response) => response.text()),
      fetch("../background.js").then((response) => response.text()),
      fetch("../shared.js").then((response) => response.text()),
      fetch("../popup-ai.js").then((response) => response.text()),
      fetch("../popup-tags.js").then((response) => response.text()),
      fetch("../popup.html").then((response) => response.text()),
      fetch("../popup.css").then((response) => response.text()),
      // The shipped English catalogue, so "localized" is judged against the real
      // file rather than a string typed into this suite.
      fetch("../_locales/en/messages.json").then((response) => response.json()),
      fetch("../popup-offline.js").then((response) => response.text())
    ]);
    const start = source.indexOf("function setupSubmit(token)");
    const handlerEnd = source.indexOf('  document.addEventListener("keydown"', start);
    assert(start >= 0 && handlerEnd > start, "setupSubmit source not found");
    const setupEnd = source.indexOf("// ===================== Edit From Recent", start);
    assert(setupEnd > start, "setupSubmit end marker not found");
    const submit = source.slice(start, handlerEnd);
    const policyIndex = submit.indexOf("const savePolicy = pbpPopupSavePolicy");
    const snapshotIndex = submit.indexOf('url: $id("url-input").value.trim()', policyIndex);
    const ownershipIndex = submit.indexOf("saveUrl !== url", snapshotIndex);
    const intentIndex = submit.indexOf("const intent = {", ownershipIndex);
    const sendIndex = submit.indexOf('chrome.runtime.sendMessage({ type: "save_intent", intent, account: submitAccount })', intentIndex);
    const snapshot = submit.slice(snapshotIndex, ownershipIndex);
    const intentBlock = submit.slice(intentIndex, sendIndex);
    const tagHelperStart = source.indexOf("function pbpRebasePopupTags(");
    const tagHelperEnd = source.indexOf("// Wayback per-save toggle", tagHelperStart);
    assert(tagHelperStart >= 0 && tagHelperEnd > tagHelperStart, "pbpRebasePopupTags source not found");
    const tagHelperSource = source.slice(tagHelperStart, tagHelperEnd);
    const resetStart = source.indexOf("async function resetPinboardSession()");
    const resetEnd = source.indexOf("// ===================== URL Clean Helpers", resetStart);
    assert(resetStart >= 0 && resetEnd > resetStart, "resetPinboardSession source not found");
    const resetSource = source.slice(resetStart, resetEnd);
    const logoutStart = source.indexOf('$id("logout-link").addEventListener');
    const logoutEnd = source.indexOf("// ===================== Login", logoutStart);
    assert(logoutStart >= 0 && logoutEnd > logoutStart, "logout-link source not found");
    const logoutSource = source.slice(logoutStart, logoutEnd);
    const lookupStart = source.indexOf("async function checkExistingBookmark(");
    const lookupEnd = source.indexOf("// ===================== Submit / Delete", lookupStart);
    assert(lookupStart >= 0 && lookupEnd > lookupStart, "checkExistingBookmark source not found");
    const lookupSource = source.slice(lookupStart, lookupEnd);
    const setupSource = source.slice(start, setupEnd);
    const offlineClearStart = source.indexOf("async function showOfflineQueueStatus() {");
    const offlineClearEnd = source.indexOf("// ===================== Helpers", offlineClearStart);
    assert(offlineClearStart >= 0 && offlineClearEnd > offlineClearStart, "showOfflineQueueStatus source not found");
    const offlineClearSource = source.slice(offlineClearStart, offlineClearEnd);
    const onRemoveStart = popupOfflineSource.indexOf("async function onRemove(queueId) {");
    const onRemoveEnd = popupOfflineSource.indexOf("async function toggle(ev) {", onRemoveStart);
    assert(onRemoveStart >= 0 && onRemoveEnd > onRemoveStart, "onRemove source not found");
    const onRemoveSource = popupOfflineSource.slice(onRemoveStart, onRemoveEnd);
    const rebasePopupTags = new Function("unionTags", `${tagHelperSource}\nreturn pbpRebasePopupTags;`)(unionTags);

    function createElementStub(initial = {}) {
      const listeners = {};
      const classes = new Set(initial.classes || []);
      const element = {
        value: "", checked: false, disabled: false, textContent: "", removed: false,
        children: [],
        classList: {
          add: (...names) => names.forEach((name) => classes.add(name)),
          remove: (...names) => names.forEach((name) => classes.delete(name)),
          contains: (name) => classes.has(name),
          toggle: (name, force) => {
            const add = force === undefined ? !classes.has(name) : force;
            if (add) classes.add(name); else classes.delete(name);
            return add;
          },
        },
        addEventListener(type, listener) { (listeners[type] ||= []).push(listener); },
        querySelector() { return null; },
        setAttribute() {},
        appendChild(child) { this.children.push(child); },
        replaceChildren(...children) { this.children = children; },
        remove() { this.removed = true; },
        _listeners: listeners,
      };
      Object.assign(element, initial);
      return element;
    }

    function createSubmitHarness({ archiveRequested = false, archiveUserTouched = false, deferWayback = false, lookupFailed = false, waybackHostGranted = true } = {}) {
      const elements = {
        "submit-btn": createElementStub(),
        "delete-btn": createElementStub({ classes: ["hidden"] }),
        "url-input": createElementStub({ value: URL }),
        "title-input": createElementStub({ value: "Submitted title" }),
        "description-input": createElementStub({ value: "Submitted notes" }),
        "private-check": createElementStub({ checked: false }),
        "readlater-check": createElementStub({ checked: false }),
        "archive-check": createElementStub({ checked: archiveRequested }),
        "tags-input": createElementStub(),
        "status-msg": createElementStub(),
      };
      const currentTags = ["One", "Two"];
      const fieldDirtyFlags = { "title-input": true, "description-input": true, "private-check": true, "readlater-check": true };
      const bookmarkLookup = { status: lookupFailed ? "failed" : "missing", url: URL, generation: 1, promise: null, formLoaded: false };
      const settings = {
        pinboardToken: "alice:token",
        optAutoCloseAfterSave: true,
        waybackArchiveEnabled: archiveRequested,
        waybackSkipPrivate: true,
      };
      const messages = [];
      const statuses = [];
      const timers = [];
      const bars = [];
      const checkCalls = [];
      const savedTagCalls = [];
      const syncRemovals = [];
      const localTokenWrites = [];
      const authEvents = [];
      const reloadTokenValues = [];
      let queueRefreshes = 0;
      let closeCalls = 0;
      let reloadCalls = 0;
      let nextTimerId = 1;
      let resolveSave;
      let resolveWayback;
      const saveResponse = new Promise((resolve) => { resolveSave = resolve; });
      const waybackResponse = new Promise((resolve) => { resolveWayback = resolve; });

      const chromeStub = {
        runtime: {
          sendMessage(message) {
            if (message.type !== "save_intent") throw new Error("unexpected runtime message: " + message.type);
            messages.push(message);
            return saveResponse;
          },
        },
        storage: {
          local: {
            async get() { return deferWayback ? waybackResponse : {}; },
            async set(data) { localTokenWrites.push(data); authEvents.push("local-tombstone"); },
          },
        },
      };
      const windowStub = {
        PPOffline: { async refresh() { queueRefreshes++; } },
        close() { closeCalls++; },
        location: { reload() { reloadTokenValues.push(settings.pinboardToken); authEvents.push("reload"); reloadCalls++; } },
      };
      const documentStub = {
        body: { appendChild(element) { bars.push(element); } },
        addEventListener() {},
        // The auto-close path detaches its pointermove listener on every exit,
        // including the one the timer callback takes.
        removeEventListener() {},
        querySelector() { return null; },
        createTextNode(text) { return { textContent: text }; },
        createElement() { return createElementStub(); },
      };
      const setTimeoutStub = (callback, delay) => {
        const timer = { id: nextTimerId++, callback, delay, cancelled: false };
        timers.push(timer);
        return timer.id;
      };
      const clearTimeoutStub = (id) => {
        const timer = timers.find((candidate) => candidate.id === id);
        if (timer) timer.cancelled = true;
      };
      const checkExistingBookmark = (...args) => {
        checkCalls.push(args);
        bookmarkLookup.generation++;
        bookmarkLookup.status = lookupFailed ? "failed" : "pending";
        bookmarkLookup.url = args[1];
        bookmarkLookup.formLoaded = false;
        return Promise.resolve({ status: lookupFailed ? "failed" : "found", url: args[1] });
      };
      const getSettingsStorage = async () => ({
        async remove(key) { syncRemovals.push(key); authEvents.push("settings-remove"); },
      });
      const persistSettings = async (data) => {
        localTokenWrites.push(data);
        authEvents.push("persist-empty");
        return { ok: true };
      };
      const dependencies = {
        $id: (id) => (elements[id] ||= createElementStub()),
        t: (key) => key,
        clearTimeout: clearTimeoutStub,
        setTimeout: setTimeoutStub,
        showStatus: (...args) => statuses.push(args),
        updateCharCount() {},
        pbpPopupSavePolicy,
        fieldDirtyFlags,
        bookmarkLookup,
        existingBookmark: null,
        currentTags,
        _archiveUserTouched: archiveUserTouched,
        _waybackHostGranted: waybackHostGranted,
        settings,
        chrome: chromeStub,
        window: windowStub,
        document: documentStub,
        getSettingsStorage,
        persistSettings,
        invalidateBookmarkLookup() {},
        pbpPinboardAccountFromToken,
        saveLastUsedTags: (tags) => savedTagCalls.push(tags.slice()),
        checkExistingBookmark,
        pbpWaybackShouldArchive,
        pbpWaybackShouldAttempt: () => true,
        POSTS_ADD_URI_BUDGET,
      };
      const names = Object.keys(dependencies);
      const factory = new Function(...names, `${resetSource}\n${setupSource}\nreturn setupSubmit;`);
      const setupSubmit = factory(...names.map((name) => dependencies[name]));
      setupSubmit("alice:token");
      const click = elements["submit-btn"]._listeners.click[0];
      return {
        elements, currentTags, fieldDirtyFlags, bookmarkLookup, settings, messages, statuses, timers, bars,
        checkCalls, savedTagCalls, syncRemovals, localTokenWrites, authEvents, reloadTokenValues,
        click, resolveSave, resolveWayback,
        queueRefreshes: () => queueRefreshes,
        closeCalls: () => closeCalls,
        reloadCalls: () => reloadCalls,
      };
    }

    test("unchanged submitted tags retain the existing union behavior", () => {
      const result = rebasePopupTags("ServerOnly Alpha", ["Alpha", "Beta"], ["Alpha", "Beta"]);
      assert(JSON.stringify(result) === JSON.stringify(["ServerOnly", "Alpha", "Beta"]), result.join(" "));
    });

    test("tag rebase preserves server-only tags and applies live remove, reorder, case, and add", () => {
      const result = rebasePopupTags(
        "Alpha Beta Gamma ServerOnly",
        ["Alpha", "Beta", "Gamma"],
        ["gamma", "ALPHA", "New"]
      );
      assert(JSON.stringify(result) === JSON.stringify(["ServerOnly", "gamma", "ALPHA", "New"]), result.join(" "));
    });

    test("fresh bookmark lookup wires the submitted tag baseline into the rebase helper", () => {
      assert(lookupSource.includes("Array.isArray(submittedTags)"), "lookup does not detect the submitted tag baseline");
      assert(lookupSource.includes("pbpRebasePopupTags(existingBookmark.tags || \"\", submittedTags, currentTags)"), "lookup bypasses the production rebase helper");
    });

    await testAsync("real submit callback keeps queued separate from saved side effects", async () => {
      const harness = createSubmitHarness();
      const pending = harness.click();
      assert(harness.messages.length === 1, "save_intent was not sent");
      harness.resolveSave({ status: "queued", queueId: "q1" });
      await pending;
      assert(harness.queueRefreshes() === 1, "queue bar was not refreshed");
      assert(harness.savedTagCalls.length === 0, "queued saved last-used tags");
      assert(harness.timers.every((timer) => timer.delay !== 1800), "queued created an auto-close timer");
      assert(harness.closeCalls() === 0, "queued closed the Popup");
      assert(JSON.stringify(harness.statuses.at(-1)) === JSON.stringify(["status-msg", "offlineQueued", "info"]), "queued did not leave the info status visible");
      assert(!harness.elements["submit-btn"].classList.contains("save-error"), "queued fell through into the error state");
      assert(!harness.elements["submit-btn"].classList.contains("saved-success"), "queued entered the saved state");
    });

    await testAsync("real submit callback awaits Wayback snapshot before save_intent", async () => {
      const harness = createSubmitHarness({ archiveRequested: true, deferWayback: true });
      const pending = harness.click();
      assert(harness.messages.length === 0, "save_intent raced ahead of the Wayback snapshot");
      harness.resolveWayback({ _waybackAttempts: {} });
      await new Promise((resolve) => requestAnimationFrame(resolve));
      assert(harness.messages.length === 1, "save_intent did not start after the Wayback snapshot");
      harness.resolveSave({ status: "queued", queueId: "q-wayback" });
      await pending;
    });

    await testAsync("untouched failed lookup leaves archive policy to the final merged bookmark", async () => {
      const harness = createSubmitHarness({ archiveRequested: true, lookupFailed: true });
      const pending = harness.click();
      await new Promise((resolve) => requestAnimationFrame(resolve));
      assert(harness.messages.length === 1, "merge save_intent was not sent");
      assert(harness.messages[0].intent.mode === "merge", "failed lookup did not use merge mode");
      assert(harness.messages[0].intent.archive === undefined, "automatic archive choice became a privacy-bypassing override");
      harness.resolveSave({ status: "saved", mutation: "updated" });
      await pending;
      assert(!harness.elements["status-msg"].children.some((child) => child.className === "wayback-indicator"), "unknown merged privacy showed an optimistic archive indicator");
    });

    await testAsync("manual archive true and false remain explicit overrides", async () => {
      for (const archiveRequested of [true, false]) {
        const harness = createSubmitHarness({ archiveRequested, archiveUserTouched: true });
        const pending = harness.click();
        await new Promise((resolve) => requestAnimationFrame(resolve));
        assert(harness.messages[0].intent.archive === archiveRequested, `manual ${archiveRequested} override was lost`);
        harness.resolveSave({ status: "saved", mutation: "created" });
        await pending;
        const indicatorShown = harness.elements["status-msg"].children.some((child) => child.className === "wayback-indicator");
        assert(indicatorShown === archiveRequested, `manual ${archiveRequested} indicator disagrees with the submitted override`);
      }
    });

    await testAsync("an ungranted web.archive.org permission cancels the archive claim, not the request", async () => {
      const harness = createSubmitHarness({ archiveRequested: true, archiveUserTouched: true, waybackHostGranted: false });
      const pending = harness.click();
      await new Promise((resolve) => requestAnimationFrame(resolve));
      assert(harness.messages[0].intent.archive === true, "the explicit archive override must still reach the background");
      harness.resolveSave({ status: "saved", mutation: "created" });
      await pending;
      assert(!harness.elements["status-msg"].children.some((child) => child.className === "wayback-indicator"),
        "a missing host permission still produced an optimistic archive indicator");
    });

    await testAsync("real submit callback tells about a tag draft that was in the box at click", async () => {
      const harness = createSubmitHarness();
      harness.elements["tags-input"].value = "Uncommitted";
      const pending = harness.click();
      harness.resolveSave({ status: "saved", mutation: "created" });
      await pending;
      const noteShown = harness.elements["status-msg"].children.some((child) => child.textContent === "tagDraftUnsaved");
      assert(noteShown, "a tag draft present at click did not produce the unsaved-draft note");
      assert(harness.timers.every((timer) => timer.delay !== 1800), "a tag draft at click still scheduled auto-close");
      assert(harness.closeCalls() === 0, "a tag draft at click closed the Popup");
    });

    await testAsync("real submit callback stays silent when the tags box was empty at click", async () => {
      const harness = createSubmitHarness();
      const pending = harness.click();
      harness.resolveSave({ status: "saved", mutation: "created" });
      await pending;
      const noteShown = harness.elements["status-msg"].children.some((child) => child.textContent === "tagDraftUnsaved");
      assert(!noteShown, "an empty tags box at click produced the unsaved-draft note");
      assert(harness.timers.some((timer) => timer.delay === 1800), "an empty tags box at click suppressed the ordinary auto-close");
    });

    await testAsync("real submit callback ignores tag text typed after the click (draft is snapshotted, not re-read)", async () => {
      const harness = createSubmitHarness();
      const pending = harness.click();
      harness.elements["tags-input"].value = "Uncommitted";
      harness.resolveSave({ status: "saved", mutation: "created" });
      await pending;
      const noteShown = harness.elements["status-msg"].children.some((child) => child.textContent === "tagDraftUnsaved");
      assert(!noteShown, "tag text typed after the click produced the unsaved-draft note despite the click-time snapshot");
    });

    await testAsync("real submit callback preserves edits made while save is pending", async () => {
      const mutations = [
        ["title", (harness) => { harness.elements["title-input"].value = "Edited title"; }],
        ["notes", (harness) => { harness.elements["description-input"].value = "Edited notes"; }],
        ["private", (harness) => { harness.elements["private-check"].checked = true; }],
        ["read-later", (harness) => { harness.elements["readlater-check"].checked = true; }],
        ["archive", (harness) => { harness.elements["archive-check"].checked = true; }],
        ["tags", (harness) => { harness.currentTags.splice(0, harness.currentTags.length, "Two", "New"); }],
        ["tag draft", (harness) => { harness.elements["tags-input"].value = "Uncommitted"; }],
      ];
      for (const [label, mutate] of mutations) {
        const harness = createSubmitHarness();
        const pending = harness.click();
        mutate(harness);
        harness.resolveSave({ status: "saved", mutation: "created" });
        await pending;
        assert(JSON.stringify(harness.checkCalls[0][4]) === JSON.stringify(["One", "Two"]), `${label}: force-fresh baseline changed`);
        assert(harness.timers.every((timer) => timer.delay !== 1800), `${label}: in-flight edit created an auto-close timer`);
        assert(harness.closeCalls() === 0, `${label}: in-flight edit closed the Popup`);
      }
    });

    await testAsync("real auto-close callback rechecks edits made after timer creation", async () => {
      const mutations = [
        ["title", (harness) => { harness.elements["title-input"].value = "Edited title"; }],
        ["notes", (harness) => { harness.elements["description-input"].value = "Edited notes"; }],
        ["private", (harness) => { harness.elements["private-check"].checked = true; }],
        ["read-later", (harness) => { harness.elements["readlater-check"].checked = true; }],
        ["archive", (harness) => { harness.elements["archive-check"].checked = true; }],
        ["tags", (harness) => { harness.currentTags.push("Later"); }],
        ["tag draft", (harness) => { harness.elements["tags-input"].value = "Uncommitted"; }],
      ];
      for (const [label, mutate] of mutations) {
        const harness = createSubmitHarness();
        const pending = harness.click();
        harness.resolveSave({ status: "saved", mutation: "created" });
        await pending;
        const timer = harness.timers.find((candidate) => candidate.delay === 1800);
        assert(timer, `${label}: unchanged saved form did not create the auto-close timer`);
        mutate(harness);
        timer.callback();
        assert(harness.closeCalls() === 0, `${label}: timer closed despite later edit`);
        assert(harness.bars[0]?.removed === true, `${label}: cancelled auto-close bar was not removed`);
      }
    });

    await testAsync("stale URL cannot suppress not_logged_in session reset", async () => {
      const harness = createSubmitHarness();
      const pending = harness.click();
      harness.elements["url-input"].value = "https://stale.example";
      harness.resolveSave({ status: "failed", reason: "not_logged_in" });
      await pending;
      assert(harness.syncRemovals.length === 0, "session reset bypassed unified persistence");
      assert(JSON.stringify(harness.localTokenWrites) === JSON.stringify([{ pinboardToken: "" }]), "empty token was not persisted");
      assert(harness.settings.pinboardToken === "", "in-memory token was not cleared");
      assert(harness.reloadCalls() === 1, "session reset did not reload the Popup");
      assert(harness.authEvents.join("|") === "persist-empty|reload", "session reset order changed: " + harness.authEvents.join("|"));
      assert(JSON.stringify(harness.reloadTokenValues) === JSON.stringify([""]), "reload happened before the in-memory token was cleared");
    });

    test("submit rereads one owned form snapshot into save_intent", () => {
      assert(start >= 0 && handlerEnd > start && policyIndex >= 0, "submit policy path not found");
      assert(snapshotIndex > policyIndex && ownershipIndex > snapshotIndex && intentIndex > ownershipIndex && sendIndex > intentIndex, "snapshot-to-intent ordering changed");
      for (const field of ["title-input", "description-input", "private-check", "readlater-check", "archive-check"]) {
        assert(snapshot.includes(`$id("${field}")`), `${field} is not in the final snapshot`);
      }
      assert(snapshot.includes("currentTags.slice()"), "tags are not copied into the final snapshot");
      for (const field of ["mode: savePolicy.mode", "url: saveUrl", "title", "notes: extended", 'tags: tags.join(" ")', "private: isPrivate", "toread: isReadLater"]) {
        assert(intentBlock.includes(field), `intent is missing ${field}`);
      }
      assert(intentBlock.includes("archive: _archiveUserTouched ? archiveRequested : undefined"), "automatic archive choice is still sent as an override");
    });

    test("summary ownership persists only after a saved delivery", () => {

      // stripTrackingParams degrades to identity inside this page. Fragments
      // are still dropped (that path uses the URL injected above), but do NOT
      // write a tracking-param equivalence case here: it would pass vacuously.
      const runtime = new Function(
        "$id", "t", "PBP_ICONS", "allUserTagCounts", "pageInfo",
        "renderTags", "doAITags", "showStatus", "pbpAssignAltNumBadges",
        "_aiClearTagsOutput", "_aiAppendEmptyState", "_aiParkTagsBtn",
        "stripTrackingParams", "URL", "seedTags", "settings",
        "let currentTags = seedTags.slice();\n" +
        "const _aiSessionAddedTags = new Set();\n" +
        // Finding 5: mirrors the real addTag's dedup-before-flag-set order

        "let _tagsUserTouched = false;\n" +
        "function addTag(tag) {\n" +
        "  if (currentTags.some((x) => x.toLowerCase() === String(tag).toLowerCase())) return;\n" +

    // Both routes run the SHIPPED source, sliced out of popup.js / popup-tags.js
    // and executed against real DOM nodes: focus order, focus(), disabled and
    // the browser's own focusin/keydown dispatch are exactly what the popup
    // gets, not a re-implementation that can agree with itself while the
    // shipped file drifts.

    const altHotkeyStart = source.indexOf("const PBP_ALT_CHECKBOX_CODES =");
    assert(altHotkeyStart >= 0, "popup.js: the Alt hotkey table (PBP_ALT_CHECKBOX_CODES) was not found");
    const altHotkeySource = source.slice(altHotkeyStart);

    function createAltHotkeyHarness(mainClasses = []) {
      const host = document.createElement("div");
      host.id = "main-section";
      mainClasses.forEach((c) => host.classList.add(c));
      const boxes = {};
      ["private-check", "readlater-check", "archive-check"].forEach((id) => {
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.id = id;
        host.appendChild(cb);
        boxes[id] = cb;
      });
      document.body.appendChild(host);
      const changes = [];
      // The real archive handler is an async change listener that flips
      // _archiveUserTouched on its FIRST line: what matters for this contract
      // is that a change event reaches it at all, which a `.checked = !checked`
      // shortcut would never have produced.
      let archiveUserTouched = false;
      Object.entries(boxes).forEach(([id, cb]) => {
        cb.addEventListener("change", () => {
          changes.push(id);
          if (id === "archive-check") archiveUserTouched = true;
        });
      });
      const byId = { "main-section": host, ...boxes };
      let handler = null;
      const documentStub = {
        addEventListener: (type, fn) => { if (type === "keydown") handler = fn; },
        querySelector: (sel) => host.querySelector(sel),
      };
      new Function("document", "$id", altHotkeySource)(documentStub, (id) => byId[id] || null);
      assert(handler, "the sliced Alt hotkey listener never registered a keydown handler");
      return {
        boxes, changes, host,
        isArchiveTouched: () => archiveUserTouched,
        press(init) {
          let prevented = false;
          handler({
            altKey: true, ctrlKey: false, metaKey: false, shiftKey: false, repeat: false,
            key: "", code: "", ...init, preventDefault() { prevented = true; },
          });
          return prevented;
        },
        cleanup: () => host.remove(),
      };
    }

    function createRovingFixture({ chips = [], usedIdx = [], addAll = true, containerId = "pinboard-suggest-tags", chipClass = "stag" } = {}) {
      const container = document.createElement("div");
      container.id = containerId;

      const api = new Function("currentTags", "$id", "document",
        `${rovingSource}\nreturn { syncSuggestTagStates, pbpSyncRovingToolbars };`
      )(currentTags, (id) => document.getElementById(id), document);
      function build() {
        while (container.firstChild) container.removeChild(container.firstChild);
        const made = chips.map((tag, i) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = chipClass;
          b.dataset.tag = tag;
          b.textContent = tag;
          // .preset-btn disabling is a one-way "already inserted" marker, not a
          // currentTags mirror, so syncSuggestTagStates will not set it for us.
          if (chipClass !== "stag" && usedIdx.includes(i)) b.disabled = true;
          container.appendChild(b);
          return b;
        });
        let aa = null;
        if (addAll) {
          aa = document.createElement("button");
          aa.type = "button";
          aa.className = "add-all-link";
          aa.textContent = "Add all";
          container.appendChild(aa);
        }
        api.syncSuggestTagStates();
        return { made, aa };
      }
      let built = build();
      return {
        container, api, currentTags,
        get chips() { return built.made; },
        get addAll() { return built.aa; },
        rebuild() { built = build(); },
        cleanup() {
          if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
          container.remove();

      } finally { fx.cleanup(); }
    });

    test("K72 乙: a group with no chips at all leaves no dead tab stop behind", () => {
      const fx = createRovingFixture({ chips: ["a"], addAll: false });
      try {
        fx.chips[0].remove();
        fx.api.syncSuggestTagStates();
        assert(fx.container.getAttribute("role") === null && fx.container.getAttribute("tabindex") === null,
          "an empty chip group still advertises a toolbar tab stop -- Tab would stop on nothing");
      } finally { fx.cleanup(); }
    });

    test("K72 乙: #tag-presets gets the same container-level stop (its chips are .preset-btn, not .stag)", () => {
      const fx = createRovingFixture({ chips: ["Work", "Read", "Ref"], addAll: false, containerId: "tag-presets", chipClass: "preset-btn" });
      try {
        assert(fx.container.getAttribute("role") === "toolbar" && fx.container.getAttribute("tabindex") === "0",
          "#tag-presets did not become a single container-level tab stop");
        assert([...fx.container.querySelectorAll("button")].every((b) => b.tabIndex === -1),
          "preset buttons are still individual tab stops");
        fx.container.focus();
        assert(document.activeElement === fx.chips[0], "focusing #tag-presets did not reach the first preset");
        fx.chips[0].dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowRight", bubbles: true, cancelable: true }));
        assert(document.activeElement === fx.chips[1], "arrow keys do not roam the presets");
      } finally { fx.cleanup(); }
    });

    test("K72 乙: the roving listeners bind on the containers, never on document", () => {
      assert(!/\bdocument\.addEventListener\(\s*"(?:keydown|focusin|focusout)"/.test(rovingSource),
        "popup-tags.js: a roving listener was bound on document -- it would race the #tags-input ArrowUp/Down autocomplete handler");
      assert(/c\.addEventListener\("keydown", pbpRovingKeydown\)/.test(rovingSource),
        "popup-tags.js: the arrow-key handler is no longer bound on the container");
      assert(/pbpSyncRovingToolbars\(\);/.test(rovingSource),
        "popup-tags.js: syncSuggestTagStates no longer drives the roving maintenance");
      assert(/^\s*syncSuggestTagStates\(\);/m.test(popupTagsSource.slice(popupTagsSource.indexOf("function pbpAssignAltNumBadges()"))),
        "popup-tags.js: pbpAssignAltNumBadges no longer opens with syncSuggestTagStates() -- the rebuild path would stop re-applying the roving state");
    });

    // K72 fix round 1: the cache-hit AI render appends a .cache-hint-wrap with
    // two .regen-link <a href="#"> AFTER the chips and the Add all button. They
    // sit INSIDE #ai-suggest-tags, which is role="toolbar" by then, so a native
    // tabIndex 0 on them turns the "one stop per group" contract into three
    // stops in exactly the state a returning user sees most (cached tags).
    // Runs the REAL renderAITags against the REAL pbpAssignAltNumBadges ->
    // syncSuggestTagStates -> pbpSyncRovingToolbars chain, so it fails if the
    // maintenance runs at the wrong MOMENT as well as on the wrong SELECTOR.
    const aiRenderStart = popupAiSource.indexOf("const AI_TAGS_OUTPUT_SEL =");
    assert(aiRenderStart >= 0, "popup-ai.js: the renderAITags block was not found");
    const aiRenderSource = popupAiSource.slice(aiRenderStart);
    const tagsPipelineSource = popupTagsSource.slice(rovingStart);
    assert(tagsPipelineSource.includes("function pbpAssignAltNumBadges()"),
      "popup-tags.js: pbpAssignAltNumBadges is no longer the tail of the syncSuggestTagStates block");

    function createCachedAiFixture() {
      const container = document.createElement("div");
      container.id = "ai-suggest-tags";
      container.className = "suggest-area";
      const genBtn = document.createElement("button");
      genBtn.type = "button";
      genBtn.id = "ai-tags-btn";
      genBtn.className = "action-link";
      container.appendChild(genBtn);
      document.body.appendChild(container);
      const byId = { "ai-suggest-tags": container, "ai-tags-btn": genBtn };
      const idLookup = (id) => byId[id] || document.getElementById(id) || null;
      const label = (k) => k;
      const pipeline = new Function("currentTags", "$id", "document", "t",
        `${tagsPipelineSource}\nreturn { syncSuggestTagStates, pbpAssignAltNumBadges };`
      )([], idLookup, document, label);
      const renderAITags = new Function(
        "$id", "document", "t", "allUserTagCounts", "pbpAssignAltNumBadges", "injectEmptyState",
        `${aiRenderSource}\nreturn renderAITags;`
      )(idLookup, document, label, {}, pipeline.pbpAssignAltNumBadges, () => {});
      return {
        container, renderAITags,
        links: () => [...container.querySelectorAll(".regen-link")],
        chips: () => [...container.querySelectorAll(".stag")],
        addAll: () => container.querySelector(".add-all-link"),
        key: (k) => document.activeElement.dispatchEvent(
          new KeyboardEvent("keydown", { key: k, bubbles: true, cancelable: true })),
        cleanup() {
          if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
          container.remove();
        },
      };
    }

    test("K72 fix1: the cache-hit AI render still leaves #ai-suggest-tags exactly one tab stop", () => {
      const fx = createCachedAiFixture();
      try {
        fx.renderAITags(["alpha", "beta", "gamma"], true);
        assert(fx.links().length === 2,
          "setup: the cached path did not render the two regen links (fixture out of sync with renderAITags)");
        assert(fx.container.getAttribute("role") === "toolbar" && fx.container.getAttribute("tabindex") === "0",
          "the cached render left #ai-suggest-tags without its container-level tab stop");
        const strays = [...fx.container.querySelectorAll("*")]
          .filter((el) => el.tabIndex === 0 && !el.classList.contains("hidden"));
        assert(strays.length === 0,
          "the cached render left " + strays.length + " extra tab stop(s) inside the toolbar: " +
          strays.map((el) => el.className || el.tagName).join(", "));
      } finally { fx.cleanup(); }
    });

    test("K72 fix1: End and ArrowRight reach the cached-path regen links (tabindex -1 must not mean unreachable)", () => {
      const fx = createCachedAiFixture();
      try {
        fx.renderAITags(["alpha", "beta"], true);
        const links = fx.links();
        assert(links.length === 2, "setup: the two regen links did not render");
        fx.container.focus();
        assert(document.activeElement === fx.chips()[0], "container focus did not reach the first chip");
        fx.key("End");
        assert(document.activeElement === links[1],
          "End did not reach the last regen link -- pushing it out of the tab order without putting it in the ring makes it keyboard-dead");
        fx.key("ArrowLeft");
        assert(document.activeElement === links[0], "ArrowLeft did not walk back to the first regen link");
        fx.key("ArrowLeft");
        assert(document.activeElement === fx.addAll(), "ArrowLeft did not continue on to Add all");
      } finally { fx.cleanup(); }
    });

    await testAsync("K72: the real popup markup, in the 3-5-tags state, is <= 6 tab stops between #tags-input and #private-check", async () => {
      // chrome-dbg :9222 is not up in this sandbox and scripts/probe-tab-stops.mjs
      // needs its own headed Chromium, so this is the in-page fallback the task
      // brief specifies: the REAL #main-section markup out of popup.html, the
      // REAL popup.css, and the REAL sliced syncSuggestTagStates, counted with
      // the probe's own selector plus the `tabindex !== "-1"` filter a stop
      // count has to have once anything in range is programmatically focusable.
      const style = document.createElement("style");
      style.textContent = popupCss;
      document.head.appendChild(style);
      const hadSection = "section" in document.documentElement.dataset;
      const previousSection = document.documentElement.dataset.section;
      document.documentElement.dataset.section = "main";
      const parsed = new DOMParser().parseFromString(popupHtml, "text/html");
      const imported = document.importNode(parsed.getElementById("main-section"), true);
      document.body.appendChild(imported);
      try {
        const suggest = imported.querySelector("#pinboard-suggest-tags");
        assert(suggest, "popup.html: #pinboard-suggest-tags not found in the imported markup");
        imported.querySelector("#suggest-row").classList.remove("hidden");
        // 4 tags on the form: the two all-tags links are visible, and the four
        // matching chips go disabled -- the probe's state 3 exactly.
        imported.querySelector("#tags-copy-all").classList.remove("hidden");
        imported.querySelector("#tags-clear-all").classList.remove("hidden");
        while (suggest.firstChild) suggest.removeChild(suggest.firstChild);
        const names = Array.from({ length: 16 }, (_, i) => (i < 8 ? "pop-tag-" : "rec-tag-") + ((i % 8) + 1));
        names.forEach((tag) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "stag";
          b.dataset.tag = tag;
          b.textContent = tag;
          suggest.appendChild(b);
        });
        const aa = document.createElement("button");
        aa.type = "button";
        aa.className = "add-all-link";
        aa.textContent = "Add all";
        suggest.appendChild(aa);
        const currentTags = names.slice(0, 4);
        const s = imported.querySelector("#tags-input");
        const e = imported.querySelector("#private-check");
        assert(s && e, "the imported markup lost #tags-input or #private-check");
        const countStops = () => [...imported.querySelectorAll(':is(button,a[href],input,select,textarea,[tabindex]):not(:disabled)')]
          .filter((el) => el.offsetParent !== null
            && el.getAttribute("tabindex") !== "-1"
            && (s.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_FOLLOWING)
            && (e.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_PRECEDING));
        // Baseline first, in this same fixture: the four adopted chips go
        // disabled (all the pre-K72 sync ever did) and nothing carries a
        // tabindex. A fixture that cannot reproduce the crowding has nothing
        // to prove, so the before-count is asserted too.
        currentTags.forEach((tag) => { suggest.querySelector(`.stag[data-tag="${tag}"]`).disabled = true; });
        const before = countStops();
        assert(before.length >= 12,
          "the fixture did not reproduce the crowded 3-5-tags state (only " + before.length + " stops before the fix)");
        const api = new Function("currentTags", "$id", "document",
          `${rovingSource}\nreturn { syncSuggestTagStates };`
        )(currentTags, (id) => document.getElementById(id), document);
        api.syncSuggestTagStates();
        const stops = countStops();
        assert(stops.length >= 3,
          "the after-count collapsed to " + stops.length + " -- the fixture stopped measuring anything (the two all-tags links and the AI generate button must survive)");
        assert(stops.length <= 6,
          "the 3-5-tags state still has " + stops.length + " tab stops between #tags-input and #private-check (was " +
          before.length + "): " + stops.map((el) => el.id || el.className).join(", "));
      } finally {
        imported.remove();
        style.remove();
        if (hadSection) document.documentElement.dataset.section = previousSection;
        else delete document.documentElement.dataset.section;
      }
    });
  } catch (error) {
    test("popup submit source contracts load", () => { throw error; });
  }
})();
</script>
