<!doctype html>
<html><head><meta charset="utf-8"><title>library-vocab Tests</title>
<link rel="stylesheet" href="../library.css">
<style>
body{font-family:monospace;padding:16px}.case{padding:5px;border-bottom:1px solid #ddd}.pass{color:#176}.fail{color:#b00}
/* Stands in for the <=860px media query's back-button rule; scoped to the one
   test that needs it (see its comment) so nothing else sees a narrow-mode
   stylesheet at this harness's 1280px viewport. */
body.test-narrow-back .vocab-detail-back{display:inline-flex}
/* Shrinks the wide layout's scroll cap on the reading pane so the fixture's
   short words actually overflow it. library.css caps the pane at roughly the
   viewport height and lets it scroll; the fixture never fills that, so without
   this the pane is a scroll container on paper only. Scoped to the one test
   that needs a real scrollTop, same convention as the rule above (and as
   library-notes-tests.html's twin). */
body.test-scroll-pane #vocab-detail-pane{max-height:60px;overflow-y:auto}
</style></head>
<body>
<!-- vocab-workbench two-pane skeleton, copied from library.html (minus
     data-i18n*/aria attributes not needed by a script-driven fixture and
     minus the page chrome around it -- header/tabs/notes view). Offscreen,
     not display:none, so getComputedStyle-based checks still measure real
     layout (same convention the old options-vocab-tests.html fixture used). -->
<!-- id="view-vocab" is load-bearing, not decorative: library.css scopes the
     [hidden] display override for .vocab-load-more (and a couple of other
     rules) to "#view-vocab .vocab-load-more[hidden]" -- without this id the
     base ".vocab-load-more { display: block }" rule outranks the plain UA
     [hidden] default and the button stays visible. -->
<div id="view-vocab" style="position:fixed;left:-9999px;top:0;width:960px">
  <div class="vocab-workbench">
    <div class="vocab-list-pane" id="vocab-list-pane">
      <div id="vocab-no-account" class="notes-empty vocab-account-empty" hidden>
        <p>Sign in to keep vocabulary separate for each Pinboard account.</p>
        <a id="vocab-open-account-settings" href="../options.html#general">Open account settings</a>
        <button type="button" class="btn btn-sm vocab-signed-out-lookup" id="vocab-signed-out-lookup">Look up a word</button>
      </div>
      <div class="notes-toolbar vocab-filter-toolbar">
        <input type="search" id="vocab-search" aria-label="Search words, definitions, context, and groups" autocomplete="off" />
      </div>
      <div class="vocab-filter-row">
        <select id="vocab-group-filter" aria-label="Filter by group"><option value="">All groups</option></select>
        <select id="vocab-status-filter" aria-label="Filter by status" hidden>
          <option value="">All statuses</option>
          <option value="new">Learning</option>
          <option value="known">Known</option>
        </select>
        <button type="button" class="vocab-stat-chip" id="vocab-stat-learning" data-status="new" aria-pressed="false"></button>
        <button type="button" class="vocab-stat-chip" id="vocab-stat-known" data-status="known" aria-pressed="false"></button>
        <select id="vocab-sort" aria-label="Sort vocabulary" hidden>
          <option value="latest">Recently updated</option>
          <option value="oldest">Least recently updated</option>
          <option value="az">A-Z</option>
          <option value="za">Z-A</option>
        </select>
        <span class="vocab-sort-seg" role="group" aria-label="Sort vocabulary">
          <button type="button" class="btn btn-sm vocab-sort-btn" id="vocab-sort-time" aria-pressed="true" data-i18n-title="vocabSortOldest" data-i18n-aria="vocabSortOldest" aria-label="Least recently updated" title="Least recently updated"><span class="btn-ic" data-ic="clockArrowDown"></span></button>
          <button type="button" class="btn btn-sm vocab-sort-btn" id="vocab-sort-alpha" aria-pressed="false" data-i18n-title="vocabSortAz" data-i18n-aria="vocabSortAz" aria-label="A-Z" title="A-Z"><span class="btn-ic" data-ic="arrowDownAZ"></span></button>
        </span>
        <button type="button" class="btn btn-sm vocab-lookup-narrow" id="vocab-lookup-narrow" aria-label="Look up a word" title="Look up a word"><span class="btn-ic" data-ic="book"></span></button>
      </div>
      <div id="vocab-stats" class="vocab-stats" hidden>
        <span class="vocab-stat" id="vocab-stat-total"></span>
        <span class="vocab-stat" id="vocab-stat-groups"></span>
        <span class="vocab-stat" id="vocab-stat-languages"></span>
        <span class="vocab-stat vocab-stat-trend" id="vocab-stat-recent"></span>
      </div>
      <div class="vocab-context-bar" id="vocab-context-bar">
        <span class="vocab-ctx-text">
          <span id="vocab-count" class="notes-count" aria-live="polite"></span>
        </span>
        <div class="lib-cluster" role="group" aria-label="Selection actions">
          <button type="button" class="btn btn-sm ghost" id="vocab-select-all">Select all</button>
        </div>
        <span class="save-status vocab-main-status" id="vocab-status" role="status" aria-live="polite"></span>
      </div>
      <div id="vocab-empty" class="notes-empty" hidden>No saved words yet. Save words from the reader's dictionary view.</div>
      <div id="vocab-no-results" class="notes-empty" hidden>No words match the current filters.</div>
      <div class="vocab-list-region">
        <div id="vocab-list" role="grid" aria-multiselectable="true" aria-label="Saved vocabulary" aria-busy="false"></div>
        <button type="button" class="btn btn-sm vocab-load-more" id="vocab-load-more" hidden>Load more</button>
        <div class="vocab-batch-bar" id="vocab-batch-toolbar" role="group" aria-label="Actions for selected words">
          <span id="vocab-selected-count" class="notes-count" aria-live="polite"></span>
          <button type="button" class="btn btn-sm" id="vocab-invert-selection" aria-label="Invert selection" title="Invert selection"><span class="btn-ic" data-ic="arrowRightLeft"></span></button>
          <span class="vocab-group-unit">
            <input type="text" id="vocab-group-input" list="vocab-group-list" placeholder="Group name" aria-label="Group name" autocomplete="off" />
            <datalist id="vocab-group-list"></datalist>
            <button type="button" class="btn btn-sm vocab-group-step" id="vocab-add-group" aria-label="Add to group" title="Add to group"><span class="btn-ic" data-ic="plus"></span></button>
            <button type="button" class="btn btn-sm vocab-group-step" id="vocab-remove-group" aria-label="Remove from group" title="Remove from group"><span class="btn-ic" data-ic="minus"></span></button>
          </span>
          <span class="lib-cluster">
            <button type="button" class="btn btn-sm" id="vocab-mark-known" aria-label="Mark as known" title="Mark as known"><span class="btn-ic" data-ic="checkCircle"></span></button>
            <button type="button" class="btn btn-sm" id="vocab-mark-learning" aria-label="Back to learning" title="Back to learning"><span class="btn-ic" data-ic="rotateCcw"></span></button>
          </span>
          <button type="button" class="btn btn-sm danger" id="vocab-batch-delete" aria-label="Delete selected" title="Delete selected"><span class="btn-ic" data-ic="trash"></span></button>
          <button type="button" class="btn btn-sm vocab-clear-selection" id="vocab-clear-selection" aria-label="Clear selection" title="Clear selection"><span class="btn-ic" data-ic="cross"></span></button>
        </div>
      </div>
    </div>
    <aside class="vocab-detail-pane" id="vocab-detail-pane" aria-label="Word details">
      <button type="button" class="btn btn-sm vocab-detail-back" id="vocab-detail-back" aria-label="Back to list" title="Back to list"><span class="btn-ic" data-ic="cross"></span><span>Back to list</span></button>
      <div id="vocab-lookup-bar" class="vocab-filter-toolbar vocab-lookup-bar" role="search" aria-label="Dictionary lookup">
        <input type="search" id="vocab-lookup-input" aria-label="Look up any word" autocomplete="off" />
        <select id="vocab-lookup-lang" aria-label="Dictionary language"></select>
        <button type="button" class="btn btn-sm" id="vocab-lookup-go" aria-label="Look up" title="Look up"><span class="btn-ic" data-ic="book"></span></button>
      </div>
      <div class="vocab-detail-empty" id="vocab-detail-empty">Pick a word from the list to see its details.</div>
      <div class="vocab-detail" id="vocab-detail" hidden></div>
    </aside>
  </div>
</div>
<div id="results"></div>
<script>
function t(key, ...values) { return key + (values.length ? ":" + values.join(",") : ""); }
</script>
<script src="../shared.js"></script>
<script src="../vocab-store.js"></script>
<script src="../md-dict.js"></script>
<script src="../dict-pack.js"></script>
<!-- pbpVocabCurrentOwner (shared.js) routes through pbpReadSettingsWithSecrets,
     which without this stub hits the real chrome.storage/navigator.locks
     path -- absent here (no chrome mock on this page) it does not merely
     reject cleanly, it can leave that lock request unresolved. Same stub the
     pre-split options-vocab-tests.html used. -->
<script>pbpReadSettingsWithSecrets = async () => ({ pinboardToken: "" });</script>
<script src="../library-vocab.js"></script>
<script>
const results = $id("results");
let pass = 0, fail = 0;
function check(name, condition, detail) {
  const row = document.createElement("div");
  const ok = !!condition;
  ok ? pass++ : fail++;
  row.className = "case " + (ok ? "pass" : "fail");
  row.textContent = (ok ? "PASS " : "FAIL ") + name + (ok ? "" : "\n  " + (detail || ""));
  results.appendChild(row);
}
function ids(rows) { return rows.map((row) => row.id).join(","); }

const sample = [
  { id:"a", term:"Défense", lemma:"défendre", gloss:"Protection", note:"Review soon", groups:["French A1"], contexts:[{quote:"La défense gagne.",articleTitle:"Match report"}], updatedAt:30 },
  { id:"b", term:"word10", lemma:"", gloss:"Tenth item", note:"", groups:["Numbers"], contexts:[], updatedAt:10 },
  { id:"c", term:"word2", lemma:"", gloss:"Second item", note:"", groups:[], contexts:[], updatedAt:20 }
];

const hostileOwner = "acct_%3Cimg%20src%3Dx%20onerror%3Dalert(1)%3E";
const hostileOwnerLabel = typeof pbpVocabOwnerLabel === "function" ? pbpVocabOwnerLabel(hostileOwner) : "";
if (typeof _vocabOwnerLabel !== "undefined") _vocabOwnerLabel = hostileOwnerLabel;
_vocabRows = [];
_pbpVocabApplyView(true);
check("current-account total and empty state render the non-secret owner as text",
  $id("vocab-count").textContent.includes("<img") && $id("vocab-empty").textContent.includes("<img") &&
  !$id("vocab-count").querySelector("img") && !$id("vocab-empty").querySelector("img"));
_pbpVocabClearVisibleState();
check("account-switch clearing removes the previous owner scope before the next read",
  !$id("vocab-count").textContent && $id("vocab-empty").hidden &&
  (typeof _vocabOwnerLabel === "undefined" || !_vocabOwnerLabel));

check("search matches term case-insensitively", ids(pbpVocabFilterSort(sample,"DÉFENSE","","latest")) === "a");
check("search matches lemma", ids(pbpVocabFilterSort(sample,"défendre","","latest")) === "a");
check("search matches gloss", ids(pbpVocabFilterSort(sample,"protection","","latest")) === "a");
check("search matches note", ids(pbpVocabFilterSort(sample,"review soon","","latest")) === "a");
check("search matches context quote", ids(pbpVocabFilterSort(sample,"gagne","","latest")) === "a");
check("search matches article title", ids(pbpVocabFilterSort(sample,"match report","","latest")) === "a");
check("search matches group names", ids(pbpVocabFilterSort(sample,"french a1","","latest")) === "a");
check("group filter is exact", ids(pbpVocabFilterSort(sample,"","Numbers","latest")) === "b");
check("status filter keeps only known words", ids(pbpVocabFilterSort(
  [{ id:"k", term:"kk", status:"known" }, { id:"n", term:"nn" }], "", "", "latest", "known")) === "k");
check("status filter learning excludes known, records without the field count as learning", ids(pbpVocabFilterSort(
  [{ id:"k", term:"kk", status:"known" }, { id:"n", term:"nn" }], "", "", "latest", "new")) === "n");
check("search normalizes NFC", ids(pbpVocabFilterSort(sample,"Défense","","latest")) === "a");
check("search folds Greek final sigma", pbpVocabSearchText("ΟΣ") === pbpVocabSearchText("οσ"));
check("search folds German sharp s to ss", pbpVocabSearchText("Straße") === pbpVocabSearchText("STRASSE"));
check("search folds capital sharp s", pbpVocabSearchText("ẞ") === "ss");
check("search folds dotted capital I", pbpVocabSearchText("İstanbul") === pbpVocabSearchText("istanbul"));
check("search preserves German umlaut distinctions", pbpVocabSearchText("schon") !== pbpVocabSearchText("schön"));
check("search preserves Cyrillic diaeresis distinctions", pbpVocabSearchText("все") !== pbpVocabSearchText("всё"));
check("search preserves Devanagari vowel marks", pbpVocabSearchText("क") !== pbpVocabSearchText("कि"));

check("latest sort uses updatedAt descending", ids(pbpVocabFilterSort(sample,"","","latest")) === "a,c,b");
check("oldest sort uses updatedAt ascending", ids(pbpVocabFilterSort(sample,"","","oldest")) === "b,c,a");
check("A-Z sort uses numeric Intl.Collator order", ids(pbpVocabFilterSort(sample.slice(1),"","","az")) === "c,b");
check("Z-A sort reverses collator order", ids(pbpVocabFilterSort(sample.slice(1),"","","za")) === "b,c");
const tied = [{id:"x",term:"same",updatedAt:1},{id:"y",term:"same",updatedAt:1}];
check("equal sort keys preserve source order", ids(pbpVocabFilterSort(tied,"","","az")) === "x,y");

// pbpVocabStats: pure counting over owner rows
(function () {
  const NOW = 1754200000000; // fixed clock
  const D = 86400000;
  const rows = [
    { term: "a", status: "new",   language: "en",  groups: ["g1"],      createdAt: NOW - 1 * D },
    { term: "b", status: "known", language: "en",  groups: ["g1","g2"], createdAt: NOW - 7 * D },      // exactly 7d -> counts in 7d window (>=)
    { term: "c", status: "new",   language: "fr",  groups: [],          createdAt: NOW - 8 * D },      // outside 7d, inside 30d
    { term: "d", status: "known", language: "und", groups: [],          createdAt: NOW - 31 * D },     // outside 30d; und not a language
  ];
  const s = pbpVocabStats(rows, NOW);
  check("stats: total", s.total === 4);
  check("stats: learning counts status new", s.learning === 2);
  check("stats: known", s.known === 2);
  check("stats: groups deduped", s.groups === 2);
  check("stats: languages exclude und", s.languages === 2);
  check("stats: added7 inclusive boundary", s.added7 === 2);
  check("stats: added30", s.added30 === 3);
  check("stats: empty rows", pbpVocabStats([], NOW).total === 0);
})();

setStatusIcon($id("vocab-status"), false, "read failed");
const errorColor = getComputedStyle($id("vocab-status")).color;
check("shared status renderer marks an error host and icon as bad",
  $id("vocab-status").classList.contains("bad") && !$id("vocab-status").classList.contains("ok") &&
  $id("vocab-status").querySelector(".status-ic.bad"));
setStatusIcon($id("vocab-status"), true, "saved");
const successColor = getComputedStyle($id("vocab-status")).color;
check("shared status renderer marks success as ok and keeps success/error colours distinct",
  $id("vocab-status").classList.contains("ok") && !$id("vocab-status").classList.contains("bad") &&
  $id("vocab-status").querySelector(".status-ic.ok") && successColor !== errorColor);

_pbpVocabClearVisibleState();
check("vocabulary loading is visible in the existing polite status region",
  $id("vocab-status").textContent === "vocabLoading" &&
  $id("vocab-status").getAttribute("role") === "status" &&
  $id("vocab-status").getAttribute("aria-live") === "polite" &&
  getComputedStyle($id("vocab-status")).display !== "none");
check("vocabulary loading marks the production list busy",
  $id("vocab-list").getAttribute("aria-busy") === "true");
// The batch bar is class-driven, not hidden-attribute-driven (see
// _pbpVocabSyncSelectionUi / library-vocab.js): it is always display:flex,
// hidden via visibility/height/opacity through .selecting instead. The old
// pre-split fixture's toolbar div carried a permanent `hidden` attribute and
// no vocab-batch-bar class, so `.hidden` and `display === "none"` happened to
// hold vacuously (nothing ever matched the real component's actual
// visibility mechanism). This fixture mirrors the real markup, so these
// checks assert the real mechanism instead.
check("loading hides batch and load-more controls despite their production display rules",
  !$id("vocab-batch-toolbar").classList.contains("selecting") && $id("vocab-load-more").hidden &&
  getComputedStyle($id("vocab-batch-toolbar")).visibility === "hidden" &&
  getComputedStyle($id("vocab-load-more")).display === "none");

_pbpVocabSetLoading(false);
_vocabRows = [];
_pbpVocabApplyView(true);
check("zero rows shows only the empty state and leaves paging and batching hidden",
  !$id("vocab-empty").hidden && $id("vocab-no-results").hidden &&
  $id("vocab-load-more").hidden && !$id("vocab-batch-toolbar").classList.contains("selecting") &&
  getComputedStyle($id("vocab-load-more")).display === "none" &&
  $id("vocab-list").getAttribute("aria-busy") === "false" && !$id("vocab-status").textContent);

_vocabRows = sample.slice(0, 1);
_pbpVocabApplyView(true);
check("one row renders one reachable card without empty, no-result, paging or batch UI",
  $id("vocab-list").querySelectorAll(".vocab-card").length === 1 &&
  $id("vocab-empty").hidden && $id("vocab-no-results").hidden &&
  $id("vocab-load-more").hidden && !$id("vocab-batch-toolbar").classList.contains("selecting"));

_vocabRows = Array.from({length:100}, (_, i) => ({id:"hundred"+i,term:"word"+i,updatedAt:i,groups:[],contexts:[]}));
_pbpVocabApplyView(true);
check("exactly 100 rows fills one render batch without exposing Load more",
  $id("vocab-list").querySelectorAll(".vocab-card").length === 100 &&
  $id("vocab-load-more").hidden && getComputedStyle($id("vocab-load-more")).display === "none");

// Stats strip: total/learning/known counts, chip status-filter linkage, and
// hide-on-clear (Task 1: vocabulary stats strip).
const statsSample = [
  { id:"stat-a", term:"alpha", status:"new",   groups:["G1"], contexts:[], updatedAt:1 },
  { id:"stat-b", term:"beta",  status:"known", groups:["G1"], contexts:[], updatedAt:2 },
  { id:"stat-c", term:"gamma", status:"known", groups:[],     contexts:[], updatedAt:3 },
];
_vocabRows = statsSample;
_pbpVocabApplyView(true);
check("stats strip becomes visible once rows exist", $id("vocab-stats").hidden === false);
check("stats strip reports total, learning and known counts",
  $id("vocab-stat-total").textContent === "libraryStatsWords:3" &&
  $id("vocab-stat-learning").textContent === "libraryStatsLearning:1" &&
  $id("vocab-stat-known").textContent === "libraryStatsKnown:2");
$id("vocab-stat-learning").click();
check("learning chip click sets the status filter and re-filters the visible list",
  $id("vocab-status-filter").value === "new" &&
  $id("vocab-list").querySelectorAll(".vocab-card").length === 1 &&
  $id("vocab-stat-learning").getAttribute("aria-pressed") === "true");
$id("vocab-stat-learning").click();
check("a second click on the active chip clears the filter back to all statuses",
  $id("vocab-status-filter").value === "" &&
  $id("vocab-list").querySelectorAll(".vocab-card").length === 3 &&
  $id("vocab-stat-learning").getAttribute("aria-pressed") === "false");
_pbpVocabClearVisibleState();
check("account-switch clearing hides the stats strip with the rest of the list", $id("vocab-stats").hidden === true);

// Free dictionary lookup (Task 3): pure fold-match for the "already saved"
// hint, then the full submit -> result-view -> hint-click round trip.
// _pbpVocabDictRun is a plain top-level function declaration -- freely
// reassignable to a recorder so no real online/local dictionary chain runs.
check("free-lookup fold matches a stored term case-insensitively",
  pbpVocabSearchText("Hello") === pbpVocabSearchText("hello"));
check("free-lookup fold does not match an unrelated term",
  pbpVocabSearchText("Hello") !== pbpVocabSearchText("World"));
check("lookup bar wiring populates the language select with no Auto leg",
  !!$id("vocab-lookup-lang").querySelector('option[value="en"]') &&
  !$id("vocab-lookup-lang").querySelector('option[value="auto"]'));

{
  const lookupSample = [
    { id: "lk-hello", term: "Hello", status: "new", groups: [], contexts: [], updatedAt: 1 },
    { id: "lk-other", term: "Other", status: "new", groups: [], contexts: [], updatedAt: 2 },
  ];
  _vocabRows = lookupSample;
  _pbpVocabApplyView(true);

  const realDictRun = _pbpVocabDictRun;
  const runCalls = [];
  _pbpVocabDictRun = (term, lang, els, sentence, rerun) => { runCalls.push({ term, lang, rerun }); };
  try {
    // MANDATORY AMENDMENT coverage: cold start, i.e. _pbpVocabDictCtrl has
    // never been touched by a word-detail relookup -- forced explicitly so
    // this assertion never silently depends on earlier test ordering in
    // this file. Without the amendment's ctrl-reset, _pbpVocabDictRun's
    // `_pbpVocabDictCtrl.signal.aborted` read throws on a null ctrl.
    _pbpVocabDictCtrl = null;
    $id("vocab-lookup-input").value = "hello";
    let threw = false;
    try { _pbpVocabFreeLookup(); } catch (_) { threw = true; }
    check("cold-start free lookup (no word ever opened first) does not throw",
      !threw && _pbpVocabDictCtrl !== null);
    check("free lookup renders the result view and forwards the submitted term/lang",
      !$id("vocab-detail").hidden && $id("vocab-detail-empty").hidden &&
      runCalls.length === 1 && runCalls[0].term === "hello" && runCalls[0].lang === "en");
    check("free lookup shows the already-saved hint for a case-folded match",
      !!$id("vocab-detail").querySelector(".vocab-lookup-saved"));
    check("free lookup drops the word-detail linkage and clears aria-current",
      _pbpVocabDetailWordId === null &&
      $id("vocab-list").querySelectorAll(".vocab-card[aria-current]").length === 0);

    runCalls.length = 0;
    $id("vocab-lookup-input").value = "   ";
    _pbpVocabFreeLookup();
    check("blank/whitespace-only submit is a no-op", runCalls.length === 0);

    $id("vocab-detail").querySelector(".vocab-lookup-saved").click();
    const savedCard = $id("vocab-list").querySelector('.vocab-card[data-vocab-id="lk-hello"]');
    check("clicking the saved-word hint hands the detail pane back to that word",
      _pbpVocabDetailWordId === "lk-hello" && !!savedCard && savedCard.getAttribute("aria-current") === "true");

    // Important 4 (fix round 1): the hint can outlive a mutation reload that
    // happens while the lookup result stays on screen -- clicking it after
    // the underlying word vanished elsewhere (deleted/edited from another
    // path) must not render a ghost detail from the stale captured snapshot.
    runCalls.length = 0;
    $id("vocab-lookup-input").value = "hello";
    _pbpVocabFreeLookup();
    const staleHint = $id("vocab-detail").querySelector(".vocab-lookup-saved");
    _vocabRows = lookupSample.filter((r) => r.id !== "lk-hello"); // simulate a delete elsewhere
    let staleThrew = false;
    try { staleHint.click(); } catch (_) { staleThrew = true; }
    check("clicking a saved-word hint after the word vanished elsewhere is a safe no-op",
      !staleThrew && _pbpVocabDetailWordId === null &&
      $id("vocab-list").querySelectorAll(".vocab-card[aria-current]").length === 0);
    _vocabRows = lookupSample; // restore for the remaining checks below

    $id("vocab-lookup-input").value = "nonexistent-term";
    _pbpVocabFreeLookup();
    check("free lookup with no stored match shows no saved-word hint",
      !$id("vocab-detail").querySelector(".vocab-lookup-saved"));

    // Phase C (7): md-dict's rerun callback fires long after submit (retry
    // link, cache miss). Reading the <select> then would answer a different
    // question than the result heading names -- the language belongs to the
    // submitted query, not to whatever the dropdown says later.
    runCalls.length = 0;
    $id("vocab-lookup-lang").value = "en";
    $id("vocab-lookup-input").value = "drift";
    _pbpVocabFreeLookup();
    const submittedRerun = runCalls[0] && runCalls[0].rerun;

    check("stale confirmation reports the changed selection and focuses visible search", $id("vocab-status").textContent.includes("vocabSelectionChanged") && document.activeElement === $id("vocab-search") && !$id("vocab-search").closest("[hidden]"));

    await prepareSelection();
    deleteCalls = 0;
    pbpVocabBatchDelete = async () => { deleteCalls++; return true; };
    _pbpVocabReloadAfterMutation = async () => false;
    _pbpVocabBatchDeleteSelected();
    document.querySelector(".confirm-yes").click();
    await task(); await task();
    check("refresh failure does not retry a successful delete mutation", deleteCalls === 1);
    check("refresh failure reports saved data instead of claiming no changes", $id("vocab-status").textContent.includes("vocabRefreshFailed") && !$id("vocab-status").textContent.includes("vocabBatchFailed"));
    check("successful mutation with refresh failure moves focus to visible search", document.activeElement === $id("vocab-search") && !$id("vocab-search").closest("[hidden]"));

    await prepareSelection();
    pbpVocabBatchDelete = async () => true;
    _pbpVocabReloadAfterMutation = async () => true;
    _pbpVocabBatchDeleteSelected();
    document.querySelector(".confirm-yes").click();
    await task(); await task();
    check("successful batch delete moves focus to visible search", document.activeElement === $id("vocab-search") && !$id("vocab-search").closest("[hidden]"));

    await prepareSelection();
    $id("vocab-group-input").value = "Study";
    _pbpVocabSyncSelectionUi();
    pbpVocabBatchAddGroup = async () => true;
    _pbpVocabReloadAfterMutation = async () => true;
    $id("vocab-add-group").focus();
    await _pbpVocabApplyGroupChange(true);
    check("successful batch add-group moves focus to visible search", document.activeElement === $id("vocab-search") && !$id("vocab-search").closest("[hidden]"));

    // Remove-from-group. sample carries "Numbers" on exactly one row, so the
    // gating and the reported count are distinguishable from the selection size
    // (3) -- a remove that reported ids.length would pass a weaker test.
    await prepareSelection();
    $id("vocab-group-input").value = "Study";
    _pbpVocabSyncSelectionUi();
    check("remove-from-group stays disabled when no selected word carries the group",
      $id("vocab-remove-group").disabled === true && $id("vocab-add-group").disabled === false);
    $id("vocab-group-input").value = "Numbers";
    _pbpVocabSyncSelectionUi();
    check("remove-from-group enables once a selected word carries the group",
      $id("vocab-remove-group").disabled === false);
    let removedWith = null, addCallsDuringRemove = 0;
    pbpVocabBatchRemoveGroup = async (ids, owner, group) => { removedWith = { ids: ids.slice(), group }; return true; };
    pbpVocabBatchAddGroup = async () => { addCallsDuringRemove++; return true; };
    _pbpVocabReloadAfterMutation = async () => true;
    await _pbpVocabApplyGroupChange(false);
    check("remove-from-group routes to the remove primitive with the whole selection",
      !!removedWith && removedWith.group === "Numbers" && removedWith.ids.length === 3 && addCallsDuringRemove === 0);
    check("remove-from-group reports the words that actually had the group, not the selection size",
      $id("vocab-status").textContent.trim() === "vocabBatchUngrouped:1,Numbers");
  } finally {
    pbpVocabBatchDelete = realBatchDelete;
    pbpVocabBatchAddGroup = realBatchAddGroup;
    pbpVocabBatchRemoveGroup = realBatchRemoveGroup;
    _pbpVocabReloadAfterMutation = realReload;
  }

  // Real mutation/reload orchestration: each read snapshots the mock IDB at
  // call time, matching IndexedDB getAll semantics. Holding the first read
  // reproduces the audited race where an older snapshot resolves last.
  const raceRealDelete = pbpVocabDelete;
  const raceRealBatchDelete = pbpVocabBatchDelete;
  const raceRealAddGroup = pbpVocabBatchAddGroup;
  const raceRealOwner = pbpVocabCurrentOwner;
  const raceRealAll = pbpVocabAll;
  const raceOwner = "acct_race";
  const raceSeedRows = () => [
    { id:"a", owner:raceOwner, term:"alpha", groups:[], contexts:[], updatedAt:30 },
    { id:"b", owner:raceOwner, term:"beta", groups:[], contexts:[], updatedAt:20 },
    { id:"c", owner:raceOwner, term:"gamma", groups:[], contexts:[], updatedAt:10 }
  ];
  let raceStore = [];
  let raceRead = null;
  const cloneRows = (rows) => rows.map((row) => ({ ...row, groups:[...(row.groups || [])], contexts:[...(row.contexts || [])] }));
  const seedRaceUi = () => {
    raceStore = raceSeedRows();
    $id("vocab-search").value = "";
    $id("vocab-group-filter").value = "";
    $id("vocab-sort").value = "latest";
    $id("vocab-group-input").value = "";
    $id("vocab-status").textContent = "";
    _vocabRows = cloneRows(raceStore);
    _pbpVocabClearSelection();
    _pbpVocabSetLoading(false);
    _pbpVocabApplyView(true);
  };
  const armHeldFirstRead = () => {
    let release;
    let markStarted;
    const gate = new Promise((resolve) => { release = resolve; });
    const started = new Promise((resolve) => { markStarted = resolve; });
    let reads = 0;
    raceRead = async () => {
      const snapshot = cloneRows(raceStore);
      reads++;
      if (reads === 1) {
        markStarted();
        await gate;
      }
      return snapshot;
    };
    return { started, release };
  };
  const waitFor = async (predicate, label) => {
    for (let i = 0; i < 80; i++) {
      if (predicate()) return;
      await task();
    }
    throw new Error("timed out waiting for " + label);
  };
  const confirmSingleDelete = (row) => {
    const anchor = document.createElement("button");
    anchor.textContent = "delete " + row.id;
    document.body.appendChild(anchor);
    _pbpVocabDeleteRow(row, anchor);
    const yes = document.querySelector(".confirm-popover .confirm-yes");
    if (!yes) throw new Error("single delete confirmation missing");
    yes.click();
    anchor.remove();
  };
  try {
    pbpVocabCurrentOwner = async () => raceOwner;
    pbpVocabAll = async () => raceRead();
    pbpVocabDelete = async (id, owner) => {
      if (owner !== raceOwner) return false;
      raceStore = raceStore.filter((row) => row.id !== id);
      return true;
    };
    pbpVocabBatchDelete = async (ids, owner) => {
      if (owner !== raceOwner) return false;
      const doomed = new Set(ids);
      raceStore = raceStore.filter((row) => !doomed.has(row.id));
      return true;
    };
    pbpVocabBatchAddGroup = async (ids, owner, group) => {
      if (owner !== raceOwner) return false;
      const selectedIds = new Set(ids);
      raceStore = raceStore.map((row) => selectedIds.has(row.id)
        ? { ...row, groups:[...new Set([...(row.groups || []), group])] } : row);
      return true;
    };

    seedRaceUi();
    let held = armHeldFirstRead();
    confirmSingleDelete(raceStore.find((row) => row.id === "a"));
    await held.started;
    confirmSingleDelete(raceStore.find((row) => row.id === "b"));
    await waitFor(() => ids(_vocabRows) === "c", "newer single-delete reload");
    held.release();
    await task(); await task();
    check("overlapping single deletes leave the mock IDB without B", ids(raceStore) === "c");
    check("an older delayed delete snapshot cannot restore B to the UI", ids(_vocabRows) === "c");

    seedRaceUi();
    held = armHeldFirstRead();
    let deleteAttempt = 0;
    pbpVocabDelete = async (id, owner) => {
      if (owner !== raceOwner) return false;
      deleteAttempt++;
      if (deleteAttempt === 2) return false;
      raceStore = raceStore.filter((row) => row.id !== id);
      return true;
    };
    confirmSingleDelete(raceStore.find((row) => row.id === "a"));
    await held.started;
    confirmSingleDelete(raceStore.find((row) => row.id === "b"));
    await waitFor(() => ids(_vocabRows) === "b,c" && $id("vocab-status").textContent.includes("dictDeleteFailed"), "failed newer delete reconcile");
    held.release();
    await task(); await task();
    check("a later failed mutation preserves the true mock IDB state", ids(raceStore) === "b,c");
    check("a later failed mutation still reconciles the UI from the mock IDB", ids(_vocabRows) === "b,c");
    check("the latest failed mutation keeps its accurate failure status", $id("vocab-status").textContent.includes("dictDeleteFailed"));

    pbpVocabDelete = async (id, owner) => {
      if (owner !== raceOwner) return false;
      raceStore = raceStore.filter((row) => row.id !== id);
      return true;
    };
    seedRaceUi();
    held = armHeldFirstRead();
    _vocabSelected = new Set(["a"]);
    _pbpVocabSyncSelectionUi();
    _pbpVocabBatchDeleteSelected();
    document.querySelector(".confirm-popover .confirm-yes").click();
    await held.started;
    confirmSingleDelete(raceStore.find((row) => row.id === "b"));
    await waitFor(() => ids(_vocabRows) === "c", "single delete after batch delete");
    held.release();
    await waitFor(() => !_vocabBatchBusy, "older batch cleanup");
    check("batch-delete and single-delete interleave leaves the mock IDB truthful", ids(raceStore) === "c");
    check("a delayed batch snapshot cannot overwrite the later single-delete UI", ids(_vocabRows) === "c");

    seedRaceUi();
    held = armHeldFirstRead();
    _vocabSelected = new Set(["a"]);
    $id("vocab-group-input").value = "Study";
    _pbpVocabSyncSelectionUi();
    const grouping = _pbpVocabApplyGroupChange(true);
    await held.started;
    confirmSingleDelete(raceStore.find((row) => row.id === "b"));
    await waitFor(() => ids(_vocabRows) === "a,c" && (_vocabRows[0].groups || []).includes("Study"), "single delete after add-group");
    held.release();
    await grouping;
    check("add-group and single-delete interleave preserves both mock IDB mutations",
      ids(raceStore) === "a,c" && (raceStore[0].groups || []).includes("Study"));
    check("a delayed add-group snapshot cannot restore the later deleted row",
      ids(_vocabRows) === "a,c" && (_vocabRows[0].groups || []).includes("Study"));
  } finally {
    pbpVocabDelete = raceRealDelete;
    pbpVocabBatchDelete = raceRealBatchDelete;
    pbpVocabBatchAddGroup = raceRealAddGroup;
    pbpVocabCurrentOwner = raceRealOwner;
    pbpVocabAll = raceRealAll;
  }

  // ---- Phase C: detail pane / list state across reloads --------------
  // One shared mock store for the whole block; `settle` drains the
  // fire-and-forget mutation chains (click handlers are not awaitable) without
  // waitFor's throw-on-timeout, which would abort the remaining suite.
  const settle = async () => { for (let i = 0; i < 25; i++) await task(); };
  {
    const cRealOwner = pbpVocabCurrentOwner;
    const cRealAll = pbpVocabAll;
    const cRealStatus = pbpVocabBatchSetStatus;
    const cRealDelete = pbpVocabDelete;
    const cOwner = "acct_detail";
    let cStore = [
      { id:"d1", owner:cOwner, term:"alpha", groups:[], contexts:[], note:"", status:"new", updatedAt:30 },
      { id:"d2", owner:cOwner, term:"beta",  groups:[], contexts:[], note:"", status:"new", updatedAt:20 },
      { id:"d3", owner:cOwner, term:"gamma", groups:[], contexts:[], note:"", status:"new", updatedAt:10 },
    ];
    const cClone = () => cStore.map((row) => ({ ...row, groups:[...row.groups], contexts:[...row.contexts] }));
    const detailEl = () => $id("vocab-detail");
    try {
      $id("vocab-search").value = "";
      $id("vocab-group-filter").value = "";
      $id("vocab-status-filter").value = "";
      $id("vocab-sort").value = "latest";
      pbpVocabCurrentOwner = async () => cOwner;
      pbpVocabAll = async () => cClone();
      pbpVocabBatchSetStatus = async (rowIds, owner, status) => {
        if (owner !== cOwner) return false;
        const wanted = new Set(rowIds);
        cStore = cStore.map((row) => wanted.has(row.id) ? { ...row, status } : row);
        return true;
      };
      pbpVocabDelete = async (id, owner) => {
        if (owner !== cOwner) return false;
        cStore = cStore.filter((row) => row.id !== id);
        return true;
      };

      await renderVocabPanel();
      $id("vocab-list").querySelector('.vocab-card[data-vocab-id="d1"] .notes-card-head').click();
      check("a rendered row activates into the detail pane",
        _pbpVocabDetailWordId === "d1" && !detailEl().hidden);

      // Variant C + save v2b: the pane ends in ONE closing row -- re-lookup,
      // then the destructive action, then Save at the far right -- and the
      // note editor keeps only the field. Asserted on the built DOM, not just
      // on the stylesheet, because the placement is decided in the assembly.
      {
        const footer = detailEl().querySelector(".vocab-detail-footer");
        const order = footer ? [...footer.children].map((el) => el.className.split(" ").pop()) : [];
        check("the detail pane ends in one closing row: re-lookup, delete, save",
          !!footer &&
          order.join(",") === "vocab-detail-relookup,vocab-detail-delete,vocab-note-save" &&
          detailEl().lastElementChild === footer,
          order.join(","));
        check("the note editor keeps only its field once Save moved out",
          detailEl().querySelectorAll(".vocab-note-edit > *").length === 1 &&
          !!detailEl().querySelector(".vocab-note-edit > .vocab-note-input"));
        // The zero-shift contract: hidden Save still occupies its slot, so
        // the first keystroke cannot move the buttons beside it.
        const save = footer.querySelector(".vocab-note-save");
        check("a hidden Save still holds its place in the row",
          save.hidden === true && save.getBoundingClientRect().width > 0);
      }

      // (1) + (4): a mutation rebuilds the whole pane and clears the
      // selection. Half-typed text is the user's, not the store's, and a
      // single-word detail edit is not a batch action over the list.
      const noteInput = detailEl().querySelector(".vocab-note-input");
      noteInput.value = "half-typed";
      noteInput.dispatchEvent(new Event("input", { bubbles:true }));
      detailEl().querySelector(".vocab-group-unit input").value = "Draft group";
      _vocabSelected = new Set(["d1", "d2", "d3"]);
      _pbpVocabSyncSelectionUi();
      detailEl().querySelector(".vocab-detail-actions .btn").click();
      await settle();
      check("a detail mutation reaches the store", (cStore.find((row) => row.id === "d1") || {}).status === "known");
      check("a detail mutation keeps unsaved note text and its save button",
        detailEl().querySelector(".vocab-note-input").value === "half-typed" &&
        detailEl().querySelector(".vocab-note-save").hidden === false,
        JSON.stringify(detailEl().querySelector(".vocab-note-input").value));
      check("a detail mutation keeps the typed group name",
        detailEl().querySelector(".vocab-group-unit input").value === "Draft group");
      check("a detail mutation keeps the list selection it never touched",
        _vocabSelected.size === 3 &&
        $id("vocab-list").querySelectorAll('.vocab-card.selected[aria-selected="true"]').length === 3);
      check("a detail mutation still re-marks the shown row as current",
        $id("vocab-list").querySelector('.vocab-card[data-vocab-id="d1"]').getAttribute("aria-current") === "true");

      // (3): the word vanished elsewhere; re-entering the view must not keep
      // showing it (at <860px that pane is the whole screen).
      cStore = cStore.filter((row) => row.id !== "d1");
      await renderVocabPanel();
      check("re-entering the view drops a detail word the fresh list no longer has",
        _pbpVocabDetailWordId === null && detailEl().hidden === true &&
        $id("vocab-detail-empty").hidden === false);

      // (H2): same reset when the account moves between the read and its
      // ownership check, which restarts the render.
      await renderVocabPanel();
      $id("vocab-list").querySelector('.vocab-card[data-vocab-id="d2"] .notes-card-head').click();
      let ownerReads = 0;
      pbpVocabCurrentOwner = async () => (++ownerReads === 2 ? "acct_other" : cOwner);
      await renderVocabPanel();
      await settle();
      pbpVocabCurrentOwner = async () => cOwner;
      check("an account change mid-read resets the detail pane before the re-read",
        _pbpVocabDetailWordId === null && detailEl().hidden === true);

      // (8): a mutation is not a reason to throw away the pages the user
      // loaded with "Load more".
      cStore = Array.from({ length: 250 }, (_, i) => ({
        id:"deep" + i, owner:cOwner, term:"deep" + i, groups:[], contexts:[], updatedAt:250 - i }));
      await renderVocabPanel();
      $id("vocab-load-more").click();
      check("load more deepens the rendered list", $id("vocab-list").children.length === 200);
      await _pbpVocabReloadAfterMutation(cOwner, ++_vocabRenderGen);
      check("a mutation reload keeps the loaded render depth",
        $id("vocab-list").children.length === 200, String($id("vocab-list").children.length));

      // (5): the confirm popover restores focus to the delete button, which
      // the reload then removes -- focus fell to <body>.
      cStore = [{ id:"f1", owner:cOwner, term:"focus", groups:[], contexts:[], updatedAt:1 }];
      await renderVocabPanel();
      const rowDelete = $id("vocab-list").querySelector('.vocab-card[data-vocab-id="f1"] .notes-row-del');
      rowDelete.focus();
      rowDelete.click();
      document.querySelector(".confirm-popover .confirm-yes").click();
      await settle();
      check("a confirmed single delete lands focus on the visible search field",
        document.activeElement === $id("vocab-search") && !$id("vocab-search").closest("[hidden]"),
        document.activeElement && document.activeElement.id);
    } finally {
      pbpVocabCurrentOwner = cRealOwner;
      pbpVocabAll = cRealAll;
      pbpVocabBatchSetStatus = cRealStatus;
      pbpVocabDelete = cRealDelete;
      _pbpVocabRenderDetail(null);
    }
  }

  // ---- Phase C (2): a soft-reload read failure is not an empty vocabulary.
  {
    const sRealOwner = pbpVocabCurrentOwner;
    const sRealAll = pbpVocabAll;
    const sRealViewShown = _vocabViewShown;
    const sRealCurrentOwner = _vocabCurrentOwner;
    try {
      pbpVocabCurrentOwner = async () => "acct_soft";
      pbpVocabAll = async () => { throw new Error("idb read failed"); };
      $id("vocab-search").value = "";
      $id("vocab-group-filter").value = "";
      $id("vocab-status-filter").value = "";
      _vocabRows = sample;
      _vocabOwnerLabel = "acct_soft";
      _pbpVocabSetLoading(false);
      _pbpVocabApplyView(true);
      _vocabCurrentOwner = "acct_soft"; // same account: this is a freshness re-fire
      _vocabViewShown = true;
      $id("vocab-status").textContent = "";

      document.dispatchEvent(new CustomEvent("pbp-lib-view", { detail: { view: "vocab" } }));
      await settle();
      check("a soft-reload read failure reports the failure and never claims an empty vocabulary",
        rowsBefore > 0 && $id("vocab-list").children.length === 0 &&
        $id("vocab-status").classList.contains("bad") &&
        $id("vocab-status").textContent.includes("vocabLoadFailed") &&
        $id("vocab-empty").hidden === true &&
        $id("vocab-list").getAttribute("aria-busy") === "false",
        "rowsBefore=" + rowsBefore + " empty.hidden=" + $id("vocab-empty").hidden +
        " status=" + JSON.stringify($id("vocab-status").textContent));
    } finally {
      pbpVocabCurrentOwner = sRealOwner;
      pbpVocabAll = sRealAll;
      _vocabViewShown = sRealViewShown;
      _vocabCurrentOwner = sRealCurrentOwner;
    }
  }

  // ---- Search highlight boundaries (#25). Positions are computed on the
  // case-folded copy and used to slice the ORIGINAL, which only holds while
  // the fold preserves length -- and toLowerCase does not (U+0130 folds to
  // two code units). Asserted as a category ("no mark ever carries text the
  // needle does not match", "the quote still reads in full") rather than as
  // the one İ instance, so any future length-changing fold has to satisfy it
  // too. -----------------------------------------------------------------
  {
    const marksOf = (quote, term) => {
      const host = document.createElement("div");
      _pbpVocabHighlightTerm(host, quote, term);
      return { host, marks: [...host.querySelectorAll("mark")].map((m) => m.textContent) };
    };
    const turkish = marksOf("İstanbul is big. İstanbul again.", "İstanbul");
    check("a highlight never marks text the term does not match",
      turkish.marks.every((text) => text.toLowerCase() === "İstanbul".toLowerCase()),
      JSON.stringify(turkish.marks));
    check("a quote whose fold changes length still reads in full",
      turkish.host.textContent === "İstanbul is big. İstanbul again.",
      JSON.stringify(turkish.host.textContent));
    const shifted = marksOf("Visit İstanbul and see museums", "museums");
    check("a length-changing character earlier in the quote does not shift later marks",
      shifted.marks.every((text) => text === "museums") &&
      shifted.host.textContent === "Visit İstanbul and see museums",
      JSON.stringify(shifted.marks));
    const plain = marksOf("the cat sat on the cat", "CAT");
    check("length-preserving quotes still mark every case-insensitive match",
      plain.marks.length === 2 && plain.marks.every((text) => text === "cat"));
  }

  // ---- Narrow-mode feedback (#87). Below 860px with a word open the whole
  // list pane is display:none, and #vocab-status is markup inside it -- so
  // every single-word action's success AND failure landed in a subtree that
  // is invisible and, being unrendered, silent to a screen reader too. -----
  {
    const realNarrow = _pbpVocabNarrowMode;
    const realDictRun = _pbpVocabDictRun;
    try {
      _pbpVocabDictRun = () => {};
      const word = { id: "st1", term: "statusword", groups: [], contexts: [], note: "" };
      _vocabRows = [word];
      _pbpVocabNarrowMode = () => true;
      _pbpVocabRenderDetail(word, true);
      const footer = $id("vocab-detail").querySelector(".vocab-detail-footer");
      check("narrow mode moves the status live region into the open detail's closing row",
        !!footer && $id("vocab-status").parentNode === footer,
        $id("vocab-status").parentNode && $id("vocab-status").parentNode.className);
      _pbpVocabFlashStatus(true, "saved in the narrow pane");
      check("a detail action's feedback is on screen instead of inside the hidden list pane",
        $id("vocab-status").textContent.includes("saved in the narrow pane") &&
        !$id("vocab-status").closest(".vocab-list-pane"));
      check("the relocated region is still the same live region",
        $id("vocab-status").getAttribute("role") === "status" &&
        $id("vocab-status").getAttribute("aria-live") === "polite");
      // The result view replaces the detail host wholesale: a live region
      // wiped out with the subtree it sits in is silent for good.
      $id("vocab-lookup-input").value = "rescue";
      _pbpVocabFreeLookup();
      check("a rebuild of the detail host never orphans the status region",
        $id("vocab-status").isConnected &&
        $id("vocab-status").parentNode === $id("vocab-context-bar"));
      _pbpVocabNarrowMode = () => false;
      _pbpVocabRenderDetail(word);
      check("the two-pane layout keeps the status region in the list's count row",
        $id("vocab-status").parentNode === $id("vocab-context-bar"));
    } finally {
      _pbpVocabNarrowMode = realNarrow;
      _pbpVocabDictRun = realDictRun;
      _pbpVocabRenderDetail(null);
      $id("vocab-lookup-input").value = "";
    }
  }

  // ---- Detail-pane focus handoff (#68). The mutation rebuilds the pane and
  // destroys the control that was clicked; every list-side mutation in this
  // file restores focus, the detail pane's four did not. ------------------
  {
    const word = { id: "fk1", term: "focuscarry", groups: ["G1"], contexts: [], note: "" };
    _vocabRows = [word];
    _pbpVocabRenderDetail(word);
    const detail = $id("vocab-detail");
    detail.querySelector(".vocab-group-unit input").focus();
    _pbpVocabReconcileDetail();
    check("a rebuild hands focus to the rebuilt counterpart of the control that had it",
      document.activeElement === detail.querySelector(".vocab-group-unit input"),
      document.activeElement && (document.activeElement.className || document.activeElement.tagName));
    detail.querySelector(".vocab-detail-actions .btn").focus();
    _pbpVocabReconcileDetail();
    check("the status toggle keeps focus on its own rebuilt slot",
      document.activeElement === detail.querySelector(".vocab-detail-actions .btn"),
      document.activeElement && (document.activeElement.className || document.activeElement.tagName));
    detail.querySelector(".vocab-detail-group-chips .chip-remove").focus();
    _vocabRows = [{ ...word, groups: [] }];
    _pbpVocabReconcileDetail();
    check("a removed group chip falls back to the input on its own row",
      document.activeElement === detail.querySelector(".vocab-group-unit input"),
      document.activeElement && (document.activeElement.className || document.activeElement.tagName));
    // These paths await an owner read and a full IDB re-read; the user may
    // have clicked away and started typing meanwhile.
    _vocabRows = [word];
    $id("vocab-search").focus();
    _pbpVocabReconcileDetail();
    check("a rebuild never takes focus the user moved out of the pane",
      document.activeElement === $id("vocab-search"));
    _pbpVocabRenderDetail(null);
  }

  // ---- D4: context source links carry a decorative external-link icon ----
  {
    const wordWithLink = { id: "extlk1", term: "extlk", groups: [], contexts: [
      { quote: "linked context", articleTitle: "Linked source", articleUrl: "https://example.com/a" },
      { quote: "unlinked context", articleTitle: "No url source" },
    ], note: "" };
    _vocabRows = [wordWithLink];
    _pbpVocabRenderDetail(wordWithLink);
    const detail = $id("vocab-detail");
    const openLink = detail.querySelector("a.notes-row-open");
    check("a context with a safe article url gets exactly one decorative external-link icon",
      openLink && openLink.querySelectorAll(".ext-icon").length === 1 &&
      openLink.querySelector(".ext-icon").getAttribute("aria-hidden") === "true",
      openLink && openLink.outerHTML);
    check("a context without an article url renders no link and no icon",
      detail.querySelectorAll(".vocab-detail-context").length === 2 &&
      detail.querySelectorAll(".vocab-detail-context a.notes-row-open").length === 1,
      detail.innerHTML.slice(0, 300));
    _pbpVocabRenderDetail(null);
  }

  // ---- switching entries resets the reading pane's scroll ----------------
  // The scroll container is #vocab-detail-pane, not the #vocab-detail div the
  // render replaces: replaceChildren is one atomic mutation, so the pane keeps
  // whatever scrollTop the previous entry was left at and the next one opens
  // with its own term heading above the fold. Both exits that replace the
  // host are covered -- the word detail and the free-lookup result render
  // into the same pane. `scrolled > 0` is the anti-vacuity guard: if the
  // stand-in rule above ever stops making the pane scrollable these fail
  // instead of passing on a constant 0.
  {
    document.body.classList.add("test-scroll-pane");
    const first = { id: "sc1", term: "scrollone", groups: [], contexts: [], note: "" };
    const second = { id: "sc2", term: "scrolltwo", groups: [], contexts: [], note: "" };
    _vocabRows = [first, second];
    _pbpVocabRenderDetail(first);
    const pane = $id("vocab-detail-pane");
    pane.scrollTop = 40;
    const scrolled = pane.scrollTop;
    _pbpVocabRenderDetail(second);
    check("opening another word returns the reading pane to the top",
      scrolled > 0 && pane.scrollTop === 0,
      "scrolled=" + scrolled + " after=" + pane.scrollTop);
    // A REFRESH render of the SAME word must not: _pbpVocabSoftReload (tab
    // re-entry) and _pbpVocabReconcileDetail (after a mutation) both land
    // here with the entry unchanged, and their entire reason for existing is
    // to leave the reader where they were -- the same render carries the
    // rendered dictionary nodes across and refocuses with preventScroll.
    pane.scrollTop = 40;
    const scrolledSame = pane.scrollTop;
    _pbpVocabRenderDetail(second);
    check("a refresh render of the same word keeps the reading position",
      scrolledSame > 0 && pane.scrollTop === scrolledSame,
      "scrolled=" + scrolledSame + " after=" + pane.scrollTop);
    pane.scrollTop = 40;
    const scrolledLookup = pane.scrollTop;
    $id("vocab-lookup-input").value = "scrollthree";
    _pbpVocabFreeLookup();
    check("a free-lookup result returns the reading pane to the top",
      scrolledLookup > 0 && pane.scrollTop === 0,
      "scrolled=" + scrolledLookup + " after=" + pane.scrollTop);
    $id("vocab-lookup-input").value = "";
    _pbpVocabRenderDetail(null);
    document.body.classList.remove("test-scroll-pane");
  }

  // ---- Row grid navigation (#116) and the last Load more (#88). ---------
  {
    $id("vocab-search").value = "";
    $id("vocab-group-filter").value = "";
    $id("vocab-status-filter").value = "";
    $id("vocab-sort").value = "latest";
    _vocabRows = Array.from({ length: 150 }, (_, i) => ({
      id: "grid" + i, term: "grid" + i, groups: [], contexts: [], updatedAt: 150 - i }));
    _pbpVocabClearSelection();
    _pbpVocabApplyView(true);
    const list = $id("vocab-list");
    const stops = () => [...list.querySelectorAll(".notes-card-head")].filter((el) => el.tabIndex === 0);
    check("a rendered batch is one tab stop, not one per row",
      list.querySelectorAll(".notes-card-head").length === 100 && stops().length === 1 &&
      stops()[0] === list.children[0].querySelector(".notes-card-head"),
      String(stops().length));
    check("the row's delete button leaves the tab order with it",
      [...list.querySelectorAll(".row-del-x")].every((el) => el.tabIndex === -1));
    const heads = [...list.querySelectorAll(".notes-card-head")];
    heads[0].focus();
    const press = (key, extra) => document.activeElement.dispatchEvent(
      new KeyboardEvent("keydown", Object.assign({ key, bubbles: true, cancelable: true }, extra || {})));
    press("ArrowDown");
    check("ArrowDown moves to the next row", document.activeElement === heads[1]);
    check("the single tab stop follows the focused row",
      heads[1].tabIndex === 0 && stops().length === 1);
    press("ArrowRight");
    check("ArrowRight reaches the row's own delete button",
      document.activeElement === list.children[1].querySelector(".row-del-x"));
    check("moving inside a row leaves the tab stop on that row",
      heads[1].tabIndex === 0 && stops().length === 1);
    press("ArrowLeft");
    check("ArrowLeft returns to the row head", document.activeElement === heads[1]);
    press("End");
    check("End jumps to the last rendered row", document.activeElement === heads[99]);
    press("ArrowDown");
    check("ArrowDown at the last row stays put rather than wrapping",
      document.activeElement === heads[99]);
    press("Home");
    check("Home jumps back to the first row", document.activeElement === heads[0]);
    check("navigation keys are swallowed so the page does not scroll under them",
      press("ArrowDown") === false && press("ArrowUp") === false);
    // Navigation must not have eaten the selection chords the row owns.
    _pbpVocabClearSelection();
    heads[0].focus();
    press(" ", { ctrlKey: true });
    check("a modified Space still selects the row rather than navigating",
      _vocabSelected.size === 1 && document.activeElement === heads[0]);
    // K89: "/" jumps from a focused row back to the search box, the same
    // gesture md-reader.js's "/" already offers inside the article.
    _pbpVocabClearSelection();
    _pbpVocabSyncSelectionUi();
    heads[0].focus();
    $id("vocab-search").value = "seed";
    const slash = press("/");
    check("\"/\" focuses and selects the search box from a row",
      document.activeElement === $id("vocab-search") &&
      $id("vocab-search").selectionStart === 0 &&
      $id("vocab-search").selectionEnd === "seed".length &&
      slash === false);
    heads[1].focus();
    $id("vocab-search").value = "";
    const shiftSlash = press("/", { shiftKey: true });
    check("Shift+\"/\" (German/French layouts) still reaches the search box",
      document.activeElement === $id("vocab-search") && shiftSlash === false);
    heads[0].focus();
    const ctrlSlash = press("/", { ctrlKey: true });
    check("Ctrl+\"/\" is left alone and does not steal focus off the row",
      document.activeElement === heads[0] && ctrlSlash === true);
    // focus() on a hidden/inert/disabled field is a SILENT no-op, so select()
    // has to be conditional on it landing -- otherwise the box the caret never
    // reached reports a selection, and the next keystroke goes to the row.
    // library-notes.js's twin branch already gates on _pbpNotesFocus's return.
    heads[0].focus();
    $id("vocab-search").value = "seed";
    $id("vocab-search").setSelectionRange(0, 0);
    $id("vocab-search").hidden = true;
    try {
      press("/");
      check("\"/\" with an unfocusable search box neither moves focus nor selects its text",
        document.activeElement === heads[0] && $id("vocab-search").selectionEnd === 0,
        (document.activeElement && (document.activeElement.className || document.activeElement.id)) +
        " sel=" + $id("vocab-search").selectionEnd);
    } finally {
      $id("vocab-search").hidden = false;
    }
    $id("vocab-search").value = "";
    _pbpVocabClearSelection();
    _pbpVocabSyncSelectionUi();

    const more = $id("vocab-load-more");
    check("a 150-row view still offers Load more", !more.hidden);
    more.focus();
    more.click();
    check("the last Load more hides the control that was activated", more.hidden === true);
    check("focus follows the last Load more onto the first row it appended",
      document.activeElement === list.children[100].querySelector(".notes-card-head"),
      document.activeElement && (document.activeElement.className || document.activeElement.id));
    check("the row that takes that focus becomes the list's only tab stop",
      document.activeElement.tabIndex === 0 && stops().length === 1);
  }

  // ---- Note commit chord (#92). The field and its Save are deliberately far
  // apart (v2b), so the only keyboard route ran Tab past the danger Delete.
  {
    const rRealOwner = pbpVocabCurrentOwner;
    const rRealAll = pbpVocabAll;
    const rRealSetNote = pbpVocabSetNote;
    try {
      const word = { id: "ce1", owner: "acct_chord", term: "chord", groups: [], contexts: [], note: "old", updatedAt: 1 };
      const saved = [];
      pbpVocabCurrentOwner = async () => "acct_chord";
      pbpVocabAll = async () => [{ ...word }];
      pbpVocabSetNote = async (id, owner, value) => { saved.push(value); return true; };
      _vocabRows = [word];
      _pbpVocabApplyView(true);
      _pbpVocabRenderDetail(word);
      const field = () => $id("vocab-detail").querySelector(".vocab-note-input");
      const saveBtn = () => $id("vocab-detail").querySelector(".vocab-note-save");
      const type = (text) => {
        field().value = text;
        field().dispatchEvent(new Event("input", { bubbles: true }));
      };
      const chord = (extra) => field().dispatchEvent(new KeyboardEvent("keydown",
        Object.assign({ key: "Enter", ctrlKey: true, bubbles: true, cancelable: true }, extra || {})));
      check("the note field announces its commit chord",
        field().getAttribute("aria-keyshortcuts") === "Control+Enter");
      const clean = chord();
      await settle();
      check("the chord is inert on a clean field and lets the key through",
        saved.length === 0 && clean === true && saveBtn().hidden === true);
      type("typed by keyboard");
      const dirty = chord();
      await settle();
      check("Ctrl+Enter commits a dirty note without tabbing past Delete",
        saved.length === 1 && saved[0] === "typed by keyboard" && dirty === false,
        JSON.stringify(saved));
      type("second edit");
      chord({ ctrlKey: false, metaKey: true });
      await settle();
      check("Cmd+Enter is the same chord", saved.length === 2 && saved[1] === "second edit",
        JSON.stringify(saved));
      type("ime candidate");
      chord({ isComposing: true });
      await settle();
      check("an IME confirmation Enter never commits the text under it",
        saved.length === 2, JSON.stringify(saved));
      let release = null;
      pbpVocabSetNote = (id, owner, value) => new Promise((resolve) => {
        saved.push(value);
        release = () => resolve(true);
      });
      type("slow save");
      chord();
      await settle();
      check("the chord's save is in flight and holding the button",
        saved.length === 3 && saveBtn().disabled === true, JSON.stringify(saved));
      chord();
      await settle();
      check("a held chord cannot queue a second save over a running one",
        saved.length === 3, JSON.stringify(saved));
      if (release) release();
      await settle();
    } finally {
      pbpVocabCurrentOwner = rRealOwner;
      pbpVocabAll = rRealAll;
      pbpVocabSetNote = rRealSetNote;
      _pbpVocabRenderDetail(null);
    }
  }

  // Responsive layout sweep against the REAL vocab-workbench markup and
  // library.css (not options.css) -- the sticky bar and two-pane skeleton
  // are the risky surface, unlike the settings-page accordions that used to
  // share this test with them. 320/360 sit below the 860px single-pane
  // fallback threshold (library.css:420), 1280 sits above it (two-pane).
  //
  // THE MARKUP BELOW MIRRORS library.html's CLASS LISTS AND NESTING, and that
  // is load-bearing rather than tidiness (independent review F1/F3,
  // 2026-08-07). When the lookup row moved into the detail pane it dropped
  // `notes-toolbar` in production and lost its entire field recipe with it --
  // while this fixture kept the class, kept the row up in the list pane, and
  // therefore kept rendering a correctly-styled field. Every assertion below
  // stayed green against a layout no user could get. Same failure shape as
  // tests/vocab-gdrive-tests.html's driveFile() (CLAUDE.md, "远端 API 的测试
  // 夹具"): a fixture that encodes what the test author remembers instead of
  // what ships is a harness testing itself. When library.html's structure
  // moves, move this string in the same commit.
  const locales =["en","de","fr","pl","ru","zh_HK","zh_CN","zh_TW","ja"];
  const messages = {};
  for (const locale of locales) messages[locale] = await (await fetch(`../_locales/${locale}/messages.json`)).json();
  const frame = document.createElement("iframe");
  frame.style.cssText = "width:320px;height:800px;border:0";
  frame.srcdoc = `<!doctype html><html data-theme="github-light"><head><link rel="stylesheet" href="../library.css"></head><body>
    <div id="view-vocab"><div class="vocab-workbench">
    <div class="vocab-list-pane">
      <div class="notes-toolbar vocab-filter-toolbar"><input type="search"></div>
      <div class="vocab-filter-row">
        <select><option></option></select>
        <button type="button" class="vocab-stat-chip" data-label="stat-learning"></button>
        <button type="button" class="vocab-stat-chip" data-label="stat-known"></button>
        <span class="vocab-sort-seg" role="group">
          <button type="button" class="btn btn-sm vocab-sort-btn"><svg width="14" height="14" viewBox="0 0 24 24"></svg></button>
          <button type="button" class="btn btn-sm vocab-sort-btn"><svg width="14" height="14" viewBox="0 0 24 24"></svg></button>
        </span>
        <button type="button" class="btn btn-sm vocab-lookup-narrow"><svg width="14" height="14" viewBox="0 0 24 24"></svg></button>
      </div>
      <div class="vocab-stats">
        <span class="vocab-stat" data-label="stat-total"></span>
        <span class="vocab-stat" data-label="stat-groups"></span>
        <span class="vocab-stat" data-label="stat-languages"></span>
        <span class="vocab-stat vocab-stat-trend" data-label="stat-recent"></span>
      </div>
      <div class="vocab-context-bar"><span class="vocab-ctx-text"><span class="notes-count">5000</span></span><div class="lib-cluster"><button class="btn btn-sm" data-label="all"></button></div><span class="save-status vocab-main-status">Saved just now</span></div>
      <div class="vocab-list-region">
      <article class="notes-card vocab-card"><div class="notes-card-top"><button class="notes-card-head"><span class="notes-card-main"><span class="vocab-row-headline"><span class="notes-row-title">Wortzusammensetzung mit außergewöhnlich langem ausgewähltem Begriff</span><span class="notes-row-meta"><span class="notes-meta-chip">Außergewöhnlich lange Gruppe</span></span></span><span class="vocab-row-gloss">Außergewöhnlich lange Definition, die auf einer Zeile bleiben muss</span></span></button><button class="btn btn-sm notes-row-del" data-label="remove"></button></div></article>
      <div class="vocab-batch-bar selecting"><span class="notes-count" data-label="selected-count">5000</span><button class="btn btn-sm" data-label="invert"><svg width="14" height="14" viewBox="0 0 24 24"></svg></button><span class="vocab-group-unit"><input type="text"><button class="btn btn-sm vocab-group-step"><svg width="14" height="14" viewBox="0 0 24 24"></svg></button><button class="btn btn-sm vocab-group-step"><svg width="14" height="14" viewBox="0 0 24 24"></svg></button></span><span class="lib-cluster"><button class="btn btn-sm" data-label="known"><svg width="14" height="14" viewBox="0 0 24 24"></svg></button><button class="btn btn-sm" data-label="learning"><svg width="14" height="14" viewBox="0 0 24 24"></svg></button></span><button class="btn btn-sm danger" data-label="batch-delete"><svg width="14" height="14" viewBox="0 0 24 24"></svg></button><button class="btn btn-sm vocab-clear-selection"><svg width="14" height="14" viewBox="0 0 24 24"></svg></button></div>
      </div>
    </div>
    <aside class="vocab-detail-pane">
      <button type="button" class="btn btn-sm vocab-detail-back"><svg width="14" height="14" viewBox="0 0 24 24"></svg></button>
      <div class="vocab-filter-toolbar vocab-lookup-bar">
        <input type="search" data-label="lookup-input">
        <select data-label="lookup-lang"></select>
        <button type="button" class="btn btn-sm" data-label="lookup-go"><svg width="14" height="14" viewBox="0 0 24 24"></svg></button>
      </div>
      <div class="vocab-detail-empty">Pick a word from the list to see its details.</div>
    </aside>
    </div></div></body></html>`;
  document.body.appendChild(frame);
  await new Promise((resolve) => frame.addEventListener("load", resolve, { once:true }));
  const overflows = [], unreachable = [];
  let germanLongCountFits = false;
  for (const width of [320, 360, 1280]) {
    frame.style.width = width + "px";
    for (const theme of ["github-light", "flexoki-dark"]) {
      frame.contentDocument.documentElement.dataset.theme = theme;
      for (const locale of locales) {
        const doc = frame.contentDocument, m = messages[locale], panel = doc.getElementById("view-vocab");
        doc.documentElement.lang = locale;
        panel.querySelector('[data-label="all"]').textContent = m.vocabSelectAll.message;
        panel.querySelector('[data-label="invert"]').title = m.vocabInvertSelection.message;
        panel.querySelector('[data-label="known"]').title = m.vocabMarkKnown.message;
        panel.querySelector('[data-label="learning"]').title = m.vocabMarkLearning.message;
        panel.querySelector('[data-label="selected-count"]').textContent = m.vocabSelectedCount.message.replace("$COUNT$", "5000");
        panel.querySelector('[data-label="batch-delete"]').title = m.vocabBatchDelete.message;
        panel.querySelector('[data-label="remove"]').textContent = m.delete.message;
        panel.querySelector(".vocab-ctx-text > .notes-count").textContent = m.vocabResultCount.message
          .replace("$RESULTS$", "5000").replace("$TOTAL$", "5000");
        panel.querySelector('input[type="text"]').placeholder = m.vocabGroupNamePlaceholder.message;
        panel.querySelector("select option").textContent = m.vocabAllGroups.message;
        // Task 3 fix round 1 (Minor 7): the lookup bar and stats strip joined
        // the sweep -- real translated strings at representative lengths,
        // same discipline as every other element above (this is exactly the
        // sweep that caught the German long-compound-word row overflow).
        panel.querySelector('[data-label="lookup-input"]').placeholder = m.libraryLookupPlaceholder.message;
        panel.querySelector('[data-label="lookup-go"]').title = m.libraryLookupGo.message;
        const bcp47 = { en: "en", de: "de", fr: "fr", pl: "pl", ru: "ru", zh_HK: "zh-Hant", zh_CN: "zh-Hans", zh_TW: "zh-Hant", ja: "ja" }[locale] || "en";
        const langSelect = panel.querySelector('[data-label="lookup-lang"]');
        try {
          const names = new Intl.DisplayNames([bcp47], { type: "language" });
          langSelect.replaceChildren(...["en", "de", "fr", "es", "it", "pt", "nl", "ru", "pl", "ja", "ko", "zh"].map((code) => {
            const o = doc.createElement("option");
            o.textContent = names.of(code) || code;
            return o;
          }));
        } catch (_) {}
        panel.querySelector('[data-label="stat-total"]').textContent = m.libraryStatsWords.message.replace("$COUNT$", "5000");
        panel.querySelector('[data-label="stat-learning"]').textContent = m.libraryStatsLearning.message.replace("$COUNT$", "2500");
        panel.querySelector('[data-label="stat-known"]').textContent = m.libraryStatsKnown.message.replace("$COUNT$", "2500");
        panel.querySelector('[data-label="stat-groups"]').textContent = m.libraryStatsGroups.message.replace("$COUNT$", "42");
        panel.querySelector('[data-label="stat-languages"]').textContent = m.libraryStatsLanguages.message.replace("$COUNT$", "9");
        panel.querySelector('[data-label="stat-recent"]').textContent = m.libraryStatsRecent.message.replace("$D7$", "120").replace("$D30$", "480");
        await new Promise((resolve) => frame.contentWindow.requestAnimationFrame(resolve));
        if (width === 320 && theme === "github-light" && locale === "de") {
          const count = panel.querySelector(".vocab-ctx-text > .notes-count");
          const style = frame.contentWindow.getComputedStyle(count);
          germanLongCountFits = style.whiteSpace === "normal" && style.minWidth === "0px" &&
            count.scrollWidth <= count.clientWidth + 1;
        }
        if (panel.scrollWidth > panel.clientWidth + 1) {
          const panelRect = panel.getBoundingClientRect();
          const offenders = [...panel.querySelectorAll("*")].filter((el) => el.getBoundingClientRect().right > panelRect.right + 0.5)
            .slice(0, 3).map((el) => `${el.className || el.tagName}:${el.getBoundingClientRect().right.toFixed(1)}`);
          overflows.push(`${width}/${theme}/${locale}:${panel.scrollWidth}>${panel.clientWidth}[${offenders.join(",")}]`);
        }
        const panelRect = panel.getBoundingClientRect();
        for (const el of panel.querySelectorAll("input, select, button")) {
          const rect = el.getBoundingClientRect();
          if (rect.left < panelRect.left - 0.5 || rect.right > panelRect.right + 0.5)
            unreachable.push(`${width}/${theme}/${locale}/${el.dataset.label || el.tagName}:${rect.left.toFixed(1)}-${rect.right.toFixed(1)}`);
        }
      }
    }
  }
  check("production CSS keeps 320/360/1280 vocabulary layouts overflow-free across 9 locales and light/dark",
    overflows.length === 0, overflows.slice(0, 8).join("; "));
  check("production CSS keeps delete and every other batch control reachable across the viewport matrix",
    unreachable.length === 0, unreachable.slice(0, 8).join("; "));
  check("production CSS lets the 320px German 5000-row count wrap within its flex component",
    germanLongCountFits, "vocab count scrollWidth exceeded clientWidth");
  // Sticky-bar geometry contract: the bar floats only within its region
  // (a wrapper between it and the region would cap the float range at the
  // bar's own height), and the browse state reserves ZERO geometry -- the
  // exact regression the 2026-08 redesign exists to prevent. No motion-ready
  // class in this harness, so the class flip lands instantly.
  const batchBar = frame.contentDocument.querySelector(".vocab-batch-bar");
  check("batch bar is a direct child of the sticky region",
    batchBar.parentElement.classList.contains("vocab-list-region"));
  check("selecting batch bar is sticky with a visible face",
    frame.contentWindow.getComputedStyle(batchBar).position === "sticky" &&
    frame.contentWindow.getComputedStyle(batchBar).visibility === "visible");
  batchBar.classList.remove("selecting");
  await new Promise((resolve) => frame.contentWindow.requestAnimationFrame(resolve));
  check("browse-state batch bar reserves zero height",
    batchBar.getBoundingClientRect().height === 0);
  // The detail pane's context quote is a real <blockquote> (library-vocab.js
  // builds it that way), so the UA's `margin: 1em 40px` applies unless the rule
  // resets it -- the quote then paints 40px right of the .vocab-detail-context
  // rule that owns it and of the source link beneath it. Measured against the
  // sibling link, which is the alignment a reader actually compares.
  const detailPane = frame.contentDocument.querySelector(".vocab-detail-pane");
  const contextProbe = frame.contentDocument.createElement("div");
  contextProbe.className = "lib-block lib-quote vocab-detail-context";
  const probeQuote = frame.contentDocument.createElement("blockquote");
  probeQuote.className = "notes-item-quote";
  probeQuote.textContent = "context sentence";
  const probeLink = frame.contentDocument.createElement("a");
  probeLink.className = "notes-row-open";
  probeLink.href = "https://example.com/";
  probeLink.textContent = "Source article";
  contextProbe.append(probeQuote, probeLink);
  detailPane.appendChild(contextProbe);
  const contextRect = contextProbe.getBoundingClientRect();
  const quoteRect = probeQuote.getBoundingClientRect();
  const linkRect = probeLink.getBoundingClientRect();
  check("context quote aligns with its own rule and source link (no UA blockquote margin)",
    quoteRect.width > 0 && Math.abs(quoteRect.left - linkRect.left) <= 1 &&
    Math.abs(quoteRect.top - contextRect.top) <= 1,
    `quote.left=${quoteRect.left.toFixed(1)} link.left=${linkRect.left.toFixed(1)} ` +
    `quote.top=${quoteRect.top.toFixed(1)} context.top=${contextRect.top.toFixed(1)}`);
  frame.remove();
  document.title = fail ? "FAIL library-vocab Tests" : "PASS library-vocab Tests";
})();
</script></body></html>
