<!doctype html>
<html><head><meta charset="utf-8"><title>library-vocab Tests</title>
<link rel="stylesheet" href="../library.css">
<style>
body{font-family:monospace;padding:16px}.case{padding:5px;border-bottom:1px solid #ddd}.pass{color:#176}.fail{color:#b00}
/* Stands in for the <=860px media query's back-button rule; scoped to the one
   test that needs it (see its comment) so nothing else sees a narrow-mode
   stylesheet at this harness's 1280px viewport. */
body.test-narrow-back .vocab-detail-back{display:inline-flex}
/* Shrinks the wide layout's scroll cap on the reading pane so the fixture's
   short words actually overflow it. library.css caps the pane at roughly the
   viewport height and lets it scroll; the fixture never fills that, so without
   this the pane is a scroll container on paper only. Scoped to the one test
   that needs a real scrollTop, same convention as the rule above (and as
   library-notes-tests.html's twin). */
body.test-scroll-pane #vocab-detail-pane{max-height:60px;overflow-y:auto}
body.test-scroll-region .vocab-list-region{max-height:60px;overflow-y:auto}
</style></head>
<body>
<!-- vocab-workbench two-pane skeleton, copied from library.html (minus
     data-i18n*/aria attributes not needed by a script-driven fixture and
     minus the page chrome around it -- header/tabs/notes view). Offscreen,
     not display:none, so getComputedStyle-based checks still measure real
     layout (same convention the old options-vocab-tests.html fixture used). -->
<!-- id="view-vocab" is load-bearing, not decorative: library.css scopes the
     [hidden] display override for .vocab-load-more (and a couple of other
     rules) to "#view-vocab .vocab-load-more[hidden]" -- without this id the
     base ".vocab-load-more { display: block }" rule outranks the plain UA
     [hidden] default and the button stays visible. -->
<div id="view-vocab" style="position:fixed;left:-9999px;top:0;width:960px">
  <div class="vocab-workbench">
    <div class="vocab-list-pane" id="vocab-list-pane">
      <div id="vocab-no-account" class="notes-empty vocab-account-empty" hidden>
        <p>Sign in to keep vocabulary separate for each Pinboard account.</p>
        <a id="vocab-open-account-settings" href="../options.html#general">Open account settings</a>
        <button type="button" class="btn btn-sm vocab-signed-out-lookup" id="vocab-signed-out-lookup">Look up a word</button>
      </div>
      <div class="notes-toolbar vocab-filter-toolbar">
        <input type="search" id="vocab-search" aria-label="Search words, definitions, context, and groups" autocomplete="off" />
      </div>
      <div class="vocab-filter-row">
        <button type="button" class="btn ghost" id="vocab-filter-narrow" popovertarget="vocab-filter-set" aria-expanded="false"><span class="btn-ic" data-ic="chevronDown"></span><span>Filter</span></button>
        <div class="vocab-filter-set" id="vocab-filter-set" popover="auto">
          <select id="vocab-group-filter" data-listbox="float" aria-label="Filter by group"><option value="">All groups</option></select>
          <select id="vocab-status-filter" aria-label="Filter by status" hidden>
            <option value="">All statuses</option>
            <option value="new">Learning</option>
            <option value="known">Known</option>
          </select>
          <span class="vocab-status-toggles" id="vocab-status-toggles" role="group" aria-label="Filter by status">
            <button type="button" class="lib-toggle" id="vocab-stat-all" data-status="" aria-pressed="true" hidden>All</button>
            <button type="button" class="lib-toggle" id="vocab-stat-learning" data-status="new" aria-pressed="false" hidden></button>
            <button type="button" class="lib-toggle" id="vocab-stat-known" data-status="known" aria-pressed="false" hidden></button>
          </span>
        </div>
        <label class="sr-only" id="vocab-sort-label" for="vocab-sort">Sort vocabulary</label>
        <span class="sr-only" id="vocab-sort-face"></span>
        <select id="vocab-sort" data-listbox="float" data-listbox-face="ghost" aria-labelledby="vocab-sort-label vocab-sort-face" aria-label="Sort vocabulary" hidden>
          <option value="latest" data-face-label="Date" data-face-icon="arrowDownLine">Recently updated</option>
          <option value="oldest" data-face-label="Date" data-face-icon="arrowUpLine">Least recently updated</option>
          <option value="az" data-face-label="Alphabetical" data-face-icon="arrowUpLine">A-Z</option>
          <option value="za" data-face-label="Alphabetical" data-face-icon="arrowDownLine">Z-A</option>
        </select>
        <button type="button" class="btn btn-sm vocab-lookup-narrow" id="vocab-lookup-narrow" aria-label="Look up a word" title="Look up a word"><span class="btn-ic" data-ic="book"></span></button>
      </div>
      <div class="vocab-context-bar lib-count-row" id="vocab-context-bar">
        <span class="vocab-ctx-text">
          <span id="vocab-count" class="notes-count" aria-live="polite"></span>
        </span>
        <span class="save-status vocab-main-status" id="vocab-status" role="status" aria-live="polite"></span>
        <div class="lib-cluster" role="group" aria-label="Selection actions">
          <button type="button" class="btn btn-sm ghost lib-hang-end" id="vocab-select-all">Select all</button>
        </div>
      </div>
      <div class="vocab-batch-bar" id="vocab-batch-toolbar" role="group" aria-label="Actions for selected words">
        <span id="vocab-selected-count" class="notes-count" aria-live="polite"></span>
        <button type="button" class="btn btn-sm ghost" id="vocab-batch-select-all">Select all</button>
        <span class="lib-cluster">
          <button type="button" class="btn btn-sm ghost" id="vocab-invert-selection" aria-label="Invert selection" title="Invert selection"><span class="btn-ic" data-ic="arrowRightLeft"></span></button>
          <button type="button" class="btn btn-sm danger ghost" id="vocab-batch-delete" aria-label="Delete selected" title="Delete selected"><span class="btn-ic" data-ic="trash"></span></button>
          <button type="button" class="btn btn-sm ghost vocab-clear-selection" id="vocab-clear-selection" aria-label="Clear selection" title="Clear selection"><span class="btn-ic" data-ic="cross"></span></button>
        </span>
        <span class="vocab-group-unit">
          <input type="text" id="vocab-group-input" list="vocab-group-list" placeholder="Group name" aria-label="Group name" autocomplete="off" />
          <datalist id="vocab-group-list"></datalist>
          <button type="button" class="btn btn-sm vocab-group-step" id="vocab-add-group" aria-label="Add to group" title="Add to group"><span class="btn-ic" data-ic="plus"></span></button>
          <button type="button" class="btn btn-sm vocab-group-step" id="vocab-remove-group" aria-label="Remove from group" title="Remove from group"><span class="btn-ic" data-ic="minus"></span></button>
        </span>
        <button type="button" class="btn btn-sm" id="vocab-mark-known" aria-label="Mark as known" title="Mark as known">Known</button>
        <button type="button" class="btn btn-sm" id="vocab-mark-learning" aria-label="Back to learning" title="Back to learning">Learning</button>
        <span class="lib-batch-status"></span>
      </div>
      <div id="vocab-empty" class="notes-empty" hidden>No saved words yet. Save words from the reader's dictionary view.</div>
      <div id="vocab-no-results" class="notes-empty" hidden>No words match the current filters.</div>
      <div class="vocab-list-region">
        <div id="vocab-list" role="grid" aria-multiselectable="true" aria-label="Saved vocabulary" aria-busy="false"></div>
        <button type="button" class="btn btn-sm ghost vocab-load-more" id="vocab-load-more" hidden>Load more</button>
      </div>
    </div>
    <aside class="vocab-detail-pane" id="vocab-detail-pane" aria-label="Word details">
      <button type="button" class="btn btn-sm ghost vocab-detail-back" id="vocab-detail-back" aria-label="Back to list" title="Back to list"><span class="btn-ic" data-ic="arrowLeft"></span><span>Back to list</span></button>
      <div class="vocab-sheet">
        <div id="vocab-detail-empty" class="lib-cover">
          <h2 class="lib-cover-title lib-first-line"></h2>
          <p class="lib-cover-lead"></p>
          <p class="lib-cover-hint">Pick a word to see its context, your note and its dictionary entry, or look up any word directly.</p>
        </div>
        <div class="vocab-detail" id="vocab-detail" hidden></div>
        <section id="vocab-ref" class="vocab-ref" aria-labelledby="vocab-ref-label">
          <h3 id="vocab-ref-label" class="lib-hang-label lib-first-line">Dictionary</h3>
          <div id="vocab-lookup-bar" class="vocab-filter-toolbar vocab-lookup-bar" role="search" aria-label="Dictionary lookup">
            <input type="search" id="vocab-lookup-input" aria-label="Look up any word" autocomplete="off" />
            <label class="sr-only" for="vocab-lookup-lang">Dictionary language</label>
            <select id="vocab-lookup-lang" data-listbox="float"></select>
            <button type="button" class="btn" id="vocab-lookup-go">Look up</button>
          </div>
          <div id="vocab-ref-result"></div>
        </section>
        <div id="vocab-detail-tail"></div>
      </div>
    </aside>
  </div>
</div>
<div id="results"></div>
<script>
function t(key, ...values) { return key + (values.length ? ":" + values.join(",") : ""); }
// listbox.js is not loaded on this page, so nothing marks the page ready and
// library.css keeps every select[data-listbox] invisible -- a native select
// that is the fallback here has to be focusable and measurable.
document.documentElement.setAttribute("data-listbox-ready", "");
</script>
<script src="../shared.js"></script>
<script src="../vocab-store.js"></script>
<script src="../md-dict.js"></script>
<script src="../dict-pack.js"></script>
<!-- pbpVocabCurrentOwner (shared.js) routes through pbpReadSettingsWithSecrets,
     which without this stub hits the real chrome.storage/navigator.locks
     path -- absent here (no chrome mock on this page) it does not merely
     reject cleanly, it can leave that lock request unresolved. Same stub the
     pre-split options-vocab-tests.html used. -->
<script>pbpReadSettingsWithSecrets = async () => ({ pinboardToken: "" });</script>
<script src="../library-vocab.js"></script>
<script src="../library.js"></script>
<script>
const results = $id("results");
let pass = 0, fail = 0;
function check(name, condition, detail) {
  const row = document.createElement("div");
  const ok = !!condition;
  ok ? pass++ : fail++;
  row.className = "case " + (ok ? "pass" : "fail");
  row.textContent = (ok ? "PASS " : "FAIL ") + name + (ok ? "" : "\n  " + (detail || ""));
  results.appendChild(row);
}
function ids(rows) { return rows.map((row) => row.id).join(","); }

const sample = [
  { id:"a", term:"Défense", lemma:"défendre", gloss:"Protection", note:"Review soon", groups:["French A1"], contexts:[{quote:"La défense gagne.",articleTitle:"Match report"}], updatedAt:30 },
  { id:"b", term:"word10", lemma:"", gloss:"Tenth item", note:"", groups:["Numbers"], contexts:[], updatedAt:10 },
  { id:"c", term:"word2", lemma:"", gloss:"Second item", note:"", groups:[], contexts:[], updatedAt:20 }
];

const hostileOwner = "acct_%3Cimg%20src%3Dx%20onerror%3Dalert(1)%3E";
const hostileOwnerLabel = typeof pbpVocabOwnerLabel === "function" ? pbpVocabOwnerLabel(hostileOwner) : "";
if (typeof _vocabOwnerLabel !== "undefined") _vocabOwnerLabel = hostileOwnerLabel;
_vocabRows = sample;
_pbpVocabApplyView(true);
const ownerFull = $id("vocab-count").querySelector(".lib-count-full");
const ownerFullText = ownerFull ? ownerFull.textContent : "";
const ownerTitle = $id("vocab-count").title;
const ownerNoImg = !$id("vocab-count").querySelector("img");
_vocabRows = [];
_pbpVocabApplyView(true);
check("current-account total and empty state render the non-secret owner as text",
  ownerFullText.includes("<img") && ownerTitle.includes("<img") && ownerNoImg &&
  $id("vocab-empty").textContent.includes("<img") && !$id("vocab-empty").querySelector("img"),
  ownerFullText);
_pbpVocabClearVisibleState();
check("account-switch clearing removes the previous owner scope before the next read",
  !$id("vocab-count").textContent && $id("vocab-empty").hidden &&
  (typeof _vocabOwnerLabel === "undefined" || !_vocabOwnerLabel));

check("search matches term case-insensitively", ids(pbpVocabFilterSort(sample,"DÉFENSE","","latest")) === "a");
check("search matches lemma", ids(pbpVocabFilterSort(sample,"défendre","","latest")) === "a");
check("search matches gloss", ids(pbpVocabFilterSort(sample,"protection","","latest")) === "a");
check("search matches note", ids(pbpVocabFilterSort(sample,"review soon","","latest")) === "a");
check("search matches context quote", ids(pbpVocabFilterSort(sample,"gagne","","latest")) === "a");
check("search matches article title", ids(pbpVocabFilterSort(sample,"match report","","latest")) === "a");
check("search matches group names", ids(pbpVocabFilterSort(sample,"french a1","","latest")) === "a");
check("group filter is exact", ids(pbpVocabFilterSort(sample,"","Numbers","latest")) === "b");
check("status filter keeps only known words", ids(pbpVocabFilterSort(
  [{ id:"k", term:"kk", status:"known" }, { id:"n", term:"nn" }], "", "", "latest", "known")) === "k");
check("status filter learning excludes known, records without the field count as learning", ids(pbpVocabFilterSort(
  [{ id:"k", term:"kk", status:"known" }, { id:"n", term:"nn" }], "", "", "latest", "new")) === "n");
check("search normalizes NFC", ids(pbpVocabFilterSort(sample,"Défense","","latest")) === "a");
check("search folds Greek final sigma", pbpVocabSearchText("ΟΣ") === pbpVocabSearchText("οσ"));
check("search folds German sharp s to ss", pbpVocabSearchText("Straße") === pbpVocabSearchText("STRASSE"));
check("search folds capital sharp s", pbpVocabSearchText("ẞ") === "ss");
check("search folds dotted capital I", pbpVocabSearchText("İstanbul") === pbpVocabSearchText("istanbul"));
check("search preserves German umlaut distinctions", pbpVocabSearchText("schon") !== pbpVocabSearchText("schön"));
check("search preserves Cyrillic diaeresis distinctions", pbpVocabSearchText("все") !== pbpVocabSearchText("всё"));
check("search preserves Devanagari vowel marks", pbpVocabSearchText("क") !== pbpVocabSearchText("कि"));

check("latest sort uses updatedAt descending", ids(pbpVocabFilterSort(sample,"","","latest")) === "a,c,b");
check("oldest sort uses updatedAt ascending", ids(pbpVocabFilterSort(sample,"","","oldest")) === "b,c,a");
check("A-Z sort uses numeric Intl.Collator order", ids(pbpVocabFilterSort(sample.slice(1),"","","az")) === "c,b");
check("Z-A sort reverses collator order", ids(pbpVocabFilterSort(sample.slice(1),"","","za")) === "b,c");
const tied = [{id:"x",term:"same",updatedAt:1},{id:"y",term:"same",updatedAt:1}];
check("equal sort keys preserve source order", ids(pbpVocabFilterSort(tied,"","","az")) === "x,y");

// pbpVocabStats: pure counting over owner rows
(function () {
  const NOW = 1754200000000; // fixed clock
  const D = 86400000;
  const rows = [
    { term: "a", status: "new",   language: "en",  groups: ["g1"],      createdAt: NOW - 1 * D },
    { term: "b", status: "known", language: "en",  groups: ["g1","g2"], createdAt: NOW - 7 * D },      // exactly 7d -> counts in 7d window (>=)
    { term: "c", status: "new",   language: "fr",  groups: [],          createdAt: NOW - 8 * D },      // outside 7d, inside 30d
    { term: "d", status: "known", language: "und", groups: [],          createdAt: NOW - 31 * D },     // outside 30d; und not a language
  ];
  const s = pbpVocabStats(rows, NOW);
  check("stats: total", s.total === 4);
  check("stats: learning counts status new", s.learning === 2);
  check("stats: known", s.known === 2);
  check("stats: groups deduped", s.groups === 2);
  check("stats: languages exclude und", s.languages === 2);
  check("stats: added7 inclusive boundary", s.added7 === 2);
  check("stats: added30", s.added30 === 3);
  check("stats: empty rows", pbpVocabStats([], NOW).total === 0);
  check("stats: latestCreatedAt is the newest createdAt (0 for none)",
    s.latestCreatedAt === NOW - 1 * D && pbpVocabStats([], NOW).latestCreatedAt === 0);
})();

setStatusIcon($id("vocab-status"), false, "read failed");
const errorColor = getComputedStyle($id("vocab-status")).color;
check("shared status renderer marks an error host and icon as bad",
  $id("vocab-status").classList.contains("bad") && !$id("vocab-status").classList.contains("ok") &&
  $id("vocab-status").querySelector(".status-ic.bad"));
setStatusIcon($id("vocab-status"), true, "saved");
const successColor = getComputedStyle($id("vocab-status")).color;
check("shared status renderer marks success as ok and keeps success/error colours distinct",
  $id("vocab-status").classList.contains("ok") && !$id("vocab-status").classList.contains("bad") &&
  $id("vocab-status").querySelector(".status-ic.ok") && successColor !== errorColor);

_pbpVocabClearVisibleState();
check("vocabulary loading is visible in the existing polite status region",
  $id("vocab-status").textContent === "vocabLoading" &&
  $id("vocab-status").getAttribute("role") === "status" &&
  $id("vocab-status").getAttribute("aria-live") === "polite" &&
  getComputedStyle($id("vocab-status")).display !== "none");
check("vocabulary loading marks the production list busy",
  $id("vocab-list").getAttribute("aria-busy") === "true");
// The batch row is class-driven: `.vocab-batch-bar:not(.selecting)` is
// display:none (it no longer floats, it replaces the count row). The old
// pre-split fixture's toolbar div carried a permanent `hidden` attribute and
// no vocab-batch-bar class, so `.hidden` and `display === "none"` happened to
// hold vacuously (nothing ever matched the real component's actual
// visibility mechanism). This fixture mirrors the real markup, so these
// checks assert the real mechanism instead.
check("loading hides batch and load-more controls despite their production display rules",
  !$id("vocab-batch-toolbar").classList.contains("selecting") && $id("vocab-load-more").hidden &&
  getComputedStyle($id("vocab-batch-toolbar")).display === "none" &&
  getComputedStyle($id("vocab-load-more")).display === "none");

_pbpVocabSetLoading(false);
_vocabRows = [];
_pbpVocabApplyView(true);
check("zero rows shows only the empty state and leaves paging and batching hidden",
  !$id("vocab-empty").hidden && $id("vocab-no-results").hidden &&
  $id("vocab-load-more").hidden && !$id("vocab-batch-toolbar").classList.contains("selecting") &&
  getComputedStyle($id("vocab-load-more")).display === "none" &&
  $id("vocab-list").getAttribute("aria-busy") === "false" && !$id("vocab-status").textContent);

_vocabRows = sample.slice(0, 1);
_pbpVocabApplyView(true);
check("one row renders one reachable card without empty, no-result, paging or batch UI",
  $id("vocab-list").querySelectorAll(".vocab-card").length === 1 &&
  $id("vocab-empty").hidden && $id("vocab-no-results").hidden &&
  $id("vocab-load-more").hidden && !$id("vocab-batch-toolbar").classList.contains("selecting"));

_vocabRows = Array.from({length:100}, (_, i) => ({id:"hundred"+i,term:"word"+i,updatedAt:i,groups:[],contexts:[]}));
_pbpVocabApplyView(true);
check("exactly 100 rows fills one render batch without exposing Load more",
  $id("vocab-list").querySelectorAll(".vocab-card").length === 100 &&
  $id("vocab-load-more").hidden && getComputedStyle($id("vocab-load-more")).display === "none");
// ---- library.js shared helpers (redesign T4a, spec §3.5 / §5.3) ----
// typeof-guarded so a missing helper is a FAIL row, never a page error.
{
  const has = (name) => typeof window[name] === "function";
  const one = has("pbpLibSplitCount") ? pbpLibSplitCount((...a) => t("libraryStatsWords", ...a), ["16"]) : null;
  check("pbpLibSplitCount hands the value back as its own part, after the literal text",
    JSON.stringify(one) === JSON.stringify([{ text: "libraryStatsWords:", index: -1 }, { text: "16", index: 0 }]),
    JSON.stringify(one));
  const moved = has("pbpLibSplitCount") ? pbpLibSplitCount((a, b) => `${b} of ${a}`, ["3", "9"]) : null;
  const echoed = has("pbpLibSplitCount") ? pbpLibSplitCount(() => "keyEcho", ["1"]) : null;
  check("pbpLibSplitCount follows the slot, not the position, and passes a sentinel-free string through whole",
    JSON.stringify(moved) === JSON.stringify([{ text: "9", index: 1 }, { text: " of ", index: -1 }, { text: "3", index: 0 }]) &&
    JSON.stringify(echoed) === JSON.stringify([{ text: "keyEcho", index: -1 }]),
    JSON.stringify(moved) + " | " + JSON.stringify(echoed));
  const fillHost = document.createElement("span");
  if (has("pbpLibFillCount")) pbpLibFillCount(fillHost, [{ text: "x ", index: -1 }, { text: "<img src=x>", index: 0 }], (i) => (i === 0 ? "b" : null));
  check("pbpLibFillCount builds <b> from textContent only",
    fillHost.querySelector("b")?.textContent === "<img src=x>" && !fillHost.querySelector("img") &&
    fillHost.firstChild?.nodeType === Node.TEXT_NODE,
    fillHost.innerHTML);
  const countHost = document.createElement("span");
  if (has("pbpLibRenderCount")) {
    pbpLibRenderCount(countHost, [[{ text: "16", index: 0 }, { text: " words", index: -1 }], [{ text: "2 groups", index: -1 }]], "full sentence");
  }
  const built = countHost.querySelector(":scope > .lib-count-items[aria-hidden='true']");
  const fullEl = countHost.querySelector(":scope > .lib-count-full.sr-only");
  const builtOk = !!built && built.children.length === 2 && built.querySelectorAll("b").length === 1 &&
    built.querySelector(".lib-count-item b")?.textContent === "16" && fullEl?.textContent === "full sentence" &&
    countHost.title === "full sentence";
  if (has("pbpLibRenderCount")) pbpLibRenderCount(countHost, [], "");
  check("pbpLibRenderCount writes compact items, the screen-reader sentence and the title, and clears all three",
    builtOk && countHost.querySelector(".lib-count-items").children.length === 0 &&
    countHost.querySelector(".lib-count-full").textContent === "" && !countHost.hasAttribute("title"),
    countHost.outerHTML);
  const now = new Date(2026, 9, 3, 12).getTime();
  const sameYear = has("pbpLibFormatDay") ? pbpLibFormatDay(new Date(2026, 9, 1, 9).getTime(), now) : "";
  const otherYear = has("pbpLibFormatDay") ? pbpLibFormatDay(new Date(2025, 9, 1, 9).getTime(), now) : "";
  check("pbpLibFormatDay drops the year inside the current year, keeps it across years, and answers \"\" for no date",
    !!sameYear && !sameYear.includes("2026") && otherYear.includes("2025") &&
    pbpLibFormatDay(0) === "" && pbpLibFormatDay("x") === "",
    JSON.stringify([sameYear, otherYear]));
  const time = has("pbpLibFormatTime") ? pbpLibFormatTime(new Date(2026, 9, 3, 14, 5).getTime()) : "";
  check("pbpLibFormatTime prints a two-digit minute and pbpLibSameDay compares local calendar days",
    time.includes("05") && has("pbpLibSameDay") &&
    pbpLibSameDay(new Date(2026, 9, 3, 0, 1).getTime(), new Date(2026, 9, 3, 23, 59).getTime()) === true &&
    pbpLibSameDay(new Date(2026, 9, 3, 23, 59).getTime(), new Date(2026, 9, 4, 0, 1).getTime()) === false,
    time);
}

// ---- Batch row replaces the count row in place (spec §3.9) + status host
// tier 1 (spec §4.7) + Select-all focus handoff ----
_vocabRows = sample;
$id("vocab-search").value = "";
_pbpVocabClearSelection();
_pbpVocabApplyView(true);
_vocabSelected = new Set(["a"]);
_pbpVocabSyncSelectionUi();
check("selecting hides the count row and shows the batch row in its place",
  $id("vocab-context-bar").hidden === true && $id("vocab-batch-toolbar").classList.contains("selecting") &&
  getComputedStyle($id("vocab-batch-toolbar")).display === "grid");
check("the batch row bolds the selected count through the sentinel split",
  $id("vocab-selected-count").textContent === "vocabSelectedCount:1" &&
  $id("vocab-selected-count").querySelector("b")?.textContent === "1");
check("while the batch row is up, the status live region sits in its status slot",
  $id("vocab-status").parentNode === $id("vocab-batch-toolbar").querySelector(".lib-batch-status"));
_vocabSelected = pbpVocabSelectResults(_vocabSelected, _vocabViewRows, "all");

// Row pitch and hit coverage (spec §3.6): 56 comfortable / 44 compact, and the
// row button owns every pixel of its card plus half of the 2px gap to each
// neighbour -- a pointer anywhere between the first row's top and the last
// row's bottom lands on SOME row's button, never on dead padding (the T4b
// geometry had a 2-4px dead band along each card's top edge). Measured on
// screen: elementFromPoint needs the fixture inside the viewport.

  viewEl.style.left = "0px";
  const report = [];
  try {
    for (const [density, pitch] of [["", 56], ["compact", 44]]) {
      if (density) document.documentElement.dataset.density = density;
      else delete document.documentElement.dataset.density;
      const cards = [...$id("vocab-list").querySelectorAll(".vocab-card")];
      const tops = cards.map((c) => c.querySelector(".notes-card-top").getBoundingClientRect());
      const pitches = tops.slice(1).map((r, i) => Math.round(r.top - tops[i].top));
      const first = tops[0], last = tops[tops.length - 1];
      const card = cards[0].getBoundingClientRect();
      let dead = [];
      for (let y = Math.ceil(first.top); y < Math.floor(last.bottom); y++) {
        for (const x of [card.left + 1, card.left + card.width / 3, card.right - 24, card.right - 1]) {
          const hit = document.elementFromPoint(x, y);
          if (!hit || !hit.closest(".notes-card-head")) dead.push(`${Math.round(x)},${y}:${hit ? hit.className || hit.tagName : "none"}`);
        }
      }
      // Both text lines use the row's full content width, including its right end.
      const fullWidth = cards.map((c) => {
        const top = c.querySelector(".notes-card-top");
        const box = top.getBoundingClientRect();
        const main = c.querySelector(".notes-card-main").getBoundingClientRect();
        return Math.abs(main.right - (box.right - parseFloat(getComputedStyle(top).paddingRight))) < 0.5;
      });
      report.push({ density: density || "comfortable", pitch, pitches, dead, fullWidth });
    }
  } finally {
    delete document.documentElement.dataset.density;
    viewEl.style.left = restoreLeft;
  }

    { id:"b", owner:raceOwner, term:"beta", groups:[], contexts:[], updatedAt:20 },
    { id:"c", owner:raceOwner, term:"gamma", groups:[], contexts:[], updatedAt:10 }
  ];
  let raceStore = [];
  let raceRead = null;
  const cloneRows = (rows) => rows.map((row) => ({ ...row, groups:[...(row.groups || [])], contexts:[...(row.contexts || [])] }));
  const seedRaceUi = () => {
    raceStore = raceSeedRows();
    $id("vocab-search").value = "";
    $id("vocab-group-filter").value = "";
    $id("vocab-sort").value = "latest";
    $id("vocab-group-input").value = "";
    $id("vocab-status").textContent = "";

  };
  const armHeldFirstRead = () => {
    let release;
    let markStarted;
    const gate = new Promise((resolve) => { release = resolve; });
    const started = new Promise((resolve) => { markStarted = resolve; });
    let reads = 0;
    raceRead = async () => {
      const snapshot = cloneRows(raceStore);
      reads++;
      if (reads === 1) {
        markStarted();
        await gate;
      }
      return snapshot;
    };
    return { started, release };
  };
  const waitFor = async (predicate, label) => {
    for (let i = 0; i < 80; i++) {
      if (predicate()) return;
      await task();
    }
    throw new Error("timed out waiting for " + label);
  };
  const confirmSingleDelete = (row) => {
    const anchor = document.createElement("button");
    anchor.textContent = "delete " + row.id;
    document.body.appendChild(anchor);
    _pbpVocabDeleteRow(row, anchor);
    const yes = document.querySelector(".confirm-popover .confirm-yes");
    if (!yes) throw new Error("single delete confirmation missing");
    yes.click();
    anchor.remove();
  };
  try {
    pbpVocabCurrentOwner = async () => raceOwner;
    pbpVocabAll = async () => raceRead();
    pbpVocabDelete = async (id, owner) => {
      if (owner !== raceOwner) return false;
      raceStore = raceStore.filter((row) => row.id !== id);
      return true;
    };
    pbpVocabBatchDelete = async (ids, owner) => {
      if (owner !== raceOwner) return false;

      raceStore = raceStore.filter((row) => !doomed.has(row.id));
      return true;

      if (owner !== raceOwner) return false;

      raceStore = raceStore.map((row) => selectedIds.has(row.id)
        ? { ...row, groups:[...new Set([...(row.groups || []), group])] } : row);
      return true;
    };

    seedRaceUi();
    let held = armHeldFirstRead();
    confirmSingleDelete(raceStore.find((row) => row.id === "a"));
    await held.started;
    confirmSingleDelete(raceStore.find((row) => row.id === "b"));
    await waitFor(() => ids(_vocabRows) === "c", "newer single-delete reload");
    held.release();
    await task(); await task();
    check("overlapping single deletes leave the mock IDB without B", ids(raceStore) === "c");
    check("an older delayed delete snapshot cannot restore B to the UI", ids(_vocabRows) === "c");

    seedRaceUi();
    held = armHeldFirstRead();
    let deleteAttempt = 0;
    pbpVocabDelete = async (id, owner) => {
      if (owner !== raceOwner) return false;
      deleteAttempt++;
      if (deleteAttempt === 2) return false;
      raceStore = raceStore.filter((row) => row.id !== id);
      return true;
    };
    confirmSingleDelete(raceStore.find((row) => row.id === "a"));
    await held.started;
    confirmSingleDelete(raceStore.find((row) => row.id === "b"));
    await waitFor(() => ids(_vocabRows) === "b,c" && $id("vocab-status").textContent.includes("dictDeleteFailed"), "failed newer delete reconcile");
    held.release();
    await task(); await task();
    check("a later failed mutation preserves the true mock IDB state", ids(raceStore) === "b,c");
    check("a later failed mutation still reconciles the UI from the mock IDB", ids(_vocabRows) === "b,c");
    check("the latest failed mutation keeps its accurate failure status", $id("vocab-status").textContent.includes("dictDeleteFailed"));

    pbpVocabDelete = async (id, owner) => {
      if (owner !== raceOwner) return false;
      raceStore = raceStore.filter((row) => row.id !== id);
      return true;
    };
    seedRaceUi();
    held = armHeldFirstRead();
    _vocabSelected = new Set(["a"]);
    _pbpVocabSyncSelectionUi();
    _pbpVocabBatchDeleteSelected();
    document.querySelector(".confirm-popover .confirm-yes").click();
    await held.started;
    confirmSingleDelete(raceStore.find((row) => row.id === "b"));
    await waitFor(() => ids(_vocabRows) === "c", "single delete after batch delete");
    held.release();
    await waitFor(() => !_vocabBatchBusy, "older batch cleanup");
    check("batch-delete and single-delete interleave leaves the mock IDB truthful", ids(raceStore) === "c");
    check("a delayed batch snapshot cannot overwrite the later single-delete UI", ids(_vocabRows) === "c");

    seedRaceUi();
    held = armHeldFirstRead();
    _vocabSelected = new Set(["a"]);
    $id("vocab-group-input").value = "Study";
    _pbpVocabSyncSelectionUi();
    const grouping = _pbpVocabApplyGroupChange(true);
    await held.started;
    confirmSingleDelete(raceStore.find((row) => row.id === "b"));
    await waitFor(() => ids(_vocabRows) === "a,c" && (_vocabRows[0].groups || []).includes("Study"), "single delete after add-group");
    held.release();

    check("add-group and single-delete interleave preserves both mock IDB mutations",
      ids(raceStore) === "a,c" && (raceStore[0].groups || []).includes("Study"));
    check("a delayed add-group snapshot cannot restore the later deleted row",
      ids(_vocabRows) === "a,c" && (_vocabRows[0].groups || []).includes("Study"));
  } finally {
    pbpVocabDelete = raceRealDelete;
    pbpVocabBatchDelete = raceRealBatchDelete;

  // ---- Phase C: detail pane / list state across reloads --------------
  // One shared mock store for the whole block; `settle` drains the
  // fire-and-forget mutation chains (click handlers are not awaitable) without
  // waitFor's throw-on-timeout, which would abort the remaining suite.
  const settle = async () => { for (let i = 0; i < 25; i++) await task(); };
  // Real-time waits for paths that cross IndexedDB or a 250ms dwell: poll a
  // predicate instead of counting macrotasks. Returns whether it held.
  const until = async (predicate, ms = 3000) => {
    const start = performance.now();
    while (!predicate() && performance.now() - start < ms) await new Promise((resolve) => setTimeout(resolve, 10));
    return !!predicate();
  };
  {
    const cRealOwner = pbpVocabCurrentOwner;
    const cRealAll = pbpVocabAll;
    const cRealStatus = pbpVocabBatchSetStatus;
    const cRealDelete = pbpVocabDelete;

      { id:"d1", owner:cOwner, term:"alpha", groups:[], contexts:[], note:"", status:"new", updatedAt:30 },

      pbpVocabAll = async () => cClone();

        return true;

        if (owner !== cOwner) return false;

      };

      await renderVocabPanel();

        const tail = $id("vocab-detail-tail");

          kinds.join(",") === "vocab-detail-delete,vocab-main-status,vocab-note-save",

      // selection. Half-typed text is the user's, not the store's, and a

      detailEl().querySelector(".vocab-group-unit input").value = "Draft group";
      _vocabSelected = new Set(["d1", "d2", "d3"]);
      _pbpVocabSyncSelectionUi();
      detailEl().querySelector(".vocab-detail-status").click();
      await settle();
      check("a detail mutation reaches the store", (cStore.find((row) => row.id === "d1") || {}).status === "known");
      check("a detail mutation keeps unsaved note text and its save button",
        detailEl().querySelector(".vocab-note-input").value === "half-typed" &&
        $id("vocab-detail-tail").querySelector(".vocab-note-save").hidden === false,
        JSON.stringify(detailEl().querySelector(".vocab-note-input").value));
      check("a detail mutation keeps the typed group name",
        detailEl().querySelector(".vocab-group-unit input").value === "Draft group");
      check("a detail mutation keeps the list selection it never touched",

      check("a detail mutation still re-marks the shown row as current",

      // (3): the word vanished elsewhere; re-entering the view must not keep

      cStore = cStore.filter((row) => row.id !== "d1");
      await renderVocabPanel();
      check("re-entering the view drops a detail word the fresh list no longer has",
        _pbpVocabDetailWordId === null && detailEl().hidden === true &&
        $id("vocab-detail-empty").hidden === false);

      // (H2): same reset when the account moves between the read and its
      // ownership check, which restarts the render.
      await renderVocabPanel();
      $id("vocab-list").querySelector('.vocab-card[data-vocab-id="d2"] .notes-card-head').click();
      let ownerReads = 0;
      pbpVocabCurrentOwner = async () => (++ownerReads === 2 ? "acct_other" : cOwner);
      await renderVocabPanel();
      await settle();
      pbpVocabCurrentOwner = async () => cOwner;
      check("an account change mid-read resets the detail pane before the re-read",
        _pbpVocabDetailWordId === null && detailEl().hidden === true);

      // (8): a mutation is not a reason to throw away the pages the user
      // loaded with "Load more".
      cStore = Array.from({ length: 250 }, (_, i) => ({
        id:"deep" + i, owner:cOwner, term:"deep" + i, groups:[], contexts:[], updatedAt:250 - i }));
      await renderVocabPanel();
      $id("vocab-load-more").click();
      check("load more deepens the rendered list", $id("vocab-list").children.length === 200);
      await _pbpVocabReloadAfterMutation(cOwner, ++_vocabRenderGen);
      check("a mutation reload keeps the loaded render depth",
        $id("vocab-list").children.length === 200, String($id("vocab-list").children.length));

      // (5): the confirm popover restores focus to the delete button, which

      await renderVocabPanel();
      $id("vocab-list").querySelector('.vocab-card[data-vocab-id="f1"] .notes-card-head').click();
      const deleteButton = $id("vocab-detail-tail").querySelector(".vocab-detail-delete");
      deleteButton.focus();

      await settle();
      check("a confirmed single delete lands focus on the visible search field",
        document.activeElement === $id("vocab-search") && !$id("vocab-search").closest("[hidden]"),
        document.activeElement && document.activeElement.id);
    } finally {
      pbpVocabCurrentOwner = cRealOwner;
      pbpVocabAll = cRealAll;
      pbpVocabBatchSetStatus = cRealStatus;
      pbpVocabDelete = cRealDelete;
      _pbpVocabRenderDetail(null);
    }
  }

  // ---- Phase C (2): a soft-reload read failure is not an empty vocabulary.
  {
    const sRealOwner = pbpVocabCurrentOwner;

    const sRealCurrentOwner = _vocabCurrentOwner;

  }

  // ---- Search highlight boundaries (#25). Positions are computed on the
  // case-folded copy and used to slice the ORIGINAL, which only holds while
  // the fold preserves length -- and toLowerCase does not (U+0130 folds to
  // two code units). Asserted as a category ("no mark ever carries text the
  // needle does not match", "the quote still reads in full") rather than as
  // the one İ instance, so any future length-changing fold has to satisfy it
  // too. -----------------------------------------------------------------
  {
    const marksOf = (quote, term) => {
      const host = document.createElement("div");
      _pbpVocabHighlightTerm(host, quote, term);
      return { host, marks: [...host.querySelectorAll("mark")].map((m) => m.textContent) };
    };
    const turkish = marksOf("İstanbul is big. İstanbul again.", "İstanbul");
    check("a highlight never marks text the term does not match",
      turkish.marks.every((text) => text.toLowerCase() === "İstanbul".toLowerCase()),
      JSON.stringify(turkish.marks));
    check("a quote whose fold changes length still reads in full",
      turkish.host.textContent === "İstanbul is big. İstanbul again.",
      JSON.stringify(turkish.host.textContent));
    const shifted = marksOf("Visit İstanbul and see museums", "museums");
    check("a length-changing character earlier in the quote does not shift later marks",
      shifted.marks.every((text) => text === "museums") &&
      shifted.host.textContent === "Visit İstanbul and see museums",
      JSON.stringify(shifted.marks));
    const plain = marksOf("the cat sat on the cat", "CAT");
    check("length-preserving quotes still mark every case-insensitive match",
      plain.marks.length === 2 && plain.marks.every((text) => text === "cat"));
  }

  // ---- Status host (spec §4.7 table, a behaviour change): multi-select ->

  // otherwise (cover, a rebuild in progress, signed out) -> the count row. ---
  {
    const realNarrow = _pbpVocabNarrowMode;
    const realDictRun = _pbpVocabDictRun;
    try {
      _pbpVocabDictRun = () => {};
      const word = { id: "st1", term: "statusword", groups: [], contexts: [], note: "" };
      _vocabRows = [word];
      _pbpVocabApplyView(true);
      const footer = () => $id("vocab-detail-tail").querySelector(".vocab-detail-footer");
      _pbpVocabNarrowMode = () => false;

        !!footer() && $id("vocab-status").parentNode === footer() &&

      _pbpVocabFlashStatus(true, "saved in the tail");

      check("T7 the relocated region is still the same live region",

      _pbpVocabNarrowMode = () => true;

      document.body.classList.remove("lib-narrow-detail");

        $id("vocab-status").parentNode === footer() && $id("vocab-status").getClientRects().length > 0,

  // the manual chain. This page has no chrome mock: one is stood up here. ----

    const realOwnerIdle = _vocabCurrentOwner;

      // empty here), then the grant check -- a signed-in owner, so the button
      // this block tests is the open-to-look-up "no grant" answer.

      window.chrome = { permissions: {

      const word = { id: "idle1", term: "idle", language: "en", groups: [], contexts: [] };
      _vocabRows = [word];
      _pbpVocabRenderDetail(null);
      _pbpVocabRenderDetail(word);
      await until(() => !!$id("vocab-ref-result").querySelector(".vocab-ref-idle"));
      const idleBtn = () => $id("vocab-ref-result").querySelector(".vocab-ref-idle");
      check("T7 an opened word with nothing local and no grant shows the lookup button and sends nothing",

        idleBtn().textContent.includes("libraryDictIdle"));

        requests === 2 && focusedDuring && document.activeElement === idleBtn() && !$id("vocab-ref-result").hasAttribute("aria-busy"),
        `requests=${requests} during=${focusedDuring} active=${document.activeElement && (document.activeElement.className || document.activeElement.tagName)}`);
      grant = true;
      idleBtn().click();
      await settle();
      const langTarget = $id("vocab-lookup-lang-btn") || $id("vocab-lookup-lang");
      check("T7 a granted lookup runs the manual chain for the open word and hands focus to the language list box",
        requests === 3 && runs.join(",") === "idle/en" && $id("vocab-ref-result").dataset.refState === "word" &&
        _pbpVocabRelookedWordId === "idle1" && document.activeElement === langTarget,

      pane.style.width = "200px";
      await fitFrames();
      check("header fit: before the counts land (no data-counts-ready) the form is left as it is",
        Number.isNaN(pbpLibVocabFilterNeed(row)) && pane.dataset.headerFit === "wide", pane.dataset.headerFit);
      set.querySelector(".vocab-status-toggles").setAttribute("data-counts-ready", "");
      for (const b of set.querySelectorAll(".lib-toggle")) b.hidden = true;
      pane.style.width = "640px";
      await fitFrames();
      check("header fit: counts landed with no words (toggles stay hidden) still decide a form",
        Number.isFinite(pbpLibVocabFilterNeed(row)) && pane.dataset.headerFit === "wide", `${pbpLibVocabFilterNeed(row)} ${pane.dataset.headerFit}`);
      const forcedPane = pane.cloneNode(true);
      host.appendChild(forcedPane);
      forcedPane.style.width = "900px";
      pbpLibWireHeaderFit(forcedPane, forcedPane.querySelector(".vocab-filter-row"), () => 100, { narrowMedia: "(min-width: 1px)" });
      check("header fit: under the single-pane media query the form is always narrow", forcedPane.dataset.headerFit === "narrow", forcedPane.dataset.headerFit);
      check("header fit: the decision rule is need <= room (half-pixel slack)",
        pbpLibHeaderFitForm(440, 440) === "wide" && pbpLibHeaderFitForm(440.4, 440) === "wide" && pbpLibHeaderFitForm(441, 440) === "narrow" &&
        pbpLibHeaderFitForm(NaN, 440) === "narrow");
    } finally {
      host.remove();
    }
    // First frame (review round 1): before the counts land the pane carries
    // no data-header-fit and the Filter button keeps its box but not its ink,
    // at ANY width -- a window wide enough for the wide form never paints the
    // narrow one first. The id is the real one: library.css keys the button
    // rules on it.
    const host2 = document.createElement("div");
    host2.innerHTML = `
      <div class="vocab-list-pane" style="position:fixed;left:-9999px;top:0;width:520px">
        <div class="vocab-filter-row">
          <button type="button" class="btn ghost" id="vocab-filter-narrow" popovertarget="fit-set2" aria-expanded="false"><span>Filter</span></button>
          <div class="vocab-filter-set" id="fit-set2" popover="auto">
            <select data-listbox="float" hidden><option>All groups</option></select><div class="listbox"><button type="button" class="listbox-btn"><span class="listbox-value">All groups</span><span class="btn-ic"></span><span class="listbox-sizer">All groups</span></button><div class="listbox-pop" popover="manual" hidden><ul class="listbox-list"><li class="listbox-opt">All groups</li></ul></div></div>
            <span class="vocab-status-toggles"><button type="button" class="lib-toggle" hidden>All</button><button type="button" class="lib-toggle" hidden></button><button type="button" class="lib-toggle" hidden></button></span>
          </div>
          <!-- The sort control as listbox.js leaves it (T6b): hidden carrier + ghost trigger. -->
          <select data-listbox="float" data-listbox-face="ghost" hidden><option value="latest" data-face-label="Date" selected>Recently updated</option><option value="oldest" data-face-label="Date">Least recently updated</option><option value="az" data-face-label="Alphabetical">A-Z</option><option value="za" data-face-label="Alphabetical">Z-A</option></select><div class="listbox"><button type="button" class="listbox-trigger btn ghost"><span class="btn-ic"><svg width="14" height="14" viewBox="0 0 24 24"></svg></span><span>Date</span></button><div class="listbox-pop" popover="manual" hidden><ul class="listbox-list"><li class="listbox-opt">Recently updated</li></ul></div></div>
        </div>
      </div>`;
    document.body.appendChild(host2);
    const pane2 = host2.firstElementChild;
    const filterBtn = pane2.querySelector("#vocab-filter-narrow");
    try {
      pbpLibWireVocabHeaderFit(pane2);
      const seen = [];
      for (const w of [360, 520, 2000]) {
        pane2.style.width = `${w}px`;
        await fitFrames();
        const cs = getComputedStyle(filterBtn);
        seen.push(`${w}:${pane2.getAttribute("data-header-fit")}/${cs.visibility}/${cs.display}/${filterBtn.getBoundingClientRect().height}`);
      }
      check("header fit: before the counts land, no width shows the Filter button (box kept, ink hidden, form undecided)",
        seen.every((v) => /^\d+:null\/hidden\/(?!none)[a-z-]+\/[1-9]/.test(v)), seen.join(" "));
      const toggles2 = pane2.querySelector(".vocab-status-toggles");
      for (const b of toggles2.children) { b.hidden = false; b.textContent ||= "Known 3"; }
      toggles2.setAttribute("data-counts-ready", "");
      await fitTicks();
      check("header fit: the counts landing decide the form in the same turn (wide at 2000px, Filter button gone)",
        pane2.dataset.headerFit === "wide" && getComputedStyle(filterBtn).display === "none",
        `${pane2.dataset.headerFit} ${getComputedStyle(filterBtn).display}`);
    } finally {
      host2.remove();
    }
  }
  // ---- T8g: a count of one reads in the singular ----
  // Key choice first, on the stub t() (key names are the evidence), then the
  // shipped en / de / fr copy read as a user reads it. pbpLibCountKey follows
  // the language of the messages t() prints -- with no manual language loaded
  // (this page never loads i18n.js) that is chrome.i18n's UI language -- and
  // the dates follow uiLangToBCP47: stand in both.
  {
    const hadChrome = typeof window.chrome !== "undefined";
    if (!hadChrome) window.chrome = {};
    const prevI18n = window.chrome.i18n;
    const setLang = (loc) => { window.uiLangToBCP47 = () => loc; chrome.i18n = { getUILanguage: () => loc }; };
    const hadLang = Object.prototype.hasOwnProperty.call(window, "uiLangToBCP47");
    const prevLang = window.uiLangToBCP47;
    const realT = t;
    const saved = { rows: _vocabRows, owner: _vocabCurrentOwner, label: _vocabOwnerLabel };
    const pane = $id("vocab-list-pane");
    const wasSignedOut = pane.classList.contains("vocab-signed-out");
    const cover = $id("vocab-detail-empty");
    const lead = cover.querySelector(".lib-cover-lead");
    const items = () => [...$id("vocab-count").querySelectorAll(".lib-count-item")].map((el) => el.textContent);
    const sr = () => $id("vocab-count").querySelector(".lib-count-full")?.textContent || "";
    const bold = () => [...lead.querySelectorAll("b")].map((b) => b.textContent).join(",");
    const TS = Date.UTC(2026, 0, 5, 10);
    const word = (id, term, status, language, groups, createdAt) =>
      ({ id, term, status, language, groups, contexts: [], updatedAt: createdAt, createdAt });
    const show = (rows, q = "") => {
      $id("vocab-search").value = q;
      $id("vocab-group-filter").value = "";
      $id("vocab-status-filter").value = "";
      _vocabRows = rows;
      _pbpVocabApplyView(true);
    };
    const resolver = (m) => (key, ...values) => {
      const entry = m[key];
      if (!entry) return key;
      let text = entry.message;
      for (const [name, def] of Object.entries(entry.placeholders || {})) {
        const i = Number(String(def.content).slice(1)) - 1;
        text = text.replace(new RegExp("\\$" + name + "\\$", "gi"), () => String(values[i]));
      }
      return text;
    };
    const flashed = [];
    const real = { flash: _pbpVocabFlashStatus, owner: pbpVocabCurrentOwner, setStatus: pbpVocabBatchSetStatus, reload: _pbpVocabReloadAfterMutation };
    try {
      pane.classList.remove("vocab-signed-out");
      delete cover.dataset.loadFailed;
      _vocabCurrentOwner = "acct_t8g";
      _vocabOwnerLabel = "t8g";
      setLang("en");
      const one = [word("t8g-a", "alpha", "new", "en", ["G1"], TS)];
      show(one);
      check("T8g stub: one word, one group, one language take the One keys on the row and in the sentence",
        items().slice(0, 3).join("|") === "libraryStatsWordsOne:1|libraryStatsGroupsOne:1|libraryStatsLanguagesOne:1" &&
        sr().startsWith("vocabResultCount:vocabResultFoundOne:1,vocabResultSavedOne:1,t8g"),
        items().join("|") + " | " + sr());
      check("T8g stub: the cover takes the singular word and language phrases, four numbers bold",
        lead.textContent.startsWith("libraryVocabCoverLead:libraryCountWordsOne:1,1,0,libraryCountLanguagesOne:1,") && bold() === "1,1,0,1",
        lead.textContent + " | " + bold());
      show(one, "no such word");
      check("T8g stub: a filtered row over a total of one takes the filtered One key",
        items()[0] === "libraryStatsWordsFilteredOne:0,1" && sr().startsWith("vocabResultCount:vocabResultFound:0,vocabResultSavedOne:1,"),
        items()[0] + " | " + sr());

      // Batch status flips report how many words moved.
      _pbpVocabFlashStatus = (ok, text) => flashed.push(text);
      pbpVocabCurrentOwner = async () => "acct_t8g";
      pbpVocabBatchSetStatus = async () => true;
      _pbpVocabReloadAfterMutation = async () => true;
      const flip = async (ids, known) => {
        show([word("t8g-a", "alpha", "new", "en", [], TS), word("t8g-b", "beta", "new", "en", [], TS)]);
        _vocabSelected = new Set(ids);
        _pbpVocabSyncSelectionUi();
        await _pbpVocabApplyStatusChange(known);
        return flashed[flashed.length - 1];
      };
      const knownOne = await flip(["t8g-a"], true);
      const knownTwo = await flip(["t8g-a", "t8g-b"], true);
      const learningOne = await flip(["t8g-b"], false);
      check("T8g stub: a batch status flip of one word reports it in the singular",
        knownOne === "vocabBatchKnownDoneOne:1" && knownTwo === "vocabBatchKnownDone:2" && learningOne === "vocabBatchLearningDoneOne:1",
        [knownOne, knownTwo, learningOne].join(" | "));
      _pbpVocabFlashStatus = real.flash;
      pbpVocabCurrentOwner = real.owner;
      pbpVocabBatchSetStatus = real.setStatus;
      _pbpVocabReloadAfterMutation = real.reload;
      _vocabSelected = new Set();
      _pbpVocabSyncSelectionUi();

      // Load more: the last one left takes the singular key.
      const bulk = (n) => Array.from({ length: n }, (_, i) => word("t8g-k" + i, "k" + i, "new", "en", [], TS - i));
      const moreText = (n) => { show(bulk(n)); return $id("vocab-load-more").textContent; };
      check("T8g stub: Load more with one word left takes vocabLoadMoreOne, with two the plural key",
        moreText(PBP_VOCAB_RENDER_BATCH + 1) === "vocabLoadMoreOne:1" && moreText(PBP_VOCAB_RENDER_BATCH + 2) === "vocabLoadMore:2",
        moreText(PBP_VOCAB_RENDER_BATCH + 1) + " | " + moreText(PBP_VOCAB_RENDER_BATCH + 2));
      // A language switch after the render (the cold-load mirror refresh)
      // re-words Load more; nothing else rewrites it until the next render.
      show(bulk(PBP_VOCAB_RENDER_BATCH + 2));
      t = (key, ...values) => "L2:" + realT(key, ...values);
      try { document.dispatchEvent(new Event("pbp:i18n-applied")); } finally { t = realT; }
      check("a language switch re-words Load more in the new language",
        $id("vocab-load-more").textContent === "L2:vocabLoadMore:2" && !$id("vocab-load-more").hidden,
        $id("vocab-load-more").textContent);

      const locs = {};
      for (const loc of ["en", "de", "fr"]) locs[loc] = await (await fetch(`../_locales/${loc}/messages.json`)).json();
      const useLang = (loc) => { t = resolver(locs[loc]); setLang(loc); };
      const lastOne = {};
      for (const loc of ["en", "de", "fr"]) { useLang(loc); lastOne[loc] = moreText(PBP_VOCAB_RENDER_BATCH + 1); }
      check("T8g en / de / fr: Load more with one word left reads in the singular, adjective agreeing",
        lastOne.en === "Load the last one" && lastOne.de === "Den letzten Eintrag laden" && lastOne.fr === "Charger le dernier",
        JSON.stringify(lastOne));
      useLang("en");
      show(one);
      const day = pbpLibFormatDay(TS);
      check("T8g en: one word reads word / group / language on the row and in the full sentence",
        items().slice(0, 3).join("|") === "1 word|1 group|1 language" &&
        sr().startsWith("1 found · 1 saved for current Pinboard account: t8g"),
        items().join("|") + " | " + sr());
      check("T8g en: the cover reads 1 word ... in 1 language, the four counts bold and the date plain",
        lead.textContent === `1 word, 1 learning and 0 known, in 1 language. Last added on ${day}.` && bold() === "1,1,0,1" && !!day,
        lead.textContent + " | " + bold());
      show(one, "no such word");
      check("T8g en: a filter over a total of one reads 0 / 1 word", items()[0] === "0 / 1 word", items()[0]);
      const many = [word("t8g-a", "alpha", "new", "en", ["G1"], TS), word("t8g-b", "beta", "known", "de", ["G2"], TS - 1000)];
      show(many);
      check("T8g en: two words keep the plural everywhere, word for word as before",
        items().slice(0, 3).join("|") === "2 words|2 groups|2 languages" &&
        sr().startsWith("2 found · 2 saved for current Pinboard account: t8g") &&
        lead.textContent === `2 words, 1 learning and 1 known, in 2 languages. Last added on ${day}.` && bold() === "2,1,1,2",
        items().join("|") + " | " + sr() + " | " + lead.textContent);

      useLang("de");
      show(one);
      check("T8g de: one word reads Wort / Gruppe / Sprache, and in 1 Sprache on the cover",
        items().slice(0, 3).join("|") === "1 Wort|1 Gruppe|1 Sprache" &&
        lead.textContent === `1 Wort, davon 1 im Lernen und 0 gelernt, in 1 Sprache. Zuletzt hinzugefügt am ${pbpLibFormatDay(TS)}.` &&
        bold() === "1,1,0,1",
        items().join("|") + " | " + lead.textContent);

      useLang("fr");
      show(one);
      check("T8g fr: one word reads mot / groupe / langue, and 1 résultat, 1 mot enregistré",
        items().slice(0, 3).join("|") === "1 mot|1 groupe|1 langue" &&
        sr().startsWith("Compte Pinboard actuel (t8g) : 1 résultat · 1 mot enregistré") &&
        lead.textContent === `1 mot, dont 1 en cours d’apprentissage et 0 acquis, dans 1 langue. Dernier ajout le ${pbpLibFormatDay(TS)}.`,
        items().join("|") + " | " + sr() + " | " + lead.textContent);
      show(one, "no such word");
      check("T8g fr: zero takes the singular in French (0 résultat, 0 / 1 mot)",
        items()[0] === "0 / 1 mot" && sr().startsWith("Compte Pinboard actuel (t8g) : 0 résultat · 1 mot enregistré"),
        items()[0] + " | " + sr());
      show(one);

      // A language switch (applyI18n -> pbp:i18n-applied) redraws the count row.
      useLang("en");
      document.dispatchEvent(new Event("pbp:i18n-applied"));
      check("T8g a language switch redraws the count row and its full sentence in the new language",
        items().slice(0, 3).join("|") === "1 word|1 group|1 language" &&
        sr().startsWith("1 found · 1 saved for current Pinboard account: t8g"),
        items().join("|") + " | " + sr());
      // Under a filter the redraw keeps the filtered reading.
      show(one, "no such word");
      useLang("fr");
      document.dispatchEvent(new Event("pbp:i18n-applied"));
      check("T8g a language switch under a filter keeps 0 / 1 and redraws it in the new language",
        items()[0] === "0 / 1 mot" && sr().startsWith("Compte Pinboard actuel (t8g) : 0 résultat · 1 mot enregistré"),
        items()[0] + " | " + sr());
    } finally {
      if (!hadChrome) delete window.chrome;
      else if (prevI18n === undefined) delete chrome.i18n; else chrome.i18n = prevI18n;
      _pbpVocabFlashStatus = real.flash;
      pbpVocabCurrentOwner = real.owner;
      pbpVocabBatchSetStatus = real.setStatus;
      _pbpVocabReloadAfterMutation = real.reload;
      t = realT;
      if (hadLang) window.uiLangToBCP47 = prevLang; else delete window.uiLangToBCP47;
      _vocabCurrentOwner = saved.owner;
      _vocabOwnerLabel = saved.label;
      pane.classList.toggle("vocab-signed-out", wasSignedOut);
      show(saved.rows);
    }
  }
  document.title = fail ? "FAIL library-vocab Tests" : "PASS library-vocab Tests";
})();
</script></body></html>
