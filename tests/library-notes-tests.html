<!doctype html>
<html><head><meta charset="utf-8"><title>library-notes Tests</title>
<link rel="stylesheet" href="../library.css">
<style>
body{font-family:monospace;padding:16px}.case{padding:5px;border-bottom:1px solid #ddd}.pass{color:#176}.fail{color:#b00}
/* Stands in for the <=860px media query's back-button rule; scoped to the one
   test that needs it (the runner cannot resize the viewport, and focus() on a
   display:none element is a no-op). */
body.test-narrow-back .notes-detail-back{display:inline-flex}
/* Shrinks the wide layout's scroll cap on the reading pane so the fixture's
   short highlights actually overflow it. library.css caps the pane at roughly
   the viewport height and lets it scroll; the fixture never fills 650px, so
   without this the pane is a scroll container on paper only. Scoped to the one
   test that needs a real scrollTop, same convention as the rule above. */
body.test-scroll-pane #notes-detail-pane{max-height:60px;overflow-y:auto}
</style></head>
<body>
<!-- notes-workbench two-pane skeleton, copied from library.html (minus the
     data-i18n* attributes a script-driven fixture never reads and minus the
     page chrome around it -- header/tabs/vocab view). Offscreen, not
     display:none, so getComputedStyle-based checks still measure real layout
     (same convention tests/library-vocab-tests.html uses). -->
<div id="view-notes" style="position:fixed;left:-9999px;top:0;width:960px">
  <div class="notes-workbench">
    <div class="notes-list-pane">
      <div class="notes-toolbar">
        <input type="search" id="notes-filter" aria-label="Filter highlights and notes" />
        <span id="notes-count" class="notes-count" aria-live="polite"></span>
        <div id="notes-color-filters" class="notes-color-filters" role="group" aria-label="Filter highlights by color"></div>
      </div>
      <div class="lib-cluster" role="group" aria-label="Selection actions">
        <button type="button" class="btn ghost" id="notes-select-all">Select all</button>
      </div>
      <div class="notes-list-region">
        <div id="notes-list" role="grid" aria-multiselectable="true" aria-label="Saved highlights"></div>
        <p id="notes-empty" class="notes-empty" hidden></p>
        <!-- Sibling of #notes-empty, never a child: that paragraph's text is
             rewritten on every render and would wipe this block's children. -->
        <div id="notes-scope-note" class="notes-empty vocab-account-empty" hidden>
          <p>Highlights and notes are stored on this device only.</p>
          <div class="vocab-account-actions">
            <a class="btn btn-sm" id="notes-open-backup-settings" href="../options.html#general">Open backup settings</a>
          </div>
        </div>
        <div class="notes-batch-bar" id="notes-batch-toolbar" role="group" aria-label="Actions for selected highlights">
          <span id="notes-selected-count" class="notes-count" aria-live="polite"></span>
          <button type="button" class="btn btn-sm" id="notes-invert-selection" aria-label="Invert selection"></button>
          <button type="button" class="btn btn-sm danger" id="notes-batch-delete" aria-label="Delete selected highlights"></button>
          <button type="button" class="btn btn-sm" id="notes-clear-selection" aria-label="Clear selection"></button>
        </div>
      </div>
    </div>
    <aside class="notes-detail-pane" id="notes-detail-pane" aria-label="Notes">
      <div class="notes-detail-empty" id="notes-detail-empty">Select a highlight on the left to read it.</div>
      <div class="notes-detail" id="notes-detail" hidden></div>
    </aside>
  </div>
</div>
<div id="results"></div>
<script>
function t(key, ...values) { return key + (values.length ? ":" + values.join(",") : ""); }
</script>
<script>
// chrome.storage.local mock. get(null) is the only read library-notes.js does,
// and remove() is its only write; both mirror the real promise API.
const store = {
  "pbp_hl_alpha": { v: 1, url: "https://alpha.example/post", title: "Alpha article", items: [
    { id: "a1", n: 1, quote: "first alpha highlight", color: 1, note: "", ts: 500 },
    { id: "a2", n: 2, quote: "second alpha highlight about beta", color: 3, note: "note on a2", ts: 400 },
    { id: "a3", n: 3, quote: "third alpha <script>alert(1)<\/script> highlight", color: 2, note: "", ts: 300 },
  ] },
  "pbp_hl_beta": { v: 1, url: "https://beta.example/x", title: "Beta article", items: [
    { id: "b1", n: 1, quote: "beta only highlight", color: 5, note: "beta note", ts: 600 },
  ] },
  // No url/title: the "unknown page" record shape older highlights still have.
  "pbp_hl_orphan": { v: 1, items: [
    { id: "c1", n: 1, quote: "orphan highlight", color: 4, note: "", ts: 200 },
  ] },
  // Hostile href: must never reach an <a href>.
  "pbp_hl_evil": { v: 1, url: "javascript:alert(1)", title: "Evil page", items: [
    { id: "e1", n: 1, quote: "evil highlight", color: 1, note: "", ts: 100 },
  ] },
  "pbp_hl_last_color": 3, // reserved key: never a row
};
// library-notes.js registers its storage listeners at script-load time, and an
// account switch carries no pbp_hl_ write -- the onChanged event IS the only
// route into that path, so the mock has to be able to deliver one.
const onChangedListeners = [];
window.chrome = {
  storage: {
    local: {
      // get(null) is the panel's full scan; get("<key>") is the batch
      // delete's re-read immediately before it rewrites that one record.
      get: async (keys) => {
        if (keys === null) return { ...store };
        const key = String(keys);
        return key in store ? { [key]: store[key] } : {};
      },
      set: async (obj) => { Object.assign(store, obj); },
      remove: async (key) => { delete store[key]; },
    },
    onChanged: { addListener: (fn) => { onChangedListeners.push(fn); } },
  },
};
</script>
<script src="../shared.js"></script>
<script src="../vocab-store.js"></script>
<script src="../library-notes.js"></script>
<script>
const results = $id("results");
let pass = 0, fail = 0;
function check(name, condition, detail) {
  const row = document.createElement("div");
  const ok = !!condition;
  ok ? pass++ : fail++;
  row.className = "case " + (ok ? "pass" : "fail");
  row.textContent = (ok ? "PASS " : "FAIL ") + name + (ok ? "" : "\n  " + (detail || ""));
  results.appendChild(row);
}
const rowKeys = () => [...document.querySelectorAll("#notes-list .notes-hit")].map((el) => el.dataset.notesKey).join(",");
const rowEl = (key) => [...document.querySelectorAll("#notes-list .notes-hit")].find((el) => el.dataset.notesKey === key);
const detail = () => $id("notes-detail");
const tick = () => new Promise((resolve) => setTimeout(resolve, 0));
// Deleting a highlight now happens inside that record's cross-context Web Lock
// (library.html and every reader tab write the same pbp_hl_<page> key, and
// chrome.storage has no compare-and-swap). Acquiring a lock is a round trip to
// the browser process, so the write lands after an unpredictable number of task
// turns -- counting `await tick()`s is a coin flip (measured: 2 turns passed,
// 3 turns was flaky, and the flake looked like the delete never happening).
// Wait for the OUTCOME instead, with a ceiling so a path that never completes
// still fails its assertion rather than hanging the suite.
const settle = async (done) => {
  for (let i = 0; i < 300 && !done(); i++) await tick();
  await tick(); // the list rebuild that follows the write is microtasks; drain them
};
const fireStorageChange = (changes, area) => { for (const fn of onChangedListeners) fn(changes, area); };

(async () => {
  await renderNotesPanel();

  // ---- scan -> one row per highlight, newest first ----
  check("every stored highlight gets its own row, newest first",
    rowKeys() === "pbp_hl_beta#b1,pbp_hl_alpha#a1,pbp_hl_alpha#a2,pbp_hl_alpha#a3,pbp_hl_orphan#c1,pbp_hl_evil#e1",
    rowKeys());
  check("the reserved pbp_hl_last_color key never becomes a row",
    !rowKeys().includes("last_color"), rowKeys());
  check("#notes-list holds grid rows only (role=grid container purity)",
    $id("notes-list").children.length === 6 &&
    [...$id("notes-list").children].every((el) => el.getAttribute("role") === "row") &&
    $id("notes-empty").hidden === true);
  // The visible half stays the compact pair (.notes-toolbar is a fixed
  // three-column grid); the localized sentence rides in the .sr-only half, so
  // the live region announces words rather than "12 slash 340".
  const countCompact = () => $id("notes-count").querySelector(".notes-count-compact");
  const countSr = () => $id("notes-count").querySelector(".sr-only");
  check("the count line counts highlights, not pages", countCompact()?.textContent === "6 / 6",
    $id("notes-count").textContent);
  check("the count line announces a localized sentence instead of a bare number pair",
    countCompact()?.getAttribute("aria-hidden") === "true" &&
    countSr()?.textContent === "notesResultCount:6,6",
    $id("notes-count").innerHTML);
  check("a row shows the highlight text, its note and the source host",
    rowEl("pbp_hl_alpha#a2").textContent.includes("second alpha highlight about beta") &&
    rowEl("pbp_hl_alpha#a2").textContent.includes("highlight about beta \u2014 note on a2") &&
    rowEl("pbp_hl_alpha#a2").textContent.includes("alpha.example"),
    rowEl("pbp_hl_alpha#a2").textContent);
  check("a url-less record falls back to the unknown-page label",
    rowEl("pbp_hl_orphan#c1").textContent.includes("notesUnknownPage"),
    rowEl("pbp_hl_orphan#c1").textContent);
  check("the row's colour bar carries the highlight's colour class",
    rowEl("pbp_hl_alpha#a2").querySelector(".notes-hit-bar.notes-c3") &&
    rowEl("pbp_hl_beta#b1").querySelector(".notes-hit-bar.notes-c5"));
  check("nothing is selected before the first click",
    $id("notes-detail-empty").hidden === false && detail().hidden === true &&
    !document.querySelector("#notes-list .notes-hit[aria-current]"));

  // ---- row click -> detail pane ----
  rowEl("pbp_hl_alpha#a2").querySelector(".notes-hit-btn").click();
  check("clicking a row marks exactly one row current",
    document.querySelectorAll("#notes-list .notes-hit[aria-current]").length === 1 &&
    rowEl("pbp_hl_alpha#a2").hasAttribute("aria-current"));
  check("the detail pane replaces the empty state",
    $id("notes-detail-empty").hidden === true && detail().hidden === false);
  const source = detail().querySelector("a.notes-detail-source");
  check("the detail names the source page and links to it",
    source && source.getAttribute("href") === "https://alpha.example/post" &&
    source.textContent === "Alpha article" && source.target === "_blank" &&
    source.rel.includes("noopener"),
    source && source.outerHTML);
  check("the detail quotes the full highlight",
    detail().querySelector(".notes-detail-quote").textContent === "second alpha highlight about beta",
    detail().querySelector(".notes-detail-quote").textContent);
  check("the detail shows the note in full",
    detail().querySelector(".notes-detail-note").textContent === "note on a2");
  check("the detail offers the delete action", !!detail().querySelector(".notes-detail-delete"));
  check("the detail dates the highlight", !!detail().querySelector(".notes-detail-head .notes-meta-chip"));

  // ---- same-page siblings ----
  const sibs = () => [...detail().querySelectorAll(".notes-sib")];
  check("the same-page section lists the page's other highlights only",
    sibs().length === 2 &&
    sibs().every((b) => b.dataset.notesKey !== "pbp_hl_alpha#a2" && b.dataset.notesKey.startsWith("pbp_hl_alpha#")),
    sibs().map((b) => b.dataset.notesKey).join(","));
  sibs().find((b) => b.dataset.notesKey === "pbp_hl_alpha#a1").click();
  check("clicking a sibling switches the selection and the detail",
    _pbpNotesSelectedKey === "pbp_hl_alpha#a1" &&
    rowEl("pbp_hl_alpha#a1").hasAttribute("aria-current") &&
    document.querySelectorAll("#notes-list .notes-hit[aria-current]").length === 1 &&
    detail().querySelector(".notes-detail-quote").textContent === "first alpha highlight");
  check("a single-highlight page shows no same-page section", (() => {
    rowEl("pbp_hl_beta#b1").querySelector(".notes-hit-btn").click();
    return sibs().length === 0;
  })());

  // ---- switching entries resets the reading pane's scroll ----
  // The scroll container is #notes-detail-pane, not the #notes-detail div the
  // render replaces: replaceChildren is one atomic mutation, so the pane keeps
  // whatever scrollTop the previous highlight was left at and the next one
  // opens with its own source line and quote above the fold. `scrolled > 0`
  // is the anti-vacuity guard -- if the stand-in rule above ever stops making
  // the pane scrollable this fails instead of passing on a constant 0.
  document.body.classList.add("test-scroll-pane");
  rowEl("pbp_hl_alpha#a2").querySelector(".notes-hit-btn").click();
  const scrollPane = $id("notes-detail-pane");
  scrollPane.scrollTop = 40;
  const scrolled = scrollPane.scrollTop;
  rowEl("pbp_hl_alpha#a1").querySelector(".notes-hit-btn").click();
  check("rendering another highlight returns the reading pane to the top",
    scrolled > 0 && scrollPane.scrollTop === 0,
    "scrolled=" + scrolled + " after=" + scrollPane.scrollTop);
  // A REFRESH render of the SAME highlight must not:
  // _pbpNotesRefreshPreservingState re-renders the selected key on every
  // pbp_hl_ write an open reader makes (250ms debounce) and on every view
  // re-entry, and it restores window.scrollY and focus right afterwards.
  scrollPane.scrollTop = 40;
  const scrolledSame = scrollPane.scrollTop;
  _pbpNotesRenderDetail(_pbpNotesFindHit("pbp_hl_alpha#a1"));
  check("a refresh render of the same highlight keeps the reading position",
    scrolledSame > 0 && scrollPane.scrollTop === scrolledSame,
    "scrolled=" + scrolledSame + " after=" + scrollPane.scrollTop);
  document.body.classList.remove("test-scroll-pane");

  // ---- url-less and hostile-url records ----
  rowEl("pbp_hl_orphan#c1").querySelector(".notes-hit-btn").click();
  check("a url-less record renders no link and explains itself",
    !detail().querySelector("a.notes-detail-source") &&
    detail().querySelector("span.notes-detail-source") &&
    detail().textContent.includes("notesUnknownHint"));
  rowEl("pbp_hl_evil#e1").querySelector(".notes-hit-btn").click();
  check("a javascript: source url never reaches an href",
    !detail().querySelector("a[href^='javascript']") && !detail().querySelector("a.notes-detail-source"),
    detail().innerHTML.slice(0, 200));

  // ---- search marking (textContent-only construction) ----
  $id("notes-filter").value = "beta";
  $id("notes-filter").dispatchEvent(new Event("input"));
  check("search narrows to matching highlights (own text or its page title)",
    rowKeys() === "pbp_hl_beta#b1,pbp_hl_alpha#a2", rowKeys());
  check("the count line reports visible over total",
    countCompact()?.textContent === "2 / 6" && countSr()?.textContent === "notesResultCount:2,6",
    $id("notes-count").innerHTML);
  check("matches are marked in the list",
    rowEl("pbp_hl_alpha#a2").querySelector("mark") &&
    rowEl("pbp_hl_alpha#a2").querySelector("mark").textContent === "beta");
  rowEl("pbp_hl_alpha#a2").querySelector(".notes-hit-btn").click();
  check("matches are marked in the detail too",
    !!detail().querySelector(".notes-detail-quote mark"));
  $id("notes-filter").value = "script";
  $id("notes-filter").dispatchEvent(new Event("input"));
  const evilRow = rowEl("pbp_hl_alpha#a3");
  evilRow.querySelector(".notes-hit-btn").click();
  check("highlight text that looks like markup stays text in the list",
    evilRow.querySelectorAll("script, img, iframe, a").length === 0 &&
    evilRow.textContent.includes("<script>alert(1)<\/script>"),
    evilRow.innerHTML.slice(0, 200));
  check("highlight text that looks like markup stays text in the detail",
    !detail().querySelector("script") &&
    detail().querySelector(".notes-detail-quote").textContent === "third alpha <script>alert(1)<\/script> highlight" &&
    [...detail().querySelector(".notes-detail-quote").children].every((el) => el.tagName === "MARK"),
    detail().querySelector(".notes-detail-quote").innerHTML);
  $id("notes-filter").value = "";
  $id("notes-filter").dispatchEvent(new Event("input"));

  // ---- colour filter works per highlight, not per page ----
  const dots = [...$id("notes-color-filters").querySelectorAll(".notes-filter-dot")];
  check("the colour filter renders one toggle per highlight colour", dots.length === 5);
  // Icon-only buttons carry title AND aria-label (CLAUDE.md's icon contract):
  // the five 8px swatches are the whole visible content, so without a title
  // the "quote / definition / example / doubt / todo" meanings reach screen
  // readers only and a pointer user has to click each one to find out.
  check("every colour dot names its colour on hover, not only for screen readers",
    dots.length === 5 && dots.every((b) => b.title && b.title === b.getAttribute("aria-label")),
    dots.map((b) => (b.title || "(no title)")).join(","));
  dots[0].click(); // drop colour 1
  check("dropping a colour hides only that colour's highlights, not its whole page",
    !rowKeys().includes("pbp_hl_alpha#a1") && rowKeys().includes("pbp_hl_alpha#a2") &&
    !rowKeys().includes("pbp_hl_evil#e1"), rowKeys());
  dots[0].click(); // restore

  // ---- selection survives a refresh ----
  rowEl("pbp_hl_alpha#a2").querySelector(".notes-hit-btn").click();
  store["pbp_hl_gamma"] = { v: 1, url: "https://gamma.example/", title: "Gamma", items: [
    { id: "g1", n: 1, quote: "gamma highlight", color: 2, note: "", ts: 900 } ] };
  await _pbpNotesRefreshPreservingState();
  check("a background write is picked up by the refresh",
    rowKeys().startsWith("pbp_hl_gamma#g1"), rowKeys());
  // A delete's own storage write fires the debounced refresh 250ms later, so
  // the rebuild has to hand focus back to the row it was on.
  rowEl("pbp_hl_alpha#a3").querySelector(".notes-hit-btn").focus();
  await _pbpNotesRefreshPreservingState();
  check("a refresh keeps keyboard focus on the row it was on",
    document.activeElement === rowEl("pbp_hl_alpha#a3").querySelector(".notes-hit-btn"),
    document.activeElement && (document.activeElement.className || document.activeElement.tagName));
  check("the refresh restores the selected row and its detail",
    _pbpNotesSelectedKey === "pbp_hl_alpha#a2" &&
    rowEl("pbp_hl_alpha#a2").hasAttribute("aria-current") &&
    detail().hidden === false &&
    detail().querySelector(".notes-detail-quote").textContent === "second alpha highlight about beta");
  delete store["pbp_hl_gamma"];
  await _pbpNotesRefreshPreservingState();

  // ---- narrow mode ----
  const realNarrow = _pbpNotesNarrowMode;
  try {
    document.body.classList.add("test-narrow-back");
    _pbpNotesNarrowMode = () => true;
    rowEl("pbp_hl_alpha#a1").querySelector(".notes-hit-btn").click();
    check("selecting a row in narrow mode swaps the pane and hands over focus",
      document.body.classList.contains("lib-narrow-notes") &&
      document.activeElement === detail().querySelector(".notes-detail-back"),
      document.activeElement && (document.activeElement.className || document.activeElement.tagName));
    detail().querySelector(".notes-detail-back").click();
    check("the back button returns to the list and clears the selection",
      !document.body.classList.contains("lib-narrow-notes") &&
      $id("notes-detail-empty").hidden === false && detail().hidden === true &&
      !document.querySelector("#notes-list .notes-hit[aria-current]") &&
      _pbpNotesSelectedKey === null);
  } finally {
    _pbpNotesNarrowMode = realNarrow;
    document.body.classList.remove("test-narrow-back");
  }
  // The body class is set on every activation (same contract as the
  // vocabulary view's lib-narrow-detail: it is inert above 860px, so a later
  // resize into narrow mode still shows the detail the user opened). What
  // must hold at this harness's 1280px width is that BOTH panes stay on
  // screen -- the media query is what makes the class mean anything.
  rowEl("pbp_hl_alpha#a1").querySelector(".notes-hit-btn").click();
  check("a two-pane selection leaves the list on screen",
    getComputedStyle(document.querySelector(".notes-list-pane")).display !== "none" &&
    getComputedStyle($id("notes-detail-pane")).display !== "none");

  // ---- row grid navigation (#116), twin of the vocabulary list's ----
  {
    const btns = () => [...$id("notes-list").querySelectorAll(".notes-hit-btn")];
    const stops = () => btns().filter((el) => el.tabIndex === 0);
    check("a rendered list is one tab stop, not one per row",
      btns().length === 6 && stops().length === 1, String(stops().length));
    check("the tab stop sits on the row the reading pane is showing",
      stops()[0] === rowEl("pbp_hl_alpha#a1").querySelector(".notes-hit-btn"),
      stops()[0] && stops()[0].closest(".notes-hit").dataset.notesKey);
    const all = btns();
    all[0].focus();
    const press = (key, extra) => document.activeElement.dispatchEvent(
      new KeyboardEvent("keydown", Object.assign({ key, bubbles: true, cancelable: true }, extra || {})));
    press("ArrowDown");
    check("ArrowDown moves to the next row", document.activeElement === all[1]);
    check("the single tab stop follows the focused row",
      all[1].tabIndex === 0 && stops().length === 1);
    press("End");
    check("End jumps to the last row", document.activeElement === all[5]);
    press("ArrowDown");
    check("ArrowDown at the last row stays put rather than wrapping",
      document.activeElement === all[5]);
    press("Home");
    check("Home jumps back to the first row", document.activeElement === all[0]);
    press("ArrowUp");
    check("ArrowUp at the first row stays put rather than wrapping",
      document.activeElement === all[0]);
    check("navigation keys are swallowed so the page does not scroll under them",
      press("ArrowDown") === false && press("ArrowUp") === false);
    // Navigation must not have eaten the selection chords the row owns, and a
    // modified arrow must not navigate either.
    const held = _pbpNotesSelectedKey;
    all[0].focus();
    check("a modified ArrowDown is left to the row rather than navigating",
      press("ArrowDown", { shiftKey: true }) === true && document.activeElement === all[0]);
    check("navigation never opens a row", _pbpNotesSelectedKey === held);
    // K89: "/" jumps from a focused row back to the search filter, the same
    // gesture md-reader.js's "/" already offers inside the article.
    all[0].focus();
    $id("notes-filter").value = "seed";
    const slash = press("/");
    check("\"/\" focuses and selects the search filter from a row",
      document.activeElement === $id("notes-filter") &&
      $id("notes-filter").selectionStart === 0 &&
      $id("notes-filter").selectionEnd === "seed".length &&
      slash === false);
    all[1].focus();
    $id("notes-filter").value = "";
    const shiftSlash = press("/", { shiftKey: true });
    check("Shift+\"/\" (German/French layouts) still reaches the search filter",
      document.activeElement === $id("notes-filter") && shiftSlash === false);
    all[0].focus();
    const ctrlSlash = press("/", { ctrlKey: true });
    check("Ctrl+\"/\" is left alone and does not steal focus off the row",
      document.activeElement === all[0] && ctrlSlash === true);
    $id("notes-filter").value = "";
  }

  // ---- <mark> offsets stay inside the string they index (#25 twin) ----
  {
    const host = document.createElement("div");
    _pbpNotesMarkText(host, "aIİbi", "i");
    check("a case fold that changes length drops the marks instead of misplacing them",
      host.querySelectorAll("mark").length === 0 && host.textContent === "aIİbi",
      host.innerHTML);
    const plain = document.createElement("div");
    _pbpNotesMarkText(plain, "alpha beta", "beta");
    check("a length-preserving fold still marks the match",
      plain.querySelectorAll("mark").length === 1 &&
      plain.querySelector("mark").textContent === "beta" && plain.textContent === "alpha beta",
      plain.innerHTML);
  }

  // ---- batch selection: same grammar as the vocabulary list ----
  const rowsInOrder = () => [...document.querySelectorAll("#notes-list .notes-hit")];
  const btnOf = (key) => rowEl(key).querySelector(".notes-hit-btn");
  const mouse = (init) => new MouseEvent("click", { bubbles: true, cancelable: true, ...init });
  _pbpNotesClearSelection(); _pbpNotesSyncSelectionUi();
  check("the notes list declares itself a multi-selectable grid with grid rows",
    $id("notes-list").getAttribute("role") === "grid" &&
    $id("notes-list").getAttribute("aria-multiselectable") === "true" &&
    rowsInOrder().every((el) => el.getAttribute("role") === "row" &&
      el.getAttribute("aria-selected") === "false" &&
      el.querySelector('[role="gridcell"] > .notes-hit-btn')));
  check("the batch bar starts hidden", !$id("notes-batch-toolbar").classList.contains("selecting"));
  const currentBefore = _pbpNotesSelectedKey;
  btnOf("pbp_hl_alpha#a1").dispatchEvent(mouse({ ctrlKey: true }));
  check("Ctrl-click selects a highlight and reveals the batch bar",
    _notesSelected.size === 1 && rowEl("pbp_hl_alpha#a1").classList.contains("selected") &&
    rowEl("pbp_hl_alpha#a1").getAttribute("aria-selected") === "true" &&
    $id("notes-batch-toolbar").classList.contains("selecting"));
  check("Ctrl-click leaves the reading pane where it was", _pbpNotesSelectedKey === currentBefore);
  btnOf("pbp_hl_alpha#a3").dispatchEvent(mouse({ shiftKey: true }));
  check("Shift-click spans the interval in view order",
    _notesSelected.size === 3 && _notesSelected.has("pbp_hl_alpha#a2"));
  btnOf("pbp_hl_alpha#a1").dispatchEvent(mouse({ shiftKey: true }));
  check("Shift-click back over the same range clears it", _notesSelected.size === 0);
  const nKeySpan = new KeyboardEvent("keydown", { key: " ", ctrlKey: true, bubbles: true, cancelable: true });
  btnOf("pbp_hl_alpha#a1").dispatchEvent(nKeySpan);
  check("Ctrl+Space selects from the keyboard and swallows the activation",
    _notesSelected.size === 1 && nKeySpan.defaultPrevented);
  const nShiftSpan = new KeyboardEvent("keydown", { key: " ", shiftKey: true, bubbles: true, cancelable: true });
  btnOf("pbp_hl_alpha#a3").dispatchEvent(nShiftSpan);
  check("Shift+Space spans from the keyboard", _notesSelected.size === 3 && nShiftSpan.defaultPrevented);
  $id("notes-invert-selection").click();
  check("Invert flips the whole visible set", _notesSelected.size === 3 && !_notesSelected.has("pbp_hl_alpha#a1"));
  $id("notes-select-all").click();
  check("Select all takes every visible row", _notesSelected.size === rowsInOrder().length);
  $id("notes-clear-selection").click();
  check("Clear empties the selection and hides the bar",
    _notesSelected.size === 0 && !$id("notes-batch-toolbar").classList.contains("selecting") &&
    !document.querySelector("#notes-list .notes-hit.selected"));
  // A filter changes WHICH rows exist, so it clears the selection (the
  // vocabulary list's shipped rule).
  btnOf("pbp_hl_alpha#a1").dispatchEvent(mouse({ ctrlKey: true }));
  $id("notes-filter").value = "beta";
  $id("notes-filter").dispatchEvent(new Event("input"));
  check("a filter clears the batch selection", _notesSelected.size === 0);
  $id("notes-filter").value = "";
  $id("notes-filter").dispatchEvent(new Event("input"));

  // ---- batch delete: highlights, not whole pages ----
  // Failure first, while alpha still has three items: a page that keeps at
  // least one highlight goes through storage.set (a rewrite), and that is the
  // write being made to fail here. A swallowed failure looks exactly like
  // success, so the signal has to land somewhere still on screen.
  const realSet = chrome.storage.local.set;
  chrome.storage.local.set = async () => { throw new Error("quota"); };
  try {
    btnOf("pbp_hl_alpha#a1").dispatchEvent(mouse({ ctrlKey: true }));
    const failBtn = $id("notes-batch-delete");
    failBtn.click();
    document.querySelector(".confirm-popover .confirm-yes").click();
    await settle(() => !_notesBatchBusy);
    check("a failed batch delete marks the button that was pressed and keeps the row",
      failBtn.classList.contains("is-error") && rowKeys().includes("pbp_hl_alpha#a1"),
      failBtn.className + " | " + rowKeys());
    failBtn.classList.remove("is-error");
  } finally {
    chrome.storage.local.set = realSet;
  }
  _pbpNotesClearSelection(); _pbpNotesSyncSelectionUi();
  btnOf("pbp_hl_alpha#a1").dispatchEvent(mouse({ ctrlKey: true }));
  btnOf("pbp_hl_alpha#a3").dispatchEvent(mouse({ ctrlKey: true }));
  $id("notes-batch-delete").click();
  const batchPop = document.querySelector(".confirm-popover");
  check("batch delete asks first and counts the highlights, not the pages",
    batchPop && batchPop.querySelector(".confirm-msg").textContent.includes("notesBatchDeleteConfirm:2"),
    batchPop && batchPop.textContent);
  // Another tab writes a NEW highlight to the same page while the confirm is
  // on screen. The batch must rewrite from a fresh read, not from the scan
  // snapshot it is looping over -- a read-modify-write off the stale copy
  // discards this silently, and nothing on screen would ever say so.
  store["pbp_hl_alpha"] = { ...store["pbp_hl_alpha"], items: [...store["pbp_hl_alpha"].items,
    { id: "a4", n: 4, quote: "arrived from another tab mid-confirm", color: 2, note: "", ts: 350 }] };
  batchPop.querySelector(".confirm-yes").click();
  await settle(() => !_notesBatchBusy);
  check("a highlight written elsewhere during the confirm is not clobbered",
    store["pbp_hl_alpha"].items.some((it) => it.id === "a4") &&
    rowKeys().includes("pbp_hl_alpha#a4"),
    JSON.stringify(store["pbp_hl_alpha"].items.map((it) => it.id)));
  check("only the selected highlights are gone; their page survives",
    !rowKeys().includes("pbp_hl_alpha#a1") && !rowKeys().includes("pbp_hl_alpha#a3") &&
    rowKeys().includes("pbp_hl_alpha#a2"), rowKeys());
  check("the surviving highlights keep their stored page record intact",
    store["pbp_hl_alpha"] && store["pbp_hl_alpha"].items.length === 2 &&
    store["pbp_hl_alpha"].items.map((it) => it.id).join(",") === "a2,a4" &&
    store["pbp_hl_alpha"].title === "Alpha article",
    JSON.stringify(store["pbp_hl_alpha"]));
  check("the batch clears the selection and hides the bar afterwards",
    _notesSelected.size === 0 && !$id("notes-batch-toolbar").classList.contains("selecting"));
  // Emptying a page's last highlight removes the whole record -- the storage
  // shape has no "page with zero items" state.
  btnOf("pbp_hl_orphan#c1").dispatchEvent(mouse({ ctrlKey: true }));
  $id("notes-batch-delete").click();
  document.querySelector(".confirm-popover .confirm-yes").click();
  await settle(() => !_notesBatchBusy);
  check("deleting a page's last highlight drops the record itself",
    !("pbp_hl_orphan" in store) && !rowKeys().includes("pbp_hl_orphan"), rowKeys());
  _pbpNotesClearSelection(); _pbpNotesSyncSelectionUi();

  // ---- delete (page scope, confirm popover) ----
  rowEl("pbp_hl_alpha#a2").querySelector(".notes-hit-btn").click();
  const before = rowKeys().split(",");
  const deletePosition = before.indexOf("pbp_hl_alpha#a2");
  detail().querySelector(".notes-detail-delete").click();
  const popover = document.querySelector(".confirm-popover");
  check("delete asks first, naming the page it removes",
    popover && popover.querySelector(".confirm-msg").textContent.includes("Alpha article"),
    popover && popover.textContent);
  popover.querySelector(".confirm-yes").click();
  await settle(() => !rowKeys().includes("pbp_hl_alpha#"));
  check("confirming removes every row of that page",
    !rowKeys().includes("pbp_hl_alpha#"), rowKeys());
  check("the detail falls back to the empty state after its highlight is gone",
    detail().hidden === true && $id("notes-detail-empty").hidden === false &&
    _pbpNotesSelectedKey === null);
  check("focus lands on the neighbouring row, not <body>",
    document.activeElement === [...document.querySelectorAll("#notes-list .notes-hit-btn")][
      Math.min(deletePosition, document.querySelectorAll("#notes-list .notes-hit").length - 1)],
    document.activeElement && (document.activeElement.className || document.activeElement.tagName));

  // ---- refresh keeps focus inside the detail pane (narrow mode has no list
  //      to fall back to, so <body> there is a keyboard dead end) ----
  rowEl("pbp_hl_beta#b1").querySelector(".notes-hit-btn").click();
  detail().querySelector(".notes-detail-delete").focus();
  await _pbpNotesRefreshPreservingState();
  check("a refresh restores focus to the equivalent control in the detail",
    document.activeElement === detail().querySelector(".notes-detail-delete"),
    document.activeElement && (document.activeElement.className || document.activeElement.tagName));

  // ---- delete failure that cannot be pinned to a row falls back to the
  //      button the user pressed ----
  const realRemove = chrome.storage.local.remove;
  chrome.storage.local.remove = async () => { throw new Error("quota"); };
  try {
    $id("notes-filter").value = "orphan"; // hides the selected row from the list
    $id("notes-filter").dispatchEvent(new Event("input"));
    check("the selected row is not rendered while filtered out", !rowEl("pbp_hl_beta#b1"));
    const failBtn = detail().querySelector(".notes-detail-delete");
    failBtn.click();
    document.querySelector(".confirm-popover .confirm-yes").click();
    await settle(() => failBtn.classList.contains("is-error"));
    check("a delete failure with no visible row marks the button that was pressed",
      failBtn.classList.contains("is-error") &&
      !document.querySelector("#notes-list .notes-hit.is-error"),
      failBtn.className);
  } finally {
    chrome.storage.local.remove = realRemove;
    $id("notes-filter").value = "";
    $id("notes-filter").dispatchEvent(new Event("input"));
  }

  // ---- the page delete is owner-scoped, like the batch delete ----
  // Two accounts highlighting the same page share ONE pbp_hl_ record: the key
  // is owner-free and md-highlight stamps `owner` per item. The scan hides the
  // other account's item and the confirm counts only what this account can
  // see, so the delete may not take that item with it.
  store["pbp_hl_shared"] = { v: 1, url: "https://shared.example/p", title: "Shared page", items: [
    { id: "s1", n: 1, quote: "highlight from this account", color: 1, note: "", ts: 800 },
    { id: "s2", n: 2, quote: "highlight from another account", color: 2, note: "", ts: 700, owner: "acct_other" },
  ] };
  await renderNotesPanel();
  check("an item owned by another account never becomes a row",
    rowKeys().includes("pbp_hl_shared#s1") && !rowKeys().includes("pbp_hl_shared#s2"), rowKeys());
  rowEl("pbp_hl_shared#s1").querySelector(".notes-hit-btn").click();
  detail().querySelector(".notes-detail-delete").click();
  document.querySelector(".confirm-popover .confirm-yes").click();
  await settle(() => !rowKeys().includes("pbp_hl_shared#"));
  check("deleting a page keeps the highlights this account cannot see",
    store["pbp_hl_shared"] && Array.isArray(store["pbp_hl_shared"].items) &&
    store["pbp_hl_shared"].items.length === 1 && store["pbp_hl_shared"].items[0].id === "s2" &&
    store["pbp_hl_shared"].title === "Shared page",
    JSON.stringify(store["pbp_hl_shared"]));
  check("deleting a page still clears this account's rows for it",
    !rowKeys().includes("pbp_hl_shared#"), rowKeys());
  // ...and a page nobody else has touched still loses its whole record: the
  // storage shape has no "page with zero items" state.
  store["pbp_hl_solo"] = { v: 1, url: "https://solo.example/p", title: "Solo page", items: [
    { id: "o1", n: 1, quote: "sole highlight", color: 1, note: "", ts: 750 } ] };
  await renderNotesPanel();
  rowEl("pbp_hl_solo#o1").querySelector(".notes-hit-btn").click();
  detail().querySelector(".notes-detail-delete").click();
  document.querySelector(".confirm-popover .confirm-yes").click();
  await settle(() => !("pbp_hl_solo" in store));
  check("deleting a page with no foreign items drops the record itself",
    !("pbp_hl_solo" in store) && !rowKeys().includes("pbp_hl_solo"), rowKeys());

  // ---- an account switch clears the reading pane, not just the list ----
  await renderNotesPanel();
  rowEl("pbp_hl_beta#b1").querySelector(".notes-hit-btn").click();
  check("a highlight is open before the account switch",
    detail().hidden === false && _pbpNotesSelectedKey === "pbp_hl_beta#b1");
  fireStorageChange({ pinboardToken: { oldValue: "one", newValue: "two" } }, "sync");
  check("an account switch empties the reading pane at once",
    detail().hidden === true && $id("notes-detail-empty").hidden === false &&
    _pbpNotesSelectedKey === null &&
    !document.querySelector("#notes-list .notes-hit[aria-current]"),
    detail().hidden + " | " + _pbpNotesSelectedKey);
  check("an account switch drops the previous account's rows before the rescan",
    $id("notes-list").children.length === 0, rowKeys());
  await settle(() => rowKeys().includes("pbp_hl_beta#b1"));
  check("the rescan repopulates the list and leaves the reading pane closed",
    rowKeys().includes("pbp_hl_beta#b1") && detail().hidden === true, rowKeys());

  // ---- a confirm popover that outlives the account it was opened over ----
  // The popover is a body child: an account switch clears the reading pane
  // (and with it the delete button), but nothing removes the popover, so Yes
  // is still answerable -- and by then the owner filter would name the NEXT
  // account's items on that page, which the confirm sentence never counted.
  const realOwnerFn = window.pbpVocabCurrentOwner;
  let stubbedOwner = "acct_one";
  window.pbpVocabCurrentOwner = async () => stubbedOwner;
  try {
    store["pbp_hl_switch"] = { v: 1, url: "https://switch.example/p", title: "Switch page", items: [
      { id: "w1", n: 1, quote: "highlight owned by the first account", color: 1, note: "", ts: 900, owner: "acct_one" },
      { id: "w2", n: 2, quote: "highlight owned by the second account", color: 2, note: "", ts: 850, owner: "acct_two" },
    ] };
    _notesOwnerCache = null;
    await renderNotesPanel();
    check("only the signed-in account's item on a shared page becomes a row",
      rowKeys().includes("pbp_hl_switch#w1") && !rowKeys().includes("pbp_hl_switch#w2"), rowKeys());
    rowEl("pbp_hl_switch#w1").querySelector(".notes-hit-btn").click();
    detail().querySelector(".notes-detail-delete").click();
    const staleYes = document.querySelector(".confirm-popover .confirm-yes");
    stubbedOwner = "acct_two";
    fireStorageChange({ pinboardToken: { oldValue: "one", newValue: "two" } }, "sync");
    staleYes.click();
    await settle(() => $id("notes-status").textContent.trim().length > 0);
    check("answering a confirm opened by the previous account deletes nothing",
      store["pbp_hl_switch"] && store["pbp_hl_switch"].items.length === 2 &&
      store["pbp_hl_switch"].items.map((it) => it.id).join(",") === "w1,w2",
      JSON.stringify(store["pbp_hl_switch"]));
    check("...and says so, instead of failing silently",
      $id("notes-status").textContent.includes("vocabSelectionChanged"),
      $id("notes-status").className + " | " + $id("notes-status").textContent);
  } finally {
    window.pbpVocabCurrentOwner = realOwnerFn;
    delete store["pbp_hl_switch"];
    _notesOwnerCache = null;
    _pbpNotesSetStatus("");
    await renderNotesPanel();
  }

  // ---- a storage read failure is not painted as "nothing saved yet" ----
  await renderNotesPanel();
  const rowsBeforeFailure = rowKeys();
  _pbpNotesSetStatus("");
  const realGet = chrome.storage.local.get;
  chrome.storage.local.get = async () => { throw new Error("io"); };
  try {
    await renderNotesPanel();
    check("a failed scan keeps the rows that were already read",
      rowKeys() === rowsBeforeFailure && rowsBeforeFailure.length > 0, rowKeys());
    check("a failed scan never writes the onboarding empty state",
      $id("notes-empty").hidden === true, $id("notes-empty").textContent);
    check("a failed scan reports the failure in the status live region",
      $id("notes-status") && $id("notes-status").classList.contains("bad") &&
      $id("notes-status").textContent.trim().length > 0,
      $id("notes-status") && ($id("notes-status").className + " | " + $id("notes-status").textContent));
  } finally {
    chrome.storage.local.get = realGet;
  }
  await renderNotesPanel();
  check("a successful re-read retires the read-failure sentence",
    $id("notes-status").textContent.trim() === "" && !$id("notes-status").classList.contains("bad"),
    $id("notes-status").className + " | " + $id("notes-status").textContent);
  // ...but only its own: a delete failure writes into the same region AFTER
  // re-rendering, and the pbp_hl_ debounce re-scans behind it.
  _pbpNotesSetStatus(t("notesDeleteFailed"));
  await renderNotesPanel();
  check("a successful re-read leaves a sentence it did not write alone",
    $id("notes-status").textContent.includes("notesDeleteFailed"),
    $id("notes-status").className + " | " + $id("notes-status").textContent);
  _pbpNotesSetStatus("");

  // ---- the grid says it is loading while the scan is in flight ----
  // #vocab-list has reported aria-busy since its own loading state landed
  // (library-vocab.js's _pbpVocabSetLoading). This grid is its twin, and an
  // empty grid mid-scan is indistinguishable from "nothing saved" without it.
  {
    const realGet = chrome.storage.local.get;
    let busyDuringScan = null;
    chrome.storage.local.get = async (keys) => {
      busyDuringScan = $id("notes-list").getAttribute("aria-busy");
      return realGet(keys);
    };
    try {
      await renderNotesPanel();
    } finally {
      chrome.storage.local.get = realGet;
    }
    check("the grid reports aria-busy while the storage scan is in flight",
      busyDuringScan === "true", String(busyDuringScan));
    check("the grid clears aria-busy once the rows are rendered",
      $id("notes-list").getAttribute("aria-busy") === "false",
      String($id("notes-list").getAttribute("aria-busy")));
  }

  // ---- render cap + Load more, the vocabulary list's contract ----
  {
    _pbpNotesClearSelection();
    for (const key of Object.keys(store)) delete store[key];
    store["pbp_hl_many"] = { v: 1, url: "https://many.example/p", title: "Many page",
      items: Array.from({ length: 150 }, (_, i) => (
        { id: "m" + i, n: i + 1, quote: "highlight number " + i, color: 1, note: "", ts: 100000 - i })) };
    $id("notes-filter").value = "";
    await renderNotesPanel();
    const rows = () => [...document.querySelectorAll("#notes-list .notes-hit")];
    const more = () => $id("notes-load-more");
    const stops = () => rows().filter((r) => r.querySelector(".notes-hit-btn").tabIndex === 0);
    check("a long list renders the first batch only, not every hit",
      rows().length === 100, String(rows().length));
    check("the rest is offered through a Load more button in the vocabulary family",
      !!more() && more().classList.contains("btn") && more().classList.contains("btn-sm") &&
      more().textContent === "vocabLoadMore:50" &&
      more().previousElementSibling === $id("notes-list"),
      more() ? more().outerHTML : "(no button)");
    check("the count line still reports every hit, not just the rendered ones",
      countCompact()?.textContent === "150 / 150", $id("notes-count").textContent);
    check("Select all takes every matching highlight, not just the rendered ones", (() => {
      $id("notes-select-all").click();
      const size = _notesSelected.size;
      _pbpNotesClearSelection(); _pbpNotesSyncSelectionUi();
      return size === 150 && rows().length === 100;
    })(), _notesSelected.size + " selected over " + rows().length + " rows");
    const firstAppended = rows().length;
    if (more()) { more().focus(); more().click(); }
    check("Load more appends the rest and retires itself",
      firstAppended === 100 && rows().length === 150 && !more(),
      firstAppended + " -> " + rows().length + " rows");
    check("the last Load more hands the roving tab stop to the first row it appended",
      document.activeElement === rows()[firstAppended]?.querySelector(".notes-hit-btn") &&
      stops().length === 1 && stops()[0] === rows()[firstAppended],
      document.activeElement && (document.activeElement.className || document.activeElement.tagName));
    // One flatten+sort per render: the caller's visible set, the toolbar total
    // and the selection sync each used to rebuild and re-sort every highlight
    // of every page, on every keystroke.
    const realHits = _pbpNotesHits;
    let flattens = 0;
    _pbpNotesHits = (...args) => { flattens++; return realHits(...args); };
    try {
      $id("notes-filter").value = "highlight number";
      $id("notes-filter").dispatchEvent(new Event("input"));
    } finally {
      _pbpNotesHits = realHits;
    }
    check("a filter keystroke flattens the highlight set once, not once per consumer",
      flattens === 1, String(flattens));
    check("a filter resets the render depth to the first batch",
      rows().length === 100 && !!more(), rows().length + " rows");
    $id("notes-filter").value = "";
    $id("notes-filter").dispatchEvent(new Event("input"));
    _pbpNotesClearSelection(); _pbpNotesSyncSelectionUi();
  }

  // ---- empty states ----
  $id("notes-filter").value = "zzz-no-match";
  $id("notes-filter").dispatchEvent(new Event("input"));
  check("a filter with no hits says so, outside the role=list container",
    $id("notes-empty").hidden === false && $id("notes-empty").textContent.includes("notesFilterEmpty") &&
    $id("notes-list").children.length === 0,
    $id("notes-empty").textContent);
  // The scope disclosure answers "where did my highlights go", so it belongs
  // to the no-highlights-at-all state only: with a filter running the user
  // plainly has some and the sentence would be noise.
  check("a filtered-to-nothing list keeps the storage-scope note out of the way",
    $id("notes-scope-note").hidden === true);
  $id("notes-filter").value = "";
  for (const key of Object.keys(store)) delete store[key];
  await renderNotesPanel();
  check("an empty store shows the onboarding empty state",
    $id("notes-empty").hidden === false && $id("notes-empty").textContent.includes("notesEmpty") &&
    $id("notes-list").children.length === 0 && !rowKeys(), $id("notes-empty").textContent);
  check("an empty store also discloses that highlights never leave this device",
    $id("notes-scope-note").hidden === false &&
    $id("notes-scope-note").querySelector("#notes-open-backup-settings"),
    String($id("notes-scope-note").hidden));

  document.title = fail ? "FAIL library-notes Tests" : "PASS library-notes Tests";
})();
</script></body></html>
