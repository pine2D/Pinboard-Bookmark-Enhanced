<!doctype html>
<html><head><meta charset="utf-8"><title>library-notes Tests</title>
<link rel="stylesheet" href="../library.css">
<style>
body{font-family:monospace;padding:16px}.case{padding:5px;border-bottom:1px solid #ddd}.pass{color:#176}.fail{color:#b00}
/* Stands in for the <=860px media query's back-button rule; scoped to the one
   test that needs it (the runner cannot resize the viewport, and focus() on a
   display:none element is a no-op). */
body.test-narrow-back .notes-detail-back{display:inline-flex}
/* Shrinks the wide layout's scroll cap on the reading pane so the fixture's
   short highlights actually overflow it. library.css caps the pane at roughly
   the viewport height and lets it scroll; the fixture never fills 650px, so
   without this the pane is a scroll container on paper only. Scoped to the one
   test that needs a real scrollTop, same convention as the rule above. */
body.test-scroll-pane #notes-detail-pane{max-height:60px;overflow-y:auto}
/* T8: a pane tall enough to hold several excerpts and still scroll, for the
   same-page jump check (the excerpt must be fully visible before the jump). */
body.test-scroll-pane-tall #notes-detail-pane{height:360px;max-height:360px;overflow-y:auto}
body.test-scroll-region .notes-list-region{max-height:60px;overflow-y:auto}
/* Stands in for the <=860px rule that takes the list pane off screen while the
   detail is open (narrow round trip; the runner cannot resize the viewport). */
body.test-narrow-hide.lib-narrow-notes .notes-list-pane{display:none}
</style></head>
<body>
<!-- notes-workbench two-pane skeleton, copied from library.html (minus the
     data-i18n* attributes a script-driven fixture never reads and minus the
     page chrome around it -- header/tabs/vocab view). Offscreen, not
     display:none, so getComputedStyle-based checks still measure real layout
     (same convention tests/library-vocab-tests.html uses). -->
<div id="view-notes" style="position:fixed;left:-9999px;top:0;width:960px">
  <div class="notes-workbench">
    <div class="notes-list-pane">
      <div class="notes-toolbar">
        <input type="search" id="notes-filter" aria-label="Filter highlights and notes" />
      </div>
      <div id="notes-color-filters" class="notes-color-filters" role="group" aria-label="Filter highlights by color" hidden></div>
      <div class="lib-count-row" id="notes-context-bar">
        <span id="notes-count" class="notes-count" aria-live="polite"></span>
        <div class="lib-cluster" role="group" aria-label="Selection actions">
          <button type="button" class="btn btn-sm ghost lib-hang-end" id="notes-select-all">Select all</button>
        </div>
      </div>
      <div class="notes-batch-bar" id="notes-batch-toolbar" role="group" aria-label="Actions for selected highlights">
        <span id="notes-selected-count" class="notes-count" aria-live="polite"></span>
        <button type="button" class="btn btn-sm ghost" id="notes-batch-select-all">Select all</button>
        <span class="lib-cluster">
          <button type="button" class="btn btn-sm ghost" id="notes-invert-selection" aria-label="Invert selection"></button>
          <button type="button" class="btn btn-sm danger ghost" id="notes-batch-delete" aria-label="Delete selected highlights"></button>
          <button type="button" class="btn btn-sm ghost" id="notes-clear-selection" aria-label="Clear selection"></button>
        </span>
        <span class="lib-batch-status"></span>
      </div>
      <div class="notes-list-region">
        <div id="notes-list" role="grid" aria-multiselectable="true" aria-label="Saved highlights"></div>
        <p id="notes-empty" class="notes-empty" hidden></p>
        <!-- Sibling of #notes-empty, never a child: that paragraph's text is
             rewritten on every render and would wipe this block's children. -->
        <div id="notes-scope-note" class="notes-empty vocab-account-empty" hidden>
          <p>Highlights and notes are stored on this device only.</p>
          <div class="vocab-account-actions">
            <a class="btn btn-sm" id="notes-open-backup-settings" href="../options.html#general">Open backup settings</a>
          </div>
        </div>
      </div>
    </div>
    <aside class="notes-detail-pane" id="notes-detail-pane" aria-label="Notes">
      <div class="lib-cover" id="notes-detail-empty">
        <h2 class="lib-cover-title lib-first-line">Notes</h2>
        <p class="lib-cover-lead" id="notes-cover-lead"></p>
        <p class="lib-cover-hint">Pick a highlight from the list to read it in full.</p>
      </div>
      <div class="notes-sheet" id="notes-detail" hidden></div>
    </aside>
  </div>
</div>
<div id="results"></div>
<script>
function t(key, ...values) { return key + (values.length ? ":" + values.join(",") : ""); }
</script>
<script>
// chrome.storage.local mock. get(null) is the only read library-notes.js does,
// and remove() is its only write; both mirror the real promise API.
const store = {
  "pbp_hl_alpha": { v: 1, url: "https://alpha.example/post", title: "Alpha article", items: [
    { id: "a1", n: 1, quote: "first alpha highlight", color: 1, note: "", ts: 500 },
    { id: "a2", n: 2, quote: "second alpha highlight about beta", color: 3, note: "note on a2", ts: 400 },
    { id: "a3", n: 3, quote: "third alpha <script>alert(1)<\/script> highlight", color: 2, note: "", ts: 300 },
  ] },
  "pbp_hl_beta": { v: 1, url: "https://beta.example/x", title: "Beta article", items: [
    { id: "b1", n: 1, quote: "beta only highlight", color: 5, note: "beta note", ts: 600 },
  ] },
  // No url/title: the "unknown page" record shape older highlights still have.
  "pbp_hl_orphan": { v: 1, items: [
    { id: "c1", n: 1, quote: "orphan highlight", color: 4, note: "", ts: 200 },
  ] },
  // Hostile href: must never reach an <a href>.
  "pbp_hl_evil": { v: 1, url: "javascript:alert(1)", title: "Evil page", items: [
    { id: "e1", n: 1, quote: "evil highlight", color: 1, note: "", ts: 100 },
  ] },
  "pbp_hl_last_color": 3, // reserved key: never a row
};
// library-notes.js registers its storage listeners at script-load time, and an
// account switch carries no pbp_hl_ write -- the onChanged event IS the only
// route into that path, so the mock has to be able to deliver one.
const onChangedListeners = [];
window.chrome = {
  storage: {
    local: {
      // get(null) is the panel's full scan; get("<key>") is the batch
      // delete's re-read immediately before it rewrites that one record.
      get: async (keys) => {
        if (keys === null) return { ...store };
        const key = String(keys);
        return key in store ? { [key]: store[key] } : {};
      },
      set: async (obj) => { Object.assign(store, obj); },
      remove: async (key) => { delete store[key]; },
    },
    onChanged: { addListener: (fn) => { onChangedListeners.push(fn); } },
  },
};
</script>
<script src="../shared.js"></script>
<script src="../vocab-store.js"></script>
<script src="../library-notes.js"></script>
<script src="../library.js"></script>
<script>
const results = $id("results");
let pass = 0, fail = 0;
function check(name, condition, detail) {
  const row = document.createElement("div");
  const ok = !!condition;
  ok ? pass++ : fail++;
  row.className = "case " + (ok ? "pass" : "fail");
  row.textContent = (ok ? "PASS " : "FAIL ") + name + (ok ? "" : "\n  " + (detail || ""));
  results.appendChild(row);
}
const rowKeys = () => [...document.querySelectorAll("#notes-list .notes-hit")].map((el) => el.dataset.notesKey).join(",");
const rowEl = (key) => [...document.querySelectorAll("#notes-list .notes-hit")].find((el) => el.dataset.notesKey === key);
const detail = () => $id("notes-detail");
// Two page deletes exist from T8d on (the "this page" column's and the
// footer's); exactly one is displayed at any width.
const visibleDelete = () => [...detail().querySelectorAll(".notes-detail-delete")].find((b) => b.offsetParent !== null) || null;
const tick = () => new Promise((resolve) => setTimeout(resolve, 0));
// Deleting a highlight now happens inside that record's cross-context Web Lock
// (library.html and every reader tab write the same pbp_hl_<page> key, and
// chrome.storage has no compare-and-swap). Acquiring a lock is a round trip to
// the browser process, so the write lands after an unpredictable number of task
// turns -- counting `await tick()`s is a coin flip (measured: 2 turns passed,
// 3 turns was flaky, and the flake looked like the delete never happening).
// Wait for the OUTCOME instead, with a ceiling so a path that never completes
// still fails its assertion rather than hanging the suite.
const settle = async (done) => {
  for (let i = 0; i < 300 && !done(); i++) await tick();
  await tick(); // the list rebuild that follows the write is microtasks; drain them
};
const fireStorageChange = (changes, area) => { for (const fn of onChangedListeners) fn(changes, area); };

(async () => {
  // ---- colour toggles before the first count: hidden (no cold frame of six
  // empty toggles, the vocabulary status toggles' rule), yet every colour
  // toggle already carries its name -- an icon-only button is never nameless.
  _pbpNotesBuildColorFilters();
  const coldToggles = [...$id("notes-color-filters").querySelectorAll('.lib-toggle:not([data-color="all"])')];
  check("before the first count the colour toggles are hidden yet already named",
    $id("notes-color-filters").hidden === true && getComputedStyle($id("notes-color-filters")).display === "none" &&
    coldToggles.length === 5 &&
    coldToggles.every((b, i) => b.title === PBP_NOTES_COLOR_KEYS[i] && b.getAttribute("aria-label") === b.title),
    coldToggles.map((b) => b.title + "/" + b.getAttribute("aria-label")).join(" "));
  await renderNotesPanel();
  check("the first render with highlights shows the colour toggles",
    $id("notes-color-filters").hidden === false && getComputedStyle($id("notes-color-filters")).display === "flex");
  await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  check("loading library.js into this harness never arms the page's motion gate",
    !document.documentElement.classList.contains("motion-ready"));

  // ---- scan -> one row per highlight, newest first ----
  check("every stored highlight gets its own row, newest first",
    rowKeys() === "pbp_hl_beta#b1,pbp_hl_alpha#a1,pbp_hl_alpha#a2,pbp_hl_alpha#a3,pbp_hl_orphan#c1,pbp_hl_evil#e1",
    rowKeys());
  check("the reserved pbp_hl_last_color key never becomes a row",
    !rowKeys().includes("last_color"), rowKeys());
  check("#notes-list holds grid rows only (role=grid container purity)",
    $id("notes-list").children.length === 6 &&
    [...$id("notes-list").children].every((el) => el.getAttribute("role") === "row") &&
    $id("notes-empty").hidden === true);
  // The count row (spec §3.5): compact items for the eye, the localized
  // sentence (plus the 7/30-day gain) in the .sr-only half for the live region.
  const countItems = () => [...$id("notes-count").querySelectorAll(".lib-count-item")].map((el) => el.textContent).join("|");
  const countSr = () => $id("notes-count").querySelector(".sr-only");
  check("the count row counts highlights and pages, not just pages",
    countItems() === "libraryStatsHighlights:6|libraryStatsPages:4|libraryStatsRecent7:0", countItems());
  check("the count row announces a localized sentence instead of a bare number pair",
    $id("notes-count").querySelector(".lib-count-items")?.getAttribute("aria-hidden") === "true" &&
    !!countSr()?.textContent.startsWith("notesResultCount:6,6 \u00b7 libraryStatsRecent:"),
    $id("notes-count").innerHTML);
  check("a row shows the highlight text, its note and the source host",
    rowEl("pbp_hl_alpha#a2").textContent.includes("second alpha highlight about beta") &&
    rowEl("pbp_hl_alpha#a2").textContent.includes("highlight about beta \u2014 note on a2") &&
    rowEl("pbp_hl_alpha#a2").textContent.includes("alpha.example"),
    rowEl("pbp_hl_alpha#a2").textContent);
  check("a url-less record falls back to the unknown-page label",
    rowEl("pbp_hl_orphan#c1").textContent.includes("notesUnknownPage"),
    rowEl("pbp_hl_orphan#c1").textContent);
  check("the row's colour is a decorative 10px dot, named for screen readers inside the row",
    !!rowEl("pbp_hl_alpha#a2").querySelector(".notes-hit-dot.notes-c3[aria-hidden='true']") &&
    !!rowEl("pbp_hl_beta#b1").querySelector(".notes-hit-dot.notes-c5") &&
    rowEl("pbp_hl_alpha#a2").querySelector(".notes-hit-body > .sr-only")?.textContent === "hlColorExample" &&
    !rowEl("pbp_hl_alpha#a2").querySelector(".notes-hit-bar"));
  check("a highlight's note sits on its own line, after a pencil icon",
    !!rowEl("pbp_hl_alpha#a2").querySelector(".notes-hit-body > .notes-hit-note > svg") &&
    rowEl("pbp_hl_alpha#a2").querySelector(".notes-hit-note")?.textContent === "note on a2" &&
    !rowEl("pbp_hl_alpha#a2").querySelector(".notes-hit-text .notes-hit-note") &&
    !rowEl("pbp_hl_alpha#a1").querySelector(".notes-hit-note"));
  check("the row dates the highlight with pbpLibFormatDay",
    typeof pbpLibFormatDay === "function" &&
    rowEl("pbp_hl_alpha#a2").querySelector(".notes-hit-meta > .notes-meta-chip:last-child")?.textContent === pbpLibFormatDay(400));
  check("pbpNotesStats counts highlights, distinct pages and the 7 / 30-day gain",
    typeof pbpNotesStats === "function" && (() => {
      const NOW = 100 * 86400000;
      const s = pbpNotesStats([
        { row: { key: "p1" }, ts: NOW - 1 }, { row: { key: "p1" }, ts: NOW - 8 * 86400000 },
        { row: { key: "p2" }, ts: NOW - 31 * 86400000 },
      ], NOW);
      return s.highlights === 3 && s.pages === 2 && s.added7 === 1 && s.added30 === 2 && s.latestTs === NOW - 1 &&
        pbpNotesStats([], NOW).latestTs === 0;
    })());
  check("nothing is selected before the first click",
    $id("notes-detail-empty").hidden === false && detail().hidden === true &&
    !document.querySelector("#notes-list .notes-hit[aria-current]"));

  // ---- row click -> detail pane ----
  rowEl("pbp_hl_alpha#a2").querySelector(".notes-hit-btn").click();
  check("clicking a row marks exactly one row current",
    document.querySelectorAll("#notes-list .notes-hit[aria-current]").length === 1 &&
    rowEl("pbp_hl_alpha#a2").hasAttribute("aria-current"));
  check("the detail pane replaces the empty state",
    $id("notes-detail-empty").hidden === true && detail().hidden === false);
  const source = detail().querySelector(".notes-detail-source a.notes-detail-link");
  check("the detail names the source page and links to it",
    source && source.getAttribute("href") === "https://alpha.example/post" &&
    source.textContent === "Alpha article" && source.target === "_blank" &&
    source.rel.includes("noopener"),
    source && source.outerHTML);
  check("a linked source carries exactly one decorative external-link icon",
    source && source.querySelectorAll(".ext-icon").length === 1 &&
    source.querySelector(".ext-icon").getAttribute("aria-hidden") === "true",
    source && source.outerHTML);
  const currentQuote = () => detail().querySelector('.notes-excerpt[aria-current="true"] .notes-excerpt-quote');
  check("the detail quotes the full highlight",
    currentQuote()?.textContent === "second alpha highlight about beta",
    currentQuote()?.textContent);
  check("the detail shows the note in full",
    detail().querySelector('.notes-excerpt[aria-current="true"] .notes-excerpt-note-text')?.textContent === "note on a2");
  check("the detail offers the delete action", !!visibleDelete());
  check("the detail dates the page",
    detail().querySelector(".notes-detail-head .notes-meta-day")?.textContent === pbpLibFormatDay(500),
    detail().querySelector(".notes-detail-head .notes-detail-meta")?.textContent);

  // ---- the page's other highlights, as excerpts ----
  const sibs = () => [...detail().querySelectorAll(".notes-excerpt-jump")];
  check("the detail lays out every highlight of the page, the open one as the current excerpt",
    detail().querySelectorAll(".notes-excerpt").length === 3 && sibs().length === 2 &&
    sibs().every((b) => b.dataset.notesKey !== "pbp_hl_alpha#a2" && b.dataset.notesKey.startsWith("pbp_hl_alpha#")),
    sibs().map((b) => b.dataset.notesKey).join(","));
  sibs().find((b) => b.dataset.notesKey === "pbp_hl_alpha#a1")?.click();
  check("clicking another excerpt switches the selection and the detail",
    _pbpNotesSelectedKey === "pbp_hl_alpha#a1" &&
    rowEl("pbp_hl_alpha#a1").hasAttribute("aria-current") &&
    document.querySelectorAll("#notes-list .notes-hit[aria-current]").length === 1 &&
    currentQuote()?.textContent === "first alpha highlight");
  check("a single-highlight page is one excerpt and no jump buttons", (() => {
    rowEl("pbp_hl_beta#b1").querySelector(".notes-hit-btn").click();
    return detail().querySelectorAll(".notes-excerpt").length === 1 && sibs().length === 0;
  })());

  // ---- switching entries resets the reading pane's scroll ----
  // The scroll container is #notes-detail-pane, not the #notes-detail div the
  // render replaces: replaceChildren is one atomic mutation, so the pane keeps
  // whatever scrollTop the previous highlight was left at and the next one
  // opens with its own source line and quote above the fold. `scrolled > 0`
  // is the anti-vacuity guard -- if the stand-in rule above ever stops making
  // the pane scrollable this fails instead of passing on a constant 0.
  document.body.classList.add("test-scroll-pane");
  rowEl("pbp_hl_alpha#a2").querySelector(".notes-hit-btn").click();
  const scrollPane = $id("notes-detail-pane");
  scrollPane.scrollTop = 40;
  const scrolled = scrollPane.scrollTop;
  rowEl("pbp_hl_beta#b1").querySelector(".notes-hit-btn").click();
  check("rendering a highlight of another page returns the reading pane to the top",
    scrolled > 0 && scrollPane.scrollTop === 0,
    "scrolled=" + scrolled + " after=" + scrollPane.scrollTop);
  // A REFRESH render of the SAME highlight must not:
  // _pbpNotesRefreshPreservingState re-renders the selected key on every
  // pbp_hl_ write an open reader makes (250ms debounce) and on every view
  // re-entry, and it restores the list region's scrollTop and focus right afterwards.
  scrollPane.scrollTop = 40;
  const scrolledSame = scrollPane.scrollTop;
  _pbpNotesRenderDetail(_pbpNotesFindHit("pbp_hl_beta#b1"));
  check("a refresh render of the same highlight keeps the reading position",
    scrolledSame > 0 && scrollPane.scrollTop === scrolledSame,
    "scrolled=" + scrolledSame + " after=" + scrollPane.scrollTop);
  document.body.classList.remove("test-scroll-pane");

  // ---- url-less and hostile-url records ----
  rowEl("pbp_hl_orphan#c1").querySelector(".notes-hit-btn").click();
  check("a url-less record renders no link and explains itself",
    !detail().querySelector("a.notes-detail-link") &&
    detail().querySelector("h2.notes-detail-source")?.textContent === "notesUnknownPage" &&
    detail().querySelector(".notes-detail-head .notes-unknown-hint")?.textContent === "notesUnknownHint");
  check("the plain-text title fallback carries no external-link icon",
    detail().querySelectorAll(".notes-detail-source .ext-icon").length === 0);
  rowEl("pbp_hl_evil#e1").querySelector(".notes-hit-btn").click();
  check("a javascript: source url never reaches an href",
    !detail().querySelector("a[href^='javascript']") && !detail().querySelector("a.notes-detail-link"),
    detail().innerHTML.slice(0, 200));

  // ---- T8: one page read as a continuous excerpt flow (spec 2026-10-03
  //      library-redesign §5; Review Focus 1, 4, 5) ----
  {
    const nextFrame = () => new Promise((resolve) => requestAnimationFrame(() => resolve()));
    const frames = async () => { await nextFrame(); await nextFrame(); };
    const pane = $id("notes-detail-pane");
    const paneC = () => { const cs = getComputedStyle(pane); return pane.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight); };
    const fixtureWidth = (px) => { $id("view-notes").style.width = px + "px"; };
    const excerpts = () => [...detail().querySelectorAll(":scope > .notes-excerpt")];
    const idOf = (el) => String(el.dataset.notesKey || "").split("#")[1];
    const excerptOf = (id) => excerpts().find((s) => idOf(s) === id) || null;
    const labelOf = (id) => excerptOf(id)?.querySelector(".notes-excerpt-label") || null;
    const today = new Date();
    const at = (dayOffset, h, m) => new Date(today.getFullYear(), today.getMonth(), today.getDate() + dayOffset, h, m).getTime();
    const lastYear = new Date(today.getFullYear() - 1, 5, 1, 10, 0).getTime();
    const pageTs = at(0, 0, 10);
    const day = (ts) => pbpLibFormatDay(ts), time = (ts) => pbpLibFormatTime(ts);
    const realT = t;
    // Stored order deliberately differs from time order; x5 has no ts of its
    // own; x4 and x3 share one; x2 sits just before midnight the day before;
    // x1 is from last year.
    store["pbp_hl_times"] = { v: 1, url: "https://times.example/page", title: "Times page", items: [
      { id: "x6", n: 1, quote: "latest of the page", color: 1, note: "", ts: at(0, 0, 10) },
      { id: "x4", n: 2, quote: "tie stored first", color: 2, note: "", ts: at(0, 0, 7) },
      { id: "x1", n: 3, quote: "from last year", color: 3, note: "", ts: lastYear },
      { id: "x5", n: 4, quote: "no own timestamp", color: 4, note: "has a note" },
      { id: "x3", n: 5, quote: "tie stored second", color: 5, note: "", ts: at(0, 0, 7) },
      { id: "x2", n: 6, quote: "just before midnight", color: 1, note: "", ts: at(-1, 23, 58), side: "tr", lang: "de" },
    ] };
    store["pbp_hl_longtitle"] = { v: 1, url: "https://long.example/t", title: "A".repeat(120), items: [
      { id: "l1", n: 1, quote: "a page whose title has no break opportunity", color: 2, note: "", ts: at(0, 9, 0) },
    ] };
    await renderNotesPanel();
    _pbpNotesSelectRow("pbp_hl_times#x6");

    // -- order and labels (Review Focus 5) --
    check("a page's excerpts run oldest first, whatever order storage holds them in",
      excerpts().map(idOf).join(",") === "x1,x2,x4,x3,x6,x5", excerpts().map(idOf).join(","));
    check("two highlights saved at the same instant keep their stored order",
      excerpts().findIndex((s) => idOf(s) === "x4") < excerpts().findIndex((s) => idOf(s) === "x3"));
    check("a highlight from the page's own day is labelled with its time only",
      !!labelOf("x6") && !labelOf("x6").querySelector(".notes-excerpt-date") &&
      labelOf("x6").querySelector(".notes-excerpt-time")?.textContent === time(pageTs), labelOf("x6")?.outerHTML);
    check("a highlight with no timestamp of its own borrows the page's last one",
      !!labelOf("x5") && !labelOf("x5").querySelector(".notes-excerpt-date") &&
      labelOf("x5").querySelector(".notes-excerpt-time")?.textContent === time(pageTs), labelOf("x5")?.outerHTML);
    check("a highlight from another day writes the day and the time as two spans",
      labelOf("x2")?.querySelector(".notes-excerpt-date")?.textContent === day(at(-1, 23, 58)) &&
      labelOf("x2")?.querySelector(".notes-excerpt-time")?.textContent === time(at(-1, 23, 58)), labelOf("x2")?.outerHTML);
    check("a highlight from another year carries the year in its day",
      !!labelOf("x1")?.querySelector(".notes-excerpt-date")?.textContent.includes(String(today.getFullYear() - 1)),
      labelOf("x1")?.outerHTML);
    check("every label ends with the colour's dot and the colour's name",
      excerpts().length === 6 && excerpts().every((s) => {
        const item = store["pbp_hl_times"].items.find((it) => it.id === idOf(s));
        const c = s.querySelector(".notes-excerpt-label > .notes-excerpt-color");
        return !!c && c.querySelector(".notes-hit-dot.notes-c" + item.color)?.getAttribute("aria-hidden") === "true" &&
          c.querySelector(".notes-excerpt-color-name")?.textContent === PBP_NOTES_COLOR_KEYS[item.color - 1];
      }));
    let localeThrew = null;
    try {
      window.uiLangToBCP47 = () => "not a tag!!";
      _pbpNotesSelectRow("pbp_hl_times#x2");
      window.uiLangToBCP47 = () => { throw new RangeError("bad tag"); };
      _pbpNotesSelectRow("pbp_hl_times#x6");
    } catch (e) { localeThrew = e; } finally { delete window.uiLangToBCP47; }
    check("a malformed or throwing UI language never breaks the labels",
      !localeThrew && excerpts().length === 6 && (labelOf("x2")?.querySelector(".notes-excerpt-time")?.textContent || "").length > 0,
      String(localeThrew));

    // -- the current excerpt and the highlighter --
    check("exactly the opened highlight is the current excerpt, quoted in a blockquote; the others are jump buttons",

  try {
    $id("notes-filter").value = "orphan"; // hides the selected row from the list
    $id("notes-filter").dispatchEvent(new Event("input"));
    check("the selected row is not rendered while filtered out", !rowEl("pbp_hl_beta#b1"));
    const failBtn = visibleDelete();
    failBtn.click();
    document.querySelector(".confirm-popover .confirm-yes").click();
    await settle(() => failBtn.classList.contains("is-error"));
    check("a delete failure with no visible row marks the button that was pressed",
      failBtn.classList.contains("is-error") &&
      !document.querySelector("#notes-list .notes-hit.is-error"),
      failBtn.className);
  } finally {
    chrome.storage.local.remove = realRemove;
    $id("notes-filter").value = "";
    $id("notes-filter").dispatchEvent(new Event("input"));
  }

  // ---- the page delete is owner-scoped, like the batch delete ----
  // Two accounts highlighting the same page share ONE pbp_hl_ record: the key
  // is owner-free and md-highlight stamps `owner` per item. The scan hides the
  // other account's item and the confirm counts only what this account can
  // see, so the delete may not take that item with it.
  store["pbp_hl_shared"] = { v: 1, url: "https://shared.example/p", title: "Shared page", items: [
    { id: "s1", n: 1, quote: "highlight from this account", color: 1, note: "", ts: 800 },
    { id: "s2", n: 2, quote: "highlight from another account", color: 2, note: "", ts: 700, owner: "acct_other" },
  ] };
  await renderNotesPanel();
  check("an item owned by another account never becomes a row",
    rowKeys().includes("pbp_hl_shared#s1") && !rowKeys().includes("pbp_hl_shared#s2"), rowKeys());
  rowEl("pbp_hl_shared#s1").querySelector(".notes-hit-btn").click();
  visibleDelete().click();
  document.querySelector(".confirm-popover .confirm-yes").click();
  await settle(() => !rowKeys().includes("pbp_hl_shared#"));
  check("deleting a page keeps the highlights this account cannot see",
    store["pbp_hl_shared"] && Array.isArray(store["pbp_hl_shared"].items) &&
    store["pbp_hl_shared"].items.length === 1 && store["pbp_hl_shared"].items[0].id === "s2" &&
    store["pbp_hl_shared"].title === "Shared page",
    JSON.stringify(store["pbp_hl_shared"]));
  check("deleting a page still clears this account's rows for it",
    !rowKeys().includes("pbp_hl_shared#"), rowKeys());
  // ...and a page nobody else has touched still loses its whole record: the
  // storage shape has no "page with zero items" state.
  store["pbp_hl_solo"] = { v: 1, url: "https://solo.example/p", title: "Solo page", items: [
    { id: "o1", n: 1, quote: "sole highlight", color: 1, note: "", ts: 750 } ] };
  await renderNotesPanel();
  rowEl("pbp_hl_solo#o1").querySelector(".notes-hit-btn").click();
  visibleDelete().click();
  document.querySelector(".confirm-popover .confirm-yes").click();
  await settle(() => !("pbp_hl_solo" in store));
  check("deleting a page with no foreign items drops the record itself",
    !("pbp_hl_solo" in store) && !rowKeys().includes("pbp_hl_solo"), rowKeys());

  // ---- an account switch clears the reading pane, not just the list ----
  await renderNotesPanel();
  rowEl("pbp_hl_beta#b1").querySelector(".notes-hit-btn").click();
  check("a highlight is open before the account switch",
    detail().hidden === false && _pbpNotesSelectedKey === "pbp_hl_beta#b1");
  _notesActiveColors = new Set([2]);
  // The list region goes back to the top on an account switch (spec §7.6).
  // Counted, not just read: emptying the list would clamp scrollTop to 0 on
  // its own, so a bare scrollTop check could not catch a missing reset.
  document.body.classList.add("test-scroll-region");
  const switchRegion = document.querySelector(".notes-list-region");
  switchRegion.scrollTop = 40;
  const switchBefore = switchRegion.scrollTop;
  const realSwitchReset = _pbpNotesResetListScroll;
  let switchResets = 0;
  _pbpNotesResetListScroll = () => { switchResets++; return realSwitchReset(); };
  try {
    fireStorageChange({ pinboardToken: { oldValue: "one", newValue: "two" } }, "sync");
  } finally { _pbpNotesResetListScroll = realSwitchReset; }
  check("an account switch empties the reading pane at once",
    detail().hidden === true && $id("notes-detail-empty").hidden === false &&
    _pbpNotesSelectedKey === null &&
    !document.querySelector("#notes-list .notes-hit[aria-current]") &&
    !detail().querySelector(".notes-excerpt"),
    detail().hidden + " | " + _pbpNotesSelectedKey + " | excerpts=" + detail().querySelectorAll(".notes-excerpt").length);
  check("an account switch drops the previous account's rows before the rescan",
    $id("notes-list").children.length === 0, rowKeys());
  check("an account switch blanks the cover sentence until the new account's first count arrives",
    $id("notes-cover-lead").textContent === "", $id("notes-cover-lead").textContent);
  await settle(() => rowKeys().includes("pbp_hl_beta#b1"));
  check("the rescan repopulates the list and leaves the reading pane closed",
    rowKeys().includes("pbp_hl_beta#b1") && detail().hidden === true, rowKeys());
  check("an account switch puts the notes list region back at the top",
    switchBefore === 40 && switchResets >= 1 && switchRegion.scrollTop === 0,
    `before=${switchBefore} after=${switchRegion.scrollTop} resets=${switchResets}`);
  document.body.classList.remove("test-scroll-region");
  check("an account switch resets the colour filter to All",
    _notesActiveColors.size === 0 &&
    $id("notes-color-filters").querySelector('.lib-toggle[data-color="all"]')?.getAttribute("aria-pressed") === "true");

  // ---- a confirm popover that outlives the account it was opened over ----
  // The popover is a body child: an account switch clears the reading pane
  // (and with it the delete button), but nothing removes the popover, so Yes
  // is still answerable -- and by then the owner filter would name the NEXT
  // account's items on that page, which the confirm sentence never counted.
  const realOwnerFn = window.pbpVocabCurrentOwner;
  let stubbedOwner = "acct_one";
  window.pbpVocabCurrentOwner = async () => stubbedOwner;
  try {
    store["pbp_hl_switch"] = { v: 1, url: "https://switch.example/p", title: "Switch page", items: [
      { id: "w1", n: 1, quote: "highlight owned by the first account", color: 1, note: "", ts: 900, owner: "acct_one" },
      { id: "w2", n: 2, quote: "highlight owned by the second account", color: 2, note: "", ts: 850, owner: "acct_two" },
    ] };
    _notesOwnerCache = null;
    await renderNotesPanel();
    check("only the signed-in account's item on a shared page becomes a row",
      rowKeys().includes("pbp_hl_switch#w1") && !rowKeys().includes("pbp_hl_switch#w2"), rowKeys());
    rowEl("pbp_hl_switch#w1").querySelector(".notes-hit-btn").click();
    visibleDelete().click();
    const staleYes = document.querySelector(".confirm-popover .confirm-yes");
    stubbedOwner = "acct_two";
    fireStorageChange({ pinboardToken: { oldValue: "one", newValue: "two" } }, "sync");
    staleYes.click();
    await settle(() => $id("notes-status").textContent.trim().length > 0);
    check("answering a confirm opened by the previous account deletes nothing",
      store["pbp_hl_switch"] && store["pbp_hl_switch"].items.length === 2 &&
      store["pbp_hl_switch"].items.map((it) => it.id).join(",") === "w1,w2",
      JSON.stringify(store["pbp_hl_switch"]));
    check("...and says so, instead of failing silently",
      $id("notes-status").textContent.includes("vocabSelectionChanged"),
      $id("notes-status").className + " | " + $id("notes-status").textContent);
  } finally {
    window.pbpVocabCurrentOwner = realOwnerFn;
    delete store["pbp_hl_switch"];
    _notesOwnerCache = null;
    _pbpNotesSetStatus("");
    await renderNotesPanel();
  }

  // ---- the cover before any successful read says the read failed ----
  {
    const realGet = chrome.storage.local.get;
    _notesScanDone = false;
    chrome.storage.local.get = async () => { throw new Error("io"); };
    try { await renderNotesPanel(); } finally { chrome.storage.local.get = realGet; }
    check("a read failure before the first count puts the failure sentence on the cover",
      $id("notes-cover-lead").textContent === _pbpNotesLoadFailedText(), $id("notes-cover-lead").textContent);
    check("a cover saying the read failed hides the pick-a-highlight hint",
      $id("notes-detail-empty").querySelector(".lib-cover-hint")?.hidden === true);
    _pbpNotesSetStatus("");
    await renderNotesPanel();
  }

  // ---- a storage read failure is not painted as "nothing saved yet" ----
  await renderNotesPanel();
  const rowsBeforeFailure = rowKeys();
  _pbpNotesSetStatus("");
  const realGet = chrome.storage.local.get;
  chrome.storage.local.get = async () => { throw new Error("io"); };
  try {
    await renderNotesPanel();
    check("a failed scan keeps the rows that were already read",
      rowKeys() === rowsBeforeFailure && rowsBeforeFailure.length > 0, rowKeys());
    check("a failed scan never writes the onboarding empty state",
      $id("notes-empty").hidden === true, $id("notes-empty").textContent);
    check("a failed scan reports the failure in the status live region",
      $id("notes-status") && $id("notes-status").classList.contains("bad") &&
      $id("notes-status").textContent.trim().length > 0,
      $id("notes-status") && ($id("notes-status").className + " | " + $id("notes-status").textContent));
  } finally {
    chrome.storage.local.get = realGet;
  }
  await renderNotesPanel();
  check("a successful re-read retires the read-failure sentence",
    $id("notes-status").textContent.trim() === "" && !$id("notes-status").classList.contains("bad"),
    $id("notes-status").className + " | " + $id("notes-status").textContent);
  // ...but only its own: a delete failure writes into the same region AFTER
  // re-rendering, and the pbp_hl_ debounce re-scans behind it.
  _pbpNotesSetStatus(t("notesDeleteFailed"));
  await renderNotesPanel();
  check("a successful re-read leaves a sentence it did not write alone",
    $id("notes-status").textContent.includes("notesDeleteFailed"),
    $id("notes-status").className + " | " + $id("notes-status").textContent);
  _pbpNotesSetStatus("");

  // ---- the grid says it is loading while the scan is in flight ----
  // #vocab-list has reported aria-busy since its own loading state landed
  // (library-vocab.js's _pbpVocabSetLoading). This grid is its twin, and an
  // empty grid mid-scan is indistinguishable from "nothing saved" without it.
  {
    const realGet = chrome.storage.local.get;
    let busyDuringScan = null;
    chrome.storage.local.get = async (keys) => {
      busyDuringScan = $id("notes-list").getAttribute("aria-busy");
      return realGet(keys);
    };
    try {
      await renderNotesPanel();
    } finally {
      chrome.storage.local.get = realGet;
    }
    check("the grid reports aria-busy while the storage scan is in flight",
      busyDuringScan === "true", String(busyDuringScan));
    check("the grid clears aria-busy once the rows are rendered",
      $id("notes-list").getAttribute("aria-busy") === "false",
      String($id("notes-list").getAttribute("aria-busy")));
  }

  // ---- render cap + Load more, the vocabulary list's contract ----
  {
    _pbpNotesClearSelection();
    for (const key of Object.keys(store)) delete store[key];
    store["pbp_hl_many"] = { v: 1, url: "https://many.example/p", title: "Many page",
      items: Array.from({ length: 150 }, (_, i) => (
        { id: "m" + i, n: i + 1, quote: "highlight number " + i, color: 1, note: "", ts: 100000 - i })) };
    $id("notes-filter").value = "";
    await renderNotesPanel();
    const rows = () => [...document.querySelectorAll("#notes-list .notes-hit")];
    const more = () => $id("notes-load-more");
    const stops = () => rows().filter((r) => r.querySelector(".notes-hit-btn").tabIndex === 0);
    check("a long list renders the first batch only, not every hit",
      rows().length === 100, String(rows().length));
    check("the rest is offered through a Load more button in the vocabulary family",
      !!more() && more().classList.contains("btn") && more().classList.contains("btn-sm") &&
      more().textContent === "vocabLoadMore:50" &&
      more().previousElementSibling === $id("notes-list"),
      more() ? more().outerHTML : "(no button)");
    check("the count line still reports every hit, not just the rendered ones",
      countItems().startsWith("libraryStatsHighlights:150|"), countItems());
    check("Select all takes every matching highlight, not just the rendered ones", (() => {
      $id("notes-select-all").click();
      const size = _notesSelected.size;
      _pbpNotesClearSelection(); _pbpNotesSyncSelectionUi();
      return size === 150 && rows().length === 100;
    })(), _notesSelected.size + " selected over " + rows().length + " rows");
    const firstAppended = rows().length;
    if (more()) { more().focus(); more().click(); }
    check("Load more appends the rest and retires itself",
      firstAppended === 100 && rows().length === 150 && !more(),
      firstAppended + " -> " + rows().length + " rows");
    check("the last Load more hands the roving tab stop to the first row it appended",
      document.activeElement === rows()[firstAppended]?.querySelector(".notes-hit-btn") &&
      stops().length === 1 && stops()[0] === rows()[firstAppended],
      document.activeElement && (document.activeElement.className || document.activeElement.tagName));
    // One flatten+sort per render: the caller's visible set, the toolbar total
    // and the selection sync each used to rebuild and re-sort every highlight
    // of every page, on every keystroke.
    const realHits = _pbpNotesHits;
    let flattens = 0;
    _pbpNotesHits = (...args) => { flattens++; return realHits(...args); };
    try {
      $id("notes-filter").value = "highlight number";
      $id("notes-filter").dispatchEvent(new Event("input"));
    } finally {
      _pbpNotesHits = realHits;
    }
    check("a filter keystroke flattens the highlight set once, not once per consumer",
      flattens === 1, String(flattens));
    check("a filter resets the render depth to the first batch",
      rows().length === 100 && !!more(), rows().length + " rows");
    $id("notes-filter").value = "";
    $id("notes-filter").dispatchEvent(new Event("input"));
    _pbpNotesClearSelection(); _pbpNotesSyncSelectionUi();
  }

  // ---- empty states ----
  $id("notes-filter").value = "zzz-no-match";
  $id("notes-filter").dispatchEvent(new Event("input"));
  check("a filter with no hits says so, outside the role=list container",
    $id("notes-empty").hidden === false && $id("notes-empty").textContent.includes("notesFilterEmpty") &&
    $id("notes-list").children.length === 0,
    $id("notes-empty").textContent);
  // The scope disclosure answers "where did my highlights go", so it belongs
  // to the no-highlights-at-all state only: with a filter running the user
  // plainly has some and the sentence would be noise.
  check("a filtered-to-nothing list keeps the storage-scope note out of the way",
    $id("notes-scope-note").hidden === true);
  $id("notes-filter").value = "";
  for (const key of Object.keys(store)) delete store[key];
  await renderNotesPanel();
  check("an empty store shows the onboarding empty state",
    $id("notes-empty").hidden === false && $id("notes-empty").textContent.includes("notesEmpty") &&
    $id("notes-list").children.length === 0 && !rowKeys(), $id("notes-empty").textContent);
  check("an empty store also discloses that highlights never leave this device",
    $id("notes-scope-note").hidden === false &&
    $id("notes-scope-note").querySelector("#notes-open-backup-settings"),
    String($id("notes-scope-note").hidden));
  check("an empty store's cover says how to make a first highlight",
    $id("notes-cover-lead").textContent === "notesEmpty", $id("notes-cover-lead").textContent);
  check("an empty store's cover hides the pick-a-highlight hint -- there is nothing to pick",
    $id("notes-detail-empty").querySelector(".lib-cover-hint")?.hidden === true);
  check("a truly empty store never claims the boolean it did not earn",
    _notesHiddenByOwner === false, String(_notesHiddenByOwner));

  // ---- K157: the owner filter drops EVERY stored highlight (an account
  // switch or a revoked token, not a first-run user) -- the empty state must
  // say the data is hidden, not that there is none, and the "export a backup"
  // note (which points at the wrong fix entirely) must stay off screen. ----
  {
    const realOwnerFn2 = window.pbpVocabCurrentOwner;
    window.pbpVocabCurrentOwner = async () => "acct_me";
    try {
      store["pbp_hl_foreign"] = { v: 1, url: "https://foreign.example/p", title: "Foreign page", items: [
        { id: "f1", n: 1, quote: "highlight from a different account", color: 1, note: "", ts: 100, owner: "acct_other" },
      ] };
      _notesOwnerCache = null;
      await renderNotesPanel();
      check("a scan that owner-filters everything records that it happened",
        _notesHiddenByOwner === true, String(_notesHiddenByOwner));
      check("owner-filtered-to-zero explains itself instead of claiming there are no highlights",
        $id("notes-empty").hidden === false &&
        $id("notes-empty").textContent.includes("notesHiddenByOwner") &&
        !$id("notes-empty").textContent.includes("notesEmpty") &&
        $id("notes-list").children.length === 0 && !rowKeys(),
        $id("notes-empty").textContent);
      check("the storage-scope backup note is suppressed -- the data is hidden, not absent",
        $id("notes-scope-note").hidden === true,
        String($id("notes-scope-note").hidden));
      check("a cover over owner-hidden highlights says they are hidden, not absent",
        $id("notes-cover-lead").textContent === "notesHiddenByOwner", $id("notes-cover-lead").textContent);
      check("a cover over owner-hidden highlights hides the pick-a-highlight hint",
        $id("notes-detail-empty").querySelector(".lib-cover-hint")?.hidden === true);
    } finally {
      window.pbpVocabCurrentOwner = realOwnerFn2;
      delete store["pbp_hl_foreign"];
      _notesOwnerCache = null;
      await renderNotesPanel();
    }
  }
  check("restoring the real owner resolution clears the hidden-by-owner verdict",
    _notesHiddenByOwner === false, String(_notesHiddenByOwner));

  // K157 negative: the owner filter is guarded by `Array.isArray(rec.items)`,
  // so a record the scan cannot read is NOT evidence that another account owns
  // something. Claiming it would tell a first-run user their highlights are
  // hidden behind an account switch that never happened -- and hide the backup
  // note that is the correct advice for an actually-empty store.
  {
    const realOwnerFn3 = window.pbpVocabCurrentOwner;
    window.pbpVocabCurrentOwner = async () => "acct_me";
    try {
      store["pbp_hl_items_not_array"] = { v: 1, url: "https://x.example/a", title: "Not a list", items: { "0": { id: "z" } } };
      store["pbp_hl_items_missing"] = { v: 1, url: "https://x.example/b", title: "No items key" };
      store["pbp_hl_not_an_object"] = "a string where a record should be";
      store["pbp_hl_null"] = null;
      _notesOwnerCache = null;
      await renderNotesPanel();
      check("malformed records never set the hidden-by-owner flag",
        _notesHiddenByOwner === false, String(_notesHiddenByOwner));
      check("malformed records produce no rows and fall back to the ordinary empty state",
        $id("notes-empty").hidden === false &&
        $id("notes-empty").textContent.includes("notesEmpty") &&
        !$id("notes-empty").textContent.includes("notesHiddenByOwner") &&
        $id("notes-list").children.length === 0 && !rowKeys(),
        $id("notes-empty").textContent);
      check("and the storage-scope backup note is back on screen, since nothing is hidden",
        $id("notes-scope-note").hidden === false,
        String($id("notes-scope-note").hidden));
    } finally {
      window.pbpVocabCurrentOwner = realOwnerFn3;
      for (const k of ["pbp_hl_items_not_array", "pbp_hl_items_missing", "pbp_hl_not_an_object", "pbp_hl_null"]) delete store[k];
      _notesOwnerCache = null;
      await renderNotesPanel();
    }
  }

  // ---- Header fit, notes half (user ruling 10-04, library.js
  // pbpLibWireNotesHeaderFit): a colour row too narrow for its numbers shows
  // dots only, keeps one line, and keeps every count in title / aria-label;
  // the need is measured with the numbers showing, whichever form is up.
  {
    const fitFrames = () => new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    const host = document.createElement("div");
    const toggles = [1, 2, 3, 4, 5].map((c) =>
      `<button type="button" class="lib-toggle sm" data-color="${c}" aria-pressed="false" title="Colour ${c}: 2000" aria-label="Colour ${c}: 2000"><span class="notes-hit-dot notes-c${c}" aria-hidden="true"></span><span class="lib-toggle-count">2000</span></button>`).join("");
    host.innerHTML = `<div class="notes-list-pane" data-header-fit="wide" style="position:fixed;left:-9999px;top:0;width:520px">
      <div class="notes-color-filters" role="group"><button type="button" class="lib-toggle sm" data-color="all" aria-pressed="true">Wszystkie</button>${toggles}</div></div>`;
    document.body.appendChild(host);
    const pane = host.firstElementChild;
    const row = pane.querySelector(".notes-color-filters");
    const counts = () => [...row.querySelectorAll(".lib-toggle-count")];
    try {
      pbpLibWireNotesHeaderFit(pane);
      const need = pbpLibNotesColorNeed(row);
      check("notes header fit: room for the numbers keeps them", pane.dataset.headerFit === "wide" &&
        counts().every((n) => getComputedStyle(n).display !== "none"), `${need} ${pane.dataset.headerFit}`);
      pane.style.width = `${Math.floor(need) - 1}px`;
      await fitFrames();
      const r = row.getBoundingClientRect();
      const btns = [...row.children].map((b) => b.getBoundingClientRect());
      check("notes header fit: 1px short of the need -> dots only, one line, inside the pane, counts still named",
        pane.dataset.headerFit === "narrow" && counts().every((n) => getComputedStyle(n).display === "none") &&
        btns.every((b) => Math.abs(b.top - btns[0].top) < 0.5 && b.right <= r.right + 0.5) &&
        [...row.querySelectorAll('[data-color]:not([data-color="all"])')].every((b) => /2000/.test(b.title) && /2000/.test(b.getAttribute("aria-label"))),
        `${pane.dataset.headerFit} ${pane.style.width}`);
      check("notes header fit: a dot-only toggle keeps a >=24px square hit area",
        [...row.querySelectorAll('[data-color]:not([data-color="all"])')].every((b) => { const r = b.getBoundingClientRect(); return r.width >= 24 && r.height >= 24; }),
        [...row.querySelectorAll('[data-color]:not([data-color="all"])')].map((b) => { const r = b.getBoundingClientRect(); return `${r.width}x${r.height}`; }).join(" "));
      check("notes header fit: the need is measured with the numbers showing, in either form",
        Math.abs(pbpLibNotesColorNeed(row) - need) < 0.5 && pane.children.length === 1, String(pbpLibNotesColorNeed(row)));
      pane.style.width = `${Math.ceil(need)}px`;
      await fitFrames();
      check("notes header fit: widening back to the need brings the numbers back", pane.dataset.headerFit === "wide" &&
        counts().every((n) => getComputedStyle(n).display !== "none"), pane.dataset.headerFit);
      for (const n of counts()) n.textContent = "200000";
      await new Promise((resolve) => setTimeout(resolve, 0));
      check("notes header fit: bigger numbers are re-measured at once", pane.dataset.headerFit === "narrow", pane.dataset.headerFit);
    } finally {
      host.remove();
    }
  }

  document.title = fail ? "FAIL library-notes Tests" : "PASS library-notes Tests";
})();
</script></body></html>
