<!doctype html>
<html><head><meta charset="utf-8"><meta name="pbp-expected-count" content="21"><title>pinboard-style cloak gate tests</title>
<style>.case{font-family:monospace;white-space:pre}.pass{color:#176}.fail{color:#b00}</style>
</head><body>
<div id="results"></div>
<script>
// ============================================================
// Tests for pinboard-style.js FOUC cloak gate (F2)
//
// The cloak block is NOT loaded as a <script src> here because:
//   1. It runs at document_start and immediately mutates the DOM
//   2. It references chrome.storage (unavailable in node/headless)
//   3. It references PINBOARD_THEMES (not loaded here)
//
// Instead we test the extracted LOGIC (the gating predicate and the
// flag-write expression) as pure functions, which is what the brief
// prescribes for the warm-untestable cold-start path.
// ============================================================

const root = document.getElementById("results");
let pass = 0, fail = 0, skip = 0;

function check(name, cond, detail) {
  const ok = !!cond; ok ? pass++ : fail++;
  const div = document.createElement("div");
  div.className = "case " + (ok ? "pass" : "fail");
  div.textContent = `${ok ? "PASS" : "FAIL"}  ${name}${ok ? "" : "\n   " + (detail || "")}`;
  root.appendChild(div);
}
function skipCase(name, reason) {
  skip++;
  const div = document.createElement("div");
  div.className = "case";
  div.textContent = `SKIP  ${name}\n   ${reason}`;
  root.appendChild(div);
}

// ============================================================
// Extract the cloak-gate predicate and flag-write logic from
// the shipped pinboard-style.js source (read as text, parse out
// the two pieces, wrap in testable functions).
// ============================================================

// --- Cloak-gate predicate ---
// Shipped: _pbpHasTheme = localStorage.getItem("pbp_has_theme") === "1"
// We simulate this inline here:

function shouldCloak(localStorageValue) {
  // Mirrors the shipped gate logic exactly
  let _pbpHasTheme = false;
  try { _pbpHasTheme = localStorageValue === "1"; } catch (_) {}
  return _pbpHasTheme;
}

// --- Flag-write expression ---
// Shipped: _pbpThemed = !!(data.themePresetKey || data.customFont || overlay)
function computeThemed(data, overlay) {
  return !!(data.themePresetKey || data.customFont || overlay);
}

// ============================================================
// Assertion A — cloak gate returns correct booleans
// ============================================================
check("gate: absent flag → no cloak", shouldCloak(null) === false, "null → false");
check("gate: '0' flag → no cloak", shouldCloak("0") === false, "'0' → false");
check("gate: '' flag → no cloak", shouldCloak("") === false, "'' → false");
check("gate: '1' flag → cloak", shouldCloak("1") === true, "'1' → true");
check("gate: '2' flag → no cloak (only '1' is truthy)", shouldCloak("2") === false, "'2' → false");

// ============================================================
// Assertion B — flag-write expression is correct
// ============================================================
check("themed: themePresetKey set → flag=true",
  computeThemed({ themePresetKey: "dracula", customFont: "" }, "") === true);
check("themed: customFont set → flag=true",
  computeThemed({ themePresetKey: "", customFont: "Consolas" }, "") === true);
check("themed: overlay set → flag=true",
  computeThemed({ themePresetKey: "", customFont: "" }, "body { color: red }") === true);
check("themed: all empty → flag=false",
  computeThemed({ themePresetKey: "", customFont: "" }, "") === false);
check("themed: undefined themePresetKey → flag=false",
  computeThemed({ themePresetKey: undefined, customFont: "" }, "") === false);
check("themed: null overlay → flag=false",
  computeThemed({ themePresetKey: "", customFont: "" }, null) === false);
check("themed: both preset and font → flag=true",
  computeThemed({ themePresetKey: "nord", customFont: "SF Mono" }, "") === true);

// ============================================================
// Assertion C — DOM state: no #pbp-cloak injected when flag absent
//
// We simulate the cloak injection block inline (without chrome.storage
// or PINBOARD_THEMES). This confirms the DOM branching is correct.
// ============================================================
(function assertNoCloakWhenFlagAbsent() {
  // Simulate: localStorage has no flag → _pbpHasTheme = false → no cloak
  const localStorageValue = null; // absent
  let _pbpHasTheme = false;
  try { _pbpHasTheme = localStorageValue === "1"; } catch (_) {}
  let _pbpCloak = null;
  if (_pbpHasTheme) {
    _pbpCloak = document.createElement("style");
    _pbpCloak.id = "pbp-cloak";
    _pbpCloak.textContent = "html { opacity: 0 !important; }";
    document.head.appendChild(_pbpCloak);
  }
  check("DOM: no flag → #pbp-cloak NOT injected",
    document.getElementById("pbp-cloak") === null,
    "cloak element found in DOM when it should not be");
})();

(function assertCloakWhenFlagSet() {
  // Simulate: localStorage flag = "1" → _pbpHasTheme = true → cloak injected
  const localStorageValue = "1";
  let _pbpHasTheme = false;
  try { _pbpHasTheme = localStorageValue === "1"; } catch (_) {}
  let _pbpCloak = null;
  if (_pbpHasTheme) {
    _pbpCloak = document.createElement("style");
    _pbpCloak.id = "pbp-cloak-test";
    _pbpCloak.textContent = "html { opacity: 0 !important; }";
    document.head.appendChild(_pbpCloak);
  }
  const el = document.getElementById("pbp-cloak-test");
  check("DOM: flag='1' → #pbp-cloak IS injected", el !== null,
    "cloak element missing when flag was '1'");
  // cleanup
  if (el) el.remove();
})();

// ============================================================
// Assertion D — per-mode cloak cache: whatever the last render painted must
// be what the next cold load reads back.
//
// The read runs at document_start, where optTheme is not knowable yet, so it
// can only probe by the OS mode (osDark first, then the other key). The write
// happens after the theme applied, where the resolved mode folds optTheme in.
// The two quantities disagree exactly when the user pins an explicit
// light/dark against the opposite OS setting — so the write side has to make
// sure the probe cannot land on the other mode's stale colour.
// ============================================================
const CLOAK_BG_RE = /^rgba?\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*(?:,\s*(?:0|1|0?\.\d+)\s*)?\)$/;
const cloakKey = (isDark) => (isDark ? "pbp_cloak_bg_d" : "pbp_cloak_bg_l");

// document_start probe (mirrors the shipped read order)
function cloakProbe(store, osDark) {
  for (const key of [cloakKey(osDark), cloakKey(!osDark)]) {
    const cached = store[key] || "";
    if (CLOAK_BG_RE.test(cached)) return cached;
  }
  return "";
}
// post-render cache (mirrors the shipped write policy)
function cloakCache(store, optTheme, isDark, bg) {
  if (optTheme !== "auto") delete store[cloakKey(!isDark)];
  store[cloakKey(isDark)] = bg;
}

const LIGHT = "rgb(250, 249, 246)", DARK = "rgb(28, 27, 26)";
(function assertExplicitOverrideNeverReadsOppositeMode() {
  let worst = "";
  // Both keys already populated (an earlier auto-mode session cached each),
  // then the user pins an explicit mode. Every OS state must still read back
  // the colour that the pinned mode actually renders.
  for (const [optTheme, isDark, rendered] of [["light", false, LIGHT], ["dark", true, DARK]]) {
    for (const osDark of [true, false]) {
      const store = { pbp_cloak_bg_l: LIGHT, pbp_cloak_bg_d: DARK };
      cloakCache(store, optTheme, isDark, rendered);
      const got = cloakProbe(store, osDark);
      if (got !== rendered) worst = `optTheme=${optTheme} osDark=${osDark} read ${got}, rendered ${rendered}`;
    }
  }
  check("cloak cache: an explicit light/dark override is never read back as the opposite mode's colour",
    worst === "", worst);
})();
(function assertAutoModeKeepsBothModesCached() {
  const store = {};
  cloakCache(store, "auto", false, LIGHT); // a light-OS session
  cloakCache(store, "auto", true, DARK);   // then the OS flipped to dark
  check("cloak cache: auto mode keeps both modes, so an OS flip between loads still paints the right shade",
    cloakProbe(store, true) === DARK && cloakProbe(store, false) === LIGHT,
    `d=${cloakProbe(store, true)} l=${cloakProbe(store, false)}`);
})();

// ============================================================
// Assertion E — the shipped source implements the policies above.
// The mirrors in D define the behaviour; these bind pinboard-style.js to it,
// so the mirror cannot silently drift away from the file it describes.
// (Served over http by .qa-scan/run-test.mjs, so fetch resolves.)
// ============================================================
(async () => {
  const src = await (await fetch("../pinboard-style.js")).text();
  // Semantic slices, never source layout: these gates answer "does the shipped
  // file still carry the policy", so putting braces on a one-line `if`, or
  // moving a comment between two statements, must not make them red — a red
  // gate has to mean a behaviour regression, or it stops being believed.
  const cacheAt = src.indexOf("const cacheCloakBg");
  const cacheEnd = src.indexOf("};", cacheAt);
  // Both ends must be found, or the slice is empty and the check fails closed —
  // slice(at, -1) would otherwise hand it the whole rest of the file.
  const cacheBody = cacheAt === -1 || cacheEnd === -1 ? "" : src.slice(cacheAt, cacheEnd);
  check("#51 source: an explicit light/dark override drops the opposite mode's cloak key",
    cacheBody.includes('optTheme !== "auto"') && cacheBody.includes("removeItem(pbpCloakBgKey(!isDark))"),
    "cacheCloakBg still leaves the other mode's stale colour for the next cold load to find");
  const at = src.indexOf('.addEventListener("change"');
  const registration = at === -1 ? "" : src.slice(Math.max(0, at - 200), at);
  const handler = at === -1 ? "" : src.slice(at, at + 500);
  check("#110 source: auto mode follows an OS light/dark flip while the tab stays open",
    registration.includes('optTheme === "auto"') &&
    registration.includes('window.matchMedia("(prefers-color-scheme: dark)")'),
    "no matchMedia change listener — a parked pinboard.in tab keeps the old variant until reload");
  check("#110 source: the OS-flip re-apply re-runs the theme through applyTheme",
    handler.includes("isDark = !!e.matches") && handler.includes("applyTheme(isDark)"),
    "the flip handler does not re-resolve the mode and re-apply it");
  check("#110 source: the OS-flip re-apply re-keys the cloak cache to the mode now on screen",
    /cacheCloakBg\(\);/.test(handler),
    "after a flip the next cold load would paint the other mode's cached background");
  check("#110 source: applying a theme reuses the existing #pbp-injected node",
    /document\.getElementById\("pbp-injected"\)/.test(src),
    "a re-apply would stack a second style element instead of rewriting the first");

  const summary = document.createElement("div");
  summary.style.cssText = "margin-top:1em;font-family:monospace;font-weight:bold";
  summary.textContent = `pass=${pass} fail=${fail} skip=${skip} title="pinboard-style cloak gate tests"`;
  root.appendChild(summary);
})();

// ============================================================
// SKIP — cold-start visual timing (MANUAL-VERIFY on real device)
// ============================================================
skipCase(
  "MANUAL-VERIFY: un-themed cold Chrome → no blank flash",
  "Load pinboard.in with no theme on a real hi-DPI Windows machine (cold Chrome).\n" +
  "   Expected: page appears instantly with no opacity flash.\n" +
  "   DevTools assertion: document.getElementById('pbp-cloak') === null\n" +
  "   and localStorage.getItem('pbp_has_theme') !== '1'"
);
skipCase(
  "MANUAL-VERIFY: themed cold Chrome → no FOUC",
  "Enable a theme (e.g. Dracula), reload pinboard.in twice.\n" +
  "   Expected on second load: cloak applied, theme visible on paint.\n" +
  "   DevTools assertion: localStorage.getItem('pbp_has_theme') === '1'\n" +
  "   and #pbp-cloak was present at document_start (opacity 0 during theme load)"
);
skipCase(
  "MANUAL-VERIFY: OS light/dark flip re-themes an already-open pinboard.in tab",
  "Set extension appearance = Auto and site preset = Catppuccin (or Solarized / Flexoki).\n" +
  "   Open pinboard.in, leave the tab parked, then flip the OS between light and dark.\n" +
  "   Expected: the tab re-themes in place with no reload — one #pbp-injected node,\n" +
  "   rewritten (document.querySelectorAll('#pbp-injected').length === 1), and\n" +
  "   document.documentElement.classList.contains('pbp-dark') follows the OS.\n" +
  "   With appearance pinned to Light or Dark the same flip must change nothing."
);

// The summary row is appended by the async source-binding block above, once
// every assertion has landed.
</script>
</body></html>
