<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Background Active Tab Tests</title>
<style>
body { font-family: monospace; padding: 16px; max-width: 1000px; }
.case { padding: 4px 8px; margin: 4px 0; }
.pass { color: #0a0; background: #f0fff0; }
.fail { color: #c00; background: #fff0f0; font-weight: bold; }
</style></head>
<body>
<h1>Background Active Tab Tests</h1>
<div id="results"></div>
<script src="../shared.js"></script>
<script>
function assert(condition, message) {
  if (!condition) throw new Error(message || "assertion failed");
}

async function test(name, fn) {
  const div = document.createElement("div");
  div.className = "case";
  try {
    await fn();
    div.classList.add("pass");
    div.textContent = "PASS " + name;
  } catch (error) {
    div.classList.add("fail");
    div.textContent = "FAIL " + name + "\n  " + error.message;
  }
  document.getElementById("results").appendChild(div);
}

function buildHarness(source, queryTabs, bookmarkResult = true) {
  const start = source.indexOf("async function _getFocusedActiveTab");
  const end = source.indexOf("// ---- \u6807\u7b7e\u9875\u6fc0\u6d3b/\u66f4\u65b0\u65f6\u5237\u65b0\u56fe\u6807", start);
  assert(start >= 0 && end > start, "active-tab refresh helpers not found");

  const calls = { queries: [], schedule: [], activity: 0, checks: [], icons: [], mirrors: [], cacheReads: [] };
  let scheduledWork = Promise.resolve();
  const chrome = { tabs: { query: async (query) => {
    calls.queries.push(query);
    return [queryTabs.shift()];
  } } };
  const schedule = (tabId, fn, delay) => {
    calls.schedule.push({ tabId, delay });
    scheduledWork = fn();
  };
  const noteActivity = () => { calls.activity++; };
  // K0: debouncedCheck answers { bookmarked, target } -- `target` is the URL it
  // actually asked Pinboard about (the cleaned one whenever urlClean applies),
  // and it is the ONLY key the status cache holds that answer under. A
  // non-boolean bookmarkResult stands for the disabled/short-circuit path,
  // where debouncedCheck returns nothing at all.
  const debouncedCheck = async (url) => {
    calls.checks.push(url);
    if (typeof bookmarkResult !== "boolean") return undefined;
    return { bookmarked: bookmarkResult, target: stripTrackingParams(url, { enabled: true }).cleaned };
  };
  const setIcon = (tabId, state) => { calls.icons.push({ tabId, state }); };
  const writeMirror = async (...args) => { calls.mirrors.push(args); };
  // _scheduleCurrentTabRefresh re-derives auth + cache to compute the tri-state icon
  // (Task 2); iconStateFor itself is a real global via the shared.js <script> tag above.
  const getCurrentPinboardAuth = async () => ({ token: "t", account: "alice", epoch: 1 });
  const pbpStatusCacheGet = (url, auth) => {
    calls.cacheReads.push(url);
    return { bookmarked: bookmarkResult === true };
  };

  const make = new Function(
    "chrome", "_scheduleTabCheck", "noteActivity", "debouncedCheck", "setIcon", "_writeCurrentTabMirror",
    "getCurrentPinboardAuth", "pbpStatusCacheGet",
    source.slice(start, end) + "; return { _getFocusedActiveTab, _scheduleCurrentTabRefresh };"
  );
  const api = make(chrome, schedule, noteActivity, debouncedCheck, setIcon, writeMirror,
    getCurrentPinboardAuth, pbpStatusCacheGet);
  return { api, calls, wait: () => scheduledWork };
}

// K0: the whole bookmark-status chain in one scope -- the cache primitives,
// debouncedCheck and checkBookmarked, sliced from the shipped file rather than
// re-implemented. The invariant under test is that the URL handed to posts/get,
// the _pendingChecks dedup key and the statusCache key are ONE value, and that
// the value is the URL the popup saves under (popup.js _bookmarkPrefetchUrl).
// Asserting that with stubs for checkBookmarked would prove nothing: the cache
// key is written inside checkBookmarked, so it has to be the real one.
function buildStatusChainHarness(source, { urlClean, warm = true, posts = [], hold = false } = {}) {
  const cacheStart = source.indexOf("const statusCache = new Map();");
  const cacheEnd = source.indexOf("// ---- P2: Cached token + invalidation ----", cacheStart);
  const checkStart = source.indexOf("async function debouncedCheck(url) {");
  const checkEnd = source.indexOf("// ---- Load settings with deobfuscation", checkStart);
  const lookupStart = source.indexOf("async function checkBookmarked(url, capturedAuth = null) {");
  const lookupEnd = source.indexOf("// ---- Badge: unread count ----", lookupStart);
  assert(cacheStart >= 0 && cacheEnd > cacheStart, "status cache primitives not found");
  assert(checkStart >= 0 && checkEnd > checkStart, "debouncedCheck source not found");
  assert(lookupStart >= 0 && lookupEnd > lookupStart, "checkBookmarked source not found");

  const fetches = [];
  const storageReads = [];
  // epoch 0 matches the `let _pinboardAuthEpoch = 0` the sliced cache block declares.
  const auth = { token: "alice:secret", account: "alice", epoch: 0 };
  const stored = { optCheckBookmarkStatus: true, urlClean };
  // `hold` keeps every posts/get in flight so a concurrency assertion can look
  // at _pendingChecks while the merge window is still open.
  let release = () => {};
  const gate = hold ? new Promise((resolve) => { release = resolve; }) : Promise.resolve();
  const deps = {
    SETTINGS_DEFAULTS,
    stripTrackingParams,
    pbpPinboardAccountFromToken,
    _warmSettings: warm ? { ...stored } : null,
    getCurrentPinboardAuth: async () => auth,
    getSettingsStorage: async () => ({
      get: async (defaults) => {
        storageReads.push(Object.keys(defaults));
        const out = { ...defaults };
        for (const key of Object.keys(defaults)) if (stored[key] !== undefined) out[key] = stored[key];
        return out;
      },
    }),
    pinboardFetch: async (requestUrl) => {
      fetches.push(requestUrl);
      await gate;
      return { ok: true, status: 200, json: async () => ({ posts }) };
    },
    console: { warn: () => {} },
  };
  const names = Object.keys(deps);
  const body = [
    "const _pendingChecks = new Map();",
    "let _settingsCache = _warmSettings;",
    source.slice(cacheStart, cacheEnd),
    source.slice(checkStart, checkEnd),
    source.slice(lookupStart, lookupEnd),
    "return { debouncedCheck, checkBookmarked, statusCache, pendingChecks: _pendingChecks, pbpStatusCacheGet };",
  ].join("\n");
  const api = new Function(...names, body)(...names.map((name) => deps[name]));
  return { api, auth, fetches, storageReads, release: () => release() };
}

const K0_URL_CLEAN_ON = { enabled: true, onPopupOpen: true, onPaste: true, aggressiveMode: false, customParams: [], excludeParams: [] };
const K0_TRACKED = "https://example.com/post?utm_source=newsletter";
const K0_CLEAN = "https://example.com/post";
const K0_POST = { href: K0_CLEAN, description: "Article", extended: "Notes", tags: "alpha beta", shared: "no", toread: "no" };

// The tabs.onUpdated listener decides two things per event: whether to schedule
// a status check, and whether the per-tab icon dedup entry still describes what
// the toolbar shows. Both are behavioural, so drive the real listener with the
// real _urlWithoutFragment rather than reading the source as text.
function buildTabUpdateHarness(source) {
  const helperStart = source.indexOf("function _urlWithoutFragment");
  const helperEnd = source.indexOf("function _scheduleCurrentTabRefresh", helperStart);
  const listener = source.match(/chrome\.tabs\.onUpdated\.addListener\(\(tabId, changeInfo, tab\) => \{[\s\S]*?\n\}\);/);
  assert(helperStart >= 0 && helperEnd > helperStart && listener, "tabs.onUpdated listener not found");
  const calls = { refresh: [] };
  const state = { icons: new Map(), checked: new Map() };
  let handler = null;
  const deps = {
    chrome: { tabs: { onUpdated: { addListener: (fn) => { handler = fn; } } } },
    _lastIconState: state.icons,
    _lastCheckedUrl: state.checked,
    _scheduleCurrentTabRefresh: (tabId, tabUrl) => calls.refresh.push({ tabId, url: tabUrl }),
  };
  new Function(...Object.keys(deps), source.slice(helperStart, helperEnd) + listener[0])(...Object.values(deps));
  return { fire: (...args) => handler(...args), calls, ...state };
}

function buildProxyHarness(source) {
  const start = source.indexOf('if (message.type === "pinboard_api_call")');
  const end = source.indexOf('if (message.type === "retry_offline_item"', start);
  assert(start >= 0 && end > start, "Pinboard proxy branch not found");
  const branch = source.slice(start, end);
  const runBranch = new Function(
    "message", "sendResponse", "pinboardFetch", "pinboardFetchImmediate",
    "pbpIsAllowedPinboardApiUrl", "getCurrentPinboardAuth",
    "pbpAuthorizePinboardApiUrl", "pbpPinboardAuthIsCurrent", branch
  );
  return {
    branch,
    async invoke(message) {
      const calls = { fetch: [], responses: [] };
      const fetchStub = (...args) => {
        calls.fetch.push(args);
        return Promise.resolve({ ok: true, status: 200, text: async () => "{}" });
      };
      const auth = { token: "alice:new", account: "alice", epoch: 1 };
      const returned = runBranch(
        message,
        (response) => calls.responses.push(response),
        fetchStub,
        fetchStub,
        pbpIsAllowedPinboardApiUrl,
        async () => auth,
        pbpAuthorizePinboardApiUrl,
        (candidate) => candidate === auth
      );
      await new Promise((resolve) => setTimeout(resolve, 0));
      return { branch, calls, returned };
    }
  };
}

function buildLegacyPermissionMigrationHarness(source, chrome) {
  const start = source.indexOf("const PBP_LEGACY_WILDCARD_CLEANUP_KEY");
  const end = source.indexOf("pbpMigrateLegacyWildcardPermission().catch", start);
  assert(start >= 0 && end > start, "legacy wildcard migration not found");
  return new Function("chrome", source.slice(start, end) +
    "; return { key: PBP_LEGACY_WILDCARD_CLEANUP_KEY, run: pbpMigrateLegacyWildcardPermission };")(chrome);
}

function buildBackgroundSaveHarness(source, callAI, cached = {}, settingsPatch = {}, hasKey = true, overrides = {}) {
  const start = source.indexOf("async function saveFromBackground");
  const end = source.indexOf("// Helper: resolve prefix-specific settings", start);
  assert(start >= 0 && end > start, "background save function not found");
  const notifications = [];
  const intents = [];
  const settings = {
    pinboardToken: "token", bgSaveMode: "merge", aiProvider: "openai",
    aiCacheDuration: 60, aiContentSource: "local", aiTagSeparator: "space",
    _aiTags: true, _aiSummary: true, _autoNotes: false, _blockquote: false,
    customTagPrompt: "", customSummaryPrompt: "", ...settingsPatch,
  };
  const extractionCalls = [];
  const i18nReadyCalls = { count: 0 };
  const dependencies = {
    getCurrentPinboardAuth: async () => ({ token: "alice:token", account: "alice", epoch: 1 }),
    loadSettings: async () => settings,
    pbpEffectivePrivate: () => false,
    showNotification: (...args) => notifications.push(args),
    pbpSaveFailure: (reason) => ({ status: "failed", reason }),
    getPageInfoFromTab: async (...args) => { extractionCalls.push(args); return { pageText: "article body" }; },
    buildAutoNotes: () => "",
    hasAIKey: () => hasKey,
    getAICache: async (_url, kind) => cached[kind] ?? null,
    callAI,
    buildCombinedPrompt: () => "combined",
    parseAICombined: () => ({ tags: ["combined-tag"], summary: "combined-summary" }),
    setAICache: async () => {},
    escapeForExtended: (value) => value,
    buildTagPrompt: () => "tags",
    refineTags: (tags) => tags,
    parseAITags: (value) => value,
    AI_TAG_CAP: 12,
    buildSummaryPrompt: () => "summary",
    submitSaveIntent: async (intent) => { intents.push(intent); return { status: "saved", mutation: "updated" }; },
    processOfflineQueue: () => Promise.resolve(),
    t: (key, value) => `${key}:${value || ""}`,
    // K100: pbpI18nReady must be a dep of every harness that slices
    // saveFromBackground, or the sliced function throws ReferenceError. Default
    // is an already-resolved promise so the 57 existing cases below stay unchanged.
    pbpI18nReady: () => { i18nReadyCalls.count++; return Promise.resolve(); },
    ...overrides,
  };
  const names = Object.keys(dependencies);
  const make = new Function(...names, source.slice(start, end) + "; return saveFromBackground;");
  return {
    save: make(...names.map((name) => dependencies[name])),
    notifications,
    intents,
    extractionCalls,
    i18nReadyCalls,
  };
}

async function run() {
  const [source, popupSource] = await Promise.all([
    fetch("../background.js").then((response) => response.text()),
    fetch("../popup.js").then((response) => response.text()),
  ]);
  const url = "https://example.com/article";

  await test("Pinboard proxy allowlist accepts only the v1 API origin", () => {
    assert(pbpIsAllowedPinboardApiUrl("https://api.pinboard.in/v1/posts/get?format=json"), "valid v1 URL rejected");
    assert(pbpIsAllowedPinboardApiUrl("https://api.pinboard.in:443/v1/tags/get"), "explicit default port rejected");
  });

  await test("Pinboard proxy allowlist rejects URL credentials", () => {
    assert(!pbpIsAllowedPinboardApiUrl("https://user:pass@api.pinboard.in/v1/posts/get"), "credentials accepted");
    assert(!pbpIsAllowedPinboardApiUrl("https://@api.pinboard.in/v1/posts/get"), "empty userinfo accepted");
  });

  await test("Pinboard proxy allowlist rejects non-default ports", () => {
    assert(!pbpIsAllowedPinboardApiUrl("https://api.pinboard.in:444/v1/posts/get"), "non-default port accepted");
  });

  await test("Pinboard proxy allowlist rejects lookalike hosts", () => {
    assert(!pbpIsAllowedPinboardApiUrl("https://api.pinboard.in.evil.test/v1/posts/get"), "suffix lookalike accepted");
    assert(!pbpIsAllowedPinboardApiUrl("https://api-pinboard.in/v1/posts/get"), "hyphen lookalike accepted");
  });

  await test("Pinboard proxy allowlist rejects paths outside /v1/", () => {
    assert(!pbpIsAllowedPinboardApiUrl("https://api.pinboard.in/v1"), "bare /v1 accepted");
    assert(!pbpIsAllowedPinboardApiUrl("https://api.pinboard.in/v10/posts/get"), "/v10 lookalike accepted");
  });

  await test("Pinboard proxy allowlist rejects non-HTTPS URLs", () => {
    assert(!pbpIsAllowedPinboardApiUrl("http://api.pinboard.in/v1/posts/get"), "HTTP accepted");
  });

  await test("Pinboard proxy allowlist rejects malformed and relative URLs", () => {
    assert(!pbpIsAllowedPinboardApiUrl("not a url"), "malformed URL accepted");
    assert(!pbpIsAllowedPinboardApiUrl("/v1/posts/get"), "relative URL accepted");
  });

  await test("Pinboard proxy branch rejects invalid targets with zero fetch", async () => {
    const h = buildProxyHarness(source);
    const result = await h.invoke({ type: "pinboard_api_call", url: "https://evil.test/v1/posts/get" });
    assert(result.returned === true, "async message channel not retained");
    assert(result.calls.fetch.length === 0, "invalid target reached pinboardFetch");
    assert(result.calls.responses[0]?.error === "invalid_pinboard_api_url", "bounded rejection missing");
  });

  await test("Pinboard proxy branch forwards only an allowed URL and no caller options", async () => {
    const h = buildProxyHarness(source);
    const result = await h.invoke({
      type: "pinboard_api_call",
      url: "https://api.pinboard.in/v1/posts/get?auth_token=alice%3Aold&format=json",
      options: { method: "POST", headers: { Authorization: "attacker" } },
    });
    // Roadmap #23: the SW may pass its OWN options object, but it must be
    // exactly the clamped-timeout shape — never the caller's options (method/
    // headers smuggling). message.options above is deliberately hostile.
    assert(result.calls.fetch.length === 1, "proxy did not dispatch exactly once");
    const fwd = result.calls.fetch[0][1];
    assert(fwd === undefined ||
      (fwd && Object.keys(fwd).join(",") === "timeoutMs" && typeof fwd.timeoutMs === "number" &&
       fwd.timeoutMs >= 1000 && fwd.timeoutMs <= 60000),
      "pinboardFetch received something beyond the clamped timeoutMs shape");
    assert(result.branch.includes("pbpIsAllowedPinboardApiUrl(message.url)"), "branch does not call allowlist helper");
    assert(!result.branch.includes("message.options"), "branch still reads message.options");
    const override = popupSource.slice(popupSource.indexOf("pinboardFetch = function"), popupSource.indexOf("let currentTags"));
    assert(!override.includes("options"), "Popup proxy still sends options");
  });

  await test("legacy wildcard migration marker makes cleanup one-time", async () => {
    let permissionCalls = 0, writes = 0;
    const chrome = {
      storage: { local: {
        get: async () => ({ _legacyWildcardCleanupV1: true }),
        set: async () => { writes++; },
      } },
      permissions: { contains: async () => { permissionCalls++; return true; }, remove: async () => true },
    };
    await buildLegacyPermissionMigrationHarness(source, chrome).run();
    assert(permissionCalls === 0 && writes === 0, "completed migration touched permissions or storage");
  });

  await test("profiles without a wildcard keep existing exact grants and record cleanup", async () => {
    let removes = 0, marker = null, exactActive = true;
    const chrome = {
      storage: { local: {
        get: async () => ({}),
        set: async (value) => { marker = value; },
      } },
      permissions: { contains: async () => false, remove: async () => { removes++; exactActive = false; return true; } },
    };
    const h = buildLegacyPermissionMigrationHarness(source, chrome);
    await h.run();
    assert(removes === 0 && exactActive && marker?.[h.key] === true,
      "no-wildcard profile removed an existing exact grant or failed to settle");
  });

  await test("legacy wildcard cleanup marks only a verified removal", async () => {
    for (const removalWorks of [true, false]) {
      let active = true, marker = null, removes = 0;
      const chrome = {
        storage: { local: {
          get: async () => ({}),
          set: async (value) => { marker = value; },
        } },
        permissions: {
          contains: async () => active,
          remove: async () => { removes++; if (removalWorks) active = false; return removalWorks; },
        },
      };
      const h = buildLegacyPermissionMigrationHarness(source, chrome);
      await h.run();
      assert(removes === 1, "active legacy wildcard was not removed");
      assert((marker?.[h.key] === true) === removalWorks, "migration marked an unverified removal");
    }
  });

  await test("legacy wildcard cleanup does not mark a thrown removal", async () => {
    let marker = null;
    const chrome = {
      storage: { local: {
        get: async () => ({}),
        set: async (value) => { marker = value; },
      } },
      permissions: {
        contains: async () => true,
        remove: async () => { throw new Error("permissions unavailable"); },
      },
    };
    const h = buildLegacyPermissionMigrationHarness(source, chrome);
    let threw = false;
    try { await h.run(); } catch (_) { threw = true; }
    assert(threw && marker === null, "failed removal wrote a completion marker");
  });

  await test("background save keeps the extraction fast path when AI is disabled", async () => {
    const h = buildBackgroundSaveHarness(source, async () => "unused", {}, { _aiTags: false, _aiSummary: false });
    await h.save({
      url, title: "Article", tab: { id: 7 }, settingsOverrides: {},
      toread: false, notifyId: "qs", notifyTitle: "Saved", notifyCategory: "quickSave",
    });
    assert(h.extractionCalls.length === 1 && h.extractionCalls[0][1]?.expectedUrl === url && !h.extractionCalls[0][1]?.withDefuddle,
      "no-AI save injected the full extractor");
  });

  await test("background save keeps the extraction fast path when AI has no key", async () => {
    const h = buildBackgroundSaveHarness(source, async () => "unused", {}, {}, false);
    await h.save({
      url, title: "Article", tab: { id: 7 }, settingsOverrides: {},
      toread: false, notifyId: "qs", notifyTitle: "Saved", notifyCategory: "quickSave",
    });
    assert(h.extractionCalls.length === 1 && h.extractionCalls[0][1]?.expectedUrl === url && !h.extractionCalls[0][1]?.withDefuddle,
      "keyless AI save injected the full extractor");
  });

  await test("background save awaits pbpI18nReady before the not-logged-in notification", async () => {
    let resolveReady;
    const ready = new Promise((resolve) => { resolveReady = resolve; });
    let readyLanded = false;
    ready.then(() => { readyLanded = true; });
    const h = buildBackgroundSaveHarness(source, async () => "unused", {}, {}, true, {
      getCurrentPinboardAuth: async () => ({ token: "", account: null, epoch: 1 }),
      pbpI18nReady: () => ready,
      t: (key) => (readyLanded ? "NEW:" + key : "OLD:" + key),
    });
    const pending = h.save({
      url, title: "Article", tab: { id: 7 }, settingsOverrides: {},
      toread: false, notifyId: "qs", notifyTitle: "Saved", notifyCategory: "quickSave",
    });
    // Flush a microtask turn while pbpI18nReady is still pending: no notification
    // should have fired yet, proving saveFromBackground is blocked on the await
    // rather than racing ahead with stale (browser-locale) strings.
    await Promise.resolve();
    await Promise.resolve();
    assert(h.notifications.length === 0, "notification fired before pbpI18nReady resolved");
    resolveReady();
    const result = await pending;
    assert(result.status === "failed" && result.reason === "not_logged_in", "not-logged-in save did not fail as expected");
    assert(h.notifications.length === 1, "expected exactly one notification");
    assert(h.notifications[0][1] === "NEW:bgNotLoggedIn" && h.notifications[0][2] === "NEW:bgSetToken",
      "not-logged-in notification used stale text instead of waiting for pbpI18nReady");
  });

  await test("background save does not pay for pbpI18nReady on the happy path", async () => {
    const h = buildBackgroundSaveHarness(source, async () => "unused", {}, { _aiTags: false, _aiSummary: false });
    await h.save({
      url, title: "Article", tab: { id: 7 }, settingsOverrides: {},
      toread: false, notifyId: "qs", notifyTitle: "Saved", notifyCategory: "quickSave",
    });
    assert(h.i18nReadyCalls.count === 0, "logged-in save should not await pbpI18nReady");
  });

  await test("Quick Save and Read Later AI settings both request Defuddle extraction", async () => {
    const resolverStart = source.indexOf("function resolvePrefixSettings");
    const resolverEnd = source.indexOf("// B4: write current tab data", resolverStart);
    const resolvePrefix = new Function(source.slice(resolverStart, resolverEnd) + "; return resolvePrefixSettings;")();
    for (const prefix of ["qs", "rl"]) {
      const configured = { [prefix + "AiTags"]: prefix === "qs", [prefix + "AiSummary"]: prefix === "rl" };
      const h = buildBackgroundSaveHarness(source, async () => "ai-result", {}, { _aiTags: false, _aiSummary: false });
      await h.save({
        url, title: "Article", tab: { id: 7 }, settingsOverrides: resolvePrefix(configured, prefix),
        toread: prefix === "rl", notifyId: prefix, notifyTitle: "Saved", notifyCategory: "quickSave",
      });
      assert(h.extractionCalls.length === 1 && h.extractionCalls[0][0] === 7 &&
        h.extractionCalls[0][1]?.withDefuddle === true && h.extractionCalls[0][1]?.expectedUrl === url,
        prefix + " AI branch did not bind Defuddle extraction to the saved URL");
    }
  });

  await test("background save skips duplicate fallback calls after host-permission failure", async () => {
    let calls = 0;
    const hostError = Object.assign(new Error("permission required"), { code: "host_permission" });
    const h = buildBackgroundSaveHarness(source, async () => { calls++; throw hostError; });
    const result = await h.save({
      url, title: "Article", tab: { id: 7 }, settingsOverrides: {},
      toread: false, notifyId: "qs", notifyTitle: "Saved", notifyCategory: "quickSave",
    });
    assert(result.status === "saved", "bookmark was not saved");
    assert(calls === 1, "combined host failure fell through to separate AI calls");
    assert(h.intents.length === 1 && h.intents[0].tags === "" && h.intents[0].notes === "", "partial AI output leaked into the bookmark");
    assert(h.notifications[0]?.[2] === "bgTitleSavedAiSkipped:Article", "saved-without-AI notification missing");
  });

  await test("background save keeps the existing non-permission AI fallback", async () => {
    let calls = 0;
    const h = buildBackgroundSaveHarness(source, async (_settings, prompt) => {
      calls++;
      if (prompt === "combined") throw new Error("bad combined payload");
      return prompt === "tags" ? ["ai-tag"] : "AI summary";
    });
    const result = await h.save({
      url, title: "Article", tab: { id: 7 }, settingsOverrides: {},
      toread: false, notifyId: "qs", notifyTitle: "Saved", notifyCategory: "quickSave",
    });
    assert(result.status === "saved" && calls === 3, "non-permission combined error no longer falls back to two calls");
    assert(h.intents[0].tags === "ai-tag" && h.intents[0].notes.includes("AI summary"), "fallback AI results were not saved");
    assert(h.notifications[0]?.[2] === "bgTitleSaved:Article", "ordinary success notification changed");
  });

  await test("background host-permission failure keeps already cached AI output", async () => {
    let calls = 0;
    const hostError = Object.assign(new Error("permission required"), { code: "host_permission" });
    const h = buildBackgroundSaveHarness(source, async () => { calls++; throw hostError; }, { tags: ["cached-tag"] });
    await h.save({
      url, title: "Article", tab: { id: 7 }, settingsOverrides: {},
      toread: false, notifyId: "qs", notifyTitle: "Saved", notifyCategory: "quickSave",
    });
    assert(calls === 1, "cache-preserving recovery made an extra AI call");
    assert(h.intents[0].tags === "cached-tag", "cached AI tags were discarded");
    assert(h.notifications[0]?.[2] === "bgTitleSavedAiSkipped:Article", "missing grant guidance after cache-only recovery");
  });

  await test("activated and updated listeners share the guarded scheduler", () => {
    const activated = source.match(/chrome\.tabs\.onActivated\.addListener\([\s\S]*?\n}\);/)[0];
    const updated = source.match(/chrome\.tabs\.onUpdated\.addListener\([\s\S]*?\n}\);/)[0];
    assert(activated.includes("_scheduleCurrentTabRefresh(tabId)"), "activated listener bypasses scheduler");
    assert(updated.includes("_scheduleCurrentTabRefresh(tabId, tab.url)"), "updated listener bypasses scheduler");
    assert(!/noteActivity|debouncedCheck|_writeCurrentTabMirror/.test(activated + updated), "listener performs unguarded work");
  });

  await test("token test fetch refuses redirects and keeps its deadline", async () => {
    // Pinboard v1 is GET-only, so the token rides the query string: following a
    // 3xx would hand the plaintext token to whatever host the Location names,
    // and CORS only withholds the response, never the request. Same invariant
    // shared.js's _executePinboardFetch enforces for every other v1 call.
    const start = source.indexOf('if (message.type === "test_pinboard_token"');
    const end = source.indexOf("// ---- Image-fix Referer rules", start);
    assert(start >= 0 && end > start, "token test branch not found");
    const calls = [];
    const responses = [];
    const runBranch = new Function("message", "sendResponse", "fetch",
      source.slice(start, end));
    runBranch(
      { type: "test_pinboard_token", token: "alice:secret" },
      (response) => responses.push(response),
      (requestUrl, init) => { calls.push({ url: requestUrl, init }); return Promise.resolve({ ok: true, status: 200 }); }
    );
    await new Promise((resolve) => setTimeout(resolve, 0));
    assert(calls.length === 1, "token test did not reach fetch");
    assert(calls[0].init?.redirect === "error", "a 3xx would replay the plaintext token to its target");
    assert(calls[0].init?.signal instanceof AbortSignal, "token test lost its timeout");
    assert(calls[0].url.includes("auth_token=alice%3Asecret"), "token is not carried on the query string any more");
    assert(responses[0]?.ok === true, "token test stopped answering its caller");
  });

  await test("tab-set save carries a deadline and reports the abort", async () => {
    // The message handler is fire-and-forget and the popup re-enables its button
    // on a timer, so these notifications are the only feedback a stalled
    // pinboard.in can still produce.
    const start = source.indexOf("async function handleSaveTabSet");
    const end = source.indexOf("// ---- Storage change listener ----", start);
    assert(start >= 0 && end > start, "tab set handler not found");
    const calls = [];
    const notifications = [];
    const deps = {
      chrome: { tabs: { create: () => {} } },
      fetch: async (requestUrl, init) => {
        calls.push({ url: requestUrl, init });
        throw Object.assign(new Error("signal timed out"), { name: "TimeoutError" });
      },
      showNotification: (...args) => notifications.push(args),
      t: (key, ...args) => (args.length ? `${key}:${args.join(":")}` : key),
    };
    const handleSaveTabSet = new Function(...Object.keys(deps),
      source.slice(start, end) + "; return handleSaveTabSet;")(...Object.values(deps));
    await handleSaveTabSet([{ title: "A", url: "https://a.example/" }]);
    assert(calls[0]?.init?.signal instanceof AbortSignal, "tab-set save has no deadline");
    assert(notifications.length === 1 && notifications[0][0] === "tabset-error" && notifications[0][3] === "error",
      "a timed-out tab-set save produced no feedback");
  });

  await test("a cross-document navigation invalidates the icon dedup entry, a same-document one keeps it", () => {
    const other = "https://example.com/other";
    // Chromium clears the tab-scoped action icon when a cross-document
    // navigation commits, so a dedup entry that survives it makes setIcon skip
    // the identical recomputed state and the toolbar keeps the default pin.
    const reload = buildTabUpdateHarness(source);
    reload.icons.set(7, "saved");
    reload.checked.set(7, url);
    reload.fire(7, { status: "complete" }, { id: 7, url });
    assert(!reload.icons.has(7), "reload kept a dedup entry the platform already invalidated");
    assert(reload.calls.refresh.length === 1, "reload did not enter the shared scheduler");

    // The loading half of that same navigation carries changeInfo.url too.
    const committing = buildTabUpdateHarness(source);
    committing.icons.set(7, "toread");
    committing.fire(7, { status: "loading", url: other }, { id: 7, url: other });
    assert(!committing.icons.has(7), "a committing navigation kept a stale dedup entry");

    // Same-document moves leave the icon on screen, so the entry stays true.
    const fragment = buildTabUpdateHarness(source);
    fragment.icons.set(7, "saved");
    fragment.checked.set(7, url);
    fragment.fire(7, { url: url + "#note" }, { id: 7, url: url + "#note" });
    assert(fragment.icons.get(7) === "saved", "fragment jump discarded a still-valid dedup entry");
    assert(fragment.calls.refresh.length === 0, "fragment jump burned a rate-limited status check");

    const route = buildTabUpdateHarness(source);
    route.icons.set(7, "saved");
    route.checked.set(7, url);
    route.fire(7, { url: other }, { id: 7, url: other });
    assert(route.icons.get(7) === "saved", "in-page route change discarded a still-valid dedup entry");
    assert(route.calls.refresh.length === 1, "in-page route change skipped the scheduler");
  });

  await test("window focus listener ignores WINDOW_ID_NONE and enters the same scheduler", () => {
    const listener = source.match(/chrome\.windows\.onFocusChanged\.addListener\([\s\S]*?\n}\);/)[0];
    assert(listener.includes("chrome.windows.WINDOW_ID_NONE"), "WINDOW_ID_NONE is not ignored");
    assert(/query\(\{ active: true, windowId \}\)/.test(listener), "focused window is not queried");
    assert(listener.includes("_scheduleCurrentTabRefresh(tab.id, tab.url)"), "focus listener bypasses scheduler");
  });

  await test("current focused HTTP tab is checked and applied once", async () => {
    const tab = { id: 7, url, title: "Article" };
    const h = buildHarness(source, [{ ...tab }, { ...tab }]);
    h.api._scheduleCurrentTabRefresh(7, url);
    await h.wait();
    assert(h.calls.schedule.length === 1 && h.calls.schedule[0].delay === 150, "refresh was not debounced once");
    assert(h.calls.queries.length === 2 && h.calls.queries.every((q) => q.active && q.lastFocusedWindow), "focus was not checked twice");
    assert(h.calls.activity === 1 && h.calls.checks.length === 1, "status lookup count is wrong");
    assert(h.calls.icons.length === 1 && h.calls.icons[0].tabId === 7, "icon was not applied");
    assert(h.calls.mirrors.length === 1 && h.calls.mirrors[0][1] === url, "mirror was not applied");
  });

  await test("background tab is rejected before activity, lookup, and mirror", async () => {
    const h = buildHarness(source, [{ id: 8, url, title: "Other" }]);
    h.api._scheduleCurrentTabRefresh(7, url);
    await h.wait();
    assert(h.calls.activity === 0 && h.calls.checks.length === 0, "background tab triggered lookup");
    assert(h.calls.icons.length === 0 && h.calls.mirrors.length === 0, "background tab changed state");
  });

  await test("stale update URL is rejected before activity and lookup", async () => {
    const h = buildHarness(source, [{ id: 7, url, title: "New URL" }]);
    h.api._scheduleCurrentTabRefresh(7, "https://example.com/old");
    await h.wait();
    assert(h.calls.activity === 0 && h.calls.checks.length === 0, "stale URL triggered lookup");
  });

  await test("non-HTTP active tab is rejected before activity and lookup", async () => {
    const h = buildHarness(source, [{ id: 7, url: "chrome://settings", title: "Settings" }]);
    h.api._scheduleCurrentTabRefresh(7);
    await h.wait();
    assert(h.calls.activity === 0 && h.calls.checks.length === 0, "non-HTTP URL triggered lookup");
  });

  await test("navigation during lookup cannot apply icon or mirror", async () => {
    const h = buildHarness(source, [
      { id: 7, url, title: "Article" },
      { id: 7, url: "https://example.com/next", title: "Next" },
    ]);
    h.api._scheduleCurrentTabRefresh(7, url);
    await h.wait();
    assert(h.calls.checks.length === 1, "initial current tab was not checked");
    assert(h.calls.icons.length === 0 && h.calls.mirrors.length === 0, "stale URL result was applied");
  });

  await test("tab switch during lookup cannot apply icon or mirror", async () => {
    const h = buildHarness(source, [
      { id: 7, url, title: "Article" },
      { id: 8, url, title: "Other tab" },
    ]);
    h.api._scheduleCurrentTabRefresh(7, url);
    await h.wait();
    assert(h.calls.icons.length === 0 && h.calls.mirrors.length === 0, "inactive tab result was applied");
  });

  await test("disabled bookmark status skips icon but still refreshes current-tab mirror", async () => {
    const tab = { id: 7, url, title: "Article" };
    const h = buildHarness(source, [{ ...tab }, { ...tab }], null);
    h.api._scheduleCurrentTabRefresh(7, url);
    await h.wait();
    assert(h.calls.icons.length === 0, "disabled status changed icon");
    assert(h.calls.mirrors.length === 1, "current-tab mirror was skipped");
  });

  await test("K0: a tracked tab URL is queried, deduped and cached under the URL the popup saves", async () => {
    const h = buildStatusChainHarness(source, { urlClean: K0_URL_CLEAN_ON, posts: [K0_POST] });
    const status = await h.api.debouncedCheck(K0_TRACKED);
    assert(h.fetches.length === 1, "expected exactly one posts/get, got " + h.fetches.length);
    assert(h.fetches[0].includes("url=" + encodeURIComponent(K0_CLEAN)),
      "posts/get still asks Pinboard about the tracked URL: " + h.fetches[0]);
    assert(status && status.bookmarked === true, "a saved page did not read as bookmarked: " + JSON.stringify(status));
    assert(status.target === K0_CLEAN, "debouncedCheck did not report the cleaned target: " + JSON.stringify(status));
    assert(h.api.statusCache.has(K0_CLEAN), "the status cache is not keyed by the queried URL");
    assert(!h.api.statusCache.has(K0_TRACKED), "the status cache still holds a raw tracked-URL key");
    assert(iconStateFor(h.api.pbpStatusCacheGet(status.target, h.auth)) === "saved",
      "the toolbar icon would still call a saved page unsaved");
  });

  await test("K0: the urlClean setting rides the status check's existing storage read", async () => {
    const cold = buildStatusChainHarness(source, { urlClean: K0_URL_CLEAN_ON, warm: false, posts: [K0_POST] });
    await cold.api.debouncedCheck(K0_TRACKED);
    assert(cold.storageReads.length === 1, "the cold path made " + cold.storageReads.length + " storage reads, not one");
    assert(cold.storageReads[0].includes("urlClean") && cold.storageReads[0].includes("optCheckBookmarkStatus"),
      "urlClean does not ride the existing read: " + JSON.stringify(cold.storageReads[0]));
    assert(cold.fetches[0].includes("url=" + encodeURIComponent(K0_CLEAN)), "cold read did not clean the query URL");

    const warm = buildStatusChainHarness(source, { urlClean: K0_URL_CLEAN_ON, posts: [K0_POST] });
    await warm.api.debouncedCheck(K0_TRACKED);
    assert(warm.storageReads.length === 0, "the warm path issued a redundant storage read");
    assert(warm.fetches[0].includes("url=" + encodeURIComponent(K0_CLEAN)), "warm read did not clean the query URL");
  });

  await test("K0 control: urlClean off keeps the raw tracked URL end to end", async () => {
    const off = { ...K0_URL_CLEAN_ON, enabled: false };
    const h = buildStatusChainHarness(source, { urlClean: off, posts: [] });
    const status = await h.api.debouncedCheck(K0_TRACKED);
    assert(status.target === K0_TRACKED, "urlClean off still cleaned the query URL: " + status.target);
    assert(h.fetches[0].includes("url=" + encodeURIComponent(K0_TRACKED)), "urlClean off changed the queried URL");
    assert(h.api.statusCache.has(K0_TRACKED) && !h.api.statusCache.has(K0_CLEAN), "urlClean off changed the cache key");

    // onPopupOpen is the second half of the popup's own condition: with it off
    // the popup saves the raw URL, so the status check must ask about it too.
    const perPage = buildStatusChainHarness(source, { urlClean: { ...K0_URL_CLEAN_ON, onPopupOpen: false }, posts: [] });
    const perPageStatus = await perPage.api.debouncedCheck(K0_TRACKED);
    assert(perPageStatus.target === K0_TRACKED, "onPopupOpen:false still cleaned the query URL");
  });

  await test("K0: two tracked URLs that resolve to one bookmark share a single in-flight check", async () => {
    const h = buildStatusChainHarness(source, { urlClean: K0_URL_CLEAN_ON, posts: [K0_POST], hold: true });
    const first = h.api.debouncedCheck(K0_TRACKED);
    const second = h.api.debouncedCheck(K0_CLEAN + "?fbclid=abc&utm_medium=email");
    // Let both reach the dedup point before the single request is allowed to settle.
    await new Promise((resolve) => setTimeout(resolve, 0));
    const keys = [...h.api.pendingChecks.keys()];
    assert(keys.length === 1, "dedup did not collapse the two tracked URLs: " + JSON.stringify(keys));
    assert(keys[0].endsWith("\n" + K0_CLEAN), "_pendingChecks is not keyed by the cleaned target: " + JSON.stringify(keys));
    h.release();
    const [a, b] = await Promise.all([first, second]);
    assert(h.fetches.length === 1, "the merged check still made " + h.fetches.length + " posts/get calls");
    assert(a.bookmarked === true && b.bookmarked === true, "the deduped caller lost its answer");
    assert(a.target === K0_CLEAN && b.target === K0_CLEAN, "the deduped caller lost its target");
    assert(h.api.pendingChecks.size === 0, "the settled check was not removed from _pendingChecks");
  });

  await test("K0: the icon is read back under the checked target, not the raw tab URL", async () => {
    const tab = { id: 7, url: K0_TRACKED, title: "Article" };
    const h = buildHarness(source, [{ ...tab }, { ...tab }]);
    h.api._scheduleCurrentTabRefresh(7, K0_TRACKED);
    await h.wait();
    assert(h.calls.checks.length === 1 && h.calls.checks[0] === K0_TRACKED, "the check no longer runs on the tab URL");
    assert(h.calls.cacheReads.length === 1, "expected one status-cache read, got " + h.calls.cacheReads.length);
    assert(h.calls.cacheReads[0] === K0_CLEAN,
      "the icon read back a key nothing wrote: " + h.calls.cacheReads[0]);
    assert(h.calls.icons.length === 1 && h.calls.icons[0].state === "saved", "the icon was not applied as saved");
  });
}
run();
</script>
