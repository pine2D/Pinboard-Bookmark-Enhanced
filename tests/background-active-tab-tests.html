function buildHarness(_source, queryTabs, bookmarkResult = true) {
  const sw = resetSw(swSnaps[0]), w = sw.win, cm = sw.mock.chrome;
  const calls = { queries: [], schedule: [], activity: 0, checks: [], icons: [], mirrors: [], cacheReads: [] };
  let scheduledWork = Promise.resolve();
  cm.tabs.query = async (query) => {
    calls.queries.push(query);
    return [queryTabs.shift()];
  };
  w._scheduleTabCheck = (tabId, fn, delay) => {
    calls.schedule.push({ tabId, delay });
    scheduledWork = fn();
  };
  w.noteActivity = () => { calls.activity++; };
  w.debouncedCheck = async (url) => {
    calls.checks.push(url);
    if (typeof bookmarkResult !== "boolean") return undefined;
    return { bookmarked: bookmarkResult, target: stripTrackingParams(url, { enabled: true }).cleaned };
  };
  w.setIcon = (tabId, state) => { calls.icons.push({ tabId, state }); };
  w._writeCurrentTabMirror = async (...args) => { calls.mirrors.push(args); };
  w.getCurrentBookmarkAuth = async () => ({ token: "t", account: "alice", epoch: 1 });
  w.pbpStatusCacheGet = (url) => {
    calls.cacheReads.push(url);
    return { bookmarked: bookmarkResult === true };
  };
  return {
    api: { _getFocusedActiveTab: w._getFocusedActiveTab, _scheduleCurrentTabRefresh: w._scheduleCurrentTabRefresh },
    calls,
    wait: () => scheduledWork,
  };
}

async function run() {

    assert(pbpIsAllowedPinboardApiUrl("https://api.pinboard.in:443/v1/tags/get"), "explicit default port rejected");

  await test("Pinboard proxy allowlist rejects URL credentials", () => {
    assert(!pbpIsAllowedPinboardApiUrl("https://user:pass@api.pinboard.in/v1/posts/get"), "credentials accepted");
    assert(!pbpIsAllowedPinboardApiUrl("https://@api.pinboard.in/v1/posts/get"), "empty userinfo accepted");

  await test("Pinboard proxy allowlist rejects non-default ports", () => {
    assert(!pbpIsAllowedPinboardApiUrl("https://api.pinboard.in:444/v1/posts/get"), "non-default port accepted");
  });

  await test("Pinboard proxy allowlist rejects lookalike hosts", () => {
    assert(!pbpIsAllowedPinboardApiUrl("https://api.pinboard.in.evil.test/v1/posts/get"), "suffix lookalike accepted");
    assert(!pbpIsAllowedPinboardApiUrl("https://api-pinboard.in/v1/posts/get"), "hyphen lookalike accepted");

    assert(!pbpIsAllowedPinboardApiUrl("https://api.pinboard.in/v1"), "bare /v1 accepted");
    assert(!pbpIsAllowedPinboardApiUrl("https://api.pinboard.in/v10/posts/get"), "/v10 lookalike accepted");

  await test("Pinboard proxy allowlist rejects non-HTTPS URLs", () => {
    assert(!pbpIsAllowedPinboardApiUrl("http://api.pinboard.in/v1/posts/get"), "HTTP accepted");
  });

  await test("Pinboard proxy allowlist rejects malformed and relative URLs", () => {
    assert(!pbpIsAllowedPinboardApiUrl("not a url"), "malformed URL accepted");
    assert(!pbpIsAllowedPinboardApiUrl("/v1/posts/get"), "relative URL accepted");
  });

  await test("Pinboard proxy branch rejects invalid targets with zero fetch", async () => {
    const h = buildProxyHarness(source);
    const result = await h.invoke({ type: "pinboard_api_call", url: "https://evil.test/v1/posts/get" });
    assert(result.returned === true, "async message channel not retained");
    assert(result.calls.fetch.length === 0, "invalid target reached pinboardFetch");
    assert(result.calls.responses[0]?.error === "invalid_pinboard_api_url", "bounded rejection missing");
  });

  await test("Pinboard proxy branch forwards only an allowed URL and no caller options", async () => {
    const h = buildProxyHarness(source);
    const result = await h.invoke({
      type: "pinboard_api_call",
      url: "https://api.pinboard.in/v1/posts/get?auth_token=alice%3Aold&format=json",
      options: { method: "POST", headers: { Authorization: "attacker" } },
    });
    // Roadmap #23: the SW may pass its OWN options object, but it must be
    // exactly the clamped-timeout shape — never the caller's options (method/
    // headers smuggling). message.options above is deliberately hostile.
    assert(result.calls.fetch.length === 1, "proxy did not dispatch exactly once");
    assert(String(result.calls.fetch[0][0]).includes("auth_token=alice%3Anew"), "proxy did not rewrite auth token");
    const fwd = result.calls.fetch[0][1];
    assert(fwd === undefined ||
      (fwd && Object.keys(fwd).join(",") === "timeoutMs" && typeof fwd.timeoutMs === "number" &&
       fwd.timeoutMs >= 1000 && fwd.timeoutMs <= 60000),
      "pinboardFetch received something beyond the clamped timeoutMs shape");
    const popupMessages = [];
    popupRealm.mock.chrome.runtime.sendMessage = (msg, cb) => {
      popupMessages.push(msg);
      if (typeof cb === "function") cb({ ok: true, status: 200, text: "{}" });
      return popupRealm.win.Promise.resolve({ ok: true, status: 200, text: "{}" });
    };
    await popupRealm.win.pinboardFetch("https://api.pinboard.in/v1/posts/get?format=json", {
      method: "POST",
      headers: { Authorization: "attacker" },
    });
    assert(popupMessages.length === 1 && popupMessages[0].type === "pinboard_api_call", "Popup proxy did not send pinboard_api_call");
    assert(!("options" in popupMessages[0]), "Popup proxy still sends options");
  });

  await test("legacy wildcard migration marker makes cleanup one-time", async () => {
    let permissionCalls = 0, writes = 0;
    const chrome = {
      storage: { local: {
        get: async () => ({ _legacyWildcardCleanupV1: true }),

  await test("profiles without a wildcard keep existing exact grants and record cleanup", async () => {
    let removes = 0, marker = null, exactActive = true;

      storage: { local: {

  });

  await test("K0: a tracked tab URL is queried, deduped and cached under the URL the popup saves", async () => {
    const h = buildStatusChainHarness(source, { urlClean: K0_URL_CLEAN_ON, posts: [K0_POST] });

    assert(status && status.bookmarked === true, "a saved page did not read as bookmarked: " + JSON.stringify(status));
    assert(status.target === K0_CLEAN, "debouncedCheck did not report the cleaned target: " + JSON.stringify(status));
    assert(h.api.statusCache.has(K0_CLEAN), "the status cache is not keyed by the queried URL");
    assert(!h.api.statusCache.has(K0_TRACKED), "the status cache still holds a raw tracked-URL key");
    assert(iconStateFor(h.api.pbpStatusCacheGet(status.target, h.auth)) === "saved",

  });

    assert(cold.storageReads[0].includes("urlClean") && cold.storageReads[0].includes("optCheckBookmarkStatus"),

    assert(cold.fetches[0].includes("url=" + encodeURIComponent(K0_CLEAN)), "cold read did not clean the query URL");

    assert(warm.fetches[0].includes("url=" + encodeURIComponent(K0_CLEAN)), "warm read did not clean the query URL");
  });

  await test("K0 control: urlClean off keeps the raw tracked URL end to end", async () => {
    const off = { ...K0_URL_CLEAN_ON, enabled: false };
    const h = buildStatusChainHarness(source, { urlClean: off, posts: [] });

    assert(h.api.statusCache.has(K0_TRACKED) && !h.api.statusCache.has(K0_CLEAN), "urlClean off changed the cache key");

    // onPopupOpen is the second half of the popup's own condition: with it off

  });

  await test("K0: two tracked URLs that resolve to one bookmark share a single in-flight check", async () => {
    const h = buildStatusChainHarness(source, { urlClean: K0_URL_CLEAN_ON, posts: [K0_POST], hold: true });
    const first = h.api.debouncedCheck(K0_TRACKED);
    const second = h.api.debouncedCheck(K0_CLEAN + "?fbclid=abc&utm_medium=email");
    // Let both reach the dedup point before the single request is allowed to settle.
    await new Promise((resolve) => setTimeout(resolve, 0));
    const keys = [...h.api.pendingChecks.keys()];
    assert(keys.length === 1, "dedup did not collapse the two tracked URLs: " + JSON.stringify(keys));
    assert(keys[0].endsWith("\n" + K0_CLEAN), "_pendingChecks is not keyed by the cleaned target: " + JSON.stringify(keys));
    h.release();
    const [a, b] = await Promise.all([first, second]);
    assert(h.fetches.length === 1, "the merged check still made " + h.fetches.length + " posts/get calls");
    assert(a.bookmarked === true && b.bookmarked === true, "the deduped caller lost its answer");
    assert(a.target === K0_CLEAN && b.target === K0_CLEAN, "the deduped caller lost its target");
    assert(h.api.pendingChecks.size === 0, "the settled check was not removed from _pendingChecks");
  });

  await test("K0: the icon is read back under the checked target, not the raw tab URL", async () => {
    const tab = { id: 7, url: K0_TRACKED, title: "Article" };
    const h = buildHarness(source, [{ ...tab }, { ...tab }]);
    h.api._scheduleCurrentTabRefresh(7, K0_TRACKED);
    await h.wait();
    assert(h.calls.checks.length === 1 && h.calls.checks[0] === K0_TRACKED, "the check no longer runs on the tab URL");
    assert(h.calls.cacheReads.length === 1, "expected one status-cache read, got " + h.calls.cacheReads.length);
    assert(h.calls.cacheReads[0] === K0_CLEAN,
      "the icon read back a key nothing wrote: " + h.calls.cacheReads[0]);
    assert(h.calls.icons.length === 1 && h.calls.icons[0].state === "saved", "the icon was not applied as saved");
  });

  await test("G14: a failed self-hosted check keeps the icon a page already shows", async () => {
    for (const service of ["linkding", "karakeep"]) {
      for (const failure of G14_FAILURES) {
        const where = service + " " + failure.code;
        // Saved before and the entry has gone past its TTL, or the worker
        // restarted and holds no entry at all (the icon still shows saved).
        for (const seeded of [true, false]) {
          const h = buildStatusFailureHarness(source, { service, failure });
          if (seeded) h.api.pbpStatusCacheSet(G14_URL, h.auth, { bookmarked: true, timestamp: Date.now() - h.api.CACHE_TTL - 1, posts: [] });
          await h.refresh();
          assert(h.lookups.length === 1, where + ": the page was not checked");
          assert(h.icons.length === 0, where + (seeded ? " (expired entry)" : " (no entry)") + ": the failure set the icon to " + JSON.stringify(h.icons));
        }
      }
      // Control: a check that answers still sets the icon either way.
      for (const [bookmark, state] of [[G14_BOOKMARK, "saved"], [null, "default"]]) {
        const h = buildStatusFailureHarness(source, { service, bookmark });
        await h.refresh();
        assert(h.icons.length === 1 && h.icons[0].state === state, service + ": an answered check set " + JSON.stringify(h.icons) + ", expected " + state);
      }
    }
  });

  await test("G14: a failed check after the tab moves to another page does not keep that page's icon", async () => {
    const OTHER = "https://example.com/other-video";
    for (const service of ["linkding", "karakeep"]) {
      for (const failure of G14_FAILURES) {
        // An in-page route change (SPA) leaves the toolbar showing the page
        // before it; a new document has the icon reset by the browser.
        for (const sameDocument of [true, false]) {
          const where = service + " " + failure.code + (sameDocument ? " (route change)" : " (new document)");
          const h = buildStatusFailureHarness(source, { service, bookmark: G14_BOOKMARK });
          await h.refresh();
          assert(h.icons.length === 1 && h.icons[0].state === "saved", where + ": the saved page did not show saved: " + JSON.stringify(h.icons));
          h.answer.failure = failure;
          await h.navigate(OTHER, { sameDocument });
          assert(h.lookups.at(-1) === OTHER, where + ": the new page was not checked");
          const last = h.icons.at(-1);
          // A new document's icon is already the browser default; setting it again is harmless.
          if (sameDocument) assert(h.icons.length === 2 && last.state === "default", where + ": the page before it still shows its icon: " + JSON.stringify(h.icons));
          else assert(h.icons.every((icon, i) => i === 0 || icon.state === "default"), where + ": a failure set " + JSON.stringify(h.icons));
          // Back on a page whose icon the toolbar shows: a further failure keeps it.
          const shown = h.icons.length;
          await h.refresh();
          assert(h.icons.length === shown, where + ": a repeat failure on the same page set the icon again: " + JSON.stringify(h.icons));
        }
      }
      // The same page under a #fragment (back on the tab after an anchor
      // jump): the icon still describes it, so a failure keeps it.
      {
        const h = buildStatusFailureHarness(source, { service, bookmark: G14_BOOKMARK });
        await h.refresh();
        h.answer.failure = G14_FAILURES[0];
        h.setTabUrl(G14_URL + "#comments");
        await h.refresh();
        assert(h.icons.length === 1 && h.icons[0].state === "saved", service + ": a failure under a #fragment of the saved page set " + JSON.stringify(h.icons));
      }
      // A route away and straight back before the first check answered: the
      // toolbar never left the saved page's icon, and it is that page again.
      {
        const h = buildStatusFailureHarness(source, { service, bookmark: G14_BOOKMARK });
        await h.refresh();
        h.answer.failure = G14_FAILURES[0];
        h.answer.onLookup = (url) => { if (url === OTHER) h.setTabUrl(G14_URL); };
        await h.navigate(OTHER, { sameDocument: true });
        h.answer.onLookup = null;
        // Its entry has expired by now, in memory and in the storage.session copy.
        h.api.statusCache.clear();
        await h.api.mirrorSettled();
        delete h.session._linkdingStatus;
        await h.navigate(G14_URL, { sameDocument: true });
        assert(h.lookups.join("|") === [G14_URL, OTHER, G14_URL].join("|"), service + ": checks " + JSON.stringify(h.lookups));
        assert(h.icons.length === 1 && h.icons[0].state === "saved", service + ": back on the saved page a failure set " + JSON.stringify(h.icons));
      }
      // A worker that restarted holds no record of what the toolbar shows: an
      // in-page route change still means the icon is the page before it.
      for (const shape of [{ sameDocument: true }, { sameDocument: false, loading: true }]) {
        const h = buildStatusFailureHarness(source, { service, failure: G14_FAILURES[0] });
        await h.navigate(OTHER, shape);
        assert(h.icons.length === 1 && h.icons[0].state === "default", service + " " + JSON.stringify(shape) + " (restarted worker): the route change kept the earlier icon: " + JSON.stringify(h.icons));
      }
      // A route change while the tab is in the background runs no check, and
      // the worker may be recycled before the user comes back: the icon the
      // browser keeps for the tab must not still be the earlier page's
      // "saved" once a restarted worker's check fails on the new page.
      for (const sameDocument of [true, false]) {
        const where = service + (sameDocument ? " (background route change)" : " (background new document)");
        const before = buildStatusFailureHarness(source, { service, bookmark: G14_BOOKMARK });
        await before.refresh();
        before.tab.foreground = false;
        await before.navigate(OTHER, { sameDocument });
        assert(before.lookups.length === 1, where + ": a background tab was checked: " + JSON.stringify(before.lookups));
        const restarted = buildStatusFailureHarness(source, { service, failure: G14_FAILURES[0] });
        restarted.setTabUrl(OTHER);
        await restarted.refresh();
        const shown = [...before.icons, ...restarted.icons];
        // A new document: the browser itself reset the icon, so either way the
        // toolbar must not end on "saved".
        const finalState = sameDocument ? shown.at(-1)?.state : (restarted.icons.at(-1)?.state || "default");
        assert(finalState === "default", where + ": after a restart the toolbar still shows " + JSON.stringify(shown));
      }
      // The same, when the user leaves the tab while the new page's check is
      // still out: that check is dropped, and so is the earlier page's icon.
      {
        const before = buildStatusFailureHarness(source, { service, bookmark: G14_BOOKMARK });
        await before.refresh();
        before.answer.onLookup = (url) => { if (url === OTHER) before.tab.foreground = false; };
        await before.navigate(OTHER, { sameDocument: true });
        const restarted = buildStatusFailureHarness(source, { service, failure: G14_FAILURES[0] });
        restarted.setTabUrl(OTHER);
        await restarted.refresh();
        const shown = [...before.icons, ...restarted.icons];
        assert(shown.at(-1)?.state === "default", service + " (left mid-check): after a restart the toolbar still shows " + JSON.stringify(shown));
      }
      // Control: a background #fragment jump on the saved page leaves its icon alone.
      {
        const h = buildStatusFailureHarness(source, { service, bookmark: G14_BOOKMARK });
        await h.refresh();
        h.tab.foreground = false;
        await h.navigate(G14_URL + "#comments", { sameDocument: true });
        assert(h.icons.length === 1 && h.icons[0].state === "saved", service + ": a background anchor jump set " + JSON.stringify(h.icons));
      }
      // Control: a check that does not run for a background tab still on the
      // saved page leaves its icon alone.
      {
        const h = buildStatusFailureHarness(source, { service, bookmark: G14_BOOKMARK });
        await h.refresh();
        h.tab.foreground = false;
        await h.refresh();
        assert(h.icons.length === 1 && h.icons[0].state === "saved", service + ": a background tab on the saved page set " + JSON.stringify(h.icons));
      }
      // Control: the focused tab moving on while its check is out keeps the
      // icon for that move's own check (no saved -> default -> saved flash).
      {
        const h = buildStatusFailureHarness(source, { service, bookmark: G14_BOOKMARK });
        await h.refresh();
        // Its entry has expired by now, in memory and in the storage.session copy.
        h.api.statusCache.clear();
        await h.api.mirrorSettled();
        delete h.session._linkdingStatus;
        h.answer.onLookup = (url) => { if (url === G14_URL) h.setTabUrl(OTHER); };
        await h.refresh();
        assert(h.icons.length === 1 && h.icons[0].state === "saved", service + ": the focused tab moving on mid-check set " + JSON.stringify(h.icons));
      }
      // Control: the route change of a check that answers still sets the new page's state.
      {
        const h = buildStatusFailureHarness(source, { service, bookmark: G14_BOOKMARK });
        await h.refresh();
        h.answer.bookmark = { ...G14_BOOKMARK, url: OTHER };
        await h.navigate(OTHER, { sameDocument: true });
        assert(h.icons.length === 1 && h.icons[0].state === "saved", service + ": a saved -> saved route change changed the icon: " + JSON.stringify(h.icons));
      }
    }
  });

  await test("G14: a failed self-hosted popup lookup answers its cause after one request", async () => {
    for (const service of ["linkding", "karakeep"]) {
      for (const failure of G14_FAILURES) {
        const where = service + " " + failure.code;
        const h = buildStatusFailureHarness(source, { service, failure });
        const reply = await h.lookup();
        assert(h.lookups.length === 1, where + ": the lookup asked the server " + h.lookups.length + " times");
        assert(reply.ok === false && reply.status === 0 && reply.posts === null, where + ": reply " + JSON.stringify(reply));
        // fetchExistingBookmark's own cause names: auth -> not_logged_in (+401).
        const reason = failure.code === "auth" ? "not_logged_in" : failure.code;
        assert(reply.error === reason, where + ": the cause was lost: " + JSON.stringify(reply));
        assert(reply.httpStatus === failure.status, where + ": the HTTP status was lost: " + JSON.stringify(reply));
        assert(pbpBookmarkFailureKey(reply.error === "not_logged_in" ? { reason: reply.error, httpStatus: reply.httpStatus } : reply.error, service),
          where + ": the popup has no copy for the cause " + reply.error);
        assert(h.api.statusCache.size === 0, where + ": a failed lookup wrote the status cache");
      }
    }
  });

  await test("G14: a self-hosted lookup still refreshes a cache entry that carries no posts, once", async () => {
    for (const service of ["linkding", "karakeep"]) {

  await test("G26: linkding with its browsing checks off asks nothing on tab events and leaves the icon", async () => {
    const OTHER = "https://example.com/other";
    for (const checkStatus of [true, false]) {
      const h = buildStatusFailureHarness(source, { bookmark: G14_BOOKMARK, checkStatus, linkdingPreload: false });
      await h.refresh();

  // A save marks its page saved (setIcon with the page). Moving within the
  // document to another page, in either shape Chromium reports it, keeps the
  // browser's icon up: with nothing asked, "saved" must not stay on that page.
  // Back on the saved page nothing is undone or asked.
  await test("G26: with browsing checks off a saved icon does not follow an in-page route change", async () => {
    const OTHER = "https://example.com/other";
    for (const shape of [{ sameDocument: true }, { sameDocument: false, loading: true }]) {
      const h = buildStatusFailureHarness(source, { bookmark: G14_BOOKMARK, linkdingPreload: false });
      h.api.setIcon(7, "saved", G14_URL);
      await h.navigate(G14_URL + "#notes", { sameDocument: true });
      assert(h.icons.at(-1)?.state === "saved", JSON.stringify(shape) + ": a #fragment jump dropped the saved icon " + JSON.stringify(h.icons));
      await h.navigate(OTHER, shape);
      assert(h.lookups.length === 0, JSON.stringify(shape) + ": linkding was asked " + JSON.stringify(h.lookups));
      assert(h.icons.at(-1)?.state === "default", JSON.stringify(shape) + ": the saved icon stayed on another page " + JSON.stringify(h.icons));
    }
    // The worker that set "saved" was stopped: the browser still shows that
    // icon, and the new worker has no record of it. A route change in either
    // shape must still drop it, without asking linkding.
    for (const shape of [{ sameDocument: true }, { sameDocument: false, loading: true }]) {
      const restarted = buildStatusFailureHarness(source, { bookmark: G14_BOOKMARK, linkdingPreload: false });
      await restarted.navigate(OTHER, shape);
      assert(restarted.lookups.length === 0, JSON.stringify(shape) + " (restarted worker): linkding was asked " + JSON.stringify(restarted.lookups));
      assert(restarted.icons.at(-1)?.state === "default", JSON.stringify(shape) + " (restarted worker): the earlier page's icon stayed " + JSON.stringify(restarted.icons));
    }
  });

  await test("G26: linkding with its browsing checks on asks once per page and shows the answer, whatever the status icon setting", async () => {
    const OTHER = "https://example.com/other";

      await h.navigate(OTHER, { sameDocument: false });

    }
  });

  await test("G26: Pinboard and Karakeep follow the status icon setting, never linkding's", async () => {
    for (const service of ["pinboard", "karakeep"]) {

  await test("G26: the next worker answers the popup from a linkding check the stopped one made", async () => {
    const session = {};
    const first = buildStatusFailureHarness(source, { bookmark: G14_BOOKMARK, session });
    await first.refresh();
    await first.api.mirrorSettled();
    assert(first.lookups.length === 1, "the first worker did not check the page");
    const next = buildStatusFailureHarness(source, { bookmark: G14_BOOKMARK, session });
    const reply = await next.lookup();
    assert(next.lookups.length === 0, "the next worker asked linkding again");
    assert(reply.ok === true && reply.posts?.[0]?.href === G14_URL, "the copied answer was not served: " + JSON.stringify(reply));
    // Another connection, an expired copy and a deleted entry are misses.
    const other = buildStatusFailureHarness(source, { bookmark: G14_BOOKMARK, session });
    other.auth.account = "linkding:https://other.example/:id-2";
    await other.lookup();
    assert(other.lookups.length === 1, "another connection was served this connection's copy");
    const row = session._linkdingStatus;
    row.entries[G14_URL].timestamp = Date.now() - first.api.CACHE_TTL - 1;
    const expired = buildStatusFailureHarness(source, { bookmark: G14_BOOKMARK, session });
    await expired.lookup();
    assert(expired.lookups.length === 1, "an expired copy was served");
    await expired.api.mirrorSettled();
    expired.api.pbpStatusCacheDelete(G14_URL, expired.auth);
    await expired.api.mirrorSettled();
    const deleted = buildStatusFailureHarness(source, { bookmark: G14_BOOKMARK, session });
    await deleted.lookup();
    assert(deleted.lookups.length === 1, "a deleted entry was served from the copy");
  });

  await test("G26: the storage.session copy holds a bounded number of pages, Pinboard and Karakeep none", async () => {
    const session = {};
    const h = buildStatusFailureHarness(source, { session });
    for (let i = 0; i < 30; i++) h.api.pbpStatusCacheSet("https://example.com/p" + i, h.auth, { bookmarked: false, timestamp: Date.now() + i, posts: [] });
    await h.api.mirrorSettled();
    const urls = Object.keys(session._linkdingStatus.entries);
    assert(urls.length > 0 && urls.length <= 20 && urls.includes("https://example.com/p29"), "copy holds " + urls.length + " pages");
    for (const service of ["pinboard", "karakeep"]) {
      const other = {};
      const o = buildStatusFailureHarness(source, { service, session: other });
      o.api.pbpStatusCacheSet(G14_URL, o.auth, { bookmarked: true, timestamp: Date.now(), posts: [] });
      await o.api.mirrorSettled();
      assert(Object.keys(other).length === 0, service + " was copied to storage.session");
    }
  });
}
