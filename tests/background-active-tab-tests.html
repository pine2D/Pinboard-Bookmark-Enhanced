<style>
body { font-family: monospace; padding: 16px; max-width: 1000px; }
.case { padding: 4px 8px; margin: 4px 0; }
.pass { color: #0a0; background: #f0fff0; }
.fail { color: #c00; background: #fff0f0; font-weight: bold; }

<body>
<h1>Background Active Tab Tests</h1>
<div id="results"></div>
<script src="../shared.js"></script>
<script src="../wayback.js"></script>
<script src="../bookmark-services.js"></script>
<script>
function assert(condition, message) {
  if (!condition) throw new Error(message || "assertion failed");
}

async function test(name, fn) {
  const div = document.createElement("div");
  div.className = "case";
  try {
    await fn();
    div.classList.add("pass");
    div.textContent = "PASS " + name;
  } catch (error) {
    div.classList.add("fail");
    div.textContent = "FAIL " + name + "\n  " + error.message;
  }
  document.getElementById("results").appendChild(div);
}

function buildHarness(source, queryTabs, bookmarkResult = true) {
  const start = source.indexOf("async function _getFocusedActiveTab");
  const end = source.indexOf("// ---- \u6807\u7b7e\u9875\u6fc0\u6d3b/\u66f4\u65b0\u65f6\u5237\u65b0\u56fe\u6807", start);
  assert(start >= 0 && end > start, "active-tab refresh helpers not found");

  const calls = { queries: [], schedule: [], activity: 0, checks: [], icons: [], mirrors: [], cacheReads: [] };
  let scheduledWork = Promise.resolve();
  const chrome = { tabs: { query: async (query) => {
    calls.queries.push(query);
    return [queryTabs.shift()];
  } } };
  const schedule = (tabId, fn, delay) => {
    calls.schedule.push({ tabId, delay });
    scheduledWork = fn();
  };
  const noteActivity = () => { calls.activity++; };
  // K0: debouncedCheck answers { bookmarked, target } -- `target` is the URL it
  // actually asked Pinboard about (the cleaned one whenever urlClean applies),
  // and it is the ONLY key the status cache holds that answer under. A
  // non-boolean bookmarkResult stands for the disabled/short-circuit path,
  // where debouncedCheck returns nothing at all.
  const debouncedCheck = async (url) => {
    calls.checks.push(url);
    if (typeof bookmarkResult !== "boolean") return undefined;
    return { bookmarked: bookmarkResult, target: stripTrackingParams(url, { enabled: true }).cleaned };
  };
  const setIcon = (tabId, state) => { calls.icons.push({ tabId, state }); };
  const writeMirror = async (...args) => { calls.mirrors.push(args); };
  // _scheduleCurrentTabRefresh re-derives auth + cache to compute the tri-state icon
  // (Task 2); iconStateFor itself is a real global via the shared.js <script> tag above.
  const getCurrentBookmarkAuth = async () => ({ token: "t", account: "alice", epoch: 1 });
  const pbpStatusCacheGet = (url, auth) => {
    calls.cacheReads.push(url);
    return { bookmarked: bookmarkResult === true };
  };

  const make = new Function(
    "chrome", "_scheduleTabCheck", "noteActivity", "debouncedCheck", "setIcon", "_writeCurrentTabMirror",
    "getCurrentBookmarkAuth", "pbpStatusCacheGet",
    source.slice(start, end) + "; return { _getFocusedActiveTab, _scheduleCurrentTabRefresh };"
  );
  const api = make(chrome, schedule, noteActivity, debouncedCheck, setIcon, writeMirror,
    getCurrentBookmarkAuth, pbpStatusCacheGet);
  return { api, calls, wait: () => scheduledWork };
}

// K0: the whole bookmark-status chain in one scope -- the cache primitives,
// debouncedCheck and checkBookmarked, sliced from the shipped file rather than
// re-implemented. The invariant under test is that the URL handed to posts/get,
// the _pendingChecks dedup key and the statusCache key are ONE value, and that
// the value is the URL the popup saves under (popup.js _bookmarkPrefetchUrl).
// Asserting that with stubs for checkBookmarked would prove nothing: the cache
// key is written inside checkBookmarked, so it has to be the real one.
function buildStatusChainHarness(source, { urlClean, warm = true, posts = [], hold = false } = {}) {
  const cacheStart = source.indexOf("const statusCache = new Map();");
  const cacheEnd = source.indexOf("// ---- P2: Cached token + invalidation ----", cacheStart);
  const checkStart = source.indexOf("async function debouncedCheck(url) {");
  const checkEnd = source.indexOf("// ---- Load settings with deobfuscation", checkStart);
  const lookupStart = source.indexOf("async function checkBookmarked(url, capturedAuth = null) {");
  const lookupEnd = source.indexOf("// ---- Badge: unread count ----", lookupStart);
  assert(cacheStart >= 0 && cacheEnd > cacheStart, "status cache primitives not found");
  assert(checkStart >= 0 && checkEnd > checkStart, "debouncedCheck source not found");
  assert(lookupStart >= 0 && lookupEnd > lookupStart, "checkBookmarked source not found");

  const fetches = [];
  const storageReads = [];
  // epoch 0 matches the `let _pinboardAuthEpoch = 0` the sliced cache block declares.
  const auth = { token: "alice:secret", account: "alice", epoch: 0 };
  const stored = { optCheckBookmarkStatus: true, urlClean };
  // `hold` keeps every posts/get in flight so a concurrency assertion can look
  // at _pendingChecks while the merge window is still open.
  let release = () => {};
  const gate = hold ? new Promise((resolve) => { release = resolve; }) : Promise.resolve();
  const deps = {
    SETTINGS_DEFAULTS,
    stripTrackingParams,
    pbpPinboardAccountFromToken,
    _warmSettings: warm ? { ...stored } : null,
    getCurrentBookmarkAuth: async () => auth,
    getSettingsStorage: async () => ({
      get: async (defaults) => {
        storageReads.push(Object.keys(defaults));
        const out = { ...defaults };
        for (const key of Object.keys(defaults)) if (stored[key] !== undefined) out[key] = stored[key];
        return out;
      },
    }),
    pinboardFetch: async (requestUrl) => {
      fetches.push(requestUrl);
      await gate;
      return { ok: true, status: 200, json: async () => ({ posts }) };
    },
    console: { warn: () => {} },
  };
  const names = Object.keys(deps);
  const body = [
    "const _pendingChecks = new Map();",
    "let _settingsCache = _warmSettings;",
    source.slice(cacheStart, cacheEnd),
    source.slice(checkStart, checkEnd),
    source.slice(lookupStart, lookupEnd),
    "return { debouncedCheck, checkBookmarked, statusCache, pendingChecks: _pendingChecks, pbpStatusCacheGet };",
  ].join("\n");
  const api = new Function(...names, body)(...names.map((name) => deps[name]));
  return { api, auth, fetches, storageReads, release: () => release() };
}

const K0_URL_CLEAN_ON = { enabled: true, onPopupOpen: true, onPaste: true, aggressiveMode: false, customParams: [], excludeParams: [] };
const K0_TRACKED = "https://example.com/post?utm_source=newsletter";
const K0_CLEAN = "https://example.com/post";
const K0_POST = { href: K0_CLEAN, description: "Article", extended: "Notes", tags: "alpha beta", shared: "no", toread: "no" };

// The tabs.onUpdated listener decides two things per event: whether to schedule
// a status check, and whether the per-tab icon dedup entry still describes what
// the toolbar shows. Both are behavioural, so drive the real listener with the
// real _urlWithoutFragment rather than reading the source as text.
function buildTabUpdateHarness(source) {
  const helperStart = source.indexOf("function _urlWithoutFragment");
  const helperEnd = source.indexOf("function _scheduleCurrentTabRefresh", helperStart);
  const listener = source.match(/chrome\.tabs\.onUpdated\.addListener\(\(tabId, changeInfo, tab\) => \{[\s\S]*?\n\}\);/);
  assert(helperStart >= 0 && helperEnd > helperStart && listener, "tabs.onUpdated listener not found");
  const calls = { refresh: [] };
  const state = { icons: new Map(), checked: new Map(), iconPages: new Map() };
  let handler = null;
  const deps = {
    chrome: { tabs: { onUpdated: { addListener: (fn) => { handler = fn; } } } },
    _lastIconState: state.icons,
    _iconPageUrl: state.iconPages,
    _lastCheckedUrl: state.checked,
    _scheduleCurrentTabRefresh: (tabId, tabUrl) => calls.refresh.push({ tabId, url: tabUrl }),
  };
  new Function(...Object.keys(deps), source.slice(helperStart, helperEnd) + listener[0])(...Object.values(deps));
  return { fire: (...args) => handler(...args), calls, ...state };
}

function buildProxyHarness(source) {
  const start = source.indexOf('if (message.type === "pinboard_api_call")');
  const end = source.indexOf('if (message.type === "retry_offline_item"', start);
  assert(start >= 0 && end > start, "Pinboard proxy branch not found");
  const branch = source.slice(start, end);
  const runBranch = new Function(
    "message", "sendResponse", "pinboardFetch", "pinboardFetchImmediate",
    "pbpIsAllowedPinboardApiUrl", "getCurrentBookmarkAuth",
    "pbpAuthorizePinboardApiUrl", "pbpBookmarkAuthIsCurrent", branch
  );
  return {
    branch,
    async invoke(message) {
      const calls = { fetch: [], responses: [] };
      const fetchStub = (...args) => {
        calls.fetch.push(args);
        return Promise.resolve({ ok: true, status: 200, text: async () => "{}" });
      };
      const auth = { token: "alice:new", account: "alice", epoch: 1 };
      const returned = runBranch(
        message,
        (response) => calls.responses.push(response),
        fetchStub,
        fetchStub,
        pbpIsAllowedPinboardApiUrl,
        async () => auth,
        pbpAuthorizePinboardApiUrl,
        (candidate) => candidate === auth
      );
      await new Promise((resolve) => setTimeout(resolve, 0));
      return { branch, calls, returned };
    }
  };
}

function buildLegacyPermissionMigrationHarness(source, chrome) {
  const start = source.indexOf("const PBP_LEGACY_WILDCARD_CLEANUP_KEY");
  const end = source.indexOf("pbpMigrateLegacyWildcardPermission().catch", start);
  assert(start >= 0 && end > start, "legacy wildcard migration not found");
  return new Function("chrome", source.slice(start, end) +
    "; return { key: PBP_LEGACY_WILDCARD_CLEANUP_KEY, run: pbpMigrateLegacyWildcardPermission };")(chrome);
}

function buildBackgroundSaveHarness(source, callAI, cached = {}, settingsPatch = {}, hasKey = true, overrides = {}) {
  const start = source.indexOf("async function saveFromBackground");
  const end = source.indexOf("// Helper: resolve prefix-specific settings", start);
  assert(start >= 0 && end > start, "background save function not found");
  const notifications = [];
  const intents = [];
  const deliveries = [];
  const settings = {
    pinboardToken: "token", bgSaveMode: "merge", aiProvider: "openai",
    aiCacheDuration: 60, aiContentSource: "local", aiTagSeparator: "space",
    _aiTags: true, _aiSummary: true, _autoNotes: false, _blockquote: false,
    customTagPrompt: "", customSummaryPrompt: "", ...settingsPatch,
  };
  const extractionCalls = [];
  const cacheWrites = [];
  const i18nReadyCalls = { count: 0 };
  const dependencies = {

    buildAutoNotes: () => "",
    // ai.js's: a page read as HTML (or with no recorded type).
    pbpPageInfoReadable:info=>!!info&&info._pbpUnavailable!==true&&["","text/html","application/xhtml+xml"].includes(String(info.contentType||"").split(";")[0].trim()),
    hasAIKey: () => hasKey,
    getAICache: async (_url, kind) => cached[kind] ?? null,
    callAI,
    buildCombinedPrompt: () => "combined",
    parseAICombined: () => ({ tags: ["combined-tag"], summary: "combined-summary" }),
    setAICache: async (...args) => { cacheWrites.push(args); },
    escapeForExtended: (value) => value,
    buildTagPrompt: () => "tags",
    refineTags: (tags) => tags,
    parseAITags: (value) => value,

    buildSummaryPrompt: () => "summary",
    submitSaveIntent: async (intent, options) => { intents.push(intent); deliveries.push(options); return { status: "saved", mutation: "updated" }; },
    processOfflineQueue: () => Promise.resolve(),
    t: (key, value) => `${key}:${value || ""}`,
    // K100: pbpI18nReady must be a dep of every harness that slices
    // saveFromBackground, or the sliced function throws ReferenceError. Default
    // is an already-resolved promise so the 57 existing cases below stay unchanged.
    pbpI18nReady: () => { i18nReadyCalls.count++; return Promise.resolve(); },

    chrome: { permissions: { contains: async () => true } },

// G14: the status chain a failed self-hosted check runs through, end to end in
// one scope: the real cache, debouncedCheck/_dedupedBookmarkCheck,
// checkBookmarked, fetchExistingBookmark, the toolbar refresh and the worker's
// lookup_bookmark branch. Only the adapter's lookup is stubbed, failing the
// way bookmark-services.js fails it (pbpBookmarkServiceError: code + status).
const G14_URL = "https://example.com/article";
function buildStatusFailureHarness(source, { service = "linkding", failure = null, bookmark = null, pinboardStatus = 200, checkStatus = true, linkdingPreload = true, session = {} } = {}) {
  const slice = (from, to) => {
    const start = source.indexOf(from);
    const end = source.indexOf(to, start);
    assert(start >= 0 && end > start, "source slice not found: " + from);
    return source.slice(start, end);
  };
  const lookups = [];
  const pinboardRequests = [];
  const icons = [];
  const listeners = {};
  // The lookup's answer can change between steps (a page saved, a server down).
  const answer = { failure, bookmark };
  const activeTab = { id: 7, url: G14_URL, title: "Article", active: true };
  // tab.foreground false: tab 7 is not the focused window's active tab (the
  // user is on tab 99), so a check scheduled for it does not run.
  const tab = { foreground: true };
  let scheduled = Promise.resolve();
  // epoch 0 matches the `let _pinboardAuthEpoch = 0` the sliced cache block declares.
  const auth = service === "pinboard"
    ? { service: "pinboard", token: "alice:secret", account: "alice", epoch: 0 }
    : { service, token: "fixture-token", account: service + ":https://bookmarks.example/:id-1", baseUrl: "https://bookmarks.example/", epoch: 0 };
  const deps = {
    SETTINGS_DEFAULTS, stripTrackingParams, pbpBookmarkLookupUrl, pbpPinboardAccountFromToken,
    pbpSelfHostedAuth, pbpBookmarkAsPost, pbpBookmarkFailureRetryable, pbpRetryAfterDelay, iconStateFor,
    getCurrentBookmarkAuth: async () => auth,
    getSettingsStorage: async () => ({ get: async (defaults) => ({ ...defaults }) }),
    pbpBookmarkClient: () => {
      const lookup = async (url) => {
        lookups.push(url);
        if (answer.onLookup) answer.onLookup(url);
        if (answer.failure) throw pbpBookmarkServiceError(answer.failure.code, answer.failure.status);
        return answer.bookmark && answer.bookmark.url === url ? answer.bookmark : null;
      };
      // check(): the same answer plus what the server read from the page (none here).
      return { lookup, check: async (url) => ({ bookmark: await lookup(url), metadata: null }) };
    },
    pinboardFetch: async (url) => {
      pinboardRequests.push(url);
      if (pinboardStatus !== 200) return { ok: false, status: pinboardStatus, json: async () => ({}) };
      return { ok: true, status: 200, json: async () => ({ posts: [] }) };
    },
    // The real setIcon runs; the platform call records the state it was given.
    chrome: {
      tabs: {
        query: async () => [tab.foreground ? { ...activeTab } : { id: 99, url: "https://elsewhere.example/", title: "Elsewhere", active: true }],
        get: async (id) => { if (id !== 7) throw new Error("No tab with id: " + id); return { ...activeTab, active: tab.foreground }; },
        onActivated: { addListener: (fn) => { listeners.activated = fn; } },
        onUpdated: { addListener: (fn) => { listeners.updated = fn; } },
      },
      action: { setIcon: (details, done) => { icons.push({ tabId: details.tabId, state: details.path }); if (done) done(); } },
      runtime: { lastError: undefined },
      // storage.session as the next worker finds it: `session` is shared
      // between two harnesses to stand for a worker that was stopped.
      storage: { session: {
        get: async (key) => (key in session ? { [key]: structuredClone(session[key]) } : {}),
        set: async (items) => { for (const [key, value] of Object.entries(items)) session[key] = structuredClone(value); },
        remove: async (key) => { delete session[key]; },
      } },
    },
    ICONS_DEFAULT: "default", ICON_PATHS: { default: "default", saved: "saved", toread: "toread" },
    _iconImageData: {}, _ensureIconDecode: () => {},
    _scheduleTabCheck: (tabId, fn) => { scheduled = fn(); },
    noteActivity: () => {},
    _writeCurrentTabMirror: async () => {},
    console: { warn: () => {} },
  };
  const body = [
    "const _pendingChecks = new Map();",
    "let _settingsCache = { optCheckBookmarkStatus: " + checkStatus + ", linkdingPreload: " + linkdingPreload + ", urlClean: SETTINGS_DEFAULTS.urlClean };",
    slice("const statusCache = new Map();", "// ---- P2: Cached token + invalidation ----"),
    slice("async function debouncedCheck(url) {", "// ---- Load settings with deobfuscation"),
    slice("async function checkBookmarked(url, capturedAuth = null) {", "// ---- Badge: unread count ----"),
    slice("async function pbpBookmarkPostsResponse(", "async function pbpBookmarkDeleteResponse("),
    slice("async function fetchExistingBookmark(", "async function pbpSendResolvedPlan("),
    slice("const _lastIconState = new Map();", "// ---- 检查 URL 是否已收藏"),
    slice("async function _getFocusedActiveTab", "chrome.windows.onFocusChanged"),
    "function handleMessage(message, sendResponse) {\n" + slice('if (message.type === "lookup_bookmark" && message.url) {', 'if (message.type === "PBP_POPUP_DRAFT")') + "\n  return false;\n}",
    "return { handleMessage, _scheduleCurrentTabRefresh, statusCache, pbpStatusCacheSet, pbpStatusCacheDelete, CACHE_TTL, mirrorSettled: () => _statusMirrorTail };",
  ].join("\n");
  const api = new Function(...Object.keys(deps), body)(...Object.values(deps));
  return {
    api, auth, lookups, pinboardRequests, icons, answer, tab, session,
    refresh: async () => { api._scheduleCurrentTabRefresh(7, activeTab.url); await scheduled; },
    // The tab moves to `url` the way tabs.onUpdated reports it: an in-page
    // route change (pushState) carries only changeInfo.url, a new document
    // its "complete" status; the scheduled check then runs to its end.
    setTabUrl: (url) => { activeTab.url = url; },
    navigate: async (url, { sameDocument }) => {
      activeTab.url = url;
      scheduled = Promise.resolve();
      listeners.updated(7, sameDocument ? { url } : { status: "complete" }, { ...activeTab });
      await scheduled;
    },
    lookup: () => new Promise((resolve) => {
      assert(api.handleMessage({ type: "lookup_bookmark", url: G14_URL, account: auth.account }, resolve) === true, "lookup_bookmark did not keep the channel open");
    }),
  };
}
const G14_FAILURES = [{ code: "network" }, { code: "timeout" }, { code: "server", status: 503 }, { code: "auth", status: 401 }, { code: "permission" }];
const G14_BOOKMARK = { id: 1, url: G14_URL, title: "Article", notes: "", summary: "", tags: ["alpha"], private: true, toread: false, time: "2026-01-01T00:00:00Z" };

async function run() {
  const [source, popupSource] = await Promise.all([
    fetch("../background.js").then((response) => response.text()),
    fetch("../popup.js").then((response) => response.text()),
  ]);
  const url = "https://example.com/article";

  await test("Pinboard proxy allowlist accepts only the v1 API origin", () => {
    assert(pbpIsAllowedPinboardApiUrl("https://api.pinboard.in/v1/posts/get?format=json"), "valid v1 URL rejected");
    assert(pbpIsAllowedPinboardApiUrl("https://api.pinboard.in:443/v1/tags/get"), "explicit default port rejected");
  });

  await test("Pinboard proxy allowlist rejects URL credentials", () => {
    assert(!pbpIsAllowedPinboardApiUrl("https://user:pass@api.pinboard.in/v1/posts/get"), "credentials accepted");
    assert(!pbpIsAllowedPinboardApiUrl("https://@api.pinboard.in/v1/posts/get"), "empty userinfo accepted");
  });

  await test("Pinboard proxy allowlist rejects non-default ports", () => {
    assert(!pbpIsAllowedPinboardApiUrl("https://api.pinboard.in:444/v1/posts/get"), "non-default port accepted");
  });

  await test("Pinboard proxy allowlist rejects lookalike hosts", () => {
    assert(!pbpIsAllowedPinboardApiUrl("https://api.pinboard.in.evil.test/v1/posts/get"), "suffix lookalike accepted");
    assert(!pbpIsAllowedPinboardApiUrl("https://api-pinboard.in/v1/posts/get"), "hyphen lookalike accepted");
  });

  await test("Pinboard proxy allowlist rejects paths outside /v1/", () => {
    assert(!pbpIsAllowedPinboardApiUrl("https://api.pinboard.in/v1"), "bare /v1 accepted");
    assert(!pbpIsAllowedPinboardApiUrl("https://api.pinboard.in/v10/posts/get"), "/v10 lookalike accepted");
  });

  await test("Pinboard proxy allowlist rejects non-HTTPS URLs", () => {
    assert(!pbpIsAllowedPinboardApiUrl("http://api.pinboard.in/v1/posts/get"), "HTTP accepted");
  });

  await test("Pinboard proxy allowlist rejects malformed and relative URLs", () => {
    assert(!pbpIsAllowedPinboardApiUrl("not a url"), "malformed URL accepted");
    assert(!pbpIsAllowedPinboardApiUrl("/v1/posts/get"), "relative URL accepted");
  });

  await test("Pinboard proxy branch rejects invalid targets with zero fetch", async () => {
    const h = buildProxyHarness(source);
    const result = await h.invoke({ type: "pinboard_api_call", url: "https://evil.test/v1/posts/get" });
    assert(result.returned === true, "async message channel not retained");
    assert(result.calls.fetch.length === 0, "invalid target reached pinboardFetch");
    assert(result.calls.responses[0]?.error === "invalid_pinboard_api_url", "bounded rejection missing");
  });

  await test("Pinboard proxy branch forwards only an allowed URL and no caller options", async () => {
    const h = buildProxyHarness(source);
    const result = await h.invoke({
      type: "pinboard_api_call",
      url: "https://api.pinboard.in/v1/posts/get?auth_token=alice%3Aold&format=json",
      options: { method: "POST", headers: { Authorization: "attacker" } },
    });
    // Roadmap #23: the SW may pass its OWN options object, but it must be
    // exactly the clamped-timeout shape — never the caller's options (method/
    // headers smuggling). message.options above is deliberately hostile.
    assert(result.calls.fetch.length === 1, "proxy did not dispatch exactly once");
    const fwd = result.calls.fetch[0][1];
    assert(fwd === undefined ||
      (fwd && Object.keys(fwd).join(",") === "timeoutMs" && typeof fwd.timeoutMs === "number" &&
       fwd.timeoutMs >= 1000 && fwd.timeoutMs <= 60000),
      "pinboardFetch received something beyond the clamped timeoutMs shape");
    assert(result.branch.includes("pbpIsAllowedPinboardApiUrl(message.url)"), "branch does not call allowlist helper");
    assert(!result.branch.includes("message.options"), "branch still reads message.options");
    const override = popupSource.slice(popupSource.indexOf("pinboardFetch = function"), popupSource.indexOf("let currentTags"));
    assert(!override.includes("options"), "Popup proxy still sends options");
  });

  await test("legacy wildcard migration marker makes cleanup one-time", async () => {
    let permissionCalls = 0, writes = 0;
    const chrome = {
      storage: { local: {
        get: async () => ({ _legacyWildcardCleanupV1: true }),
        set: async () => { writes++; },
      } },
      permissions: { contains: async () => { permissionCalls++; return true; }, remove: async () => true },
    };
    await buildLegacyPermissionMigrationHarness(source, chrome).run();
    assert(permissionCalls === 0 && writes === 0, "completed migration touched permissions or storage");
  });

  await test("profiles without a wildcard keep existing exact grants and record cleanup", async () => {
    let removes = 0, marker = null, exactActive = true;
    const chrome = {
      storage: { local: {
        get: async () => ({}),
        set: async (value) => { marker = value; },
      } },
      permissions: { contains: async () => false, remove: async () => { removes++; exactActive = false; return true; } },
    };
    const h = buildLegacyPermissionMigrationHarness(source, chrome);
    await h.run();
    assert(removes === 0 && exactActive && marker?.[h.key] === true,
      "no-wildcard profile removed an existing exact grant or failed to settle");
  });

  await test("legacy wildcard cleanup marks only a verified removal", async () => {
    for (const removalWorks of [true, false]) {
      let active = true, marker = null, removes = 0;

  await test("token test fetch refuses redirects and keeps its deadline", async () => {
    // Pinboard v1 is GET-only, so the token rides the query string: following a
    // 3xx would hand the plaintext token to whatever host the Location names,
    // and CORS only withholds the response, never the request. Same invariant
    // shared.js's _executePinboardFetch enforces for every other v1 call.
    const start = source.indexOf('if (message.type === "test_pinboard_token"');
    const end = source.indexOf("// ---- Image-fix Referer rules", start);
    assert(start >= 0 && end > start, "token test branch not found");
    const calls = [];
    const responses = [];
    const runBranch = new Function("message", "sendResponse", "fetch",
      source.slice(start, end));
    runBranch(
      { type: "test_pinboard_token", token: "alice:secret" },
      (response) => responses.push(response),
      (requestUrl, init) => { calls.push({ url: requestUrl, init }); return Promise.resolve({ ok: true, status: 200 }); }
    );
    await new Promise((resolve) => setTimeout(resolve, 0));
    assert(calls.length === 1, "token test did not reach fetch");
    assert(calls[0].init?.redirect === "error", "a 3xx would replay the plaintext token to its target");
    assert(calls[0].init?.signal instanceof AbortSignal, "token test lost its timeout");
    assert(calls[0].url.includes("auth_token=alice%3Asecret"), "token is not carried on the query string any more");
    assert(responses[0]?.ok === true, "token test stopped answering its caller");
  });

    assert(a.target === K0_CLEAN && b.target === K0_CLEAN, "the deduped caller lost its target");

        }

  await test("G14: a failed check after the tab moves to another page does not keep that page's icon", async () => {
    const OTHER = "https://example.com/other-video";
    for (const service of ["linkding", "karakeep"]) {
      for (const failure of G14_FAILURES) {
        // An in-page route change (SPA) leaves the toolbar showing the page
        // before it; a new document has the icon reset by the browser.
        for (const sameDocument of [true, false]) {
          const where = service + " " + failure.code + (sameDocument ? " (route change)" : " (new document)");
          const h = buildStatusFailureHarness(source, { service, bookmark: G14_BOOKMARK });
          await h.refresh();
          assert(h.icons.length === 1 && h.icons[0].state === "saved", where + ": the saved page did not show saved: " + JSON.stringify(h.icons));
          h.answer.failure = failure;
          await h.navigate(OTHER, { sameDocument });
          assert(h.lookups.at(-1) === OTHER, where + ": the new page was not checked");
          const last = h.icons.at(-1);
          // A new document's icon is already the browser default; setting it again is harmless.
          if (sameDocument) assert(h.icons.length === 2 && last.state === "default", where + ": the page before it still shows its icon: " + JSON.stringify(h.icons));
          else assert(h.icons.every((icon, i) => i === 0 || icon.state === "default"), where + ": a failure set " + JSON.stringify(h.icons));
          // Back on a page whose icon the toolbar shows: a further failure keeps it.
          const shown = h.icons.length;
          await h.refresh();
          assert(h.icons.length === shown, where + ": a repeat failure on the same page set the icon again: " + JSON.stringify(h.icons));
        }
      }
      // The same page under a #fragment (back on the tab after an anchor
      // jump): the icon still describes it, so a failure keeps it.
      {
        const h = buildStatusFailureHarness(source, { service, bookmark: G14_BOOKMARK });
        await h.refresh();
        h.answer.failure = G14_FAILURES[0];
        h.setTabUrl(G14_URL + "#comments");
        await h.refresh();
        assert(h.icons.length === 1 && h.icons[0].state === "saved", service + ": a failure under a #fragment of the saved page set " + JSON.stringify(h.icons));
      }
      // A route away and straight back before the first check answered: the
      // toolbar never left the saved page's icon, and it is that page again.
      {
        const h = buildStatusFailureHarness(source, { service, bookmark: G14_BOOKMARK });
        await h.refresh();
        h.answer.failure = G14_FAILURES[0];
        h.answer.onLookup = (url) => { if (url === OTHER) h.setTabUrl(G14_URL); };
        await h.navigate(OTHER, { sameDocument: true });
        h.answer.onLookup = null;
        // Its entry has expired by now, in memory and in the storage.session copy.
        h.api.statusCache.clear();
        await h.api.mirrorSettled();
        delete h.session._linkdingStatus;
        await h.navigate(G14_URL, { sameDocument: true });
        assert(h.lookups.join("|") === [G14_URL, OTHER, G14_URL].join("|"), service + ": checks " + JSON.stringify(h.lookups));
        assert(h.icons.length === 1 && h.icons[0].state === "saved", service + ": back on the saved page a failure set " + JSON.stringify(h.icons));
      }
      // A worker that restarted holds no record of what the toolbar shows: an
      // in-page route change still means the icon is the page before it.
      {
        const h = buildStatusFailureHarness(source, { service, failure: G14_FAILURES[0] });
        await h.navigate(OTHER, { sameDocument: true });
        assert(h.icons.length === 1 && h.icons[0].state === "default", service + " (restarted worker): the route change kept the earlier icon: " + JSON.stringify(h.icons));
      }
      // A route change while the tab is in the background runs no check, and
      // the worker may be recycled before the user comes back: the icon the
      // browser keeps for the tab must not still be the earlier page's
      // "saved" once a restarted worker's check fails on the new page.
      for (const sameDocument of [true, false]) {
        const where = service + (sameDocument ? " (background route change)" : " (background new document)");
        const before = buildStatusFailureHarness(source, { service, bookmark: G14_BOOKMARK });
        await before.refresh();
        before.tab.foreground = false;
        await before.navigate(OTHER, { sameDocument });
        assert(before.lookups.length === 1, where + ": a background tab was checked: " + JSON.stringify(before.lookups));
        const restarted = buildStatusFailureHarness(source, { service, failure: G14_FAILURES[0] });
        restarted.setTabUrl(OTHER);
        await restarted.refresh();
        const shown = [...before.icons, ...restarted.icons];
        // A new document: the browser itself reset the icon, so either way the
        // toolbar must not end on "saved".
        const finalState = sameDocument ? shown.at(-1)?.state : (restarted.icons.at(-1)?.state || "default");
        assert(finalState === "default", where + ": after a restart the toolbar still shows " + JSON.stringify(shown));
      }
      // The same, when the user leaves the tab while the new page's check is
      // still out: that check is dropped, and so is the earlier page's icon.
      {
        const before = buildStatusFailureHarness(source, { service, bookmark: G14_BOOKMARK });
        await before.refresh();
        before.answer.onLookup = (url) => { if (url === OTHER) before.tab.foreground = false; };
        await before.navigate(OTHER, { sameDocument: true });
        const restarted = buildStatusFailureHarness(source, { service, failure: G14_FAILURES[0] });
        restarted.setTabUrl(OTHER);
        await restarted.refresh();
        const shown = [...before.icons, ...restarted.icons];
        assert(shown.at(-1)?.state === "default", service + " (left mid-check): after a restart the toolbar still shows " + JSON.stringify(shown));
      }
      // Control: a background #fragment jump on the saved page leaves its icon alone.
      {
        const h = buildStatusFailureHarness(source, { service, bookmark: G14_BOOKMARK });
        await h.refresh();
        h.tab.foreground = false;
        await h.navigate(G14_URL + "#comments", { sameDocument: true });
        assert(h.icons.length === 1 && h.icons[0].state === "saved", service + ": a background anchor jump set " + JSON.stringify(h.icons));
      }
      // Control: a check that does not run for a background tab still on the
      // saved page leaves its icon alone.
      {
        const h = buildStatusFailureHarness(source, { service, bookmark: G14_BOOKMARK });
        await h.refresh();
        h.tab.foreground = false;
        await h.refresh();
        assert(h.icons.length === 1 && h.icons[0].state === "saved", service + ": a background tab on the saved page set " + JSON.stringify(h.icons));
      }
      // Control: the focused tab moving on while its check is out keeps the
      // icon for that move's own check (no saved -> default -> saved flash).
      {
        const h = buildStatusFailureHarness(source, { service, bookmark: G14_BOOKMARK });
        await h.refresh();
        // Its entry has expired by now, in memory and in the storage.session copy.
        h.api.statusCache.clear();
        await h.api.mirrorSettled();
        delete h.session._linkdingStatus;
        h.answer.onLookup = (url) => { if (url === G14_URL) h.setTabUrl(OTHER); };
        await h.refresh();
        assert(h.icons.length === 1 && h.icons[0].state === "saved", service + ": the focused tab moving on mid-check set " + JSON.stringify(h.icons));
      }
      // Control: the route change of a check that answers still sets the new page's state.
      {
        const h = buildStatusFailureHarness(source, { service, bookmark: G14_BOOKMARK });
        await h.refresh();
        h.answer.bookmark = { ...G14_BOOKMARK, url: OTHER };
        await h.navigate(OTHER, { sameDocument: true });
        assert(h.icons.length === 1 && h.icons[0].state === "saved", service + ": a saved -> saved route change changed the icon: " + JSON.stringify(h.icons));
      }
    }
  });

  await test("G14: a failed self-hosted popup lookup answers its cause after one request", async () => {
    for (const service of ["linkding", "karakeep"]) {

        const where = service + " " + failure.code;
        const h = buildStatusFailureHarness(source, { service, failure });

        assert(h.lookups.length === 1, where + ": the lookup asked the server " + h.lookups.length + " times");
        assert(reply.ok === false && reply.status === 0 && reply.posts === null, where + ": reply " + JSON.stringify(reply));
        // fetchExistingBookmark's own cause names: auth -> not_logged_in (+401).
        const reason = failure.code === "auth" ? "not_logged_in" : failure.code;
        assert(reply.error === reason, where + ": the cause was lost: " + JSON.stringify(reply));
        assert(reply.httpStatus === failure.status, where + ": the HTTP status was lost: " + JSON.stringify(reply));
        assert(pbpBookmarkFailureKey(reply.error === "not_logged_in" ? { reason: reply.error, httpStatus: reply.httpStatus } : reply.error, service),
          where + ": the popup has no copy for the cause " + reply.error);
        assert(h.api.statusCache.size === 0, where + ": a failed lookup wrote the status cache");
      }
    }
  });
