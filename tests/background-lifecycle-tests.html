function makeStore(initial, hooks) {
  const data = structuredClone(initial || {});
  const h = hooks || {};
  return {
    data,
    async get(key) {
      if (h.onGet) await h.onGet();
      const keys = typeof key === "string" ? [key] : Object.keys(key || data);
      const out = {};
      for (const k of keys) if (k in data) out[k] = structuredClone(data[k]);
      return out;
    },
    async set(obj) {
      if (h.onSet) await h.onSet();
      for (const [k, v] of Object.entries(obj)) data[k] = structuredClone(v);
    },
    async remove(key) { for (const k of [].concat(key)) delete data[k]; },
  };
}

  cw.getCurrentBookmarkAuth = async () => ({ token: "alice:t", account: opts.account || "alice", epoch: 0 });
  cw.showNotification = (...args) => { notifications.push(args); };
  cw.t = (key, ...args) => (args.length ? `${key}:${args.join(":")}` : key);
  cw.handleBatchSave = (tabs, account, reserved, resumeState) => { resumes.push({ tabs, account, reserved, resumeState }); return Promise.resolve(); };
  return {
    pbpSweepInterruptedBatch: cw.pbpSweepInterruptedBatch,
    _writeBatchProgress: cw._writeBatchProgress,
    setBatchRunning: (value) => capableSw.set("_batchRunning", value),
    notifications, resumes, local,

function buildStorageAccessHarness(opts) {
  resetCapable();
  const calls = { local: [], sync: [], create: [], clear: [], warn: [] };
  const o = opts || {};
  const session = o.session || {};
  const cw = capableSw.win, cm = capableSw.mock.chrome;
  for (const name of ["local", "sync"]) {
    cm.storage[name].setAccessLevel = async (value) => {
      calls[name].push(value);
      if (o.rejectArea === name) throw new Error(name + " unavailable");
    };
  }
  cm.storage.session.get = async (query) => {
    const out = {};
    for (const [key, fallback] of Object.entries(query || {})) out[key] = key in session ? session[key] : fallback;
    return out;
  };
  cm.storage.session.set = async (obj) => { Object.assign(session, structuredClone(obj)); };
  cm.storage.session.remove = async (key) => { for (const k of [].concat(key)) delete session[k]; };
  cm.alarms.create = async (...args) => { calls.create.push(args); };
  cm.alarms.clear = async (...args) => { calls.clear.push(args); return true; };
  cw.console.warn = (...args) => { calls.warn.push(args); };
  return {
    PBP_STORAGE_ACCESS_RETRY_ALARM: capableSw.get("PBP_STORAGE_ACCESS_RETRY_ALARM"),
    PBP_STORAGE_ACCESS_RETRY_KEY: capableSw.get("PBP_STORAGE_ACCESS_RETRY_KEY"),
    PBP_STORAGE_ACCESS_MAX_RETRIES: capableSw.get("PBP_STORAGE_ACCESS_MAX_RETRIES"),
    pbpRestrictStorageAccess: cw.pbpRestrictStorageAccess,
    calls, session,
  };
}

function buildUndoHarness(opts) {
  resetCapable();
  const o = opts || {};
  const cleared = [], alarms = [];
  let pendingClear = null, timersScheduled = 0;
  const session = makeStore(o.session || {}, o.hooks);
  const cw = capableSw.win, cm = capableSw.mock.chrome;
  const recentSaves = capableSw.get("_recentSaves");
  recentSaves.clear();
  cm.storage.session.get = session.get;
  cm.storage.session.set = session.set;
  cm.storage.session.remove = session.remove;
  cm.notifications.clear = (id) => {
    cleared.push(id);
    if (o.clearRejects) return new Promise((_, reject) => { pendingClear = reject; });
    return Promise.resolve(true);
  };
  cm.alarms.create = (name, info) => { alarms.push({ name, info }); };
  cw.setTimeout = (...args) => { timersScheduled++; return realCapable.fns.setTimeout(...args); };
  return {
    _recentSaves: recentSaves,
    PBP_UNDO_KEY: capableSw.get("PBP_UNDO_KEY"),
    PBP_UNDO_TTL: capableSw.get("PBP_UNDO_TTL"),
    PBP_UNDO_ALARM: capableSw.get("PBP_UNDO_ALARM"),
    pbpRememberUndo: cw.pbpRememberUndo,
    pbpTakeUndoRecord: cw.pbpTakeUndoRecord,
    pbpSweepExpiredUndo: cw.pbpSweepExpiredUndo,
    pbpClearNotification: cw.pbpClearNotification,
    cleared, alarms, session,
    timersScheduled: () => timersScheduled,
    rejectClear: (error) => { pendingClear && pendingClear(error); },
  };
}

(async () => {
  await bootRealms();
  const STALE = { running: true, done: false, runId: "run-a", account: "alice", i: 3, total: 9, ts: Date.now() - 10 * 60 * 1000 };

  // ---- pbpSweepInterruptedBatch ----
  {
    const h = buildSweepHarness({ progress: STALE });
    await h.pbpSweepInterruptedBatch();
    const written = h.local.data.batch_progress;
    check("a stale running record is closed out and announced once",
      written.running === false && written.done === true && written.error === "interrupted" &&
      written.i === 3 && written.total === 9 && typeof written.ts === "number" &&
      h.notifications.length === 1 && h.notifications[0][2] === "batchInterrupted:3:9");
  }
  {
    const job = {
      runId: "run-a", account: "alice",
      tabs: [{ id: 1, url: "https://a/1" }, { id: 2, url: "https://a/2" }, { id: 3, url: "https://a/3" }],
      next: 1, counts: { processed: 1, saved: 1 }, resumeCount: 0, ts: 1,
    };
    const h = buildSweepHarness({ progress: STALE });
    h.local.data.batch_job = job;
    await h.pbpSweepInterruptedBatch();
    check("sweep resumes a valid interrupted job at its cursor instead of closing it",
      h.resumes.length === 1 && h.resumes[0].reserved === true &&
      h.resumes[0].account === "alice" && h.resumes[0].resumeState.startIndex === 1 &&
      h.resumes[0].resumeState.resumeCount === 1 && h.resumes[0].resumeState.runId === "run-a" &&
      h.notifications.length === 0 && h.local.data.batch_progress.error === undefined);
  }
  {
    const h = buildSweepHarness({ progress: STALE });
    h.local.data.batch_job = { runId: "run-a", account: "alice", tabs: [{ url: "https://a/1" }], next: 0, counts: {}, resumeCount: 2, ts: 1 };
    await h.pbpSweepInterruptedBatch();
    check("a job past its revival budget is dropped and the batch closes as interrupted",
      h.resumes.length === 0 && !("batch_job" in h.local.data) &&
      h.local.data.batch_progress.error === "interrupted" && h.notifications.length === 1);
  }
  {
    const h = buildSweepHarness({ progress: STALE });
    h.local.data.batch_job = { runId: "run-b", account: "alice", tabs: [{ url: "https://b/1" }], next: 0, counts: {}, resumeCount: 0, ts: 2 };
    await h.pbpSweepInterruptedBatch();
    check("a same-account job from another run is never resumed or deleted",
      h.resumes.length === 0 && h.local.data.batch_job.runId === "run-b" &&
      h.local.data.batch_progress.error === "interrupted");
  }
  {
    const h = buildSweepHarness({ progress: STALE });
    h.local.data.batch_job = { account: "alice", tabs: [{ url: "https://legacy/1" }], next: 0, counts: {}, resumeCount: 0, ts: 1 };
    await h.pbpSweepInterruptedBatch();
    check("a legacy job without runId cannot attach to a newer progress record",
      h.resumes.length === 0 && h.local.data.batch_progress.error === "interrupted");
  }
  {
    const h = buildSweepHarness({ progress: { ...STALE, ts: Date.now() } });
    await h.pbpSweepInterruptedBatch();
    check("a fresh heartbeat is never swept",
      h.local.data.batch_progress.running === true && h.notifications.length === 0);
  }
  {
    let gets = 0, harness;
    harness = buildSweepHarness({
      progress: STALE,
      hooks: { onGet: async () => { if (++gets === 2) harness.local.data.batch_progress = { ...STALE, runId: "run-b", i: 0 }; } },
    });
    await harness.pbpSweepInterruptedBatch();
    check("a replacement run with the same timestamp is not terminated",
      harness.local.data.batch_progress.runId === "run-b" &&
      harness.local.data.batch_progress.running === true && harness.notifications.length === 0);
  }
  {
    const h = buildSweepHarness({ progress: { ...STALE, account: "bob" } });
    await h.pbpSweepInterruptedBatch();
    check("another account's record is left untouched",
      h.local.data.batch_progress.running === true && h.notifications.length === 0);
  }
  {
    let harness;
    harness = buildSweepHarness({
      progress: STALE,
      hooks: { onGet: async () => { harness && harness.setBatchRunning(true); } },
    });
    await harness.pbpSweepInterruptedBatch();
    check("a batch that starts during the sweep's storage read is left alone",
      harness.local.data.batch_progress.running === true &&
      harness.local.data.batch_progress.done === false &&
      harness.notifications.length === 0);
  }
  {
    let gets = 0, harness;
    harness = buildSweepHarness({
      progress: STALE,
      hooks: { onGet: async () => { if (++gets === 2) harness.local.data.batch_progress = { ...STALE, i: 0, ts: Date.now() }; } },
    });
    await harness.pbpSweepInterruptedBatch();
    check("a record replaced mid-sweep is not overwritten with the stale one",
      harness.local.data.batch_progress.running === true &&
      harness.local.data.batch_progress.i === 0 &&
      harness.notifications.length === 0);
  }
  {

      check("switching " + service + " -> Pinboard (badge on) creates the alarm from the storage event", h.alarms.has("badge-refresh"));
      settings.bookmarkService = service;
      h.fire({ bookmarkService: { newValue: service } });
      await settle();
      check("switching Pinboard -> " + service + " clears the alarm from the storage event", !h.alarms.has("badge-refresh") && h.badgeUpdates.length === 2);
      settings.bookmarkService = "pinboard";
      h.fire({ bookmarkServiceActive: { newValue: "pinboard" } });
      await settle();
      check("this device switching " + service + " -> Pinboard creates the alarm from the device-service change", h.alarms.has("badge-refresh") && h.badgeUpdates.length === 3);
    }
    {
      const h = build({ optShowBadge: false, bookmarkService: "pinboard" });
      await h._syncBadgeAlarm();
      check("Pinboard with the badge switch off has no alarm", !h.alarms.has("badge-refresh"));
      const h2 = build({ optShowBadge: true, bookmarkService: "pinboard" });
      await h2._syncBadgeAlarm();
      check("Pinboard with the badge switch on keeps the alarm", h2.alarms.has("badge-refresh"));
    }
  }
  {
    const build = (service) => {
      resetCapable();
      const notes = [], fetches = [], created = [];
      const cw = capableSw.win, cm = capableSw.mock.chrome;
      cw.loadSettings = async () => ({ bookmarkService: service });
      cw.pbpBookmarkServiceId = bookmarkServiceOf;
      cw.showNotification = (...args) => { notes.push(args); };
      cw.t = (k, ...a) => (a.length ? `${k}:${a.join(":")}` : k);
      cw.fetch = async (url) => { fetches.push(String(url)); return { ok: true, status: 200 }; };
      cm.tabs.create = (info) => { created.push(info); };
      return { run: cw.handleSaveTabSet, notes, fetches, created };
    };
    for (const service of ["karakeep", "linkding"]) {
      const h = build(service);
      await h.run([{ title: "A", url: "https://a.example/" }]);
      check("Tab Set on " + service + " gives one visible error notice and sends nothing",
        h.notes.length === 1 && h.notes[0][3] === "error" && h.notes[0][2] === "bgTabSetPinboardOnly" &&
        h.fetches.length === 0 && h.created.length === 0);
    }
    const h = build("pinboard");
    await h.run([{ title: "A", url: "https://a.example/" }]);
    check("Tab Set on Pinboard still posts to pinboard.in and reports saved",
      h.fetches.length === 1 && h.fetches[0] === "https://pinboard.in/tabs/save/" && h.notes.length === 1 && h.notes[0][0] === "tabset-saved");
  }

  capableSw.dispose();
  routerSw.dispose();
  document.getElementById("summary").textContent = `pass=${pass} fail=${fail}`;
})();
</script></body></html>
