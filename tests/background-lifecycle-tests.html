<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Background Lifecycle Tests</title>
<style>body{font-family:monospace;padding:16px}.case{padding:6px}.pass{color:#0a0}.fail{color:#c00}</style>
</head><body><h1>Background Lifecycle Tests</h1><div id="summary"></div><div id="results"></div>
<!--
  MV3 lifecycle behaviour of background.js that no other suite drives:
    - pbpSweepInterruptedBatch: it must never close out a batch that a retry
      claimed while the sweep was awaiting storage, and must never announce a
      terminal state that storage refused to keep.
    - the Undo notification record: it outlives the worker that created it, so it
      lives in storage.session with an expiry, swept by a named alarm instead of
      a setTimeout that dies with the worker.
  Both harnesses run the real source sliced out of background.js.
-->
<script src="../shared.js"></script>
<script>
const root = document.getElementById("results"); let pass = 0, fail = 0;
// A sync try/catch around a promise-returning chrome API "passes" every behavioural
// assertion while leaking an unhandled rejection — watch for it directly.
const unhandled = [];
addEventListener("unhandledrejection", (event) => { unhandled.push(event.reason); event.preventDefault(); });
function check(name, ok) {
  ok ? pass++ : fail++;
  const row = document.createElement("div");
  row.className = "case " + (ok ? "pass" : "fail");
  row.textContent = `${ok ? "✓" : "✗"} ${name}`;
  root.appendChild(row);
}

// chrome.storage hands back a structured clone, never a live reference: a fake
// that leaks the stored object would make a missing write-back look like a
// success. Clone on the way in and on the way out.
function makeStore(initial, hooks) {
  const data = structuredClone(initial || {});
  const h = hooks || {};
  return {
    data,
    async get(key) {
      if (h.onGet) await h.onGet();
      const keys = typeof key === "string" ? [key] : Object.keys(key || data);
      const out = {};
      for (const k of keys) if (k in data) out[k] = structuredClone(data[k]);
      return out;
    },
    async set(obj) {
      if (h.onSet) await h.onSet();
      for (const [k, v] of Object.entries(obj)) data[k] = structuredClone(v);
    },
    async remove(key) { delete data[key]; },
  };
}

// ---- Batch sweep harness ----
function buildSweepHarness(source, opts) {
  const start = source.indexOf("let _batchRunning = false;");
  const end = source.indexOf("function handleBatchSave", start);
  if (start < 0 || end <= start) throw new Error("batch sweep source not found");
  const notifications = [];
  const local = makeStore({ batch_progress: opts.progress }, opts.hooks);
  const resumes = [];
  const deps = {
    chrome: { storage: { local } },
    batchIsRunning,
    BATCH_STALE_TTL,
    getCurrentPinboardAuth: async () => ({ token: "alice:t", account: opts.account || "alice", epoch: 0 }),
    showNotification: (...args) => { notifications.push(args); },
    t: (key, ...args) => (args.length ? `${key}:${args.join(":")}` : key),
    handleBatchSave: (tabs, account, reserved, resumeState) => { resumes.push({ tabs, account, reserved, resumeState }); return Promise.resolve(); },
    console,
  };
  const factory = new Function(...Object.keys(deps), `${source.slice(start, end)}
    return {
      pbpSweepInterruptedBatch,
      _writeBatchProgress,
      setBatchRunning: (value) => { _batchRunning = value; },
    };`);
  return { ...factory(...Object.values(deps)), notifications, resumes, local };
}

function buildStorageAccessHarness(source, opts) {
  const start = source.indexOf("const PBP_STORAGE_ACCESS_RETRY_ALARM");
  const end = source.indexOf("// Re-assert trusted-only storage", start);
  if (start < 0 || end <= start) return null;
  const calls = { local: [], sync: [], create: [], clear: [], warn: [] };
  const o = opts || {};
  const area = (name) => ({
    async setAccessLevel(value) {
      calls[name].push(value);
      if (o.rejectArea === name) throw new Error(name + " unavailable");
    },
  });
  // storage.session outlives the worker but not the browser session, so a
  // caller can hand the SAME object to several harnesses to model consecutive
  // worker generations — which is the only way a retry budget can be observed.
  const session = o.session || {};
  const sessionArea = {
    async get(query) {
      const out = {};
      for (const [key, fallback] of Object.entries(query || {})) {
        out[key] = key in session ? session[key] : fallback;
      }
      return out;
    },
    async set(obj) { Object.assign(session, structuredClone(obj)); },
    async remove(key) { for (const k of [].concat(key)) delete session[k]; },
  };
  const deps = {
    chrome: {
      storage: { local: area("local"), sync: area("sync"), session: sessionArea },
      alarms: {
        create: async (...args) => { calls.create.push(args); },
        clear: async (...args) => { calls.clear.push(args); return true; },
      },
    },
    console: { warn: (...args) => calls.warn.push(args) },
  };
  const factory = new Function(...Object.keys(deps), `${source.slice(start, end)}
    return {
      PBP_STORAGE_ACCESS_RETRY_ALARM, PBP_STORAGE_ACCESS_RETRY_KEY,
      PBP_STORAGE_ACCESS_MAX_RETRIES, pbpRestrictStorageAccess,
    };`);
  return { ...factory(...Object.values(deps)), calls, session };
}

// Cold-start Drive sync: this call sits at the SW top level, so it re-runs on
// EVERY wake, and an idle browser is still woken every 5 minutes by the
// storage-warm alarm. Only the wake path carries a throttle; the vocab-sync-*
// alarms are the real schedule and must stay immediate.
function buildBootVocabSyncHarness(source, opts) {
  const start = source.indexOf("const PBP_VOCAB_BOOT_SYNC_KEY");
  const end = source.indexOf("async function pbpDisconnectVocabDrive", start);
  if (start < 0 || end <= start) return null;
  const o = opts || {};
  const local = o.local || {};
  const syncs = [];
  const deps = {
    chrome: {
      storage: { local: {
        async get(query) {
          const out = {};
          for (const [key, fallback] of Object.entries(query || {})) {
            out[key] = key in local ? local[key] : fallback;
          }
          return out;
        },
        async set(obj) { Object.assign(local, structuredClone(obj)); },
      } },
      permissions: { contains: async () => true },
      alarms: { clear: async () => true },
    },
    PBP_VOCAB_DRIVE_CAPABLE: true,
    PBP_VOCAB_DRIVE_CONNECTED_KEY: "vocabDriveConnected",
    PBP_GOOGLE_API_ORIGIN: "https://www.googleapis.com/*",
    pbpVocabDriveIsConnected: async () => true,
    pbpQueueVocabDriveSync: async (options) => { syncs.push(options); return { ok: true }; },
    console,
  };
  const factory = new Function(...Object.keys(deps), `${source.slice(start, end)}
    return { PBP_VOCAB_BOOT_SYNC_KEY, PBP_VOCAB_BOOT_SYNC_MIN_MS, pbpBootVocabDriveSync };`);
  return { ...factory(...Object.values(deps)), syncs, local };
}

// ---- Retired provider model defaults harness ----
// primeSettings() writes every missing SETTINGS_DEFAULTS key on install/update/
// startup, so an existing install already holds the retired model id on disk and
// swapping the source literals reaches new profiles only. The one-shot rewrite is
// the only thing that reaches existing users — and it must move a value ONLY while
// that value is still byte-identical to the retired default.
function buildRetiredModelHarness(source, opts) {
  const start = source.indexOf("const PBP_RETIRED_MODEL_FLAG");
  const end = source.indexOf("migrateRetiredProviderModels();", start);
  if (start < 0 || end <= start) return null;
  const o = opts || {};
  const warns = [];
  const writes = { local: [], sync: [] };
  // chrome.storage hands back a structured clone; a fake that leaked the stored
  // object would make a missing write-back read as a success.
  const area = (name, seed) => {
    const data = structuredClone(seed || {});
    return {
      data,
      async get(query) {
        if (o.rejectArea === name) throw new Error(name + " unavailable");
        const out = {};
        for (const key of [].concat(query)) if (key in data) out[key] = structuredClone(data[key]);
        return out;
      },
      async set(obj) {
        if (o.rejectArea === name) throw new Error(name + " unavailable");
        writes[name].push(structuredClone(obj));
        Object.assign(data, structuredClone(obj));
      },
    };
  };
  const local = area("local", o.local);
  const sync = area("sync", o.sync);
  const deps = {
    chrome: { storage: { local, sync } },
    console: { warn: (...args) => warns.push(args) },
  };
  const factory = new Function(...Object.keys(deps), `${source.slice(start, end)}
    return { PBP_RETIRED_MODEL_FLAG, PBP_RETIRED_MODEL_DEFAULTS, migrateRetiredProviderModels };`);
  return { ...factory(...Object.values(deps)), local, sync, writes, warns };
}

// ---- Undo notification harness ----
function buildUndoHarness(source, opts) {
  const start = source.indexOf("// F7: Track recent saves");
  const end = source.indexOf("// ---- Show Chrome notification", start);
  if (start < 0 || end <= start) throw new Error("undo source not found");
  const o = opts || {};
  const cleared = [];
  const alarms = [];
  let pendingClear = null;
  const session = makeStore(o.session || {}, o.hooks);
  const deps = {
    chrome: {
      storage: { session },
      notifications: {
        clear: (id) => {
          cleared.push(id);
          // Deferred rejection: the caller can only survive it by awaiting the
          // promise — a sync try/catch resolves before the rejection ever lands.
          if (o.clearRejects) return new Promise((_, reject) => { pendingClear = reject; });
          return Promise.resolve(true);
        },
      },
      alarms: { create: (name, info) => { alarms.push({ name, info }); } },
    },
    console,
  };
  const factory = new Function(...Object.keys(deps), `${source.slice(start, end)}
    return {
      _recentSaves, PBP_UNDO_KEY, PBP_UNDO_TTL, PBP_UNDO_ALARM,
      pbpRememberUndo, pbpTakeUndoRecord, pbpSweepExpiredUndo, pbpClearNotification,
    };`);
  return { ...factory(...Object.values(deps)), cleared, alarms, session,
    rejectClear: (error) => { pendingClear && pendingClear(error); } };
}

(async () => {
  const source = await fetch("../background.js").then((response) => response.text());
  const STALE = { running: true, done: false, runId: "run-a", account: "alice", i: 3, total: 9, ts: Date.now() - 10 * 60 * 1000 };

  // ---- pbpSweepInterruptedBatch ----
  {
    const h = buildSweepHarness(source, { progress: STALE });
    await h.pbpSweepInterruptedBatch();
    const written = h.local.data.batch_progress;
    check("a stale running record is closed out and announced once",
      written.running === false && written.done === true && written.error === "interrupted" &&
      written.i === 3 && written.total === 9 && typeof written.ts === "number" &&
      h.notifications.length === 1 && h.notifications[0][2] === "batchInterrupted:3:9");
  }

  // ---- Resume path (roadmap #34): a valid job snapshot revives the batch
  // at its cursor instead of declaring it interrupted; the revival budget
  // (resumeCount >= 2) converges a repeatedly-dying batch to interrupted.
  {
    const job = {
      runId: "run-a",
      account: "alice",
      tabs: [{ id: 1, url: "https://a/1" }, { id: 2, url: "https://a/2" }, { id: 3, url: "https://a/3" }],
      next: 1, counts: { processed: 1, saved: 1 }, resumeCount: 0, ts: 1,
    };
    const h = buildSweepHarness(source, { progress: STALE });
    h.local.data.batch_job = job;
    await h.pbpSweepInterruptedBatch();
    check("sweep resumes a valid interrupted job at its cursor instead of closing it",
      h.resumes.length === 1 && h.resumes[0].reserved === true &&
      h.resumes[0].account === "alice" && h.resumes[0].resumeState.startIndex === 1 &&
      h.resumes[0].resumeState.resumeCount === 1 && h.resumes[0].resumeState.runId === "run-a" &&
      h.notifications.length === 0 && h.local.data.batch_progress.error === undefined);
  }
  {
    const h = buildSweepHarness(source, { progress: STALE });
    h.local.data.batch_job = { runId: "run-a", account: "alice", tabs: [{ url: "https://a/1" }], next: 0, counts: {}, resumeCount: 2, ts: 1 };
    await h.pbpSweepInterruptedBatch();
    check("a job past its revival budget is dropped and the batch closes as interrupted",
      h.resumes.length === 0 && !("batch_job" in h.local.data) &&
      h.local.data.batch_progress.error === "interrupted" && h.notifications.length === 1);
  }
  {
    const h = buildSweepHarness(source, { progress: STALE });
    h.local.data.batch_job = {
      runId: "run-b", account: "alice", tabs: [{ url: "https://b/1" }],
      next: 0, counts: {}, resumeCount: 0, ts: 2,
    };
    await h.pbpSweepInterruptedBatch();
    check("a same-account job from another run is never resumed or deleted",
      h.resumes.length === 0 && h.local.data.batch_job.runId === "run-b" &&
      h.local.data.batch_progress.error === "interrupted");
  }
  {
    const h = buildSweepHarness(source, { progress: STALE });
    h.local.data.batch_job = {
      account: "alice", tabs: [{ url: "https://legacy/1" }],
      next: 0, counts: {}, resumeCount: 0, ts: 1,
    };
    await h.pbpSweepInterruptedBatch();
    check("a legacy job without runId cannot attach to a newer progress record",
      h.resumes.length === 0 && h.local.data.batch_progress.error === "interrupted");
  }

  {
    const h = buildSweepHarness(source, { progress: { ...STALE, ts: Date.now() } });
    await h.pbpSweepInterruptedBatch();
    check("a fresh heartbeat is never swept",
      h.local.data.batch_progress.running === true && h.notifications.length === 0);
  }

  {
    // Same timestamp is possible with millisecond storage writes. Identity,
    // not timestamp coincidence, decides whether the sweep still owns it.
    let gets = 0;
    let harness;
    harness = buildSweepHarness(source, {
      progress: STALE,
      hooks: { onGet: async () => {
        if (++gets === 2) harness.local.data.batch_progress = { ...STALE, runId: "run-b", i: 0 };
      } },
    });
    await harness.pbpSweepInterruptedBatch();
    check("a replacement run with the same timestamp is not terminated",
      harness.local.data.batch_progress.runId === "run-b" &&
      harness.local.data.batch_progress.running === true && harness.notifications.length === 0);
  }

  {
    const h = buildSweepHarness(source, { progress: { ...STALE, account: "bob" } });
    await h.pbpSweepInterruptedBatch();
    check("another account's record is left untouched",
      h.local.data.batch_progress.running === true && h.notifications.length === 0);
  }

  {
    // TOCTOU: startBatchSave reserves _batchRunning synchronously while the sweep
    // is parked on its first storage read.
    let harness;
    harness = buildSweepHarness(source, {
      progress: STALE,
      hooks: { onGet: async () => { harness && harness.setBatchRunning(true); } },
    });
    await harness.pbpSweepInterruptedBatch();
    check("a batch that starts during the sweep's storage read is left alone",
      harness.local.data.batch_progress.running === true &&
      harness.local.data.batch_progress.done === false &&
      harness.notifications.length === 0);
  }

  {
    // The retry already rewrote batch_progress: the sweep read one record and must
    // only ever terminate that same record.
    let gets = 0;
    let harness;
    harness = buildSweepHarness(source, {
      progress: STALE,
      hooks: { onGet: async () => {
        // Hook runs before the read: replace on the second get, so the sweep sees
        // the stale record first and the retry's record when it re-confirms.
        if (++gets === 2) harness.local.data.batch_progress = { ...STALE, i: 0, ts: Date.now() };
      } },
    });
    await harness.pbpSweepInterruptedBatch();
    check("a record replaced mid-sweep is not overwritten with the stale one",
      harness.local.data.batch_progress.running === true &&
      harness.local.data.batch_progress.i === 0 &&
      harness.notifications.length === 0);
  }

  {
    const h = buildSweepHarness(source, {
      progress: STALE,
      hooks: { onSet: async () => { throw new Error("QUOTA_BYTES quota exceeded"); } },
    });
    await h.pbpSweepInterruptedBatch();
    check("a failed terminal write suppresses the interrupted notification",
      h.local.data.batch_progress.running === true && h.notifications.length === 0);
    check("_writeBatchProgress reports whether the record landed",
      (await h._writeBatchProgress({ running: true })) === false);
  }

  {
    const h = buildSweepHarness(source, { progress: STALE });
    check("_writeBatchProgress reports a successful write",
      (await h._writeBatchProgress({ running: true, i: 1 })) === true &&
      h.local.data.batch_progress.i === 1);
  }

  // ---- Trusted-only storage access ----
  {
    const h = buildStorageAccessHarness(source, {});
    check("trusted-only setup applies the exact access level to local and sync",
      h && await h.pbpRestrictStorageAccess() === true &&
      h.calls.local[0]?.accessLevel === "TRUSTED_CONTEXTS" &&
      h.calls.sync[0]?.accessLevel === "TRUSTED_CONTEXTS" &&
      h.calls.clear.some((args) => args[0] === h.PBP_STORAGE_ACCESS_RETRY_ALARM));
  }
  {
    const h = buildStorageAccessHarness(source, { rejectArea: "local" });
    check("a trusted-only rejection is logged and schedules one bounded retry",
      h && await h.pbpRestrictStorageAccess() === false && h.calls.warn.length >= 1 &&
      h.calls.create.length === 1 && h.calls.create[0][0] === h.PBP_STORAGE_ACCESS_RETRY_ALARM &&
      h.calls.create[0][1]?.delayInMinutes >= 0.5);
  }
  {
    // A permanently unavailable API (missing on this Chrome build, refused by
    // policy) used to re-arm the one-shot alarm every minute forever, waking the
    // worker and re-running the whole boot sequence with it. Each retry starts a
    // FRESH worker generation, so the budget has to survive one.
    const session = {};
    const delays = [];
    for (let generation = 0; generation < 9; generation++) {
      const h = buildStorageAccessHarness(source, { rejectArea: "local", session });
      await h.pbpRestrictStorageAccess();
      for (const args of h.calls.create) delays.push(args[1]?.delayInMinutes);
    }
    const budget = buildStorageAccessHarness(source, {}).PBP_STORAGE_ACCESS_MAX_RETRIES;
    check("repeated trusted-only failures stop re-arming the retry alarm instead of looping forever",
      budget >= 1 && delays.length === budget &&
      delays.every((delay, i) => delay === Math.min(30, 2 ** i)) &&
      delays[delays.length - 1] > delays[0]);
  }
  {
    const session = {};
    const failed = buildStorageAccessHarness(source, { rejectArea: "sync", session });
    await failed.pbpRestrictStorageAccess();
    const recovered = buildStorageAccessHarness(source, { session });
    await recovered.pbpRestrictStorageAccess();
    // Read the budget where it matters: right after the success, before the
    // next failure writes its own attempt back into the same store.
    const budgetCleared = !(recovered.PBP_STORAGE_ACCESS_RETRY_KEY in session);
    const failedAgain = buildStorageAccessHarness(source, { rejectArea: "sync", session });
    await failedAgain.pbpRestrictStorageAccess();
    check("a successful re-assert clears the retry budget for the next failure",
      budgetCleared &&
      recovered.calls.clear.some((args) => args[0] === recovered.PBP_STORAGE_ACCESS_RETRY_ALARM) &&
      failedAgain.calls.create.length === 1 &&
      failedAgain.calls.create[0][1]?.delayInMinutes === failed.calls.create[0][1]?.delayInMinutes);
  }
  check("the storage-access retry alarm calls the same idempotent setup function",
    source.includes('alarm.name === PBP_STORAGE_ACCESS_RETRY_ALARM') &&
    source.includes('pbpRestrictStorageAccess().catch'));

  // ---- Cold-start Drive sync throttle ----
  {
    const local = {};
    const first = buildBootVocabSyncHarness(source, { local });
    const window = first.PBP_VOCAB_BOOT_SYNC_MIN_MS;
    await first.pbpBootVocabDriveSync({ throttleMs: window });
    const second = buildBootVocabSyncHarness(source, { local });
    await second.pbpBootVocabDriveSync({ throttleMs: window });
    const third = buildBootVocabSyncHarness(source, { local });
    await third.pbpBootVocabDriveSync({ throttleMs: window });
    const stamped = Number(local[first.PBP_VOCAB_BOOT_SYNC_KEY]) || 0;
    check("a wake within the throttle window opens no second Drive session",
      window >= 15 * 60 * 1000 && first.syncs.length === 1 &&
      second.syncs.length === 0 && third.syncs.length === 0 && stamped > 0);

    local[first.PBP_VOCAB_BOOT_SYNC_KEY] = stamped - window - 1;
    const later = buildBootVocabSyncHarness(source, { local });
    await later.pbpBootVocabDriveSync({ throttleMs: window });
    check("a wake past the throttle window syncs again",
      later.syncs.length === 1 && later.syncs[0].interactive === false);
  }
  {
    // vocab-sync-dirty / -periodic / -retry drive the real schedule: a word the
    // user just saved must not wait out somebody else's cold-start window.
    const local = {};
    const alarmDriven = buildBootVocabSyncHarness(source, { local });
    await alarmDriven.pbpBootVocabDriveSync();
    await alarmDriven.pbpBootVocabDriveSync();
    await alarmDriven.pbpBootVocabDriveSync();
    const alarmBranch = source.slice(source.indexOf('alarm.name === "vocab-sync-dirty"'));
    check("alarm-driven vocabulary syncs are never throttled",
      alarmDriven.syncs.length === 3 &&
      /pbpBootVocabDriveSync\(\)\.catch/.test(alarmBranch.slice(0, 400)));
  }

  // ---- Retired provider model defaults ----
  {
    const h = buildRetiredModelHarness(source, {
      local: { groqModel: "llama-3.1-8b-instant", openrouterModel: "openai/gpt-oss-20b:free" },
    });
    h && await h.migrateRetiredProviderModels();
    check("retired model defaults: a dead factory id already on disk in local is rewritten to the live replacement",
      !!h && h.local.data.groqModel === "openai/gpt-oss-20b" &&
      h.local.data.openrouterModel === "openai/gpt-oss-20b" && h.warns.length === 0);
  }
  {
    // Settings route to sync or local per optSyncEnabled, and a value synced in
    // from another device lands in sync — sweeping one area would leave half the
    // installed base broken.
    const h = buildRetiredModelHarness(source, {
      sync: { groqModel: "llama-3.1-8b-instant", openrouterModel: "openai/gpt-oss-20b:free" },
    });
    h && await h.migrateRetiredProviderModels();
    check("retired model defaults: the sync copy is swept too, not just local",
      !!h && h.sync.data.groqModel === "openai/gpt-oss-20b" &&
      h.sync.data.openrouterModel === "openai/gpt-oss-20b" && h.writes.sync.length === 1);
  }
  {
    const h = buildRetiredModelHarness(source, {
      local: { groqModel: "llama-3.3-70b-versatile" },
      sync: { openrouterModel: "anthropic/claude-haiku-4.5" },
    });
    h && await h.migrateRetiredProviderModels();
    // A near-miss must miss: trimming/normalising before the comparison would
    // silently overwrite a value the user typed.
    const variant = buildRetiredModelHarness(source, { local: { groqModel: "  llama-3.1-8b-instant  " } });
    variant && await variant.migrateRetiredProviderModels();
    check("retired model defaults: only a byte-identical dead default moves; a user-picked model is never touched",
      !!h && !!variant && h.local.data.groqModel === "llama-3.3-70b-versatile" &&
      h.sync.data.openrouterModel === "anthropic/claude-haiku-4.5" &&
      !h.writes.local.some((w) => "groqModel" in w) && h.writes.sync.length === 0 &&
      variant.local.data.groqModel === "  llama-3.1-8b-instant  ");
  }
  {
    const first = buildRetiredModelHarness(source, {
      local: { groqModel: "llama-3.1-8b-instant", openrouterModel: "openai/gpt-oss-20b:free" },
    });
    first && await first.migrateRetiredProviderModels();
    // A later worker generation inherits the same local area — and by then the
    // user may have deliberately gone back to the retired id.
    const carried = structuredClone(first ? first.local.data : {});
    carried.groqModel = "llama-3.1-8b-instant";
    const second = buildRetiredModelHarness(source, { local: carried });
    second && await second.migrateRetiredProviderModels();
    check("retired model defaults: the done-flag makes it a true one-shot; a later worker writes nothing",
      !!first && !!second && first.local.data[first.PBP_RETIRED_MODEL_FLAG] === true &&
      second.local.data.groqModel === "llama-3.1-8b-instant" &&
      second.writes.local.length === 0 && second.writes.sync.length === 0);
  }
  {
    const h = buildRetiredModelHarness(source, {
      local: { groqModel: "llama-3.1-8b-instant" },
      sync: { openrouterModel: "openai/gpt-oss-20b:free" },
      rejectArea: "sync",
    });
    h && await h.migrateRetiredProviderModels();
    check("retired model defaults: a storage failure is traced and leaves the flag unset so the next worker retries",
      !!h && h.warns.length === 1 && h.local.data.groqModel === "openai/gpt-oss-20b" &&
      h.local.data[h.PBP_RETIRED_MODEL_FLAG] === undefined);
  }

  // ---- Undo notification record ----
  {
    const h = buildUndoHarness(source, {});
    await h.pbpRememberUndo("qs-saved-1", { url: "https://example.com/a", account: "alice", expiresAt: Date.now() + h.PBP_UNDO_TTL });
    check("persisting an undo record schedules the expiry alarm instead of a timer",
      h.alarms.length === 1 && h.alarms[0].name === h.PBP_UNDO_ALARM &&
      h.alarms[0].info.delayInMinutes >= 0.5 && !/setTimeout\(/.test(source.slice(
        source.indexOf("// F7: Track recent saves"), source.indexOf("// F7: Handle undo button click"))));

    // A new worker generation: the Map is gone, the toast is not.
    h._recentSaves.clear();
    const revived = await h.pbpTakeUndoRecord("qs-saved-1");
    check("an undo record survives the worker generation that created it",
      revived && revived.url === "https://example.com/a" && revived.account === "alice");
    check("taking a record consumes it in session storage too",
      Object.keys(h.session.data[h.PBP_UNDO_KEY] || {}).length === 0 &&
      (await h.pbpTakeUndoRecord("qs-saved-1")) === null);
  }

  {
    const expired = { url: "https://example.com/b", account: "alice", expiresAt: Date.now() - 1 };
    const h = buildUndoHarness(source, { session: { _undoSaves: { "qs-saved-2": expired } } });
    check("an expired record is refused even while still in session storage",
      (await h.pbpTakeUndoRecord("qs-saved-2")) === null);
  }

  {
    const h = buildUndoHarness(source, { session: { _undoSaves: {
      "qs-saved-3": { url: "https://example.com/c", account: "alice", expiresAt: Date.now() - 1 },
      "qs-saved-4": { url: "https://example.com/d", account: "alice", expiresAt: Date.now() + 60000 },
    } } });
    h._recentSaves.set("qs-saved-3", { url: "https://example.com/c", account: "alice", expiresAt: Date.now() - 1 });
    await h.pbpSweepExpiredUndo();
    const left = h.session.data[h.PBP_UNDO_KEY];
    check("the expiry sweep drops timed-out records and clears their toasts",
      h.cleared.length === 1 && h.cleared[0] === "qs-saved-3" &&
      !("qs-saved-3" in left) && !h._recentSaves.has("qs-saved-3"));
    check("the expiry sweep keeps a live record and schedules another pass",
      "qs-saved-4" in left && h.alarms.some((a) => a.name === h.PBP_UNDO_ALARM));
  }

  {
    // notifications.clear() rejects asynchronously: a sync try/catch would never
    // see it and the sweep would abort with the record half-removed.
    const h = buildUndoHarness(source, {
      clearRejects: true,
      session: { _undoSaves: { "qs-saved-5": { url: "https://example.com/e", account: "alice", expiresAt: Date.now() - 1 } } },
    });
    const leakedBefore = unhandled.length;
    let outcome = null;
    const sweeping = h.pbpSweepExpiredUndo().then(() => { outcome = "resolved"; }, () => { outcome = "threw"; });
    await new Promise((resolve) => setTimeout(resolve, 0));
    const awaitedTheClear = outcome === null; // still parked on the pending clear
    h.rejectClear(new Error("notification gone"));
    await sweeping;
    await new Promise((resolve) => setTimeout(resolve, 0)); // let unhandledrejection fire
    check("a rejected notifications.clear() is awaited, caught, and does not abort the sweep",
      awaitedTheClear && outcome === "resolved" && unhandled.length === leakedBefore &&
      h.cleared.length === 1 && Object.keys(h.session.data[h.PBP_UNDO_KEY] || {}).length === 0);
  }

  {
    const h = buildUndoHarness(source, { hooks: { onSet: async () => { throw new Error("session unavailable"); } } });
    await h.pbpRememberUndo("qs-saved-6", { url: "https://example.com/f", account: "alice", expiresAt: Date.now() + 60000 });
    const record = await h.pbpTakeUndoRecord("qs-saved-6");
    check("a session-storage failure degrades to memory instead of losing Undo",
      record && record.url === "https://example.com/f");
  }

  // ---- Message router (roadmap #35): the newly NAMED handleRuntimeMessage
  // sliced with spy deps — shallow routing assertions: given a message.type,
  // the expected internal function is reached and the async channel is held.
  const EXT_ID = "feoognahlmfmbllpmgailahcnjppiegb";
  const EXT_URL = `chrome-extension://${EXT_ID}/popup.html`;
  function buildRouterHarness(opts) {
    const start = source.indexOf("function handleRuntimeMessage");
    const end = source.indexOf("chrome.runtime.onMessage.addListener(handleRuntimeMessage);", start);
    if (start < 0 || end <= start) throw new Error("router source not found");
    const o = opts || {};
    const calls = [];
    const spy = (name, ret) => (...args) => { calls.push([name, args]); return typeof ret === "function" ? ret(...args) : ret; };
    const deps = {
      chrome: {
        runtime: {
          id: EXT_ID, getURL: (p) => `chrome-extension://${EXT_ID}/${p}`,
          // K45: popup-context lookup after a "failed" save_intent result.
          // Flippable per test via opts.popupContexts (default: no popup open).
          getContexts: spy("getContexts", () => Promise.resolve(o.popupContexts || [])),
        },
        storage: {
          local: { get: async () => ({}), set: async () => {}, remove: async () => {} },
          session: { get: async () => ({}), set: async () => {} },
        },
        tabs: { query: async () => [] },
      },
      noteActivity: spy("noteActivity"),
      PBP_VOCAB_DRIVE_CAPABLE: false,
      PBP_VOCAB_DRIVE_CONNECTED_KEY: "k",
      pbpVocabDriveIsConnected: spy("vocabConnected", Promise.resolve(false)),
      pbpVocabScheduleDirty: spy("vocabDirty", Promise.resolve()),
      pbpQueueVocabDriveSync: spy("vocabSync", Promise.resolve({ ok: true })),
      pbpGetVocabDriveStatus: spy("vocabStatus", Promise.resolve({})),
      pbpVocabDriveResponse: (r) => r,
      pbpVocabClearNotices: spy("vocabClear", Promise.resolve()),
      pbpDisconnectVocabDrive: spy("vocabDisc", Promise.resolve()),
      pbpDictOwnerScope: (a) => "acct_" + a,
      getCurrentPinboardAuth: async () => ({ token: "alice:t", account: "alice", epoch: 0 }),
      pbpPinboardAuthIsCurrent: () => true,
      pbpStatusCacheGet: () => null,
      pbpStatusCacheSet: spy("cacheSet", true),
      pbpSameBookmark: () => false,
      pbpSaveFailure: (code) => ({ status: "failed", code }),
      // K45: overridable per test via opts.saveResult / opts.saveReject so the
      // save_intent branch's post-sendResponse notify logic can be exercised
      // for failed/queued/saved outcomes and for the internal-error catch path.
      submitPopupSaveIntent: spy("saveIntent", () => (
        o.saveReject ? Promise.reject(new Error("boom")) : Promise.resolve(o.saveResult || { status: "saved" })
      )),
      notifySaveFailure: spy("notifyFail"),
      handleBatchSave: spy("batchSave", Promise.resolve()),
      handleSaveTabSet: spy("saveTabSet", Promise.resolve()),
      loadSettings: async () => ({}),
      pbpWaybackArchive: spy("wayback", Promise.resolve()),
      pbpIsAllowedPinboardApiUrl: (u) => String(u).startsWith("https://api.pinboard.in/v1/"),
      pbpAuthorizePinboardApiUrl: (u) => u,
      pinboardFetch: spy("pinFetch", Promise.resolve({ ok: true, status: 200, text: async () => "{}" })),
      pinboardFetchImmediate: spy("pinFetchNow", Promise.resolve({ ok: true, status: 200, text: async () => "{}" })),
      retryOfflineItem: spy("retryItem", Promise.resolve({ ok: true, result: {} })),
      readOfflineQueueWithIds: spy("readQueue", Promise.resolve([])),
      mutateOfflineQueue: spy("mutQueue", Promise.resolve([])),
      checkBookmarked: spy("checkBm", Promise.resolve(null)),
      statusCache: new Map(),
      extractForPreview: spy("extract", Promise.resolve({ error: "empty" })),
      pbpImgFixInstallRule: spy("imgInstall", Promise.resolve(786001)),
      pbpImgFixRemoveRules: spy("imgRemove", Promise.resolve()),
      pbpImgFixSweepRules: spy("imgSweep", Promise.resolve()),
      _imgFixIsPreviewUrl: (u) => typeof u === "string" && u.includes("md-preview.html"),
      _batchRunning: false,
      deobfuscateKey: (v) => v,
      showNotification: spy("notify"),
      t: (k, ...a) => (a.length ? `${k}:${a.join(":")}` : k),
      pbpWithLargeStorageLock: (key, fn) => fn(),
      pbpReadLargeWithFallbackUnlocked: async (key, read, dflt) => (await read()) ?? dflt,
      getSettingsStorage: async () => ({ get: async () => ({ customOverlayCSS: "/*ov*/" }) }),
      console,
    };
    const factory = new Function(...Object.keys(deps), `${source.slice(start, end)}
      return handleRuntimeMessage;`);
    const handler = factory(...Object.values(deps));
    const invoke = (message, sender) => new Promise((resolve) => {
      const out = { responses: [], held: undefined };
      const settle = () => resolve(out);
      out.held = handler(message, sender || { id: EXT_ID, url: EXT_URL }, (r) => { out.responses.push(r); settle(); });
      if (out.held !== true || out.responses.length) settle();
      setTimeout(settle, 250); // async branch that never responds in stubs
    });
    return { invoke, calls };
  }

  {
    const h = buildRouterHarness();
    const foreign = await h.invoke({ type: "save_intent" }, { id: "other-ext", url: EXT_URL });
    const contentScript = await h.invoke({ type: "save_intent" }, { id: EXT_ID, url: "https://pinboard.in/u:alice" });
    check("router gate: foreign extensions and content-script senders are refused before any work",
      foreign.responses[0]?.error === "forbidden" && contentScript.responses[0]?.error === "forbidden" &&
      !h.calls.some(([n]) => n === "saveIntent"));
  }
  {
    const h = buildRouterHarness();
    const r = await h.invoke({ type: "save_intent", intent: { mode: "create" }, account: "alice" });
    check("router: save_intent reaches submitPopupSaveIntent and holds the channel",
      r.held === true && h.calls.some(([n]) => n === "saveIntent"));
  }
  // ---- K45: a failed popup-initiated save notifies iff no popup context is
  // left to show it. notifySaveFailure runs after sendResponse, inside an
  // await on getContexts — give the microtask queue a tick to drain before
  // inspecting h.calls (same idiom used above for unhandledrejection).
  {
    const h = buildRouterHarness({ saveResult: { status: "failed", reason: "conflict" } });
    const r = await h.invoke({ type: "save_intent", intent: { mode: "create" }, account: "alice" });
    await new Promise((resolve) => setTimeout(resolve, 0));
    const notifyCall = h.calls.find(([n]) => n === "notifyFail");
    check("router: a failed save_intent with no popup context notifies once via notifySaveFailure",
      r.responses[0]?.status === "failed" &&
      h.calls.filter(([n]) => n === "notifyFail").length === 1 &&
      notifyCall?.[1]?.[0] === "popup-save" && notifyCall?.[1]?.[1]?.status === "failed" && notifyCall?.[1]?.[1]?.reason === "conflict");
  }
  {
    const h = buildRouterHarness({ saveResult: { status: "failed", reason: "conflict" }, popupContexts: [{ contextType: "POPUP" }] });
    const r = await h.invoke({ type: "save_intent", intent: { mode: "create" }, account: "alice" });
    await new Promise((resolve) => setTimeout(resolve, 0));
    check("router: a failed save_intent does not notify when a popup context still exists",
      r.responses[0]?.status === "failed" && !h.calls.some(([n]) => n === "notifyFail"));
  }
  {
    const h = buildRouterHarness({ saveResult: { status: "queued" } });
    const r = await h.invoke({ type: "save_intent", intent: { mode: "create" }, account: "alice" });
    await new Promise((resolve) => setTimeout(resolve, 0));
    check("router: a queued save_intent never notifies (the offline-queue row covers it)",
      r.responses[0]?.status === "queued" && !h.calls.some(([n]) => n === "notifyFail"));
  }
  {
    const h = buildRouterHarness({ saveResult: { status: "saved" } });
    const r = await h.invoke({ type: "save_intent", intent: { mode: "create" }, account: "alice" });
    await new Promise((resolve) => setTimeout(resolve, 0));
    check("router: a saved save_intent never notifies",
      r.responses[0]?.status === "saved" && !h.calls.some(([n]) => n === "notifyFail"));
  }
  {
    const h = buildRouterHarness({ saveReject: true });
    const r = await h.invoke({ type: "save_intent", intent: { mode: "create" }, account: "alice" });
    await new Promise((resolve) => setTimeout(resolve, 0));
    check("router: submitPopupSaveIntent rejecting responds with the internal failure and does not notify",
      r.responses[0]?.status === "failed" && r.responses[0]?.code === "internal" &&
      !h.calls.some(([n]) => n === "notifyFail"));
  }
  {
    const h = buildRouterHarness();
    const r = await h.invoke({ type: "archive_url", url: "https://example.com/a" });
    check("router: archive_url runs the archive and acknowledges with done",
      r.held === true && h.calls.some(([n]) => n === "wayback") && r.responses[0]?.done === true);
  }
  {
    const h = buildRouterHarness();
    const bad = await h.invoke({ type: "pinboard_api_call", url: "https://evil.example/v1/posts/all" });
    const good = await h.invoke({ type: "pinboard_api_call", url: "https://api.pinboard.in/v1/posts/get?auth_token=a%3Ab" });
    check("router: pinboard_api_call enforces the allowlist before dispatch",
      bad.responses[0]?.error === "invalid_pinboard_api_url" &&
      good.responses[0]?.ok === true && h.calls.some(([n]) => n === "pinFetch"));
  }
  {
    const h = buildRouterHarness();
    // NOTE this branch keys on message.ACTION, not message.type — a wire-shape
    // asymmetry the popup depends on; locking it here keeps it deliberate.
    const r = await h.invoke({ action: "startBatchSave", tabs: [{ url: "https://x.example/" }], account: "alice" });
    check("router: startBatchSave (action key) reserves and hands off to handleBatchSave",
      r.responses[0]?.status === "started" && h.calls.some(([n]) => n === "batchSave"));
  }
  {
    const h = buildRouterHarness();
    const r = await h.invoke({ type: "vocabDriveStatus" });
    check("router: drive-incapable build answers vocabDrive* with unavailable, not a crash",
      r.responses[0]?.ok === false && r.responses[0]?.error === "unavailable");
  }
  {
    const h = buildRouterHarness();
    const r = await h.invoke({ type: "totally_unknown_type" });
    check("router: an unknown type falls through quietly (no response, channel not held, no throw)",
      r.responses.length === 0 && r.held !== true);
  }
  {
    const h = buildRouterHarness();
    const site = { id: EXT_ID, url: "https://pinboard.in/u:alice/t:tag" };
    const prefs = await h.invoke({ type: "get_site_prefs" }, site);
    const smuggle = await h.invoke({ type: "save_intent" }, site);
    const p = prefs.responses[0] || {};
    check("router: pinboard.in content script gets ONLY non-secret site prefs; other types stay forbidden",
      p.optTheme === "auto" && p.overlayCss === "/*ov*/" &&
      !("pinboardToken" in p) && !Object.keys(p).some((k) => /token|key/i.test(k) && k !== "themePresetKey") &&
      smuggle.responses[0]?.error === "forbidden");
  }

  document.getElementById("summary").textContent = `pass=${pass} fail=${fail}`;
})();
</script></body></html>
