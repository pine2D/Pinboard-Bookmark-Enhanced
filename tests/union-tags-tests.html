<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="pbp-expected-count" content="24"><title>Union Tags Tests</title>
<style>
body { font-family: monospace; padding: 16px; max-width: 900px; }
.case { padding: 6px; border-bottom: 1px solid #eee; white-space: pre-wrap; }
.pass { color: #0a0; }
.fail { color: #c00; font-weight: bold; }
</style></head>
<body>
<h1>unionTags() tests</h1>
<div id="results"></div>
<script src="../shared.js"></script>
<script>
const cases = [
  { existing: "work project", new: "review", out: "work project review" },
  { existing: "work Project", new: "PROJECT", out: "work Project" },
  { existing: "  tag1  tag2  ", new: "  tag3  ", out: "tag1 tag2 tag3" },
  { existing: "python coding", new: "python tutorial", out: "python coding tutorial" },
  { existing: "", new: "tag1 tag2", out: "tag1 tag2" },
  { existing: "tag1 tag2", new: "", out: "tag1 tag2" },
  { existing: "", new: "", out: "" },
  { existing: "Python PYTHON python", new: "python", out: "Python" },
  { existing: "a b c", new: "c d e", out: "a b c d e" },
  { existing: "work", new: "Work WORK work", out: "work" },
  { existing: "  ", new: "  tag  ", out: "tag" },
  { existing: "x-ray x_ray", new: "X-RAY", out: "x-ray x_ray" },
  // Separator spellings stay distinct Pinboard tags: only invisible twins merge.
  { existing: "x-ray", new: "x_ray xray", out: "x-ray x_ray xray" },
  { existing: "b\u00e4r Work", new: "ba\u0308r work", out: "b\u00e4r Work" },
  { existing: "ba\u0308r", new: "B\u00c4R", out: "ba\u0308r" },
  { existing: "foo", new: "fo\u200bo \ufefffoo foo\u2060", out: "foo" },
  { existing: "ba\u0308r b\u00e4r", new: "", out: "ba\u0308r" },
  { existing: "\u200b", new: "\u2060 \u200b", out: "\u200b \u2060" },
  // Lowercase letters whose capital has no precomposed form: when both
  // spellings arrive decomposed, only a second NFC after lowercasing keeps
  // them one tag, as plain toLowerCase always did.
  { existing: "j\u030c", new: "J\u030c \u01f0", out: "j\u030c" },
  { existing: "\u03b9\u0308\u0301", new: "\u0399\u0308\u0301 \u0390", out: "\u03b9\u0308\u0301" },
  { existing: "\u03c5\u0308\u0301", new: "\u03a5\u0308\u0301", out: "\u03c5\u0308\u0301" },
  // Names that are Object.prototype keys are ordinary tags.
  { existing: "constructor __proto__", new: "toString", out: "constructor __proto__ toString" },
  { existing: "", new: "Constructor __PROTO__ hasOwnProperty", out: "Constructor __PROTO__ hasOwnProperty" },
];
const show = (s) => s.replace(/[^\x20-\x7e]/g, (ch) => "\\u" + ch.charCodeAt(0).toString(16).padStart(4, "0"));
const root = document.getElementById("results");
for (const c of cases) {
  const r = unionTags(c.existing, c.new);
  const ok = r === c.out;
  const div = document.createElement("div");
  div.className = "case " + (ok ? "pass" : "fail");
  div.textContent = `${ok ? "✓" : "✗"}  unionTags("${show(c.existing)}", "${show(c.new)}")\n   OUT: "${show(r)}"${ok ? "" : `\n   EXPECTED: "${show(c.out)}"`}`;
  root.appendChild(div);
}
// Every pair of spellings that toLowerCase alone already made equal (the
// rule before twin keys) must still be one tag: each code point against its
// decomposed, upper and lower spellings.
{
  const split = [];
  for (let cp = 0; cp < 0x30000; cp++) {
    if (cp >= 0xd800 && cp < 0xe000) continue;
    const c = String.fromCodePoint(cp);
    if (/\s/.test(c)) continue; // a separator, not a tag
    const up = c.toUpperCase(), low = c.toLowerCase();
    const forms = [...new Set([c, c.normalize("NFD"), up, up.normalize("NFD"), low, low.normalize("NFD")])];
    for (const a of forms) for (const b of forms) {
      if (a.toLowerCase() === b.toLowerCase() && unionTags(a, b) !== a) { split.push(cp.toString(16)); break; }
    }
  }
  const ok = split.length === 0;
  const div = document.createElement("div");
  div.className = "case " + (ok ? "pass" : "fail");
  div.textContent = `${ok ? "✓" : "✗"}  spellings equal under toLowerCase stay one tag${ok ? "" : `\n   SPLIT: ${[...new Set(split)].join(" ")}`}`;
  root.appendChild(div);
}
</script>
</body></html>
