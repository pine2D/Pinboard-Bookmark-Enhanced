<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>md-dict Tests</title>
<style>
body { font-family: monospace; padding: 16px; max-width: 1000px; }
.case { padding: 6px; border-bottom: 1px solid #eee; white-space: pre-wrap; }
.pass { color: #0a0; } .fail { color: #c00; font-weight: bold; }
h2 { margin-top: 24px; }
</style></head>
<body>
<h1>md-dict.js tests</h1>
<div id="summary"></div>
<div id="results"></div>
<script src="../vocab-store.js"></script>
<script src="../md-dict.js"></script>
<script src="../md-vocab-echo.js"></script>
<script>
const root = document.getElementById("results");
let pass = 0, fail = 0;
function check(name, cond, detail) {
  const ok = !!cond; ok ? pass++ : fail++;
  const div = document.createElement("div");
  div.className = "case " + (ok ? "pass" : "fail");
  div.textContent = `${ok ? "✓" : "✗"}  ${name}${ok ? "" : "\n   " + (detail || "")}`;
  root.appendChild(div);
}
function section(name) { const h = document.createElement("h2"); h.textContent = name; root.appendChild(h); }
function assert(cond, detail) { check(detail || String(cond), cond, detail); }
function assertEq(a, e, label) {
  const ok = a === e;
  check(label || (String(e) + " === " + String(a)), ok, ok ? "" : "expected " + JSON.stringify(e) + " got " + JSON.stringify(a));
}

section("pbpDictPrimaryLang");
assertEq(pbpDictPrimaryLang("en-US"), "en", "en-US -> en");
assertEq(pbpDictPrimaryLang("ZH_cn"), "zh", "ZH_cn -> zh");
assertEq(pbpDictPrimaryLang("  de "), "de", "trims");
assertEq(pbpDictPrimaryLang(""), "", "empty -> empty");
assertEq(pbpDictPrimaryLang(null), "", "null -> empty");
assertEq(pbpDictLanguageLabel("und", "en"), "", "unknown language code stays hidden from users");
assert(pbpDictLanguageLabel("fr", "en") !== "FR" && pbpDictLanguageLabel("fr", "en").length > 2,
  "supported language code uses the platform's localized language name");

section("pbpDictRouteLang");
assertEq(pbpDictRouteLang("en", true, "de", "fr"), "fr", "manual wins");
assertEq(pbpDictRouteLang("en", true, "de", ""), "en", "reliable detection second");
assertEq(pbpDictRouteLang("en", false, "de", ""), "de", "unreliable falls to article lang");
assertEq(pbpDictRouteLang("und", true, "de", ""), "de", "und never routes");
assertEq(pbpDictRouteLang("", false, "", ""), "", "nothing -> auto-unknown");

section("pbpDictCorrectCjkLang");
// Measured against the real chrome.i18n.detectLanguage inside the loaded
// extension, 2026-08-01: kanji-only Japanese is reported zh at 100% with
// isReliable true, at 30/60/120/240/500/640 characters alike.
assertEq(pbpDictCorrectCjkLang("zh", "ja"), "ja", "zh detected inside a ja article is kanji-only Japanese");
assertEq(pbpDictCorrectCjkLang("zh", "ja-JP"), "ja", "the article tag may carry a region");
assertEq(pbpDictCorrectCjkLang("zh", "zh"), "zh", "a Chinese article leaves a zh detection alone");
assertEq(pbpDictCorrectCjkLang("zh", ""), "zh", "no article language means nothing to correct with");
assertEq(pbpDictCorrectCjkLang("ja", "zh"), "ja", "kana proves Japanese, so a ja detection is never overridden");
assertEq(pbpDictCorrectCjkLang("ko", "ja"), "ko", "only zh is ambiguous with ja; other languages pass through");
assertEq(pbpDictCorrectCjkLang("", "ja"), "", "an undetected language stays undetected");

section("pbpDictLatinFallback");
// Measured against the real chrome.i18n.detectLanguage inside the loaded
// extension, 2026-08-02: "Converts wiktionary data from kaikki (wiktextract)
// to yomitan -compatible dictionaries." -> en@100 isReliable FALSE, and the
// lone word "Converts" -> zh@100 isReliable FALSE.
assertEq(pbpDictLatinFallback("Converts", "zh", ""), "en", "Latin selection with a non-Latin guess defaults to en");
assertEq(pbpDictLatinFallback("Converts", "en", ""), "en", "unreliable en candidate routes as en");
assertEq(pbpDictLatinFallback("Bahnhof", "und", "de"), "en", "a lone ASCII-spelled candidate is demoted to en (a convincing wrong homograph entry beats no evidence)");
assertEq(pbpDictLatinFallback("Bahnhöfe", "und", "de"), "de", "non-ASCII Latin orthography is positive evidence: the lone candidate rides");
assertEq(pbpDictLatinFallback("chat", "fr", ""), "en", "the chat/fr homograph trap resolves to en without corroboration");
assertEq(pbpDictLatinFallback("saudade", "fi", ""), "en", "candidate outside the query set falls to en");
assertEq(pbpDictLatinFallback("转换", "zh", ""), "", "non-Latin selection never inherits the Latin default");
assertEq(pbpDictLatinFallback("GPT-4是什么", "en", ""), "", "any non-Latin letter is counter-evidence");
assertEq(pbpDictLatinFallback("42 %", "en", ""), "", "no Latin letters, no fallback");
assertEq(pbpDictLatinFallback("żółć", "und", "pl"), "pl", "extended Latin letters are Latin (positive classification, not an ASCII test)");
assertEq(pbpDictLatinFallback("żółć", "", ""), "en", "extended Latin with no usable candidate still defaults to en");
assertEq(pbpDictLatinFallback("Wort", "de", "en"), "en", "two disagreeing low-confidence Latin candidates cancel to en");
assertEq(pbpDictLatinFallback("Wort", "de", "de"), "de", "agreeing sentence and block candidates ride together");

section("pbpDictScriptLang / pbpDictAcceptLang");
assertEq(pbpDictScriptLang("привет", ""), "ru", "Cyrillic selection resolves ru without CLD (only Cyrillic member of the query set)");
assertEq(pbpDictScriptLang("їжа", ""), "", "a Ukrainian-only letter disproves Russian: abstain, never fabricate ru");
assertEq(pbpDictScriptLang("мова", "українська мова"), "", "exclusion letters in the sentence also disprove Russian");
assertEq(pbpDictAcceptLang("ru", "їжа"), "", "the gate rejects ru for non-Russian Cyrillic too");
assertEq(pbpDictScriptLang("ひらがな", ""), "ja", "kana proves Japanese");
assertEq(pbpDictScriptLang("안녕하세요", ""), "ko", "Hangul proves Korean");
assertEq(pbpDictScriptLang("東京", "東京タワーは高い"), "ja", "Han selection with kana in the sentence is Japanese");
assertEq(pbpDictScriptLang("東京", "我在東京工作"), "zh", "Han selection in a Han-only sentence stays zh");
assertEq(pbpDictScriptLang("Converts", "any sentence"), "", "Latin selections stay undecided for the CLD rungs");
assertEq(pbpDictScriptLang("", ""), "", "empty selection decides nothing");
assertEq(pbpDictAcceptLang("fi", "sana"), "", "a supported-set outsider cannot route even when detection is confident");
assertEq(pbpDictAcceptLang("zh", "Converts"), "", "zh cannot route a selection containing no Han");
assertEq(pbpDictAcceptLang("en", "Converts"), "en", "supported and script-compatible routes");
assertEq(pbpDictAcceptLang("ja", "漢字"), "ja", "Han satisfies a ja route (kanji-only selection)");
assertEq(pbpDictAcceptLang("ru", "word"), "", "ru cannot route a Latin selection");
assertEq(pbpDictAcceptLang("de-DE", "Bahnhof"), "de", "region tags reduce to the primary subtag before the gate");

section("pbpDictVocabKey / pbpDictCacheKeyPublic");
assertEq(pbpDictVocabKey("acct_u1", "en-US", "  Running  "), "acct_u1|en|running", "owner + primary + normalized");
assertEq(pbpDictVocabKey("", "en", "x"), "ownerless|en|x", "empty owner -> ownerless");
assertEq(pbpDictVocabKey("acct_u1", "zh", "书"), "acct_u1|zh|书", "CJK passthrough");
assertEq(pbpDictCacheKeyPublic("en", "New  York"), pbpDictCacheKeyPublic("en", "New York"), "public key collapses whitespace");
assertEq(pbpDictCacheKeyPublic("de", "Straße"), "de|straße", "public key has no owner");
assertEq(pbpDictCacheKeyExact("en", "Polish"), "en|Polish", "query key preserves uppercase");
assertEq(pbpDictCacheKeyExact("en", "polish"), "en|polish", "query key keeps lowercase separate");
assertEq(pbpDictCacheKeyExact("fr", "  Défense  "), "fr|Défense", "query key trims but preserves case");
assertEq(pbpDictCacheKeyExact("en", "New  York"), "en|New York", "query key collapses whitespace");
assertEq(pbpDictCacheKeyExact("fr", "Défense"), "fr|Défense", "query key NFC-normalizes");
assertEq(pbpDictQueryCacheKey("fr", "Défense"), "dict2_fr|Défense", "online cache uses versioned dict2 prefix");
assertEq(pbpDictLowerCandidate("Défense", "fr"), "défense", "French uppercase gets a lowercase candidate");
assertEq(pbpDictLowerCandidate("défense", "fr"), "", "already-lowercase term has no duplicate candidate");
assertEq(pbpDictLowerCandidate("Word", "xx"), "", "unsupported locale never reaches toLocaleLowerCase");

section("pbpDictCleanCandidate");
// Live API, 2026-07-31: en/don't -> 4 entries, en/don’t -> 0 entries.
assertEq(pbpDictCleanCandidate("don’t", "en"), "don't", "curly apostrophe folds to ASCII");
assertEq(pbpDictCleanCandidate("don't", "en"), "", "already-ASCII apostrophe has no duplicate candidate");
assertEq(pbpDictCleanCandidate("ubiquitous.", "en"), "ubiquitous", "trailing sentence punctuation is dropped");
assertEq(pbpDictCleanCandidate("“ubiquitous”", "en"), "ubiquitous", "surrounding curly quotes are dropped");
assertEq(pbpDictCleanCandidate("ubiq­uitous", "en"), "ubiquitous", "soft hyphen from justified text is removed");
assertEq(pbpDictCleanCandidate("ubi​quitous", "en"), "ubiquitous", "zero-width space is removed");
assertEq(pbpDictCleanCandidate("pre-", "en"), "", "trailing hyphen survives: pre- is a real entry");
assertEq(pbpDictCleanCandidate("-ing", "en"), "", "leading hyphen survives: -ing is a real entry");
assertEq(pbpDictCleanCandidate("ubiquitous", "en"), "", "a clean word yields no extra candidate");
assertEq(pbpDictCleanCandidate("...", "en"), "", "punctuation-only selection never becomes an empty query");
assertEq(pbpDictCleanCandidate("don’t", "xx"), "", "unsupported locale yields no candidate");
// Live API, 2026-08-01: ja/食べる。 -> 0 entries, ja/食べる -> real entry;
// es/¿cómo -> 0 entries, es/cómo -> real entry. CJK drag-selection almost
// always carries the following punctuation (no inter-word spaces).
assertEq(pbpDictCleanCandidate("食べる。", "ja"), "食べる", "trailing ideographic period is dropped");
assertEq(pbpDictCleanCandidate("「食べる」", "ja"), "食べる", "CJK corner brackets are dropped");
assertEq(pbpDictCleanCandidate("食べる、", "ja"), "食べる", "ideographic comma is dropped");
assertEq(pbpDictCleanCandidate("¿cómo", "es"), "cómo", "Spanish inverted question mark is dropped");
assertEq(pbpDictCleanCandidate("¡Hola!", "es"), "Hola", "inverted exclamation and its closing mark are dropped");
assertEq(pbpDictCleanCandidate("（水）", "zh"), "水", "fullwidth parentheses are dropped");

section("pbpDictQueryCandidates");
const candTerms = (t, l) => pbpDictQueryCandidates(t, l).map((c) => c.term).join("|");
assertEq(candTerms("ubiquitous", "en"), "ubiquitous", "a clean lowercase word still costs exactly one request");
assertEq(candTerms("Ubiquitous", "en"), "Ubiquitous|ubiquitous", "capitalized word keeps the old two-step chain");
assertEq(candTerms("Don’t", "en"), "Don’t|Don't|don't", "sentence-initial contraction reaches don't in three steps");
assertEq(candTerms("don’t", "en"), "don’t|don't", "lowercase contraction needs one extra step");
assert(!candTerms("Don’t", "en").split("|").includes("don’t"),
  "the raw form is never lowercased once cleaning applies: a curly-apostrophe headword cannot hit");
assertEq(pbpDictQueryCandidates("Ubiquitous", "en")[0].skipCache, true, "the exact term always bypasses the cache");
assertEq(pbpDictQueryCandidates("Ubiquitous", "en")[0].aliasExact, false, "the exact term is not its own alias");
assertEq(pbpDictQueryCandidates("Ubiquitous", "en")[1].skipCache, false, "derived candidates may read the cache");
assertEq(pbpDictQueryCandidates("Ubiquitous", "en")[1].aliasExact, true, "a derived hit is cached under the exact key too");
assertEq(pbpDictQueryCandidates("", "en").length, 1, "an empty selection produces no derived candidates");
assertEq(candTerms("食べる。", "ja"), "食べる。|食べる", "Japanese selection sheds its trailing ideographic period");
assertEq(candTerms("¿Cómo", "es"), "¿Cómo|Cómo|cómo", "Spanish question opener reaches the clean lowercase form");

section("pbpDictOwnerScope");
assertEq(pbpDictOwnerScope("alice"), "acct_alice", "account -> acct_ prefix");
assertEq(pbpDictOwnerScope(""), "ownerless", "falsy -> ownerless");
assertEq(pbpDictOwnerScope("a b"), "acct_a%20b", "encodes special chars");

section("pbpDictSafeUrl");
assertEq(pbpDictSafeUrl("https://en.wiktionary.org/wiki/x"), "https://en.wiktionary.org/wiki/x", "https passes");
assertEq(pbpDictSafeUrl("http://a.example/x"), "http://a.example/x", "http passes");
assertEq(pbpDictSafeUrl("javascript:alert(1)"), "", "javascript: blocked");
assertEq(pbpDictSafeUrl("data:text/html,x"), "", "data: blocked");
assertEq(pbpDictSafeUrl("not a url"), "", "garbage blocked");

section("pbpDictNormalizeEntry");
const FDA_SAMPLE = { /* hello 样本，含 source.url 变体 */
  word: "hello",
  entries: [{
    language: { code: "en", name: "English" },
    partOfSpeech: "interjection",
    pronunciations: [
      { type: "ipa", text: "/hɛˈloʊ/", tags: ["General American"] },
      { type: "ipa", text: "/həˈləʊ/", tags: ["Received Pronunciation"] },
      { type: "ipa", text: "/x1/", tags: [] }, { type: "ipa", text: "/x2/", tags: [] }
    ],
    forms: [{ word: "hellos", tags: ["plural"] }],
    senses: [
      { definition: "A greeting.", examples: ["Hello, world!", "Hello there.", "third dropped"] },
      { definition: "s2", examples: [] }, { definition: "s3", examples: [] },
      { definition: "s4", examples: [] }, { definition: "s5", examples: [] },
      { definition: "s6-dropped", examples: [] }
    ]
  }],
  source: { url: "https://en.wiktionary.org/wiki/hello", license: { name: "CC BY-SA 4.0", url: "https://creativecommons.org/licenses/by-sa/4.0/" } }
};
const norm = pbpDictNormalizeEntry(FDA_SAMPLE);
assert(norm !== null, "sample normalizes");
assertEq(norm.word, "hello", "word");
assertEq(norm.entries.length, 1, "one entry");
assertEq(norm.entries[0].pos, "interjection", "pos");
assertEq(norm.entries[0].ipas.length, 3, "ipa capped at 3");
assertEq(norm.entries[0].ipas[0].tags[0], "General American", "ipa accent tag");
assertEq(norm.entries[0].senses.length, 6, "senses are retained past the display cap");
assertEq(norm.entries[0].senses[0].examples.length, 2, "examples capped at 2");
assertEq(norm.sourceUrl, "https://en.wiktionary.org/wiki/hello", "source url");
assertEq(norm.license, "CC BY-SA 4.0", "license name");
assertEq(norm.sourceLabel, "Wiktionary", "network normalizer labels source");
assertEq(pbpDictNormalizeEntry({ ...FDA_SAMPLE, source: { url: "javascript:x", license: {} } }).sourceUrl, "", "unsafe source url stripped");
assertEq(pbpDictNormalizeEntry({ word: "书", entries: [], source: {} }), null, "empty entries (zh) -> null");
assertEq(pbpDictNormalizeEntry(null), null, "null json -> null");
assertEq(pbpDictNormalizeEntry({ entries: [{ partOfSpeech: "noun" }] }), null, "no ipa/sense/form -> null");

section("pbpDictEntriesAreFormOfOnly");
// Payloads captured verbatim from freedictionaryapi.com on 2026-07-31, NOT
// produced by the normalizer (server-fixture rule). An inflected form comes
// back as a grammar pointer with no definition of its own.
const FDA_APROVECHO = { /* es/aprovecho */
  word: "aprovecho",
  entries: [{
    language: { code: "es", name: "Spanish" }, partOfSpeech: "verb",
    pronunciations: [], forms: [],
    senses: [{
      definition: "first-person singular present indicative of aprovechar",
      tags: ["first person", "form of", "indicative", "present", "singular"],
      examples: [], quotes: [], synonyms: [], antonyms: [], subsenses: []
    }],
    synonyms: [], antonyms: []
  }],
  source: { url: "https://en.wiktionary.org/wiki/aprovecho", license: { name: "CC BY-SA 4.0", url: "https://creativecommons.org/licenses/by-sa/4.0/" } }
};
const FDA_PSA = { /* pl/psa -- marker sits in the LAST slot the tag cap keeps */
  word: "psa",
  entries: [{
    language: { code: "pl", name: "Polish" }, partOfSpeech: "noun",
    pronunciations: [], forms: [],
    senses: [{
      definition: "accusative/genitive singular of pies",
      tags: ["accusative", "animal not person", "form of", "genitive", "masculine", "singular"],
      examples: [], quotes: [], synonyms: [], antonyms: [], subsenses: []
    }],
    synonyms: [], antonyms: []
  }],
  source: { url: "https://en.wiktionary.org/wiki/psa", license: { name: "CC BY-SA 4.0", url: "" } }
};
const FDA_FOUND = { /* en/found -- pointer entry AND real entries in one payload */
  word: "found",
  entries: [
    {
      language: { code: "en", name: "English" }, partOfSpeech: "verb",
      pronunciations: [], forms: [],
      senses: [{
        definition: "simple past and past participle of find",
        tags: ["form of", "participle", "past"],
        examples: [], quotes: [], synonyms: [], antonyms: [], subsenses: []
      }],
      synonyms: [], antonyms: []
    },
    {
      language: { code: "en", name: "English" }, partOfSpeech: "verb",
      pronunciations: [], forms: [],
      senses: [{
        definition: "To start (an institution or organization).",
        tags: ["transitive"],
        examples: [], quotes: [], synonyms: [], antonyms: [], subsenses: []
      }],
      synonyms: [], antonyms: []
    }
  ],
  source: { url: "https://en.wiktionary.org/wiki/found", license: { name: "CC BY-SA 4.0", url: "" } }
};
assertEq(pbpDictEntriesAreFormOfOnly(FDA_APROVECHO.entries), true, "a lone grammar pointer is form-of-only");
assertEq(pbpDictEntriesAreFormOfOnly(FDA_PSA.entries), true, "marker past the first two tags is still found");
assertEq(pbpDictEntriesAreFormOfOnly(FDA_FOUND.entries), false, "one real sense anywhere disqualifies the whole payload");
assertEq(pbpDictEntriesAreFormOfOnly(FDA_SAMPLE.entries), false, "an ordinary entry is never form-of-only");
assertEq(pbpDictEntriesAreFormOfOnly([]), false, "no senses at all is not a pointer");
assertEq(pbpDictEntriesAreFormOfOnly(null), false, "missing entries is not a pointer");
assertEq(pbpDictEntriesAreFormOfOnly([{ senses: [{ definition: "x", tags: ["Form-Of"] }] }]), true,
  "the marker is matched case- and hyphen-insensitively");
// The flag rides on the model so it survives the dict2_ cache round trip.
assertEq(pbpDictNormalizeEntry(FDA_APROVECHO).formOfOnly, true, "normalized pointer carries the flag");
assertEq(pbpDictNormalizeEntry(FDA_FOUND).formOfOnly, false, "normalized mixed payload does not");
assertEq(pbpDictNormalizeEntry(FDA_APROVECHO).entries[0].senses.length, 1,
  "the pointer still normalizes, so it can be rendered as a last resort");
assertEq(pbpDictNormalizeEntry(FDA_APROVECHO).senseKeep, PBP_DICT_SENSE_KEEP,
  "the model carries the retention it was built with, so a stale cache record refetches");

section("pbpDictContentTokens");
const tok = (s) => [...pbpDictContentTokens(s)].sort().join(",");
assertEq(tok("the of and to in a is"), "", "pure stopwords leave nothing to match on");
assertEq(tok("An edge of river"), "edge,river", "content words survive, stopwords do not");
assertEq(tok("running runs ran"), "ran,run", "crude stemming collapses running/runs, ran stays its own token");
assertEq(tok("a an be"), "", "tokens under three characters are dropped");
assertEq(tok("他喝了一杯水"), "", "a non-Latin sentence yields no tokens, so ranking cannot fire");

section("pbpDictOrderForContext");
// Two entries of en/bank, captured verbatim from freedictionaryapi.com on
// 2026-08-01. Entry 0 is the financial noun, entry 1 is the hydrology noun.
const FDA_BANK = { word: "bank", entries: [
  { partOfSpeech: "noun", pronunciations: [], forms: [], senses: [
    { definition: "(countable) An institution where one can place and borrow money and take care of financial affairs.", tags: ["countable"], examples: [], quotes: [], synonyms: [], antonyms: [], subsenses: [] },
    { definition: "(countable) A branch office of such an institution.", tags: ["countable"], examples: [], quotes: [], synonyms: [], antonyms: [], subsenses: [] },
    { definition: "(countable) An underwriter or controller of a card game.", tags: ["countable"], examples: [], quotes: [], synonyms: [], antonyms: [], subsenses: [] },
    { definition: "(countable) A fund from deposits or contributions, to be used in transacting business; a joint stock or capital.", tags: ["countable"], examples: [], quotes: [], synonyms: [], antonyms: [], subsenses: [] },
    { definition: "(gambling, countable) The sum of money etc. which the dealer or banker has as a fund from which to draw stakes and pay losses.", tags: ["countable"], examples: [], quotes: [], synonyms: [], antonyms: [], subsenses: [] },
    { definition: "(slang, uncountable) Money; profit.", tags: ["slang", "uncountable"], examples: [], quotes: [], synonyms: [], antonyms: [], subsenses: [] },
    { definition: "(countable) In certain games, such as dominos, a fund of pieces from which the players are allowed to draw.", tags: ["countable"], examples: [], quotes: [], synonyms: [], antonyms: [], subsenses: [] },
    { definition: "(countable, chiefly in combination) A safe and guaranteed place of storage for and retrieval of important items or goods.", tags: ["countable", "in compounds"], examples: ["blood bank; data bank; sperm bank"], quotes: [], synonyms: [], antonyms: [], subsenses: [] },
    { definition: "(countable) A device used to store coins or currency.", tags: ["countable"], examples: ["If you want to buy a bicycle, you need to put the money in your piggy bank."], quotes: [], synonyms: [], antonyms: [], subsenses: [] }
  ] },
  { partOfSpeech: "noun", pronunciations: [], forms: [], senses: [
    { definition: "(hydrology) An edge of river, lake, or other watercourse.", tags: [], examples: [], quotes: [], synonyms: [], antonyms: [], subsenses: [] },
    { definition: "(nautical, hydrology) An elevation under the sea; a shallow area of shifting sand, gravel, mud, and so forth", tags: [], examples: ["the banks of Newfoundland"], quotes: [], synonyms: [], antonyms: [], subsenses: [] },
    { definition: "(geography) A slope of earth, sand, etc.; an embankment.", tags: [], examples: [], quotes: [], synonyms: [], antonyms: [], subsenses: [] },
    { definition: "(aviation) The incline of an aircraft, especially during a turn.", tags: [], examples: [], quotes: [], synonyms: [], antonyms: [], subsenses: [] },
    { definition: "(rail transport) An incline, a hill.", tags: [], examples: [], quotes: [], synonyms: [], antonyms: [], subsenses: [] },
    { definition: "A mass of clouds.", tags: [], examples: ["The bank of clouds on the horizon announced the arrival of the predicted storm front."], quotes: [], synonyms: [], antonyms: [], subsenses: [] },
    { definition: "(mining) The face of the coal at which miners are working.", tags: [], examples: [], quotes: [], synonyms: [], antonyms: [], subsenses: [] },
    { definition: "(mining) A deposit of ore or coal, worked by excavations above water level.", tags: [], examples: [], quotes: [], synonyms: [], antonyms: [], subsenses: [] },
    { definition: "(mining) The ground at the top of a shaft.", tags: [], examples: ["Ores are brought to bank."], quotes: [], synonyms: [], antonyms: [], subsenses: [] }
  ] }
], source: { url: "https://en.wiktionary.org/wiki/bank", license: { name: "CC BY-SA 4.0", url: "" } } };
const bankNorm = pbpDictNormalizeEntry(FDA_BANK);
const firstDefs = (view) => view.map((e) => e.senses[0].definition);
const defsOf = (view, i) => view[i].senses.map((s) => s.definition);

const plain = pbpDictOrderForContext(bankNorm.entries, "");
assertEq(plain.length, 2, "every entry still renders");
assertEq(plain[0].senses.length, 9, "the ordered view keeps every retained sense; the render layer cuts to SHOW");
assertEq(defsOf(plain, 0)[0], bankNorm.entries[0].senses[0].definition, "no sentence means untouched API order");
assertEq(defsOf(plain, 1)[0], bankNorm.entries[1].senses[0].definition, "second entry keeps API order too");

// The degradation guarantee: nothing to match on must be byte-identical to the
// old behaviour, which is what a Spanish page or a CC-CEDICT gloss produces.
const foreign = pbpDictOrderForContext(bankNorm.entries, "他站在河边看着水流。");
assertEq(JSON.stringify(foreign), JSON.stringify(plain), "a sentence sharing no language falls back to API order exactly");

const river = pbpDictOrderForContext(bankNorm.entries, "They pulled the boat onto the muddy river bank below the lake.");
assertEq(river[0].senses[0].definition, "(hydrology) An edge of river, lake, or other watercourse.",
  "a river sentence puts the hydrology entry and its matching sense first");
assert(firstDefs(river)[1].indexOf("institution") > -1, "the financial entry is demoted, not dropped");

// The point of raising retention: a sense the old cap discarded can now
// surface INSIDE the rendered window (the render layer shows the first SHOW).

section("pbpEchoTermSet");
const _ets = (rows, cap) => pbpEchoTermSet(rows, cap);
{
  const set1 = _ets([{ term: "net" }, { term: "internet" }, { term: "NET" }]);
  assertEq(set1.length, 2, "dedup by folded key");
  assertEq(set1[0].key, "internet", "longest-first ordering");
  const nfc = _ets([{ term: "café" }, { term: "café" }]);
  assertEq(nfc.length, 1, "NFC merges composed/decomposed");
  const capd = _ets([{ term: "alpha" }, { term: "beta" }, { term: "gamma" }], 2);
  assertEq(capd.length, 2, "cap keeps the first (newest) rows only");
  assertEq(_ets([{ term: "a" }]).length, 0, "single latin letter dropped");
  assert(_ets([{ term: "书" }]).length === 1 && _ets([{ term: "단" }]).length === 1,
    "single non-latin chars kept (han substring-matched, hangul boundary-matched)");
  const lem = _ets([{ term: "running", lemma: "run" }]);
  assert(lem.length === 1 && lem[0].key === "running", "lemma is NOT echoed (term only)");
  const turk = _ets([{ term: "İstanbul" }]);
  assertEq(turk[0].key, "İstanbul", "length-shifting case fold degrades to exact-case key");
  // fold is what _echoScanBlock's prefilter tests a lowercased block against,
  // hoisted out of the per-(block x term) loop. It must keep matching the
  // lowercased block text in BOTH cases -- including the degraded key, whose
  // own case was preserved for index-safe matching, not for the prefilter.
  assertEq(set1[0].fold, "internet", "fold carries the prefilter needle for an ordinary term");
  assertEq(turk[0].fold, "İstanbul".toLowerCase(), "a degraded key still folds for the prefilter");
  assert("İstanbul, henüz".toLowerCase().includes(turk[0].fold),
    "and that fold still hits a lowercased block containing the term");
  const knownSkip = _ets([{ term: "mastered", status: "known" }, { term: "learning" }]);
  assert(knownSkip.length === 1 && knownSkip[0].key === "learning",
    "known words retire from the echo underline; the record itself stays");
  assertEq(_ets([{ term: "legacy" }]).length, 1, "records predating the status field still echo");
}

// The reader can replace the article IN PLACE (video track switch, AI
// punctuation pass, first-authorization promotion): md-preview.js swaps
// #rendered-view's children and dispatches pbp:article-replaced. Vocab echo
// subscribes with the SAME handler it uses for the first render -- these cases

section("vocab echo: article replacement");
{
  const savedOwner = _echoOwner, savedEnabled = _echoEnabled, savedEpoch = _echoEpoch, savedTotal = _echoTotal;
  try {
    // State as an ACTIVE scan of the outgoing article would leave it.
    _echoOwner = "someone-else";
    _echoEnabled = true;
    _echoTotal = 3;
    _echoRanges.set("o1", []);
    _echoDirty.add("o1");
    const epochBefore = _echoEpoch;
    document.dispatchEvent(new CustomEvent("pbp:article-replaced", { detail: { account: "" } }));
    assertEq(_echoEpoch, epochBefore + 1, "epoch bumped: the outgoing article's idle queue can never resume");
    assertEq(_echoEnabled, false, "suspended synchronously, before the settings read even starts");
    assertEq(_echoRanges.size, 0, "ranges into the replaced DOM dropped immediately, not 400ms later");
    assertEq(_echoTotal, 0, "and the draw budget released with them");
    assertEq(_echoDirty.size, 0, "pending dirty keys dropped too");
    assertEq(_echoOwner, pbpDictOwnerScope(""), "owner re-derived from the event account, never inherited");
    const epochMid = _echoEpoch;
    _echoOwner = "another-owner";
    _echoEnabled = true;
    document.dispatchEvent(new CustomEvent("pbp:article-replaced", { detail: { account: "" } }));
    assertEq(_echoEpoch, epochMid + 1, "a SECOND replacement is handled too: the listener is not once-only");
    assertEq(_echoEnabled, false, "and suspends again");
    assertEq(_echoOwner, pbpDictOwnerScope(""), "re-deriving the owner every time");
  } finally {
    _echoOwner = savedOwner; _echoEnabled = savedEnabled; _echoEpoch = savedEpoch; _echoTotal = savedTotal;
    _echoRanges.clear(); _echoDirty.clear();
  }
}

// Two runtime halves the DOM-free sections above cannot reach: the account
// this document rendered under can move away under it (a token swap in
// another tab), and the video workspace that owns the timeline list is
// mounted lazily -- both leave the module wired to state it must not paint
// from, or unwired from DOM it must paint.
async function runVocabEchoWiringTests() {
  const tick = () => new Promise((r) => setTimeout(r, 0));

  // _echoRestart computes the new term set BEFORE dropping the old underlines
  // ("compute, then swap"), so the two reads it awaits no longer blank the
  // article on every word save. That reordering moves the clear out of the
  // function's head, where it used to cover every bail-out for free, so each
  // return now has to be classified: the fail-closed ones must clear
  // themselves, the "a newer generation took over" ones must not. Seeding real
  // CSS.highlights entries before each restart is what makes these rows say
  // anything -- against an empty registry both classes look identical.
  section("vocab echo: fail-closed restart");
  {
    const saved = { owner: _echoOwner, enabled: _echoEnabled, epoch: _echoEpoch, terms: _echoTerms };
    const realAll = window.pbpVocabAll;
    const hadOwnerFn = "pbpVocabCurrentOwner" in window;
    const realOwnerFn = window.pbpVocabCurrentOwner;
    const hadBlocks = "pbpAiBlocks" in window;
    const realBlocks = window.pbpAiBlocks;
    const hadBlockEl = "pbpAiBlockEl" in window;
    const realBlockEl = window.pbpAiBlockEl;
    const hadIndexFn = "pbpAiIndexBlocks" in window;
    const realIndexFn = window.pbpAiIndexBlocks;
    const prevView = document.getElementById("rendered-view");
    if (prevView) prevView.remove();
    const docBody = document.createElement("div");
    const view = document.createElement("div");
    view.id = "rendered-view";
    docBody.appendChild(view);
    document.body.appendChild(docBody);
    // One real block, so a rebuild has something to repaint and "the
    // underlines on screen" is a Highlight over real text, not a flag.
    const para = document.createElement("p");
    para.dataset.pb = "1";
    para.textContent = "residue here";
    view.appendChild(para);
    // Everything a finished scan leaves behind -- registry entry, range list,
    // per-term count, draw budget -- planted in one step.
    const seedPaint = () => {
      const r = document.createRange();
      r.setStart(para.firstChild, 0);
      r.setEnd(para.firstChild, 7);
      const h = new Highlight();
      h.priority = -1;
      h.add(r);
      CSS.highlights.set("pbp-vocab-echo", h);
      _echoHl = h;
      _echoRanges.set("o1", [{ range: r, key: "residue", n: 1 }]);
      _echoCounts.set("residue", 1);
      _echoTotal = 1;
      return h;
    };
    const drawn = () => CSS.highlights.get("pbp-vocab-echo") || null;
    // The repaint runs on requestIdleCallback slices, so it is polled for
    // rather than awaited; anything still false after the budget is a failure.
    const settle = async (cond) => {
      const until = Date.now() + 3000;
      while (Date.now() < until && !cond()) await tick();
      return cond();
    };
    try {
      window.pbpAiBlocks = () => [{ n: 1, el: para }];
      window.pbpAiBlockEl = (n) => (Number(n) === 1 ? para : null);
      window.pbpVocabAll = async () => [{ term: "residue" }];
      // The live account (B) is no longer the one this document rendered
      // under (A) -- the fail-closed branch.
      window.pbpVocabCurrentOwner = async () => "acct_Yg";
      _echoOwner = "acct_YQ";
      _echoEnabled = true;
      _echoTerms = pbpEchoTermSet([{ term: "residue" }]);
      _echoObserve();
      assert(_echoObserver !== null, "precondition: the previous account's scan left the observer attached");
      const stalePaint = seedPaint();
      assert(drawn() === stalePaint, "precondition: the previous account's underlines are on screen before the restart");
      await _echoRestart();
      assertEq(_echoTerms.length, 0, "a live-account mismatch drops the rendered account's term set, not only its painted ranges");
      assertEq(_echoObserver, null, "and disconnects the observer, so no later article mutation can repaint from it");
      assertEq(drawn(), null, "and takes the previous account's underlines off the screen: the rebuild clears late, so this branch clears itself");
      assertEq(_echoTotal, 0, "releasing their draw budget with them");

      _echoTerms = pbpEchoTermSet([{ term: "residue" }]);
      _echoObserve();
      seedPaint();
      _echoEnabled = false;
      await _echoRestart();
      assertEq(_echoTerms.length, 0, "restarting while the feature is switched off drops the term set too");
      assertEq(_echoObserver, null, "and leaves no observer running behind it");
      assertEq(drawn(), null, "and no underlines either: a switched-off feature paints nothing, whatever was on screen");

      // The point of the reorder. Saving one word re-reads the whole owner
      // partition out of IndexedDB and nothing repaints while that is in
      // flight, so the underlines already drawn have to survive it; clearing
      // up front blanked every underline in the article on every save.
      window.pbpVocabCurrentOwner = async () => "acct_YQ";
      _echoEnabled = true;
      const kept = seedPaint();
      let releaseRows = null;
      window.pbpVocabAll = () => new Promise((r) => { releaseRows = () => r([{ term: "residue" }]); });
      const restarting = _echoRestart();
      await tick();
      assert(releaseRows !== null, "precondition: the restart is parked on the vocabulary read");
      assert(drawn() === kept, "the underlines drawn before the restart stay registered while the vocabulary read is pending");
      assertEq(_echoTotal, 1, "and keep their draw budget until the replacement is ready");
      releaseRows();
      await restarting;
      assert(_echoTerms.length === 1 && _echoTerms[0].key === "residue", "a matching live account still loads the owner's terms");
      assert(_echoObserver !== null, "and arms the observer");
      assert(await settle(() => drawn() && drawn() !== kept),
        "and the rebuild replaces the old registry entry with its own instead of leaving it up");
      assertEq(_echoRanges.has("o1"), true, "the block is registered again under its own key");
      assertEq(_echoTotal, 1, "and the repaint accounts for its draw budget");

      // Emptying the vocabulary (deleting the last word, or marking every word
      // known) is a bail-out of the same class as the two above. Without a
      // stand-down the observer armed a moment ago stays attached, and every
      // later article mutation -- streamed translation output, a rebuilt
      // timeline -- still queues a debounced idle rescan over every block to
      // find nothing at all.
      window.pbpVocabAll = async () => [];
      assert(drawn() !== null, "precondition: the article is underlined before the vocabulary empties");
      await _echoRestart();
      assertEq(_echoTerms.length, 0, "an emptied vocabulary leaves no term set behind");
      assertEq(_echoObserver, null, "and stands the observer down instead of leaving it rescanning for nothing");
      assertEq(drawn(), null, "and takes the underlines for the no-longer-saved words down with it");

      // The other class: a continuation whose generation has been overtaken
      // must NOT clear. The state -- including whatever the newer generation
      // has already painted -- stopped being its to erase at the recheck.
      let releaseOwner = null;
      window.pbpVocabCurrentOwner = () => new Promise((r) => { releaseOwner = () => r("acct_YQ"); });
      window.pbpVocabAll = async () => [{ term: "residue" }];
      _echoEnabled = true;
      const stale1 = _echoRestart();
      await tick();
      assert(releaseOwner !== null, "precondition: the restart is parked on the live-account read");
      _echoEpoch++;                // a newer generation takes the state over ...
      const newer1 = seedPaint();  // ... and paints
      releaseOwner();
      await stale1;
      assert(drawn() === newer1, "a continuation stranded past the live-account read leaves the newer generation's underlines alone");
      assertEq(_echoTotal, 1, "and its draw budget untouched");

      window.pbpVocabCurrentOwner = async () => "acct_YQ";
      releaseRows = null;
      window.pbpVocabAll = () => new Promise((r) => { releaseRows = () => r([{ term: "residue" }]); });
      const stale2 = _echoRestart();
      await tick();
      assert(releaseRows !== null, "precondition: the second restart is parked on the vocabulary read");
      _echoEpoch++;
      const newer2 = seedPaint();
      releaseRows();
      await stale2;
      assert(drawn() === newer2, "a continuation stranded past the vocabulary read leaves the newer generation's underlines alone too");
      assertEq(_echoTotal, 1, "with its draw budget intact as well");

      // A REJECTED read is not a fourth class of exit: each .catch fallback
      // routes it into an existing fail-closed branch, and the whole point of
      // pinning that here is that the branches are the only thing standing
      // between an IndexedDB hiccup and underlines stranded on screen forever
      // now that the clear sits at the far end of the function. Awaiting via
      // .catch rather than bare, so that losing a fallback shows up as failing
      // rows instead of an unhandled rejection that takes the suite with it.
      _echoEpoch++;
      _echoEnabled = true;
      seedPaint();
      window.pbpVocabCurrentOwner = async () => { throw new Error("idb"); };
      let escaped = "none";
      await _echoRestart().catch((e) => { escaped = String(e && e.message); });
      assertEq(escaped, "none", "a rejected live-account read is absorbed inside the restart, not re-thrown at its caller");
      assertEq(drawn(), null, "and fails closed: an account that cannot be read is treated as a mismatch, so the underlines come down");
      assertEq(_echoTotal, 0, "with the draw budget released");

      _echoEnabled = true;
      seedPaint();
      window.pbpVocabCurrentOwner = async () => "acct_YQ";
      window.pbpVocabAll = async () => { throw new Error("idb"); };
      escaped = "none";
      await _echoRestart().catch((e) => { escaped = String(e && e.message); });
      assertEq(escaped, "none", "a rejected vocabulary read is absorbed too");
      assertEq(drawn(), null, "and lands in the empty-term-set branch, which takes the underlines down rather than leaving stale ones lit");
      assertEq(_echoTotal, 0, "releasing the draw budget with them");

      // The block index belongs to md-ask / md-translate, not to this module:
      // a throw there is foreign DOM state failing, and before the clear moved
      // to the end of the function it was harmless. Now it has to fail closed
      // like the rest, and say so in the console instead of vanishing.
      const realWarn = console.warn;
      const warned = [];
      window.pbpVocabAll = async () => [{ term: "residue" }];
      window.pbpAiBlocks = () => [];
      window.pbpAiIndexBlocks = () => { throw new TypeError("index exploded"); };
      _echoEnabled = true;
      seedPaint();
      escaped = "none";
      console.warn = (...a) => { warned.push(a.map((x) => String(x)).join(" ")); };
      try {
        await _echoRestart().catch((e) => { escaped = String(e && e.message); });
      } finally {
        console.warn = realWarn;
      }
      assertEq(escaped, "none", "a throwing block index is caught, not left as a rejected restart");
      assertEq(drawn(), null, "and fails closed: the underlines it could not rebuild over come down");
      assertEq(_echoTotal, 0, "and their draw budget is released");
      assert(warned.some((w) => w.includes("[echo] block index failed:") && w.includes("TypeError")),
        "and the swallowed exception leaves a trace carrying its name (no token, no vocabulary content)");
      window.pbpAiBlocks = () => [{ n: 1, el: para }];
    } finally {
      _echoEnabled = false;
      _echoClearAll();
      _echoDisconnect();
      docBody.remove();
      window.pbpVocabAll = realAll;
      if (hadOwnerFn) window.pbpVocabCurrentOwner = realOwnerFn; else delete window.pbpVocabCurrentOwner;
      if (hadBlocks) window.pbpAiBlocks = realBlocks; else delete window.pbpAiBlocks;
      if (hadBlockEl) window.pbpAiBlockEl = realBlockEl; else delete window.pbpAiBlockEl;
      if (hadIndexFn) window.pbpAiIndexBlocks = realIndexFn; else delete window.pbpAiIndexBlocks;
      _echoOwner = saved.owner; _echoEnabled = saved.enabled; _echoEpoch = saved.epoch;
      _echoTerms = saved.terms;
      _echoRanges.clear(); _echoCounts.clear();
      // Not restored from a snapshot: the budget has to agree with the range
      // and count maps this teardown just emptied, and _echoClearAll above
      // already zeroed it. Saying so explicitly keeps the ordering readable.
      _echoTotal = 0;
      if (prevView && !document.getElementById("rendered-view")) document.body.appendChild(prevView);
    }
  }

  section("vocab echo: timeline list mounted after the observer");
  {
    const saved = { enabled: _echoEnabled };
    const prevView = document.getElementById("rendered-view");
    if (prevView) prevView.remove();
    const docBody = document.createElement("div"); // stands in for .doc-body
    const view = document.createElement("div");
    view.id = "rendered-view";
    docBody.appendChild(view);
    document.body.appendChild(docBody);
    try {
      _echoDisconnect();
      _echoEnabled = true;
      _echoRanges.set("o1", []); // one painted block: a full rescan would queue it
      _echoObserve();
      assert(_echoObserver !== null, "precondition: the observer arms with no timeline list in the document yet");
      // md-video mounts its workspace long after this module wired itself:
      // the script is lazy-loaded, and a re-hydrated committed transcript
      // never commits the article again.
      const studyCol = document.createElement("div");
      studyCol.className = "pbv-col-study";
      const list = document.createElement("div");
      list.className = "pbv-list";
      studyCol.appendChild(list);
      docBody.appendChild(studyCol);
      await tick();
      assertEq(_echoDirty.size, 0, "mounting the workspace does not force a full rescan of the article (no repaint flicker)");
      assertEq(list._pbpEchoClick, true, "a timeline list that appears later still gets the row-click binding");
      const row = document.createElement("div");
      row.className = "pbv-row";
      row.appendChild(document.createElement("button")).className = "pbv-time";
      const text = document.createElement("span");
      text.className = "pbv-text";
      text.textContent = "late row";
      row.appendChild(text);
      list.appendChild(row);
      await tick();
      assert(_echoDirty.has("r0"), "and the late list is observed: a row added to it is queued for scanning");
    } finally {
      _echoEnabled = false;
      _echoClearAll();
      _echoDisconnect();
      docBody.remove();
      _echoRanges.clear(); _echoDirty.clear();
      _echoEnabled = saved.enabled;
      if (prevView && !document.getElementById("rendered-view")) document.body.appendChild(prevView);
    }
  }
}

async function runDictNetworkTests() {
  section("dictionary abort causes / circuit runtime");
  const parent = new AbortController();
  const fromParent = _pbpDictChildSignal(parent.signal, 1000);
  parent.abort();
  assert(fromParent.signal.aborted, "parent abort reaches child signal");
  assertEq(fromParent.reason(), "parent", "child records parent as first abort cause");
  fromParent.done();
  const fromTimeout = _pbpDictChildSignal(null, 5);
  await new Promise((r) => setTimeout(r, 15));
  assert(fromTimeout.signal.aborted, "timeout aborts child signal");
  assertEq(fromTimeout.reason(), "timeout", "child distinguishes its own timeout");
  fromTimeout.done();

  const realFetch = window.fetch;
  try {
    _pbpDictCircuit = { failures: 0, openUntil: 0 };
    window.fetch = async () => ({ status: 500, ok: false });
    await _pbpDictFetch("en", "one", null);
    assertEq(_pbpDictCircuit.failures, 1, "500 counts as a circuit failure");
    window.fetch = async () => ({ status: 429, ok: false });
    await _pbpDictFetch("en", "two", null);
    assertEq(_pbpDictCircuit.failures, 2, "429 counts as a circuit failure");
    window.fetch = async () => ({ status: 200, ok: true, json: async () => ({ entries: [] }) });
    await _pbpDictFetch("en", "healthy-empty", null);
    assert(_pbpDictCircuit.failures === 0 && _pbpDictCircuit.openUntil === 0, "healthy 200-empty response resets the circuit");
    _pbpDictCircuit = { failures: 1, openUntil: 0 };
    window.fetch = async () => ({ status: 404, ok: false });
    await _pbpDictFetch("en", "healthy-404", null);
    assert(_pbpDictCircuit.failures === 0 && _pbpDictCircuit.openUntil === 0, "healthy 404 resets the circuit");
    window.fetch = async () => ({ status: 200, ok: true, json: async () => { throw new SyntaxError("bad json"); } });
    try { await _pbpDictFetch("en", "bad-json", null); } catch (_) {}
    assertEq(_pbpDictCircuit.failures, 1, "invalid JSON counts as a circuit failure");

    _pbpDictCircuit = { failures: 0, openUntil: 0 };
    const bodyCtrl = new AbortController();
    let bodyStarted;
    const bodyGate = new Promise((resolve) => { bodyStarted = resolve; });
    window.fetch = async (_url, opts) => ({
      status: 200, ok: true,
      json: () => new Promise((_resolve, reject) => {
        bodyStarted();
        opts.signal.addEventListener("abort", () => reject(new DOMException("Aborted", "AbortError")), { once: true });
      })
    });
    const bodyRead = _pbpDictFetch("en", "slow-body", bodyCtrl.signal).catch((e) => e);
    await bodyGate;
    bodyCtrl.abort();
    const bodyErr = await bodyRead;
    assert(bodyErr && bodyErr.name === "AbortError", "parent abort during response JSON read stays AbortError");
    assertEq(_pbpDictCircuit.failures, 0, "in-flight parent abort during JSON read does not increment failures");
    assert(bodyCtrl.signal.aborted, "deferred JSON regression aborts only after body reading started");

    _pbpDictCircuit = { failures: 0, openUntil: 0 };
    let fetchCalls = 0;
    window.fetch = async () => { fetchCalls++; throw new TypeError("offline"); };
    const stopped = new AbortController();
    stopped.abort();
    let parentErr = null;
    try { await _pbpDictFetch("en", "closed", stopped.signal); } catch (e) { parentErr = e; }
    assert(parentErr && parentErr.name === "AbortError", "pre-aborted parent exits as AbortError");
    assertEq(_pbpDictCircuit.failures, 0, "parent abort never increments circuit failures");
    assertEq(fetchCalls, 0, "pre-aborted parent performs no fetch");

    for (let i = 0; i < 3; i++) {
      try { await _pbpDictFetch("en", "offline-" + i, null); } catch (_) {}
    }
    assertEq(fetchCalls, 3, "three network failures perform exactly three fetches");
    assertEq(_pbpDictCircuit.failures, 3, "three network failures reach the threshold");
    assert(_pbpDictCircuit.openUntil > Date.now(), "threshold opens a future cooldown window");
    let openErr = null;
    try { await _pbpDictFetch("en", "blocked", null); } catch (e) { openErr = e; }
    assert(openErr && openErr.code === "dict_circuit_open", "cooldown rejects with the circuit-open reason");
    assertEq(fetchCalls, 3, "cooldown performs no fourth fetch");
  } finally {
    window.fetch = realFetch;
    _pbpDictCircuit = { failures: 0, openUntil: 0 };
  }
}

async function runDictLookupChainTests() {
  section("dictionary exact / lowercase / lemma chain");
  const realPerm = _pbpDictHasPerm;
  const realFetch = _pbpDictFetch;
  const realCacheGet = window.pbpAiCacheGet;
  const realCacheSet = window.pbpAiCacheSet;
  const cache = new Map();
  let calls = [];
  window.pbpAiCacheGet = async (key) => cache.has(key) ? { result: cache.get(key) } : null;
  window.pbpAiCacheSet = async (key, result) => { cache.set(key, result); };
  _pbpDictHasPerm = async () => true;
  const dataFor = (word) => ({ ...FDA_SAMPLE, word, source: { ...FDA_SAMPLE.source, url: "https://en.wiktionary.org/wiki/" + encodeURIComponent(word) } });
  try {
    _pbpDictFetch = async (_lang, candidate) => {
      calls.push(candidate);
      return candidate === "défense" ? { status: 200, data: dataFor(candidate) } : { status: 200, data: { entries: [] } };
    };
    let slot = document.createElement("div");
    let result = await _pbpDictSlotRun(slot, "Défense", "fr", null, Promise.resolve("défendre"), null);
    assertEq(calls.join(" → "), "Défense → défense", "200-empty exact lookup continues to lowercase in order");
    assert(result && result.word === "défense", "lowercase candidate returns the dictionary entry");
    assert(slot.querySelector(".xp-dict-match")?.textContent === "dictMatchedHeadword:défense",
      "real lowercase lookup renders the actual matched headword");
    assert(cache.has("dict2_fr|défense"), "lowercase result is cached under its actual query key");
    assert(cache.has("dict2_fr|Défense"), "lowercase result writes an exact-form alias");

    cache.clear(); calls = [];
    _pbpDictFetch = async (_lang, candidate) => {
      calls.push(candidate);
      return candidate === "run" ? { status: 200, data: dataFor(candidate) } : { status: 200, data: { entries: [] } };
    };
    slot = document.createElement("div");
    result = await _pbpDictSlotRun(slot, "Running", "en", null, Promise.resolve("run"), null);
    assertEq(calls.join(" → "), "Running → running → run", "semantic misses continue exact to lowercase to lemma");
    assert(result && result.word === "run", "third distinct lemma can satisfy the lookup");
    assert(slot.querySelector(".xp-dict-match")?.textContent === "dictMatchedHeadword:run",
      "real lemma lookup renders the actual matched headword");

    cache.clear(); calls = [];
    _pbpDictFetch = async (_lang, candidate) => { calls.push(candidate); return { status: 200, data: { entries: [] } }; };
    slot = document.createElement("div");
    await _pbpDictSlotRun(slot, "Running", "en", null, Promise.resolve("running"), null);
    assertEq(calls.join(" → "), "Running → running", "lemma identical to a tried candidate is not requested twice");

    cache.clear(); calls = [];
    _pbpDictFetch = async (_lang, candidate) => {
      calls.push(candidate);
      if (candidate === "run") throw new TypeError("offline");
      return { status: 200, data: { entries: [] } };
    };
    slot = document.createElement("div");
    await _pbpDictSlotRun(slot, "running", "en", null, Promise.resolve("run"), null);
    assert(slot.textContent.includes("dictLoadFailed") && slot.querySelector("a").href.startsWith("https://en.wiktionary.org/"),
      "lemma network failure stays unavailable and exposes Wiktionary");

    cache.clear(); calls = [];
    _pbpDictFetch = async (_lang, candidate) => { calls.push(candidate); return { status: 404, data: null }; };
    slot = document.createElement("div");
    await _pbpDictSlotRun(slot, "ghost word", "en", null, Promise.resolve("-"), null);
    assert(slot.textContent.includes("dictNoEntry") && slot.querySelector("a").href === "https://en.wiktionary.org/wiki/ghost%20word",
      "all semantic misses end as no-entry with an encoded fixed-domain fallback");
  } finally {
    _pbpDictHasPerm = realPerm;
    _pbpDictFetch = realFetch;
    if (realCacheGet === undefined) delete window.pbpAiCacheGet; else window.pbpAiCacheGet = realCacheGet;
    if (realCacheSet === undefined) delete window.pbpAiCacheSet; else window.pbpAiCacheSet = realCacheSet;
  }
}

async function runDictPackRoutingTests() {
  section("ready CC-CEDICT routing");
  const realLoad = _pbpDictLoadPack;
  const realPerm = _pbpDictHasPerm;
  const realFetch = _pbpDictFetch;
  const realCacheGet = window.pbpAiCacheGet;
  const realCacheSet = window.pbpAiCacheSet;
  const realLookup = window.pbpPackLookup;
  const realKeys = window.pbpCedictLookupKeys;
  const realToNorm = window.pbpCedictEntryToNorm;
  const onlineData = { ...FDA_SAMPLE, word: "在线词" };
  const packNorm = { ...pbpDictNormalizeEntry(FDA_SAMPLE), word: "词", sourceLabel: "CC-CEDICT", sourceUrl: "https://cc-cedict.org/wiki/" };
  let permCalls = 0, fetchCalls = [];
  _pbpDictLoadPack = async () => true;
  _pbpDictHasPerm = async () => { permCalls++; return true; };
  _pbpDictFetch = async (_lang, candidate) => { fetchCalls.push(candidate); return { status: 200, data: onlineData }; };
  window.pbpAiCacheGet = async () => null;
  window.pbpAiCacheSet = async () => {};
  window.pbpCedictLookupKeys = (term) => [term];
  window.pbpCedictEntryToNorm = () => packNorm;
  try {
    window.pbpPackLookup = async () => ({ state: "hit", matched: "词", rows: [{}] });
    let slot = document.createElement("div");
    let result = await _pbpDictSlotRun(slot, "词", "zh", null, Promise.resolve("-"), null);
    assert(result && result.word === "词", "ready CC-CEDICT hit renders the local entry");
    assert(!slot.querySelector(".xp-dict-match"), "exact CC-CEDICT hit adds no redundant matched-headword label");
    assert(permCalls === 0 && fetchCalls.length === 0, "ready hit needs no permission or network");

    slot = document.createElement("div");
    result = await _pbpDictSlotRun(slot, "词语", "zh", null, Promise.resolve("-"), null);
    assert(slot.querySelector(".xp-dict-match")?.textContent === "dictMatchedHeadword:词",
      "real CC-CEDICT longest-prefix hit discloses the shorter matched headword");

    window.pbpPackLookup = async () => ({ state: "ready-miss" });
    permCalls = 0; fetchCalls = [];
    slot = document.createElement("div");
    result = await _pbpDictSlotRun(slot, "缺词", "zh", null, Promise.resolve("-"), null);
    assertEq(result, null, "ready CC-CEDICT miss ends locally");
    assert(slot.textContent.includes("dictNoEntry") && slot.querySelector("a").href === "https://en.wiktionary.org/wiki/%E7%BC%BA%E8%AF%8D",
      "ready miss uses the unified encoded Wiktionary fallback");
    assert(permCalls === 0 && fetchCalls.length === 0, "ready miss skips FDA permission/network without a second meta read");

    window.pbpPackLookup = async () => ({ state: "unavailable" });
    permCalls = 0; fetchCalls = [];
    slot = document.createElement("div");
    result = await _pbpDictSlotRun(slot, "在线词", "zh", null, Promise.resolve("-"), null);
    assert(result && result.word === "在线词", "missing pack may still use the online dictionary path");
    assert(permCalls === 1 && fetchCalls.join() === "在线词", "missing pack continues through permission and exact FDA request");

    window.pbpPackLookup = async () => ({ state: "error" });
    permCalls = 0; fetchCalls = [];
    slot = document.createElement("div");
    result = await _pbpDictSlotRun(slot, "故障词", "zh", null, Promise.resolve("-"), null);
    assert(result === null && slot.textContent.includes("dictLoadFailed") && slot.querySelector("a"),
      "pack lookup error stays a load failure with Wiktionary fallback");
    assert(permCalls === 0 && fetchCalls.length === 0, "pack lookup error is never disguised by an FDA retry");
  } finally {
    _pbpDictLoadPack = realLoad;
    _pbpDictHasPerm = realPerm;
    _pbpDictFetch = realFetch;
    if (realCacheGet === undefined) delete window.pbpAiCacheGet; else window.pbpAiCacheGet = realCacheGet;
    if (realCacheSet === undefined) delete window.pbpAiCacheSet; else window.pbpAiCacheSet = realCacheSet;
    if (realLookup === undefined) delete window.pbpPackLookup; else window.pbpPackLookup = realLookup;
    if (realKeys === undefined) delete window.pbpCedictLookupKeys; else window.pbpCedictLookupKeys = realKeys;
    if (realToNorm === undefined) delete window.pbpCedictEntryToNorm; else window.pbpCedictEntryToNorm = realToNorm;
  }
}

async function runDictPermissionFeedbackTests() {
  section("local ECDICT side branch");
  {
    const realLoad = _pbpDictLoadPack;
    const realLookup = window.pbpEcdictLookup;
    const realToNorm = window.pbpEcdictEntryToNorm;
    const realCurrent = _pbpDictCurrent;
    const warnings = [];
    const realWarn = console.warn;
    console.warn = (...a) => { warnings.push(a.join(" ")); };
    const cur = {};
    const zhNorm = {
      word: "ephemeral",
      entries: [{ pos: "", ipas: [], forms: [], senses: [{ definition: "a. 朝生暮死的", examples: [], tags: [], synonyms: [], antonyms: [], subsenses: [] }] }],
      sourceLabel: "ECDICT", sourceUrl: "", license: ""
    };
    let lookups = [];
    _pbpDictLoadPack = async () => true;
    window.pbpEcdictEntryToNorm = () => zhNorm;
    try {
      _pbpDictCurrent = cur;

      // The language gate: nothing at all happens outside English.
      window.pbpEcdictLookup = async (t) => { lookups.push(t); return { state: "hit", matched: t, rows: [{}] }; };
      let el = document.createElement("div"); document.body.appendChild(el);
      await _pbpDictEcdictSide(el, "词", "zh", null, cur);
      assert(lookups.length === 0 && el.childNodes.length === 0, "a non-English lookup never starts the local branch");

      // English hit renders into its own container, and only that container.
      lookups = [];
      el = document.createElement("div"); document.body.appendChild(el);
      await _pbpDictEcdictSide(el, "ephemeral", "en", null, cur);
      assert(lookups.join() === "ephemeral", "an English lookup consults the local pack");
      assert(!!el.querySelector(".xp-dict-local-box") && el.textContent.includes("朝生暮死的"),
        "a local hit renders a Chinese block");
      assert(el.textContent.includes("dictZhBlockTitle"), "the block is labelled as coming from the pack");

      // Every non-hit state is silent: no empty box, no error text.
      for (const state of ["ready-miss", "unavailable", "error"]) {
        window.pbpEcdictLookup = async () => ({ state });
        el = document.createElement("div"); document.body.appendChild(el);
        await _pbpDictEcdictSide(el, "ephemeral", "en", null, cur);
        assert(el.childNodes.length === 0, `local state "${state}" renders nothing at all`);
      }

      // Thrown faults stay invisible to the reader but must leave a trace, and
      // must not leak the term into the log.
      warnings.length = 0;
      window.pbpEcdictLookup = async () => { throw new TypeError("idb exploded"); };
      el = document.createElement("div"); document.body.appendChild(el);
      await _pbpDictEcdictSide(el, "ephemeral", "en", null, cur);
      assert(el.childNodes.length === 0, "a thrown lookup renders nothing");
      assert(warnings.some((w) => w.includes("TypeError") && w.includes("idb exploded")),
        "a thrown lookup is still reported to the console");
      assert(!warnings.some((w) => w.includes("ephemeral")), "the console trace carries no looked-up term");

      warnings.length = 0;
      _pbpDictLoadPack = async () => { throw new Error("inject failed"); };
      el = document.createElement("div"); document.body.appendChild(el);
      await _pbpDictEcdictSide(el, "ephemeral", "en", null, cur);
      assert(el.childNodes.length === 0 && warnings.length === 1, "a loader rejection is silent but traced");
      _pbpDictLoadPack = async () => true;

      // A slow answer that arrives after the run was superseded must not write.
      window.pbpEcdictLookup = async (t) => {
        _pbpDictCurrent = {};                 // a newer lookup took over mid-flight
        return { state: "hit", matched: t, rows: [{}] };
      };
      el = document.createElement("div"); document.body.appendChild(el);
      await _pbpDictEcdictSide(el, "ephemeral", "en", null, cur);
      assert(el.childNodes.length === 0, "a late answer does not write into a superseded lookup");

      // Same for an aborted one.
      _pbpDictCurrent = cur;
      const ac = new AbortController();
      window.pbpEcdictLookup = async (t) => { ac.abort(); return { state: "hit", matched: t, rows: [{}] }; };
      el = document.createElement("div"); document.body.appendChild(el);
      await _pbpDictEcdictSide(el, "ephemeral", "en", ac.signal, cur);
      assert(el.childNodes.length === 0, "an aborted lookup does not write");

      // A detached container is not written either: the panel may already be gone.
      _pbpDictCurrent = cur;
      window.pbpEcdictLookup = async (t) => ({ state: "hit", matched: t, rows: [{}] });
      el = document.createElement("div");   // never appended
      await _pbpDictEcdictSide(el, "ephemeral", "en", null, cur);
      assert(el.childNodes.length === 0, "a detached container is left alone");
    } finally {
      _pbpDictLoadPack = realLoad;
      window.pbpEcdictLookup = realLookup;
      window.pbpEcdictEntryToNorm = realToNorm;
      _pbpDictCurrent = realCurrent;
      console.warn = realWarn;
    }
  }

  section("online dictionary permission denial feedback");
  const realPerm = _pbpDictHasPerm;
  const realCacheGet = window.pbpAiCacheGet;
  const realChrome = window.chrome;
  let requests = 0;
  _pbpDictHasPerm = async () => false;
  window.pbpAiCacheGet = async () => null;
  window.chrome = { permissions: { request: async () => { requests++; return false; } } };
  try {
    const slot = document.createElement("div");
    await _pbpDictSlotRun(slot, "word", "en", null, Promise.resolve("-"), () => {});
    const button = slot.querySelector(".xp-dict-connect");
    assert(button?.textContent === "dictConnect" && slot.textContent.includes("dictConnectHint"),
      "production permission gate explains the online dictionary before requesting access");
    button.click();
    await new Promise((resolve) => setTimeout(resolve, 0));
    const feedback = slot.querySelector('[role="status"]');
    assert(feedback && !feedback.hidden && feedback.textContent === "dictPermissionDenied" &&
      button.textContent === "dictConnectRetry" && !button.disabled,
      "permission denial is visible, announced, and leaves a retry action enabled");
    button.click();
    await new Promise((resolve) => setTimeout(resolve, 0));
    assert(requests === 2 && !button.disabled, "denied permission can be retried through the same production action");
  } finally {
    _pbpDictHasPerm = realPerm;
    if (realCacheGet === undefined) delete window.pbpAiCacheGet; else window.pbpAiCacheGet = realCacheGet;
    if (realChrome === undefined) delete window.chrome; else window.chrome = realChrome;
  }
}

async function runDictCtxObserverLifecycleTests() {
  section("dictionary AI-gloss fold observer lifecycle (K151)");
  const realResolveLang = _pbpDictResolveLang;
  const realSlotRun = _pbpDictSlotRun;
  const realCtxRun = _pbpDictCtxRun;
  const realIO = window.IntersectionObserver;
  const realGBCR = Element.prototype.getBoundingClientRect;

  // Counting fake: constructor increments live, disconnect decrements
  // (idempotently -- a second disconnect on the same instance is a no-op,
  // matching real IntersectionObserver semantics), observe just records the
  // target. instances[] lets the test grab a specific run's observer back
  // out to fire its callback directly, simulating a late/stale notification.
  class FakeIO {
    constructor(cb) {
      this.cb = cb;
      this._live = true;
      FakeIO.live++;
      FakeIO.instances.push(this);
    }
    observe(el) { this.target = el; }
    disconnect() { if (this._live) { this._live = false; FakeIO.live--; } }
    unobserve() {}
  }
  FakeIO.live = 0;
  FakeIO.instances = [];

  _pbpDictResolveLang = async () => "en";
  _pbpDictSlotRun = async () => null;
  _pbpDictCtxRun = async (_el, _cap, _ctx, _s, _signal, resolveLemmaOnce) => {
    resolveLemmaOnce("");
    return { gloss: "ctx gloss", lemma: "" }; // truthy `parsed` -> _pbpDictCtxSignal runs
  };
  window.IntersectionObserver = FakeIO;
  // _pbpDictCtxSignal's own fold check reads real getBoundingClientRect() off
  // the popover body and the ctx element; force every reading "below the
  // fold" (ctxEl.top >= body.bottom - 12) so the observer actually gets built
  // instead of early-returning as already-visible.
  Element.prototype.getBoundingClientRect = function () {
    return { top: 500, bottom: 100, left: 0, right: 0, width: 0, height: 0 };
  };

  const pop = document.createElement("div");
  pop.innerHTML = '<div class="xp-body"></div>'; // no .xp-vocab -> skips the vocab-lookup branch
  document.body.appendChild(pop); // .xp-dict-ctx must be isConnected for _pbpDictCtxSignal to arm
  try {
    // (a) two consecutive lookups, neither scrolled into view nor dot-clicked:
    // the first run's observer must be torn down when the second run starts,
    // not left to accumulate. RED (pre-fix): 2.
    await pbpDictRun({ text: "alpha" }, { sentence: "alpha" }, pop, new AbortController(), {});
    await pbpDictRun({ text: "beta" }, { sentence: "beta" }, pop, new AbortController(), {});
    assertEq(FakeIO.live, 1, "a second lookup's teardown leaves only the newest fold observer live");

    // (b) action switch (leaving the reader action / pbp:article-will-replace)
    // is the other teardown point -- it must disconnect whatever is still live.
    window.pbpDictOnActionSwitch();
    assertEq(FakeIO.live, 0, "an action switch disconnects the still-live fold observer");

    // (c) identity guard: a stale observer's callback firing AFTER a newer
    // run has already replaced the module handle must not null out the NEW
    // handle -- only the run's own teardown (or the newer run's) may do that.
    await pbpDictRun({ text: "gamma" }, { sentence: "gamma" }, pop, new AbortController(), {});
    const staleIo = FakeIO.instances[FakeIO.instances.length - 1];
    await pbpDictRun({ text: "delta" }, { sentence: "delta" }, pop, new AbortController(), {});
    const freshIo = FakeIO.instances[FakeIO.instances.length - 1];
    assert(staleIo !== freshIo, "each run allocates its own observer instance");
    // "delta"'s run-top teardown already disconnected staleIo. Firing its
    // (now-stale) callback simulates a notification that was queued before
    // disconnect landed -- it must not clobber the module handle, which by
    // now points at freshIo.
    staleIo.cb([{ isIntersecting: true }]);
    assert(_pbpDictCtxIo === freshIo,
      "a stale observer's late callback does not null out a newer run's live handle");
    window.pbpDictOnActionSwitch();
    assertEq(FakeIO.live, 0, "the current handle still tears down normally after a stale callback no-ops");
  } finally {
    _pbpDictResolveLang = realResolveLang;
    _pbpDictSlotRun = realSlotRun;
    _pbpDictCtxRun = realCtxRun;
    window.IntersectionObserver = realIO;
    Element.prototype.getBoundingClientRect = realGBCR;
    pop.remove();
  }
}

async function runVocabIdbTests() {

      const store = req.result.createObjectStore("words", { keyPath: "id" });
      store.createIndex("owner", "owner", { unique: false });
      store.createIndex("updatedAt", "updatedAt", { unique: false });
      store.put(legacyWord);
    };
    req.onsuccess = () => { req.result.close(); resolve(); };
    req.onerror = () => reject(req.error);
  });
  _pbpVocabDbPromise = null;

  assertEq(e2.contexts.length, 1, "same url+quote deduped");
  assertEq(e2.gloss, "g2", "latest gloss wins");
  // A re-save carrying NEW attribution (e.g. a re-lookup that landed on

  assertEq(e2b.license, "CC BY-SA 4.0 (CC-CEDICT)", "re-save overwrites license with the latest lookup's attribution");
  const e2c = await pbpVocabSaveWord("acct_a", { term: "running", language: "en", gloss: "g2", license: "MIT", context: { ...ctx1 } });
  assert(e2c.license === "MIT" && e2c.sourceUrl === null, "one-sided attribution nulls the other side (no mixed attribution)");

  assertEq(e3.contexts.length, 2, "second article context appended");
  const got = await pbpVocabGet("acct_a|en|running");

  assertEq(await pbpVocabGet("acct_a|en|missing"), null, "pbpVocabGet miss resolves null");
  await pbpVocabSaveWord("acct_b", { term: "running", language: "en", gloss: "other-account", context: ctx1 });

  assertEq(await pbpVocabDelete("acct_a|en|ghost", "acct_a"), true, "delete of a missing id is idempotent-true (UI treats it as done)");
  const badDel = await pbpVocabDelete(aRows[0].id, "acct_wrong");
  assert(badDel === false, "delete with wrong owner resolves false");
  assertEq((await pbpVocabAll("acct_a")).length, 1, "wrong-owner delete leaves the record in place");
  const okDel = await pbpVocabDelete(aRows[0].id, "acct_a");
  assert(okDel === true, "delete resolves true on tx complete");
  assertEq((await pbpVocabAll("acct_a")).length, 0, "deleted row gone");
  assertEq((await pbpVocabAll("acct_b")).length, 1, "other owner untouched");

  await pbpVocabSaveWord("acct_a", { term: "alpha", language: "en", gloss: "ga", context: ctx1 });
  await pbpVocabSaveWord("acct_a", { term: "beta", language: "en", gloss: "gb", context: ctx1 });
  const groupIds = (await pbpVocabAll("acct_a")).map((row) => row.id);

  assertEq(pbpVocabNormalizeGroupName("  Study   List  "), "Study List", "group names NFC-trim and collapse whitespace");
  assertEq(pbpVocabGroups({ groups: undefined }).length, 0, "legacy record without groups reads as an empty array");
  assert(await pbpVocabBatchAddGroup(groupIds, "acct_a", " Study   List "), "batch add-group resolves true on transaction completion");
  assert((await pbpVocabAll("acct_a")).every((row) => row.groups.includes("Study List")), "batch add-group updates every selected owner record");
  assert(await pbpVocabBatchAddGroup(groupIds, "acct_a", "Study List"), "adding an existing group is idempotent-success");
  assert((await pbpVocabAll("acct_a")).every((row) => row.groups.filter((g) => g === "Study List").length === 1), "batch add-group never duplicates a group name");
  assertEq(await pbpVocabBatchAddGroup([groupIds[0], otherId], "acct_a", "Wrong"), false, "cross-owner batch add aborts");
  assert(!(await pbpVocabAll("acct_a")).some((row) => row.groups.includes("Wrong")), "aborted add-group leaves every owner record unchanged");
  assertEq(await pbpVocabBatchDelete([groupIds[0], otherId], "acct_a"), false, "cross-owner batch delete aborts");
  assertEq((await pbpVocabAll("acct_a")).length, 2, "aborted batch delete leaves all selected owner records");
  assert(await pbpVocabBatchDelete(groupIds, "acct_a"), "same-owner batch delete resolves true on transaction completion");
  assertEq((await pbpVocabAll("acct_a")).length, 0, "same-owner batch delete removes the complete selection");
  assertEq((await pbpVocabAll("acct_b")).length, 1, "batch mutations never touch the other owner");
}
// Integration-level ladder tests: the REAL _pbpDictResolveLang against a
// scripted chrome.i18n.detectLanguage and a real #rendered-view fixture.
// Every other runtime suite stubs the resolver out, so without this section
// the ladder itself (explicit metadata, script rung, acceptability gate,
// Latin fallback wiring) has no regression protection.
async function runDictResolveLangLadderTests() {
  section("_pbpDictResolveLang ladder (integration, scripted CLD)");
  const realChrome = window.chrome;
  let calls = [];
  let script = {};
  let longTextFixture = null; // stands in for the >=100-char article sample
  window.chrome = { i18n: { detectLanguage: (text, cb) => {
    calls.push(text);
    const hit = script[text] || (text.length >= 100 ? longTextFixture : null);
    cb(hit ? { isReliable: hit.reliable, languages: [{ language: hit.lang, percentage: 100 }] }
           : { isReliable: false, languages: [] });
  } } };
  const view = document.createElement("div");
  view.id = "rendered-view";
  document.body.appendChild(view);
  try {
    calls = [];
    assertEq(await _pbpDictResolveLang({ text: "转换" }, { selLang: "zh-CN", sentence: "转换数据" }, ""), "zh",
      "explicit translation metadata routes without detection");
    assertEq(calls.length, 0, "explicit metadata short-circuits CLD entirely");
    script = { "iPhone 很好用": { lang: "zh", reliable: true } };
    assertEq(await _pbpDictResolveLang({ text: "iPhone" }, { selLang: "zh", sentence: "iPhone 很好用", blockText: "" }, ""), "en",
      "a Latin brand inside a zh translation block falls through the gate to en");
    script = { "这个 Converts 函数把 A 变成 B": { lang: "zh", reliable: true } };
    assertEq(await _pbpDictResolveLang({ text: "Converts" }, { sentence: "这个 Converts 函数把 A 变成 B", blockText: "" }, ""), "en",
      "a reliable zh read on the surrounding sentence cannot hijack a Latin selection");
    script = { "kaikki sanat ovat täällä": { lang: "fi", reliable: true } };
    assertEq(await _pbpDictResolveLang({ text: "sana" }, { sentence: "kaikki sanat ovat täällä", blockText: "" }, ""), "en",
      "a confident detection outside the query set no longer leaks a request");
    calls = [];
    assertEq(await _pbpDictResolveLang({ text: "привет" }, { sentence: "привет мир", blockText: "" }, ""), "ru",
      "Cyrillic routes ru from the script rung");
    assertEq(calls.length, 0, "the script rung never spends a CLD call");
    view.setAttribute("lang", "ja");
    assertEq(await _pbpDictResolveLang({ text: "東京" }, { sentence: "東京 is a city", blockText: "" }, ""), "ja",
      "kanji-only selection inside a ja article keeps the ja correction");
    view.removeAttribute("lang");
    script = { "Converts wiktionary data from kaikki.": { lang: "en", reliable: false } };
    assertEq(await _pbpDictResolveLang({ text: "Converts" }, { sentence: "Converts wiktionary data from kaikki.", blockText: "" }, ""), "en",
      "the original bug: unreliable en on a jargon sentence still reaches en");
    script = { "żółć w ustach": { lang: "pl", reliable: false } };
    assertEq(await _pbpDictResolveLang({ text: "żółć" }, { sentence: "żółć w ustach", blockText: "" }, ""), "pl",
      "extended-Latin Polish rides its unreliable candidate to pl");
    calls = [];
    assertEq(await _pbpDictResolveLang({ text: "Converts" }, { selLang: "zh", sentence: "x" }, "fr"), "fr",
      "manual choice outranks every automatic rung");
    assertEq(calls.length, 0, "manual choice spends no CLD call");
    assertEq(await _pbpDictResolveLang({ text: "→▲" }, { sentence: "→▲", blockText: "" }, ""), "",
      "letterless selections stay unknown instead of guessing");
    // Article prior (batch B): a reliable full-prose read fills in where the
    // local context is too short to decide.
    const dePara = document.createElement("p");
    dePara.textContent = "Der Bahnhof liegt mitten in der Stadt und wurde vor über hundert Jahren gebaut. "
      + "Viele Reisende steigen hier täglich um, denn die Strecke verbindet den Norden mit dem Süden.";
    view.appendChild(dePara);
    _pbpDictArticlePrior = null;
    script = {};
    longTextFixture = { lang: "de", reliable: true };
    assertEq(await _pbpDictResolveLang({ text: "Bahnhof" }, { sentence: "Bahnhof", blockText: "" }, ""), "de",
      "a reliable article prior routes a lone Latin word the local rungs could not");
    const longCallsBefore = calls.filter((c) => c.length >= 100).length;
    await _pbpDictResolveLang({ text: "Reisende" }, { sentence: "Reisende", blockText: "" }, "");
    assertEq(calls.filter((c) => c.length >= 100).length, longCallsBefore,
      "the article prior is detected once per document, then cached");
    assertEq(await _pbpDictResolveLang({ text: "привет" }, { sentence: "привет", blockText: "" }, ""), "ru",
      "the script rung still outranks the article prior");
    document.dispatchEvent(new CustomEvent("pbp:rendered", { detail: { account: "" } }));
    view.replaceChildren();
    assertEq(await _pbpDictResolveLang({ text: "Bahnhof" }, { sentence: "Bahnhof", blockText: "" }, ""), "en",
      "pbp:rendered resets the prior; a near-empty document abstains and falls to en");
    dePara.className = "pb-tr";
    view.appendChild(dePara);
    _pbpDictArticlePrior = null;
    assertEq(await _pbpDictResolveLang({ text: "Bahnhof" }, { sentence: "Bahnhof", blockText: "" }, ""), "en",
      "translation overlays are excluded from the article sample");
    // Nested code inside a wrapper block must not feed the prior either
    // (Codex review MEDIUM 2): wrapper textContent alone would sample it.
    view.replaceChildren();
    const wrap = document.createElement("div");
    const pre = document.createElement("pre");
    pre.textContent = "const x = 1; ".repeat(30);
    const p = document.createElement("p");
    p.textContent = "kurz";
    wrap.appendChild(pre); wrap.appendChild(p);
    view.appendChild(wrap);
    _pbpDictArticlePrior = null;
    assertEq(await _pbpDictResolveLang({ text: "Bahnhof" }, { sentence: "Bahnhof", blockText: "" }, ""), "en",
      "nested PRE is scrubbed from the sample; what remains is too short to be a prior");
    // Non-Russian Cyrillic ends honest-unknown (Codex review MEDIUM 1)
    script = { "їжа смачна": { lang: "uk", reliable: true } };
    assertEq(await _pbpDictResolveLang({ text: "їжа" }, { sentence: "їжа смачна", blockText: "" }, ""), "",
      "Ukrainian stays unknown: script rung abstains and the gate blocks the uk detection");
    // Unknown language renders its own message and never queries
    const unknownSlot = document.createElement("div");
    await _pbpDictSlotRun(unknownSlot, "word", "", null, Promise.resolve(""), null, "");
    assert(unknownSlot.textContent.includes("dictLangUnknown"),
      "unknown language renders dictLangUnknown, not a dictionary miss");
  } finally {
    if (realChrome === undefined) delete window.chrome; else window.chrome = realChrome;
    view.remove();
  }
}
