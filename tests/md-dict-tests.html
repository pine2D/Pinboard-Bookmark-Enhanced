    await _pbpDictCedictSide(local, "词", "zh", controller.signal, cur, norm => deliveries.push(norm));
    check("CC-CEDICT delivers a usable local entry without waiting for permission or network", deliveries[0] === packNorm && local.textContent.includes("local word definition") && permCalls === 0 && fetchCalls.length === 0);
    check("exact CC-CEDICT lookup omits a redundant matched-headword label", !local.querySelector(".xp-dict-match"));
    local = fresh();
    await _pbpDictCedictSide(local, "词语", "zh", controller.signal, cur);
    check("CC-CEDICT longest-prefix results disclose their actual matched headword", local.querySelector(".xp-dict-match")?.textContent === "dictMatchedHeadword:词");
    const outsideLanguage = fresh();
    await _pbpDictCedictSide(outsideLanguage, "word", "en", controller.signal, cur, norm => deliveries.push(norm));
    check("CC-CEDICT never contributes Chinese results to another source language", outsideLanguage.childElementCount === 0 && deliveries.length === 1);

    for (const state of ["ready-miss", "unavailable", "error"]) {
      window.pbpPackLookup = async () => ({ state });
      permCalls = 0; fetchCalls = []; local = fresh(); const online = fresh();
      const [, result] = await Promise.all([
        _pbpDictCedictSide(local, "词", "zh", controller.signal, cur),
        _pbpDictSlotRun(online, "词", "zh", controller.signal, Promise.resolve(""), null)
      ]);
      check("CC-CEDICT " + state + " leaves the authorized online source available", local.childElementCount === 0 && result?.word === "词" && permCalls === 1 && fetchCalls.join() === "词");
    }
    window.pbpPackLookup = async () => ({ state: "hit", matched: "词", rows: [{}] });
    _pbpDictHasPerm = async () => false; fetchCalls = []; local = fresh(); const ungranted = fresh();
    await Promise.all([_pbpDictCedictSide(local, "词", "zh", controller.signal, cur),
      _pbpDictSlotRun(ungranted, "词", "zh", controller.signal, Promise.resolve(""), null)]);
    check("an ungranted online source cannot send network requests and leaves CC-CEDICT readable", fetchCalls.length === 0 && !!ungranted.querySelector(".xp-dict-connect") && local.textContent.includes("local word definition"));
    for (const mode of ["aborted", "superseded"]) {
      const pendingCtrl = new AbortController(); _pbpDictCurrent = cur;
      window.pbpPackLookup = async () => {
        if (mode === "aborted") pendingCtrl.abort(); else _pbpDictCurrent = {};
        return { state: "hit", matched: "词", rows: [{}] };
      };
      local = fresh(); let delivered = false;
      await _pbpDictCedictSide(local, "词", "zh", pendingCtrl.signal, cur, () => { delivered = true; });
      check(mode + " CC-CEDICT results cannot render or expose stale save choices", !delivered && local.childElementCount === 0);
    }

    // Exercise the actual reader orchestration: local data arrives while the
    // authorized remote request is still pending, and both survive completion.
    _pbpDictResolveLang = async () => "zh"; _pbpDictEntryMount = () => null;
    _pbpDictPackSide = async () => {}; pbpVocabGet = async () => null; _pbpDictOwner = "acct_cedict";
    _pbpDictHasPerm = async () => true;
    window.pbpPackLookup = async () => ({ state: "hit", matched: "词", rows: [{}] });
    let finishOnline;
    _pbpDictFetch = () => new Promise(resolve => { finishOnline = resolve; });
    const pop = fresh(); pop.innerHTML = '<div class="xp-body"></div><div class="xp-foot"><button class="xp-vocab"></button></div>';
    const running = pbpDictRun({ text: "词" }, { sentence: "这个词很常见。" }, pop, controller, {});
    await tick();
    check("reader makes CC-CEDICT visible and collectible before the online request settles", !!pop.querySelector(".xp-dict-legacy .xp-dict-local-box") && _pbpDictCurrent.gloss === "local word definition" && !pop.querySelector(".xp-vocab").disabled);
    finishOnline({ status: 200, data: onlineData }); await running;
    check("reader displays CC-CEDICT and the authorized online entry together", pop.querySelectorAll(".xp-dict-src a").length === 2 && !!pop.querySelector(".xp-dict-online .xp-dict-entry") && !!pop.querySelector(".xp-dict-legacy .xp-dict-entry"));
    check("source divider follows DOM order even when local results arrive first", !pop.querySelector(".xp-dict-local-box").hasAttribute("data-source-break") && pop.querySelector(".xp-dict-online").hasAttribute("data-source-break"));
    const selected = pop.querySelector(".xp-dict-save-meaning");
    selected.value = String(_pbpDictCurrent.meaningChoices.findIndex(choice => choice.sourceUrl === packNorm.sourceUrl));
    selected.dispatchEvent(new Event("change")); await tick();
    check("local and online definitions remain independently selectable for saving", _pbpDictCurrent.gloss === "local word definition" && _pbpDictCurrent.meaningChoices.some(choice => choice.sourceUrl.includes("wiktionary")));
    window.pbpPackLookup = async () => ({ state: "unavailable" });
    _pbpDictFetch = async () => ({ status: 200, data: onlineData });
    const oldRun = _pbpDictCurrent;
    window.dispatchEvent(new CustomEvent("pbp-dict-packs-changed", { detail: { type: "changed", id: "cedict", action: "enabled", kind: "legacy" } }));
    await tick();
    check("disabling CC-CEDICT reruns an open reader and removes its displayed and savable definitions", _pbpDictCurrent !== oldRun && !pop.querySelector(".xp-dict-legacy .xp-dict-local-box") && !_pbpDictCurrent.meaningChoices.some(choice => choice.sourceUrl === packNorm.sourceUrl) && _pbpDictCurrent.gloss !== "local word definition");
    check("after the disabled source disappears the remaining online section has no leading divider", !!pop.querySelector(".xp-dict-online .xp-dict-entry") && !pop.querySelector(".xp-dict-online").hasAttribute("data-source-break"));
  } finally {
    controller.abort(); containers.forEach(el => el.remove());
    _pbpDictLoadPack = saved.load; _pbpDictHasPerm = saved.perm; _pbpDictFetch = saved.fetch;
    _pbpDictCurrent = saved.current; _pbpDictResolveLang = saved.resolve; _pbpDictEntryMount = saved.entry;
    _pbpDictPackSide = saved.packs; pbpVocabGet = saved.get; _pbpDictOwner = saved.owner;
    for (const [name, value] of globals) { if (value === undefined) delete window[name]; else window[name] = value; }
  }
}

async function runDictPermissionFeedbackTests() {
  section("local ECDICT side branch");
  {
    const realLoad = _pbpDictLoadPack;
    const realLookup = window.pbpEcdictLookup;
    const realToNorm = window.pbpEcdictEntryToNorm;
    const realCurrent = _pbpDictCurrent;
    const warnings = [];
    const realWarn = console.warn;
    console.warn = (...a) => { warnings.push(a.join(" ")); };
    const cur = {};
    const zhNorm = {
      word: "ephemeral",
      entries: [{ pos: "", ipas: [], forms: [], senses: [{ definition: "a. 朝生暮死的", examples: [], tags: [], synonyms: [], antonyms: [], subsenses: [] }] }],
      sourceLabel: "ECDICT", sourceUrl: "", license: ""
    };
    let lookups = [];
    const deliveries = [];
    const receive = (norm) => deliveries.push({ norm, rendered: !!el.querySelector(".xp-dict-local-box") });
    let el;
    _pbpDictLoadPack = async () => true;
    window.pbpEcdictEntryToNorm = () => zhNorm;
    try {
      _pbpDictCurrent = cur;

      // The language gate: nothing at all happens outside English.
      window.pbpEcdictLookup = async (t) => { lookups.push(t); return { state: "hit", matched: t, rows: [{}] }; };
      el = document.createElement("div"); document.body.appendChild(el);
      await _pbpDictEcdictSide(el, "词", "zh", null, cur, receive);
      assert(lookups.length === 0 && el.childNodes.length === 0, "a non-English lookup never starts the local branch");
      assertEq(deliveries.length, 0, "a non-English local lookup never reports a result");

      // English hit renders into its own container, and only that container.
      lookups = [];
      el = document.createElement("div"); document.body.appendChild(el);
      const returned = await _pbpDictEcdictSide(el, "ephemeral", "en", null, cur, receive);
      assert(lookups.join() === "ephemeral", "an English lookup consults the local pack");
      assert(!!el.querySelector(".xp-dict-local-box") && el.textContent.includes("朝生暮死的"),
        "a local hit renders a Chinese block");
      assert(el.textContent.includes("dictZhBlockTitle"), "the block is labelled as coming from the pack");
      assert(deliveries.length === 1 && deliveries[0].norm === zhNorm,
        "the optional callback receives the same normalized local result exactly once without another lookup");
      assert(deliveries[0]?.rendered, "the local-result callback runs only after its dictionary block has rendered");
      assert(returned === undefined && Object.keys(cur).length === 0,
        "reporting a local result preserves the reader's undefined return and leaves current vocabulary fields untouched");

      // Every non-hit state is silent: no empty box, no error text.
      for (const state of ["ready-miss", "unavailable", "error"]) {
        window.pbpEcdictLookup = async () => ({ state });
        el = document.createElement("div"); document.body.appendChild(el);
        await _pbpDictEcdictSide(el, "ephemeral", "en", null, cur, receive);
        assert(el.childNodes.length === 0, `local state "${state}" renders nothing at all`);
        assertEq(deliveries.length, 1, `local state "${state}" never delivers a result to save`);
      }

      // Thrown faults stay invisible to the reader but must leave a trace, and
      // must not leak the term into the log.
      warnings.length = 0;
      window.pbpEcdictLookup = async () => { throw new TypeError("idb exploded"); };
      el = document.createElement("div"); document.body.appendChild(el);
      await _pbpDictEcdictSide(el, "ephemeral", "en", null, cur, receive);
      assert(el.childNodes.length === 0, "a thrown lookup renders nothing");
      assert(warnings.some((w) => w.includes("TypeError") && w.includes("idb exploded")),
        "a thrown lookup is still reported to the console");
      assert(!warnings.some((w) => w.includes("ephemeral")), "the console trace carries no looked-up term");
      assertEq(deliveries.length, 1, "a failed local read never delivers a result to save");

      warnings.length = 0;
      _pbpDictLoadPack = async () => { throw new Error("inject failed"); };
      el = document.createElement("div"); document.body.appendChild(el);
      await _pbpDictEcdictSide(el, "ephemeral", "en", null, cur, receive);
      assert(el.childNodes.length === 0 && warnings.length === 1, "a loader rejection is silent but traced");
      assertEq(deliveries.length, 1, "a failed pack load never delivers a result to save");
      _pbpDictLoadPack = async () => true;

      // A slow answer that arrives after the run was superseded must not write.
      window.pbpEcdictLookup = async (t) => {
        _pbpDictCurrent = {};                 // a newer lookup took over mid-flight
        return { state: "hit", matched: t, rows: [{}] };
      };
      el = document.createElement("div"); document.body.appendChild(el);
      await _pbpDictEcdictSide(el, "ephemeral", "en", null, cur, receive);
      assert(el.childNodes.length === 0, "a late answer does not write into a superseded lookup");
      assertEq(deliveries.length, 1, "a superseded local query cannot supply another word's save candidates");

      // Same for an aborted one.
      _pbpDictCurrent = cur;
      const ac = new AbortController();
      window.pbpEcdictLookup = async (t) => { ac.abort(); return { state: "hit", matched: t, rows: [{}] }; };
      el = document.createElement("div"); document.body.appendChild(el);
      await _pbpDictEcdictSide(el, "ephemeral", "en", ac.signal, cur, receive);
      assert(el.childNodes.length === 0, "an aborted lookup does not write");
      assertEq(deliveries.length, 1, "an aborted local query never delivers a result to save");

      // A detached container is not written either: the panel may already be gone.
      _pbpDictCurrent = cur;
      window.pbpEcdictLookup = async (t) => ({ state: "hit", matched: t, rows: [{}] });
      el = document.createElement("div");   // never appended
      await _pbpDictEcdictSide(el, "ephemeral", "en", null, cur, receive);
      assert(el.childNodes.length === 0, "a detached container is left alone");
      assertEq(deliveries.length, 1, "a removed dictionary panel never delivers a result to save");
    } finally {
      _pbpDictLoadPack = realLoad;
      window.pbpEcdictLookup = realLookup;
      window.pbpEcdictEntryToNorm = realToNorm;
      _pbpDictCurrent = realCurrent;
      console.warn = realWarn;
    }
  }

  section("online dictionary permission denial feedback");
  const realPerm = _pbpDictHasPerm;
  const realCacheGet = window.pbpAiCacheGet;
  const realChrome = window.chrome;
  let requests = 0;
  _pbpDictHasPerm = async () => false;
  window.pbpAiCacheGet = async () => null;
  window.chrome = { permissions: { request: async () => { requests++; return false; } } };
  try {
    const slot = document.createElement("div");
    await _pbpDictSlotRun(slot, "word", "en", null, Promise.resolve("-"), () => {});
    const button = slot.querySelector(".xp-dict-connect");
    assert(button?.textContent === "dictConnect" && slot.textContent.includes("dictConnectHint"),
      "production permission gate explains the online dictionary before requesting access");
    button.click();
    await new Promise((resolve) => setTimeout(resolve, 0));
    const feedback = slot.querySelector('[role="status"]');
    assert(feedback && !feedback.hidden && feedback.textContent === "dictPermissionDenied" &&
      button.textContent === "dictConnectRetry" && !button.disabled,
      "permission denial is visible, announced, and leaves a retry action enabled");
    button.click();
    await new Promise((resolve) => setTimeout(resolve, 0));
    assert(requests === 2 && !button.disabled, "denied permission can be retried through the same production action");
  } finally {
    _pbpDictHasPerm = realPerm;
    if (realCacheGet === undefined) delete window.pbpAiCacheGet; else window.pbpAiCacheGet = realCacheGet;
    if (realChrome === undefined) delete window.chrome; else window.chrome = realChrome;
  }
}

async function runDictNoAiAndSavedStateTests() {
  section("dictionary existing-vocabulary state without automatic AI");
  const realResolveLang = _pbpDictResolveLang;
  const realSlotRun = _pbpDictSlotRun;
  const realVocabGet = pbpVocabGet;
  const realSetStatus = pbpVocabBatchSetStatus;
  const previousOwner = _pbpDictOwner;
  _pbpDictResolveLang = async () => "en";
  _pbpDictSlotRun = async () => pbpDictNormalizeEntry(FDA_SAMPLE);
  _pbpDictOwner = "acct_a";
  // The gloss and IPA a "hello" lookup in the sentence "hello" saves -- the
  // context-ordered first entry, exactly what pbpDictRun writes into cur.
  const ordered = pbpDictOrderForContext(pbpDictNormalizeEntry(FDA_SAMPLE).entries, "hello");
  const sameGloss = ordered[0].senses[0].definition;
  const writes = [];
  pbpVocabBatchSetStatus = async (ids, owner, status) => { writes.push([ids.join(","), owner, status]); return true; };
  // Production shell order (md-ask.js): status control, then the vocab button.
  const shell = '<div class="xp-body"></div>' +
    '<div class="view-toggle xp-vocab-status" role="group" aria-label="dictSavedVocab" hidden>' +
    '<button type="button" class="toggle-btn" data-status="new" aria-pressed="false">vocabStatusLearning</button>' +
    '<button type="button" class="toggle-btn" data-status="known" aria-pressed="false">vocabStatusKnown</button></div>' +
    '<button class="xp-vocab"></button><button class="xp-open-vocab" hidden></button>';
  const pressedOf = (pop) => [...pop.querySelectorAll(".xp-vocab-status .toggle-btn")]
    .map((b) => b.dataset.status + "=" + b.getAttribute("aria-pressed") + (b.classList.contains("active") ? "+active" : "")).join(" ");
  try {
    const pop = document.createElement("div");
    pop.innerHTML = shell;
    document.body.appendChild(pop);
    const status = pop.querySelector(".xp-vocab-status");
    const button = pop.querySelector(".xp-vocab");

    // 1. Saved, and this lookup adds nothing: the control alone.
    pbpVocabGet = async () => ({ id: "acct_a|en|hello", status: "new", gloss: sameGloss, ipa: "x", lemma: "hello",
      contexts: [{ quote: "hello", articleUrl: "https://example.com/" }] });
    await pbpDictRun({ text: "hello" }, { sentence: "hello" }, pop, new AbortController(), {});
    assert(status.hidden === false && pressedOf(pop) === "new=true+active known=false",
      "a saved learning word shows Learning | Known with Learning pressed: " + pressedOf(pop));
    assert(button.hidden === true,
      "a saved word whose lookup adds nothing hides the save/update button (the control is the state)");
    assert(pop.querySelector(".xp-open-vocab").hidden === false, "a saved word offers the jump to the vocabulary page");
    assert(!/[\u2713\u2714\u2705]/.test(pop.textContent), "no literal tick text anywhere in the footer");

    // 2. Pressing the pressed segment writes nothing; pressing the other one
    // writes through pbpVocabBatchSetStatus and moves the pressed state.
    status.querySelector('[data-status="new"]').click();
    await new Promise((r) => setTimeout(r, 0));
    assert(writes.length === 0, "pressing the current state is a no-op");
    status.querySelector('[data-status="known"]').click();
    await new Promise((r) => setTimeout(r, 0));
    assert(writes.length === 1 && writes[0].join("|") === "acct_a|en|hello|acct_a|known",
      "Known writes status=known for this record and owner: " + JSON.stringify(writes));
    assert(pressedOf(pop) === "new=false known=true+active", "after the write Known is pressed: " + pressedOf(pop));
    status.querySelector('[data-status="new"]').click();
    await new Promise((r) => setTimeout(r, 0));
    assert(writes.length === 2 && writes[1][2] === "new" && pressedOf(pop) === "new=true+active known=false",
      "Learning writes status=new back (the unmaster path) and re-presses Learning");

    // 3. A refused write keeps the pressed segment where it was.
    pbpVocabBatchSetStatus = async () => false;
    status.querySelector('[data-status="known"]').click();
    await new Promise((r) => setTimeout(r, 0));
    assert(pressedOf(pop) === "new=true+active known=false" && status.classList.contains("xp-flash-fail"),
      "a failed status write leaves Learning pressed and pulses the control");
    pbpVocabBatchSetStatus = async (ids, owner, st) => { writes.push([ids.join(","), owner, st]); return true; };

    // 4. Owner switch after render: the control refuses, nothing is written.
    _pbpDictOwner = "acct_b";
    status.classList.remove("xp-flash-fail");
    status.querySelector('[data-status="known"]').click();
    await new Promise((r) => setTimeout(r, 0));
    assert(writes.length === 2 && status.classList.contains("xp-flash-fail"),
      "a status press after an account switch is refused and writes nothing");
    _pbpDictOwner = "acct_a";

    // 5. Saved as known, met in a NEW sentence: Known pressed, and the
    // labeled Update stays reachable (re-saving would add this context).
    pbpVocabGet = async () => ({ id: "acct_a|en|hello", status: "known", gloss: sameGloss, ipa: "x", lemma: "hello",
      contexts: [{ quote: "an older sentence", articleUrl: "https://example.com/" }] });
    await pbpDictRun({ text: "hello" }, { sentence: "hello" }, pop, new AbortController(), {});
    assert(pressedOf(pop) === "new=false known=true+active", "a saved known word shows Known pressed");
    assert(button.hidden === false && !button.disabled && button.textContent === "dictUpdateVocab",
      "a lookup that would add to the saved record keeps an enabled Update action");

    // 6. A different gloss alone also re-offers Update.
    pbpVocabGet = async () => ({ id: "acct_a|en|hello", status: "new", gloss: "an older gloss", ipa: "x", lemma: "hello",
      contexts: [{ quote: "hello", articleUrl: "https://example.com/" }] });
    await pbpDictRun({ text: "hello" }, { sentence: "hello" }, pop, new AbortController(), {});
    assert(button.hidden === false && button.textContent === "dictUpdateVocab", "a changed gloss re-offers Update");

    // 7. Unsaved word: the control goes, the save action stays.
    pbpVocabGet = async () => null;
    await pbpDictRun({ text: "fresh" }, { sentence: "fresh" }, pop, new AbortController(), {});
    assert(status.hidden === true && status.onclick === null,
      "the next lookup of an unsaved word drops the Learning | Known control and its handler");
    assert(button.hidden === false && !button.disabled && button.textContent === "dictSaveVocab",
      "an unsaved word keeps the labeled save action");

    // 8. After a save, md-ask asks for the saved face: the control appears
    // for the record just written, Learning pressed.
    _pbpDictCurrent.savedRecord = { id: "acct_a|en|fresh", status: "new" };
    assert(window.pbpDictShowSavedFace(pop) === true && status.hidden === false &&
      pressedOf(pop) === "new=true+active known=false", "a fresh save switches the footer to Learning | Known");
    pop.remove();
  } finally {
    _pbpDictResolveLang = realResolveLang;
    _pbpDictSlotRun = realSlotRun;
    pbpVocabGet = realVocabGet;
    pbpVocabBatchSetStatus = realSetStatus;
    _pbpDictOwner = previousOwner;
  }
}

async function runVocabIdbTests() {
  section("pbp-vocab IDB (runtime)");
  await new Promise((r) => { const del = indexedDB.deleteDatabase("pbp-vocab"); del.onsuccess = del.onerror = del.onblocked = r; });
  const legacyWord = {
    id: "acct_legacy|en|migrate", owner: "acct_legacy", term: "Migrate", language: "en",
    gloss: "legacy gloss", contexts: [], groups: [], note: "", status: "new", createdAt: 1, updatedAt: 1
  };
  await new Promise((resolve, reject) => {
    const req = indexedDB.open("pbp-vocab", 1);
    req.onupgradeneeded = () => {
      const store = req.result.createObjectStore("words", { keyPath: "id" });
      store.createIndex("owner", "owner", { unique: false });
      store.createIndex("updatedAt", "updatedAt", { unique: false });
      store.put(legacyWord);
    };
    req.onsuccess = () => { req.result.close(); resolve(); };
    req.onerror = () => reject(req.error);
  });
  _pbpVocabDbPromise = null;
  const db = await _pbpVocabOpenDB();
  assertEq(db.version, 2, "pbp-vocab migrates to version 2");
  assert(db.objectStoreNames.contains("sync"), "version 2 adds the sync store");
  const legacyRead = await pbpVocabGet(legacyWord.id);
  assert(legacyRead && legacyRead.gloss === legacyWord.gloss,
    "v2 migration preserves and reads the v1 word record");
  const ctx1 = { quote: "q1", articleUrl: "https://u1.test/", articleTitle: "t1", highlightId: null, createdAt: 1 };
  const e1 = await pbpVocabSaveWord("acct_a", { term: "Running", language: "en-US", gloss: "g1", ipa: "", sourceUrl: "https://en.wiktionary.org/wiki/run", license: "CC BY-SA 4.0", context: ctx1 });
  assert(e1 && e1.id === "acct_a|en|running", "save creates owner-scoped id");
  assert(Array.isArray(e1.groups) && e1.groups.length === 0, "new vocab records default to an empty groups array");
  assertEq(e1 && e1.sourceUrl, "https://en.wiktionary.org/wiki/run", "attribution saved WITHOUT ipa (independent merge)");
  const e2 = await pbpVocabSaveWord("acct_a", { term: "running", language: "en", gloss: "g2", context: { ...ctx1 } });
  assertEq(e2.contexts.length, 1, "same url+quote deduped");
  assertEq(e2.gloss, "g2", "latest gloss wins");
  // A re-save carrying NEW attribution (e.g. a re-lookup that landed on
  // CC-CEDICT instead of Wiktionary) must overwrite BOTH sourceUrl and
  // license as a pair, not just fill them when empty -- otherwise the old
  // Wiktionary line survives into a CC-CEDICT-attributed export.
  const e2b = await pbpVocabSaveWord("acct_a", { term: "running", language: "en", gloss: "g2", sourceUrl: "https://cc-cedict.org/wiki/", license: "CC BY-SA 4.0 (CC-CEDICT)", context: { ...ctx1 } });
  assertEq(e2b.sourceUrl, "https://cc-cedict.org/wiki/", "re-save overwrites sourceUrl with the latest lookup's attribution");
  assertEq(e2b.license, "CC BY-SA 4.0 (CC-CEDICT)", "re-save overwrites license with the latest lookup's attribution");
  const e2c = await pbpVocabSaveWord("acct_a", { term: "running", language: "en", gloss: "g2", license: "MIT", context: { ...ctx1 } });
  assert(e2c.license === "MIT" && e2c.sourceUrl === null, "one-sided attribution nulls the other side (no mixed attribution)");
  const e3 = await pbpVocabSaveWord("acct_a", { term: "running", language: "en", gloss: "", context: { ...ctx1, articleUrl: "https://u2.test/" } });
  assertEq(e3.contexts.length, 2, "second article context appended");
  const got = await pbpVocabGet("acct_a|en|running");
  assert(got && got.contexts.length === 2 && got.gloss === "g2", "pbpVocabGet returns the merged record by id");
  assertEq(await pbpVocabGet("acct_a|en|missing"), null, "pbpVocabGet miss resolves null");
  await pbpVocabSaveWord("acct_b", { term: "running", language: "en", gloss: "other-account", context: ctx1 });
  const aRows = await pbpVocabAll("acct_a");
  const bRows = await pbpVocabAll("acct_b");
  assertEq(aRows.length, 1, "owner filter: acct_a sees 1");
  assertEq(bRows.length, 1, "owner filter: acct_b sees 1");
  assert(aRows[0].gloss !== "other-account", "no cross-account leak");
  await new Promise((r) => setTimeout(r, 5)); // Date.now() must differ for the sort assertion
  await pbpVocabSaveWord("acct_a", { term: "walk", language: "en", gloss: "gw", context: ctx1 });
  const sorted = await pbpVocabAll("acct_a");
  assertEq(sorted.length, 2, "second word saved for sort check");
  assertEq(sorted[0].term, "walk", "pbpVocabAll sorts newest updatedAt first");
  assert(await pbpVocabDelete("acct_a|en|walk", "acct_a"), "cleanup sort-check word");
  assertEq(await pbpVocabDelete("acct_a|en|ghost", "acct_a"), true, "delete of a missing id is idempotent-true (UI treats it as done)");
  const badDel = await pbpVocabDelete(aRows[0].id, "acct_wrong");
  assert(badDel === false, "delete with wrong owner resolves false");
  assertEq((await pbpVocabAll("acct_a")).length, 1, "wrong-owner delete leaves the record in place");
  const okDel = await pbpVocabDelete(aRows[0].id, "acct_a");
  assert(okDel === true, "delete resolves true on tx complete");
  assertEq((await pbpVocabAll("acct_a")).length, 0, "deleted row gone");
  assertEq((await pbpVocabAll("acct_b")).length, 1, "other owner untouched");

  await pbpVocabSaveWord("acct_a", { term: "alpha", language: "en", gloss: "ga", context: ctx1 });
  await pbpVocabSaveWord("acct_a", { term: "beta", language: "en", gloss: "gb", context: ctx1 });
  const groupIds = (await pbpVocabAll("acct_a")).map((row) => row.id);
  const otherId = (await pbpVocabAll("acct_b"))[0].id;
  assertEq(pbpVocabNormalizeGroupName("  Study   List  "), "Study List", "group names NFC-trim and collapse whitespace");
  assertEq(pbpVocabGroups({ groups: undefined }).length, 0, "legacy record without groups reads as an empty array");
  assert(await pbpVocabBatchAddGroup(groupIds, "acct_a", " Study   List "), "batch add-group resolves true on transaction completion");
  assert((await pbpVocabAll("acct_a")).every((row) => row.groups.includes("Study List")), "batch add-group updates every selected owner record");
  assert(await pbpVocabBatchAddGroup(groupIds, "acct_a", "Study List"), "adding an existing group is idempotent-success");
  assert((await pbpVocabAll("acct_a")).every((row) => row.groups.filter((g) => g === "Study List").length === 1), "batch add-group never duplicates a group name");
  assertEq(await pbpVocabBatchAddGroup([groupIds[0], otherId], "acct_a", "Wrong"), false, "cross-owner batch add aborts");
  assert(!(await pbpVocabAll("acct_a")).some((row) => row.groups.includes("Wrong")), "aborted add-group leaves every owner record unchanged");
  assertEq(await pbpVocabBatchDelete([groupIds[0], otherId], "acct_a"), false, "cross-owner batch delete aborts");
  assertEq((await pbpVocabAll("acct_a")).length, 2, "aborted batch delete leaves all selected owner records");
  assert(await pbpVocabBatchDelete(groupIds, "acct_a"), "same-owner batch delete resolves true on transaction completion");
  assertEq((await pbpVocabAll("acct_a")).length, 0, "same-owner batch delete removes the complete selection");
  assertEq((await pbpVocabAll("acct_b")).length, 1, "batch mutations never touch the other owner");
}
// Integration-level ladder tests: the REAL _pbpDictResolveLang against a
// scripted chrome.i18n.detectLanguage and a real #rendered-view fixture.
// Every other runtime suite stubs the resolver out, so without this section
// the ladder itself (explicit metadata, script rung, acceptability gate,
// Latin fallback wiring) has no regression protection.
async function runDictResolveLangLadderTests() {
  section("_pbpDictResolveLang ladder (integration, scripted CLD)");
  const realChrome = window.chrome;
  let calls = [];
  let script = {};
  let longTextFixture = null; // stands in for the >=100-char article sample
  window.chrome = { i18n: { detectLanguage: (text, cb) => {
    calls.push(text);
    const hit = script[text] || (text.length >= 100 ? longTextFixture : null);
    cb(hit ? { isReliable: hit.reliable, languages: [{ language: hit.lang, percentage: 100 }] }
           : { isReliable: false, languages: [] });
  } } };
  const view = document.createElement("div");
  view.id = "rendered-view";
  document.body.appendChild(view);
  try {
    calls = [];
    assertEq(await _pbpDictResolveLang({ text: "转换" }, { selLang: "zh-CN", sentence: "转换数据" }, ""), "zh",
      "explicit translation metadata routes without detection");
    assertEq(calls.length, 0, "explicit metadata short-circuits CLD entirely");
    script = { "iPhone 很好用": { lang: "zh", reliable: true } };
    assertEq(await _pbpDictResolveLang({ text: "iPhone" }, { selLang: "zh", sentence: "iPhone 很好用", blockText: "" }, ""), "en",
      "a Latin brand inside a zh translation block falls through the gate to en");
    script = { "这个 Converts 函数把 A 变成 B": { lang: "zh", reliable: true } };
    assertEq(await _pbpDictResolveLang({ text: "Converts" }, { sentence: "这个 Converts 函数把 A 变成 B", blockText: "" }, ""), "en",
      "a reliable zh read on the surrounding sentence cannot hijack a Latin selection");
    script = { "kaikki sanat ovat täällä": { lang: "fi", reliable: true } };
    assertEq(await _pbpDictResolveLang({ text: "sana" }, { sentence: "kaikki sanat ovat täällä", blockText: "" }, ""), "en",
      "a confident detection outside the query set no longer leaks a request");
    calls = [];
    assertEq(await _pbpDictResolveLang({ text: "привет" }, { sentence: "привет мир", blockText: "" }, ""), "ru",
      "Cyrillic routes ru from the script rung");
    assertEq(calls.length, 0, "the script rung never spends a CLD call");
    view.setAttribute("lang", "ja");
    assertEq(await _pbpDictResolveLang({ text: "東京" }, { sentence: "東京 is a city", blockText: "" }, ""), "ja",
      "kanji-only selection inside a ja article keeps the ja correction");
    view.removeAttribute("lang");
    script = { "Converts wiktionary data from kaikki.": { lang: "en", reliable: false } };
    assertEq(await _pbpDictResolveLang({ text: "Converts" }, { sentence: "Converts wiktionary data from kaikki.", blockText: "" }, ""), "en",
      "the original bug: unreliable en on a jargon sentence still reaches en");
    script = { "żółć w ustach": { lang: "pl", reliable: false } };
    assertEq(await _pbpDictResolveLang({ text: "żółć" }, { sentence: "żółć w ustach", blockText: "" }, ""), "pl",
      "extended-Latin Polish rides its unreliable candidate to pl");
    calls = [];
    assertEq(await _pbpDictResolveLang({ text: "Converts" }, { selLang: "zh", sentence: "x" }, "fr"), "fr",
      "manual choice outranks every automatic rung");
    assertEq(calls.length, 0, "manual choice spends no CLD call");
    assertEq(await _pbpDictResolveLang({ text: "→▲" }, { sentence: "→▲", blockText: "" }, ""), "",
      "letterless selections stay unknown instead of guessing");
    // Article prior (batch B): a reliable full-prose read fills in where the
    // local context is too short to decide.
    const dePara = document.createElement("p");
    dePara.textContent = "Der Bahnhof liegt mitten in der Stadt und wurde vor über hundert Jahren gebaut. "
      + "Viele Reisende steigen hier täglich um, denn die Strecke verbindet den Norden mit dem Süden.";
    view.appendChild(dePara);
    _pbpDictArticlePrior = null;
    script = {};
    longTextFixture = { lang: "de", reliable: true };
    assertEq(await _pbpDictResolveLang({ text: "Bahnhof" }, { sentence: "Bahnhof", blockText: "" }, ""), "de",
      "a reliable article prior routes a lone Latin word the local rungs could not");
    const longCallsBefore = calls.filter((c) => c.length >= 100).length;
    await _pbpDictResolveLang({ text: "Reisende" }, { sentence: "Reisende", blockText: "" }, "");
    assertEq(calls.filter((c) => c.length >= 100).length, longCallsBefore,
      "the article prior is detected once per document, then cached");
    assertEq(await _pbpDictResolveLang({ text: "привет" }, { sentence: "привет", blockText: "" }, ""), "ru",
      "the script rung still outranks the article prior");
    document.dispatchEvent(new CustomEvent("pbp:rendered", { detail: { account: "" } }));
    view.replaceChildren();
    assertEq(await _pbpDictResolveLang({ text: "Bahnhof" }, { sentence: "Bahnhof", blockText: "" }, ""), "en",
      "pbp:rendered resets the prior; a near-empty document abstains and falls to en");
    dePara.className = "pb-tr";
    view.appendChild(dePara);
    _pbpDictArticlePrior = null;
    assertEq(await _pbpDictResolveLang({ text: "Bahnhof" }, { sentence: "Bahnhof", blockText: "" }, ""), "en",
      "translation overlays are excluded from the article sample");
    // Nested code inside a wrapper block must not feed the prior either
    // (Codex review MEDIUM 2): wrapper textContent alone would sample it.
    view.replaceChildren();
    const wrap = document.createElement("div");
    const pre = document.createElement("pre");
    pre.textContent = "const x = 1; ".repeat(30);
    const p = document.createElement("p");
    p.textContent = "kurz";
    wrap.appendChild(pre); wrap.appendChild(p);
    view.appendChild(wrap);
    _pbpDictArticlePrior = null;
    assertEq(await _pbpDictResolveLang({ text: "Bahnhof" }, { sentence: "Bahnhof", blockText: "" }, ""), "en",
      "nested PRE is scrubbed from the sample; what remains is too short to be a prior");
    // Non-Russian Cyrillic ends honest-unknown (Codex review MEDIUM 1)
    script = { "їжа смачна": { lang: "uk", reliable: true } };
    assertEq(await _pbpDictResolveLang({ text: "їжа" }, { sentence: "їжа смачна", blockText: "" }, ""), "",
      "Ukrainian stays unknown: script rung abstains and the gate blocks the uk detection");
    // Unknown language renders its own message and never queries
    const unknownSlot = document.createElement("div");
    await _pbpDictSlotRun(unknownSlot, "word", "", null, Promise.resolve(""), null, "");
    assert(unknownSlot.textContent.includes("dictLangUnknown"),
      "unknown language renders dictLangUnknown, not a dictionary miss");
  } finally {
    if (realChrome === undefined) delete window.chrome; else window.chrome = realChrome;
    view.remove();
  }
}

// Regression cases from the multilingual vocabulary review. These exercise
// the renderer/lookup/scanner consumers, not a second copy of their rules.
async function runDictReviewRegressionTests() {
  section("cached form-of entries follow the same lemma chain as cold entries");
  const savedPerm = _pbpDictHasPerm, savedFetch = _pbpDictFetch;
  const savedGet = window.pbpAiCacheGet, savedSet = window.pbpAiCacheSet;
  const entries = new Map(); const queries = [];
  _pbpDictHasPerm = async () => true;
  window.pbpAiCacheGet = async (key) => entries.has(key) ? { result: entries.get(key) } : null;
  window.pbpAiCacheSet = async (key, value) => { entries.set(key, value); };
  // API-shaped fixtures written by hand: the pointer is tagged in the raw
  // sense, not manufactured by pbpDictNormalizeEntry or a writer helper.
  _pbpDictFetch = async (_lang, term) => {
    queries.push(term);
    return { status: 200, data: term === "aprovecho"
      ? { word: "aprovecho", entries: [{ partOfSpeech: "verb", senses: [{ definition: "first-person singular present indicative of aprovechar", tags: ["form-of"] }] }] }
      : { word: "aprovechar", entries: [{ partOfSpeech: "verb", senses: [{ definition: "to use to one's advantage", examples: ["Aprovecha el tiempo."] }] }] } };
  };
  try {
    const slot = document.createElement("div");
    const cold = await _pbpDictSlotRun(slot, "aprovecho", "es", null, Promise.resolve("aprovechar"), null);
    assertEq(cold?.word, "aprovechar", "cold form-of lookup follows the lemma to a real meaning");
    queries.length = 0;
    const warm = await _pbpDictSlotRun(slot, "aprovecho", "es", null, Promise.resolve("aprovechar"), null);
    assertEq(warm?.word, "aprovechar", "warm form-of lookup still follows the lemma instead of stopping at a grammar pointer");
    assertEq(queries.length, 0, "warm pointer and lemma are both served from cache without extra requests");
    assertEq(slot.querySelector(".xp-dict-senses > li")?.lang, "en", "English Wiktionary definitions are marked English in a Spanish lookup");
    assertEq(slot.querySelector(".xp-dict-example")?.lang, "es", "a Spanish dictionary example retains Spanish instead of inheriting definition language");
    _pbpDictHasPerm = async () => false;
    const offline = await _pbpDictSlotRun(slot, "aprovecho", "es", null, Promise.resolve(""), null);
    assertEq(offline?.word, "aprovecho", "without online permission the cached pointer remains readable");
    assertEq(slot.querySelector(".xp-dict-lemma-link")?.lang, "es", "the lemma link keeps the queried language inside its English pointer");
    const unknown = { word: "word", sourceLabel: "unidentified", entries: [{ pos: "", ipas: [], forms: [], senses: [{ definition: "unidentified text", examples: [] }] }] };
    _pbpDictRenderEntry(slot, unknown, "word", "", "word", "");
    assertEq(slot.querySelector(".xp-dict-senses > li")?.lang, "und", "unidentified dictionary text is not guessed from the interface language");
  } finally {
    _pbpDictHasPerm = savedPerm; _pbpDictFetch = savedFetch;
    if (savedGet === undefined) delete window.pbpAiCacheGet; else window.pbpAiCacheGet = savedGet;
    if (savedSet === undefined) delete window.pbpAiCacheSet; else window.pbpAiCacheSet = savedSet;
  }
}

async function runDictDefinitionLanguageTests() {
  section("dictionary definition language is independent of UI and lookup language");
  for (const [preference, name, lang] of [
    ["zh-Hans", "Simplified Chinese", "zh-Hans"], ["zh-Hant", "Traditional Chinese", "zh-Hant"],
    ["es", "Spanish", "es"], ["pt", "Portuguese", "pt"], ["pt-BR", "Brazilian Portuguese", "pt-BR"],
    ["ar", "Arabic", "ar"], ["Latin", "Latin", "und"], ["en-???", "en-???", "und"]
  ]) {
    const target=pbpDictDefinitionLanguage(preference,"en");
    assertEq(target.name,name,preference+" chooses its own definition language while the interface stays English");
    assertEq(target.lang,lang,preference+" output has accurate language metadata");
  }
  assertEq(pbpDictDefinitionLanguage(" \u0000La\u202etin\n ","en").name,"Latin","custom language names lose control characters before prompt/cache use");
  assertEq(pbpDictDefinitionLanguage("Custom ".repeat(40),"en").name.length,80,"custom definition-language names have a bounded prompt footprint");
  assertEq(pbpDictDefinitionLanguage("","zh-Hant").lang,"zh-Hant","empty preference follows the current interface language");
  assertEq(pbpDictDefinitionLanguage("\u0000\n\u202e","en").name,"English","a preference emptied by sanitation follows the interface language");
  assertEq(pbpDictDefinitionLanguage({language:"es"},"en").name,"English","a malformed non-string setting never leaks object text to the prompt");
  assertEq(pbpDictLearningTarget({dictLearnerNativeLanguage:"English"},"zh-Hans").lang,"en","native language controls the default explanation language independently of UI");
  assertEq(pbpDictLearningTarget({dictLearnerNativeLanguage:"中文"},"zh-Hant").lang,"zh-Hant","generic native language preserves the existing UI language variant and paid lookup identity");
  assertEq(pbpDictLearningTarget({dictLearnerNativeLanguage:"简体中文"},"zh-Hant").lang,"zh-Hans","an explicitly specified native script is respected");
  assertEq(pbpDictLearningTarget({dictDefinitionLang:"English",dictLearnerNativeLanguage:"中文"},"de").lang,"und","explicit legacy language names retain their saved archive identity");
  assertEq(pbpDictLearningTarget({dictDefinitionLang:"es",dictLearnerNativeLanguage:"中文"},"de").lang,"es","explicit explanation language wins over native language");
  assertEq(pbpDictLearningTarget({dictDefinitionLang:"  ",dictLearnerNativeLanguage:"Deutsch"},"en").lang,"de","blank explicit setting still follows the native-language default");
  assertEq(pbpDictKnownLanguageName("constructor"),"","inherited property names are not recognized languages");
}

async function runEchoLanguageAndInlineTests() {
  section("vocabulary echo respects language and complete inline words");
  const saved = { owner: _echoOwner, enabled: _echoEnabled, epoch: _echoEpoch, terms: _echoTerms,
    articleLang: _echoArticleLang, languageCache: _echoLanguageCache };
  const oldView = document.getElementById("rendered-view"); oldView?.remove();
  const view = document.createElement("div"); view.id = "rendered-view";
  const block = document.createElement("div"); block.dataset.pb = "1"; view.appendChild(block); document.body.appendChild(view);
  const oldBlock = window.pbpAiBlockEl, oldDetect = _pbpDictDetect;
  window.pbpAiBlockEl = () => block;
  _pbpDictDetect = async () => ({ lang: "en", reliable: false });
  _echoOwner = "acct_review"; _echoEnabled = true; _echoEpoch++;
  _echoArticleLang = ""; _echoLanguageCache = new WeakMap();
  const scan = async (html, lang, rows) => {
    _echoClearAll(); view.lang = lang; block.innerHTML = html;
    _echoTerms = pbpEchoTermSet(rows);
    await _echoScanBlock("o1");
    return [..._echoRanges.values()].flat();
  };
  try {
    let hits = await scan("Die Hoffnung ist wichtig.", "de", [{ term: "die", language: "en" }]);
    assertEq(hits.length, 0, "an English saved die never marks a German article as already learned");
    hits = await scan("Die Hoffnung ist wichtig.", "de", [{ term: "die", language: "en" }, { term: "die", language: "de" }]);
    assertEq(hits.length, 1, "same-spelled words in two languages retain separate identities and match the right one");
    assertEq(hits[0]?.language, "de", "the rendered hit keeps its language for the dictionary click");
    const oldCaret = document.caretRangeFromPoint, oldOpen = window.pbpExplainOpenForItem;
    const oldHighlight = window.pbpHlItemIdAtRange;
    let opened = null;
    try {
      window.getSelection().removeAllRanges();
      document.caretRangeFromPoint = () => hits[0].range.cloneRange();
      window.pbpHlItemIdAtRange = () => null;
      window.pbpExplainOpenForItem = (item) => { opened = item; };
      _echoOnClick({ target: block, clientX: 0, clientY: 0, preventDefault() {}, stopPropagation() {} });
      assertEq(opened?.lang, "de", "clicking an echoed homograph forwards the saved language to dictionary lookup");
    } finally {
      document.caretRangeFromPoint = oldCaret;
      if (oldOpen === undefined) delete window.pbpExplainOpenForItem; else window.pbpExplainOpenForItem = oldOpen;
      if (oldHighlight === undefined) delete window.pbpHlItemIdAtRange; else window.pbpHlItemIdAtRange = oldHighlight;
    }
    hits = await scan('die <span lang="en">die</span>', "de", [{ term: "die", language: "en" }]);
    assertEq(hits.map((h) => h.range.startContainer.parentElement.tagName).join(","), "SPAN", "inline language metadata overrides the article language without leaking to adjacent prose");
    hits = await scan("die", "und", [{ term: "die", language: "en" }]);
    assertEq(hits.length, 0, "an unknown block with unreliable detection never inherits the UI language or English fallback");
    hits = await scan("inter<em>net</em>", "en", [{ term: "net", language: "en" }]);
    assertEq(hits.length, 0, "an inline node boundary cannot turn the suffix of internet into the word net");
    hits = await scan("co<em>operate</em>", "en", [{ term: "cooperate", language: "en" }]);
    assertEq(hits.map((h) => h.range.toString()).join(","), "cooperate", "a complete saved word spanning inline text nodes receives one full range");
    hits = await scan("<span>İstanbul</span> <em>DIE</em>", "de", [{ term: "die", language: "de" }]);
    assert(hits.length === 1 && hits[0].range.toString() === "DIE" && hits[0].range.startContainer.parentElement.tagName === "EM",
      "a length-changing case fold elsewhere preserves case-insensitive matching and original DOM offsets");
    hits = await scan("İ <em>ΟΣ</em>", "el", [{ term: "ος", language: "el" }]);
    assertEq(hits[0]?.range.toString(), "ΟΣ", "fold-offset mapping preserves whole-string Greek final-sigma casing");
    hits = await scan("İstanbul <em>DIE</em>", "de", [{ term: "İstanbul", language: "de" }, { term: "die", language: "de" }]);
    assertEq(hits.map((h) => h.range.toString()).join(","), "İstanbul,DIE", "a term whose own fold grows still matches exactly alongside normally folded terms");
    hits = await scan("汉İ", "zh", [{ term: "汉i", language: "zh" }]);
    assertEq(hits.length, 0, "a match cannot end halfway through a character expanded by case folding");
    const joinedAcrossMedia = [];
    for (const media of ["img", "video", "audio", "iframe", "object", "embed", "canvas", "svg", "math", "input", "textarea", "select"]) {
      hits = await scan("co<" + media + "></" + media + ">operate", "en", [{ term: "cooperate", language: "en" }]);

    hits = await scan("<p>co</p><p>operate</p>", "en", [{ term: "cooperate", language: "en" }]);
    assertEq(hits.length, 0, "separate paragraph boundaries never manufacture a complete word");
    hits = await scan('co<code>ignored</code>operate', "en", [{ term: "cooperate", language: "en" }]);
    assertEq(hits.length, 0, "ignored code interrupts prose rather than joining two fragments into a new word");
    hits = await scan('co<span lang="de">operate</span>', "en", [{ term: "cooperate", language: "en" }]);
    assertEq(hits.length, 0, "a match cannot span text in different languages");
    let detections = 0;
    _pbpDictDetect = async () => { detections++; return { lang: "de", reliable: true }; };
    hits = await scan("Die Hoffnung bleibt.", "und", [{ term: "die", language: "de" }]);
    assertEq(hits[0]?.language, "de", "reliable detection supplies a language for otherwise unknown matching prose");
    await _echoScanBlock("o1");

    const timeline = document.createElement("div"); timeline.className = "pbv-col-study";
    timeline.innerHTML = '<div class="pbv-list"><div class="pbv-row" data-i="0"><span class="pbv-text">original</span><span class="pbv-tr" lang="de">Die Hoffnung bleibt.</span></div></div>';
    document.body.appendChild(timeline);
    try {
      _echoClearAll();

      assertEq(_echoTotal, 1, "a German timeline translation receives its saved German-word marker");
      _echoObserve();
      timeline.querySelector(".pbv-tr").lang = "en";
      await new Promise((resolve) => setTimeout(resolve, 0));
      assertEq(_echoTotal, 0, "changing only timeline lang immediately removes the previous language's marker");
      await new Promise((resolve) => setTimeout(resolve, 450));
      assertEq(_echoTotal, 0, "the queued timeline rescan does not restore a marker belonging to another language");
      _echoDisconnect();
      view.lang = "en"; _echoArticleLang = "en";
      const line = timeline.querySelector(".pbv-tr");
      line.removeAttribute("lang");
      _echoTerms = pbpEchoTermSet([{ term: "die", language: "en" }]);
      await _echoScanBlock("rt0");
      assertEq(_echoTotal, 0, "an unlabelled German companion track never borrows the English original-prose prior");
      _echoTerms = pbpEchoTermSet([{ term: "die", language: "en" }, { term: "die", language: "de" }]);
      await _echoScanBlock("rt0");
      assertEq(_echoRanges.get("rt0")?.[0]?.language, "de", "reliable companion-track detection matches the saved German homograph");
      line.lang = "";
      await _echoScanBlock("rt0");
      assertEq(_echoRanges.get("rt0")?.[0]?.language, "de", "empty companion-track lang is undecided and can use reliable block detection");
      line.lang = "und";
      await _echoScanBlock("rt0");
      assertEq(_echoTotal, 0, "explicitly unknown companion-track language remains fail-closed");
      line.removeAttribute("lang"); line.textContent = "die";
      _pbpDictDetect = async () => ({ lang: "de", reliable: false });
      await _echoScanBlock("rt0");
      assertEq(_echoTotal, 0, "unreliable companion-track detection cannot fall back to the original language");
      const translated = document.createElement("div"); translated.className = "pb-tr";
      translated.textContent = "Die Hoffnung bleibt."; block.after(translated);
      try {
        _pbpDictDetect = async () => ({ lang: "de", reliable: true });
        await _echoScanBlock("t1");
        assertEq(_echoRanges.get("t1")?.[0]?.language, "de", "an unlabelled reader translation also blocks its English view's language inheritance");
      } finally { translated.remove(); }
    } finally {
      _echoDisconnect(); _echoClearAll(); timeline.remove();
    }
    _echoClearAll(); view.lang = "und"; _echoArticleLang = ""; block.textContent = "Die Hoffnung ist wichtig.";
    let release = null;
    _pbpDictDetect = () => new Promise((resolve) => { release = resolve; });
    _echoTerms = pbpEchoTermSet([{ term: "die", language: "de" }]);
    const pending = _echoScanBlock("o1");
    await Promise.resolve();
    assert(typeof release === "function", "an unlabelled block waits for a reliable content-language result");
    _echoEpoch++; _echoEnabled = false; _echoClearAll();
    if (release) release({ lang: "de", reliable: true });
    await pending;
    assertEq(_echoTotal, 0, "a late language result cannot repaint after the document scan was invalidated");
  } finally {
    _echoClearAll(); _echoDisconnect(); view.remove(); if (oldView) document.body.appendChild(oldView);
    if (oldBlock === undefined) delete window.pbpAiBlockEl; else window.pbpAiBlockEl = oldBlock;
    _pbpDictDetect = oldDetect;
    _echoOwner = saved.owner; _echoEnabled = saved.enabled; _echoEpoch = saved.epoch; _echoTerms = saved.terms;
    _echoArticleLang = saved.articleLang; _echoLanguageCache = saved.languageCache;
  }
