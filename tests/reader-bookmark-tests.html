// The bookmarkDraft objects the popup writes into a preview slot: the normal
// preview's literal and the pending (embedded-frame) preview's one line,
// evaluated with the popup's form fields and the notes / summary range it
// reads just before writing the slot.
async function popupPreviewDrafts() {
  const source = await (await fetch("../popup.js")).text();
  // The bookmarkDraft object literal last written inside one slot write.
  const draftIn = (region, label) => {
    const objectAt = region.lastIndexOf("bookmarkDraft: {");
    assert(objectAt >= 0, label + " preview has no bookmark draft");
    const opening = region.indexOf("{", objectAt);
    let depth = 0, closing = -1;
    for (let i = opening; i < region.length; i++) {
      if (region[i] === "{") depth++;
      else if (region[i] === "}" && --depth === 0) { closing = i; break; }
    }
    assert(closing > opening, label + " draft object did not close");
    return region.slice(opening, closing + 1);
  };
  const opener = source.slice(source.indexOf("const openPreview"), source.indexOf("const downloadMd"));
  const pendingAt = source.indexOf("pending: true, engine, source: engine");
  assert(pendingAt >= 0, "pending preview slot not found");
  const pendingSlot = source.slice(pendingAt, source.indexOf("await chrome.tabs.create", pendingAt));
  // The popup's reader handoff helper, run on the given form, settings and
  // cleaning settings (popup.js pbpPopupReaderHandoff).
  const handoffAt = source.indexOf("function pbpPopupReaderHandoff(");
  assert(handoffAt >= 0, "popup has no reader handoff helper");
  const readerHandoff = ($id, settings, urlClean) => new Function("$id", "settings", "pbpBookmarkServiceId", "pbpBookmarkLookupUrl", "_loadUrlCleanSettings",
    source.slice(handoffAt, source.indexOf("\n}\n", handoffAt) + 2) + "\nreturn pbpPopupReaderHandoff;")($id, settings, pbpBookmarkServiceId, pbpBookmarkLookupUrl, () => urlClean);
  const normalDraft = new Function("$id", "settings", "currentTags", "pbpBookmarkServiceId", "pbpBookmarkFormatTags", "result", "_linkdingSharedExplicit",
    "handoffNotes", "handoffSummaryRange", "pbpPopupDescriptionKnown", "handoff", "return (" + draftIn(opener, "normal") + ");");
  const pendingDraft = new Function("$id", "settings", "pbpBookmarkServiceId", "_linkdingSharedExplicit",
    "handoffNotes", "handoffSummaryRange", "pbpPopupDescriptionKnown", "handoff", "return (" + draftIn(pendingSlot, "pending") + ");");
  const handoffFor = ($id, settings) => readerHandoff($id, settings, SETTINGS_DEFAULTS.urlClean)(URL_ARTICLE, { incognito: false });
  const normal = ($id, settings, ...rest) => normalDraft($id, settings, ...rest, handoffFor($id, settings));
  const pending = ($id, settings, ...rest) => pendingDraft($id, settings, ...rest, handoffFor($id, settings));
  // The popup's own answer to "can I vouch for the Description box?".
  const knownAt = source.indexOf("function pbpPopupDescriptionKnown(");
  assert(knownAt >= 0, "popup has no Description provenance helper");
  const describedBy = (known, $id) => new Function("_linkdingDescriptionKnown", "$id",
    source.slice(knownAt, source.indexOf("\n}\n", knownAt) + 2) + "\nreturn pbpPopupDescriptionKnown;")(known, $id);
  const helperAt = source.indexOf("function pbpPopupHandoffSummaryRange(");
  assert(helperAt >= 0, "popup has no handoff summary range helper");
  const handoffRange = (snapshot) => new Function("pbpAiSummaryOwnershipSnapshot",
    source.slice(helperAt, source.indexOf("\n}\n", helperAt) + 2) + "\nreturn pbpPopupHandoffSummaryRange;")(snapshot);
  // The page address each popup handoff passes pbpPopupReaderHandoff, read
  // from the call itself and evaluated against the given extraction result,
  // url-input value and tab.
  const handoffArgIn = (region, label) => {
    const call = region.match(/const handoff = pbpPopupReaderHandoff\(([^;]*)\);/);
    assert(call, label + " preview builds no reader handoff");
    return (result, url, tab) => new Function("result", "url", "tab", "pbpPopupReaderHandoff", call[0] + "\nreturn handoff;")(result, url, tab, pageUrl => pageUrl);
  };
  const handoffPage = { normal: handoffArgIn(opener, "normal"),
    pending: handoffArgIn(source.slice(source.lastIndexOf("typeof result.frameOrigin", pendingAt), pendingAt), "pending") };
  return { normal, pending, handoffRange, describedBy, readerHandoff, handoffPage };
}

// A reader runtime over the pipeline harness h, with the worker's
// PBP_READER_BOOKMARK_COMMAND listener captured: the global quick-save and
// read-later shortcuts reach the reader through it.
async function tagFixReader(h, account, bookmarkDraft) {
  runtime ||= await (await fetch("../md-bookmark.js")).text();
  const frame = document.createElement("iframe"); document.body.append(frame);
  const w = frame.contentWindow, pending = [], listeners = [];
  w.document.body.innerHTML = '<aside id="action-rail"><div class="rail-badges"></div></aside><div id="rendered-view"></div>';
  w.chrome = { runtime: { id: "test-id", getURL: p => "chrome-extension://test-id/" + p,
    sendMessage: msg => { const request = h.pbpReaderBookmarkRequest(msg, SENDER); pending.push(request); return request; },
    onMessage: { addListener: fn => listeners.push(fn) } } };
  w.eval(await (await fetch("../shared.js")).text());
  w.t = (k, ...args) => args.length ? k + ":" + args.join(":") : k; w.eval(runtime);
  w.document.dispatchEvent(new w.CustomEvent("pbp:rendered", { detail: { url: URL_ARTICLE, title: "Article", account, bookmark: { tags: [], notes: "", draft: bookmarkDraft } } }));
  await settle(pending);
  const command = async action => {
    let answered = null;
    for (const fn of listeners) fn({ type: "PBP_READER_BOOKMARK_COMMAND", action }, { id: "test-id" }, value => { answered = value; });
    await settle(pending);
    assert(answered?.ok === true, action + ": the reader did not take the command");
  };
  const el = name => w.document.getElementById("reader-bookmark-" + name);
  return { w, frame, pending, command, el };
}

// A reader edit reads the bookmark only to keep its other fields through this

  const account = "linkding:https://links.example/:conn-1";
  for (const [label, typed, expected] of [["left alone", undefined, "Changed\n\n  in another client"], ["changed", "Mine\nnow", "Mine now"]]) {

      notes: "Server notes", is_archived: false, unread: false, shared: false, tag_names: ["server"],
      date_added: "2026-10-30T03:01:22.656384Z", date_modified: "2026-10-30T03:01:22.656384Z" });
    const h = await pipelineHarness({ account, token: "linkding-token", service: "linkding", slot: { account }, client: server.client,
      settings: { bookmarkService: "linkding" } });
    server.failures.push({ method: "PATCH", path: "/api/bookmarks/7/", skip: 0 });
    // md-bookmark.js sends a Description only when the reader's line changed.
    const result = await h.pbpReaderBookmarkRequest({ type: "mdReaderBookmarkSave", account, action: "edit",
      draft: { title: "Edited title", tags: "server", notes: "Server notes", private: true, toread: false, ...(typed === undefined ? {} : { summary: typed }) } }, SENDER);
    equal(result.status, "queued"); equal(h.env.queue.length, 1);

    assert(Object.hasOwn(stored, "summary") === (typed !== undefined) && (typed === undefined || stored.summary === expected),

    server.row.description = "Changed\n\n  in another client";
    await h.processOfflineQueue();

    const patches = server.requests.filter(request => request.method === "PATCH");
    equal(patches.length, 2);
    assert(Object.hasOwn(patches[1].body, "description") === (typed !== undefined), label + ": the replay sent Description " + JSON.stringify(patches[1].body.description));
    equal(server.row.title, "Edited title"); equal(server.row.description, expected);
  }
});
// Read Later on a bookmark already on the read-later list, or Save (mark as
// read) on one already read elsewhere: the action's own lookup just found the
// bookmark in the requested state, so there is nothing to deliver. The reader
// finishes as a delivered skip would (saved, status cache and icon updated)
// without a second lookup or any write, and never queues: a queued skip
// replayed after the bookmark was deleted elsewhere would rebuild it from the
// popup draft, against what the user asked for. Here the request after the
// action's lookup fails, as an outage would make a delivery's own lookup fail.
await test("a reader action that finds the bookmark already in its state finishes without delivering or queueing", async () => {
  for (const service of ["pinboard", "karakeep", "linkding"]) for (const action of ["later", "read"]) {
    const where = service + " " + action, toread = action === "later";
    const account = service === "pinboard" ? "alice" : service === "linkding" ? "linkding:https://links.example/:conn-1" : "karakeep:https://keep.example/:user-1";
    const draft = { title: "Popup title", tags: "draft", notes: "Popup notes", private: false, toread: true };
    const readLater = service === "karakeep" ? { members: new Set() } : null;
    const server = service === "linkding" ? selfHostedServer("linkding", { id: 7, url: URL_ARTICLE, title: "Server title", description: "", notes: "Server notes",
        is_archived: false, unread: true, shared: false, tag_names: ["server"], date_added: "2026-10-30T03:01:22.656384Z", date_modified: "2026-10-30T03:01:22.656384Z" })
      : service === "karakeep" ? selfHostedServer("karakeep", { id: "kk1bookmark", createdAt: "2026-10-30T03:05:10.000Z", modifiedAt: "2026-10-30T03:05:10.000Z",
        title: "Server title", archived: false, favourited: false, note: "Server notes", summary: null, source: "web",
        taggingStatus: "success", summarizationStatus: "success", tags: [{ id: "tagserver01", name: "server", attachedBy: "human" }],
        content: { type: "link", url: URL_ARTICLE, title: "Example Domain", description: null }, assets: [] }, { readLater })
      : null;
    if (readLater) readLater.members.add("kk1bookmark");
    let lookups = 0, failAfter = Infinity;
    const h = await pipelineHarness({ account, token: service === "pinboard" ? "alice:token" : service + "-token", service, slot: { account, bookmarkDraft: draft },
      ...(server ? { client: server.client } : {}), settings: { bookmarkService: service },
      post: { ...POST, toread: "yes" }, onLookup: () => { if (++lookups > failAfter) throw new TypeError("Failed to fetch"); } });
    const r = await tagFixReader(h, account, draft);
    try {
      // The bookmark reaches the requested state elsewhere: marked read for Save.
      if (action === "read") {
        if (service === "pinboard") h.env.post.toread = "no";
        else if (service === "linkding") server.row.unread = false;
        else readLater.members.delete("kk1bookmark");
      }
      // The action's own lookup gets through; every request after it fails.
      failAfter = lookups + 1;
      if (server) {
        const path = service === "linkding" ? "/api/bookmarks/check/" : "/api/v1/bookmarks/check-url";
        server.failures.push({ method: "GET", path, skip: 1 });
      }
      const writesBefore = server ? server.requests.filter(q => q.method !== "GET").length : 0;
      const cacheBefore = (h.env.cacheWrites || []).length;
      await r.command(action === "later" ? "later" : "save");
      equal(r.el("status").textContent, "readerBookmarkSaved");
      equal(JSON.stringify(h.env.queue), "[]");
      if (server) equal(server.requests.filter(q => q.method !== "GET").length, writesBefore);
      else assert(!h.env.calls.some(u => u.pathname.endsWith("/add") || u.pathname.endsWith("/delete")), where + ": Pinboard was written");
      // As a delivered skip: the status cache records the bookmark as saved.
      assert((h.env.cacheWrites || []).slice(cacheBefore).some(w => w.url === URL_ARTICLE && w.account === account && w.bookmarked === true && Object.hasOwn(w, "toreadHint")),
        where + ": the save result did not reach the status cache: " + JSON.stringify((h.env.cacheWrites || []).slice(cacheBefore)));
    } finally { r.frame.remove(); }
  }
});

async function barFrame(account, handler, detailExtra = {}) {
  runtime ||= await (await fetch("../md-bookmark.js")).text();
  const frame = document.createElement("iframe"); document.body.append(frame);
  const w = frame.contentWindow, requests = [], states = [];
  w.document.body.innerHTML = '<aside id="action-rail"><div class="rail-badges"></div></aside><div id="rendered-view"></div>';
  w.eval(await (await fetch("../shared.js")).text());
  w.chrome = { runtime: { id: "test-id", getURL: p => "chrome-extension://test-id/" + p, onMessage: { addListener() {} },
    sendMessage: async msg => { requests.push(msg); return handler(msg); } } };
  w.t = k => k; w.eval(runtime);
  w.document.addEventListener("pbp:bookmark-state", e => states.push(e.detail));
  w.document.dispatchEvent(new w.CustomEvent("pbp:rendered", { detail: { url: URL_ARTICLE, title: "Article", account, bookmark: { tags: [], notes: "" }, ...detailExtra } }));
  await new Promise(r => setTimeout(r, 30));
  return { w, frame, requests, states, status: () => w.document.getElementById("reader-bookmark-status").textContent,
    node: name => w.document.getElementById("reader-bookmark-" + name) };
}

await test("a connection change during a request waits for it, then looks the address up again", async () => {
  const account = "linkding:https://ld.example:c1";
  const gatewayError = { known: false, reason: "gateway_redirect", account };
  const ok = { known: true, bookmarked: true, account, bookmark: { tags: [], notes: "" } };
  const fire = r => r.w.document.dispatchEvent(new r.w.CustomEvent("pbp:bookmark-connection-changed", { detail: { url: URL_ARTICLE, title: "Article", account } }));
  // 1. While the first lookup is still waiting on a slow server.
  let release, slow = true;
  const first = await barFrame(account, m => slow ? new Promise(res => { release = () => res(gatewayError); }) : ok);
  try {
    equal(first.requests.length, 1); fire(first); await wait(20); equal(first.requests.length, 1, "looked up before the first answer");
    slow = false; release(); await wait(60);
    equal(first.requests.length, 2); equal(first.status(), ""); equal(first.node("save").dataset.saved, "true");
  } finally { first.frame.remove(); }
  // 2. While a save is failing on the old settings.
  let phase = "known", releaseSave;
  const second = await barFrame(account, m => m.type === "mdReaderBookmarkState" ? (phase === "known" ? ok : { ...ok, bookmark: { tags: [], notes: "", title: "x" } })
    : new Promise(res => { releaseSave = () => res({ status: "failed", reason: "gateway_redirect", account }); }));
  try {

    const lookups = () => second.requests.filter(m => m.type === "mdReaderBookmarkState").length;
    const before = lookups(); fire(second); await wait(20); equal(lookups(), before);
