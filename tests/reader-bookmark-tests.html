async function deleteUiHarness(options = {}) {
  const h = await pipelineHarness(options);
  const frame = document.createElement("iframe"); frame.width = 800; frame.height = 600; document.body.append(frame);
  const w = frame.contentWindow;
  w.document.body.innerHTML = '<aside id="action-rail"><div class="rail-badges"></div></aside><div id="rendered-view"><p>Keep reading</p></div><div id="reader-notes">Keep highlight notes</div>';
  w.eval(await (await fetch("../shared.js")).text());
  const requests = [];
  w.chrome = { runtime: { id: "test-id", getURL: p => "chrome-extension://test-id/" + p,
    sendMessage: msg => { requests.push(msg); return h.pbpReaderBookmarkRequest(msg, SENDER); }, onMessage: { addListener: () => {} } } };
  w.t = k => k; w.eval(runtime);
  const settle = async () => {
    for (let i = 0; i < 200; i++) {
      await new Promise(resolve => setTimeout(resolve, 1));
      if (w.document.getElementById("reader-bookmark-save")?.getAttribute("aria-busy") === "false") return;
    }
    throw new Error("reader remained busy");
  };
  w.document.dispatchEvent(new w.CustomEvent("pbp:rendered", { detail: { url: URL_ARTICLE, title: "Article", account: "alice", bookmark: { tags: [], notes: "" } } }));
  await settle(); await w.pbpReaderBookmarkAction("edit");
  return { ...h, w, frame, requests, settle, node: name => w.document.getElementById("reader-bookmark-" + name) };
}
await test("editor offers delete only for a known saved bookmark; cancel and Escape preserve edits", async () => {
  for (const saved of [false, true]) {
    const h = await deleteUiHarness({ post: saved ? { ...POST } : null });
    try {
      assert(h.node("delete"), "delete button is missing"); equal(h.node("delete").hidden, !saved);
      h.node("title").value = "Unsaved title"; h.node("delete").click();
      if (saved) {
        assert(h.w.document.querySelector(".confirm-popover:popover-open"), "confirmation must be above the open editor");
        assert(h.node("editor").contains(h.w.document.querySelector(".confirm-popover")), "native pointer clicks must stay inside the auto editor");
        equal(h.w.document.activeElement.className, "confirm-no");
        h.w.document.querySelector(".confirm-no").click();
        equal(h.node("title").value, "Unsaved title"); assert(h.node("editor").matches(":popover-open"));
        h.node("delete").click(); h.w.document.dispatchEvent(new h.w.KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
        assert(!h.w.document.querySelector(".confirm-popover")); assert(h.node("editor").matches(":popover-open"));
      }
      equal(h.requests.filter(msg => msg.type === "mdReaderBookmarkDelete").length, 0);
    } finally { h.frame.remove(); }
  }
});

});
