<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="pbp-expected-count" content="54"><title>Batch Progress Tests</title>
<style>
body { font-family: monospace; padding: 16px; max-width: 900px; }
.case { padding: 6px; border-bottom: 1px solid #eee; white-space: pre-wrap; }
.pass { color: #0a0; }
.fail { color: #c00; font-weight: bold; }
</style></head>
<body>
<h1>Batch progress and liveness tests</h1>
<div id="results"></div>
<script src="../shared.js"></script>
<script src="../wayback.js"></script>
<script src="../ai.js"></script>
<script src="fixtures/chrome-mock.js"></script>
<script src="fixtures/sw-realm.js"></script>
<script>
async function test(name, fn) {
  let ok = true;
  let detail = "";
  try { await fn(); }
  catch (e) { ok = false; detail = "\n  " + e.message; }
  const div = document.createElement("div");
  div.className = "case " + (ok ? "pass" : "fail");
  div.textContent = `${ok ? "PASS" : "FAIL"} ${name}${detail}`;
  document.getElementById("results").appendChild(div);
}

function assert(condition, message) {
  if (!condition) throw new Error(message || "assertion failed");
}

function equal(actual, expected, message) {
  if (actual !== expected) throw new Error(`${message || "values differ"}: ${actual} !== ${expected}`);
}

let _swRealmPromise = null;
function getBatchSwRealm() {
  return (_swRealmPromise ||= pbpSwRealm.boot({
    mock: { id: "test-id", storage: { local: { _driveScopeKeysRetiredDone: true } } },
  }));
}

function ensureBatchFramesHost() {
  let host = document.getElementById("pbp-batch-frames");
  if (!host) {
    host = document.createElement("div");
    host.id = "pbp-batch-frames";
    host.style.cssText = "position:fixed;left:-9999px;top:0;width:10px;height:10px;opacity:0;pointer-events:none;overflow:hidden";
    document.body.appendChild(host);
  }
  return host;
}

async function bootPopupBatchRealm(setup) {
  const iframe = document.createElement("iframe");
  ensureBatchFramesHost().appendChild(iframe);
  const win = iframe.contentWindow;
  const doc = iframe.contentDocument;
  doc.open();
  doc.write("<!DOCTYPE html><html><head><meta charset='UTF-8'></head><body></body></html>");
  doc.close();
  // Copy shared constants/helpers already loaded by <script src="../shared.js">
  // and <script src="../ai.js"> on the test host page, then load popup-batch.js
  // via real <script src> so V8 credits coverage to popup-batch.js.
  Object.assign(win, {
    SETTINGS_DEFAULTS, PBP_ICONS, BATCH_STALE_TTL, batchIsRunning,
    PBP_BOOKMARK_FAILURE_KEYS, PBP_BOOKMARK_STOP_CODES, PBP_BOOKMARK_GATEWAY_CODES,
    pbpBookmarkFailureArgs, pbpBatchRemoteExtractEngine, pbpRemoteExtractOriginPattern,
    pbpPinboardAccountFromToken, pbpAiCustomKeySeal, pbpAiResolveTarget,
  });
  if (setup) await setup(win, doc);
  const base = new URL("../", document.baseURI).href;
  await pbpSwRealm.loadScript(doc, base + "popup-batch.js");
  return {
    win,
    doc,
    get(expr) { return win.eval(expr); },
  };
}

// Run the shipped SW entry points via real <script src> in sw-realm.js.
// External work is bounded to local doubles: the AI cache supplies names verbatim;
// Pinboard runs the shipped delivery and URI builder against a hand-written response.
async function createSaveTagsHarness(service, names, opts = {}) {
  const sw = await getBatchSwRealm();
  const { win, mock } = sw;
  await mock.chrome.storage.local.clear();
  await mock.chrome.storage.local.set({ _driveScopeKeysRetiredDone: true });
  sw.set("_batchRunning", false);

  const settings = { bookmarkService: service, pinboardToken: "fixture-token", _aiTags: true, batchAiTags: true, ...(opts.settings || {}) };
  const auth = { service, account: "test-owner", token: "fixture-token", baseUrl: "https://bookmarks.example/", epoch: 0 };
  const calls = { intents: [], uris: [], names: [], progress: [], lookups: [], extracted: [], queries: 0, remoteFetches: [], cacheSources: [] };
  const state = { epoch: 0, account: auth.account };

  const lookupFn = async (url, token, lookupAuth) => {
    calls.lookups.push({ url, epoch: lookupAuth?.epoch, account: lookupAuth?.account });
    if (lookupAuth?.epoch !== state.epoch || lookupAuth?.account !== state.account) {
      return { exists: false, lookupFailed: true, reason: "account_changed", retryable: false };
    }
    return { exists: false };
  };

  win.getCurrentBookmarkAuth = async () => ({ ...auth, account: state.account, epoch: state.epoch });
  win.pbpBookmarkAuthIsCurrent = () => true;
  win.fetchExistingBookmark = lookupFn;
  win.pbpBookmarkHostGranted = async () => true;
  win.loadSettings = async () => settings;
  win.pbpLoadTagVocab = async account => ({ account, timestamp: Date.now(), counts: null, index: pbpTagVocabIndex(Object.fromEntries(names.map(name => [name, 1]))) });
  win.fetchDeepseekMarkdown = opts.fetchDeepseekMarkdown || (async (url, o) => {
    calls.remoteFetches.push({ engine: "deepseek", url, apiKey: o?.apiKey });
    return { markdown: "# DeepSeek Body", title: "DS Title", url };
  });
  win.fetchJinaMarkdown = opts.fetchJinaMarkdown || (async (url, o) => {
    calls.remoteFetches.push({ engine: "jina", url, apiKey: o?.apiKey });
    return { markdown: "# Jina Body", title: "Jina Title", url };
  });
  mock.chrome.permissions.contains = async (spec) => opts.containsOrigin ? opts.containsOrigin(spec?.origins?.[0] || "") : true;
  mock.chrome.tabs.query = async () => { calls.queries++; return (opts.liveTabs || []).map(lt => ({ ...lt })); };
  win.getPageInfoFromTab = async (tabId, o) => {
    calls.extracted.push({ tabId, expectedUrl: o?.expectedUrl });
    if (opts.liveTabs && !opts.liveTabs.some(lt => lt.id === tabId && lt.url === o?.expectedUrl)) return null;
    return { pageText: "Synthetic public text" };
  };
  win._cbTabsGet = async id => (opts.liveTabs || []).find(lt => lt.id === id) || null;
  win.buildAutoNotes = () => "";
  win.pbpNotesDescription = () => "";
  win.hasAIKey = () => true;
  win.getAICache = async (_url, _type, _dur, src) => { calls.cacheSources.push(src); return names.slice(); };
  win.setAICache = async () => {};
  win.callAI = async () => { throw new Error("unexpected AI request"); };
  win.showNotification = () => {};
  win.notifySaveFailure = () => { throw new Error("save failed"); };
  win.processOfflineQueue = async () => {};
  win.updateBadge = async () => {};
  win._newBatchRunId = () => "test-run";
  win._removeBatchRecordIfOwned = async () => {};
  win._writeBatchProgress = async row => { calls.progress.push(row); return true; };
  win.t = key => key;
  // Pinboard v1 posts/add?format=json reply ({"result_code":"done"}, verified live 2026-11-23).
  win.pinboardFetch = async uri => {
    calls.uris.push(uri);
    return { ok: true, status: 200, json: async () => ({ result_code: "done" }) };
  };

  const realValidate = win.validateSaveIntent;
  const realDeliver = win.deliverSaveIntent;
  win.submitSaveIntent = async (intent, context = {}) => {
    const invalid = realValidate(intent);
    if (invalid) return invalid;
    calls.intents.push(intent);
    if (opts.lookupAware) {
      const deliveryAuth = { ...auth, account: state.account, epoch: state.epoch };
      const prefetched = context.lookup?.url === intent.url && context.lookup.account === deliveryAuth.account ? context.lookup.found : undefined;
      const found = prefetched || await lookupFn(intent.url, deliveryAuth.token, deliveryAuth);
      if (found.lookupFailed) return { status: "failed", reason: found.reason, account: state.account };
    }
    if (service === "pinboard") {
      win.fetchExistingBookmark = async () => ({ exists: false });
      try {
        return (await realDeliver(intent, settings, auth)).result;
      } finally {
        win.fetchExistingBookmark = lookupFn;
      }
    } else {
      calls.names.push(pbpBookmarkParseTags(intent.tags));
    }
    if (opts.onSave) opts.onSave(state, calls.intents.length);
    return { status: "saved", mutation: "created", account: auth.account };
  };

  const tabs = opts.tabs || [{ id: 1, url: "https://example.com/tags", title: "Tags" }];
  return {
    calls,
    state,
    quick: () => win.saveFromBackground({ url: "https://example.com/tags", title: "Tags", tab: { id: 1 } }),
    batch: () => win._runBatchSave(tabs, auth.account),
    resume: (startIndex = 0) => win._runBatchSave(tabs, auth.account, { runId: "test-run", startIndex, resumeCount: 1, counts: {} }),
  };
}

// A built-in's label the way the resolver forms it: its prov* name when the
// catalogue has one, else the id.
function stubResolveTarget(s, tFn, id = (s && s.aiProvider) || "gemini") {
  const key = "prov" + id[0].toUpperCase() + id.slice(1);
  const name = tFn(key);
  return { label: name && name !== key ? name : id };
}

async function createPermissionHarness(providerOrigin = "https://api.example/*", { realResolver = false } = {}) {
  const tFn = (key, ...args) => key + ":" + args.join("|");
  const realm = await bootPopupBatchRealm(async (win, doc) => {
    if (realResolver) {
      const base = new URL("../", document.baseURI).href;
      await pbpSwRealm.loadScript(doc, base + "shared.js");
      win.t = tFn;
      await pbpSwRealm.loadScript(doc, base + "ai.js");
    } else {
      win.pbpAiResolveTarget = (s, id) => stubResolveTarget(s, tFn, id);
    }
    win._aiTargetOriginPattern = () => providerOrigin;
    win.t = tFn;
  });
  return {
    batchAiPermissionOrigins: realm.win.batchAiPermissionOrigins,
    batchAiPermissionRows: realm.win.batchAiPermissionRows,
  };
}

function fakeElement() {
  const classes = new Set(["hidden"]);
  return {
    disabled: false,
    innerHTML: "",
    textContent: "",
    children: [],
    dataset: {},
    style: {},
    attributes: {},
    classList: {
      add: (name) => classes.add(name),
      remove: (name) => classes.delete(name),
      contains: (name) => classes.has(name),
      toggle: (name, force) => {
        const on = force === undefined ? !classes.has(name) : !!force;
        if (on) classes.add(name); else classes.delete(name);
        return on;
      },
    },
    setAttribute(name, value) { this.attributes[name] = value; },
    replaceChildren(...children) { this.children = children; },
    focus() { this.focused = true; },
  };
}

function fakeButton() {
  const el = fakeElement();
  el.handlers = {};
  el.addEventListener = (type, handler) => { el.handlers[type] = handler; };
  return el;
}

async function createBatchClickHarness({ ai = true, contains = false, request = true, tabs, skip = false } = {}) {
  const elements = {
    "save-tabset-btn": fakeButton(),
    "batch-bookmark-btn": fakeButton(),
    "batch-progress": fakeElement(),
    "batch-permission": fakeElement(),
    "batch-permission-title": fakeElement(),
    "batch-permission-list": fakeElement(),
    "batch-permission-detail": fakeElement(),
    "batch-permission-grant": fakeButton(),
    "batch-permission-cancel": fakeButton(),
  };
  tabs = tabs || [
    { id: 1, title: "A", url: "https://one.example/a", incognito: false },
    { id: 2, title: "B", url: "https://two.example/b", incognito: false },
  ];
  const state = { request };
  const calls = { contains: [], request: [], messages: [], statuses: [], writes: 0, order: [] };
  const chromeStub = {
    storage: {
      local: {
        get: async () => ({ batch_progress: null }),
        set: async () => { calls.writes++; },
      },
    },
    tabs: { query: async () => tabs },
    permissions: {
      contains: async (query) => { calls.contains.push(query); return contains; },
      request: async (query) => {
        calls.request.push(query);
        calls.order.push("request");
        if (state.request instanceof Error) throw state.request;
        return state.request;
      },
    },
    runtime: {
      lastError: null,
      sendMessage: async (message) => {
        calls.messages.push(message);
        calls.order.push("send");
        if (calls.failSend) throw new Error("dispatch failed");
        return { status: "started" };
      },
    },
  };
  const tFn = (key, ...args) => args.length ? key + ":" + args.join(":") : key;
  const realm = await bootPopupBatchRealm((win) => {
    win.$id = (id) => elements[id] || null;
    win.t = tFn;
    win.setBtnIcon = (button, _icon, label) => { button.label = label; };
    win.chrome = chromeStub;
    win.showStatus = (id, message, kind) => calls.statuses.push({ id, message, kind });
    win.batchIsRunning = () => false;
    win.getSettingsStorage = async () => ({ get: async () => ({ pinboardToken: "token" }) });
    win.pbpApplySecretOverlay = async (value) => value;
    win.pbpReadBookmarkConnection = async () => ({ service: "pinboard", token: "alice:token", account: "alice" });
    win.deobfuscateKey = (value) => value;
    win.settings = { aiProvider: "openai", batchAiTags: ai, batchAiSummary: false, batchSkipExisting: skip };
    win.hasAIKey = () => true;
    win.setTimeout = () => 0;
    win._aiTargetOriginPattern = () => "https://api.example/*";
    win.pbpAiResolveTarget = (s) => stubResolveTarget(s, tFn);
  });
  realm.win.wireBatchProgress = () => {};
  realm.win.setupTabSet();
  return {
    setupTabSet: realm.win.setupTabSet,
    getPending: () => realm.get("batchAiPermissionPending"),
    elements,
    calls,
    setRequest: (value) => { state.request = value; },
    click: () => elements["batch-bookmark-btn"].handlers.click(),
    grant: () => elements["batch-permission-grant"].handlers.click(),
    cancel: () => elements["batch-permission-cancel"].handlers.click(),
  };
}

async function createUiHarness(storedProgress, now, opts = {}) {
  if (storedProgress) storedProgress = { account: "alice", ...storedProgress };
  let activeEl = null;
  const elements = {
    "batch-bookmark-btn": fakeElement(),
    "batch-progress": fakeElement(),
    "batch-progress-fill": fakeElement(),
    "batch-progress-text": fakeElement(),
    "batch-cancel-btn": fakeButton(),
  };
  elements["batch-cancel-btn"].querySelector = () => ({ innerHTML: "" });
  elements["batch-bookmark-btn"].focus = function () { this.focused = true; activeEl = this; };
  elements["batch-progress"].focus = function () { this.focused = true; activeEl = this; };
  const statuses = [];
  const writes = [];
  const dismissed = [];
  let timer = null;
  const chromeStub = {
    storage: {
      onChanged: { addListener: () => {} },
      local: {
        get: async () => ({ batch_progress: storedProgress }),
        set: async (value) => {
          if (opts.setReject && !opts.setRejectOnce?.done) {
            if (opts.setRejectOnce) opts.setRejectOnce.done = true;
            throw new Error("storage unavailable");
          }
          writes.push(value);
        },
      },
    },
  };
  const realm = await bootPopupBatchRealm((win, doc) => {
    // Keep motion-ready absent on doc.documentElement so teardown stays synchronous,
    // and reflect fakeElement focus on doc.activeElement.
    Object.defineProperty(doc, "activeElement", { get: () => activeEl, configurable: true });
    win.Date.now = () => now;
    win.$id = (id) => elements[id] || null;
    win.t = (key, ...args) => args.length ? `${key}:${args.join(":")}` : key;
    win.showStatus = (id, message, kind, o) => statuses.push({ id, message, kind, remedy: o?.remedy === true, key: o?.key });
    win.setBtnIcon = (button, _icon, label) => { button.label = label; };
    win.setTimeout = (callback) => { timer = callback; return 0; };
    chromeStub.storage.local.get = () => win.Promise.resolve({ batch_progress: storedProgress });
    win.chrome = chromeStub;
    win.pbpDismissRemedyStatus = (key) => dismissed.push(key);
  });
  realm.win.readBatchAccount = () => realm.win.Promise.resolve({ token: "alice:token", account: "alice" });
  return {
    wireBatchProgress: realm.win.wireBatchProgress,
    renderBatchProgress: (progress) => realm.win.renderBatchProgress({ account: "alice", ...progress }, "alice"),
    elements, statuses, writes, dismissed, runTimer: () => timer?.()
  };
}

(async () => {
  for (const path of ["quick", "batch"]) {
    await test(path + " save preserves self-hosted tag names with spaces, quotes and backslashes", async () => {
      const names = ["machine learning", 'say"hello', "path\\name"];
      for (const service of ["karakeep", "linkding"]) {
        const h = await createSaveTagsHarness(service, names);
        const result = await h[path]();
        equal(JSON.stringify(h.calls.names), JSON.stringify([names]), service + " changed tag names");
        if (path === "quick") equal(result.status, "saved");
        else equal(h.calls.progress.at(-1).saved, 1, service + " batch did not save");
      }
    });

    await test(path + " Pinboard save keeps quote tags and the legacy posts/add URI", async () => {
      const h = await createSaveTagsHarness("pinboard", ['say"hello', "plain", "path\\name"]);
      const result = await h[path]();
      equal(h.calls.intents.length, 1, "Pinboard intent was rejected");
      equal(h.calls.intents[0].tags, 'say"hello plain path\\name');
      equal(h.calls.uris[0], "https://api.pinboard.in/v1/posts/add?auth_token=fixture-token&format=json&url=https%3A%2F%2Fexample.com%2Ftags&description=Tags&extended=&tags=say%22hello%20plain%20path%5Cname&shared=yes&toread=no&replace=no");
      if (path === "quick") equal(result.status, "saved");
      else equal(h.calls.progress.at(-1).saved, 1, "Pinboard batch did not save");
    });
  }
  // Y3-01: tab ids do not survive a browser restart. A resumed run must find
  // each page again by its address; a fresh run must not pay for tabs.query.
  {
    const snap = [{id:812, url:"https://example.com/a", title:"A"}, {id:6, url:"https://example.com/b", title:"B"}, {id:813, url:"https://example.com/c", title:"C"}];
    const live = [{id:5, url:"https://example.com/a"}, {id:6, url:"https://example.com/other"}, {id:7, url:"https://example.com/b"}, {id:9, url:"https://example.com/c", incognito:true}];
    await test("a resumed batch extracts from the restored tab, not the dead or reassigned snapshot id", async () => {
      const h = await createSaveTagsHarness("pinboard", ["x"], {tabs:snap, liveTabs:live.slice(0, 3)});
      await h.resume(0);
      equal(h.calls.extracted.map(e => e.tabId).join(), "5,7,813", "extraction targets");
      const last = h.calls.progress.at(-1);
      equal(last.aiFailed, 1, "only the tab with no live twin should degrade");
      equal(h.calls.queries, 1, "tabs.query is read once per resume");
    });
    await test("a resumed batch matches window kind and gives each live tab to one entry", async () => {
      const twins = [{id:100, url:"https://example.com/a", title:"A1"}, {id:101, url:"https://example.com/a", title:"A2"}, {id:102, url:"https://example.com/c", title:"C", incognito:true}];
      const h = await createSaveTagsHarness("pinboard", ["x"], {tabs:twins, liveTabs:[{id:5, url:"https://example.com/a"}, {id:8, url:"https://example.com/a"}, {id:4, url:"https://example.com/c"}, {id:9, url:"https://example.com/c", incognito:true}]});
      await h.resume(0);
      equal(h.calls.extracted.map(e => e.tabId).join(), "5,8,9");
    });
    await test("a resumed batch does not reuse a same-address tab of the other window kind", async () => {
      const h = await createSaveTagsHarness("pinboard", ["x"], {tabs:[{id:6, url:"https://example.com/a", title:"A", incognito:false}],
        liveTabs:[{id:6, url:"https://example.com/a", incognito:true}, {id:7, url:"https://example.com/a", incognito:false}]});
      await h.resume(0);
      equal(h.calls.extracted.map(e => e.tabId).join(), "7", "extraction targets");
    });
    await test("a resumed batch with no matching tab degrades per item as before", async () => {
      const h = await createSaveTagsHarness("pinboard", ["x"], {tabs:snap.slice(0, 1), liveTabs:[{id:6, url:"https://example.com/zzz"}]});
      await h.resume(0);
      equal(h.calls.extracted[0].tabId, 812);
      equal(h.calls.progress.at(-1).aiFailed, 1);
      equal(h.calls.progress.at(-1).saved, 1, "the bare bookmark is still saved");
    });
    await test("a fresh batch never calls tabs.query and keeps the snapshot ids", async () => {
      const h = await createSaveTagsHarness("pinboard", ["x"], {tabs:snap.slice(0, 1), liveTabs:[{id:812, url:"https://example.com/a"}]});
      await h.batch();
      equal(h.calls.queries, 0);
      equal(h.calls.extracted[0].tabId, 812);
    });
  }
  for (const service of ["karakeep", "linkding"]) {
    const threeTabs = [1, 2, 3].map(n => ({id:n, url:"https://example.com/p" + n, title:"P" + n}));
    await test(service + " batch skip mode keeps going when a same-account bookmark setting write bumps the epoch", async () => {
      const h = await createSaveTagsHarness(service, ["a"], {tabs:threeTabs, settings:{batchSkipExisting:true}, lookupAware:true,
        onSave:(state, n) => { if (n === 1) state.epoch++; }});
      await h.batch();
      const last = h.calls.progress.at(-1);
      equal(last.error, null, "run was stopped");
      equal(last.saved, 3, "not every tab saved");
      equal(h.calls.intents.length, 3);
    });
    await test(service + " batch over-long title check uses the current auth after a same-account setting write", async () => {
      const long = "T".repeat(5000);
      const tabs = [{id:1, url:"https://example.com/p1", title:"P1"}, {id:2, url:"https://example.com/p2", title:long}, {id:3, url:"https://example.com/p3", title:long}];
      // Merge mode: only the over-long title triggers a lookup.
      const h = await createSaveTagsHarness(service, ["a"], {tabs, lookupAware:true, onSave:(state, n) => { if (n === 1) state.epoch++; }});
      await h.batch();
      const last = h.calls.progress.at(-1);
      equal(last.error, null, "run was stopped by a stale-epoch lookup");
      equal(last.saved + "/" + last.tooLong, "1/2");
      assert(h.calls.lookups.length >= 2 && h.calls.lookups.slice(-2).every(l => l.epoch === 1), "lookups did not carry the current epoch");
    });
    await test(service + " batch stops without lookup or save when the account really changes", async () => {
      const h = await createSaveTagsHarness(service, ["a"], {tabs:threeTabs, settings:{batchSkipExisting:true}, lookupAware:true,
        onSave:(state, n) => { if (n === 1) state.account = "someone-else"; }});
      await h.batch();
      const last = h.calls.progress.at(-1);
      equal(last.error, "account_changed");
      equal(last.saved, 1);
      equal(h.calls.intents.length, 1, "saved after the account changed");
      equal(h.calls.lookups.length, 1, "looked up after the account changed");
    });
  }
  await test("Batch AI origins are exact, deduplicated, ceiling-filtered, and include the provider", async () => {
    const h = await createPermissionHarness();
    const origins = h.batchAiPermissionOrigins([
      { url: "https://one.example/a" },
      { url: "https://one.example/b" },
      { url: "http://two.example:8080/c" },
      { url: "http://127.0.0.1:3000/dev" },
    ], {});
    equal(origins.join(","), "https://one.example/*,http://127.0.0.1:3000/*,https://api.example/*");
  });

  await test("permission rows disclose every origin and name the AI provider", async () => {
    const h = await createPermissionHarness();
    const origins = Array.from({ length: 12 }, (_, i) => "https://site-" + (i + 1) + ".example/*");
    origins.push("https://api.example/*");
    const rows = h.batchAiPermissionRows(origins, { aiProvider: "openai" });
    equal(rows.length, 13, "full list was truncated");
    assert(rows[10].includes("site-11.example"), "eleventh site missing");
    assert(rows[12].includes("provOpenai") && rows[12].includes("https://api.example"), "provider is not named");

    assert(skip.statuses[0].message.endsWith("batchTagTooLongSkip:1:" + shown + ":64"), "skip-mode sentence missing: " + skip.statuses[0].message);
    assert(!skip.statuses[0].message.includes("batchTagTooLong:"), "skip mode still carries the rerun-only sentence: " + skip.statuses[0].message);
  });

  await test("batch outcomes with a remedy stay on screen; plain failures keep the 4 s card", async () => {
    const run = async (progress) => { const h = await createUiHarness(null, 5000); h.renderBatchProgress({ running: false, done: true, total: 3, saved: 0, queued: 0, failed: 0, skipped: 0, tooLong: 0, ...progress }); return h.statuses[0]; };
    equal((await run({ tagTooLong: 2, longTag: "x" })).remedy, true, "merge-mode long tag must stay on screen (no 4 s hide)");
    equal((await run({ tagTooLong: 1, longTag: "x", longTagSkip: true })).remedy, true, "skip-mode long tag must stay on screen (no 4 s hide)");
    equal((await run({ error: "not_logged_in" })).remedy, true, "not-logged-in must stay on screen (no 4 s hide)");
    equal((await run({ error: "interrupted" })).remedy, true, "interrupted must stay on screen (no 4 s hide)");
    equal((await run({ failed: 1 })).remedy, false, "a plain item failure must keep the 4 s hide");
    equal((await run({ error: "something broke" })).remedy, false, "a raw batch error must keep the 4 s hide");
  });

  await test("completion copy is localized and names an account switch (B33/B51)", async () => {
    const ai = await createUiHarness(null, 5000);
    ai.renderBatchProgress({ running: false, done: true, total: 2, saved: 2, queued: 0, failed: 0, skipped: 0, tooLong: 0, aiFailed: 3 });
    assert(ai.statuses[0].message.includes("batchAiFailed:3"), "AI failure count is not localized: " + ai.statuses[0].message);
    assert(!/AI failed/.test(ai.statuses[0].message), "hard-coded English AI suffix leaked");
    const switched = await createUiHarness(null, 5000);
    switched.renderBatchProgress({ running: false, done: true, total: 3, i: 1, saved: 1, queued: 0, failed: 0, error: "account_changed" });
    equal(switched.statuses[0].message, "batchAccountChanged", "account switch was reported as a token failure");
  });

  await test("gateway, token and host-grant batch stops show their cause", async () => {
    for (const code of PBP_BOOKMARK_GATEWAY_CODES) {
      const h = await createUiHarness(null, 5000);
      h.renderBatchProgress({ running: false, done: true, total: 3, i: 2, saved: 1, queued: 0, failed: 0, error: code });
      equal(h.statuses[0].message, PBP_BOOKMARK_FAILURE_KEYS[code], code + " fell back to the raw batchFailed code");
      equal(h.statuses[0].kind, "error");
    }
    const notApi = await createUiHarness(null, 5000);
    notApi.renderBatchProgress({ running: false, done: true, total: 1, saved: 0, error: "not_api" });
    equal(notApi.statuses[0].message, "bookmarkErrNotApi");
    for (const [code, key] of [["auth", "bookmarkErrAuth"], ["permission", "bookmarkPermissionDenied"]]) {
      const stopped = await createUiHarness(null, 5000);
      stopped.renderBatchProgress({ running: false, done: true, total: 3, i: 1, saved: 0, error: code });
      equal(stopped.statuses[0].message, key, code + " fell back to the raw batchFailed code");
      equal(stopped.statuses[0].kind, "error");
    }
    const other = await createUiHarness(null, 5000);
    other.renderBatchProgress({ running: false, done: true, total: 1, saved: 0, error: "boom" });
    equal(other.statuses[0].message, "batchFailed:boom");
    for (const code of Object.keys(PBP_BOOKMARK_FAILURE_KEYS).filter((code) => code !== "auth" && !PBP_BOOKMARK_STOP_CODES.includes(code) && code !== "account_changed")) {
      const thrown = await createUiHarness(null, 5000);
      thrown.renderBatchProgress({ running: false, done: true, total: 1, saved: 0, error: code });
      equal(thrown.statuses[0].message, "batchFailed:" + code);
    }
  });

  await test("reopen restores fresh running/done progress but ignores stale done", async () => {
    const freshRunning = await createUiHarness({ running: true, done: false, total: 3, i: 1, queued: 1, ts: 4500 }, 5000);
    freshRunning.wireBatchProgress();
    await Promise.resolve(); await Promise.resolve();
    assert(freshRunning.elements["batch-progress-text"].innerHTML.includes("offlineQueued:1"), "fresh running progress not restored");

    const freshDone = await createUiHarness({ running: false, done: true, total: 2, saved: 0, queued: 2, failed: 0, ts: 4500 }, 5000);
    freshDone.wireBatchProgress();
    await Promise.resolve(); await Promise.resolve();
    equal(freshDone.statuses[0].kind, "info", "fresh completion not restored");

    const staleDone = await createUiHarness({ running: false, done: true, total: 2, saved: 0, queued: 2, failed: 0, ts: 1 }, 200000);
    staleDone.wireBatchProgress();
    await Promise.resolve(); await Promise.resolve();
    equal(staleDone.statuses.length, 0, "stale completion should stay hidden");
  });

  (await _swRealmPromise)?.dispose();
})();
</script>
