<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Batch Progress Tests</title>
<style>
body { font-family: monospace; padding: 16px; max-width: 900px; }
.case { padding: 6px; border-bottom: 1px solid #eee; white-space: pre-wrap; }
.pass { color: #0a0; }
.fail { color: #c00; font-weight: bold; }
</style></head>
<body>
<h1>Batch progress and liveness tests</h1>
<div id="results"></div>
<script src="../shared.js"></script>
<script src="../wayback.js"></script>
<script>
async function test(name, fn) {
  let ok = true;
  let detail = "";
  try { await fn(); }
  catch (e) { ok = false; detail = "\n  " + e.message; }
  const div = document.createElement("div");
  div.className = "case " + (ok ? "pass" : "fail");
  div.textContent = `${ok ? "PASS" : "FAIL"} ${name}${detail}`;
  document.getElementById("results").appendChild(div);
}

function assert(condition, message) {
  if (!condition) throw new Error(message || "assertion failed");
}

function equal(actual, expected, message) {
  if (actual !== expected) throw new Error(`${message || "values differ"}: ${actual} !== ${expected}`);
}

let popupBatchSource;
let popupBatchPermissionSource;
let popupBatchSetupSource;

// Run the shipped SW entry points. External work is bounded to local doubles:
// the AI cache supplies names verbatim; Pinboard runs the shipped delivery and
// URI builder against a hand-written success response, never the network.
async function createSaveTagsHarness(service, names, opts = {}) {
  const source = await (await fetch("../background.js")).text();
  function block(startMarker, endMarker) {
    const start = source.indexOf(startMarker);
    const end = source.indexOf(endMarker, start);
    assert(start >= 0 && end > start, "SW source block not found: " + startMarker);
    return source.slice(start, end);
  }
  const settings = {bookmarkService:service, pinboardToken:"fixture-token", _aiTags:true, batchAiTags:true, ...(opts.settings || {})};
  const auth = {service, account:"test-owner", token:"fixture-token", baseUrl:"https://bookmarks.example/", epoch:0};
  const calls = {intents:[], uris:[], names:[], progress:[], lookups:[], extracted:[], queries:0};
  const state = {epoch:0, account:auth.account};
  const dependencies = {
    getCurrentBookmarkAuth:async () => ({...auth, account:state.account, epoch:state.epoch}),
    // Shape copied from the real self-hosted catch branch of fetchExistingBookmark
    // when the client's beforeRequest sees a stale epoch.
    fetchExistingBookmark:async (url, token, lookupAuth) => {
      calls.lookups.push({url, epoch:lookupAuth?.epoch, account:lookupAuth?.account});
      if (lookupAuth?.epoch !== state.epoch || lookupAuth?.account !== state.account) return {exists:false, lookupFailed:true, reason:"account_changed", retryable:false};
      return {exists:false};
    },
    pbpBookmarkHostGranted:async () => true,
    loadSettings:async () => settings,
    pbpLoadTagVocab:async account => ({account, timestamp:Date.now(), counts:null, index:pbpTagVocabIndex(Object.fromEntries(names.map(name => [name, 1])))}),
    pbpCanonicalTagName, pbpTagGroupKey,
    chrome:{permissions:{contains:async () => true}, storage:{local:{get:async () => ({}), set:async () => {}}},
      tabs:{query:async () => { calls.queries++; return (opts.liveTabs || []).map(lt => ({...lt})); }}},
    getPageInfoFromTab:async (tabId, o) => {
      calls.extracted.push({tabId, expectedUrl:o?.expectedUrl});
      if (opts.liveTabs && !opts.liveTabs.some(lt => lt.id === tabId && lt.url === o?.expectedUrl)) return null;
      return {pageText:"Synthetic public text"};
    },
    _cbTabsGet:async id => (opts.liveTabs || []).find(lt => lt.id === id) || null,
    buildAutoNotes:() => "",
    pbpNotesDescription:() => "", pbpPageInfoReadable:info=>!!info&&info._pbpUnavailable!==true&&["","text/html","application/xhtml+xml"].includes(String(info.contentType||"").split(";")[0].trim()),
    hasAIKey:() => true,
    getAICache:async () => names.slice(),
    callAI:async () => { throw new Error("unexpected AI request"); },
    showNotification() {},
    notifySaveFailure() { throw new Error("save failed"); },
    processOfflineQueue:async () => {},
    updateBadge:async () => {},
    _newBatchRunId:() => "test-run",
    _removeBatchRecordIfOwned:async () => {},
    _writeBatchProgress:async row => { calls.progress.push(row); return true; },
    t:key => key,
    submitSaveIntent:async (intent, context = {}) => {
      const invalid = delivery.validateSaveIntent(intent);
      if (invalid) return invalid;
      calls.intents.push(intent);
      if (opts.lookupAware) {
        const deliveryAuth = {...auth, account:state.account, epoch:state.epoch};
        // Like the real path: a prefetched answer for this page and account is reused.
        const prefetched = context.lookup?.url === intent.url && context.lookup.account === deliveryAuth.account ? context.lookup.found : undefined;
        const found = prefetched || await dependencies.fetchExistingBookmark(intent.url, deliveryAuth.token, deliveryAuth);
        if (found.lookupFailed) return {status:"failed", reason:found.reason, account:state.account};
      }
      if (service === "pinboard") {
        return (await delivery.deliverSaveIntent(intent, settings, auth)).result;
      } else {
        calls.names.push(pbpBookmarkParseTags(intent.tags));
      }
      if (opts.onSave) opts.onSave(state, calls.intents.length);
      return {status:"saved", mutation:"created", account:auth.account};
    },
  };
  const validatorSource = block("function pbpSaveFailure(", "// Delivery-time merge/skip");
  const deliverySource = block("async function pbpSendResolvedPlan(", "// Serialize ALL offlineQueue writes");
  const delivery = new Function("PBP_SAVE_MODES", "pinboardFetch", "pbpBookmarkAuthIsCurrent", "fetchExistingBookmark",
    validatorSource + deliverySource + "\nreturn {validateSaveIntent, deliverSaveIntent};")(
    new Set(["create", "update", "merge", "skip", "overwrite"]),
    async uri => { calls.uris.push(uri); return {ok:true, status:200, json:async () => ({result_code:"done"})}; },
    () => true, async () => ({exists:false}));
  const swSource = block("async function saveFromBackground(", "// Failure-reason -> showNotification")
    + block("async function _runBatchSave(", "// ===================== Tab Set");
  const keys = Object.keys(dependencies);
  const entry = new Function(...keys, "let _batchRunning = false;\n" + swSource + "\nreturn {saveFromBackground, _runBatchSave};")(...keys.map(key => dependencies[key]));
  const tabs = opts.tabs || [{id:1, url:"https://example.com/tags", title:"Tags"}];
  return {calls, state, quick:() => entry.saveFromBackground({url:"https://example.com/tags", title:"Tags", tab:{id:1}}),
    batch:() => entry._runBatchSave(tabs, auth.account),
    resume:(startIndex = 0) => entry._runBatchSave(tabs, auth.account, {runId:"test-run", startIndex, resumeCount:1, counts:{}})};
}

async function getPopupBatchSource() {
  return (await (await fetch("../popup-batch.js")).text());
}

async function getPopupBatchProgressSource() {
  if (popupBatchSource) return popupBatchSource;
  const source = await getPopupBatchSource();
  const start = source.indexOf("function renderBatchProgress");
  const end = source.indexOf("// ---- Tag Presets ----", start);
  assert(start >= 0 && end > start, "batch progress source block not found");
  popupBatchSource = source.slice(start, end);
  return popupBatchSource;
}

async function getPopupBatchPermissionSource() {
  if (popupBatchPermissionSource) return popupBatchPermissionSource;
  const source = await getPopupBatchSource();
  const start = source.indexOf("function batchAiPermissionOrigins");
  const end = source.indexOf("function showBatchAiPermission", start);
  assert(start >= 0 && end > start, "batch permission source block not found");
  popupBatchPermissionSource = source.slice(start, end);
  return popupBatchPermissionSource;
}

async function getPopupBatchSetupSource() {
  if (popupBatchSetupSource) return popupBatchSetupSource;
  const source = await getPopupBatchSource();
  const start = source.indexOf("let batchAiPermissionPending");
  const end = source.indexOf("// ---- Background batch progress", start);
  assert(start >= 0 && end > start, "batch setup source block not found");
  popupBatchSetupSource = source.slice(start, end);
  return popupBatchSetupSource;
}

// The real resolver, for the case that names a custom entry; ai.js's top
// level only declares, so it evaluates without chrome.
let realResolveTarget = null;
async function getRealResolveTarget(t) {
  if (realResolveTarget) return realResolveTarget;
  const aiSource = await (await fetch("../ai.js")).text();
  realResolveTarget = new Function("t", aiSource + "\nreturn pbpAiResolveTarget;")(t);
  return realResolveTarget;
}

// A built-in's label the way the resolver forms it: its prov* name when the
// catalogue has one, else the id.
function stubResolveTarget(s, t, id = (s && s.aiProvider) || "gemini") {
  const key = "prov" + id[0].toUpperCase() + id.slice(1);
  const name = t(key);
  return { label: name && name !== key ? name : id };
}

async function createPermissionHarness(providerOrigin = "https://api.example/*", { realResolver = false } = {}) {
  const source = await getPopupBatchPermissionSource();
  const t = (key, ...args) => key + ":" + args.join("|");
  const factory = new Function(
    "_aiTargetOriginPattern", "t", "pbpAiResolveTarget",
    source + "\nreturn { batchAiPermissionOrigins, batchAiPermissionRows };"
  );
  const resolve = realResolver ? await getRealResolveTarget(t) : (s, id) => stubResolveTarget(s, t, id);
  return factory(() => providerOrigin, t, resolve);
}

function fakeElement() {
  const classes = new Set(["hidden"]);
  return {
    disabled: false,
    innerHTML: "",
    textContent: "",
    children: [],
    dataset: {},
    style: {},
    attributes: {},
    classList: {
      add: (name) => classes.add(name),
      remove: (name) => classes.delete(name),
      contains: (name) => classes.has(name),
      toggle: (name, force) => {
        const on = force === undefined ? !classes.has(name) : !!force;
        if (on) classes.add(name); else classes.delete(name);
        return on;
      },
    },
    setAttribute(name, value) { this.attributes[name] = value; },
    replaceChildren(...children) { this.children = children; },
    focus() { this.focused = true; },
  };
}

function fakeButton() {
  const el = fakeElement();
  el.handlers = {};
  el.addEventListener = (type, handler) => { el.handlers[type] = handler; };
  return el;
}

async function createBatchClickHarness({ ai = true, contains = false, request = true, tabs, skip = false } = {}) {
  const elements = {
    "save-tabset-btn": fakeButton(),
    "batch-bookmark-btn": fakeButton(),
    "batch-progress": fakeElement(),
    "batch-permission": fakeElement(),
    "batch-permission-title": fakeElement(),
    "batch-permission-list": fakeElement(),
    "batch-permission-detail": fakeElement(),
    "batch-permission-grant": fakeButton(),
    "batch-permission-cancel": fakeButton(),
  };
  tabs = tabs || [
    { id: 1, title: "A", url: "https://one.example/a", incognito: false },
    { id: 2, title: "B", url: "https://two.example/b", incognito: false },
  ];
  const state = { request };
  const calls = { contains: [], request: [], messages: [], statuses: [], writes: 0, order: [] };
  const chromeStub = {
    storage: {
      local: {
        get: async () => ({ batch_progress: null }),
        set: async () => { calls.writes++; },
      },
    },
    tabs: { query: async () => tabs },
    permissions: {
      contains: async (query) => { calls.contains.push(query); return contains; },
      request: async (query) => {
        calls.request.push(query);
        calls.order.push("request");
        if (state.request instanceof Error) throw state.request;
        return state.request;
      },
    },
    runtime: {
      lastError: null,
      sendMessage: async (message) => {
        calls.messages.push(message);
        calls.order.push("send");
        if (calls.failSend) throw new Error("dispatch failed");
        return { status: "started" };
      },
    },
  };
  const source = await getPopupBatchSetupSource();
  const factory = new Function(
    "$id", "t", "setBtnIcon", "chrome", "showStatus", "batchIsRunning",
    "BATCH_STALE_TTL", "getSettingsStorage", "pbpApplySecretOverlay", "pbpReadBookmarkConnection",
    "deobfuscateKey", "settings", "hasAIKey", "wireBatchProgress", "setTimeout",
    "_aiTargetOriginPattern", "pbpPinboardAccountFromToken", "document", "pbpAiResolveTarget",
    source + "\nreturn { setupTabSet, getPending: () => batchAiPermissionPending };"
  );
  const api = factory(
    (id) => elements[id] || null,
    (key, ...args) => args.length ? key + ":" + args.join(":") : key,
    (button, _icon, label) => { button.label = label; },
    chromeStub,
    (id, message, kind) => calls.statuses.push({ id, message, kind }),
    () => false,
    BATCH_STALE_TTL,
    async () => ({ get: async () => ({ pinboardToken: "token" }) }),
    async (value) => value,
    async () => ({ service:"pinboard", token:"alice:token", account:"alice" }),
    (value) => value,
    { aiProvider: "openai", batchAiTags: ai, batchAiSummary: false, batchSkipExisting: skip },
    () => true,
    () => {},
    () => 0,
    () => "https://api.example/*",
    pbpPinboardAccountFromToken,
    document,
    (s) => stubResolveTarget(s, (key, ...args) => args.length ? key + ":" + args.join(":") : key)
  );
  api.setupTabSet();
  return {
    ...api,
    elements,
    calls,
    setRequest: (value) => { state.request = value; },
    click: () => elements["batch-bookmark-btn"].handlers.click(),
    grant: () => elements["batch-permission-grant"].handlers.click(),
    cancel: () => elements["batch-permission-cancel"].handlers.click(),
  };
}

async function createUiHarness(storedProgress, now, opts = {}) {
  if (storedProgress) storedProgress = { account: "alice", ...storedProgress };
  // documentElement mirrors a page that never marks motion-ready, so the
  // progress teardown stays on its synchronous .hidden path under test.
  const documentStub = { activeElement: null, documentElement: { classList: { contains: () => false } } };
  const elements = {
    "batch-bookmark-btn": fakeElement(),
    "batch-progress": fakeElement(),
    "batch-progress-fill": fakeElement(),
    "batch-progress-text": fakeElement(),
    "batch-cancel-btn": fakeButton(),
  };
  elements["batch-cancel-btn"].querySelector = () => ({ innerHTML: "" });
  elements["batch-bookmark-btn"].focus = function () { this.focused = true; documentStub.activeElement = this; };
  elements["batch-progress"].focus = function () { this.focused = true; documentStub.activeElement = this; };
  const statuses = [];
  const writes = [];
  const dismissed = [];
  let timer = null;
  const chromeStub = {
    storage: {
      onChanged: { addListener: () => {} },
      local: {
        get: async () => ({ batch_progress: storedProgress }),
        set: async (value) => {
          if (opts.setReject && !opts.setRejectOnce?.done) {
            if (opts.setRejectOnce) opts.setRejectOnce.done = true;
            throw new Error("storage unavailable");
          }
          writes.push(value);
        },
      },
    },
  };
  const source = await getPopupBatchProgressSource();
  const factory = new Function(
    "$id", "PBP_ICONS", "t", "showStatus", "setBtnIcon", "setTimeout",
    "chrome", "batchIsRunning", "BATCH_STALE_TTL", "Date", "document", "readBatchAccount", "pbpDismissRemedyStatus",
    source + "\nreturn { renderBatchProgress, wireBatchProgress };"
  );
  const api = factory(
    (id) => elements[id] || null,
    PBP_ICONS,
    (key, ...args) => args.length ? `${key}:${args.join(":")}` : key,
    (id, message, kind, opts) => statuses.push({ id, message, kind, remedy: opts?.remedy === true, key: opts?.key }),
    (button, _icon, label) => { button.label = label; },
    (callback) => { timer = callback; return 0; },
    chromeStub,
    batchIsRunning,
    BATCH_STALE_TTL,
    { now: () => now },
    documentStub,
    async () => ({ token: "alice:token", account: "alice" }),
    (key) => dismissed.push(key)
  );
  return {
    ...api,
    renderBatchProgress: (progress) => api.renderBatchProgress({ account: "alice", ...progress }, "alice"),
    elements, statuses, writes, dismissed, runTimer: () => timer?.()
  };
}

(async () => {
  for (const path of ["quick", "batch"]) {
    await test(path + " save preserves self-hosted tag names with spaces, quotes and backslashes", async () => {
      const names = ["machine learning", 'say"hello', "path\\name"];
      for (const service of ["karakeep", "linkding"]) {
        const h = await createSaveTagsHarness(service, names);
        const result = await h[path]();
        equal(JSON.stringify(h.calls.names), JSON.stringify([names]), service + " changed tag names");
        if (path === "quick") equal(result.status, "saved");
        else equal(h.calls.progress.at(-1).saved, 1, service + " batch did not save");
      }
    });

    await test(path + " Pinboard save keeps quote tags and the legacy posts/add URI", async () => {
      const h = await createSaveTagsHarness("pinboard", ['say"hello', "plain", "path\\name"]);
      const result = await h[path]();
      equal(h.calls.intents.length, 1, "Pinboard intent was rejected");
      equal(h.calls.intents[0].tags, 'say"hello plain path\\name');
      equal(h.calls.uris[0], "https://api.pinboard.in/v1/posts/add?auth_token=fixture-token&format=json&url=https%3A%2F%2Fexample.com%2Ftags&description=Tags&extended=&tags=say%22hello%20plain%20path%5Cname&shared=yes&toread=no&replace=no");
      if (path === "quick") equal(result.status, "saved");
      else equal(h.calls.progress.at(-1).saved, 1, "Pinboard batch did not save");
    });
  }
  // Y3-01: tab ids do not survive a browser restart. A resumed run must find
  // each page again by its address; a fresh run must not pay for tabs.query.
  {
    const snap = [{id:812, url:"https://example.com/a", title:"A"}, {id:6, url:"https://example.com/b", title:"B"}, {id:813, url:"https://example.com/c", title:"C"}];
    const live = [{id:5, url:"https://example.com/a"}, {id:6, url:"https://example.com/other"}, {id:7, url:"https://example.com/b"}, {id:9, url:"https://example.com/c", incognito:true}];
    await test("a resumed batch extracts from the restored tab, not the dead or reassigned snapshot id", async () => {
      const h = await createSaveTagsHarness("pinboard", ["x"], {tabs:snap, liveTabs:live.slice(0, 3)});
      await h.resume(0);
      equal(h.calls.extracted.map(e => e.tabId).join(), "5,7,813", "extraction targets");
      const last = h.calls.progress.at(-1);
      equal(last.aiFailed, 1, "only the tab with no live twin should degrade");
      equal(h.calls.queries, 1, "tabs.query is read once per resume");
    });
    await test("a resumed batch matches window kind and gives each live tab to one entry", async () => {
      const twins = [{id:100, url:"https://example.com/a", title:"A1"}, {id:101, url:"https://example.com/a", title:"A2"}, {id:102, url:"https://example.com/c", title:"C", incognito:true}];
      const h = await createSaveTagsHarness("pinboard", ["x"], {tabs:twins, liveTabs:[{id:5, url:"https://example.com/a"}, {id:8, url:"https://example.com/a"}, {id:4, url:"https://example.com/c"}, {id:9, url:"https://example.com/c", incognito:true}]});
      await h.resume(0);
      equal(h.calls.extracted.map(e => e.tabId).join(), "5,8,9");
    });
    await test("a resumed batch with no matching tab degrades per item as before", async () => {
      const h = await createSaveTagsHarness("pinboard", ["x"], {tabs:snap.slice(0, 1), liveTabs:[{id:6, url:"https://example.com/zzz"}]});
      await h.resume(0);
      equal(h.calls.extracted[0].tabId, 812);
      equal(h.calls.progress.at(-1).aiFailed, 1);
      equal(h.calls.progress.at(-1).saved, 1, "the bare bookmark is still saved");
    });
    await test("a fresh batch never calls tabs.query and keeps the snapshot ids", async () => {
      const h = await createSaveTagsHarness("pinboard", ["x"], {tabs:snap.slice(0, 1), liveTabs:[{id:812, url:"https://example.com/a"}]});
      await h.batch();
      equal(h.calls.queries, 0);
      equal(h.calls.extracted[0].tabId, 812);
    });
  }
  for (const service of ["karakeep", "linkding"]) {
    const threeTabs = [1, 2, 3].map(n => ({id:n, url:"https://example.com/p" + n, title:"P" + n}));
    await test(service + " batch skip mode keeps going when a same-account bookmark setting write bumps the epoch", async () => {
      const h = await createSaveTagsHarness(service, ["a"], {tabs:threeTabs, settings:{batchSkipExisting:true}, lookupAware:true,
        onSave:(state, n) => { if (n === 1) state.epoch++; }});
      await h.batch();
      const last = h.calls.progress.at(-1);
      equal(last.error, null, "run was stopped");
      equal(last.saved, 3, "not every tab saved");
      equal(h.calls.intents.length, 3);
    });
    await test(service + " batch stops without lookup or save when the account really changes", async () => {
      const h = await createSaveTagsHarness(service, ["a"], {tabs:threeTabs, settings:{batchSkipExisting:true}, lookupAware:true,
        onSave:(state, n) => { if (n === 1) state.account = "someone-else"; }});
      await h.batch();
      const last = h.calls.progress.at(-1);
      equal(last.error, "account_changed");
      equal(last.saved, 1);
      equal(h.calls.intents.length, 1, "saved after the account changed");
      equal(h.calls.lookups.length, 1, "looked up after the account changed");
    });
  }
  await test("Batch AI origins are exact, deduplicated, ceiling-filtered, and include the provider", async () => {
    const h = await createPermissionHarness();
    // Roadmap #33: the optional_host_permissions ceiling is https + literal-
    // loopback http only. A plain-http origin in the request list would make
    // the WHOLE permissions.request throw, so it must be filtered out here
    // (the tab still saves; only its AI extraction degrades). Loopback http
    // stays requestable (local Ollama precedent).
    const origins = h.batchAiPermissionOrigins([
      { url: "https://one.example/a" },
      { url: "https://one.example/b" },
      { url: "http://two.example:8080/c" },
      { url: "http://127.0.0.1:3000/dev" },
    ], {});
    equal(origins.join(","), "https://one.example/*,http://127.0.0.1:3000/*,https://api.example/*");
  });

  await test("permission rows disclose every origin and name the AI provider", async () => {
    const h = await createPermissionHarness();
    const origins = Array.from({ length: 12 }, (_, i) => "https://site-" + (i + 1) + ".example/*");
    origins.push("https://api.example/*");
    const rows = h.batchAiPermissionRows(origins, { aiProvider: "openai" });
    equal(rows.length, 13, "full list was truncated");
    assert(rows[10].includes("site-11.example"), "eleventh site missing");
    assert(rows[12].includes("provOpenai") && rows[12].includes("https://api.example"), "provider is not named");
  });

  await test("permission rows name a custom entry by its user-given name", async () => {
    const h = await createPermissionHarness("https://b.example/*", { realResolver: true });
    const B = { id: "custom-bbbbbb", name: "Relay B", protocol: "openai", baseUrl: "https://b.example/v1", model: "mb", slot: 2 };
    const C = { id: "custom-cccccc", name: "Relay C", protocol: "anthropic", baseUrl: "https://c.example/v1", model: "mc", slot: 3 };
    const chainBase = {
      ...SETTINGS_DEFAULTS, aiProvider: "openai", openaiApiKey: "k",
      customDisplayName: "Relay A", customBaseUrl: "https://a.example/v1", customApiKey: "ka", customModel: "ma",
      aiCustomProviders: [B, C],
      customApiKey2: pbpAiCustomKeySeal(B, "kb"), customApiKey3: pbpAiCustomKeySeal(C, "kc"),
    };
    const rows = h.batchAiPermissionRows(["https://one.example/*", "https://b.example/*"], { ...chainBase, aiProvider: "custom-bbbbbb" });
    assert(rows[1].includes("Relay B") && rows[1].includes("https://b.example"), "the entry is not named: " + rows[1]);
    assert(!rows[1].includes("custom-bbbbbb") && !rows[1].includes("provCustom-bbbbbb"), "the raw id leaked: " + rows[1]);
  });

  await test("first AI click snapshots tabs and origins without requesting or starting", async () => {
    const h = await createBatchClickHarness();
    await h.click();
    equal(h.calls.request.length, 0);
    equal(h.calls.messages.length, 0);

    const staleDone = await createUiHarness({ running: false, done: true, total: 2, saved: 0, queued: 2, failed: 0, ts: 1 }, 200000);
    staleDone.wireBatchProgress();
    await Promise.resolve(); await Promise.resolve();
    equal(staleDone.statuses.length, 0, "stale completion should stay hidden");
  });
})();
</script>
