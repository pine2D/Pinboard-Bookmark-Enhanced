<!DOCTYPE html>

<script>
const resultsEl = document.getElementById("results");
let passed = 0, failed = 0;

async function test(name, fn) {
  const done = pbpCaseGate(name);
  if (!done) return;
  const div = document.createElement("div");
  try {
    await fn();
    passed++;
    div.className = "case pass";
    div.textContent = "PASS " + name;
  } catch (err) {
    failed++;
    div.className = "case fail";
    div.textContent = "FAIL " + name + "\n  " + (err && err.stack ? err.stack : err);
  }
  resultsEl.appendChild(div);
  done();
}

function assert(cond, msg) {
  if (!cond) throw new Error(msg || "assertion failed");
}

function makeTestWav(frameCount = 320, sampleRate = 16000) {
  const samples = new Float32Array(frameCount);
  for (let i = 0; i < frameCount; i++) {
    samples[i] = Math.sin((2 * Math.PI * 440 * i) / sampleRate) * 0.5;
  }
  return pbpAsrEncodePcm16Wav(samples, sampleRate);
}

// Live synthetic DeepSeek /v1/tools/tts 44-byte streaming WAV header captured on 2026-11-15
// (24000 Hz, 1-ch 16-bit PCM; streaming RIFF size = 0xffffffff and data size = 0xffffffff).
const DEEPSEEK_TTS_LIVE_WAV_HEADER_20261115 = "52494646ffffffff57415645666d74201000000001000100c05d000080bb00000200100064617461ffffffff";

function makeDeepseekLiveStreamingWav(frameCount = 240) {
  const out = new Uint8Array(44 + frameCount * 2);
  for (let i = 0; i < 44; i++) {
    out[i] = parseInt(DEEPSEEK_TTS_LIVE_WAV_HEADER_20261115.slice(i * 2, i * 2 + 2), 16);
  }
  const view = new DataView(out.buffer);
  for (let i = 0; i < frameCount; i++) {
    const s = Math.sin((2 * Math.PI * 440 * i) / 24000) * 0.35;
    view.setInt16(44 + i * 2, Math.round(s * 32767), true);
  }
  return out;
}

// Live synthetic DeepSeek /v1/tools/asr response captured on 2026-11-15 via authorized smoke verification
// (16 kHz 16-bit mono WAV resampled from synthetic "Hello world." TTS clip).
const DEEPSEEK_ASR_LIVE_20261115 = '{"request_id":"f57300dd-1966-4ead-be7b-babfb6a3ae0d","text":"Hello world.","duration_ms":1240}';
const ASR_FIXTURE_BODY = "\n\n" + '{"request_id":"req_asr_20261113_01","text":"Summarize the key empirical findings.","duration_ms":2450}';

(async () => {
  const en = await (await fetch("../_locales/en/messages.json")).json();
  chrome.i18n = pbpChromeMock.create({ messages: en }).chrome.i18n;
  applyI18n();
  await pbpTtsCacheClear();

  await test("1. pbpDeepseekTtsResolveLang gates strictly to the 10 supported DeepSeek TTS languages", () => {
    for (const [code, expected] of [
      ["zh-CN", "zh"], ["cmn-Hans", "zh"], ["yue", "yue"], ["zh-yue", "yue"],
      ["en-US", "en"], ["ja", "ja"], ["ko-KR", "ko"], ["ms", "ms"],
      ["ar-SA", "ar"], ["id", "id"], ["in-ID", "id"], ["th", "th"], ["vi", "vi"],
    ]) {
      assert(pbpDeepseekTtsResolveLang(code, "hello") === expected, `expected ${code} -> ${expected}`);
    }
    for (const unsupported of ["de", "de-DE", "fr", "es", "it", "pt", "nl", "pl", "ru", "sv"]) {
      assert(pbpDeepseekTtsResolveLang(unsupported, "Schadenfreude") === "", `expected ${unsupported} -> ""`);
    }
    // Ambiguous Latin with missing/und language must NOT guess English (could be de/fr/pl)
    assert(pbpDeepseekTtsResolveLang("und", "Schadenfreude") === "", "und Latin must fall back to browser");
    assert(pbpDeepseekTtsResolveLang("", "bonjour") === "", "empty lang Latin must fall back to browser");
    // Unambiguous non-Latin scripts with und resolve safely
    assert(pbpDeepseekTtsResolveLang("und", "かな") === "ja", "Kana -> ja");
    assert(pbpDeepseekTtsResolveLang("und", "한글") === "ko", "Hangul -> ko");
    assert(pbpDeepseekTtsResolveLang("und", "ภาษาไทย") === "th", "Thai -> th");
    assert(pbpDeepseekTtsResolveLang("und", "العربية") === "ar", "Arabic -> ar");
    assert(pbpDeepseekTtsResolveLang("und", "图书馆") === "zh", "Han -> zh");
  });

  await test("2. pbpValidateWavBytes accepts valid and live-captured streaming (0xffffffff) PCM WAV and rejects JSON-200, truncated, unaligned, or empty-data payloads", async () => {
    const validWav = makeTestWav(160, 24000);
    const res = pbpValidateWavBytes(validWav);
    assert(res.ok === true && res.sampleRate === 24000 && res.channels === 1, "valid WAV rejected");

    const liveStreamingWav = makeDeepseekLiveStreamingWav(240);
    const streamRes = pbpValidateWavBytes(liveStreamingWav);
    assert(streamRes.ok === true && streamRes.sampleRate === 24000 && streamRes.channels === 1
      && streamRes.audioFormat === 1 && streamRes.blockAlign === 2 && streamRes.bitsPerSample === 16
      && streamRes.dataOffset === 44 && streamRes.dataSize === 480, "live 0xffffffff streaming WAV rejected: " + JSON.stringify(streamRes));

    for (const tornBytes of [1, 3, 481]) {
      const torn = new Uint8Array(44 + tornBytes);
      torn.set(liveStreamingWav.subarray(0, 44), 0);
      const tornRes = pbpValidateWavBytes(torn);
      assert(tornRes.ok === false && tornRes.reason === "unaligned_data", `streaming WAV with ${tornBytes} trailing byte(s) must fail frame alignment`);
      const cachedTorn = await pbpTtsCachePut({ voice: "stella", lang: "en", text: "torn", wavBytes: torn });
      assert(cachedTorn === null, `torn ${tornBytes}-byte streaming WAV must never enter pbp-tts-cache`);
    }

    const jsonErr = new TextEncoder().encode('{"error":{"message":"rate limit exceeded"}}');
    assert(pbpValidateWavBytes(jsonErr).ok === false, "JSON body must be rejected");

    const tooShort = validWav.slice(0, 30);
    assert(pbpValidateWavBytes(tooShort).ok === false, "short header must be rejected");

    const truncatedData = validWav.slice(0, validWav.byteLength - 10);
    assert(pbpValidateWavBytes(truncatedData).ok === false, "truncated data chunk must be rejected");

    const emptyWav = pbpAsrEncodePcm16Wav(new Float32Array(0), 16000);
    assert(pbpValidateWavBytes(emptyWav).ok === false, "zero-frame WAV must be rejected");
  });

  await test("3. pbp-tts-cache hashes keys (no plaintext headwords stored), enforces LRU caps, measures, and clears", async () => {
    await pbpTtsCacheClear();
    const wavA = makeTestWav(200, 16000);
    const wavB = makeTestWav(240, 16000);
    const wavC = makeTestWav(280, 16000);

    const keyA = await pbpTtsCacheKey("stella", "en", "serendipity");
    assert(/^[0-9a-f]{64}$/.test(keyA), "expected 64-hex SHA-256 key");
    const keyTide = await pbpTtsCacheKey("tide", "en", "serendipity");
    assert(keyA !== keyTide, "different voices must not collide");

    const savedA = await pbpTtsCachePut({ voice: "stella", lang: "en", text: "serendipity", wavBytes: wavA }, { now: 1000, maxEntries: 2 });
    assert(savedA && !("text" in savedA) && !JSON.stringify(savedA).includes("serendipity"), "plaintext term leaked into IDB record");

    await pbpTtsCachePut({ voice: "stella", lang: "ja", text: "木漏れ日", wavBytes: wavB }, { now: 2000, maxEntries: 2 });
    // Touch serendipity at t=3000 so 木漏れ日 becomes the oldest LRU entry
    const hitA = await pbpTtsCacheGet("stella", "en", "serendipity", { now: 3000 });
    assert(hitA && hitA.wavBytes.byteLength === wavA.byteLength, "expected cache hit for serendipity");

    await pbpTtsCachePut({ voice: "tide", lang: "zh", text: "醍醐灌顶", wavBytes: wavC }, { now: 4000, maxEntries: 2 });
    const evictedB = await pbpTtsCacheGet("stella", "ja", "木漏れ日", { touch: false });
    const keptA = await pbpTtsCacheGet("stella", "en", "serendipity", { touch: false });
    assert(evictedB === null && keptA !== null, "LRU eviction failed to keep touched entry");

    const stats = await pbpTtsCacheMeasure();
    assert(stats.count === 2 && stats.bytes > wavA.byteLength + wavC.byteLength, "measure mismatch: " + JSON.stringify(stats));
    const cleared = await pbpTtsCacheClear();
    assert(!cleared.failed && cleared.count === 2 && cleared.freed === stats.bytes, "clear mismatch");
    const after = await pbpTtsCacheMeasure();
    assert(after.count === 0 && after.bytes === 0, "cache not empty after clear");
  });

  function installMockSpeechSynthesis(mockSynth) {
    const ownDesc = Object.getOwnPropertyDescriptor(window, "speechSynthesis");
    Object.defineProperty(window, "speechSynthesis", { configurable: true, writable: true, value: mockSynth });
    return () => {
      if (ownDesc) Object.defineProperty(window, "speechSynthesis", ownDesc);
      else delete window.speechSynthesis;
    };
  }

  await test("4. pbpDictSpeak with default browser voice stays synchronous on speechSynthesis with zero network calls", async () => {
    let restoreSynth = () => {};
    const origUtt = window.SpeechSynthesisUtterance;
    const origFetch = window.fetch;
    let spoken = [];
    let fetches = 0;
    try {
      window.SpeechSynthesisUtterance = function (txt) { this.text = txt; this.lang = ""; this.voice = null; };
      restoreSynth = installMockSpeechSynthesis({
        cancel() {},
        getVoices: () => [{ lang: "en-US", localService: true, name: "Local EN" }],
        speak(u) { spoken.push(u); },
        addEventListener() {},
        removeEventListener() {},
      });
      window.fetch = async () => { fetches++; throw new Error("unexpected network call"); };
      await chrome.storage.local.set({ dictTtsVoice: "browser", deepseekApiKey: "sk-test-key" });
      await pbpDictRefreshTtsConfig();

      const ret = pbpDictSpeak("ephemeral", "en-US");
      assert(ret === undefined, "browser voice path should stay synchronous");
      assert(spoken.length === 1 && spoken[0].text === "ephemeral" && spoken[0].lang === "en", "browser speech utterance mismatch");
      assert(fetches === 0, "browser voice must not call fetch");
    } finally {
      restoreSynth();
      window.SpeechSynthesisUtterance = origUtt;
      window.fetch = origFetch;
    }
  });

  await test("5. pbpDictSpeak with DeepSeek Stella fetches /v1/tools/tts WAV once and replays warm cache with zero network calls", async () => {
    await pbpTtsCacheClear();
    const origFetch = window.fetch;
    const origAudio = window.Audio;
    let restoreSynth = () => {};
    const origContains = chrome.permissions.contains;
    const wavFixture = makeDeepseekLiveStreamingWav(240);
    const calls = [];
    const playedSrcs = [];
    let browserSpoken = 0;
    try {
      restoreSynth = installMockSpeechSynthesis({
        cancel() {},
        getVoices: () => [{ lang: "en-US", localService: true }],
        speak() { browserSpoken++; },
        addEventListener() {},
        removeEventListener() {},
      });
      chrome.permissions.contains = async () => true;
      window.Audio = function () {
        this.src = "";
        this.play = async () => { playedSrcs.push(this.src); };
        this.pause = () => {};
        this.removeAttribute = () => { this.src = ""; };
        this.load = () => {};
      };
      window.fetch = async (url, init) => {
        calls.push({ url, init, body: JSON.parse(init.body) });
        return new Response(wavFixture, { status: 200, headers: { "Content-Type": "audio/wav" } });
      };
      await chrome.storage.local.set({ dictTtsVoice: "stella", deepseekApiKey: obfuscateKey("sk-tts-live") });
      await pbpDictRefreshTtsConfig();

      await pbpDictSpeak("ephemeral", "en-US");
      assert(calls.length === 1, "expected 1 TTS API call on cold miss");
      assert(calls[0].url === "https://api.deepseek.com/v1/tools/tts", "wrong TTS endpoint");
      assert(calls[0].init.credentials === "omit" && calls[0].init.redirect === "error", "credentials/redirect policy mismatch");
      assert(calls[0].init.headers.Authorization === "Bearer sk-tts-live", "missing Bearer header");
      assert(calls[0].body.text === "ephemeral" && calls[0].body.voice_id === "stella"
        && calls[0].body.format === "wav" && calls[0].body.filter_markdown === true, "TTS request body mismatch");
      assert(playedSrcs.length === 1 && browserSpoken === 0, "expected Audio playback without browser fallback");

      // Second click on same headword must hit local IDB cache with zero network requests
      await pbpDictSpeak("ephemeral", "en-US");
      assert(calls.length === 1, "warm cache replay must not hit network");
      assert(playedSrcs.length === 2 && browserSpoken === 0, "expected warm Audio replay");
    } finally {
      pbpDictStopSpeak();
      window.fetch = origFetch;
      window.Audio = origAudio;
      restoreSynth();
      chrome.permissions.contains = origContains;
      await pbpTtsCacheClear();
    }
  });

  await test("6. pbpDictSpeak with DeepSeek Tide silently falls back to browser speech for unsupported langs, >500 chars, missing key, or invalid WAV", async () => {
    await pbpTtsCacheClear();
    const origFetch = window.fetch;
    let restoreSynth = () => {};
    const origUtt = window.SpeechSynthesisUtterance;
    const origContains = chrome.permissions.contains;
    let fetches = 0;
    let spoken = [];
    try {
      window.SpeechSynthesisUtterance = function (txt) { this.text = txt; this.lang = ""; };
      restoreSynth = installMockSpeechSynthesis({
        cancel() {},
        getVoices: () => [{ lang: "de-DE", localService: true }],
        speak(u) { spoken.push(u.text); },
        addEventListener() {},
        removeEventListener() {},
      });
      chrome.permissions.contains = async () => true;
      window.fetch = async () => {
        fetches++;
        return new Response('{"error":"bad wav"}', { status: 200, headers: { "Content-Type": "application/json" } });
      };
      await chrome.storage.local.set({ dictTtsVoice: "tide", deepseekApiKey: "sk-tts-live" });
      await pbpDictRefreshTtsConfig();

      // Unsupported language (German, Polish) -> zero network calls, immediate browser fallback
      pbpDictSpeak("Zeitgeist", "de");
      pbpDictSpeak("chrząszcz", "pl");
      assert(fetches === 0 && spoken.length === 2, "unsupported languages must skip network and speak via browser");

      // > 500 characters -> zero network calls, immediate browser fallback
      pbpDictSpeak("a".repeat(501), "en");
      assert(fetches === 0 && spoken.length === 3, ">500 chars must skip network and speak via browser");

      // Corrupt HTTP 200 JSON response -> rejected by pbpValidateWavBytes, falls back to browser speech
      await pbpDictSpeak("resilience", "en");
      assert(fetches === 1 && spoken.length === 4, "invalid WAV payload must fall back to browser speech");

      // Missing API key -> zero additional network calls, falls back to browser speech
      await chrome.storage.local.set({ dictTtsVoice: "tide", deepseekApiKey: "" });
      await pbpDictRefreshTtsConfig();
      await pbpDictSpeak("eloquence", "en");
      assert(fetches === 1 && spoken.length === 5, "missing key must fall back to browser speech without network");
    } finally {
      pbpDictStopSpeak();
      window.fetch = origFetch;
      restoreSynth();
      window.SpeechSynthesisUtterance = origUtt;
      chrome.permissions.contains = origContains;
    }
  });

  await test("7. pbpDictStopSpeak aborts in-flight DeepSeek TTS without triggering browser fallback", async () => {
    const origFetch = window.fetch;
    let restoreSynth = () => {};
    const origContains = chrome.permissions.contains;
    let aborted = false;
    let browserSpoken = 0;
    try {
      restoreSynth = installMockSpeechSynthesis({
        cancel() {},
        getVoices: () => [{ lang: "en-US", localService: true }],
        speak() { browserSpoken++; },
        addEventListener() {},
        removeEventListener() {},
      });
      chrome.permissions.contains = async () => true;
      window.fetch = (_url, init) => new Promise((_resolve, reject) => {
        init.signal.addEventListener("abort", () => {
          aborted = true;
          reject(new DOMException("Aborted", "AbortError"));
        });
      });
      await chrome.storage.local.set({ dictTtsVoice: "stella", deepseekApiKey: obfuscateKey("sk-tts-live") });
      await pbpDictRefreshTtsConfig();

      const pending = pbpDictSpeak("cancellable", "en");
      await new Promise((r) => setTimeout(r, 10));
      pbpDictStopSpeak();
      await pending;
      assert(aborted === true, "in-flight TTS fetch was not aborted");
      assert(browserSpoken === 0, "explicit stop must NOT fall back to browser speech");
    } finally {
      window.fetch = origFetch;
      restoreSynth();
      chrome.permissions.contains = origContains;
    }
  });

  await test("8. pbpAsrMixToMono + pbpAsrDownsampleFloat32 + pbpAsrEncodePcm16Wav produce valid 16 kHz mono 16-bit PCM WAV", () => {
    const left = new Float32Array(4800).fill(0.5);
    const right = new Float32Array(4800).fill(-0.5);
    const silentMono = pbpAsrMixToMono([left, right]);
    assert(silentMono.length === 4800 && Math.abs(silentMono[0]) < 1e-6, "stereo average should cancel opposite phases");

    const pulse48k = new Float32Array(4800);
    for (let i = 0; i < 4800; i++) pulse48k[i] = i < 2400 ? 1.5 : -1.5; // tests clamping too
    const mono16k = pbpAsrDownsampleFloat32(pulse48k, 48000, 16000);
    assert(mono16k.length === 1600, "48kHz -> 16kHz 0.1s should yield 1600 samples, got " + mono16k.length);

    const wav = pbpAsrEncodePcm16Wav(mono16k, 16000);
    assert(wav.byteLength === 44 + 1600 * 2, "unexpected WAV byteLength: " + wav.byteLength);
    const check = pbpValidateWavBytes(wav);
    assert(check.ok && check.sampleRate === 16000 && check.channels === 1, "encoded WAV failed validation");
    const view = new DataView(wav.buffer, wav.byteOffset, wav.byteLength);
    assert(view.getInt16(44, true) === 32767, "positive clamp should hit +32767");
    assert(view.getInt16(44 + 1599 * 2, true) === -32768, "negative clamp should hit -32768");
  });

  await test("9. pbpAsrBuildFormData includes strictly a single named WAV file field", () => {
    const wav = makeTestWav(160, 16000);
    const fd = pbpAsrBuildFormData(wav, "clip.wav");
    const entries = Array.from(fd.entries());
    assert(entries.length === 1 && entries[0][0] === "file", "expected strictly 1 'file' field, got: " + entries.map((e) => e[0]).join(","));
    const f = entries[0][1];
    assert(f instanceof Blob && f.type === "audio/wav" && f.size === wav.byteLength, "WAV Blob metadata mismatch");
    if (typeof File === "function") assert(f.name === "clip.wav", "expected file name clip.wav");
  });

  await test("10. pbpAsrParseResponse handles live-captured ASR payload, leading keepalive newlines, and HTTP 200 error envelopes", () => {
    const liveOk = pbpAsrParseResponse(200, DEEPSEEK_ASR_LIVE_20261115);
    assert(liveOk.ok === true && liveOk.text === "Hello world."
      && liveOk.requestId === "f57300dd-1966-4ead-be7b-babfb6a3ae0d" && liveOk.durationMs === 1240, "live ASR fixture parse failed");

    const ok = pbpAsrParseResponse(200, ASR_FIXTURE_BODY);
    assert(ok.ok === true && ok.text === "Summarize the key empirical findings."
      && ok.requestId === "req_asr_20261113_01" && ok.durationMs === 2450, "valid ASR fixture parse failed");

    const err200 = pbpAsrParseResponse(200, '\n{"error":{"message":"audio duration exceeds limit"}}');
    assert(err200.ok === false && err200.code === "api_error", "HTTP 200 error object must fail");

    const auth401 = pbpAsrParseResponse(401, '{"error":{"message":"invalid api key"}}');
    assert(auth401.ok === false && auth401.code === "auth", "401 must map to auth");

    const big413 = pbpAsrParseResponse(413, "");
    assert(big413.ok === false && big413.code === "too_large", "413 must map to too_large");
  });

  await test("11. pbpAsrInsertTranscript inserts with smart Latin/CJK spacing, respects maxLength, and fires input", () => {
    const ta = document.createElement("textarea");
    ta.maxLength = 30;
    document.body.appendChild(ta);
    let inputEvents = 0;
    ta.addEventListener("input", () => { inputEvents++; });
    try {
      assert(pbpAsrInsertTranscript(ta, "Hello") === true && ta.value === "Hello", "initial insert failed");
      assert(pbpAsrInsertTranscript(ta, "world") === true && ta.value === "Hello world", "Latin space separator failed: " + ta.value);

      ta.value = "你好";
      ta.setSelectionRange(2, 2);
      assert(pbpAsrInsertTranscript(ta, "世界") === true && ta.value === "你好世界", "CJK insert should not inject ASCII spaces: " + ta.value);

      ta.maxLength = 10;
      ta.value = "12345678";
      ta.setSelectionRange(8, 8);
      assert(pbpAsrInsertTranscript(ta, "abcdef") === true && ta.value.length === 10, "maxLength cap ignored: " + ta.value);
      assert(inputEvents === 4, "expected 4 bubbling input events, got " + inputEvents);
    } finally {
      ta.remove();
    }
  });

  await test("12. Ask #ask-mic records, stops tracks before network upload finishes, and appends editable text without submitting", async () => {
    const origFetch = window.fetch;
    const origMediaDevices = navigator.mediaDevices;
    const origRecorder = window.MediaRecorder;
    const origContains = chrome.permissions.contains;
    let trackStopped = false;
    let trackStoppedBeforeUpload = false;
    let submitted = false;
    try {
      chrome.permissions.contains = async () => true;
      await chrome.storage.local.set({
        previewAiEnabled: true,
        aiProvider: "deepseek",
        deepseekApiKey: obfuscateKey("sk-asr-key"),
        readerVoiceInputEnabled: false,
      });
      _pbpAiSettingsPromise = null;
      await pbpSpeechRefreshConfig();

      const view = document.getElementById("rendered-view");
      view.innerHTML = '<p>First paragraph for highlight note dictation.</p><p>Second paragraph for item switch guard.</p>';
      pbpAiIndexBlocks(view);
      const detail = { url: "https://example.com/speech", title: "Speech Doc", account: "", markdown: "Hello world." };
      _pbpAiSetupDetail = null;
      await pbpAskInit(detail);
      window.pbpAskOpenPanel("");
      const micBtn = document.getElementById("ask-mic");
      const askInput = document.getElementById("ask-input");
      const askForm = document.getElementById("ask-form");
      assert(micBtn && askInput && askForm, "Ask panel controls missing");

      assert(hlMic && hlMic.hidden === true, ".hl-card-mic must stay hidden when deepseekApiKey is empty");

      await chrome.storage.local.set({ deepseekApiKey: obfuscateKey("sk-asr-ready") });
      await pbpSpeechRefreshConfig();
      assert(askMic.hidden === false && hlMic.hidden === false, "mic buttons must unhide once deepseekApiKey is configured");

      await chrome.storage.local.set({ deepseekApiKey: "" });
      await pbpSpeechRefreshConfig();
      assert(askMic.hidden === true && hlMic.hidden === true, "removing deepseekApiKey must re-hide mic buttons");
    } finally {
      pbpSpeechCancelAll();
      const card = document.getElementById("pb-hl-card");
      if (card?.matches(":popover-open")) card.hidePopover();
      if (typeof _pbpAskSetOpen === "function") _pbpAskSetOpen(false);
    }
  });

  document.title = (failed === 0 ? "PASS" : "FAIL") + ` (${passed}/${passed + failed})`;
})();
</script>
</body></html>
