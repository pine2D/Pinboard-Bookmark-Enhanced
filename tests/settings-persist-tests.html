<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Settings Persistence Tests</title>
<style>
body { font-family: monospace; padding: 16px; max-width: 900px; }
.case { padding: 6px; border-bottom: 1px solid #eee; white-space: pre-wrap; }
.pass { color: #0a0; } .fail { color: #c00; font-weight: bold; } h2 { margin-top: 24px; }
</style></head>
<body>
<h1>Settings persistence robustness tests</h1>
<div id="results"></div>
<script>
// Load options.js helpers without booting the full settings page in this fixture.
document.addEventListener("DOMContentLoaded", (event) => event.stopImmediatePropagation(), { once: true });
</script>
<script src="../shared.js"></script>
<script src="../vocab-store.js"></script>
<script src="../options-backup.js"></script>
<script src="../export-targets.js"></script>
<script src="../options.js"></script>
<script>
const root = document.getElementById("results");
let pass = 0, fail = 0;
function check(name, cond) {
  const ok = !!cond; ok ? pass++ : fail++;
  const div = document.createElement("div");
  div.className = "case " + (ok ? "pass" : "fail");
  div.textContent = `${ok ? "PASS" : "FAIL"}  ${name}`;
  root.appendChild(div);
}
async function run() {
  // ---------- P0: Pinboard proxy preserves native Response.json failures ----------
  {
    const previousChrome = globalThis.chrome;
    try {
      globalThis.chrome = {
        ...(previousChrome || {}),
        runtime: {
          ...((previousChrome && previousChrome.runtime) || {}),
          sendMessage: async () => ({ ok: true, status: 200, text: "not-json" }),
        },
      };
      const invalid = await _pbpOptionsProxyPinboardFetch("https://api.pinboard.in/v1/tags/get", {}, false);
      let invalidRejected = false;
      try { await invalid.json(); } catch (_) { invalidRejected = true; }
      check("P0 Pinboard proxy rejects malformed JSON instead of inventing an empty object", invalidRejected);

      globalThis.chrome.runtime.sendMessage = async () => ({ ok: true, status: 200, text: "" });
      const empty = await _pbpOptionsProxyPinboardFetch("https://api.pinboard.in/v1/tags/get", {}, false);
      let emptyRejected = false;
      try { await empty.json(); } catch (_) { emptyRejected = true; }
      check("P0 Pinboard proxy rejects an empty JSON body", emptyRejected);

      globalThis.chrome.runtime.sendMessage = async () => ({ ok: true, status: 200, text: "{\"tag\":\"2\"}" });
      const valid = await _pbpOptionsProxyPinboardFetch("https://api.pinboard.in/v1/tags/get", {}, false);
      const parsed = await valid.json();
      check("P0 Pinboard proxy still parses valid JSON", parsed && parsed.tag === "2");
    } finally {
      globalThis.chrome = previousChrome;
    }
  }

  // ---------- P0b: the Pinboard request deadline covers the body read ----------
  // Server shape: the 200 response headers arrive and the body then stalls
  // without closing the connection. fetch() settles at the headers, so only a
  // still-armed abort signal can end the caller's await res.text()/.json().
  {
    const previousFetch = globalThis.fetch;
    let init = null;
    try {
      globalThis.fetch = (_url, options) => { init = options; return Promise.resolve({ ok: true, status: 200 }); };
      await new Promise((resolve, reject) => {
        _executePinboardFetch("https://api.pinboard.in/v1/posts/get?auth_token=user:TOKEN0001&format=json",
          { timeoutMs: 40 }, resolve, reject);
      });
      check("P0b Pinboard fetch sends redirect:error with an abort signal",
        !!init && init.redirect === "error" && !!init.signal);
      check("P0b Pinboard deadline is still armed when the response headers arrive",
        !!init && !!init.signal && init.signal.aborted === false);
      await new Promise((resolve) => setTimeout(resolve, 160));
      check("P0b Pinboard deadline fires after the headers settled the fetch promise (body read stays bounded)",
        !!init && !!init.signal && init.signal.aborted === true);
      // The deadline's own rejection value, taken from the platform rather than
      // hand-written, must reach the user as the timeout copy: an expired
      // request classified as "offline" tells the user the wrong story.
      check("P0b the deadline's abort reason is classified as a timeout, not as being offline",
        !!init && !!init.signal &&
        classifyPinboardError(init.signal.reason) === "pinboardErrorTimeout");
    } finally {
      globalThis.fetch = previousFetch;
    }
  }

  // ---------- P0b2: every request-deadline rejection classifies as a timeout ----------
  // Two abort flavours reach classifyPinboardError: AbortSignal.timeout rejects
  // with TimeoutError, a caller-held AbortController with AbortError. Both are
  // "ran out of time"; genuine network failures must stay in the offline class.
  {
    const abortReason = await new Promise((resolve) => {
      const s = AbortSignal.timeout(20);
      s.addEventListener("abort", () => resolve(s.reason), { once: true });
    });
    const ctrl = new AbortController();
    ctrl.abort();
    check("P0b2 both abort flavours of a request deadline map to the timeout copy",
      classifyPinboardError(abortReason) === "pinboardErrorTimeout" &&
      classifyPinboardError(ctrl.signal.reason) === "pinboardErrorTimeout");
    check("P0b2 a genuine network failure still maps to the offline copy",
      classifyPinboardError(new TypeError("Failed to fetch")) === "pinboardErrorOffline");
  }

  // ---------- P0b3: test_pinboard_token's own reply shape classifies by severity ----------
  // background.js's test_pinboard_token handler never hands classifyPinboardError
  // a Response or Error -- a settled fetch gives {ok,status}, a rejected one
  // gives {ok:false,error:"timeout"|"network"} with no status at all. This is
  // the one call popup.js's login submit and options-connectivity.js's Test
  // button both make, so K155 (429/5xx/timeout/network no longer read as "bad
  // token") is proven once here for both surfaces.
  {
    check("P0b3 a rate-limited reply is not blamed on the token",
      pbpPinboardTestErrorKey({ ok: false, status: 429 }) === "pinboardErrorRateLimit");
    check("P0b3 a 5xx reply is not blamed on the token",
      pbpPinboardTestErrorKey({ ok: false, status: 503 }) === "pinboardErrorServer");
    check("P0b3 a rejected fetch with no status still classifies as a timeout, not offline",
      pbpPinboardTestErrorKey({ ok: false, error: "timeout" }) === "pinboardErrorTimeout");
    check("P0b3 a rejected fetch with no status still classifies as offline",
      pbpPinboardTestErrorKey({ ok: false, error: "network" }) === "pinboardErrorOffline");
    check("P0b3 a real 401 auth rejection keeps the existing copy",
      pbpPinboardTestErrorKey({ ok: false, status: 401 }) === "loginFailed");
    check("P0b3 an unclassified status keeps the existing copy rather than claiming offline",
      pbpPinboardTestErrorKey({ ok: false, status: 404 }) === "loginFailed");
  }

  // ---------- P0c: free-text setting lists stay under the sync per-item cap ----------
  // persistSettings writes every non-chunked key in ONE storage.set(), so a
  // single value over QUOTA_BYTES_PER_ITEM (8192) rejects the whole batch.
  {
    const clamp = typeof pbpParamListClamp === "function" ? pbpParamListClamp : null;
    const budget = typeof PBP_PARAM_LIST_BYTE_BUDGET === "number" ? PBP_PARAM_LIST_BYTE_BUDGET : NaN;
    const available = !!clamp && Number.isFinite(budget);
    const bytes = (value) => new TextEncoder().encode(JSON.stringify(value)).length;
    check("P0c param-list clamp exists with a byte budget under the 8KB sync per-item cap",
      available && budget > 0 && budget * 2 < 8192);
    check("P0c a list inside the budget is kept verbatim",
      available && JSON.stringify(clamp(["utm_source", "utm_medium", "fbclid"])) ===
        JSON.stringify(["utm_source", "utm_medium", "fbclid"]));
    check("P0c oversize input drops whole trailing entries instead of half a parameter name",
      available && (() => {
        const kept = clamp(["keep_me", "second_one", "third_entry"], 24);
        return Array.isArray(kept) && kept.length < 3 &&
          kept.every((entry) => ["keep_me", "second_one", "third_entry"].includes(entry)) &&
          JSON.stringify(kept) === JSON.stringify(["keep_me", "second_one", "third_entry"].slice(0, kept.length));
      })());
    check("P0c the budget is measured in UTF-8 bytes, not characters",
      available && clamp(["追踪参数"], 10).length === 0 &&
        clamp(["追踪参数"], 20).length === 1);
    check("P0c non-array input yields an empty list",
      available && Array.isArray(clamp(null)) && clamp(null).length === 0 &&
        clamp("utm_source").length === 0);
    check("P0c two clamped lists plus the rest of urlClean fit one sync item",
      available && (() => {
        const flood = Array.from({ length: 4000 }, (_, i) => `tracking_parameter_${i}`);
        const value = {
          ...SETTINGS_DEFAULTS.urlClean,
          customParams: clamp(flood),
          excludeParams: clamp(flood),
        };
        return value.customParams.length > 0 && value.customParams.length < flood.length &&
          "urlClean".length + bytes(value) <= 8192;
      })());
  }

  // ---------- P1: local-only, categorical connection health ----------
  {
    const previousChrome = globalThis.chrome;
    const healthStore = {};
    try {
      globalThis.chrome = {
        ...(previousChrome || {}),
        storage: {
          ...((previousChrome && previousChrome.storage) || {}),
          local: {
            async get(key) {
              return key in healthStore ? { [key]: structuredClone(healthStore[key]) } : {};
            },
            async set(value) { Object.assign(healthStore, structuredClone(value)); },
          },
        },
      };
      const available = typeof pbpRecordConnectionHealth === "function";
      if (available) await Promise.all([
        pbpRecordConnectionHealth("pinboard", true, "connected"),
        pbpRecordConnectionHealth("ai:openai", false, "permission_denied"),
      ]);
      const map = healthStore._connectionHealthV1 || {};
      check("P1 concurrent connection results are serialized without losing either record",
        available && map.pinboard?.ok === true && map["ai:openai"]?.ok === false &&
        Number.isFinite(map.pinboard.checkedAt));

      if (available) {
        await pbpRecordConnectionHealth("eudic", false, "raw server message with token=secret");
        await pbpRecordConnectionHealth("not/a/known/integration", true, "connected");
      }
      check("P1 connection health stores allowlisted ids and categorical codes only",
        available && map !== healthStore._connectionHealthV1 &&
        healthStore._connectionHealthV1.eudic?.code === "failed" &&
        !("not/a/known/integration" in healthStore._connectionHealthV1));
    } finally {
      globalThis.chrome = previousChrome;
    }
  }

  // ---------- E1: persistSettings quota guard ----------
  const LARGE_KEYS = ["customTagPrompt","customSummaryPrompt","translateGlossary","tagPresets"];

  // (a) large keys are routed away from the inline batch (chunked separately)
  let batchSet = null;
  const largeWrites = [];
  globalThis.__pbpTestStorage = {
    set: (d) => { batchSet = d; return Promise.resolve(); },
    get: () => Promise.resolve({}),
  };
  // syncSetLarge in this stub mode records the key it was asked to chunk
  globalThis.__pbpTestSyncSetLarge = (k) => { largeWrites.push(k); return Promise.resolve(); };

  const data = { optTheme: "nord", customTagPrompt: "x".repeat(9000), tagPresets: "y".repeat(9000) };
  const r1 = await persistSettings(data);
  check("E1 persistSettings reports ok on success", r1.ok === true);
  check("E1 large keys NOT in inline batch", batchSet && !("customTagPrompt" in batchSet) && !("tagPresets" in batchSet));
  check("E1 large keys routed to syncSetLarge", largeWrites.includes("customTagPrompt") && largeWrites.includes("tagPresets"));
  check("E1 small keys stay in inline batch", batchSet && batchSet.optTheme === "nord");

  // (b) quota reject on the inline batch is caught + reported, not thrown
  globalThis.__pbpTestStorage = {
    set: () => Promise.reject(new Error("QUOTA_BYTES quota exceeded")),
    get: () => Promise.resolve({}),
  };
  let threw = false, r2 = null;
  try { r2 = await persistSettings({ optTheme: "dracula" }); }
  catch (_) { threw = true; }
  check("E1 quota reject does NOT throw out of persistSettings", threw === false);
  check("E1 quota reject reported as not-ok", r2 && r2.ok === false && /quota/i.test(r2.error.message));

  // (c) K119: a delta holding ONLY keys that get routed elsewhere must not
  // still send an empty storage.set({}). Two reachable paths -- a delta of
  // chunked keys only (editing a prompt / the glossary), and a
  // credentials-only delta while secret routing is active.
  {
    const previousChromeK119 = globalThis.chrome;
    const previousTestStorageK119 = globalThis.__pbpTestStorage;
    const previousTestLargeK119 = globalThis.__pbpTestSyncSetLarge;
    try {
      let chunkedOnlySets = 0;
      const chunkedOnlyWrites = [];
      globalThis.__pbpTestStorage = {
        set: () => { chunkedOnlySets++; return Promise.resolve(); },
        get: () => Promise.resolve({}),
      };
      globalThis.__pbpTestSyncSetLarge = (k) => { chunkedOnlyWrites.push(k); return Promise.resolve(); };
      globalThis.chrome = {
        storage: {
          local: { get: async (keys) => ({ ...(keys || {}) }), set: async () => {} },
          onChanged: { addListener() {} },
        },
      };
      const chunkedOnly = await persistSettings({ customTagPrompt: "prompt text" });
      // Both halves, not just "set was not called": asserting the absence
      // alone would also pass for an implementation that stopped routing the
      // key at all, and for one that kept the unconditional set() but fed it a
      // batch that is never empty.
      check("E1 K119: a chunked-only delta is routed to the codec and sends no empty batch write",
        chunkedOnly.ok === true && chunkedOnlySets === 0 &&
        chunkedOnlyWrites.includes("customTagPrompt"));

      let secretOnlySets = 0;
      let secretLocalWrites = 0;
      globalThis.__pbpTestStorage = {
        set: () => { secretOnlySets++; return Promise.resolve(); },
        get: () => Promise.resolve({}),
      };
      globalThis.chrome = {
        storage: {
          local: {
            get: async (keys) => ({ ...(keys || {}), optSyncEnabled: true, syncApiKeys: false }),
            set: async () => { secretLocalWrites++; },
          },
          onChanged: { addListener() {} },
        },
      };
      const secretOnly = await persistSettings({ pinboardToken: "obf:only-secret" });
      check("E1 K119: a credentials-only delta under active routing writes local and nothing else",
        secretOnly.ok === true && secretLocalWrites === 1 && secretOnlySets === 0);

      // The guard must not swallow a real batch: one ordinary key still writes.
      let mixedSets = 0;
      globalThis.__pbpTestStorage = {
        set: (d) => { mixedSets++; batchSet = d; return Promise.resolve(); },
        get: () => Promise.resolve({}),
      };
      globalThis.chrome = {
        storage: {
          local: { get: async (keys) => ({ ...(keys || {}) }), set: async () => {} },
          onChanged: { addListener() {} },
        },
      };
      const mixed = await persistSettings({ optTheme: "dracula", customTagPrompt: "p" });
      check("E1 K119: a delta that still has an ordinary key writes it exactly once",
        mixed.ok === true && mixedSets === 1 && batchSet.optTheme === "dracula" &&
        !("customTagPrompt" in batchSet));
    } finally {
      globalThis.chrome = previousChromeK119;
      globalThis.__pbpTestStorage = previousTestStorageK119;
      globalThis.__pbpTestSyncSetLarge = previousTestLargeK119;
    }
  }

  const baselineSettings = {
    optTheme: "auto",
    customTagPrompt: "",
    urlClean: { enabled: true, customParams: [], excludeParams: [] },
  };
  check("E1 settings delta: untouched stale form fields are omitted",
    JSON.stringify(pbpSettingsDelta({ ...baselineSettings, customFont: "Inter" }, baselineSettings)) ===
      JSON.stringify({ customFont: "Inter" }));
  check("E1 settings delta: an explicit empty value is preserved",
    pbpSettingsDelta({ ...baselineSettings, optTheme: "" }, baselineSettings).optTheme === "");
  check("E1 settings delta: nested settings use value equality",
    Object.keys(pbpSettingsDelta({ ...baselineSettings, urlClean: { ...baselineSettings.urlClean } }, baselineSettings)).length === 0 &&
    pbpSettingsDelta({ ...baselineSettings, urlClean: { ...baselineSettings.urlClean, enabled: false } }, baselineSettings).urlClean.enabled === false);

  let persistedDelta = null;
  let settingsSavedDelta = null;
  const snapshotState = { settings: { optTheme: "auto", customFont: "" }, overlay: "base-css" };
  const snapshotResult = await pbpSaveOptionsSnapshot(
    snapshotState,
    { optTheme: "auto", customFont: "Inter" },
    "base-css",
    {
      persist: async (delta) => { persistedDelta = delta; return { ok: true, fellBackToLocal: false }; },
      saveOverlay: async () => ({ fellBackToLocal: false }),
      assertOverlay: () => {},
      onSettingsSaved: (delta) => { settingsSavedDelta = delta; },
    }
  );
  check("E1 options snapshot: runtime save writes only the changed settings delta",
    JSON.stringify(persistedDelta) === JSON.stringify({ customFont: "Inter" }) &&
    JSON.stringify(settingsSavedDelta) === JSON.stringify(persistedDelta) &&
    snapshotState.settings.optTheme === "auto" && snapshotResult.overlayChanged === false);

  const inFlightState = { settings: { a: 1, b: 1 }, overlay: "" };
  const inFlightForm = { a: 2, b: 1 };
  let releaseInFlight;
  const inFlightSave = pbpSaveOptionsSnapshot(inFlightState, inFlightForm, "", {
    persist: async () => {
      await new Promise((resolve) => { releaseInFlight = resolve; });
      return { ok: true, fellBackToLocal: false };
    },
    saveOverlay: async () => ({ fellBackToLocal: false }),
    assertOverlay: () => {},
  });
  await Promise.resolve();
  inFlightForm.b = 3;
  releaseInFlight();
  await inFlightSave;
  check("E1 options snapshot: edits made while saving remain dirty for the next delta",
    JSON.stringify(pbpSettingsDelta(inFlightForm, inFlightState.settings)) === JSON.stringify({ b: 3 }));

  const failedState = { settings: { optTheme: "auto" }, overlay: "" };
  let failedSaveError = null;
  try {
    await pbpSaveOptionsSnapshot(failedState, { optTheme: "dark" }, "", {
      persist: async () => ({ ok: false, error: new Error("write failed") }),
      saveOverlay: async () => ({ fellBackToLocal: false }),
      assertOverlay: () => {},
    });
  } catch (error) { failedSaveError = error; }
  check("E1 options snapshot: failed settings write does not advance the baseline",
    failedSaveError?.message === "write failed" && failedState.settings.optTheme === "auto");

  const oversizedState = { settings: { optTheme: "auto" }, overlay: "valid-css" };
  let oversizedPersisted = null;
  let oversizedOverlayWrites = 0;
  let oversizedError = null;
  try {
    await pbpSaveOptionsSnapshot(oversizedState, { optTheme: "dark" }, "oversized-css", {
      persist: async (delta) => { oversizedPersisted = delta; return { ok: true, fellBackToLocal: false }; },
      saveOverlay: async () => { oversizedOverlayWrites++; return { fellBackToLocal: false }; },
      assertOverlay: () => { throw new RangeError("too large"); },
    });
  } catch (error) { oversizedError = error; }
  check("E1 options snapshot: invalid overlay cannot block or roll back ordinary settings",
    oversizedError instanceof RangeError && oversizedPersisted.optTheme === "dark" &&
    oversizedState.settings.optTheme === "dark" && oversizedState.overlay === "valid-css" && oversizedOverlayWrites === 0);

  const overlayOnlyState = { settings: { optTheme: "auto" }, overlay: "before" };
  let overlayOnlyPersistCalls = 0;
  let overlayOnlyValue = "";
  await pbpSaveOptionsSnapshot(overlayOnlyState, { optTheme: "auto" }, "after", {
    persist: async () => { overlayOnlyPersistCalls++; return { ok: true, fellBackToLocal: false }; },
    saveOverlay: async (value) => { overlayOnlyValue = value; return { fellBackToLocal: false }; },
    assertOverlay: () => {},
  });
  check("E1 options snapshot: overlay baseline advances independently without a settings write",
    overlayOnlyPersistCalls === 0 && overlayOnlyValue === "after" && overlayOnlyState.overlay === "after");

  const optionQueueState = { suspended: true, chain: Promise.resolve() };
  let optionQueueCalls = 0;
  await pbpQueueOptionsSave(optionQueueState, async () => { optionQueueCalls++; });
  optionQueueState.suspended = false;
  const optionQueueOrder = [];
  let releaseQueuedSave;
  const queuedFirst = pbpQueueOptionsSave(optionQueueState, async () => {
    optionQueueOrder.push("first-enter");
    await new Promise((resolve) => { releaseQueuedSave = resolve; });
    optionQueueOrder.push("first-exit");
  });
  const queuedSecond = pbpQueueOptionsSave(optionQueueState, async () => {
    optionQueueOrder.push("second");
  });
  await Promise.resolve();
  releaseQueuedSave();
  await Promise.all([queuedFirst, queuedSecond]);
  check("E1 options save queue: suspension blocks direct saves and active saves remain serialized",
    optionQueueCalls === 0 && optionQueueOrder.join(",") === "first-enter,first-exit,second");

  const recoveringQueueState = { suspended: false, chain: Promise.resolve() };
  let reportedQueueError = null;
  try {
    await pbpQueueOptionsSave(recoveringQueueState, async () => { throw new Error("unexpected save crash"); });
  } catch (error) { reportedQueueError = error; }
  let recoveredQueueCalls = 0;
  await pbpQueueOptionsSave(recoveringQueueState, async () => { recoveredQueueCalls++; });
  check("E1 options save queue: a rejected task is reportable but cannot poison the stored queue tail",
    reportedQueueError?.message === "unexpected save crash" && recoveredQueueCalls === 1 &&
    await recoveringQueueState.chain === undefined);


  // ---------- E1b: real large-value codec round trips ----------
  await (async () => {
    const previousChrome = globalThis.chrome;
    const previousCache = _settingsStorageCache;
    const previousTestStorage = globalThis.__pbpTestStorage;
    const previousTestLarge = globalThis.__pbpTestSyncSetLarge;
    delete globalThis.__pbpTestStorage;
    delete globalThis.__pbpTestSyncSetLarge;

    const getFrom = (backing, keys) => {
      if (keys == null) return Object.assign({}, backing);
      if (typeof keys === "string") return keys in backing ? { [keys]: backing[keys] } : {};
      if (Array.isArray(keys)) {
        const out = {};
        keys.forEach((key) => { if (key in backing) out[key] = backing[key]; });
        return out;
      }
      const out = Object.assign({}, keys || {});
      Object.keys(keys || {}).forEach((key) => { if (key in backing) out[key] = backing[key]; });
      return out;
    };
    const removeFrom = (backing, keys) => {
      (Array.isArray(keys) ? keys : [keys]).forEach((key) => { delete backing[key]; });
    };
    const itemBytes = (key, value) => new TextEncoder().encode(key + JSON.stringify(value)).length;

    function installLargeStorage(syncEnabled) {
      const local = { optSyncEnabled: !!syncEnabled };
      const sync = { syncApiKeys: false };
      const state = { rejectSyncSet: false, syncSetCalls: 0, rejectOnSyncSetCall: 0, rejectLocalRemove: false };
      globalThis.chrome = {
        storage: {
          local: {
            get: async (keys) => getFrom(local, keys),
            set: async (data) => { Object.assign(local, data); },
            remove: async (keys) => {
              if (state.rejectLocalRemove) throw new Error("local remove failed");
              removeFrom(local, keys);
            },
          },
          sync: {
            QUOTA_BYTES_PER_ITEM: 8192,
            get: async (keys) => getFrom(sync, keys),
            set: async (data) => {
              state.syncSetCalls++;
              if (state.rejectSyncSet || state.syncSetCalls === state.rejectOnSyncSetCall) {
                throw new Error("QUOTA_BYTES_PER_ITEM exceeded");
              }
              Object.assign(sync, data);
            },
            remove: async (keys) => { removeFrom(sync, keys); },
          },
          onChanged: { addListener() {} },
        },
      };
      _settingsStorageCache = null;
      return { local, sync, state };
    }

    try {
      let env = installLargeStorage(false);
      const themes = [{ name: "Mine", css: ".x{color:red}" }];
      await syncSetLarge("savedThemes", themes);
      const localThemes = await syncGetLarge("savedThemes", []);
      check("E1b local large values preserve array type", Array.isArray(localThemes) && localThemes[0].name === "Mine");
      env.local.savedThemes = JSON.stringify(themes);
      check("E1b local legacy JSON strings decode back to their original type",
        Array.isArray(await syncGetLarge("savedThemes", [])) && (await syncGetLarge("savedThemes", []))[0].name === "Mine");

      env = installLargeStorage(true);
      const cjk = "中".repeat(3000) + "\u0000".repeat(2000) + "😀".repeat(1000);
      let cjkError = null;
      try { await syncSetLarge("customTagPrompt", cjk); } catch (error) { cjkError = error; }
      const cjkRoundTrip = await syncGetLarge("customTagPrompt", "");
      check("E1b sync codec round-trips multi-byte and escaped text", !cjkError && cjkRoundTrip === cjk);
      check("E1b every physical sync item stays within the 8 KB byte quota",
        Object.entries(env.sync).every(([key, value]) => itemBytes(key, value) <= 8192));

      const logicalRead = await pbpReadSettingsWithSecrets({ customTagPrompt: "" });
      check("E1b atomic settings read resolves chunk metadata", logicalRead.customTagPrompt === cjk);
      const physicalChunkKey = Object.keys(env.sync).find((key) => key.startsWith("customTagPrompt_") && key !== "customTagPrompt");
      check("E1b physical chunk changes invalidate the SW settings cache",
        !!physicalChunkKey && pbpSettingsKeysChanged({ [physicalChunkKey]: { oldValue: "a", newValue: "b" } }));

      env.sync.customSummaryPrompt = "direct pre-chunk value";
      check("E1b direct sync strings from pre-chunk migration remain readable",
        await syncGetLarge("customSummaryPrompt", "") === "direct pre-chunk value");

      env = installLargeStorage(true);
      await syncSetLarge("customSummaryPrompt", "old value");
      const oldSync = JSON.stringify(env.sync);
      env.state.rejectSyncSet = true;
      let quotaError = null;
      try { await syncSetLarge("customSummaryPrompt", "new value"); } catch (error) { quotaError = error; }
      env.state.rejectSyncSet = false;
      check("E1b failed sync write exposes the new local fallback",
