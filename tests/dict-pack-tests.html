<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>dict-pack Tests</title>
<style>
body { font-family: monospace; padding: 16px; max-width: 1000px; }
.case { padding: 6px; border-bottom: 1px solid #eee; white-space: pre-wrap; }
.pass { color: #0a0; } .fail { color: #c00; font-weight: bold; }
h2 { margin-top: 24px; }
</style></head>
<body>
<h1>dict-pack Tests</h1>
<div id="summary"></div>
<div id="results"></div>
<script src="../dict-pack.js"></script>
<script>
const root = document.getElementById("results");
let pass = 0, fail = 0;
function check(name, cond, detail) {
  const ok = !!cond;
  ok ? pass++ : fail++;
  const div = document.createElement("div");
  div.className = "case " + (ok ? "pass" : "fail");
  div.textContent = (ok ? "✓" : "✗") + "  " + name + (ok ? "" : "\n   " + (detail || ""));
  root.appendChild(div);
}
function section(name) {
  const h = document.createElement("h2");
  h.textContent = name;
  root.appendChild(h);
}
function assertEq(a, e, label) {
  const ok = a === e;
  check(label || (String(e) + " === " + String(a)), ok, ok ? "" : "expected " + JSON.stringify(e) + " got " + JSON.stringify(a));
}
function assertArrayEq(a, e, label) {
  const ok = JSON.stringify(a) === JSON.stringify(e);
  check(label || ("array " + JSON.stringify(e)), ok, ok ? "" : "expected " + JSON.stringify(e) + " got " + JSON.stringify(a));
}

section("pbpCedictParseLine");
const p1 = pbpCedictParseLine("中國 中国 [Zhong1 guo2] /China/");
check("normal line parsed", p1 && p1.trad === "中國" && p1.simp === "中国" && p1.pinyin === "Zhong1 guo2" && p1.defs.length === 1);

const p2 = pbpCedictParseLine("你好 你好 [ni3 hao3] /hello/hi/how are you/");
check("multiple defs", p2 && p2.defs.length === 3 && p2.defs[0] === "hello" && p2.defs[1] === "hi" && p2.defs[2] === "how are you");

const p3 = pbpCedictParseLine("女 女 [nu:3] /woman/female/");
check("u: preserved in pinyin", p3 && p3.pinyin === "nu:3");

assertEq(pbpCedictParseLine("# This is a comment"), null, "comment line returns null");
assertEq(pbpCedictParseLine(""), null, "empty line returns null");
assertEq(pbpCedictParseLine("   \t  "), null, "whitespace-only line returns null");
assertEq(pbpCedictParseLine("中國 中国 Zhong1 guo2 /China/"), null, "malformed no brackets returns null");
assertEq(pbpCedictParseLine("中國 中国 [Zhong1 guo2] China"), null, "malformed no slashes returns null");

const p4 = pbpCedictParseLine("北京 北京 [Bei3 jing1] /Beijing/");
check("pinyin case preserved", p4 && p4.pinyin === "Bei3 jing1");

const p5 = pbpCedictParseLine("字 字 [zi4] /word/");
check("normal single def", p5 && p5.defs.length === 1 && p5.defs[0] === "word");

section("pbpCedictPinyinPretty");
assertEq(pbpCedictPinyinPretty("ni3 hao3"), "nǐ hǎo", "ni3 hao3 -> nǐ hǎo");
assertEq(pbpCedictPinyinPretty("lu:4"), "lǜ", "lu:4 -> lǜ");
assertEq(pbpCedictPinyinPretty("de5"), "de", "de5 -> de (neutral tone)");
assertEq(pbpCedictPinyinPretty("Bei3 jing1"), "Běi jīng", "Bei3 jing1 -> Běi jīng (uppercase preserved)");
assertEq(pbpCedictPinyinPretty("nǐ"), "nǐ", "already marked nǐ passes through");
assertEq(pbpCedictPinyinPretty("Zhong1 guo2"), "Zhōng guó", "Zhong1 guo2 -> Zhōng guó");
assertEq(pbpCedictPinyinPretty(""), "", "empty pinyin -> empty");
assertEq(pbpCedictPinyinPretty("le0"), "le", "le0 (tone 0) -> le");
assertEq(pbpCedictPinyinPretty("xx5"), "xx5", "xx5 marker passes through");
assertEq(pbpCedictPinyinPretty("r5"), "r", "r5 (erhua) -> r");
assertEq(pbpCedictPinyinPretty("Tu2 shu1 guan3"), "Tú shū guǎn", "Tu2 shu1 guan3 -> Tú shū guǎn");

section("pbpCedictLookupKeys");
assertArrayEq(pbpCedictLookupKeys("图书馆里"), ["图书馆里", "图书馆", "图书", "图"], "lookup keys longest-first");
assertArrayEq(pbpCedictLookupKeys("字"), ["字"], "single char key");
assertArrayEq(pbpCedictLookupKeys(""), [], "empty string -> empty keys");
assertArrayEq(pbpCedictLookupKeys(null), [], "null -> empty keys");

const composed = "é"; // U+00E9, single precomposed code point
const decomposed = "é"; // U+0065 + U+0301 (combining acute accent), the real decomposed form
const keysC = pbpCedictLookupKeys(composed);
const keysD = pbpCedictLookupKeys(decomposed);
assertEq(JSON.stringify(keysC), JSON.stringify(keysD), "NFC normalization applied");

const long17 = "一二三四五六七八九十一二三四五六七";
const keys = pbpCedictLookupKeys(long17);
check("capped at 16 code points", keys[0].length === 16);

// Astral (surrogate-pair) CJK: the cap must count CODE POINTS, not UTF-16
// units -- a naive .length cap would slice a surrogate pair in half.
const astral17 = "\u{20000}".repeat(17);
const astralKeys = pbpCedictLookupKeys(astral17);
assertEq(Array.from(astralKeys[0]).length, 16, "astral CJK capped at 16 CODE POINTS (not UTF-16 units)");
assertEq(astralKeys[0].length, 32, "16 astral code points serialize to 32 UTF-16 units (no split surrogate pair)");

assertArrayEq(pbpCedictLookupKeys("  图书  "), ["图书", "图"], "leading/trailing whitespace trimmed");

section("pbpCedictEntryToNorm");
const entry1 = pbpCedictEntryToNorm([{ trad: "中國", simp: "中国", pinyin: "Zhong1 guo2", defs: ["China", "PRC"] }], "中國");
check("word field", entry1.word === "中國");
check("entries array", Array.isArray(entry1.entries) && entry1.entries.length === 1);
check("pos field empty", entry1.entries[0].pos === "");
check("ipas with Pinyin tag", Array.isArray(entry1.entries[0].ipas) && entry1.entries[0].ipas[0].tags.includes("Pinyin"));
check("forms array present", Array.isArray(entry1.entries[0].forms));
check("senses array present", Array.isArray(entry1.entries[0].senses));
assertEq(entry1.sourceLabel, "CC-CEDICT", "sourceLabel");
assertEq(entry1.license, "CC BY-SA 4.0", "license CC BY-SA 4.0");

const entry2 = pbpCedictEntryToNorm([{ trad: "中國", simp: "中国", pinyin: "Zhong1 guo2", defs: ["China"] }], "中國");
check("matched=trad shows simp form", entry2.entries[0].forms.length === 1 && entry2.entries[0].forms[0].word === "中国" && entry2.entries[0].forms[0].tags[0] === "simp");

const entry3 = pbpCedictEntryToNorm([{ trad: "中國", simp: "中国", pinyin: "Zhong1 guo2", defs: ["China"] }], "中国");
check("matched=simp shows trad form", entry3.entries[0].forms.length === 1 && entry3.entries[0].forms[0].word === "中國" && entry3.entries[0].forms[0].tags[0] === "trad");

const entry4 = pbpCedictEntryToNorm([{ trad: "你好", simp: "你好", pinyin: "ni3 hao3", defs: ["hello"] }], "你好");
assertEq(entry4.entries[0].forms.length, 0, "trad === simp, forms empty");

const entry5 = pbpCedictEntryToNorm([{ trad: "你好", simp: "你好", pinyin: "ni3 hao3", defs: ["hello", "hi", "how are you"] }], "你好");
assertEq(entry5.entries[0].senses.length, 3, "multiple defs -> multiple senses");
assertEq(entry5.entries[0].senses[0].definition, "hello", "first sense");

const entry6 = pbpCedictEntryToNorm([], "test");
assertEq(entry6.entries.length, 0, "empty rows -> empty entries");

const entry7 = pbpCedictEntryToNorm(null, "test");
assertEq(entry7.entries.length, 0, "null rows -> empty entries");

section("pbpCedictLines");
(async function() {
  // Single line (no newline)
  const lines1 = [];
  const stream1 = new ReadableStream({
    start(c) {
      c.enqueue(new TextEncoder().encode("中國 中国 [Zhong1 guo2] /China/"));
      c.close();
    }
  });
  for await (const line of pbpCedictLines(stream1)) {
    lines1.push(line);
  }
  assertArrayEq(lines1, ["中國 中国 [Zhong1 guo2] /China/"], "single line no newline");

  // Multiple lines
  const lines2 = [];
  const stream2 = new ReadableStream({
    start(c) {
      c.enqueue(new TextEncoder().encode("你好 你好 [ni3 hao3] /hello/\n北京 北京 [Bei3 jing1] /Beijing/"));
      c.close();
    }
  });
  for await (const line of pbpCedictLines(stream2)) {
    lines2.push(line);
  }
  assertArrayEq(lines2, ["你好 你好 [ni3 hao3] /hello/", "北京 北京 [Bei3 jing1] /Beijing/"], "multiple lines");

  // Newline across chunks
  const lines3 = [];
  const stream3 = new ReadableStream({
    start(c) {
      c.enqueue(new TextEncoder().encode("你好\n"));
      c.enqueue(new TextEncoder().encode("北京"));
      c.close();
    }
  });
  for await (const line of pbpCedictLines(stream3)) {
    lines3.push(line);
  }
  assertArrayEq(lines3, ["你好", "北京"], "newline across chunks");

  // UTF-8 multi-byte character split across chunks
  const lines4 = [];
  const utf8Bytes = new TextEncoder().encode("你好");
  const stream4 = new ReadableStream({
    start(c) {
      c.enqueue(utf8Bytes.slice(0, 1));
      c.enqueue(utf8Bytes.slice(1));
      c.close();
    }
  });
  for await (const line of pbpCedictLines(stream4)) {
    lines4.push(line);
  }
  assertArrayEq(lines4, ["你好"], "UTF-8 multi-byte split across chunks");

  // CRLF handling
  const lines5 = [];
  const stream5 = new ReadableStream({
    start(c) {
      c.enqueue(new TextEncoder().encode("你好\r\n北京\r\n"));
      c.close();
    }
  });
  for await (const line of pbpCedictLines(stream5)) {
    lines5.push(line);
  }
  assertArrayEq(lines5, ["你好", "北京"], "CRLF stripped");

  // Last line without newline (flush)
  const lines6 = [];
  const stream6 = new ReadableStream({
    start(c) {
      c.enqueue(new TextEncoder().encode("你好\n北京"));
      c.close();
    }
  });
  for await (const line of pbpCedictLines(stream6)) {
    lines6.push(line);
  }
  assertArrayEq(lines6, ["你好", "北京"], "last line without newline flushed");

  // stats.bytes tracking
  const stats = {};
  const stream7 = new ReadableStream({
    start(c) {
      const bytes = new TextEncoder().encode("你好");
      c.enqueue(bytes);
      c.close();
    }
  });
  for await (const line of pbpCedictLines(stream7, false, stats)) {
    // consume
  }
  check("stats.bytes exact decompressed byte count", stats.bytes === 6); // "你好" = 2 x 3 UTF-8 bytes

  // gzip=false explicit path
  const lines8 = [];
  const stream8 = new ReadableStream({
    start(c) {
      c.enqueue(new TextEncoder().encode("test"));
      c.close();
    }
  });
  for await (const line of pbpCedictLines(stream8, false)) {
    lines8.push(line);
  }
  assertArrayEq(lines8, ["test"], "gzip=false plain path");

  // Invalid UTF-8 should reject
  let utf8Error = false;
  try {
    const stream9 = new ReadableStream({
      start(c) {
        c.enqueue(new Uint8Array([0xFF, 0xFE]));
        c.close();
      }
    });
    for await (const line of pbpCedictLines(stream9)) {
      // should not reach
    }
  } catch (e) {
    utf8Error = e.message.includes("UTF-8") || e.name === "TypeError";
  }
  check("invalid UTF-8 rejects", utf8Error);

  // Line too long
  let longError = false;
  try {
    const stream10 = new ReadableStream({
      start(c) {
        const longLine = new Uint8Array(65537);
        c.enqueue(longLine);
        c.enqueue(new TextEncoder().encode("\n"));
        c.close();
      }
    });
    for await (const line of pbpCedictLines(stream10)) {
      // should not reach
    }
  } catch (e) {
    longError = e.message.includes("too long");
  }
  check("line too long throws (cross-chunk fallback check)", longError);

  // Overlong line WITH its newline in the SAME chunk: must hit the pre-yield
  // check -- deleting that guard is exactly the regression this pins.
  let sameChunkError = false;
  try {
    const stream10b = new ReadableStream({
      start(c) {
        const buf = new Uint8Array(65538);
        buf.fill(0x61); // 'a' x 65537
        buf[65537] = 0x0a; // '\n' in the SAME chunk
        c.enqueue(buf);
        c.close();
      }
    });
    for await (const line of pbpCedictLines(stream10b)) {
      // should not reach
    }
  } catch (e) {
    sameChunkError = e.message.includes("too long");
  }
  check("overlong line with newline in the SAME chunk throws (pre-yield guard)", sameChunkError);

  // Same-chunk overlong line, CJK variant: proves the 65536 threshold is
  // counted in UTF-16 code units AFTER decode, not UTF-8 bytes -- each "字"
  // is 3 bytes but 1 UTF-16 unit, so this line is ~197KB of UTF-8 yet only
  // 65537 code units, still tripping the same guard as the ASCII case above.
  let sameChunkCjkError = false;
  try {
    const cjkLine = "字".repeat(65537);
    const cjkBytes = new TextEncoder().encode(cjkLine + "\n");
    const stream10c = new ReadableStream({
      start(c) { c.enqueue(cjkBytes); c.close(); }
    });
    for await (const line of pbpCedictLines(stream10c)) {
      // should not reach
    }
  } catch (e) {
    sameChunkCjkError = e.message.includes("too long");
  }
  check("overlong CJK line (65537 units, ~197KB UTF-8, same chunk) throws by UTF-16 unit count", sameChunkCjkError);

  // File too large
  let sizeError = false;
  try {
    const stats2 = {};
    const stream11 = new ReadableStream({
      start(c) {
        c.enqueue(new Uint8Array(65 * 1024 * 1024));
        c.close();
      }
    });
    for await (const line of pbpCedictLines(stream11, false, stats2)) {
      // should not reach
    }
  } catch (e) {
    sizeError = e.message.includes("too large");
  }
  check("file >64MB throws", sizeError);

  section("ECDICT parse layer");
  // Every row below is copied VERBATIM out of ecdict.csv @ bc015ed2 (sha256
  // 1a6947e0…). Hand-lifted real bytes, never produced by our own writer --
  // this project already shipped a suite that was 60/60 green against
  // constructor-generated fixtures and still corrupted on real data.
  const E_HDR = "word,phonetic,definition,translation,pos,collins,oxford,tag,bnc,frq,exchange,detail,audio";
  //                                 quoted phonetic holding a comma  ↓
  const E_HAGUE = "'s Gravenhage,\",skrɑ:vən'hɑ:ɡə\",,[荷兰语]海牙(= Hague),,,,,0,0,,,";
  const E_EPHEMERAL = "ephemeral,i'femәrәl,s. lasting a very short time,\"a. 朝生暮死的, 短命的, 短暂的\\n[医] 暂时的\",,,,toefl ielts gre,15628,14116,s:ephemerals,,";
  const E_AARDVARK = "aardvark,'ɑ:dvɑ:k,n. nocturnal burrowing mammal,n. 土豚,,,,,0,42238,s:aardvarks,,";
  const E_ACOME = "a-come,,,n. (Acome)人名；(法)阿科姆,,,,,0,0,i:a-coming,,";
  const E_ABHUMAN = "abhuman,,,[网络] 亚人类,,,,,0,0,s:abhumans,,";
  const E_DEFEN = "defenestrate,diː'fenɪstreɪt,v throw through or out of the window,vt. 把(某人或某物)抛出窗外,,,,,0,0,,,";

  const eIdx = pbpEcdictParseHeader(E_HDR);
  check("real header parses", !!eIdx && eIdx.word === 0 && eIdx.translation === 3 && eIdx._count === 13);
  const eNames = E_HDR.split(",");
  eIdx.exchange = eNames.indexOf("exchange");
  eIdx.definition = eNames.indexOf("definition");
  // A UTF-8 BOM in front of the header. Any spreadsheet round-trip adds one, and
  // it used to make the whole file "not an ECDICT csv".
  check("a UTF-8 BOM before the header does not reject the file",
    !!pbpEcdictParseHeader("\uFEFF" + E_HDR));
  check("and the BOM is not left glued to the first column name",
    pbpEcdictParseHeader("\uFEFF" + E_HDR).word === 0);
  check("duplicate required header name rejects the file",
    pbpEcdictParseHeader("word,word,translation,tag,collins,oxford,frq,bnc") === null);
  check("missing required header name rejects the file",
    pbpEcdictParseHeader("word,translation,tag,collins,oxford,frq") === null);

  // Quote handling
  check("quoted field keeps its internal comma",
    pbpEcdictSplitLine(E_HAGUE)[1] === ",skrɑ:vən'hɑ:ɡə");
  check("doubled quote unescapes to one literal quote",
    pbpEcdictSplitLine('a,"say ""hi""",b')[1] === 'say "hi"');
  check("unclosed quote yields null, not a short row", pbpEcdictSplitLine('a,"unterminated,b') === null);
  check("unclosed quote is fatal for the whole file, never a skipped line",
    pbpEcdictParseRow('a,"unterminated,b', eIdx, "R1").fatal === "unclosed-quote");
  // Row level only: an open quote with no closer on THIS line. The full
  // production path (real newline inside a quoted field, split into physical
  // lines by pbpCedictLines) is exercised in the IDB section -- proving it here
  // would be a test whose name promises more than its fixture delivers.
  check("a line whose quote never closes is fatal at row level",
    pbpEcdictParseRow('multi,"line one', eIdx, "R1").fatal === "unclosed-quote");

  // Field handling
  check("wrong field count counts as malformed, not fatal",
    pbpEcdictParseRow("word,only,three", eIdx, "R1").malformed === true);
  check("frq rejects 12abc rather than reading 12", pbpEcdictInt("12abc") === 0);
  check("frq accepts a plain integer", pbpEcdictInt(" 42 ") === 42);
  check("key folds NFD, whitespace and case together",
    pbpEcdictKey("  Café   Bar  ") === pbpEcdictKey("café bar"));
  check("word display form keeps its case", pbpEcdictParseRow(E_AARDVARK, eIdx, "R1").record.word === "aardvark");
  const overWord = "x".repeat(PBP_ECDICT_MAX_WORD_UNITS + 1) + ",,,n. 甲,,,,,0,1,,,";
  check("over-long word counts as malformed", pbpEcdictParseRow(overWord, eIdx, "R1").malformed === true);
  const overTrans = "y,,," + "甲".repeat(PBP_ECDICT_MAX_TRANS_UNITS + 1) + ",,,,,0,1,,,";
  check("over-long translation counts as malformed", pbpEcdictParseRow(overTrans, eIdx, "R1").malformed === true);
  // KEY has its own ceiling because lowercasing can lengthen a string, so a word
  // inside the word limit can still normalize past the key limit.
  const overKey = '"' + "İ".repeat(PBP_ECDICT_MAX_WORD_UNITS) + '",,,n. 甲,,,,,0,1,,,';
  const overKeyRes = pbpEcdictParseRow(overKey, eIdx, "R1");
  check("a word that lowercases past the key ceiling counts as malformed",
    pbpEcdictKey("İ".repeat(PBP_ECDICT_MAX_WORD_UNITS)).length > PBP_ECDICT_MAX_KEY_UNITS && overKeyRes.malformed === true);

  // CRC32 against the standard IEEE vector, plus chunked == single-shot. A
  // shape-only assertion would pass for a constant or a wrong polynomial.
  const crcBytes = new TextEncoder().encode("123456789");
  check("crc32 matches the standard vector for 123456789", pbpCrc32Hex(pbpCrc32Update(0, crcBytes)) === "cbf43926");
  const crcSplit = pbpCrc32Update(pbpCrc32Update(0, crcBytes.slice(0, 4)), crcBytes.slice(4));
  check("crc32 accumulated in two chunks equals one shot", pbpCrc32Hex(crcSplit) === "cbf43926");

  // Literal \n is two characters in the file, not a newline
  check("literal backslash-n splits into separate senses",
    pbpEcdictSenses("a. 朝生暮死的\\n[医] 暂时的").length === 2);
  check("real newlines are not a sense separator", pbpEcdictSenses("one\ntwo").length === 1);
  const ephem = pbpEcdictParseRow(E_EPHEMERAL, eIdx, "R1");
  check("real ephemeral row yields two senses",
    ephem.ok && pbpEcdictSenses(ephem.record.translation).length === 2);

  // Base conditions, which run BEFORE any rung test
  check("empty translation is rejected by the base condition",
    !pbpEcdictBaseOk(pbpEcdictKey("word"), "   "));
  check("a translation of only a literal \\n is rejected (trims non-empty, splits to zero senses)",
    !pbpEcdictBaseOk(pbpEcdictKey("word"), "\\n"));
  check("a translation of only two literal \\n is rejected", !pbpEcdictBaseOk(pbpEcdictKey("w"), "\\n\\n"));
  check("empty word is rejected by the base condition", !pbpEcdictBaseOk(pbpEcdictKey("   "), "n. 甲"));

  // Rung boundaries, each anchored to a real row
  const at = (line, rung) => pbpEcdictParseRow(line, eIdx, rung).ok === true;
  check("R1 admits a row carrying an exam tag", at(E_EPHEMERAL, "R1"));
  check("R1 admits a row inside the frequency window", at(E_AARDVARK, "R1"));
  check("R1 excludes a row with no tag, no rating and no rank", !at(E_ACOME, "R1"));
  check("R2 admits that row once it has inflections", at(E_ACOME, "R2"));
  check("R2 still excludes a definition-only row", !at(E_DEFEN, "R2"));
  check("R3 admits the definition-only row", at(E_DEFEN, "R3"));
  check("a multi-word affix headword is excluded at every rung",
    !at(E_HAGUE, "R1") && !at(E_HAGUE, "R2") && !at(E_HAGUE, "R3"));
  // The clean predicate has three parts. Dropping the web-only test let 200
  // scraped-fragment rows into R2/R3 on the real sample.
  check("a gloss that is nothing but [网络] fragments is excluded at every rung",
    !at(E_ABHUMAN, "R1") && !at(E_ABHUMAN, "R2") && !at(E_ABHUMAN, "R3"));
  check("clean() rejects a web-only gloss", !pbpEcdictClean("abhuman", pbpEcdictSenses("[网络] 亚人类")));
  check("clean() accepts a normal single-word headword", pbpEcdictClean("aardvark", ["n. 土豚"]));
  // Widening must only ever add.
  const rungKeys = (rung) => new Set([E_EPHEMERAL, E_AARDVARK, E_ACOME, E_ABHUMAN, E_DEFEN, E_HAGUE]
    .map((l) => pbpEcdictParseRow(l, eIdx, rung)).filter((r) => r.ok).map((r) => r.record.key));
  const kR1 = rungKeys("R1"), kR2 = rungKeys("R2"), kR3 = rungKeys("R3");
  check("R1 is a subset of R2", [...kR1].every((k) => kR2.has(k)));
  check("R2 is a subset of R3", [...kR2].every((k) => kR3.has(k)));

  // The single payload definition every acceptance gate must quote
  check("payload counts utf8 of key + word + translation and nothing else",
    pbpEcdictPayloadBytes([{ key: "ab", word: "Ab", translation: "甲" }]) === 2 + 2 + 3);

  // The additional-block contract: no IPA, no forms, no borrowed source
  const eNorm = pbpEcdictEntryToNorm([{ translation: "a. 朝生暮死的\\n[医] 暂时的" }], "ephemeral");
  check("ECDICT norm carries senses only, never IPA or forms",
    eNorm.entries.length === 1 && eNorm.entries[0].senses.length === 2 &&
    eNorm.entries[0].ipas.length === 0 && eNorm.entries[0].forms.length === 0);
  check("ECDICT norm labels its own source and claims no license of the online entry",
    eNorm.sourceLabel === "ECDICT" && eNorm.sourceUrl === "" && eNorm.license === "");

  section("dict-pack IDB layer (pbpPackImport/Lookup/Meta/Delete)");
  async function* arrLines(arr) { for (const l of arr) yield l; }

  // Clean slate: a prior run (or file:// dev usage) must not leak state
  // across the pass/fail count this suite pins.
  await new Promise((resolve) => {
    const req = indexedDB.deleteDatabase("pbp-dict-packs");
    req.onsuccess = resolve; req.onerror = resolve; req.onblocked = resolve;
  });
  check("clean db before IDB tests: meta is null", (await pbpPackMeta()) === null);

  const L_BEIJING = "北京 北京 [Bei3 jing1] /Beijing/";
  const L_NIHAO = "你好 你好 [ni3 hao3] /hello/hi/";
  const L_ZHONGGUO = "中國 中国 [Zhong1 guo2] /China/PRC/";
  const L_TU = "图 图 [tu2] /picture/map/";
  const L_CESHI_A = "測試 测试 [ce4 shi4] /testA/"; // trad=測試 simp=测试
  const L_CESHI_B = "测试 测试异体 [ce4 shi4] /testB/"; // trad=测试 (== L_CESHI_A's simp)
  const SAMPLE1 = [L_BEIJING, L_NIHAO, L_ZHONGGUO, L_TU, L_CESHI_A, L_CESHI_B, "# comment line", "   "];

  const stats1 = { bytes: 4242 };
  const res1 = await pbpPackImport(arrLines(SAMPLE1), null, stats1);
  check("import small sample: entries=6", res1.entries === 6, "got " + JSON.stringify(res1));
  check("import small sample: malformed=0", res1.malformed === 0, "got " + JSON.stringify(res1));

  const meta1 = await pbpPackMeta();
  check("meta state ready after import", !!meta1 && meta1.state === "ready");
  check("meta entries matches import result", !!meta1 && meta1.entries === 6);
  check("meta bytes field stored from stats", !!meta1 && meta1.bytes === 4242);
  check("meta importedAt is a fresh timestamp", !!meta1 && typeof meta1.importedAt === "number" && meta1.importedAt > 0);

  const bySimp = await pbpPackLookup(["中国"]);
  check("lookup hit carries explicit hit state", bySimp && bySimp.state === "hit");
  check("lookup by simp: matched key", !!bySimp && bySimp.matched === "中国");
  check("lookup by simp: returns the trad-differing row", !!bySimp && bySimp.rows.length === 1 && bySimp.rows[0].trad === "中國");

  const byTrad = await pbpPackLookup(["中國"]);
  check("lookup by trad: matched key", !!byTrad && byTrad.matched === "中國");
  check("lookup by trad: returns the simp-differing row", !!byTrad && byTrad.rows.length === 1 && byTrad.rows[0].simp === "中国");

  const dedupe = await pbpPackLookup(["你好"]);
  check("same record hit via both indexes dedupes to one row", !!dedupe && dedupe.rows.length === 1);

  const merged = await pbpPackLookup(["测试"]);
  check("cross-index merge: matched key", !!merged && merged.matched === "测试");
  check("cross-index merge: returns both distinct records (id-merge, not just one index)", !!merged && merged.rows.length === 2);
  check("cross-index merge: rows sorted by id ascending", !!merged && merged.rows[0].id < merged.rows[1].id);

  const fallbackKeys = pbpCedictLookupKeys("图书馆");
  const fb = await pbpPackLookup(fallbackKeys);
  check("prefix fallback lands on the shortest available key", !!fb && fb.matched === "图");
  const readyMiss = await pbpPackLookup(["不存在的词"]);
  check("ready pack miss carries explicit ready-miss state", readyMiss && readyMiss.state === "ready-miss");

  const realPackOpen = _pbpPackOpenDB;
  _pbpPackOpenDB = async () => ({
    transaction() {
      const tx = {
        objectStore(name) {
          if (name === _PBP_PACK_META) return { get() {
            const req = {};
            queueMicrotask(() => { req.result = { state: "ready" }; if (req.onsuccess) req.onsuccess(); });
            return req;
          } };
          return { index() { return { getAll() {
            const req = {};
            queueMicrotask(() => { if (req.onerror) req.onerror(); });
            return req;
          } }; } };
        }
      };
      return tx;
    }
  });
  const lookupError = await pbpPackLookup(["索引错误"]);
  _pbpPackOpenDB = realPackOpen;
  check("index request failure carries explicit error state", lookupError && lookupError.state === "error");
  const afterLookupError = await pbpPackLookup(["你好"]);
  check("a lookup error does not poison the next real lookup", afterLookupError && afterLookupError.state === "hit");

  const realMetaOpen = _pbpPackOpenDB;
  _pbpPackOpenDB = async () => ({
    transaction() {
      return { objectStore() { return { get() {
        const req = {};
        queueMicrotask(() => { if (req.onerror) req.onerror(); });
        return req;
      } }; } };
    }
  });
  const metaRequestError = await pbpPackMeta();
  check("metadata request failure carries explicit error state", metaRequestError && metaRequestError.state === "error");
  _pbpPackOpenDB = async () => { throw new Error("open failed"); };
  const metaOpenError = await pbpPackMeta();
  check("metadata database-open failure carries explicit error state", metaOpenError && metaOpenError.state === "error");
  _pbpPackOpenDB = realMetaOpen;

  const dbRef = await _pbpPackOpenDB();
  await new Promise((resolve, reject) => {
    const tx = dbRef.transaction(_PBP_PACK_META, "readwrite");
    tx.objectStore(_PBP_PACK_META).delete("cedict");
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
  const afterMetaDelete = await pbpPackLookup(["你好"]);
  check("lookup is unavailable when meta is missing (not ready)", afterMetaDelete && afterMetaDelete.state === "unavailable");

  async function* throwingLines() {
    yield L_BEIJING;
    throw new Error("boom mid-import");
  }
  let midThrew = false;
  try { await pbpPackImport(throwingLines()); } catch (e) { midThrew = /boom/.test(e && e.message); }
  check("iterator throw after first batch propagates as a rejection", midThrew);
  const metaAfterThrow = await pbpPackMeta();
  check("no ready meta survives a mid-import throw", !metaAfterThrow || metaAfterThrow.state !== "ready");

  const res2 = await pbpPackImport(arrLines(SAMPLE1), null, { bytes: 999 });
  check("re-import: entries count is consistent on overwrite", res2.entries === 6);
  const meta2 = await pbpPackMeta();
  check("re-import: meta reflects the latest stats.bytes", !!meta2 && meta2.bytes === 999);
  const reCheck = await pbpPackLookup(["你好"]);
  check("re-import: does not duplicate rows (old store was cleared first)", !!reCheck && reCheck.rows.length === 1);

  // A synchronous throw part-way through the callback must abort, not commit
  // what it already queued. The import's first transaction queues meta.delete()
  // before clear(), so without the abort a throw from clear() left the data on
  // disk with no meta: present but never queryable again.
  const abortDb = await _pbpPackOpenDB();
  let syncThrew = false;
  try {
    await _pbpPackTx(abortDb, "readwrite", (tx) => {
      tx.objectStore(_PBP_PACK_META).delete("cedict");
      throw new Error("sync boom");
    });
  } catch (e) { syncThrew = /sync boom/.test(e && e.message); }
  check("a synchronous callback throw rejects with the original cause", syncThrew);
  const metaAfterSyncThrow = await pbpPackMeta();
  check("the meta delete queued before that throw was rolled back",
    !!metaAfterSyncThrow && metaAfterSyncThrow.state === "ready" && metaAfterSyncThrow.bytes === 999);
  const hitAfterSyncThrow = await pbpPackLookup(["你好"]);
  check("the pack is still queryable after an aborted transaction",
    !!hitAfterSyncThrow && hitAfterSyncThrow.state === "hit");

  // --- Probe gate ---------------------------------------------------------
  // The import clears the store before it writes, so the file has to be judged
  // BEFORE that clear. Entering this block the installed pack is SAMPLE1:
  // 6 entries, bytes 999. Every rejection below must leave it exactly there.
  const prose = [];
  for (let i = 0; i < 300; i++) prose.push("The quick brown fox jumps over the lazy dog, line " + i + ".");
  let proseErr = null;
  try { await pbpPackImport(arrLines(prose), null, { bytes: 1 }); } catch (e) { proseErr = e; }
  check("a file that is not a CC-CEDICT release is rejected with its own code",
    !!proseErr && proseErr.code === "implausible_pack", "got " + (proseErr && (proseErr.code || proseErr.message)));
  const metaAfterProbe = await pbpPackMeta();
  check("the probe rejection left the installed pack ready and untouched",
    !!metaAfterProbe && metaAfterProbe.state === "ready" && metaAfterProbe.entries === 6 && metaAfterProbe.bytes === 999,
    "got " + JSON.stringify(metaAfterProbe));
  const hitAfterProbe = await pbpPackLookup(["你好"]);
  check("an entry of the installed pack is still queryable after a probe rejection",
    !!hitAfterProbe && hitAfterProbe.state === "hit" && hitAfterProbe.rows.length === 1);

  // Class, not instance: the neighbouring pack's own CSV is the likeliest
  // wrong pick of all (same panel, overlapping accepted extensions).
  const csvRows = ["word,phonetic,definition,translation"];
  for (let i = 0; i < 60; i++) csvRows.push("word" + i + ",wud,a definition," + "释义" + i);
  let csvErr = null;
  try { await pbpPackImport(arrLines(csvRows)); } catch (e) { csvErr = e; }
  check("the sibling pack's CSV is refused by the same gate, not only English prose",
    !!csvErr && csvErr.code === "implausible_pack", "got " + (csvErr && (csvErr.code || csvErr.message)));

  // A file short enough to fit inside the window is judged on the whole file,
  // which is the same 0.5 ratio the malformed check applies downstream -- so
  // it is refused here, before the clear, instead of after it.
  let shortErr = null;
  try { await pbpPackImport(arrLines([L_BEIJING, "not a cedict line", "nor is this one"])); }
  catch (e) { shortErr = e; }
  check("a short wrong file is refused before the clear, not by the post-clear malformed check",
    !!shortErr && shortErr.code === "implausible_pack", "got " + (shortErr && (shortErr.code || shortErr.message)));
  const metaAfterShort = await pbpPackMeta();
  check("the short wrong file left the installed pack ready as well",
    !!metaAfterShort && metaAfterShort.state === "ready" && metaAfterShort.entries === 6);

  // ...while a small file that is mostly real still imports: the gate must not
  // start refusing excerpts and hand-made fixtures (SAMPLE1 itself is six
  // candidate lines and imported cleanly above).
  const smallMixed = await pbpPackImport(arrLines([L_BEIJING, L_NIHAO, "not a cedict line"]), null, { bytes: 7 });
  check("a small file below the window still imports, junk lines and all",
    smallMixed.entries === 2 && smallMixed.malformed === 1, "got " + JSON.stringify(smallMixed));

  // Replay: the probed lines are buffered and fed back, never consumed. A file
  // longer than the window must land EVERY line, including line 0.
  const longFile = [];
  for (let i = 0; i < PBP_PACK_PROBE_LINES + 50; i++) longFile.push("第" + i + "詞 第" + i + "词 [di4 ci2] /word " + i + "/");
  const longRes = await pbpPackImport(arrLines(longFile), null, { bytes: 1234 });
  check("every probed line is replayed into the import rather than dropped",
    longRes.entries === longFile.length, "got " + JSON.stringify(longRes) + " want " + longFile.length);
  const firstOfLong = await pbpPackLookup(["第0词"]);
  check("the first line of the file, read during the probe, is in the store",
    firstOfLong && firstOfLong.state === "hit");
  const pastWindow = await pbpPackLookup(["第" + (longFile.length - 1) + "词"]);
  check("and so is a line from past the probe window", pastWindow && pastWindow.state === "hit");

  // The residual risk this gate does NOT cover, pinned so nobody reads the
  // probe as atomicity: a stream that dies after the window still loses the
  // installed pack. That is what the failure copy has to say out loud.
  async function* throwsPastWindow() {
    for (const line of longFile) yield line;
    throw new Error("boom past the probe window");
  }
  let lateThrew = false;
  try { await pbpPackImport(throwsPastWindow()); } catch (e) { lateThrew = /boom past/.test(e && e.message); }
  check("a throw past the probe window still propagates", lateThrew);
  const metaAfterLateThrow = await pbpPackMeta();
  check("no ready meta survives a throw past the probe window (this path is not atomic)",
    !metaAfterLateThrow || metaAfterLateThrow.state !== "ready");

  let raceImportWaiting = false, releaseRaceImport;
  const raceImportGate = new Promise((r) => { releaseRaceImport = r; });
  // The fixture must clear the probe window before it parks: the probe runs
  // BEFORE the clear, so a generator that stalls inside the window would still
  // be showing the caller the previous pack -- correctly, but that is not the
  // window this case is about. Parking on the pull right after the window puts
  // the stall exactly where the store is cleared and no meta exists yet.
  async function* raceImportLines() {
    for (let i = 0; i < PBP_PACK_PROBE_LINES; i++) yield L_BEIJING;
    raceImportWaiting = true;
    await raceImportGate;
  }
  const raceImport = pbpPackImport(raceImportLines());
  while (!raceImportWaiting) await new Promise((r) => setTimeout(r, 0));
  const duringImport = await pbpPackLookup(["北京"]);
  check("lookup during import is unavailable, never a ready miss from a second meta read",
    duringImport && duringImport.state === "unavailable");
  releaseRaceImport();
  await raceImport;
  const afterRaceImport = await pbpPackLookup(["北京"]);
  check("lookup becomes a hit only after import writes ready meta", afterRaceImport && afterRaceImport.state === "hit");

  // Two controlled writers: prove Web Locks serializes pbpPackImport callers
  // rather than letting a second import race the first's clear+put tx.
  let writerAStarted = false, writerAFinished = false, writerBStarted = false;
  let releaseWriterA;
  const gate = new Promise((r) => { releaseWriterA = r; });
  async function* writerA() {
    writerAStarted = true;
    yield L_BEIJING;
    await gate;
    yield L_NIHAO;
  }
  async function* writerB() {
    writerBStarted = true;
    yield L_CESHI_A;
  }
  const p1 = pbpPackImport(writerA()).then((r) => { writerAFinished = true; return r; });
  await new Promise((r) => setTimeout(r, 30));
  check("Web Locks: writer A acquired the lock and is running", writerAStarted);
  const p2 = pbpPackImport(writerB());
  await new Promise((r) => setTimeout(r, 30));
  check("Web Locks: writer B is queued behind writer A, not yet started", !writerBStarted);
  check("Web Locks: writer A has not finished (still holding the lock)", !writerAFinished);
  releaseWriterA();
  const [, r2] = await Promise.all([p1, p2]);
  check("Web Locks: writer A completed", writerAFinished);
  check("Web Locks: writer B started only after writer A released the lock", writerBStarted);
  check("Web Locks: writer B's own entries count", r2.entries === 1);
  const metaFinal = await pbpPackMeta();
  check("Web Locks: last writer wins (store reflects writer B only)", !!metaFinal && metaFinal.entries === 1);
  const lookupA = await pbpPackLookup(["北京"]);
  check("Web Locks: writer A's data was cleared by writer B's overwrite", lookupA && lookupA.state === "ready-miss");

  const delRes = await pbpPackDelete();
  check("pbpPackDelete resolves true", delRes === true);
  const metaAfterDelete = await pbpPackMeta();
  check("meta is null after delete", metaAfterDelete === null);
  const lookupAfterDelete = await pbpPackLookup(["测试"]);
  check("lookup is unavailable after delete", lookupAfterDelete && lookupAfterDelete.state === "unavailable");

  section("ECDICT IDB layer");
  // Clean slate, then build a v1 database BY HAND (matching exactly what the
  // old schema created) with a sentinel row, so the upgrade path is exercised
  // for real rather than simulated.
  await new Promise((r) => { const d = indexedDB.deleteDatabase("pbp-dict-packs"); d.onsuccess = d.onerror = d.onblocked = r; });
  _pbpPackDbPromise = null;
  await new Promise((res, rej) => {
    const rq = indexedDB.open("pbp-dict-packs", 1);
    rq.onupgradeneeded = () => {
      const db = rq.result;
      const st = db.createObjectStore("cedict", { keyPath: "id", autoIncrement: true });
      st.createIndex("simp", "simp", { unique: false });
      st.createIndex("trad", "trad", { unique: false });
      db.createObjectStore("packs", { keyPath: "id" });
    };
    rq.onsuccess = () => {
      const db = rq.result;
      const tx = db.transaction(["cedict", "packs"], "readwrite");
      tx.objectStore("cedict").put({ trad: "沙丁魚", simp: "沙丁鱼", pinyin: "sha1 ding1 yu2", defs: ["sardine"] });
      tx.objectStore("packs").put({ id: "cedict", state: "ready", entries: 1, importedAt: 1, bytes: 7 });
      tx.oncomplete = () => { db.close(); res(); };
      tx.onerror = () => rej(tx.error);
    };
    rq.onerror = () => rej(rq.error);
  });
  const upgraded = await _pbpPackOpenDB();
  check("v1 -> v2 upgrade adds the ecdict store", upgraded.objectStoreNames.contains("ecdict"));
  check("v1 -> v2 upgrade keeps cedict and packs", upgraded.objectStoreNames.contains("cedict") && upgraded.objectStoreNames.contains("packs"));
  const survivedMeta = await pbpPackMeta();
  check("a CC-CEDICT pack imported before the upgrade is still ready", !!survivedMeta && survivedMeta.state === "ready" && survivedMeta.bytes === 7);
  const survivedHit = await pbpPackLookup(["沙丁鱼"]);
  check("and is still queryable, so nobody has to import it again", survivedHit && survivedHit.state === "hit");
  check("ecdict starts unavailable on a freshly upgraded database", (await pbpEcdictLookup("word")).state === "unavailable");

  async function* eLines(arr) { for (const l of arr) yield l; }
  const E_STATS = () => ({ bytes: 4242, crc: 0 });

  let noRows = "";
  try { await pbpEcdictImport(eLines([E_HDR]), E_STATS(), { rung: "R1" }); }
  catch (e) { noRows = e.message; }
  check("a header with no usable rows is rejected before any transaction", /no usable rows/.test(noRows));
  check("that rejection left ecdict untouched", (await pbpEcdictLookup("ephemeral")).state === "unavailable");

  let badHdr = "";
  try { await pbpEcdictImport(eLines(["word,word,translation", E_EPHEMERAL]), E_STATS(), {}); }
  catch (e) { badHdr = e.message; }
  check("a duplicate header column is rejected as not-ECDICT", /not an ECDICT csv/.test(badHdr));

  let fatalQuote = "";
  try { await pbpEcdictImport(eLines([E_HDR, E_EPHEMERAL, 'x,"unterminated,y']), E_STATS(), {}); }
  catch (e) { fatalQuote = e.message; }
  check("one unclosed quote rejects the whole import, not just its line", /unclosed-quote/.test(fatalQuote));

  const okRes = await pbpEcdictImport(eLines([E_HDR, E_EPHEMERAL, E_AARDVARK, E_ACOME]), E_STATS(), { rung: "R1" });
  check("R1 import stores only the rows that rung admits", okRes.entries === 2);
  const eHit = await pbpEcdictLookup("Ephemeral");
  check("lookup is case-insensitive through the shared key rule", eHit.state === "hit" && eHit.rows.length === 1);
  check("lookup returns the stored display form", eHit.rows[0].word === "ephemeral");
  check("a word the rung excluded is a ready miss, not unavailable", (await pbpEcdictLookup("a-come")).state === "ready-miss");
  const eMeta = await pbpEcdictMeta();
  check("meta records the rung actually used", !!eMeta && eMeta.rung === "R1" && eMeta.entries === 2);
  check("meta records the decoded byte count", eMeta.decodedBytes === 4242);
  check("meta carries an 8-hex diagnostic checksum", /^[0-9a-f]{8}$/.test(eMeta.decodedCrc32));

  // Atomicity: a put() that throws synchronously part-way through the batch must
  // abort, leaving the previously imported pack intact rather than half-replaced.
  const dbA = await _pbpPackOpenDB();
  let cloneThrew = false;
  try {
    await _pbpPackTx(dbA, "readwrite", (tx) => {
      _pbpEcdictCommit(tx, [{ key: "a", word: "a", translation: "n. 甲" }, { key: "b", word: "b", translation: () => {} }],
        { id: "ecdict", state: "ready", entries: 2 }, null);
    }, ["ecdict", "packs"]);
  } catch (e) { cloneThrew = true; }
  check("a non-cloneable record aborts the atomic replace", cloneThrew);
  const afterAbort = await pbpEcdictLookup("ephemeral");
  check("the previous ECDICT pack survives an aborted replace", afterAbort.state === "hit");
  const metaAfterAbort = await pbpEcdictMeta();
  check("and its meta still reports the old entry count", !!metaAfterAbort && metaAfterAbort.entries === 2 && metaAfterAbort.rung === "R1");

  // A record with a REAL newline inside a quoted field, driven through the whole
  // production path: byte stream -> pbpCedictLines physical-line split ->
  // pbpEcdictImport. The first physical line carries the unterminated quote, so
  // the file is rejected outright and the tail never becomes a phantom record.
  const multiCsv = [E_HDR, E_AARDVARK, 'bad,"line one', 'line two",,n. 乙,,,,,0,1,,,'].join("\n");
  const multiStream = new ReadableStream({ start(c) { c.enqueue(new TextEncoder().encode(multiCsv)); c.close(); } });
  const multiStats = { bytes: 0, crc: 0 };
  let multiErr = "";
  try { await pbpEcdictImport(pbpCedictLines(multiStream, false, multiStats, PBP_ECDICT_MAX_BYTES), multiStats, { rung: "R1" }); }
  catch (e) { multiErr = e.message; }
  check("a real newline inside a quoted field rejects the file through the full stream path",
    /unclosed-quote/.test(multiErr));
  check("the tail of that record never became a phantom entry", (await pbpEcdictLookup("line two")).state !== "hit");
  check("and the pack that was already imported survived it", (await pbpEcdictLookup("ephemeral")).state === "hit");

  // "Rejected before any transaction" has to be OBSERVED, not inferred: a check
  // on error text plus unchanged data would also pass if a transaction had been
  // opened and rolled back.
  const realTx = IDBDatabase.prototype.transaction;
  let txOpens = 0;
  IDBDatabase.prototype.transaction = function (...a) { txOpens++; return realTx.apply(this, a); };
  try {
    try { await pbpEcdictImport(eLines([E_HDR, E_ACOME]), E_STATS(), { rung: "R1" }); } catch (_) {}
  } finally { IDBDatabase.prototype.transaction = realTx; }
  check("a file with no admissible rows opens no transaction at all", txOpens === 0);

  // Resource ceilings reject rather than truncate.
  const manyRows = [E_HDR];
  for (let n = 0; n < PBP_ECDICT_MAX_ENTRIES + 2; n++) manyRows.push(`w${n},,,n. 甲,,,,,0,1,,,`);
  let tooMany = "";
  try { await pbpEcdictImport(eLines(manyRows), E_STATS(), { rung: "R1" }); } catch (e) { tooMany = e.message; }
  check("more admissible rows than the entry ceiling rejects the file", /entry count above/.test(tooMany));

  const fatRows = [E_HDR];
  const fatTrans = "甲".repeat(PBP_ECDICT_MAX_TRANS_UNITS);
  for (let n = 0; n < Math.ceil(PBP_ECDICT_MAX_PAYLOAD_BYTES / (PBP_ECDICT_MAX_TRANS_UNITS * 3)) + 2; n++) {
    fatRows.push(`f${n},,,${fatTrans},,,,,0,1,,,`);
  }
  let tooFat = "";
  try { await pbpEcdictImport(eLines(fatRows), E_STATS(), { rung: "R1" }); } catch (e) { tooFat = e.message; }
  check("payload past the byte ceiling rejects the file", /payload above/.test(tooFat));

  // Malformed ratio: 1 bad row in 300 passes, 1 in 50 does not.
  const ratioRows = (bad, good) => {
    const out = [E_HDR];
    for (let n = 0; n < bad; n++) out.push("short,row");
    for (let n = 0; n < good; n++) out.push(`g${n},,,n. 甲,,,,,0,1,,,`);
    return out;
  };
  const underRatio = await pbpEcdictImport(eLines(ratioRows(1, 299)), E_STATS(), { rung: "R1" });
  check("a malformed row rate under 1% imports and is counted", underRatio.entries === 299 && underRatio.malformed === 1);
  let overRatio = "";
  try { await pbpEcdictImport(eLines(ratioRows(2, 48)), E_STATS(), { rung: "R1" }); } catch (e) { overRatio = e.message; }
  check("a malformed row rate over 1% rejects the file", /too many malformed/.test(overRatio));

  // Fresh install (oldVersion 0) must create all three stores, not just ecdict.
  await new Promise((r) => { const d = indexedDB.deleteDatabase("pbp-fresh-probe"); d.onsuccess = d.onerror = d.onblocked = r; });
  const freshStores = await new Promise((res, rej) => {
    const rq = indexedDB.open("pbp-fresh-probe", 2);
    rq.onupgradeneeded = (ev) => {
      const db = rq.result;
      if (ev.oldVersion < 1) {
        const st = db.createObjectStore("cedict", { keyPath: "id", autoIncrement: true });
        st.createIndex("simp", "simp", { unique: false });
        st.createIndex("trad", "trad", { unique: false });
        db.createObjectStore("packs", { keyPath: "id" });
      }
      if (ev.oldVersion < 2) {
        db.createObjectStore("ecdict", { keyPath: "id", autoIncrement: true }).createIndex("key", "key", { unique: false });
      }
    };
    rq.onsuccess = () => { const n = Array.from(rq.result.objectStoreNames); rq.result.close(); res(n); };
    rq.onerror = () => rej(rq.error);
  });
  check("a fresh v2 install creates cedict, packs and ecdict",
    freshStores.includes("cedict") && freshStores.includes("packs") && freshStores.includes("ecdict"));
  await new Promise((r) => { const d = indexedDB.deleteDatabase("pbp-fresh-probe"); d.onsuccess = d.onerror = d.onblocked = r; });

  // The transaction dying PART-WAY THROUGH the batches, which is what a real
  // write failure looks like. The spec wanted this driven by an exhausted quota,
  // but CDP's Storage.overrideQuotaForOrigin does not constrain a
  // chrome-extension origin: 20,000 high-entropy records still committed under a
  // 794 KB quota. So the transaction is aborted from inside a success callback
  // instead, which exercises the same rollback path this guarantee rests on.
  {
    const good = await pbpEcdictImport(eLines([E_HDR, E_EPHEMERAL, E_AARDVARK]), E_STATS(), { rung: "R1" });
    check("a pack is in place before the mid-batch failure", good.entries === 2);
    const realPut = IDBObjectStore.prototype.put;
    let puts = 0;
    IDBObjectStore.prototype.put = function (...a) {
      const req = realPut.apply(this, a);
      if (this.name === "ecdict" && ++puts === 2) {
        // Kill the transaction once records are already going in.
        req.addEventListener("success", () => { try { this.transaction.abort(); } catch (_) {} });
      }
      return req;
    };
    let aborted = false;
    try {
      await pbpEcdictImport(eLines([E_HDR, E_ACOME, E_DEFEN, E_AARDVARK, E_EPHEMERAL]), E_STATS(), { rung: "R3" });
    } catch (_) { aborted = true; } finally { IDBObjectStore.prototype.put = realPut; }
    check("an abort part-way through the batches rejects the import", aborted);
    const survived = await pbpEcdictMeta();
    check("the previous pack's meta is untouched by the failed replacement",
      !!survived && survived.state === "ready" && survived.entries === 2 && survived.rung === "R1");
    check("and its records are still queryable", (await pbpEcdictLookup("ephemeral")).state === "hit");
    check("no record from the failed replacement landed", (await pbpEcdictLookup("defenestrate")).state === "ready-miss");
  }

  // Re-import at a wider rung replaces rather than accumulates.
  const wideRes = await pbpEcdictImport(eLines([E_HDR, E_EPHEMERAL, E_AARDVARK, E_ACOME, E_ABHUMAN, E_DEFEN]), E_STATS(), { rung: "R3" });
  check("R3 import admits the definition-only row", wideRes.entries === 4);
  check("a web-only gloss stays out even at the widest rung", (await pbpEcdictLookup("abhuman")).state === "ready-miss");
  check("re-import replaces instead of duplicating", (await pbpEcdictLookup("ephemeral")).rows.length === 1);

  // The two packs share a database and a meta store but never each other's state.
  await pbpEcdictDelete();
  check("deleting the ECDICT pack makes it unavailable", (await pbpEcdictLookup("ephemeral")).state === "unavailable");
  const cedictStillThere = await pbpPackLookup(["沙丁鱼"]);
  check("deleting the ECDICT pack leaves CC-CEDICT untouched", cedictStillThere && cedictStillThere.state === "hit");

  section("pbpPackZipTextStream");
  // Hand-built single-entry zips: local header + data + central dir + EOCD.
  // Real CRC32 and true uncompressed size so the fixtures are also valid for
  // standard ZIP tools (our reader skips CRC, but honest fixtures prove
  // interop rather than merely echoing the reader's own assumptions).
  function crc32(bytes) {
    let c, crc = 0xffffffff;
    for (let i = 0; i < bytes.length; i++) {
      c = (crc ^ bytes[i]) & 0xff;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
      crc = (crc >>> 8) ^ c;
    }
    return (crc ^ 0xffffffff) >>> 0;
  }
  function buildZip(name, rawBytes, dataBytes, method) {
    const enc = new TextEncoder();
    const nameB = enc.encode(name);
    const crc = crc32(rawBytes);
    const verNeeded = method === 8 ? 20 : 10; // APPNOTE 4.4.3: deflate needs 2.0
    const lh = new Uint8Array(30 + nameB.length);
    const lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, verNeeded, true);
    lv.setUint16(8, method, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, dataBytes.length, true);
    lv.setUint32(22, rawBytes.length, true);
    lv.setUint16(26, nameB.length, true);
    lh.set(nameB, 30);
    const localOfs = 0;
    const cd = new Uint8Array(46 + nameB.length);
    const cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, verNeeded, true);
    cv.setUint16(6, verNeeded, true);
    cv.setUint16(10, method, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, dataBytes.length, true);
    cv.setUint32(24, rawBytes.length, true);
    cv.setUint16(28, nameB.length, true);
    cv.setUint32(42, localOfs, true);
    cd.set(nameB, 46);
    const cdOfs = lh.length + dataBytes.length;
    const eocd = new Uint8Array(22);
    const ev = new DataView(eocd.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, 1, true);
    ev.setUint16(10, 1, true);
    ev.setUint32(12, cd.length, true);
    ev.setUint32(16, cdOfs, true);
    return new Blob([lh, dataBytes, cd, eocd]);
  }
  async function collectLines(stream) {
    const out = [];
    for await (const line of pbpCedictLines(stream, false)) out.push(line);
    return out;
  }
  const zipContent = "中國 中国 [Zhong1 guo2] /China/\n";
  const zipRaw = new TextEncoder().encode(zipContent);
  const storedZip = buildZip("cedict_ts.u8", zipRaw, zipRaw, 0);
  const storedLines = await collectLines(await pbpPackZipTextStream(storedZip));
  assertEq(storedLines.length, 1, "stored zip: one line extracted");
  check("stored zip: content intact", storedLines[0].indexOf("Zhong1 guo2") >= 0);

  const deflateBlob = new Blob([new TextEncoder().encode(zipContent)]);
  const deflateBytes = new Uint8Array(await new Response(
    deflateBlob.stream().pipeThrough(new CompressionStream("deflate-raw"))
  ).arrayBuffer());
  const deflateZip = buildZip("cedict_ts.u8", zipRaw, deflateBytes, 8);
  const deflateLines = await collectLines(await pbpPackZipTextStream(deflateZip));
  check("deflate zip: decompressed and parsed", deflateLines.length === 1 && deflateLines[0].indexOf("/China/") >= 0);

  let zipErr = false;
  try { await pbpPackZipTextStream(new Blob([new Uint8Array([1, 2, 3, 4])])); } catch (e) { zipErr = /zip/.test(e.message); }
  check("non-zip blob throws a zip error", zipErr);

  const zipFile = new File([await storedZip.arrayBuffer()], "cedict.zip");
  await new Promise((r) => { const del = indexedDB.deleteDatabase("pbp-dict-packs"); del.onsuccess = del.onerror = del.onblocked = r; });
  const zipRes = await pbpPackImportFile(zipFile, null);
  check("pbpPackImportFile imports a .zip end to end", zipRes.entries === 1);

  document.getElementById("summary").textContent = pass + " passed, " + fail + " failed";
})();
</script>
</body></html>
