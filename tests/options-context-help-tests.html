<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Options Context Help Tests</title>
<style>
.case.pass{color:#0a0}.case.fail{color:#c00;font-weight:bold}
#fixture{position:absolute;left:-10000px;top:0;width:1500px;height:9000px;border:0}
</style>
</head><body>
<div id="results"></div>
<iframe id="fixture" title="Options layout fixture"></iframe>
<script src="../i18n.js"></script>
<script>
const results = document.getElementById("results");
function report(name, error) {
  const row = document.createElement("div");
  row.className = "case " + (error ? "fail" : "pass");
  row.textContent = (error ? "X " : "OK ") + name + (error ? " :: " + error.message : "");
  results.appendChild(row);
}
function assert(condition, message) { if (!condition) throw new Error(message); }
function test(name, fn) {
  try { fn(); report(name); } catch (error) { report(name, error); }
}

(async () => {
  const source = await fetch("../options.html").then((response) => response.text());
  const cssSource = await fetch("../options.css").then((response) => response.text());
  const inert = source
    .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, "")
    .replace("<head>", "<head><base href=\"../\">");
  const frame = document.getElementById("fixture");
  const loaded = new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
  frame.srcdoc = inert;
  await loaded;
  const doc = frame.contentDocument;
  doc.documentElement.lang = "zh-Hans";
  doc.querySelectorAll(".context-help-toggle .btn-ic").forEach((slot) => {
    slot.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>';
  });
  // A .switch choice row carries its help INSIDE the label, between the copy
  // and the track (Ruling 36): there the label is the anchor and the label's
  // parent the host. Every other help sits in its host after its anchor.
  const helpInLabel = (details) => !!details?.parentElement?.matches("label");
  const helpHost = (details) => helpInLabel(details) ? details.parentElement.parentElement : details?.parentElement;
  const helpAnchor = (details) => helpInLabel(details) ? details.parentElement : details?.previousElementSibling;
  const zhMessages = await fetch("../_locales/zh_CN/messages.json").then((response) => response.json());
  doc.querySelectorAll("details.context-help").forEach((details) => {
    const body = details.querySelector(".context-help-body[data-i18n]");
    const anchor = helpAnchor(details);
    const anchorCopy = anchor?.matches("[data-i18n]")
      ? anchor
      : anchor?.querySelector("[data-i18n]");
    const actionCopy = anchor?.matches(".save-theme-wrap")
      ? anchor.querySelector("[data-i18n]")
      : null;
    [body, anchorCopy, actionCopy].filter(Boolean).forEach((node) => {
      const message = zhMessages[node.dataset.i18n]?.message;
      if (typeof message === "string") node.textContent = message;
    });
    const host = helpHost(details);
    const copyNode = host?.dataset.helpRole === "choice"
      ? (anchor?.querySelector("span[data-i18n]") || anchor)
      : host?.dataset.helpRole === "action"
        ? (anchor?.querySelector("button") || anchor)
        : anchor;
    if (host && copyNode) host.dataset.helpScript = pbpI18nScriptFamily(copyNode.textContent);
  });

  const layoutCases = [
    ["optSyncHint", "choice"],
    ["storageIntro", "section"],
    ["batchAiHint", "group"],
    ["saveAsThemeHint", "action"],
  ];

  function reveal(details) {
    const panel = details.closest(".panel");
    assert(panel, "context help has no panel");
    doc.querySelectorAll(".panel").forEach((candidate) => {
      candidate.classList.toggle("active", candidate === panel);
    });
    for (let node = details.parentElement; node && node !== panel; node = node.parentElement) {
      if (node.hidden) node.hidden = false;
      if (node.matches("details")) node.open = true;
    }
  }

  function parts(key) {
    const body = doc.querySelector(`[data-i18n="${key}"]`);
    const details = body?.closest("details.context-help");
    assert(details, key + " has no contextual disclosure");
    reveal(details);
    doc.querySelectorAll("details.context-help[open]").forEach((candidate) => {
      if (candidate !== details) candidate.open = false;
    });
    details.open = false;
    return {
      body,
      details,
      host: helpHost(details),
      anchor: helpAnchor(details),
      toggle: details.querySelector(":scope > summary.context-help-toggle"),
    };
  }

  // The anchor's own row. An in-label help's answer opens INSIDE the label, so
  // the label box grows with it; its first line (padding box around the copy
  // line) is the row the answer must hang under.
  function anchorRowRect(anchor) {
    const rect = anchor.getBoundingClientRect();
    const copy = anchor.matches("label.switch") && anchor.querySelector(":scope > details.context-help")
      ? anchor.querySelector(":scope > .switch-text") : null;
    if (!copy) return rect;
    const bottom = copy.getBoundingClientRect().bottom + parseFloat(frame.contentWindow.getComputedStyle(anchor).paddingBottom);
    return { top: rect.top, left: rect.left, right: rect.right, bottom, width: rect.width, height: bottom - rect.top };
  }

  function textInkRect(anchor) {
    if (anchor.matches(".save-theme-wrap")) {
      return (anchor.querySelector("button") || anchor).getBoundingClientRect();
    }
    const textNode = anchor.matches("label")
      ? (anchor.querySelector("span[data-i18n]") || anchor)
      : anchor;
    const range = doc.createRange();
    range.selectNodeContents(textNode);
    return range.getBoundingClientRect();
  }

  test("context help has one adjacent text anchor", () => {
    const disclosures = [...doc.querySelectorAll("details.context-help:not(.context-help-inline)")];
    assert(disclosures.length >= 25, "too few contextual disclosures: " + disclosures.length);
    disclosures.forEach((details) => {
      const host = helpHost(details);
      const anchor = helpAnchor(details);
      const key = details.querySelector(".context-help-body")?.dataset.i18n || "unknown";
      assert(host?.classList.contains("context-help-host"), key + " left its contextual-help host");
      assert(anchor?.matches("label,.section-title,.bl,.context-help-anchor"), key + " has no adjacent text anchor");
      assert(anchor.textContent.trim(), key + " anchor is empty");
    });
  });

  test("every contextual help host declares one semantic typography role", () => {
    const validRoles = new Set(["section", "field", "choice", "group", "action"]);
    const transformByRole = new Map();
    const disclosures = [...doc.querySelectorAll("details.context-help")];
    const violations = [];
    assert(disclosures.length >= 25, "too few contextual disclosures: " + disclosures.length);
    disclosures.forEach((details) => {
      const body = details.querySelector(".context-help-body");
      const key = body?.dataset.i18n || "unknown";
      const host = helpHost(details);
      const anchor = helpAnchor(details);
      const toggle = details.querySelector(":scope > summary.context-help-toggle");
      const role = host?.dataset.helpRole;
      const script = host?.dataset.helpScript;
      if (!validRoles.has(role)) violations.push(key + " role=" + (role || "missing"));
      if (!new Set(["cjk", "alphabetic"]).has(script)) {
        violations.push(key + " script=" + (script || "missing"));
      }
      const expectedRole = host?.classList.contains("context-help-action-row") ? "action"
        : host?.classList.contains("context-help-section") ? "section"
        : anchor?.matches("label") && anchor.querySelector('input[type="checkbox"],input[type="radio"]') ? "choice"
        : anchor?.matches("label.bl") ? "field"
        : anchor?.matches(".bl,.context-help-anchor") ? "group"
        : null;
      if (role !== expectedRole) violations.push(`${key} declared=${role || "missing"}, expected=${expectedRole || "unknown"}`);
      assert(anchor && toggle, key + " has no measurable anchor/toggle pair");
      reveal(details);
      doc.querySelectorAll("details.context-help[open]").forEach((candidate) => {
        if (candidate !== details) candidate.open = false;
      });
      details.open = false;
      const a = textInkRect(anchor);
      const t = toggle.getBoundingClientRect();
      assert(t.width >= 24 && t.height >= 24, key + " lost the 24px hit target");
      const icon = toggle.querySelector("svg")?.getBoundingClientRect();
      assert(icon && icon.width <= 14 && icon.height <= 14, key + " icon is too prominent");
      const visualGap = icon.left - a.right;
      if (visualGap < 6 || visualGap > 8) violations.push(key + " visual gap=" + visualGap);
      const iconStyle = frame.contentWindow.getComputedStyle(toggle.querySelector(".btn-ic"));
      // One transform per (role, script) bucket for every host on the page:
      // since stage 3c every host renders its anchor at the row model's
      // --opt-text-section / --opt-text-body face.
      const transformKey = role + "/" + script;
      const priorTransform = transformByRole.get(transformKey);
      if (priorTransform && priorTransform !== iconStyle.transform) {
        violations.push(`${key} role=${role} script=${script} transform=${iconStyle.transform}, expected=${priorTransform}`);
      } else {
        transformByRole.set(transformKey, iconStyle.transform);
      }
      if (toggle.style.transform || toggle.querySelector(".btn-ic").style.transform) {
        violations.push(key + " has a per-instance inline transform");
      }
    });
    const calibrationBlocks = [...cssSource.matchAll(/([^{}]+)\{([^{}]*--context-help-optical-y\s*:[^{}]+)\}/g)];
    assert(calibrationBlocks.length >= 1, "context-help optical calibration contract missing");
    calibrationBlocks.forEach(([, selector]) => {
      assert(selector.includes("[data-help-role"), "non-role optical calibration selector=" + selector.trim());
    });
    assert(!violations.length, violations.slice(0, 12).join("; "));
  });

  test("opening help never moves its owning row", () => {
    layoutCases.forEach(([key, type]) => {
      const { details, anchor, toggle } = parts(key);
      const beforeAnchor = anchor.getBoundingClientRect();
      const beforeToggle = toggle.getBoundingClientRect();
      details.open = true;
      const afterAnchor = anchor.getBoundingClientRect();
      const afterToggle = toggle.getBoundingClientRect();
      assert(Math.abs(afterAnchor.top - beforeAnchor.top) <= 1, type + "/" + key + " anchor shifted=" + (afterAnchor.top - beforeAnchor.top));
      assert(Math.abs(afterToggle.top - beforeToggle.top) <= 1, type + "/" + key + " toggle shifted=" + (afterToggle.top - beforeToggle.top));
    });
  });

  test("every help toggle owns its own hit area over neighbouring switches", () => {
    // The 24px target overflows its 20px row by 2px each way, and a .switch
    // row's native input is an absolute box stretched 2px past its row. Hit
    // testing follows paint order, so a toggle that paints below the next
    // row's input loses its lower edge to it: clicking there flips the switch
    // instead of opening the help. Probe the centre, a point 2px above the
    // bottom of the glyph (the part of the icon nearest the next row) and the
    // target's last pixel row, which is where the overlap actually is once
    // the icon is rendered: the lower 0.5-2px of the 24px box. Two help rows
    // in a row overlap each other's targets by that same strip; the later one
    // paints on top and that is harmless (both open help), so the edge probe
    // only requires *a* help toggle, never a neighbouring control.
    const toggles = [...doc.querySelectorAll("details.context-help > summary.context-help-toggle")];
    assert(toggles.length >= 25, "too few help toggles: " + toggles.length);
    const stolen = [];
    // options.js reveals .container after init; the inert fixture never runs
    // it, and visibility:hidden boxes are not hit-testable.
    const container = doc.querySelector(".container");
    const priorVisibility = container.style.visibility;
    container.style.visibility = "visible";
    toggles.forEach((toggle) => {
      const details = toggle.parentElement;
      const key = details.querySelector(".context-help-body[data-i18n]")?.dataset.i18n || "?";
      reveal(details);
      doc.querySelectorAll("details.context-help[open]").forEach((candidate) => { candidate.open = false; });
      toggle.scrollIntoView({ block: "center" });
      const t = toggle.getBoundingClientRect();
      const icon = toggle.querySelector("svg")?.getBoundingClientRect();
      assert(t.width && icon?.height, key + " toggle is not rendered");
      const cx = t.left + t.width / 2;
      [["centre", cx, t.top + t.height / 2, true], ["glyph bottom", cx, icon.bottom - 2, true], ["bottom edge", cx, t.bottom - 0.5, false]].forEach(([where, x, y, own]) => {
        const hit = doc.elementFromPoint(x, y);
        const owner = hit?.closest("summary.context-help-toggle");
        if (own ? owner !== toggle : !owner) stolen.push(`${key} ${where} -> ${hit ? (hit.id || hit.tagName.toLowerCase() + "." + hit.className) : "nothing"}`);
      });
    });
    container.style.visibility = priorVisibility;
    assert(!stolen.length, stolen.slice(0, 12).join("; "));
  });

  test("the settings search dropdown paints above every panel's rows", () => {
    // .options-nav is sticky, hence a stacking context: without its own
    // z-index the dropdown inside it paints under positioned boxes later in
    // the main column (a .switch row's input spans its whole row), so the
    // right part of a result hit the setting underneath. Probe every panel
    // as the active one, at 90% of each visible result's width.
    const container = doc.querySelector(".container");
    const priorVisibility = container.style.visibility;
    container.style.visibility = "visible";
    doc.querySelectorAll("details.context-help[open]").forEach((candidate) => { candidate.open = false; });
    const host = doc.getElementById("options-search-results");
    assert(host && host.closest(".options-nav"), "search results left the sticky nav");
    frame.contentWindow.scrollTo(0, 0);
    host.hidden = false;
    for (let i = 0; i < 10; i++) {
      const button = doc.createElement("button");
      button.type = "button";
      button.className = "options-search-result";
      const label = doc.createElement("span");
      label.className = "options-search-result-label";
      label.textContent = "Show result " + i;
      const panelName = doc.createElement("span");
      panelName.className = "options-search-result-panel";
      panelName.textContent = "Popup";
      button.append(label, panelName);
      host.appendChild(button);
    }
    const stolen = [];
    let probes = 0;
    const hostRect = host.getBoundingClientRect();
    doc.querySelectorAll(".panel").forEach((panel) => {
      doc.querySelectorAll(".panel").forEach((candidate) => candidate.classList.toggle("active", candidate === panel));
      host.querySelectorAll(".options-search-result").forEach((result) => {
        const r = result.getBoundingClientRect();
        const y = r.top + r.height / 2;
        if (y < hostRect.top || y > hostRect.bottom) return;
        probes++;
        const hit = doc.elementFromPoint(r.left + r.width * 0.9, y);
        if (hit?.closest(".options-search-result") !== result) {
          stolen.push(`${panel.id} ${result.textContent.slice(0, 13)} -> ${hit ? (hit.id || hit.tagName.toLowerCase() + "." + hit.className) : "nothing"}`);
        }
      });
    });
    host.replaceChildren();
    host.hidden = true;
    container.style.visibility = priorVisibility;
    assert(probes >= 60, "too few dropdown probes: " + probes);
    assert(!stolen.length, stolen.length + " stolen: " + stolen.slice(0, 8).join("; "));
  });

  test("help inside a switch label opens without toggling the switch", () => {
    // A .switch choice row's <details> sits INSIDE its label (Ruling 36).
    // HTML: a label does not activate its control for clicks on interactive
    // content descendants, and <details> is interactive content -- so the
    // summary and the answer must open/hold the help and leave the checkbox
    // alone. Positive control per row: a click on the copy DOES toggle, so a
    // probe that could never see a toggle cannot pass.
    const inLabel = [...doc.querySelectorAll("label.switch > details.context-help")];
    assert(inLabel.length >= 10, "too few in-label help rows: " + inLabel.length);
    const failures = [];
    inLabel.forEach((details) => {
      const label = details.parentElement;
      const input = label.querySelector(":scope > input[type=checkbox]");
      const copy = label.querySelector(":scope > .switch-text");
      const summary = details.querySelector(":scope > summary.context-help-toggle");
      const body = details.querySelector(".context-help-body");
      const key = body?.dataset.i18n || input?.id || "?";
      reveal(details);
      details.open = false;
      const initial = input.checked;
      summary.click();
      if (input.checked !== initial) failures.push(key + " summary click toggled the switch");
      if (!details.open) failures.push(key + " summary click did not open the help");
      body.click();
      if (input.checked !== initial) failures.push(key + " answer click toggled the switch");
      copy.click();
      if (input.checked === initial) failures.push(key + " copy click did not toggle (probe is blind)");
      input.checked = initial;
      details.open = false;
      if (input.getAttribute("aria-labelledby") !== copy.id || !copy.id) failures.push(key + " input is not labelled by its copy span alone");
    });
    assert(!failures.length, failures.slice(0, 12).join("; "));
  });

  // Stage-3a (Task 3, ui-system-stage3a-design §3, Controller ruling 3a): a
  // radio choice host's <details> is the label's SIBLING (spec §2: "radio：
  // details 是 label 的兄弟"), a DIFFERENT DOM shape from the switch case the
  // sweep just above already covers (details sits INSIDE label.switch there).
  // #opt-ai-use-transcript (the group's one switch row) is already exercised
  // by that generic `label.switch > details.context-help` sweep -- it needs
  // no separate assertion here. #opt-ai-src-local is the first radio choice
  // host on the page (#panel-ai-behavior's mixed "AI Content Source" group),
  // so this is new coverage, not a duplicate of the switch test above.
  test("help beside a radio choice row opens without changing the selected radio", () => {
    const { details, host, toggle, body } = parts("aiContentSourceLocalHint");
    const input = doc.getElementById("opt-ai-src-local");
    const other = doc.getElementById("opt-ai-src-jina");
    assert(input && other, "AI content-source radio fixture incomplete");
    assert(host?.classList.contains("pref-row"), "opt-ai-src-local help host left the pref-row model");
    const initial = input.checked;
    details.open = false;
    toggle.click();
    assert(input.checked === initial, "toggle click changed the radio");
    assert(details.open, "toggle click did not open the help");
    body.click();
    assert(input.checked === initial, "answer click changed the radio");
    details.open = false;
    // Positive control: a click on the OTHER radio's own label DOES move the
    // selection, so a probe that could never see a change cannot pass.
    other.click();
    assert(other.checked && !input.checked, "sibling radio click did not select it (probe is blind)");
    input.click();
    assert(input.checked && !other.checked, "restoring the original radio selection failed");
  });

  // Fix round 1 (IMPORTANT finding 1): the test above only proves
  // `.click()` called directly on the answer paragraph doesn't forward to
  // the radio -- that is guaranteed by HTML's labeled-control activation
  // behaviour regardless of any CSS bug (the answer is inside `<details>`,
  // interactive content, a label never forwards clicks on interactive-
  // content descendants) and would pass even with the original regression
  // in place. The regression was a HIT-TESTING bug: options.css used to
  // point the hidden radio's `inset: 0` at `.context-help-host`, whose own
  // box grows a second grid row once the answer opens -- so a REAL click
  // at the answer's on-screen position hit-tested to the invisible radio
  // UNDER it, not the answer, and selected this option instead of letting
  // the click reach the text. `elementFromPoint` does real paint-order hit
  // testing (unlike `.click()` called on a specific node, which bypasses
  // hit-testing entirely and would pass either way -- same reasoning as
  // the popup-width number-input hit-test in
  // tests/options-listbox-tests.html). Also pins the row-1-only geometry
  // fix's other half: the mark must stay within row 1's own vertical
  // extent once the host grows, not drift toward the (taller) host's new
  // centre.
  test("open help answer stays hit-testable and the radio/mark stay pinned to row 1", () => {
    const { details, host, toggle, body } = parts("aiContentSourceJinaHint");
    const input = doc.getElementById("opt-ai-src-jina");
    const label = input.closest("label.pick");
    const mark = label.querySelector(".pick-mark");
    assert(input && label && mark, "ai-content-source Jina fixture incomplete");
    const container = doc.querySelector(".container");
    const priorVisibility = container.style.visibility;
    container.style.visibility = "visible";
    try {
      const closedLabelRect = label.getBoundingClientRect();
      const closedMarkRect = mark.getBoundingClientRect();
      assert(closedMarkRect.top >= closedLabelRect.top - 0.5 && closedMarkRect.bottom <= closedLabelRect.bottom + 0.5,
        `mark sits outside row 1 while closed: mark=${JSON.stringify(closedMarkRect)} row1=${JSON.stringify(closedLabelRect)}`);
      details.open = true;
      toggle.scrollIntoView({ block: "center" });
      const openLabelRect = label.getBoundingClientRect();
      const openMarkRect = mark.getBoundingClientRect();
      assert(Math.abs(openLabelRect.top - closedLabelRect.top) < 0.5 && Math.abs(openLabelRect.height - closedLabelRect.height) < 0.5,
        `row 1 itself grew when the answer opened: closed=${JSON.stringify(closedLabelRect)} open=${JSON.stringify(openLabelRect)}`);
      assert(openMarkRect.top >= openLabelRect.top - 0.5 && openMarkRect.bottom <= openLabelRect.bottom + 0.5,
        `mark drifted out of row 1 once the answer opened: mark=${JSON.stringify(openMarkRect)} row1=${JSON.stringify(openLabelRect)}`);
      assert(Math.abs(openMarkRect.top - closedMarkRect.top) < 0.5,
        `mark's own position moved when the answer opened: closed=${JSON.stringify(closedMarkRect)} open=${JSON.stringify(openMarkRect)}`);
      const bodyRect = body.getBoundingClientRect();
      const midX = bodyRect.left + bodyRect.width / 2;
      const midY = bodyRect.top + bodyRect.height / 2;
      const hit = doc.elementFromPoint(midX, midY);
      assert(hit !== input, `the open answer's text midpoint hit the hidden radio, not the answer: ${hit?.tagName}.${hit?.className}`);
      assert(hit === body || body.contains(hit) || details.contains(hit),
        `the open answer's text midpoint hit something outside the answer/details: ${hit ? hit.tagName + "." + hit.className : "nothing"}`);
      const beforeChecked = input.checked;
      hit.click();
      assert(input.checked === beforeChecked, "clicking the open answer's real hit target changed the radio's checked state");
    } finally {
      container.style.visibility = priorVisibility;
      details.open = false;
    }
  });

  // Stage-3b Task 1 (2026-09-24-ui-system-stage3b) retired the rule this
  // test used to pin (options.css's mixed-group `label:not(.switch) { gap:
  // var(--opt-sp-4) }`, stage-3a Task 3's "Controller ruling 2" -- see the
  // retirement comment left in its place, options.css ~1493). AI Content
  // Source's radio rows are `label.pick` now, which declares its OWN 12px
  // gap (--opt-sp-5, COMPONENTS.md §6.4 exception 3) -- the same value the
  // row model's `.pref-row > label` rule already gives every
  // other row, so a radio row and a switch row read identically once
  // again. Repointed (not deleted) to keep the coverage this file's other
  // geometry pins have: the negative control below still needs to prove
  // #opt-ai-use-transcript's own PRE-EXISTING (Task 1) choice-role 6px
  // override (`.pref-row.context-help-host[data-help-role="choice"] >
  // label.switch { gap: var(--opt-sp-3) }`, ~line 1608) is unaffected by
  // this task, so it stays a two-row comparison rather than a single
  // assertion. --opt-sp-3/--opt-sp-5 are literal 6px/12px in BOTH density
  // tiers (the raw sp-N scale itself is never redefined under
  // html[data-density="compact"], only the semantic tokens built FROM it
  // are), so these are flat expected numbers, re-read after switching
  // tiers, not two separate expected shapes.
  test("radio row label gap inside a plain preference group is 12px in both density tiers", () => {
    const radioLabel = doc.getElementById("opt-ai-src-local")?.closest("label.pick");
    const switchLabel = doc.getElementById("opt-ai-use-transcript")?.closest("label.switch");
    assert(radioLabel && switchLabel, "AI content-source group fixture incomplete");
    assert(!radioLabel.classList.contains("switch"), "opt-ai-src-local unexpectedly matches label.switch");
    const win = frame.contentWindow;
    const readGap = (el) => parseFloat(win.getComputedStyle(el).columnGap);
    const comfortableRadio = readGap(radioLabel);
    const comfortableSwitch = readGap(switchLabel);
    assert(Math.abs(comfortableRadio - 12) < 0.5, "comfortable radio label gap=" + comfortableRadio);
    assert(Math.abs(comfortableSwitch - 6) < 0.5, "comfortable switch label gap=" + comfortableSwitch + " (expected its own choice-role 6px override, unaffected by .pick)");
    doc.documentElement.dataset.density = "compact";
    const compactRadio = readGap(radioLabel);
    const compactSwitch = readGap(switchLabel);
    assert(Math.abs(compactRadio - 12) < 0.5, "compact radio label gap=" + compactRadio);
    assert(Math.abs(compactSwitch - 6) < 0.5, "compact switch label gap=" + compactSwitch + " (expected its own choice-role 6px override, unaffected by .pick)");
    delete doc.documentElement.dataset.density;
  });

  // Stage-3a (Task 3, ui-system-stage3a-design §3, Controller ruling 3b):
  // a choice help host that lives inside a pref-row reads the row model's
  // `.pref-row .switch-text { line-height: var(--opt-lh-body) }` -- matching
  // every sibling row -- not the legacy 16px choice-host pin (both that pin
  // and the scoped override that beat it were deleted in stage 3c, when
  // every choice switch host became a pref-row). Assert the

  test("opening the archive batch choice host's help does not shrink its row below a plain sibling row", () => {

  test("expanded help opens below and from the start of its owning row", () => {
    layoutCases.forEach(([key, type]) => {
      const { details, host, anchor, toggle, body } = parts(key);
      details.open = true;
      const h = host.getBoundingClientRect();
      const a = anchorRowRect(anchor);
      const t = toggle.getBoundingClientRect();
      const b = body.getBoundingClientRect();
      // The 24px help target is positioned into its cell and must not size the
      // row: the anchor's own box IS row 1 (it starts at the host's top edge and
      // the answer opens under it), so a field with help keeps the same label
      // row and the same 4px label -> control gap as one without. Measured
      // before this rule: 12.67px vs 4px, on every help-bearing field.
      assert(Math.abs(a.top - h.top) <= 1, type + "/" + key + " anchor sits " + (a.top - h.top) + "px below its row top (toggle inflates the row)");
      assert(t.top < a.bottom && t.bottom > a.top, type + "/" + key + " toggle left its anchor's row");
      // Stage-3b Task 2 (2026-09-24-ui-system-stage3b): optSyncHint is the
      // first `layoutCases` entry whose anchor is a `label.switch` with the
      // help INSIDE the label (Ruling 36) AND whose row is R9's "first row
      // right after its section title" reduction target (padding-top:0,
      // padding-bottom stays --opt-row-pad-y -- COMPONENTS.md §10.2, R9).
      // `anchorRowRect`'s `a.bottom` deliberately adds the anchor's own
      // padding-bottom back onto the copy line's own bottom, which recovers
      // the row's true CLOSED box edge for every symmetric-padding row (the
      // only shape this helper had ever measured until now, e.g. the wayback
      // "row doesn't shrink" check's `.height` use a few tests above) -- but
      // once top and bottom padding differ, that box edge is no longer where
      // the open answer actually starts: the second flex line (row-gap: 0)
      // begins right after the copy line itself, offset only by
      // `.context-help-body`'s own calibrated 6px margin-top (the SAME value
      // used everywhere else for a choice host's open-answer gap, e.g.
      // aiCacheHint's "label-to-answer gap" a few tests below, 4-8px). A
      // "choice" case therefore measures the gap against the copy line's own
      // bottom instead of the row's box edge, with that same 4-8px window;
      // every other role keeps the original box-edge math and its tighter 4px
      // ceiling (calibrated for their own, different open-answer recipe).
      const copy = anchor.matches("label.switch") ? anchor.querySelector(":scope > .switch-text") : null;
      const rowBottom = type === "choice" && copy ? copy.getBoundingClientRect().bottom : a.bottom;
      const tolerance = type === "choice" ? 8 : 4;
      assert(b.top >= rowBottom && b.top - rowBottom <= tolerance, type + "/" + key + " top gap=" + (b.top - rowBottom));
      assert(Math.abs(b.left - h.left) <= 1, type + "/" + key + " left delta=" + (b.left - h.left));
    });
  });

  test("expanded help uses the full width of its owning settings row", () => {

    disclosures.forEach((details) => {

      doc.querySelectorAll("details.context-help[open]").forEach((candidate) => {
        if (candidate !== details) candidate.open = false;

      details.open = true;
      const hostRect = helpHost(details).getBoundingClientRect();
      const bodyRect = body.getBoundingClientRect();
      // Stage-3a Task 2: an indented row (.entry-block-sub's padding-left on
      // the host div for a field host, or the choice-role fix's padding-left
      // on `> label.switch` for a choice host -- two different elements,
      // neither of which is uniformly "the host") shifts the answer's LEFT
      // edge in by that indent without moving the row's RIGHT edge. A raw
      // width comparison against the host's own border-box (unaware of which
      // element actually carries the indent) reads a false failure for any
      // indented row. The right edge is the one point every shape -- indented
      // or not, host-padded or label-padded -- agrees on, so comparing right
      // edges instead is the true generalization of "fills its row": it holds
      // for a plain unindented host (body starts flush left, so equal right
      // edges implies equal width, same as the old check) AND for an indented
      // one (body starts further right, but must still reach the same edge).

  // optSyncHint is a "choice" role (a self-contained `.pref-row`: just
  // `label.switch` + its nested `<details>`, nothing else in the row after
  // the answer) -- the ONE shape where "the next setting" genuinely means
  // the very next sibling row, unlike a field host (whose own control
  // typically follows its own help inside the SAME host). Stage-3b Task 2
  // moved this row off the old flat `.choice-row` (no padding, ~20px tall)
  // onto the stage-0 `.pref-row` model (44/36px, --opt-row-pad-y top+bottom
  // padding on EVERY row), so two stacked full rows with the first one's
  // help open naturally read a wider ink-to-ink gap than the old model ever
  // produced -- not a double-margin regression (traced by hand: no gap ADDS
  // to another, it's exactly this one combination).
  //
  // Fix round 1 (NIT finding 4): pinned to the row model's own tokens
  // instead of an empirically-eyeballed flat 20-32 window, box-level
  // component read live per density tier (not hardcoded, so this tracks the
  // tokens if they ever change):
  //   2 * --opt-row-pad-y (the open row's own padding-bottom AND the next
  //     row's padding-top -- the SAME token, paid twice, one on each side
  //     of the hairline)
  //   - --opt-sp-1 (`.context-help-body`'s own `margin-bottom: calc(
  //     --opt-sp-1 * -1)`, the "pull the label's open height back down"
  //     compensator a few rules above `label.switch > .context-help >
  //     .context-help-body` -- it SHRINKS the box-level gap, hence minus)
  //   + 1 (the `.pref-row + .pref-row` hairline border-top, a literal px,
  //     not a spacing token -- COMPONENTS.md's stage-0 row model doc
  //     comment carves this one out explicitly)
  // textInkRect measures GLYPH ink, not box edges, so a residual rides on
  // top of that box-level number: the open answer's own descent below its
  // baseline plus the next line's ascent above its cap height -- NEITHER is
  // a design token (font metrics, not CSS), empirically 2px (compact) to
  // 3px (comfortable) on this audit's real fonts. `+0..+4` covers both
  // measured residuals with headroom, everything below the formula is
  // exact.
  test("expanded choice help contributes only one gap before the next setting", () => {
    const readVar = (name) => parseFloat(frame.contentWindow.getComputedStyle(doc.documentElement).getPropertyValue(name));
    const { details, host, body } = parts("optSyncHint");
    const next = host.nextElementSibling;
    const nextLabel = next?.querySelector(":scope > label");
    assert(next?.classList.contains("context-help-host") && nextLabel, "sync fixture has no following setting");
    [null, "compact"].forEach((density) => {
      if (density) doc.documentElement.dataset.density = density; else delete doc.documentElement.dataset.density;
      const rowPadY = readVar("--opt-row-pad-y");
      const sp1 = readVar("--opt-sp-1");
      const structural = (2 * rowPadY) - sp1 + 1;
      details.open = true;
      const gap = textInkRect(nextLabel).top - textInkRect(body).bottom;
      assert(gap >= structural && gap <= structural + 4,
        `${density || "comfortable"} sync answer-to-next visual gap=${gap}, expected ${structural}..${structural + 4} ` +
        `(2*row-pad-y ${rowPadY} - sp-1 ${sp1} + 1px hairline, +0..4 font-ink residual)`);
      details.open = false;
    });
    delete doc.documentElement.dataset.density;
  });

      const rows = ids.map((id) => doc.getElementById(id)?.closest(".pref-row"));
      assert(rows.every(Boolean), ids[0] + " group has an unmarked row");
      const stack = rows[0].closest(".pref-group");
      assert(stack && rows.every((row) => row.parentElement === stack), ids[0] + " group is not one pref-group");
    });
  });

  test("support diagnostics belongs to General, not Storage", () => {
    const diagnostics = doc.getElementById("copy-diagnostics-btn")?.closest(".support-diagnostics");
    assert(diagnostics, "support diagnostics section missing");
    assert(diagnostics.closest("#panel-general"), "support diagnostics did not move to General");
    assert(!doc.querySelector("#panel-storage .support-diagnostics"), "Storage still owns support diagnostics");
  });

  test("connection overview is a closed disclosure on first render", () => {
    const section = doc.getElementById("acc-connection-overview");
    const summary = section?.querySelector(":scope > summary");
    const body = section?.querySelector(":scope > .disclosure-body");
    const health = doc.getElementById("connection-health");
    const hint = doc.querySelector('[data-i18n="connectionOverviewHint"]');
    assert(section?.matches("details.disclosure[data-acc-key]") && summary && body, "connection overview has no disclosure structure");
    assert(!section.open, "connection overview HTML default is open");
    // A closed <details> hides its content through content-visibility, not
    // display:none, and getBoundingClientRect() can report a remembered box --
    // the platform's own visibility check is the honest probe.
    assert(!body.checkVisibility(), "connection overview body is visible before interaction");
    assert(body.contains(health) && body.contains(hint), "connection overview content escaped its disclosure body");
  });

  // Stage-3b Task 2 (2026-09-24-ui-system-stage3b): panel-general dropped its
  // `.divider` elements (spec §3, matching every other migrated panel) --
  // "Pinboard Account" (which owns the connection overview) and "Language"
  // are now two separate `section.settings-section` blocks, spaced by the
  // row model's own `.settings-section + .settings-section`
  // margin-top (--opt-section-gap) instead of a literal border line. Retitled
  // and rewritten from "presents one separator" (which asserted the OLD
  // divider's border-line count) to assert the boundary that replaced it.
  test("Pinboard Account and Language are separate sections joined by the row model's margin gap, not a divider", () => {
    const panel = doc.getElementById("panel-general");
    doc.querySelectorAll(".panel").forEach((candidate) => candidate.classList.toggle("active", candidate === panel));
    const accountSection = doc.getElementById("acc-connection-overview")?.closest("section.settings-section");
    const languageSection = doc.getElementById("sec-language")?.closest("section.settings-section");
    assert(accountSection && languageSection && accountSection !== languageSection,
      "connection overview and Language must sit in separate settings-section blocks");
    const gap = languageSection.getBoundingClientRect().top - accountSection.getBoundingClientRect().bottom;
    assert(gap >= 30 && gap <= 34, "Pinboard Account -> Language section gap=" + gap);
  });

  test("batch AI help opens below an explicit group title", () => {
    const { body, details, host, anchor, toggle } = parts("batchAiHint");
    assert(host?.classList.contains("context-help-host"), "batch AI has no contextual-help host");
    assert(anchor?.dataset.i18n === "tabGroupAI", "batch AI is not owned by the AI group title");
    const closedToggle = toggle.getBoundingClientRect();
    details.open = true;
    const openToggle = toggle.getBoundingClientRect();
    const h = host.getBoundingClientRect();
    const b = body.getBoundingClientRect();
    assert(Math.abs(openToggle.left - closedToggle.left) <= 1, "toggle moved when help opened");
    assert(b.top >= anchor.getBoundingClientRect().bottom, "answer opened above its group title");
    assert(Math.abs(b.left - h.left) <= 1 && b.width > 0, "answer does not open below the group row");
  });

  test("existing feature disclosures do not nest another unanchored disclosure", () => {
    const nested = doc.querySelectorAll("details.disclosure > .disclosure-body.context-help-host > details.context-help");
    assert(nested.length === 0, "nested contextual disclosures=" + nested.length);
    ["vocabDriveScope", "vocabDriveDisclosure", "ecdictHint", "ecdictFormatNote", "dictPackHint", "dictPackImportHint"].forEach((key) => {
      const copy = doc.querySelector(`[data-i18n="${key}"]`);
      assert(copy?.closest("details.disclosure"), key + " left its feature disclosure");
    });
    const legacy = doc.querySelector('[data-i18n="batchRevokeHint"]');
    assert(legacy && !legacy.closest("details.context-help"), "conditional legacy guidance is hidden twice");
  });

  // Stage-3b Task 2: the `.divider` that used to follow #backup-import-result
  // (and gate this test's whole premise -- an empty status must not add its
  // OWN gap on top of the divider's) is gone; "Backup & Restore" is now one
  // `section.settings-section` and "Notifications" the next, joined by the
  // row model's margin gap instead. The empty-status collapse this test
  // exists for is unrelated to that boundary and still holds on its own.
  test("empty backup status does not reserve a blank row", () => {
    parts("backupPlaintextDisclosure");
    const note = doc.getElementById("backup-export-note");
    const backupSection = doc.getElementById("backup-import-result")?.closest("section.settings-section");
    const notificationsSection = doc.getElementById("sec-notifications")?.closest("section.settings-section");
    assert(note && backupSection && notificationsSection && backupSection !== notificationsSection,
      "backup layout fixture incomplete");
    assert(note.getBoundingClientRect().height === 0, "empty status height=" + note.getBoundingClientRect().height);
    const gap = notificationsSection.getBoundingClientRect().top - backupSection.getBoundingClientRect().bottom;
    assert(gap >= 30 && gap <= 34, "backup section -> notifications section gap=" + gap);
  });

  test("other empty standalone status blocks collapse until populated", () => {
    ["connection-health", "ecdict-pack-status", "dict-pack-status", "wayback-perm-status"].forEach((id) => {
      const node = doc.getElementById(id);
      assert(node, "missing #" + id);
      assert(getComputedStyle(node).display === "none", "#" + id + " display=" + getComputedStyle(node).display);
      assert(node.getBoundingClientRect().height === 0, "#" + id + " height=" + node.getBoundingClientRect().height);
    });
  });

  // Stage-2 review round 1 (Medium cascade finding): #opt-ai-provider's
  // wrapper is now .fg.entry-block, and the stage-1 entry-block rule
  // (`.entry-block > :is(input:not([type="number"]),
  // .key-wrap) { max-width: none }`) must NOT include `select` in that list --
  // selects keep the legacy `.fg select` content-sized policy (max-content /
  // min-width 240px / max-width 100%, spec stage2 §2) even inside an entry
  // block. `.key-wrap` is the opposite case: it DOES fill the column.
  test("stage2: the entry-block width policy keeps select content-sized but fills key-wrap", () => {
    const select = doc.getElementById("opt-ai-provider");
    const keyWrap = doc.getElementById("opt-gemini-key")?.closest(".key-wrap");
    assert(select?.closest(".entry-block"), "opt-ai-provider lost its entry-block wrapper");
    assert(keyWrap?.closest(".entry-block"), "opt-gemini-key's key-wrap lost its entry-block wrapper");
    const selectMaxWidth = frame.contentWindow.getComputedStyle(select).maxWidth;
    const keyWrapMaxWidth = frame.contentWindow.getComputedStyle(keyWrap).maxWidth;
    assert(selectMaxWidth === "100%", "provider select max-width=" + selectMaxWidth);
    assert(keyWrapMaxWidth === "none", "gemini key-wrap max-width=" + keyWrapMaxWidth);
    // Fixwave stage2: `.fg .key-wrap :is(input[type="text"],
    // input[type="password"]) { padding-right: 32px }` was restated one
    // class higher so it no longer depends on staying textually after the
    // field-type rule that resets padding-right to
    // --opt-control-pad-x. Assert the resolved value directly on the input,
    // not just that the rule text exists.
    const keyInput = doc.getElementById("opt-gemini-key");
    const keyInputPaddingRight = frame.contentWindow.getComputedStyle(keyInput).paddingRight;
    assert(keyInputPaddingRight === "32px", "opt-gemini-key padding-right=" + keyInputPaddingRight);
  });

  // Fixwave stage2, item 1: the row model's `.pf > h3` was losing to a
  // themed `html[data-theme] .pf h3 { color: var(--opt-fg-muted) }` override
  // under every preset -- the sub-panel title rendered muted instead of body
  // colour the moment a theme was active. It carries a twin
  // `html[data-theme] .pf > h3` selector (same shape as the `.fg label.bl`
  // fix); stage 3c deleted the muted override itself. Verify against a live
  // computed style, not just selector text, under an actual preset theme.
  test("stage2: themed .pf > h3 keeps body colour, not the muted override", () => {
    doc.documentElement.setAttribute("data-theme", "modern-card");
    try {
      const h3 = doc.querySelector("#fields-gemini > h3");
      assert(h3, "missing #fields-gemini > h3");
      const win = frame.contentWindow;
      const h3Color = win.getComputedStyle(h3).color;
      const expectedFg = win.getComputedStyle(doc.documentElement).getPropertyValue("--opt-fg").trim();
      const mutedFg = win.getComputedStyle(doc.documentElement).getPropertyValue("--opt-fg-muted").trim();
      assert(expectedFg && mutedFg && expectedFg !== mutedFg, "modern-card --opt-fg/--opt-fg-muted fixture tokens missing or identical");
      // Resolve both custom properties to actual color() computed values via a
      // scratch element so the comparison isn't a raw-string vs used-value
      // mismatch (e.g. "#112a45" vs "rgb(17, 42, 69)").
      const probe = doc.createElement("div");
      probe.style.display = "none";
      doc.body.appendChild(probe);
      probe.style.color = "var(--opt-fg)";
      const resolvedFg = win.getComputedStyle(probe).color;
      probe.style.color = "var(--opt-fg-muted)";
      const resolvedMuted = win.getComputedStyle(probe).color;
      probe.remove();
      assert(h3Color === resolvedFg, "#fields-gemini > h3 color=" + h3Color + " expected --opt-fg=" + resolvedFg);
      assert(h3Color !== resolvedMuted, "#fields-gemini > h3 color regressed to --opt-fg-muted=" + resolvedMuted);
    } finally {
      doc.documentElement.removeAttribute("data-theme");
    }
  });
})().catch((error) => {
  for (let i = results.children.length; i < 16; i++) report("fixture setup", error);
});
