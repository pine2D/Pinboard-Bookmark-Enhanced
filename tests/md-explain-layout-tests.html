<!doctype html>
<html><head><meta charset="utf-8"><title>Explain Popover Layout Tests</title>
<style>.case{font-family:monospace;white-space:pre}.pass{color:#176}.fail{color:#b00}</style>
</head><body><div id="results"></div>
<script>
const results = document.getElementById("results");
function report(name, error) {
  const row = document.createElement("div");
  row.className = "case " + (error ? "fail" : "pass");
  row.textContent = (error ? "FAIL " : "PASS ") + name + (error ? "\n  " + error.message : "");
  results.appendChild(row);
}
async function test(name, fn) { try { await fn(); report(name); } catch (error) { report(name, error); } }
function assert(condition, message) { if (!condition) throw new Error(message); }
function contrastRatio(fg, bg) {
  const rgb = (value) => {
    const match = value.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
    if (!match) throw new Error(`unresolved color: ${value}`);
    return match.slice(1, 4).map(Number);
  };
  const luminance = (value) => rgb(value).map((channel) => {
    channel /= 255;
    return channel <= 0.03928 ? channel / 12.92 : Math.pow((channel + 0.055) / 1.055, 2.4);
  }).reduce((sum, channel, index) => sum + channel * [0.2126, 0.7152, 0.0722][index], 0);
  const values = [luminance(fg), luminance(bg)].sort((a, b) => b - a);
  return (values[0] + 0.05) / (values[1] + 0.05);
}
const LOCALES = ["en", "de", "fr", "pl", "ru", "zh_HK", "zh_CN", "zh_TW", "ja"];
async function loadMessages() {
  const out = {};
  for (const locale of LOCALES) out[locale] = await (await fetch(`../_locales/${locale}/messages.json`)).json();
  return out;
}
async function makeFrame(width) {
  const frame = document.createElement("iframe");
  frame.style.cssText = `width:${width}px;height:620px;border:0`;
  frame.srcdoc = `<!doctype html><html><head><link rel="stylesheet" href="../md-preview.css"></head>
    <body><div id="explain-pop" popover="manual" style="left:8px;top:8px">
      <div class="xp-head">
        <span class="xp-term">A deliberately long selected term for title-space verification</span>
        <span class="xp-drag-zone" aria-hidden="true"></span>
        <div class="xp-act-group"><button class="xp-act" data-action="explain"></button><button class="xp-act" data-action="translate"></button><button class="xp-act" data-action="dict"></button></div>
        <div class="xp-window-actions"><button class="xp-pin"><svg viewBox="0 0 24 24"></svg></button><button class="xp-close"><svg viewBox="0 0 24 24"></svg></button></div>
      </div><div class="xp-body">Body</div>
      <div class="xp-foot">
        <button class="xp-save"><svg viewBox="0 0 24 24"></svg></button>
        <button class="xp-vocab"><svg viewBox="0 0 24 24"></svg></button>
        <button class="xp-open-vocab"><svg viewBox="0 0 24 24"></svg></button>
        <span class="xp-model"><span class="xp-model-text"><span class="xp-cost">cost</span><span class="xp-model-name">model</span></span><button class="xp-ask"><svg viewBox="0 0 24 24"></svg></button></span>
      </div>
    </div></body></html>`;
  document.body.appendChild(frame);
  await new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
  const doc = frame.contentDocument;
  doc.getElementById("explain-pop").showPopover();
  await new Promise((resolve) => frame.contentWindow.requestAnimationFrame(() => frame.contentWindow.requestAnimationFrame(resolve)));
  return frame;
}
function applyLocale(frame, messages, locale) {
  const doc = frame.contentDocument;
  // Mirrors production since the icon audit: the three actions are icon-only
  // (a 15px SVG stand-in here), locale labels ride title/aria-label.
  for (const [action, key] of [["explain", "explainActionExplain"], ["translate", "explainActionTranslate"], ["dict", "explainActionDict"]]) {
    const b = doc.querySelector('[data-action="' + action + '"]');
    b.innerHTML = '<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/></svg>';
    b.title = messages[locale][key].message;
    b.setAttribute("aria-label", messages[locale][key].message);
  }
}

// Footer = word cluster on the left, price + model label + "ask more" on the
// right (critiques 2026-10-19 / 2026-10-20 #2). A long model id must
// ellipsize, never wrap the row or push "ask more" off the card's right edge,
// and the price must stay whole whatever the model name does.
function assertFooterClusters(frame, locale) {
  const doc = frame.contentDocument;
  const foot = doc.querySelector(".xp-foot");
  const fr = foot.getBoundingClientRect();
  const ask = doc.querySelector(".xp-ask").getBoundingClientRect();
  const save = doc.querySelector(".xp-save").getBoundingClientRect();
  const openVocab = doc.querySelector(".xp-open-vocab").getBoundingClientRect();
  const model = doc.querySelector(".xp-model-text").getBoundingClientRect();
  const costEl = doc.querySelector(".xp-cost");
  if (!costEl.hidden) {
    const cost = costEl.getBoundingClientRect();
    assert(cost.width > 0 && costEl.scrollWidth <= costEl.clientWidth + 0.5,
      `${locale}: price clipped (${costEl.scrollWidth} > ${costEl.clientWidth})`);
    const name = doc.querySelector(".xp-model-name").getBoundingClientRect();
    assert(cost.left >= openVocab.right && cost.right <= name.left + 0.5,
      `${locale}: price is not between the word cluster and the model name`);
  }
  assert(ask.top === save.top, `${locale}: footer wrapped (ask ${ask.top} vs save ${save.top})`);
  assert(fr.right - ask.right <= 16, `${locale}: "ask more" is not at the right edge (${fr.right - ask.right}px gap)`);
  assert(save.left - fr.left <= 16, `${locale}: word cluster is not at the left edge`);
  assert(model.left >= openVocab.right && model.right <= ask.left + 0.5,
    `${locale}: model label is not between the word cluster and "ask more"`);
  assert(foot.scrollWidth <= foot.clientWidth + 1, `${locale}: footer overflows ${foot.scrollWidth} > ${foot.clientWidth}`);
}
function assertLayout(frame, locale) {
  const doc = frame.contentDocument;
  const pop = doc.getElementById("explain-pop").getBoundingClientRect();
  const head = doc.querySelector(".xp-head");
  const term = doc.querySelector(".xp-term").getBoundingClientRect();
  const drag = doc.querySelector(".xp-drag-zone").getBoundingClientRect();
  const pin = doc.querySelector(".xp-pin").getBoundingClientRect();
  const close = doc.querySelector(".xp-close").getBoundingClientRect();
  assert(pin.width >= 24 && close.width >= 24, `${locale}: window controls collapsed`);
  assert(pin.left >= pop.left && close.right <= pop.right + 0.5, `${locale}: window controls overflow ${close.right} > ${pop.right}`);
  assert(term.width >= 48, `${locale}: title width ${term.width}`);
  // A bare 48px floor let the term be squeezed to "sayi..." while three labelled
  // action buttons took the rest of the row. The actions now have a row of their
  // own, so the title is entitled to most of one.
  assert(term.width >= pop.width * 0.5,
    `${locale}: title got only ${Math.round(term.width)}px of a ${Math.round(pop.width)}px card`);
  assert(term.top < doc.querySelector(".xp-act-group").getBoundingClientRect().top,
    `${locale}: the action group is not on its own row below the title`);
  assert(drag.width >= 12, `${locale}: drag blank width ${drag.width}`);
  assert(head.scrollWidth <= head.clientWidth + 1, `${locale}: header horizontal overflow ${head.scrollWidth} > ${head.clientWidth}`);
}
(async () => {
  const messages = await loadMessages();
  await test("production CSS keeps all locale header controls and drag space inside 320px", async () => {
    const frame = await makeFrame(320);
    try {
      for (const locale of LOCALES) {
        applyLocale(frame, messages, locale);
        await new Promise((resolve) => frame.contentWindow.requestAnimationFrame(resolve));
        assertLayout(frame, locale);
      }
    } finally { frame.remove(); }
  });
  await test("production CSS preserves German and Russian title space at 360px", async () => {
    const frame = await makeFrame(360);
    try {
      for (const locale of ["de", "ru"]) {
        applyLocale(frame, messages, locale);
        await new Promise((resolve) => frame.contentWindow.requestAnimationFrame(resolve));
        assertLayout(frame, locale);
      }
    } finally { frame.remove(); }
  });
  await test("reader hover and popover surfaces stay readable in light and dark mode", async () => {
    const frame = await makeFrame(420);
    try {
      const doc = frame.contentDocument;
      const probes = document.createElement("div");
      probes.innerHTML = [
        '<div id="ask-tip" style="display:block">Citation</div>',
        '<div id="pb-hl-bar" style="display:flex">Highlight</div>',
        // The five popovers take their chrome (fill, border, radius, shadow) from
        // the .pop-panel primitive (COMPONENTS.md §10.2), as their creators in
        // md-reader.js / md-highlight.js set it; the id rules keep only geometry.
        '<div id="pb-hl-card" class="pop-panel" style="display:flex">Note</div>',
        '<div id="fn-pop" class="pop-panel" style="display:flex">Footnote</div>',
        '<div id="search-pop" class="pop-panel" style="display:flex">Search</div>',
        '<div id="kbd-help-pop" class="pop-panel" style="display:flex">Shortcuts</div>',
        '<div id="typo-pop" class="pop-panel" style="display:flex">Typography</div>',
        '<div class="pb-tr-err"><span class="pb-tr-err-reason">Translation failed</span><button class="pb-tr-err-retry"><span>Retry</span></button></div>'
      ].join("");
      doc.body.appendChild(probes);
      const failures = [];
      for (const mode of ["light", "dark"]) {
        doc.documentElement.style.colorScheme = mode;
        await new Promise((resolve) => frame.contentWindow.requestAnimationFrame(resolve));
        for (const selector of ["#ask-tip", "#pb-hl-bar", "#pb-hl-card", "#fn-pop",
          "#search-pop", "#kbd-help-pop", "#typo-pop"]) {
          const style = frame.contentWindow.getComputedStyle(doc.querySelector(selector));
          const ratio = contrastRatio(style.color, style.backgroundColor);
          if (style.borderTopWidth === "0px" || ratio < 4.5)
            failures.push(`${mode}/${selector}:${ratio.toFixed(2)}`);
        }
        // The failure reason is printed in the transparent pill, on the page.
        const reason = frame.contentWindow.getComputedStyle(doc.querySelector(".pb-tr-err-reason"));
        const pageBg = frame.contentWindow.getComputedStyle(doc.body).backgroundColor;
        const reasonRatio = contrastRatio(reason.color, pageBg);
        if (reasonRatio < 4.5) failures.push(`${mode}/.pb-tr-err-reason:${reasonRatio.toFixed(2)}`);
        const tip = frame.contentWindow.getComputedStyle(doc.querySelector(".pb-tr-err"), "::after");
        if (tip.content !== "none" && tip.content !== "normal") failures.push(`${mode}/.pb-tr-err::after is back: ${tip.content}`);
      }
      assert(failures.length === 0, failures.join(", "));
    } finally { frame.remove(); }
  });

  // The dictionary view of a saved word is the crowded case: the "In
  // vocabulary" state (tick + text, 2026-10-21) and its short "Update" button
  // beside the known / open-vocab icons. Whatever the row does there, the
  // price stays whole, the label and "ask more" stay together on one row,
  // "ask more" keeps the right edge, and the state never parts from its
  // button or loses its text.
  await test("a crowded dictionary footer moves price, model and ask more as one unit", async () => {
    for (const width of [320, 420]) {
      const frame = await makeFrame(width);
      try {
        const doc = frame.contentDocument;
        const known = doc.createElement("button");
        known.className = "xp-known";
        known.innerHTML = '<svg viewBox="0 0 24 24"></svg>';
        doc.querySelector(".xp-vocab").after(known);
        const state = doc.createElement("span");
        state.className = "xp-vocab-state";
        state.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14"></svg><span></span>';
        doc.querySelector(".xp-vocab").before(state);
        doc.querySelector(".xp-save").hidden = true;
        for (const locale of LOCALES) {
          applyLocale(frame, messages, locale);
          const vocab = doc.querySelector(".xp-vocab");
          vocab.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14"></svg><span></span>';
          // Production (md-dict.js): visible "Update", full name on title.
          vocab.querySelector("span").textContent = messages[locale].update.message;
          state.querySelector("span").textContent = messages[locale].dictSavedVocab.message;
          doc.querySelector(".xp-cost").textContent = messages[locale].explainEstCost.message.replace("$TOKENS$", "12345");
          doc.querySelector(".xp-model-name").textContent = "· Custom OpenAI-compatible · a-long-model-id";
          await new Promise((resolve) => frame.contentWindow.requestAnimationFrame(resolve));
          const tag = `${locale}@${width}`;
          const foot = doc.querySelector(".xp-foot").getBoundingClientRect();
          const costEl = doc.querySelector(".xp-cost");
          const model = doc.querySelector(".xp-model-text").getBoundingClientRect();
          const ask = doc.querySelector(".xp-ask").getBoundingClientRect();
          assert(costEl.scrollWidth <= costEl.clientWidth + 0.5 && costEl.getBoundingClientRect().right <= foot.right,
            `${tag}: price clipped`);
          assert(Math.abs((model.top + model.height / 2) - (ask.top + ask.height / 2)) <= 4,
            `${tag}: label and "ask more" split across rows`);
          assert(foot.right - ask.right <= 16, `${tag}: "ask more" left the right edge`);
          assert(doc.querySelector(".xp-foot").scrollWidth <= doc.querySelector(".xp-foot").clientWidth + 1, `${tag}: footer overflows`);
          const st = state.getBoundingClientRect(), vb = vocab.getBoundingClientRect();
          assert(Math.abs((st.top + st.height / 2) - (vb.top + vb.height / 2)) <= 1 && st.right <= vb.left,
            `${tag}: the "In vocabulary" state parted from its Update button`);
          assert(state.scrollWidth <= state.clientWidth + 0.5 && st.width > 30, `${tag}: the state text is clipped`);
          assert(frame.contentWindow.getComputedStyle(state).backgroundColor === "rgba(0, 0, 0, 0)" && frame.contentWindow.getComputedStyle(state).borderTopWidth === "0px",
            `${tag}: the state is drawn like a control`);
        }
      } finally { frame.remove(); }
    }
  });

  await test("the footer keeps its two clusters on one row in every locale, at 320px and 420px", async () => {
    for (const width of [320, 420]) {
      const frame = await makeFrame(width);
      try {
        for (const locale of LOCALES) {
          applyLocale(frame, messages, locale);
          for (const longModel of [false, true]) {
            for (const priced of [true, false]) {
              // Production markup: the price leads ("≈ N tokens", a 5-digit N
              // as the widest realistic case) and the model label carries the
              // "· " joint; with no AI the price is hidden and the label stands
              // alone (md-ask.js _pbpExplainRenderMeta).
              const costEl = frame.contentDocument.querySelector(".xp-cost");
              costEl.textContent = messages[locale].explainEstCost.message.replace("$TOKENS$", "12345");
              costEl.hidden = !priced;
              const label = longModel ? "a-very-long-model-identifier".repeat(2) : "model";
              frame.contentDocument.querySelector(".xp-model-name").textContent = priced ? "· " + label : label;
              await new Promise((resolve) => frame.contentWindow.requestAnimationFrame(resolve));
              assertFooterClusters(frame, `${locale}@${width}${longModel ? " long model" : ""}${priced ? "" : " no AI"}`);
            }
          }
        }
      } finally { frame.remove(); }
    }
  });

  // 2026-10-20 reader critique item 5: in drawer mode (<=1000px, also 200%
  // zoom) the fixed hamburger sat on line starts once the article scrolled
  // under it. Production CSS, scrolled, LTR and RTL article, plus zen.
  async function makeReaderFrame(width, { rtl = false, zen = false } = {}) {
    const frame = document.createElement("iframe");
    frame.style.cssText = `width:${width}px;height:500px;border:0`;
    const para = "Reading text that wraps across the whole measure so a full line touches both edges. ".repeat(8);
    frame.srcdoc = `<!doctype html><html><head><link rel="stylesheet" href="../md-preview.css"></head>
      <body${zen ? ' class="zen"' : ""}><button class="rail-toggle" id="rail-toggle"><svg viewBox="0 0 24 24"></svg></button>
      <aside class="rail" id="rail"></aside>
      <main><div class="doc-body"><div id="rendered-view"${rtl ? ' dir="rtl"' : ""}>${("<p>" + para + "</p>").repeat(7)}</div></div></main></body></html>`;
    document.body.appendChild(frame);
    await new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
    frame.contentWindow.scrollTo(0, 400);
    await new Promise((resolve) => frame.contentWindow.requestAnimationFrame(() => frame.contentWindow.requestAnimationFrame(resolve)));
    return frame;
  }
  await test("drawer mode: the fixed hamburger never shares a column with line starts (LTR + RTL, 800/390px, zen)", async () => {
    for (const width of [1000, 800, 390]) {
      for (const rtl of [false, true]) {
        const frame = await makeReaderFrame(width, { rtl });
        try {
          const doc = frame.contentDocument;
          const btn = doc.getElementById("rail-toggle").getBoundingClientRect();
          const tag = `${width}px${rtl ? " rtl" : ""}`;
          assert(btn.width > 0, `${tag}: hamburger not shown in drawer mode`);
          for (const p of doc.querySelectorAll("#rendered-view p")) {
            const r = p.getBoundingClientRect();
            assert(r.left >= btn.right + 8, `${tag}: text column starts at ${r.left}px, under the hamburger (right edge ${btn.right}px)`);
          }
          assert(doc.documentElement.scrollWidth <= doc.documentElement.clientWidth, `${tag}: page scrolls sideways`);
        } finally { frame.remove(); }
      }
    }
    const zen = await makeReaderFrame(800, { zen: true });
    try {
      const doc = zen.contentDocument;
      assert(doc.getElementById("rail-toggle").getBoundingClientRect().width === 0, "zen: hamburger still shown");
      assert(zen.contentWindow.getComputedStyle(doc.querySelector("main")).paddingLeft === "20px", "zen: the hamburger gutter outlives the hamburger");
    } finally { zen.remove(); }
    const wide = await makeReaderFrame(1100);
    try {
      assert(wide.contentDocument.getElementById("rail-toggle").getBoundingClientRect().width === 0, "1100px: hamburger shown outside drawer mode");
    } finally { wide.remove(); }
  });

  await test("the Aa panel's segmented rows (spacing, width, appearance) fit their segments in every locale", async () => {
    const frame = document.createElement("iframe");
    frame.style.cssText = "width:400px;height:400px;border:0";
    frame.srcdoc = `<!doctype html><html><head><link rel="stylesheet" href="../md-preview.css"></head>
      <body><div id="typo-pop" class="pop-panel" popover="manual"><div class="typo-row"><span class="typo-label"></span>
      <div class="typo-seg" role="group"><button class="typo-seg-btn" data-width="720"></button><button class="typo-seg-btn" data-width="880" aria-pressed="true"></button><button class="typo-seg-btn" data-width="1080"></button></div></div></div></body></html>`;
    document.body.appendChild(frame);
    await new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
    try {
      const doc = frame.contentDocument;
      doc.getElementById("typo-pop").showPopover();
      // Every segmented row md-reader.js builds (_pbpTypoBuildPop): line
      // spacing, reading width, appearance. The appearance row's "Auto" word
      // is the longest in de / fr / pl ("Automatisch" was clipped, README
      // shots 2026-10-20).
      const rows = [
        ["typoLeadingLabel", ["typoLeadingCompact", "typoLeadingNormal", "typoLeadingRelaxed"]],
        ["typoWidthLabel", ["typoWidthNarrow", "typoWidthMedium", "typoWidthWide"]],
        ["typoSchemeLabel", ["typoSchemeAuto", "typoSchemeLight", "typoSchemeDark"]],
      ];
      const pop = doc.getElementById("typo-pop");
      for (const locale of LOCALES) {
        for (const [labelKey, keys] of rows) {
          doc.querySelector(".typo-label").textContent = messages[locale][labelKey].message;
          doc.querySelectorAll(".typo-seg-btn").forEach((b, i) => { b.textContent = messages[locale][keys[i]].message; });
          await new Promise((resolve) => frame.contentWindow.requestAnimationFrame(resolve));
          const label = doc.querySelector(".typo-label");
          assert(label.getBoundingClientRect().height <= 24, `${locale}: ${labelKey} wraps`);
          const popBox = pop.getBoundingClientRect();
          for (const b of doc.querySelectorAll(".typo-seg-btn")) {
            const box = b.getBoundingClientRect();
            assert(b.scrollWidth <= b.clientWidth, `${locale}: "${b.textContent}" overflows its segment (${b.scrollWidth} > ${b.clientWidth})`);
            assert(box.right <= popBox.right + 0.5 && box.left >= popBox.left - 0.5, `${locale}: "${b.textContent}" sticks out of the panel`);
            assert(Math.round(box.height) === 26, `${locale}: segment is ${box.height}px, off the 26px rung`);
          }
        }
      }
    } finally { frame.remove(); }
  });

  // 2026-10-21 distill: the rail's pre-request translate estimate is one line
  // in every locale; the price never clips, only "provider · model" takes the
  // ellipsis. The span pair is what md-translate.js _pbpTrPaintEstimate
  // writes (structure pinned in md-ai-tests); this checks the stylesheet.
  await test("translate estimate stays on one line in a 256px rail; the price is never clipped", async () => {
    const frame = document.createElement("iframe");
    frame.style.cssText = "width:1200px;height:300px;border:0";
    frame.srcdoc = `<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../md-preview.css"></head>
      <body><aside class="rail" id="rail"><div class="rail-section" id="tr-section"><div id="tr-estimate" class="tr-meta"></div></div></aside></body></html>`;
    document.body.appendChild(frame);
    await new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
    try {
      const doc = frame.contentDocument, est = doc.getElementById("tr-estimate");
      for (const locale of LOCALES) {
        for (const model of ["Gemini", "Custom OpenAI-compatible · anthropic/claude-sonnet-4.5-20260929-preview-extended-thinking"]) {
          const shaped = messages[locale].trEstCost.message.replace("$COUNT$", "123456").replace("$MODEL$", "\u0001");
          const at = shaped.indexOf("\u0001");
          const cost = doc.createElement("span"); cost.className = "tr-est-cost"; cost.textContent = shaped.slice(0, at);
          const name = doc.createElement("span"); name.className = "tr-est-model"; name.textContent = model;
          est.replaceChildren(cost, name, doc.createTextNode(shaped.slice(at + 1)));
          await new Promise((resolve) => frame.contentWindow.requestAnimationFrame(resolve));
          const tag = `${locale}${model.length > 10 ? " long model" : ""}`;
          const line = parseFloat(frame.contentWindow.getComputedStyle(est).lineHeight) || 18;
          assert(est.getBoundingClientRect().height <= line + 1, `${tag}: estimate wraps (${est.getBoundingClientRect().height}px)`);
          assert(cost.scrollWidth <= cost.clientWidth + 0.5 && cost.getBoundingClientRect().right <= est.getBoundingClientRect().right + 0.5,
            `${tag}: price clipped`);
          assert(est.scrollWidth <= est.clientWidth + 1, `${tag}: estimate overflows the rail`);
        }
      }
      // _pbpTrSetStatus hides the line once nothing is left to translate; the
      // one-line rule (two ids) must not outrank .tr-meta[hidden].
      est.hidden = true;
      assert(frame.contentWindow.getComputedStyle(est).display === "none", "hidden estimate still displayed");
    } finally { frame.remove(); }
  });

  // 2026-10-21: with no Send-to destination the split button is one whole
  // "Set up a destination…" action (md-preview.js setupSendMenu). The
  // longest locales must fit the 256px rail, and its corners must match.
  await test("empty Send-to: the set-up button fits the rail in every locale, one whole button", async () => {
    const frame = document.createElement("iframe");
    frame.style.cssText = "width:1200px;height:300px;border:0";
    frame.srcdoc = `<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../md-preview.css"></head>
      <body><aside class="rail" id="rail"><div class="rail-section" id="export-section"><div class="send-split send-empty" id="send-split">
        <button id="send-primary" class="action-btn send-primary" type="button"><span class="send-ic" aria-hidden="true"><svg viewBox="0 0 24 24"></svg></span><span class="btn-label" id="send-primary-label"></span></button>
        <button id="send-caret" class="action-btn send-caret" type="button" hidden><span class="send-tri"></span></button></div></div></aside></body></html>`;
    document.body.appendChild(frame);
    await new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
    try {
      const doc = frame.contentDocument, w = frame.contentWindow;
      const btn = doc.getElementById("send-primary"), label = doc.getElementById("send-primary-label"), sec = doc.getElementById("export-section");
      for (const locale of LOCALES) {
        label.textContent = messages[locale].mdSendSetupEllipsis.message;
        await new Promise((resolve) => w.requestAnimationFrame(resolve));
        const b = btn.getBoundingClientRect(), r = sec.getBoundingClientRect();
        assert(label.scrollWidth <= label.clientWidth + 0.5 && btn.scrollWidth <= btn.clientWidth + 0.5, `${locale}: "${label.textContent}" clipped`);
        assert(b.left >= r.left - 0.5 && b.right <= r.right + 0.5, `${locale}: the button sticks out of the rail`);
        assert(Math.round(b.height) === 26, `${locale}: off the 26px rung (${b.height})`);
      }
      const cs = w.getComputedStyle(btn);
      const radii = [cs.borderTopLeftRadius, cs.borderTopRightRadius, cs.borderBottomRightRadius, cs.borderBottomLeftRadius];
      assert(new Set(radii).size === 1, "corners differ: " + radii.join(" / "));
      assert(cs.opacity === "1", "the set-up action is dimmed like a disabled control (opacity " + cs.opacity + ")");
    } finally { frame.remove(); }
  });

  // 2026-10-21 harden pass: the extraction-failure page. The REAL
  // renderErrorState (md-preview.js) builds the DOM against the production
  // stylesheet: the "Open original" <a> rode 2px above the buttons on its
  // SVG's synthesized baseline, and three equal faces named no next step.
  await test("extraction-failure page: one leading action, quiet others, link and buttons level in every locale", async () => {
    for (const width of [900, 390]) {
      const frame = document.createElement("iframe");
      frame.style.cssText = `width:${width}px;height:500px;border:0`;
      // Scripts after the markup, as md-preview.html loads them: the boot
      // touches document.body and #rendered-view.
      frame.srcdoc = `<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../md-preview.css"></head>
        <body><main><div class="doc-body"><div id="rendered-view"></div></div></main>
        <script>window.chrome = { runtime: { getURL: (p) => p, sendMessage: async () => ({}), onMessage: { addListener() {} } },
          storage: { local: { get: async () => ({}), set: async () => {}, remove: async () => {} }, sync: { get: async () => ({}) }, onChanged: { addListener() {} } },
          i18n: { getMessage: () => "", getUILanguage: () => "en" } };<\/script>
        <script src="../i18n.js"><\/script><script src="../shared.js"><\/script><script src="../md-preview.js"><\/script></body></html>`;
      document.body.appendChild(frame);
      await new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
      await new Promise((resolve) => setTimeout(resolve, 50)); // md-preview.js's own boot settles first (no payload -> its empty state)
      try {
        const w = frame.contentWindow, doc = frame.contentDocument;
        for (const locale of LOCALES) {
          const msg = (k, ...a) => a.reduce((s, v) => s.replace(/\$[A-Z_]+\$/, v), messages[locale][k].message);
          w.t = msg;
          w.renderErrorState(msg("mdPreviewNoContent") + " " + msg("mdEngineJinaNoLogin"), () => {}, false,
            { label: msg("mdEngineSwitchTo", "Defuddle"), run: () => {} }, "https://example.com/a", "alt");
          await new Promise((resolve) => w.requestAnimationFrame(resolve));
          const tag = `${locale}@${width}`;
          const acts = [...doc.querySelectorAll(".empty-state .action-btn")];
          assert(acts.length === 3, `${tag}: expected three ways out, got ${acts.length}`);
          assert(acts[0].classList.contains("es-primary") && acts[0].textContent === msg("mdEngineSwitchTo", "Defuddle"),
            `${tag}: the other engine does not lead`);
          const cs = acts.map((a) => w.getComputedStyle(a));
          assert(cs[0].backgroundColor !== "rgba(0, 0, 0, 0)" && cs[0].borderTopColor !== cs[1].borderTopColor,
            `${tag}: the lead is not distinguishable from the quiet actions`);
          assert(cs.slice(1).every((c) => c.backgroundColor === "rgba(0, 0, 0, 0)"), `${tag}: a secondary action still wears a fill`);
          const boxes = acts.map((a) => a.getBoundingClientRect());
          assert(boxes.every((b) => Math.round(b.height) === 26), `${tag}: off the 26px rung: ${boxes.map((b) => b.height).join("/")}`);
          for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++) {
            const a = boxes[i], b = boxes[j];
            if (a.top < b.bottom && b.top < a.bottom) assert(Math.abs(a.top - b.top) <= 0.5, `${tag}: ${acts[i].tagName} and ${acts[j].tagName} are ${a.top - b.top}px apart on one line`);
          }
          assert(doc.documentElement.scrollWidth <= doc.documentElement.clientWidth, `${tag}: page scrolls sideways`);
        }
      } finally { frame.remove(); }
    }
  });
})();
</script></body></html>
