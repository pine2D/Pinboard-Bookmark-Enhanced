<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Popup AI in the Service Worker Tests</title>
<style>body{font-family:monospace;padding:16px}.case{padding:6px}.pass{color:#0a0}.fail{color:#c00}</style>
</head><body><h1>Popup AI in the Service Worker Tests</h1><div id="summary"></div><div id="results"></div>
<!--
  K44-a: the popup's paid LLM call now runs inside the service worker, so the
  reply reaches the shared IDB cache even after Chrome destroyed the popup
  document. What this suite locks down, in the real source sliced out of
  background.js (the source-slice harness shape of background-lifecycle-tests /
  save-pipeline-tests):

    - the cache write does not depend on the popup still being there to answer;
    - the caller's inflight key is used VERBATIM, so a reopened popup rides the
      running call and three different generation dimensions never merge;
    - the A8 half-empty rule crossed the boundary intact (an empty half is a
      MISS, never a cached fake success);
    - tag case resolution crossed it too — the one thing that could silently
      degrade, since the map lives popup-side;
    - both account gates (before dispatch, before the cache write);
    - the error envelope is a plain, structured-cloneable object;
    - credentials are read by the worker from storage and an API key riding the
      message is dropped by the whitelist AND by the explicit API_KEY_FIELDS
      delete — proven against the REAL callAI with a stubbed fetch, by looking
      at the bytes that would have gone on the wire.

  Provider responses are hand-written in the servers' own shapes (CLAUDE.md:
  never generated by the write-side parser's inverse).
-->
<script src="../i18n.js"></script>
<script src="../shared.js"></script>
<script src="../ai.js"></script>
<script>
const root = document.getElementById("results"); let pass = 0, fail = 0;
// A sync try/catch around a promise-returning API "passes" every behavioural
// assertion while leaking an unhandled rejection — watch for it directly.
const unhandled = [];
addEventListener("unhandledrejection", (event) => { unhandled.push(event.reason); event.preventDefault(); });
function check(name, ok) {
  ok ? pass++ : fail++;
  const row = document.createElement("div");
  row.className = "case " + (ok ? "pass" : "fail");
  row.textContent = `${ok ? "✓" : "✗"} ${name}`;
  root.appendChild(row);
}
// A harness that cannot be built must fail its cases, not silently emit fewer
// rows than the runner expects (an under-count reads as a timeout, not a red).
async function testCase(name, fn) {
  try { check(name, (await fn()) === true); }
  catch (e) { check(`${name} — threw: ${e && e.message}`, false); }
}

// chrome.storage hands back a structured clone, never a live reference: a fake
// that leaked the stored object would make a missing write-back look like a pass.
function makeStore(initial) {
  const data = structuredClone(initial || {});
  return {
    data,
    async get(key) {
      const keys = typeof key === "string" ? [key] : Object.keys(key || data);
      const out = {};
      for (const k of keys) if (k in data) out[k] = structuredClone(data[k]);
      return out;
    },
    async set(obj) { for (const [k, v] of Object.entries(obj)) data[k] = structuredClone(v); },
    async remove(key) { for (const k of [].concat(key)) delete data[k]; },
  };
}

// ---- Hand-written provider payloads (real server shapes) --------------------
// OpenAI /v1/chat/completions success envelope, trimmed to the fields the caller
// reads plus the ones a real reply always carries.
function openaiChatReply(content) {
  return {
    id: "chatcmpl-9pbp01",
    object: "chat.completion",
    created: 1758000000,
    model: "gpt-5.4-nano",
    choices: [{ index: 0, message: { role: "assistant", content }, logprobs: null, finish_reason: "stop" }],
    usage: { prompt_tokens: 812, completion_tokens: 44, total_tokens: 856 },
  };
}
function jsonResponse(status, body) {
  return {
    ok: status >= 200 && status < 300,
    status,
    statusText: status === 200 ? "OK" : "Error",
    headers: { get: () => "application/json" },
    async json() { return body; },
    async text() { return JSON.stringify(body); },
  };
}

let backgroundSource = null;
async function getSource() {
  if (!backgroundSource) backgroundSource = await (await fetch("../background.js")).text();
  return backgroundSource;
}

// ---- Harness: the popup-AI worker block sliced out of background.js ---------
// PBP_AI_OVERRIDE_FIELDS / pbpSanitizeAiOverrides moved to shared.js when the
// popup started building the overrides with the SAME list (K44-b); they are
// injected below as the real globals this page already loaded.
const AI_BLOCK_START = "// Structured clone drops the Error prototype";
const AI_BLOCK_END = "// ---- 监听来自 popup 的消息 ----";

function buildAiHarness(source, opts) {
  const o = opts || {};
  const start = source.indexOf(AI_BLOCK_START);
  const end = source.indexOf(AI_BLOCK_END, start);
  if (start < 0 || end <= start) throw new Error("popup AI worker block not found in background.js");
  const calls = { callAI: [], setAICache: [], loadSettings: 0, warn: [] };
  // getCurrentPinboardAuth is re-read at every gate; a list lets a case model an
  // account switch that lands BETWEEN two specific gates.
  const accounts = o.accounts || ["alice"];
  let authReads = 0;
  const local = makeStore(o.local);
  const reply = o.callAI || (async () => (o.reply !== undefined ? o.reply : "ok"));
  const deps = {
    chrome: { storage: { local } },
    loadSettings: async () => { calls.loadSettings++; return structuredClone(o.settings || {}); },
    getCurrentPinboardAuth: async () => {
      const account = accounts[Math.min(authReads++, accounts.length - 1)];
      return { token: `${account}:token`, account, epoch: 0 };
    },
    callAI: async (s, prompt, callOpts) => {
      calls.callAI.push({ s, prompt, opts: callOpts });
      return reply(s, prompt, callOpts);
    },
    // The REAL registry: dedup is the behaviour under test, a stub would assert
    // nothing about it.
    getOrCreateInflight,
    parseAICombined, parseAITags, refineTags,
    buildTagCaseMap, resolveTagCase,
    AI_TAG_CAP, API_KEY_FIELDS, PBP_AI_OVERRIDE_FIELDS, pbpSanitizeAiOverrides,
    setAICache: async (...args) => { calls.setAICache.push(args); if (o.setAICache) return o.setAICache(...args); },
    console: { warn: (...a) => calls.warn.push(a), log: () => {}, error: (...a) => calls.warn.push(a) },
  };
  const factory = new Function(...Object.keys(deps), `${source.slice(start, end)}
    return { pbpRunPopupAiCall, pbpSanitizeAiOverrides, pbpAiErrorEnvelope, PBP_AI_OVERRIDE_FIELDS };`);
  return { ...factory(...Object.values(deps)), calls, local, get authReads() { return authReads; } };
}

// Unique per case: _inflightAI is ONE module-level Map for the whole page, so a
// reused key would leak dedup state between cases.
let keySeq = 0;
function freshKey(suffix) { return `alice|fp-${++keySeq}|${suffix || "combined"}|https://example.com/a`; }

function baseMessage(over) {
  return {
    type: "PBP_AI_CALL",
    account: "alice",
    mode: "combined",
    kind: "tags",
    prompt: "Summarize and tag the following page.\n\nTITLE: Example\n...",
    source: "local",
    url: "https://example.com/a",
    inflightKey: freshKey(),
    cacheDuration: "24h",
    aiOverrides: {},
    ...(over || {}),
  };
}
function cacheWrite(calls, type) {
  const row = calls.setAICache.find((args) => args[1] === type);
  return row ? { url: row[0], type: row[1], result: row[2], duration: row[3], source: row[4], account: row[5], settings: row[6] } : null;
}

// ---- Harness: the message router sliced out of background.js ----------------
const EXT_ID = "feoognahlmfmbllpmgailahcnjppiegb";
const EXT_URL = `chrome-extension://${EXT_ID}/popup.html`;

function buildRouterHarness(source, opts) {
  const o = opts || {};
  const start = source.indexOf("function handleRuntimeMessage");
  const end = source.indexOf("chrome.runtime.onMessage.addListener(handleRuntimeMessage);", start);
  if (start < 0 || end <= start) throw new Error("router source not found");
  const calls = [];
  const spy = (name, ret) => (...args) => { calls.push([name, args]); return typeof ret === "function" ? ret(...args) : ret; };
  const deps = {
    chrome: {
      runtime: { id: EXT_ID, getURL: (p) => `chrome-extension://${EXT_ID}/${p}` },
      storage: {
        local: { get: async () => ({}), set: async () => {}, remove: async () => {} },
        session: { get: async () => ({}), set: async () => {} },
      },
      tabs: { query: async () => [] },
    },
    noteActivity: spy("noteActivity"),
    pbpRunPopupAiCall: (...args) => { calls.push(["aiCall", args]); return o.aiCall ? o.aiCall(...args) : Promise.resolve({ ok: true, tags: null, summary: "s" }); },
    // Real, not a stub: the branch's rejection arm serializes through it, and a
    // stub would hide a missing symbol there (the first RED this suite caught).
    pbpAiErrorEnvelope: buildAiHarness(source, { settings: {} }).pbpAiErrorEnvelope,
    PBP_VOCAB_DRIVE_CAPABLE: false,
    PBP_VOCAB_DRIVE_CONNECTED_KEY: "k",
    pbpVocabDriveIsConnected: spy("vocabConnected", Promise.resolve(false)),
    pbpVocabScheduleDirty: spy("vocabDirty", Promise.resolve()),
    pbpQueueVocabDriveSync: spy("vocabSync", Promise.resolve({ ok: true })),
    pbpGetVocabDriveStatus: spy("vocabStatus", Promise.resolve({})),
    pbpVocabDriveResponse: (r) => r,
    pbpVocabClearNotices: spy("vocabClear", Promise.resolve()),
    pbpDisconnectVocabDrive: spy("vocabDisc", Promise.resolve()),
    pbpDictOwnerScope: (a) => "acct_" + a,
    getCurrentPinboardAuth: async () => ({ token: "alice:t", account: "alice", epoch: 0 }),
    pbpPinboardAuthIsCurrent: () => true,
    pbpStatusCacheGet: () => null,
    pbpStatusCacheSet: spy("cacheSet", true),
    pbpSameBookmark: () => false,
    pbpSaveFailure: (code) => ({ status: "failed", code }),
    submitPopupSaveIntent: spy("saveIntent", Promise.resolve({ status: "saved" })),
    handleBatchSave: spy("batchSave", Promise.resolve()),
    handleSaveTabSet: spy("saveTabSet", Promise.resolve()),
    loadSettings: async () => ({}),
    pbpWaybackArchive: spy("wayback", Promise.resolve()),
    pbpIsAllowedPinboardApiUrl: (u) => String(u).startsWith("https://api.pinboard.in/v1/"),
    pbpAuthorizePinboardApiUrl: (u) => u,
    pinboardFetch: spy("pinFetch", Promise.resolve({ ok: true, status: 200, text: async () => "{}" })),
    pinboardFetchImmediate: spy("pinFetchNow", Promise.resolve({ ok: true, status: 200, text: async () => "{}" })),
    retryOfflineItem: spy("retryItem", Promise.resolve({ ok: true, result: {} })),
    readOfflineQueueWithIds: spy("readQueue", Promise.resolve([])),
    mutateOfflineQueue: spy("mutQueue", Promise.resolve([])),
    checkBookmarked: spy("checkBm", Promise.resolve(null)),
    statusCache: new Map(),
    extractForPreview: spy("extract", Promise.resolve({ error: "empty" })),
    pbpImgFixInstallRule: spy("imgInstall", Promise.resolve(786001)),
    pbpImgFixRemoveRules: spy("imgRemove", Promise.resolve()),
    pbpImgFixSweepRules: spy("imgSweep", Promise.resolve()),
    _imgFixIsPreviewUrl: (u) => typeof u === "string" && u.includes("md-preview.html"),
    _batchRunning: false,
    deobfuscateKey: (v) => v,
    showNotification: spy("notify"),
    t: (k, ...a) => (a.length ? `${k}:${a.join(":")}` : k),
    pbpWithLargeStorageLock: (key, fn) => fn(),
    pbpReadLargeWithFallbackUnlocked: async (key, read, dflt) => (await read()) ?? dflt,
    getSettingsStorage: async () => ({ get: async () => ({ customOverlayCSS: "/*ov*/" }) }),
    console,
  };
  const factory = new Function(...Object.keys(deps), `${source.slice(start, end)}
    return handleRuntimeMessage;`);
  const handler = factory(...Object.values(deps));
  const invoke = (message, sender, respond) => new Promise((resolve) => {
    const out = { responses: [], held: undefined, respondThrew: false };
    const settle = () => resolve(out);
    out.held = handler(message, sender || { id: EXT_ID, url: EXT_URL }, (r) => {
      out.responses.push(r);
      if (respond) { try { respond(r); } catch (e) { out.respondThrew = true; throw e; } }
      settle();
    });
    if (out.held !== true || out.responses.length) settle();
    setTimeout(settle, 250);
  });
  return { invoke, calls };
}

(async () => {
  const source = await getSource();

  // ======================================================================
  // A. the paid reply lands in the cache whether or not the popup survived
  // ======================================================================
  await testCase("combined success caches BOTH halves under the caller's url/source/account/duration", async () => {
    const h = buildAiHarness(source, {
      settings: { aiTagSeparator: "-", aiCacheDuration: "6h" },
      reply: '{"summary":"A short note about the page.","tags":["mv3","service-worker"]}',
    });
    const msg = baseMessage({ mode: "combined" });
    await h.pbpRunPopupAiCall(msg);
    const tags = cacheWrite(h.calls, "tags");
    const summary = cacheWrite(h.calls, "summary");
    return !!tags && !!summary &&
      tags.url === msg.url && tags.source === "local" && tags.account === "alice" && tags.duration === "24h" &&
      tags.result.join(",") === "mv3,service-worker" &&
      summary.result === "A short note about the page." && summary.source === "local" && summary.account === "alice";
  });

  await testCase("combined success answers {ok:true} with both halves", async () => {
    const h = buildAiHarness(source, {
      settings: { aiTagSeparator: "-" },
      reply: '{"summary":"Note.","tags":["alpha","beta"]}',
    });
    const r = await h.pbpRunPopupAiCall(baseMessage({ mode: "combined" }));
    return r.ok === true && r.summary === "Note." && Array.isArray(r.tags) && r.tags.join(",") === "alpha,beta";
  });

  await testCase("the cache write survives a dead port: sendResponse throwing loses the render, not the result", async () => {
    let cached = null;
    const rh = buildRouterHarness(source, {
      aiCall: async () => { cached = "written"; return { ok: true, tags: ["a"], summary: null }; },
    });
    const before = unhandled.length;
    await rh.invoke(baseMessage(), null, () => { throw new Error("Attempting to use a disconnected port object"); });
    await new Promise((r) => setTimeout(r, 30));
    // The worker did its work; the throw came from the (destroyed) popup's side.
    return cached === "written" && rh.calls.some(([n]) => n === "aiCall") && unhandled.length === before;
  });

  await testCase("single tags caches only the tags half", async () => {
    const h = buildAiHarness(source, { settings: { aiTagSeparator: "-" }, reply: '["mv3","chrome"]' });
    const r = await h.pbpRunPopupAiCall(baseMessage({ mode: "single", kind: "tags", inflightKey: freshKey("tags") }));
    return r.ok === true && r.summary === null && r.tags.join(",") === "mv3,chrome" &&
      h.calls.setAICache.length === 1 && h.calls.setAICache[0][1] === "tags";
  });

  await testCase("single summary caches only the summary half", async () => {
    const h = buildAiHarness(source, { settings: {}, reply: "One paragraph of summary." });
    const r = await h.pbpRunPopupAiCall(baseMessage({ mode: "single", kind: "summary", inflightKey: freshKey("summary") }));
    return r.ok === true && r.tags === null && r.summary === "One paragraph of summary." &&
      h.calls.setAICache.length === 1 && h.calls.setAICache[0][1] === "summary";
  });

  // ======================================================================
  // B. dedup: the caller's key is opaque and used verbatim
  // ======================================================================
  await testCase("two messages on ONE inflight key pay for exactly one provider call", async () => {
    let resolveCall;
    const gate = new Promise((r) => { resolveCall = r; });
    const h = buildAiHarness(source, {
      settings: { aiTagSeparator: "-" },
      callAI: async () => gate,
    });
    const key = freshKey();
    const a = h.pbpRunPopupAiCall(baseMessage({ inflightKey: key }));
    const b = h.pbpRunPopupAiCall(baseMessage({ inflightKey: key }));
    await new Promise((r) => setTimeout(r, 10));
    resolveCall('{"summary":"S","tags":["t1"]}');
    const [ra, rb] = await Promise.all([a, b]);
    return h.calls.callAI.length === 1 && ra.summary === "S" && rb.summary === "S" &&
      ra.tags.join() === "t1" && rb.tags.join() === "t1";
  });

  await testCase("a key differing only in the generation fingerprint is NOT merged", async () => {
    const h = buildAiHarness(source, { settings: { aiTagSeparator: "-" }, reply: '{"summary":"S","tags":["t"]}' });
    const url = "https://example.com/a";
    await Promise.all([
      h.pbpRunPopupAiCall(baseMessage({ inflightKey: `alice|gemini:flash|combined|${url}` })),
      h.pbpRunPopupAiCall(baseMessage({ inflightKey: `alice|openai:nano|combined|${url}` })),
    ]);
    return h.calls.callAI.length === 2;
  });

  await testCase("a key differing only in the extraction source is NOT merged", async () => {
    const h = buildAiHarness(source, { settings: { aiTagSeparator: "-" }, reply: '{"summary":"S","tags":["t"]}' });
    const fp = "alice|fp-src|combined|https://example.com/b";
    await Promise.all([
      h.pbpRunPopupAiCall(baseMessage({ source: "local", inflightKey: fp + "|local" })),
      h.pbpRunPopupAiCall(baseMessage({ source: "jina", inflightKey: fp + "|jina" })),
    ]);
    const sources = h.calls.setAICache.map((a) => a[4]);
    return h.calls.callAI.length === 2 && sources.includes("local") && sources.includes("jina");
  });

  await testCase("a key differing only in the account is NOT merged", async () => {
    const h = buildAiHarness(source, { accounts: ["alice"], settings: { aiTagSeparator: "-" }, reply: '{"summary":"S","tags":["t"]}' });
    const url = "https://example.com/c";
    await Promise.all([
      h.pbpRunPopupAiCall(baseMessage({ inflightKey: `alice|fp|combined|${url}` })),
      h.pbpRunPopupAiCall(baseMessage({ inflightKey: `bob|fp|combined|${url}` })),
    ]);
    return h.calls.callAI.length === 2;
  });

  await testCase("the caller's inflight key is used VERBATIM (never recomputed worker-side)", async () => {
    // An opaque key the worker could not possibly derive from the message
    // fields — and two messages whose url/kind DIFFER, so any worker-side
    // recomputation would split them into two paid calls.
    const opaque = "OPAQUE::" + (++keySeq);
    let resolveCall;
    const gate = new Promise((r) => { resolveCall = r; });
    const h = buildAiHarness(source, { settings: { aiTagSeparator: "-" }, callAI: async () => gate });
    const a = h.pbpRunPopupAiCall(baseMessage({ inflightKey: opaque, url: "https://example.com/x" }));
    const b = h.pbpRunPopupAiCall(baseMessage({ inflightKey: opaque, url: "https://example.com/y", kind: "summary" }));
    await new Promise((r) => setTimeout(r, 10));
    resolveCall('{"summary":"S","tags":["t"]}');
    const [ra, rb] = await Promise.all([a, b]);
    return h.calls.callAI.length === 1 && ra.summary === "S" && rb.summary === "S";
  });

  await testCase("the inflight entry is released once settled, so a later identical call runs again", async () => {
    const h = buildAiHarness(source, { settings: { aiTagSeparator: "-" }, reply: '{"summary":"S","tags":["t"]}' });
    const key = freshKey();
    await h.pbpRunPopupAiCall(baseMessage({ inflightKey: key }));
    await h.pbpRunPopupAiCall(baseMessage({ inflightKey: key }));
    return h.calls.callAI.length === 2;
  });

  // ======================================================================
  // C. A8: a half-empty reply is a MISS, never a sticky fake success
  // ======================================================================
  await testCase("combined {\"summary\":\"x\",\"tags\":[]} caches the summary only", async () => {
    const h = buildAiHarness(source, { settings: { aiTagSeparator: "-" }, reply: '{"summary":"Only a summary.","tags":[]}' });
    await h.pbpRunPopupAiCall(baseMessage());
    return h.calls.setAICache.length === 1 && h.calls.setAICache[0][1] === "summary";
  });

  await testCase("...and answers tags:null so the requester falls through to its own single call", async () => {
    const h = buildAiHarness(source, { settings: { aiTagSeparator: "-" }, reply: '{"summary":"Only a summary.","tags":[]}' });
    const r = await h.pbpRunPopupAiCall(baseMessage({ kind: "tags" }));
    return r.ok === true && r.tags === null && r.summary === "Only a summary.";
  });

  await testCase("combined with an empty summary caches the tags only and answers summary:null", async () => {
    const h = buildAiHarness(source, { settings: { aiTagSeparator: "-" }, reply: '{"summary":"","tags":["only","tags"]}' });
    const r = await h.pbpRunPopupAiCall(baseMessage({ kind: "summary" }));
    return r.ok === true && r.summary === null && r.tags.join(",") === "only,tags" &&
      h.calls.setAICache.length === 1 && h.calls.setAICache[0][1] === "tags";
  });

  await testCase("a single tags call whose reply yields no tags caches nothing", async () => {
    const h = buildAiHarness(source, { settings: { aiTagSeparator: "-" }, reply: "[]" });
    const r = await h.pbpRunPopupAiCall(baseMessage({ mode: "single", kind: "tags", inflightKey: freshKey("tags") }));
    return r.ok === true && r.tags === null && h.calls.setAICache.length === 0;
  });

  // ======================================================================
  // D. tag case resolution (the quietest possible regression)
  // ======================================================================
  const CASE_LOCAL = { cached_user_tags: { account: "alice", counts: { JavaScript: 9, javascript: 1, MV3: 4 } } };

  await testCase("optRespectTagCase=true resolves cached tags to the account's preferred casing", async () => {
    const h = buildAiHarness(source, {
      settings: { aiTagSeparator: "-", optRespectTagCase: true },
      local: CASE_LOCAL,
      reply: '["javascript","mv3"]',
    });
    await h.pbpRunPopupAiCall(baseMessage({ mode: "single", kind: "tags", inflightKey: freshKey("tags") }));
    const w = cacheWrite(h.calls, "tags");
    return !!w && w.result.join(",") === "JavaScript,MV3";
  });

  await testCase("...and the response carries the resolved casing too", async () => {
    const h = buildAiHarness(source, {
      settings: { aiTagSeparator: "-", optRespectTagCase: true },
      local: CASE_LOCAL,
      reply: '["javascript"]',
    });
    const r = await h.pbpRunPopupAiCall(baseMessage({ mode: "single", kind: "tags", inflightKey: freshKey("tags") }));
    return r.tags.join(",") === "JavaScript";
  });

  await testCase("a tag vocabulary belonging to ANOTHER account is never used, and the degradation leaves a trace", async () => {
    const h = buildAiHarness(source, {
      settings: { aiTagSeparator: "-", optRespectTagCase: true },
      local: { cached_user_tags: { account: "bob", counts: { JavaScript: 9 } } },
      reply: '["javascript"]',
    });
    const r = await h.pbpRunPopupAiCall(baseMessage({ mode: "single", kind: "tags", inflightKey: freshKey("tags") }));
    const traced = h.calls.warn.some((a) => a.join(" ").toLowerCase().includes("case"));
    const leaked = h.calls.warn.some((a) => a.join(" ").includes("JavaScript") || a.join(" ").includes("bob"));
    return r.tags.join(",") === "javascript" && traced && !leaked;
  });

  await testCase("optRespectTagCase=false leaves the model's lowercase tags untouched", async () => {
    const h = buildAiHarness(source, {
      settings: { aiTagSeparator: "-", optRespectTagCase: false },
      local: CASE_LOCAL,
      reply: '["javascript","mv3"]',
    });
    const r = await h.pbpRunPopupAiCall(baseMessage({ mode: "single", kind: "tags", inflightKey: freshKey("tags") }));
    return r.tags.join(",") === "javascript,mv3";
  });

  await testCase("combined mode resolves case as well (not only the single path)", async () => {
    const h = buildAiHarness(source, {
      settings: { aiTagSeparator: "-", optRespectTagCase: true },
      local: CASE_LOCAL,
      reply: '{"summary":"S","tags":["javascript","mv3"]}',
    });
    const r = await h.pbpRunPopupAiCall(baseMessage());
    const w = cacheWrite(h.calls, "tags");
    return r.tags.join(",") === "JavaScript,MV3" && w.result.join(",") === "JavaScript,MV3";
  });

  await testCase("optRespectTagCase may be overridden by the message and takes effect", async () => {
    const h = buildAiHarness(source, {
      settings: { aiTagSeparator: "-", optRespectTagCase: false },
      local: CASE_LOCAL,
      reply: '["javascript"]',
    });
    const r = await h.pbpRunPopupAiCall(baseMessage({
      mode: "single", kind: "tags", inflightKey: freshKey("tags"), aiOverrides: { optRespectTagCase: true },
    }));
    return r.tags.join(",") === "JavaScript";
  });

  // ======================================================================
  // E. account gates (cross-cutting iron rule)
  // ======================================================================
  await testCase("an account switch BEFORE dispatch spends nothing: zero provider calls", async () => {
    const h = buildAiHarness(source, { accounts: ["carol"], settings: {}, reply: "x" });
    await h.pbpRunPopupAiCall(baseMessage({ account: "alice" }));
    return h.calls.callAI.length === 0;
  });

  await testCase("...and answers ok:false / account_changed", async () => {
    const h = buildAiHarness(source, { accounts: ["carol"], settings: {}, reply: "x" });
    const r = await h.pbpRunPopupAiCall(baseMessage({ account: "alice" }));
    return r.ok === false && r.error.code === "account_changed";
  });

  await testCase("an account switch DURING the call discards the result: zero cache writes", async () => {
    // gate 1 sees alice, gate 2 (after the reply) sees carol.
    const h = buildAiHarness(source, {
      accounts: ["alice", "carol"],
      settings: { aiTagSeparator: "-" },
      reply: '{"summary":"S","tags":["t"]}',
    });
    const r = await h.pbpRunPopupAiCall(baseMessage({ account: "alice" }));
    return h.calls.callAI.length === 1 && h.calls.setAICache.length === 0 &&
      r.ok === false && r.error.code === "account_changed";
  });

  await testCase("the cache write is filed under the message's validated account", async () => {
    const h = buildAiHarness(source, { accounts: ["alice"], settings: { aiTagSeparator: "-" }, reply: '{"summary":"S","tags":["t"]}' });
    await h.pbpRunPopupAiCall(baseMessage({ account: "alice" }));
    return h.calls.setAICache.every((args) => args[5] === "alice");
  });

  await testCase("a message without an account is refused before settings are even read", async () => {
    const h = buildAiHarness(source, { settings: {}, reply: "x" });
    const r = await h.pbpRunPopupAiCall(baseMessage({ account: "" }));
    return r.ok === false && r.error.code === "invalid" && h.calls.loadSettings === 0 && h.calls.callAI.length === 0;
  });

  await testCase("a message without a prompt / url / inflight key / kind is refused the same way", async () => {
    const h = buildAiHarness(source, { settings: {}, reply: "x" });
    const results = await Promise.all([
      h.pbpRunPopupAiCall(baseMessage({ prompt: "" })),
      h.pbpRunPopupAiCall(baseMessage({ url: "" })),
      h.pbpRunPopupAiCall(baseMessage({ inflightKey: "" })),
      h.pbpRunPopupAiCall(baseMessage({ kind: "everything" })),
    ]);
    return results.every((r) => r.ok === false && r.error.code === "invalid") && h.calls.callAI.length === 0;
  });

  // ======================================================================
  // F. error envelope (structured clone drops the Error prototype)
  // ======================================================================
  await testCase("a rejected call answers a full envelope: message + code + status + paramHint", async () => {
    const h = buildAiHarness(source, {
      settings: {},
      callAI: async () => {
        const err = new Error("Model not found: gpt-nope");
        err.code = "model_not_found";
        err.status = 404;
        err.paramHint = "max_tokens";
        throw err;
      },
    });
    const r = await h.pbpRunPopupAiCall(baseMessage());
    return r.ok === false && r.error.message === "Model not found: gpt-nope" &&
      r.error.code === "model_not_found" && r.error.status === 404 && r.error.paramHint === "max_tokens";
  });

  await testCase("the envelope is a plain object and survives structuredClone intact", async () => {
    const h = buildAiHarness(source, {
      settings: {},
      callAI: async () => {
        const err = new Error("boom");
        err.code = "network";
        err.status = 503;
        throw err;
      },
    });
    const r = await h.pbpRunPopupAiCall(baseMessage());
    const clone = structuredClone(r);
    return !(r.error instanceof Error) && Object.getPrototypeOf(r.error) === Object.prototype &&
      clone.error.message === "boom" && clone.error.code === "network" && clone.error.status === 503;
  });

  await testCase("a bare Error still yields a message, with no undefined-valued keys on the wire", async () => {
    const h = buildAiHarness(source, { settings: {}, callAI: async () => { throw new Error("plain failure"); } });
    const r = await h.pbpRunPopupAiCall(baseMessage());
    const keys = Object.keys(r.error);
    return r.error.message === "plain failure" && keys.length === 1 &&
      keys.every((k) => r.error[k] !== undefined);
  });

  await testCase("the envelope never carries the stack, the prompt or the settings", async () => {
    const h = buildAiHarness(source, {
      settings: { openaiApiKey: "sk-live-REAL" },
      callAI: async () => { const e = new Error("boom"); e.code = "network"; throw e; },
    });
    const r = await h.pbpRunPopupAiCall(baseMessage({ prompt: "SECRET PROMPT BODY" }));
    const wire = JSON.stringify(r);
    return !("stack" in r.error) && !wire.includes("SECRET PROMPT BODY") && !wire.includes("sk-live-REAL") &&
      Object.keys(r.error).every((k) => ["message", "code", "status", "paramHint"].includes(k));
  });

  await testCase("a failure leaves a trace before it is folded into a product code", async () => {
    const h = buildAiHarness(source, {
      settings: { openaiApiKey: "sk-live-REAL" },
      callAI: async () => { const e = new Error("upstream 502"); e.code = "network"; throw e; },
    });
    await h.pbpRunPopupAiCall(baseMessage({ prompt: "SECRET PROMPT BODY" }));
    const logged = h.calls.warn.map((a) => a.join(" ")).join("\n");
    return logged.includes("upstream 502") && !logged.includes("sk-live-REAL") && !logged.includes("SECRET PROMPT BODY");
  });

  // ======================================================================
  // G. credentials and the override whitelist
  // ======================================================================
  await testCase("the override whitelist keeps the non-secret fields the popup may swap", async () => {
    const h = buildAiHarness(source, { settings: {} });
    const out = h.pbpSanitizeAiOverrides({
      aiProvider: "openai", openaiModel: "gpt-x", aiTagLang: "zh", aiSummaryLang: "en",
      aiTagSeparator: "_", optRespectTagCase: true, ollamaBaseUrl: "http://localhost:11434", customBaseUrl: "https://x/v1",
    });
    return out.aiProvider === "openai" && out.openaiModel === "gpt-x" && out.aiTagLang === "zh" &&
      out.aiSummaryLang === "en" && out.aiTagSeparator === "_" && out.optRespectTagCase === true &&
      out.ollamaBaseUrl === "http://localhost:11434" && out.customBaseUrl === "https://x/v1";
  });

  await testCase("EVERY API_KEY_FIELDS entry is dropped from the overrides (checked against the live constant)", async () => {
    const h = buildAiHarness(source, { settings: {} });
    const poisoned = { aiProvider: "openai" };
    for (const key of API_KEY_FIELDS) poisoned[key] = "POISON-" + key;
    const out = h.pbpSanitizeAiOverrides(poisoned);
    return API_KEY_FIELDS.length > 0 && API_KEY_FIELDS.every((key) => !(key in out)) &&
      !JSON.stringify(out).includes("POISON") && out.aiProvider === "openai";
  });

  await testCase("the whitelist contains no credential field by construction", async () => {
    const h = buildAiHarness(source, { settings: {} });
    return h.PBP_AI_OVERRIDE_FIELDS.length > 0 &&
      h.PBP_AI_OVERRIDE_FIELDS.every((f) => !API_KEY_FIELDS.includes(f)) &&
      h.PBP_AI_OVERRIDE_FIELDS.every((f) => !/apikey|token|secret|password/i.test(f));
  });

  await testCase("an unlisted non-secret setting is dropped too (whitelist, not denylist)", async () => {
    const h = buildAiHarness(source, { settings: {} });
    const out = h.pbpSanitizeAiOverrides({ aiProvider: "openai", pinboardToken: "alice:DEAD", aiCacheDuration: "never", exportTargets: [{}] });
    return !("aiCacheDuration" in out) && !("exportTargets" in out) && !("pinboardToken" in out);
  });

  await testCase("the settings handed to the provider hold the WORKER's stored key, not the message's", async () => {
    const h = buildAiHarness(source, {
      settings: { openaiApiKey: "sk-live-REAL", aiProvider: "openai", aiTagSeparator: "-" },
      reply: '{"summary":"S","tags":["t"]}',
    });
    await h.pbpRunPopupAiCall(baseMessage({ aiOverrides: { aiProvider: "openai", openaiApiKey: "sk-POISON" } }));
    const used = h.calls.callAI[0].s;
    return used.openaiApiKey === "sk-live-REAL" && !JSON.stringify(used).includes("sk-POISON");
  });

  await testCase("REAL callAI: the poisoned key never reaches the wire — headers, body or url", async () => {
    const requests = [];
    const realFetch = window.fetch;
    window.fetch = async (url, init) => {
      requests.push({ url: String(url), init });
      return jsonResponse(200, openaiChatReply('{"summary":"Real reply.","tags":["real","wire"]}'));
    };
    try {
      const h = buildAiHarness(source, {
        settings: { aiProvider: "openai", openaiApiKey: "sk-live-REAL", openaiModel: "gpt-5.4-nano", aiTagSeparator: "-" },
        callAI: (s, prompt, opts) => callAI(s, prompt, opts),   // the real dispatcher
      });
      const r = await h.pbpRunPopupAiCall(baseMessage({
        aiOverrides: { aiProvider: "openai", openaiApiKey: "sk-POISON", openaiModel: "gpt-5.4-nano" },
      }));
      const wire = requests.map((q) => q.url + "\n" + JSON.stringify(q.init.headers) + "\n" + String(q.init.body)).join("\n");
      return r.ok === true && r.summary === "Real reply." && requests.length === 1 &&
        wire.includes("sk-live-REAL") && !wire.includes("sk-POISON");
    } finally { window.fetch = realFetch; }
  });

  await testCase("REAL callAI: a whitelisted provider/model override IS honoured (the whitelist is live, not inert)", async () => {
    const requests = [];
    const realFetch = window.fetch;
    window.fetch = async (url, init) => {
      requests.push({ url: String(url), init });
      return jsonResponse(200, openaiChatReply('{"summary":"S","tags":["t"]}'));
    };
    try {
      const h = buildAiHarness(source, {
        settings: { aiProvider: "gemini", geminiApiKey: "AIza-REAL", openaiApiKey: "sk-live-REAL", aiTagSeparator: "-" },
        callAI: (s, prompt, opts) => callAI(s, prompt, opts),
      });
      await h.pbpRunPopupAiCall(baseMessage({
        aiOverrides: { aiProvider: "openai", openaiModel: "gpt-override-1" },
      }));
      const body = JSON.parse(requests[0].init.body);
      return requests.length === 1 && requests[0].url.includes("api.openai.com") && body.model === "gpt-override-1";
    } finally { window.fetch = realFetch; }
  });

  // The popup owns prompt assembly and freezes an immutable settings snapshot
  // for the op (audit A4); the worker owns setAICache, which recomputes
  // aiCacheFingerprint from ITS settings object. Every fingerprint input the
  // popup can have frozen must therefore be overridable, or the worker files
  // the popup's answer under a key the popup will never read — and, when a
  // template changed mid-op, files the OLD template's answer under the NEW
  // template's key. That is cache pollution, not just a wasted write.
  await testCase("the whitelist covers EVERY non-secret aiCacheFingerprint input (probed, not enumerated)", async () => {
    const h = buildAiHarness(source, { settings: {} });
    const listed = h.PBP_AI_OVERRIDE_FIELDS;
    const candidates = [
      "aiProvider", "aiTagLang", "aiTagSeparator", "customTagPrompt",
      "aiSummaryLang", "customSummaryPrompt", "openaiBaseUrl", "ollamaBaseUrl", "customBaseUrl",
      "geminiModel", "openaiModel", "claudeModel", "ollamaModel", "customModel", "groqModel",
    ];
    const missing = new Set();
    for (const provider of ["gemini", "openai", "claude", "ollama", "custom", "groq"]) {
      const base = {
        aiProvider: provider, aiTagLang: "en", aiTagSeparator: "-", aiSummaryLang: "auto",
        customTagPrompt: "A {{content}}", customSummaryPrompt: "A {{content}}",
        openaiBaseUrl: "https://a.example/v1", ollamaBaseUrl: "http://a.example",
        customBaseUrl: "https://a.example/v1", geminiModel: "a", openaiModel: "a",
        claudeModel: "a", ollamaModel: "a", customModel: "a", groqModel: "a",
      };
      for (const key of candidates) {
        const moved = ["tags", "summary"].some((type) =>
          aiCacheFingerprint({ ...base, [key]: "zzz-different" }, type) !== aiCacheFingerprint(base, type));
        if (moved && !listed.includes(key)) missing.add(key);
      }
    }
    return missing.size === 0;
  });

  await testCase("a custom prompt template override reaches the fingerprint, so the worker writes the POPUP's key", async () => {
    const popupSnapshot = {
      aiProvider: "openai", openaiModel: "gpt-5.4-nano", aiTagSeparator: "-",
      aiTagLang: "en", aiSummaryLang: "auto",
      customTagPrompt: "OLD tag template {{content}}", customSummaryPrompt: "OLD summary template {{content}}",
    };
    // The user edited both templates in the options tab while the popup sat open.
    const swStorage = { ...popupSnapshot, customTagPrompt: "NEW tag template {{content}}", customSummaryPrompt: "NEW summary template {{content}}" };
    const h = buildAiHarness(source, { settings: swStorage, reply: '["t"]' });
    await h.pbpRunPopupAiCall(baseMessage({
      mode: "single", kind: "tags", inflightKey: freshKey("tags"),
      aiOverrides: { customTagPrompt: popupSnapshot.customTagPrompt, customSummaryPrompt: popupSnapshot.customSummaryPrompt },
    }));
    const used = cacheWrite(h.calls, "tags").settings;
    return aiCacheFingerprint(used, "tags") === aiCacheFingerprint(popupSnapshot, "tags") &&
      aiCacheFingerprint(used, "summary") === aiCacheFingerprint(popupSnapshot, "summary") &&
      // the fixture genuinely distinguishes the two templates
      aiCacheFingerprint(swStorage, "tags") !== aiCacheFingerprint(popupSnapshot, "tags");
  });

  await testCase("an endpoint override reaches the fingerprint too (openaiBaseUrl)", async () => {
    const popupSnapshot = { aiProvider: "openai", openaiModel: "gpt-5.4-nano", aiTagSeparator: "-", openaiBaseUrl: "https://old.proxy.example/v1" };
    const swStorage = { ...popupSnapshot, openaiBaseUrl: "https://new.proxy.example/v1" };
    const h = buildAiHarness(source, { settings: swStorage, reply: '["t"]' });
    await h.pbpRunPopupAiCall(baseMessage({
      mode: "single", kind: "tags", inflightKey: freshKey("tags"),
      aiOverrides: { openaiBaseUrl: popupSnapshot.openaiBaseUrl },
    }));
    const used = cacheWrite(h.calls, "tags").settings;
    return aiCacheFingerprint(used, "tags") === aiCacheFingerprint(popupSnapshot, "tags") &&
      aiCacheFingerprint(swStorage, "tags") !== aiCacheFingerprint(popupSnapshot, "tags");
  });

  await testCase("a failing cache write answers an envelope: pbpRunPopupAiCall really never rejects", async () => {
    const h = buildAiHarness(source, {
      settings: { aiTagSeparator: "-" },
      reply: '{"summary":"S","tags":["t"]}',
      setAICache: async () => { throw new DOMException("IDB unavailable", "InvalidStateError"); },
    });
    const r = await h.pbpRunPopupAiCall(baseMessage());
    const logged = h.calls.warn.map((a) => a.join(" ")).join("\n");
    return r.ok === false && r.error.message === "IDB unavailable" && logged.includes("IDB unavailable");
  });

  await testCase("settings are re-read per message, never captured once at worker top level", async () => {
    const h = buildAiHarness(source, { settings: { aiTagSeparator: "-" }, reply: '{"summary":"S","tags":["t"]}' });
    await h.pbpRunPopupAiCall(baseMessage());
    await h.pbpRunPopupAiCall(baseMessage());
    return h.calls.loadSettings === 2;
  });

  await testCase("auth is re-read at BOTH gates for one call, not once for the pair", async () => {
    const h = buildAiHarness(source, { settings: { aiTagSeparator: "-" }, reply: '{"summary":"S","tags":["t"]}' });
    await h.pbpRunPopupAiCall(baseMessage());
    return h.authReads === 2;
  });

  // ======================================================================
  // H. router wiring and the MV3 iron rules
  // ======================================================================
  await testCase("handleRuntimeMessage is NOT async (an async listener cannot hold the channel)", async () => {
    return /(^|\n)function handleRuntimeMessage\(/.test(source) && !/async function handleRuntimeMessage/.test(source);
  });

  await testCase("PBP_AI_CALL reaches pbpRunPopupAiCall and holds the async channel", async () => {
    const rh = buildRouterHarness(source);
    const msg = baseMessage();
    const r = await rh.invoke(msg);
    const forwarded = rh.calls.find(([n]) => n === "aiCall");
    return r.held === true && !!forwarded && forwarded[1][0].inflightKey === msg.inflightKey;
  });

  await testCase("the branch answers the envelope the worker produced", async () => {
    const rh = buildRouterHarness(source, { aiCall: async () => ({ ok: true, tags: ["x"], summary: null }) });
    const r = await rh.invoke(baseMessage());
    return r.responses[0]?.ok === true && r.responses[0].tags.join() === "x" && r.responses[0].summary === null;
  });

  await testCase("noteActivity runs for a PBP_AI_CALL, so the keepalive window covers the 30s deadline", async () => {
    const rh = buildRouterHarness(source);
    await rh.invoke(baseMessage());
    const order = rh.calls.map(([n]) => n);
    return order.includes("noteActivity") && order.indexOf("noteActivity") < order.indexOf("aiCall");
  });

  await testCase("an internal rejection still answers, so the popup never hangs on a dead promise", async () => {
    const rh = buildRouterHarness(source, { aiCall: async () => { throw new Error("worker exploded"); } });
    const before = unhandled.length;
    const r = await rh.invoke(baseMessage());
    await new Promise((res) => setTimeout(res, 20));
    return r.responses.length === 1 && r.responses[0]?.ok === false && unhandled.length === before;
  });

  await testCase("the AI branch sits behind the sender gate: a content-script sender is refused", async () => {
    const rh = buildRouterHarness(source);
    const r = await rh.invoke(baseMessage(), { id: EXT_ID, url: "https://pinboard.in/u:alice" });
    return r.responses[0]?.error === "forbidden" && !rh.calls.some(([n]) => n === "aiCall");
  });

  document.getElementById("summary").textContent = `pass=${pass} fail=${fail}`;
})();
</script></body></html>
