<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="pbp-expected-count" content="15"><title>Options Reset Tests</title>
<style>
  .case.pass { color: #0a0; }
  .case.fail { color: #c00; font-weight: bold; }
</style></head>
<body>
<div id="results"></div>
<script src="fixtures/chrome-mock.js"></script>
<script src="fixtures/sw-realm.js"></script>
<script>
let passCount = 0, failCount = 0;
function pass(name){passCount++;const d=document.createElement("div");d.className="case pass";d.textContent="OK "+name;document.getElementById("results").appendChild(d);}
function fail(name,msg){failCount++;const d=document.createElement("div");d.className="case fail";d.textContent="X "+name+" :: "+msg;document.getElementById("results").appendChild(d);}
async function test(name,fn){try{await fn();pass(name);}catch(e){fail(name,e && e.message || String(e));}}

(async () => {
  const realm = await pbpSwRealm.bootOptions();
  try {
    const doc = realm.doc;
    const $id = (id) => doc.getElementById(id);
    const applyPanelReset = realm.win.__PBP_applyPanelReset;
    const panelDefaults = realm.win.__PBP_PANEL_DEFAULTS;
    const authoredIds = realm.win.__PBP_RESET_AUTHORED_IDS;
    if (typeof applyPanelReset !== "function") throw new Error("__PBP_applyPanelReset missing on booted options realm");
    if (!panelDefaults || typeof panelDefaults !== "object") throw new Error("__PBP_PANEL_DEFAULTS missing on booted options realm");

    await test("radio group resets to named default value", () => {
      doc.querySelector('input[name="popup-width-preset"][value="450"]').checked = true;
      applyPanelReset(panelDefaults.popup, doc);
      const sel = doc.querySelector('input[name="popup-width-preset"]:checked');
      if (!sel || sel.value !== "550") throw new Error("expected 550 checked, got " + (sel && sel.value));
    });

    await test("nested urlClean checkboxes reset to defaults", () => {
      $id("opt-urlclean-enabled").checked = false;
      $id("opt-urlclean-on-open").checked = false;
      $id("opt-urlclean-aggressive").checked = true;
      applyPanelReset(panelDefaults.popup, doc);
      if (!$id("opt-urlclean-enabled").checked) throw new Error("enabled should reset to true");
      if (!$id("opt-urlclean-on-open").checked) throw new Error("on-open should reset to true");
      if ($id("opt-urlclean-aggressive").checked) throw new Error("aggressive should reset to false");
    });

    await test("nested urlClean array textareas reset to empty string", () => {
      $id("opt-urlclean-custom").value = "utm_other";
      $id("opt-urlclean-exclude").value = "tag";
      applyPanelReset(panelDefaults.popup, doc);
      if ($id("opt-urlclean-custom").value !== "") throw new Error("custom textarea should be empty, got " + JSON.stringify($id("opt-urlclean-custom").value));
      if ($id("opt-urlclean-exclude").value !== "") throw new Error("exclude textarea should be empty");
    });

    await test("popup-width-custom field resets via def.fields", () => {
      $id("opt-popup-width-custom").value = "700";
      applyPanelReset(panelDefaults.popup, doc);
      if ($id("opt-popup-width-custom").value !== "") throw new Error("custom width should reset to empty string, got " + JSON.stringify($id("opt-popup-width-custom").value));
    });

    await test("popup def covers popup-width radio group", () => {
      if (!panelDefaults.popup?.radios || panelDefaults.popup.radios["popup-width-preset"] !== "550")
        throw new Error("popup-width-preset default must be 550");
    });

    await test("popup def covers all 6 urlClean controls", () => {
      const ids = Object.keys(panelDefaults.popup?.nested?.urlClean || {});
      for (const need of ["opt-urlclean-enabled","opt-urlclean-on-open","opt-urlclean-on-paste",
                          "opt-urlclean-aggressive","opt-urlclean-custom","opt-urlclean-exclude"])
        if (!ids.includes(need)) throw new Error("missing urlClean control: " + need);
    });

    await test("applyPanelReset on popup def clears tracking params + restores width", () => {
      doc.querySelector('input[name="popup-width-preset"][value="450"]').checked = true;
      $id("opt-urlclean-custom").value = "utm_other\nfoo";
      applyPanelReset(panelDefaults.popup, doc);
      if (doc.querySelector('input[name="popup-width-preset"]:checked').value !== "550")
        throw new Error("width not reset to 550");
      if ($id("opt-urlclean-custom").value !== "") throw new Error("custom params not cleared");
    });

    await test("bookmarks def resets tag-sync-mode to cached", () => {
      doc.querySelector('input[name="tag-sync-mode"][value="prewarmed"]').checked = true;
      applyPanelReset(panelDefaults.bookmarks, doc);
      const sel = doc.querySelector('input[name="tag-sync-mode"]:checked');
      if (!sel || sel.value !== "cached") throw new Error("tag-sync-mode not reset to cached, got " + (sel && sel.value));
    });

    await test("ai-behavior def resets opt-ai-use-transcript to checked (T7.13)", () => {
      const box = $id("opt-ai-use-transcript");
      box.checked = false;
      applyPanelReset(panelDefaults["ai-behavior"], doc);
      if (!box.checked) throw new Error("opt-ai-use-transcript not reset to checked");
    });

    await test("ai-behavior def resets ai-content-source to local", () => {
      doc.querySelector('input[name="ai-content-source"][value="jina"]').checked = true;
      applyPanelReset(panelDefaults["ai-behavior"], doc);
      const sel = doc.querySelector('input[name="ai-content-source"]:checked');
      if (!sel || sel.value !== "local") throw new Error("content-source not reset to local, got " + (sel && sel.value));
    });

    await test("ai-behavior def resets opt-ai-tag-lang to en and ai def keeps API keys", () => {
      $id("opt-ai-tag-lang").value = "ja";
      $id("opt-ai-provider").value = "openai";
      $id("opt-openai-key").value = "sk-keep-me";
      applyPanelReset(panelDefaults["ai-behavior"], doc);
      applyPanelReset(panelDefaults.ai, doc);
      if ($id("opt-ai-tag-lang").value !== "en") throw new Error("tag-lang not reset to en, got " + $id("opt-ai-tag-lang").value);
      if ($id("opt-ai-provider").value !== "gemini") throw new Error("ai provider not reset to gemini, got " + $id("opt-ai-provider").value);
      if ($id("opt-openai-key").value !== "sk-keep-me") throw new Error("ai reset wiped skipped secret key");
    });

    await test("appearance def clears custom-overlay CSS", () => {
      $id("opt-custom-css").value = "body { display:none }";
      applyPanelReset(panelDefaults.appearance, doc);
      if ($id("opt-custom-css").value !== "") throw new Error("custom CSS not cleared, got " + JSON.stringify($id("opt-custom-css").value));
    });

    await test("tags def resets tag-sort-by-pop to on", () => {
      $id("opt-tag-sort-by-pop").checked = false;
      applyPanelReset(panelDefaults.tags, doc);
      if (!$id("opt-tag-sort-by-pop").checked) throw new Error("tag-sort toggle not reset to on");
    });

    await test("K168: reset-authored whitelist ids resolve in the real PANEL_DEFAULTS fields/nested", () => {
      if (!Array.isArray(authoredIds) || !authoredIds.length) throw new Error("RESET_AUTHORED_IDS missing or empty");
      const known = new Set();
      for (const def of Object.values(panelDefaults)) {
        Object.keys(def.fields || {}).forEach((id) => known.add(id));
        Object.values(def.nested || {}).forEach((group) => {
          Object.keys(group).forEach((id) => known.add(id));
        });
      }
      const missing = authoredIds.filter((id) => !known.has(id));
      if (missing.length) throw new Error("whitelist id(s) not found in any panel's fields/nested: " + missing.join(", "));
    });

    await test("bootOptions(autoInit:false) honors removeEventListener after boot before runInit", async () => {
      let removedCount = 0, keptTargetOk = false;
      const onRemoved = () => { removedCount++; };
      const onKept = (ev) => { keptTargetOk = (ev && ev.target === deferred.doc); };
      const deferred = await pbpSwRealm.bootOptions({
        autoInit: false,
        beforeScripts(_win, _mock, d) {
          d.addEventListener("DOMContentLoaded", onRemoved);
          d.addEventListener("DOMContentLoaded", onKept);
        },
      });
      try {
        deferred.doc.removeEventListener("DOMContentLoaded", onRemoved);
        await deferred.runInit();
        if (removedCount !== 0) throw new Error("removed DOMContentLoaded listener ran " + removedCount + " time(s)");
        if (!keptTargetOk) throw new Error("kept DOMContentLoaded listener did not receive doc as event.target");
      } finally {
        deferred.dispose();
      }
    });
  } finally {
    realm.dispose();
    document.title = (failCount ? "FAIL" : "PASS") + " Options Reset Tests";
  }
})().catch((error) => {
  fail("Options Reset Tests bootstrap", error && error.message || String(error));
  document.title = "FAIL Options Reset Tests";
});
</script>
</body></html>
