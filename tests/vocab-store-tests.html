<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Vocabulary Store Tests</title>
<style>
body { font-family: monospace; padding: 16px; max-width: 1000px; }
.case { padding: 6px; border-bottom: 1px solid #eee; white-space: pre-wrap; }
.pass { color: #0a0; } .fail { color: #c00; font-weight: bold; }
</style></head><body>
<h1>Vocabulary Store Tests</h1><div id="summary"></div><div id="results"></div>
<script src="../vocab-store.js"></script>
<script>
const root = document.getElementById("results");
let pass = 0, fail = 0;
function check(name, cond, detail) {
  const ok = !!cond; ok ? pass++ : fail++;
  const row = document.createElement("div");
  row.className = "case " + (ok ? "pass" : "fail");
  row.textContent = `${ok ? "✓" : "✗"} ${name}${ok ? "" : "\\n   " + (detail || "")}`;
  root.appendChild(row);
}
function live(deviceId, counter, patch = {}, vector = { [deviceId]: counter }) {
  return {
    recordKey: "en|word", vector, dot: { deviceId, counter }, deleted: false,
    value: {
      term: "Word", lemma: "word", language: "en", gloss: "a word", ipa: null,
      sourceUrl: "https://example.test/word", license: "CC0", contexts: [], groups: [],
      note: "", status: "new", createdAt: 20, updatedAt: 30, ...patch
    }
  };
}
function tombstone(deviceId, counter, vector = { [deviceId]: counter }) {
  return { recordKey: "en|word", vector, dot: { deviceId, counter }, deleted: true };
}
function throws(fn) { try { fn(); return false; } catch (_) { return true; } }

check("equal vector", pbpVocabVectorRelation({ a: 1 }, { a: 1 }) === "equal");
check("remote dominates", pbpVocabVectorRelation({ a: 1 }, { a: 2 }) === "right");
check("local dominates", pbpVocabVectorRelation({ a: 2 }, { a: 1 }) === "left");
check("concurrent ignores inherited vector parts", pbpVocabVectorRelation({ a: 2 }, { b: 1 }) === "concurrent" && pbpVocabVectorRelation(JSON.parse('{"__proto__":1}'), { a: 1 }) === "concurrent");
check("zero negative fractional and unsafe counters reject", [0, -1, 1.5, Number.MAX_SAFE_INTEGER + 1].every((n) => throws(() => pbpVocabVectorRelation({ a: n }, { a: 1 }))));
check("dot sorts counter first", pbpVocabDotCompare({ deviceId: "z", counter: 1 }, { deviceId: "a", counter: 2 }) < 0);
check("dot uses NFC code-point deviceId ties", pbpVocabDotCompare({ deviceId: "\uE000", counter: 2 }, { deviceId: "\u{10000}", counter: 2 }) < 0 && throws(() => pbpVocabDotCompare({ deviceId: "e\u0301", counter: 2 }, { deviceId: "z", counter: 2 })));
check("groups union normalizes whitespace", pbpVocabMergeEvents(live("a", 2, { groups: [" English  "] }), live("b", 1, { groups: ["English", "French\tA"] })).event.value.groups.join(",") === "English,French A");
check("contexts union", pbpVocabMergeEvents(live("a", 2, { contexts: [{ articleUrl: "https://u1.test/", quote: "q1" }] }), live("b", 1, { contexts: [{ articleUrl: "https://u2.test/", quote: "q2" }] })).event.value.contexts.length === 2);
check("contexts dedupe articleUrl plus quote", pbpVocabMergeEvents(live("a", 2, { contexts: [{ articleUrl: "https://u1.test/", quote: "q1" }] }), live("b", 1, { contexts: [{ articleUrl: "https://u1.test/", quote: "q1" }] })).event.value.contexts.length === 1);
check("context articleUrl accepts only empty or normalized credential-free HTTP(S)", (() => {
  const context = (articleUrl) => live("a", 1, { contexts: [{ articleUrl, quote: "q" }] });
  return pbpVocabValidateEvent(context("")) &&
    pbpVocabValidateEvent(context("https://article.test/path")) &&
    !pbpVocabValidateEvent(context("https://article.test")) &&
    !pbpVocabValidateEvent(context("https://user:pass@article.test/")) &&
    !pbpVocabValidateEvent(context("javascript:alert(1)")) &&
    !pbpVocabValidateEvent(context("data:text/plain,private"));
})());
check("non-empty note beats higher-dot empty note", pbpVocabMergeEvents(live("a", 1, { note: "keep" }), live("b", 2, { note: "" })).event.value.note === "keep");
check("two notes use stable winner", pbpVocabMergeEvents(live("a", 1, { note: "local" }), live("b", 2, { note: "remote" })).event.value.note === "remote");
check("sourceUrl and license share winner", (() => { const m = pbpVocabMergeEvents(live("a", 1, { sourceUrl: "https://a.test/", license: "A" }), live("b", 2, { sourceUrl: "https://b.test/", license: "B" })); return m.event.value.sourceUrl === "https://b.test/" && m.event.value.license === "B"; })());
check("lemma gloss ipa and status use stable winner", (() => { const m = pbpVocabMergeEvents(live("a", 1), live("b", 2, { lemma: "remote", gloss: "remote gloss", ipa: "/r/", status: "known" })); return [m.event.value.lemma, m.event.value.gloss, m.event.value.ipa, m.event.value.status].join("|") === "remote|remote gloss|/r/|known"; })());
check("createdAt is minimum", pbpVocabMergeEvents(live("a", 2, { createdAt: 10 }), live("b", 1, { createdAt: 5 })).event.value.createdAt === 5);
check("updatedAt is maximum", pbpVocabMergeEvents(live("a", 2, { updatedAt: 10 }), live("b", 1, { updatedAt: 50 })).event.value.updatedAt === 50);
check("concurrent live beats higher-dot tombstone", (() => { const m = pbpVocabMergeEvents(live("a", 2), tombstone("b", 3)); return !m.event.deleted && m.event.dot.deviceId === "a"; })());
check("live-wins-delete emits notice", pbpVocabMergeEvents(live("a", 2), tombstone("b", 3)).notice === "delete-live-conflict");
check("tombstones merge with stable winner", (() => { const m = pbpVocabMergeEvents(tombstone("a", 2), tombstone("b", 3)); return m.kind === "merged" && m.event.deleted && m.event.dot.deviceId === "b" && m.event.vector.a === 2 && m.event.vector.b === 3; })());
check("equal vector with equal content is noop", pbpVocabMergeEvents(live("a", 2), live("a", 2)).kind === "noop");
check("corruption and untrusted fields reject", (() => {
  const owner = live("b", 1);
  const sync = live("b", 1);
  const unsafe = live("b", 1, { sourceUrl: "javascript:alert(1)" });
  const dot = live("b", 1);
  const blankTerm = live("b", 1, { term: "   " });
  const blankLanguage = live("b", 1, { language: "   " });
  const emptyTombstone = tombstone("b", 1);
  const noncanonicalTombstone = tombstone("b", 1);
  const pipeTerm = live("b", 1, { term: "A|B" });
  const sparseGroups = live("b", 1, { groups: new Array(1) });
  const sparseContexts = live("b", 1, { contexts: new Array(1) });
  owner.value.owner = "acct_a";
  sync.value.vector = { a: 1 };
  dot.dot.extra = true;
  blankTerm.recordKey = "en|";
  blankLanguage.recordKey = "|word";
  emptyTombstone.recordKey = "|";
  noncanonicalTombstone.recordKey = "EN|Word";
  pipeTerm.recordKey = "en|a|b";
  return pbpVocabMergeEvents(live("a", 2), live("a", 2, { gloss: "changed" })).kind === "corrupt" &&
    pbpVocabMergeEvents(live("a", 2), live("a", 2, { term: "word", lemma: "word" })).kind === "corrupt" &&
    !pbpVocabValidateEvent(owner) && !pbpVocabValidateEvent(sync) &&
    !pbpVocabValidateEvent(unsafe) && !pbpVocabValidateEvent(dot) &&
    !pbpVocabValidateEvent(blankTerm) && !pbpVocabValidateEvent(blankLanguage) &&
    !pbpVocabValidateEvent(emptyTombstone) && !pbpVocabValidateEvent(noncanonicalTombstone) &&
    !pbpVocabValidateEvent(sparseGroups) && !pbpVocabValidateEvent(sparseContexts) &&
    pbpVocabValidateEvent(pipeTerm);
})());
check("term mismatch rejects", (() => { const remote = live("b", 1, { term: "word", lemma: "word" }); return pbpVocabValidateEvent(remote) && pbpVocabMergeEvents(live("a", 2), remote).kind === "invalid"; })());
check("language and recordKey mismatch reject", (() => { const local = live("a", 2, { language: "en-US" }); const remote = live("b", 1, { language: "en-GB" }); return pbpVocabValidateEvent(local) && pbpVocabValidateEvent(remote) && pbpVocabMergeEvents(local, remote).kind === "invalid" && !pbpVocabValidateEvent(local, "en|other"); })());
check("cross-vector merge converges in both directions", (() => { const a = live("a", 2, {}, { a: 2, b: 5 }); const b = live("b", 4, {}, { a: 3, b: 4 }); const ab = pbpVocabMergeEvents(a, b); const ba = pbpVocabMergeEvents(b, a); return [ab, ba].every((m) => m.kind === "merged" && pbpVocabValidateEvent(m.event) && m.event.vector.a === 3 && m.event.vector.b === 5 && m.event.dot.deviceId === "b" && m.event.dot.counter === 4 && m.requeue) && pbpVocabEventContentEqual(ab.event, ba.event); })());

function idbReq(req) {
  return new Promise((resolve, reject) => {
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbTxDone(tx) {
  return new Promise((resolve, reject) => {
    tx.oncomplete = resolve;
    tx.onabort = tx.onerror = () => reject(tx.error || new Error("transaction failed"));
  });
}
async function closeVocabDb() {
  if (_pbpVocabDbPromise) {
    try { (await _pbpVocabDbPromise).close(); } catch (_) {}
  }
  _pbpVocabDbPromise = null;
}
async function deleteVocabDb() {
  await closeVocabDb();
  await new Promise((resolve) => {
    const req = indexedDB.deleteDatabase("pbp-vocab");
    req.onsuccess = req.onerror = req.onblocked = resolve;
  });
}
async function seedV1Word(word) {
  await deleteVocabDb();
  await new Promise((resolve, reject) => {
    const req = indexedDB.open("pbp-vocab", 1);
    req.onupgradeneeded = () => {
      const store = req.result.createObjectStore("words", { keyPath: "id" });
      store.createIndex("owner", "owner", { unique: false });
      store.createIndex("updatedAt", "updatedAt", { unique: false });
      store.put(word);
    };
    req.onsuccess = () => { req.result.close(); resolve(); };
    req.onerror = () => reject(req.error);
  });
}
async function syncGet(key) {
  const db = await _pbpVocabOpenDB();
  return (await idbReq(db.transaction("sync", "readonly").objectStore("sync").get(key))) || null;
}
async function storeRows(name) {
  const db = await _pbpVocabOpenDB();
  return await idbReq(db.transaction(name, "readonly").objectStore(name).getAll());
}
async function putLegacyWords(words) {
  const db = await _pbpVocabOpenDB();
  const tx = db.transaction("words", "readwrite");
  for (const word of words) tx.objectStore("words").put(word);
  await idbTxDone(tx);
}
function word(owner, term, patch = {}) {
  const language = patch.language || "en";
  const now = patch.updatedAt || 10;
  return {
    id: pbpDictVocabKey(owner, language, term), owner, term,
    lemma: null, language: pbpDictPrimaryLang(language), gloss: "", ipa: null,
    sourceUrl: null, license: null, contexts: [], groups: [], note: "",
    status: "new", createdAt: patch.createdAt || now, updatedAt: now, ...patch
  };
}
function remoteLive(recordKey, deviceId, counter, value, vector = { [deviceId]: counter }) {
  return { recordKey, vector, dot: { deviceId, counter }, deleted: false, value };
}
function eventValue(record, patch = {}) {
  return {
    term: record.term, lemma: record.lemma ?? null, language: record.language,
    gloss: record.gloss || "", ipa: record.ipa ?? null, sourceUrl: record.sourceUrl ?? null,
    license: record.license ?? null, contexts: record.contexts || [], groups: record.groups || [],
    note: record.note || "", status: record.status || "new", createdAt: record.createdAt,
    updatedAt: record.updatedAt, ...patch
  };
}
const OWNER_HASH_A = "a".repeat(64);
const OWNER_HASH_B = "b".repeat(64);
const OWNER_HASH_SEED = "c".repeat(64);
function batch(ownerHash, entries, deviceId = "remote-device") {
  return { schema: 1, ownerHash, deviceId, createdAt: 1, entries };
}

const task3Apis = [
  "pbpVocabGetAccountState", "pbpVocabPutAccountState", "pbpVocabListOutbox",
  "pbpVocabListPendingBatches", "pbpVocabFreezeOutbox", "pbpVocabDeletePendingBatch",
  "pbpVocabCheckpointOwner", "pbpVocabApplyRemotePage", "pbpVocabSeedLegacy",
  "pbpVocabImportRecords", "pbpVocabReadNotices"
];
const task3ApiReady = task3Apis.every((name) => typeof globalThis[name] === "function");
// Harness-only fallbacks keep all 20 cases observable during RED. They return
// impossible results and implement no persistence, merge, or mutation behavior.
for (const name of task3Apis) {
  if (typeof globalThis[name] === "function") continue;
  globalThis[name] = async () => name.includes("List") || name === "pbpVocabReadNotices"
    ? [] : (name === "pbpVocabSeedLegacy" || name === "pbpVocabImportRecords"
      ? { processed: 0 } : (name === "pbpVocabApplyRemotePage"
        ? { ok: false, error: "missing_api" } : null));
}
const task7PreflightApis = [
  "pbpVocabGetPreflightState", "pbpVocabPutPreflightState",
  "pbpVocabDeletePreflightState"
];
const task7PreflightReady = task7PreflightApis.every(
  (name) => typeof globalThis[name] === "function"
);
for (const name of task7PreflightApis) {
  if (typeof globalThis[name] === "function") continue;
  globalThis[name] = async () => name === "pbpVocabPutPreflightState" ? false : null;
}

async function runIdbChecks() {
  await deleteVocabDb();
  const firstIdentity = await pbpVocabGetSyncMeta();
  const secondIdentity = await pbpVocabGetSyncMeta();
  const persistedIdentity = await syncGet("meta");
  const corruptIdentity = { key: "meta", deviceId: "", counter: 7 };
  const corruptDb = await _pbpVocabOpenDB();
  const corruptTx = corruptDb.transaction("sync", "readwrite");
  corruptTx.objectStore("sync").put(corruptIdentity);
  await idbTxDone(corruptTx);
  const rejectedIdentity = await pbpVocabGetSyncMeta();
  const preservedCorruptIdentity = await syncGet("meta");
  check("sync identity is persistent and corrupt meta fails closed", firstIdentity &&
    firstIdentity.deviceId === secondIdentity?.deviceId &&
    firstIdentity.deviceId === persistedIdentity?.deviceId &&
    firstIdentity.counter === 0 && persistedIdentity.counter === 0 &&
    rejectedIdentity === null &&
    JSON.stringify(preservedCorruptIdentity) === JSON.stringify(corruptIdentity));

  const preflight = {
    key: `preflight:${OWNER_HASH_A}`, ownerHash: OWNER_HASH_A,
    retryAttempt: 2, retryAt: 123456, lastError: "network", blocked: false
  };
  const preflightPut = await pbpVocabPutPreflightState(preflight);
  const preflightRead = await pbpVocabGetPreflightState(OWNER_HASH_A);
  const invalidPreflightPut = await pbpVocabPutPreflightState({
    ...preflight, key: `preflight:${OWNER_HASH_B}`
  });
  const preflightPreserved = await pbpVocabGetPreflightState(OWNER_HASH_A);
  const preflightDeleted = await pbpVocabDeletePreflightState(OWNER_HASH_A);
  check("preflight state persists, validates, and deletes by owner hash",
    task7PreflightReady && preflightPut &&
    JSON.stringify(preflightRead) === JSON.stringify(preflight) &&
    invalidPreflightPut === false &&
    JSON.stringify(preflightPreserved) === JSON.stringify(preflight) &&
    preflightDeleted &&
    await pbpVocabGetPreflightState(OWNER_HASH_A) === null);
  const oversizedPreflight = {
    ...preflight, retryAttempt: 0, retryAt: null,
    lastError: "entry_too_large", blocked: true
  };
  const oversizedPreflightPut = await pbpVocabPutPreflightState(oversizedPreflight);
  const oversizedPreflightRead = await pbpVocabGetPreflightState(OWNER_HASH_A);
  check("entry-too-large preflight state remains actionable across restarts",
    oversizedPreflightPut &&
    JSON.stringify(oversizedPreflightRead) === JSON.stringify(oversizedPreflight));

  const legacy = word("acct_legacy", "Migrate", { gloss: "legacy", createdAt: 1, updatedAt: 1 });
  await seedV1Word(legacy);
  const migrated = await pbpVocabGet(legacy.id);
  const migratedSeed = await pbpVocabSeedLegacy("acct_legacy");
  check("v1 to v2 preserves a legacy word", task3ApiReady && migrated && migrated.gloss === "legacy" && migratedSeed.processed === 1 && (await _pbpVocabOpenDB()).version === 2);

  await deleteVocabDb();
  const first = await pbpVocabSaveWord("acct_a", { term: "Word", language: "en", gloss: "one" });
  const firstMeta = await syncGet("meta");
  await pbpVocabSaveWord("acct_a", { term: "Word", language: "en", gloss: "two" });
  const secondMeta = await syncGet("meta");
  const recordKey = "en|word";
  const recordMeta = await syncGet(`record:acct_a:${recordKey}`);
  check("first mutation creates a stable deviceId", task3ApiReady && first && firstMeta && firstMeta.deviceId === secondMeta.deviceId && /^[0-9a-f-]{36}$/i.test(firstMeta.deviceId) && Object.keys(firstMeta).sort().join(",") === "counter,deviceId,key");
  check("counter increments atomically", task3ApiReady && firstMeta.counter === 1 && secondMeta.counter === 2 && recordMeta.dot.counter === 2 && recordMeta.vector[firstMeta.deviceId] === 2);
  check("live record metadata is complete", task3ApiReady && recordMeta.owner === "acct_a" && recordMeta.recordKey === recordKey && recordMeta.deleted === false && recordMeta.key === `record:acct_a:${recordKey}`);
  const liveOutbox = await pbpVocabListOutbox("acct_a");
  const frozenBody = JSON.stringify(batch(OWNER_HASH_A, liveOutbox.map((row) => row.event), firstMeta.deviceId));
  const frozen = await pbpVocabFreezeOutbox("acct_a", "drive-a", OWNER_HASH_A, "file-a", {
    body: frozenBody,
    entries: [{ recordKey: "forged", deleted: true }]
  });
  await pbpVocabSaveWord("acct_a", { term: "Word", language: "en", gloss: "three" });
  const pending = await pbpVocabListPendingBatches("drive-a", OWNER_HASH_A);
  const afterFreezeMutation = await pbpVocabListOutbox("acct_a");
  const realOpenDb = _pbpVocabOpenDB;
  _pbpVocabOpenDB = async () => { throw new Error("forced idb read failure"); };
  const readFailures = await Promise.allSettled([
    pbpVocabGetAccountState("drive-a", OWNER_HASH_A),
    pbpVocabListOutbox("acct_a"),
    pbpVocabListPendingBatches("drive-a", OWNER_HASH_A),
    pbpVocabReadNotices("acct_a"),
    pbpVocabCheckpointOwner("acct_a")
  ]);
  _pbpVocabOpenDB = realOpenDb;
  const pendingDeleted = await pbpVocabDeletePendingBatch("drive-a", OWNER_HASH_A, "file-a");
  check("live outbox persists and freezes exactly", task3ApiReady && liveOutbox.length === 1 && !liveOutbox[0].event.deleted && frozen && frozen.body === frozenBody && pending.length === 1 && pending[0].body === frozenBody && afterFreezeMutation.length === 1 && afterFreezeMutation[0].event.value.gloss === "three" && pendingDeleted && (await pbpVocabListPendingBatches("drive-a", OWNER_HASH_A)).length === 0 && readFailures.every((result) => result.status === "rejected"));
  await pbpVocabSaveWord("acct_a", { term: "Word", language: "en", gloss: "four" });
  const coalesced = await pbpVocabListOutbox("acct_a");
  check("repeated same-word mutation coalesces outbox", task3ApiReady && coalesced.length === 1 && coalesced[0].event.value.gloss === "four");

  await pbpVocabDelete(first.id, "acct_a");
  const tombMeta = await syncGet(`record:acct_a:${recordKey}`);
  check("delete removes word but retains tombstone metadata", task3ApiReady && (await pbpVocabGet(first.id)) === null && tombMeta && tombMeta.deleted === true);
  const tombOutbox = await pbpVocabListOutbox("acct_a");
  check("delete writes a tombstone outbox", task3ApiReady && tombOutbox.length === 1 && tombOutbox[0].event.deleted === true && !Object.prototype.hasOwnProperty.call(tombOutbox[0].event, "value"));

  await deleteVocabDb();
  const groupWord = await pbpVocabSaveWord("acct_a", { term: "Group", language: "en" });
  await pbpVocabBatchAddGroup([groupWord.id], "acct_a", " Study  List ");
  const grouped = await pbpVocabGet(groupWord.id);
  const groupedMeta = await syncGet("record:acct_a:en|group");
  const groupedOutbox = await pbpVocabListOutbox("acct_a");
  await pbpVocabBatchAddGroup([groupWord.id], "acct_a", "Study List");
  const groupedAgainMeta = await syncGet("record:acct_a:en|group");
  const groupedAgainOutbox = await pbpVocabListOutbox("acct_a");
  check("add-group updates vector and outbox", task3ApiReady && grouped.groups.join(",") === "Study List" && groupedMeta.dot.counter === 2 && groupedOutbox[0].event.value.groups.join(",") === "Study List" && groupedAgainMeta.dot.counter === 2 && pbpVocabEventContentEqual(groupedOutbox[0].event, groupedAgainOutbox[0].event));

  await deleteVocabDb();
  const ungroupWord = await pbpVocabSaveWord("acct_a", { term: "Ungroup", language: "en" });
  await pbpVocabBatchAddGroup([ungroupWord.id], "acct_a", "Keep");
  await pbpVocabBatchAddGroup([ungroupWord.id], "acct_a", "Drop");
  const beforeRemoveMeta = await syncGet("record:acct_a:en|ungroup");
  await pbpVocabBatchRemoveGroup([ungroupWord.id], "acct_a", " Drop ");
  const ungrouped = await pbpVocabGet(ungroupWord.id);
  const ungroupedMeta = await syncGet("record:acct_a:en|ungroup");
  const ungroupedOutbox = await pbpVocabListOutbox("acct_a");
  // Normalization must match add's, or a group added as " Drop " could never be
  // removed by typing the same thing back.
  check("remove-group drops only the named group and syncs the edit",
    task3ApiReady && ungrouped.groups.join(",") === "Keep" &&
    ungroupedMeta.dot.counter === beforeRemoveMeta.dot.counter + 1 &&
    ungroupedOutbox.length === 1 && ungroupedOutbox[0].event.value.groups.join(",") === "Keep");
  const noopRemove = await pbpVocabBatchRemoveGroup([ungroupWord.id], "acct_a", "Drop");
  const noopMeta = await syncGet("record:acct_a:en|ungroup");
  check("removing a group the word does not have is a no-op, not a version bump",
    task3ApiReady && noopRemove === true && noopMeta.dot.counter === ungroupedMeta.dot.counter);
  await pbpVocabBatchRemoveGroup([ungroupWord.id], "acct_a", "Keep");
  const lastGroupGone = await pbpVocabGet(ungroupWord.id);
  check("removing the last group leaves the word, ungrouped",
    task3ApiReady && lastGroupGone !== null && lastGroupGone.groups.length === 0);

  await deleteVocabDb();
  const statusWord = await pbpVocabSaveWord("acct_a", { term: "Status", language: "en" });
  await pbpVocabBatchSetStatus([statusWord.id], "acct_a", "known");
  const knownRec = await pbpVocabGet(statusWord.id);
  const knownMeta = await syncGet("record:acct_a:en|status");
  const knownOutbox = await pbpVocabListOutbox("acct_a");
  check("set-status writes known through the synced edit path",
    task3ApiReady && knownRec.status === "known" && knownMeta.dot.counter === 2 &&
    knownOutbox[0].event.value.status === "known");
  const noopStatus = await pbpVocabBatchSetStatus([statusWord.id], "acct_a", "known");
  const noopStatusMeta = await syncGet("record:acct_a:en|status");
  check("setting the status a word already has is a no-op, not a version bump",
    task3ApiReady && noopStatus === true && noopStatusMeta.dot.counter === knownMeta.dot.counter);
  await pbpVocabBatchSetStatus([statusWord.id], "acct_a", "definitely-not-a-state");
  const clampedRec = await pbpVocabGet(statusWord.id);
  check("unknown status values clamp to new at the single write entrance",
    task3ApiReady && clampedRec.status === "new");
  await pbpVocabSetNote(statusWord.id, "acct_a", " why I saved this ");
  const noted = await pbpVocabGet(statusWord.id);
  const notedOutbox = await pbpVocabListOutbox("acct_a");
  check("set-note writes through the synced edit path, verbatim",
    task3ApiReady && noted.note === " why I saved this " &&
    notedOutbox[0].event.value.note === " why I saved this ");
  await pbpVocabSetNote(statusWord.id, "acct_a", "x".repeat(3000));
  const clampedNote = await pbpVocabGet(statusWord.id);
  check("note length clamps under the remote entry-size gate",
    task3ApiReady && clampedNote.note.length === 2000);

  await deleteVocabDb();
  const a = await pbpVocabSaveWord("acct_a", { term: "Alpha", language: "en" });
  const b = await pbpVocabSaveWord("acct_a", { term: "Beta", language: "en" });
  const foreign = await pbpVocabSaveWord("acct_b", { term: "Foreign", language: "en" });
  const beforeBatchWords = JSON.stringify(await storeRows("words"));
  const beforeBatchSync = JSON.stringify(await storeRows("sync"));
  const rejectedBatch = await pbpVocabBatchAddGroup([a.id, foreign.id], "acct_a", "Wrong");
  check("batch mutation is all-or-nothing", task3ApiReady && rejectedBatch === false && JSON.stringify(await storeRows("words")) === beforeBatchWords && JSON.stringify(await storeRows("sync")) === beforeBatchSync);
  await pbpVocabBatchAddGroup([a.id, b.id], "acct_a", "Batch");
  const aMeta = await syncGet("record:acct_a:en|alpha");
  const bMeta = await syncGet("record:acct_a:en|beta");
  const batchMeta = await syncGet("meta");
  check("each changed batch row gets a distinct counter", task3ApiReady && aMeta.dot.counter !== bMeta.dot.counter && Math.max(aMeta.dot.counter, bMeta.dot.counter) === batchMeta.counter && Math.min(aMeta.dot.counter, bMeta.dot.counter) === batchMeta.counter - 1);
  const beforeWrongWords = JSON.stringify(await storeRows("words"));
  const beforeWrongSync = JSON.stringify(await storeRows("sync"));
  const wrongOwner = await pbpVocabDelete(a.id, "acct_wrong");
  check("wrong owner changes neither words nor sync", task3ApiReady && wrongOwner === false && JSON.stringify(await storeRows("words")) === beforeWrongWords && JSON.stringify(await storeRows("sync")) === beforeWrongSync);

  // A selected row can vanish between selection and confirmation -- a Drive
  // pull applying a remote tombstone is the ordinary cause. It must not fail
  // the rest of the batch, while a foreign-owner row still must (above).
  const ghostId = "acct_a|en|ghost";
  const missingDelete = await pbpVocabBatchDelete([a.id, ghostId], "acct_a");
  const survivorKept = await pbpVocabGet(b.id);
  const missingGroup = await pbpVocabBatchAddGroup([b.id, ghostId], "acct_a", "Kept");
  const groupedSurvivor = await pbpVocabGet(b.id);
  check("a vanished row does not fail the rest of a batch",
    task3ApiReady && missingDelete === true && (await pbpVocabGet(a.id)) === null &&
    survivorKept !== null && missingGroup === true &&
    pbpVocabGroups(groupedSurvivor).includes("Kept"));

  await deleteVocabDb();
  const local = await pbpVocabSaveWord("acct_a", { term: "Word", language: "en", gloss: "local-1" });
  await pbpVocabSaveWord("acct_a", { term: "Word", language: "en", gloss: "local-2" });
  const localMeta = await syncGet("record:acct_a:en|word");
  const localDevice = localMeta && localMeta.dot ? localMeta.dot.deviceId : "local-device";
  const unseeded = word("acct_a", "Unseeded", { gloss: "must-survive" });
  await putLegacyWords([unseeded]);
  const unseededRemote = { recordKey: "en|unseeded", vector: { "remote-device": 1 }, dot: { deviceId: "remote-device", counter: 1 }, deleted: true };
  const unseededResult = await pbpVocabApplyRemotePage("acct_a", OWNER_HASH_A, [batch(OWNER_HASH_A, [unseededRemote])], null);
  check("an unseeded local row is a local store fault, not remote corruption",
    task3ApiReady && unseededResult.error === "local_store");

  // Both swallow sites fold unrelated causes into one code: a wrong owner, a
  // corrupt record or an exhausted quota all leave the caller with the same
  // answer, and local_store additionally blocks Drive sync until a forced run.
  // The console trace is the only place the cause survives.
  const warned = [];
  const realWarn = console.warn;
  let blockedMutation;
  let blockedApply;
  console.warn = (...args) => { warned.push(args.map((value) => String(value)).join(" ")); };
  try {
    blockedMutation = await pbpVocabDelete(local.id, "acct_wrong");
    blockedApply = await pbpVocabApplyRemotePage("acct_a", OWNER_HASH_A,
      [batch(OWNER_HASH_A, [unseededRemote])], null);
  } finally {
    console.warn = realWarn;
  }
  check("swallowed store faults leave a console trace",
    task3ApiReady && blockedMutation === false && blockedApply.error === "local_store" &&
    warned.length === 2 &&
    warned.every((line) => line.startsWith("[vocab-store] ") && line.includes("Error")) &&
    warned.some((line) => line.includes("owner mismatch")) &&
    warned.some((line) => line.includes("unseeded local record")) &&
    !warned.some((line) => line.includes("must-survive") || line.includes("local-2")));
  const dominated = remoteLive("en|word", localDevice, 1, eventValue(local, { gloss: "old-remote" }));
  const cursor = { key: `account:drive-a:${OWNER_HASH_A}`, drivePermissionId: "drive-a", ownerHash: OWNER_HASH_A, pageToken: "next-1" };
  await pbpVocabPutAccountState({ ...cursor, pageToken: "before" });
  const dominatedResult = await pbpVocabApplyRemotePage("acct_a", OWNER_HASH_A, [batch(OWNER_HASH_A, [dominated])], cursor);
  const account = await pbpVocabGetAccountState("drive-a", OWNER_HASH_A);
  check("remote dominated event is ignored", task3ApiReady && !unseededResult.ok && (await pbpVocabGet(unseeded.id)).gloss === "must-survive" && !(await syncGet("record:acct_a:en|unseeded")) && dominatedResult.ok && (await pbpVocabGet(local.id)).gloss === "local-2" && account.pageToken === "next-1");

  const dominating = remoteLive("en|word", localDevice, 3, eventValue(local, { gloss: "remote-step-1", updatedAt: 98 }));
  const dominatingSecond = remoteLive("en|word", localDevice, 4, eventValue(local, { gloss: "remote-step-2", updatedAt: 99 }));
  const regional = remoteLive("en|regional", "regional-device", 1,
    eventValue(local, { term: " Regional ", language: "en-US", gloss: "regional", groups: [" Study  List "] }));
  const dominatingResult = await pbpVocabApplyRemotePage("acct_a", OWNER_HASH_A, [batch(OWNER_HASH_A, [dominating, dominatingSecond, regional])], null);
  const regionalReplay = await pbpVocabApplyRemotePage("acct_a", OWNER_HASH_A, [batch(OWNER_HASH_A, [regional])], null);
  const dominatingMeta = await syncGet("record:acct_a:en|word");
  check("remote dominating live event writes the word", task3ApiReady && dominatingResult.ok && regionalReplay.ok && regionalReplay.ignored === 1 && (await pbpVocabGet(local.id)).gloss === "remote-step-2" && dominatingMeta.vector[localDevice] === 4);

  const concurrentDelete = { recordKey: "en|word", vector: { "remote-device": 1 }, dot: { deviceId: "remote-device", counter: 1 }, deleted: true };
  const concurrentResult = await pbpVocabApplyRemotePage("acct_a", OWNER_HASH_A, [batch(OWNER_HASH_A, [concurrentDelete])], null);
  const converged = await pbpVocabListOutbox("acct_a");
  const notices = await pbpVocabReadNotices("acct_a");
  check("concurrent merge writes a converged outbox", task3ApiReady && concurrentResult.ok && converged.length === 1 && pbpVocabValidateEvent(converged[0].event) && converged[0].event.vector["remote-device"] === 1 && notices.length === 1);

  const rollbackOne = await pbpVocabSaveWord("acct_a", { term: "Rollback One", language: "en", gloss: "keep-one" });
  const rollbackTwo = await pbpVocabSaveWord("acct_a", { term: "Rollback Two", language: "en", gloss: "keep-two" });
  const rollbackTwoMeta = await syncGet("record:acct_a:en|rollback two");
  const rollbackFirst = { recordKey: "en|rollback one", vector: { "rollback-remote": 1 }, dot: { deviceId: "rollback-remote", counter: 1 }, deleted: true };
  const corrupt = remoteLive("en|rollback two", rollbackTwoMeta.dot.deviceId, rollbackTwoMeta.dot.counter,
    eventValue(rollbackTwo, { gloss: "private rollback gloss", sourceUrl: "https://secret.test/" }),
    rollbackTwoMeta.vector);
  const wordsBeforeCorrupt = JSON.stringify(await storeRows("words"));
  const syncBeforeCorrupt = JSON.stringify(await storeRows("sync"));
  const corruptResult = await pbpVocabApplyRemotePage("acct_a", OWNER_HASH_A, [batch(OWNER_HASH_A, [rollbackFirst, corrupt])], { ...cursor, pageToken: "must-not-commit" });
  const wrongOwnerResult = await pbpVocabApplyRemotePage("acct_a", OWNER_HASH_A, [batch(OWNER_HASH_B, [dominatingSecond])], null);
  const invalidExpectedResult = await pbpVocabApplyRemotePage("acct_a", "not-a-hash", [batch("not-a-hash", [dominatingSecond])], null);
  const extraFieldResult = await pbpVocabApplyRemotePage("acct_a", OWNER_HASH_A, [{ ...batch(OWNER_HASH_A, [dominatingSecond]), token: "must-reject" }], null);
  check("corrupt remote event commits nothing", task3ApiReady && rollbackOne && !corruptResult.ok && !wrongOwnerResult.ok && !invalidExpectedResult.ok && !extraFieldResult.ok && JSON.stringify(await storeRows("words")) === wordsBeforeCorrupt && JSON.stringify(await storeRows("sync")) === syncBeforeCorrupt);
  const safeError = JSON.stringify(corruptResult);
  check("corrupt remote event returns a file-safe error", task3ApiReady && corruptResult.error === "invalid_remote_page" && !/Rollback Two|private rollback gloss|secret\.test/i.test(safeError));

  await deleteVocabDb();
  const legacyRows = Array.from({ length: 105 }, (_, i) => word("acct_seed", `Seed ${i}`, { createdAt: i + 1, updatedAt: i + 1 }));
  await putLegacyWords(legacyRows);
  const seededFirst = await pbpVocabSeedLegacy("acct_seed");
  check("legacy seed processes at most 100 rows per call", task3ApiReady && seededFirst.processed === 100 && (await pbpVocabListOutbox("acct_seed")).length === 100 && (await storeRows("words")).length === 105);
  const seededSecond = await pbpVocabSeedLegacy("acct_seed");
  const seededThird = await pbpVocabSeedLegacy("acct_seed");
  const seedOutbox = await pbpVocabListOutbox("acct_seed");
  const seedBody = JSON.stringify(batch(OWNER_HASH_SEED, seedOutbox.map((row) => row.event), (await syncGet("meta")).deviceId));
  await pbpVocabFreezeOutbox("acct_seed", "drive-seed", OWNER_HASH_SEED, "seed-file", { body: seedBody });
  await pbpVocabDeletePendingBatch("drive-seed", OWNER_HASH_SEED, "seed-file");
  const checkpointed = await pbpVocabCheckpointOwner("acct_seed");
  check("legacy seed is safely resumable", task3ApiReady && seededSecond.processed === 5 && seededThird.processed === 0 && (await syncGet("meta")).counter === 105 && checkpointed === 105 && (await pbpVocabListOutbox("acct_seed")).length === 105);

  await deleteVocabDb();
  const existingImport = await pbpVocabSaveWord("acct_import", { term: "Case Term", language: "en", gloss: "local" });
  const reviveImport = await pbpVocabSaveWord("acct_import", { term: "Revive", language: "fr", gloss: "old" });
  await pbpVocabDelete(reviveImport.id, "acct_import");
  const badImportWords = JSON.stringify(await storeRows("words"));
  const badImportSync = JSON.stringify(await storeRows("sync"));
  const rejectedImport = await pbpVocabImportRecords("acct_import", [
    word("acct_import", "Must Not Commit"),
    word("acct_other", "Wrong Owner")
  ]);
  const rejectedNoWrite = JSON.stringify(await storeRows("words")) === badImportWords &&
    JSON.stringify(await storeRows("sync")) === badImportSync;
  const blankRejectedImport = await pbpVocabImportRecords("acct_import", [
    word("acct_import", "Valid But Atomic"),
    word("acct_import", "   ", { language: "en" }),
    word("acct_import", "Blank Language", { language: "   " })
  ]);
  const blankRejectedNoWrite = JSON.stringify(await storeRows("words")) === badImportWords &&
    JSON.stringify(await storeRows("sync")) === badImportSync;
  let dirtyCalls = 0;
  const priorChrome = globalThis.chrome;
  globalThis.chrome = { runtime: { sendMessage: () => { dirtyCalls++; return Promise.reject(new Error("worker asleep")); } } };
  const exactImport = word("acct_import", " Imported Exact ", {
    language: "en-US", gloss: "exact", createdAt: 0, updatedAt: 1
  });
  const existingIncoming = {
    ...word("acct_import", "case term", { language: "en-US", gloss: "incoming", createdAt: 5, updatedAt: 20 }),
    id: existingImport.id
  };
  const reviveIncoming = {
    ...word("acct_import", "Revive", { language: "fr-FR", gloss: "revived", createdAt: 2, updatedAt: 20 }),
    id: reviveImport.id
  };
  const importedRows = [exactImport, existingIncoming, reviveIncoming];
  const imported = await pbpVocabImportRecords("acct_import", importedRows);
  const exactAgain = { ...exactImport, createdAt: 10, updatedAt: 30 };
  const importedAgain = await pbpVocabImportRecords("acct_import", [exactAgain]);
  globalThis.chrome = priorChrome;
  const importOutbox = await pbpVocabListOutbox("acct_import");
  const exactStored = await pbpVocabGet(exactImport.id);
  const existingStored = await pbpVocabGet(existingImport.id);
  const revivedStored = await pbpVocabGet(reviveImport.id);
  const revivedMeta = await syncGet("record:acct_import:fr|revive");
  check("imported records use the local mutation and outbox path", task3ApiReady && !rejectedImport.ok && rejectedNoWrite && !blankRejectedImport.ok && blankRejectedNoWrite && imported.processed === 3 && importedAgain.processed === 1 && exactStored.term === " Imported Exact " && exactStored.language === "en-US" && exactStored.createdAt === 0 && existingStored.term === "Case Term" && existingStored.language === "en" && existingStored.id === existingImport.id && revivedStored.gloss === "revived" && revivedMeta.deleted === false && importOutbox.length === 3 && dirtyCalls === 2);

  // K161: restoring a backup this device already holds must be a zero-write.
  // Every "changed" import row bumps meta.counter, rewrites record: metadata,
  // drops an outbox event and wakes the Drive sync -- so an unconditional
  // changed:true turned "import one setting back" into "re-upload the whole
  // vocabulary", with the file's copy dominating every other device.
  await deleteVocabDb();
  const priorNoopChrome = globalThis.chrome;
  let noopDirty = 0;
  globalThis.chrome = { runtime: { sendMessage: () => { noopDirty++; return Promise.reject(new Error("worker asleep")); } } };
  const noopKeys = ["en|alpha", "en|beta", "en|gamma"];
  const noopRows = [
    word("acct_noop", "Alpha", { gloss: "a", note: "first", createdAt: 1, updatedAt: 2, groups: ["List"], contexts: [{ articleUrl: "https://noop.test/", quote: "q" }] }),
    word("acct_noop", "Beta", { gloss: "b", createdAt: 1, updatedAt: 2 }),
    word("acct_noop", "Gamma", { gloss: "c", createdAt: 1, updatedAt: 2 })
  ];
  const noopSnapshot = async () => await Promise.all(noopKeys.map(async (key) => JSON.stringify([
    await syncGet(`record:acct_noop:${key}`), await syncGet(`outbox:acct_noop:${key}`)
  ])));
  const noopFirst = await pbpVocabImportRecords("acct_noop", noopRows.map((row) => ({ ...row })));
  const beforeRepeat = await noopSnapshot();
  const counterBeforeRepeat = (await syncGet("meta")).counter;
  const dirtyBeforeRepeat = noopDirty;
  const noopSecond = await pbpVocabImportRecords("acct_noop", noopRows.map((row) => ({ ...row })));
  const afterRepeat = await noopSnapshot();
  check("re-importing an unchanged backup writes nothing",
    task3ApiReady && noopFirst.ok && noopFirst.processed === 3 && noopFirst.written === 3 &&
    noopSecond.ok && noopSecond.processed === 3 && noopSecond.written === 0 &&
    afterRepeat.join("␀") === beforeRepeat.join("␀") &&
    (await syncGet("meta")).counter === counterBeforeRepeat && noopDirty === dirtyBeforeRepeat &&
    (await pbpVocabListOutbox("acct_noop")).length === 3);

  // The assertion that actually pins the empty write: a batch that legitimately
  // writes one record must leave its untouched siblings byte-identical. Only
  // checking "the whole second import wrote nothing" would also pass if the
  // importer had stopped writing altogether.
  const mixedBefore = await noopSnapshot();
  const mixedRows = noopRows.map((row, index) => index === 1 ? { ...row, note: "edited" } : { ...row });
  const noopMixed = await pbpVocabImportRecords("acct_noop", mixedRows);
  const mixedAfter = await noopSnapshot();
  const mixedStored = await pbpVocabGet(noopRows[1].id);
  check("a mixed import batch writes only the record that changed",
    task3ApiReady && noopMixed.ok && noopMixed.processed === 3 && noopMixed.written === 1 &&
    mixedAfter[0] === mixedBefore[0] && mixedAfter[2] === mixedBefore[2] &&
    mixedAfter[1] !== mixedBefore[1] && mixedStored.note === "edited" &&
    (await pbpVocabListOutbox("acct_noop")).length === 3 &&
    (await syncGet("meta")).counter === counterBeforeRepeat + 1);

  const freshRow = word("acct_noop", "Delta", { gloss: "d", createdAt: 1, updatedAt: 2 });
  const noopFresh = await pbpVocabImportRecords("acct_noop", [freshRow]);
  const freshOutbox = (await pbpVocabListOutbox("acct_noop")).find((row) => row.recordKey === "en|delta");
  const freshMeta = await syncGet("record:acct_noop:en|delta");
  globalThis.chrome = priorNoopChrome;
  check("a record this device has never seen still writes",
    task3ApiReady && noopFresh.ok && noopFresh.processed === 1 && noopFresh.written === 1 &&
    !!freshOutbox && freshOutbox.event.deleted === false && freshOutbox.event.value.gloss === "d" &&
    !!freshMeta && freshMeta.deleted === false);

  await deleteVocabDb();
}

(async () => {
  try {
    await runIdbChecks();
  } catch (error) {
    while (pass + fail < 46) check("IDB harness completed", false, error && (error.stack || error.message));
  }
  document.getElementById("summary").textContent = `pass=${pass} fail=${fail}`;
})();
</script></body></html>
