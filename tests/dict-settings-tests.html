<!doctype html><meta charset="utf-8"><title>Dictionary settings and authentication integration</title>
<div id="results"></div><div id="summary"></div>
<div id="vocab-ref"><div id="vocab-ref-result"><div class="vocab-ref-head"></div><div class="xp-dict-slot"><div id="fixture-local"></div><div id="fixture-online"></div></div></div></div>
<script>
// Storage-shaped input is handwritten, not generated by obfuscateKey. The
// production routing, decoding, caller, dictionary runner and HTTP headers run.
const STORED_KEY='obf:Zml4dHVyZS1rZXk=', ROTATED_KEY='obf:cm90YXRlZC1rZXk=';
let localData={},syncData={},headers=[],expectedKey='fixture-key',listeners=new Set();
function area(data){return {
  get:async query=>{const source=data();if(query==null)return structuredClone(source);if(typeof query==='string')return {[query]:source[query]};
    if(Array.isArray(query))return Object.fromEntries(query.filter(key=>Object.hasOwn(source,key)).map(key=>[key,source[key]]));
    return structuredClone({...query,...Object.fromEntries(Object.keys(query).filter(key=>Object.hasOwn(source,key)).map(key=>[key,source[key]]))});},
  set:async value=>Object.assign(data(),structuredClone(value)),remove:async keys=>{for(const key of [].concat(keys))delete data()[key];}
};}
globalThis.chrome={runtime:{id:'isolated-fixture',onMessage:{addListener(){},removeListener(){}},sendMessage:async()=>({ok:true,connected:false})},
  permissions:{contains:async()=>true,request:async()=>true},storage:{local:area(()=>localData),sync:area(()=>syncData),
    onChanged:{addListener:fn=>listeners.add(fn),removeListener:fn=>listeners.delete(fn)}},i18n:{getUILanguage:()=> 'en'}};
function t(key){return key;}
function uiLangToBCP47(){return 'en';}
</script>
<script src="../shared.js"></script><script src="../vocab-store.js"></script><script src="../ai.js"></script><script src="../md-ai-core.js"></script>
<script src="../md-dict.js"></script><script src="../dict-entry.js"></script><script src="../library-vocab.js"></script>
<script>
let pass=0,fail=0,controllers=[];
const baselineListeners=new Set(listeners);
async function pbpVocabCurrentOwner(){return 'ownerless';}
async function pbpAiCacheGet(){return null;}
async function pbpAiCacheSet(){return true;}
async function pbpDictEvidenceFetch(){return [];}
// Ordinary dictionary/vocabulary display is unrelated to API authentication.
_pbpDictPackSide=async()=>{};_pbpDictEcdictSide=async()=>{};_pbpDictCedictSide=async()=>{};
_pbpVocabSyncDictPronunciation=()=>{};_pbpVocabSelectLookupDefault=()=>{};
_pbpVocabAcceptLookupResult=()=>{};
globalThis.fetch=async(_url,init)=>{
  headers.push(new Headers(init.headers).get('Authorization'));
  if(headers.at(-1)!=='Bearer '+expectedKey)return new Response('{"error":{"message":"Invalid fixture credentials"}}',{status:401});
  // Dictionary generation streams (plan 2.7): a handwritten OpenAI-compatible
  // chat.completion.chunk stream (content chunk, separate finish chunk, [DONE]).
  const chunk=(delta,finish)=>'data: '+JSON.stringify({id:'chatcmpl-fixture',object:'chat.completion.chunk',created:0,model:'arbitrary-model',choices:[{index:0,delta,finish_reason:finish}]})+'\n\n';
  return new Response(chunk({role:'assistant',content:'{"word":"provider","language":"en","pronunciation":"","meanings":[{"partOfSpeech":"noun","definition":"One who provides.","examples":[]}],"learning":{"version":2,"formation":"","history":"","related":[]}}'},null)+
    chunk({},'stop')+'data: [DONE]\n\n',{status:200,headers:{'Content-Type':'text/event-stream'}});
};
function reset(mode){
  controllers.forEach(ctrl=>ctrl.abort());controllers=[];listeners=new Set(baselineListeners);
  _pbpAiSettingsPromise=null;_settingsStorageCache=null;_pbpDictCurrent=null;headers=[];expectedKey='fixture-key';
  const config={aiProvider:'custom',customBaseUrl:'https://example.test/v1',customModel:'arbitrary-model',customApiKey:STORED_KEY,
    previewAiEnabled:true,dictDefaultView:'dictionary',dictDefinitionLang:'English',syncApiKeys:mode==='sync-keys'};
  localData={optSyncEnabled:mode!=='local',syncApiKeys:mode==='sync-keys'};syncData={syncApiKeys:mode==='sync-keys'};
  Object.assign(mode==='local'?localData:syncData,config);
  if(mode==='local-keys'){localData.customApiKey=STORED_KEY;syncData.customApiKey='obf:c3RhbGUta2V5';}
  document.querySelectorAll('.xp-dict-ai,.xp-dict-ai-controls').forEach(el=>el.remove());
}
async function waitFor(fn){for(let i=0;i<100;i++){if(fn())return;await new Promise(r=>setTimeout(r,5));}throw new Error('UI did not settle');}
function assert(value,message){if(!value)throw new Error(message||'Assertion failed');}
function storageKey(mode){return mode==='sync-keys'?syncData:localData;}
async function mount(surface){
  const host=document.getElementById('vocab-ref-result');const ctrl=new AbortController();controllers.push(ctrl);
  if(surface==='library'){
    _vocabCurrentOwner='ownerless';_pbpVocabDictCtrl=ctrl;
    _pbpVocabDictRun('provider','en',{localEl:document.getElementById('fixture-local'),onlineEl:document.getElementById('fixture-online')},'',()=>{}, {online:false});
  }else{
    await _pbpDictEntryMount(host,{term:'provider',lang:'en',owner:'ownerless',signal:ctrl.signal,isCurrent:()=>true,
      settings:pbpAiGetSettings(),onSettingsChange:next=>{refreshed=next;}}).ready;
  }
  await waitFor(()=>host.querySelector('.xp-dict-ai-generate')?.disabled===false);return host;
}
async function generate(host){const before=headers.length;host.querySelector('.xp-dict-ai-generate').click();
  await waitFor(()=>headers.length>before);await waitFor(()=>!host.querySelector('.xp-dict-ai-generate').disabled);
  assert(headers.at(-1)==='Bearer '+expectedKey,'HTTP authentication did not use decoded routed credentials');
  assert(host.querySelector('.xp-dict-ai-content').textContent.includes('One who provides.'),'Generated entry was not rendered');
}
let refreshed=null;
async function test(name,fn){try{await fn();pass++;const row=document.createElement('p');row.className='pass';row.textContent='PASS '+name;document.getElementById('results').append(row);}catch(error){fail++;const row=document.createElement('p');row.className='fail';row.textContent='FAIL '+name+': '+error.message;document.getElementById('results').append(row);}finally{controllers.forEach(ctrl=>ctrl.abort());}}
(async()=>{
  for(const mode of ['local','local-keys','sync-keys'])for(const surface of ['library','reader'])await test(surface+' uses routed decoded credentials: '+mode,async()=>{
    reset(mode);const host=await mount(surface);await generate(host);
    assert(storageKey(mode).customApiKey===STORED_KEY,'Reading rewrote stored credentials');assert(headers.length===1,'Generation retried authentication');
  });
  for(const mode of ['local-keys','sync-keys'])await test('settings refresh decodes a rotated credential before rebuilding the reader: '+mode,async()=>{
    reset(mode);refreshed=null;await mount('reader');expectedKey='rotated-key';storageKey(mode).customApiKey=ROTATED_KEY;
    for(const listener of [...listeners])listener({customApiKey:{oldValue:STORED_KEY,newValue:ROTATED_KEY}},mode==='sync-keys'?'sync':'local');
    await waitFor(()=>refreshed!==null);assert(refreshed.customApiKey===expectedKey,'Refresh forwarded a storage-encoded credential');
    assert(storageKey(mode).customApiKey===ROTATED_KEY,'Refresh rewrote the stored credential');
    const ctrl=new AbortController();controllers.push(ctrl);const host=document.createElement('div');document.body.append(host);
    try{await _pbpDictEntryMount(host,{term:'provider',lang:'en',owner:'ownerless',signal:ctrl.signal,isCurrent:()=>true,settings:refreshed}).ready;await generate(host);}finally{host.remove();}
  });
  document.getElementById('summary').textContent=pass+' passed, '+fail+' failed';
})();
</script>
