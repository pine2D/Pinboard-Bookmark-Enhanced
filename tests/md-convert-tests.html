    ["site-rule payload incl. math/forum flags", 'title: hit.title || document.title, url: location.href, math: !!hit.math, forum: !!hit.forum'],
    ["MathML-derived math flag on Defuddle path", 'math: !!document.querySelector("math")'],
    ["Defuddle metadata forwarding", 'author: result.author || "", published: result.published || "", site: result.site || "", image: result.image || ""'],
  ];
  // ai.js's getPageInfoFromTab is the third extraction surface (AI tags/
  // summary + batch save): it must keep injecting site-rules.js and trying
  // applySiteRule before Defuddle.
  const AI_INV = [
    ["site-rules.js injection wired", 'files: ["site-rules.js"]'],
    ["site-rule dispatch wired", 'applySiteRule(document, location.href)'],
    ["hit flattened via pbpSiteRuleText", 'pbpSiteRuleText(hit.contentHtml)'],
  ];
  let pj = "", bj = "", aj = "";
  try {
    pj = await (await fetch("../popup.js")).text();
    bj = await (await fetch("../background.js")).text();
    aj = await (await fetch("../ai.js")).text();
  } catch (_) {}
  if (!pj || !bj || !aj) {
    for (const [label] of [...INV, ...AI_INV]) {
      const div = document.createElement("div");
      div.className = "case skip";
      div.textContent = "○  mirror invariant: " + label + " (file:// — fetch unavailable)";
      root.appendChild(div);
    }
  } else {
    for (const [label, needle] of INV) {
      check("mirror invariant in BOTH extractors: " + label,
        pj.indexOf(needle) !== -1 && bj.indexOf(needle) !== -1, needle);
    }
    for (const [label, needle] of AI_INV) {
      check("AI-path invariant in ai.js: " + label, aj.indexOf(needle) !== -1, needle);
    }
  }
})();

section("site-rules: pbpSiteRuleText (AI-path flatten)");
(() => {
  check("pbpSiteRuleText → <br> becomes a line break, spans not glued",
    pbpSiteRuleText('<span>Line one</span><br><span>Line two</span>') === "Line one\nLine two",
    JSON.stringify(pbpSiteRuleText('<span>Line one</span><br><span>Line two</span>')));
  check("pbpSiteRuleText → block closers break, runs collapse",
    pbpSiteRuleText('<h2>头</h2><p>a</p><blockquote><p>b</p></blockquote><p></p><p></p><p>c</p>').indexOf("头\na\nb") === 0,
    JSON.stringify(pbpSiteRuleText('<h2>头</h2><p>a</p><blockquote><p>b</p></blockquote><p></p><p></p><p>c</p>')));
  check("pbpSiteRuleText → table cells not glued",
    /1\n\s*2/.test(pbpSiteRuleText('<table><tr><td>1</td><td>2</td></tr></table>')),
    JSON.stringify(pbpSiteRuleText('<table><tr><td>1</td><td>2</td></tr></table>')));
})();

// Extraction must never DOWNLOAD the page's images. A scratch <div> created
// from the LIVE page document is not enough: "update the image data" only
// suspends for a node document that is NOT fully active, so a detached-but-live
// div fetches every <img> it holds -- and fixLazyImages promotes
// data-original/data-actualsrc/data-src onto src first, so even images the user
// never scrolled to get pulled. The ai.js AI-tags/summary/batch-save path then
// throws every one of those bytes away (it reads text only). site-rules.js
// therefore parses into a document.implementation.createHTMLDocument("").
// Observation channel: Resource Timing, which only records subresources over
// http(s) -- the .qa-scan runner serves this page, so the control row below is
// the live-channel proof there; opened directly over file:// it is exempted and
// the two probe rows pass vacuously.
window._pbpInertDocDone = (async () => {
  section("site-rules: extraction parses into an INERT document (no image downloads)");
  const abs = (q) => new URL("../icons/pin-default-16.png?pbp-probe=" + q, location.href).href;
  const probeText = abs("site-rule-text");
  const probeClean = abs("clean-body-html");
  const probeControl = abs("control");

  // 1) pbpSiteRuleText: the ai.js flatten path, called exactly as ai.js does.
  const flat = pbpSiteRuleText('<p>hello</p><img src="' + probeText + '">');

  // 2) cleanBodyHtml, reached through applySiteRule with the LIVE document --
  //    the runtime shape (ai.js / popup.js / background.js all pass `document`).
  //    The fixture carries NO src, only data-original, so the live DOM itself
  //    requests nothing: any request can only come from the src promotion that
  //    happens inside the extraction scratch node.
  const fixture = document.createElement("div");
  fixture.className = "Post-RichText";
  fixture.innerHTML = '<p>body</p><img data-original="' + probeClean + '">';
  document.body.appendChild(fixture);
  let hit = null;
  try { hit = applySiteRule(document, "https://zhuanlan.zhihu.com/p/1"); }
  finally { fixture.remove(); }

  // 3b) composeStyledHtml (Copy HTML / Download .html): its hljs and KaTeX
  //    passes each re-parse the WHOLE article into a scratch div. On the live
  //    document those copies fetched every remote <img> in the piece -- eagerly,
  //    unlike the preview's own loading="lazy" originals -- and discarded the
  //    bytes. Both passes are armed here (highlight.min.js and katex are loaded
  //    above, and the fixture carries a fenced block plus opts.math).
  const probeExport = abs("compose-styled-html");
  const styled = composeStyledHtml(
    "![x](" + probeExport + ")\n\n```js\nvar a = 1;\n```\n\n$x^2$\n",
    { title: "probe" }, { math: true });

  // 4) Control: the same markup through a live-document div, so a green probe
  //    row can never mean "Resource Timing saw nothing at all here".
  const control = document.createElement("div");
  control.innerHTML = '<img src="' + probeControl + '">';

  const seen = (u) => performance.getEntriesByName(u).length > 0;
  const deadline = Date.now() + 3000;
  while (!seen(probeControl) && Date.now() < deadline) await new Promise((r) => setTimeout(r, 50));
  await new Promise((r) => setTimeout(r, 200)); // settle: probes 1-2 were issued BEFORE the control
  check("control: a live-document div DOES fetch its <img> (probe channel is live)",
    seen(probeControl) || location.protocol === "file:", "no resource-timing entry for " + probeControl);
  check("pbpSiteRuleText downloads no <img> while flattening to text",
    !seen(probeText) && flat === "hello", JSON.stringify(flat));
  check("cleanBodyHtml downloads no promoted lazy <img> during extraction",
    !seen(probeClean), "requested " + probeClean);
  check("...and the lazy src is still promoted in the extracted HTML",
    !!hit && hit.contentHtml.indexOf('src="' + probeClean + '"') !== -1,
    hit ? hit.contentHtml : "no site-rule hit");
  check("composeStyledHtml downloads no <img> while re-parsing the article",
    !seen(probeExport) && styled.indexOf(probeExport) !== -1,
    seen(probeExport) ? "requested " + probeExport : "probe url missing from the export");
})();

section("site-rules: v2ex buildReplyTree multi-@ (pure)");
(() => {
  // Multiple @-mentions: the LAST mentioned member is the primary parent
  // (arrays reversed); an unresolvable name falls through to the next.
  const replies = [
    { id: "r1", author: "alice", floor: "1", mentions: [], refFloors: [], bodyHtml: "a", thanks: 0 },
    { id: "r2", author: "bob",   floor: "2", mentions: [], refFloors: [], bodyHtml: "b", thanks: 0 },
    { id: "r3", author: "carol", floor: "3", mentions: ["alice", "bob"], refFloors: ["1", "2"], bodyHtml: "c", thanks: 0 },
    // mentions [alice, ghost] reverse to [ghost, alice]: ghost (never replied)
    // must be TRIED and rejected before alice resolves — real fallthrough.
    { id: "r4", author: "dave",  floor: "4", mentions: ["alice", "ghost"], refFloors: [], bodyHtml: "d", thanks: 0 },
  ];
  const roots = buildReplyTree(replies);
  check("multi-@ → last mention wins (carol under bob)",
    roots.length === 2 && roots[1].author === "bob" && roots[1].children.length === 1 && roots[1].children[0].author === "carol",
    JSON.stringify(roots.map(r => [r.author, r.children.map(k => k.author)])));
  check("multi-@ → unresolvable primary falls through to next name (dave under alice)",
    roots[0].author === "alice" && roots[0].children.some(n => n.author === "dave"),
    JSON.stringify(roots.map(r => [r.author, r.children.map(k => k.author)])));
})();
</script>

<script>
// ---- Defuddle comment-tree: split same-depth sibling comments ----
// Defuddle's buildCommentTree opens a new <blockquote> only when depth INCREASES,
// so consecutive same-depth comments share one blockquote. htmlToMarkdown must
// split them so each comment is its own blockquote downstream (author accent,
// per-comment translation, ordering vs replies).
{
  section("htmlToMarkdown Defuddle sibling-comment split");
  const meta = (name) => '<div class="comment-metadata"><span class="comment-author"><strong>' + name +
    '</strong></span> · <a href="https://reddit.com/c/' + name + '" class="comment-link">2026-07-01</a> · <span class="comment-points">1 points</span></div>';
  const cmt = (name, body) => '<div class="comment">' + meta(name) + '<div class="comment-content"><p>' + body + '</p></div></div>';
  const render = (html) => { const d = document.createElement("div"); d.innerHTML = renderMarkdown(htmlToMarkdown(html, { baseUrl: "https://reddit.com" })); return d; };

  // 1. two same-depth siblings merged by buildCommentTree -> split into sibling blockquotes
  const v1 = render("<blockquote>" + cmt("alice", "alice body") + cmt("bob", "bob body") + "</blockquote>");
  const tops1 = v1.querySelectorAll(":scope > blockquote");
  check("merged siblings → two sibling blockquotes", tops1.length === 2, v1.innerHTML);
  check("each split comment's author <p> is first child with <strong>",
    tops1.length === 2 &&
    Array.from(tops1).every((b) => { const p = b.firstElementChild; return p && p.tagName === "P" && p.firstElementChild && p.firstElementChild.tagName === "STRONG"; }),
    v1.innerHTML);

  // 2. sibling B after A's nested replies: reply stays with A, B stays BELOW the reply
  const v2 = render("<blockquote>" + cmt("alice", "alice body") +
    "<blockquote>" + cmt("carol", "carol reply text") + "</blockquote>" +
    cmt("bob", "bob body") + "</blockquote>");
  const tops2 = v2.querySelectorAll(":scope > blockquote");
  check("A + A-replies + B → two top blockquotes", tops2.length === 2, v2.innerHTML);
  check("carol stays nested under alice; bob's text after carol's",
    tops2.length === 2 && /carol/.test(tops2[0].textContent) && !/carol/.test(tops2[1].textContent) &&
    v2.textContent.indexOf("carol reply") < v2.textContent.indexOf("bob body"), v2.innerHTML);

  // 3. single comment per blockquote → unchanged
  const v3 = render("<blockquote>" + cmt("dave", "dave body") + "</blockquote>");
  check("single comment per blockquote unchanged", v3.querySelectorAll(":scope > blockquote").length === 1, v3.innerHTML);

  // 4. plain quote without comment divs → untouched
  const v4 = render("<blockquote><p>just a quote</p><p>second para</p></blockquote>");
  check("plain blockquote untouched", v4.querySelectorAll("blockquote").length === 1, v4.innerHTML);
}
</script>

<script>
section("site-rules: pbpNormalizeLazyImages");
{
  const BASE = "https://example.com/articles/1";
  const wrap = (html) => { const d = document.createElement("div"); d.innerHTML = html; return d; };

  // 1. placeholder: missing src attribute
  {
    const d = wrap('<img data-src="/a.jpg">');
    const n = pbpNormalizeLazyImages(d, BASE);
    check("missing src + data-src -> promoted", d.querySelector("img").getAttribute("src") === "https://example.com/a.jpg", d.innerHTML);
    assertEq(n, 1, "missing src -> return count 1");
  }

  // 2. placeholder: empty string src
  {
    const d = wrap('<img src="" data-src="/a.jpg">');
    const n = pbpNormalizeLazyImages(d, BASE);
    check("empty src + data-src -> promoted", d.querySelector("img").getAttribute("src") === "https://example.com/a.jpg", d.innerHTML);
    assertEq(n, 1, "empty src -> return count 1");
  }

  // 3. placeholder: whitespace-only src
  {
    const d = wrap('<img src="   " data-src="/a.jpg">');
    const n = pbpNormalizeLazyImages(d, BASE);
    check("whitespace src + data-src -> promoted", d.querySelector("img").getAttribute("src") === "https://example.com/a.jpg", d.innerHTML);
    assertEq(n, 1, "whitespace src -> return count 1");
  }

  // 4. placeholder: data: URI src
  {
    const d = wrap('<img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP" data-src="/a.jpg">');
    const n = pbpNormalizeLazyImages(d, BASE);
    check("data: src + data-src -> promoted", d.querySelector("img").getAttribute("src") === "https://example.com/a.jpg", d.innerHTML);
    assertEq(n, 1, "data: src -> return count 1");
  }

  // 5. real src untouched
  {
    const d = wrap('<img src="https://real.com/pic.jpg" data-src="https://other.com/x.jpg">');
    const n = pbpNormalizeLazyImages(d, BASE);
    check("real src untouched", d.querySelector("img").getAttribute("src") === "https://real.com/pic.jpg", d.innerHTML);
    assertEq(n, 0, "real src -> return count 0");
  }

  // 6. candidate order: data-src wins over data-original and data-lazy-src
  {
    const d = wrap('<img data-src="/a.jpg" data-original="/b.jpg" data-lazy-src="/c.jpg">');
    const n = pbpNormalizeLazyImages(d, BASE);
    check("data-src wins over data-original/data-lazy-src", d.querySelector("img").getAttribute("src") === "https://example.com/a.jpg", d.innerHTML);
    assertEq(n, 1, "data-src wins -> return count 1");
  }

  // 7. data-original picked when data-src absent
  {
    const d = wrap('<img data-original="/b.jpg" data-lazy-src="/c.jpg">');
    const n = pbpNormalizeLazyImages(d, BASE);
    check("data-original picked when data-src absent", d.querySelector("img").getAttribute("src") === "https://example.com/b.jpg", d.innerHTML);
    assertEq(n, 1, "data-original picked -> return count 1");
  }

  // 8. data-lazy-src picked when data-src and data-original absent
  {
    const d = wrap('<img data-lazy-src="/c.jpg">');
    const n = pbpNormalizeLazyImages(d, BASE);
    check("data-lazy-src picked when others absent", d.querySelector("img").getAttribute("src") === "https://example.com/c.jpg", d.innerHTML);
    assertEq(n, 1, "data-lazy-src picked -> return count 1");
  }

  // 9. data-src present but invalid URL does NOT fall through to srcset
  {
    const d = wrap('<img data-src="http://[invalid" srcset="/valid.jpg 1x">');
    const n = pbpNormalizeLazyImages(d, BASE);
    check("invalid data-src does not fall through to srcset", d.querySelector("img").getAttribute("src") === null, d.innerHTML);
    assertEq(n, 0, "invalid data-src, no fallthrough -> return count 0");
  }

  // 9b. data-src present but whitespace-only does NOT fall through to srcset
  {
    const d = wrap('<img data-src="   " srcset="/valid.jpg 1x">');
    const n = pbpNormalizeLazyImages(d, BASE);
    check("whitespace-only data-src does not fall through to srcset", d.querySelector("img").getAttribute("src") === null, d.innerHTML);
    assertEq(n, 0, "whitespace-only data-src, no fallthrough -> return count 0");
  }

  // 10. invalid URL skipped (no alternative candidate present)
  {
    const d = wrap('<img data-src="http://[invalid">');
    const n = pbpNormalizeLazyImages(d, BASE);
    check("invalid data-src alone -> skipped, no src written", d.querySelector("img").getAttribute("src") === null, d.innerHTML);
    assertEq(n, 0, "invalid URL alone -> return count 0");
  }

  // 11. srcset last-candidate extraction (with descriptors)
  {
    const d = wrap('<img srcset="a.jpg 1x, b.jpg 2x">');
    const n = pbpNormalizeLazyImages(d, BASE);
    check("srcset picks last candidate", d.querySelector("img").getAttribute("src") === "https://example.com/articles/b.jpg", d.innerHTML);
    assertEq(n, 1, "srcset last candidate -> return count 1");
  }

  // 11b. srcset URL containing commas (Cloudinary transforms) stays whole
  {
    const d = wrap('<img srcset="https://res.cdn.com/c_fill,w_400/a.jpg 1x, https://res.cdn.com/c_fill,w_800/a.jpg 2x">');
    const n = pbpNormalizeLazyImages(d, BASE);
    check("srcset comma-in-URL candidate survives intact",
      d.querySelector("img").getAttribute("src") === "https://res.cdn.com/c_fill,w_800/a.jpg", d.innerHTML);
    assertEq(n, 1, "srcset comma-in-URL -> return count 1");
  }

  // 11c. no-space comma separators still split on descriptor boundaries
  {
    const d = wrap('<img srcset="a.jpg 1x,b.jpg 2x">');
    const n = pbpNormalizeLazyImages(d, BASE);
    check("srcset comma without space still picks last URL",
      d.querySelector("img").getAttribute("src") === "https://example.com/articles/b.jpg", d.innerHTML);
    assertEq(n, 1, "srcset no-space separators -> return count 1");
  }

  // 12. srcset messy whitespace
  {
    const d = wrap('<img srcset="  a.jpg   1x  ,   b.jpg   2x   ">');
    const n = pbpNormalizeLazyImages(d, BASE);
    check("srcset messy whitespace still extracts last URL", d.querySelector("img").getAttribute("src") === "https://example.com/articles/b.jpg", d.innerHTML);
    assertEq(n, 1, "srcset messy whitespace -> return count 1");
  }

  // 13. data-srcset fallback when srcset absent
  {
    const d = wrap('<img data-srcset="a.jpg 1x, b.jpg 2x">');
    const n = pbpNormalizeLazyImages(d, BASE);
    check("data-srcset used when srcset absent", d.querySelector("img").getAttribute("src") === "https://example.com/articles/b.jpg", d.innerHTML);
    assertEq(n, 1, "data-srcset fallback -> return count 1");
  }

  // 14. relative URL absolutized against a baseHref with a path
  {
    const d = wrap('<img data-src="assets/pic.png">');
    const n = pbpNormalizeLazyImages(d, "https://example.com/articles/2026/post.html");
    check("relative URL absolutized against baseHref path", d.querySelector("img").getAttribute("src") === "https://example.com/articles/2026/assets/pic.png", d.innerHTML);
    assertEq(n, 1, "relative URL absolutized -> return count 1");
  }

  // 15. non-http(s) rejected: javascript: candidate
  {
    const d = wrap('<img data-src="javascript:alert(1)">');
    const n = pbpNormalizeLazyImages(d, BASE);
    check("javascript: candidate skipped", d.querySelector("img").getAttribute("src") === null, d.innerHTML);
    assertEq(n, 0, "javascript: candidate -> return count 0");
  }

  // 16. non-http(s) rejected: data: candidate
  {
    const d = wrap('<img data-src="data:image/png;base64,xx">');
    const n = pbpNormalizeLazyImages(d, BASE);
    check("data: data-src candidate skipped", d.querySelector("img").getAttribute("src") === null, d.innerHTML);
    assertEq(n, 0, "data: data-src candidate -> return count 0");
  }

  // 17. about:blank (SafeURL shim) rejected
  {
    const d = wrap('<img data-src="about:blank">');
    const n = pbpNormalizeLazyImages(d, BASE);
    check("about:blank candidate skipped (SafeURL shim compat)", d.querySelector("img").getAttribute("src") === null, d.innerHTML);
    assertEq(n, 0, "about:blank candidate -> return count 0");
  }

  // 18. falsy / non-element rootEl -> 0
  assertEq(pbpNormalizeLazyImages(null, BASE), 0, "null rootEl -> 0");
  assertEq(pbpNormalizeLazyImages(undefined, BASE), 0, "undefined rootEl -> 0");
  assertEq(pbpNormalizeLazyImages({}, BASE), 0, "no querySelectorAll rootEl -> 0");

  // 19. Document-as-rootEl works
  {
    const hdoc = document.implementation.createHTMLDocument("t");
    hdoc.body.innerHTML = '<img data-src="/a.jpg">';
    const n = pbpNormalizeLazyImages(hdoc, BASE);
    check("Document rootEl: img promoted", hdoc.querySelector("img").getAttribute("src") === "https://example.com/a.jpg", hdoc.body.innerHTML);
    assertEq(n, 1, "Document rootEl -> return count 1");
  }

  // 20. return count correctness across a mixed batch
  {
    const d = wrap(
      '<img src="https://real.com/pic.jpg" data-src="https://other.com/x.jpg">' +
      '<img data-src="/ok.jpg">' +
      '<img data-src="http://[invalid">' +
      '<img srcset="c.jpg 1x, d.jpg 2x">'
    );
    const n = pbpNormalizeLazyImages(d, BASE);
    const imgs = d.querySelectorAll("img");
    assertEq(n, 2, "mixed batch -> return count 2");
    check("mixed batch: real src untouched", imgs[0].getAttribute("src") === "https://real.com/pic.jpg", d.innerHTML);
    check("mixed batch: valid data-src promoted", imgs[1].getAttribute("src") === "https://example.com/ok.jpg", d.innerHTML);
    check("mixed batch: invalid data-src skipped", imgs[2].getAttribute("src") === null, d.innerHTML);
    check("mixed batch: srcset promoted", imgs[3].getAttribute("src") === "https://example.com/articles/d.jpg", d.innerHTML);
  }
}
</script>

  assertEq(pbpUpgradeSrcsetImages(d, BASE), 0, "placeholder img is left to the lazy pass");

<script>
// ---- E1: detached-div innerHTML roundtrip (site-rule path regression, spec invariant 4) ----
// Hook Pattern A stuffs a site-rule's contentHtml into a DETACHED div, calls
// pbpNormalizeLazyImages(div, baseHref), then reads back div.innerHTML as the
// new contentHtml -- on a page with no lazy images this must not silently
// mutate the returned markup. This is NOT a general innerHTML guarantee (see
// the second half of this block); it holds because every existing site-rule
// already builds contentHtml in canonical serialized form.
{
  section("E1: detached-div innerHTML roundtrip (non-lazy site-rule content)");
  const rep = '<p>See <a href="https://example.com/ref">reference</a> for details.</p>'
    + '<img src="https://example.com/real.png" alt="diagram">'
    + '<pre><code>const x = 1;\nconsole.log(x);</code></pre>'
    + '<ul><li>a<ul><li>b</li><li>c</li></ul></li><li>d</li></ul>';
  const div = document.createElement("div");
  div.innerHTML = rep;
  const n = pbpNormalizeLazyImages(div, "https://example.com/page");
  check("real-src-only fragment -> 0 images normalized (real src never touched)", n === 0, String(n));
  check("canonical-form fragment (link, real-src img, pre/code, nested list) round-trips byte-identical",
    div.innerHTML === rep, div.innerHTML);

  // Boundary: byte-identity is NOT a general innerHTML guarantee -- it holds
  // because contentHtml is already canonical, not because Chrome preserves
  // arbitrary input syntax. Single-quoted + self-closing markup normalizes
  // on the FIRST pass, then is stable (idempotent) from then on.
  const nonCanonical = "<img src='https://example.com/x.png'/>";
  const div2 = document.createElement("div");
  div2.innerHTML = nonCanonical;
  const firstPass = div2.innerHTML;
  check("non-canonical syntax (single quotes + self-close) is NOT preserved byte-for-byte",
    firstPass !== nonCanonical, firstPass);
  div2.innerHTML = firstPass;
  check("second roundtrip of already-canonical output is stable (idempotent -- the real guarantee)",
    div2.innerHTML === firstPass, div2.innerHTML);
}
</script>

<script>
  // ---- X4: publishedIso (pure date normalizer, called ONLY at meta-build time) ----
  section("publishedIso");

  // ISO-prefixed: JSON-LD/meta datePublished mainstream shapes -> take the 10-char prefix
  assertEq(publishedIso("2026-01-05T10:00:00Z"), "2026-01-05", "ISO datetime with Z -> date prefix");
  assertEq(publishedIso("2026-01-05T10:00:00+08:00"), "2026-01-05", "ISO datetime with offset -> date prefix");
  assertEq(publishedIso("2026-01-05"), "2026-01-05", "bare ISO date is idempotent");

  // Date.parse()-able but not ISO-prefixed. ONE contract covers both input
  // classes below -- "emit the calendar day the SOURCE writes" -- so every
  // expectation here is a TZ-INDEPENDENT literal, and this whole block is a
  // live gate under any TZ the runner happens to have (verify the matrix with
  // `TZ=Pacific/Kiritimati node .qa-scan/run-test.mjs tests/md-convert-tests.html`
  // and friends; a UTC- / UTC / UTC+ trio covers the sign cases).
  //
  // Deliberately NOT an oracle derived from Date getters: an oracle phrased as
  // "the local calendar date of the parsed instant" restates whichever getter
  // the implementation picked, so it ratifies the very reader-clock coupling
  // this contract forbids. Literals cannot -- these fixtures go red on BOTH
  // historical implementations (getUTC* fields, and instant->local fields) in
  // every zone including UTC.
  {
    // Class 1 -- no zone designator (the raw <time> textContent Defuddle hands
    // over when there is no datetime attribute). ECMA-262 parses these as LOCAL
    // midnight, so reading UTC fields back rolls UTC+ exports a day earlier.
    // Last row is time-bearing: it also guards against a zone-tail matcher
    // loose enough to clip a trailing non-zone word off a zoneless string.
    for (const [input, expected] of [
      ["March 4, 2026", "2026-03-04"],
      ["Mar 4 2026", "2026-03-04"],
      ["4 March 2026", "2026-03-04"],
      ["January 1, 2026", "2026-01-01"],
      ["December 31, 2025", "2025-12-31"],
      ["Mar 4, 2026 11:30 PM", "2026-03-04"]
    ]) {
      assertEq(publishedIso(input), expected,
        'date-only "' + input + '" keeps its own calendar date in any TZ');
    }

    // Class 2 -- an explicit zone (HTTP-date, or an RSS-style pubDate backfilled
    // into <time> text). The zone the string names is the one that decides the
    // day; the reader's clock never does. Coverage is by CATEGORY of designator,
    // not by enumerating feeds: zero-offset spellings (GMT / +0000 / UTC / the
    // military Z), both offset signs, the extreme +1400, an obsolete US zone
    // NAME (no numeric offset to read), and an RFC 2822 trailing comment.
    // 00:00 and 23:30 UTC-day ends are chosen so a reader-clock implementation
    // is wrong west and east of Greenwich respectively; the >= 11h offsets are
    // wrong in every zone including UTC.
    const zoned = [
      ["Mon, 05 Jan 2026 00:00:00 GMT", "2026-01-05"],
      ["Mon, 05 Jan 2026 23:30:00 GMT", "2026-01-05"],
      ["Mon, 05 Jan 2026 00:30:00 Z", "2026-01-05"],
      ["Sun, 04 Jan 2026 22:15:00 +0000", "2026-01-04"],
      ["Thu, 31 Dec 2026 23:55:00 UTC", "2026-12-31"],
      ["Jan 5, 2026 19:00:00 GMT-0500", "2026-01-05"],
      ["Fri, 02 Jan 2026 08:00:00 +1400", "2026-01-02"],
      ["Sat, 03 Jan 2026 20:00:00 -1100", "2026-01-03"],
      ["Mon, 05 Jan 2026 00:30:00 EST", "2026-01-05"],
      ["Mon, 05 Jan 2026 00:30:00 -0500 (EST)", "2026-01-05"]
    ];
    for (const [input, expected] of zoned) {
      assertEq(publishedIso(input), expected,
        'explicit-zone "' + input + '" -> the day its own zone writes, in any TZ');
    }
    assert(zoned.every(([input]) => !Number.isNaN(Date.parse(input))),
      "every explicit-zone fixture must stay Date.parse()-able, else it silently tests the return-as-is branch instead");

    // The category statement the two branches owe each other: one instant, two
    // encodings (ISO -> prefix branch, RFC 2822 -> zone branch) must normalize
    // to ONE day. This is exactly what a reader-clock zone branch breaks, since
    // the prefix branch does no timezone math at all.
    assertEq(publishedIso("Mon, 05 Jan 2026 00:00:00 GMT"), publishedIso("2026-01-05T00:00:00Z"),
      "RFC 2822 and ISO spellings of the UTC day's first instant agree");
    assertEq(publishedIso("Mon, 05 Jan 2026 23:30:00 GMT"), publishedIso("2026-01-05T23:30:00Z"),
      "RFC 2822 and ISO spellings of the UTC day's last instant agree");
  }

  // Unparseable: returned unchanged so the caller renders it via yamlString, never as a bare date
  assertEq(publishedIso("not a real date at all"), "not a real date at all", "unparseable string returned as-is");

  // Empty in, empty out
  assertEq(publishedIso(""), "", "empty string -> empty string");
  assertEq(publishedIso(null), "", "null -> empty string");
  assertEq(publishedIso(undefined), "", "undefined -> empty string");
</script>

<script>
  // ---- X4: applyFrontmatter extended metadata trailers ----
  section("X4 applyFrontmatter extended metadata trailers");

  const fmBase = { title: "T", url: "https://e.com/p", date: "2026-06-03", tags: ["dev"], source: "defuddle" };

  // Regression gate: an old-shape meta (no extended fields) renders BYTE-IDENTICAL
  // to fm1 above (P2.1 section) -- same literal fields, computed before this batch
  // existed. If any extended key ever leaked into the no-extended-field path this
  // equality breaks immediately.
  const fmNoExt = applyFrontmatter("# Body\n", {
    title: 'A: "quoted"',
    url: "https://e.com/p",
    date: "2026-06-03",
    tags: ["dev", "go"],
    source: "defuddle",
    description: "Desc: with colon"
  }, {});
  assertEq(fmNoExt, fm1, "meta without any extended field renders byte-identical to the pre-X4 baseline (fm1)");

  // Full extended fields: fixed order published, author, site, image, words -- AFTER description.
  const fmFull = applyFrontmatter("body", {
    ...fmBase,
    description: "Desc",
    published: "2026-01-05",
    clipped: "2026-07-08",
    author: "Jane Doe",
    site: "The Verge",
    image: "https://cdn.example.com/cover.jpg",
    words: 1534
  }, {});
  const trailerBlock = fmFull.split("description: \"Desc\"\n")[1].split("\n---\n\n")[0];
  const trailerLines = trailerBlock.split("\n");
  assertEq(trailerLines[0], "published: 2026-01-05", "published bare scalar (matches YYYY-MM-DD) comes right after description: " + trailerBlock);
  assertEq(trailerLines[1], "clipped: 2026-07-08", "clipped bare scalar comes right after published: " + trailerBlock);
  assertEq(trailerLines[2], 'author: "Jane Doe"', "author quoted, third: " + trailerBlock);
  assertEq(trailerLines[3], 'site: "The Verge"', "site quoted, fourth: " + trailerBlock);
  assertEq(trailerLines[4], 'image: "https://cdn.example.com/cover.jpg"', "image quoted, fifth: " + trailerBlock);
  assertEq(trailerLines[5], "words: 1534", "words bare integer, sixth (last, right before closing ---): " + trailerBlock);
  assert(fmFull.includes("\n---\n\nbody"), "closing fence still immediately precedes the body");

  // published that failed normalization upstream (not YYYY-MM-DD shaped) renders quoted, not bare --
  // meta-build time is responsible for normalizing; applyFrontmatter only judges the shape it's given.
  const fmBadPublished = applyFrontmatter("body", { ...fmBase, published: "circa 1990s" }, {});
  assert(fmBadPublished.includes('published: "circa 1990s"'), "unnormalized published string is yamlString-quoted, not emitted bare: " + fmBadPublished);

  // author/site/image individually absent -> individually omitted (independent presence, not all-or-nothing)
  const fmPartial = applyFrontmatter("body", { ...fmBase, author: "Jane Doe" }, {});
  assert(fmPartial.includes('author: "Jane Doe"'), "author alone still renders: " + fmPartial);
  assert(!/published:|site:|image:|words:/.test(fmPartial), "site/image/published/words individually omitted when absent from meta: " + fmPartial);

  // words: only a finite number renders; NaN/Infinity/non-number are omitted (Number.isFinite gate)
  assert(!applyFrontmatter("body", { ...fmBase, words: NaN }, {}).includes("words:"), "words:NaN omitted");
  assert(!applyFrontmatter("body", { ...fmBase, words: Infinity }, {}).includes("words:"), "words:Infinity omitted");
  assert(!applyFrontmatter("body", { ...fmBase, words: "1534" }, {}).includes("words:"), "words as a string (not Number.isFinite) omitted");
  assert(applyFrontmatter("body", { ...fmBase, words: 0 }, {}).includes("words: 0"), "words:0 IS finite -> renders (0 is not falsy-omitted)");

  // yamlString escaping applies to author (quotes/newlines), same as title/description
  const fmEscaped = applyFrontmatter("body", { ...fmBase, author: 'Jane "JD" Doe\nSecond line' }, {});
  assert(fmEscaped.includes('author: "Jane \\"JD\\" Doe\\nSecond line"'), "author with quotes+newline escaped via yamlString: " + fmEscaped);
</script>

<script>
  // ---- X4: composeStyledHtml byline (second .doc-meta: author (middot) site (middot) published) ----
  section("X4 composeStyledHtml byline");

  const bylineMeta = {
    title: "Piece", url: "https://e.com/a", date: "2026-06-04", tags: ["x"],
    source: "defuddle",
    author: "Jane Doe", site: "The Verge", published: "2026-01-05"
  };
  const bylineMd = "## Intro\n\nBody.";

  const withByline = composeStyledHtml(bylineMd, bylineMeta, { frontmatter: true, imagePolicy: "keep", includeToc: false, hljsCss: "" });
  const bylineParas = withByline.match(/<p class="doc-meta">[\s\S]*?<\/p>/g) || [];
  assertEq(bylineParas.length, 2, "extended meta present -> TWO .doc-meta paragraphs (url/date/tags, then author/site/published)");
  const byline2 = bylineParas[1] || "";
  assert(byline2.includes("Jane Doe") && byline2.includes("The Verge") && byline2.includes("2026-01-05"), "second .doc-meta carries author, site, published: " + byline2);
  assert(byline2.indexOf("Jane Doe") < byline2.indexOf("The Verge") && byline2.indexOf("The Verge") < byline2.indexOf("2026-01-05"), "byline order is author, site, published: " + byline2);

  // Absent extended meta -> only the original ONE .doc-meta paragraph, no empty second line
  const noBylineMeta = { title: "Piece", url: "https://e.com/a", date: "2026-06-04", tags: ["x"], source: "defuddle" };
  const noByline = composeStyledHtml(bylineMd, noBylineMeta, { frontmatter: true, imagePolicy: "keep", includeToc: false, hljsCss: "" });
  const noBylineParas = noByline.match(/<p class="doc-meta">[\s\S]*?<\/p>/g) || [];
  assertEq(noBylineParas.length, 1, "no extended meta -> only ONE .doc-meta paragraph, no empty second line");

  // Partial (author only, no site/published) -> byline still renders with just that one span
  const partialByline = composeStyledHtml(bylineMd, { ...noBylineMeta, author: "Solo Author" }, { frontmatter: true, imagePolicy: "keep", includeToc: false, hljsCss: "" });
  const partialParas = partialByline.match(/<p class="doc-meta">[\s\S]*?<\/p>/g) || [];
  assertEq(partialParas.length, 2, "author alone still triggers the second .doc-meta");
  const partial2 = partialParas[1] || "";
  assert(partial2.includes("Solo Author") && !partial2.includes("&middot;"), "single-field byline has no dangling middot separator: " + partial2);

  // Escaping: author/site with HTML-significant chars must be _xmlEscape'd
  const evilByline = composeStyledHtml(bylineMd, { ...noBylineMeta, author: '<b>Evil</b> & "Author"', site: "A & B" }, { frontmatter: true, imagePolicy: "keep", includeToc: false, hljsCss: "" });
  assert(!/<b>Evil<\/b>/.test(evilByline) && /&lt;b&gt;Evil&lt;\/b&gt;/.test(evilByline), "author HTML is escaped, not rendered as markup: " + evilByline);
  assert(/A &amp; B/.test(evilByline), "site ampersand is escaped: " + evilByline);

  // frontmatter:false -> no header at all, so no byline either (existing invariant, extended meta
  // present). NOTE: must match the rendered <p class="doc-meta"> tag, NOT a bare /doc-meta/
  // substring -- READER_CSS unconditionally embeds a ".doc-meta{...}" style rule in every
  // <style> block regardless of opts.frontmatter, so a bare substring test always finds a hit
  // and this assertion would falsely fail even when the byline is correctly suppressed.
  const noHeaderAtAll = composeStyledHtml(bylineMd, bylineMeta, { frontmatter: false, imagePolicy: "keep", includeToc: false, hljsCss: "" });
  assert(!/<p class="doc-meta">/.test(noHeaderAtAll), "frontmatter:false suppresses the byline too (no header rendered at all)");
</script>

<script>
section("md-embed: pbpEmbedScan / pbpEmbedRewrite / pbpEmbedBudget (pure layer)");

// scan classification matrix
(() => {
  const mdImgs = [
    "![a](https://cdn.example.com/a.png)",
    "![b](/rel/b.jpg)",                       // relative -> baseUrl absolutized -> candidate
    "![c](data:image/png;base64,AAAA)",       // inline kept as-is
    "![d](blob:https://page/xyz)",            // blob -> blobs
    "![e](http://insecure.example.com/e.gif)",// http -> kept
    "```",
    "![in-fence](https://x.example.com/f.png)", // fenced code -> not scanned
    "```",
  ].join("\n");
  const scan = pbpEmbedScan(mdImgs, "https://page.example.com/post");
  assertEq(scan.candidates.length, 2, "scan matrix: candidate count");
  assertEq(scan.candidates[0], "https://cdn.example.com/a.png", "scan matrix: absolute candidate kept as-is");
  assertEq(scan.candidates[1], "https://page.example.com/rel/b.jpg", "scan matrix: relative candidate absolutized against baseUrl");
  assertEq(scan.blobs.length, 1, "scan matrix: blob URL classified into blobs");
  assertEq(scan.kept.length, 1, "scan matrix: http (insecure) URL classified into kept");
  assertEq(scan.origins.join(","), "https://cdn.example.com,https://page.example.com", "scan matrix: origins collected in candidate order");
})();

// upper-bound truncation (2 assertions)
(() => {
  const lines51 = [];
  for (let i = 0; i < 51; i++) lines51.push(`![i${i}](https://cap.example.com/img${i}.png)`);
  const s51 = pbpEmbedScan(lines51.join("\n"), "");
  assert(s51.candidates.length === 50 && s51.kept.length === 1,
    "maxImages caps candidates at 50; 51st image overflows into kept: " + JSON.stringify({ c: s51.candidates.length, k: s51.kept.length }));

  const lines11 = [];
  for (let i = 0; i < 11; i++) lines11.push(`![o${i}](https://origin${i}.example.com/x.png)`);
  const s11 = pbpEmbedScan(lines11.join("\n"), "");
  assert(s11.origins.length === 10 && s11.kept.length === 1,
    "maxOrigins caps distinct origins at 10; 11th origin's image overflows into kept: " + JSON.stringify({ o: s11.origins.length, k: s11.kept.length }));
})();

// de-dup, order-preserving (1 assertion)
(() => {
  const md = "![a](https://dup.example.com/x.png)\n![a2](https://dup.example.com/x.png)";
  const s = pbpEmbedScan(md, "");
  assertEq(s.candidates.length, 1, "same URL referenced twice only appears once in candidates");
})();

// masking surface (Codex-P3): inline code span + escaped \![ must not drive scan/fetch (4 assertions)
(() => {
  const codeSpanLine = "Use `![x](https://evil.example.com/x.png)` in your code.";
  const sCode = pbpEmbedScan(codeSpanLine, "");
  assert(!sCode.candidates.includes("https://evil.example.com/x.png") && !sCode.origins.includes("https://evil.example.com"),
    "inline code-span pseudo-image excluded from candidates/origins: " + JSON.stringify(sCode));

  const escapedLine = "See \\![y](https://e2.example.com/y.png) literally.";
  const sEsc = pbpEmbedScan(escapedLine, "");
  assert(!sEsc.candidates.includes("https://e2.example.com/y.png"),
    "escaped \\![ pseudo-image excluded from candidates: " + JSON.stringify(sEsc));

  const rCode = pbpEmbedRewrite(codeSpanLine, { "https://evil.example.com/x.png": "REPLACED" }, "", pbpEmbedBudget(999999));
  assertEq(rCode.md, codeSpanLine, "code-span pseudo-image left byte-for-byte untouched by rewrite");

  const rEsc = pbpEmbedRewrite(escapedLine, { "https://e2.example.com/y.png": "REPLACED" }, "", pbpEmbedBudget(999999));
  assertEq(rEsc.md, escapedLine, "escaped pseudo-image left byte-for-byte untouched by rewrite");
})();

// rewrite: dataURI substitution, blob->alt, fence untouched, map-absent URL kept as-is (4 assertions)
(() => {
  const mdData = "![a](https://cdn.example.com/a.png)";
  const rData = pbpEmbedRewrite(mdData, { "https://cdn.example.com/a.png": "data:image/png;base64,ABCD" }, "", pbpEmbedBudget(999999));
  assertEq(rData.md, "![a](data:image/png;base64,ABCD)", "candidate URL rewritten to data URI src");

  const mdBlob = "![d](blob:https://page/xyz)";
  const rBlob = pbpEmbedRewrite(mdBlob, { "blob:https://page/xyz": null }, "", pbpEmbedBudget(999999));
  assertEq(rBlob.md, "d", "blob map value null degrades whole image to alt text");

  const mdFence = "```\n![f](https://cdn.example.com/f.png)\n```";
  const rFence = pbpEmbedRewrite(mdFence, { "https://cdn.example.com/f.png": "data:image/png;base64,X" }, "", pbpEmbedBudget(999999));
  assertEq(rFence.md, mdFence, "fenced code block content is never rewritten");

  const mdAbsent = "![g](https://cdn.example.com/g.png)";
  const rAbsent = pbpEmbedRewrite(mdAbsent, {}, "", pbpEmbedBudget(999999));
  assertEq(rAbsent.md, mdAbsent, "URL with no map entry is left as-is");
})();

// A4: canonical URL key + preview-fix cache entry validity (9 assertions)
(() => {
  const c = pbpEmbedCanonicalUrl;
  assertEq(c("https://cdn.example/图.png"), "https://cdn.example/%E5%9B%BE.png",
    "canonical: raw CJK path percent-encoded to the browser form");
  assertEq(c("https://cdn.example/%E5%9B%BE.png"), "https://cdn.example/%E5%9B%BE.png",
    "canonical: already-encoded input is idempotent (no double-encoding)");
  assertEq(c("https://a.example/b/../c.png"), "https://a.example/c.png",
    "canonical: dot segments normalized");
  assertEq(c("https://例子.example/图.png"), c("https://xn--fsqu00a.example/%E5%9B%BE.png"),
    "canonical: IDN host converges on one punycoded form");
  assertEq(c("https://[::1]/a.png"), "https://[::1]/a.png",
    "canonical: bracketed IPv6 host degrades to the original value without throwing");
  assert(!pbpEmbedCacheEntryValid(null), "entryValid: null rejected");
  assert(!pbpEmbedCacheEntryValid({ dataUri: "data:image/png;base64,AA", byteLength: 5, decoded: false }),
    "entryValid: undecoded entry rejected (no <img> has proven it renders)");
  assert(!pbpEmbedCacheEntryValid({ dataUri: "data:image/png;base64,AA", byteLength: NaN, decoded: true }),
    "entryValid: NaN byteLength rejected (cannot charge the export budget)");
  assert(pbpEmbedCacheEntryValid({ dataUri: "data:image/png;base64,AA", mime: "image/png", byteLength: 5, decoded: true }),
    "entryValid: decoded entry with a real size accepted");
})();

// export honesty counter (plan A, Codex-adjudicated): pbpEmbedBrokenCount counts
// observed-broken links that a keep export would ship as URLs (7 assertions)
(() => {
  const obs = new Set(["https://cdn.example.com/a.png"]);
  assertEq(pbpEmbedBrokenCount("![a](https://cdn.example.com/a.png)", "", obs), 1,
    "brokenCount: observed absolute candidate counted");
  assertEq(pbpEmbedBrokenCount("![a](https://cdn.example.com/other.png)", "", obs), 0,
    "brokenCount: unobserved URL not counted");
  assertEq(pbpEmbedBrokenCount("![a](https://cdn.example.com/a.png)\n![b](https://cdn.example.com/a.png)", "", obs), 1,
    "brokenCount: duplicate references count once");
  assertEq(pbpEmbedBrokenCount("![r](/rel/a.png)", "https://cdn.example.com/post",
    new Set(["https://cdn.example.com/rel/a.png"])), 1,
    "brokenCount: relative src normalized against baseUrl before matching");
  // the 51st image overflows into kept, but a keep export still ships it as a link
  const capLines = [];
  for (let i = 0; i < 51; i++) capLines.push(`![i${i}](https://cap.example.com/img${i}.png)`);
  assertEq(pbpEmbedBrokenCount(capLines.join("\n"), "", new Set(["https://cap.example.com/img50.png"])), 1,
    "brokenCount: over-maxImages (kept) URL still counted");
  // marked encodeURI()s emitted hrefs — the browser-side key can be the encoded variant
  assertEq(pbpEmbedBrokenCount("![u](https://cdn.example.com/图.png)", "",
    new Set([encodeURI("https://cdn.example.com/图.png")])), 1,
    "brokenCount: encodeURI variant of a non-ASCII URL matches");
  assertEq(pbpEmbedBrokenCount("![a](https://cdn.example.com/a.png)", "", new Set()), 0,
    "brokenCount: empty observed set counts zero");
})();

// rewrite output budget (Codex-P2): same URL referenced 3x, budget only covers 2 replacements (2 assertions)
(() => {
  const url = "https://cdn.example.com/rep.png";
  const repl = "data:image/png;base64,ZZZZ";
  const md = ["![1](" + url + ")", "![2](" + url + ")", "![3](" + url + ")"].join("\n");
  const replLen = ("![1](" + repl + ")").length; // same length for alt "1"/"2"/"3"
  const budget = pbpEmbedBudget(replLen * 2); // exactly enough for 2 of the 3 references
  const r = pbpEmbedRewrite(md, { [url]: repl }, "", budget);
  const outLines = r.md.split("\n");
  assert(outLines[0] === "![1](" + repl + ")" && outLines[1] === "![2](" + repl + ")" && outLines[2] === "![3](" + url + ")",
    "budget exhausted after 2 replacements; 3rd occurrence keeps original URL: " + r.md);
  assertEq(r.dropped, 1, "exactly one occurrence dropped once outBudget is exhausted");
})();

// budget primitive: accumulate-to-limit false + atomicity (3 assertions)
(() => {
  const b = pbpEmbedBudget(100);
  assert(b.reserve(60) === true && b.used() === 60, "reserve within budget succeeds and accumulates in used()");
  assert(b.reserve(50) === false, "reserve exceeding remaining budget returns false");
  assertEq(b.used(), 60, "used() unchanged after a rejected reserve (atomic — no partial charge)");
})();

// budget primitive: table-driven boundary cases (8 assertions)
(() => {
  const cases = [
    { n: 0, total: 100, pre: 0, expect: true, label: "reserve(0) succeeds as a no-op" },
    { n: 100, total: 100, pre: 0, expect: true, label: "reserve(total) exactly fills the budget" },
    { n: 101, total: 100, pre: 0, expect: false, label: "reserve(total+1) is rejected" },
    { n: -1, total: 100, pre: 0, expect: false, label: "negative n is rejected" },
    { n: NaN, total: 100, pre: 0, expect: false, label: "NaN is rejected" },
    { n: Infinity, total: 100, pre: 0, expect: false, label: "Infinity is rejected" },
    { n: 1, total: 100, pre: 100, expect: false, label: "any positive n rejected once budget is fully used" },
    { n: 0.5, total: 1, pre: 0, expect: true, label: "fractional n within budget succeeds" },
  ];
  for (const c of cases) {
    const bud = pbpEmbedBudget(c.total);
    if (c.pre) bud.reserve(c.pre);
    assertEq(bud.reserve(c.n), c.expect, c.label);
  }
})();

// masking placeholder collision (Critical fix): literal " M<n> " prose must never
// be treated as a mask token — restore must not corrupt ordinary text.
(() => {
  const prose = "Apple M1 chip and M3 too";
  assertEq(pbpEmbedRewrite(prose, {}, "", pbpEmbedBudget(999999)).md, prose,
    "plain prose with literal M<n> words survives rewrite verbatim (empty map)");
  assertEq(pbpEmbedRewrite(prose, { "https://cdn.example.com/a.png": "data:image/png;base64,AA" }, "", pbpEmbedBudget(999999)).md, prose,
    "plain prose with literal M<n> words survives rewrite verbatim (non-empty map)");

  const mixed = "Run `npm test` on the M0 build";
  assertEq(pbpEmbedRewrite(mixed, {}, "", pbpEmbedBudget(999999)).md, mixed,
    "line with a code span AND a literal M0 word: span restored, literal untouched");

  const multi = "Mix `one` and `two` plus \\![esc](https://e3.example.com/z.png) end";
  assertEq(pbpEmbedRewrite(multi, {}, "", pbpEmbedBudget(999999)).md, multi,
    "multiple code spans + escaped \\![ on one line all restored verbatim");

  const withImg = "M3 note ![a](https://cdn.example.com/a.png) and M7 tail";
  assertEq(pbpEmbedRewrite(withImg, { "https://cdn.example.com/a.png": "data:image/png;base64,AA" }, "", pbpEmbedBudget(999999)).md,
    "M3 note ![a](data:image/png;base64,AA) and M7 tail",
    "real image rewritten while neighboring literal M<n> prose stays intact");
})();

// masking surface v2 (Codex-C1b): multi-backtick code spans and HTML comments
// must also be masked -- the old single-backtick regex `[^`]*` was pierced by
// a double-backtick span (it matched the empty "``" pairs instead of spanning
// the whole thing), leaking the pseudo-image inside straight into candidates.
// Also covers stripping a literal NUL that mimics the internal mask token
// format, so an adversarial input can never be mistaken for a real stash ref.
(() => {
  const dblBacktick = "Use ``![x](https://evil.example.com/a.png)`` in prose.";
  const sDbl = pbpEmbedScan(dblBacktick, "");
  assert(!sDbl.candidates.includes("https://evil.example.com/a.png") && !sDbl.origins.includes("https://evil.example.com"),
    "double-backtick code-span pseudo-image excluded from candidates/origins: " + JSON.stringify(sDbl));
  const rDbl = pbpEmbedRewrite(dblBacktick, { "https://evil.example.com/a.png": "REPLACED" }, "", pbpEmbedBudget(999999));
  assertEq(rDbl.md, dblBacktick, "double-backtick code-span pseudo-image left byte-for-byte untouched by rewrite");

  const commentLine = "before <!-- ![y](https://e2.example.com/b.png) --> after";
  const sComment = pbpEmbedScan(commentLine, "");
  assert(!sComment.candidates.includes("https://e2.example.com/b.png"),
    "HTML comment pseudo-image excluded from candidates: " + JSON.stringify(sComment));
  const rComment = pbpEmbedRewrite(commentLine, { "https://e2.example.com/b.png": "REPLACED" }, "", pbpEmbedBudget(999999));
  assertEq(rComment.md, commentLine, "HTML comment pseudo-image left byte-for-byte untouched by rewrite");

  const nulLine = "before \x00M0\x00 after";
  assert(nulLine.includes("\x00"), "sanity: test input actually carries a literal NUL byte");
  const rNul = pbpEmbedRewrite(nulLine, {}, "", pbpEmbedBudget(999999));
  assertEq(rNul.md, "before M0 after",
    "literal NUL-delimited fake mask token is stripped before masking, never mistaken for a real stash reference, and the output carries no NUL");
})();
</script>

<script>
section("md-epub: pbpCrc32 / pbpZipStore / pbpEpubContentOpf / pbpEpubNavXhtml / pbpEpubXmlEscape (pure layer)");

// CRC32 known vectors (2 assertions)
(() => {
  assertEq(pbpCrc32(new TextEncoder().encode("123456789")), 0xCBF43926, "CRC32('123456789') matches known IEEE 802.3 test vector");
  assertEq(pbpCrc32(new Uint8Array(0)), 0, "CRC32 of empty bytes is 0");
})();

// ZIP structure: 2-entry pack -> reverse-assert local header fields (3 assertions)
const _pbpZipTestBytes = { mt: new TextEncoder().encode("application/epub+zip"), ci: new TextEncoder().encode("<x/>") };
const _pbpZipTest = pbpZipStore([
  { name: "mimetype", data: _pbpZipTestBytes.mt },
  { name: "META-INF/container.xml", data: _pbpZipTestBytes.ci },
]);
(() => {
  const dv = new DataView(_pbpZipTest.buffer);
  assertEq(dv.getUint32(0, true), 0x04034b50, "first local file header signature is PK\\x03\\x04");
  assertEq(dv.getUint16(8, true), 0, "compression method 0 = stored");
  assertEq(new TextDecoder().decode(_pbpZipTest.slice(30, 38)), "mimetype", "first entry's stored name is 'mimetype' (entries[0] contract)");
})();

// EOCD locate + central directory count + offset consistency (3 assertions)
(() => {
  const dv = new DataView(_pbpZipTest.buffer);
  const eocdOff = _pbpZipTest.length - 22; // fixed-size EOCD record, no archive comment
  assertEq(dv.getUint32(eocdOff, true), 0x06054b50, "EOCD signature located at zip.length-22");
  assertEq(dv.getUint16(eocdOff + 8, true), 2, "EOCD total central-directory entry count matches the 2 entries packed");
  const cdSize = dv.getUint32(eocdOff + 12, true);
  const cdOffset = dv.getUint32(eocdOff + 16, true);
  assertEq(cdOffset + cdSize, eocdOff, "central directory offset + size lands exactly at EOCD start");
})();

// mimetype entry's stored CRC matches pbpCrc32(data) independently (1 assertion)
(() => {
  const dv = new DataView(_pbpZipTest.buffer);
  assertEq(dv.getUint32(14, true), pbpCrc32(_pbpZipTestBytes.mt), "mimetype local-header CRC field equals pbpCrc32(mimetype bytes)");
})();

// central directory walk: 3 entries, each CD record's byte-42 local-header offset
// checked against HAND-COMPUTED literals (30 + namelen + datalen accumulated by hand,
// NOT via the implementation's own accumulator — that would be tautological):
//   "mimetype"(8)               + 20B data -> lh 58, offset   0
//   "META-INF/container.xml"(22) + 4B data -> lh 56, offset  58
//   "OEBPS/content.opf"(17)      + 6B data -> lh 53, offset 114
// (7 assertions)
(() => {
  const enc = new TextEncoder();
  const zip = pbpZipStore([
    { name: "mimetype", data: enc.encode("application/epub+zip") },
    { name: "META-INF/container.xml", data: enc.encode("<x/>") },
    { name: "OEBPS/content.opf", data: enc.encode("<opf/>") },
  ]);
  const dv = new DataView(zip.buffer);
  const eocdOff = zip.length - 22;
  const expectedOffsets = [0, 58, 114];
  let rec = dv.getUint32(eocdOff + 16, true); // cdStart from EOCD's central-directory-offset field
  for (let i = 0; i < 3; i++) {
    assertEq(dv.getUint32(rec, true), 0x02014b50, `CD record ${i}: signature is PK\\x01\\x02`);
    assertEq(dv.getUint32(rec + 42, true), expectedOffsets[i],
      `CD record ${i}: relative local-header offset field = hand-computed ${expectedOffsets[i]}`);
    rec += 46 + dv.getUint16(rec + 28, true) + dv.getUint16(rec + 30, true) + dv.getUint16(rec + 32, true);
  }
  assertEq(rec, eocdOff, "stepping all 3 CD records via their namelen/extralen/commentlen fields lands exactly at EOCD");
})();

// OPF: required fields, escaping, no-author omission, identifier determinism (6 assertions)
(() => {
  const meta = { title: 'My <Title> & "Quote\'s"', url: "https://e.com/a", clipped: "2026-01-02", lang: "en" };
  const opf = pbpEpubContentOpf(meta, [{ id: "content", href: "content.xhtml", mediaType: "application/xhtml+xml" }]);
  assert(opf.includes("<dc:title>My &lt;Title&gt; &amp; &quot;Quote&apos;s&quot;</dc:title>"),
    "dc:title carries the escaped title text: " + opf);
  assert(opf.includes("<dc:source>https://e.com/a</dc:source>"), "dc:source carries the url: " + opf);
  assert(opf.includes("<dc:date>2026-01-02</dc:date>"), "dc:date falls back to meta.clipped when meta.date is absent: " + opf);
  assert(opf.includes('<meta property="dcterms:modified">2026-01-02T00:00:00Z</meta>'),
    "dcterms:modified = clipped + T00:00:00Z: " + opf);

  const opfNoAuthor = pbpEpubContentOpf({ title: "T", url: "https://e.com/b", clipped: "2026-01-03" }, []);
  assert(!/<dc:creator>/.test(opfNoAuthor), "dc:creator tag is omitted entirely when meta.author is absent: " + opfNoAuthor);

  const ident = "urn:pbp:" + pbpCrc32(new TextEncoder().encode("https://e.com/b")).toString(16).padStart(8, "0");
  const opfNoAuthor2 = pbpEpubContentOpf({ title: "T", url: "https://e.com/b", clipped: "2026-01-03" }, []);
  assert(opfNoAuthor.includes(`<dc:identifier id="pub-id">${ident}</dc:identifier>`) && opfNoAuthor === opfNoAuthor2,
    "dc:identifier is urn:pbp:+crc32(url) as fixed 8-digit hex and identical output for identical input (deterministic): " + opfNoAuthor);
})();

// nav: heading anchors, XML escaping, empty-headings fallback (4 assertions)
(() => {
  const nav = pbpEpubNavXhtml([{ id: "sec-1", text: "Intro" }, { id: "sec-2", text: "More" }], "My Doc");
  assert(nav.includes('<a href="content.xhtml#sec-1">Intro</a>') && nav.includes('<a href="content.xhtml#sec-2">More</a>'),
    "each heading renders an anchor list item pointing at content.xhtml#<id>: " + nav);

  const navEsc = pbpEpubNavXhtml([{ id: 'a&b', text: "<X> & \"Y\"" }], "T");
  assert(navEsc.includes('href="content.xhtml#a&amp;b"') && navEsc.includes(">&lt;X&gt; &amp; &quot;Y&quot;<"),
    "heading id and text are both XML-escaped: " + navEsc);

  const navEmptyTitled = pbpEpubNavXhtml([], "My Doc");
  const liCount = (navEmptyTitled.match(/<li>/g) || []).length;
  assertEq(liCount, 1, "empty headings array falls back to a single <li> entry");
  assert(navEmptyTitled.includes('<a href="content.xhtml">My Doc</a>'),
    "fallback li has no #id fragment and uses fallbackTitle as its text: " + navEmptyTitled);

  const navEmptyNoTitle = pbpEpubNavXhtml([], undefined);
  assert(navEmptyNoTitle.includes('<a href="content.xhtml">Content</a>') && navEmptyNoTitle.includes("<title>Contents</title>"),
    "with no fallbackTitle: li falls back to 'Content', <title> falls back to 'Contents' (distinct defaults, verbatim): " + navEmptyNoTitle);
})();

// xmlEscape: table-driven, all five reserved XML characters (5 assertions)
[
  ["&", "&amp;"],
  ["<", "&lt;"],
  [">", "&gt;"],
  ['"', "&quot;"],
  ["'", "&apos;"],
].forEach(([ch, esc]) => assertEq(pbpEpubXmlEscape(ch), esc, `pbpEpubXmlEscape(${JSON.stringify(ch)}) -> ${esc}`));

// pbpEpubLang (Codex-C3): canonicalize to BCP-47, "und" for anything illegal --
// a legal tag ("zh-CN"/"ja") round-trips, a free-text translate-target label
// ("Classical Chinese") and an empty string both fall back to "und" (4 assertions).
[
  ["zh-CN", "zh-CN"],
  ["ja", "ja"],
  ["Classical Chinese", "und"],
  ["", "und"],
].forEach(([input, expected]) => assertEq(pbpEpubLang(input), expected, `pbpEpubLang(${JSON.stringify(input)}) -> ${expected}`));
</script>

<script>
section("md-epub: pbpBuildEpub (Task 6 RUNTIME integration)");

// Reverse-parse a stored-only zip straight from its bytes (independent of
// pbpZipStore's own accumulator -- walks the central directory via the EOCD,
// then each local file header via the CD record's byte-42 offset field, same
// technique as the pure-layer "central directory walk" test above).
function _pbpZipEntries(bytes) {
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const eocdOff = bytes.length - 22;
  const count = dv.getUint16(eocdOff + 8, true);
  let rec = dv.getUint32(eocdOff + 16, true);
  const dec = new TextDecoder();
  const out = [];
  for (let i = 0; i < count; i++) {
    const nameLen = dv.getUint16(rec + 28, true);
    const extraLen = dv.getUint16(rec + 30, true);
    const commentLen = dv.getUint16(rec + 32, true);
    const method = dv.getUint16(rec + 10, true);
    const lhOff = dv.getUint32(rec + 42, true);
    const lhNameLen = dv.getUint16(lhOff + 26, true);
    const lhExtraLen = dv.getUint16(lhOff + 28, true);
    const size = dv.getUint32(lhOff + 22, true);
    const dataStart = lhOff + 30 + lhNameLen + lhExtraLen;
    out.push({ name: dec.decode(bytes.slice(rec + 46, rec + 46 + nameLen)), method, data: bytes.slice(dataStart, dataStart + size) });
    rec += 46 + nameLen + extraLen + commentLen;
  }
  return out;
}

// Async (Blob.arrayBuffer()) -- the section runs inside one IIFE whose promise
// the trailing summary
// script awaits, so #summary/#results only settle once every check() below
// has actually run (no false-early "N passed" while assertions are pending).
window._pbpEpubIntegrationDone = (async () => {
  const meta = { title: "Test Article", url: "https://example.com/a", clipped: "2026-07-12", lang: "en" };

  // Group A: no images -> mimetype first+stored, exactly the 6 required entries
  // (A8: OEBPS/styles.css joins the fixed set) (5 assertions).
  const zip1 = new Uint8Array(await pbpBuildEpub({ md: "## Intro\n\nHello world.", meta, images: new Map() }).arrayBuffer());
  const dv1 = new DataView(zip1.buffer);
  assertEq(dv1.getUint32(0, true), 0x04034b50, "pbpBuildEpub zip starts with a local file header signature");
  assertEq(dv1.getUint16(8, true), 0, "pbpBuildEpub first entry (mimetype) uses stored (method 0)");
  assertEq(new TextDecoder().decode(zip1.slice(30, 38)), "mimetype", "pbpBuildEpub first entry's name is literally 'mimetype'");
  const names1 = _pbpZipEntries(zip1).map(e => e.name);
  assertEq(JSON.stringify(names1),
    JSON.stringify(["mimetype", "META-INF/container.xml", "OEBPS/content.opf", "OEBPS/nav.xhtml", "OEBPS/styles.css", "OEBPS/content.xhtml"]),
    "pbpBuildEpub with no images produces exactly the 6 required entries, mimetype first: " + names1.join(", "));

  // Group B: frontmatter + highlights forced off (spec F5) -> content.xhtml carries
  // no YAML block and no literal "==" mark, even though highlights are non-empty
  // (i.e. the "## Highlights" aggregation section IS present -- only the inline
  // "==...==" mark and YAML frontmatter are suppressed). Mirrors the handler's own
  // composeExport call in md-preview.js.
  const hlItems = [{ quote: "important insight", color: 1 }];
  const composedMd = composeExport("## Section\n\nSome important insight text here.", meta, {
    frontmatter: false, highlightsInline: false, highlights: hlItems, imagePolicy: "keep"
  });
  const zip2 = new Uint8Array(await pbpBuildEpub({ md: composedMd, meta, images: new Map() }).arrayBuffer());
  const contentXhtml2 = new TextDecoder().decode(_pbpZipEntries(zip2).find(e => e.name === "OEBPS/content.xhtml").data);
  assert(!/^---$/m.test(contentXhtml2), "content.xhtml carries no YAML frontmatter '---' block: " + contentXhtml2.slice(0, 200));
  assert(!contentXhtml2.includes("=="), "content.xhtml has no literal ==...== inline-highlight mark: " + contentXhtml2.slice(0, 200));

  // Group C: heading id backfill (empty-slug punctuation heading + id-less raw HTML
  // heading) + nav.xhtml anchors correspond 1:1, in order, to content.xhtml heading
  // ids; both files parse as well-formed XHTML (7 assertions).
  const headingMd = ["## !!!", "", "Punctuation-only heading paragraph.", "",
    "<h3>Raw HTML Heading</h3>", "", "Raw HTML heading paragraph.", "",
    "## Normal Heading", "", "Normal heading paragraph."].join("\n");
  const zip3 = new Uint8Array(await pbpBuildEpub({ md: headingMd, meta, images: new Map() }).arrayBuffer());
  const entries3 = _pbpZipEntries(zip3);
  const contentXhtml3 = new TextDecoder().decode(entries3.find(e => e.name === "OEBPS/content.xhtml").data);
  const navXhtml3 = new TextDecoder().decode(entries3.find(e => e.name === "OEBPS/nav.xhtml").data);
  const parser = new DOMParser();
  const contentDoc3 = parser.parseFromString(contentXhtml3, "application/xhtml+xml");
  assertEq(contentDoc3.getElementsByTagName("parsererror").length, 0,
    "content.xhtml parses as well-formed XHTML (no parsererror): " + contentXhtml3.slice(0, 300));
  const navDoc3 = parser.parseFromString(navXhtml3, "application/xhtml+xml");
  assertEq(navDoc3.getElementsByTagName("parsererror").length, 0,
    "nav.xhtml parses as well-formed XHTML (no parsererror): " + navXhtml3.slice(0, 300));
  const headingEls3 = [...contentDoc3.querySelectorAll("h2, h3, h4")];
  assertEq(headingEls3.length, 3, "content.xhtml has all 3 headings (punctuation h2, raw-HTML h3, normal h2)");
  const [hPunct, hRaw, hNormal] = headingEls3;
  assert(!!hPunct && hPunct.id.startsWith("pbp-h-"),
    "punctuation-only heading (slugify -> empty) gets a backfilled pbp-h-N id: " + (hPunct && hPunct.id));
  assert(!!hRaw && hRaw.id.startsWith("pbp-h-"),
    "raw-HTML heading (marked never assigns it an id) gets a backfilled pbp-h-N id: " + (hRaw && hRaw.id));
  assert(!!hNormal && hNormal.id && !hNormal.id.startsWith("pbp-h-"),
    "an ordinary heading keeps its natural slug id, not a backfilled one: " + (hNormal && hNormal.id));
  const navHrefs3 = [...navDoc3.querySelectorAll("a")].map(a => a.getAttribute("href"));
  const expectedHrefs3 = headingEls3.map(h => "content.xhtml#" + h.id);
  assertEq(JSON.stringify(navHrefs3), JSON.stringify(expectedHrefs3),
    "nav.xhtml anchors correspond 1:1, in order, to content.xhtml heading ids: " + navHrefs3.join(", "));

  // Group D: images Map -> zip gets an images/ entry and the XHTML src is
  // rewritten from the absolute URL to the relative images/ path (2 assertions).
  const images4 = new Map([["https://cdn.example.com/pic.jpg", { mime: "image/jpeg", bytes: new Uint8Array([1, 2, 3, 4]) }]]);
  const zip4 = new Uint8Array(await pbpBuildEpub({ md: "![alt text](https://cdn.example.com/pic.jpg)", meta, images: images4 }).arrayBuffer());
  const entries4 = _pbpZipEntries(zip4);
  assert(!!entries4.find(e => e.name === "OEBPS/images/img-0.jpg"),
    "pbpBuildEpub zip contains an OEBPS/images/img-0.jpg entry for a fetched image: " + entries4.map(e => e.name).join(", "));
  const contentXhtml4 = new TextDecoder().decode(entries4.find(e => e.name === "OEBPS/content.xhtml").data);
  assert(contentXhtml4.includes('src="images/img-0.jpg"') && !contentXhtml4.includes("https://cdn.example.com/pic.jpg"),
    "content.xhtml's <img> src is rewritten from the absolute URL to the relative images/ path: " + contentXhtml4);

  // Group E: remote-resources (Codex-C2) -- an <img src="https://..."> left
  // unembedded (default "keep" policy, permission denied, or a partial embed
  // failure all reach pbpBuildEpub with `images` not covering that URL) means
  // EPUB3 requires the content document be declared via manifest
  // properties="remote-resources", or epubcheck fails (1 assertion).
  const zip5 = new Uint8Array(await pbpBuildEpub({ md: "![alt](https://cdn.example.com/unfetched.png)", meta, images: new Map() }).arrayBuffer());
  const opf5 = new TextDecoder().decode(_pbpZipEntries(zip5).find(e => e.name === "OEBPS/content.opf").data);
  const contentItem5 = (opf5.match(/<item id="content"[^>]*\/>/) || [""])[0];
  assert(contentItem5.includes('properties="remote-resources"'),
    'content manifest item gets properties="remote-resources" when a remote <img> stays unembedded: ' + contentItem5);

  // Group F: fully-embedded doc (Group D's images4 case) must NOT declare
  // remote-resources -- no <img src="http..."> is left in the DOM (1 assertion).
  const opf4 = new TextDecoder().decode(entries4.find(e => e.name === "OEBPS/content.opf").data);
  assert(!opf4.includes("remote-resources"), "fully-embedded doc's manifest carries no remote-resources property: " + opf4);

  // Group G: encodeURI fallback (Fable-A) -- marked encodeURI()s the href it
  // renders, so a source URL containing non-ASCII characters lands percent-
  // encoded in the DOM's src attribute even though `images` is keyed by the
  // raw absolute URL. The exact-match querySelectorAll misses; the
  // encodeURI(absUrl) retry must still find and rewrite it (2 assertions).
  const cjkUrl = "https://cdn.example.com/中文图.jpg";
  const images7 = new Map([[cjkUrl, { mime: "image/jpeg", bytes: new Uint8Array([9, 9]) }]]);
  const zip7 = new Uint8Array(await pbpBuildEpub({ md: `![alt](${cjkUrl})`, meta, images: images7 }).arrayBuffer());
  const entries7 = _pbpZipEntries(zip7);
  assert(!!entries7.find(e => e.name === "OEBPS/images/img-0.jpg"),
    "encodeURI-mismatched src still resolves via the encoded-URL fallback and gets a real zip entry: " + entries7.map(e => e.name).join(", "));
  const contentXhtml7 = new TextDecoder().decode(entries7.find(e => e.name === "OEBPS/content.xhtml").data);
  assert(contentXhtml7.includes('src="images/img-0.jpg"'),
    "content.xhtml src is rewritten to the relative images/ path via the encodeURI fallback match: " + contentXhtml7);

  // Group H: an images Map entry with no matching <img> in the DOM at all
  // (neither the raw nor the encodeURI-encoded src) must be skipped entirely --
  // no manifest item, no zip entry (an orphan zip entry fails epubcheck) (2 assertions).
  const images8 = new Map([["https://cdn.example.com/never-referenced.png", { mime: "image/png", bytes: new Uint8Array([1]) }]]);
  const zip8 = new Uint8Array(await pbpBuildEpub({ md: "no images here", meta, images: images8 }).arrayBuffer());
  const entries8 = _pbpZipEntries(zip8);
  assert(!entries8.find(e => e.name.startsWith("OEBPS/images/")),
    "unmatched images Map entry produces no images/ zip entry: " + entries8.map(e => e.name).join(", "));
  const opf8 = new TextDecoder().decode(entries8.find(e => e.name === "OEBPS/content.opf").data);
  assert(!/id="img0"/.test(opf8), "unmatched images Map entry gets no manifest item either: " + opf8);
})();
</script>

<script>
section("A8: EPUB minimal stylesheet");
window._pbpEpubA8Done = (async () => {
  check("A8 PBP_EPUB_CSS exists and covers tables",
    typeof PBP_EPUB_CSS === "string" && /border-collapse/.test(PBP_EPUB_CSS) && /overflow-wrap:anywhere/.test(PBP_EPUB_CSS), String(typeof PBP_EPUB_CSS));
  const opf = pbpEpubContentOpf({ title: "t", url: "https://e.com" }, [
    { id: "nav", href: "nav.xhtml", mediaType: "application/xhtml+xml", properties: "nav" },
    { id: "content", href: "content.xhtml", mediaType: "application/xhtml+xml" },
    { id: "css", href: "styles.css", mediaType: "text/css" },
  ]);
  check("A8 manifest can carry styles.css", /href="styles\.css" media-type="text\/css"/.test(opf), opf);

  // Real-product assertions (round-1 fix): a blob-size threshold is
  // non-discriminative -- a bare EPUB is already >2KB, so it stays true
  // whether or not any of the three integration points actually wired the
  // stylesheet in. Read the zip pbpBuildEpub actually produced instead.
  const blob = pbpBuildEpub({ md: "# T\n\n|a|b|\n|---|---|\n|1|2|", meta: { title: "t", url: "https://e.com" } });

<script>

(() => {

  check("B3 labels no longer leak as loose prose", !/(^|\n)Start(\n|$)/.test(md.replace(/data:image[^)]*/g, "")), md);
  check("B3 serialized svg carries xmlns", /xmlns="http:\/\/www\.w3\.org\/2000\/svg"/.test(b3decode(md)), b3decode(md).slice(0, 200));
  check("B3 svg root sized from viewBox (no explicit width/height on source)",

(() => {
  check("B3 icon-size svg still dropped", !/data:image\/svg/.test(htmlToMarkdown('<p>t</p><svg width="16" height="16"><path d="M0 0h16v16z"/></svg>')), "");
  check("B3 unsized svg still dropped", !/data:image\/svg/.test(htmlToMarkdown('<p>t</p><svg><path d="M0 0h500v500z"/></svg>')), "");

(() => {
  const md = htmlToMarkdown('<svg viewBox="0 0 200 100"><script>alert(1)<\/script><a href="https://evil.com" onclick="x()"><text x="1" y="10">L</text></a><use href="#g"/></svg>');

(() => {
  let d = "M0 0"; while (d.length < 310000) d += " L9 9";
  check("B3 oversize svg dropped at the byte cap", !/data:image\/svg/.test(htmlToMarkdown('<svg viewBox="0 0 100 100"><path d="' + d + '"/></svg><p>x</p>')), "");

(() => {

})();
(() => {
  // pbpB64Utf8 round-trip at the 300KB serialized cap, multi-byte UTF-8
  // included (a naive spread-based btoa would blow the arg stack at this

  let src = "图表 → "; // "图表 → " (CJK + arrow, multi-byte)

<script>

  const spanned = "text `\\begin{aligned}` more";

  check("\\tag{...} is removed", N("$$a=b\\tag{3.1}$$") === "$$a=b$$");
  check("size commands are removed", N("$$\\Huge x + \\tiny y$$") === "$$x + y$$");
  check("unknown env is untouched",
    N("\\begin{customthing}\nx\n\\end{customthing}") === "\\begin{customthing}\nx\n\\end{customthing}");
  check("plain currency survives byte-identical", N("costs $5 and $6 today") === "costs $5 and $6 today");
  const once = N("intro\n\\begin{align*}\na &= b\n\\end{align*}\nafter $$\\bbox{q}\\tag{1}$$");
  check("idempotent: N(N(x)) === N(x)", N(once) === once);
  const mlspan = "text `$$\\Huge x\n= y$$` more";
  check("multi-line code span is untouched", N(mlspan) === mlspan);
  const mlenv = "a `x\n\\begin{aligned}\ny` b";
  check("line-start env inside a multi-line span is not wrapped", N(mlenv) === mlenv);

  check("no control bytes ever leak", !/\x00/.test(N("one `a\nb` two `c\nd` three")));

<script>
// Task 1: Wikipedia math -- data-latex extraction, header-row inference,
// TeX escape protection (real-device bug: raw uppercase LaTeX text instead
// of rendered formulas on zh.wikipedia.org/wiki/数学).
section("mathml: Defuddle data-latex form");
(function () {
  const mk = (html) => { const d = document.createElement("div"); d.innerHTML = html; return d.innerHTML; };
  const inline = htmlToMarkdown('<math display="inline" data-latex="{\\displaystyle P\\Rightarrow Q\\,}">{\\displaystyle P\\Rightarrow Q\\,}</math>', {});
  // Backslashes are DOUBLED here (_pbpTexForMarkdown, fix 3c) so marked's
  // CommonMark escaping hands the original single-backslash TeX back out --
  // see "TeX survives table-cell escaping" below and task-1-report.md. Match
  // 2 literal backslashes per command, not 1.
  check("data-latex inline yields $-wrapped tex", /\$\{\\\\displaystyle P\\\\Rightarrow Q\\\\,\}\$/.test(inline));
  const block = htmlToMarkdown('<math display="block" data-latex="x^2">x^2</math>', {});
  check("data-latex block yields $$-wrapped tex", block.includes("$$x^2$$"));
  const alt = htmlToMarkdown('<math alttext="a+b">ignored</math>', {});
  check("alttext still wins when present", alt.includes("$a+b$"));
  const ann = htmlToMarkdown('<math><annotation encoding="application/x-tex">c+d</annotation></math>', {});
  check("annotation still works", ann.includes("$c+d$"));
  const none = htmlToMarkdown('<math>plain</math>', {});
  check("no tex source degrades to text, not $$", !none.includes("$"));
})();

section("table: synthetic header only when the source has one");
(function () {
  const withTh = htmlToMarkdown("<table><tr><th>H</th><th>I</th></tr><tr><td>a</td><td>b</td></tr></table>", {});
  check("explicit th keeps the GFM header separator", withTh.includes("| --- |"));
  const withThead = htmlToMarkdown("<table><thead><tr><td>H</td></tr></thead><tbody><tr><td>a</td></tr></tbody></table>", {});
  check("thead counts as a header signal", withThead.includes("| --- |"));
  const noHeader = htmlToMarkdown("<table><tr><td>x</td><td>y</td></tr><tr><td>a</td><td>b</td></tr></table>", {});
  check("header-less table gets no synthetic header row", !noHeader.includes("| --- |"));
  // Fix round 1 (HIGH defect from review): GFM only recognizes a pipe block
  // as a table when a header separator row is present, so the naive fix
  // (drop the separator, keep pipe syntax) made marked/GFM stop recognizing
  // the block as a table AT ALL -- it degraded to a <p> full of literal "|"
  // characters (verified by the reviewer executing real marked.min.js). That
  // gap existed because the ORIGINAL assertions here were markdown-level only
  // and passed while rendering was broken. Headerless simple tables now route
  // through the same sanitized raw-HTML passthrough complex tables use (see
  // _pbpSanitizeComplexTableHtml) -- assert both the markdown-level shape
  // (raw <table> HTML, not pipe syntax) AND the rendered-level shape.
  check("header-less table emits raw HTML, not broken pipe syntax",
    /<table[\s>]/i.test(noHeader) && !noHeader.includes("|"));
  check("header-less table still carries both rows' cell text",
    noHeader.includes(">x<") && noHeader.includes(">y<") && noHeader.includes(">a<") && noHeader.includes(">b<"));
  const renderedNoHeader = renderMarkdown(noHeader);
  check("header-less table still renders as a real table", /<table/i.test(renderedNoHeader));
  check("header-less table renders no th", !/<th[\s>]/i.test(renderedNoHeader));
  check("header-less table does not leak literal pipes", !/<p[^>]*>[^<]*\|/i.test(renderedNoHeader));
  const renderedWithTh = renderMarkdown(withTh);
  check("header table still renders th", /<th[\s>]/i.test(renderedWithTh));
})();

section("transcript paragraph shapes vs marked block syntax");
(() => {
  // WHY md-video.js cannot match paragraph records to <p> by count: a
  // transcript paragraph whose FIRST characters read as block markdown does
  // not render as one direct-child <p>. Real caption shapes: a dialogue
  // dash, a sentence starting with a number, a ">>" speaker marker, a line
  // the AI punctuation pass turned into a heading.
  const recs = [
    "welcome back to the channel today",
    "- and then he said okay",
    "3. the third one is the interesting one",
    ">> SPEAKER: hello everyone",
    "## 5 is the number we want",
