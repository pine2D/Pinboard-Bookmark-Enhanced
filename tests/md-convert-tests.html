<html><head><meta charset="UTF-8"><title>md-convert Tests</title>
<style>
body { font-family: monospace; padding: 16px; max-width: 1000px; }

.pass { color: #0a0; }
.fail { color: #c00; font-weight: bold; }

<body>
<h1>md-convert.js tests</h1>
<div id="summary"></div>
<div id="results"></div>

<script>
const root = document.getElementById("results");
let pass = 0, fail = 0;
function check(name, cond, detail) {
  const ok = !!cond;
  ok ? pass++ : fail++;
  const div = document.createElement("div");
  div.className = "case " + (ok ? "pass" : "fail");
  div.textContent = `${ok ? "✓" : "✗"}  ${name}${ok ? "" : "\n   " + (detail || "")}`;
  root.appendChild(div);
}
// normalize whitespace for resilient HTML substring checks
const norm = (h) => h.replace(/\s+/g, " ").trim();

// ---- P2+ harness helpers (wrap check() so plan code blocks run verbatim) ----
function section(name) {
  const h = document.createElement("h2");
  h.textContent = name;
  root.appendChild(h);
}
function assert(cond, detail) {
  check(detail || String(cond), cond, detail);
}
function assertEq(actual, expected, label) {
  const ok = actual === expected;
  check(label || (String(expected) + " === " + String(actual)), ok,
    ok ? "" : "expected " + JSON.stringify(expected) + " got " + JSON.stringify(actual));
}

// ---- Regression: the FOUR old renderMarkdown defects are now correct ----

// 1. Nested list must NOT be flattened.
(() => {
  const h = norm(renderMarkdown("- a\n  - b\n  - c\n- d"));
  // a <ul> nested inside an <li> proves nesting survived
  check("nested list keeps nesting", /<li>a\s*<ul>/.test(h), h);
})();

// 2. Multi-line blockquote -> one blockquote, both lines, not a literal newline in one <p>.
(() => {
  const h = norm(renderMarkdown("> line one\n> line two"));
  const oneBq = (h.match(/<blockquote>/g) || []).length === 1;
  check("multi-line blockquote merges", oneBq && /line one/.test(h) && /line two/.test(h), h);
})();

// 3. ** inside inline code must stay literal (not become <strong>).
(() => {
  const h = norm(renderMarkdown("use `a**b**c` here"));
  check("** inside inline code stays literal", /<code>a\*\*b\*\*c<\/code>/.test(h) && !/<strong>/.test(h), h);
})();

// 4. GFM task list [x] -> checked checkbox that survives DOMPurify.
(() => {
  const h = norm(renderMarkdown("- [x] done\n- [ ] todo"));
  const hasInput = /<input[^>]*type="checkbox"/.test(h);
  const hasChecked = /<input[^>]*checked/.test(h);
  check("task list renders checkbox input", hasInput && hasChecked, h);
})();

// ---- Heading slug id (renderer + slugify), incl CJK ----
(() => {
  const h = norm(renderMarkdown("## Hello World\n\n## 中文 标题"));
  check("heading gets slug id", /<h2 id="hello-world">/.test(h), h);
  check("heading slug keeps CJK", /<h2 id="中文-标题">/.test(h), h);
})();

// ---- Dedup smoke: htmlToMarkdown exists once and both contexts use the SAME global ----
(() => {
  check("htmlToMarkdown is a single global function",
    typeof htmlToMarkdown === "function", "typeof = " + typeof htmlToMarkdown);
  check("markdownToPlainText moved here (single global)",
    typeof markdownToPlainText === "function", "typeof = " + typeof markdownToPlainText);
  // round-trip proves the consolidated Turndown rules are live in this one definition
  const md = htmlToMarkdown("<h1>Title</h1><pre><code class=\"language-js\">x=1</code></pre><table><tr><th>A</th></tr><tr><td>1</td></tr></table>", { baseUrl: "https://e.com" });
  check("htmlToMarkdown emits atx heading", /^# Title/m.test(md), md);
  check("htmlToMarkdown emits fenced code with lang", /```js\n/.test(md), md);
  check("htmlToMarkdown emits pipe table", /\|\s*A\s*\|/.test(md) && /\|\s*---\s*\|/.test(md), md);
})();

// ---- Security: renderMarkdown is the lone sanitize point (XSS closed) ----
(() => {
  const s = norm(renderMarkdown("a <script>alert(1)<\/script> b"));
  check("renderMarkdown strips <script>", !/<script/i.test(s) && !/alert\(1\)/.test(s), s);
})();
(() => {
  const s = norm(renderMarkdown('text <img src="x" onerror="alert(1)"> end'));
  check("renderMarkdown strips img onerror", /<img/i.test(s) && !/onerror/i.test(s), s);
})();
(() => {
  const html = renderMarkdown('<img src="https://cdn.example.com/image.png" referrerpolicy="unsafe-url" alt="diagram">');
  check("renderMarkdown forces no-referrer on retained remote images",
    /src="https:\/\/cdn\.example\.com\/image\.png"/.test(html) &&
    /referrerpolicy="no-referrer"/.test(html) && !/unsafe-url/.test(html), html);
})();
(() => {
  const s = norm(renderMarkdown('<svg><image href="https://cdn.example.com/svg.png"></image></svg><image href="https://cdn.example.com/orphan.png"><video poster="https://cdn.example.com/poster.png"><source src="https://cdn.example.com/movie.mp4"></video><div style="background-image:url(https://cdn.example.com/style.png)" background="https://cdn.example.com/legacy.png">safe text</div>'));
  check("raw SVG and media subresources cannot bypass image no-referrer policy",
    s.includes("safe text") &&
    !/<svg|<image|<video|<source|style=|background=|poster=|cdn\.example\.com/i.test(s), s);
})();
(() => {
  const s = norm(renderMarkdown("[x](javascript:alert(1))"));
  check("renderMarkdown neutralizes javascript: link", !/javascript:/i.test(s), s);
})();
(() => {
  const s = norm(renderMarkdown("<iframe src=\"https://evil\"></iframe>"));
  check("renderMarkdown drops iframe", !/<iframe/i.test(s), s);
})();
(() => {
  const s = norm(renderMarkdown('<a href="javascript:void(document.cookie)">raw</a>'));
  check("renderMarkdown neutralizes raw <a> javascript: href", !/javascript:/i.test(s), s);
})();
(() => {
  const s = norm(renderMarkdown("[ok](https://example.com)"));
  check("renderMarkdown safe link gets target+rel", /rel="noopener noreferrer"/.test(s) && /target="_blank"/.test(s), s);
})();

// ---- Form controls / style element are dropped from the reading surface ----
(() => {
  const s = norm(renderMarkdown("窄屏时侧栏变 <select>,分组如何映射(optgroup?)"));
  check("renderMarkdown drops a literal <select> instead of rendering a live control (2026-07-15 repro)",
    !/<select/i.test(s) && /窄屏时侧栏变/.test(s) && /分组如何映射/.test(s), s);
})();
(() => {
  const s = norm(renderMarkdown('<form action="https://evil"><fieldset><legend>L</legend><label>N<textarea>t</textarea></label><select><option>o1</option></select><button>go</button><output>42</output><dialog open>d</dialog></form>'));
  check("renderMarkdown drops the whole form-control family but keeps text content",
    !/<form|<fieldset|<legend|<label|<textarea|<select|<option|<button|<output|<dialog/i.test(s) &&
    /o1/.test(s) && /go/.test(s), s);
})();
(() => {
  const s = norm(renderMarkdown('x <style>#rendered-view{display:none}</style> y'));
  check("renderMarkdown drops <style> ELEMENTS (FORBID_ATTR only covers the attribute)",
    !/<style/i.test(s) && !/display:none/.test(s), s);
})();
(() => {
  const s = norm(renderMarkdown('- [x] done task'));
  check("GFM task-list checkbox still survives the form-control purge (disabled)",
    /<input[^>]*type="checkbox"[^>]*disabled/i.test(s) || /<input[^>]*disabled[^>]*type="checkbox"/i.test(s), s);
})();
(() => {
  const s = norm(renderMarkdown('<details><summary>more</summary>body</details>'));
  check("details/summary stay (content-semantic collapsibles)",
    /<details/i.test(s) && /<summary/i.test(s), s);
})();

// ---- D1-1/D1-2: sanitize hardening (id-clobber + input allowlist) ----
(() => {
  const s = norm(renderMarkdown('before <input type="text" id="ask-input" value="x"> after'));
  check("renderMarkdown drops non-checkbox <input> but KEEPS sibling text (NodeIterator survives removeChild)",
    !/<input/i.test(s) && /before/.test(s) && /after/.test(s), s);
})();
(() => {
  const s = norm(renderMarkdown('<div id="ask-input">x</div>'));
  check("renderMarkdown keeps non-heading element but strips clobber id",
    /<div>x<\/div>/.test(s) && !/id="ask-input"/.test(s), s);
})();
(() => {
  const s = norm(renderMarkdown('<a id="ask-input" href="https://e.com">x</a>'));
  check("renderMarkdown strips id from <a> but keeps href + target/rel",
    !/id="ask-input"/.test(s) && /href="https:\/\/e\.com"/.test(s) &&
    /target="_blank"/.test(s) && /rel="noopener noreferrer"/.test(s), s);
})();
(() => {
  const h = norm(renderMarkdown("## Hello World"));
  check("renderMarkdown keeps id on real heading (h1-h6 exempt from id-strip)",
    /<h2 id="hello-world">/.test(h), h);
})();
(() => {
  // TOC fragment anchor must still resolve after the id-strip hardening.
  const md = "## Hello World\n\n[jump](#hello-world)";
  const { headings } = buildToc(md, { minLevel: 2, maxLevel: 4 });
  const fixture = document.createElement("div");
  fixture.innerHTML = renderMarkdown(md);
  check("buildToc slug still resolves to a rendered heading id after hardening",
    headings.length === 1 && fixture.querySelector("#" + headings[0].slug) !== null,
    JSON.stringify(headings) + " | " + fixture.innerHTML);
})();
(() => {
  const h = norm(renderMarkdown("- [ ] a\n- [x] b"));
  const inputs = h.match(/<input[^>]*>/g) || [];
  check("renderMarkdown emits 2 task-list checkboxes", inputs.length === 2, h);
  check("every surviving checkbox is forced disabled",
    inputs.length > 0 && inputs.every((tag) => /disabled/.test(tag)), h);
  check("every surviving checkbox keeps type=checkbox",
    inputs.length > 0 && inputs.every((tag) => /type="checkbox"/.test(tag)), h);
})();
(() => {
  // regression: fragment hrefs stay same-tab (no target/rel), unaffected by the
  // afterSanitizeAttributes refactor (early-return removed to let id-strip run).
  const s = norm(renderMarkdown("## Section\n\n[jump](#section)"));
  const aTag = (s.match(/<a[^>]*href="#section"[^>]*>/) || [""])[0];
  check("renderMarkdown fragment link keeps no target/rel",
    !!aTag && !/target=/.test(aTag) && !/rel=/.test(aTag), s);
})();

// ---- K55: class token allowlist (untrusted markdown must not be able to wear
// the reader's own chrome class names). renderMarkdown is the lone sanitize
// point for model output (Ask / skim / translate / dict / video notes) AND for
// Jina Reader markdown, neither of which passes through turndown's attribute
// scrub -- so `class` gets the same reject-by-default treatment `id` already
// has. The allowlist is derived from what THIS pipeline emits into the
// sanitizer's input string (marked's language-*, renderer.table's
// pb-table-wrap, _pbpGalleryGridHtml's pbp-gallery), never from CSS.
(() => {
  const s = norm(renderMarkdown('<div class="rail-scrim">x</div>'));
  check("renderMarkdown strips a chrome class name (.rail-scrim is a fixed, inset:0 full-viewport overlay)",
    /<div>x<\/div>/.test(s) && !/class=/.test(s), s);
})();
(() => {
  const s = norm(renderMarkdown('<div class="confirm-popover"><span class="confirm-msg">session expired</span></div>'));
  check("renderMarkdown strips the fake-confirm-popover chrome classes but keeps the text",
    !/class=/.test(s) && /session expired/.test(s), s);
})();
(() => {
  const s = norm(renderMarkdown('<p class="some-unknown-class">t</p>'));
  check("renderMarkdown drops an unlisted class token and leaves NO empty class attribute behind",
    /<p>t<\/p>/.test(s) && !/class/.test(s), s);
})();
(() => {
  const s = norm(renderMarkdown('<div class="language-js rail-scrim">x</div>'));
  check("mixed class attribute keeps ONLY the allowlisted token (per-token filter, not all-or-nothing)",
    /class="language-js"/.test(s) && !/rail-scrim/.test(s), s);
})();
(() => {
  const s = norm(renderMarkdown("```js\nconst x = 1;\n```"));
  check("fenced code keeps marked's language-js (highlightCodeBlocks reads it back)",
    /<code class="language-js">/.test(s), s);
})();
(() => {
  const s = norm(renderMarkdown("```mermaid\ngraph TD;A-->B;\n```"));
  check("mermaid fence keeps language-mermaid (md-mermaid.js's only selector)",
    /<code class="language-mermaid">/.test(s), s);
})();
(() => {
  // marked v18 emits NO class on GFM task items (the sole class= in
  // vendor/marked.min.js is language-*), so task lists are pinned on the
  // checkbox they really render, not on a task-list-item class they never had.
  const s = norm(renderMarkdown("- [x] done\n- [ ] todo"));
  check("GFM task list still renders both checkboxes under the class allowlist",
    (s.match(/<input[^>]*type="checkbox"/g) || []).length === 2 && !/class=/.test(s), s);
})();
(() => {
  const s = norm(renderMarkdown("| a | b |\n| --- | --- |\n| 1 | 2 |"));
  check("renderMarkdown keeps renderer.table's pb-table-wrap through sanitize",
    /<div class="pb-table-wrap">/.test(s), s);
})();
(() => {
  const s = norm(renderMarkdown("| a | b |\n| :-- | --: |\n| 1 | 2 |"));
  check("table column alignment survives (marked emits align= as an ATTRIBUTE, untouched by the class filter)",
    /align="left"/.test(s) && /align="right"/.test(s), s);
})();
(() => {
  const galleryMd = htmlToMarkdown('<ul class="gallery">' +
    '<li><img src="https://e.com/1.jpg" alt="one"><p>Cap one</p></li>' +
    '<li><img src="https://e.com/2.jpg" alt="two"><p>Cap two</p></li>' +
    '<li><img src="https://e.com/3.jpg" alt="three"><p>Cap three</p></li>' +
    '</ul>', {});
  const s = norm(renderMarkdown(galleryMd));
  check("renderMarkdown keeps _pbpGalleryGridHtml's pbp-gallery through sanitize",
    /<div class="pbp-gallery">/.test(s) && /<figure>/.test(s), s);
})();

// ---- END of existing tests ----

  // ---- safeFilename (shared download helper) ----
  section("safeFilename");
  (() => {
    assertEq(safeFilename("a:b/c*d"), "a_b_c_d", "punctuation -> underscore");
    assertEq(safeFilename("标题 x"), "标题 x", "keeps CJK and spaces");
    assertEq(safeFilename(""), "untitled", "empty -> untitled");
    assertEq(safeFilename("x".repeat(100)).length, 80, "caps at 80 chars");
    assert(typeof downloadFile === "function", "downloadFile is a shared global");
  })();

</script>

<script>
  // ---- buildObsidianUri (obsidian://new URI builder) ----
  section("buildObsidianUri");
  (() => {
    try {
      assertEq(buildObsidianUri({ name: "My Note" }), "obsidian://new?file=My%20Note", "basic name");
      assertEq(buildObsidianUri({ name: "N", folder: "Clips" }), "obsidian://new?file=Clips%2FN", "folder joined, slash encoded");
      assertEq(buildObsidianUri({ name: "N", folder: "/a/b/" }), "obsidian://new?file=a%2Fb%2FN", "folder slashes trimmed");
      assert(/&vault=My%20Vault/.test(buildObsidianUri({ name: "N", vault: "My Vault" })), "vault encoded");
      const clip = buildObsidianUri({ name: "N", clipboard: true });
      assert(/&clipboard/.test(clip) && !/&content=/.test(clip), "clipboard mode: &clipboard, no &content");
      const cont = buildObsidianUri({ name: "N", clipboard: false, content: "# Hi & bye" });
      assert(/&content=%23%20Hi%20%26%20bye/.test(cont) && !/&clipboard/.test(cont), "content mode: encoded &content, no &clipboard");
      assertEq(buildObsidianUri({ name: "N", append: true }), "obsidian://new?file=N&append", "append flag");
      assertEq(buildObsidianUri({ action: "daily", vault: "V", clipboard: true, append: true }), "obsidian://daily?vault=V&clipboard&append", "daily action uses daily endpoint");
      assertEq(buildObsidianUri({}), "obsidian://new?file=Untitled", "empty opts -> Untitled");
    } catch (e) {
      assert(false, "buildObsidianUri threw: " + e.message);
    }
  })();
</script>

<script>
  section("P2.1 applyFrontmatter / yamlString");

  // yamlString escapes quotes, colons, newlines
  assertEq(yamlString('Plain title'), '"Plain title"', "wraps plain in quotes");
  assertEq(yamlString('Has: colon'), '"Has: colon"', "quotes colon");
  assertEq(yamlString('Quote "x"'), '"Quote \\"x\\""', "escapes inner quotes");
  assertEq(yamlString('Line1\nLine2'), '"Line1\\nLine2"', "escapes newline");

  // Full block with all fields
  const fm1 = applyFrontmatter("# Body\n", {
    title: 'A: "quoted"',
    url: "https://e.com/p",
    date: "2026-06-03",
    tags: ["dev", "go"],
    source: "defuddle",
    description: "Desc: with colon"
  }, {});
  assert(fm1.startsWith("---\n"), "starts with fence");
  assert(fm1.includes('title: "A: \\"quoted\\""'), "title escaped");
  assert(fm1.includes("url: https://e.com/p"), "url bare");
  assert(fm1.includes("date: 2026-06-03"), "date bare");
  assert(fm1.includes('tags: ["dev", "go"]'), "tags inline array, one quoted scalar per tag");
  assert(fm1.includes("source: defuddle"), "source bare");
  assert(fm1.includes('description: "Desc: with colon"'), "description escaped");
  assert(fm1.includes("\n---\n\n# Body"), "closes fence then body");

  // description omitted when absent
  const fm2 = applyFrontmatter("body", { title: "T", url: "u", date: "d", tags: [], source: "jina" }, {});
  assert(!fm2.includes("description:"), "no description field when absent");
  assert(fm2.includes("tags: []"), "empty tags renders empty array");

  // Pinboard splits tags on whitespace ONLY, so ",", "[", "]", '"' and "#"
  // are all legal characters inside a single tag. Bare flow-sequence items
  // silently split "a,b" into two tags, and one unbalanced bracket or quote
  // breaks the whole front matter (Obsidian then drops title/url/date too).
  const fmMeta = applyFrontmatter("body", { tags: ["a,b", "[wip]", 'say "hi"', "c#"] }, { fields: ["tags"] });
  assert(fmMeta.includes('tags: ["a,b", "[wip]", "say \\"hi\\"", "c#"]'),
    "YAML meta-characters stay inside one quoted scalar per tag");

  // fields option restricts + orders output
  const fm3 = applyFrontmatter("body", { title: "T", url: "u", date: "d", tags: ["a"], source: "x" }, { fields: ["url", "title"] });
  const lines3 = fm3.split("\n");
  assertEq(lines3[1], "url: u", "field order honored (url first)");
  assertEq(lines3[2], 'title: "T"', "field order honored (title second)");
  assert(!fm3.includes("source:"), "excluded field absent");
</script>

<script>
  section("P2.2 applyImagePolicy");
  const base = "https://e.com/blog/post/";

  // keep: absolutize relative src, leave absolute untouched
  const keep = applyImagePolicy("![a](pics/x.png) ![b](https://cdn.io/y.png) ![c](/z.png)", { policy: "keep", baseUrl: base });
  assert(keep.includes("![a](https://e.com/blog/post/pics/x.png)"), "relative src absolutized");
  assert(keep.includes("![b](https://cdn.io/y.png)"), "absolute src untouched");
  assert(keep.includes("![c](https://e.com/z.png)"), "root-relative src absolutized");

  // alt: ![alt](url) -> alt text; drop image entirely when no alt
  const alt = applyImagePolicy("see ![my pic](pics/x.png) and ![](pics/y.png) end", { policy: "alt", baseUrl: base });
  assert(alt.includes("see my pic and  end"), "alt kept, empty-alt image removed: " + alt);
  assert(!alt.includes("!["), "no image syntax remains");

  // strip: remove all images
  const strip = applyImagePolicy("a ![x](pics/x.png) b ![y](z.png) c", { policy: "strip", baseUrl: base });
  assert(!strip.includes("!["), "no images remain");
  assert(strip.includes("a ") && strip.includes(" b ") && strip.includes(" c"), "surrounding text intact: " + strip);

  // invalid/unparseable relative src under keep is left as-is (no throw)
  const safe = applyImagePolicy("![a](::::)", { policy: "keep", baseUrl: base });
  assert(safe.includes("![a]("), "unparseable src does not throw and is preserved");
</script>

<script>
  section("P2.3 buildToc");

  const tocMd = [
    "# Title (h1 skipped)",
    "## First Section",
    "text",
    "### Sub A",
    "#### Deep",
    "##### Too deep (skipped, >maxLevel)",
    "```",
    "## Fake heading in code",
    "```",
    "## 中文 标题"
  ].join("\n");

  const { tocMarkdown, headings } = buildToc(tocMd, { minLevel: 2, maxLevel: 4 });

  // h1 excluded (below minLevel), h5 excluded (above maxLevel), fenced heading skipped
  assertEq(headings.length, 4, "4 headings in range: " + JSON.stringify(headings.map(h => h.text)));
  assertEq(headings[0].text, "First Section", "first heading text");
  assertEq(headings[0].level, 2, "first heading level");
  assertEq(headings[0].slug, "first-section", "slug uses P1 slugify");
  assertEq(headings[1].text, "Sub A", "nested heading text");
  assertEq(headings[3].text, "中文 标题", "CJK heading captured");
  assertEq(headings[3].slug, "中文-标题", "CJK slug preserves CJK (P1 slugify)");
  assert(!headings.some(h => h.text.includes("Fake heading")), "fenced code heading skipped");

  // tocMarkdown is a nested bullet list under "## Contents", indented by (level-minLevel)
  assert(tocMarkdown.startsWith("## Contents\n"), "TOC header present");
  assert(tocMarkdown.includes("- [First Section](#first-section)"), "top-level entry, no indent");
  assert(tocMarkdown.includes("  - [Sub A](#sub-a)"), "level-3 entry indented 2 spaces");
  assert(tocMarkdown.includes("    - [Deep](#deep)"), "level-4 entry indented 4 spaces");

  // empty input -> empty toc, empty headings
  const none = buildToc("just a paragraph", {});
  assertEq(none.headings.length, 0, "no headings");
  assertEq(none.tocMarkdown, "", "empty tocMarkdown when no headings");
</script>

<script>
  section("P2.4 readingStats");

  // Pure Latin: markdown markup stripped first, word count from plain text
  const lat = readingStats("# Heading\n\n**Hello** world this is a [link](http://x) test.");
  assertEq(lat.words, 8, "latin word count after markdownToPlainText (Heading Hello world this is a link test): " + JSON.stringify(lat));
  assertEq(lat.cjkChars, 0, "no CJK chars");
  assertEq(lat.minutes, 1, "ceil(8/200 + 0/350) = 1");

  // CJK: counted per character, not per whitespace word
  const cjk = readingStats("这是一段中文文本");
  assertEq(cjk.cjkChars, 8, "8 CJK chars");
  assertEq(cjk.words, 0, "no latin words");
  assertEq(cjk.minutes, 1, "ceil(0 + 8/350) = 1");

  // Mixed: latin words + CJK chars combine in minutes
  const mixed = readingStats("hello 世界 world 测试 done");
  assertEq(mixed.words, 3, "3 latin words (hello world done)");
  assertEq(mixed.cjkChars, 4, "4 CJK chars (世界测试)");
  assertEq(mixed.minutes, 1, "ceil(3/200 + 4/350)=1");

  // Larger volume crosses minute boundary
  const big = readingStats(Array(420).fill("word").join(" "));
  assertEq(big.words, 420, "420 words");
  assertEq(big.minutes, 3, "ceil(420/200)=3");

  // Empty
  const empty = readingStats("");
  assertEq(empty.words, 0, "empty words");

<script>

  const full = composeExport(cmd, cmeta, { frontmatter: true, imagePolicy: "keep", includeToc: true });
  assert(full.startsWith("---\n"), "frontmatter first");
  const afterFm = full.split("\n---\n\n")[1] || full;

  assert(full.includes("![pic](https://e.com/blog/post/pics/x.png)"), "image absolutized via baseUrl=url");

  // All off: raw body only, no frontmatter, no TOC, images untouched (keep is default off path)
  const bare = composeExport(cmd, cmeta, { frontmatter: false, imagePolicy: "keep", includeToc: false });
  assert(!bare.startsWith("---"), "no frontmatter");
  assert(!bare.includes("## Contents"), "no TOC");
  assert(bare.includes("## Section One"), "body present");

  // strip policy removes images even with frontmatter/toc off
  const stripped = composeExport(cmd, cmeta, { frontmatter: false, imagePolicy: "strip", includeToc: false });
  assert(!stripped.includes("!["), "images stripped");

  const altd = composeExport("![cap](rel.png)", cmeta, { frontmatter: false, imagePolicy: "alt", includeToc: false });
  assertEq(altd.trim(), "cap", "alt policy uses meta.url baseUrl, yields alt text");

  // ---- H2 highlights branch (spec sec.5) ----
  const hlItems = [

    { id: "b", n: 2, quote: "body text", prefix: "", suffix: "", color: 4, note: "", ts: 2 }
  ];

  // Regression guard: absent highlights -> byte-identical to the pre-H2 baseline captured above.
  const noHl = composeExport(cmd, cmeta, { frontmatter: false, imagePolicy: "keep", includeToc: false });
  assertEq(noHl, bare, "composeExport with no opts.highlights is byte-identical to the pre-H2 bare case");
  const emptyHl = composeExport(cmd, cmeta, { frontmatter: false, imagePolicy: "keep", includeToc: false, highlights: [] });
  assertEq(emptyHl, bare, "composeExport with opts.highlights:[] is byte-identical to the pre-H2 bare case");

  assert(htmlPath.includes("## Highlights"), "section still appended when highlightsInline:false");

  const styled = composeStyledHtml(cmd, cmeta, { frontmatter: false, imagePolicy: "keep", includeToc: false, hljsCss: "", highlights: hlItems });

<script>
  // ---- P3.2b hljs SUBSET narrowing + long-block prefix probe (K14; needs
  // vendor/highlight.min.js). md-convert.js's top-level functions/consts are
  // plain globals (this file is a classic <script>, not a module), so the
  // private helpers _pbpConfigureHljs/_pbpTaggedLanguagesIn/PBP_HLJS_SUBSET/
  // PBP_HLJS_LONGBLOCK_PREFIX are reachable directly for spying/inspection. ----
  section("P3.2b hljs SUBSET + long-block prefix probe (K14)");
  (() => {
    // Deterministic, decisively-Python text, well past the 4KB prefix threshold.
    function pyGen(minLen) {
      let out = "", i = 0;
      while (out.length <= minLen) { out += "def handler_" + i + "(x):\n    return x + " + i + "\n\n"; i++; }
      return out;
    }
    const longPy = pyGen(PBP_HLJS_LONGBLOCK_PREFIX + 500);

    // -- A: configure called once per page (not once per block), and merges
    // a language this article already tags explicitly (dynamic merge) --
    (() => {
      const fixtureA = document.createElement("div");
      // "graphql" is a real language in the vendored hljs build (per
      // hljs.listLanguages()) but is NOT in PBP_HLJS_SUBSET — used nowhere
      // else in this test file, so it forces a genuinely new effective set
      // and guarantees hljs.configure() actually runs for this call.
      fixtureA.innerHTML =
        '<pre><code class="language-graphql">query { user { id } }</code></pre>' +
        '<pre><code>short untagged one</code></pre>' +
        '<pre><code>short untagged two</code></pre>' +
        '<pre><code>short untagged three</code></pre>';
      const origConfigure = hljs.configure;
      const calls = [];
      hljs.configure = function (opts) { calls.push(opts); return origConfigure.call(this, opts); };
      try {
        highlightCodeBlocks(fixtureA); // 4 blocks in ONE pass
      } finally {
        hljs.configure = origConfigure;
      }
      check("hljs.configure called exactly once for a 4-block pass (not once per block)",
        calls.length === 1, "calls=" + calls.length);
      check("hljs.configure's languages list dynamically merges this article's tagged 'graphql'",
        calls.length === 1 && Array.isArray(calls[0].languages) && calls[0].languages.includes("graphql"),
        calls.length ? JSON.stringify(calls[0]) : "<not called>");
      check("hljs.configure's languages list still carries PBP_HLJS_SUBSET (generous, not narrowed away)",
        calls.length === 1 && calls[0].languages.includes("python") && calls[0].languages.includes("javascript"),
        calls.length ? JSON.stringify(calls[0].languages) : "<not called>");

      // Idempotent: a second, separate render with the SAME effective set
      // (same tagged language, nothing new) must NOT call hljs.configure again.
      const fixtureA2 = document.createElement("div");
      fixtureA2.innerHTML = '<pre><code class="language-graphql">query { id }</code></pre>';
      const calls2 = [];
      hljs.configure = function (opts) { calls2.push(opts); return origConfigure.call(this, opts); };
      try {
        highlightCodeBlocks(fixtureA2);
      } finally {
        hljs.configure = origConfigure;
      }
      check("hljs.configure is idempotent: unchanged effective set skips a repeat real call",
        calls2.length === 0, "calls2=" + calls2.length);
    })();

    // -- B: long untagged block (> PBP_HLJS_LONGBLOCK_PREFIX) is probed on
    // just its PREFIX and the detected language is written back -- //
    (() => {
      const fixtureB = document.createElement("div");
      const pre = document.createElement("pre");
      const code = document.createElement("code");
      code.textContent = longPy;
      pre.appendChild(code);
      fixtureB.appendChild(pre);
      check("long fixture block is actually longer than the prefix threshold (sanity)",
        code.textContent.length > PBP_HLJS_LONGBLOCK_PREFIX, "len=" + code.textContent.length);

      const origAuto = hljs.highlightAuto;
      const autoCalls = [];
      hljs.highlightAuto = function (...args) { autoCalls.push(args); return origAuto.apply(this, args); };
      try {
        highlightCodeBlocks(fixtureB);
      } finally {
        hljs.highlightAuto = origAuto;
      }
      check("long untagged block triggers exactly one prefix probe via hljs.highlightAuto",
        autoCalls.length === 1, "highlightAuto calls=" + autoCalls.length);
      check("the probe is given ONLY the first PBP_HLJS_LONGBLOCK_PREFIX chars, not the whole block",
        autoCalls.length === 1 && autoCalls[0][0].length === PBP_HLJS_LONGBLOCK_PREFIX,
        autoCalls.length ? ("probed length=" + autoCalls[0][0].length) : "<not called>");
      check("long untagged block gets a language-<detected> class written back",
        /(?:^|\s)language-\S+/.test(code.className), "className=" + code.className);
      check("long untagged block is fully highlighted (hljs class + token spans) after prefix-probe tagging",
        code.classList.contains("hljs") && code.querySelector("span[class*='hljs-']") !== null,
        "className=" + code.className);
    })();

    // -- C: short untagged block (<= PBP_HLJS_LONGBLOCK_PREFIX) is UNCHANGED:
    // the prefix probe must not fire (hljs's own existing full-text
    // auto-detect inside highlightElement — which does not go through the
    // public hljs.highlightAuto — still highlights it as before). --
    (() => {
      const fixtureC = document.createElement("div");
      const pre = document.createElement("pre");
      const code = document.createElement("code");
      code.textContent = "def small(x):\n    return x + 1\n";
      pre.appendChild(code);
      fixtureC.appendChild(pre);
      check("short fixture block is at or under the prefix threshold (sanity)",
        code.textContent.length <= PBP_HLJS_LONGBLOCK_PREFIX, "len=" + code.textContent.length);

      const origAuto = hljs.highlightAuto;
      const autoCalls = [];
      hljs.highlightAuto = function (...args) { autoCalls.push(args); return origAuto.apply(this, args); };
      try {
        highlightCodeBlocks(fixtureC);
      } finally {
        hljs.highlightAuto = origAuto;
      }
      check("short untagged block never reaches the prefix probe (hljs.highlightAuto not called by our code)",
        autoCalls.length === 0, "highlightAuto calls=" + autoCalls.length);
      check("short untagged block is still highlighted via hljs's own unchanged auto-detect path",
        code.classList.contains("hljs") && code.querySelector("span[class*='hljs-']") !== null,
        "className=" + code.className);
    })();

    // -- D: a block already tagged with a language outside PBP_HLJS_SUBSET
    // still highlights correctly (SUBSET only narrows AUTO-detection; an
    // explicit language-xxx class always resolves its own grammar directly). --
    (() => {
      const fixtureD = document.createElement("div");
      fixtureD.innerHTML = '<pre><code class="language-graphql">query { viewer { id } }</code></pre>';
      highlightCodeBlocks(fixtureD);
      const codeEl = fixtureD.querySelector("pre > code");
      check("tagged exotic language (graphql, outside SUBSET) still highlights after narrowing",
        !!codeEl && codeEl.classList.contains("hljs") && codeEl.querySelector("span[class*='hljs-']") !== null,
        codeEl ? codeEl.className : "<no code el>");
    })();

    // -- E: the prefix-probe boundary is exactly PBP_HLJS_LONGBLOCK_PREFIX.
    // B/C above sit far on either side of 4096, so neither would catch an
    // off-by-one (e.g. `text.length < PBP_HLJS_LONGBLOCK_PREFIX` instead of
    // `<=`) flipping the boundary itself: a block AT the threshold must stay
    // unprobed, one character past it must be probed. --
    (() => {
      const atThreshold = pyGen(PBP_HLJS_LONGBLOCK_PREFIX).slice(0, PBP_HLJS_LONGBLOCK_PREFIX);
      const overThreshold = atThreshold + "x";
      check("boundary fixtures are exactly PBP_HLJS_LONGBLOCK_PREFIX and PBP_HLJS_LONGBLOCK_PREFIX + 1 chars (sanity)",
        atThreshold.length === PBP_HLJS_LONGBLOCK_PREFIX && overThreshold.length === PBP_HLJS_LONGBLOCK_PREFIX + 1,
        "at=" + atThreshold.length + " over=" + overThreshold.length);

      const makeFixture = (text) => {
        const root = document.createElement("div");
        const pre = document.createElement("pre");
        const code = document.createElement("code");
        code.textContent = text;
        pre.appendChild(code);
        root.appendChild(pre);
        return root;
      };
      const origAuto = hljs.highlightAuto;

      const atCalls = [];
      hljs.highlightAuto = function (...args) { atCalls.push(args); return origAuto.apply(this, args); };
      try {
        highlightCodeBlocks(makeFixture(atThreshold));
      } finally {
        hljs.highlightAuto = origAuto;
      }
      check("a block AT exactly PBP_HLJS_LONGBLOCK_PREFIX chars is NOT prefix-probed",
        atCalls.length === 0, "highlightAuto calls=" + atCalls.length);

      const overCalls = [];
      hljs.highlightAuto = function (...args) { overCalls.push(args); return origAuto.apply(this, args); };
      try {
        highlightCodeBlocks(makeFixture(overThreshold));
      } finally {
        hljs.highlightAuto = origAuto;
      }
      check("a block ONE character over PBP_HLJS_LONGBLOCK_PREFIX IS prefix-probed",
        overCalls.length === 1 && overCalls[0][0].length === PBP_HLJS_LONGBLOCK_PREFIX,
        "highlightAuto calls=" + overCalls.length);
    })();
  })();
</script>

<script>
  // ---- P3.2c same two K14 techniques on the CHUNKED (preview, rAF) path ----
  section("P3.2c highlightCodeBlocksChunked SUBSET + prefix probe (K14, async)");
  window._pbpHljsChunkedK14Done = (async () => {
    function pyGen(minLen) {
      let out = "", i = 0;
      while (out.length <= minLen) { out += "def handler_" + i + "(x):\n    return x + " + i + "\n\n"; i++; }
      return out;
    }
    const fixture = document.createElement("div");
    const pre = document.createElement("pre");
    const code = document.createElement("code");
    code.textContent = pyGen(PBP_HLJS_LONGBLOCK_PREFIX + 500);
    pre.appendChild(code);
    fixture.appendChild(pre);
    document.body.appendChild(fixture); // detached roots never get an rAF tick in some engines; attach for the wait

    // Spy on the PUBLIC hljs.highlightAuto — confirmed elsewhere in this file
    // (P3.2b sub-test B/C) that hljs.highlightElement()'s OWN internal
    // full-text auto-detect does NOT go through this public method, so a
    // call here can only be OUR prefix probe, not old unchanged behavior
    // (which would leave a language-<detected> class too, but via a
    // different internal path — a bare "gets a class" assertion can't tell
    // the two apart; this can).
    const origAuto = hljs.highlightAuto;
    const autoCalls = [];
    hljs.highlightAuto = function (...args) { autoCalls.push(args); return origAuto.apply(this, args); };

    highlightCodeBlocksChunked(fixture);
    // Poll for the async rAF pass to finish instead of guessing a frame count.
    const deadline = Date.now() + 3000;
    while (!code.classList.contains("hljs") && Date.now() < deadline) {
      await new Promise((r) => requestAnimationFrame(() => setTimeout(r, 0)));
    }
    hljs.highlightAuto = origAuto;
    check("highlightCodeBlocksChunked's untagged-block branch also runs the prefix probe (not full-text auto-detect)",
      autoCalls.length === 1 && autoCalls[0][0].length === PBP_HLJS_LONGBLOCK_PREFIX,
      autoCalls.length ? ("calls=" + autoCalls.length + " probedLen=" + autoCalls[0][0].length) : "hljs.highlightAuto not called");
    check("highlightCodeBlocksChunked writes the probed language back onto the block",
      /(?:^|\s)language-\S+/.test(code.className), "className=" + code.className);
    check("highlightCodeBlocksChunked highlights the long block (hljs class + token spans)",
      code.classList.contains("hljs") && code.querySelector("span[class*='hljs-']") !== null,
      "className=" + code.className);
    fixture.remove();
  })();
</script>

    check("A4 link href/target + img src/alt survive", /href="https:\/\/e\.com\/p"/.test(md) && /target="_blank"/.test(md) && /src="https:\/\/e\.com\/i\.png"/.test(md) && /alt="pic"/.test(md), md);
    check("A4 on* stripped", !/onclick/.test(md), md);
    check("A4 javascript: href still stripped", !/javascript:/.test(htmlToMarkdown('<table><tbody><tr><td colspan="2"><a href="javascript:x()">j</a></td></tr></tbody></table>')), "");
    // F2: B3's data-URI diagram images land in complex tables too (a mermaid
    // fence or inline SVG inside a merged-cell table) -- the data: protocol
    // check must not strip an image data URI, only javascript:/vbscript: and
    // non-image data: (e.g. data:text/html).
    check("A4 data-URI image src survives (B3 diagrams inside complex tables)",
      /<img src="data:image\/svg\+xml;base64,PHN2Zy8\+" alt="d">/.test(
        htmlToMarkdown('<table><tbody><tr><td colspan="2"><img src="data:image/svg+xml;base64,PHN2Zy8+" alt="d"></td></tr></tbody></table>')
      ), "");
  })();
  section("A5: colspan/rowspan survive renderMarkdown end-to-end");
  (() => {
    const h = norm(renderMarkdown('<table><tbody><tr><th colspan="2">H</th></tr><tr><td rowspan="2">a</td><td>b</td></tr></tbody></table>'));
    check("A5 colspan survives the DOMPurify pass", /colspan="2"/.test(h), h);
    check("A5 rowspan survives the DOMPurify pass", /rowspan="2"/.test(h), h);
  })();

  // ---- Raw-HTML passthrough vs marked's HTML-block terminator ----
  // A passthrough block is handed to marked as a block-level HTML block, and
  // CommonMark's type-6 HTML block ENDS at the first blank line. turndown's
  // whitespace collapse is no protection: <pre> is its isPre exception, so a
  // cell holding a multi-paragraph code sample kept its literal blank line --
  // marked then closed the block early and re-parsed the table's own closing
  // tags as markdown (visible "</pre></td>…</table>" text in the reading
  // surface, every later cell silently dropped, same breakage in Download
  // .html / EPUB since both route through renderMarkdown).
  section("raw-HTML passthrough survives a blank line inside a <pre> cell");
  (() => {
    const src = '<table><tr><th colspan="2">S</th></tr>' +
      '<tr><td><pre>def f():\n\n    return 1</pre></td><td>b</td></tr></table>';
    const md = htmlToMarkdown(src, {});
    check("complex-table passthrough emits no literal newline for marked to break on",
      !md.trim().includes("\n"), JSON.stringify(md));
    const holder = document.createElement("div");
    holder.innerHTML = renderMarkdown(md);
    const pre = holder.querySelector("pre");
    check("the <pre> cell keeps its blank line byte-for-byte",
      !!pre && pre.textContent === "def f():\n\n    return 1",
      pre ? JSON.stringify(pre.textContent) : "no <pre> rendered");
    const cells = Array.from(holder.querySelectorAll("td")).map((td) => td.textContent);
    check("the cell AFTER the <pre> cell survives",
      cells.length === 2 && cells[1] === "b", JSON.stringify(cells));
    check("no closing tag leaks into the reading surface as literal text",
      !/<\/(?:td|tr|tbody|table|pre)>/.test(holder.textContent), holder.textContent);

    // Same passthrough class, second surface. <pre> is the only newline that
    // reaches a gallery caption -- turndown's collapseWhitespace flattens the
    // source's inter-block newlines everywhere else -- so that is what the
    // fixture carries, exactly as in the table case above.
    const galleryMd = htmlToMarkdown('<ul class="gallery">' +
      '<li><img src="pic-a.png" alt="a"><pre>a\n\nb</pre></li>' +
      '<li><img src="pic-b.png" alt="b"><p>Cap B</p></li>' +
      '<li><img src="pic-c.png" alt="c"><p>Cap C</p></li>' +
      "</ul>");
    check("gallery passthrough emits no literal newline either",
      /class="pbp-gallery"/.test(galleryMd) && !galleryMd.trim().includes("\n"), JSON.stringify(galleryMd));
  })();

  // ---- Image galleries: MediaWiki ul.gallery -> a raw-HTML grid, not a
  // "- " markdown list (zh.wikipedia.org/wiki/数学 repro, 2026-08-21) ----
  section("htmlToMarkdown image gallery grid (pbp-gallery)");
  (() => {
    // Class-based detection path (site-rules extraction keeps the source
    // page's own class -- Defuddle strips it, see the structural-heuristic
    // case below). Mirrors MediaWiki's real ul.gallery.mw-gallery-traditional
    // > li.gallerybox > (div.thumb>span>a>img) + div.gallerytext shape.
    const galleryHtml = '<ul class="gallery mw-gallery-traditional">' +
      '<li class="gallerybox"><div class="thumb"><span><a href="/wiki/File:A.jpg"><img src="https://e.com/a.jpg" alt="A" width="120" height="120"></a></span></div><div class="gallerytext"><p>Caption A</p></div></li>' +
      '<li class="gallerybox"><div class="thumb"><span><a href="/wiki/File:B.jpg"><img src="https://e.com/b.jpg" alt="B" width="120" height="120"></a></span></div><div class="gallerytext"><p>Caption <a href="/wiki/B">B link</a></p></div></li>' +
      '<li class="gallerybox"><div class="thumb"><span><a href="/wiki/File:C.jpg"><img src="https://e.com/c.jpg" alt="C" width="120" height="120"></a></span></div><div class="gallerytext"><p>Caption C</p></div></li>' +
      '</ul>';
    const md = htmlToMarkdown(galleryHtml, { baseUrl: "https://e.com/" });
    check("gallery ul emits a pbp-gallery raw-HTML block, no markdown list marker",
      /class="pbp-gallery"/.test(md) && !/^-\s/m.test(md), md);
    check("each li becomes figure+figcaption with its img src preserved",
      (md.match(/<figure>/g) || []).length === 3 && (md.match(/<figcaption>/g) || []).length === 3 &&
      /<img src="https:\/\/e\.com\/a\.jpg"/.test(md) && /<img src="https:\/\/e\.com\/b\.jpg"/.test(md), md);
    check("a link inside a caption (gallerytext) survives, absolutized like any other link",
      /<a href="https:\/\/e\.com\/wiki\/B">B link<\/a>/.test(md), md);

    // Structural-heuristic path: no "gallery" class (the Defuddle path),
    // but >=3 li, each with exactly one img and a short own-text caption.
    const structHtml = '<ul>' +
      '<li><img src="https://e.com/1.jpg" alt="one">One</li>' +
      '<li><img src="https://e.com/2.jpg" alt="two">Two</li>' +
      '<li><img src="https://e.com/3.jpg" alt="three">Three</li>' +
      '</ul>';
    const structMd = htmlToMarkdown(structHtml);
    check("structural heuristic (no class, >=3 one-img short-caption li) also grids",
      /class="pbp-gallery"/.test(structMd) && (structMd.match(/<figure>/g) || []).length === 3, structMd);

    // Negative: an ordinary list must NOT be force-gridded just because it
    // happens to embed one image per item -- the heuristic's <=80-char own-
    // text bound is what tells a gallery caption apart from real prose.
    const longListHtml = '<ul>' +
      '<li><img src="https://e.com/1.jpg" alt="one">This is a much longer descriptive sentence that easily exceeds the eighty character short-caption budget for the gallery heuristic.</li>' +
      '<li><img src="https://e.com/2.jpg" alt="two">Another long descriptive sentence that also exceeds the eighty character budget used by this same heuristic check.</li>' +
      '<li><img src="https://e.com/3.jpg" alt="three">A third long descriptive sentence that likewise exceeds the eighty character budget used above here.</li>' +
      '</ul>';
    const longListMd = htmlToMarkdown(longListHtml);
    check("ordinary list with long per-item prose is NOT force-gridded",
      /^-\s/m.test(longListMd) && !/class="pbp-gallery"/.test(longListMd), longListMd);

    // Negative: an ordinary list with no images at all.
    const noImgMd = htmlToMarkdown('<ul><li>Alpha</li><li>Beta</li><li>Gamma</li></ul>');
    check("ordinary list without images is NOT force-gridded",
      /^-\s/m.test(noImgMd) && !/class="pbp-gallery"/.test(noImgMd), noImgMd);

    // Malicious attributes (on gallerybox li, on the image itself, and a
    // javascript: caption link) are stripped by the SAME allowlist scrub
    // the complex-table passthrough uses (_pbpStripDisallowedAttrs).
    const evilHtml = '<ul class="gallery">' +
      '<li onclick="alert(1)"><img src="https://e.com/x.jpg" alt="x" onerror="alert(2)"><p>Cap <a href="javascript:alert(3)">bad</a></p></li>' +
      '<li><img src="https://e.com/y.jpg" alt="y"><p>Cap y</p></li>' +
      '<li><img src="https://e.com/z.jpg" alt="z"><p>Cap z</p></li>' +
      '</ul>';
    const evilMd = htmlToMarkdown(evilHtml);
    check("gallery strips onclick/onerror and a javascript: caption href",
      !/onclick|onerror|javascript:/i.test(evilMd) && /class="pbp-gallery"/.test(evilMd), evilMd);

    // Render layer: the raw HTML block survives marked+DOMPurify as an
    // actual grid -- no <li> anywhere, unlike the old markdown-list output.
    const rendered = norm(renderMarkdown(md));
    check("renderMarkdown keeps the pbp-gallery div + figure, no <li> in the output",
      /<div class="pbp-gallery">/.test(rendered) && /<figure>/.test(rendered) && !/<li[\s>]/.test(rendered), rendered);

    // K17 (task 9): PBP_GALLERY_ATTRS now allows width/height through the
    // gallery raw-HTML passthrough, so Defuddle's intrinsic image size
    // survives instead of being stripped by _pbpStripDisallowedAttrs -- the
    // browser then knows the aspect ratio before decode and the grid's row
    // height settles without a reflow (see the comment on PBP_GALLERY_ATTRS).
    // Uppercase WIDTH/HEIGHT confirms the HTML parser normalizes attribute
    // names to lowercase before turndown / _pbpStripDisallowedAttrs ever see
    // them (the scrub's own attr.name.toLowerCase() is a second, redundant
    // safety net -- either mechanism alone is enough).
    const sizedGalleryHtml = '<ul class="gallery">' +
      '<li><img src="https://e.com/w.jpg" alt="w" width="640" height="480"><p>Cap W</p></li>' +
      '<li><img src="https://e.com/x.jpg" alt="x" WIDTH="640" HEIGHT="480"><p>Cap X</p></li>' +
      '<li><img src="https://e.com/y.jpg" alt="y"><p>Cap Y (no size)</p></li>' +
      '</ul>';
    const sizedMd = htmlToMarkdown(sizedGalleryHtml);
    check("gallery img keeps width/height through the raw-HTML passthrough",
      /<img src="https:\/\/e\.com\/w\.jpg"[^>]*\bwidth="640"[^>]*\bheight="480"/.test(sizedMd), sizedMd);
    check("gallery img with uppercase WIDTH/HEIGHT source attrs also survives (parser lower-cases attr names)",
      /<img src="https:\/\/e\.com\/x\.jpg"[^>]*\bwidth="640"[^>]*\bheight="480"/.test(sizedMd), sizedMd);
    check("gallery img with no source size stays sizeless (nothing invented)",
      !/src="https:\/\/e\.com\/y\.jpg"[^>]*\b(?:width|height)=/.test(sizedMd), sizedMd);
    const sizedRendered = norm(renderMarkdown(sizedMd));
    check("renderMarkdown keeps width/height on the gallery img after marked+DOMPurify",
      /<img[^>]*src="https:\/\/e\.com\/w\.jpg"[^>]*width="640"[^>]*height="480"/.test(sizedRendered), sizedRendered);

    // Non-gallery path is untouched: canonical markdown for an ordinary
    // (non-gallery, non-figure) image goes through turndown's default img
    // rule -- ![alt](src) -- which has no width/height syntax at all, so a
    // source img's size attributes never reach the markdown or the render.
    const plainImgHtml = '<p><img src="https://e.com/plain.jpg" alt="plain" width="640" height="480"></p>';
    const plainMd = htmlToMarkdown(plainImgHtml);
    check("a non-gallery image's canonical markdown carries no width/height (marked has no syntax for it)",
      /!\[plain\]\(https:\/\/e\.com\/plain\.jpg\)/.test(plainMd) && !/width=|height=/.test(plainMd), plainMd);
    const plainRendered = norm(renderMarkdown(plainMd));
    check("a non-gallery image's rendered <img> also has no width/height attribute",
      /<img[^>]*src="https:\/\/e\.com\/plain\.jpg"/.test(plainRendered) && !/<img[^>]*\b(?:width|height)=/.test(plainRendered), plainRendered);

    // A junk width value inside a gallery is harmless either way, but the two
    // sanitize layers disagree on HOW they handle it, empirically confirmed
    // here rather than assumed: _pbpStripDisallowedAttrs only scheme-checks
    // href/src (javascript:/vbscript:/data:), never width/height, so the raw
    // value survives into canonical markdown untouched -- it was never a live
    // href/src to begin with, so nothing executes at that stage regardless.
    // DOMPurify, at render time, DOES strip it: its generic attribute-value
    // scan removes anything shaped like a dangerous URI scheme (javascript:)
    // from ANY attribute, not just src/href-typed ones -- so the width
    // attribute itself disappears from #rendered-view while the sibling
    // height="480" (a plain numeric value) survives untouched. Net effect:
    // strips it, consistently, at the sanitize point that actually matters
    // (what reaches the DOM) -- never allows it through to render.
    const junkGalleryHtml = '<ul class="gallery">' +
      '<li><img src="https://e.com/j.jpg" alt="j" width="javascript:alert(1)" height="480"><p>Cap J</p></li>' +
      '<li><img src="https://e.com/k.jpg" alt="k"><p>Cap K</p></li>' +
      '<li><img src="https://e.com/l.jpg" alt="l"><p>Cap L</p></li>' +
      '</ul>';
    const junkMd = htmlToMarkdown(junkGalleryHtml);
    check("_pbpStripDisallowedAttrs does not value-scheme-check width (that gate is href/src-only), so the raw value reaches canonical markdown",
      /<img[^>]*src="https:\/\/e\.com\/j\.jpg"[^>]*width="javascript:alert\(1\)"/.test(junkMd), junkMd);
    const junkRendered = norm(renderMarkdown(junkMd));
    check("DOMPurify strips the junk width attribute entirely at render time; the legitimate height sibling survives",
      /<img[^>]*src="https:\/\/e\.com\/j\.jpg"[^>]*height="480"/.test(junkRendered) && !/\bwidth=/.test(junkRendered.match(/<img[^>]*src="https:\/\/e\.com\/j\.jpg"[^>]*>/)[0]),
      junkRendered);
    check("the junk width value never becomes a live href/src or a script/event handler in the rendered DOM",
      !/onerror|onload|<script/i.test(junkRendered), junkRendered);
  })();

  // ---- GitHub alerts: Defuddle -> Obsidian callout (data-callout) -> > [!TYPE] ----
  section("htmlToMarkdown GitHub alert (callout) restore");
  (() => {
    const tip = htmlToMarkdown('<div data-callout="tip" class="callout"><div class="callout-title"><div class="callout-title-inner">Tip</div></div> <p dir="auto">Questions? Email <strong><a href="mailto:x@e.com">x@e.com</a></strong>.</p> </div>', {});
    check("tip callout -> > [!TIP] with inline formatting preserved",
      /^> \[!TIP\]/m.test(tip) && /\*\*\[x@e\.com\]\(mailto:x@e\.com\)\*\*/.test(tip), tip);
    const note = htmlToMarkdown('<div data-callout="note" class="callout"><div class="callout-title"><div class="callout-title-inner">Note</div></div><p>Line one.</p><p>Line two.</p></div>', {});
    check("multi-paragraph callout quotes every line",
      /> \[!NOTE\]/.test(note) && /> Line one\./.test(note) && /> Line two\./.test(note), note);
  })();

  // ---- Relative a[href] absolutized against opts.baseUrl (site-rule content keeps
  // the page's relative links; without this they'd resolve to chrome-extension://) ----
  section("htmlToMarkdown relative link absolutization");
  (() => {
    const base = "https://x.com/alice/status/123";
    const md = htmlToMarkdown('<p><a href="/hashtag/pbp">#pbp</a> <a href="#sec">frag</a> ' +
      '<a href="https://abs.example/p">abs</a> <a href="//cdn.example/x">pr</a> <a href="member/1">rel2</a></p>', { baseUrl: base });
    check("root-relative href resolves against origin", md.indexOf("(https://x.com/hashtag/pbp)") !== -1, md);
    check("path-relative href resolves against page path", md.indexOf("(https://x.com/alice/status/member/1)") !== -1, md);
    check("fragment href untouched", md.indexOf("(#sec)") !== -1, md);
    check("absolute href untouched", md.indexOf("(https://abs.example/p)") !== -1, md);
    check("protocol-relative href gets baseUrl's scheme", md.indexOf("(https://cdn.example/x)") !== -1, md);
    const noBase = htmlToMarkdown('<p><a href="/hashtag/pbp">#pbp</a></p>', {});
    check("no baseUrl -> relative href unchanged", noBase.indexOf("(/hashtag/pbp)") !== -1, noBase);
  })();
</script>

<script>
  // ---- composeStyledHtml (standalone styled .html export) ----
  section("composeStyledHtml");
  (() => {
    const meta = { title: "My <Doc>", url: "https://e.com/a", date: "2026-06-04", tags: ["x", "y"], source: "defuddle" };
    const md = "## Intro\n\nHello ![pic](/img.png) world.\n\n```js\nconst a=1;\n```\n";

    const plain = composeStyledHtml(md, meta, { frontmatter: false, imagePolicy: "keep", includeToc: false, hljsCss: "" });
    assert(/^<!DOCTYPE html>/.test(plain), "starts with doctype");
    assert(/<\/html>\s*$/.test(plain), "ends with </html>");
    assert(/<style>[\s\S]*\.export-doc[\s\S]*<\/style>/.test(plain), "inlines READER_CSS");
    assert(/<title>My &lt;Doc&gt;<\/title>/.test(plain), "title is HTML-escaped");
    assert(/<h2 id="intro">/.test(plain), "renders heading with slug id");
    assert(!/doc-header/.test(plain), "no visible header when frontmatter off");

    const stripped = composeStyledHtml(md, meta, { frontmatter: false, imagePolicy: "strip", includeToc: false, hljsCss: "" });
    assert(!/<img/.test(stripped), "imagePolicy:strip removes images");

    const toc = composeStyledHtml(md, meta, { frontmatter: false, imagePolicy: "keep", includeToc: true, hljsCss: "" });
    assert(/<h2 id="contents">/.test(toc), "includeToc injects a Contents heading");

    const fm = composeStyledHtml(md, meta, { frontmatter: true, imagePolicy: "keep", includeToc: false, hljsCss: "" });
    assert(/<header class="doc-header">/.test(fm), "frontmatter renders a VISIBLE header");
    assert(/<h1 class="doc-title">My &lt;Doc&gt;<\/h1>/.test(fm), "header shows escaped title");
    assert(!/^---/m.test(fm.replace(/<[^>]+>/g, "")), "no YAML --- fences in styled HTML");

    assert(/HLJSMARKER/.test(composeStyledHtml(md, meta, { hljsCss: "/*HLJSMARKER*/" })), "injects caller hljsCss");

    // Math (audit E3 gap): Download .html / Copy HTML should match the live preview's
    // KaTeX rendering instead of leaving raw $...$/$$...$$ source in the export.
    const mathMd = "See $E=mc^2$ and\n\n$$x+y=z$$\n";
    const noMathOpt = composeStyledHtml(mathMd, meta, { frontmatter: false, imagePolicy: "keep", includeToc: false, hljsCss: "" });
    assert(/\$E=mc\^2\$/.test(noMathOpt), "opts.math unset: inline TeX source left untouched");
    assert(/\$\$x\+y=z\$\$/.test(noMathOpt), "opts.math unset: display TeX source left untouched");

    const mathOn = composeStyledHtml(mathMd, meta, { frontmatter: false, imagePolicy: "keep", includeToc: false, hljsCss: "", math: true });
    assert(/class="katex/.test(mathOn), "opts.math + KaTeX loaded: renders katex spans");
    assert(!/\$E=mc\^2\$/.test(mathOn), "opts.math on: inline TeX source no longer bare text");

    assert(/KATEXMARKER/.test(composeStyledHtml(md, meta, { hljsCss: "", katexCss: "/*KATEXMARKER*/" })), "injects caller katexCss");

    // Task 2: composeStyledHtml normalizes scraped TeX before parsing, gated on
    // opts.math. This harness DOES load real KaTeX (unlike a bare unit test), so
    // opts.math:true would otherwise consume the source into rendered katex spans
    // before we can see it; renderMathInElement is removed here the same way the
    // degrade test above does, so the (now-normalized) TeX SOURCE lands in the
    // HTML output -- exactly what this asserts.
    (() => {
      const saved = window.renderMathInElement;
      try {
        delete window.renderMathInElement;
        check("composeStyledHtml normalizes TeX when opts.math is set",
          composeStyledHtml("\\begin{align*}\na &= b\n\\end{align*}", { title: "t" }, { math: true })
            .includes("$$\n\\begin{aligned}"));
      } finally {
        window.renderMathInElement = saved;
      }
    })();
    check("composeStyledHtml leaves TeX-shaped text alone without opts.math",
      composeStyledHtml("\\begin{align*}\na &= b\n\\end{align*}", { title: "t" }, {})
        .includes("\\begin{align*}"));

    // Degrade: opts.math requested but renderMathInElement unavailable on the caller's
    // page (e.g. a load failure) must not throw, and the TeX source stays untouched.
    (() => {
      const saved = window.renderMathInElement;
      try {
        delete window.renderMathInElement;
        const degraded = composeStyledHtml(mathMd, meta, { frontmatter: false, imagePolicy: "keep", includeToc: false, hljsCss: "", math: true });
        assert(/\$E=mc\^2\$/.test(degraded), "degrade: KaTeX unavailable -> TeX source untouched, no throw");
      } finally {
        window.renderMathInElement = saved;
      }
    })();

    const evil = composeStyledHtml(md, { ...meta, url: "javascript:alert(1)" }, { frontmatter: true, imagePolicy: "keep", includeToc: false, hljsCss: "" });
    assert(!/href="javascript:/i.test(evil), "non-http(s) url is NOT emitted as an href (XSS guard)");
    assert(/<span>javascript:alert\(1\)<\/span>/.test(evil), "non-http(s) url falls back to a text span");
    const amp = composeStyledHtml(md, { ...meta, url: "https://e.com/?a=1&b=2" }, { frontmatter: true, imagePolicy: "keep", includeToc: false, hljsCss: "" });
    assert(/href="https:\/\/e\.com\/\?a=1&amp;b=2"/.test(amp), "http url & is escaped in the href attribute");
  })();
</script>

<script>
section("site-rules: hacker news");
{
  const HN = '<html><body>' +
    '<table class="fatitem"><tr class="athing" id="1"><td><span class="titleline">' +
      '<a href="https://x.com">The Story Title</a></span></td></tr>' +
      '<tr><td class="subtext"></td></tr></table>' +
    '<table class="comment-tree">' +
      '<tr class="athing comtr" id="c1"><td><table><tr>' +
        '<td class="ind" indent="0"><img src="s.gif" width="0"></td>' +
        '<td class="default"><div class="comhead"><a class="hnuser" href="user?id=alice">alice</a></div>' +
        '<div class="comment"><div class="commtext c00">root comment here</div></div></td>' +
      '</tr></table></td></tr>' +
      '<tr class="athing comtr" id="c2"><td><table><tr>' +
        '<td class="ind" indent="1"><img src="s.gif" width="40"></td>' +
        '<td class="default"><div class="comhead"><a class="hnuser" href="user?id=bob">bob</a></div>' +
        '<div class="comment"><div class="commtext c00">child reply here</div></div></td>' +
      '</tr></table></td></tr>' +
    '</table></body></html>';
  const doc = new DOMParser().parseFromString(HN, "text/html");
  const r = applySiteRule(doc, "https://news.ycombinator.com/item?id=123");
  check("hn → id + forum flag", r && r.id === "hackernews" && r.forum === true, JSON.stringify(r && [r.id, r.forum]));
  check("hn → title", r && r.title === "The Story Title", r && r.title);
  const c = (r && r.contentHtml) || "";
  check("hn → Comments heading (2)", /<h2>Comments \(2\)<\/h2>/.test(c), c);
  check("hn → authors + bodies present", /alice/.test(c) && /bob/.test(c) && /root comment here/.test(c) && /child reply here/.test(c), c);
  check("hn → bob nested under alice", /<blockquote>[\s\S]*alice[\s\S]*<blockquote>[\s\S]*bob[\s\S]*<\/blockquote>[\s\S]*<\/blockquote>/.test(c), c);

  // Dead rows with LIVE deeper replies: the reply must stay under a [dead]
  // placeholder in the dead row's branch, not slide to the previous branch;
  // childless dead rows leave no stub at all.
  const row = (id, ind, user, body, dead) =>
    '<tr class="athing comtr" id="' + id + '"><td><table><tr>' +
    '<td class="ind" indent="' + ind + '"></td>' +
    '<td class="default"><div class="comhead">' + (user ? '<a class="hnuser">' + user + '</a>' : '') + '</div>' +
    '<div class="comment">' + (dead ? '<div class="dead">[dead]</div>' : '<div class="commtext c00">' + body + '</div>') + '</div></td>' +
    '</tr></table></td></tr>';
  const HN2 = '<html><body><table class="fatitem"><tr class="athing"><td><span class="titleline"><a href="https://x.com">T</a></span></td></tr></table>' +
    '<table class="comment-tree">' +
    row("d1", 0, "alice", "branch one root") +
    row("d2", 1, "bob", "reply to alice") +
    row("d3", 1, "mallory", "", true) +          // dead, has a live child
    row("d4", 2, "carol", "reply under dead") +
    row("d5", 0, "", "", true) +                 // dead, childless -> pruned
    '</table></body></html>';
  const d2 = new DOMParser().parseFromString(HN2, "text/html");
  const r2 = applySiteRule(d2, "https://news.ycombinator.com/item?id=9");
  const c2 = (r2 && r2.contentHtml) || "";
  check("hn dead-parent → carol nested directly under the mallory placeholder",
    c2.indexOf("mallory</strong></p><blockquote><p><strong>carol") !== -1, c2);
  check("hn dead rows → excluded from the visible count", /<h2>Comments \(3\)<\/h2>/.test(c2), c2);
  check("hn childless dead row → pruned (4 blockquotes, no [dead] text)",
    (c2.match(/<blockquote>/g) || []).length === 4 && !/\[dead\]/.test(c2), c2);

  // Cap must trip only on LIVE rows: one live comment + a trailing dead row
  // under cap=1 is complete extraction, not truncation.
  window.__PBP_HN_COMMENTS_GLOBAL = 1;
  const HN3 = '<html><body><table class="fatitem"><tr class="athing"><td><span class="titleline"><a href="https://x.com">T</a></span></td></tr></table>' +
    '<table class="comment-tree">' + row("e1", 0, "alice", "only live comment") + row("e2", 0, "", "", true) + '</table></body></html>';
  const d3 = new DOMParser().parseFromString(HN3, "text/html");
  const r3 = applySiteRule(d3, "https://news.ycombinator.com/item?id=8");
  window.__PBP_HN_COMMENTS_GLOBAL = undefined;
  const c3 = (r3 && r3.contentHtml) || "";
  check("hn dead tail row at cap → no false truncation marker",
    /<h2>Comments \(1\)<\/h2>/.test(c3) && !/\(1\+\)/.test(c3) && !/only the first/.test(c3), c3);

  const hnPage = (rows) => '<html><body><table class="fatitem"><tr class="athing"><td><span class="titleline"><a href="https://x.com">T</a></span></td></tr></table>' +
    '<table class="comment-tree">' + rows + '</table></body></html>';

  // Cap genuinely trips on a live row: 3 live under cap=2 -> "(2+)" + note.
  window.__PBP_HN_COMMENTS_GLOBAL = 2;
  const r4 = applySiteRule(new DOMParser().parseFromString(
    hnPage(row("f1", 0, "a1", "one") + row("f2", 0, "a2", "two") + row("f3", 0, "a3", "three")), "text/html"),
    "https://news.ycombinator.com/item?id=7");
  window.__PBP_HN_COMMENTS_GLOBAL = undefined;
  const c4 = (r4 && r4.contentHtml) || "";
  check("hn live cap → (2+) heading, note, first two kept, tail dropped",
    /<h2>Comments \(2\+\)<\/h2>/.test(c4) && /only the first 2 comments/.test(c4) &&
    /one/.test(c4) && /two/.test(c4) && !/three/.test(c4), c4);

  // Beyond maxDepth the chain flattens onto the deepest allowed level —
  // nothing dropped, no deeper blockquote nesting.
  window.__PBP_HN_MAX_DEPTH = 2;
  const r5 = applySiteRule(new DOMParser().parseFromString(
    hnPage(row("g1", 0, "a", "depth zero") + row("g2", 1, "b", "depth one") + row("g3", 2, "cc", "depth two") + row("g4", 3, "dd", "depth three")), "text/html"),
    "https://news.ycombinator.com/item?id=6");
  window.__PBP_HN_MAX_DEPTH = undefined;
  const c5 = (r5 && r5.contentHtml) || "";
  check("hn maxDepth → all bodies kept, flattened to 2 blockquotes in order",
    (c5.match(/<blockquote>/g) || []).length === 2 &&
    /depth zero/.test(c5) && /depth one/.test(c5) && /depth two/.test(c5) && /depth three/.test(c5) &&
    c5.indexOf("depth two") < c5.indexOf("depth three"), c5);

  // Legacy HN rows carry no indent attr — depth comes from spacer img width/40.
  const legacyRow = (id, w, user, body) =>
    '<tr class="athing comtr" id="' + id + '"><td><table><tr>' +
    '<td class="ind"><img src="s.gif" width="' + w + '"></td>' +
    '<td class="default"><div class="comhead"><a class="hnuser">' + user + '</a></div>' +
    '<div class="comment"><div class="commtext c00">' + body + '</div></div></td>' +
    '</tr></table></td></tr>';
  const r6 = applySiteRule(new DOMParser().parseFromString(
    hnPage(legacyRow("h1", 0, "x", "root x") + legacyRow("h2", 40, "y", "child y") + legacyRow("h3", 80, "z", "grand z")), "text/html"),
    "https://news.ycombinator.com/item?id=5");
  const c6 = (r6 && r6.contentHtml) || "";
  check("hn legacy img-width depth → z nested two levels under x",
    (c6.match(/<blockquote>/g) || []).length === 3 &&
    /root x[\s\S]*<blockquote>[\s\S]*child y[\s\S]*<blockquote>[\s\S]*grand z/.test(c6), c6);
}
</script>

<script>
section("site-rules: X/Twitter status");
{
  const X = '<html><head><title>Alice on X</title></head><body>' +
    '<article data-testid="tweet">' +
      '<div data-testid="User-Name"><span>Alice</span><span>@alice</span></div>' +
      '<div data-testid="tweetText"><span>Line one</span><br><span>Line two </span><a href="/hashtag/pbp">#pbp</a></div>' +
      '<time datetime="2026-07-09T01:00:00.000Z">Jul 9</time>' +
    '</article></body></html>';
  const doc = new DOMParser().parseFromString(X, "text/html");
  const r = applySiteRule(doc, "https://x.com/alice/status/1234567890");
  const md = r ? htmlToMarkdown(r.contentHtml, { baseUrl: "https://x.com/alice/status/1234567890" }) : "";
  check("x status → id + title from tweet text", r && r.id === "x-status" && /Line one/.test(r.title), JSON.stringify(r && [r.id, r.title]));
  check("x status → tweet line break survives markdown", /Line one\s{0,2}\n\s*Line two/.test(md), md);
  check("twitter.com status → same extractor", applySiteRule(doc, "https://twitter.com/alice/status/1234567890")?.id === "twitter-status");

  // Reply pages render the parent tweet FIRST; the extractor must pick the
  // article whose own /status/<id> link matches the URL, not document order.
  const XR = '<html><body>' +
    '<article data-testid="tweet">' +
      '<div data-testid="User-Name"><span>Parent</span><span>@parent</span></div>' +
      '<div data-testid="tweetText"><span>Parent tweet body</span></div>' +
      '<a href="/parent/status/111"><time datetime="2026-07-01T00:00:00.000Z">Jul 1</time></a>' +
    '</article>' +
    '<article data-testid="tweet">' +
      '<div data-testid="User-Name"><span>Bob</span><span>@bob</span></div>' +
      '<div data-testid="tweetText"><span>The reply I bookmarked</span></div>' +
      '<a href="/bob/status/222"><time datetime="2026-07-02T00:00:00.000Z">Jul 2</time></a>' +
    '</article></body></html>';
  const rdoc = new DOMParser().parseFromString(XR, "text/html");
  const rr = applySiteRule(rdoc, "https://x.com/bob/status/222");
  check("x reply page → target status extracted, not parent",
    rr && /The reply I bookmarked/.test(rr.contentHtml) && !/Parent tweet body/.test(rr.contentHtml) && /Bob/.test(rr.contentHtml),
    JSON.stringify(rr && rr.contentHtml));
  const rp = applySiteRule(rdoc, "https://x.com/parent/status/111");
  check("x parent URL on same DOM → parent extracted", rp && /Parent tweet body/.test(rp.contentHtml), JSON.stringify(rp && rp.contentHtml));
  const rf = applySiteRule(rdoc, "https://x.com/ghost/status/999");
  check("x unknown id → falls back to first article", rf && /Parent tweet body/.test(rf.contentHtml), JSON.stringify(rf && rf.contentHtml));

  // Substring trap: target id 22 must NOT match the /status/222 link of an
  // earlier article; boundary check routes to the true /status/22 article.
  const XS = '<html><body>' +
    '<article data-testid="tweet">' +
      '<div data-testid="User-Name"><span>Long</span><span>@long</span></div>' +
      '<div data-testid="tweetText"><span>Status 222 body</span></div>' +
      '<a href="/long/status/222"><time datetime="2026-07-01T00:00:00.000Z">Jul 1</time></a>' +
    '</article>' +
    '<article data-testid="tweet">' +
      '<div data-testid="User-Name"><span>Short</span><span>@short</span></div>' +
      '<div data-testid="tweetText"><span>Status 22 body</span></div>' +
      '<a href="/short/status/22/photo/1"><time datetime="2026-07-02T00:00:00.000Z">Jul 2</time></a>' +
    '</article></body></html>';
  const sdoc = new DOMParser().parseFromString(XS, "text/html");
  const rs = applySiteRule(sdoc, "https://x.com/short/status/22");
  check("x id boundary → /status/22 not stolen by /status/222",
    rs && /Status 22 body/.test(rs.contentHtml) && !/Status 222 body/.test(rs.contentHtml), JSON.stringify(rs && rs.contentHtml));

  // Author span dedup/glue, datetime preference, >90-char title truncation.
  const LONG = Array(101).join("A"); // 100 chars
  const XM = '<html><body><article data-testid="tweet">' +
    '<div data-testid="User-Name"><span>Alice</span><span>Alice</span><span>@alice</span><span>Jul 9</span></div>' +
    '<div data-testid="tweetText"><span>' + LONG + '</span></div>' +
    '<time datetime="2026-07-09T01:00:00.000Z">Jul 9</time>' +
    '</article></body></html>';
  const mdoc = new DOMParser().parseFromString(XM, "text/html");
  const rm = applySiteRule(mdoc, "https://x.com/alice/status/42");
  check("x meta → display name deduped and glued to @handle",
    rm && rm.contentHtml.indexOf("<strong>Alice @alice</strong>") !== -1, JSON.stringify(rm && rm.contentHtml));
  check("x meta → datetime attribute preferred over label text",
    rm && rm.contentHtml.indexOf("· 2026-07-09T01:00:00.000Z") !== -1, JSON.stringify(rm && rm.contentHtml));
  check("x title → 90-char cap with ellipsis",
    rm && rm.title.length === 90 && /\.\.\.$/.test(rm.title) && rm.title.indexOf("AAA") === 0, JSON.stringify(rm && rm.title));

  // Truncation must count code points: an emoji at the cut must survive or
  // vanish whole, never become a lone surrogate half.
  const EMO = Array(87).join("A") + "😀😀😀😀😀"; // 86 ASCII + 5 astral => 91 code points
  const XE = XM.replace('<span>' + LONG + '</span>', '<span>' + EMO + '</span>');
  const re2 = applySiteRule(new DOMParser().parseFromString(XE, "text/html"), "https://x.com/alice/status/43");
  check("x title → surrogate pair never split at the truncation point",
    re2 && /\.\.\.$/.test(re2.title) && !/[\uD800-\uDBFF]\.\.\.$/.test(re2.title) && Array.from(re2.title).length === 90,
    JSON.stringify(re2 && re2.title));
}
</script>
