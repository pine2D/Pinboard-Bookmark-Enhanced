<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="pbp-expected-count" content="18"><title>Vocabulary Background Tests</title>
<style>body{font-family:monospace;padding:16px}.case{padding:6px}.pass{color:#0a0}.fail{color:#c00}</style>
</head><body><h1>Vocabulary Background Tests</h1><div id="summary"></div><div id="results"></div>
<script src="fixtures/chrome-mock.js"></script>
<script src="fixtures/sw-realm.js"></script>
<script>
const root = document.getElementById("results"); let pass = 0, fail = 0;
function check(name, ok) { ok ? pass++ : fail++; const row = document.createElement("div"); row.className = "case " + (ok ? "pass" : "fail"); row.textContent = `${ok ? "✓" : "✗"} ${name}`; root.appendChild(row); }

const EXT_ID = "abcdefghijklmnopabcdefghijklmnop";
const EXT_SENDER = { id: EXT_ID, url: `chrome-extension://${EXT_ID}/options.html` };
const CAPABLE_MANIFEST = {
  manifest_version: 3, name: "test", version: "0.0.0",
  optional_permissions: ["identity"],
  optional_host_permissions: ["https://*/*"],
  oauth2: { client_id: "1234567890-active.apps.googleusercontent.com", scopes: ["https://www.googleapis.com/auth/drive.appdata"] }
};
const INCAPABLE_MANIFEST = {
  manifest_version: 3, name: "test", version: "0.0.0",
  optional_permissions: ["identity"],
  optional_host_permissions: ["https://*/*"],
  oauth2: { client_id: "", scopes: ["https://www.googleapis.com/auth/drive.appdata"] }
};
const tick = (ms = 20) => new Promise((r) => setTimeout(r, ms));

// Boot a real background.js realm with controllable Drive runners and connect client.
async function bootDriveWorker({
  manifest = CAPABLE_MANIFEST,
  local = {},
  granted = true,
  connectResult = { ok: true, permissionId: "google-1", emailAddress: "alice@example.test", displayName: "Alice" },
  runnerImpl,
} = {}) {
  const events = { boots: [], rounds: [], runnerCalls: [], topLevelSync: null };
  const expectsBootRound = local.vocabDriveConnected === true && granted && manifest === CAPABLE_MANIFEST;
  let resolveBootDone = null;
  const bootDone = expectsBootRound ? new Promise((r) => { resolveBootDone = r; }) : Promise.resolve();
  const realm = await pbpSwRealm.boot({
    mock: {
      id: EXT_ID,
      manifest,
      storage: { local: { personalLibraryAccount: "alice", bookmarkServiceActive: "pinboard", _legacyWildcardCleanupV1: true, _driveScopeKeysRetiredDone: true, _webhookSyncScrubDone: true, ...local } },
      permissions: granted
        ? { permissions: ["identity"], origins: ["https://www.googleapis.com/*"] }
        : { permissions: [], origins: [] },
    },
    beforeBackground(win) {
      win.pbpCreateDriveClient = () => ({
        connect: async () => (typeof connectResult === "function" ? connectResult() : structuredClone(connectResult)),
        about: async () => ({ ok: true, permissionId: "google-1", emailAddress: "alice@example.test", displayName: "Alice" }),
      });
      const makeRunner = (type) => () => async (opts) => {
        events.runnerCalls.push({ type, opts: structuredClone(opts) });
        try {
          if (runnerImpl) return await runnerImpl(type, opts);
          return { ok: true, status: { drivePermissionId: "google-1", bootstrapComplete: true } };
        } finally {
          if (type === "ask" && resolveBootDone) { resolveBootDone(); resolveBootDone = null; }
        }
      };
      win.pbpCreateDriveSyncRunner = makeRunner("vocabulary");
      win.pbpCreateNotesDriveSyncRunner = makeRunner("notes");
      win.pbpCreateDictArchiveDriveSyncRunner = makeRunner("dictionary");
      win.pbpCreateAskArchiveDriveSyncRunner = makeRunner("ask");
    },
    afterBootSync(win, mock) {
      const alarmFns = [...mock.chrome.alarms.onAlarm.listeners];
      events.topLevelSync = {
        beforeMicrotasks: win.__pbpMicrotaskCheckpointRan === false,
        importedScripts: [...win.__importedScripts],
        alarmCount: alarmFns.length,
        alarmAllSync: alarmFns.every((fn) => fn.constructor.name !== "AsyncFunction"),
        hasSyncMessageHandler: typeof win.handleRuntimeMessage === "function"
          && win.handleRuntimeMessage.constructor.name !== "AsyncFunction"
          && mock.chrome.runtime.onMessage.hasListener(win.handleRuntimeMessage),
      };
    },
  });
  await bootDone;
  await tick(10);
  return { ...realm, events };
}

(async () => {
  const base = await bootDriveWorker({ local: { vocabDriveConnected: false } });
  const { win, mock } = base;

  // 1. Exact SW dependency import list and order recorded synchronously from background.js's real importScripts(...) call.
  const expectedImports = [
    "i18n.js", "shared.js", "tag-gov-save.js", "bookmark-services.js",
    "vocab-store.js", "vocab-gdrive.js", "notes-sync.js", "notes-gdrive.js",
    "restore-points.js", "ai-cache.js", "dict-archive.js", "dict-archive-gdrive.js",
    "ask-archive.js", "ask-archive-gdrive.js", "ai.js", "jina.js", "wayback.js",
  ];
  const storeImportAt = base.events.topLevelSync.importedScripts.indexOf("vocab-store.js");
  const gdriveImportAt = base.events.topLevelSync.importedScripts.indexOf("vocab-gdrive.js");
  check("store and Drive scripts are imported in dependency order",
    JSON.stringify(base.events.topLevelSync.importedScripts) === JSON.stringify(expectedImports) &&
    storeImportAt !== -1 && gdriveImportAt > storeImportAt);

  // 2. Real onAlarm routing for the 3 current + 6 legacy Drive alarm names.
  {
    const alarmWorker = await bootDriveWorker({ local: { vocabDriveConnected: true } });
    const seen = [];
    alarmWorker.win.pbpBootDriveSync = (opts) => {
      seen.push(opts === undefined ? "unthrottled" : opts);
      return Promise.resolve({ ok: true });
    };
    const validAlarms = [
      alarmWorker.get("PBP_DRIVE_DIRTY_ALARM"),
      alarmWorker.get("PBP_DRIVE_PERIODIC_ALARM"),
      alarmWorker.get("PBP_DRIVE_RETRY_ALARM"),
      ...alarmWorker.get("PBP_DRIVE_LEGACY_ALARMS"),
    ];
    for (const name of validAlarms) alarmWorker.mock.fireAlarm(name);
    for (const ignored of ["drive-sync-other", "vocab-sync", "keepalive"]) alarmWorker.mock.fireAlarm(ignored);
    await tick(10);
    check("all three drive-sync alarm names and the legacy names are routed",
      validAlarms.length === 9 && seen.length === 9 && seen.every((x) => x === "unthrottled"));
    alarmWorker.dispose();
  }

  // 3. Alarm listener registered synchronously at top level and non-async.
  check("alarm listener is registered synchronously at top level",
    base.events.topLevelSync.beforeMicrotasks === true
    && base.events.topLevelSync.alarmCount >= 1
    && base.events.topLevelSync.alarmAllSync);

  // 4. Runtime message listener is non-async and registered synchronously at top level.
  check("runtime message listener is not async",
    base.events.topLevelSync.beforeMicrotasks === true
    && base.events.topLevelSync.hasSyncMessageHandler === true);

  // 4b. Regression guard: deferring runtime.onMessage registration into queueMicrotask is caught before microtask drain.
  {
    const rawBg = await fetch("../background.js").then((r) => r.text());
    const mutatedBg = rawBg.replace(
      "chrome.runtime.onMessage.addListener(handleRuntimeMessage);",
      "queueMicrotask(() => chrome.runtime.onMessage.addListener(handleRuntimeMessage));",
    );
    let syncSampledHasListener = true;
    let sampledBeforeMicrotask = false;
    const deferredRealm = await pbpSwRealm.boot({
      mock: {
        id: EXT_ID,
        manifest: CAPABLE_MANIFEST,
        storage: { local: { personalLibraryAccount: "alice", bookmarkServiceActive: "pinboard", vocabDriveConnected: false, _legacyWildcardCleanupV1: true, _driveScopeKeysRetiredDone: true, _webhookSyncScrubDone: true } },
      },
      backgroundSource: mutatedBg,
      afterBootSync(w, m) {
        sampledBeforeMicrotask = w.__pbpMicrotaskCheckpointRan === false;
        syncSampledHasListener = m.chrome.runtime.onMessage.hasListener(w.handleRuntimeMessage);
      },
    });
    const registeredOnlyAfterMicrotask = deferredRealm.mock.chrome.runtime.onMessage.hasListener(deferredRealm.win.handleRuntimeMessage);
    deferredRealm.dispose();

    // Verify ordinary pbpSwRealm.boot (without afterBootSync/backgroundSource) performs
    // zero outer fetch() calls so file:// direct opening of SW test pages stays intact.
    let outerFetchCalls = 0;
    const realOuterFetch = globalThis.fetch;
    globalThis.fetch = async (...args) => { outerFetchCalls++; return realOuterFetch(...args); };
    let plainRealm = null;
    try {
      plainRealm = await pbpSwRealm.boot({
        mock: {
          id: EXT_ID,
          manifest: CAPABLE_MANIFEST,
          storage: { local: { personalLibraryAccount: "alice", bookmarkServiceActive: "pinboard", vocabDriveConnected: false, _legacyWildcardCleanupV1: true, _driveScopeKeysRetiredDone: true, _webhookSyncScrubDone: true } },
        },
      });
    } finally {
      globalThis.fetch = realOuterFetch;
      plainRealm?.dispose();
    }
    check("top-level listener probe catches queueMicrotask-deferred onMessage while ordinary boot keeps zero outer fetch calls",
      mutatedBg !== rawBg
      && sampledBeforeMicrotask === true
      && syncSampledHasListener === false
      && registeredOnlyAfterMicrotask === true
      && outerFetchCalls === 0);
  }

  // 5. Both dirty messages schedule the one shared drive-sync-dirty alarm.
  {
    const dirtyWorker = await bootDriveWorker({ local: { vocabDriveConnected: true } });
    await dirtyWorker.mock.chrome.alarms.clearAll();
    const r1 = await dirtyWorker.mock.dispatchMessage({ type: "PBP_VOCAB_DIRTY" }, EXT_SENDER);
    const a1 = await dirtyWorker.mock.chrome.alarms.get(dirtyWorker.get("PBP_DRIVE_DIRTY_ALARM"));
    await dirtyWorker.mock.chrome.alarms.clearAll();
    const r2 = await dirtyWorker.mock.dispatchMessage({ type: "PBP_NOTES_DIRTY" }, EXT_SENDER);
    const a2 = await dirtyWorker.mock.chrome.alarms.get(dirtyWorker.get("PBP_DRIVE_DIRTY_ALARM"));
    check("both dirty messages schedule the one shared drive-sync alarm",
      r1?.ok === true && !!a1 && r2?.ok === true && !!a2);
    dirtyWorker.dispose();
  }

  // 6 & 7. Connect and status messages are handled on the real router.
  {
    const msgWorker = await bootDriveWorker({ local: { vocabDriveConnected: false } });
    const statusRes = await msgWorker.mock.dispatchMessage({ type: "vocabDriveStatus" }, EXT_SENDER);
    const connectRes = await msgWorker.mock.dispatchMessage({ type: "vocabDriveConnect" }, EXT_SENDER);
    check("connect message is handled", connectRes?.ok === true && connectRes.status?.connected === true);
    check("status message is handled", statusRes?.ok === true && statusRes.status?.connected === false);
    msgWorker.dispose();
  }

  // 8 & 9. Real pbpVocabDriveResponse authoritative status + sanitized degradation.
  {
    const respWorker = await bootDriveWorker({ local: { vocabDriveConnected: true } });
    respWorker.win.pbpGetVocabDriveStatus = async () => ({
      connected: true, owner: "alice",
      connection: { lastError: "network", retryAt: 1234, blocked: false },
      vocabulary: { lastSuccessAt: 1, lastError: null, retryAt: null, blocked: false, hasPending: true, notices: 0 },
      notes: { lastSuccessAt: 2, lastError: "corrupt", retryAt: null, blocked: true, hasPending: false, notices: 0 },
      noticeTerms: [], lastSuccessAt: 1, hasPending: true
    });
    const failedResponse = await respWorker.win.pbpVocabDriveResponse({ ok: false, error: "network" });
    check("failed Drive operations return the latest authoritative status",
      failedResponse?.ok === false && failedResponse.error === "network" &&
      failedResponse.status?.connected === true && failedResponse.status?.owner === "alice" &&
      failedResponse.status?.connection?.retryAt === 1234 && failedResponse.status?.notes?.blocked === true);

    respWorker.win.pbpGetVocabDriveStatus = async () => { throw new Error("status unavailable"); };
    const degradedResponse = await respWorker.win.pbpVocabDriveResponse({
      ok: false, error: "permission", remoteBody: "must not escape"
    });
    check("status lookup failure degrades to a sanitized error response",
      degradedResponse?.ok === false && degradedResponse.error === "permission" &&
      !("status" in degradedResponse) && !("remoteBody" in degradedResponse));
    respWorker.dispose();
  }

  // 10 & 11. Connect and sync-now both return authoritative status, and sync-now preserves backoff unless forced.
  {
    const syncWorker = await bootDriveWorker({ local: { vocabDriveConnected: true } });
    syncWorker.events.runnerCalls.length = 0;
    await syncWorker.mock.chrome.alarms.create(syncWorker.get("PBP_DRIVE_RETRY_ALARM"), { when: Date.now() + 60000 });
    const unforced = await syncWorker.mock.dispatchMessage({ type: "vocabDriveSyncNow", force: false }, EXT_SENDER);
    const unforcedOpts = syncWorker.events.runnerCalls[0]?.opts;
    await syncWorker.mock.chrome.alarms.create(syncWorker.get("PBP_DRIVE_RETRY_ALARM"), { when: Date.now() + 60000 });
    let alarmClearedBeforeRun = false;
    const origQueue = syncWorker.win.pbpQueueDriveRound;
    syncWorker.win.pbpQueueDriveRound = async (opts) => {
      alarmClearedBeforeRun = !(await syncWorker.mock.chrome.alarms.get(syncWorker.get("PBP_DRIVE_RETRY_ALARM")));
      return origQueue(opts);
    };
    const forced = await syncWorker.mock.dispatchMessage({ type: "vocabDriveSyncNow", force: true }, EXT_SENDER);
    const forcedOpts = syncWorker.events.runnerCalls.at(-1)?.opts;
    const connected = await syncWorker.mock.dispatchMessage({ type: "vocabDriveConnect" }, EXT_SENDER);
    check("connect and sync-now both use the shared authoritative response path",
      unforced?.status?.owner === "alice" && forced?.status?.owner === "alice" && connected?.status?.owner === "alice");
    check("sync-now message preserves persisted backoff unless explicitly forced",
      unforcedOpts?.force === false && unforcedOpts?.interactive === false &&
      forcedOpts?.force === true && forcedOpts?.interactive === false && alarmClearedBeforeRun === true);
    syncWorker.dispose();
  }

  // 12 & 13. Connect keeps device connected on retryable auth failure, clears on refusal; disconnect handled.
  {
    let mode = "retryable";
    const authWorker = await bootDriveWorker({
      local: { vocabDriveConnected: true },
      connectResult: () => mode === "retryable"
        ? { ok: false, error: "auth", retryable: true }
        : { ok: false, error: "auth", retryable: false },
    });
    const rRetry = await authWorker.mock.dispatchMessage({ type: "vocabDriveConnect" }, EXT_SENDER);
    const keptAfterRetryable = authWorker.mock.storageData("local").vocabDriveConnected === true;
    mode = "refused";
    const rRefused = await authWorker.mock.dispatchMessage({ type: "vocabDriveConnect" }, EXT_SENDER);
    const clearedAfterRefusal = authWorker.mock.storageData("local").vocabDriveConnected === false;
    check("connect keeps the device connected when auth is only retryable",
      rRetry?.ok === false && keptAfterRetryable && rRefused?.ok === false && clearedAfterRefusal);

    await authWorker.mock.chrome.storage.local.set({ vocabDriveConnected: true });
    const disc = await authWorker.mock.dispatchMessage({ type: "vocabDriveDisconnect" }, EXT_SENDER);
    check("disconnect message is handled",
      disc?.ok === true && authWorker.mock.storageData("local").vocabDriveConnected === false);
    authWorker.dispose();
  }

  // 14. One recovering promise tail serializes every Drive round and recovers after rejection.
  {
    let active = 0, maxActive = 0, tracking = false;
    const executed = [];
    const serialWorker = await bootDriveWorker({
      local: { vocabDriveConnected: true },
      runnerImpl: async (type) => {
        if (!tracking) {
          return { ok: true, status: { drivePermissionId: "google-1", bootstrapComplete: true } };
        }
        active++;
        maxActive = Math.max(maxActive, active);
        executed.push(type);
        await tick(12);
        active--;
        return { ok: true, status: { drivePermissionId: "google-1", bootstrapComplete: true } };
      },
    });
    tracking = true;
    const queueFn = serialWorker.get("queueDriveSync");
    const [rFail, rOne, rTwo] = await Promise.allSettled([
      queueFn(async () => {
        active++;
        maxActive = Math.max(maxActive, active);
        await tick(12);
        active--;
        throw new Error("simulated tail rejection");
      }),
      serialWorker.win.pbpQueueDriveRound({ manual: true }),
      serialWorker.win.pbpQueueDriveRound({ manual: true }),
    ]);
    const expectedOrder = [
      "vocabulary", "notes", "dictionary", "ask",
      "vocabulary", "notes", "dictionary", "ask",
    ];
    check("one recovering promise tail serializes every Drive round",
      maxActive === 1 &&
      JSON.stringify(executed) === JSON.stringify(expectedOrder) &&
      rFail.status === "rejected" &&
      rOne.status === "fulfilled" && rOne.value?.ok === true &&
      rTwo.status === "fulfilled" && rTwo.value?.ok === true);
    serialWorker.dispose();
  }

  // 15. Boot invokes one non-interactive cold-start sync, not onStartup, and clears flag+alarms on missing grant.
  {
    const coldWorker = await bootDriveWorker({ local: { vocabDriveConnected: true } });
    const initialVocabRuns = coldWorker.events.runnerCalls.filter((c) => c.type === "vocabulary");
    coldWorker.events.runnerCalls.length = 0;
    coldWorker.mock.chrome.runtime.onStartup.dispatch();
    await tick(20);
    const startupRuns = coldWorker.events.runnerCalls.length;

    const ungrantedWorker = await bootDriveWorker({ local: { vocabDriveConnected: true }, granted: false });
    await ungrantedWorker.mock.chrome.alarms.create("drive-sync-periodic", { periodInMinutes: 15 });
    await ungrantedWorker.mock.chrome.storage.local.set({ vocabDriveConnected: true });
    const denied = await ungrantedWorker.win.pbpBootDriveSync();
    const afterData = ungrantedWorker.mock.storageData("local");
    const leftAlarms = await ungrantedWorker.mock.chrome.alarms.getAll();
    check("boot invokes only one noninteractive cold-start sync",
      initialVocabRuns.length === 1 && initialVocabRuns[0].opts?.interactive === false &&
      startupRuns === 0 && denied?.ok === false && denied.error === "permission" &&
      afterData.vocabDriveConnected === false &&
      !leftAlarms.some((a) => a.name.startsWith("drive-sync-")));
    coldWorker.dispose();
    ungrantedWorker.dispose();
  }

  // 16. Background never requests optional permissions (presence check, not a slice anchor).
  const bgSource = await fetch("../background.js").then((r) => r.text());
  check("background never requests optional permissions",
    !bgSource.includes("chrome.permissions.request(") && !bgSource.includes("permissions.request("));

  // 17. Inactive OAuth capability gates boot and every Drive message path.
  {
    const offWorker = await bootDriveWorker({
      manifest: INCAPABLE_MANIFEST,
      local: { vocabDriveConnected: true },
    });
    const bootRes = await offWorker.win.pbpBootDriveSync();
    const types = ["PBP_VOCAB_DIRTY", "vocabDriveConnect", "vocabDriveStatus", "vocabDriveSyncNow", "vocabDriveDisconnect"];
    const replies = [];
    for (const type of types) {
      replies.push(await offWorker.mock.dispatchMessage({ type }, EXT_SENDER));
    }
    check("inactive OAuth capability gates boot and every Drive message path",
      offWorker.get("PBP_VOCAB_DRIVE_CAPABLE") === false &&
      bootRes?.ok === true && offWorker.events.runnerCalls.length === 0 &&
      replies.every((r) => r?.ok === false && r.error === "unavailable"));
    offWorker.dispose();
  }

  base.dispose();
  document.getElementById("summary").textContent = `pass=${pass} fail=${fail}`;
})();
</script></body></html>
