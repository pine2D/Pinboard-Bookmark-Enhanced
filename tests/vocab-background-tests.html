<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Vocabulary Background Tests</title>
<style>body{font-family:monospace;padding:16px}.case{padding:6px}.pass{color:#0a0}.fail{color:#c00}</style>
</head><body><h1>Vocabulary Background Tests</h1><div id="summary"></div><div id="results"></div>
<script>
const root = document.getElementById("results"); let pass = 0, fail = 0;
function check(name, ok) { ok ? pass++ : fail++; const row = document.createElement("div"); row.className = "case " + (ok ? "pass" : "fail"); row.textContent = `${ok ? "✓" : "✗"} ${name}`; root.appendChild(row); }
(async () => {
  const source = await fetch("../background.js").then((response) => response.text());
  const importsStart = source.indexOf("importScripts(");
  const importsEnd = source.indexOf(");", importsStart);
  if (importsStart < 0 || importsEnd <= importsStart) throw new Error("anchor not found: importScripts source");
  const imports = source.slice(importsStart, importsEnd + 2);
  const alarmsStart = source.indexOf("chrome.alarms.onAlarm.addListener");
  const alarmsEnd = source.indexOf("// React to settings change");
  if (alarmsStart < 0 || alarmsEnd <= alarmsStart) throw new Error("anchor not found: alarm listener source");
  const alarms = source.slice(alarmsStart, alarmsEnd);
  // Roadmap #35 named the router, so the body now STARTS at the function
  // declaration and the addListener line trails it.
  const messagesStart = source.indexOf("function handleRuntimeMessage");
  if (messagesStart < 0) throw new Error("anchor not found: handleRuntimeMessage source");
  const messages = source.slice(messagesStart);
  const bootAt = source.indexOf("function pbpBootDriveSync");
  const bootEnd = source.indexOf("\nasync function pbpDisconnectVocabDrive", bootAt);
  if (bootAt < 0 || bootEnd <= bootAt) throw new Error("anchor not found: pbpBootDriveSync source");
  const boot = source.slice(bootAt, bootEnd);
  const startupAt = source.indexOf("chrome.runtime.onStartup.addListener");
  const startupEnd = source.indexOf("chrome.runtime.onInstalled.addListener", startupAt);
  if (startupAt < 0 || startupEnd <= startupAt) throw new Error("anchor not found: onStartup listener source");
  const startup = source.slice(startupAt, startupEnd);
  const syncNowAt = messages.indexOf('message.type === "vocabDriveSyncNow"');
  const syncNowEnd = messages.indexOf('message.type === "vocabDriveDisconnect"', syncNowAt);
  if (syncNowAt < 0 || syncNowEnd <= syncNowAt) throw new Error("anchor not found: vocabDriveSyncNow handler");
  const syncNow = messages.slice(syncNowAt, syncNowEnd);
  const connectAt = messages.indexOf('message.type === "vocabDriveConnect"');
  const connectEnd = messages.indexOf('message.type === "vocabDriveStatus"', connectAt);
  if (connectAt < 0 || connectEnd <= connectAt) throw new Error("anchor not found: vocabDriveConnect handler");
  const connect = messages.slice(connectAt, connectEnd);
  const responseAt = source.indexOf("async function pbpVocabDriveResponse");
  const responseEnd = source.indexOf("\n\nasync function pbpBootDriveSync", responseAt);
  if (responseAt < 0 || responseEnd <= responseAt) throw new Error("anchor not found: pbpVocabDriveResponse source");
  let responseFactory = null;
  try {
    responseFactory = new Function("pbpGetVocabDriveStatus",
      `${source.slice(responseAt, responseEnd)}; return typeof pbpVocabDriveResponse === "function" ? pbpVocabDriveResponse : null;`);
  } catch (_) {}
  check("store and Drive scripts are imported in dependency order", imports.indexOf('"vocab-store.js"') >= 0 && imports.indexOf('"vocab-gdrive.js"') > imports.indexOf('"vocab-store.js"'));
  // Simplest miss: routing only the new names, so a pre-migration vocab-sync-* alarm is dropped.
  check("all three drive-sync alarm names and the legacy names are routed", ["PBP_DRIVE_DIRTY_ALARM", "PBP_DRIVE_PERIODIC_ALARM", "PBP_DRIVE_RETRY_ALARM"].every((name) => alarms.includes(`alarm.name === ${name}`)) && alarms.includes("PBP_DRIVE_LEGACY_ALARMS.includes(alarm.name)") && !/"(vocab|notes)-sync-/.test(alarms));
  check("alarm listener is registered synchronously at top level", /chrome\.alarms\.onAlarm\.addListener\(\(alarm\) =>/.test(alarms) && !/addListener\(async/.test(alarms));
  check("runtime message listener is not async", /function handleRuntimeMessage\(message, sender, sendResponse\)/.test(messages) &&
    !/async function handleRuntimeMessage/.test(messages) && !/onMessage\.addListener\(async/.test(messages) &&
    messages.includes("chrome.runtime.onMessage.addListener(handleRuntimeMessage);"));
  const dirtyAt = messages.indexOf('message.type === "PBP_VOCAB_DIRTY" || message.type === "PBP_NOTES_DIRTY"');
  const dirty = messages.slice(dirtyAt, messages.indexOf('message.type === "vocabDriveConnect"', dirtyAt));
  // Simplest miss: the handler still gating on a per-dataset switch, or one dataset still calling a per-dataset scheduler.
  check("both dirty messages schedule the one shared drive-sync alarm", dirtyAt >= 0 && dirty.includes("pbpDriveEnabled()") && !/pbpDrive(Type)Enabled/.test(dirty) && (dirty.match(/pbpDriveScheduleDirty\(chrome\.alarms\)/g) || []).length === 1 && !/pbp(Vocab|Notes)ScheduleDirty/.test(source));
  check("connect message is handled", messages.includes('message.type === "vocabDriveConnect"'));
  check("status message is handled", messages.includes('message.type === "vocabDriveStatus"'));
  const failedHandler = responseFactory?.(async () => ({
    connected: true, owner: "alice",
    connection: { lastError: "network", retryAt: 1234, blocked: false },
    vocabulary: { lastSuccessAt: 1, lastError: null, retryAt: null, blocked: false, hasPending: true, notices: 0 },
    notes: { lastSuccessAt: 2, lastError: "corrupt", retryAt: null, blocked: true, hasPending: false, notices: 0 },
    noticeTerms: [], lastSuccessAt: 1, hasPending: true
  }));
  const failedResponse = failedHandler
    ? await failedHandler({ ok: false, error: "network" }) : null;
  check("failed Drive operations return the latest authoritative status",
    failedResponse?.ok === false && failedResponse.error === "network" &&
    failedResponse.status?.connected === true && failedResponse.status?.owner === "alice" &&
    failedResponse.status?.connection?.retryAt === 1234 && failedResponse.status?.notes?.blocked === true);
  // Simplest miss: rebuild a partial status in the response path instead of passing the fresh one through -- notes.blocked disappears.
  const degradedHandler = responseFactory?.(async () => {
    throw new Error("status unavailable");
  });
  const degradedResponse = degradedHandler
    ? await degradedHandler({
        ok:false, error:"permission", remoteBody:"must not escape"
      }) : null;
  check("status lookup failure degrades to a sanitized error response",
    degradedResponse?.ok === false && degradedResponse.error === "permission" &&
    !("status" in degradedResponse) && !("remoteBody" in degradedResponse));
  check("connect and sync-now both use the shared authoritative response path",
    (connect.match(/pbpVocabDriveResponse\(result\)/g) || []).length === 1 &&
    (syncNow.match(/pbpVocabDriveResponse\(result\)/g) || []).length === 1);
  check("sync-now message preserves persisted backoff unless explicitly forced",
    syncNowAt >= 0 &&
    /pbpQueueDriveRound\(\{\s*interactive: false,\s*force: message\.force === true,\s*manual: true\s*\}\)/
      .test(syncNow) &&
    /if \(message\.force === true\) await chrome\.alarms\.clear\(PBP_DRIVE_RETRY_ALARM\);/.test(syncNow));
  // A retryable auth failure means the token could not be minted right now,
  // not that the grant is gone. Dropping the flag makes pbpBootDriveSync
  // return early, so the retry alarm the round just reconciled does nothing.
  // Only pbpConnectDrive may clear it, and only on connect()'s own refusal (A4).
  const connectFnAt = source.indexOf("async function pbpConnectDrive");
  const connectFnEnd = connectFnAt >= 0 ? source.indexOf("\n}\n", connectFnAt) : -1;
  const connectFn = connectFnEnd > connectFnAt ? source.slice(connectFnAt, connectFnEnd) : "";
  const retryableGuardAt = connectFn.indexOf("account.retryable !== true");
  // The first clear is the permission precheck (spec §10.8); the refusal clear is the last one.
  const refusalClearAt = connectFn.lastIndexOf("PBP_VOCAB_DRIVE_CONNECTED_KEY]: false");
  check("connect keeps the device connected when auth is only retryable",
    retryableGuardAt >= 0 && retryableGuardAt < refusalClearAt &&
    !connect.includes("PBP_VOCAB_DRIVE_CONNECTED_KEY]: false"));
  // Simplest miss: leave the old clearing branch in the vocabDriveConnect handler, where it also fires on round results (A4).
  check("disconnect message is handled", messages.includes('message.type === "vocabDriveDisconnect"'));
  // Simplest miss: a second tail left behind for one dataset, which lets the two run concurrently again.
  check("one recovering promise tail serializes every Drive round", source.includes("const queueDriveSync = pbpCreateRecoveringTail();") && (source.match(/return queueDriveSync\(async \(\) =>/g) || []).length === 1 && !/queue(Vocab|Notes)Sync/.test(source));
  check("boot invokes only one noninteractive cold-start sync",
    bootAt >= 0 && boot.includes("interactive: false") && !boot.includes("interactive: true") &&
    !startup.includes("pbpBootDriveSync") &&
    boot.includes("if (!await pbpVocabDriveIsConnected()) return { ok: true };") &&
    !boot.includes("status: await pbpGetVocabDriveStatus()") &&
    !boot.includes("pbpDriveEnsurePeriodic") &&
    /if \(!granted\) \{[\s\S]*PBP_VOCAB_DRIVE_CONNECTED_KEY[\s\S]*false[\s\S]*pbpClearDriveAlarms\(\)[\s\S]*error: "permission"/
      .test(boot) &&
    !connect.includes("pbpDriveEnsurePeriodic"));
  check("background never requests optional permissions", !source.includes("chrome.permissions.request(") && !source.includes("permissions.request("));
  check("inactive OAuth capability gates boot and every Drive message path",
    source.includes("pbpVocabDriveOAuthActive(chrome.runtime.getManifest())") &&
    boot.includes("PBP_VOCAB_DRIVE_CAPABLE") &&
    ["PBP_VOCAB_DIRTY", "vocabDriveConnect", "vocabDriveStatus",
      "vocabDriveSyncNow", "vocabDriveDisconnect"].every((type) => {
        const at = messages.indexOf(`message.type === "${type}"`);
        const next = messages.indexOf("\n  if (message.type ===", at + 1);
        const handler = messages.slice(at, next > at ? next : messages.length);
        return handler.includes("PBP_VOCAB_DRIVE_CAPABLE");
      }));
  document.getElementById("summary").textContent = `pass=${pass} fail=${fail}`;
})();
</script></body></html>
