   const PAGE='https://example.com/article',META='Page meta';

     if(via==='draft')h.release({...draft,url});else{const input=h.elements['url-input'];input.value=url;if(via==='typed')input.dispatchEvent(new Event('input'));h.release(null);}

     ['aggressive mode removed ref beside a real parameter',aggressive,PAGE+'?id=2&ref=abc',PAGE+'?id=2',true],
     ['a custom parameter was removed',custom,PAGE+'?campaign=spring',PAGE,true],

     ['cleaning is off',{...base,enabled:false},PAGE+'?ref=abc',PAGE+'?ref=abc',true],

     ['the form is another query',aggressive,PAGE+'?ref=abc',PAGE+'?id=2',false],
     ['the form dropped a real parameter',aggressive,PAGE+'?id=2&ref=abc',PAGE,false],

   for(const via of ['open','draft','typed']){

 // The cleaned address comes from the stored cleaning settings. If those cannot
 // be applied (hand-edited storage, an imported backup), the Description prefill

 // That the form itself still opens and saves on such settings is the runtime
 // block "linkding cleaned page address" (tests/bookmark-service-runtime-tests.mjs).
 await test('cleaning settings that cannot be applied leave the Description prefill to the plain equivalence and log the failure',async()=>{
   const PAGE='https://example.com/article',META='Page meta',urlClean={enabled:true,onPopupOpen:true,onPaste:true,aggressiveMode:true,customParams:'campaign',excludeParams:[]};
   const warned=[],warn=console.warn;console.warn=(...args)=>warned.push(args.join(' '));
   try{
     for(const [label,url,pageUrl,same] of [['a tracker the default cleaning removes',PAGE,PAGE+'?utm_source=newsletter',true],['a parameter only aggressive mode removes',PAGE,PAGE+'?ref=abc',false]]){
       const h=uiHarness('linkding',{pageInfo:{url:pageUrl,metaDescription:META},settings:{urlClean}});const p=h.api.initPopupDraft('alice',{url:PAGE});h.elements['url-input'].value=url;h.release(null);await p;

     }
   }finally{console.warn=warn;}
   assert(warned.length===1&&warned[0].includes('page URL cleaning failed'),'the failure was not logged exactly once: '+JSON.stringify(warned));
 });

   const PAGE='https://example.com/article',META='Page meta';

   // [kind of page, page, auto-fill, [box, known] on the page itself, [box, known] on any other address]
   for(const [kind,pageInfo,auto,own,away] of [
     ['a read page',{url:PAGE,metaDescription:META},true,[META,true],['',false]],
     ['a read page, auto-fill off',{url:PAGE,metaDescription:META},false,['',true],['',true]],
     ['a page without a description',{url:PAGE,metaDescription:''},true,['',true],['',false]],
     ['an unread page',{url:PAGE,metaDescription:'',_pbpUnavailable:true},true,['',false],['',false]],
     ['an unread page, auto-fill off',{url:PAGE,metaDescription:'',_pbpUnavailable:true},false,['',true],['',true]]]){

   for(const [label,pageInfo,write,want] of [

     ['an emptied box on a page without a description',bare,typed(''),['',true]],
     ['an AI summary',read,h=>h.api.upsertSummary('AI summary'),['AI summary',true]],

 const settle=()=>navigator.locks.request('pbp-popup-drafts',()=>{});
 const openWorker=async(pageUrl,service='pinboard',before=()=>{})=>{const h=uiHarness(service,{worker:true});before(h);await h.api.initPopupDraft('alice',{url:pageUrl});await settle();return h;};
 const typeInto=(h,id,value)=>{h.elements[id].value=value;h.elements[id].dispatchEvent(new Event('input'));};
 await test('a tag-only draft leaves the other fields to the page and the bookmark lookup',async()=>{const pageUrl='https://example.com/g15-tag-only';
   const first=await openWorker(pageUrl);first.api.chip();await settle();
   const second=await openWorker(pageUrl,'pinboard',h=>{h.elements['title-input'].value='Page title now';h.elements['url-input'].value=pageUrl;});
   assert(second.statuses.some(s=>s[1]==='popupDraftRestored'),'the tag draft was not restored');
   assert(JSON.stringify(second.api.pbpPopupDraftSnapshot().tags)==='["Chip"]','the drafted tag was not restored');
   assert(second.elements['title-input'].value==='Page title now','an unchanged title was overwritten by the draft');
   assert(Object.values(second.flags).every(v=>!v),'unchanged fields were marked edited: '+JSON.stringify(second.flags));
   for(const [id,value] of [['description-input','Notes edited elsewhere'],['title-input','Title edited elsewhere']]){assert(second.api.shouldUpdateField(id),id+' refuses the bookmark lookup');second.elements[id].value=value;}
   second.api.pbpRememberPopupDraft();await settle();
   const third=await openWorker(pageUrl,'pinboard',h=>{h.elements['description-input'].value='Notes edited later';});
   assert(third.elements['description-input'].value==='Notes edited later','a lookup value the user never touched was frozen into the draft');});
 await test('a title-only draft marks only the title as edited',async()=>{const pageUrl='https://example.com/g15-title-only';
   const first=await openWorker(pageUrl);typeInto(first,'title-input','My title');await settle();
   const second=await openWorker(pageUrl);
   assert(second.elements['title-input'].value==='My title','the edited title was not restored');
   assert(JSON.stringify(second.flags)===JSON.stringify({'title-input':true,'description-input':false,'linkding-description-input':false,'private-check':false,'readlater-check':false}),'flags: '+JSON.stringify(second.flags));
   assert(second.api.pbpPopupFormIsDirty(),'the restored title no longer counts as an edit');
   // Values stored beside the change list are a snapshot, not the user's edits.
   await run(msg('write',{pageUrl,draft:{...draft,url:pageUrl,tags:['Stale'],tagInput:'stale',private:false,toread:true,changed:['title']}}));
   const third=await openWorker(pageUrl);const form=third.api.pbpPopupDraftSnapshot();
   assert(form.title===draft.title&&form.tags.length===0&&form.tagInput===''&&form.toread===false&&form.url==='','fields outside the change list were restored: '+JSON.stringify(form));});
 await test('changes made across several opens accumulate and all come back',async()=>{const pageUrl='https://example.com/g15-accumulate';
   const first=await openWorker(pageUrl);typeInto(first,'title-input','Title from open one');await settle();
   const second=await openWorker(pageUrl);typeInto(second,'description-input','Notes from open two');await settle();
   const third=await openWorker(pageUrl,'pinboard',h=>{h.elements['readlater-check'].checked=true;});
   assert(third.elements['title-input'].value==='Title from open one'&&third.elements['description-input'].value==='Notes from open two','an earlier change was dropped: '+JSON.stringify([third.elements['title-input'].value,third.elements['description-input'].value]));
   assert(third.flags['title-input']&&third.flags['description-input']&&!third.flags['readlater-check']&&!third.flags['private-check'],'flags: '+JSON.stringify(third.flags));
   assert(third.elements['readlater-check'].checked===true,'an unchanged checkbox was reset by the draft');});
 await test('a change made before the restore answers is merged with the stored change list',async()=>{const pageUrl='https://example.com/g15-early';
   const first=await openWorker(pageUrl);typeInto(first,'title-input','Stored title');await settle();
   const second=uiHarness('pinboard',{worker:true});second.elements['description-input'].value='Typed before init';second.elements['description-input'].dispatchEvent(new Event('input'));await second.api.initPopupDraft('alice',{url:pageUrl});await settle();
   const third=await openWorker(pageUrl);
   assert(third.elements['title-input'].value==='Stored title'&&third.elements['description-input'].value==='Typed before init','merged change list lost a field');
   assert(third.flags['title-input']&&third.flags['description-input']&&!third.flags['private-check'],'flags: '+JSON.stringify(third.flags));});
 await test('a draft written before change lists existed still restores the whole form',async()=>{const h=uiHarness();const p=h.api.initPopupDraft('alice',{url:'https://example.com/article'});h.elements['title-input'].value='Page title';h.release({...draft,private:false,toread:false});await p;
   assert(h.elements['title-input'].value===draft.title&&h.elements['description-input'].value===draft.notes&&h.elements['tags-input'].value===draft.tagInput,'a legacy draft was not restored in full');
   assert(JSON.stringify(h.api.pbpPopupDraftSnapshot().tags)===JSON.stringify(draft.tags),'legacy tags were not restored');
   assert(Object.entries(h.flags).filter(([id])=>id!=='linkding-description-input').every(([,v])=>v),'legacy restore did not mark every field: '+JSON.stringify(h.flags));
   h.elements['description-input'].value='Next';h.elements['description-input'].dispatchEvent(new Event('input'));assert(!Object.hasOwn(h.sent.at(-1).draft,'changed'),'a legacy draft was narrowed to a change list');});
 await test('a save clears a draft whose unchanged fields were refilled, and keeps one with a newer change',async()=>{const pageUrl='https://example.com/g15-clear';
   await run(msg('write',{pageUrl,draft:{...draft,url:pageUrl,tagInput:'',title:'Stored then',notes:'Mine',changed:['notes']}}));
   await run(msg('clear',{pageUrl,expectedDraft:{...draft,url:pageUrl,tagInput:'',title:'Refilled by lookup',notes:'Newer',changed:['notes']}}));
   assert((await run(msg('read',{pageUrl}))).draft?.notes==='Mine','a save of other notes cleared the newer draft');
   await run(msg('clear',{pageUrl,expectedDraft:{...draft,url:pageUrl,tagInput:'',title:'Stored then',notes:'Mine',changed:['notes','title']}}));
   assert((await run(msg('read',{pageUrl}))).draft,'a save with a different change list cleared the draft');
   await run(msg('clear',{pageUrl,expectedDraft:{...draft,url:pageUrl,tagInput:'',title:'Refilled by lookup',tags:[],private:false,notes:'Mine',changed:['notes']}}));
   assert((await run(msg('read',{pageUrl}))).draft===null,'a delivered draft survived because unchanged fields were refilled');});
 const rowFor=pageUrl=>rows[Object.keys(rows).find(k=>k.startsWith('pbp-popup-draft:')&&rows[k].pageUrl===pageUrl)];
 await test('a draft of a recent bookmark brings its address back with the edit',async()=>{const pageUrl='https://example.com/article';
   const first=await openWorker(pageUrl);await first.api.loadBookmarkForEdit('https://example.com/g15-recent','alice:fake');typeInto(first,'description-input','Recent note');await settle();
   const second=await openWorker(pageUrl,'pinboard',h=>{h.elements['url-input'].value=pageUrl;h.elements['title-input'].value='Opened page title';});
   assert(second.elements['url-input'].value==='https://example.com/g15-recent'&&second.elements['description-input'].value==='Recent note','the recent edit reopened on the wrong address: '+second.elements['url-input'].value);
   assert(!second.flags['title-input'],'an unchanged title was frozen by the recent draft');
   await second.api.pbpDiscardPopupDraft();});
 // The opened page describes itself, not a recent bookmark a draft reopened:
 // with that bookmark gone elsewhere (lookup missing) nothing would put its
 // own title or notes back, and Save would recreate it with the page's.
 for(const [label,edit] of [['notes',h=>typeInto(h,'description-input','Recent note')],['tags',h=>h.api.chip()]])
 await test('a recent-bookmark draft ('+label+' changed) takes no title or notes from the opened page',async()=>{const pageUrl='https://example.com/article';const info={url:pageUrl,title:'Opened page title',metaDescription:'Opened page meta'};
   const first=await openWorker(pageUrl);await first.api.loadBookmarkForEdit('https://example.com/g15-recent-'+label,'alice:fake');edit(first);await settle();
   const second=uiHarness('pinboard',{worker:true,pageInfo:info});second.elements['url-input'].value=pageUrl;second.api.prefillTitle(info.title,pageUrl);
   await second.api.initPopupDraft('alice',{url:pageUrl});await settle();
   second.api.prefillTitle(info.title,info.url);second.api.prefill();
   assert(second.elements['url-input'].value==='https://example.com/g15-recent-'+label,'the draft did not reopen on the recent bookmark');
   assert(second.elements['title-input'].value==='','the opened page title was put on the recent bookmark: '+second.elements['title-input'].value);
   if(label==='tags')assert(second.elements['description-input'].value==='','the opened page notes were put on the recent bookmark: '+second.elements['description-input'].value);
   else assert(second.elements['description-input'].value==='Recent note','the drafted notes were lost');
   await second.api.pbpDiscardPopupDraft();});
 await test('the opened page still fills title and notes when the form holds that page',async()=>{const pageUrl='https://example.com/g15-own-page';const info={url:pageUrl,title:'Own title',metaDescription:'Own meta'};
   const first=await openWorker(pageUrl);first.api.chip();await settle();
   const second=uiHarness('pinboard',{worker:true,pageInfo:info});second.elements['url-input'].value=pageUrl;second.api.prefillTitle('Tab title',pageUrl);
   await second.api.initPopupDraft('alice',{url:pageUrl});await settle();second.api.prefillTitle(info.title,info.url);second.api.prefill();
   assert(second.elements['title-input'].value==='Own title'&&second.elements['description-input'].value==='Own meta','own-page prefill was suppressed: '+JSON.stringify([second.elements['title-input'].value,second.elements['description-input'].value]));
   await second.api.pbpDiscardPopupDraft();});
 // Only a user's change renews the 24-hour lifetime: the page and the lookup
 // refilling unchanged fields of a reopened form must not keep a draft alive.
 await test('reopening and refilling unchanged fields leaves the draft expiry alone',async()=>{const pageUrl='https://example.com/g15-expiry';
   const first=await openWorker(pageUrl);typeInto(first,'title-input','My title');await settle();
   const aged=Date.now()-23*60*60*1000;rowFor(pageUrl).updatedAt=aged;
   const second=uiHarness('pinboard',{worker:true,pageInfo:{url:pageUrl,title:'Page title',metaDescription:'Meta from page'}});second.elements['url-input'].value=pageUrl;
   await second.api.initPopupDraft('alice',{url:pageUrl});await settle();
   second.api.prefill();second.api.recomputeArchiveCheck();
   for(const [id,value] of [['description-input','Notes from lookup']])if(second.api.shouldUpdateField(id))second.elements[id].value=value;
   second.elements['readlater-check'].checked=true;second.api.pbpRememberPopupDraft();await settle();
   assert(second.elements['title-input'].value==='My title','the drafted title was not restored');
   assert(!second.sent.some(m=>m.action==='write'),'refilling unchanged fields wrote the draft '+second.sent.filter(m=>m.action==='write').length+' time(s)');
   assert(rowFor(pageUrl).updatedAt===aged,'the draft expiry was renewed without a user change');
   typeInto(second,'title-input','My newer title');await settle();
   assert(rowFor(pageUrl).updatedAt>aged&&rowFor(pageUrl).draft.title==='My newer title','a real change did not renew the draft');
   await second.api.pbpDiscardPopupDraft();});
 await test('worker keeps the expiry of a row whose changed fields hold the same values',async()=>{const pageUrl='https://example.com/g15-expiry-worker';
   await run(msg('write',{pageUrl,draft:{...draft,url:pageUrl,title:'Mine',changed:['title']}}));const aged=Date.now()-23*60*60*1000;rowFor(pageUrl).updatedAt=aged;
   assert((await run(msg('write',{pageUrl,draft:{...draft,url:pageUrl,title:'Mine',notes:'Refilled',toread:false,changed:['title']}}))).ok);
   assert(rowFor(pageUrl).updatedAt===aged,'unchanged edits renewed the expiry');
   await run(msg('write',{pageUrl,draft:{...draft,url:pageUrl,title:'Mine again',changed:['title']}}));
   assert(rowFor(pageUrl).updatedAt>aged,'a changed value did not renew the expiry');
   rowFor(pageUrl).updatedAt=aged;await run(msg('write',{pageUrl,draft:{...draft,url:pageUrl,title:'Mine again',changed:['notes','title']}}));
   assert(rowFor(pageUrl).updatedAt>aged,'a longer change list did not renew the expiry');
   rowFor(pageUrl).updatedAt=aged;await run(msg('write',{pageUrl,draft:{...draft,url:pageUrl}}));await run(msg('write',{pageUrl,draft:{...draft,url:pageUrl,notes:'legacy edit'}}));
   assert(rowFor(pageUrl).updatedAt>aged,'a legacy row write did not renew the expiry');
   await run(msg('clear',{pageUrl}));});
 await test('worker keeps a valid change list and rejects anything outside the draft fields',async()=>{const pageUrl='https://example.com/g15-worker';
   assert((await run(msg('write',{pageUrl,draft:{...draft,url:pageUrl,changed:['title','tags','title']}}))).ok,'a valid change list was rejected');
   assert(JSON.stringify((await run(msg('read',{pageUrl}))).draft.changed)==='["tags","title"]','the change list was not stored canonically');
   for(const changed of [['token'],['title','apiKey'],'title',[1],[null],['__proto__'],['changed']])assert(!(await run(msg('write',{pageUrl,draft:{...draft,url:pageUrl,changed}}))).ok,'accepted change list '+JSON.stringify(changed));
   assert((await run(msg('write',{pageUrl,draft:{...draft,url:pageUrl,notes:'n2',changed:['notes']},fields:['notes']}))).ok);
   assert(JSON.stringify((await run(msg('read',{pageUrl}))).draft.changed)==='["notes","tags","title"]','a patch did not merge the change lists');
   await run(msg('write',{pageUrl,draft:{...draft,url:pageUrl}}));
   assert((await run(msg('write',{pageUrl,draft:{...draft,url:pageUrl,notes:'n3',changed:['notes']},fields:['notes']}))).ok);
   assert(!Object.hasOwn((await run(msg('read',{pageUrl}))).draft,'changed'),'a patch narrowed a legacy draft to the patched fields');});
})().catch(e=>test('suite initialization',()=>{throw e;}));
