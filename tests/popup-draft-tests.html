<!doctype html>
<html><head><meta charset="utf-8"><title>Popup Draft Tests</title></head><body>
<h1>Popup Draft Tests</h1><div id="results"></div>
<script>
const assert = (v,m) => { if(!v)throw new Error(m||'assertion failed'); };
async function test(name,fn){const d=document.createElement('div');d.className='case';try{await fn();d.classList.add('pass');d.textContent='PASS '+name;}catch(e){d.classList.add('fail');d.textContent='FAIL '+name+': '+e.message;}document.getElementById('results').append(d);}
(async()=>{
 const source=await(await fetch('../background.js')).text();
 const start=source.indexOf('async function pbpRunPopupDraft('),end=source.indexOf('// Popup drafts end',start);
 let run;
 const rows={};let owner='alice';let duringRead=null;let failSet=false;
 const session={async get(key){if(duringRead){const f=duringRead;duringRead=null;f();}return key===null?structuredClone(rows):{[key]:structuredClone(rows[key])};},async set(values){if(failSet)throw new Error('synthetic write failure');Object.assign(rows,structuredClone(values));},async remove(keys){for(const k of Array.isArray(keys)?keys:[keys])delete rows[k];}};
 const msg=(action,extra={})=>({account:'alice',action,pageUrl:'https://example.com/article',incognito:false,...extra});
 const draft={url:'https://example.com/article',title:'Edited title',notes:'Private note',tags:['One','Two'],tagInput:'unsubmitted',private:true,toread:true,archive:false,archiveTouched:true};
 const read=()=>run(msg('read'));
 await test('production draft handler can be loaded',()=>{assert(start>=0&&end>start,'draft handler is not implemented');run=new Function('chrome','getCurrentPinboardAuth','navigator',source.slice(start,end)+'\nreturn pbpRunPopupDraft;')({storage:{session}},async()=>({account:owner}),navigator);});
 await test('write and read preserve the complete form including pending tag text',async()=>{const w=await run(msg('write',{draft}));const r=await read();assert(w.ok&&r.ok&&r.account==='alice');assert(JSON.stringify(r.draft)===JSON.stringify(draft));});
 await test('stored draft contains no unrecognized fields or credentials',async()=>{await run(msg('write',{draft:{...draft,token:'FORBIDDEN',apiKey:'FORBIDDEN',content:'FORBIDDEN'}}));const row=Object.values(rows)[0];assert(!JSON.stringify(row).includes('FORBIDDEN'));});
 await test('another URL cannot restore the article draft',async()=>{assert((await run(msg('read',{pageUrl:'https://example.com/other'}))).draft===null);});
 await test('incognito and normal drafts are separate',async()=>{assert((await run(msg('read',{incognito:true}))).draft===null);});
 await test('another account cannot read a captured old-owner draft',async()=>{owner='bob';assert(!(await read()).ok);assert((await run(msg('read',{account:'bob'}))).draft===null);owner='alice';});
 await test('logout blocks both restore and write',async()=>{owner='';assert(!(await read()).ok);assert(!(await run(msg('write',{draft}))).ok);owner='alice';});
 await test('account change during storage read cannot deliver a draft',async()=>{duringRead=()=>{owner='bob';};assert(!(await read()).ok);owner='alice';});
 await test('account change before mutation cannot write old-owner content',async()=>{duringRead=()=>{owner='bob';};assert(!(await run(msg('write',{draft:{...draft,title:'MUST_NOT_WRITE'}}))).ok);owner='alice';assert((await read()).draft.title==='Edited title');});
 await test('unsupported URL and invalid payload are rejected',async()=>{assert(!(await run(msg('write',{pageUrl:'javascript:alert(1)',draft}))).ok);assert(!(await run(msg('write',{draft:{...draft,tags:[123]}}))).ok);});
 await test('expired drafts are not restored',async()=>{for(const r of Object.values(rows))r.updatedAt=Date.now()-25*60*60*1000;assert((await read()).draft===null);});
 await test('storage failure is returned without false success',async()=>{failSet=true;assert(!(await run(msg('write',{draft}))).ok);failSet=false;});
 await test('clearing a page removes only that draft',async()=>{await run(msg('write',{draft}));await run(msg('write',{pageUrl:'https://example.com/other',draft:{...draft,url:'https://example.com/other'}}));await run(msg('clear'));assert((await read()).draft===null);assert((await run(msg('read',{pageUrl:'https://example.com/other'}))).draft!==null);});
 await test('owner cleanup removes normal and incognito drafts, preserving other data',async()=>{rows.unrelated={value:1};await run(msg('write',{incognito:true,draft}));await run(msg('clearOwner'));assert(Object.keys(rows).length===1&&rows.unrelated.value===1);});
 await test('draft retention is bounded without overwriting unrelated session data',async()=>{for(let i=0;i<25;i++)await run(msg('write',{pageUrl:'https://example.com/'+i,draft:{...draft,url:'https://example.com/'+i}}));assert(Object.keys(rows).filter(k=>k.startsWith('pbp-popup-draft:')).length<=20);assert(rows.unrelated.value===1);});
 await test('successful save clears its matching submitted snapshot',async()=>{const submitted={...draft,tagInput:''};await run(msg('write',{draft:submitted}));await run(msg('clear',{expectedDraft:submitted}));assert((await read()).draft===null);});
 await test('save completion preserves newer edits and unsubmitted tag text',async()=>{await run(msg('write',{draft}));await run(msg('clear',{expectedDraft:{...draft,tagInput:''}}));assert((await read()).draft.tagInput==='unsubmitted');await run(msg('write',{draft:{...draft,title:'New edit',tagInput:''}}));await run(msg('clear',{expectedDraft:{...draft,tagInput:''}}));assert((await read()).draft.title==='New edit');});
 await test('editing an incomplete URL preserves the rest of the draft',async()=>{for(const url of ['', 'https://', '  https://example.com/new  ']){const d={...draft,url,notes:'Latest note'};assert((await run(msg('write',{draft:d}))).ok);assert(JSON.stringify((await read()).draft)===JSON.stringify(d));}});
 await test('pending restore patches only edited fields into an existing draft',async()=>{await run(msg('write',{draft}));assert((await run(msg('write',{draft:{...draft,title:'New title',notes:'',tags:[],private:false},fields:['title']}))).ok);const d=(await read()).draft;assert(d.title==='New title'&&d.notes===draft.notes&&d.private===true&&d.tags.length===2);});
 await test('patch fields cannot bypass the whitelist or final size bound',async()=>{await run(msg('write',{draft}));assert(!(await run(msg('write',{draft,fields:['token']}))).ok);const large={...draft,notes:'x'.repeat(50000)};await run(msg('write',{draft:large}));assert(!(await run(msg('write',{draft:{...draft,title:'y'.repeat(50000)},fields:['title']}))).ok);assert((await read()).draft.notes.length===50000);});
 await test('successful save clears a matching whitespace-only tag input',async()=>{const d={...draft,tagInput:'   '};await run(msg('write',{draft:d}));await run(msg('clear',{expectedDraft:d}));assert((await read()).draft===null);});
 const uiSource=await(await fetch('../popup.js')).text();
 const aiSource=await(await fetch('../popup-ai.js')).text();
 const a=uiSource.indexOf('let _popupDraftContext ='),b=uiSource.indexOf('// Popup draft UI end',a);
 function uiHarness(){
   const elements={};for(const id of ['url-input','title-input','description-input','tags-input','private-check','readlater-check','archive-check','desc-char-count','submit-btn','delete-btn','existing-banner']){const e=document.createElement('input');e.type=id.endsWith('check')?'checkbox':'text';elements[id]=e;}
   const flags={'title-input':false,'description-input':false,'private-check':false,'readlater-check':false};
   let resolveRead,rejectRead,resolveWrite,resolveClear;let delayWrite=false,delayClear=false;let currentOwner='alice';const sent=[],statuses=[];
   const deps={$id:id=>elements[id],currentTags:[],fieldDirtyFlags:flags,_tagsUserTouched:false,_archiveUserTouched:false,
     renderTags(){if(api)api.pbpRememberPopupDraft();},showStatus:(...args)=>statuses.push(args),t:k=>k,
     existingBookmark:null,settings:{waybackArchiveEnabled:true},_waybackHostGranted:true,_pageInfoReady:true,
     buildPostsAddUri:()=>'',POSTS_ADD_URI_BUDGET:8192,pbpWaybackShouldArchive:({isPrivate})=>!isPrivate,
     _activeTabAtOpen:{url:'https://example.com/article'},invalidateBookmarkLookup(){},
     _aiSummaryValue:'',_aiSummaryRange:null,_aiLastLegacySummaryRange:()=>null,_pbpAiSummaryRangeValid:()=>false,
     autoResizeTextarea(){},
     escapeForExtended:s=>s,
     checkExistingBookmark:async()=>({status:'found'}),pbpScrollIntoView(){},
     document:{body:{dataset:{}},createElement:tag=>document.createElement(tag),createTextNode:s=>document.createTextNode(s)},
     window:{location:{reload(){sent.push({action:'reload'});}}},
     chrome:{runtime:{sendMessage(m){sent.push(m);if(m.action==='read')return new Promise((r,j)=>{resolveRead=r;rejectRead=j;});if(m.action==='write'&&delayWrite)return new Promise(r=>{resolveWrite=r;});if(m.action==='clear'&&delayClear)return new Promise(r=>{resolveClear=r;});return Promise.resolve({ok:true,account:currentOwner});}}},
     pbpReadSettingsWithSecrets:async()=>({pinboardToken:currentOwner+':fake'}),pbpPinboardAccountFromToken:t=>t.split(':')[0]};
   const sliceFn=name=>{const s=uiSource.indexOf('function '+name+'(');return uiSource.slice(s,uiSource.indexOf('\n}',s)+2);};
   const recentStart=uiSource.indexOf('async function loadBookmarkForEdit('),recentEnd=uiSource.indexOf('// ===================== Recent Bookmarks',recentStart);
   const aiSlice=name=>{const s=aiSource.indexOf('function '+name+'(');return aiSource.slice(s,aiSource.indexOf('\n}',s)+2);};
   const names=Object.keys(deps);let api;api=new Function(...names,[uiSource.slice(a,b),sliceFn('pbpPopupFormIsDirty'),sliceFn('updateCharCount'),sliceFn('recomputeArchiveCheck'),uiSource.slice(recentStart,recentEnd),aiSlice('pbpAiWrapSummary'),aiSlice('upsertSummary'),
     'return {initPopupDraft,setupPopupDraftTracking,pbpPopupDraftSnapshot,pbpRememberPopupDraft,pbpDiscardPopupDraft,updateCharCount,recomputeArchiveCheck,loadBookmarkForEdit,exitEditMode,pbpPopupFormIsDirty,upsertSummary,chip(){_tagsUserTouched=true;currentTags.push("Chip");renderTags();},failedSubmit(){'+uiSource.slice(uiSource.indexOf('      Object.keys(fieldDirtyFlags).forEach',uiSource.indexOf('function setupSubmit(')),uiSource.indexOf('      // Host permission first:',uiSource.indexOf('function setupSubmit(')))+'}};'].join('\n'))(...names.map(n=>deps[n]));api.setupPopupDraftTracking();
   return {api,elements,flags,sent,statuses,delayClears(){delayClear=true;},releaseClear:ok=>resolveClear({ok}),delayWrites(){delayWrite=true;},failWrite(){resolveWrite({ok:false});},rejectRestore:()=>rejectRead(new Error('Synthetic IPC failure')),failRestore:()=>resolveRead({ok:false,error:'storage'}),release:(d=draft)=>resolveRead({ok:true,account:'alice',draft:d}),owner:o=>{currentOwner=o;}};
 }
 await test('restore applies the full form and guards later prefills',async()=>{const h=uiHarness();const pending=h.api.initPopupDraft('alice',{url:'https://example.com/article'});h.release();await pending;assert(JSON.stringify(h.api.pbpPopupDraftSnapshot())===JSON.stringify(draft));assert(Object.values(h.flags).every(Boolean));});
 await test('typing during asynchronous restore wins while untouched fields survive',async()=>{const h=uiHarness();h.elements['url-input'].value='https://example.com/article';const pending=h.api.initPopupDraft('alice',{url:'https://example.com/article'});h.elements['title-input'].value='New input';h.elements['title-input'].dispatchEvent(new Event('input'));h.release();await pending;assert(h.elements['title-input'].value==='New input');assert(h.elements['description-input'].value===draft.notes&&h.elements['private-check'].checked);assert(h.sent.some(m=>m.action==='write'&&m.draft.title==='New input'));});
 await test('restore rechecks the current account before changing any field',async()=>{const h=uiHarness();const pending=h.api.initPopupDraft('alice',{url:'https://example.com/article'});h.owner('bob');h.release();await pending;assert(h.elements['title-input'].value==='');assert(!h.sent.some(m=>m.action==='write'));});
 await test('input dispatches immediately with the scoped incognito owner',async()=>{const h=uiHarness();const pending=h.api.initPopupDraft('alice',{url:'https://example.com/article',incognito:true});h.release();await pending;h.elements['description-input'].value='Fast close';h.elements['description-input'].dispatchEvent(new Event('input'));assert(h.sent.at(-1).action==='write'&&h.sent.at(-1).incognito===true&&h.sent.at(-1).account==='alice');await h.api.pbpDiscardPopupDraft(true);assert(h.sent.at(-1).action==='clearOwner');});
 await test('input dispatches a field patch before the restore response arrives',async()=>{const h=uiHarness();const pending=h.api.initPopupDraft('alice',{url:'https://example.com/article'});h.elements['title-input'].value='Fast close';h.elements['title-input'].dispatchEvent(new Event('input'));const m=h.sent.find(m=>m.action==='write');assert(m&&m.draft.title==='Fast close'&&m.fields.length===1&&m.fields[0]==='title');h.release();await pending;});
 await test('passive restore does not write or extend draft retention',async()=>{const h=uiHarness();const p=h.api.initPopupDraft('alice',{url:'https://example.com/article'});h.release();await p;h.api.updateCharCount();assert(!h.sent.some(m=>m.action==='write'));});
 await test('programmatic summary and default archive changes update an edited draft',async()=>{const h=uiHarness();const p=h.api.initPopupDraft('alice',{url:'https://example.com/article'});h.release(null);await p;h.elements['description-input'].value='Manual note';h.elements['description-input'].dispatchEvent(new Event('input'));h.elements['description-input'].value='AI summary';h.elements['private-check'].checked=true;h.elements['readlater-check'].checked=true;h.api.updateCharCount();assert(h.sent.at(-1).draft.notes==='AI summary'&&h.sent.at(-1).draft.private&&h.sent.at(-1).draft.toread);h.elements['private-check'].checked=false;h.api.recomputeArchiveCheck();assert(h.sent.at(-1).draft.archive===true);});
 await test('chip-only edits remain dirty after a failed submit resets the lookup baseline',async()=>{const h=uiHarness();const p=h.api.initPopupDraft('alice',{url:'https://example.com/article'});h.release(null);await p;h.api.chip();h.api.failedSubmit();assert(h.api.pbpPopupFormIsDirty());});
 await test('recent edit retains the source scope and cancel clears before reload',async()=>{const h=uiHarness();const p=h.api.initPopupDraft('alice',{url:'https://example.com/article'});h.release(null);await p;await h.api.loadBookmarkForEdit('https://example.com/recent','alice:fake');h.elements['description-input'].value='Recent draft';h.elements['description-input'].dispatchEvent(new Event('input'));assert(h.sent.at(-1).pageUrl==='https://example.com/article'&&h.sent.at(-1).draft.url==='https://example.com/recent');await h.api.exitEditMode();assert(h.sent.at(-2).action==='clear'&&h.sent.at(-1).action==='reload');});
 await test('duplicate input/change events do not hide an asynchronous write failure',async()=>{const h=uiHarness();const p=h.api.initPopupDraft('alice',{url:'https://example.com/article'});h.release(null);await p;h.delayWrites();const el=h.elements['private-check'];el.checked=true;el.dispatchEvent(new Event('input'));el.dispatchEvent(new Event('change'));assert(h.sent.filter(m=>m.action==='write').length===1);h.failWrite();await Promise.resolve();assert(h.statuses.some(s=>s[1]==='popupDraftFailed'));h.api.pbpRememberPopupDraft();assert(h.sent.filter(m=>m.action==='write').length===2);});
 await test('restore failure keeps patch writes so unread fields are never overwritten',async()=>{const h=uiHarness();const p=h.api.initPopupDraft('alice',{url:'https://example.com/article'});h.elements['title-input'].value='New title';h.elements['title-input'].dispatchEvent(new Event('input'));h.failRestore();await p;h.elements['tags-input'].value='Pending';h.elements['tags-input'].dispatchEvent(new Event('input'));assert(h.sent.filter(m=>m.action==='write').every(m=>m.fields&&m.fields.includes('title')&&!m.fields.includes('notes')&&!m.fields.includes('private')));assert(h.statuses.some(s=>s[1]==='popupDraftFailed'));});
 await test('input accumulated before scope initialization is dispatched and merged',async()=>{const h=uiHarness();h.elements['description-input'].value='Typed before init';h.elements['description-input'].dispatchEvent(new Event('input'));const p=h.api.initPopupDraft('alice',{url:'https://example.com/article'});assert(h.sent.some(m=>m.action==='write'&&m.fields?.includes('notes')));h.release();await p;assert(h.api.pbpPopupDraftSnapshot().notes==='Typed before init');assert(h.sent.some(m=>m.action==='write'&&m.draft.notes==='Typed before init'));});
 await test('rejected restore reports failure and subsequent edits stay patches',async()=>{const h=uiHarness();const p=h.api.initPopupDraft('alice',{url:'https://example.com/article'});h.rejectRestore();await p;assert(h.statuses.some(s=>s[1]==='popupDraftFailed'));h.elements['description-input'].value='Retained';h.elements['description-input'].dispatchEvent(new Event('input'));assert(h.sent.at(-1).fields?.join(',')==='notes');});
 await test('a generated summary as the first edit is preserved and protects recent switching',async()=>{const h=uiHarness();const p=h.api.initPopupDraft('alice',{url:'https://example.com/article'});h.release(null);await p;h.api.upsertSummary('Paid AI result');assert(h.api.pbpPopupFormIsDirty()&&h.sent.at(-1).action==='write'&&h.sent.at(-1).draft.notes.includes('Paid AI result'));});
 await test('automatic summary prefill does not mark a clean form as user edited',async()=>{const h=uiHarness();const p=h.api.initPopupDraft('alice',{url:'https://example.com/article'});h.release(null);await p;h.api.upsertSummary('Cached prefill',{userEdit:false});assert(!h.api.pbpPopupFormIsDirty()&&!h.sent.some(m=>m.action==='write'));});
 await test('cancel prevents late programmatic writes from recreating the discarded draft',async()=>{const h=uiHarness();const p=h.api.initPopupDraft('alice',{url:'https://example.com/article'});h.release();await p;h.delayClears();const clearing=h.api.exitEditMode();h.elements['description-input'].value='Late AI result';h.api.updateCharCount();assert(!h.sent.some(m=>m.action==='write'));h.releaseClear(true);await clearing;assert(h.sent.at(-1).action==='reload');});
 await test('failed cancel leaves the draft editable without reloading',async()=>{const h=uiHarness();const p=h.api.initPopupDraft('alice',{url:'https://example.com/article'});h.release();await p;h.delayClears();const clearing=h.api.exitEditMode();h.releaseClear(false);await clearing;assert(!h.sent.some(m=>m.action==='reload'));h.elements['description-input'].value='Retry edit';h.elements['description-input'].dispatchEvent(new Event('input'));assert(h.sent.at(-1).action==='write');});
})().catch(e=>test('suite initialization',()=>{throw e;}));
</script></body></html>
