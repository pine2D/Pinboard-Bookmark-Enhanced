<script>
// ============ Task 10: pbpTrRunQueue (async, self-reporting) ============
(async function () {
  const host = document.createElement("div");
  host.className = "suite";
  const h = document.createElement("h2");
  h.textContent = "pbpTrRunQueue (async)";
  host.appendChild(h);
  document.getElementById("results").appendChild(host);
  let qpass = 0, qfail = 0;
  function report(name, err) {
    const div = document.createElement("div");
    if (!err) { qpass++; div.className = "case pass"; div.textContent = "PASS " + name; }
    else { qfail++; div.className = "case fail"; div.textContent = "FAIL " + name + "\n  " + err.message; }
    host.appendChild(div);
  }
  async function atest(name, fn) {
    try { await fn(); report(name); } catch (e) { report(name, e); }
  }
  function ok(cond, msg) { if (!cond) throw new Error(msg || "assert"); }
  if (typeof pbpTrRunQueue !== "function") {
    const div = document.createElement("div");
    div.className = "case skip";
    div.textContent = "SKIP pbpTrRunQueue suite (not loaded)";
    host.appendChild(div);
    return;
  }
  // Streams every requested segment back reversed (valid ratio), tracks concurrency.
  function goodBatchFn(state) {
    return async (segments, onItem) => {
      state.inflight++;
      state.maxInflight = Math.max(state.maxInflight, state.inflight);
      await new Promise((r) => setTimeout(r, 5));
      const seen = new Set();
      for (const s of segments) { onItem({ id: s.id, text: "T:" + s.text }); seen.add(s.id); }
      state.inflight--;
      return { seenIds: seen };
    };
  }
  const segs = (ids) => ids.map((id) => ({ id, text: "source text for block " + id }));

  await atest("happy path: all blocks filled, progress monotonic, none failed", async () => {
    const state = { inflight: 0, maxInflight: 0 };
    const fills = [], progress = [];
    const r = await pbpTrRunQueue({
      batches: [segs([1, 2]), segs([3]), segs([4, 5])],
      requestBatch: goodBatchFn(state),
      requestSingle: async () => { throw new Error("must not downgrade"); },
      onFill: (id, t) => fills.push(id), onBlockFail: () => { throw new Error("no fails expected"); },
      onProgress: (d, t) => progress.push(d + "/" + t)
    });
    ok(r.done === 5 && r.total === 5 && r.failed.length === 0 && !r.stopped, "result: " + JSON.stringify(r));
    ok(fills.slice().sort((a, b) => a - b).join(",") === "1,2,3,4,5", "all filled");
    ok(progress[progress.length - 1] === "5/5", "final progress");
    ok(state.maxInflight <= 2, "concurrency capped at 2, saw " + state.maxInflight);
  });

  await atest("CJK target code lets a complete compressed batch result fill directly", async () => {
    const source = "Amazons Tipp empfiehlt hoch bewertete Produkte mit einem guten Preis-Leistungs-Verhältnis, die sofort versendet werden können.";
    let singles = 0;
    const r = await pbpTrRunQueue({
      targetCode: "zh-CN",
      batches: [[{ id: 1, text: source }]],
      requestBatch: async (segments, onItem) => {
        onItem({ id: segments[0].id, text: "亚马逊推荐评分高、性价比好且可立即发货的商品。" });
        return { seenIds: new Set([1]) };
      },
      requestSingle: async () => { singles++; return null; },
      onFill: () => {}, onBlockFail: () => { throw new Error("no fail"); }, onProgress: () => {}
    });
    ok(r.done === 1 && r.failed.length === 0 && singles === 0, JSON.stringify(r));
  });

  await atest("missing id from stream -> single downgrade fills it", async () => {
    const r = await pbpTrRunQueue({
      batches: [segs([1, 2, 3])],
      requestBatch: async (segments, onItem) => {
        for (const s of segments) if (s.id !== 2) onItem({ id: s.id, text: "T:" + s.text });
        return { seenIds: new Set([1, 3]) };
      },
      requestSingle: async (seg) => "single:" + seg.text,
      onFill: () => {}, onBlockFail: () => { throw new Error("no fail"); }, onProgress: () => {}
    });
    ok(r.done === 3 && r.failed.length === 0, "downgrade filled: " + JSON.stringify(r));
  });

  await atest("K95: missing id logs one truncation observation, no batch text in payload", async () => {
    // Deliberately digit-free source words (unlike segs()'s "block " + id) so a
    // stray numeral in the payload (missing: 1, chars: NN) can't false-positive
    // the leak check below.
    const batch = [
      { id: 1, text: "alpha bravo charlie delta echo foxtrot" },
      { id: 2, text: "golf hotel india juliet kilo lima" },
      { id: 3, text: "mike november oscar papa quebec romeo" }
    ];
    const warnCalls = [];
    const realWarn = console.warn;
    console.warn = (...args) => { warnCalls.push(args); };
    try {
      const r = await pbpTrRunQueue({
        targetCode: "en",
        batches: [batch],
        requestBatch: async (segments, onItem) => {
          for (const s of segments) if (s.id !== 2) onItem({ id: s.id, text: "T:" + s.text });
          return { seenIds: new Set([1, 3]) };
        },
        requestSingle: async (seg) => "single:" + seg.text,
        onFill: () => {}, onBlockFail: () => { throw new Error("no fail"); }, onProgress: () => {}
      });
      ok(r.done === 3 && r.failed.length === 0, "downgrade still fills: " + JSON.stringify(r));
      ok(warnCalls.length === 1, "exactly one console.warn call for the whole batch, saw " + warnCalls.length);
      const [prefix, payload] = warnCalls[0];
      ok(prefix === "[pbp-tr] batch truncated:", "warn prefix: " + prefix);
      ok(payload && typeof payload === "object", "payload is an object");
      ok(Object.keys(payload).sort().join(",") === "chars,cjkShare,missing,target", "payload keys: " + Object.keys(payload).join(","));
      ok(typeof payload.chars === "number" && payload.chars > 0, "chars is a positive number: " + payload.chars);
      ok(typeof payload.cjkShare === "number", "cjkShare is a number: " + payload.cjkShare);
      ok(payload.missing === 1, "missing count is 1: " + payload.missing);
      ok(payload.target === "en", "target language code preserved: " + payload.target);
      const serialized = JSON.stringify(payload);
      const sourceWords = batch.map((s) => s.text).join(" ").split(/\s+/).filter(Boolean);
      for (const word of sourceWords) ok(serialized.indexOf(word) === -1, "payload leaked source word: " + word);
    } finally {
      console.warn = realWarn;
    }
  });

  await atest("ratio-failed item goes to downgrade; failed single -> onBlockFail", async () => {
    const failedIds = [];
    const r = await pbpTrRunQueue({
      batches: [segs([1, 2])],
      requestBatch: async (segments, onItem) => {
        onItem({ id: 1, text: "T:" + segments[0].text });
        onItem({ id: 2, text: "x".repeat(160) }); // runaway expansion (t > o*4+20) -> rejected fill
        return { seenIds: new Set([1, 2]) };
      },
      requestSingle: async () => null, // downgrade also unusable
      onFill: () => {}, onBlockFail: (id) => failedIds.push(id), onProgress: () => {}
    });
    ok(r.done === 1 && r.failed.length === 1 && failedIds.join(",") === "2", JSON.stringify(r));
  });

  await atest("429 backs off then succeeds; pool drains to 1 worker", async () => {
    const state = { inflight: 0, maxInflight: 0 };
    let rejections = 0, slept = [];
    const good = goodBatchFn(state);
    const r = await pbpTrRunQueue({
      batches: [segs([1]), segs([2]), segs([3])],
      backoffMs: [1, 1, 1],
      sleep: async (ms) => { slept.push(ms); },
      requestBatch: async (segments, onItem) => {
        if (rejections < 2) { rejections++; throw new Error("API failed (HTTP 429)"); }
        return good(segments, onItem);
      },
      requestSingle: async () => { throw new Error("no downgrade"); },
      onFill: () => {}, onBlockFail: () => { throw new Error("no fail"); }, onProgress: () => {}
    });
    ok(r.done === 3 && r.failed.length === 0, "all eventually filled: " + JSON.stringify(r));
    ok(slept.length === 2, "two backoffs, got " + slept.length);
  });

  await atest("non-429 batch error fails all unfilled blocks of that batch", async () => {
    const failedIds = [];
    const r = await pbpTrRunQueue({
      batches: [segs([1, 2]), segs([3])],
      requestBatch: async (segments, onItem) => {
        if (segments[0].id === 1) throw new Error("API failed (HTTP 500)");
        for (const s of segments) onItem({ id: s.id, text: "T:" + s.text });
        return { seenIds: new Set(segments.map((s) => s.id)) };
      },
      requestSingle: async () => { throw new Error("no downgrade"); },
      onFill: () => {}, onBlockFail: (id) => failedIds.push(id), onProgress: () => {}
    });
    ok(r.done === 1 && r.failed.length === 2, JSON.stringify(r));
    ok(failedIds.slice().sort().join(",") === "1,2", "batch-1 blocks failed");
  });

  await atest("D4-1: every block fails -> onProgress still fires (progress line must not freeze on stale text)", async () => {
    const progress = [];
    const r = await pbpTrRunQueue({
      batches: [segs([1, 2]), segs([3])],
      requestBatch: async () => { throw new Error("network error"); }, // offline: every batch hard-fails
      requestSingle: async () => { throw new Error("no downgrade"); },
      onFill: () => { throw new Error("no fill expected"); },
      onBlockFail: () => {},
      onProgress: (d, total) => progress.push(d + "/" + total)
    });
    ok(r.done === 0 && r.failed.length === 3 && r.total === 3, "all 3 failed: " + JSON.stringify(r));
    ok(progress.length === 3, "onProgress called once per failed block, got " + progress.length);
    ok(progress.every((p) => p === "0/3"), "each repaint reflects 0 done: " + JSON.stringify(progress));
  });

  await atest("abort stops claiming work and resolves stopped:true", async () => {
    const ctrl = new AbortController();
    let calls = 0;
    const r = await pbpTrRunQueue({
      batches: [segs([1]), segs([2]), segs([3]), segs([4])],
      concurrency: 1,
      signal: ctrl.signal,
      requestBatch: async (segments, onItem) => {
        calls++;
        if (calls === 1) ctrl.abort(); // Stop pressed mid-first-batch
        for (const s of segments) onItem({ id: s.id, text: "T:" + s.text });
        return { seenIds: new Set(segments.map((s) => s.id)) };
      },
      requestSingle: async () => { throw new Error("no downgrade"); },
      onFill: () => {}, onBlockFail: () => { throw new Error("no fail"); }, onProgress: () => {}
    });
    ok(r.stopped === true, "stopped flag");
    ok(calls === 1, "no further batches claimed, calls=" + calls);
    ok(r.done === 1 && r.total === 4, "partial: " + JSON.stringify(r));
  });

  await atest("host permission pauses the whole queue without per-block failures", async () => {
    const err = new Error("permission needed");
    err.code = "host_permission";
    let failed = 0, singles = 0;
    const r = await pbpTrRunQueue({
      batches: [segs([1, 2, 3])],
      requestBatch: async () => { throw err; },
      requestSingle: async () => { singles++; return null; },
      onFill: () => { throw new Error("no fill expected"); },
      onBlockFail: () => { failed++; }, onProgress: () => {}
    });
    ok(r.permissionError === err, "permission error not preserved");
    ok(r.done === 0 && r.failed.length === 0 && failed === 0 && singles === 0,
      "permission failure fragmented into block retries: " + JSON.stringify(r));
  });

  const sum = document.createElement("div");
  sum.id = "tr-queue-summary";
  sum.className = "case " + (qfail ? "fail" : "pass");
  sum.textContent = "TR-QUEUE SUMMARY: " + qpass + " passed, " + qfail + " failed";
  host.appendChild(sum);
})();
</script>
<script>
// ============ Group K2: per-block retry passes a fresh, abortable signal ============
(async function () {
  const host = document.createElement("div");
  host.className = "suite";
  const h = document.createElement("h2");
  h.textContent = "_pbpTrTranslateBlock / _pbpTrRetryBlock signal (async)";
  host.appendChild(h);
  document.getElementById("results").appendChild(host);
  function report(name, err) {
    const div = document.createElement("div");
    if (!err) { PASS++; div.className = "case pass"; div.textContent = "PASS " + name; }
    else { FAIL++; div.className = "case fail"; div.textContent = "FAIL " + name + "\n  " + err.message; }
    host.appendChild(div);
  }
  async function atest(name, fn) { return atestNetSerial(name, fn, report); } // shares the network-stub queue (see atestNetSerial)
  if (typeof _pbpTrTranslateBlock !== "function" || typeof _pbpTrRetryBlock !== "function") {
    const div = document.createElement("div");
    div.className = "case skip";
    div.textContent = "SKIP _pbpTrRetryBlock suite (not loaded)";
    host.appendChild(div); SKIP++; return;
  }

  // Minimal st: _pbpTrTranslateBlock reads s, target.name, title, translateGlossary.
  function makeSt() {
    return {
      s: { aiProvider: "gemini", geminiApiKey: "k", translateGlossary: "" },
      target: { name: "Simplified Chinese", code: "zh-CN" },
      title: "T", url: "https://a.test/x", modelKey: "m",
      work: [], trMd: {}
    };
  }
  const w = { n: 1, hash: "h1", shielded: { text: "hello world" } };

  await atest("_pbpTrTranslateBlock forwards the signal to callAIStream opts", async () => {
    const realStream = window.callAIStream;
    let seenSignal = "ABSENT";
    window.callAIStream = async (s, prompt, opts) => {
      seenSignal = ("signal" in opts) ? opts.signal : "ABSENT";
      // emit a valid translation for id 1 via the parser the caller wires
      return '{"translations":[{"id":1,"text":"你好世界你好"}]}';
    };
    try {
      const ctrl = new AbortController();
      await _pbpTrTranslateBlock(makeSt(), w, ctrl.signal);
      if (seenSignal === "ABSENT") throw new Error("opts.signal not passed to callAIStream");
      if (seenSignal !== ctrl.signal) throw new Error("a DIFFERENT signal was passed");
    } finally { window.callAIStream = realStream; }
  });

  await atest("_pbpTrRetryBlock uses a fresh signal, not the (possibly aborted) st.ctrl", async () => {
    const realStream = window.callAIStream;
    const prevChrome = window.chrome;
    let seenSignal = "ABSENT", abortedAtCall = "n/a";
    window.callAIStream = async (s, prompt, opts) => {
      seenSignal = ("signal" in opts) ? opts.signal : "ABSENT";
      abortedAtCall = seenSignal && typeof seenSignal === "object" ? seenSignal.aborted : "no-signal";
      return '{"translations":[{"id":1,"text":"你好世界你好"}]}';
    };
    // _pbpTrRetryBlock success path calls _pbpTrShowViewToggle → t() → chrome.i18n.getMessage.
    // Stub chrome.i18n so the test harness (no extension context) doesn't throw.
    window.chrome = { i18n: { getMessage: () => "" } };
    const st = makeSt();
    st.ctrl = new AbortController();
    st.ctrl.abort();                       // simulate a finished/stopped main run
    const btn = document.createElement("button");
    try {
      await _pbpTrRetryBlock(st, w, btn);
      if (seenSignal === "ABSENT") throw new Error("retry passed no signal");
      if (seenSignal === st.ctrl.signal) throw new Error("retry reused the aborted st.ctrl");
      if (abortedAtCall !== false) throw new Error("retry's signal was already aborted at call time");
    } finally {
      window.callAIStream = realStream;
      window.chrome = prevChrome;
    }
  });

  await atest("A7 symmetry: _pbpTrTranslateBlock sends the same header ctx to continuation table parts as the queue path", async () => {
    const realStream = window.callAIStream;
    const header = "| Col A | Col B |\n| --- | --- |";
    let body = "";
    for (let i = 0; i < 400; i++) body += "\n| value " + i + " | data data data data |";
    const bigTable = header + body;
    const split = _pbpTrSplitText(bigTable, PBP_TR_PART_LIMIT);
    if (split.chunks.length < 2) throw new Error("fixture must split into >=2 parts");
    const ctx = _pbpTrTableHeaderCtx(split.chunks);
    if (!ctx) throw new Error("ctx expected for this fixture");
    const bigW = { n: 9, hash: "h9", shielded: { text: bigTable } };
    const sentTexts = [];
    window.callAIStream = async (s, prompt) => {
      // Echo the sent segment text back verbatim -- a clean round-trip that
      // must NOT trip the A7 shape gate, so this test isolates the "was ctx
      // sent" question from the shape-gate behavior covered separately above.
      const payload = JSON.parse(prompt);
      const seg = payload.segments[0];
      sentTexts.push(seg.text);
      return JSON.stringify({ translations: [{ id: seg.id, text: seg.text }] });
    };
    try {
      const ctrl = new AbortController();
      const result = await _pbpTrTranslateBlock(makeSt(), bigW, ctrl.signal);
      if (sentTexts.length !== split.chunks.length) {
        throw new Error("call count must match part count: " + sentTexts.length + " vs " + split.chunks.length);
      }
      if (sentTexts[0] !== split.chunks[0]) throw new Error("part 0 sent bare -- it IS the header, no ctx to prepend");
      for (let i = 1; i < split.chunks.length; i++) {
        if (split.chunks[i].lastIndexOf("|", 0) !== 0) continue;   // trailing prose tail stays untouched
        if (sentTexts[i] !== ctx.text + split.chunks[i]) {
          throw new Error("continuation part " + i + " must carry the header ctx, same as _pbpTrStart's seg-build loop");
        }
      }
      if (result.partial) throw new Error("a clean echo round-trip must not trip the A7 shape gate");
    } finally { window.callAIStream = realStream; }
  });
})();
</script>

// ============ Task 11: view composition + lang resolution ============
suiteIf("pbpTrResolveTargetLang / entry visibility", "pbpTrResolveTargetLang", () => {
  test("auto follows the passed UI language; display localized, prompt name English", () => {
    const r = pbpTrResolveTargetLang({ translateTargetLang: "auto" }, "zh-Hans");
    assertEq(r.code, "zh-Hans", "code");
    assertEq(r.name, "Simplified Chinese", "human name for prompt (English)");
    assert(r.display.indexOf("简") >= 0, "display localized for zh UI: " + r.display);
  });
  test("stored code maps to human name; display localizes to UI lang", () => {
    assertEq(pbpTrResolveTargetLang({ translateTargetLang: "ja" }, "en").name, "Japanese", "ja");
    assertEq(pbpTrResolveTargetLang({ translateTargetLang: "pl" }, "en").name, "Polish", "pl");
    // en target in a zh UI -> prompt stays "English", display becomes 英语-ish
    const r = pbpTrResolveTargetLang({ translateTargetLang: "en" }, "zh-Hans");
    assertEq(r.name, "English", "prompt name stays English");
    assert(r.display.indexOf("英") >= 0, "display localized: " + r.display);
    // en UI: display equals the English name (no regression)
    assertEq(pbpTrResolveTargetLang({ translateTargetLang: "ja" }, "en").display, "Japanese", "en UI display");
  });
  test("custom free text: code+name verbatim (prompt), display shown verbatim too", () => {
    const r = pbpTrResolveTargetLang({ translateTargetLang: "Classical Chinese" }, "en");
    assertEq(r.code, "Classical Chinese", "code passthrough");
    assertEq(r.name, "Classical Chinese", "name passthrough (prompt)");
    assertEq(r.display, "Classical Chinese", "display verbatim (Intl can't resolve)");
    // CJK custom (e.g. 文言文): Intl throws -> user sees exactly what they typed
    const r2 = pbpTrResolveTargetLang({ translateTargetLang: "文言文" }, "zh-Hans");
    assertEq(r2.name, "文言文", "CJK custom name for prompt");
    assertEq(r2.display, "文言文", "CJK custom shown verbatim");
  });
  test("missing setting falls back to auto", () => {
    assertEq(pbpTrResolveTargetLang({}, "de").code, "de", "default auto");
  });
  test("entry hidden ONLY when article lang == target lang (both non-empty)", () => {
    assert(_pbpTrShouldHideEntry("zh-Hans", "zh-Hans") === true, "same as target -> hide");
    assert(_pbpTrShouldHideEntry("", "zh-Hans") === false, "unknown article -> show");
    assert(_pbpTrShouldHideEntry("zh-Hans", "") === false, "unknown target -> show");
    assert(_pbpTrShouldHideEntry("ja", "zh-Hans") === false, "different from target -> show");
    assert(_pbpTrShouldHideEntry("", "") === false, "both empty -> show");
  });
  test("gate uses resolved TARGET lang, not UI lang", () => {
    // zh UI, explicit en target, zh article -> must SHOW (zh->en is useful)
    const tEn = pbpTrResolveTargetLang({ translateTargetLang: "en" }, "zh-Hans");
    assert(_pbpTrShouldHideEntry("zh-Hans", tEn.code) === false, "zh article + en target -> show");
    // zh UI, auto target (=zh), zh article -> HIDE (zh->zh is a no-op)
    const tAuto = pbpTrResolveTargetLang({ translateTargetLang: "auto" }, "zh-Hans");
    assert(_pbpTrShouldHideEntry("zh-Hans", tAuto.code) === true, "zh article + auto(zh) target -> hide");
  });
});

  // 20 shielded placeholders: each ⟦L1⟧..⟦L20⟧ carries a Latin letter that MUST

  // dilution case below would wrongly drop under the 0.7 threshold.
  const dilute = " ⟦L1⟧⟦L2⟧⟦L3⟧⟦L4⟧⟦L5⟧⟦L6⟧⟦L7⟧⟦L8⟧⟦L9⟧⟦L10⟧⟦L11⟧⟦L12⟧⟦L13⟧⟦L14⟧⟦L15⟧⟦L16⟧⟦L17⟧⟦L18⟧⟦L19⟧⟦L20⟧";

    // [CLIMT], every un-stripped "T" letter would itself count toward \p{L},

  // -- ru / uk / bg (Cyrillic) --

  });
  test("ru: placeholder dilution doesn't sink the ratio", () => {
    assertEq(pbpTrBlockIsTargetLang(ruHit + dilute, "ru"), true, "ru dilution");
  });
  test("uk alias resolves to the Cyrillic branch", () => {
    assertEq(pbpTrBlockIsTargetLang(ruHit, "uk"), true, "uk alias");
  });
  test("bg alias resolves to the Cyrillic branch", () => {
    assertEq(pbpTrBlockIsTargetLang(ruHit, "bg"), true, "bg alias");
  });

  // -- el (Greek) --
  test("el: Greek block >=0.7 ratio -> skip", () => {
    assertEq(pbpTrBlockIsTargetLang(elHit, "el"), true, "el hit");
  });
  test("el: English block -> not skip", () => {
    assertEq(pbpTrBlockIsTargetLang(enLong, "el"), false, "el miss");
  });
  test("el: below the 20-letter minimum -> not skip", () => {
    assertEq(pbpTrBlockIsTargetLang("Ναι", "el"), false, "el short");
  });
  test("el: half Greek half Latin -> not skip", () => {
    assertEq(pbpTrBlockIsTargetLang(elHit + " " + enLong, "el"), false, "el mixed");
  });
  test("el: placeholder dilution doesn't sink the ratio", () => {
    assertEq(pbpTrBlockIsTargetLang(elHit + dilute, "el"), true, "el dilution");
  });

  // -- ar / fa / ur (Arabic script) --
  test("ar: Arabic block >=0.7 ratio -> skip", () => {
    assertEq(pbpTrBlockIsTargetLang(arHit, "ar"), true, "ar hit");
  });
  test("ar: English block -> not skip", () => {
    assertEq(pbpTrBlockIsTargetLang(enLong, "ar"), false, "ar miss");
  });
  test("ar: below the 20-letter minimum -> not skip", () => {
    assertEq(pbpTrBlockIsTargetLang("نعم", "ar"), false, "ar short");
  });
  test("ar: half Arabic half Latin -> not skip", () => {
    assertEq(pbpTrBlockIsTargetLang(arHit + " " + enLong, "ar"), false, "ar mixed");
  });
  test("ar: placeholder dilution doesn't sink the ratio", () => {
    assertEq(pbpTrBlockIsTargetLang(arHit + dilute, "ar"), true, "ar dilution");
  });
  test("fa alias resolves to the Arabic branch", () => {
    assertEq(pbpTrBlockIsTargetLang(arHit, "fa"), true, "fa alias");
  });
  test("ur alias resolves to the Arabic branch", () => {
    assertEq(pbpTrBlockIsTargetLang(arHit, "ur"), true, "ur alias");
  });

  // -- he (Hebrew) --
  test("he: Hebrew block >=0.7 ratio -> skip", () => {
    assertEq(pbpTrBlockIsTargetLang(heHit, "he"), true, "he hit");
  });
  test("he: English block -> not skip", () => {
    assertEq(pbpTrBlockIsTargetLang(enLong, "he"), false, "he miss");
  });
  test("he: below the 20-letter minimum -> not skip", () => {
    assertEq(pbpTrBlockIsTargetLang("כן", "he"), false, "he short");
  });
  test("he: half Hebrew half Latin -> not skip", () => {
    assertEq(pbpTrBlockIsTargetLang(heHit + " " + enLong, "he"), false, "he mixed");
  });
  test("he: placeholder dilution doesn't sink the ratio", () => {
    assertEq(pbpTrBlockIsTargetLang(heHit + dilute, "he"), true, "he dilution");
  });

  // -- Latin targets: NEVER skip (the honest boundary, spec sec.3) --
  test("en target: English-in-English never skips (heuristic can't tell en from fr/de/es)", () => {
    assertEq(pbpTrBlockIsTargetLang(enLong, "en"), false, "en never skips");
  });
  test("fr target: French-in-French never skips", () => {
    assertEq(pbpTrBlockIsTargetLang(frHit, "fr"), false, "fr never skips");
  });
  test("en target: a Han block still never skips (no Latin branch exists at all)", () => {
    assertEq(pbpTrBlockIsTargetLang(zhHit, "en"), false, "han->en never skips");
  });

  // -- defensive / edge inputs --
  test("null text -> false", () => {
    assertEq(pbpTrBlockIsTargetLang(null, "zh-Hans"), false, "null text");
  });
  test("null targetCode -> false (falls through every branch)", () => {
    assertEq(pbpTrBlockIsTargetLang(zhHit, null), false, "null target");
  });
  test("empty targetCode -> false", () => {
    assertEq(pbpTrBlockIsTargetLang(zhHit, ""), false, "empty target");
  });
  test("empty text -> false", () => {
    assertEq(pbpTrBlockIsTargetLang("", "zh-Hans"), false, "empty text");
  });
});

// ============ Task 13: pbpAskBuildContext ============
suiteIf("pbpAskBuildContext", "pbpAskBuildContext", () => {
  function ctxBlocks(html) {
    const root = document.createElement("div");
    root.innerHTML = html;
    return pbpAiIndexBlocks(root);
  }
  test("small set fits whole: every [Pn] line, order kept, default budget", () => {
    const r = pbpAskBuildContext(ctxBlocks("<p>one</p><p>two</p><p>three</p><p>four</p>"));
    assertEq(r.totalBlocks, 4, "total");
    assertEq(r.sentBlocks, 4, "all sent");
    assertEq(r.text, "[P1] one\n[P2] two\n[P3] three\n[P4] four", "exact lines");
  });
  test("block text is whitespace-collapsed in its line", () => {
    const r = pbpAskBuildContext(ctxBlocks("<p>a   b\n c</p>"), 1000);
    assertEq(r.text, "[P1] a b c", "collapsed");
  });
  test("D10-1: a rendered KaTeX block contributes $tex$ to the model context, not the expanded glyph+MathML string", () => {
    const html = '<p>see <span class="katex"><span class="katex-mathml"><math><semantics><mrow></mrow><annotation encoding="application/x-tex">E=mc^2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true">Emc2glyphs</span></span> here</p>';
    const r = pbpAskBuildContext(ctxBlocks(html), 1000);
    assert(r.text.indexOf("$E=mc^2$") !== -1, "clean tex source reached the context: " + r.text);
    assert(r.text.indexOf("Emc2glyphs") === -1, "expanded KaTeX glyphs did not leak into the context: " + r.text);
  });
  test("headings always kept even when middles are dropped", () => {
    // P1-P3 first three, P5 heading, P7/P8 last two = mandatory (6 blocks).
    // P4/P6 are 200-char middles; budget 30 tokens fits neither.
    const html = "<p>a</p><p>b</p><p>c</p>"
      + "<p>" + "x".repeat(200) + "</p>"
      + "<h2>Head</h2>"
      + "<p>" + "y".repeat(200) + "</p>"
      + "<p>d</p><p>e</p>";
    const r = pbpAskBuildContext(ctxBlocks(html), 30);
    assertEq(r.totalBlocks, 8, "total");
    assertEq(r.sentBlocks, 6, "mandatory only");
    assertEq(r.text, "[P1] a\n[P2] b\n[P3] c\n[P5] Head\n[P7] d\n[P8] e", "heading kept, middles cut");
  });
  test("remaining budget filled by uniform sampling of middle blocks", () => {
    // 15 blocks: P1-P3 "aa".."cc", P4-P13 middles of 94 chars, P14/P15 "yy"/"zz".
    // base chars 42; middle lines cost 100 (P4-P9) / 101 (P10-P13) chars.
    // Budget 140 tokens = 560 chars: k=6 -> 644 chars (over), k=5 -> 544 (fits).
    // Sampled middle indexes floor(j*10/5) = 0,2,4,6,8 -> P4,P6,P8,P10,P12.
    let html = "<p>aa</p><p>bb</p><p>cc</p>";
    for (let i = 0; i < 10; i++) html += "<p>" + "m".repeat(94) + "</p>";
    html += "<p>yy</p><p>zz</p>";
    const r = pbpAskBuildContext(ctxBlocks(html), 140);
    assertEq(r.totalBlocks, 15, "total");
    assertEq(r.sentBlocks, 10, "5 mandatory + 5 sampled");
    ["[P4]", "[P6]", "[P8]", "[P10]", "[P12]"].forEach((tok) => {
      assert(r.text.indexOf(tok) !== -1, tok + " sampled in");
    });
    ["[P5]", "[P7]", "[P9]", "[P11]", "[P13]"].forEach((tok) => {
      assert(r.text.indexOf(tok) === -1, tok + " sampled out");
    });
    assertEq(r.text.split("\n").length, r.sentBlocks, "one line per sent block");
  });
  test("empty/non-array input tolerated", () => {
    const r = pbpAskBuildContext([], 100);
    assertEq(r.text, "", "empty text");
    assertEq(r.sentBlocks, 0, "0 sent");
    assertEq(r.totalBlocks, 0, "0 total");
    assertEq(pbpAskBuildContext(null, 100).totalBlocks, 0, "null tolerated");
  });
  test("a single oversized block is capped before entering the budget calc", () => {
    // Mirrors PBP_EXPLAIN_BLOCK_CAP's pattern: one huge <pre>/log block must
    // not alone blow the whole budget. Budget here is large enough that
    // only the per-block cap (not the token budget) limits the line.
    const big = "x".repeat(20000);
    const r = pbpAskBuildContext(ctxBlocks("<p>" + big + "</p>"), 100000);
    assertEq(r.totalBlocks, 1, "total");
    assertEq(r.sentBlocks, 1, "sent");
    assertEq(r.text.length, "[P1] ".length + 8000, "line capped at the 8000-char block cap");
  });
  test("mandatory set downgrades via evenly-spaced sampling when it alone overflows the budget", () => {
    // 5 blocks: first-3 + last-2 covers every block (totalBlocks<=5), so
    // ALL 5 are mandatory and middle is empty. Each line is 15 chars
    // ("[Pn] " + a 10-digit body); mandLens (line + 1) = 16/block.
    // budget 15 tokens = 60 chars: full mandatory is 80 chars/20 tokens,
    // over budget, so it degrades the same way middle degrades below: k=4
    // (64 chars/16 tok) still over, k=3 (floor(j*5/3) = 0,1,3 -> 48
    // chars/12 tok) fits -> P1, P2, P4 kept; P3 and the "always kept" last
    // block P5 are dropped.
    const html = "<p>0123456789</p>".repeat(5);
    const r = pbpAskBuildContext(ctxBlocks(html), 15);
    assertEq(r.totalBlocks, 5, "total");
    assertEq(r.sentBlocks, 3, "mandatory downgraded to a 3-block sample");
    assertEq(r.text, "[P1] 0123456789\n[P2] 0123456789\n[P4] 0123456789", "evenly-spaced mandatory sample; P3/P5 dropped despite being 'always kept'");
  });
});

suiteIf("pbpAskBuildPrompt", "pbpAskBuildContext", () => {
  test("system pins question language, article-only and CITES protocol", () => {
    const r = pbpAskBuildPrompt({ context: "[P1] alpha", history: [], question: "alpha?" });
    assert(r.system.indexOf("same language as the question") !== -1, "language rule");
    assert(r.system.indexOf("ONLY") !== -1, "article-only rule");
    assert(r.system.indexOf("[P<n>]") !== -1, "inline cite token");
    assert(r.system.indexOf("CITES:") !== -1, "cites block marker");
    assert(r.system.indexOf("15 words or fewer") !== -1, "quote length cap");
    assert(r.system.indexOf("article's original language") !== -1, "quote language rule");
    assert(r.system.indexOf("does not cover it at all, say so plainly") !== -1, "honesty rule");
  });
  test("system carries the research-grounded additions", () => {
    const r = pbpAskBuildPrompt({ context: "[P1] a", history: [], question: "q" });
    assert(r.system.indexOf("silently resolve it against PREVIOUS Q&A") !== -1, "pronoun-resolution step");
    assert(r.system.indexOf("silently locate every paragraph") !== -1, "locate-then-answer process line");
    assert(r.system.indexOf("covers it only partially") !== -1, "partial-coverage middle state");
    assert(r.system.indexOf("may be written in a different language") !== -1, "cross-language search rule");
    assert(r.system.indexOf("Cite only paragraphs you actually drew on") !== -1, "anti post-rationalization");
    // Narrative honesty rule, never an option menu (abstention-artifact
    // guard, arXiv 2507.16199): no "choose between"/"Unknown" style menu.
    assert(r.system.indexOf("choose") === -1 && r.system.indexOf("Unknown") === -1, "no option-menu abstention");
  });
  test("prompt carries article context and question; no history section when empty", () => {
    const r = pbpAskBuildPrompt({ context: "[P1] alpha\n[P2] beta", history: [], question: "What is beta?" });
    assert(r.prompt.indexOf("ARTICLE:\n[P1] alpha\n[P2] beta") !== -1, "context embedded");
    assert(r.prompt.indexOf("QUESTION: What is beta?") !== -1, "question line");
    assert(r.prompt.indexOf("PREVIOUS") === -1, "no history header");
    assert(r.prompt.indexOf("TITLE:") === -1, "no empty title line");
  });
  test("title enters the prompt; reminder line sits right before the question", () => {
    const r = pbpAskBuildPrompt({ context: "[P1] a", history: [], question: "q?", title: "  My   Page  " });
    assert(r.prompt.indexOf("TITLE: My Page") === 0, "normalized title first");
    const rem = r.prompt.indexOf("(Reminder:");
    assert(rem !== -1, "sandwich reminder present");
    assert(r.prompt.indexOf("QUESTION: q?") > rem, "reminder precedes the question");
    assert(r.prompt.indexOf("cite [P<n>]") !== -1, "reminder restates the cite contract");
  });
  test("forum flag swaps the source noun, CITES contract unchanged", () => {
    const r = pbpAskBuildPrompt({ context: "[P1] a", history: [], question: "q", forum: true });
    assert(r.system.indexOf("discussion thread") !== -1, "thread variant");
    assert(r.system.indexOf("ONE article") === -1, "article noun gone");
    assert(r.system.indexOf("thread's original language") !== -1, "quote rule follows the noun");
    assert(r.prompt.indexOf("THREAD:") !== -1 && r.prompt.indexOf("ARTICLE:") === -1, "thread payload header");
    assert(r.system.indexOf("CITES:") !== -1 && r.system.indexOf("[P<n>]") !== -1, "cite contract identical");
  });
  test("history serialized as Q/A lines, last 4 only, order kept", () => {
    const hist = [];
    for (let i = 1; i <= 5; i++) hist.push({ q: "q" + i, a: "a" + i });
    const r = pbpAskBuildPrompt({ context: "[P1] x", history: hist, question: "next" });
    assert(r.prompt.indexOf("Q: q1") === -1, "oldest dropped");
    assert(r.prompt.indexOf("Q: q2") !== -1, "4th-from-last kept");
    assert(r.prompt.indexOf("A: a5") !== -1, "newest kept");
    assert(r.prompt.indexOf("Q: q2") < r.prompt.indexOf("Q: q5"), "chronological order");
    assert(r.prompt.indexOf("PREVIOUS Q&A") !== -1, "history header present");
  });
  test("missing/null fields tolerated", () => {
    const r = pbpAskBuildPrompt({});
    assert(typeof r.system === "string" && typeof r.prompt === "string", "shapes");
    assert(r.prompt.indexOf("QUESTION: ") !== -1, "question line present");
    const r2 = pbpAskBuildPrompt({ context: "c", history: [{ q: null, a: null }], question: "q" });
    assert(r2.prompt.indexOf("Q: \nA: ") !== -1, "null history fields become empty strings");
  });
  test("history serialization is token-budgeted, oldest dropped first", () => {
    // 4 answers x 6000 chars (~1502 est tokens each): three fit a
    // 6000-token budget, the fourth would overflow it - q1 drops.
    const hist = [];
    for (let i = 1; i <= 4; i++) hist.push({ q: "q" + i, a: "x".repeat(6000) });
    const r = pbpAskBuildPrompt({ context: "[P1] c", history: hist, question: "next" });
    assert(r.prompt.indexOf("Q: q1") === -1, "over-budget oldest dropped");
    assert(r.prompt.indexOf("Q: q2") !== -1 && r.prompt.indexOf("Q: q4") !== -1, "newest three kept");
    assert(r.prompt.indexOf("Q: q2") < r.prompt.indexOf("Q: q4"), "chronological order kept");
  });
  test("history yields when the article context crowds the input target", () => {
    // ~24k-est-token context: fixed cost ~24.4k of the 28k target, so the
    // history budget squeezes below the flat 6000 and older rounds drop
    // harder than under an empty context (which keeps 3 of these rounds).
    const bigCtx = "[P1] " + "c".repeat(96000);
    const hist = [];
    for (let i = 1; i <= 4; i++) hist.push({ q: "q" + i, a: "x".repeat(6000) });
    const r = pbpAskBuildPrompt({ context: bigCtx, history: hist, question: "next" });
    assert(r.prompt.indexOf("Q: q4") !== -1, "newest round always kept");
    assert(r.prompt.indexOf("Q: q1") === -1 && r.prompt.indexOf("Q: q2") === -1,
      "older rounds dropped under the squeezed budget");
    const total = pbpAiEstimateTokens((r.system + r.prompt).length);
    assert(total <= 28800, "whole request stays near the input target, got " + total);
  });
  test("title is clamped before entering the prompt", () => {
    const r = pbpAskBuildPrompt({ context: "c", history: [], question: "q", title: "T".repeat(500) });
    assert(r.prompt.indexOf("TITLE: " + "T".repeat(200) + "\n") === 0, "title cut at 200 chars");
    assert(r.prompt.indexOf("T".repeat(201)) === -1, "no overlong title");
  });
  test("a lone huge round always survives the budget", () => {
    const r = pbpAskBuildPrompt({ context: "c", history: [{ q: "only", a: "y".repeat(20000) }], question: "q" });
    assert(r.prompt.indexOf("Q: only") !== -1, "most recent round kept");
    assert(r.prompt.indexOf("y".repeat(8001)) === -1, "capped");
  });
  test("stopped partials finalize visually but never enter rounds or history", () => {
    const run = _pbpAskRun.toString();
    assert(run.indexOf('aEl.dataset.askStopped = "1"') !== -1, "stopped flag missing");
    assert(run.indexOf("acc && aEl.isConnected") !== -1, "detached (cleared) elements must not finalize");
    assert(run.indexOf("_pbpAskFinalize(aEl, acc, st.ctx && st.ctx.sent)") !== -1, "abort visual finalize missing");
    assert(run.indexOf("delete aEl.dataset.askStopped") !== -1, "flag not cleared on a successful re-run");
    assert(_pbpAskRegenerate.toString().indexOf("replaceLast: !el.dataset.askStopped") !== -1,
      "stopped-round regenerate must append, not replace");
  });
  test("meta line discloses the 4-round history window on long threads", () => {
    const src = _pbpAskUpdateMeta.toString();
    assert(src.indexOf('_askRounds.length > 4') !== -1
      && src.indexOf('t("askHistWindowNote")') !== -1, "history-window disclosure missing");
    // Refresh points: a finished round and a clear must both repaint the
    // line immediately, not wait for the next open/send.
    assert(_pbpAskRun.toString().indexOf("_pbpAskUpdateMeta();") !== -1, "run finally must refresh the meta line");
    assert(_pbpAskClearThread.toString().indexOf("_pbpAskUpdateMeta()") !== -1, "clear must refresh the meta line");
  });
  test("regenerate excludes the round being replaced from the prompt", () => {
    const run = _pbpAskRun.toString();
    assert(run.indexOf("opts.replaceLast && st.rounds.length") !== -1
      && run.indexOf("st.rounds.slice(0, -1)") !== -1, "replaceLast history exclusion missing");
    assert(run.indexOf("history: promptHistory") !== -1, "prompt not built from the filtered history");
  });
  test("K97: prompt order pins the provider prefix-caching prefix (ARTICLE before history before question)", () => {
    // Second-turn prompt (non-empty history) through the real builder, the
    // same one _pbpAskEnsureCtx/_pbpAskRun call in production. This locks
    // the ordering the K97 comment above the parts.push(...) line in
    // md-ask.js depends on: OpenAI/DeepSeek/Kimi/Qwen/Zhipu automatic
    // prefix caching and Gemini implicit caching all key on the stable
    // system+ARTICLE prefix staying ahead of the per-turn history/question.
    const turn1 = pbpAskBuildPrompt({ context: "[P1] alpha\n[P2] beta", history: [], question: "first?" });
    const hist = [{ q: "first?", a: "the first answer" }];
    const turn2 = pbpAskBuildPrompt({ context: "[P1] alpha\n[P2] beta", history: hist, question: "second?" });
    const articleIx = turn2.prompt.indexOf("ARTICLE:");
    const histIx = turn2.prompt.indexOf("PREVIOUS Q&A");
    const questionIx = turn2.prompt.indexOf("QUESTION: second?");
    assert(articleIx !== -1 && histIx !== -1 && questionIx !== -1, "all three blocks present in the 2nd-turn prompt");
    assert(articleIx < histIx, "ARTICLE must start before PREVIOUS Q&A");
    assert(histIx < questionIx, "PREVIOUS Q&A must start before QUESTION");
    // system does not depend on history -> the cached prefix's other half
    // (system) must also be byte-identical turn over turn.
    assertEq(turn2.system, turn1.system, "system string must be identical across turns");
  });
  test("K97: forum variant pins THREAD before history before question", () => {
    const hist = [{ q: "first?", a: "the first answer" }];
    const r = pbpAskBuildPrompt({ context: "[P1] a", history: hist, question: "second?", forum: true });
    const threadIx = r.prompt.indexOf("THREAD:");
    const histIx = r.prompt.indexOf("PREVIOUS Q&A");
    const questionIx = r.prompt.indexOf("QUESTION: second?");
    assert(threadIx !== -1 && histIx !== -1 && questionIx !== -1, "all three blocks present");
    assert(threadIx < histIx && histIx < questionIx, "THREAD before PREVIOUS Q&A before QUESTION");
  });
});

// Codex final-review F1: a cap.range on a REPEATED word must anchor the
// sentence to the occurrence actually clicked, not always the block's first
// hit -- both the original-text branch (occurrence counting) and the .pb-tr
// branch (direct rangeOff) of _pbpExplainPackContext.
suiteIf("_pbpExplainPackContext nth-occurrence", "pbpAskInit", () => {
  function fixture(html) {
    const d = document.createElement("div");
    d.innerHTML = html;
    document.body.appendChild(d);
    return d;
  }
  function rangeAt(textNode, needle, occ) {
    let i = -1;
    for (let k = 0; k <= occ; k++) i = textNode.data.indexOf(needle, i + 1);
    const range = document.createRange();
    range.setStart(textNode, i);
    range.setEnd(textNode, i + needle.length);
    return range;
  }

  test("original-text branch: second occurrence anchors the second sentence", () => {
    const root = fixture("<p>The word here. Another word waits.</p>");
    pbpAiIndexBlocks(root);
    const textNode = root.querySelector("p").firstChild;
    const out = _pbpExplainPackContext({ text: "word", range: rangeAt(textNode, "word", 1) });
    assertEq(out.sentence, "Another word waits.", "second occurrence -> second sentence");
    root.remove();
  });

  test("original-text branch: first occurrence still anchors the first sentence (unchanged)", () => {
    const root = fixture("<p>The word here. Another word waits.</p>");
    pbpAiIndexBlocks(root);
    const textNode = root.querySelector("p").firstChild;
    const out = _pbpExplainPackContext({ text: "word", range: rangeAt(textNode, "word", 0) });
    assertEq(out.sentence, "The word here.", "first occurrence -> first sentence");
    root.remove();
  });

  test(".pb-tr branch: second occurrence anchors the second sentence via rangeOff", () => {
    const root = fixture("<p>Original block.</p>");
    pbpAiIndexBlocks(root);
    const tr = document.createElement("div");
    tr.className = "pb-tr";
    tr.innerHTML = "<p>The word here. Another word waits.</p>";
    root.appendChild(tr);
    const textNode = tr.querySelector("p").firstChild;
    const out = _pbpExplainPackContext({ text: "word", range: rangeAt(textNode, "word", 1) });
    assertEq(out.sentence, "Another word waits.", "tr branch: second occurrence -> second sentence");
    root.remove();
  });

  test(".pb-tr branch: first occurrence still anchors the first sentence (unchanged)", () => {
    const root = fixture("<p>Original block.</p>");
    pbpAiIndexBlocks(root);
    const tr = document.createElement("div");
    tr.className = "pb-tr";
    tr.innerHTML = "<p>The word here. Another word waits.</p>";

(async function () {

    else { FAIL++; div.className = "case fail"; div.textContent = "FAIL " + name + "\n  " + err.message; }

// ============ Task 6 (#8): glossary extraction null-vs-{} semantics (async) ============
(async function () {
  const host = document.createElement("div");

  const h = document.createElement("h2");

  function report(name, err) {
    const div = document.createElement("div");
    if (!err) { PASS++; div.className = "case pass"; div.textContent = "PASS " + name; }
    else { FAIL++; div.className = "case fail"; div.textContent = "FAIL " + name + "\n  " + err.message; }
    host.appendChild(div);
  }
  async function atest(name, fn) { return atestNetSerial(name, fn, report); } // shares the network-stub queue (see atestNetSerial)
  if (typeof _pbpTrExtractGlossary !== "function") {
    const div = document.createElement("div");
    div.className = "case skip";
    div.textContent = "SKIP _pbpTrExtractGlossary suite (not loaded)";
    host.appendChild(div); SKIP++; return;
  }
  function makeSt() {
    return {
      s: { aiProvider: "gemini", geminiApiKey: "k" },
      target: { name: "Simplified Chinese", code: "zh-CN" },
      work: [{ shielded: { text: "The Transformer architecture uses attention." } }]
    };
  }

  await atest("success with terms -> object (not null)", async () => {
    const real = window.callAIStream;
    window.callAIStream = async () => '{"terms":[{"term":"Transformer","translation":"变换器"}]}';
    try {
      const r = await _pbpTrExtractGlossary(makeSt());
      if (r === null) throw new Error("should not be null on success");
      assertEq(r.Transformer, "变换器", "term parsed");
    } finally { window.callAIStream = real; }
  });

  await atest("success with empty term list -> {} (real vacuum table, NOT null)", async () => {
    const real = window.callAIStream;
    window.callAIStream = async () => '{"terms":[]}';
    try {
      const r = await _pbpTrExtractGlossary(makeSt());
      if (r === null) throw new Error("empty extraction must be {} not null");
      assertEq(Object.keys(r).length, 0, "no terms");
    } finally { window.callAIStream = real; }
  });

  await atest("network failure -> null (failure, not vacuum table)", async () => {
    const real = window.callAIStream;
    window.callAIStream = async () => { throw new Error("boom"); };
    try {
      const r = await _pbpTrExtractGlossary(makeSt());
      if (r !== null) throw new Error("all-chunk failure must return null, got " + JSON.stringify(r));
    } finally { window.callAIStream = real; }
  });

  await atest("aborted before call -> null (no request, not vacuum table)", async () => {
    const real = window.callAIStream;
    let called = false;
    window.callAIStream = async () => { called = true; return '{"terms":[]}'; };
    try {
      const st = makeSt();
      st.ctrl = new AbortController();
      st.ctrl.abort();
      const r = await _pbpTrExtractGlossary(st);
      if (r !== null) throw new Error("aborted extraction must return null");
      if (called) throw new Error("callAIStream must not run when already aborted");
    } finally { window.callAIStream = real; }
  });

suite("applyImagePolicy: fenced code blocks are left untouched", () => {
  const md = "Real ![a](pic.png) here.\n\n```\nExample: ![alt](x.png)\n```\n\nAnother real ![b](https://cdn.io/y.png) end.";

    assert(out.indexOf("![a](pic.png)") === -1, "real image before fence stripped: " + out);
    assert(out.indexOf("![b](https://cdn.io/y.png)") === -1, "real image after fence stripped: " + out);
  });
  test("alt: real images collapse to alt text, fenced literal image syntax untouched", () => {
    const out = applyImagePolicy(md, { policy: "alt" });
    assert(out.indexOf("![alt](x.png)") !== -1, "fenced image literal survives: " + out);
    assert(out.indexOf("Real a here") !== -1, "real image alt-ified: " + out);

<script>
// ============ Task B4 #26 / A3: nested table promotes outer table to HTML passthrough ============
suite("htmlToMarkdown table rule: nested table promotes outer table to HTML passthrough", () => {
  test("outer table with a nested table emits raw HTML, not a pipe table", () => {
    const html = "<table><tr><th>Name</th><th>Sub</th></tr>" +
      "<tr><td>Alice</td><td><table><tr><td>inner1</td></tr><tr><td>inner2</td></tr></table></td></tr></table>";
    const md = htmlToMarkdown(html);
    // A3: a nested table now promotes the OUTER table to raw-HTML passthrough.
    assert(/<table/.test(md), "outer table must be HTML passthrough: " + md);
    assert(!/\|\s*---/.test(md), "no pipe residue allowed: " + md);
  });
  test("nested table's cell content survives intact inside the outer HTML, not duplicated", () => {
    const html = "<table><tr><th>Name</th><th>Sub</th></tr>" +
      "<tr><td>Alice</td><td><table><tr><td>inner1</td></tr><tr><td>inner2</td></tr></table></td></tr></table>";
    const md = htmlToMarkdown(html);
    assertEq((md.match(/<table/g) || []).length, 2, "inner table must survive intact (outer + inner <table>): " + md);
    assertEq((md.match(/inner1/g) || []).length, 1, "inner1 not duplicated: " + md);
    assertEq((md.match(/inner2/g) || []).length, 1, "inner2 not duplicated: " + md);
  });
  test("normal (non-nested) table unaffected by the :scope row selector", () => {
    const html = "<table><thead><tr><th>A</th><th>B</th></tr></thead>" +
      "<tbody><tr><td>1</td><td>2</td></tr><tr><td>3</td><td>4</td></tr></tbody></table>";
    const md = htmlToMarkdown(html);
    assert(/\|\s*A\s*\|\s*B\s*\|/.test(md), "header row intact: " + md);
    assert(/\|\s*1\s*\|\s*2\s*\|/.test(md) && /\|\s*3\s*\|\s*4\s*\|/.test(md), "both data rows intact: " + md);
  });
});

<script>
// C2-6: storage.local reclaim safety (pbpMeasureLocalStorage / pbpReclaimLocalStorage).
// Adversarial: never-clear keys (pending data, credentials, settings, in-progress
// handoffs) must survive reclaim(ALL categories); only allowlist keys are removed.
(async function () {
  if (typeof pbpReclaimLocalStorage !== "function" || typeof pbpMeasureLocalStorage !== "function") {
    SKIP++;
    const div = document.createElement("div");
    div.className = "case skip";
    div.textContent = "SKIP suite C2-6 storage reclaim (functions not loaded)";
    document.getElementById("results").appendChild(div);
    return;
  }
  // async mirror of test(): await fn, append pass/fail div, bump counters.
  async function atest(name, fn) {
    const div = document.createElement("div");
    try { await fn(); PASS++; div.className = "case pass"; div.textContent = "PASS " + name; }
    catch (e) { FAIL++; div.className = "case fail"; div.textContent = "FAIL " + name + "\n  " + e.message; }
    document.getElementById("results").appendChild(div);
  }
  // In-memory chrome.storage.local mock (get(null)/get(str)/get(arr)/get(obj), remove).
  function mockLocal(initial) {
    const store = { ...initial };
    return {
      _store: store,
      get: (arg) => Promise.resolve(
        arg == null ? { ...store }
        : typeof arg === "string" ? (arg in store ? { [arg]: store[arg] } : {})
        : Array.isArray(arg) ? arg.reduce((o, k) => { if (k in store) o[k] = store[k]; return o; }, {})
        : Object.keys(arg).reduce((o, k) => { o[k] = (k in store) ? store[k] : arg[k]; return o; }, {})
      ),
      remove: (keys) => { (Array.isArray(keys) ? keys : [keys]).forEach((k) => delete store[k]); return Promise.resolve(); },
    };
  }
  const NEVER = [
    "offlineQueue", "batch_progress", "pinboardToken", "openaiApiKey", "jinaApiKey",
    "md_preview_data", "md_preview_data_abc123", "_tagGovIgnored", "_tagGovLastRun",
    "_tagGovAiGroups", "lastUsedTags", "optSyncEnabled", "customOverlayCSS_localFallback",
    "aiContentSource", "customBaseUrl",
  ];
  const RECLAIMABLE = [
    "jina_md_https://ex.com/a", "jina_md_https://ex.com/b", "cached_existing_urls",
    "cached_user_tags", "cached_suggest_https://ex.com/a",
    "pbp_ai_usage", "pbpThinkReject", "pbpAiParamFix",
  ];
  // K169: out of the reclaim allowlist entirely (not in any PBP_RECLAIM_CATEGORIES
  // row) — owned solely by the archive panel's own owner-scoped Clear button, which
  // keeps _waybackAttempts alive as a dedup map. Must survive every reclaim call,
  // same as NEVER, but tracked separately so a regression names the real invariant.
  const WAYBACK_LEGACY = ["_waybackLog", "_waybackAttempts"];
  function freshStore() {
    const s = {};
    NEVER.forEach((k) => { s[k] = { secret: "DO_NOT_DELETE_" + k, blob: "x".repeat(50) }; });
    RECLAIMABLE.forEach((k) => { s[k] = { cache: "y".repeat(200), timestamp: 1 }; });
    WAYBACK_LEGACY.forEach((k) => { s[k] = { cache: "y".repeat(200), timestamp: 1 }; });
    return s;
  }
  const realChrome = window.chrome;

  await atest("C2-6 reclaim(all cats): never-clear survive, allowlist removed, freed>0", async () => {
    const local = mockLocal(freshStore());
    window.chrome = { storage: { local } };
    const freed = await pbpReclaimLocalStorage(["jina", "urls", "tags", "misc"]);
    NEVER.forEach((k) => assert(k in local._store, "must SURVIVE reclaim: " + k));
    RECLAIMABLE.forEach((k) => assert(!(k in local._store), "must be CLEARED: " + k));
    WAYBACK_LEGACY.forEach((k) => assert(k in local._store, "must SURVIVE reclaim (out of the misc allowlist, owned by the archive panel's Clear): " + k));
    assert(freed > 0, "freed bytes must be > 0, got " + freed);
  });

  await atest("C2-6 reclaim([]): empty categories deletes nothing", async () => {
    const local = mockLocal(freshStore());
    window.chrome = { storage: { local } };
    const before = Object.keys(local._store).length;
    const freed = await pbpReclaimLocalStorage([]);
    assertEq(Object.keys(local._store).length, before, "no keys removed on empty selection");
    assertEq(freed, 0, "zero freed on empty selection");
  });

  await atest("C2-6 reclaim(garbage/unknown categories): zero deletions", async () => {
    const local = mockLocal(freshStore());
    window.chrome = { storage: { local } };
    const before = Object.keys(local._store).length;
    const freed = await pbpReclaimLocalStorage(["everything", "__proto__", "settings", null, 42]);
    assertEq(Object.keys(local._store).length, before, "garbage category names delete nothing");
    assertEq(freed, 0, "zero freed for garbage categories");
  });

  await atest("C2-6 reclaim(non-array input): treated as empty, no deletions", async () => {
    const local = mockLocal(freshStore());
    window.chrome = { storage: { local } };
    const before = Object.keys(local._store).length;
    await pbpReclaimLocalStorage("jina");        // string, not array
    await pbpReclaimLocalStorage(undefined);
    assertEq(Object.keys(local._store).length, before, "non-array categories delete nothing");
  });

  await atest("C2-6 reclaim(tags only): removes tag caches, leaves jina/urls/misc + never-clear", async () => {
    const local = mockLocal(freshStore());
    window.chrome = { storage: { local } };
    await pbpReclaimLocalStorage(["tags"]);
    assert(!("cached_user_tags" in local._store), "cached_user_tags cleared");
    assert(!("cached_suggest_https://ex.com/a" in local._store), "cached_suggest_ cleared");
    assert("jina_md_https://ex.com/a" in local._store, "jina cache untouched");
    assert("cached_existing_urls" in local._store, "url cache untouched");
    assert("pbp_ai_usage" in local._store, "misc untouched");
    NEVER.forEach((k) => assert(k in local._store, "never-clear untouched: " + k));
  });

  await atest("C2-6 measure: groups keys by category with byte totals, ignores never-clear", async () => {
    const local = mockLocal(freshStore());
    window.chrome = { storage: { local } };
    const m = await pbpMeasureLocalStorage();
    assertEq(m.jina.keys.length, 2, "two jina keys");
    assertEq(m.urls.keys.length, 1, "one url key");
    assertEq(m.tags.keys.length, 2, "cached_user_tags + one suggest");
    assertEq(m.misc.keys.length, 3, "ai usage + think reject + param fix");
    ["jina", "urls", "tags", "misc"].forEach((c) => assert(m[c].bytes > 0, c + " bytes > 0"));
    // never-clear keys never appear in any category
    const allMeasured = [].concat(m.jina.keys, m.urls.keys, m.tags.keys, m.misc.keys);
    NEVER.forEach((k) => assert(!allMeasured.includes(k), "never-clear absent from measure: " + k));
  });

  await atest("C2-6 measure/reclaim degrade (storage.get throws) without throwing", async () => {
    window.chrome = { storage: { local: { get: () => Promise.reject(new Error("boom")), remove: () => Promise.resolve() } } };
    const m = await pbpMeasureLocalStorage();
    assertEq(m.jina.keys.length, 0, "empty measure on storage failure");
    const freed = await pbpReclaimLocalStorage(["jina", "urls", "tags", "misc"]);
    assertEq(freed, 0, "zero freed on storage failure");
  });

  window.chrome = realChrome;
})();
</script>

// ============ T4: _pbpTrUsageFallback (per-batch estimate when provider omits usage) ============
suite("_pbpTrUsageFallback (T4)", () => {
  test("real usage present -> no estimate added, approx stays false", () => {
    const st = { usage: { inTok: 100, outTok: 50, approx: false } };
    _pbpTrUsageFallback(st, true, "x".repeat(4000), "some output text");
    assertEq(st.usage.inTok, 100, "in unchanged");
    assertEq(st.usage.outTok, 50, "out unchanged");
    assertEq(st.usage.approx, false, "not approx");
  });
  // K92: the third argument is the sent TEXT, not a character count. Latin
  // input keeps the exact chars/4 numbers this test has always asserted;
  // a CJK source of the same length must land strictly higher.
  test("no real usage -> chars/4 added for sent + received, approx flagged", () => {
    const st = { usage: { inTok: 0, outTok: 0, approx: false } };
    _pbpTrUsageFallback(st, false, "x".repeat(4000), "x".repeat(400));
    assertEq(st.usage.inTok, 1000, "sent 4000 latin chars -> 1000 est tokens");
    assertEq(st.usage.outTok, 100, "received 400 latin chars -> 100 est tokens");
    assertEq(st.usage.approx, true, "approx flagged");
    const cjk = { usage: { inTok: 0, outTok: 0, approx: false } };
    _pbpTrUsageFallback(cjk, false, "\u6c49".repeat(4000), "\u6c49".repeat(400));
    assert(cjk.usage.inTok > 1000, "same-length CJK source must cost more, got " + cjk.usage.inTok);
    assert(cjk.usage.outTok > 100, "same-length CJK output must cost more, got " + cjk.usage.outTok);
  });
  test("null st.usage tolerated (no throw)", () => {
    _pbpTrUsageFallback({ usage: null }, false, "z".repeat(100), "y");
    assert(true, "no throw");
  });
});

// ============ Task 1: md-highlight.js anchor/locate (spec 3) ============
suiteIf("pbpHlSelectorOf", "pbpHlSelectorOf", () => {
  test("quote in the middle of a long block clamps prefix/suffix to 32 chars each", () => {
    const block = "A".repeat(40) + "QUOTE" + "B".repeat(40);
    const sel = pbpHlSelectorOf(block, 40, 45);
    assertEq(sel.quote, "QUOTE", "quote");
    assertEq(sel.prefix, "A".repeat(32), "prefix clamped to 32");
    assertEq(sel.suffix, "B".repeat(32), "suffix clamped to 32");
  });
  test("quote at the very start of the block clamps prefix to empty", () => {
    const block = "QUOTE" + "C".repeat(50);
    const sel = pbpHlSelectorOf(block, 0, 5);
    assertEq(sel.quote, "QUOTE", "quote");
    assertEq(sel.prefix, "", "prefix clamped to block start");
    assertEq(sel.suffix, "C".repeat(32), "suffix clamped to 32");
  });
  test("quote at the very end of the block clamps suffix to empty", () => {
    const block = "D".repeat(50) + "QUOTE";
    const sel = pbpHlSelectorOf(block, 50, 55);
    assertEq(sel.quote, "QUOTE", "quote");
    assertEq(sel.prefix, "D".repeat(32), "prefix clamped to 32");
    assertEq(sel.suffix, "", "suffix clamped to block end");
  });
  test("CJK block text slices correctly", () => {
    // \u escapes, not literal glyphs, per the iron rule (zero literal
    // non-ASCII inside code, byte-scan with grep -P after editing):
    // U+7532 (filler), U+91CD U+70B9 (the quote), U+4E59 (filler).
    const block = "\u7532".repeat(10) + "\u91cd\u70b9" + "\u4e59".repeat(10);
    const sel = pbpHlSelectorOf(block, 10, 12);
    assertEq(sel.quote, "\u91cd\u70b9", "quote is the 2-char CJK selection");
    assertEq(sel.prefix, "\u7532".repeat(10), "prefix is all 10 available CJK chars (< 32, naturally short)");
    assertEq(sel.suffix, "\u4e59".repeat(10), "suffix is all 10 available CJK chars (< 32, naturally short)");
  });
  test("whole-block quote leaves both affixes empty", () => {
    const sel = pbpHlSelectorOf("hi", 0, 2);
    assertEq(sel.quote, "hi", "quote");
    assertEq(sel.prefix, "", "empty prefix");
    assertEq(sel.suffix, "", "empty suffix");
  });
});

suiteIf("pbpHlLocate", "pbpHlLocate", () => {
  test("unique occurrence -> {start, end}", () => {
    const r = pbpHlLocate("the quick fox jumps", { quote: "quick", prefix: "the ", suffix: " fox" });
    assert(r, "match found");

// ============ Anchoring round: global relocation (strict) ============
suiteIf("pbpHlGlobalLocate", "pbpHlGlobalLocate", () => {
  const B = (n, text) => ({ n, text });
  test("unique cross-block hit -> accepted with its block n", () => {
    const r = pbpHlGlobalLocate([B(1, "alpha beta"), B(2, "the quick fox"), B(3, "gamma")],
      { quote: "quick", prefix: "the ", suffix: " fox" });
    assert(r, "found");
    assertEq(r.n, 2, "block n");
    assertEq(r.start, 4, "start");
    assertEq(r.end, 9, "end");
  });
  test("unique candidate accepted even with zero context corroboration", () => {
    const r = pbpHlGlobalLocate([B(1, "aaa"), B(2, "unique-token bbb")],
      { quote: "unique-token", prefix: "totally different", suffix: "context" });
    assert(r, "found");
    assertEq(r.n, 2, "block n");
  });
  test("repeated quote, equal context scores -> ambiguous -> null (never first-wins across blocks)", () => {
    const r = pbpHlGlobalLocate([B(1, "cat sat"), B(2, "cat sat")],
      { quote: "cat", prefix: "", suffix: " sat" });
    assertEq(r, null, "tie rejected");
  });
  test("repeated quote, strictly best context score -> that candidate wins", () => {
    const r = pbpHlGlobalLocate([B(1, "xx cat yy"), B(2, "AA cat BB")],
      { quote: "cat", prefix: "AA ", suffix: " BB" });
    assert(r, "found");
    assertEq(r.n, 2, "context-best block");
  });
  test("old-n false hit loses to a strictly better-context hit elsewhere", () => {
    // Simulates structural drift: block 3 now holds unrelated text that
    // happens to contain the quote; the real text moved to block 4.
    const item = { quote: "shared phrase", prefix: "REAL LEFT ", suffix: " REAL RIGHT" };
    const r = pbpHlGlobalLocate([B(3, "noise shared phrase noise"), B(4, "REAL LEFT shared phrase REAL RIGHT")], item);
    assert(r, "found");
    assertEq(r.n, 4, "relocated to the context-matching block");
  });
  test("quote absent everywhere -> null", () => {
    assertEq(pbpHlGlobalLocate([B(1, "aaa"), B(2, "bbb")], { quote: "zzz", prefix: "", suffix: "" }), null, "orphan");
  });

suiteIf("pbpHlGlobalLocateNormalized", "pbpHlGlobalLocateNormalized", () => {
  const B = (n, text) => ({ n, text });
  test("quote saved with spaces matches text re-extracted with a newline; offsets are ORIGINAL", () => {
    const r = pbpHlGlobalLocateNormalized([B(1, "aaa"), B(2, "xx foo\nbar yy")],
      { quote: "foo bar", prefix: "xx ", suffix: " yy" });
    assert(r, "found");
    assertEq(r.n, 2, "block n");
    assertEq(r.start, 3, "original start");
    assertEq(r.end, 10, "original end (spans the newline)");
  });
  test("still strict: normalized tie -> null", () => {
    const r = pbpHlGlobalLocateNormalized([B(1, "cat\nsat"), B(2, "cat sat")],
      { quote: "cat sat", prefix: "", suffix: "" });
    assertEq(r, null, "ambiguous after normalization");
  });
  // K15: the pool built from `blocks` (one pbpHlWsNormalize call per block)
  // must be cached by the array's REFERENCE IDENTITY across calls, since
  // pbpHlRestore's origBlocks() (md-highlight.js) hands back the exact same
  // array object to every item in one restore pass -- rebuilding it per item
  // is the O(items x whole-article) cost K15 exists to remove.
  test("same blocks reference across two calls builds the pool once (per-item quote/prefix/suffix normalization still runs each call)", () => {
    const real = window.pbpHlWsNormalize;
    let calls = 0;
    window.pbpHlWsNormalize = (...args) => { calls++; return real(...args); };
    try {
      const blocks = [B(1, "aaa"), B(2, "xx foo\nbar yy"), B(3, "zzz")];
      pbpHlGlobalLocateNormalized(blocks, { quote: "foo bar", prefix: "xx ", suffix: " yy" });
      const afterFirst = calls;
      calls = 0;
      pbpHlGlobalLocateNormalized(blocks, { quote: "zzz", prefix: "", suffix: "" });
      // Second call, SAME array reference: only the 3 per-item normalize
      // calls (quote/prefix/suffix) should run -- zero additional calls for
      // the 3 pool blocks, since the pool is cached by blocks' identity.
      assertEq(calls, 3, "pool not rebuilt on same reference: expected 3 per-item calls, got " + calls + " (afterFirst=" + afterFirst + ")");
    } finally {
      window.pbpHlWsNormalize = real;
    }
  });
  test("a different array with equal contents rebuilds the pool", () => {
    const real = window.pbpHlWsNormalize;
    let calls = 0;
    window.pbpHlWsNormalize = (...args) => { calls++; return real(...args); };
    try {
      const blocksA = [B(1, "aaa"), B(2, "xx foo\nbar yy"), B(3, "zzz")];
      const blocksB = [B(1, "aaa"), B(2, "xx foo\nbar yy"), B(3, "zzz")]; // same content, new array
      pbpHlGlobalLocateNormalized(blocksA, { quote: "foo bar", prefix: "xx ", suffix: " yy" });
      calls = 0;
      pbpHlGlobalLocateNormalized(blocksB, { quote: "foo bar", prefix: "xx ", suffix: " yy" });
      // 3 per-item + 3 pool blocks: a new array identity must rebuild even
      // though its contents are byte-identical to the previous one.
      assertEq(calls, 6, "new array identity rebuilds the pool: expected 3+3=6 calls, got " + calls);
    } finally {
      window.pbpHlWsNormalize = real;
    }
  });
  test("cached pool still resolves correctly across repeated calls on the same reference", () => {
    const blocks = [B(1, "aaa"), B(2, "xx foo\nbar yy"), B(3, "cat\nsat here")];
    const r1 = pbpHlGlobalLocateNormalized(blocks, { quote: "foo bar", prefix: "xx ", suffix: " yy" });
    assert(r1, "first call on cold pool found it");
    assertEq(r1.n, 2, "first call block n");
    assertEq(r1.start, 3, "first call original start");
    assertEq(r1.end, 10, "first call original end");
    // Second call, same reference -> served from the cached pool -- offsets
    // must still be correct for a DIFFERENT item/quote in a DIFFERENT block.
    const r2 = pbpHlGlobalLocateNormalized(blocks, { quote: "cat sat", prefix: "", suffix: " here" });
    assert(r2, "second call on warm pool found it");
    assertEq(r2.n, 3, "second call block n");
    assertEq(r2.start, 0, "second call original start");
    assertEq(r2.end, 7, "second call original end (spans the newline)");
  });
});

// ============ md-highlight.js: Range <-> block-text-offset seam ============
suiteIf("_pbpHlOffsetsFromRange / _pbpHlClipRangeToBlock / _pbpHlSelectionSegments", "_pbpHlOffsetsFromRange", () => {
  function fixture(html) {
    const d = document.createElement("div");
    d.innerHTML = html;
    document.body.appendChild(d);
    return d;
  }

  test("plain text-node range round-trips through ask's offsets->Range", () => {
    const root = fixture('<p id="b1">hello world</p>');
    const p = root.querySelector("#b1");
    const textNode = p.firstChild;
    const range = document.createRange();
    range.setStart(textNode, 6);
    range.setEnd(textNode, 11); // "world"
    const off = _pbpHlOffsetsFromRange(p, range);
    assert(off, "offsets found");
    assertEq(off.start, 6, "start");
    assertEq(off.end, 11, "end");
    const rebuilt = _pbpAskRangeFromOffsets(p, off.start, off.end);
    assertEq(rebuilt.toString(), "world", "round-trip via ask's _pbpAskRangeFromOffsets");
    root.remove();
  });

  test("element-container boundaries normalize to text-node offsets (selectNodeContents)", () => {
    const root = fixture('<p id="b1">foo <b>bar</b> baz</p>');
    const p = root.querySelector("#b1");
    const range = document.createRange();
    range.selectNodeContents(p); // startContainer/endContainer = p itself, not a text node
    const off = _pbpHlOffsetsFromRange(p, range);
    assert(off, "offsets found for whole-element selection");
    assertEq(off.start, 0, "start at block start");
    assertEq(off.end, p.textContent.length, "end at block end");
    root.remove();
  });

  test("_pbpHlClipRangeToBlock: cross-block selection clips to each block's own text", () => {
    const root = fixture('<p>alpha beta</p><p>gamma delta</p>');
    pbpAiIndexBlocks(root);
    const blocks = pbpAiBlocks();
    assertEq(blocks.length, 2, "two indexed blocks");
    const range = document.createRange();
    range.setStart(blocks[0].el.firstChild, 6); // "beta"
    range.setEnd(blocks[1].el.firstChild, 5);   // "gamma"
    assert(range.intersectsNode(blocks[0].el), "intersects block 1");
    assert(range.intersectsNode(blocks[1].el), "intersects block 2");
    assertEq(_pbpHlClipRangeToBlock(range, blocks[0].el).toString(), "beta", "segment 1 clipped to block 1");
    assertEq(_pbpHlClipRangeToBlock(range, blocks[1].el).toString(), "gamma", "segment 2 clipped to block 2");
    root.remove();
  });

  test("_pbpHlSelectionSegments: a .pb-tr sibling inserted AFTER indexing (real translate timing) is never indexed, so a selection inside it yields zero segments", () => {
    const root = fixture('<p>alpha</p>');
    pbpAiIndexBlocks(root); // index BEFORE translation would insert .pb-tr (D10: never re-index afterward)
    const tr = document.createElement("div");
    tr.className = "pb-tr";
    tr.innerHTML = "<p>translated text</p>";
    root.appendChild(tr);
    const trP = tr.querySelector("p");
    const range = document.createRange();
    range.selectNodeContents(trP);
    const segs = _pbpHlSelectionSegments(range);
    assertEq(segs.length, 0, "nothing intersects a data-pb block");
    root.remove();
  });

  test("_pbpHlSelectionSegments: selection spanning two indexed blocks yields two segments in document order", () => {
    const root = fixture('<p>one two</p><p>three four</p>');
    pbpAiIndexBlocks(root);
    const blocks = pbpAiBlocks();
    const range = document.createRange();
    range.setStart(blocks[0].el.firstChild, 4); // "two"
    range.setEnd(blocks[1].el.firstChild, 5);   // "three"
    const segs = _pbpHlSelectionSegments(range);
    assertEq(segs.length, 2, "two segments");
    assertEq(segs[0].n, blocks[0].n, "segment 1 -> block 1");
    assertEq(segs[1].n, blocks[1].n, "segment 2 -> block 2");
    root.remove();
  });
});

suiteIf("pbpResolveReaderScheme", "pbpResolveReaderScheme", () => {
  const R = (optTheme, override, videoMode, videoDark) => pbpResolveReaderScheme({ optTheme, override, videoMode, videoDark });

  test("per-device override wins over the video default and the global theme", () => {
    assertEq(R("dark", "light", true, true), "light", "light override on a dark video page");
    assertEq(R("light", "dark", false, false), "dark", "dark override on a light article");
  });

  test("video-dark default applies only in video-mode while the override is on follow", () => {
    assertEq(R("light", "auto", true, true), "dark", "video page + checkbox -> dark");
    assertEq(R("auto", "auto", true, true), "dark", "auto theme + video + checkbox -> dark");
    assertEq(R("light", "auto", false, true), "light", "article page ignores the video checkbox");
    assertEq(R("light", "auto", true, false), "light", "video page without the checkbox follows the theme");
  });

  test("full matrix: 3 optTheme x 3 override x video-mode x video-dark (36 combos) against the stated rule", () => {
    // The rule, restated independently of the implementation: an explicit
    // override wins; otherwise a video page with the checkbox on is dark;
    // otherwise the global theme passes through.
    const expect = (optTheme, override, videoMode, videoDark) =>
      override !== "auto" ? override : (videoMode && videoDark) ? "dark" : optTheme;
    let combos = 0;
    for (const optTheme of ["auto", "light", "dark"]) {
      for (const override of ["auto", "light", "dark"]) {
        for (const videoMode of [false, true]) {
          for (const videoDark of [false, true]) {
            combos++;
            assertEq(R(optTheme, override, videoMode, videoDark), expect(optTheme, override, videoMode, videoDark),
              `optTheme=${optTheme} override=${override} video=${videoMode} videoDark=${videoDark}`);
          }
        }
      }
    }
    assertEq(combos, 36, "matrix size");
  });

  test("follow passes optTheme through; unknown values normalise to auto / follow", () => {
    assertEq(R("dark", "auto", false, false), "dark", "dark theme");
    assertEq(R("auto", "auto", false, false), "auto", "auto theme");
    assertEq(R("nord", "auto", false, false), "auto", "legacy/unknown optTheme -> auto");
    assertEq(R("dark", "bogus", false, false), "dark", "unknown override -> follow");
    assertEq(R(undefined, undefined, undefined, undefined), "auto", "missing input -> auto");
  });
});

<script>
// ============ md-preview.js: pbpRailCollapsible (install + storage, async) ============
// NOTE: this suite is a hand-rolled async IIFE, NOT suiteIf()/test() -- this
// file's test() helper is fully synchronous (calls fn() and records PASS
// with no await), so an async test body's assertions would run AFTER test()
// already recorded PASS, surfacing only as an unhandled rejection, never a
// FAIL. Worse, since these cases share-and-restore the global `window.chrome`
// at start/end, unawaited concurrent bodies would race and clobber each
// other's mock mid-flight. Mirrors this file's own established pattern for
// async suites (see pbpAiCacheAppend/_pbpExplainPersistTrigger/_pbpStreamRead/
// pbpTrRunQueue below) so every case fully resolves before the next starts.
(async function () {
  const host = document.createElement("div");
  host.className = "suite";
  const h = document.createElement("h2");
  h.textContent = "pbpRailCollapsible (install + storage)";
  host.appendChild(h);
  document.getElementById("results").appendChild(host);
  function report(name, err) {
    const div = document.createElement("div");
    if (!err) { PASS++; div.className = "case pass"; div.textContent = "PASS " + name; }
    else { FAIL++; div.className = "case fail"; div.textContent = "FAIL " + name + "\n  " + err.message; }
    host.appendChild(div);
  }
  async function atest(name, fn) { try { await fn(); report(name); } catch (e) { report(name, e); } }
  if (typeof pbpRailCollapsible !== "function") {
    const div = document.createElement("div");
    div.className = "case skip";
    div.textContent = "SKIP pbpRailCollapsible (not loaded)";
    host.appendChild(div); SKIP++; return;
  }

  function mockLocal(initial) {
    const store = { ...initial };
    return {
      _store: store,
      get: (arg) => Promise.resolve(
        arg == null ? { ...store }
        : typeof arg === "string" ? (arg in store ? { [arg]: store[arg] } : {})
        : {}
      ),
      set: (obj) => { Object.assign(store, obj); return Promise.resolve(); },
    };
  }
  const realChrome = window.chrome;

  await atest("normal mode: replaces a plain label div with a button.rail-sec-head, wires aria", async () => {
    window.chrome = { storage: { local: mockLocal({}) } };
    const sec = document.createElement("div");
    sec.className = "rail-section";
    const label = document.createElement("div");
    label.className = "rail-label";
    label.textContent = "Export";
    sec.appendChild(label);
    const extra = document.createElement("div");
    extra.textContent = "content";
    sec.appendChild(extra);
    pbpRailCollapsible(sec, "export", { label, defaultCollapsed: true });
    await Promise.resolve().then(() => {}).then(() => {}); // flush the storage.get microtask chain
    const head = sec.querySelector(".rail-sec-head");
    assert(!!head, "header button installed");
    assertEq(head.tagName, "BUTTON", "header is a real button");
    assertEq(sec.contains(label), false, "original label node removed");
    assertEq(sec.classList.contains("rail-collapsed"), true, "defaultCollapsed:true applied (no stored value)");
    window.chrome = realChrome;
  });

  await atest("headless mode: sectionEl whose ONLY child is opts.label is left untouched (ask degenerate case)", async () => {
    window.chrome = { storage: { local: mockLocal({}) } };
    const sec = document.createElement("div");
    const btn = document.createElement("button");
    btn.id = "ask-open";
    btn.setAttribute("aria-expanded", "false");
    btn.setAttribute("aria-controls", "ask-panel");
    sec.appendChild(btn);
    const h = pbpRailCollapsible(sec, "ask", { label: btn, defaultCollapsed: true });
    await Promise.resolve().then(() => {}).then(() => {});
    assertEq(sec.querySelector(".rail-sec-head"), null, "no header installed in headless mode");
    assertEq(btn.getAttribute("aria-expanded"), "false", "pre-existing aria-expanded left untouched");
    assertEq(btn.className, "", "no rail-sec-head class added to the reused button");
    h.expand(true); // must not throw, must not touch DOM
    assertEq(sec.children.length, 1, "still exactly one child");
    window.chrome = realChrome;
  });

  await atest("click on header persists to storage.local under the section's own key, preserving sibling keys", async () => {

    label.textContent = "Translate";
    sec.appendChild(label);

    const local = mockLocal({});

    const label = document.createElement("div");
    label.textContent = "Translate";

  await atest("expand(true) fired before the async storage catch-up resolves is not reverted", async () => {
    // Deferred get(): resolves only when resolveGet() is called below, so we can fire
    // expand() into the window between install (which starts the read) and its resolution
    // -- the exact race a header click or Task 2's cache-restore auto-expand can hit.
    let resolveGet;
    const local = {
      _store: {},
      get: () => new Promise((resolve) => { resolveGet = resolve; }),
      set: (obj) => { Object.assign(local._store, obj); return Promise.resolve(); },

    const label = document.createElement("div");
    label.textContent = "Translate";

    assertEq(sec.classList.contains("rail-collapsed"), false, "expand applied immediately");
    resolveGet({ pbp_rail_collapse: { tr: true } }); // stored says collapsed -- would revert if not guarded
    await Promise.resolve().then(() => {}).then(() => {}).then(() => {});
    assertEq(sec.classList.contains("rail-collapsed"), false, "explicit expand() wins over the late catch-up");
