<script>
// ============ Anchoring round: pbpHlRestore drift lifecycle (DOM) ============
// Simulates a structurally drifted page: legacy items (no fp) whose stored n
// now points at unrelated content. Drives the REAL pbpHlRestore /
// _pbpHlReanchorBlock against a live indexed view -- the integration seam the
// pure pbpHlGlobalLocate suites above cannot reach (Codex acceptance).
suiteIf("pbpHlRestore drift lifecycle", "pbpHlRestore", () => {
  function hlDriftSetup() {
    const root = document.createElement("div");
    root.innerHTML = "<p>intro paragraph with plain stable text here</p>"
      + "<p>NEWLY INSERTED AD PARAGRAPH totally new</p>"
      + "<p>the migrating target sentence lives here now</p>";
    document.body.appendChild(root);
    pbpAiIndexBlocks(root);
    const ns = pbpAiBlocks().map((b) => b.n);
    _pbpHlState = {
      url: "t", title: "t",
      items: [
        // clean legacy: quote still lives in its stored block
        { id: "t_ok", n: ns[0], quote: "plain stable text", prefix: "paragraph with ", suffix: " here", color: 1, note: "", ts: 1 },
        // drifted legacy: stored n is now the ad; the text moved one block down
        { id: "t_move", n: ns[1], quote: "migrating target sentence", prefix: "the ", suffix: " lives", color: 2, note: "", ts: 2 },
        // gone: quote nowhere on the page
        { id: "t_gone", n: ns[1], quote: "vanished forever phrase", prefix: "xx ", suffix: " yy", color: 3, note: "", ts: 3 },
      ],
      ranges: Object.create(null), degraded: Object.create(null),
      resolvedN: Object.create(null), orphans: Object.create(null),
    };
    return { root, ns };
  }
  function hlDriftTeardown(root) {
    if (typeof CSS !== "undefined" && CSS.highlights) {
      for (const c of [1, 2, 3, 4, 5]) CSS.highlights.delete("pbp-hl-" + c);
    }
    _pbpHlState = null;
    root.remove();
  }
  test("restore relocates a drifted legacy item and orphans the unlocatable one; storage untouched", () => {
    if (typeof Highlight !== "function") return; // runner is Chromium; guard mirrors pbpHlRestore's own
    const { root, ns } = hlDriftSetup();
    try {
      pbpHlRestore();
      assert(_pbpHlState.ranges.t_ok, "clean item painted");
      assert(_pbpHlState.ranges.t_move, "drifted item painted");
      assertEq(_pbpHlState.resolvedN.t_move, ns[2], "relocated to the block that actually holds the quote");
      assert(!_pbpHlState.ranges.t_gone, "gone item not painted");
      assert(_pbpHlState.orphans.t_gone, "gone item flagged orphan");
      assertEq(Object.keys(_pbpHlState.degraded).length, 0, "no wrong-block whole-paragraph degrades");
      assertEq(_pbpHlState.items.length, 3, "storage-side items untouched");
      assertEq(_pbpHlState.items[1].n, ns[1], "relocation never written back to the item");
    } finally { hlDriftTeardown(root); }
  });
  test("relocated Range's actual text is the quote (offset mapping end-to-end)", () => {
    if (typeof Highlight !== "function") return;
    const { root } = hlDriftSetup();
    try {
      pbpHlRestore();
      assertEq(_pbpHlState.ranges.t_move.range.toString(), "migrating target sentence", "range text = quote");
    } finally { hlDriftTeardown(root); }
  });
  test("block re-anchor pass never revives an orphan into a whole-block paint (HIGH-1)", () => {
    if (typeof Highlight !== "function") return;
    const { root, ns } = hlDriftSetup();
    try {
      pbpHlRestore();
      _pbpHlReanchorBlock(ns[1]); // the orphan's stale n -- the exact revival path
      assert(!_pbpHlState.ranges.t_gone, "orphan still unpainted after re-anchor");
      assert(_pbpHlState.orphans.t_gone, "orphan verdict preserved");
      assert(_pbpHlState.ranges.t_move, "relocated neighbor unaffected");
    } finally { hlDriftTeardown(root); }
  });
});

(async function () {

    const div = document.createElement("div");
    if (!err) { PASS++; div.className = "case pass"; div.textContent = "PASS " + name; }
    else { FAIL++; div.className = "case fail"; div.textContent = "FAIL " + name + "\n  " + err.message; }
    host.appendChild(div);
  }
  async function atest(name, fn) { try { await fn(); report(name); } catch (e) { report(name, e); } }
  if (typeof pbpHlAttachNote !== "function" || typeof _pbpHlCommitNote !== "function") {
    const div = document.createElement("div");
    div.className = "case skip";
    div.textContent = "SKIP md-highlight dirty note save race (DOM layer not loaded)";
    host.appendChild(div); SKIP++; return;
  }
  // Every <script> block after this one shares the module globals this suite
  // stubs, and several of them reset _pbpHlState to null in their teardown. A
  // commit now yields to the event loop while it takes the record's Web Lock
  // (md-highlight.js serialises get -> patch -> set across reader tabs and
  // library.html), which is long enough for the parser to run those blocks in
  // the middle of this test. Start once there are no more of them.
  if (document.readyState === "loading") {
    await new Promise((r) => document.addEventListener("DOMContentLoaded", r, { once: true }));
  }
  await atest("dirty card commit preserves answer appended while the card was dirty", async () => {
    const prevSave = _pbpHlSave;
    const prevRender = _pbpHlNotebookRender;
    const prevState = _pbpHlState;
    const prevCard = _pbpHlCard;
    const prevCardItemId = _pbpHlCardItemId;
    const prevCardBaseNote = _pbpHlCardBaseNote;
    const prevDirty = _pbpHlNoteDirty;
    const prevQueue = _pbpHlWriteQueue;
    const prevLoadStrict = _pbpHlLoadStrict;
    const prevLiveOwner = _pbpHlLiveOwner;
    const card = document.createElement("div");
    try {
      _pbpHlSave = async () => true;
      // The commit's account gate re-reads the owner through vocab-store.js's
      // pbpVocabCurrentOwner, i.e. chrome.storage. This test starts on
      // DOMContentLoaded while other suites in this file are still in flight
      // and swap window.chrome for storage-less shims; whether that read
      // throws (-> null owner -> fail-closed refusal) depended on parse
      // timing (a comment-only change to md-preview.css flipped it). Pin the
      // owner the way _pbpHlLoadStrict is pinned below: the merge, not the
      // account gate, is under test here.
      _pbpHlLiveOwner = async () => "";
      // The commit path re-reads storage inside the write queue and patches by
      // item.id -- memory is never authoritative. Stand in for the record this
      // page would find there; without it the strict read returns null (no
      // chrome.storage on file://) and the write is correctly abandoned.
      _pbpHlLoadStrict = async () => structuredClone(_pbpHlState.items);
      _pbpHlNotebookRender = () => {};
      _pbpHlWriteQueue = Promise.resolve();
      const item = { id: "h1", n: 1, quote: "quote", note: "stored", color: 1, ts: 1 };
      _pbpHlState = { url: "https://example.com/a", title: "A", items: [item], ranges: {}, degraded: {} };
      const note = document.createElement("textarea");

      note.value = "draft edit";

      save.className = "hl-card-save";
      card.appendChild(note);
      card.appendChild(save);
      document.body.appendChild(card);
      _pbpHlCard = card;
      _pbpHlCardItemId = "h1";
      _pbpHlCardBaseNote = "stored";
      _pbpHlNoteDirty = true;

      const ok = await pbpHlAttachNote({ itemId: "h1" }, "answer from ask");

      _pbpHlCommitNote();

    const r = pbpSearchEnumerateRegex("aab aaab", "a+b", 10);
    assertEq(r.length, 2, "two matches");
    assertEq(r[0].start, 0, "m0 start");
    assertEq(r[1].start, 4, "m1 start");
  });
  test("zero-length-capable pattern skips empty matches and terminates", () => {
    const r = pbpSearchEnumerateRegex("ba", "a*", 10);
    assertEq(r.length, 1, "only the real 'a' run is reported");
    assert(r.every((m) => m.end > m.start), "no zero-length match was pushed");
  });
  test("invalid pattern returns null", () => {
    assertEq(pbpSearchEnumerateRegex("hello", "[", 10), null, "unterminated character class");
  });
  test("stops scanning once the cap is reached", () => {
    const r = pbpSearchEnumerateRegex("aaaaaa", "a", 3);
    assertEq(r.length, 3, "capped at 3");
  });
  test("no match returns an empty array", () => {
    assertEq(pbpSearchEnumerateRegex("hello", "xyz", 10).length, 0, "no match");
  });
});

// ============ H6: _pbpSearchRangesOverlap (md-reader.js note-search overlap guard) ============
suiteIf("_pbpSearchRangesOverlap", "_pbpSearchRangesOverlap", () => {
  function fixture(html) {
    const d = document.createElement("div");
    d.innerHTML = html;
    document.body.appendChild(d);
    return d;
  }
  test("a note-hit range that WHOLLY CONTAINS a DOM-scan substring range overlaps (the exact double-count shape the guard exists for)", () => {
    const root = fixture('<p id="b1">hello world</p>');
    const text = root.querySelector("#b1").firstChild;
    const whole = document.createRange();
    whole.setStart(text, 0);
    whole.setEnd(text, 11); // "hello world" -- the highlight's full quoted span
    const sub = document.createRange();
    sub.setStart(text, 6);
    sub.setEnd(text, 11); // "world" -- the DOM-scan's exact substring hit
    assert(_pbpSearchRangesOverlap(whole, sub), "containing range overlaps its own substring");
    root.remove();
  });
  test("partially overlapping ranges overlap", () => {
    const root = fixture('<p id="b1">hello world</p>');
    const text = root.querySelector("#b1").firstChild;
    const a = document.createRange();
    a.setStart(text, 0);
    a.setEnd(text, 7); // "hello w"
    const b = document.createRange();
    b.setStart(text, 6);
    b.setEnd(text, 11); // "world"
    assert(_pbpSearchRangesOverlap(a, b), "partial overlap");
    root.remove();
  });
  test("disjoint ranges do not overlap", () => {
    const root = fixture('<p id="b1">alpha beta</p>');
    const text = root.querySelector("#b1").firstChild;
    const a = document.createRange();
    a.setStart(text, 0);
    a.setEnd(text, 5); // "alpha"
    const b = document.createRange();
    b.setStart(text, 6);
    b.setEnd(text, 10); // "beta"
    assert(!_pbpSearchRangesOverlap(a, b), "no overlap");
    root.remove();
  });
  test("ranges that only touch at a boundary (share zero characters) do not overlap", () => {
    const root = fixture('<p id="b1">alphabeta</p>');
    const text = root.querySelector("#b1").firstChild;
    const a = document.createRange();
    a.setStart(text, 0);
    a.setEnd(text, 5); // "alpha"
    const b = document.createRange();
    b.setStart(text, 5);
    b.setEnd(text, 9); // "beta", starts exactly where a ends
    assert(!_pbpSearchRangesOverlap(a, b), "touching boundary is not an overlap");
    root.remove();
  });

// ============ R4: page-session query memory across close/reopen (md-reader.js) ============
suiteIf("_pbpSearchOpen (query memory)", "_pbpSearchOpen", () => {
  // Prepended for the same reason _t4View prepends: another suite may already
  // own the #rendered-view id and getElementById takes the first match.
  function prependView(html) {
    const v = document.createElement("div");
    v.id = "rendered-view";
    v.innerHTML = html;
    document.body.insertBefore(v, document.body.firstChild);
    return v;
  }
  function cleanup(v, realScroll) {
    if (realScroll) window.pbpScrollIntoView = realScroll;
    try { _pbpSearchTeardown(); } catch (_) {}
    const pop = document.getElementById("search-pop");
    if (pop && pop.matches(":popover-open")) pop.hidePopover();
    if (v) v.remove();
    _pbpSearchLastQuery = "";
    _pbpSearchLastIdx = 0;
  }
  test("reopening the bar restores the last query instead of an empty box", () => {
    const v = prependView("<p>gamma delta</p>");
    try {
      _pbpSearchOpen();
      document.getElementById("search-input").value = "gamma";
      _pbpSearchRun("gamma");
      _pbpSearchOpen(); // models Esc (teardown) followed by "/" again
      assertEq(document.getElementById("search-input").value, "gamma", "reopen cleared the query");
    } finally { cleanup(v); }
  });
  test("reopening restores the remembered hit without scrolling back to hit 1", () => {
    const v = prependView("<p>alpha one</p><p>alpha two</p><p>alpha three</p>");
    const realScroll = window.pbpScrollIntoView;
    let scrolls = 0;
    window.pbpScrollIntoView = () => { scrolls++; };
    try {
      _pbpSearchOpen();
      document.getElementById("search-input").value = "alpha";
      _pbpSearchRun("alpha");
      assertEq(_pbpSearchState.matches.length, 3, "fixture did not produce three hits");
      assertEq(scrolls, 1, "a fresh run should jump to hit 1");
      _pbpSearchStep(1); // the reader walked on to hit 2, then closed the bar
      assertEq(scrolls, 2, "stepping should jump");
      _pbpSearchOpen();
      assertEq(document.getElementById("search-input").value, "alpha", "reopen cleared the query");
      assertEq(_pbpSearchState.idx, 1, "reopen lost the reader's place in the match list");
      assertEq(document.getElementById("search-count").textContent, "2 / 3", "counter does not describe the restored hit");
      assertEq(scrolls, 2, "restoring the query yanked the viewport back to a hit");
    } finally { cleanup(v, realScroll); }
  });
  test("clearing the box is itself remembered: the next open is empty", () => {
    const v = prependView("<p>epsilon zeta</p>");
    try {
      _pbpSearchOpen();
      document.getElementById("search-input").value = "epsilon";
      _pbpSearchRun("epsilon");
      _pbpSearchRun(""); // the reader deleted the query before closing
      _pbpSearchOpen();
      assertEq(document.getElementById("search-input").value, "", "a deleted query came back");
    } finally { cleanup(v); }
  });
});

// ============ K83: search jump calibrates onto the hit inside an over-tall block (md-reader.js) ============
suiteIf("_pbpSearchPaintCurrent (K83 over-tall block calibration)", "_pbpSearchPaintCurrent", () => {
  const LINE = 40;

  // A real #rendered-view holding real text nodes: the Ranges under test are
  // the ones _pbpSearchRun itself builds (_pbpAskRangeFromOffsets over the
  // block's own text), not hand-made stand-ins. Prepended for the same reason
  // the query-memory suite prepends -- getElementById takes the FIRST match.
  function mountTall() {
    const vh = window.innerHeight;
    const v = document.createElement("div");
    v.id = "rendered-view";
    const pre = document.createElement("pre");
    // A fixed line box times a computed line count makes the block ~3
    // viewports tall on whatever window size the runner happens to use.
    pre.style.cssText = "margin:0;padding:0;font-size:20px;line-height:" + LINE + "px;white-space:pre";
    const rows = Math.ceil((vh * 3) / LINE);
    const lines = [];
    for (let i = 0; i < rows; i++) lines.push("filler line " + i);
    lines[0] = "zetahit head";
    lines[rows - 1] = "zetahit tail";
    pre.appendChild(document.createTextNode(lines.join("\n")));
    // A third hit with no boxes at all, INSIDE the same over-tall block: gate 1
    // and gate 2 both pass, so only the 0x0-rect gate can stop the correction.
    // Models an H6 note hit whose highlight was never painted.
    const ghost = document.createElement("span");
    ghost.style.display = "none";
    ghost.textContent = "\nzetahit ghost";
    pre.appendChild(ghost);
    const short = document.createElement("p");
    short.textContent = "zetahit short";
    v.appendChild(pre);
    v.appendChild(short);
    document.body.insertBefore(v, document.body.firstChild);
    // Scroll room past the fixture so a correction is never clamped by the end
    // of the document -- otherwise these assertions would depend on how many
    // result rows the page happens to have rendered by the time this suite runs.
    const pad = document.createElement("div");
    pad.style.height = (vh * 4) + "px";
    document.body.insertBefore(pad, v.nextSibling);
    return { view: v, pad: pad, pre: pre, short: short };
  }

  function mountShort() {
    const v = document.createElement("div");
    v.id = "rendered-view";
    v.innerHTML = "<p>zetahit one</p><p>zetahit two</p><p>zetahit three</p>";
    document.body.insertBefore(v, document.body.firstChild);
    const pad = document.createElement("div");
    pad.style.height = (window.innerHeight * 4) + "px";
    document.body.insertBefore(pad, v.nextSibling);
    return { view: v, pad: pad };
  }

  function teardown(f) {
    try { _pbpSearchTeardown(); } catch (_) {}
    const pop = document.getElementById("search-pop");
    if (pop && pop.matches(":popover-open")) pop.hidePopover();
    if (f) { f.view.remove(); f.pad.remove(); }
    _pbpSearchLastQuery = "";
    _pbpSearchLastIdx = 0;
    window.scrollTo(0, 0);
  }

  // Runs the real search over the fixture with pbpScrollIntoView replaced by an
  // exact block:center model (a real scrollIntoView would yank the results page
  // around) and window.scrollBy both recorded and applied, so the hit's rect can
  // be re-read afterwards instead of trusting the arithmetic.
  function drive(f, steps, expectedHits) {
    const realSiv = window.pbpScrollIntoView;
    const realBy = window.scrollBy;
    const bys = [];
    const lands = [];
    window.pbpScrollIntoView = function (el) {
      const r = el.getBoundingClientRect();
      window.scrollTo({ top: window.scrollY + r.top + r.height / 2 - window.innerHeight / 2, behavior: "instant" });
      lands.push(window.scrollY);
    };
    window.scrollBy = function (o) { bys.push(o); realBy.call(window, o); };
    try {
      _pbpSearchLastQuery = "";
      _pbpSearchLastIdx = 0;
      _pbpSearchOpen();
      document.getElementById("search-input").value = "zetahit";
      _pbpSearchRun("zetahit");
      assertEq(_pbpSearchState.matches.length, expectedHits, "fixture did not produce the expected hit count");
      for (let i = 0; i < steps; i++) _pbpSearchStep(1);
      return { bys: bys, lands: lands };
    } finally {
      window.pbpScrollIntoView = realSiv;
      window.scrollBy = realBy;
    }
  }

  function hitRect(idx) {
    return _pbpSearchState.ranges[idx].getBoundingClientRect();
  }

  test("a hit at the HEAD of an over-tall block is pulled into the viewport", () => {
    const f = mountTall();
    try {
      assert(f.pre.getBoundingClientRect().height > window.innerHeight, "fixture block is not taller than the viewport");
      const out = drive(f, 0, 4);
      assertEq(out.bys.length, 1, "the head hit did not calibrate");
      assertEq(out.bys[0].behavior, "instant", "the calibration scroll must be explicitly instant");
      assert(out.bys[0].top < 0, "a head hit sits ABOVE the centred block, so the correction must scroll up (got " + Math.round(out.bys[0].top) + ")");
      const r = hitRect(0);
      assert(r.height > 0, "head hit has no geometry to assert on");
      assert(r.top >= 0 && r.bottom <= window.innerHeight,
        "head hit still outside the viewport after calibration (top=" + Math.round(r.top) + " bottom=" + Math.round(r.bottom) + " vh=" + window.innerHeight + ")");
    } finally { teardown(f); }
  });

  test("a hit at the TAIL of an over-tall block is pulled into the viewport", () => {
    const f = mountTall();
    try {
      const out = drive(f, 1, 4);
      assertEq(_pbpSearchState.idx, 1, "stepping did not land on the tail hit");
      assertEq(out.bys.length, 2, "the tail hit did not calibrate");
      assert(out.bys[1].top > 0, "a tail hit sits BELOW the centred block, so the correction must scroll down (got " + Math.round(out.bys[1].top) + ")");
      const r = hitRect(1);
      assert(r.height > 0, "tail hit has no geometry to assert on");
      assert(r.top >= 0 && r.bottom <= window.innerHeight,
        "tail hit still outside the viewport after calibration (top=" + Math.round(r.top) + " bottom=" + Math.round(r.bottom) + " vh=" + window.innerHeight + ")");
    } finally { teardown(f); }
  });

  test("a hit with a 0x0 rect inside the tall block is a no-op, not a guessed offset", () => {
    const f = mountTall();
    try {
      const out = drive(f, 2, 4);
      assertEq(_pbpSearchState.idx, 2, "stepping did not land on the box-less hit");
      const r = hitRect(2);
      assertEq(r.width, 0, "the ghost hit unexpectedly has a width");
      assertEq(r.height, 0, "the ghost hit unexpectedly has a height");
      assertEq(out.bys.length, 2, "a hit with no geometry must not move the viewport");
    } finally { teardown(f); }
  });

  test("a hit in a short block never calibrates, even beside an over-tall one", () => {
    const f = mountTall();
    try {
      const out = drive(f, 3, 4);
      assertEq(_pbpSearchState.matches[3].el, f.short, "stepping did not land on the short block");
      assert(f.short.getBoundingClientRect().height < window.innerHeight, "the short fixture block is not short");
      assertEq(out.bys.length, 2, "a short block must keep today's block-level landing");
    } finally { teardown(f); }
  });

  test("a page whose blocks are all short lands pixel-identically to the block-level scroll", () => {
    const f = mountShort();
    try {
      const out = drive(f, 2, 3);
      assertEq(out.bys.length, 0, "the calibration branch fired on a page with no over-tall block");
      assertEq(window.scrollY, out.lands[out.lands.length - 1], "the final scroll position drifted from the block-level landing");
    } finally { teardown(f); }
  });

  test("the block's previous inline content-visibility is restored after the jump", () => {
    const f = mountTall();
    try {
      // The short block carries an inline override of its own: restoring to ""
      // instead of the previous value would silently strip it.
      f.short.style.contentVisibility = "auto";
      const out = drive(f, 3, 4);
      assertEq(out.bys.length, 2, "the tall-block jumps stopped calibrating");
      assertEq(f.pre.style.contentVisibility, "", "the forced content-visibility was left on the tall block");
      assertEq(f.short.style.contentVisibility, "auto", "the short block's own inline content-visibility was clobbered");
    } finally { teardown(f); }
  });
});

// ============ K86: "?" help panel filters dead t/v/a rows by live anchors (md-reader.js) ============
suiteIf("_pbpKbdHelpFillList (live-anchor filtering)", "_pbpKbdHelpFillList", () => {
  function rowsOf(ul) { return Array.from(ul.querySelectorAll(".kbd-help-row")); }
  function chipTexts(li) { return Array.from(li.querySelectorAll(".kbd-help-chip")).map((k) => k.textContent); }
  function allChips(ul) { return rowsOf(ul).flatMap(chipTexts); }
  // This page runs dozens of suites against a shared document, some of
  // which transiently mount #tr-section / #ask-open or a body.video-mode
  // class. Strip and restore around each case so this suite's counts are
  // never at the mercy of another suite's leftovers or in-flight state.
  function withClean(fn) {
    const staleTr = document.getElementById("tr-section");
    const staleAsk = document.getElementById("ask-open");
    if (staleTr) staleTr.remove();
    if (staleAsk) staleAsk.remove();
    const hadVideoMode = document.body.classList.contains("video-mode");
    document.body.classList.remove("video-mode");
    try { fn(); } finally {
      if (hadVideoMode) document.body.classList.add("video-mode");
    }
  }

  test("no #tr-section / #ask-open: t/v/a rows are dropped, the rest survive", () => {
    withClean(() => {
      const ul = document.createElement("ul");
      _pbpKbdHelpFillList(ul);
      const rows = rowsOf(ul);
      assertEq(rows.length, PBP_KBD_HELP_ROWS.length - 3, "row count did not drop by exactly 3 (t/v/a)");
      const chips = allChips(ul);
      assert(!chips.includes("t") && !chips.includes("v") && !chips.includes("a"),
        "a dead t/v/a chip survived the filter: " + chips.join(","));
    });
  });

  test("#tr-section and #ask-open both present: full row count, t/v/a all shown", () => {
    withClean(() => {
      const tr = document.createElement("div");
      tr.id = "tr-section";
      const ask = document.createElement("button");
      ask.id = "ask-open";
      document.body.appendChild(tr);
      document.body.appendChild(ask);
      try {
        const ul = document.createElement("ul");
        _pbpKbdHelpFillList(ul);
        const rows = rowsOf(ul);
        assertEq(rows.length, PBP_KBD_HELP_ROWS.length, "row count changed with both anchors present");
        const chips = allChips(ul);
        assert(chips.includes("t") && chips.includes("v") && chips.includes("a"),
          "t/v/a chip missing despite both anchors present: " + chips.join(","));
      } finally {
        tr.remove();
        ask.remove();
      }
    });
  });

  test("#tr-section alone: t/v shown, a absent -- the two anchors are independent", () => {
    withClean(() => {
      const tr = document.createElement("div");
      tr.id = "tr-section";
      document.body.appendChild(tr);
      try {
        const ul = document.createElement("ul");
        _pbpKbdHelpFillList(ul);
        const rows = rowsOf(ul);
        assertEq(rows.length, PBP_KBD_HELP_ROWS.length - 1, "row count did not drop by exactly 1 (a only)");
        const chips = allChips(ul);
        assert(chips.includes("t") && chips.includes("v"), "t/v filtered out despite #tr-section present");
        assert(!chips.includes("a"), "a survived despite no #ask-open");
      } finally {
        tr.remove();
      }
    });
  });

  // K112: n (highlight + open the note card) is the keyboard's only route into
  // #pb-hl-card. Nothing conditions it -- the highlight subsystem mounts with
  // the reader, AI on or off -- so it must survive the same stripped page that
  // kills t/v/a, and it must sit next to the plain h row it pairs with.
  test("n (highlight and open its note card) is listed unconditionally", () => {
    withClean(() => {
      const ul = document.createElement("ul");
      _pbpKbdHelpFillList(ul);
      const rows = rowsOf(ul);
      // Only t/v/a may ever be filtered: whatever the table grows to, exactly
      // three rows go missing on a stripped page and n is not one of them.
      assertEq(rows.length, PBP_KBD_HELP_ROWS.length - 3, "a row other than t/v/a was filtered out");
      const at = (chips) => rows.findIndex((li) => chipTexts(li).join(",") === chips);
      assert(at("n") !== -1, "the highlight-with-a-note key is missing: " + allChips(ul).join(","));
      assertEq(at("n"), at("h,1-5") + 1, "n is not listed directly under the plain highlight key");

suiteIf("skim cache metadata", "_pbpSkimCacheMeta", () => {
  test("cache meta includes resolved language instruction and model key", () => {

  test("configured provider model (no override) enters the cache identity", () => {
    const a = _pbpSkimCacheMeta({ s: { aiProvider: "openai", openaiModel: "m-A", aiSummaryLang: "en" } });
    const b = _pbpSkimCacheMeta({ s: { aiProvider: "openai", openaiModel: "m-B", aiSummaryLang: "en" } });
    assertEq(a.modelKey, "openai:m-A", "configured model in identity");
    assert(a.modelKey !== b.modelKey, "configured-model switch changes identity");
    const g = _pbpSkimCacheMeta({ s: { aiProvider: "gemini", aiSummaryLang: "en" } });
    assertEq(g.modelKey, "gemini:gemini-3.5-flash-lite", "provider default resolved, not 'default'");
  });

  test("a custom backend for the SAME provider:model is a different identity", () => {
    // Same model name on two hosts is two different models: a switched
    // ollamaBaseUrl / baseField must miss instead of replaying the previous
    // backend's paid key points.
    const local = _pbpSkimCacheMeta({ s: { aiProvider: "ollama", ollamaModel: "llama3.2", aiSummaryLang: "en" } });
    const remote = _pbpSkimCacheMeta({ s: { aiProvider: "ollama", ollamaModel: "llama3.2", ollamaBaseUrl: "http://192.168.1.9:11434", aiSummaryLang: "en" } });
    assert(local.modelKey !== remote.modelKey, "ollama host switch changes identity");
    const otherHost = _pbpSkimCacheMeta({ s: { aiProvider: "ollama", ollamaModel: "llama3.2", ollamaBaseUrl: "http://192.168.1.10:11434", aiSummaryLang: "en" } });
    assert(remote.modelKey !== otherHost.modelKey, "two custom hosts stay distinct");
    const proxied = _pbpSkimCacheMeta({ s: { aiProvider: "openai", openaiModel: "m-A", openaiBaseUrl: "https://proxy.test/v1", aiSummaryLang: "en" } });
    assert(proxied.modelKey !== _pbpSkimCacheMeta({ s: { aiProvider: "openai", openaiModel: "m-A", aiSummaryLang: "en" } }).modelKey,
      "openai baseField switch changes identity");
    // A configuration that still points at the provider's built-in base keeps
    // the key it already has -- an upgrade must not orphan stored entries.
    assertEq(_pbpSkimCacheMeta({ s: { aiProvider: "ollama", ollamaModel: "llama3.2", ollamaBaseUrl: "http://localhost:11434/", aiSummaryLang: "en" } }).modelKey,
      local.modelKey, "explicit default base (trailing slash included) = no endpoint term");
    assertEq(_pbpSkimCacheMeta({ s: { aiProvider: "openai", openaiModel: "m-A", openaiBaseUrl: "https://api.openai.com/v1", aiSummaryLang: "en" } }).modelKey,
      "openai:m-A", "explicit built-in base = no endpoint term");
  });

  test("cache entry with same blocks/lang/model matches", () => {
    const st = { s: { aiProvider: "gemini", aiSummaryLang: "en" } };
    const meta = _pbpSkimCacheMeta(st);
    assert(_pbpSkimCacheMatches(Object.assign({ blocksHash: "b1" }, meta), st, "b1"), "same meta matches");
  });

  test("cache entry with old language or model is a miss even if blocks match", () => {
    const st = { s: { aiProvider: "gemini", previewAiModel: "new-model", aiSummaryLang: "zh-CN" } };
    const meta = _pbpSkimCacheMeta(st);
    assert(!_pbpSkimCacheMatches(Object.assign({}, meta, { blocksHash: "b1", langKey: "old-lang" }), st, "b1"), "old language misses");
    assert(!_pbpSkimCacheMatches(Object.assign({}, meta, { blocksHash: "b1", modelKey: "old-model" }), st, "b1"), "old model misses");
  });

  test("cache entry with same model but different provider is a miss", () => {
    const st = { s: { aiProvider: "openrouter", previewAiModel: "gpt-test", aiSummaryLang: "en" } };
    const oldMeta = _pbpSkimCacheMeta({ s: { aiProvider: "openai", previewAiModel: "gpt-test", aiSummaryLang: "en" } });
    assert(!_pbpSkimCacheMatches(Object.assign({ blocksHash: "b1" }, oldMeta), st, "b1"), "provider drift misses");
  });

  test("cache entry missing blocksHash: stale (not fresh) when current fp known", () => {
    const st = { s: { aiProvider: "gemini", aiSummaryLang: "en" } };
    const meta = _pbpSkimCacheMeta(st);
    assert(!_pbpSkimCacheMatches(Object.assign({ md: "- x" }, meta), st, "b1"), "no blocksHash + known fp -> not fresh");
    assert(_pbpSkimCacheMatches(Object.assign({ md: "- x" }, meta), st, ""), "unknown current fp keeps tolerance");
  });

  test("legacy cache entry without lang/model metadata is a miss", () => {
    const st = { s: { aiProvider: "gemini", aiSummaryLang: "en" } };
    assert(!_pbpSkimCacheMatches({ md: "- cached", blocksHash: "b1" }, st, "b1"), "legacy cache misses");
  });
});

<script>
// ============ Batch 3: permission recovery gate (async) ============
(async function () {
  const host = document.createElement("div");
  host.className = "suite";
  const h = document.createElement("h2");
  h.textContent = "AI permission retry gate";
  host.appendChild(h);
  document.getElementById("results").appendChild(host);
  function report(name, err) {
    const div = document.createElement("div");
    if (!err) { PASS++; div.className = "case pass"; div.textContent = "PASS " + name; }
    else { FAIL++; div.className = "case fail"; div.textContent = "FAIL " + name + "\n  " + err.message; }
    host.appendChild(div);
  }
  async function atest(name, fn) { return atestNetSerial(name, fn, report); } // shares the network-stub queue (see atestNetSerial)
  const realRequest = window.requestAIHostPermissions;
  const permissionError = new Error("permission needed");
  permissionError.code = "host_permission";
  try {
    await atest("permission request is first and retry waits for grant", async () => {
      const events = [];
      let resolveGrant;
      window.requestAIHostPermissions = () => {
        events.push("request");
        return new Promise((resolve) => { resolveGrant = resolve; });
      };
      const pending = pbpAiRetryWithPermission(permissionError, { aiProvider: "gemini" }, async () => {
        events.push("retry");
      });
      await Promise.resolve();
      if (events.join(",") !== "request") throw new Error("retry ran before grant: " + events.join(","));
      resolveGrant(true);
      if (!await pending) throw new Error("granted retry reported false");
      if (events.join(",") !== "request,retry") throw new Error("wrong order: " + events.join(","));
    });

    await atest("permission denial performs no retry work", async () => {
      let retries = 0;
      window.requestAIHostPermissions = async () => false;
      const ok = await pbpAiRetryWithPermission(permissionError, {}, () => { retries++; });
      if (ok || retries) throw new Error("denial reached retry callback");
    });

    await atest("permission request throw performs no retry work", async () => {
      let retries = 0;
      window.requestAIHostPermissions = () => { throw new Error("permissions unavailable"); };
      const ok = await pbpAiRetryWithPermission(permissionError, {}, () => { retries++; });
      if (ok || retries) throw new Error("throw reached retry callback");
    });

    await atest("ordinary errors retry without requesting permission", async () => {
      let requests = 0, retries = 0;
      window.requestAIHostPermissions = async () => { requests++; return true; };
      const ok = await pbpAiRetryWithPermission(new Error("network"), {}, () => { retries++; });
      if (!ok || requests !== 0 || retries !== 1) throw new Error("ordinary retry was permission-gated");
    });

    function retryAllFixture() {
      const wrap = document.createElement("div");
      wrap.innerHTML = '<button id="tr-retry-all"><span>retry all</span></button>' +
        '<button class="pb-tr-err" data-pb-tr-err="1"><span>retry</span></button>' +
        '<button class="pb-tr-err" data-pb-tr-err="2"><span>retry</span></button>';
      document.body.appendChild(wrap);
      return wrap;
    }
    function retryAllState(error) {
      return {
        s: { aiProvider: "gemini", geminiApiKey: "k", translateGlossary: "" },
        target: { name: "Simplified Chinese", code: "zh-CN" },
        title: "T", url: "https://a.test/x", modelKey: "m", trMd: {},
        work: [1, 2].map((n) => ({ n, hash: "h" + n, shielded: { text: "hello world" } })),
        permissionError: error
      };
    }

    await atest("retry-all denial requests once and skips every failed block", async () => {
      const realStream = window.callAIStream;
      const wrap = retryAllFixture();
      let requests = 0, calls = 0;
      window.requestAIHostPermissions = async () => { requests++; return false; };
      window.callAIStream = async () => { calls++; throw new Error("must not run"); };
      try {
        await _pbpTrRetryAllFailed(retryAllState(permissionError));
        if (requests !== 1 || calls !== 0) throw new Error("requests=" + requests + ", calls=" + calls);
        if (wrap.querySelectorAll(".pb-tr-err").length !== 2) throw new Error("denial consumed a retry pill");
      } finally {
        window.callAIStream = realStream;
        wrap.remove();
      }
    });

    await atest("retry-all grants once then stops at the first renewed permission error", async () => {
      const realStream = window.callAIStream;
      const wrap = retryAllFixture();
      const renewed = new Error("permission revoked");
      renewed.code = "host_permission";
      let requests = 0, calls = 0;
      window.requestAIHostPermissions = async () => { requests++; return true; };
      window.callAIStream = async () => { calls++; throw renewed; };
      const st = retryAllState(permissionError);
      try {
        await _pbpTrRetryAllFailed(st);
        if (requests !== 1 || calls !== 1) throw new Error("requests=" + requests + ", calls=" + calls);
        if (st.permissionError !== renewed) throw new Error("renewed permission error not retained");
        if (wrap.querySelectorAll(".pb-tr-err").length !== 2) throw new Error("later pills were consumed");
      } finally {
        window.callAIStream = realStream;
        wrap.remove();
      }
    });

    // #100: retry-all is a sequential chain of full LLM round trips whose only
    // moving parts are pills scattered through the article, so the rail (where
    // the click happened) must say how far along it is.
    await atest("retry-all reports its progress on the rail and restores the failure summary", async () => {
      const realStream = window.callAIStream;
      const wrap = document.createElement("div");
      wrap.innerHTML =
        '<div id="tr-section"><span class="rail-sec-progress"></span></div>' +
        '<div id="tr-progress">2 segments failed: offline</div>' +
        '<button id="tr-retry-all"><span>retry all</span></button>' +
        '<button class="pb-tr-err" data-pb-tr-err="1"><span>retry</span></button>' +
        '<button class="pb-tr-err" data-pb-tr-err="2"><span>retry</span></button>';
      document.body.appendChild(wrap);
      // Resolve the way production does (first match wins) so the assertions
      // read exactly the node the code under test writes to.
      const prog = document.getElementById("tr-progress");
      const mini = document.querySelector("#tr-section .rail-sec-progress");
      const entryText = prog.textContent;
      const seen = [];
      window.callAIStream = async () => {
        seen.push({ mini: mini.textContent, moved: prog.textContent !== entryText });
        throw new Error("still offline");
      };
      try {
        await _pbpTrRetryAllFailed(retryAllState(null));
        assertEq(seen.length, 2, "both pills were retried");
        assertEq(seen.map((x) => x.mini).join(","), "(1/2),(2/2)",
          "the collapsed-header counter advances once per pass");
        assert(seen.every((x) => x.moved), "the progress line is rewritten while the retries run");
        assertEq(mini.textContent, "", "mini counter cleared at the end");
        assertEq(prog.textContent, entryText,
          "still-failing blocks get the failure summary back, not a meaningless N / N");
      } finally {
        window.callAIStream = realStream;
        wrap.remove();
      }
    });
  } finally {
    window.requestAIHostPermissions = realRequest;
  }
})();

test("explain popover keeps its downward bias but abandons a cramped one", () => {
  // Comfortable room below: stay down even when up is far roomier. Following
  // reading order is worth more than extra height nobody needs.
  assert(pbpExplainOpensDown(400, 900) === true, "roomy below should stay down");
  assert(pbpExplainOpensDown(PBP_EXPLAIN_COMFORT_CARD, 4000) === true, "exactly comfortable stays down");

  // The reported case: a selection near the foot of the window. 180px below is
  // a two-line sliver, and a thousand pixels sat unused above it.
  assert(pbpExplainOpensDown(180, 1000) === false, "a cramped card below a roomy top must flip up");
  assert(pbpExplainOpensDown(PBP_EXPLAIN_COMFORT_CARD - 1, 4000) === false, "one pixel under comfortable flips up");

  // Down still wins when it is not actually worse, however tight both sides are.
  assert(pbpExplainOpensDown(100, 100) === true, "a tie keeps the downward bias");
  assert(pbpExplainOpensDown(120, 90) === true, "down beats a smaller top even while cramped");
  assert(pbpExplainOpensDown(0, 0) === true, "no room either way still resolves to down");

  // The old rule was `below >= PBP_EXPLAIN_MIN_CARD || below >= above`, which
  // answered true here. Pinned so the regression cannot come back quietly.
  assert(PBP_EXPLAIN_COMFORT_CARD > PBP_EXPLAIN_MIN_CARD, "comfort must be stricter than the bare minimum");
  assert(pbpExplainOpensDown(PBP_EXPLAIN_MIN_CARD, 1000) === false, "the bare minimum is no longer enough to open down");
});

suiteIf("pbpAiErrorText (ZH-3)", "pbpAiErrorText", () => {
  // Contract 1 (the one future refactors will break): an error that ALREADY
  // carries a code passes its message through verbatim -- the message at the
  // throw site is more specific than any table lookup (ai.js:632 bakes the
  // localized offline text in; remapping would blur it).
  test("coded error passes message through, never remapped", () => {
    assertEq(pbpAiErrorText({ code: "network", message: "网络已断" }), "网络已断");
    assertEq(pbpAiErrorText({ code: "model_not_found", message: "openai: no such model" }), "openai: no such model");
    // category generalization: ANY code wins over status/keywords
    assertEq(pbpAiErrorText({ code: "host_permission", status: 429, message: "grant it" }), "grant it");
  });
  // In the test page t(key) falls back to the key itself (chrome.i18n stub
  // returns ""), so classification is asserted by key name.
  test("status classification before keywords", () => {
    assertEq(pbpAiErrorText({ status: 401, message: "x" }), "trErrKey");
    assertEq(pbpAiErrorText({ status: 403, message: "x" }), "trErrKey");
    assertEq(pbpAiErrorText({ status: 429, message: "HTTP 429" }), "trErrQuota");
    assertEq(pbpAiErrorText({ status: 503, message: "x" }), "trErrNetwork");
  });
  test("DashScope trap class: status wins even when message mentions model", () => {
    // ai.js:179-188 precedent: a bad-KEY message embedding ".../model-studio/..."
    // must classify by the structured field, not by text.
    assertEq(pbpAiErrorText({ status: 401, message: "invalid key, see https://x/model-studio/error-code" }), "trErrKey");
  });
  test("conservative keyword layer when no code/status", () => {
    assertEq(pbpAiErrorText({ message: "AI stream timeout" }), "trErrTimeout");
    assertEq(pbpAiErrorText({ message: "Rate limit reached for requests" }), "trErrQuota");
    assertEq(pbpAiErrorText(new TypeError("Failed to fetch")), "trErrNetwork");
  });
  test("unclassified message passes through, never swallowed", () => {
    assertEq(pbpAiErrorText({ message: "weird provider prose" }), "weird provider prose");
    assertEq(pbpAiErrorText(null), "translation failed");

});

    assert(PBP_TR_SYSTEM.indexOf("untrusted reference context") >= 0, "untrusted clause present");
    assert(PBP_TR_SYSTEM.indexOf("context only - do not translate or return them") === -1, "old tail absorbed, not duplicated");

    // risk demoting Rule 4's strict term enforcement -- banned wording.
    assert(PBP_TR_SYSTEM.indexOf("any field") === -1, "glossary must stay outside the untrusted framing");
    // Rule count stays 5, so the style splice tail ("never overrides Rules
    // 1-5") remains truthful without edits.
    assert(PBP_TR_SYSTEM.indexOf("\n5.") >= 0 && PBP_TR_SYSTEM.indexOf("\n6.") === -1, "still exactly Rules 1-5");
    assert(PBP_TR_GLOSSARY_SYSTEM.indexOf("untrusted reference material") >= 0, "extractor gets the short defense line");
  });
  test("ZH-4 explain-translate prompt carries the untrusted clause", () => {
    const r = pbpExplainBuildTranslatePrompt({ selection: "hi", blockText: "b", title: "t", targetLangName: "English" });
    assert(r.system.indexOf("untrusted document content") >= 0, "selection path defended too");
    assert(r.system.indexOf("only the translation") >= 0, "output contract re-anchored, not a refusal invitation");
  });
  test("D2 gens set semantics", () => {
    assertEq(JSON.stringify(pbpTrGensPush([], 2)), "[2]");
    assertEq(JSON.stringify(pbpTrGensPush([2], 2)), "[2]", "same gen never duplicates");
    assertEq(JSON.stringify(pbpTrGensPush([1], 2)), "[1,2]");
    assertEq(JSON.stringify(pbpTrGensPush([1, 2, 3, 4], 5)), "[2,3,4,5]", "cap 4 drops oldest");
    assertEq(pbpTrCacheGenStale(undefined, { pg: 2, gf: "" }), null, "meta undefined never prompts");
    assertEq(pbpTrCacheGenStale({ gens: [1, 2], gfs: [""] }, { pg: 2, gf: "" }), "mixed");
    assertEq(pbpTrCacheGenStale({ gens: [1], gfs: [""] }, { pg: 2, gf: "" }), "prompt");
    assertEq(pbpTrCacheGenStale({ gens: [2], gfs: ["a"] }, { pg: 2, gf: "b" }), "glossary");
    assertEq(pbpTrCacheGenStale({ gens: [1], gfs: ["a"] }, { pg: 2, gf: "b" }), "both");
    assertEq(pbpTrCacheGenStale({ gens: [2], gfs: [""] }, { pg: 2, gf: "" }), null, "current gen, same gf");
  });
  test("D3 continue-run merges gens instead of overwriting", () => {
    const first = pbpTrCacheApplyWrite(undefined, { h1: "t1" }, { pg: 1, gf: "", sm: 0 });
    assertEq(JSON.stringify(first.meta.gens), "[1]");
    const second = pbpTrCacheApplyWrite(first, { h2: "t2" }, { pg: 2, gf: "", sm: 0 });
    assertEq(JSON.stringify(second.meta.gens), "[1,2]", "60% old + 40% new must read as mixed, not pure-new");
    assertEq(JSON.stringify(second.meta.gfs), JSON.stringify([""]), "same gf never duplicates in the set");
    assert(second.blocks.h1 === "t1" && second.blocks.h2 === "t2", "blocks merged");
  });
  test("review-fix #3: gf drift across continue-runs marks the entry mixed", () => {
    // The gens rationale (a 60/40 entry must not read as pure-new) holds on the
    // user-glossary axis too: a continue-run after a glossary edit produces
    // blocks from two term tables in one entry.
    const a = pbpTrCacheApplyWrite(undefined, { h1: "t1" }, { pg: 2, gf: "aaa", sm: 0 });
    const b = pbpTrCacheApplyWrite(a, { h2: "t2" }, { pg: 2, gf: "bbb", sm: 0 });

    assertEq(pbpTrCacheGenStale(b.meta, { pg: 2, gf: "bbb" }), "mixed",
      "a mixed-glossary entry must not be certified as current");
  });
  test("D4 fingerprint locality: value change flips it, key order does not", () => {
    assert(pbpTrGlossaryFingerprint({ Foo: "旧译" }) !== pbpTrGlossaryFingerprint({ Foo: "新译" }),
      "changing a TRANSLATION must change gf (the most common user edit)");

      "property order must not matter (canonicalize)");

    const seeded = pbpTrCacheApplyWrite(undefined, { h1: "t1" }, { pg: 2, gf: "x", sm: 1, ag: { T: "y" } });
    const metaless = pbpTrCacheApplyWrite(seeded, { h2: "t2" }, undefined);

    assertEq(JSON.stringify(metaless.meta.gfs), JSON.stringify(["x"]));

suiteIf("tr source-script skip predicate (EN-1, QVP-0)", "pbpTrBlockLacksSourceScript", () => {
  // Category regression gate (spec EN-1): table-driven by CATEGORY, never by
  // instance enumeration. EN-1 was adjudicated 2026-08-20: it will never be
  // wired into _pbpTrApplySkips (see md-translate.js); these gates stay as
  // the QVP-0 anchor for the predicate's spec. Do not re-propose wiring it.
  const EN_ABSTRACT = "This paper presents a comprehensive survey of neural machine translation methods and their evaluation across domains.";
  test("category: target language gate -- only en, everything else is hard false", () => {
    // The v2 defect class: a source-language detector used as a target-language
    // detector. zh article translated to ja/de/fr must NEVER skip its English
    // quotes -- those are exactly what the user wants translated.
    for (const target of ["ja", "de", "fr", "zh-Hans", "ko", ""]) {
      assertEq(pbpTrBlockLacksSourceScript(EN_ABSTRACT, "zh-Hans", target), false,
        "target " + (target || "(empty)") + " must never skip");
    }
    assertEq(pbpTrBlockLacksSourceScript(EN_ABSTRACT, "zh-Hans", "en"), true, "en target skips the English abstract");
    assertEq(pbpTrBlockLacksSourceScript(EN_ABSTRACT, "zh-Hans", "en-US"), true, "base-language split applies");
  });
  test("category: too little signal never skips (short headings)", () => {
    assertEq(pbpTrBlockLacksSourceScript("Quick Start", "zh-Hans", "en"), false, "letters < 20");
  });
  test("category: ANY source-script character vetoes the skip (strict zero)", () => {
    assertEq(pbpTrBlockLacksSourceScript(EN_ABSTRACT + " 图", "zh-Hans", "en"), false, "a single Han character");
    assertEq(pbpTrBlockLacksSourceScript(EN_ABSTRACT + " の", "ja", "en"), false, "kana counts as ja source script");
    assertEq(pbpTrBlockLacksSourceScript(EN_ABSTRACT + " 図", "ja", "en"), false, "han counts as ja source script too");
    assertEq(pbpTrBlockLacksSourceScript(EN_ABSTRACT + " 한", "ko", "en"), false, "hangul vetoes for ko");
  });
  test("category: full-width punctuation alone does not veto (it is not a source-script letter)", () => {
    assertEq(pbpTrBlockLacksSourceScript(EN_ABSTRACT + "，Really。", "zh-Hans", "en"), true,
      "an English block that only borrowed zh punctuation is still English");
  });
  test("category: unknown/latin article language never skips", () => {
    assertEq(pbpTrBlockLacksSourceScript(EN_ABSTRACT, "", "en"), false, "latin/ambiguous article");
    assertEq(pbpTrBlockLacksSourceScript(EN_ABSTRACT, "fr", "en"), false, "unsupported articleLang");
  });
  test("category: placeholders are stripped before counting", () => {
    assertEq(pbpTrBlockLacksSourceScript("⟦C1⟧ " + EN_ABSTRACT + " ⟦L2⟧", "zh-Hans", "en"), true,
      "shield placeholders must not dilute the ratio");
  });
  test("category: non-English LATIN quotes are the DOCUMENTED residual miss", () => {
    // A French quote inside a zh article passes the predicate (no Han, mostly
    // Latin letters). This is the known residual the spec accepts ONLY behind
    // the QVP-4 veto metric + the visible, undoable skip note -- pinned here
    // so nobody claims the predicate is miss-free.
    assertEq(pbpTrBlockLacksSourceScript(
      "Les données ont été analysées avec soin et présentées clairement dans le rapport final.",
      "zh-Hans", "en"), true, "documented residual: French survives the script test");
  });
});

suiteIf("tr viewport-priority claim (ZH-2)", "pbpTrPickBatch", () => {
  // batch 0 covers blocks 1-3, batch 1 covers 4-6, batch 2 covers 7-9
  const NS = [[1, 2, 3], [4, 5, 6], [7, 8, 9]];
  test("claims the batch nearest the anchor; ties go to the smaller index", () => {
    assertEq(pbpTrPickBatch([0, 1, 2], NS, 8), 2, "anchor in batch 2");
    assertEq(pbpTrPickBatch([0, 1], NS, 8), 1, "batch 2 already claimed: next nearest");
    // true tie: blocks 1 and 5 are both 2 away from anchor 3 -> stable smaller index
    assertEq(pbpTrPickBatch([0, 1], [[1], [5]], 3), 0, "tie resolves to the smaller batch index");
    assertEq(pbpTrPickBatch([1, 2], NS, 1), 1, "nearest remaining when anchor's own batch is gone");
  });
  test("degenerate anchors degrade to document order", () => {
    assertEq(pbpTrPickBatch([0, 1, 2], NS, undefined), 0);
    assertEq(pbpTrPickBatch([0, 1, 2], NS, NaN), 0);
    assertEq(pbpTrPickBatch([2], NS, 1), 2, "single remaining is always legal");
    assertEq(pbpTrPickBatch([0, 1], [[], [5]], 5), 1, "a batch with no known blocks never outranks a real match");
  });
  test("batch block-number mapping resolves synthetic part ids (review #16)", () => {
    // Block 2 was oversize and split into parts: part 0 keeps id 2, later
    // parts get synthetic ids past max(n) (here 7, 8). Raw seg ids would
    // shove this batch to the document's end; the mapping must ground every
    // part back to block 2.
    const segMap = new Map([
      [1, { n: 1, idx: 0, parts: 1 }],
      [2, { n: 2, idx: 0, parts: 3 }],
      [7, { n: 2, idx: 1, parts: 3 }],
      [8, { n: 2, idx: 2, parts: 3 }]
    ]);
    const batches = [[{ id: 1, text: "a" }], [{ id: 2, text: "b" }, { id: 7, text: "c" }, { id: 8, text: "d" }]];
    const ns = pbpTrBatchBlockNs(batches, segMap);
    assertEq(JSON.stringify(ns), "[[1],[2,2,2]]", "part ids ground to their real block");
    assertEq(pbpTrPickBatch([0, 1], ns, 2), 1, "viewport at block 2 claims the split-block batch first");
  });
  test("run anchor: BOTH continue paths take min(untranslated), fresh takes the viewport", () => {
    // probe-partial continue: 10 work, 0 skipped, 6 pending
    assertEq(pbpTrRunAnchor([7, 8, 9, 10, 5, 6], 10, 0, 999), 5, "probe-partial ignores the live viewport");
    // same-session Stop -> Continue has the identical state shape (trMd
    // non-empty at run start) -- the condition is state-derived, not
    // path-derived, so this pins the second path too
    assertEq(pbpTrRunAnchor([3, 4], 10, 0, 999), 3, "stop-continue ignores the live viewport");
    // fresh run: pending == work - skipped
    assertEq(pbpTrRunAnchor([4, 5, 6, 7, 8, 9, 10], 10, 3, 8), 8, "fresh run follows the viewport");
    assertEq(pbpTrRunAnchor([4, 5, 6, 7, 8, 9, 10], 10, 3, undefined), 4, "fresh run without a viewport reading falls back to the first block");
  });
});

    st.newly = { h1: "a", h2: "b" };       // earlier fills already recorded

    assertEq(Object.keys(calls[0][3]).length, 2, "cumulative newly, not just the buffer");
    assertEq(calls[0][6], true, "replace flag rides along");
    assertEq(Object.keys(st.flushBuf).length, 0, "buffer still drains");
  });
  test("in-flight merge: no concurrent flushes, later blocks keep buffering", () => {
    const calls = [];
    const st = mkSt({ flushFn: (...a) => { calls.push(a); return new Promise(() => {}); } });
    st.flushBuf.h1 = "x";
    _pbpTrFlushCache(st);
    st.flushBuf.h2 = "y";
    _pbpTrFlushCache(st);                   // inflight -> returns, buffer untouched

  });
  test("D7 a partially-failed multi-part block never reaches the cache buffers", () => {
    const st = mkSt({ flushFn: () => Promise.resolve() });
    const w = mkW(1, "long text");
    const pb = _pbpTrMakePartBuf({ chunks: ["aa", "bb"], seps: ["", "\n\n"] });
    _pbpTrPartFail(pb, 1);                  // one part fell back to its original
    _pbpTrPartFill(pb, 0, "AA");
    const done = _pbpTrPartDone(pb);
    assert(done && done.partial, "assembled but partial");
    _pbpTrCommitAssembled(st, w, done, pb.failed);
    assertEq(st.newly.h1, undefined, "half-translated block must NOT enter newly");
    assertEq(st.flushBuf.h1, undefined, "nor the flush buffer");
    assert(typeof st.trMd[1] === "string", "but it IS displayed (trMd filled)");
  });
  test("D7 counterpart: a fully-translated multi-part block IS recorded", () => {
    const st = mkSt({ flushFn: () => Promise.resolve() });
    const w = mkW(1, "long text");
    const pb = _pbpTrMakePartBuf({ chunks: ["aa", "bb"], seps: ["", "\n\n"] });

    assertEq(st.newly.h1, "AA\n\nBB");
  });
  test("flush failure degrades: sync throw clears inflight, run continues", () => {
    const st = mkSt({ flushFn: () => { throw new Error("idb gone"); } });
    st.flushBuf.h1 = "x";
    _pbpTrFlushCache(st);
    assertEq(st.flushInflight, false, "sync-throw path resets inflight");
    assert(true, "no throw escaped");
  });
});

  view.innerHTML = html;          // md-preview.js replaces #rendered-view's CHILDREN
  pbpAiIndexBlocks(view);         // ...and rebuilds the AI block index BEFORE article-replaced
}

// ============ T5: pbpHlPunctTolerantFind (pure) ============
suiteIf("T5 pbpHlPunctTolerantFind (AI-punctuation tolerant anchor)", "pbpHlPunctTolerantFind", () => {
  test("punctuation-only diff -> REAL offsets covering the punctuated span", () => {
    const article = "so the model runs; then it stops. and we wait";
    const r = pbpHlPunctTolerantFind(article, "the model runs then it stops");
    assert(r, "found");
    assertEq(article.slice(r.start, r.end), "the model runs; then it stops",
      "offsets index the REAL text, marks included -- not the reduced stream");
    assertEq(article[r.start], "t", "starts on the quote's first non-punctuation character");
    assertEq(article[r.end - 1], "s", "and ends on its last: no trailing '.' swallowed");
  });

  test("ambiguous reduced match -> null (never guesses between two candidates)", () => {
    assertEq(pbpHlPunctTolerantFind("it stops. and later, it stops again", "it stops"), null,
      "two occurrences -> refuse");
    assert(pbpHlPunctTolerantFind("it stops. and later we wait", "it stops"),
      "control: the same quote resolves when it occurs exactly once");
  });

  test("a changed non-punctuation character -> null (this tier is not fuzzy)", () => {
    assertEq(pbpHlPunctTolerantFind("the model runs, then it halts.", "the model runs then it stops"), null,
      "one different word is a different sentence, not a punctuation edit");
    assertEq(pbpHlPunctTolerantFind("the model run; then it stops.", "the model runs then it stops"), null,
      "a single dropped letter is enough to refuse");
  });

  test("CJK: inserted marks map back to the right characters", () => {
    // "今天天气很好，我们去公园吧？" -- the AI pass inserted the comma and the
    // question mark into a transcript that had neither.
    const article = "今天天气很好，我们去公园吧？";
    const quote = "天气很好我们去公园"; // "天气很好我们去公园", spanning the comma
    const r = pbpHlPunctTolerantFind(article, quote);
    assert(r, "found across the inserted comma");
    assertEq(article.slice(r.start, r.end),
      "天气很好，我们去公园",
      "a mark INSIDE the span is covered; the trailing one is not");
    const q2 = "今天天气"; // "今天天气" -- prefix, ends before any mark
    const r2 = pbpHlPunctTolerantFind(article, q2);
    assert(r2, "prefix quote found");
    assertEq(article.slice(r2.start, r2.end), q2, "no punctuation to absorb -> exact span");
  });

  test("a quote made entirely of punctuation -> null (indexOf('') would answer 0)", () => {
    assertEq(pbpHlPunctTolerantFind("hello world", "..."), null, "nothing left to match on");
    assertEq(pbpHlPunctTolerantFind("hello world", "   "), null, "whitespace-only likewise");
    assertEq(pbpHlPunctTolerantFind("...", "hello"), null, "and an all-punctuation TEXT matches nothing");
    // Straight at the scanner: without its own empty-quote guard this reports
    // "2 occurrences" (indexOf("") answers 0, then 1) instead of "no match".
    // Both refuse, but only one of them means what it says.
    assertEq(_pbpHlPunctScan("hello world", "...").count, 0, "zero occurrences, not an ambiguity");
  });

  test("non-string / empty inputs -> null", () => {
    assertEq(pbpHlPunctTolerantFind(null, "quote"), null, "no text");
    assertEq(pbpHlPunctTolerantFind("some text", null), null, "no quote");
    assertEq(pbpHlPunctTolerantFind("", ""), null, "both empty");
  });

  test("the quote may carry marks the ARTICLE lacks (works in either direction)", () => {
    const article = "chapter two the long march begins";
    const r = pbpHlPunctTolerantFind(article, "two, the long march");
    assert(r, "found");
    assertEq(article.slice(r.start, r.end), "two the long march",
      "real offsets always follow the article's own punctuation");
  });

  test("the reduce class is a SUPERSET of the video conservation gate's marks", () => {
    // md-video.js's PBP_VIDEO_MARK_RE decides which characters the AI
    // punctuation tier is allowed to insert; every one of them has to reduce
    // away here, or a batch the gate accepted still moves the quote out of
    // reach and the highlight orphans instead of re-anchoring. Equality is NOT
    // the invariant and never can be: the gate exempts word-internal · ' . -
    // (pbpVideoIsIntraMark) while this class strips them unconditionally,
    // which only makes the reducer MORE lenient -- the safe direction. Drift
    // the other way is what this pins: the gate was widened for CJK models and
    // the reducer was left behind.
    const missing = [];
    for (let cp = 0; cp <= 0xFFFF; cp++) {
      const ch = String.fromCharCode(cp);
      if (PBP_VIDEO_MARK_RE.test(ch) && !PBP_HL_PUNCT_RE.test(ch)) {
        missing.push("U+" + cp.toString(16).toUpperCase().padStart(4, "0"));
      }
    }
    assertEq(missing.join(","), "", "marks the gate lets through that the reducer would not strip");
  });

  test("CJK marks the gate accepts do not orphan a highlight", () => {
    // The shape of that drift in the product: a model punctuating a Chinese or
    // Japanese transcript inserts 「」 (or ・ or 〜) inside an existing
    // highlight's span, the gate passes the batch as conserved, and the third
    // tier has to find the quote again.
    const article = "他说「今天天气很好」我们去公园吧";
    const r = pbpHlPunctTolerantFind(article, "今天天气很好我们去公园");
    assert(r, "found across the inserted corner brackets");
    assertEq(article.slice(r.start, r.end), "今天天气很好」我们去公园",
      "real offsets: the opening bracket falls outside the span, the closing one inside");
    assert(pbpHlPunctTolerantFind("三時〜四時のあいだ", "三時四時のあいだ"),
      "wave dash likewise");
    assert(pbpHlPunctTolerantFind("あれ・これ を 見る", "あれこれ を 見る"),
      "and a katakana middle dot, which this class strips unconditionally -- the " +
      "gate keeps a word-internal one, so the reducer is the more lenient side here");
  });

  test("pbpHlPunctReduce: the map is what makes the offsets real", () => {
    const red = pbpHlPunctReduce("a, b. c");
    assertEq(red.reduced, "abc", "marks and whitespace dropped");
    assertEq(red.map.join(","), "0,3,6", "each survivor remembers where it came from");
  });

  test("pbpHlPunctTolerantLocate: unique across the WHOLE pool, or nothing", () => {
    const blocks = [{ n: 1, text: "the rain, in spain" }, { n: 2, text: "stays mainly. in the plain" }];
    const hit = pbpHlPunctTolerantLocate(blocks, { quote: "stays mainly in the plain" });
    assert(hit, "found");
    assertEq(hit.n, 2, "reports the block it lives in");
    assertEq(blocks[1].text.slice(hit.start, hit.end), "stays mainly. in the plain", "offsets are block-local");
    assertEq(pbpHlPunctTolerantLocate(
      [{ n: 1, text: "one two three" }, { n: 2, text: "one, two three" }],
      { quote: "one two three" }), null,
      "the same reduced quote in two DIFFERENT blocks is an ambiguity, not a first-wins");
    assertEq(pbpHlPunctTolerantLocate(blocks, { quote: "" }), null, "empty quote");
    assertEq(pbpHlPunctTolerantLocate(null, { quote: "anything" }), null, "no pool");
  });
});
</script>

suiteIf("T5 highlight: article replacement", "_pbpHlOnArticleReplaced", () => {
  const OLD = "<p>so the model runs then it stops</p><p>we wait for the next batch</p>";

  function setup() {
    // Test isolation: the tolerant tier is armed per REVISION and this counter

    _pbpHlState = {
      url: "https://example.test/t5", title: "T5",
      // fp deliberately not the current one: that is what a replaced article
      // looks like, and it routes the item straight to the global search.
      items: [{ id: "t5a", n: pbpAiBlocks()[0].n, quote: QUOTE, prefix: "so ", suffix: "", color: 1, note: "", ts: 1, fp: "stale-fp" }],
      ranges: Object.create(null), degraded: Object.create(null),

  }
  function teardown(view) {

  test("AI punctuation: a highlight whose quote gained marks is re-anchored, precisely", () => {
    if (typeof Highlight !== "function") return; // runner is Chromium; mirrors pbpHlRestore's own guard
    const view = setup();
    try {
      assert(_pbpHlState.ranges.t5a, "control: painted against the unpunctuated article");
      assertEq(_pbpHlState.ranges.t5a.range.toString(), QUOTE, "control: exactly the quote");
      _t5Fire("pbp:article-will-replace", 1, "video-ai-punctuation");

      assertEq(_pbpHlState.ranges.t5a.range.toString(), "the model runs; then it stops",

      _t5Swap(view, PUNCT);   // byte-identical to the punctuation case: only the reason differs
      _t5Fire("pbp:article-replaced", 1, "video-track-switch");
      assertEq(!!_pbpHlState.ranges.t5a, false, "not painted");
      assertEq(_pbpHlState.orphans.t5a, true, "orphaned -- the Notebook shows it, the article does not");
      assertEq(_pbpHlState.degraded.t5a, undefined, "and never degraded onto a whole wrong block");

  test("track switch to another language never mis-anchors", () => {
    if (typeof Highlight !== "function") return;

      _t5Fire("pbp:article-will-replace", 1, "video-track-switch");

    } finally { teardown(view); }

  test("two replacement cycles: the tolerance re-arms, and a later track switch disarms it", () => {
    if (typeof Highlight !== "function") return;
    const view = setup();
    try {
      _t5Fire("pbp:article-will-replace", 1, "video-ai-punctuation");

      _t5Fire("pbp:article-replaced", 1, "video-ai-punctuation");

      // Cycle 2, a SECOND punctuation pass with different marks.
      _t5Fire("pbp:article-will-replace", 2, "video-ai-punctuation");
      _t5Swap(view, "<p>So, the model runs; then, it stops!</p><p>We wait -- for the next batch.</p>");

      assertEq(_pbpHlState.ranges.t5a.range.toString(), "the model runs; then, it stops",
        "and re-derived against cycle 2's marks");
      // Cycle 3: a track switch. Nothing about the DOM changes, only the reason

      _t5Fire("pbp:article-will-replace", 3, "video-track-switch");
      _t5Fire("pbp:article-replaced", 3, "video-track-switch");
      assertEq(_pbpHlState.orphans.t5a, true, "the arm did not survive the next replacement");
    } finally { teardown(view); }

  test("an item that still matches literally is untouched by any of this", () => {

      assert(_pbpHlState.ranges.t5a, "exact global relocation still works with the tier disarmed");
      assertEq(_pbpHlState.ranges.t5a.range.toString(), QUOTE, "and lands on the quote");
      assertEq(_pbpHlState.resolvedN.t5a, pbpAiBlocks()[1].n, "relocated to the block that now holds it");
    } finally { teardown(view); }

  test("replaced refreshes the Notebook (orphan/degraded verdicts just changed)", () => {
    if (typeof Highlight !== "function") return;

      _t5Swap(view, PUNCT);

  test("a replacement that THREW mid-swap still leaves a usable module", () => {

      _t5Fire("pbp:article-will-replace", 1, "video-ai-punctuation");
      view.innerHTML = "";

  test("the init retry is gated on the page's article runtime having actually started", () => {

      _pbpHlRendered = true;
      _t5Fire("pbp:article-replaced", 2, "video-track-switch");
      assertEq(inits, 1,

      _pbpHlState = { url: "u", title: "t", items: [], ranges: {}, degraded: {}, resolvedN: {}, orphans: {} };
      _t5Fire("pbp:article-replaced", 3, "video-track-switch");

  test("will-replace drops the live selection and the bar's captured Range", () => {

<script>
// ============ T5 skim: never spends on a replacement (DOM) ============
suiteIf("T5 skim: article replacement", "_pbpSkimOnArticleWillReplace", () => {
  // The REAL builder, so the mount decision (#video-skim-slot vs .doc-body)
  // is what the tests see.
  function mount(videoMode) {
    const docBody = document.createElement("div");
    docBody.className = "doc-body";
    const view = document.createElement("div");
    view.id = "rendered-view";
    view.innerHTML = "<p>alpha one paragraph</p><p>alpha two paragraph</p>";
    if (videoMode) {
      const slot = document.createElement("div");
      slot.id = "video-skim-slot";
      docBody.appendChild(slot);     // the study column's first child
    }
    docBody.appendChild(view);
    document.body.insertBefore(docBody, document.body.firstChild);
    pbpAiIndexBlocks(view);
    _pbpSkimBuildSection(view);
    return { docBody, view, sec: document.getElementById("skim-section") };
  }
  function unmount(bits) {
    bits.docBody.remove();
    const stray = document.getElementById("skim-section");
    if (stray) stray.remove();
  }
  function state() {
    return {
      s: { aiProvider: "ollama", previewAiEnabled: true, previewSkimEnabled: true },
      url: "https://example.test/t5", title: "T5", forum: false,
      section: null, running: false, ctrl: null, gen: 0, permissionError: null
    };
  }

  test("the skim section lives OUTSIDE #rendered-view, so the swap cannot touch it", () => {
    for (const videoMode of [false, true]) {
      const bits = mount(videoMode);
      try {
        const sec = bits.sec;
        assert(sec, "section built (" + (videoMode ? "video workspace" : "plain doc-body") + ")");
        assertEq(bits.view.contains(sec), false,
          "not inside #rendered-view -- renderArticleContent only replaces its CHILDREN");
        assertEq(sec.parentElement.id, videoMode ? "video-skim-slot" : "",
          videoMode ? "mounted in the study column's slot" : "mounted in .doc-body");
        sec.classList.add("collapsed");
        const home = sec.parentElement;
        bits.view.innerHTML = "<p>beta one paragraph</p>";   // the swap
        assertEq(document.getElementById("skim-section"), sec, "same node, still on the page");
        assertEq(sec.parentElement, home, "same DOM home");
        assertEq(sec.classList.contains("collapsed"), true, "collapse state preserved");
      } finally { unmount(bits); }
    }
  });

  test("a replacement issues no request, marks the results stale and disables their chips", () => {
    const bits = mount(false);
    const saved = _pbpSkimState;
    const savedStream = window.callAIStream;
    let calls = 0;
    try {
      window.callAIStream = () => { calls++; return Promise.reject(new Error("no network in tests")); };
      _pbpSkimState = state();
      const body = document.getElementById("skim-body");
      body.innerHTML = '<ul><li>a point <button class="ask-chip">P1</button></li></ul>';
      const chip = body.querySelector(".ask-chip");
      assertEq(chip.disabled, false, "control: the chip starts clickable");
      assertEq(document.getElementById("skim-stale").hidden, true, "control: no stale bar yet");
      _t5Fire("pbp:article-will-replace", 1, "video-track-switch");
      bits.view.innerHTML = "<p>gamma one paragraph</p><p>gamma two paragraph</p>";
      pbpAiIndexBlocks(bits.view);
      _t5Fire("pbp:article-replaced", 1, "video-track-switch");
      assertEq(calls, 0, "not one request: a replacement may never spend tokens");
      assertEq(document.getElementById("skim-stale").hidden, false, "stale bar shown instead");
      assertEq(body.querySelector("li") !== null, true, "the existing key points are KEPT, not wiped");
      assertEq(chip.disabled && chip.classList.contains("stale"), true,
        "old [Pn] chips index a block list that no longer exists");
    } finally {
      _pbpSkimState = saved;
      window.callAIStream = savedStream;
      unmount(bits);
    }
  });

  test("will-replace fences the in-flight run and hands the panel back to the reader", () => {
    const bits = mount(false);
    const saved = _pbpSkimState;
    try {
      const st = state();
      st.gen = 3;
      st.running = true;
      st.ctrl = new AbortController();
      _pbpSkimState = st;
      const stop = document.getElementById("skim-stop");
      const regen = document.getElementById("skim-regen");
      const body = document.getElementById("skim-body");
      stop.hidden = false;
      regen.disabled = true;
      body.setAttribute("aria-busy", "true");
      _pbpSkimSetStatus("generating...");
      assertEq(st.ctrl.signal.aborted, false, "control: the stream starts un-aborted");
      const ctrl = st.ctrl;
      _t5Fire("pbp:article-will-replace", 7, "video-ai-punctuation");
      assertEq(ctrl.signal.aborted, true, "in-flight generation aborted");
      assertEq(st.ctrl, null, "controller dropped");
      assertEq(st.gen, 4, "gen bumped: the run's own paint/finalize/finally all lose their myGen check");
      assertEq(st.running, false,
        "running released -- the fenced-out finally can no longer do it, and Regenerate checks it");
      assertEq(stop.hidden, true, "Stop hidden again");
      assertEq(regen.disabled, false, "Regenerate clickable again");
      assertEq(body.hasAttribute("aria-busy"), false, "no busy residue");
      assertEq(document.getElementById("skim-status").hidden, true, "status line cleared");
    } finally {
      _pbpSkimState = saved;
      unmount(bits);
    }
  });

  test("the fence advances even when the detail carries no usable revision", () => {
    const before = _pbpSkimArticleRev;
    try {
      _pbpSkimOnArticleWillReplace({});
      assertEq(_pbpSkimArticleRev, before + 1, "a detail without a revision still invalidates");
      _pbpSkimOnArticleWillReplace({ revision: "not a number" });
      assertEq(_pbpSkimArticleRev, before + 2, "garbage revision still advances the fence");
      _pbpSkimOnArticleWillReplace({ revision: before + 2 });
      assertEq(_pbpSkimArticleRev, before + 3, "a non-advancing revision never freezes it");
    } finally {
      _pbpSkimArticleRev = before;
    }
  });
});

<script>
// ============ T4 (async): parked translate run + ask stream + history ============
// Exposed as a promise: the T5 async suite fires the SAME lifecycle events at
// the same module state, so the two must not interleave (they did, and it made
// a T5 assertion pass vacuously).
window._t4AsyncDone = (async function () {
  const host = document.createElement("div");
  host.className = "suite";
  const h = document.createElement("h2");
  h.textContent = "T4 async: no auto-spend, ask stream abort semantics, history restore";
  host.appendChild(h);
  document.getElementById("results").appendChild(host);
  function report(name, err) {
    const div = document.createElement("div");
    if (!err) { PASS++; div.className = "case pass"; div.textContent = "PASS " + name; }
    else { FAIL++; div.className = "case fail"; div.textContent = "FAIL " + name + "\n  " + err.message; }
    host.appendChild(div);
  }
  async function atest(name, fn) { return atestNetSerial(name, fn, report); } // shares the network-stub queue (see atestNetSerial)
  if (typeof _pbpAskRun !== "function" || typeof _pbpAskOnArticleWillReplace !== "function"
      || typeof _pbpTrOnArticleWillReplace !== "function") {

    div.className = "case skip";
    div.textContent = "SKIP T4 async (replacement handlers not loaded)";
    host.appendChild(div); SKIP++; return;
  }

  await atest("a translate run parked on the work build issues no request after a replacement", async () => {
    const saved = _pbpTrState;
    const savedStream = window.callAIStream;
    const sec = document.createElement("div");
    sec.id = "tr-section";
    document.body.appendChild(sec);
    const st = _t4TrState("https://example.test/t4-parked-" + Date.now());
    _pbpTrState = st;
    // Without the fence the run proceeds to real requests; keep that bounded.
    window.callAIStream = () => Promise.reject(new Error("no network in tests"));
    try {
      let release;
      st.workReady = new Promise((r) => { release = r; });
      const runP = _pbpTrStart(st);
      assertEq(st.running, true, "control: the run claimed itself and parked on the build");
      assertEq(st.ctrl, null, "control: no controller yet -- it is created after the build");
      _t4FireQuiet("pbp:article-will-replace", 1);
      // A non-empty queue on the far side of the await, so only the revision
      // fence can stop this run from spending tokens.
      st.work = [_t4Work(1, "gamma one paragraph", st.rev)];
      release();
      await runP;
      assertEq(st.ctrl, null, "no AbortController was ever created: no request left the page");
      assertEq(st.running, false, "run released so the reader can translate the new article by hand");
    } finally {
      _pbpTrState = saved;
      window.callAIStream = savedStream;
      sec.remove();
    }
  });

  const PARTIAL = "**Partial** answer so far";
  function mkThread() {
    const wrap = document.createElement("div");
    const thread = document.createElement("div");
    thread.id = "ask-thread";
    wrap.appendChild(thread);
    document.body.appendChild(wrap);
    return { wrap, thread };
  }
  function mkAskState(url) {
    return {
      s: { aiProvider: "gemini" },
      url, title: "T4 transcript", account: "", forum: false,
      panel: null, ctx: { text: "context", sent: [], sentBlocks: 1, totalBlocks: 1 },
      rounds: [], records: [], running: false, ctrl: null

  }
  function mkAnswerEl(thread, question) {
    const aEl = document.createElement("div");
    aEl.className = "ask-a streaming";
    aEl.dataset.askQuestion = question;
    thread.appendChild(aEl);
    return aEl;
  }
  // Streams one delta, then hangs until the caller's AbortSignal fires.
  function streamUntilAbort() {
    return (s, prompt, opts, onDelta) => new Promise((resolve, reject) => {
      onDelta("Partial ", PARTIAL);
      opts.signal.addEventListener("abort", () => {
        const err = new Error("aborted");
        err.name = "AbortError";
        reject(err);
      });
    });
  }
  function askCleanup(bits, savedState, savedStream) {
    _pbpAskState = savedState;
    window.callAIStream = savedStream;
    bits.wrap.remove();
    const clear = document.getElementById("ask-clear");
    if (clear) clear.remove();
  }

  // #ask-thread is the panel's scroll container (md-preview.css: flex:1,
  // min-height:0, overflow-y:auto) and an answer grows DOWNWARD, which browser
  // scroll anchoring does not compensate. Give the harness thread the same
  // shape so the follow behaviour is observable at all.
  function mkScrollingThread() {
    const bits = mkThread();
    bits.thread.style.height = "60px";
    bits.thread.style.overflowY = "auto";
    const filler = document.createElement("div");
    filler.style.height = "400px";
    bits.thread.appendChild(filler);
    return bits;
  }
  const LONG_ANSWER = "Lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod. ".repeat(120);
  function bottomGap(thread) {
    return thread.scrollHeight - thread.scrollTop - thread.clientHeight;
  }
  // Streams one long delta in a single chunk, then hangs until abort.
  function streamLongUntilAbort() {
    return (s, prompt, opts, onDelta) => new Promise((resolve, reject) => {
      onDelta(LONG_ANSWER, LONG_ANSWER);
      opts.signal.addEventListener("abort", () => {
        const err = new Error("aborted");
        err.name = "AbortError";
        reject(err);
      });

  }

  await atest("the streaming paint keeps a bottom-parked thread at the bottom", async () => {
    const bits = mkScrollingThread();
    const saved = _pbpAskState, savedStream = window.callAIStream;
    const st = mkAskState("https://example.test/t4-follow-" + Date.now());
    _pbpAskState = st;
    window.callAIStream = streamLongUntilAbort();
    try {
      const aEl = mkAnswerEl(bits.thread, "follow question");
      bits.thread.scrollTop = bits.thread.scrollHeight;   // the reader is at the foot
      assert(bottomGap(bits.thread) <= 32, "control: the thread starts parked at its bottom");
      const p = _pbpAskRun("follow question", aEl);
      await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      assert(bits.thread.scrollHeight > 460, "control: the streamed answer overflows the container");
      assert(bottomGap(bits.thread) <= 32,
        "the rAF paint follows the stream (gap " + bottomGap(bits.thread) + "px)");
      st.ctrl.abort();                                    // teardown only
      await p;
    } finally {
      askCleanup(bits, saved, savedStream);
    }
  });

  await atest("finalize re-pins after the markdown render and the chip/button row", async () => {
    // The stream ends and the bubble grows AGAIN: plain text becomes rendered

    const bits = mkScrollingThread();
    const saved = _pbpAskState, savedStream = window.callAIStream;
    const st = mkAskState("https://example.test/t4-finalize-pin-" + Date.now());
    _pbpAskState = st;

    // is the only thing that can move the thread.
    window.callAIStream = (s, prompt, opts, onDelta) => {
      onDelta(LONG_ANSWER, LONG_ANSWER);
      return Promise.resolve(LONG_ANSWER);
    };
    try {
      const aEl = mkAnswerEl(bits.thread, "finalize question");
      bits.thread.scrollTop = bits.thread.scrollHeight;
      await _pbpAskRun("finalize question", aEl);
      assert(aEl.querySelector(".ask-copy-btn"), "control: finalize ran and decorated the answer");
      assert(bits.thread.scrollHeight > 460, "control: the finalized answer overflows the container");
      assert(bottomGap(bits.thread) <= 32,
