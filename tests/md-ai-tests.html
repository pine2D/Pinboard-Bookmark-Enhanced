    } finally {
      askCleanup(bits, saved, savedStream);
    }
  });

  await atest("a reader who scrolled up is not dragged back by a streaming answer", async () => {
    const bits = mkScrollingThread();
    const saved = _pbpAskState, savedStream = window.callAIStream;
    const st = mkAskState("https://example.test/t4-noyank-" + Date.now());
    _pbpAskState = st;
    window.callAIStream = streamLongUntilAbort();
    try {
      const aEl = mkAnswerEl(bits.thread, "scrolled question");
      bits.thread.scrollTop = 0;                          // re-reading an earlier round
      const p = _pbpAskRun("scrolled question", aEl);
      await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      assert(bits.thread.scrollHeight > 460, "control: the answer really did grow past the fold");
      assertEq(bits.thread.scrollTop, 0, "the stream paint left the scroll position alone");
      st.ctrl.abort();                                    // teardown only
      await p;
    } finally {
      askCleanup(bits, saved, savedStream);
    }
  });

  await atest("user Stop finalizes the partial answer into the thread", async () => {
    const bits = mkThread();
    const saved = _pbpAskState, savedStream = window.callAIStream;
    const st = mkAskState("https://example.test/t4-stop-" + Date.now());
    _pbpAskState = st;
    window.callAIStream = streamUntilAbort();
    try {
      const aEl = mkAnswerEl(bits.thread, "stop question");
      const p = _pbpAskRun("stop question", aEl);
      assert(st.ctrl && !st.ctrl.signal.aborted, "control: the stream is running");
      st.ctrl.abort();                            // the Stop button's exact action
      await p;
      assert(aEl.querySelector("strong"), "Stop renders the partial as markdown: finalize ran");
      assertEq(aEl.dataset.askStopped, "1", "stopped flag set so a later Regenerate appends");
      assert(aEl.querySelector(".ask-stopped"), "stopped note appended");
      assertEq(st.rounds.length, 0, "a stopped partial still never enters the prompt history");
    } finally {
      askCleanup(bits, saved, savedStream);
    }
  });

  await atest("an article replacement aborts the stream WITHOUT finalizing it", async () => {
    const bits = mkThread();
    const saved = _pbpAskState, savedStream = window.callAIStream;
    const st = mkAskState("https://example.test/t4-replace-" + Date.now());
    _pbpAskState = st;
    window.callAIStream = streamUntilAbort();
    try {
      const aEl = mkAnswerEl(bits.thread, "replaced question");
      const p = _pbpAskRun("replaced question", aEl);
      assert(st.ctrl && !st.ctrl.signal.aborted, "control: the stream is running");
      _t4FireQuiet("pbp:article-will-replace", 21);
      await p;
      assertEq(aEl.querySelector("strong"), null, "no markdown render: the partial was not finalized");
      assertEq(aEl.querySelector(".ask-copy-btn"), null, "no copy button: decorate never ran");
      assertEq(aEl.querySelector(".ask-chip"), null, "no citation chips resolved against the NEW article");
      assertEq(aEl.dataset.askStopped, undefined, "no stopped flag: this round is not a regenerable one");
      assert(aEl.textContent.indexOf(PARTIAL) !== -1, "what already streamed stays visible, inert");
      assert(aEl.querySelector(".ask-stopped"), "the reader is still told the answer stopped");
      assertEq(st.rounds.length, 0, "nothing entered the prompt history");
      assertEq(st.records.length, 0, "nothing entered the persisted records");
      assertEq(st.ctx, null, "context dropped: the next question is built from the new article");
    } finally {
      askCleanup(bits, saved, savedStream);
    }
  });

  await atest("a stream that RESOLVES after the replacement is neither finalized nor persisted", async () => {
    const bits = mkThread();
    const saved = _pbpAskState, savedStream = window.callAIStream;
    const st = mkAskState("https://example.test/t4-race-" + Date.now());
    _pbpAskState = st;

      onDelta("Partial ", PARTIAL);

      const aEl = mkAnswerEl(bits.thread, "race question");
      const p = _pbpAskRun("race question", aEl);

      assertEq(aEl.querySelector("strong"), null, "no markdown render: the answer was not finalized");
      assertEq(st.rounds.length, 0, "no round recorded for an article that is gone");
      assertEq(st.records.length, 0, "nothing persisted");
    } finally {
      askCleanup(bits, saved, savedStream);
    }
  });

  await atest("a SECOND replacement fences the next stream too (handlers are not once-only)", async () => {
    const bits = mkThread();
    const saved = _pbpAskState, savedStream = window.callAIStream;
    const st = mkAskState("https://example.test/t4-twice-" + Date.now());
    _pbpAskState = st;
    window.callAIStream = streamUntilAbort();
    try {
      const first = mkAnswerEl(bits.thread, "first question");
      const p1 = _pbpAskRun("first question", first);
      _t4FireQuiet("pbp:article-will-replace", 41);
      _t4FireQuiet("pbp:article-replaced", 41);
      await p1;

      _t4FireQuiet("pbp:article-will-replace", 42);
      await p2;
      assertEq(second.querySelector("strong"), null, "the second cycle also refuses to finalize");
      assertEq(st.rounds.length, 0, "still nothing in the prompt history");
      assertEq(st.ctx, null, "and the context was dropped again");
    } finally {
      askCleanup(bits, saved, savedStream);
    }
  });

  // dispatches will-replace and article-replaced inside ONE synchronous block
  // ("Deliberately SYNCHRONOUS end to end ... Do not make this async"), so a
  // parked restore has NOT reached any bail point when the replaced handler
  // runs. Any test that awaits between the two dispatches invents an interleave
  // the producer cannot emit -- and passes over a mechanism that never fires.
  async function settleRestore(thread) {
    for (let i = 0; i < 300 && !thread.querySelector(".ask-restored"); i++) {
      await new Promise((r) => setTimeout(r, 10));
    }
    await new Promise((r) => setTimeout(r, 60));   // let a duplicate insert, if any, land too
  }

  await atest("a history restore in flight when the article changes still restores, exactly once", async () => {
    const root = document.createElement("div");
    root.innerHTML = "<p>alpha beta gamma</p><p>second block text</p>";
    pbpAiIndexBlocks(root);
    const bits = mkThread();
    const saved = _pbpAskState;
    const savedUrl = _pbpAskHistUrl, savedAcct = _pbpAskHistAccount, savedFlag = _pbpAskHistRestored;
    const url = "https://example.test/t4-hist-" + Date.now() + "-" + Math.random();
    try {
      await pbpAskHistAppend(url, { q: "q1", a: "Answer [P1] one.", blocksHash: "old-fp" }, "");
      await pbpAskHistAppend(url, { q: "q2", a: "Answer [P1] two.", blocksHash: "old-fp" }, "");
      _pbpAskState = mkAskState(url);
      _pbpAskHistUrl = url;
      _pbpAskHistAccount = "";
      _pbpAskHistRestored = false;
      _pbpAskHistRestore();                          // parks on its IDB read
      // Both dispatches back to back, with only the DOM swap + index rebuild
      // between them -- byte-for-byte the producer's sequence.
      _t4FireQuiet("pbp:article-will-replace", 51);
      const newRoot = document.createElement("div");
      newRoot.innerHTML = "<p>brand new paragraph one</p><p>brand new paragraph two</p>";
      pbpAiIndexBlocks(newRoot);
      _t4FireQuiet("pbp:article-replaced", 51);
      await settleRestore(bits.thread);
      assert(bits.thread.querySelector(".ask-restored"),
        "persisted Q&A appears: the superseded restore re-armed itself");
      assertEq(bits.thread.querySelectorAll(".ask-restored").length, 1, "restored once, not twice");
      assertEq(bits.thread.querySelectorAll(".ask-a").length, 2, "both rounds, no duplicates");
      assertEq(_pbpAskHistRestored, true, "and the single-shot flag ends up claimed again");
      const chips = Array.from(bits.thread.querySelectorAll(".ask-chip"));
      assert(chips.length > 0, "control: the restored answers carry chips");
      assertEq(chips.every((c) => c.disabled), true,
        "every one is disabled: the stored fingerprint no longer matches this article");
    } finally {
      _pbpAskState = saved;
      _pbpAskHistUrl = savedUrl; _pbpAskHistAccount = savedAcct; _pbpAskHistRestored = savedFlag;
      bits.wrap.remove();

    }
  });

  await atest("a replacement landing mid-chunk re-arms the restore exactly once", async () => {
    // The other ordering: the restore is already PAST its IDB read and inside
    // the rAF-chunked build when the swap lands. Two of its three bail points
    // then trip in the same run (the re-entered restore claims the single-shot
    // flag again, so the plain !_pbpAskHistRestored guard passes), and a second
    // re-entry would leave two restores running concurrently -- both inserting.
    //
    // Made deterministic by deferring only the FIRST pbpAskHistGet, so the
    // restore can be parked exactly between its post-IDB check and its first
    // chunk. No rAF stubbing: this page's popover suite schedules its own
    // frames across awaits and a global rAF queue makes it flaky.
    const root = document.createElement("div");
    root.innerHTML = "<p>alpha beta gamma</p><p>second block text</p>";
    pbpAiIndexBlocks(root);
    const bits = mkThread();
    const saved = _pbpAskState;
    const savedUrl = _pbpAskHistUrl, savedAcct = _pbpAskHistAccount, savedFlag = _pbpAskHistRestored;
    const realGet = window.pbpAskHistGet;
    const url = "https://example.test/t4-hist3-" + Date.now() + "-" + Math.random();
    try {
      // More rounds than md-ask's PBP_ASK_HIST_CHUNK (2, function-scoped), so a

        await pbpAskHistAppend(url, { q: "q" + i, a: "Answer [P1] " + i + ".", blocksHash: "old-fp" }, "");
      }
      _pbpAskState = mkAskState(url);
      _pbpAskHistUrl = url;
      _pbpAskHistAccount = "";
      _pbpAskHistRestored = false;
      // Resolve with an already-READ value, never with a pending IDB promise:
      // adopting a thenable would keep the restore parked until a macrotask,
      // and the park has to end on microtasks alone so no frame slips in.
      const preloaded = await realGet(url, "");
      let deferFirst = true, releaseGet = null;
      window.pbpAskHistGet = (...args) => {
        if (!deferFirst) return realGet(...args);     // re-entrant restores read normally
        deferFirst = false;
        return new Promise((r) => { releaseGet = () => r(preloaded); });

      _pbpAskHistRestore();
      for (let i = 0; i < 300 && !releaseGet; i++) await new Promise((r) => setTimeout(r, 10));
      assert(releaseGet, "control: the restore reached its history read");
      releaseGet();
      // Microtask turns only -- no timer or frame may run here, or the chunk
      // loop would start before the swap and the bail point would move.
      for (let i = 0; i < 20; i++) await Promise.resolve();
      _t4FireQuiet("pbp:article-will-replace", 71);   // production ordering, mid-build

      newRoot.innerHTML = "<p>brand new paragraph one</p><p>brand new paragraph two</p>";
      pbpAiIndexBlocks(newRoot);
      _t4FireQuiet("pbp:article-replaced", 71);
      await settleRestore(bits.thread);
      assert(bits.thread.querySelector(".ask-restored"), "persisted Q&A still appears");
      assertEq(bits.thread.querySelectorAll(".ask-restored").length, 1, "restored once, not twice");
      assertEq(bits.thread.querySelectorAll(".ask-a").length, ROUNDS,
        "every round exactly once -- no concurrent second restore");
    } finally {
      window.pbpAskHistGet = realGet;
      _pbpAskState = saved;
      _pbpAskHistUrl = savedUrl; _pbpAskHistAccount = savedAcct; _pbpAskHistRestored = savedFlag;
      bits.wrap.remove();
      const clear = document.getElementById("ask-clear");
      if (clear) clear.remove();
    }
  });

  await atest("a replacement AFTER the restore finished does not insert the transcript twice", async () => {
    const root = document.createElement("div");
    root.innerHTML = "<p>alpha beta gamma</p><p>second block text</p>";
    pbpAiIndexBlocks(root);
    const bits = mkThread();
    const saved = _pbpAskState;
    const savedUrl = _pbpAskHistUrl, savedAcct = _pbpAskHistAccount, savedFlag = _pbpAskHistRestored;
    const url = "https://example.test/t4-hist2-" + Date.now() + "-" + Math.random();
    try {
      await pbpAskHistAppend(url, { q: "q1", a: "Answer [P1] one.", blocksHash: "old-fp" }, "");
      _pbpAskState = mkAskState(url);
      _pbpAskHistUrl = url;
      _pbpAskHistAccount = "";
      _pbpAskHistRestored = false;
      await _pbpAskHistRestore();
      await settleRestore(bits.thread);
      assertEq(bits.thread.querySelectorAll(".ask-a").length, 1, "control: restored once before the replacement");
      _t4FireQuiet("pbp:article-will-replace", 61);
      _t4FireQuiet("pbp:article-replaced", 61);
      await settleRestore(bits.thread);
      assertEq(bits.thread.querySelectorAll(".ask-restored").length, 1, "still one restored-note");
      assertEq(bits.thread.querySelectorAll(".ask-a").length, 1, "the completed transcript is not duplicated");
    } finally {
      _pbpAskState = saved;
      _pbpAskHistUrl = savedUrl; _pbpAskHistAccount = savedAcct; _pbpAskHistRestored = savedFlag;
      bits.wrap.remove();
      const clear = document.getElementById("ask-clear");
      if (clear) clear.remove();
    }
  });
})();

// CHAIN CONTRACT (T5 review F2): every async suite that dispatches the
// article-replacement events must serialize on the previous suite's
// _t<N>AsyncDone AND publish its own, so the next suite has a handle to
// join -- two suites firing these events concurrently race the shared
// module state and produce false greens (caught live during T5).
window._t5AsyncDone = (async function () {
  // Strictly after the T4 async suite: it dispatches pbp:article-will-replace /
  // pbp:article-replaced too, and those handlers write the very module state
  // (skim's revision fence, its stale bar) these cases assert on.
  try { await window._t4AsyncDone; } catch (_) {}
  const host = document.createElement("div");
  host.className = "suite";
  const h = document.createElement("h2");
  h.textContent = "T5 async: skim token protection, highlight card teardown";
  host.appendChild(h);
  document.getElementById("results").appendChild(host);
  function report(name, err) {
    const div = document.createElement("div");
    if (!err) { PASS++; div.className = "case pass"; div.textContent = "PASS " + name; }
    else { FAIL++; div.className = "case fail"; div.textContent = "FAIL " + name + "\n  " + err.message; }
    host.appendChild(div);
  }
  async function atest(name, fn) { return atestNetSerial(name, fn, report); } // shares the network-stub queue (see atestNetSerial)
  if (typeof _pbpSkimRegen !== "function" || typeof _pbpSkimOnArticleWillReplace !== "function"
      || typeof _pbpHlOnArticleWillReplace !== "function") {
    const div = document.createElement("div");
    div.className = "case skip";
    div.textContent = "SKIP T5 async (replacement handlers not loaded)";
    host.appendChild(div); SKIP++; return;
  }

  function skimMount() {
    const docBody = document.createElement("div");
    docBody.className = "doc-body";
    const view = document.createElement("div");
    view.id = "rendered-view";
    view.innerHTML = "<p>alpha one paragraph of the transcript</p><p>alpha two paragraph of it</p>";
    docBody.appendChild(view);

    pbpAiIndexBlocks(view);
    _pbpSkimBuildSection(view);

  }
  function skimUnmount(bits) {
    bits.docBody.remove();
    const stray = document.getElementById("skim-section");
    if (stray) stray.remove();
  }
  function skimSettings() {
    // ollama needs no key, so pbpAiAvailable passes without inventing one.
    return Object.assign({}, SETTINGS_DEFAULTS, {
      aiProvider: "ollama", previewAiEnabled: true, previewSkimEnabled: true
    });
  }
  function skimState(url) {
    return {
      s: skimSettings(), url, title: "T5", forum: false,
      section: null, running: false, ctrl: null, gen: 0, permissionError: null
    };
  }

  await atest("control: Regenerate DOES issue a request when nothing interrupts it", async () => {
    const bits = skimMount();
    const saved = _pbpSkimState, savedStream = window.callAIStream, savedGet = window.pbpAiGetSettings;
    let calls = 0;
    try {
      window.callAIStream = () => { calls++; return Promise.reject(new Error("no network in tests")); };
      window.pbpAiGetSettings = () => Promise.resolve(skimSettings());
      _pbpSkimState = skimState("https://example.test/t5-spend-" + Date.now());
      await _pbpSkimRegen();
      assertEq(calls, 1, "the request seam is live and reachable from a real Regenerate click");
      assertEq(_pbpSkimState.running, false, "and the module is released afterwards");
    } finally {
      _pbpSkimState = saved; window.callAIStream = savedStream; window.pbpAiGetSettings = savedGet;
      skimUnmount(bits);
    }
  });

  await atest("a Regenerate parked across a replacement buys nothing", async () => {
    const bits = skimMount();
    const saved = _pbpSkimState, savedStream = window.callAIStream, savedGet = window.pbpAiGetSettings;
    let calls = 0;
    try {
      window.callAIStream = () => { calls++; return Promise.reject(new Error("no network in tests")); };
      let release = null;
      const parked = new Promise((res) => { release = () => res(skimSettings()); });
      window.pbpAiGetSettings = () => parked;
      const st = skimState("https://example.test/t5-parked-" + Date.now());
      _pbpSkimState = st;
      const p = _pbpSkimRegen();
      assertEq(st.running, true, "control: the regen claimed the module and parked on the settings read");
      // Real settings again BEFORE the events: md-translate's own replaced
      // handler retries pbpTrInit when it has no state, and it must not park on
      // (or consume) the promise this test is holding for skim.
      window.pbpAiGetSettings = savedGet;
      // Production ordering: both events in one synchronous task.
      _t5Fire("pbp:article-will-replace", 1, "video-track-switch");
      _t5Fire("pbp:article-replaced", 1, "video-track-switch");
      release();
      await p;
      assertEq(calls, 0,
        "no request: the reader clicked Regenerate for an article that is no longer on screen");
      assertEq(st.running, false, "module left usable -- a fresh click can still generate by hand");
    } finally {
      _pbpSkimState = saved; window.callAIStream = savedStream; window.pbpAiGetSettings = savedGet;
      skimUnmount(bits);
    }
  });

  await atest("a superseded Regenerate never releases a NEWER one's claim on the module", async () => {
    const bits = skimMount();
    const saved = _pbpSkimState, savedStream = window.callAIStream, savedGet = window.pbpAiGetSettings;
    let calls = 0;
    try {
      window.callAIStream = () => { calls++; return Promise.reject(new Error("no network in tests")); };
      let release1 = null;
      const parked1 = new Promise((res) => { release1 = () => res(skimSettings()); });
      window.pbpAiGetSettings = () => parked1;
      const st = skimState("https://example.test/t5-owned-" + Date.now());
      _pbpSkimState = st;
      const p1 = _pbpSkimRegen();                       // click 1, parks
      window.pbpAiGetSettings = savedGet;
      _pbpSkimOnArticleWillReplace({ revision: 1 });    // the swap releases st.running
      assertEq(st.running, false, "control: the teardown handed the module back");
      let release2 = null;
      const parked2 = new Promise((res) => { release2 = () => res(skimSettings()); });
      window.pbpAiGetSettings = () => parked2;
      const p2 = _pbpSkimRegen();                       // click 2, on the NEW article
      window.pbpAiGetSettings = savedGet;
      assertEq(st.running, true, "control: click 2 owns the module now");
      release1();
      await p1;
      assertEq(st.running, true,
        "click 1 bailed on the fence and must not clear a flag it no longer owns");
      assertEq(calls, 0, "and it issued nothing");
      release2();
      await p2;
      assertEq(calls, 1, "click 2, which the reader made on the article they are looking at, does spend");
    } finally {
      _pbpSkimState = saved; window.callAIStream = savedStream; window.pbpAiGetSettings = savedGet;
      skimUnmount(bits);
    }
  });

  await atest("init parked across a replacement generates nothing either", async () => {
    const bits = skimMount();
    const saved = _pbpSkimState, savedStream = window.callAIStream, savedGet = window.pbpAiGetSettings;
    let calls = 0;
    try {
      window.callAIStream = () => { calls++; return Promise.reject(new Error("no network in tests")); };
      let release = null;
      const parked = new Promise((res) => { release = () => res(skimSettings()); });
      window.pbpAiGetSettings = () => parked;
      _pbpSkimState = null;
      const p = pbpSkimInit({ url: "https://example.test/t5-init-" + Date.now(), title: "T5", forum: false });
      window.pbpAiGetSettings = savedGet;   // nobody else may consume this test's parked promise
      // The cache read inside _pbpSkimLoad is a miss for this url, so without
      // the fence the init would auto-generate -- for an article that arrived
      // AFTER the reader opened the page.
      _pbpSkimOnArticleWillReplace({ revision: 99 });
      release();
      await p;
      assertEq(calls, 0, "the cache-miss auto-generation is fenced by the article revision");
      assertEq(document.getElementById("skim-stale").hidden, false,
        "the panel says so, and its Regenerate button is the way back");
    } finally {
      _pbpSkimState = saved; window.callAIStream = savedStream; window.pbpAiGetSettings = savedGet;
      skimUnmount(bits);
    }
  });

  await atest("will-replace saves the dirty note and closes the card before the swap", async () => {
    const prevSave = _pbpHlSave, prevRender = _pbpHlNotebookRender, prevState = _pbpHlState;
    const prevCard = _pbpHlCard, prevId = _pbpHlCardItemId, prevBase = _pbpHlCardBaseNote;
    const prevDirty = _pbpHlNoteDirty, prevQueue = _pbpHlWriteQueue;
    const prevLoadStrict = _pbpHlLoadStrict;
    const card = document.createElement("div");
    card.setAttribute("popover", "auto");
    try {
      _pbpHlSave = async () => true;
      // Same reason as the dirty-card commit test above: the commit re-reads
      // storage strictly and patches by item.id, so the fixture has to be
      // reachable from that read, not only from memory.
      _pbpHlLoadStrict = async () => structuredClone(_pbpHlState.items);
      _pbpHlNotebookRender = () => {};
      _pbpHlWriteQueue = Promise.resolve();
      const item = { id: "h5", n: 1, quote: "quote", note: "stored", color: 1, ts: 1 };
      _pbpHlState = {
        url: "https://example.test/t5", title: "T5", items: [item],
        ranges: Object.create(null), degraded: Object.create(null),
        resolvedN: Object.create(null), orphans: Object.create(null)
      };
      const note = document.createElement("textarea");
      note.className = "hl-card-note";
      note.value = "half-typed thought";
      card.appendChild(note);
      document.body.appendChild(card);
      card.showPopover();
      _pbpHlCard = card;
      _pbpHlCardItemId = "h5";
      _pbpHlCardBaseNote = "stored";
      _pbpHlNoteDirty = true;
      assertEq(card.matches(":popover-open"), true, "control: the card starts open");
      assertEq(item.note, "stored", "control: the draft is not in storage yet");
      _t5FireCard("pbp:article-will-replace", 1, "video-track-switch");
      await _pbpHlWriteQueue;
      assertEq(_pbpHlState.items[0].note, "half-typed thought",
        "read synchronously and queued: the write outlives the swap");
      assertEq(card.matches(":popover-open"), false, "card closed -- it renders a Range about to detach");
      assertEq(_pbpHlCardItemId, null,
        "binding cleared synchronously; the card's own toggle listener is queued, not immediate");
    } finally {
      _pbpHlSave = prevSave; _pbpHlNotebookRender = prevRender; _pbpHlState = prevState;
      _pbpHlCard = prevCard; _pbpHlCardItemId = prevId; _pbpHlCardBaseNote = prevBase;
      _pbpHlNoteDirty = prevDirty; _pbpHlWriteQueue = prevQueue;
      _pbpHlLoadStrict = prevLoadStrict;
      card.remove();

})();

<script>
// ============ K133: OpenAI-compat body-parameter dialect + 400 self-heal ============
// Pure half. The output-budget field name is a per-PROVIDER dialect (OpenAI's
// Chat Completions renamed max_tokens -> max_completion_tokens); temperature
// support varies per MODEL, so it is never declared -- only dropped after the
// server itself refuses the value.
suite("_aiBodyDialect / _aiParamRepair (K133)", () => {
  test("default dialect: max_tokens, temperature kept", () => {
    const d = _aiBodyDialect(OPENAI_COMPAT_PROVIDERS.deepseek, null);
    assertEq(d.tokenField, "max_tokens", "field");
    assertEq(d.omitTemperature, false, "temperature kept");
  });
  test("openai declares max_completion_tokens (per-provider dialect, not a model allowlist)", () => {
    assertEq(_aiBodyDialect(OPENAI_COMPAT_PROVIDERS.openai, null).tokenField, "max_completion_tokens", "openai");
  });
  test("memo overrides both the default and the declared field", () => {
    assertEq(_aiBodyDialect(OPENAI_COMPAT_PROVIDERS.deepseek, { tokenField: "max_completion_tokens" }).tokenField,
      "max_completion_tokens", "memo wins over default");
    assertEq(_aiBodyDialect(OPENAI_COMPAT_PROVIDERS.openai, { tokenField: "max_tokens" }).tokenField,
      "max_tokens", "memo wins over declared");
    assertEq(_aiBodyDialect(OPENAI_COMPAT_PROVIDERS.openai, { omitTemperature: true }).omitTemperature, true, "temperature memo");
  });
  test("refused max_tokens -> switch to max_completion_tokens", () => {
    const r = _aiParamRepair({ paramHint: "max_tokens" }, { tokenField: "max_tokens", omitTemperature: false });
    assertEq(JSON.stringify(r), '{"tokenField":"max_completion_tokens"}', "repair");
  });
  test("refused max_completion_tokens -> switch back to max_tokens", () => {
    const r = _aiParamRepair({ paramHint: "max_completion_tokens" }, { tokenField: "max_completion_tokens", omitTemperature: false });
    assertEq(JSON.stringify(r), '{"tokenField":"max_tokens"}', "old proxy");
  });
  test("a field we are not sending is never repaired (this is what bounds the retry ladder)", () => {
    assertEq(_aiParamRepair({ paramHint: "max_tokens" }, { tokenField: "max_completion_tokens", omitTemperature: false }), null, "stale complaint");
  });
  test("temperature is dropped once, then there is nothing left to try", () => {
    assertEq(JSON.stringify(_aiParamRepair({ paramHint: "temperature" }, { tokenField: "max_tokens", omitTemperature: false })),
      '{"omitTemperature":true}', "first refusal");
    assertEq(_aiParamRepair({ paramHint: "temperature" }, { tokenField: "max_tokens", omitTemperature: true }), null, "already dropped");
  });
  test("no paramHint -> no repair", () => {
    assertEq(_aiParamRepair({ status: 400 }, { tokenField: "max_tokens", omitTemperature: false }), null, "no hint");
    assertEq(_aiParamRepair(null, { tokenField: "max_tokens", omitTemperature: false }), null, "no error");
  });
});

<script>
// ============ K133 (async): the 400 self-heal end to end ============
// Response fixtures are hand-written from the SERVER's real 400 bodies
// (mem0ai/mem0#5054, actions/ai-inference#116, getzep/graphiti#874), never
// echoed back from this repo's request builder.
//
// All cases run inside ONE turn of the shared network-stub queue: this block
// swaps window.chrome (the memo's storage) as well as window.fetch, and a
// per-case turn would leave those stubs live while an interleaved block from
// another suite ran its own case against them.
(async function () {
  const host = document.createElement("div");
  host.className = "suite";
  const h = document.createElement("h2");
  h.textContent = "K133 OpenAI-compat parameter self-heal (async)";
  host.appendChild(h);
  document.getElementById("results").appendChild(host);
  function report(name, err) {
    const div = document.createElement("div");
    if (!err) { PASS++; div.className = "case pass"; div.textContent = "PASS " + name; }
    else { FAIL++; div.className = "case fail"; div.textContent = "FAIL " + name + "\n  " + err.message; }
    host.appendChild(div);
  }
  function ok(cond, msg) { if (!cond) throw new Error(msg || "assert"); }

  const OPENAI_400_MAX_TOKENS = { error: { message: "Unsupported parameter: 'max_tokens' is not supported with this model. Use 'max_completion_tokens' instead.", type: "invalid_request_error", param: "max_tokens", code: "unsupported_parameter" } };
  const OPENAI_400_TEMPERATURE = { error: { message: "Unsupported value: 'temperature' does not support 0.3 with this model. Only the default (1) is supported.", type: "invalid_request_error", param: "temperature", code: "unsupported_value" } };
  const COMPAT_400_MESSAGE_ONLY = { error: { message: "Unsupported parameter: 'max_tokens' is not supported with this model. Use 'max_completion_tokens' instead.", type: "invalid_request_error" } };
  const PROXY_400_OLD_FIELD = { error: { message: "Unrecognized request argument supplied: max_completion_tokens", type: "invalid_request_error", param: null, code: null } };
  const OPENAI_400_CONTEXT = { error: { message: "This model's maximum context length is 128000 tokens, however you requested 130000 tokens (2000 in the messages, 128000 in the max_tokens). Please reduce the length of the messages or completion.", type: "invalid_request_error", param: "messages", code: "context_length_exceeded" } };
  // error.param names max_tokens, but the complaint is about the VALUE, not the
  // field: translate asks for min(8192, ...) and ask/summary for 4096, and
  // several compat providers cap below that. A rename is the wrong answer.
  const OPENAI_400_BUDGET_TOO_LARGE = { error: { message: "max_tokens is too large: 8192. This model supports at most 4096 completion tokens, whereas you provided 8192.", type: "invalid_request_error", param: "max_tokens", code: null } };
  const OPENAI_401_BAD_KEY = { error: { message: "Incorrect API key provided: sk-***. You can find your API key at https://platform.openai.com/account/api-keys.", type: "invalid_request_error", param: null, code: "invalid_api_key" } };

  async function hintOf(status, body) {
    try { await handleAIError({ ok: false, status, json: async () => body }, "API"); }
    catch (e) { return e; }
    throw new Error("handleAIError must always throw");
  }

  // Captured when the turn STARTS, never at parse time: other blocks install
  // their own window.chrome / window.fetch synchronously while this file is
  // being parsed and restore them from their own finally, so a parse-time
  // snapshot would resurrect a stale stub for every block that runs after us.
  let realFetch = null;
  let realChrome = null;
  const OK_BODY = { choices: [{ message: { content: "ok" } }], content: [{ type: "text", text: "ok" }] };
  const enc = new TextEncoder();
  // One SSE fixture both stream parsers understand: each ignores the other's
  // event shape, so a single "stream" response serves the compat and the
  // Anthropic caller alike.
  const SSE = [
    'data: {"choices":[{"delta":{"content":"ok"}}]}\n\n',
    'data: {"type":"content_block_delta","delta":{"type":"text_delta","text":"ok"}}\n\n',
    "data: [DONE]\n\n"
  ];
  const store = {};               // survives the whole block: this IS the memo under test
  let script = [];                // scripted responses, one per request
  const sent = [];                // parsed request bodies, in order
  function install() {
    realFetch = window.fetch;
    realChrome = window.chrome;
    window.chrome = {
      i18n: { getMessage: () => "" },
      storage: { local: {
        get: async (keys) => {
          const list = Array.isArray(keys) ? keys : [keys];
          const out = {};
          for (const k of list) if (k in store) out[k] = store[k];
          return out;
        },
        set: async (obj) => { Object.assign(store, obj); }
      } }
    };
    window.fetch = async (url, init) => {
      let body = {};
      try { body = JSON.parse((init && init.body) || "{}"); } catch (_) {}
      sent.push({ url: String(url), body });
      const next = script.shift() || { kind: "ok" };
      if (next.kind === "err") return { ok: false, status: next.status, json: async () => next.body };
      if (next.kind === "stream") {
        let i = 0;
        return { ok: true, status: 200, body: { getReader: () => ({
          async read() { return i < SSE.length ? { done: false, value: enc.encode(SSE[i++]) } : { done: true, value: undefined }; },
          async cancel() {}
        }) } };
      }
      return { ok: true, status: 200, json: async () => OK_BODY };
    };
  }
  function restore() { window.fetch = realFetch; window.chrome = realChrome; }
  function reset(...responses) { sent.length = 0; script = responses; }
  const compat = (model) => ({ aiProvider: "custom", customApiKey: "k", customBaseUrl: "https://proxy.example/v1", customModel: model });

  if (typeof callAI !== "function" || typeof handleAIError !== "function") { report("SKIP K133 suite (ai.js not loaded)"); return; }

  const cases = [
    ["OpenAI's max_tokens 400 carries paramHint=max_tokens (status + message untouched)", async () => {
      const e = await hintOf(400, OPENAI_400_MAX_TOKENS);
      ok(e.paramHint === "max_tokens", "paramHint was " + e.paramHint);
      ok(e.status === 400, "status " + e.status);
      ok(/Unsupported parameter: 'max_tokens'/.test(e.message), "message passes through: " + e.message);
    }],
    ["OpenAI's temperature 400 carries paramHint=temperature", async () => {
      const e = await hintOf(400, OPENAI_400_TEMPERATURE);
      ok(e.paramHint === "temperature", "paramHint was " + e.paramHint);
    }],
    ["message-only server: the REFUSED field wins over the suggested replacement", async () => {
      const e = await hintOf(400, COMPAT_400_MESSAGE_ONLY);
      ok(e.paramHint === "max_tokens", "must not latch onto the 'use X instead' name, got " + e.paramHint);
    }],
    ["a proxy refusing max_completion_tokens is heard too", async () => {
      const e = await hintOf(400, PROXY_400_OLD_FIELD);
      ok(e.paramHint === "max_completion_tokens", "paramHint was " + e.paramHint);
    }],
    ["a context-length 400 that merely mentions max_tokens is not a parameter refusal", async () => {
      const e = await hintOf(400, OPENAI_400_CONTEXT);
      ok(!e.paramHint, "must not rewrite the body, got " + e.paramHint);
    }],
    ["an auth failure carries no paramHint", async () => {
      const e = await hintOf(401, OPENAI_401_BAD_KEY);
      ok(!e.paramHint, "got " + e.paramHint);
    }],
    ["error.param alone is not a refusal: a too-large budget is a VALUE error, not a rename request", async () => {
      const e = await hintOf(400, OPENAI_400_BUDGET_TOO_LARGE);
      ok(!e.paramHint, "the server named the field but refused the value, got paramHint=" + e.paramHint);
    }],
    ["non-stream: a max_tokens 400 retries once with max_completion_tokens", async () => {
      reset({ kind: "err", status: 400, body: OPENAI_400_MAX_TOKENS }, { kind: "ok" });
      const out = await callAI(compat("gpt-5.4-nano"), "hi");
      ok(out === "ok", "call must succeed after the repair, got " + out);
      ok(sent.length === 2, "exactly one retry, saw " + sent.length + " requests");
      ok(sent[0].body.max_tokens === 1024, "first request carried max_tokens: " + JSON.stringify(sent[0].body));
      ok(sent[1].body.max_completion_tokens === 1024, "retry carried max_completion_tokens: " + JSON.stringify(sent[1].body));
      ok(!("max_tokens" in sent[1].body), "retry must NOT also carry max_tokens: " + JSON.stringify(sent[1].body));
    }],
    ["the repair is memoized: the next call sends the right field on the FIRST request", async () => {
      reset({ kind: "ok" });
      await callAI(compat("gpt-5.4-nano"), "hi");
      ok(sent.length === 1, "no wasted round trip, saw " + sent.length);
      ok(sent[0].body.max_completion_tokens === 1024 && !("max_tokens" in sent[0].body), "memoized field: " + JSON.stringify(sent[0].body));
    }],
    ["the memo is per (provider, model): another model starts over", async () => {
      reset({ kind: "ok" });
      await callAI(compat("gpt-4.1-mini"), "hi");
      ok(sent[0].body.max_tokens === 1024, "other model must not inherit the memo: " + JSON.stringify(sent[0].body));
    }],
    ["the memo is per (provider, model): another provider with the same model id starts over", async () => {
      reset({ kind: "ok" });
      await callAI({ aiProvider: "groq", groqApiKey: "k", groqModel: "gpt-5.4-nano" }, "hi");
      ok(sent[0].body.max_tokens === 1024, "other provider must not inherit the memo: " + JSON.stringify(sent[0].body));
    }],
    ["a 400 that names no healable parameter still surfaces unchanged, with no retry", async () => {
      reset({ kind: "err", status: 400, body: OPENAI_400_CONTEXT });
      let caught = null;
      try { await callAI(compat("no-heal-model"), "hi"); } catch (e) { caught = e; }
      ok(caught, "expected a rejection");
      ok(sent.length === 1, "must not retry, saw " + sent.length + " requests");
      ok(/maximum context length/.test(caught.message), "original message survives: " + caught.message);
      ok(caught.status === 400, "status preserved: " + caught.status);
    }],
    ["a too-large budget surfaces immediately and never pollutes the memo with a rename", async () => {
      // custom declares no thinkingOff, so this half isolates the rename ladder:
      // one request, one error, no self-heal of any kind.
      reset({ kind: "err", status: 400, body: OPENAI_400_BUDGET_TOO_LARGE });
      let caught = null;
      try { await callAI(compat("budget-capped"), "hi", { maxTokens: 8192 }); } catch (e) { caught = e; }
      ok(caught, "expected a rejection");
      ok(sent.length === 1, "must not retry a value error, saw " + sent.length + " requests");
      ok(/too large/.test(caught.message), "the real error surfaces at once: " + caught.message);
      ok(sent[0].body.max_tokens === 8192, "budget sent under the name we chose: " + JSON.stringify(sent[0].body));
      // openai: the declared max_completion_tokens must not be flipped -- and must
      // not be remembered as flipped, which no expiry would ever undo. (Its two
      // requests are the pre-existing thinkingOff strip-and-retry, not a rename.)
      const s = { aiProvider: "openai", openaiApiKey: "k", openaiModel: "gpt-5.4-mini" };
      reset({ kind: "err", status: 400, body: OPENAI_400_BUDGET_TOO_LARGE }, { kind: "err", status: 400, body: OPENAI_400_BUDGET_TOO_LARGE });
      caught = null;
      try { await callAI(s, "hi", { maxTokens: 8192 }); } catch (e) { caught = e; }
      ok(caught, "expected a rejection from openai too");
      for (const r of sent) ok(r.body.max_completion_tokens === 8192 && !("max_tokens" in r.body), "no rename: " + JSON.stringify(r.body));
      reset({ kind: "ok" });
      await callAI(s, "hi");
      ok(sent.length === 1 && sent[0].body.max_completion_tokens === 1024 && !("max_tokens" in sent[0].body),
        "the declared field must survive: " + JSON.stringify(sent));
    }],
    ["a temperature refusal drops the field and is memoized", async () => {
      reset({ kind: "err", status: 400, body: OPENAI_400_TEMPERATURE }, { kind: "ok" });
      await callAI(compat("temp-picky"), "hi");
      ok(sent.length === 2, "one retry, saw " + sent.length);
      ok(sent[0].body.temperature === 0.3, "first request carried temperature");
      ok(!("temperature" in sent[1].body), "retry must omit temperature: " + JSON.stringify(sent[1].body));
      reset({ kind: "ok" });
      await callAI(compat("temp-picky"), "hi");
      ok(sent.length === 1 && !("temperature" in sent[0].body), "memoized: " + JSON.stringify(sent));
    }],
    ["openai sends max_completion_tokens on the very first request (declared dialect, zero retries)", async () => {
      reset({ kind: "ok" });
      await callAI({ aiProvider: "openai", openaiApiKey: "k", openaiModel: "gpt-5.4-nano" }, "hi");
      ok(sent.length === 1, "no retry needed, saw " + sent.length);
      ok(sent[0].body.max_completion_tokens === 1024 && !("max_tokens" in sent[0].body), "body: " + JSON.stringify(sent[0].body));
    }],
    ["the streaming path heals the same way (not a non-stream-only fix)", async () => {
      reset({ kind: "err", status: 400, body: OPENAI_400_MAX_TOKENS }, { kind: "stream" });
      const out = await callAIStream(compat("stream-model"), "hi", {}, () => {});
      ok(out === "ok", "stream must succeed after the repair, got " + JSON.stringify(out));
      ok(sent.length === 2, "one retry, saw " + sent.length);
      ok(sent[0].body.max_tokens === 1024 && sent[0].body.stream === true, "first stream request: " + JSON.stringify(sent[0].body));
      ok(sent[1].body.max_completion_tokens === 1024 && !("max_tokens" in sent[1].body), "retry: " + JSON.stringify(sent[1].body));
    }],
    ["Anthropic's max_tokens is a required Messages-API field and is never renamed", async () => {
      reset({ kind: "ok" }, { kind: "stream" });
      await callAI({ aiProvider: "claude", claudeApiKey: "k", claudeModel: "claude-haiku-4-5" }, "hi");
      await callAIStream({ aiProvider: "claude", claudeApiKey: "k", claudeModel: "claude-haiku-4-5" }, "hi", {}, () => {});
      ok(sent.length === 2, "two requests, saw " + sent.length);
      for (const r of sent) {
        ok(r.body.max_tokens === 1024, "claude keeps max_tokens: " + JSON.stringify(r.body));
        ok(!("max_completion_tokens" in r.body), "claude must never get the OpenAI spelling: " + JSON.stringify(r.body));
      }
    }],
    ["K134: claude streaming request omits temperature entirely (Claude 4.7+ 400s on a non-default value)", async () => {
      reset({ kind: "stream" });
      const out = await callAIStream({ aiProvider: "claude", claudeApiKey: "k", claudeModel: "claude-haiku-4-5" }, "hi", {}, () => {});
      ok(out === "ok", "stream must still succeed: " + JSON.stringify(out));
      ok(sent.length === 1, "no retry expected, saw " + sent.length);
      ok(!("temperature" in sent[0].body), "claude stream must never send temperature: " + JSON.stringify(sent[0].body));
    }],
    ["K134: an explicit opts.temperature from a caller is still ignored on the claude stream path", async () => {
      reset({ kind: "stream" });
      await callAIStream({ aiProvider: "claude", claudeApiKey: "k", claudeModel: "claude-haiku-4-5" }, "hi", { temperature: 0.1 }, () => {});
      ok(sent.length === 1, "no retry expected, saw " + sent.length);
      ok(!("temperature" in sent[0].body), "explicit opts.temperature must not leak into the claude stream body: " + JSON.stringify(sent[0].body));
    }]
  ];

  // One queue turn for the whole block (see the header note). The loop itself
  // cannot throw, so the wrapper never needs to report a row of its own.
  await atestNetSerial("K133 self-heal block", async () => {
    install();
    try {
      for (const [name, fn] of cases) {
        try { await fn(); report(name); } catch (e) { report(name, e); }
      }
    } finally { restore(); }
  }, () => {});
})();
</script>
<script>
// ============ K84: Ask panel open/close preserves the reading position (md-ask.js) ============
// Drives the REAL _pbpAskSetOpen. The panel build is short-circuited by pre-seeding
// _pbpAskState.panel with a bare stub (no #ask-meta and no #ask-input in the document,
// so the meta refresh and the focus handoff are both no-ops here), and md-reader.js's
// two halves are swapped for recorders: what is under test is md-ask.js's WIRING of
// them (capture before the class toggle, settle after, one-shot transitionend leg,
// scroll-abandon), not their own math -- pbpReaderPickScrollAnchor has its own suite.
suiteIf("_pbpAskSetOpen scroll preservation (K84)", "_pbpAskSetOpen", () => {
  function setup(opts) {
    const o = opts || {};
    const saved = {
      state: _pbpAskState,
      capture: window._pbpZenCaptureAnchor,
      settle: window._pbpZenSettleAnchor,
      mm: window.matchMedia
    };
    const panel = document.createElement("aside");
    panel.hidden = true;
    document.body.appendChild(panel);
    const main = document.createElement("main");
    document.body.insertBefore(main, document.body.firstChild);
    const pad = document.createElement("div");
    pad.style.height = (window.innerHeight * 4) + "px";
    document.body.appendChild(pad);
    const anchor = o.anchor === undefined ? { n: 3, frac: 0.25 } : o.anchor;
    // openAtCapture pins the ORDER: the anchor must be read while the class is
    // still in its pre-toggle state, otherwise it describes the new layout.
    const rec = { captures: 0, openAtCapture: [], settles: [] };
    _pbpAskState = { panel: panel, rounds: [], records: [], ctx: null, running: false, ctrl: null };
    if (!o.realCapture) {
      window._pbpZenCaptureAnchor = function () {
        rec.captures++;
        rec.openAtCapture.push(document.body.classList.contains("ask-open"));
        return anchor;
      };
    }
    window._pbpZenSettleAnchor = function (a) { rec.settles.push(a); };
    window.matchMedia = function (q) {
      return {
        matches: !!o.narrow && /max-width/.test(q), media: q,
        addListener() {}, removeListener() {}, addEventListener() {}, removeEventListener() {}
      };
    };
    window.scrollTo(0, 0);
    return {
      rec: rec, main: main, anchor: anchor,
      end: function (prop) {
        main.dispatchEvent(new TransitionEvent("transitionend", {
          propertyName: prop || "margin-right", bubbles: true
        }));
      },
      done: function () {
        _pbpAskSettleClear();
        document.body.classList.remove("ask-open");
        document.body.classList.remove("raw-active");
        panel.remove();
        main.remove();
        pad.remove();
        _pbpAskState = saved.state;
        window._pbpZenCaptureAnchor = saved.capture;
        window._pbpZenSettleAnchor = saved.settle;
        window.matchMedia = saved.mm;
        window.scrollTo(0, 0);
      }
    };
  }

  test("opening Ask on a wide viewport settles immediately, then once more when the push ends", () => {
    const f = setup();
    try {
      _pbpAskSetOpen(true);
      assertEq(f.rec.captures, 1, "the anchor is captured exactly once per toggle");
      assertEq(f.rec.openAtCapture[0], false, "capture ran BEFORE body.ask-open was added");
      assertEq(f.rec.settles.length, 1, "leg 1: immediate settle (the only leg reduced motion ever gets)");
      f.end();
      assertEq(f.rec.settles.length, 2, "leg 2: the margin-right transition finishing re-settles the same anchor");
      assertEq(f.rec.settles[1], f.anchor, "leg 2 replays the anchor captured before the toggle");
      f.end();
      assertEq(f.rec.settles.length, 2, "one-shot: a second transitionend does not settle again");
      assertEq(_pbpAskSettleOff, null, "the listener tore itself down when it fired");
    } finally { f.done(); }
  });

  test("closing Ask runs the same two legs (the close direction is not an if(open) branch)", () => {
    const f = setup();
    try {
      _pbpAskSetOpen(true);
      f.end();
      f.rec.captures = 0;
      f.rec.openAtCapture.length = 0;
      f.rec.settles.length = 0;
      _pbpAskSetOpen(false);
      assertEq(f.rec.captures, 1, "closing captures an anchor too");
      assertEq(f.rec.openAtCapture[0], true, "capture ran BEFORE body.ask-open was removed");
      assertEq(f.rec.settles.length, 1, "leg 1 on close");
      f.end();
      assertEq(f.rec.settles.length, 2, "leg 2 on close");
    } finally { f.done(); }
  });

  test("a scroll during the 200ms push abandons the second settle", () => {
    const f = setup();
    try {
      _pbpAskSetOpen(true);
      assertEq(f.rec.settles.length, 1, "leg 1 ran");
      window.scrollTo(0, 500);
      assert(window.scrollY > 2, "fixture is actually scrollable, got scrollY " + window.scrollY);
      f.end();
      assertEq(f.rec.settles.length, 1,
        "the reader moved themselves inside the transition window: no yank back (md-reader.js:1609-1614's regression)");
      assertEq(_pbpAskSettleOff, null, "the listener is still torn down on the abandoned path");
    } finally { f.done(); }
  });

  test("narrow viewports short-circuit: no capture, no listener (the panel is a bottom sheet there)", () => {
    const f = setup({ narrow: true });
    try {
      _pbpAskSetOpen(true);
      assertEq(f.rec.captures, 0, "max-width:1000px means margin-right stays 0: nothing to preserve");
      assertEq(f.rec.settles.length, 0, "no settle");
      assertEq(_pbpAskSettleOff, null, "no transitionend listener armed");
      f.end();
      assertEq(f.rec.settles.length, 0, "a stray transitionend cannot settle either");
    } finally { f.done(); }
  });

  test("at scrollY 0 the real capture returns null, so no leg runs", () => {
    const f = setup({ realCapture: true });
    try {
      window.scrollTo(0, 0);
      _pbpAskSetOpen(true);
      assertEq(f.rec.settles.length, 0, "a layout change at the very top must leave the reader at the top");
      assertEq(_pbpAskSettleOff, null, "no listener armed for a null anchor");
      f.end();
      assertEq(f.rec.settles.length, 0, "still nothing after a transitionend");
    } finally { f.done(); }
  });

  test("raw view returns no anchor even when scrolled (#rendered-view is display:none there)", () => {
    const f = setup({ realCapture: true });
    try {
      document.body.classList.add("raw-active");
      window.scrollTo(0, 300);
      assert(window.scrollY > 0, "fixture is actually scrolled, got scrollY " + window.scrollY);
      _pbpAskSetOpen(true);
      assertEq(f.rec.settles.length, 0, "raw view has no block rects to anchor to");
      assertEq(_pbpAskSettleOff, null, "no listener armed for a null anchor");
    } finally { f.done(); }
  });

  // The reason _pbpAskCaptureAnchor opens with _pbpAskSettleClear(): a second
  // toggle inside the 200ms push must REPLACE the armed leg, not stack a
  // second transitionend listener on the same <main>. Both would then fire on
  // the one push that actually ends, and the first one's anchor describes a
  // layout two toggles old. Deleting that call leaves every other row here
  // green, so this is the one that makes it falsifiable.
  test("a second toggle before the push ends replaces the armed leg instead of stacking one", () => {
    const f = setup();
    try {
      _pbpAskSetOpen(true);
      const firstOff = _pbpAskSettleOff;
      assert(typeof firstOff === "function", "setup: the open armed a transitionend leg");
      assertEq(f.rec.settles.length, 1, "leg 1 of the open");
      _pbpAskSetOpen(false);                 // no f.end() in between: the push is still animating
      assertEq(f.rec.captures, 2, "the close captured its own anchor");
      assertEq(f.rec.settles.length, 2, "leg 1 of the close");
      assert(_pbpAskSettleOff !== firstOff && typeof _pbpAskSettleOff === "function",
        "the close armed a NEW leg (and the open's was torn down, not merely overwritten)");
      f.end();
      assertEq(f.rec.settles.length, 3,
        "exactly ONE leg 2 fires: a stacked listener from the abandoned open would settle a stale anchor too");
      assertEq(_pbpAskSettleOff, null, "and the surviving leg tore itself down");
      f.end();
      assertEq(f.rec.settles.length, 3, "still one-shot after the replacement");
    } finally { f.done(); }
  });

  test("a transitionend for another property is ignored and does not disarm the leg", () => {
    const f = setup();
    try {
      _pbpAskSetOpen(true);
      f.end("opacity");
      assertEq(f.rec.settles.length, 1, "opacity is not the push: no settle");
      f.end("margin-right");
      assertEq(f.rec.settles.length, 2, "and the real property still settles afterwards");
    } finally { f.done(); }
  });
});
</script>

<script>
// ============ K85: the scroll-spy keeps the active TOC entry inside the rail ============
// Geometry fixture, not a mock: a real #rail (the id keepTocEntryVisible resolves)
// with a 100px viewport over 40 x 20px TOC links -- 5 entries visible, 700px of
// overflow -- parked off-screen so the live pointer can never hover it and the
// ":hover" guard can never fire by accident. Every case drives the REAL
// keepTocEntryVisible / setupScrollSpy; what is under test is the "nearest" math
// and the four guards, so scrollTop is instrumented with a COUNTING accessor:
// "the rail did not move" is asserted as ZERO WRITES, not as an unchanged value
// (a `+= 0` or a clamped write would sail straight through the latter).
(async function () {
  const host = document.createElement("div");
  host.className = "suite";
  const h = document.createElement("h2");
  h.textContent = "keepTocEntryVisible: the active TOC entry stays inside the rail (K85)";
  host.appendChild(h);
  document.getElementById("results").appendChild(host);
  function report(name, err) {
    const div = document.createElement("div");
    if (!err) { PASS++; div.className = "case pass"; div.textContent = "PASS " + name; }
    else { FAIL++; div.className = "case fail"; div.textContent = "FAIL " + name + "\n  " + err.message; }
    host.appendChild(div);
  }
  function ktest(name, fn) { try { fn(); report(name); } catch (e) { report(name, e); } }
  async function katest(name, fn) { try { await fn(); report(name); } catch (e) { report(name, e); } }
  const nextFrame = () => new Promise((r) => requestAnimationFrame(() => r()));

  const N = 40, ENTRY = 20, RAIL_H = 100;
  // Kept off the element so the counting accessor below can delegate to the real
  // implementation instead of shadowing it with a plain data property.
  const SCROLL_DESC = Object.getOwnPropertyDescriptor(Element.prototype, "scrollTop");

  function setup(opts) {
    const o = opts || {};
    // Nothing else on the page may answer to the three ids the function resolves
    // by id: earlier suites build their own #tr-progress and #ask-open fixtures,
    // and one left behind would silently switch cases here onto the translation
    // guard's path or shadow this fixture's own rail button.
    const staleRail = document.getElementById("rail");
    if (staleRail) staleRail.id = "k85-parked-rail";
    const staleProg = document.getElementById("tr-progress");
    if (staleProg) staleProg.id = "k85-parked-prog";
    const staleAsk = document.getElementById("ask-open");
    if (staleAsk) staleAsk.id = "k85-parked-ask";
    // Focus is page-global state shared with async cases that are mid-flight on
    // their own awaits (the Explain focus-restore block asserts activeElement
    // AFTER a task boundary): this suite borrows it and must hand back exactly
    // what it took, not merely blur.
    const prevFocus = document.activeElement;

    const rail = document.createElement("div");
    rail.id = "rail";
    rail.style.cssText = "position:fixed; left:-9999px; top:0; width:200px; height:" +
      RAIL_H + "px; overflow-y:auto; margin:0; padding:0; border:0;";
    const list = document.createElement("ul");
    // The focus guard defers only to focus INSIDE #toc, so the fixture's entry
    // list has to carry that id (production: the #toc <nav> wrapping #toc-list,
    // md-preview.html:122-124 -- one level of nesting this flat fixture folds
    // away, since `contains` is what the guard reads either way).
    list.id = "toc";
    list.style.cssText = "list-style:none; margin:0; padding:0;";
    const links = [];
    for (let i = 0; i < N; i++) {
      const li = document.createElement("li");
      li.style.cssText = "margin:0; padding:0;";
      const a = document.createElement("a");
      a.dataset.slug = "k85-" + i;
      a.textContent = "heading " + i;
      a.tabIndex = 0;   // the production links carry href; focusability is what the guard reads
      a.style.cssText = "display:block; box-sizing:border-box; height:" + ENTRY +
        "px; line-height:" + ENTRY + "px; margin:0; padding:0; font-size:12px;";
      li.appendChild(a);
      list.appendChild(li);
      links.push(a);
    }
    rail.appendChild(list);
    // Optional filler BELOW the list (so no link's offset moves): production's
    // rail keeps its other sections when #toc collapses, so the container stays
    // scrollable. Without it, hiding the list zeroes scrollHeight and the ENGINE
    // clamps scrollTop to 0 on its own -- which would look exactly like the bug
    // this suite is guarding against and prove nothing either way.
    if (o.tail) {
      const sp = document.createElement("div");
      sp.style.cssText = "height:900px; margin:0; padding:0;";
      rail.appendChild(sp);
    }
    // Optional rail button OUTSIDE #toc, also appended BELOW the list so no
    // link's offset moves: production's #ask-open / #rail-settings-btn /
    // #rail-kbd-help-btn all sit in the rail but outside the TOC, and all three
    // end up holding focus after their own action finishes.
    let railBtn = null;
    if (o.railBtn) {
      railBtn = document.createElement("button");
      railBtn.type = "button";
      railBtn.id = "ask-open";
      railBtn.textContent = "Ask";
      railBtn.style.cssText = "display:block; height:20px; margin:0; padding:0;";
      rail.appendChild(railBtn);
    }
    document.body.appendChild(rail);

    let writes = 0;
    Object.defineProperty(rail, "scrollTop", {
      configurable: true,
      get() { return SCROLL_DESC.get.call(this); },
      set(v) { writes++; SCROLL_DESC.set.call(this, v); }
    });

    const undo = [];
    // Stubbed in EVERY case, not just the narrow one: the runner's window width is
    // not ours to assume, and a <=1000px window would otherwise park the drawer
    // guard on and turn the whole suite green for the wrong reason.
    const savedMM = window.matchMedia;
    window.matchMedia = function (q) {
      return {
        matches: !!o.narrow && /max-width/.test(q), media: q,
        addListener() {}, removeListener() {}, addEventListener() {}, removeEventListener() {}
      };
    };
    undo.push(() => { window.matchMedia = savedMM; });
    if (o.zen) {
      document.body.classList.add("zen");
      undo.push(() => document.body.classList.remove("zen"));
    }
    if (o.progress) {
      const p = document.createElement("div");
      p.id = "tr-progress";
      p.textContent = "translating 12/40";
      document.body.appendChild(p);
      undo.push(() => p.remove());
    }
    return {
      rail: rail, list: list, links: links, railBtn: railBtn,
      seed(v) { SCROLL_DESC.set.call(rail, v); },   // bypasses the counter: fixture setup is not a write under test
      raw() { return SCROLL_DESC.get.call(rail); },
      writes() { return writes; },
      activeIndex() { return links.findIndex((a) => a.classList.contains("active")); },
      done() {
        while (undo.length) undo.pop()();
        delete rail.scrollTop;
        rail.remove();
        if (staleRail) staleRail.id = "rail";
        if (staleProg) staleProg.id = "tr-progress";
        if (staleAsk) staleAsk.id = "ask-open";
        try {
          if (prevFocus && prevFocus.isConnected && typeof prevFocus.focus === "function") {
            prevFocus.focus({ preventScroll: true });
          }
        } catch (_) {}
      }
    };
  }

  if (typeof window.keepTocEntryVisible !== "function") {
    report("keepTocEntryVisible is defined in md-preview.js",
      new Error("md-preview.js exposes no keepTocEntryVisible -- the scroll-spy still only paints .active"));
  } else {
    report("keepTocEntryVisible is defined in md-preview.js");
  }

  ktest("an entry below the rail viewport comes back by EXACTLY its overflow (bottom-aligned, not centred, not topped)", () => {
    const f = setup();
    try {
      f.seed(0);
      keepTocEntryVisible(f.links[10]);           // content box 200..220, rail viewport 0..100
      assertEq(f.writes(), 1, "one write");
      assertEq(f.raw(), 120, "minimal displacement: 220 - 100");
      const r = f.rail.getBoundingClientRect(), e = f.links[10].getBoundingClientRect();
      assertEq(Math.round(e.bottom - r.bottom), 0, "the entry's bottom now sits on the rail's bottom edge");
      assert(e.top >= r.top, "and it did not overshoot past the top");
    } finally { f.done(); }
  });

  ktest("an entry above the rail viewport comes back by EXACTLY its overflow (top-aligned)", () => {
    const f = setup();
    try {
      f.seed(400);
      keepTocEntryVisible(f.links[2]);            // content box 40..60, viewport 400..500
      assertEq(f.writes(), 1, "one write");
      assertEq(f.raw(), 40, "minimal displacement: 400 - 360");
      const r = f.rail.getBoundingClientRect(), e = f.links[2].getBoundingClientRect();
      assertEq(Math.round(e.top - r.top), 0, "the entry's top now sits on the rail's top edge");
    } finally { f.done(); }
  });

  ktest("an entry already inside the rail viewport is left alone (no write at all)", () => {
    const f = setup();
    try {
      f.seed(200);
      keepTocEntryVisible(f.links[12]);           // content box 240..260, viewport 200..300
      assertEq(f.writes(), 0, "nothing to correct, so nothing is written");
      assertEq(f.raw(), 200, "and the reader's own rail position is untouched");
    } finally { f.done(); }
  });

  ktest("a collapsed/hidden TOC never yanks the rail to the top (offsetParent guard)", () => {
    const f = setup({ tail: true });
    try {
      // The rail is moved OFF the viewport's top edge for this one case, and that
      // is the whole point of it. A display:none element's rect is a degenerate
      // (0,0,0,0); against production's `top: 0` rail (md-preview.css:1052-1053,
      // `position:fixed; top:0; bottom:0`) that rect satisfies NEITHER branch --
      // 0 < 0 is false and 0 > bottom is false -- so the case passed with the
      // guard deleted and tested nothing. With the rail's top at 40 the same
      // degenerate rect reads as ABOVE the viewport, the `e.top < r.top` branch
      // arms, and removing `!a.offsetParent` really does write scrollTop to 0.
      f.rail.style.top = "40px";
      f.seed(300);
      f.list.style.display = "none";              // what .rail-collapsed > *:not(.rail-sec-head) does
      assertEq(f.links[30].offsetParent, null, "the fixture really is in the collapsed shape");
      const r = f.rail.getBoundingClientRect(), e = f.links[30].getBoundingClientRect();
      assert(e.top < r.top,
        "the fixture must put the degenerate rect OUT of view or this case cannot fail: entry top " +
        e.top + " vs rail top " + r.top);
      keepTocEntryVisible(f.links[30]);
      assertEq(f.writes(), 0, "a 0/0/0/0 rect must not be read as 'out of view' and scroll the rail to 0");
      assertEq(f.raw(), 300, "rail position preserved");
    } finally { f.done(); }
  });

  ktest("zen hides the rail with transform + visibility, so nothing is written there", () => {
    const f = setup({ zen: true });
    try {
      f.seed(300);
      assert(f.links[30].offsetParent !== null, "zen is NOT display:none -- offsetParent alone cannot catch it");
      keepTocEntryVisible(f.links[30]);
      assertEq(f.writes(), 0, "an off-canvas rail must not accumulate scroll offsets");
      assertEq(f.raw(), 300, "rail position preserved");
    } finally { f.done(); }
  });

  ktest("the narrow-viewport drawer is off-canvas too, so nothing is written there", () => {
    const f = setup({ narrow: true });
    try {
      f.seed(300);
      assert(f.links[30].offsetParent !== null, "the drawer is transform + visibility, not display:none");
      keepTocEntryVisible(f.links[30]);
      assertEq(f.writes(), 0, "at <=1000px the rail is a drawer: leave its scroll position alone");
      assertEq(f.raw(), 300, "rail position preserved");
    } finally { f.done(); }
  });

  ktest("a running translation parks its progress line in the rail: not one scroll write while it is up", () => {
    const f = setup({ progress: true });
    try {
      f.seed(300);
      keepTocEntryVisible(f.links[30]);
      assertEq(f.writes(), 0, "#tr-progress must never be scrolled out from under the reader mid-run");
      assertEq(f.raw(), 300, "rail position preserved");
    } finally { f.done(); }
  });

  // setup() borrows page-global focus and done() hands it back, because async
  // cases elsewhere on this page assert activeElement AFTER a task boundary (the
  // Explain focus-restore block) -- a miss here fails one of those instead, with
  // nothing pointing back at this suite. The restore was previously made and
  // never checked; every OTHER case starts from <body>, where removing the rail
  // already returns focus to <body> on its own, so only a case that borrows from
  // a REAL element can tell a working handback from no handback at all.
  ktest("the teardown hands focus back to whoever actually held it, not just to <body>", () => {
    const sentinel = document.createElement("button");
    sentinel.type = "button";
    sentinel.textContent = "k85 focus sentinel";
    sentinel.style.cssText = "position:fixed; left:-9999px; top:0; width:80px; height:20px;";
    document.body.appendChild(sentinel);
    try {
      sentinel.focus({ preventScroll: true });
      assert(document.activeElement === sentinel, "setup: the sentinel did not take focus");
      const f = setup();
      try {
        f.seed(300);
        f.links[1].focus({ preventScroll: true });
        assert(document.activeElement !== sentinel, "setup: the case really did take focus off the sentinel");
        keepTocEntryVisible(f.links[30]);
      } finally { f.done(); }
      assertEq(document.activeElement, sentinel,
        "teardown left focus on " +
        (document.activeElement && (document.activeElement.id || document.activeElement.tagName)));
    } finally { sentinel.remove(); }
  });

  ktest("keyboard focus on a TOC entry hands the scroll position back to the reader", () => {
    const f = setup();
    try {
      f.seed(300);
      f.links[1].focus({ preventScroll: true });
      assert(document.getElementById("toc").contains(document.activeElement),
        "the fixture really did take focus into the TOC");
      keepTocEntryVisible(f.links[30]);
      assertEq(f.writes(), 0, "whoever is tabbing through the TOC owns the rail's scroll position");
      assertEq(f.raw(), 300, "rail position preserved");
    } finally { f.done(); }
  });

  // The other half of that guard: focus PARKED on a rail control after its own
  // action finished is not TOC ownership. #ask-open takes focus back on every
  // Ask close, the gear keeps it while options.html opens in another tab -- a
  // rail-wide `contains` turned scroll-following off for the rest of the
  // session the first time either happened.
  ktest("focus parked on a rail button OUTSIDE the TOC does not switch scroll-following off", () => {
    const f = setup({ railBtn: true });
    try {
      f.seed(0);
      f.railBtn.focus({ preventScroll: true });
      assert(document.activeElement === f.railBtn, "the fixture really did park focus on the rail button");
      assert(f.rail.contains(document.activeElement), "and that button really is inside the rail");
      assert(!document.getElementById("toc").contains(document.activeElement),
        "but outside the TOC -- which is the whole distinction under test");
      keepTocEntryVisible(f.links[10]);           // content box 200..220, rail viewport 0..100
      assertEq(f.writes(), 1, "the active entry is still brought back into view");
      assertEq(f.raw(), 120, "minimal displacement: 220 - 100");
    } finally { f.done(); }
  });

  await katest("through the real scroll-spy: the first activation moves the rail, a repeat of the SAME slug writes nothing", async () => {
    const f = setup();
    const view = document.createElement("div");
    let dispose = null;
    try {
      // top:-300px parks headings 0..32 above runFallback's 28px line (10px each),
      // so the bottom-up scan lands deterministically on #k85-32 -- entry 32 of 40,
      // far below a 5-entry rail viewport, i.e. a guaranteed first correction.
      view.style.cssText = "position:fixed; left:-9999px; top:-300px; width:300px; margin:0; padding:0;";
      for (let i = 0; i < N; i++) {
        const hd = document.createElement("h2");
        hd.id = "k85-" + i;
        hd.textContent = "heading " + i;
        hd.style.cssText = "height:10px; line-height:10px; margin:0; padding:0; font-size:8px;";
        view.appendChild(hd);
      }
      document.body.appendChild(view);
      f.seed(0);
      dispose = setupScrollSpy(view, f.list);
      window.dispatchEvent(new Event("scroll"));
      await nextFrame(); await nextFrame();
      assertEq(f.activeIndex(), 32, "the scroll fallback activated the entry this fixture is built around");
      assertEq(f.writes(), 1, "the activation brought the entry back into the rail exactly once");
      assertEq(f.raw(), 560, "bottom-aligned: 660 - 100");
      window.dispatchEvent(new Event("scroll"));
      await nextFrame(); await nextFrame();
      assertEq(f.writes(), 1, "same slug: setActive early-returns, so no second forced layout and no drift");
      assertEq(f.raw(), 560, "rail position unchanged on the repeat");
    } finally {
      if (dispose) dispose();
      view.remove();
      f.done();
    }
  });
})();
</script>
</body></html>
